h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Timothy<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1TI/">About <!-- -->1 Timothy</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Duties of servants. The danger of covetousness. Lessons for the rich.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Whosoever are servants under the yoke, let them count their masters worthy of all honour; lest the name of the Lord and his doctrine be blasphemed.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But they that have believing masters, let them not despise them, because they are brethren; but serve them the rather, because they are faithful and beloved, who are partakers of the benefit. These things teach and exhort.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>If any man teach otherwise and consent not to the sound words of our Lord Jesus Christ and to that doctrine which is according to godliness,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He is proud, knowing nothing, but sick about questions and strifes of words; from which arise envies, contentions, blasphemies, evil suspicions,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Conflicts of men corrupted in mind and who are destitute of the truth, supposing gain to be godliness.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But godliness with contentment is great gain.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For we brought nothing into this world: and certainly we can carry nothing out.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But having food and wherewith to be covered, with these we are content.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For they that will become rich fall into temptation and into the snare of the devil and into many unprofitable and hurtful desires, which drown men into destruction and perdition.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For the desire of money is the root of all evils; which some coveting have erred from the faith and have entangled themselves in many sorrows.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But thou, O man of God, fly these things: and pursue justice, godliness, faith, charity, patience, mildness.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fight the good fight of faith. Lay hold on eternal life, whereunto thou art called and hast confessed a good confession before many witnesses.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I charge thee before God who quickeneth all things, and before Christ Jesus who gave testimony under Pontius Pilate, a good confession:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>That thou keep the commandment without spot, blameless, unto the coming of our Lord Jesus Christ,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Which in his times he shall shew, who is the Blessed and only Mighty, the King of kings and Lord of lords:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Who only hath immortality and inhabiteth light inaccessible: whom no man hath seen, nor can see: to whom be honour and empire everlasting. Amen.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Charge the rich of this world not to be highminded nor to trust in the uncertainty of riches, but in the living God (who giveth us abundantly all things to enjoy)</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>To do good, to be rich in good works, to give easily, to communicate to others,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To lay up in store for themselves a good foundation against the time to come, that they may lay hold on the true life.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>O Timothy, keep that which is committed to thy trust, avoiding the profane novelties of words and oppositions of knowledge falsely so called.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Which some promising, have erred concerning the faith. Grace be with thee. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quicumque sunt sub jugo servi, dominos suos omni honore dignos arbitrentur, ne nomen Domini et doctrina blasphemetur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui autem fideles habent dominos, non contemnant, quia fratres sunt : sed magis serviant, quia fideles sunt et dilecti, qui beneficii participes sunt. Hæc doce, et exhortare.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Si quis aliter docet, et non acquiescit sanis sermonibus Domini nostri Jesu Christi, et ei, quæ secundum pietatem est, doctrinæ :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>superbus est, nihil sciens, sed languens circa quæstiones, et pugnas verborum : ex quibus oriuntur invidiæ, contentiones, blasphemiæ, suspiciones malæ,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>conflictationes hominum mente corruptorum, et qui veritate privati sunt, existimantium quæstum esse pietatem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Est autem quæstus magnus pietas cum sufficientia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nihil enim intulimus in hunc mundum : haud dubium quod nec auferre quid possumus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Habentes autem alimenta, et quibus tegamur, his contenti simus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nam qui volunt divites fieri, incidunt in tentationem, et in laqueum diaboli, et desideria multa inutilia, et nociva, quæ mergunt homines in interitum et perditionem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Radix enim omnium malorum est cupiditas : quam quidam appetentes erraverunt a fide, et inseruerunt se doloribus multis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Tu autem, o homo Dei, hæc fuge : sectare vero justitiam, pietatem, fidem, caritatem, patientiam, mansuetudinem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Certa bonum certamen fidei, apprehende vitam æternam, in qua vocatus es, et confessus bonam confessionem coram multis testibus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Præcipio tibi coram Deo, qui vivificat omnia, et Christo Jesu, qui testimonium reddidit sub Pontio Pilato, bonam confessionem,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ut serves mandatum sine macula, irreprehensibile usque in adventum Domini nostri Jesu Christi,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>quem suis temporibus ostendet beatus et solus potens, Rex regum, et Dominus dominantium :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>qui solus habet immortalitatem, et lucem inhabitat inaccessibilem : quem nullus hominum vidit, sed nec videre potest : cui honor, et imperium sempiternum. Amen.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Divitibus hujus sæculi præcipe non sublime sapere, neque sperare in incerto divitiarum, sed in Deo vivo (qui præstat nobis omnia abunde ad fruendum)</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>bene agere, divites fieri in bonis operibus, facile tribuere, communicare,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>thesaurizare sibi fundamentum bonum in futurum, ut apprehendant veram vitam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>O Timothee, depositum custodi, devitans profanas vocum novitates, et oppositiones falsi nominis scientiæ,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quam quidam promittentes, circa fidem exciderunt. Gratia tecum. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1TI/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Timothy 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2TI/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif tex rise envies, contentions, blasphemies, evil suspicions,\"},{\"verse\":5,\"text\":\"Conflicts of men corrupted in mind and who are destitute of the truth, supposing gain to be godliness.\"},{\"verse\":6,\"text\":\"But godliness with contentment is great gain.\"},{\"verse\":7,\"text\":\"For we brought nothing into this world: and certainly we can carry nothing out.\"},{\"verse\":8,\"text\":\"But having food and wherewith to be covered, with these we are content.\"},{\"verse\":9,\"text\":\"For they that will become rich fall into temptation and into the snare of the devil and into many unprofitable and hurtful desires, which drown men into destruction and perdition.\"},{\"verse\":10,\"text\":\"For the desire of money is the root of all evils; which some coveting have erred from the faith and have entangled themselves in many sorrows.\"},{\"verse\":11,\"text\":\"But thou, O man of God, fly these things: and pursue justice, godliness, faith, charity, patience, mildness.\"},{\"verse\":12,\"text\":\"Fight the good fight of faith. Lay hold on eternal life, whereunto thou art called and hast confessed a good confession before many witnesses.\"},{\"verse\":13,\"text\":\"I charge thee before God who quickeneth all things, and before Christ Jesus who gave testimony under Pontius Pilate, a good confession:\"},{\"verse\":14,\"text\":\"That thou keep the commandment without spot, blameless, unto the coming of our Lord Jesus Christ,\"},{\"verse\":15,\"text\":\"Which in his times he shall shew, who is the Blessed and only Mighty, the King of kings and Lord of lords:\"},{\"verse\":16,\"text\":\"Who only hath immortality and inhabiteth light inaccessible: whom no man hath seen, nor can see: to whom be honour and empire everlasting. Amen.\"},{\"verse\":17,\"text\":\"Charge the rich of this world not to be highminded nor to trust in the uncertainty of riches, but in the living God (who giveth us abundantly all things to enjoy)\"},{\"verse\":18,\"text\":\"To do good, to be rich in good works, to give easily, to communicate to others,\"},{\"verse\":19,\"text\":\"To lay up in store for themselves a good foundation against the time to come, that they may lay hold on the true life.\"},{\"verse\":20,\"text\":\"O Timothy, keep that which is committed to thy trust, avoiding the profane novelties of words and oppositions of knowledge falsely so called.\"},{\"verse\":21,\"text\":\"Which some promising, have erred concerning the faith. Grace be with thee. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quicumque sunt sub jugo servi, dominos suos omni honore dignos arbitrentur, ne nomen Domini et doctrina blasphemetur.\"},{\"verse\":2,\"text\":\"Qui autem fideles habent dominos, non contemnant, quia fratres sunt : sed magis serviant, quia fideles sunt et dilecti, qui beneficii participes sunt. Hæc doce, et exhortare.\"},{\"verse\":3,\"text\":\"Si quis aliter docet, et non acquiescit sanis sermonibus Domini nostri Jesu Christi, et ei, quæ secundum pietatem est, doctrinæ :\"},{\"verse\":4,\"text\":\"superbus est, nihil sciens, sed languens circa quæstiones, et pugnas verborum : ex quibus oriuntur invidiæ, contentiones, blasphemiæ, suspiciones malæ,\"},{\"verse\":5,\"text\":\"conflictationes hominum mente corruptorum, et qui veritate privati sunt, existimantium quæstum esse pietatem.\"},{\"verse\":6,\"text\":\"Est autem quæstus magnus pietas cum sufficientia.\"},{\"verse\":7,\"text\":\"Nihil enim intulimus in hunc mundum : haud dubium quod nec auferre quid possumus.\"},{\"verse\":8,\"text\":\"Habentes autem alimenta, et quibus tegamur, his contenti simus.\"},{\"verse\":9,\"text\":\"Nam qui volunt divites fieri, incidunt in tentationem, et in laqueum diaboli, et desideria multa inutilia, et nociva, quæ mergunt homines in interitum et perditionem.\"},{\"verse\":10,\"text\":\"Radix enim omnium malorum est cupiditas : quam quidam appetentes erraverunt a fide, et inseruerunt se doloribus multis.\"},{\"verse\":11,\"text\":\"Tu autem, o homo Dei, hæc fuge : sectare vero justitiam, pietatem, fidem, caritatem, patientiam, mansuetudinem.\"},{\"verse\":12,\"text\":\"Certa bonum certamen fidei, apprehende vitam æternam, in qua vocatus es, et confessus bonam confessionem coram multis testibus.\"},{\"verse\":13,\"text\":\"Præcipio tibi coram Deo, qui vivificat omnia, et Christo Jesu, qui testimonium reddidit sub Pontio Pilato, bonam confessionem,\"},{\"verse\":14,\"text\":\"ut serves mandatum sine macula, irreprehensibile usque in adventum Domini nostri Jesu Christi,\"},{\"verse\":15,\"text\":\"quem suis temporibus ostendet beatus et solus potens, Rex regum, et Dominus dominantium :\"},{\"verse\":16,\"text\":\"qui solus habet immortalitatem, et lucem inhabitat inaccessibilem : quem nullus hominum vidit, sed nec videre potest : cui honor, et imperium sempiternum. Amen.\"},{\"verse\":17,\"text\":\"Divitibus hujus sæculi præcipe non sublime sapere, neque sperare in incerto divitiarum, sed in Deo vivo (qui præstat nobis omnia abunde ad fruendum)\"},{\"verse\":18,\"text\":\"bene agere, divites fieri in bonis operibus, facile tribuere, communicare,\"},{\"verse\":19,\"text\":\"thesaurizare sibi fundamentum bonum in futurum, ut apprehendant veram vitam.\"},{\"verse\":20,\"text\":\"O Timothee, depositum custodi, devitans profanas vocum novitates, et oppositiones falsi nominis scientiæ,\"},{\"verse\":21,\"text\":\"quam quidam promittentes, circa fidem exciderunt. Gratia tecum. Amen.\"}],\"summary\":\"Duties of servants. The danger of covetousness. Lessons for the rich.\",\"intro\":null,\"prev\":{\"usfm\":\"1TI\",\"chapter\":5,\"label\":\"1 Timothy 5\"},\"next\":{\"usfm\":\"2TI\",\"chapter\":1,\"label\":\"2 Timothy 1\"}}]]\n"])</script></body></html>
