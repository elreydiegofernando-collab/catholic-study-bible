-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>An ancient man rebuke not, but entreat him as a father: young men, as brethren:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Old women, as mothers: young women, as sisters, in all chastity.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Honour widows that are widows indeed.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But if any widow have children or grandchildren, let her learn first to govern her own house and to make a return of duty to her parents; for this is acceptable before God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But she that is a widow indeed, and desolate, let her trust in God and continue in supplications and prayers night and day.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For she that liveth in pleasures is dead while she is living.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And this give in charge, that they may be blameless.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But if any man have not care of his own and especially of those of his house, he hath denied the faith and is worse than an infidel.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Let a widow be chosen of no less than threescore years of age, who hath been the wife of one husband.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Having testimony for her good works, if she have brought up children, if she have received to harbour, if she have washed the saints’ feet, if she have ministered to them that suffer tribulation, if she have diligently followed every good work.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the younger widows avoid. For when they have grown wanton in Christ, they will marry:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Having damnation, because they have made void their first faith.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And withal being idle they learn to go about from house to house: and are not only idle, but tattlers also and busy bodies, speaking things which they ought not.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I will, therefore, that the younger should marry, bear children, be mistresses of families, give no occasion to the adversary to speak evil.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For some are already turned aside after Satan.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If any of the faithful have widows, let him minister to them, and let not the church be charged: that there may be sufficient for them that are widows indeed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let the priests that rule well be esteemed worthy of double honour: especially they who labour in the word and doctrine.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For the scripture saith: Thou shalt not muzzle the ox that treadeth out the corn: and, The labourer is worthy of his reward.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Against a priest receive not an accusation, but under two or three witnesses.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Them that sin reprove before all that the rest also may have fear.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I charge thee, before God and Christ Jesus and the elect angels, that thou observe these things without prejudice, doing nothing by declining to either side.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Impose not hands lightly upon any man, neither be partaker of other men’s sins. Keep thyself chaste.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Do not still drink water, but use a little wine for thy stomach’s sake and thy frequent infirmities.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Some men’s sins are manifest, going before to judgment: and some men they follow after.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In like manner also good deeds are manifest: and they that are otherwise cannot be hid.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Seniorem ne increpaveris, sed obsecra ut patrem : juvenes, ut fratres :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>anus, ut matres : juvenculas, ut sorores in omni castitate :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>viduas honora, quæ vere viduæ sunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si qua autem vidua filios, aut nepotes habet : discat primum domum suam regere, et mutuam vicem reddere parentibus : hoc enim acceptum est coram Deo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quæ autem vere vidua est, et desolata, speret in Deum, et instet obsecrationibus, et orationibus nocte ac die.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nam quæ in deliciis est, vivens mortua est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et hoc præcipe, ut irreprehensibiles sint.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si quis autem suorum, et maxime domesticorum, curam non habet, fidem negavit, et est infideli deterior.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Vidua eligatur non minus sexaginta annorum, quæ fuerit unius viri uxor,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>in operibus bonis testimonium habens, si filios educavit, si hospitio recepit, si sanctorum pedes lavit, si tribulationem patientibus subministravit, si omne opus bonum subsecuta est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Adolescentiores autem viduas devita : cum enim luxuriatæ fuerint in Christo, nubere volunt :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>habentes damnationem, quia primam fidem irritam fecerunt ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>simul autem et otiosæ discunt circuire domos : non solum otiosæ, sed et verbosæ, et curiosæ, loquentes quæ non oportet.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Volo ergo juniores nubere, filios procreare, matresfamilias esse, nullam occasionem dare adversario maledicti gratia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Jam enim quædam conversæ sunt retro Satanam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si quis fidelis habet viduas, subministret illis, et non gravetur ecclesia : ut iis quæ vere viduæ sunt, sufficiat.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui bene præsunt presbyteri, duplici honore digni habeantur : maxime qui laborant in verbo et doctrina.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dicit enim Scriptura : Non alligabis os bovi trituranti. Et : Dignus est operarius mercede sua.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Adversus presbyterum accusationem noli recipere, nisi sub duobus aut tribus testibus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Peccantes coram omnibus argue : ut et ceteri timorem habeant.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Testor coram Deo et Christo Jesu, et electis angelis, ut hæc custodias sine præjudicio, nihil faciens in alteram partem declinando.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Manus cito nemini imposueris, neque communicaveris peccatis alienis. Teipsum castum custodi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Noli adhuc aquam bibere, sed modico vino utere propter stomachum tuum, et frequentes tuas infirmitates.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quorumdam hominum peccata manifesta sunt, præcedentia ad judicium : quosdam autem et subsequuntur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Similiter et facta bona, manifesta sunt : et quæ aliter se habent, abscondi non possunt.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/cat imothy\",\"chapter\":5,\"totalChapters\":6,\"dra\":[{\"verse\":1,\"text\":\"An ancient man rebuke not, but entreat him as a father: young men, as brethren:\"},{\"verse\":2,\"text\":\"Old women, as mothers: young women, as sisters, in all chastity.\"},{\"verse\":3,\"text\":\"Honour widows that are widows indeed.\"},{\"verse\":4,\"text\":\"But if any widow have children or grandchildren, let her learn first to govern her own house and to make a return of duty to her parents; for this is acceptable before God.\"},{\"verse\":5,\"text\":\"But she that is a widow indeed, and desolate, let her trust in God and continue in supplications and prayers night and day.\"},{\"verse\":6,\"text\":\"For she that liveth in pleasures is dead while she is living.\"},{\"verse\":7,\"text\":\"And this give in charge, that they may be blameless.\"},{\"verse\":8,\"text\":\"But if any man have not care of his own and especially of those of his house, he hath denied the faith and is worse than an infidel.\"},{\"verse\":9,\"text\":\"Let a widow be chosen of no less than threescore years of age, who hath been the wife of one husband.\"},{\"verse\":10,\"text\":\"Having testimony for her good works, if she have brought up children, if she have received to harbour, if she have washed the saints’ feet, if she have ministered to them that suffer tribulation, if she have diligently followed every good work.\"},{\"verse\":11,\"text\":\"But the younger widows avoid. For when they have grown wanton in Christ, they will marry:\"},{\"verse\":12,\"text\":\"Having damnation, because they have made void their first faith.\"},{\"verse\":13,\"text\":\"And withal being idle they learn to go about from house to house: and are not only idle, but tattlers also and busy bodies, speaking things which they ought not.\"},{\"verse\":14,\"text\":\"I will, therefore, that the younger should marry, bear children, be mistresses of families, give no occasion to the adversary to speak evil.\"},{\"verse\":15,\"text\":\"For some are already turned aside after Satan.\"},{\"verse\":16,\"text\":\"If any of the faithful have widows, let him minister to them, and let not the church be charged: that there may be sufficient for them that are widows indeed.\"},{\"verse\":17,\"text\":\"Let the priests that rule well be esteemed worthy of double honour: especially they who labour in the word and doctrine.\"},{\"verse\":18,\"text\":\"For the scripture saith: Thou shalt not muzzle the ox that treadeth out the corn: and, The labourer is worthy of his reward.\"},{\"verse\":19,\"text\":\"Against a priest receive not an accusation, but under two or three witnesses.\"},{\"verse\":20,\"text\":\"Them that sin reprove before all that the rest also may have fear.\"},{\"verse\":21,\"text\":\"I charge thee, before God and Christ Jesus and the elect angels, that thou observe these things without prejudice, doing nothing by declining to either side.\"},{\"verse\":22,\"text\":\"Impose not hands lightly upon any man, neither be partaker of other men’s sins. Keep thyself chaste.\"},{\"verse\":23,\"text\":\"Do not still drink water, but use a little wine for thy stomach’s sake and thy frequent infirmities.\"},{\"verse\":24,\"text\":\"Some men’s sins are manifest, going before to judgment: and some men they follow after.\"},{\"verse\":25,\"text\":\"In like manner also good deeds are manifest: and they that are otherwise cannot be hid.\"}],\"vul\":[{\"verse\":1,\"text\":\"Seniorem ne increpaveris, sed obsecra ut patrem : juvenes, ut fratres :\"},{\"verse\":2,\"text\":\"anus, ut matres : juvenculas, ut sorores in omni castitate :\"},{\"verse\":3,\"text\":\"viduas honora, quæ vere viduæ sunt.\"},{\"verse\":4,\"text\":\"Si qua autem vidua filios, aut nepotes habet : discat primum domum suam regere, et mutuam vicem reddere parentibus : hoc enim acceptum est coram Deo.\"},{\"verse\":5,\"text\":\"Quæ autem vere vidua est, et desolata, speret in Deum, et instet obsecrationibus, et orationibus nocte ac die.\"},{\"verse\":6,\"text\":\"Nam quæ in deliciis est, vivens mortua est.\"},{\"verse\":7,\"text\":\"Et hoc præcipe, ut irreprehensibiles sint.\"},{\"verse\":8,\"text\":\"Si quis autem suorum, et maxime domesticorum, curam non habet, fidem negavit, et est infideli deterior.\"},{\"verse\":9,\"text\":\"Vidua eligatur non minus sexaginta annorum, quæ fuerit unius viri uxor,\"},{\"verse\":10,\"text\":\"in operibus bonis testimonium habens, si filios educavit, si hospitio recepit, si sanctorum pedes lavit, si tribulationem patientibus subministravit, si omne opus bonum subsecuta est.\"},{\"verse\":11,\"text\":\"Adolescentiores autem viduas devita : cum enim luxuriatæ fuerint in Christo, nubere volunt :\"},{\"verse\":12,\"text\":\"habentes damnationem, quia primam fidem irritam fecerunt ;\"},{\"verse\":13,\"text\":\"simul autem et otiosæ discunt circuire domos : non solum otiosæ, sed et verbosæ, et curiosæ, loquentes quæ non oportet.\"},{\"verse\":14,\"text\":\"Volo ergo juniores nubere, filios procreare, matresfamilias esse, nullam occasionem dare adversario maledicti gratia.\"},{\"verse\":15,\"text\":\"Jam enim quædam conversæ sunt retro Satanam.\"},{\"verse\":16,\"text\":\"Si quis fidelis habet viduas, subministret illis, et non gravetur ecclesia : ut iis quæ vere viduæ sunt, sufficiat.\"},{\"verse\":17,\"text\":\"Qui bene præsunt presbyteri, duplici honore digni habeantur : maxime qui laborant in verbo et doctrina.\"},{\"verse\":18,\"text\":\"Dicit enim Scriptura : Non alligabis os bovi trituranti. Et : Dignus est operarius mercede sua.\"},{\"verse\":19,\"text\":\"Adversus presbyterum accusationem noli recipere, nisi sub duobus aut tribus testibus.\"},{\"verse\":20,\"text\":\"Peccantes coram omnibus argue : ut et ceteri timorem habeant.\"},{\"verse\":21,\"text\":\"Testor coram Deo et Christo Jesu, et electis angelis, ut hæc custodias sine præjudicio, nihil faciens in alteram partem declinando.\"},{\"verse\":22,\"text\":\"Manus cito nemini imposueris, neque communicaveris peccatis alienis. Teipsum castum custodi.\"},{\"verse\":23,\"text\":\"Noli adhuc aquam bibere, sed modico vino utere propter stomachum tuum, et frequentes tuas infirmitates.\"},{\"verse\":24,\"text\":\"Quorumdam hominum peccata manifesta sunt, præcedentia ad judicium : quosdam autem et subsequuntur.\"},{\"verse\":25,\"text\":\"Similiter et facta bona, manifesta sunt : et quæ aliter se habent, abscondi non possunt.\"}],\"summary\":\"He gives him lessons concerning widows, and how he is to behave to his clergy.\",\"intro\":null,\"prev\":{\"usfm\":\"1TI\",\"chapter\":4,\"label\":\"1 Timothy 4\"},\"next\":{\"usfm\":\"1TI\",\"chapter\":6,\"label\":\"1 Timothy 6\"}}]]\n"])</script></body></html>
