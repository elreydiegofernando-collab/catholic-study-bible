="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Maccabees<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Machabees</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2MA/">About <!-- -->2 Maccabees</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Lysias is overthrown by Judas. He sues for peace.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A short time after this Lysias, the king’s lieutenant, and cousin, and who had chief charge over all the affairs, being greatly displeased with what had happened,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Gathered together fourscore thousand men, and all the horsemen, and came against the Jews, thinking to take the city, and make it a habitation of the Gentiles:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And to make a gain of the temple, as of the other temples of the Gentiles and to set the high priesthood to sale every year:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Never considering the power of God, but puffed up in mind, and trusting in the multitude of his foot soldiers, and the thousands of his horsemen, and his fourscore elephants.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>So he came into Judea, and approaching to Bethsura, which was in a narrow place, the space of five furlongs from Jerusalem, he laid siege to that fortress.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But when Machabeus, and they that were with him, understood that the strong holds were besieged, they and all the people besought the Lord with lamentations and tears, that he would send a good angel to save Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then Machabeus himself first taking his arms, exhorted the rest to expose themselves together with him, to the danger, and to succour their brethren.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when they were going forth together with a willing mind, there appeared at Jerusalem a horseman going before them in white clothing, with golden armour, shaking a spear.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then they all together blessed the merciful Lord, and took great courage: being ready to break through not only men, but also the fiercest beasts, and walls of iron.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>So they went on courageously, having a helper from heaven, and the Lord, who shewed mercy to them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And rushing violently upon the enemy, like lions, they slew of them eleven thousand footmen, and one thousand six hundred horsemen:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And put all the rest to flight; and many of them being wounded, escaped naked: Yea, and Lysias himself fled away shamefully, and escaped.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And as he was a man of understanding, considering with himself the loss he had suffered, and perceiving that the Hebrews could not be overcome, because they relied upon the help of the Almighty God, he sent to them:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And promised that he would agree to all things that are just, and that he would persuade the king to be their friend.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then Machabeus consented to the request of Lysias, providing for the common good in all things; and whatsoever Machabeus wrote to Lysias, concerning the Jews, the king allowed of.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For there were letters written to the Jews from Lysias, to this effect: Lysias, to the people of the Jews, greeting.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>John, and Abesalom, who were sent from you, delivering your writings, requested that I would accomplish those things which were signified by them.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Therefore whatsoever things could be reported to the king, I have represented to him: and he hath granted as much as the matter permitted.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If, therefore, you will keep yourselves loyal in affairs, hereafter also I will endeavour to be a means of your good.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But as concerning other particulars, I have given orders by word both to these, and to them that are sent by me, to commune with you.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fare ye well. In the year one hundred and forty-eight, the four and twentieth day of the month of Dioscorus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But the king’s letter contained these words King Antiochus to Lysias, his brother, greeting.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Our father being translated amongst the gods we are desirous that they that are in our realm should live quietly, and apply themselves diligently to their own concerns.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And we have heard that the Jews would not consent to my father to turn to the rites of the Greeks but that they would keep to their own manner of living and therefore that they request us to allow them to live after their own laws.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Wherefore being desirous that this nation also should be at rest, we have ordained and decreed, that the temple should be restored to them, and that they may live according to the custom of their ancestors.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt do well, therefore, to send to them, and grant them peace, that our pleasure being known, they may be of good comfort, and look to their own affairs.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But the king’s letter to the Jews was in this manner: King Antiochus to the senate of the Jews, and to the rest of the Jews, greeting.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>If you are well, you are as we desire: we ourselves also are well.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Menelaus came to us, saying that you desired to come down to your countrymen, that are with us.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>We grant, therefore, a safe conduct to all that come and go, until the thirtieth day of the month of Xanthicus,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>That the Jews may use their own kind of meats, and their own laws, as before: and that none of them any manner of ways be molested for things which have been done by ignorance.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And we have sent also Menelaus to speak to you.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The Romans also sent them a letter, to this effect: Quintus Memmius, and Titus Manilius, ambassadors of the Romans, to the people of the Jews, greeting.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Whatsoever Lysias, the king’s cousin, hath granted to you, we also have granted.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But touching such things as he thought should be referred to the king, after you have diligently conferred among yourselves, send some one forthwith, that we may decree as it is convenient for you: for we are going to Antioch.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And therefore make haste to write back, that we may know of what mind you are.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sed parvo post tempore, Lysias procurator regis et propinquus, ac negotiorum præpositus, graviter ferens de his quæ acciderant,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>congregatis octoginta millibus, et equitatu universo, veniebat adversus Judæos, existimans se civitatem quidem captam gentibus habitaculum facturum,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>templum vero in pecuniæ quæstum, sicut cetera delubra gentium, habiturum, et per singulos annos venale sacerdotium :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>nusquam recogitans Dei potestatem, sed mente effrenatus in multitudine peditum, et in millibus equitum, et in octoginta elephantis confidebat.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ingressus autem Judæam, et appropians Bethsuræ, quæ erat in angusto loco, ab Jerosolyma intervallo quinque stadiorum, illud præsidium expugnabat.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ut autem Machabæus et qui cum eo erant cognoverunt expugnari præsidia, cum fletu et lacrimis rogabant Dominum, et omnis turba simul, ut bonum angelum mitteret ad salutem Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ipse primus Machabæus, sumptis armis, ceteros adhortatus est simul secum periculum subire, et ferre auxilium fratribus suis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cumque pariter prompto animo procederent, Jerosolymis apparuit præcedens eos eques in veste candida, armis aureis hastam vibrans.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tunc omnes simul benedixerunt misericordem Dominum, et convaluerunt animis : non solum homines, sed et bestias ferocissimas, et muros ferreos parati penetrare.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ibant igitur prompti, de cælo habentes adjutorem et miserantem super eos Dominum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Leonum autem more impetu irruentes in hostes, prostraverunt ex eis undecim millia peditum, et equitum mille sexcentos :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>universos autem in fugam verterunt, plures autem ex eis vulnerati nudi evaserunt. Sed et ipse Lysias turpiter fugiens evasit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et quia non insensatus erat, secum ipse reputans factam erga se diminutionem, et intelligens invictos esse Hebræos, omnipotentis Dei auxilio innitentes, misit ad eos :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>promisitque se consensurum omnibus quæ justa sunt, et regem compulsurum amicum fieri.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Annuit autem Machabæus precibus Lysiæ, in omnibus utilitati consulens : et quæcumque Machabæus scripsit Lysiæ de Judæis, ea rex concessit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nam erant scriptæ Judæis epistolæ a Lysia quidem hunc modum continentes : Lysias populo Judæorum salutem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Joannes et Abesalom, qui missi fuerant a vobis, tradentes scripta, postulabant ut ea quæ per illos significabantur, implerem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quæcumque igitur regi potuerunt perferri, exposui : et quæ res permittebat, concessit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Si igitur in negotiis fidem conservaveritis, et deinceps bonorum vobis causa esset, tentabo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De ceteris autem per singula verbo mandavi et istis, et his, qui a me missi sunt, colloqui vobiscum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Bene valete. Anno centesimo, quadragesimo octavo mensis Dioscori, die vigesima et quarta.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Regis autem epistola ista continebat : Rex Antiochus Lysiæ fratri salutem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Patre nostro inter deos translato, nos volentes eos qui sunt in regno nostro sine tumultu agere, et rebus suis adhibere diligentiam,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>audivimus Judæos non consensisse patri meo ut transferrentur ad ritum Græcorum, sed tenere velle suum institutum, ac propterea postulare a nobis concedi sibi legitima sua.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Volentes igitur hanc quoque gentem quietam esse, statuentes judicavimus templum restitui illis, ut agerent secundum suorum majorum consuetudinem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Bene igitur feceris, si miseris ad eos et dexteram dederis : ut cognita nostra voluntate, bono animo sint, et utilitatibus propriis deserviant.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ad Judæos vero regis epistola talis erat : Rex Antiochus senatui Judæorum, et ceteris Judæis salutem.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Si valetis, sic estis ut volumus : sed et ipsi bene valemus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Adiit nos Menelaus, dicens velle vos descendere ad vestros, qui sunt apud nos.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>His igitur qui commeant usque ad diem trigesimum mensis Xanthici, damus dextras securitatis,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>ut Judæi utantur cibis et legibus suis, sicut et prius : et nemo eorum ullo modo molestiam patiatur de his quæ per ignorantiam gesta sunt.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Misimus autem et Menelaum, qui vos alloquatur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Valete. Anno centesimo quadragesimo octavo, Xanthici mensis quintadecima die.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Miserunt autem etiam Romani epistolam, ita se habentem : Quintus Memmius et Titus Manilius legati Romanorum, populo Judæorum salutem.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>De his quæ Lysias cognatus regis concessit vobis, et nos concessimus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>De quibus autem ad regem judicavit referendum, confestim aliquem mittere, diligentius inter vos conferentes, ut decernamus, sicut congruit vobis : nos enim Antiochiam accedimus.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Ideoque festinate rescribere, ut nos quoque sciamus cujus estis voluntatis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Bene valete. Anno centesimo quadragesimo octavo, quintadecima die mensis Xanthici.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2MA/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Maccabees 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2MA/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next<  the multitude of his foot soldiers, and the thousands of his horsemen, and his fourscore elephants.\"},{\"verse\":5,\"text\":\"So he came into Judea, and approaching to Bethsura, which was in a narrow place, the space of five furlongs from Jerusalem, he laid siege to that fortress.\"},{\"verse\":6,\"text\":\"But when Machabeus, and they that were with him, understood that the strong holds were besieged, they and all the people besought the Lord with lamentations and tears, that he would send a good angel to save Israel.\"},{\"verse\":7,\"text\":\"Then Machabeus himself first taking his arms, exhorted the rest to expose themselves together with him, to the danger, and to succour their brethren.\"},{\"verse\":8,\"text\":\"And when they were going forth together with a willing mind, there appeared at Jerusalem a horseman going before them in white clothing, with golden armour, shaking a spear.\"},{\"verse\":9,\"text\":\"Then they all together blessed the merciful Lord, and took great courage: being ready to break through not only men, but also the fiercest beasts, and walls of iron.\"},{\"verse\":10,\"text\":\"So they went on courageously, having a helper from heaven, and the Lord, who shewed mercy to them.\"},{\"verse\":11,\"text\":\"And rushing violently upon the enemy, like lions, they slew of them eleven thousand footmen, and one thousand six hundred horsemen:\"},{\"verse\":12,\"text\":\"And put all the rest to flight; and many of them being wounded, escaped naked: Yea, and Lysias himself fled away shamefully, and escaped.\"},{\"verse\":13,\"text\":\"And as he was a man of understanding, considering with himself the loss he had suffered, and perceiving that the Hebrews could not be overcome, because they relied upon the help of the Almighty God, he sent to them:\"},{\"verse\":14,\"text\":\"And promised that he would agree to all things that are just, and that he would persuade the king to be their friend.\"},{\"verse\":15,\"text\":\"Then Machabeus consented to the request of Lysias, providing for the common good in all things; and whatsoever Machabeus wrote to Lysias, concerning the Jews, the king allowed of.\"},{\"verse\":16,\"text\":\"For there were letters written to the Jews from Lysias, to this effect: Lysias, to the people of the Jews, greeting.\"},{\"verse\":17,\"text\":\"John, and Abesalom, who were sent from you, delivering your writings, requested that I would accomplish those things which were signified by them.\"},{\"verse\":18,\"text\":\"Therefore whatsoever things could be reported to the king, I have represented to him: and he hath granted as much as the matter permitted.\"},{\"verse\":19,\"text\":\"If, therefore, you will keep yourselves loyal in affairs, hereafter also I will endeavour to be a means of your good.\"},{\"verse\":20,\"text\":\"But as concerning other particulars, I have given orders by word both to these, and to them that are sent by me, to commune with you.\"},{\"verse\":21,\"text\":\"Fare ye well. In the year one hundred and forty-eight, the four and twentieth day of the month of Dioscorus.\"},{\"verse\":22,\"text\":\"But the king’s letter contained these words King Antiochus to Lysias, his brother, greeting.\"},{\"verse\":23,\"text\":\"Our father being translated amongst the gods we are desirous that they that are in our realm should live quietly, and apply themselves diligently to their own concerns.\"},{\"verse\":24,\"text\":\"And we have heard that the Jews would not consent to my father to turn to the rites of the Greeks but that they would keep to their own manner of living and therefore that they request us to allow them to live after their own laws.\"},{\"verse\":25,\"text\":\"Wherefore being desirous that this nation also should be at rest, we have ordained and decreed, that the temple should be restored to them, and that they may live according to the custom of their ancestors.\"},{\"verse\":26,\"text\":\"Thou shalt do well, therefore, to send to them, and grant them peace, that our pleasure being known, they may be of good comfort, and look to their own affairs.\"},{\"verse\":27,\"text\":\"But the king’s letter to the Jews was in this manner: King Antiochus to the senate of the Jews, and to the rest of the Jews, greeting.\"},{\"verse\":28,\"text\":\"If you are well, you are as we desire: we ourselves also are well.\"},{\"verse\":29,\"text\":\"Menelaus came to us, saying that you desired to come down to your countrymen, that are with us.\"},{\"verse\":30,\"text\":\"We grant, therefore, a safe conduct to all that come and go, until the thirtieth day of the month of Xanthicus,\"},{\"verse\":31,\"text\":\"That the Jews may use their own kind of meats, and their own laws, as before: and that none of them any manner of ways be molested for things which have been done by ignorance.\"},{\"verse\":32,\"text\":\"And we have sent also Menelaus to speak to you.\"},{\"verse\":33,\"text\":\"Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus.\"},{\"verse\":34,\"text\":\"The Romans also sent them a letter, to this effect: Quintus Memmius, and Titus Manilius, ambassadors of the Romans, to the people of the Jews, greeting.\"},{\"verse\":35,\"text\":\"Whatsoever Lysias, the king’s cousin, hath granted to you, we also have granted.\"},{\"verse\":36,\"text\":\"But touching such things as he thought should be referred to the king, after you have diligently conferred among yourselves, send some one forthwith, that we may decree as it is convenient for you: for we are going to Antioch.\"},{\"verse\":37,\"text\":\"And therefore make haste to write back, that we may know of what mind you are.\"},{\"verse\":38,\"text\":\"Fare ye well. In the year one hundred and forty-eight, the fifteenth day of the month of Xanthicus.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sed parvo post tempore, Lysias procurator regis et propinquus, ac negotiorum præpositus, graviter ferens de his quæ acciderant,\"},{\"verse\":2,\"text\":\"congregatis octoginta millibus, et equitatu universo, veniebat adversus Judæos, existimans se civitatem quidem captam gentibus habitaculum facturum,\"},{\"verse\":3,\"text\":\"templum vero in pecuniæ quæstum, sicut cetera delubra gentium, habiturum, et per singulos annos venale sacerdotium :\"},{\"verse\":4,\"text\":\"nusquam recogitans Dei potestatem, sed mente effrenatus in multitudine peditum, et in millibus equitum, et in octoginta elephantis confidebat.\"},{\"verse\":5,\"text\":\"Ingressus autem Judæam, et appropians Bethsuræ, quæ erat in angusto loco, ab Jerosolyma intervallo quinque stadiorum, illud præsidium expugnabat.\"},{\"verse\":6,\"text\":\"Ut autem Machabæus et qui cum eo erant cognoverunt expugnari præsidia, cum fletu et lacrimis rogabant Dominum, et omnis turba simul, ut bonum angelum mitteret ad salutem Israël.\"},{\"verse\":7,\"text\":\"Et ipse primus Machabæus, sumptis armis, ceteros adhortatus est simul secum periculum subire, et ferre auxilium fratribus suis.\"},{\"verse\":8,\"text\":\"Cumque pariter prompto animo procederent, Jerosolymis apparuit præcedens eos eques in veste candida, armis aureis hastam vibrans.\"},{\"verse\":9,\"text\":\"Tunc omnes simul benedixerunt misericordem Dominum, et convaluerunt animis : non solum homines, sed et bestias ferocissimas, et muros ferreos parati penetrare.\"},{\"verse\":10,\"text\":\"Ibant igitur prompti, de cælo habentes adjutorem et miserantem super eos Dominum.\"},{\"verse\":11,\"text\":\"Leonum autem more impetu irruentes in hostes, prostraverunt ex eis undecim millia peditum, et equitum mille sexcentos :\"},{\"verse\":12,\"text\":\"universos autem in fugam verterunt, plures autem ex eis vulnerati nudi evaserunt. Sed et ipse Lysias turpiter fugiens evasit.\"},{\"verse\":13,\"text\":\"Et quia non insensatus erat, secum ipse reputans factam erga se diminutionem, et intelligens invictos esse Hebræos, omnipotentis Dei auxilio innitentes, misit ad eos :\"},{\"verse\":14,\"text\":\"promisitque se consensurum omnibus quæ justa sunt, et regem compulsurum amicum fieri.\"},{\"verse\":15,\"text\":\"Annuit autem Machabæus precibus Lysiæ, in omnibus utilitati consulens : et quæcumque Machabæus scripsit Lysiæ de Judæis, ea rex concessit.\"},{\"verse\":16,\"text\":\"Nam erant scriptæ Judæis epistolæ a Lysia quidem hunc modum continentes : Lysias populo Judæorum salutem.\"},{\"verse\":17,\"text\":\"Joannes et Abesalom, qui missi fuerant a vobis, tradentes scripta, postulabant ut ea quæ per illos significabantur, implerem.\"},{\"verse\":18,\"text\":\"Quæcumque igitur regi potuerunt perferri, exposui : et quæ res permittebat, concessit.\"},{\"verse\":19,\"text\":\"Si igitur in negotiis fidem conservaveritis, et deinceps bonorum vobis causa esset, tentabo.\"},{\"verse\":20,\"text\":\"De ceteris autem per singula verbo mandavi et istis, et his, qui a me missi sunt, colloqui vobiscum.\"},{\"verse\":21,\"text\":\"Bene valete. Anno centesimo, quadragesimo octavo mensis Dioscori, die vigesima et quarta.\"},{\"verse\":22,\"text\":\"Regis autem epistola ista continebat : Rex Antiochus Lysiæ fratri salutem.\"},{\"verse\":23,\"text\":\"Patre nostro inter deos translato, nos volentes eos qui sunt in regno nostro sine tumultu agere, et rebus suis adhibere diligentiam,\"},{\"verse\":24,\"text\":\"audivimus Judæos non consensisse patri meo ut transferrentur ad ritum Græcorum, sed tenere velle suum institutum, ac propterea postulare a nobis concedi sibi legitima sua.\"},{\"verse\":25,\"text\":\"Volentes igitur hanc quoque gentem quietam esse, statuentes judicavimus templum restitui illis, ut agerent secundum suorum majorum consuetudinem.\"},{\"verse\":26,\"text\":\"Bene igitur feceris, si miseris ad eos et dexteram dederis : ut cognita nostra voluntate, bono animo sint, et utilitatibus propriis deserviant.\"},{\"verse\":27,\"text\":\"Ad Judæos vero regis epistola talis erat : Rex Antiochus senatui Judæorum, et ceteris Judæis salutem.\"},{\"verse\":28,\"text\":\"Si valetis, sic estis ut volumus : sed et ipsi bene valemus.\"},{\"verse\":29,\"text\":\"Adiit nos Menelaus, dicens velle vos descendere ad vestros, qui sunt apud nos.\"},{\"verse\":30,\"text\":\"His igitur qui commeant usque ad diem trigesimum mensis Xanthici, damus dextras securitatis,\"},{\"verse\":31,\"text\":\"ut Judæi utantur cibis et legibus suis, sicut et prius : et nemo eorum ullo modo molestiam patiatur de his quæ per ignorantiam gesta sunt.\"},{\"verse\":32,\"text\":\"Misimus autem et Menelaum, qui vos alloquatur.\"},{\"verse\":33,\"text\":\"Valete. Anno centesimo quadragesimo octavo, Xanthici mensis quintadecima die.\"},{\"verse\":34,\"text\":\"Miserunt autem etiam Romani epistolam, ita se habentem : Quintus Memmius et Titus Manilius legati Romanorum, populo Judæorum salutem.\"},{\"verse\":35,\"text\":\"De his quæ Lysias cognatus regis concessit vobis, et nos concessimus.\"},{\"verse\":36,\"text\":\"De quibus autem ad regem judicavit referendum, confestim aliquem mittere, diligentius inter vos conferentes, ut decernamus, sicut congruit vobis : nos enim Antiochiam accedimus.\"},{\"verse\":37,\"text\":\"Ideoque festinate rescribere, ut nos quoque sciamus cujus estis voluntatis.\"},{\"verse\":38,\"text\":\"Bene valete. Anno centesimo quadragesimo octavo, quintadecima die mensis Xanthici.\"}],\"summary\":\"Lysias is overthrown by Judas. He sues for peace.\",\"intro\":null,\"prev\":{\"usfm\":\"2MA\",\"chapter\":10,\"label\":\"2 Maccabees 10\"},\"next\":{\"usfm\":\"2MA\",\"chapter\":12,\"label\":\"2 Maccabees 12\"}}]]\n"])</script></body></html>
