20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Joel<!-- --> <span class="text-stone-500">2</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Blow ye the trumpet in Sion, sound an alarm in my holy mountain, let all the inhabitants of the land tremble: because the day of the Lord cometh, because it is nigh at hand.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A day of darkness, and of gloominess, a day of clouds and whirlwinds: a numerous and strong people as the morning spread upon the mountains: the like to it hath not been from the beginning, nor shall be after it, even to the years of generation and generation.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Before the face thereof a devouring fire, and behind it a burning flame: the land is like a garden of pleasure before it, and behind it a desolate wilderness, neither is there any one that can escape it.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The appearance of them is as the appearance of horses, and they shall run like horsemen.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They shall leap like the noise of chariots upon the tops of mountains, like the noise of a flame of fire devouring the stubble, as a strong people prepared to battle.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>At their presence the people shall be in grievous pains: all faces shall be made like a kettle.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They shall run like valiant men: like men of war they shall scale the wall: the men shall march every one on his way, and they shall not turn aside from their ranks.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>No one shall press upon his brother: they shall walk every one in his path: yea, and they shall fall through the windows, and shall take no harm.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They shall enter into the city: they shall run upon the wall, they shall climb up the houses, they shall come in at the windows, as a thief.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>At their presence the earth hath trembled, the heavens are moved: the sun and moon are darkened, and the stars have withdrawn their shining.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the Lord hath uttered his voice before the face of his army: for his armies are exceedingly great, for they are strong, and execute his word: for the day of the Lord is great and very terrible: and who can stand it?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now, therefore, saith the Lord. Be converted to me with all your heart, in fasting, and in weeping, and in mourning.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And rend your hearts, and not your garments and turn to the Lord your God: for he is gracious and merciful, patient and rich in mercy, and ready to repent of the evil.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Who knoweth but he will return, and forgive, and leave a blessing behind him, sacrifice and libation to the Lord your God?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Blow the trumpet in Sion, sanctify a fast, call a solemn assembly,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Gather together the people, sanctify the church, assemble the ancients, gather together the little ones, and them that suck at the breasts: let the bridegroom go forth from his bed, and the bride out of her bridal chamber.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Between the porch and the altar the priests, the Lord’s ministers, shall weep, and shall say: Spare, O Lord, spare thy people: and give not thy inheritance to reproach, that the heathens should rule over them. Why should they say among the nations: Where is their God?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Lord hath been zealous for his land, and hath spared his people.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the Lord answered, and said to his people: Behold I will send you corn, and wine, and oil, and you shall be filled with them: and I will no more make you a reproach among the nations.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And I will remove far off from you the northern enemy: and I will drive him into a land unpassable, and desert, with his face towards the east sea, and his hinder part towards the utmost sea: and his stench shall ascend, and his rottenness shall go up, because he hath done proudly.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fear not, O land, be glad, and rejoice: for the Lord hath done great things.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fear not, ye beasts of the fields: for the beautiful places of the wilderness are sprung, for the tree hath brought forth its fruit, the fig tree, and the vine have yielded their strength.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And you, O children of Sion, rejoice, and be joyful in the Lord your God: because he hath given you a teacher of justice, and he will make the early and the latter rain to come down to you as in the beginning.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the floors shall be filled with wheat, and the presses shall overflow with wine, and oil.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And I will restore to you the years which the locust, and the bruchus, and the mildew, and the palmerworm hath eaten; my great host which I sent upon you.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And you shall eat in plenty, and shall be filled and you shall praise the name of the Lord your God; who hath done wonders with you, and my people shall not be confounded for ever.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And you shall know that I am in the midst of Israel: and I am the Lord your God, and there is none besides: and my people shall not be confounded forever.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And it shall come to pass after this, that I will pour out my spirit upon all flesh: and your sons and your daughters shall prophesy: your old men shall dream dreams, and your young men shall see visions.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Moreover, upon my servants and handmaids in those days I will pour forth my spirit.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And I will shew wonders in heaven; and in earth, blood, and fire, and vapour of smoke.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The sun shall be turned into darkness, and the moon into blood: before the great and dreadful day of the Lord doth come.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And it shall come to pass, that every one that shall call upon the name of the Lord, shall be saved: for in Mount Sion, and in Jerusalem shall be salvation, as the Lord hath said, and in the residue whom the Lord shall call.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Canite tuba in Sion, ululate in monte sancto meo, conturbentur omnes habitatores terræ : quia venit dies Domini, quia prope est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dies tenebrarum et caliginis, dies nubis et turbinis ; quasi mane expansum super montes populus multus et fortis : similis ei non fuit a principio, et post eum non erit usque in annos generationis et generationis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ante faciem ejus ignis vorans, et post eum exurens flamma. Quasi hortus voluptatis terra coram eo, et post eum solitudo deserti, neque est qui effugiat eum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quasi aspectus equorum, aspectus eorum ; et quasi equites, sic current.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sicut sonitus quadrigarum super capita montium exilient, sicut sonitus flammæ ignis devorantis stipulam, velut populus fortis præparatus ad prælium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A facie ejus cruciabuntur populi ; omnes vultus redigentur in ollam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sicut fortes current ; quasi viri bellatores ascendent murum : viri in viis suis gradientur, et non declinabunt a semitis suis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Unusquisque fratrem suum non coarctabit, singuli in calle suo ambulabunt ; sed et per fenestras cadent, et non demolientur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Urbem ingredientur, in muro current, domos conscendent, per fenestras intrabunt quasi fur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>A facie ejus contremuit terra, moti sunt cæli, sol et luna obtenebrati sunt, et stellæ retraxerunt splendorem suum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et Dominus dedit vocem suam ante faciem exercitus sui, quia multa sunt nimis castra ejus, quia fortia et facientia verbum ejus : magnus enim dies Domini, et terribilis valde, et quis sustinebit eum ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nunc ergo, dicit Dominus, convertimini ad me in toto corde vestro, in jejunio, et in fletu, et in planctu.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et scindite corda vestra, et non vestimenta vestra ; et convertimini ad Dominum Deum vestrum, quia benignus et misericors est, patiens et multæ misericordiæ, et præstabilis super malitia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quis scit si convertatur, et ignoscat, et relinquat post se benedictionem, sacrificium et libamen Domino Deo vestro ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Canite tuba in Sion, sanctificate jejunium, vocate cœtum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>congregate populum, sanctificate ecclesiam, coadunate senes, congregate parvulos, et sugentes ubera ; egrediatur sponsus de cubili suo, et sponsa de thalamo suo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Inter vestibulum et altare plorabunt sacerdotes, ministri Domini, et dicent : Parce, Domine, parce populo tuo ; et ne des hæreditatem tuam in opprobrium, ut dominentur eis nationes. Quare dicunt in populis : Ubi est Deus eorum ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Zelatus est Dominus terram suam, et pepercit populo suo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et respondit Dominus, et dixit populo suo : Ecce ego mittam vobis frumentum, et vinum, et oleum, et replebimini eis ; et non dabo vos ultra opprobrium in gentibus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et eum qui ab aquilone est procul faciam a vobis, et expellam eum in terram inviam et desertam : faciem ejus contra mare orientale, et extremum ejus ad mare novissimum : et ascendet fœtor ejus, et ascendet putredo ejus, quia superbe egit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Noli timere, terra : exsulta, et lætare, quoniam magnificavit Dominus ut faceret.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nolite timere, animalia regionis, quia germinaverunt speciosa deserti ; quia lignum attulit fructum suum, ficus et vinea dederunt virtutem suam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et, filii Sion, exsultate, et lætamini in Domino Deo vestro, quia dedit vobis doctorem justitiæ, et descendere faciet ad vos imbrem matutinum et serotinum, sicut in principio.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et implebuntur areæ frumento, et redundabunt torcularia vino et oleo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et reddam vobis annos, quos comedit locusta, bruchus, et rubigo, et eruca : fortitudo mea magna quam misi in vos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et comedetis vescentes, et saturabimini ; et laudabitis nomen Domini Dei vestri, qui fecit mirabilia vobiscum ; et non confundetur populus meus in sempiternum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et scietis quia in medio Israël ego sum, et ego Dominus Deus vester, et non est amplius ; et non confundetur populus meus in æternum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et erit post hæc : effundam spiritum meum super omnem carnem, et prophetabunt filii vestri et filiæ vestræ : senes vestri somnia somniabunt, et juvenes vestri visiones videbunt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Sed et super servos meos et ancillas in diebus illis effundam spiritum meum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et dabo prodigia in cælo et in terra, sanguinem, et ignem, et vaporem fumi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sol convertetur in tenebras, et luna in sanguinem, antequam veniat dies Domini magnus et horribilis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et erit : omnis qui invocaverit nomen Domini, salvus erit : quia in monte Sion et in Jerusalem erit salvatio, sicut dixit Dominus, et in residuis quos Dominus vocaverit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOL/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joel 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOL/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Joel 3</span></span><svg viewBox="0 0 24 24" fill="none" str verse\":6,\"text\":\"At their presence the people shall be in grievous pains: all faces shall be made like a kettle.\"},{\"verse\":7,\"text\":\"They shall run like valiant men: like men of war they shall scale the wall: the men shall march every one on his way, and they shall not turn aside from their ranks.\"},{\"verse\":8,\"text\":\"No one shall press upon his brother: they shall walk every one in his path: yea, and they shall fall through the windows, and shall take no harm.\"},{\"verse\":9,\"text\":\"They shall enter into the city: they shall run upon the wall, they shall climb up the houses, they shall come in at the windows, as a thief.\"},{\"verse\":10,\"text\":\"At their presence the earth hath trembled, the heavens are moved: the sun and moon are darkened, and the stars have withdrawn their shining.\"},{\"verse\":11,\"text\":\"And the Lord hath uttered his voice before the face of his army: for his armies are exceedingly great, for they are strong, and execute his word: for the day of the Lord is great and very terrible: and who can stand it?\"},{\"verse\":12,\"text\":\"Now, therefore, saith the Lord. Be converted to me with all your heart, in fasting, and in weeping, and in mourning.\"},{\"verse\":13,\"text\":\"And rend your hearts, and not your garments and turn to the Lord your God: for he is gracious and merciful, patient and rich in mercy, and ready to repent of the evil.\"},{\"verse\":14,\"text\":\"Who knoweth but he will return, and forgive, and leave a blessing behind him, sacrifice and libation to the Lord your God?\"},{\"verse\":15,\"text\":\"Blow the trumpet in Sion, sanctify a fast, call a solemn assembly,\"},{\"verse\":16,\"text\":\"Gather together the people, sanctify the church, assemble the ancients, gather together the little ones, and them that suck at the breasts: let the bridegroom go forth from his bed, and the bride out of her bridal chamber.\"},{\"verse\":17,\"text\":\"Between the porch and the altar the priests, the Lord’s ministers, shall weep, and shall say: Spare, O Lord, spare thy people: and give not thy inheritance to reproach, that the heathens should rule over them. Why should they say among the nations: Where is their God?\"},{\"verse\":18,\"text\":\"The Lord hath been zealous for his land, and hath spared his people.\"},{\"verse\":19,\"text\":\"And the Lord answered, and said to his people: Behold I will send you corn, and wine, and oil, and you shall be filled with them: and I will no more make you a reproach among the nations.\"},{\"verse\":20,\"text\":\"And I will remove far off from you the northern enemy: and I will drive him into a land unpassable, and desert, with his face towards the east sea, and his hinder part towards the utmost sea: and his stench shall ascend, and his rottenness shall go up, because he hath done proudly.\"},{\"verse\":21,\"text\":\"Fear not, O land, be glad, and rejoice: for the Lord hath done great things.\"},{\"verse\":22,\"text\":\"Fear not, ye beasts of the fields: for the beautiful places of the wilderness are sprung, for the tree hath brought forth its fruit, the fig tree, and the vine have yielded their strength.\"},{\"verse\":23,\"text\":\"And you, O children of Sion, rejoice, and be joyful in the Lord your God: because he hath given you a teacher of justice, and he will make the early and the latter rain to come down to you as in the beginning.\"},{\"verse\":24,\"text\":\"And the floors shall be filled with wheat, and the presses shall overflow with wine, and oil.\"},{\"verse\":25,\"text\":\"And I will restore to you the years which the locust, and the bruchus, and the mildew, and the palmerworm hath eaten; my great host which I sent upon you.\"},{\"verse\":26,\"text\":\"And you shall eat in plenty, and shall be filled and you shall praise the name of the Lord your God; who hath done wonders with you, and my people shall not be confounded for ever.\"},{\"verse\":27,\"text\":\"And you shall know that I am in the midst of Israel: and I am the Lord your God, and there is none besides: and my people shall not be confounded forever.\"},{\"verse\":28,\"text\":\"And it shall come to pass after this, that I will pour out my spirit upon all flesh: and your sons and your daughters shall prophesy: your old men shall dream dreams, and your young men shall see visions.\"},{\"verse\":29,\"text\":\"Moreover, upon my servants and handmaids in those days I will pour forth my spirit.\"},{\"verse\":30,\"text\":\"And I will shew wonders in heaven; and in earth, blood, and fire, and vapour of smoke.\"},{\"verse\":31,\"text\":\"The sun shall be turned into darkness, and the moon into blood: before the great and dreadful day of the Lord doth come.\"},{\"verse\":32,\"text\":\"And it shall come to pass, that every one that shall call upon the name of the Lord, shall be saved: for in Mount Sion, and in Jerusalem shall be salvation, as the Lord hath said, and in the residue whom the Lord shall call.\"}],\"vul\":[{\"verse\":1,\"text\":\"Canite tuba in Sion, ululate in monte sancto meo, conturbentur omnes habitatores terræ : quia venit dies Domini, quia prope est.\"},{\"verse\":2,\"text\":\"Dies tenebrarum et caliginis, dies nubis et turbinis ; quasi mane expansum super montes populus multus et fortis : similis ei non fuit a principio, et post eum non erit usque in annos generationis et generationis.\"},{\"verse\":3,\"text\":\"Ante faciem ejus ignis vorans, et post eum exurens flamma. Quasi hortus voluptatis terra coram eo, et post eum solitudo deserti, neque est qui effugiat eum.\"},{\"verse\":4,\"text\":\"Quasi aspectus equorum, aspectus eorum ; et quasi equites, sic current.\"},{\"verse\":5,\"text\":\"Sicut sonitus quadrigarum super capita montium exilient, sicut sonitus flammæ ignis devorantis stipulam, velut populus fortis præparatus ad prælium.\"},{\"verse\":6,\"text\":\"A facie ejus cruciabuntur populi ; omnes vultus redigentur in ollam.\"},{\"verse\":7,\"text\":\"Sicut fortes current ; quasi viri bellatores ascendent murum : viri in viis suis gradientur, et non declinabunt a semitis suis.\"},{\"verse\":8,\"text\":\"Unusquisque fratrem suum non coarctabit, singuli in calle suo ambulabunt ; sed et per fenestras cadent, et non demolientur.\"},{\"verse\":9,\"text\":\"Urbem ingredientur, in muro current, domos conscendent, per fenestras intrabunt quasi fur.\"},{\"verse\":10,\"text\":\"A facie ejus contremuit terra, moti sunt cæli, sol et luna obtenebrati sunt, et stellæ retraxerunt splendorem suum.\"},{\"verse\":11,\"text\":\"Et Dominus dedit vocem suam ante faciem exercitus sui, quia multa sunt nimis castra ejus, quia fortia et facientia verbum ejus : magnus enim dies Domini, et terribilis valde, et quis sustinebit eum ?\"},{\"verse\":12,\"text\":\"Nunc ergo, dicit Dominus, convertimini ad me in toto corde vestro, in jejunio, et in fletu, et in planctu.\"},{\"verse\":13,\"text\":\"Et scindite corda vestra, et non vestimenta vestra ; et convertimini ad Dominum Deum vestrum, quia benignus et misericors est, patiens et multæ misericordiæ, et præstabilis super malitia.\"},{\"verse\":14,\"text\":\"Quis scit si convertatur, et ignoscat, et relinquat post se benedictionem, sacrificium et libamen Domino Deo vestro ?\"},{\"verse\":15,\"text\":\"Canite tuba in Sion, sanctificate jejunium, vocate cœtum :\"},{\"verse\":16,\"text\":\"congregate populum, sanctificate ecclesiam, coadunate senes, congregate parvulos, et sugentes ubera ; egrediatur sponsus de cubili suo, et sponsa de thalamo suo.\"},{\"verse\":17,\"text\":\"Inter vestibulum et altare plorabunt sacerdotes, ministri Domini, et dicent : Parce, Domine, parce populo tuo ; et ne des hæreditatem tuam in opprobrium, ut dominentur eis nationes. Quare dicunt in populis : Ubi est Deus eorum ?\"},{\"verse\":18,\"text\":\"Zelatus est Dominus terram suam, et pepercit populo suo.\"},{\"verse\":19,\"text\":\"Et respondit Dominus, et dixit populo suo : Ecce ego mittam vobis frumentum, et vinum, et oleum, et replebimini eis ; et non dabo vos ultra opprobrium in gentibus.\"},{\"verse\":20,\"text\":\"Et eum qui ab aquilone est procul faciam a vobis, et expellam eum in terram inviam et desertam : faciem ejus contra mare orientale, et extremum ejus ad mare novissimum : et ascendet fœtor ejus, et ascendet putredo ejus, quia superbe egit.\"},{\"verse\":21,\"text\":\"Noli timere, terra : exsulta, et lætare, quoniam magnificavit Dominus ut faceret.\"},{\"verse\":22,\"text\":\"Nolite timere, animalia regionis, quia germinaverunt speciosa deserti ; quia lignum attulit fructum suum, ficus et vinea dederunt virtutem suam.\"},{\"verse\":23,\"text\":\"Et, filii Sion, exsultate, et lætamini in Domino Deo vestro, quia dedit vobis doctorem justitiæ, et descendere faciet ad vos imbrem matutinum et serotinum, sicut in principio.\"},{\"verse\":24,\"text\":\"Et implebuntur areæ frumento, et redundabunt torcularia vino et oleo.\"},{\"verse\":25,\"text\":\"Et reddam vobis annos, quos comedit locusta, bruchus, et rubigo, et eruca : fortitudo mea magna quam misi in vos.\"},{\"verse\":26,\"text\":\"Et comedetis vescentes, et saturabimini ; et laudabitis nomen Domini Dei vestri, qui fecit mirabilia vobiscum ; et non confundetur populus meus in sempiternum.\"},{\"verse\":27,\"text\":\"Et scietis quia in medio Israël ego sum, et ego Dominus Deus vester, et non est amplius ; et non confundetur populus meus in æternum.\"},{\"verse\":28,\"text\":\"Et erit post hæc : effundam spiritum meum super omnem carnem, et prophetabunt filii vestri et filiæ vestræ : senes vestri somnia somniabunt, et juvenes vestri visiones videbunt.\"},{\"verse\":29,\"text\":\"Sed et super servos meos et ancillas in diebus illis effundam spiritum meum.\"},{\"verse\":30,\"text\":\"Et dabo prodigia in cælo et in terra, sanguinem, et ignem, et vaporem fumi.\"},{\"verse\":31,\"text\":\"Sol convertetur in tenebras, et luna in sanguinem, antequam veniat dies Domini magnus et horribilis.\"},{\"verse\":32,\"text\":\"Et erit : omnis qui invocaverit nomen Domini, salvus erit : quia in monte Sion et in Jerusalem erit salvatio, sicut dixit Dominus, et in residuis quos Dominus vocaverit.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOL\",\"chapter\":1,\"label\":\"Joel 1\"},\"next\":{\"usfm\":\"JOL\",\"chapter\":3,\"label\":\"Joel 3\"}}]]\n"])</script></body></html>
