 Juda, and Jerusalem:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will gather together all nations and will bring them down into the valley of Josaphat: and I will plead with them there for my people, and for my inheritance, Israel, whom they have scattered among the nations, and have parted my land.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And they have cast lots upon my people: and the boy they have put in the stews, and the girl they have sold for wine, that they might drink.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But what have you to do with me, O Tyre, and Sidon, and all the coast of the Philistines? will you revenge yourselves on me? and if you revenge yourselves on me, I will very soon return you a recompense upon your own head.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For you have taken away my silver, and my gold: and my desirable, and most beautiful things you have carried into your temples.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the children of Juda, and the children of Jerusalem, you have sold to the children of the Greeks, that you might remove them far off from their own country.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Behold, I will raise them up out of the place wherein you have sold them: and I will return your recompense upon your own heads.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I will sell your sons, and your daughters, by the hands of the children of Juda, and they shall sell them to the Sabeans, a nation far off, for the Lord hath spoken it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Proclaim ye this among the nations: Prepare war, rouse up the strong: let them come, let all the men of war come up.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cut your ploughshares into swords, and your spades into spears. Let the weak say: I am strong.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Break forth, and come, all ye nations from round about, and gather yourselves together: there will the Lord cause all thy strong ones to fall down.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Let them arise, and let the nations come up into the valley of Josaphat: for there I will sit to judge all nations round about.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Put ye in the sickles, for the harvest is ripe: come and go down, for the press is full, the fats run over: for their wickedness is multiplied.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nations, nations in the valley of destruction: for the day of the Lord is near in the valley of destruction.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The sun and the moon are darkened, and the stars have withdrawn their shining.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Lord shall roar out of Sion, and utter his voice from Jerusalem: and the heavens and the earth shall be moved, and the Lord shall be the hope of his people, and the strength of the children of Israel.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And you shall know that I am the Lord your God, dwelling in Sion, my holy mountain: and Jerusalem shall be holy, and strangers shall pass through it no more.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And it shall come to pass in that day, that the mountains shall drop down sweetness, and the hills shall flow with milk: and waters shall flow through all the rivers of Juda: and a fountain shall come forth of the house of the Lord, and shall water the torrent of thorns.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Egypt shall be a desolation, and Edom a wilderness destroyed: because they have done unjustly against the children of Juda, and have shed innocent blood in their land.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Judea shall be inhabited for ever, and Jerusalem to generation and generation.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I will cleanse their blood, which I had not cleansed: and the Lord will dwell in Sion.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quia ecce in diebus illis, et in tempore illo, cum convertero captivitatem Juda et Jerusalem,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>congregabo omnes gentes, et deducam eas in vallem Josaphat ; et disceptabo cum eis ibi super populo meo, et hæreditate mea Israël, quos disperserunt in nationibus, et terram meam diviserunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et super populum meum miserunt sortem ; et posuerunt puerum in prostibulo, et puellam vendiderunt pro vino ut biberent.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Verum quid mihi et vobis, Tyrus et Sidon, et omnis terminus Palæstinorum ? numquid ultionem vos reddetis mihi ? et si ulciscimini vos contra me, cito velociter reddam vicissitudinem vobis super caput vestrum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Argentum enim meum et aurum tulistis, et desiderabilia mea et pulcherrima intulistis in delubra vestra.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et filios Juda et filios Jerusalem vendidistis filiis Græcorum, ut longe faceretis eos de finibus suis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ecce ego suscitabo eos de loco in quo vendidistis eos, et convertam retributionem vestram in caput vestrum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et vendam filios vestros et filias vestras in manibus filiorum Juda, et venundabunt eos Sabæis, genti longinquæ, quia Dominus locutus est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Clamate hoc in gentibus, sanctificate bellum, suscitate robustos : accedant, ascendant omnes viri bellatores.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Concidite aratra vestra in gladios, et ligones vestros in lanceas. Infirmus dicat : Quia fortis ego sum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Erumpite, et venite, omnes gentes de circuitu, et congregamini ; ibi occumbere faciet Dominus robustos tuos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Consurgant, et ascendant gentes in vallem Josaphat, quia ibi sedebo ut judicem omnes gentes in circuitu.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mittite falces, quoniam maturavit messis ; venite, et descendite, quia plenum est torcular, exuberant torcularia : quia multiplicata est malitia eorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Populi, populi, in valle concisionis, quia juxta est dies Domini in valle concisionis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sol et luna obtenebrati sunt, et stellæ retraxerunt splendorem suum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et Dominus de Sion rugiet, et de Jerusalem dabit vocem suam, et movebuntur cæli et terra ; et Dominus spes populi sui, et fortitudo filiorum Israël.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et scietis quia ego Dominus Deus vester, habitans in Sion monte sancto meo ; et erit Jerusalem sancta, et alieni non transibunt per eam amplius.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et erit in die illa : stillabunt montes dulcedinem, et colles fluent lacte, et per omnes rivos Juda ibunt aquæ ; et fons de domo Domini egredietur, et irrigabit torrentem spinarum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ægyptus in desolationem erit, et Idumæa in desertum perditionis, pro eo quod inique egerint in filios Juda, et effuderint sanguinem innocentem in terra sua.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et Judæa in æternum habitabitur, et Jerusalem in generationem et generationem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et mundabo sanguinem eorum, quem non mundaveram ; et Dominus commorabitur in Sion.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOL/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></pat the valley of Josaphat: and I will plead with them there for my people, and for my inheritance, Israel, whom they have scattered among the nations, and have parted my land.\"},{\"verse\":3,\"text\":\"And they have cast lots upon my people: and the boy they have put in the stews, and the girl they have sold for wine, that they might drink.\"},{\"verse\":4,\"text\":\"But what have you to do with me, O Tyre, and Sidon, and all the coast of the Philistines? will you revenge yourselves on me? and if you revenge yourselves on me, I will very soon return you a recompense upon your own head.\"},{\"verse\":5,\"text\":\"For you have taken away my silver, and my gold: and my desirable, and most beautiful things you have carried into your temples.\"},{\"verse\":6,\"text\":\"And the children of Juda, and the children of Jerusalem, you have sold to the children of the Greeks, that you might remove them far off from their own country.\"},{\"verse\":7,\"text\":\"Behold, I will raise them up out of the place wherein you have sold them: and I will return your recompense upon your own heads.\"},{\"verse\":8,\"text\":\"And I will sell your sons, and your daughters, by the hands of the children of Juda, and they shall sell them to the Sabeans, a nation far off, for the Lord hath spoken it.\"},{\"verse\":9,\"text\":\"Proclaim ye this among the nations: Prepare war, rouse up the strong: let them come, let all the men of war come up.\"},{\"verse\":10,\"text\":\"Cut your ploughshares into swords, and your spades into spears. Let the weak say: I am strong.\"},{\"verse\":11,\"text\":\"Break forth, and come, all ye nations from round about, and gather yourselves together: there will the Lord cause all thy strong ones to fall down.\"},{\"verse\":12,\"text\":\"Let them arise, and let the nations come up into the valley of Josaphat: for there I will sit to judge all nations round about.\"},{\"verse\":13,\"text\":\"Put ye in the sickles, for the harvest is ripe: come and go down, for the press is full, the fats run over: for their wickedness is multiplied.\"},{\"verse\":14,\"text\":\"Nations, nations in the valley of destruction: for the day of the Lord is near in the valley of destruction.\"},{\"verse\":15,\"text\":\"The sun and the moon are darkened, and the stars have withdrawn their shining.\"},{\"verse\":16,\"text\":\"And the Lord shall roar out of Sion, and utter his voice from Jerusalem: and the heavens and the earth shall be moved, and the Lord shall be the hope of his people, and the strength of the children of Israel.\"},{\"verse\":17,\"text\":\"And you shall know that I am the Lord your God, dwelling in Sion, my holy mountain: and Jerusalem shall be holy, and strangers shall pass through it no more.\"},{\"verse\":18,\"text\":\"And it shall come to pass in that day, that the mountains shall drop down sweetness, and the hills shall flow with milk: and waters shall flow through all the rivers of Juda: and a fountain shall come forth of the house of the Lord, and shall water the torrent of thorns.\"},{\"verse\":19,\"text\":\"Egypt shall be a desolation, and Edom a wilderness destroyed: because they have done unjustly against the children of Juda, and have shed innocent blood in their land.\"},{\"verse\":20,\"text\":\"And Judea shall be inhabited for ever, and Jerusalem to generation and generation.\"},{\"verse\":21,\"text\":\"And I will cleanse their blood, which I had not cleansed: and the Lord will dwell in Sion.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quia ecce in diebus illis, et in tempore illo, cum convertero captivitatem Juda et Jerusalem,\"},{\"verse\":2,\"text\":\"congregabo omnes gentes, et deducam eas in vallem Josaphat ; et disceptabo cum eis ibi super populo meo, et hæreditate mea Israël, quos disperserunt in nationibus, et terram meam diviserunt.\"},{\"verse\":3,\"text\":\"Et super populum meum miserunt sortem ; et posuerunt puerum in prostibulo, et puellam vendiderunt pro vino ut biberent.\"},{\"verse\":4,\"text\":\"Verum quid mihi et vobis, Tyrus et Sidon, et omnis terminus Palæstinorum ? numquid ultionem vos reddetis mihi ? et si ulciscimini vos contra me, cito velociter reddam vicissitudinem vobis super caput vestrum.\"},{\"verse\":5,\"text\":\"Argentum enim meum et aurum tulistis, et desiderabilia mea et pulcherrima intulistis in delubra vestra.\"},{\"verse\":6,\"text\":\"Et filios Juda et filios Jerusalem vendidistis filiis Græcorum, ut longe faceretis eos de finibus suis.\"},{\"verse\":7,\"text\":\"Ecce ego suscitabo eos de loco in quo vendidistis eos, et convertam retributionem vestram in caput vestrum.\"},{\"verse\":8,\"text\":\"Et vendam filios vestros et filias vestras in manibus filiorum Juda, et venundabunt eos Sabæis, genti longinquæ, quia Dominus locutus est.\"},{\"verse\":9,\"text\":\"Clamate hoc in gentibus, sanctificate bellum, suscitate robustos : accedant, ascendant omnes viri bellatores.\"},{\"verse\":10,\"text\":\"Concidite aratra vestra in gladios, et ligones vestros in lanceas. Infirmus dicat : Quia fortis ego sum.\"},{\"verse\":11,\"text\":\"Erumpite, et venite, omnes gentes de circuitu, et congregamini ; ibi occumbere faciet Dominus robustos tuos.\"},{\"verse\":12,\"text\":\"Consurgant, et ascendant gentes in vallem Josaphat, quia ibi sedebo ut judicem omnes gentes in circuitu.\"},{\"verse\":13,\"text\":\"Mittite falces, quoniam maturavit messis ; venite, et descendite, quia plenum est torcular, exuberant torcularia : quia multiplicata est malitia eorum.\"},{\"verse\":14,\"text\":\"Populi, populi, in valle concisionis, quia juxta est dies Domini in valle concisionis.\"},{\"verse\":15,\"text\":\"Sol et luna obtenebrati sunt, et stellæ retraxerunt splendorem suum.\"},{\"verse\":16,\"text\":\"Et Dominus de Sion rugiet, et de Jerusalem dabit vocem suam, et movebuntur cæli et terra ; et Dominus spes populi sui, et fortitudo filiorum Israël.\"},{\"verse\":17,\"text\":\"Et scietis quia ego Dominus Deus vester, habitans in Sion monte sancto meo ; et erit Jerusalem sancta, et alieni non transibunt per eam amplius.\"},{\"verse\":18,\"text\":\"Et erit in die illa : stillabunt montes dulcedinem, et colles fluent lacte, et per omnes rivos Juda ibunt aquæ ; et fons de domo Domini egredietur, et irrigabit torrentem spinarum.\"},{\"verse\":19,\"text\":\"Ægyptus in desolationem erit, et Idumæa in desertum perditionis, pro eo quod inique egerint in filios Juda, et effuderint sanguinem innocentem in terra sua.\"},{\"verse\":20,\"text\":\"Et Judæa in æternum habitabitur, et Jerusalem in generationem et generationem.\"},{\"verse\":21,\"text\":\"Et mundabo sanguinem eorum, quem non mundaveram ; et Dominus commorabitur in Sion.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOL\",\"chapter\":2,\"label\":\"Joel 2\"},\"next\":{\"usfm\":\"AMO\",\"chapter\":1,\"label\":\"Amos 1\"}}]]\n"])</script></body></html>
