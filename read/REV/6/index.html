s="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And I saw that the Lamb had opened one of the seven seals: and I heard one of the four living creatures, as it were the voice of thunder, saying: Come and see.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And I saw: and behold a white horse, and he that sat on him had a bow, and there was a crown given him, and he went forth conquering that he might conquer.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when he had opened the second seal, I heard the second living creature saying: Come and see.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And there went out another horse that was red. And to him that sat thereon, it was given that he should take peace from the earth: and that they should kill one another. And a great sword was given to him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when he had opened the third seal, I heard the third living creature saying: Come and see. And behold a black horse. And he that sat on him had a pair of scales in his hand.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And I heard, as it were a voice in the midst of the four living creatures, saying: Two pounds of wheat for a penny, and thrice two pounds of barley for a penny: and see thou hurt not the wine and the oil.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when he had opened the fourth seal, I heard the voice of the fourth living creature saying: Come and see.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And behold a pale horse: and he that sat upon him, his name was Death. And hell followed him. And power was given to him over the four parts of the earth, to kill with sword, with famine and with death and with the beasts of the earth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when he had opened the fifth seal, I saw under the altar the souls of them that were slain for the word of God and for the testimony which they held.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they cried with a loud voice, saying: How long, O Lord (Holy and True), dost thou not judge and revenge our blood on them that dwell on the earth?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And white robes were given to every one of them one; And it was said to them that they should rest for a little time till their fellow servants and their brethren, who are to be slain even as they, should be filled up.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And I saw, when he had opened the sixth seal: and behold there was a great earthquake. And the sun became black as sackcloth of hair: and the whole moon became as blood.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the stars from heaven fell upon the earth, as the fig tree casteth its green figs when it is shaken by a great wind.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the heaven departed as a book folded up. And every mountain, and the islands, were moved out of their places.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the kings of the earth and the princes and tribunes and the rich and the strong and every bondman and every freeman hid themselves in the dens and in the rocks of mountains:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they say to the mountains and the rocks: Fall upon us and hide us from the face of him that sitteth upon the throne and from the wrath of the Lamb.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the great day of their wrath is come. And who shall be able to stand?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et vidi quod aperuisset Agnus unum de septem sigillis, et audivi unum de quatuor animalibus, dicens tamquam vocem tonitrui : Veni, et vide.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et vidi : et ecce equus albus, et qui sedebat super illum, habebat arcum, et data est ei corona, et exivit vincens ut vinceret.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et cum aperuisset sigillum secundum, audivi secundum animal, dicens : Veni, et vide.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et exivit alius equus rufus : et qui sedebat super illum, datum est ei ut sumeret pacem de terra, et ut invicem se interficiant, et datus est ei gladius magnus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et cum aperuisset sigillum tertium, audivi tertium animal, dicens : Veni, et vide. Et ecce equus niger : et qui sedebat super illum, habebat stateram in manu sua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et audivi tamquam vocem in medio quatuor animalium dicentium : Bilibris tritici denario et tres bilibres hordei denario, et vinum, et oleum ne læseris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum aperuisset sigillum quartum, audivi vocem quarti animalis dicentis : Veni, et vide.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ecce equus pallidus : et qui sedebat super eum, nomen illi Mors, et infernus sequebatur eum, et data est illi potestas super quatuor partes terræ, interficere gladio, fame, et morte, et bestiis terræ.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et cum aperuisset sigillum quintum, vidi subtus altare animas interfectorum propter verbum Dei, et propter testimonium, quod habebant :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et clamabant voce magna, dicentes : Usquequo Domine (sanctus et verus), non judicas, et non vindicas sanguinem nostrum de iis qui habitant in terra ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et datæ sunt illis singulæ stolæ albæ : et dictum est illis ut requiescerent adhuc tempus modicum donec compleantur conservi eorum, et fratres eorum, qui interficiendi sunt sicut et illi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et vidi cum aperuisset sigillum sextum : et ecce terræmotus magnus factus est, et sol factus est niger tamquam saccus cilicinus : et luna tota facta est sicut sanguis :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et stellæ de cælo ceciderunt super terram, sicut ficus emittit grossos suos cum a vento magno movetur :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et cælum recessit sicut liber involutus : et omnis mons, et insulæ de locis suis motæ sunt :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et reges terræ, et principes, et tribuni, et divites, et fortes, et omnis servus, et liber absconderunt se in speluncis, et in petris montium :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et dicunt montibus, et petris : Cadite super nos, et abscondite nos a facie sedentis super thronum, et ab ira Agni :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>quoniam venit dies magnus iræ ipsorum : et quis poterit stare ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Revelation 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Revelation 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->22<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Revelation 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center r power was given to him over the four parts of the earth, to kill with sword, with famine and with death and with the beasts of the earth.\"},{\"verse\":9,\"text\":\"And when he had opened the fifth seal, I saw under the altar the souls of them that were slain for the word of God and for the testimony which they held.\"},{\"verse\":10,\"text\":\"And they cried with a loud voice, saying: How long, O Lord (Holy and True), dost thou not judge and revenge our blood on them that dwell on the earth?\"},{\"verse\":11,\"text\":\"And white robes were given to every one of them one; And it was said to them that they should rest for a little time till their fellow servants and their brethren, who are to be slain even as they, should be filled up.\"},{\"verse\":12,\"text\":\"And I saw, when he had opened the sixth seal: and behold there was a great earthquake. And the sun became black as sackcloth of hair: and the whole moon became as blood.\"},{\"verse\":13,\"text\":\"And the stars from heaven fell upon the earth, as the fig tree casteth its green figs when it is shaken by a great wind.\"},{\"verse\":14,\"text\":\"And the heaven departed as a book folded up. And every mountain, and the islands, were moved out of their places.\"},{\"verse\":15,\"text\":\"And the kings of the earth and the princes and tribunes and the rich and the strong and every bondman and every freeman hid themselves in the dens and in the rocks of mountains:\"},{\"verse\":16,\"text\":\"And they say to the mountains and the rocks: Fall upon us and hide us from the face of him that sitteth upon the throne and from the wrath of the Lamb.\"},{\"verse\":17,\"text\":\"For the great day of their wrath is come. And who shall be able to stand?\"}],\"vul\":[{\"verse\":1,\"text\":\"Et vidi quod aperuisset Agnus unum de septem sigillis, et audivi unum de quatuor animalibus, dicens tamquam vocem tonitrui : Veni, et vide.\"},{\"verse\":2,\"text\":\"Et vidi : et ecce equus albus, et qui sedebat super illum, habebat arcum, et data est ei corona, et exivit vincens ut vinceret.\"},{\"verse\":3,\"text\":\"Et cum aperuisset sigillum secundum, audivi secundum animal, dicens : Veni, et vide.\"},{\"verse\":4,\"text\":\"Et exivit alius equus rufus : et qui sedebat super illum, datum est ei ut sumeret pacem de terra, et ut invicem se interficiant, et datus est ei gladius magnus.\"},{\"verse\":5,\"text\":\"Et cum aperuisset sigillum tertium, audivi tertium animal, dicens : Veni, et vide. Et ecce equus niger : et qui sedebat super illum, habebat stateram in manu sua.\"},{\"verse\":6,\"text\":\"Et audivi tamquam vocem in medio quatuor animalium dicentium : Bilibris tritici denario et tres bilibres hordei denario, et vinum, et oleum ne læseris.\"},{\"verse\":7,\"text\":\"Et cum aperuisset sigillum quartum, audivi vocem quarti animalis dicentis : Veni, et vide.\"},{\"verse\":8,\"text\":\"Et ecce equus pallidus : et qui sedebat super eum, nomen illi Mors, et infernus sequebatur eum, et data est illi potestas super quatuor partes terræ, interficere gladio, fame, et morte, et bestiis terræ.\"},{\"verse\":9,\"text\":\"Et cum aperuisset sigillum quintum, vidi subtus altare animas interfectorum propter verbum Dei, et propter testimonium, quod habebant :\"},{\"verse\":10,\"text\":\"et clamabant voce magna, dicentes : Usquequo Domine (sanctus et verus), non judicas, et non vindicas sanguinem nostrum de iis qui habitant in terra ?\"},{\"verse\":11,\"text\":\"Et datæ sunt illis singulæ stolæ albæ : et dictum est illis ut requiescerent adhuc tempus modicum donec compleantur conservi eorum, et fratres eorum, qui interficiendi sunt sicut et illi.\"},{\"verse\":12,\"text\":\"Et vidi cum aperuisset sigillum sextum : et ecce terræmotus magnus factus est, et sol factus est niger tamquam saccus cilicinus : et luna tota facta est sicut sanguis :\"},{\"verse\":13,\"text\":\"et stellæ de cælo ceciderunt super terram, sicut ficus emittit grossos suos cum a vento magno movetur :\"},{\"verse\":14,\"text\":\"et cælum recessit sicut liber involutus : et omnis mons, et insulæ de locis suis motæ sunt :\"},{\"verse\":15,\"text\":\"et reges terræ, et principes, et tribuni, et divites, et fortes, et omnis servus, et liber absconderunt se in speluncis, et in petris montium :\"},{\"verse\":16,\"text\":\"et dicunt montibus, et petris : Cadite super nos, et abscondite nos a facie sedentis super thronum, et ab ira Agni :\"},{\"verse\":17,\"text\":\"quoniam venit dies magnus iræ ipsorum : et quis poterit stare ?\"}],\"summary\":\"What followed upon opening six of the seals.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":5,\"label\":\"Revelation 5\"},\"next\":{\"usfm\":\"REV\",\"chapter\":7,\"label\":\"Revelation 7\"}}]]\n"])</script></body></html>
