st="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And I heard a great voice out of the temple, saying to the seven angels: Go and pour out the seven vials of the wrath of God upon the earth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the first went and poured out his vial upon the earth. And there fell a sore and grievous wound upon men who had the character of the beast: and upon them that adored the image thereof.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the second angel poured out his vial upon the sea. And there came blood as it were of a dead man: and every living soul died in the sea.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the third poured out his vial upon the rivers and the fountains of waters. And there was made blood.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I heard the angel of the waters saying: Thou art just, O Lord, who art and who wast, the Holy One, because thou hast judged these things.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For they have shed the blood of saints and prophets: and thou hast given them blood to drink. For they are worthy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I heard another, from the altar, saying: Yea, O Lord God Almighty, true and just are thy judgments.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the fourth angel poured out his vial upon the sun. And it was given unto him to afflict men with heat and fire.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And men were scorched with great heat: and they blasphemed the name of God, who hath power over these plagues. Neither did they penance to give him glory.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the fifth angel poured out his vial upon the seat of the beast. And his kingdom became dark: and they gnawed their tongues for pain.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they blasphemed the God of heaven, because of their pains and wounds: and did not penance for their works.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the sixth angel poured out his vial upon that great river Euphrates and dried up the water thereof, that a way might be prepared for the kings from the rising of the sun.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I saw from the mouth of the dragon and from the mouth of the beast and from the mouth of the false prophet, three unclean spirits like frogs.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For they are the spirits of devils, working signs: and they go forth unto the kings of the whole earth, to gather them to battle against the great day of the Almighty God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Behold, I come as a thief. Blessed is he that watcheth and keepeth his garments, lest he walk naked, and they see his shame.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he shall gather them together into a place which in Hebrew is called Armagedon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the seventh angel poured out his vial upon the air. And there came a great voice out of the temple from the throne, saying: It is done.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And there were lightnings and voices and thunders: and there was a great earthquake, such an one as never had been since men were upon the earth, such an earthquake, so great.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the great city was divided into three parts: and the cities of the Gentiles fell. And great Babylon came in remembrance before God, to give her the cup of the wine of the indignation of his wrath.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And every island fled away: and the mountains were not found.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And great hail, like a talent, came down from heaven upon men: and men blasphemed God, for the plague of the hail: because it was exceeding great.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et audivi vocem magnam de templo, dicentem septem angelis : Ite, et effundite septem phialas iræ Dei in terram.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et abiit primus, et effudit phialam suam in terram, et factum est vulnus sævum et pessimum in homines, qui habebant caracterem bestiæ, et in eos qui adoraverunt imaginem ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et secundus angelus effudit phialam suam in mare, et factus est sanguis tamquam mortui : et omnis anima vivens mortua est in mari.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et tertius effudit phialam suam super flumina, et super fontes aquarum, et factus est sanguis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et audivi angelum aquarum dicentem : Justus es, Domine, qui es, et qui eras sanctus, qui hæc judicasti :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>quia sanguinem sanctorum et prophetarum effuderunt, et sanguinem eis dedisti bibere : digni enim sunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et audivi alterum ab altari dicentem : Etiam Domine Deus omnipotens, vera et justa judicia tua.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et quartus angelus effudit phialam suam in solem, et datum est illi æstu affligere homines, et igni :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et æstuaverunt homines æstu magno, et blasphemaverunt nomen Dei habentis potestatem super has plagas, neque egerunt pœnitentiam ut darent illi gloriam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et quintus angelus effudit phialam suam super sedem bestiæ : et factum est regnum ejus tenebrosum, et commanducaverunt linguas suas præ dolore :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et blasphemaverunt Deum cæli præ doloribus, et vulneribus suis, et non egerunt pœnitentiam ex operibus suis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et sextus angelus effudit phialam suam in flumen illud magnum Euphraten : et siccavit aquam ejus, ut præpararetur via regibus ab ortu solis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et vidi de ore draconis, et de ore bestiæ, et de ore pseudoprophetæ spiritus tres immundos in modum ranarum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sunt enim spiritus dæmoniorum facientes signa, et procedunt ad reges totius terræ congregare illos in prælium ad diem magnum omnipotentis Dei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ecce venio sicut fur. Beatus qui vigilat, et custodit vestimenta sua, ne nudus ambulet, et videant turpitudinem ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et congregabit illos in locum qui vocatur hebraice Armagedon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et septimus angelus effudit phialam suam in aërem, et exivit vox magna de templo a throno, dicens : Factum est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et facta sunt fulgura, et voces, et tonitrua, et terræmotus factus est magnus, qualis numquam fuit ex quo homines fuerunt super terram : talis terræmotus, sic magnus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et facta est civitas magna in tres partes : et civitates gentium ceciderunt. Et Babylon magna venit in memoriam ante Deum, dare illi calicem vini indignationis iræ ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et omnis insula fugit, et montes non sunt inventi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et grando magna sicut talentum descendit de cælo in homines : et blasphemaverunt Deum homines propter plagam grandinis : quoniam magna facta est vehementer.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class=" verse\":2,\"text\":\"And the first went and poured out his vial upon the earth. And there fell a sore and grievous wound upon men who had the character of the beast: and upon them that adored the image thereof.\"},{\"verse\":3,\"text\":\"And the second angel poured out his vial upon the sea. And there came blood as it were of a dead man: and every living soul died in the sea.\"},{\"verse\":4,\"text\":\"And the third poured out his vial upon the rivers and the fountains of waters. And there was made blood.\"},{\"verse\":5,\"text\":\"And I heard the angel of the waters saying: Thou art just, O Lord, who art and who wast, the Holy One, because thou hast judged these things.\"},{\"verse\":6,\"text\":\"For they have shed the blood of saints and prophets: and thou hast given them blood to drink. For they are worthy.\"},{\"verse\":7,\"text\":\"And I heard another, from the altar, saying: Yea, O Lord God Almighty, true and just are thy judgments.\"},{\"verse\":8,\"text\":\"And the fourth angel poured out his vial upon the sun. And it was given unto him to afflict men with heat and fire.\"},{\"verse\":9,\"text\":\"And men were scorched with great heat: and they blasphemed the name of God, who hath power over these plagues. Neither did they penance to give him glory.\"},{\"verse\":10,\"text\":\"And the fifth angel poured out his vial upon the seat of the beast. And his kingdom became dark: and they gnawed their tongues for pain.\"},{\"verse\":11,\"text\":\"And they blasphemed the God of heaven, because of their pains and wounds: and did not penance for their works.\"},{\"verse\":12,\"text\":\"And the sixth angel poured out his vial upon that great river Euphrates and dried up the water thereof, that a way might be prepared for the kings from the rising of the sun.\"},{\"verse\":13,\"text\":\"And I saw from the mouth of the dragon and from the mouth of the beast and from the mouth of the false prophet, three unclean spirits like frogs.\"},{\"verse\":14,\"text\":\"For they are the spirits of devils, working signs: and they go forth unto the kings of the whole earth, to gather them to battle against the great day of the Almighty God.\"},{\"verse\":15,\"text\":\"Behold, I come as a thief. Blessed is he that watcheth and keepeth his garments, lest he walk naked, and they see his shame.\"},{\"verse\":16,\"text\":\"And he shall gather them together into a place which in Hebrew is called Armagedon.\"},{\"verse\":17,\"text\":\"And the seventh angel poured out his vial upon the air. And there came a great voice out of the temple from the throne, saying: It is done.\"},{\"verse\":18,\"text\":\"And there were lightnings and voices and thunders: and there was a great earthquake, such an one as never had been since men were upon the earth, such an earthquake, so great.\"},{\"verse\":19,\"text\":\"And the great city was divided into three parts: and the cities of the Gentiles fell. And great Babylon came in remembrance before God, to give her the cup of the wine of the indignation of his wrath.\"},{\"verse\":20,\"text\":\"And every island fled away: and the mountains were not found.\"},{\"verse\":21,\"text\":\"And great hail, like a talent, came down from heaven upon men: and men blasphemed God, for the plague of the hail: because it was exceeding great.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et audivi vocem magnam de templo, dicentem septem angelis : Ite, et effundite septem phialas iræ Dei in terram.\"},{\"verse\":2,\"text\":\"Et abiit primus, et effudit phialam suam in terram, et factum est vulnus sævum et pessimum in homines, qui habebant caracterem bestiæ, et in eos qui adoraverunt imaginem ejus.\"},{\"verse\":3,\"text\":\"Et secundus angelus effudit phialam suam in mare, et factus est sanguis tamquam mortui : et omnis anima vivens mortua est in mari.\"},{\"verse\":4,\"text\":\"Et tertius effudit phialam suam super flumina, et super fontes aquarum, et factus est sanguis.\"},{\"verse\":5,\"text\":\"Et audivi angelum aquarum dicentem : Justus es, Domine, qui es, et qui eras sanctus, qui hæc judicasti :\"},{\"verse\":6,\"text\":\"quia sanguinem sanctorum et prophetarum effuderunt, et sanguinem eis dedisti bibere : digni enim sunt.\"},{\"verse\":7,\"text\":\"Et audivi alterum ab altari dicentem : Etiam Domine Deus omnipotens, vera et justa judicia tua.\"},{\"verse\":8,\"text\":\"Et quartus angelus effudit phialam suam in solem, et datum est illi æstu affligere homines, et igni :\"},{\"verse\":9,\"text\":\"et æstuaverunt homines æstu magno, et blasphemaverunt nomen Dei habentis potestatem super has plagas, neque egerunt pœnitentiam ut darent illi gloriam.\"},{\"verse\":10,\"text\":\"Et quintus angelus effudit phialam suam super sedem bestiæ : et factum est regnum ejus tenebrosum, et commanducaverunt linguas suas præ dolore :\"},{\"verse\":11,\"text\":\"et blasphemaverunt Deum cæli præ doloribus, et vulneribus suis, et non egerunt pœnitentiam ex operibus suis.\"},{\"verse\":12,\"text\":\"Et sextus angelus effudit phialam suam in flumen illud magnum Euphraten : et siccavit aquam ejus, ut præpararetur via regibus ab ortu solis.\"},{\"verse\":13,\"text\":\"Et vidi de ore draconis, et de ore bestiæ, et de ore pseudoprophetæ spiritus tres immundos in modum ranarum.\"},{\"verse\":14,\"text\":\"Sunt enim spiritus dæmoniorum facientes signa, et procedunt ad reges totius terræ congregare illos in prælium ad diem magnum omnipotentis Dei.\"},{\"verse\":15,\"text\":\"Ecce venio sicut fur. Beatus qui vigilat, et custodit vestimenta sua, ne nudus ambulet, et videant turpitudinem ejus.\"},{\"verse\":16,\"text\":\"Et congregabit illos in locum qui vocatur hebraice Armagedon.\"},{\"verse\":17,\"text\":\"Et septimus angelus effudit phialam suam in aërem, et exivit vox magna de templo a throno, dicens : Factum est.\"},{\"verse\":18,\"text\":\"Et facta sunt fulgura, et voces, et tonitrua, et terræmotus factus est magnus, qualis numquam fuit ex quo homines fuerunt super terram : talis terræmotus, sic magnus.\"},{\"verse\":19,\"text\":\"Et facta est civitas magna in tres partes : et civitates gentium ceciderunt. Et Babylon magna venit in memoriam ante Deum, dare illi calicem vini indignationis iræ ejus.\"},{\"verse\":20,\"text\":\"Et omnis insula fugit, et montes non sunt inventi.\"},{\"verse\":21,\"text\":\"Et grando magna sicut talentum descendit de cælo in homines : et blasphemaverunt Deum homines propter plagam grandinis : quoniam magna facta est vehementer.\"}],\"summary\":\"The seven vials are poured out. The plagues that ensue.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":15,\"label\":\"Revelation 15\"},\"next\":{\"usfm\":\"REV\",\"chapter\":17,\"label\":\"Revelation 17\"}}]]\n"])</script></body></html>
