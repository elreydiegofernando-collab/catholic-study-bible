eads, names of blasphemy.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the beast which I saw was like to a leopard: and his feet were as the feet of a bear, and his mouth as the mouth of a lion. And the dragon gave him his own strength and great power.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I saw one of his heads as it were slain to death: and his death’s wound was healed. And all the earth was in admiration after the beast.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they adored the dragon which gave power to the beast. And they adored the beast, saying: Who is like to the beast? And who shall be able to fight with him?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And there was given to him a mouth speaking great things and blasphemies: and power was given to him to do, two and forty months.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he opened his mouth unto blasphemies against God, to blaspheme his name and his tabernacle and them that dwell in heaven.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And it was given unto him to make war with the saints and to overcome them. And power was given him over every tribe and people and tongue and nation.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And all that dwell upon the earth adored him, whose names are not written in the book of life of the Lamb which was slain from the beginning of the world.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If any man have an ear, let him hear.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He that shall lead into captivity shall go into captivity: he that shall kill by the sword must be killed by the sword. Here is the patience and the faith of the saints.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I saw another beast coming up out of the earth: and he had two horns, like a lamb: and he spoke as a dragon.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he executed all the power of the former beast in his sight. And he caused the earth and them that dwell therein to adore the first beast, whose wound to death was healed.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he did great signs, so that he made also fire to come down from heaven unto the earth, in the sight of men.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he seduced them that dwell on the earth, for the signs which were given him to do in the sight of the beast: saying to them that dwell on the earth that they should make the image of the beast which had the wound by the sword and lived.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it was given him to give life to the image of the beast: and that the image of the beast should speak: and should cause that whosoever will not adore the image of the beast should be slain.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he shall make all, both little and great, rich and poor, freemen and bondmen, to have a character in their right hand or on their foreheads:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And that no man might buy or sell, but he that hath the character, or the name of the beast, or the number of his name.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Here is wisdom. He that hath understanding, let him count the number of the beast. For it is the number of a man: and the number of him is six hundred sixty-six.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et vidi de mari bestiam ascendentem habentem capita septem, et cornua decem, et super cornua ejus decem diademata, et super capita ejus nomina blasphemiæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et bestia, quam vidi, similis erat pardo, et pedes ejus sicut pedes ursi, et os ejus sicut os leonis. Et dedit illi draco virtutem suam, et potestatem magnam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et vidi unum de capitibus suis quasi occisum in mortem : et plaga mortis ejus curata est. Et admirata est universa terra post bestiam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et adoraverunt draconem, qui dedit potestatem bestiæ : et adoraverunt bestiam, dicentes : Quis similis bestiæ ? et quis poterit pugnare cum ea ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et datum est ei os loquens magna et blasphemias : et data est ei potestas facere menses quadraginta duos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et aperuit os suum in blasphemias ad Deum, blasphemare nomen ejus, et tabernaculum ejus, et eos qui in cælo habitant.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et est datum illi bellum facere cum sanctis, et vincere eos. Et data est illi potestas in omnem tribum, et populum, et linguam, et gentem,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et adoraverunt eam omnes, qui inhabitant terram : quorum non sunt scripta nomina in libro vitæ Agni, qui occisus est ab origine mundi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si quis habet aurem, audiat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui in captivitatem duxerit, in captivitatem vadet : qui in gladio occiderit, oportet eum gladio occidi. Hic est patientia, et fides sanctorum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et vidi aliam bestiam ascendentem de terra, et habebat cornua duo similia Agni, et loquebatur sicut draco.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et potestatem prioris bestiæ omnem faciebat in conspectu ejus : et fecit terram, et habitantes in ea, adorare bestiam primam, cujus curata est plaga mortis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et fecit signa magna, ut etiam ignem faceret de cælo descendere in terram in conspectu hominum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et seduxit habitantes in terra propter signa, quæ data sunt illi facere in conspectu bestiæ, dicens habitantibus in terra, ut faciant imaginem bestiæ, quæ habet plagam gladii, et vixit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et datum est illi ut daret spiritum imagini bestiæ, et ut loquatur imago bestiæ : et faciat ut quicumque non adoraverint imaginem bestiæ, occidantur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et faciet omnes pusillos, et magnos, et divites, et pauperes, et liberos, et servos habere caracterem in dextera manu sua, aut in frontibus suis :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et nequis possit emere, aut vendere, nisi qui habet caracterem, aut nomen bestiæ, aut numerum nominis ejus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hic sapientia est. Qui habet intellectum, computet numerum bestiæ. Numerus enim hominis est : et numerus ejus sexcenti sexaginta sex.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Revelation 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Revelation 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->22<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Revelation 12" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border bord t>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"REV.13\",{\"bookId\":73,\"usfm\":\"REV\",\"bookName\":\"Revelation\",\"drName\":\"Apocalypse\",\"chapter\":13,\"totalChapters\":22,\"dra\":[{\"verse\":1,\"text\":\"And I saw a beast coming up out of the sea, having seven heads and ten horns: and upon his horns, ten diadems: and upon his heads, names of blasphemy.\"},{\"verse\":2,\"text\":\"And the beast which I saw was like to a leopard: and his feet were as the feet of a bear, and his mouth as the mouth of a lion. And the dragon gave him his own strength and great power.\"},{\"verse\":3,\"text\":\"And I saw one of his heads as it were slain to death: and his death’s wound was healed. And all the earth was in admiration after the beast.\"},{\"verse\":4,\"text\":\"And they adored the dragon which gave power to the beast. And they adored the beast, saying: Who is like to the beast? And who shall be able to fight with him?\"},{\"verse\":5,\"text\":\"And there was given to him a mouth speaking great things and blasphemies: and power was given to him to do, two and forty months.\"},{\"verse\":6,\"text\":\"And he opened his mouth unto blasphemies against God, to blaspheme his name and his tabernacle and them that dwell in heaven.\"},{\"verse\":7,\"text\":\"And it was given unto him to make war with the saints and to overcome them. And power was given him over every tribe and people and tongue and nation.\"},{\"verse\":8,\"text\":\"And all that dwell upon the earth adored him, whose names are not written in the book of life of the Lamb which was slain from the beginning of the world.\"},{\"verse\":9,\"text\":\"If any man have an ear, let him hear.\"},{\"verse\":10,\"text\":\"He that shall lead into captivity shall go into captivity: he that shall kill by the sword must be killed by the sword. Here is the patience and the faith of the saints.\"},{\"verse\":11,\"text\":\"And I saw another beast coming up out of the earth: and he had two horns, like a lamb: and he spoke as a dragon.\"},{\"verse\":12,\"text\":\"And he executed all the power of the former beast in his sight. And he caused the earth and them that dwell therein to adore the first beast, whose wound to death was healed.\"},{\"verse\":13,\"text\":\"And he did great signs, so that he made also fire to come down from heaven unto the earth, in the sight of men.\"},{\"verse\":14,\"text\":\"And he seduced them that dwell on the earth, for the signs which were given him to do in the sight of the beast: saying to them that dwell on the earth that they should make the image of the beast which had the wound by the sword and lived.\"},{\"verse\":15,\"text\":\"And it was given him to give life to the image of the beast: and that the image of the beast should speak: and should cause that whosoever will not adore the image of the beast should be slain.\"},{\"verse\":16,\"text\":\"And he shall make all, both little and great, rich and poor, freemen and bondmen, to have a character in their right hand or on their foreheads:\"},{\"verse\":17,\"text\":\"And that no man might buy or sell, but he that hath the character, or the name of the beast, or the number of his name.\"},{\"verse\":18,\"text\":\"Here is wisdom. He that hath understanding, let him count the number of the beast. For it is the number of a man: and the number of him is six hundred sixty-six.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et vidi de mari bestiam ascendentem habentem capita septem, et cornua decem, et super cornua ejus decem diademata, et super capita ejus nomina blasphemiæ.\"},{\"verse\":2,\"text\":\"Et bestia, quam vidi, similis erat pardo, et pedes ejus sicut pedes ursi, et os ejus sicut os leonis. Et dedit illi draco virtutem suam, et potestatem magnam.\"},{\"verse\":3,\"text\":\"Et vidi unum de capitibus suis quasi occisum in mortem : et plaga mortis ejus curata est. Et admirata est universa terra post bestiam.\"},{\"verse\":4,\"text\":\"Et adoraverunt draconem, qui dedit potestatem bestiæ : et adoraverunt bestiam, dicentes : Quis similis bestiæ ? et quis poterit pugnare cum ea ?\"},{\"verse\":5,\"text\":\"Et datum est ei os loquens magna et blasphemias : et data est ei potestas facere menses quadraginta duos.\"},{\"verse\":6,\"text\":\"Et aperuit os suum in blasphemias ad Deum, blasphemare nomen ejus, et tabernaculum ejus, et eos qui in cælo habitant.\"},{\"verse\":7,\"text\":\"Et est datum illi bellum facere cum sanctis, et vincere eos. Et data est illi potestas in omnem tribum, et populum, et linguam, et gentem,\"},{\"verse\":8,\"text\":\"et adoraverunt eam omnes, qui inhabitant terram : quorum non sunt scripta nomina in libro vitæ Agni, qui occisus est ab origine mundi.\"},{\"verse\":9,\"text\":\"Si quis habet aurem, audiat.\"},{\"verse\":10,\"text\":\"Qui in captivitatem duxerit, in captivitatem vadet : qui in gladio occiderit, oportet eum gladio occidi. Hic est patientia, et fides sanctorum.\"},{\"verse\":11,\"text\":\"Et vidi aliam bestiam ascendentem de terra, et habebat cornua duo similia Agni, et loquebatur sicut draco.\"},{\"verse\":12,\"text\":\"Et potestatem prioris bestiæ omnem faciebat in conspectu ejus : et fecit terram, et habitantes in ea, adorare bestiam primam, cujus curata est plaga mortis.\"},{\"verse\":13,\"text\":\"Et fecit signa magna, ut etiam ignem faceret de cælo descendere in terram in conspectu hominum.\"},{\"verse\":14,\"text\":\"Et seduxit habitantes in terra propter signa, quæ data sunt illi facere in conspectu bestiæ, dicens habitantibus in terra, ut faciant imaginem bestiæ, quæ habet plagam gladii, et vixit.\"},{\"verse\":15,\"text\":\"Et datum est illi ut daret spiritum imagini bestiæ, et ut loquatur imago bestiæ : et faciat ut quicumque non adoraverint imaginem bestiæ, occidantur.\"},{\"verse\":16,\"text\":\"Et faciet omnes pusillos, et magnos, et divites, et pauperes, et liberos, et servos habere caracterem in dextera manu sua, aut in frontibus suis :\"},{\"verse\":17,\"text\":\"et nequis possit emere, aut vendere, nisi qui habet caracterem, aut nomen bestiæ, aut numerum nominis ejus.\"},{\"verse\":18,\"text\":\"Hic sapientia est. Qui habet intellectum, computet numerum bestiæ. Numerus enim hominis est : et numerus ejus sexcenti sexaginta sex.\"}],\"summary\":\"Of the beast with seven heads and of a second beast.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":12,\"label\":\"Revelation 12\"},\"next\":{\"usfm\":\"REV\",\"chapter\":14,\"label\":\"Revelation 14\"}}]]\n"])</script></body></html>
