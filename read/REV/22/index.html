button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In the midst of the street thereof, and on both sides of the river, was the tree of life, bearing twelve fruits, yielding its fruits every month: and the leaves of the tree for the healing of the nations.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And there shall be no curse any more: but the throne of God and of the Lamb shall be in it. And his servants shall serve him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they shall see his face: and his name shall be on their foreheads.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And night shall be no more. And they shall not need the light of the lamp, nor the light of the sun, because the Lord God shall enlighten them. And they shall reign for ever and ever.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said to me: These words are most faithful and true. And the Lord God of the spirits of the prophets sent his angel to shew his servants the things which must be done shortly.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And: Behold I come quickly. Blessed is he that keepeth the words of the prophecy of this book.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I, John, who have heard and seen these things. And, after I had heard and seen, I fell down to adore before the feet of the angel who shewed me these things.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he said to me: See thou do it not. For I am thy fellow servant, and of thy brethren the prophets and of them that keep the words of the prophecy of this book. Adore God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he saith to me: Seal not the words of the prophecy of this book. For the time is at hand.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He that hurteth, let him hurt still: and he that is filthy, let him be filthy still: and he that is just, let him be justified still: and he that is holy, let him be sanctified still.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Behold, I come quickly: and my reward is with me, to render to every, man according to his works.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I am Alpha and Omega, the First and the Last, the Beginning and the End.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Blessed are they that wash their robes in the blood of the Lamb: that they may have a right to the tree of life and may enter in by the gates into the city.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Without are dogs and sorcerers and unchaste and murderers and servers of idols and every one that loveth and maketh a lie.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I, Jesus, have sent my angel, to testify to you these things in the churches. I am the root and stock of David, the bright and morning star.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the spirit and the bride say: Come. And he that heareth, let him say: Come. And he that thirsteth, let him come. And he that will, let him take the water of life, freely.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For I testify to every one that heareth the words of the prophecy of this book: If any man shall add to these things, God shall add unto him the plagues written in this book.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and from these things that are written in this book.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that giveth testimony of these things, saith: Surely, I come quickly: Amen. Come, Lord Jesus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The grace of our Lord Jesus Christ be with you all. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et ostendit mihi fluvium aquæ vitæ, splendidum tamquam crystallum, procedentem de sede Dei et Agni.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In medio plateæ ejus, et ex utraque parte fluminis, lignum vitæ, afferens fructus duodecim per menses singulos, reddens fructum suum et folia ligni ad sanitatem gentium.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et omne maledictum non erit amplius : sed sedes Dei et Agni in illa erunt, et servi ejus servient illi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et videbunt faciem ejus : et nomen ejus in frontibus eorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et nox ultra non erit : et non egebunt lumine lucernæ, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in sæcula sæculorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et dixit mihi : Hæc verba fidelissima sunt, et vera. Et Dominus Deus spirituum prophetarum misit angelum suum ostendere servis suis quæ oportet fieri cito.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ecce venio velociter. Beatus, qui custodit verba prophetiæ libri hujus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ego Joannes, qui audivi, et vidi hæc. Et postquam audissem, et vidissem, cecidi ut adorarem ante pedes angeli, qui mihi hæc ostendebat :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et dixit mihi : Vide ne feceris : conservus enim tuus sum, et fratrum tuorum prophetarum, et eorum qui servant verba prophetiæ libri hujus : Deum adora.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et dicit mihi : Ne signaveris verba prophetiæ libri hujus : tempus enim prope est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui nocet, noceat adhuc : et qui in sordibus est, sordescat adhuc : et qui justus est, justificetur adhuc : et sanctus, sanctificetur adhuc.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ecce venio cito, et merces mea mecum est, reddere unicuique secundum opera sua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ego sum alpha et omega, primus et novissimus, principium et finis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Beati, qui lavant stolas suas in sanguine Agni : ut sit potestas eorum in ligno vitæ, et per portas intrent in civitatem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Foris canes, et venefici, et impudici, et homicidæ, et idolis servientes, et omnis qui amat et facit mendacium.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ego Jesus misi angelum meum testificari vobis hæc in ecclesiis. Ego sum radix, et genus David, stella splendida et matutina.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et spiritus, et sponsa dicunt : Veni. Et qui audit, dicat : Veni. Et qui sitit, veniat : et qui vult, accipiat aquam vitæ, gratis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Contestor enim omni audienti verba prophetiæ libri hujus : si quis apposuerit ad hæc, apponet Deus super illum plagas scriptas in libro isto.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et si quis diminuerit de verbis libri prophetiæ hujus, auferet Deus partem ejus de libro vitæ, et de civitate sancta, et de his quæ scripta sunt in libro isto :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>dicit qui testimonium perhibet istorum. Etiam venio cito : amen. Veni, Domine Jesu.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Gratia Domini nostri Jesu Christi cum omnibus vobis. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Revelation 21</span></span></a><span></span></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->22<!-- --> of <!-- -->22<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t I am thy fellow servant, and of thy brethren the prophets and of them that keep the words of the prophecy of this book. Adore God.\"},{\"verse\":10,\"text\":\"And he saith to me: Seal not the words of the prophecy of this book. For the time is at hand.\"},{\"verse\":11,\"text\":\"He that hurteth, let him hurt still: and he that is filthy, let him be filthy still: and he that is just, let him be justified still: and he that is holy, let him be sanctified still.\"},{\"verse\":12,\"text\":\"Behold, I come quickly: and my reward is with me, to render to every, man according to his works.\"},{\"verse\":13,\"text\":\"I am Alpha and Omega, the First and the Last, the Beginning and the End.\"},{\"verse\":14,\"text\":\"Blessed are they that wash their robes in the blood of the Lamb: that they may have a right to the tree of life and may enter in by the gates into the city.\"},{\"verse\":15,\"text\":\"Without are dogs and sorcerers and unchaste and murderers and servers of idols and every one that loveth and maketh a lie.\"},{\"verse\":16,\"text\":\"I, Jesus, have sent my angel, to testify to you these things in the churches. I am the root and stock of David, the bright and morning star.\"},{\"verse\":17,\"text\":\"And the spirit and the bride say: Come. And he that heareth, let him say: Come. And he that thirsteth, let him come. And he that will, let him take the water of life, freely.\"},{\"verse\":18,\"text\":\"For I testify to every one that heareth the words of the prophecy of this book: If any man shall add to these things, God shall add unto him the plagues written in this book.\"},{\"verse\":19,\"text\":\"And if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and from these things that are written in this book.\"},{\"verse\":20,\"text\":\"He that giveth testimony of these things, saith: Surely, I come quickly: Amen. Come, Lord Jesus.\"},{\"verse\":21,\"text\":\"The grace of our Lord Jesus Christ be with you all. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et ostendit mihi fluvium aquæ vitæ, splendidum tamquam crystallum, procedentem de sede Dei et Agni.\"},{\"verse\":2,\"text\":\"In medio plateæ ejus, et ex utraque parte fluminis, lignum vitæ, afferens fructus duodecim per menses singulos, reddens fructum suum et folia ligni ad sanitatem gentium.\"},{\"verse\":3,\"text\":\"Et omne maledictum non erit amplius : sed sedes Dei et Agni in illa erunt, et servi ejus servient illi.\"},{\"verse\":4,\"text\":\"Et videbunt faciem ejus : et nomen ejus in frontibus eorum.\"},{\"verse\":5,\"text\":\"Et nox ultra non erit : et non egebunt lumine lucernæ, neque lumine solis, quoniam Dominus Deus illuminabit illos, et regnabunt in sæcula sæculorum.\"},{\"verse\":6,\"text\":\"Et dixit mihi : Hæc verba fidelissima sunt, et vera. Et Dominus Deus spirituum prophetarum misit angelum suum ostendere servis suis quæ oportet fieri cito.\"},{\"verse\":7,\"text\":\"Et ecce venio velociter. Beatus, qui custodit verba prophetiæ libri hujus.\"},{\"verse\":8,\"text\":\"Et ego Joannes, qui audivi, et vidi hæc. Et postquam audissem, et vidissem, cecidi ut adorarem ante pedes angeli, qui mihi hæc ostendebat :\"},{\"verse\":9,\"text\":\"et dixit mihi : Vide ne feceris : conservus enim tuus sum, et fratrum tuorum prophetarum, et eorum qui servant verba prophetiæ libri hujus : Deum adora.\"},{\"verse\":10,\"text\":\"Et dicit mihi : Ne signaveris verba prophetiæ libri hujus : tempus enim prope est.\"},{\"verse\":11,\"text\":\"Qui nocet, noceat adhuc : et qui in sordibus est, sordescat adhuc : et qui justus est, justificetur adhuc : et sanctus, sanctificetur adhuc.\"},{\"verse\":12,\"text\":\"Ecce venio cito, et merces mea mecum est, reddere unicuique secundum opera sua.\"},{\"verse\":13,\"text\":\"Ego sum alpha et omega, primus et novissimus, principium et finis.\"},{\"verse\":14,\"text\":\"Beati, qui lavant stolas suas in sanguine Agni : ut sit potestas eorum in ligno vitæ, et per portas intrent in civitatem.\"},{\"verse\":15,\"text\":\"Foris canes, et venefici, et impudici, et homicidæ, et idolis servientes, et omnis qui amat et facit mendacium.\"},{\"verse\":16,\"text\":\"Ego Jesus misi angelum meum testificari vobis hæc in ecclesiis. Ego sum radix, et genus David, stella splendida et matutina.\"},{\"verse\":17,\"text\":\"Et spiritus, et sponsa dicunt : Veni. Et qui audit, dicat : Veni. Et qui sitit, veniat : et qui vult, accipiat aquam vitæ, gratis.\"},{\"verse\":18,\"text\":\"Contestor enim omni audienti verba prophetiæ libri hujus : si quis apposuerit ad hæc, apponet Deus super illum plagas scriptas in libro isto.\"},{\"verse\":19,\"text\":\"Et si quis diminuerit de verbis libri prophetiæ hujus, auferet Deus partem ejus de libro vitæ, et de civitate sancta, et de his quæ scripta sunt in libro isto :\"},{\"verse\":20,\"text\":\"dicit qui testimonium perhibet istorum. Etiam venio cito : amen. Veni, Domine Jesu.\"},{\"verse\":21,\"text\":\"Gratia Domini nostri Jesu Christi cum omnibus vobis. Amen.\"}],\"summary\":\"The water and tree of life. The conclusion.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":21,\"label\":\"Revelation 21\"},\"next\":null}]]\n"])</script></body></html>
