data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And I, John, saw the holy city, the new Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I heard a great voice from the throne, saying: Behold the tabernacle of God with men: and he will dwell with them. And they shall be his people: and God himself with them shall be their God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And God shall wipe away all tears from their eyes: and death shall be no more. Nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he that sat on the throne, said: Behold, I make all things new. And he said to me: Write. For these words are most faithful and true.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said to me: It is done. I am Alpha and Omega: the Beginning and the End. To him that thirsteth, I will give of the fountain of the water of life, freely.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that shall overcome shall possess these things. And I will be his God: and he shall be my son.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the fearful and unbelieving and the abominable and murderers and whoremongers and sorcerers and idolaters and all liars, they shall have their portion in the pool burning with fire and brimstone, which is the second death.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And there came one of the seven angels, who had the vials full of the seven last plagues, and spoke with me, saying: Come and I will shew thee the bride, the wife of the Lamb.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he took me up in spirit to a great and high mountain: and he shewed me the holy city Jerusalem, coming down out of heaven from God,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Having the glory of God, and the light thereof was like to a precious stone, as to the jasper stone even as crystal.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And it had a wall great and high, having twelve gates, and in the gates twelve angels, and names written thereon, which are the names of the twelve tribes of the children of Israel.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>On the east, three gates: and on the north, three gates: and on the south, three gates: and on the west, three gates.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the wall of the city had twelve foundations: And in them, the twelve names of the twelve apostles of the Lamb,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he that spoke with me had a measure of a reed of gold, to measure the city and the gates thereof and the wall.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the city lieth in a four-square: and the length thereof is as great as the breadth. And he measured the city with the golden reed for twelve thousand furlongs: and the length and the height and the breadth thereof are equal.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he measured the wall thereof an hundred forty-four cubits, the measure of a man, which is of an angel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the building of the wall thereof was of jasper stone: but the city itself pure gold like to clear glass.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the foundations of the wall of the city were adorned with all manner of precious stones. The first foundation was jasper: the second, sapphire: the third; a chalcedony: the fourth, an emerald:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The fifth, sardonyx: the sixth, sardius: the seventh, chrysolite: the eighth, beryl: the ninth, a topaz: the tenth, a chrysoprasus: the eleventh, a jacinth: the twelfth, an amethyst.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the twelve gates are twelve pearls, one to each: and every several gate was of one several pearl. And the street of the city was pure gold, as it were, transparent glass.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And I saw no temple therein. For the Lord God Almighty is the temple thereof, and the Lamb.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the city hath no need of the sun, nor of the moon, to shine in it. For the glory of God hath enlightened it: and the Lamb is the lamp thereof.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the nations shall walk in the light of it: and the kings of the earth shall bring their glory and honour into it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the gates thereof shall not be shut by day: for there shall be no night there.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they shall bring the glory and honour of the nations into it.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>There shall not enter into it any thing defiled or that worketh abomination or maketh a lie: but they that are written in the book of life of the Lamb.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et vidi cælum novum et terram novam. Primum enim cælum, et prima terra abiit, et mare jam non est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ego Joannes vidi sanctam civitatem Jerusalem novam descendentem de cælo a Deo, paratam sicut sponsam ornatam viro suo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et audivi vocem magnam de throno dicentem : Ecce tabernaculum Dei cum hominibus, et habitabit cum eis. Et ipsi populus ejus erunt, et ipse Deus cum eis erit eorum Deus :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et absterget Deus omnem lacrimam ab oculis eorum : et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abierunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et dixit qui sedebat in throno : Ecce nova facio omnia. Et dixit mihi : Scribe, quia hæc verba fidelissima sunt, et vera.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et dixit mihi : Factum est : ego sum alpha et omega, initium et finis. Ego sitienti dabo de fonte aquæ vitæ, gratis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui vicerit, possidebit hæc : et ero illi Deus, et ille erit mihi filius.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Timidis autem, et incredulis, et execratis, et homicidis, et fornicatoribus, et veneficis, et idolatris, et omnibus mendacibus, pars illorum erit in stagno ardenti igne et sulphure : quod est mors secunda.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et venit unus de septem angelis habentibus phialas plenas septem plagis novissimis, et locutus est mecum, dicens : Veni, et ostendam tibi sponsam, uxorem Agni.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et sustulit me in spiritu in montem magnum et altum, et ostendit mihi civitatem sanctam Jerusalem descendentem de cælo a Deo,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>habentem claritatem Dei : et lumen ejus simile lapidi pretioso tamquam lapidi jaspidis, sicut crystallum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et habebat murum magnum, et altum, habentem portas duodecim : et in portis angelos duodecim, et nomina inscripta, quæ sunt nomina duodecim tribuum filiorum Israël :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ab oriente portæ tres, et ab aquilone portæ tres, et ab austro portæ tres, et ab occasu portæ tres.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et murus civitatis habens fundamenta duodecim, et in ipsis duodecim nomina duodecim apostolorum Agni.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et qui loquebatur mecum, habebat mensuram arundineam auream, ut metiretur civitatem, et portas ejus, et murum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et civitas in quadro posita est, et longitudo ejus tanta est quanta et latitudo : et mensus est civitatem de arundine aurea per stadia duodecim millia : et longitudo, et altitudo, et latitudo ejus æqualia sunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et mensus est murum ejus centum quadraginta quatuor cubitorum, mensura hominis, quæ est angeli.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et erat structura muri ejus ex lapide jaspide : ipsa vero civitas aurum mundum simile vitro mundo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et fundamenta muri civitatis omni lapide pretioso ornata. Fundamentum primum, jaspis : secundum, sapphirus : tertium, calcedonius : quartum, smaragdus :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quintum, sardonyx : sextum, sardius : septimum, chrysolithus : octavum, beryllus : nonum, topazius : decimum, chrysoprasus : undecimum, hyacinthus : duodecimum, amethystus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et duodecim portæ, duodecim margaritæ sunt, per singulas : et singulæ portæ erant ex singulis margaritis : et platea civitatis aurum mundum, tamquam vitrum perlucidum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et templum non vidi in ea : Dominus enim Deus omnipotens templum illius est, et Agnus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et civitas non eget sole neque luna ut luceant in ea, nam claritas Dei illuminavit eam, et lucerna ejus est Agnus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et ambulabunt gentes in lumine ejus : et reges terræ afferent gloriam suam et honorem in illam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et portæ ejus non claudentur per diem : nox enim non erit illic.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et afferent gloriam et honorem gentium in illam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Non intrabit in eam aliquod coinquinatum, aut abominationem faciens et mendacium, nisi qui scripti sunt in libro vitæ Agni.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Revelation 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/22/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Revelation 22</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->21<!-- --> of <!-- -->22<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Revelation 20" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/20/"><s xt/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"REV.21\",{\"bookId\":73,\"usfm\":\"REV\",\"bookName\":\"Revelation\",\"drName\":\"Apocalypse\",\"chapter\":21,\"totalChapters\":22,\"dra\":[{\"verse\":1,\"text\":\"And I saw a new heaven and a new earth. For the first heaven and the first earth was gone: and the sea is now no more.\"},{\"verse\":2,\"text\":\"And I, John, saw the holy city, the new Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband.\"},{\"verse\":3,\"text\":\"And I heard a great voice from the throne, saying: Behold the tabernacle of God with men: and he will dwell with them. And they shall be his people: and God himself with them shall be their God.\"},{\"verse\":4,\"text\":\"And God shall wipe away all tears from their eyes: and death shall be no more. Nor mourning, nor crying, nor sorrow shall be any more, for the former things are passed away.\"},{\"verse\":5,\"text\":\"And he that sat on the throne, said: Behold, I make all things new. And he said to me: Write. For these words are most faithful and true.\"},{\"verse\":6,\"text\":\"And he said to me: It is done. I am Alpha and Omega: the Beginning and the End. To him that thirsteth, I will give of the fountain of the water of life, freely.\"},{\"verse\":7,\"text\":\"He that shall overcome shall possess these things. And I will be his God: and he shall be my son.\"},{\"verse\":8,\"text\":\"But the fearful and unbelieving and the abominable and murderers and whoremongers and sorcerers and idolaters and all liars, they shall have their portion in the pool burning with fire and brimstone, which is the second death.\"},{\"verse\":9,\"text\":\"And there came one of the seven angels, who had the vials full of the seven last plagues, and spoke with me, saying: Come and I will shew thee the bride, the wife of the Lamb.\"},{\"verse\":10,\"text\":\"And he took me up in spirit to a great and high mountain: and he shewed me the holy city Jerusalem, coming down out of heaven from God,\"},{\"verse\":11,\"text\":\"Having the glory of God, and the light thereof was like to a precious stone, as to the jasper stone even as crystal.\"},{\"verse\":12,\"text\":\"And it had a wall great and high, having twelve gates, and in the gates twelve angels, and names written thereon, which are the names of the twelve tribes of the children of Israel.\"},{\"verse\":13,\"text\":\"On the east, three gates: and on the north, three gates: and on the south, three gates: and on the west, three gates.\"},{\"verse\":14,\"text\":\"And the wall of the city had twelve foundations: And in them, the twelve names of the twelve apostles of the Lamb,\"},{\"verse\":15,\"text\":\"And he that spoke with me had a measure of a reed of gold, to measure the city and the gates thereof and the wall.\"},{\"verse\":16,\"text\":\"And the city lieth in a four-square: and the length thereof is as great as the breadth. And he measured the city with the golden reed for twelve thousand furlongs: and the length and the height and the breadth thereof are equal.\"},{\"verse\":17,\"text\":\"And he measured the wall thereof an hundred forty-four cubits, the measure of a man, which is of an angel.\"},{\"verse\":18,\"text\":\"And the building of the wall thereof was of jasper stone: but the city itself pure gold like to clear glass.\"},{\"verse\":19,\"text\":\"And the foundations of the wall of the city were adorned with all manner of precious stones. The first foundation was jasper: the second, sapphire: the third; a chalcedony: the fourth, an emerald:\"},{\"verse\":20,\"text\":\"The fifth, sardonyx: the sixth, sardius: the seventh, chrysolite: the eighth, beryl: the ninth, a topaz: the tenth, a chrysoprasus: the eleventh, a jacinth: the twelfth, an amethyst.\"},{\"verse\":21,\"text\":\"And the twelve gates are twelve pearls, one to each: and every several gate was of one several pearl. And the street of the city was pure gold, as it were, transparent glass.\"},{\"verse\":22,\"text\":\"And I saw no temple therein. For the Lord God Almighty is the temple thereof, and the Lamb.\"},{\"verse\":23,\"text\":\"And the city hath no need of the sun, nor of the moon, to shine in it. For the glory of God hath enlightened it: and the Lamb is the lamp thereof.\"},{\"verse\":24,\"text\":\"And the nations shall walk in the light of it: and the kings of the earth shall bring their glory and honour into it.\"},{\"verse\":25,\"text\":\"And the gates thereof shall not be shut by day: for there shall be no night there.\"},{\"verse\":26,\"text\":\"And they shall bring the glory and honour of the nations into it.\"},{\"verse\":27,\"text\":\"There shall not enter into it any thing defiled or that worketh abomination or maketh a lie: but they that are written in the book of life of the Lamb.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et vidi cælum novum et terram novam. Primum enim cælum, et prima terra abiit, et mare jam non est.\"},{\"verse\":2,\"text\":\"Et ego Joannes vidi sanctam civitatem Jerusalem novam descendentem de cælo a Deo, paratam sicut sponsam ornatam viro suo.\"},{\"verse\":3,\"text\":\"Et audivi vocem magnam de throno dicentem : Ecce tabernaculum Dei cum hominibus, et habitabit cum eis. Et ipsi populus ejus erunt, et ipse Deus cum eis erit eorum Deus :\"},{\"verse\":4,\"text\":\"et absterget Deus omnem lacrimam ab oculis eorum : et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abierunt.\"},{\"verse\":5,\"text\":\"Et dixit qui sedebat in throno : Ecce nova facio omnia. Et dixit mihi : Scribe, quia hæc verba fidelissima sunt, et vera.\"},{\"verse\":6,\"text\":\"Et dixit mihi : Factum est : ego sum alpha et omega, initium et finis. Ego sitienti dabo de fonte aquæ vitæ, gratis.\"},{\"verse\":7,\"text\":\"Qui vicerit, possidebit hæc : et ero illi Deus, et ille erit mihi filius.\"},{\"verse\":8,\"text\":\"Timidis autem, et incredulis, et execratis, et homicidis, et fornicatoribus, et veneficis, et idolatris, et omnibus mendacibus, pars illorum erit in stagno ardenti igne et sulphure : quod est mors secunda.\"},{\"verse\":9,\"text\":\"Et venit unus de septem angelis habentibus phialas plenas septem plagis novissimis, et locutus est mecum, dicens : Veni, et ostendam tibi sponsam, uxorem Agni.\"},{\"verse\":10,\"text\":\"Et sustulit me in spiritu in montem magnum et altum, et ostendit mihi civitatem sanctam Jerusalem descendentem de cælo a Deo,\"},{\"verse\":11,\"text\":\"habentem claritatem Dei : et lumen ejus simile lapidi pretioso tamquam lapidi jaspidis, sicut crystallum.\"},{\"verse\":12,\"text\":\"Et habebat murum magnum, et altum, habentem portas duodecim : et in portis angelos duodecim, et nomina inscripta, quæ sunt nomina duodecim tribuum filiorum Israël :\"},{\"verse\":13,\"text\":\"ab oriente portæ tres, et ab aquilone portæ tres, et ab austro portæ tres, et ab occasu portæ tres.\"},{\"verse\":14,\"text\":\"Et murus civitatis habens fundamenta duodecim, et in ipsis duodecim nomina duodecim apostolorum Agni.\"},{\"verse\":15,\"text\":\"Et qui loquebatur mecum, habebat mensuram arundineam auream, ut metiretur civitatem, et portas ejus, et murum.\"},{\"verse\":16,\"text\":\"Et civitas in quadro posita est, et longitudo ejus tanta est quanta et latitudo : et mensus est civitatem de arundine aurea per stadia duodecim millia : et longitudo, et altitudo, et latitudo ejus æqualia sunt.\"},{\"verse\":17,\"text\":\"Et mensus est murum ejus centum quadraginta quatuor cubitorum, mensura hominis, quæ est angeli.\"},{\"verse\":18,\"text\":\"Et erat structura muri ejus ex lapide jaspide : ipsa vero civitas aurum mundum simile vitro mundo.\"},{\"verse\":19,\"text\":\"Et fundamenta muri civitatis omni lapide pretioso ornata. Fundamentum primum, jaspis : secundum, sapphirus : tertium, calcedonius : quartum, smaragdus :\"},{\"verse\":20,\"text\":\"quintum, sardonyx : sextum, sardius : septimum, chrysolithus : octavum, beryllus : nonum, topazius : decimum, chrysoprasus : undecimum, hyacinthus : duodecimum, amethystus.\"},{\"verse\":21,\"text\":\"Et duodecim portæ, duodecim margaritæ sunt, per singulas : et singulæ portæ erant ex singulis margaritis : et platea civitatis aurum mundum, tamquam vitrum perlucidum.\"},{\"verse\":22,\"text\":\"Et templum non vidi in ea : Dominus enim Deus omnipotens templum illius est, et Agnus.\"},{\"verse\":23,\"text\":\"Et civitas non eget sole neque luna ut luceant in ea, nam claritas Dei illuminavit eam, et lucerna ejus est Agnus.\"},{\"verse\":24,\"text\":\"Et ambulabunt gentes in lumine ejus : et reges terræ afferent gloriam suam et honorem in illam.\"},{\"verse\":25,\"text\":\"Et portæ ejus non claudentur per diem : nox enim non erit illic.\"},{\"verse\":26,\"text\":\"Et afferent gloriam et honorem gentium in illam.\"},{\"verse\":27,\"text\":\"Non intrabit in eam aliquod coinquinatum, aut abominationem faciens et mendacium, nisi qui scripti sunt in libro vitæ Agni.\"}],\"summary\":\"The new Jerusalem described.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":20,\"label\":\"Revelation 20\"},\"next\":{\"usfm\":\"REV\",\"chapter\":22,\"label\":\"Revelation 22\"}}]]\n"])</script></body></html>
