st="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And there was given me a reed, like unto a rod. And it was said to me: Arise, and measure the temple of God and the altar and them that adore therein.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But the court which is without the temple, cast out and measure it not: because it is given unto the Gentiles. And the holy city they shall tread under foot, two and forty months:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I will give unto my two witnesses: and they shall prophesy, a thousand two hundred sixty days, clothed in sackcloth.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>These are the two olive trees and the two candlesticks that stand before the Lord of the earth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And if any man will hurt them, fire shall come out of their mouths and shall devour their enemies. And if any man will hurt them, in this manner must he be slain.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>These have power to shut heaven, that it rain not in the days of their prophecy: And they have power over waters, to turn them into blood and to strike the earth with all plagues, as often as they will.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when they shall have finished their testimony, the beast that ascendeth out of the abyss shall make war against them and shall overcome them and kill them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And their bodies shall lie in the streets of the great city which is called spiritually, Sodom and Egypt: where their Lord also was crucified.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they of the tribes and peoples and tongues and nations shall see their bodies for three days and a half: and they shall not suffer their bodies to be laid in sepulchres.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they that dwell upon the earth shall rejoice over them and make merry: and shall send gifts one to another, because these two prophets tormented them that dwelt upon the earth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And after three days and a half, the spirit of life from God entered into them. And they stood upon their feet: and great fear fell upon them that saw them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they heard a great voice from heaven, saying to them: Come up hither. And they went up to heaven in a cloud: and their enemies saw them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And at that hour there was made a great earthquake: and the tenth part of the city fell. And there were slain in the earthquake, names of men, seven thousand: and the rest were cast into a fear and gave glory to the God of heaven.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The second woe is past: and behold the third woe will come quickly.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the seventh angel sounded the trumpet: and there were great voices in heaven, saying: The kingdom of this world is become our Lord’s and his Christ’s, and he shall reign for ever and ever. Amen.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the four and twenty ancients who sit on their seats in the sight of God, fell on their faces and adored God, saying:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>We give thee thanks, O Lord God Almighty, who art and who wast and who art to come: because thou hast taken to thee thy great power, and thou hast reigned.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the nations were angry: and thy wrath is come. And the time of the dead, that they should be judged and that thou shouldest render reward to thy servants the prophets and the saints, and to them that fear thy name, little and great: and shouldest destroy them who have corrupted the earth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the temple of God was opened in heaven: and the ark of his testament was seen in his temple. And there were lightnings and voices and an earthquake and great hail.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et datus est mihi calamus similis virgæ, et dictum est mihi : Surge, et metire templum Dei, et altare, et adorantes in eo :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>atrium autem, quod est foris templum, ejice foras, et ne metiaris illud : quoniam datum est gentibus, et civitatem sanctam calcabunt mensibus quadraginta duobus :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dabo duobus testibus meis, et prophetabunt diebus mille ducentis sexaginta, amicti saccis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hi sunt duæ olivæ et duo candelabra in conspectu Domini terræ stantes.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et si quis voluerit eos nocere, ignis exiet de ore eorum, et devorabit inimicos eorum : et si quis voluerit eos lædere, sic oportet eum occidi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hi habent potestatem claudendi cælum, ne pluat diebus prophetiæ ipsorum : et potestatem habent super aquas convertendi eas in sanguinem, et percutere terram omni plaga quotiescumque voluerint.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum finierint testimonium suum, bestia, quæ ascendit de abysso, faciet adversum eos bellum, et vincet illos, et occidet eos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et corpora eorum jacebunt in plateis civitatis magnæ, quæ vocatur spiritualiter Sodoma, et Ægyptus, ubi et Dominus eorum crucifixus est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et videbunt de tribubus, et populis, et linguis, et gentibus corpora eorum per tres dies et dimidium : et corpora eorum non sinent poni in monumentis :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et inhabitantes terram gaudebunt super illos, et jucundabuntur : et munera mittent invicem, quoniam hi duo prophetæ cruciaverunt eos, qui habitabant super terram.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et post dies tres et dimidium, spiritus vitæ a Deo intravit in eos. Et steterunt super pedes suos, et timor magnus cecidit super eos qui viderunt eos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et audierunt vocem magnam de cælo, dicentem eis : Ascendite huc. Et ascenderunt in cælum in nube : et viderunt illos inimici eorum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et in illa hora factus est terræmotus magnus, et decima pars civitatis cecidit : et occisa sunt in terræmotu nomina hominum septem millia : et reliqui in timorem sunt missi, et dederunt gloriam Deo cæli.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Væ secundum abiit : et ecce væ tertium veniet cito.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et septimus angelus tuba cecinit : et factæ sunt voces magnæ in cælo dicentes : Factum est regnum hujus mundi, Domini nostri et Christi ejus, et regnabit in sæcula sæculorum. Amen.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et viginti quatuor seniores, qui in conspectu Dei sedent in sedibus suis, ceciderunt in facies suas, et adoraverunt Deum, dicentes :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Gratias agimus tibi, Domine Deus omnipotens, qui es, et qui eras, et qui venturus es : quia accepisti virtutem tuam magnam, et regnasti.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et iratæ sunt gentes, et advenit ira tua et tempus mortuorum judicari, et reddere mercedem servis tuis prophetis, et sanctis, et timentibus nomen tuum pusillis et magnis, et exterminandi eos qui corruperunt terram.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et apertum est templum Dei in cælo : et visa est arca testamenti ejus in templo ejus, et facta sunt fulgura, et voces, et terræmotus, et grando magna.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/REV/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></sv hat adore therein.\"},{\"verse\":2,\"text\":\"But the court which is without the temple, cast out and measure it not: because it is given unto the Gentiles. And the holy city they shall tread under foot, two and forty months:\"},{\"verse\":3,\"text\":\"And I will give unto my two witnesses: and they shall prophesy, a thousand two hundred sixty days, clothed in sackcloth.\"},{\"verse\":4,\"text\":\"These are the two olive trees and the two candlesticks that stand before the Lord of the earth.\"},{\"verse\":5,\"text\":\"And if any man will hurt them, fire shall come out of their mouths and shall devour their enemies. And if any man will hurt them, in this manner must he be slain.\"},{\"verse\":6,\"text\":\"These have power to shut heaven, that it rain not in the days of their prophecy: And they have power over waters, to turn them into blood and to strike the earth with all plagues, as often as they will.\"},{\"verse\":7,\"text\":\"And when they shall have finished their testimony, the beast that ascendeth out of the abyss shall make war against them and shall overcome them and kill them.\"},{\"verse\":8,\"text\":\"And their bodies shall lie in the streets of the great city which is called spiritually, Sodom and Egypt: where their Lord also was crucified.\"},{\"verse\":9,\"text\":\"And they of the tribes and peoples and tongues and nations shall see their bodies for three days and a half: and they shall not suffer their bodies to be laid in sepulchres.\"},{\"verse\":10,\"text\":\"And they that dwell upon the earth shall rejoice over them and make merry: and shall send gifts one to another, because these two prophets tormented them that dwelt upon the earth.\"},{\"verse\":11,\"text\":\"And after three days and a half, the spirit of life from God entered into them. And they stood upon their feet: and great fear fell upon them that saw them.\"},{\"verse\":12,\"text\":\"And they heard a great voice from heaven, saying to them: Come up hither. And they went up to heaven in a cloud: and their enemies saw them.\"},{\"verse\":13,\"text\":\"And at that hour there was made a great earthquake: and the tenth part of the city fell. And there were slain in the earthquake, names of men, seven thousand: and the rest were cast into a fear and gave glory to the God of heaven.\"},{\"verse\":14,\"text\":\"The second woe is past: and behold the third woe will come quickly.\"},{\"verse\":15,\"text\":\"And the seventh angel sounded the trumpet: and there were great voices in heaven, saying: The kingdom of this world is become our Lord’s and his Christ’s, and he shall reign for ever and ever. Amen.\"},{\"verse\":16,\"text\":\"And the four and twenty ancients who sit on their seats in the sight of God, fell on their faces and adored God, saying:\"},{\"verse\":17,\"text\":\"We give thee thanks, O Lord God Almighty, who art and who wast and who art to come: because thou hast taken to thee thy great power, and thou hast reigned.\"},{\"verse\":18,\"text\":\"And the nations were angry: and thy wrath is come. And the time of the dead, that they should be judged and that thou shouldest render reward to thy servants the prophets and the saints, and to them that fear thy name, little and great: and shouldest destroy them who have corrupted the earth.\"},{\"verse\":19,\"text\":\"And the temple of God was opened in heaven: and the ark of his testament was seen in his temple. And there were lightnings and voices and an earthquake and great hail.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et datus est mihi calamus similis virgæ, et dictum est mihi : Surge, et metire templum Dei, et altare, et adorantes in eo :\"},{\"verse\":2,\"text\":\"atrium autem, quod est foris templum, ejice foras, et ne metiaris illud : quoniam datum est gentibus, et civitatem sanctam calcabunt mensibus quadraginta duobus :\"},{\"verse\":3,\"text\":\"et dabo duobus testibus meis, et prophetabunt diebus mille ducentis sexaginta, amicti saccis.\"},{\"verse\":4,\"text\":\"Hi sunt duæ olivæ et duo candelabra in conspectu Domini terræ stantes.\"},{\"verse\":5,\"text\":\"Et si quis voluerit eos nocere, ignis exiet de ore eorum, et devorabit inimicos eorum : et si quis voluerit eos lædere, sic oportet eum occidi.\"},{\"verse\":6,\"text\":\"Hi habent potestatem claudendi cælum, ne pluat diebus prophetiæ ipsorum : et potestatem habent super aquas convertendi eas in sanguinem, et percutere terram omni plaga quotiescumque voluerint.\"},{\"verse\":7,\"text\":\"Et cum finierint testimonium suum, bestia, quæ ascendit de abysso, faciet adversum eos bellum, et vincet illos, et occidet eos.\"},{\"verse\":8,\"text\":\"Et corpora eorum jacebunt in plateis civitatis magnæ, quæ vocatur spiritualiter Sodoma, et Ægyptus, ubi et Dominus eorum crucifixus est.\"},{\"verse\":9,\"text\":\"Et videbunt de tribubus, et populis, et linguis, et gentibus corpora eorum per tres dies et dimidium : et corpora eorum non sinent poni in monumentis :\"},{\"verse\":10,\"text\":\"et inhabitantes terram gaudebunt super illos, et jucundabuntur : et munera mittent invicem, quoniam hi duo prophetæ cruciaverunt eos, qui habitabant super terram.\"},{\"verse\":11,\"text\":\"Et post dies tres et dimidium, spiritus vitæ a Deo intravit in eos. Et steterunt super pedes suos, et timor magnus cecidit super eos qui viderunt eos.\"},{\"verse\":12,\"text\":\"Et audierunt vocem magnam de cælo, dicentem eis : Ascendite huc. Et ascenderunt in cælum in nube : et viderunt illos inimici eorum.\"},{\"verse\":13,\"text\":\"Et in illa hora factus est terræmotus magnus, et decima pars civitatis cecidit : et occisa sunt in terræmotu nomina hominum septem millia : et reliqui in timorem sunt missi, et dederunt gloriam Deo cæli.\"},{\"verse\":14,\"text\":\"Væ secundum abiit : et ecce væ tertium veniet cito.\"},{\"verse\":15,\"text\":\"Et septimus angelus tuba cecinit : et factæ sunt voces magnæ in cælo dicentes : Factum est regnum hujus mundi, Domini nostri et Christi ejus, et regnabit in sæcula sæculorum. Amen.\"},{\"verse\":16,\"text\":\"Et viginti quatuor seniores, qui in conspectu Dei sedent in sedibus suis, ceciderunt in facies suas, et adoraverunt Deum, dicentes :\"},{\"verse\":17,\"text\":\"Gratias agimus tibi, Domine Deus omnipotens, qui es, et qui eras, et qui venturus es : quia accepisti virtutem tuam magnam, et regnasti.\"},{\"verse\":18,\"text\":\"Et iratæ sunt gentes, et advenit ira tua et tempus mortuorum judicari, et reddere mercedem servis tuis prophetis, et sanctis, et timentibus nomen tuum pusillis et magnis, et exterminandi eos qui corruperunt terram.\"},{\"verse\":19,\"text\":\"Et apertum est templum Dei in cælo : et visa est arca testamenti ejus in templo ejus, et facta sunt fulgura, et voces, et terræmotus, et grando magna.\"}],\"summary\":\"He is ordered to measure the temple. The two witnesses.\",\"intro\":null,\"prev\":{\"usfm\":\"REV\",\"chapter\":10,\"label\":\"Revelation 10\"},\"next\":{\"usfm\":\"REV\",\"chapter\":12,\"label\":\"Revelation 12\"}}]]\n"])</script></body></html>
