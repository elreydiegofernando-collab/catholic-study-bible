-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">35</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Cities are appointed for the Levites. Of which six are to be the cities of refuge.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke these things also to Moses in the plains of Moab by the Jordan, over against Jericho:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Command the children of Israel that they give to the Levites out of their possessions,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cities to dwell in, and their suburbs round about: that they may abide in the towns, and the suburbs may be for their cattle and beasts:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Which suburbs shall reach from the walls of the cities outward, a thousand paces on every side:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Toward the east shall be two thousand cubits: and toward the south in like manner shall be two thousand cubits: toward the sea also, which looketh to the west, shall be the same extent: and the north side shall be bounded with the like limits. And the cities shall be in the midst, and the suburbs without.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And among the cities, which you shall give to the Levites, six shall be separated for refuge to fugitives, that he who hath shed blood may flee to them: and besides these there shall be other forty-two cities,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That is, in all forty-eight with their suburbs.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And of these cities which shall be given out of the possessions of the children of Israel, from them that have more, more shall be taken: and from them that have less, fewer. Each shall give towns to the Levites according to the extent of their inheritance.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The Lord said to Moses:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Speak to the children of Israel, and thou shalt say to them: When you shall have passed over the Jordan into the land of Chanaan,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Determine what cities shall be for the refuge of fugitives, who have shed blood against their will.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when the fugitive shall be in them, the kinsman of him that is slain may not have power to kill him, until he stand before the multitude, and his cause be judged.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And of those cities, that are separated for the refuge of fugitives,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Three shall be beyond the Jordan, and three in the land of Chanaan,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>As well for the children of Israel as for strangers and sojourners, that he may flee to them, who hath shed blood against his will.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If any man strike with iron, and he die that was struck: he shall be guilty of murder, and he himself shall die.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If he throw a stone, and he that is struck die: he shall be punished in the same manner.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If he that is struck with wood die: he shall be revenged by the blood of him that struck him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The kinsman of him that was slain, shall kill the murderer: as soon as he apprehendeth him, he shall kill him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If through hatred any one push a man, or fling any thing at him with ill design:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Or being his enemy, strike him with his hand, and he die: the striker shall be guilty of murder: the kinsman of him that was slain as soon as he findeth him, shall kill him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But if by chance medley, and without hatred,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And enmity, he do any of these things,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And this be proved in the hearing of the people, and the cause be debated between him that struck, and the next of kin:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The innocent shall be delivered from the hand of the revenger, and shall be brought back by sentence into the city, to which he had fled, and he shall abide there until the death of the high priest, that is anointed with the holy oil.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>If the murderer be found without the limits of the cities that are appointed for the banished,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And be struck by him that is the avenger of blood: he shall not be guilty that killed him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For the fugitive ought to have stayed in the city until the death of the high priest: and after he is dead, then shall the manslayer return to his own country.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>These things shall be perpetual, and for an ordinance in all your dwellings.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The murderer shall be punished by witnesses: none shall be condemned upon the evidence of one man.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>You shall not take money of him that is guilty of blood, but he shall die forthwith.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The banished and fugitives before the death of the high priest may by no means return into their own cities.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Defile not the land of your habitation, which is stained with the blood of the innocent: neither can it otherwise be expiated, but by his blood that hath shed the blood of another.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And thus shall your possession be cleansed, myself abiding with you. For I am the Lord that dwell among the children of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc quoque locutus est Dominus ad Moysen in campes tribus Moab supra Jordanem, contra Jericho :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Præcipe filiis Israël ut dent Levitis de possessionibus suis</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>urbes ad habitandum, et suburbana earum per circuitum : ut ipsi in oppidis maneant, et suburbana sint pecoribus ac jumentis :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quæ a muris civitatum forinsecus, per circuitum, mille passuum spatio tendentur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Contra orientem duo millia erunt cubiti, et contra meridiem similiter erunt duo millia : ad mare quoque, quod respicit ad occidentem, eadem mensura erit, et septentrionalis plaga æquali termino finietur, eruntque urbes in medio, et foris suburbana.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>De ipsis autem oppidis, quæ Levitis dabitis, sex erunt in fugitivorum auxilia separata, ut fugiat ad ea qui fuderit sanguinem : et exceptis his, alia quadraginta duo oppida,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>id est, simul quadraginta octo cum suburbanis suis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ipsæque urbes, quæ dabuntur de possessionibus filiorum Israël, ab his qui plus habent, plures auferentur : et qui minus, pauciores : singuli juxta mensuram hæreditatis suæ dabunt oppida Levitis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ait Dominus ad Moysen :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Loquere filiis Israël, et dices ad eos : Quando transgressi fueritis Jordanem in terram Chanaan,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>decernite quæ urbes esse debeant in præsidia fugitivorum, qui nolentes sanguinem fuderint :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>in quibus cum fuerit profugus, cognatus occisi non poterit eum occidere, donec stet in conspectu multitudinis, et causa illius judicetur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>De ipsis autem urbibus, quæ ad fugitivorum subsidia separantur,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>tres erunt trans Jordanem, et tres in terra Chanaan,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>tam filiis Israël quam advenis atque peregrinis, ut confugiat ad eas qui nolens sanguinem fuderit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si quis ferro percusserit, et mortuus fuerit qui percussus est, reus erit homicidii, et ipse morietur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si lapidem jecerit, et ictus occubuerit, similiter punietur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si ligno percussus interierit, percussoris sanguine vindicabitur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Propinquus occisi, homicidam interficiet : statim ut apprehenderit eum, interficiet.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si per odium quis hominem impulerit, vel jecerit quippiam in eum per insidias :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>aut cum esset inimicus, manu percusserit, et ille mortuus fuerit : percussor homicidii reus erit : cognatus occisi statim ut invenerit eum, jugulabit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod si fortuitu, et absque odio</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et inimicitiis quidquam horum fecerit,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et hoc audiente populo fuerit comprobatum, atque inter percussorem et propinquum sanguinis quæstio ventilata :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>liberabitur innocens de ultoris manu, et reducetur per sententiam in urbem, ad quam confugerat, manebitque ibi, donec sacerdos magnus, qui oleo sancto unctus est, moriatur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Si interfector extra fines urbium, quæ exulibus deputatæ sunt,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>fuerit inventus, et percussus ab eo qui ultor est sanguinis : absque noxa erit qui eum occiderit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Debuerat enim profugus usque ad mortem pontificis in urbe residere. Postquam autem ille obierit, homicida revertetur in terram suam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Hæc sempiterna erunt, et legitima in cunctis habitationibus vestris.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Homicida sub testibus punietur : ad unius testimonium nullus condemnabitur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Non accipietis pretium ab eo qui reus est sanguinis, statim et ipse morietur.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Exules et profugi ante mortem pontificis nullo modo in urbes suas reverti poterunt,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>ne polluatis terram habitationis vestræ, quæ insontium cruore maculatur : nec aliter expiari potest, nisi per ejus sanguinem, qui alterius sanguinem fuderit.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Atque ita emundabitur vestra possessio me commorante vobiscum. Ego enim sum Dominus qui habito inter filios Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-labe study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.35\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":35,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke these things also to Moses in the plains of Moab by the Jordan, over against Jericho:\"},{\"verse\":2,\"text\":\"Command the children of Israel that they give to the Levites out of their possessions,\"},{\"verse\":3,\"text\":\"Cities to dwell in, and their suburbs round about: that they may abide in the towns, and the suburbs may be for their cattle and beasts:\"},{\"verse\":4,\"text\":\"Which suburbs shall reach from the walls of the cities outward, a thousand paces on every side:\"},{\"verse\":5,\"text\":\"Toward the east shall be two thousand cubits: and toward the south in like manner shall be two thousand cubits: toward the sea also, which looketh to the west, shall be the same extent: and the north side shall be bounded with the like limits. And the cities shall be in the midst, and the suburbs without.\"},{\"verse\":6,\"text\":\"And among the cities, which you shall give to the Levites, six shall be separated for refuge to fugitives, that he who hath shed blood may flee to them: and besides these there shall be other forty-two cities,\"},{\"verse\":7,\"text\":\"That is, in all forty-eight with their suburbs.\"},{\"verse\":8,\"text\":\"And of these cities which shall be given out of the possessions of the children of Israel, from them that have more, more shall be taken: and from them that have less, fewer. Each shall give towns to the Levites according to the extent of their inheritance.\"},{\"verse\":9,\"text\":\"The Lord said to Moses:\"},{\"verse\":10,\"text\":\"Speak to the children of Israel, and thou shalt say to them: When you shall have passed over the Jordan into the land of Chanaan,\"},{\"verse\":11,\"text\":\"Determine what cities shall be for the refuge of fugitives, who have shed blood against their will.\"},{\"verse\":12,\"text\":\"And when the fugitive shall be in them, the kinsman of him that is slain may not have power to kill him, until he stand before the multitude, and his cause be judged.\"},{\"verse\":13,\"text\":\"And of those cities, that are separated for the refuge of fugitives,\"},{\"verse\":14,\"text\":\"Three shall be beyond the Jordan, and three in the land of Chanaan,\"},{\"verse\":15,\"text\":\"As well for the children of Israel as for strangers and sojourners, that he may flee to them, who hath shed blood against his will.\"},{\"verse\":16,\"text\":\"If any man strike with iron, and he die that was struck: he shall be guilty of murder, and he himself shall die.\"},{\"verse\":17,\"text\":\"If he throw a stone, and he that is struck die: he shall be punished in the same manner.\"},{\"verse\":18,\"text\":\"If he that is struck with wood die: he shall be revenged by the blood of him that struck him.\"},{\"verse\":19,\"text\":\"The kinsman of him that was slain, shall kill the murderer: as soon as he apprehendeth him, he shall kill him.\"},{\"verse\":20,\"text\":\"If through hatred any one push a man, or fling any thing at him with ill design:\"},{\"verse\":21,\"text\":\"Or being his enemy, strike him with his hand, and he die: the striker shall be guilty of murder: the kinsman of him that was slain as soon as he findeth him, shall kill him.\"},{\"verse\":22,\"text\":\"But if by chance medley, and without hatred,\"},{\"verse\":23,\"text\":\"And enmity, he do any of these things,\"},{\"verse\":24,\"text\":\"And this be proved in the hearing of the people, and the cause be debated between him that struck, and the next of kin:\"},{\"verse\":25,\"text\":\"The innocent shall be delivered from the hand of the revenger, and shall be brought back by sentence into the city, to which he had fled, and he shall abide there until the death of the high priest, that is anointed with the holy oil.\"},{\"verse\":26,\"text\":\"If the murderer be found without the limits of the cities that are appointed for the banished,\"},{\"verse\":27,\"text\":\"And be struck by him that is the avenger of blood: he shall not be guilty that killed him.\"},{\"verse\":28,\"text\":\"For the fugitive ought to have stayed in the city until the death of the high priest: and after he is dead, then shall the manslayer return to his own country.\"},{\"verse\":29,\"text\":\"These things shall be perpetual, and for an ordinance in all your dwellings.\"},{\"verse\":30,\"text\":\"The murderer shall be punished by witnesses: none shall be condemned upon the evidence of one man.\"},{\"verse\":31,\"text\":\"You shall not take money of him that is guilty of blood, but he shall die forthwith.\"},{\"verse\":32,\"text\":\"The banished and fugitives before the death of the high priest may by no means return into their own cities.\"},{\"verse\":33,\"text\":\"Defile not the land of your habitation, which is stained with the blood of the innocent: neither can it otherwise be expiated, but by his blood that hath shed the blood of another.\"},{\"verse\":34,\"text\":\"And thus shall your possession be cleansed, myself abiding with you. For I am the Lord that dwell among the children of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc quoque locutus est Dominus ad Moysen in campes tribus Moab supra Jordanem, contra Jericho :\"},{\"verse\":2,\"text\":\"Præcipe filiis Israël ut dent Levitis de possessionibus suis\"},{\"verse\":3,\"text\":\"urbes ad habitandum, et suburbana earum per circuitum : ut ipsi in oppidis maneant, et suburbana sint pecoribus ac jumentis :\"},{\"verse\":4,\"text\":\"quæ a muris civitatum forinsecus, per circuitum, mille passuum spatio tendentur.\"},{\"verse\":5,\"text\":\"Contra orientem duo millia erunt cubiti, et contra meridiem similiter erunt duo millia : ad mare quoque, quod respicit ad occidentem, eadem mensura erit, et septentrionalis plaga æquali termino finietur, eruntque urbes in medio, et foris suburbana.\"},{\"verse\":6,\"text\":\"De ipsis autem oppidis, quæ Levitis dabitis, sex erunt in fugitivorum auxilia separata, ut fugiat ad ea qui fuderit sanguinem : et exceptis his, alia quadraginta duo oppida,\"},{\"verse\":7,\"text\":\"id est, simul quadraginta octo cum suburbanis suis.\"},{\"verse\":8,\"text\":\"Ipsæque urbes, quæ dabuntur de possessionibus filiorum Israël, ab his qui plus habent, plures auferentur : et qui minus, pauciores : singuli juxta mensuram hæreditatis suæ dabunt oppida Levitis.\"},{\"verse\":9,\"text\":\"Ait Dominus ad Moysen :\"},{\"verse\":10,\"text\":\"Loquere filiis Israël, et dices ad eos : Quando transgressi fueritis Jordanem in terram Chanaan,\"},{\"verse\":11,\"text\":\"decernite quæ urbes esse debeant in præsidia fugitivorum, qui nolentes sanguinem fuderint :\"},{\"verse\":12,\"text\":\"in quibus cum fuerit profugus, cognatus occisi non poterit eum occidere, donec stet in conspectu multitudinis, et causa illius judicetur.\"},{\"verse\":13,\"text\":\"De ipsis autem urbibus, quæ ad fugitivorum subsidia separantur,\"},{\"verse\":14,\"text\":\"tres erunt trans Jordanem, et tres in terra Chanaan,\"},{\"verse\":15,\"text\":\"tam filiis Israël quam advenis atque peregrinis, ut confugiat ad eas qui nolens sanguinem fuderit.\"},{\"verse\":16,\"text\":\"Si quis ferro percusserit, et mortuus fuerit qui percussus est, reus erit homicidii, et ipse morietur.\"},{\"verse\":17,\"text\":\"Si lapidem jecerit, et ictus occubuerit, similiter punietur.\"},{\"verse\":18,\"text\":\"Si ligno percussus interierit, percussoris sanguine vindicabitur.\"},{\"verse\":19,\"text\":\"Propinquus occisi, homicidam interficiet : statim ut apprehenderit eum, interficiet.\"},{\"verse\":20,\"text\":\"Si per odium quis hominem impulerit, vel jecerit quippiam in eum per insidias :\"},{\"verse\":21,\"text\":\"aut cum esset inimicus, manu percusserit, et ille mortuus fuerit : percussor homicidii reus erit : cognatus occisi statim ut invenerit eum, jugulabit.\"},{\"verse\":22,\"text\":\"Quod si fortuitu, et absque odio\"},{\"verse\":23,\"text\":\"et inimicitiis quidquam horum fecerit,\"},{\"verse\":24,\"text\":\"et hoc audiente populo fuerit comprobatum, atque inter percussorem et propinquum sanguinis quæstio ventilata :\"},{\"verse\":25,\"text\":\"liberabitur innocens de ultoris manu, et reducetur per sententiam in urbem, ad quam confugerat, manebitque ibi, donec sacerdos magnus, qui oleo sancto unctus est, moriatur.\"},{\"verse\":26,\"text\":\"Si interfector extra fines urbium, quæ exulibus deputatæ sunt,\"},{\"verse\":27,\"text\":\"fuerit inventus, et percussus ab eo qui ultor est sanguinis : absque noxa erit qui eum occiderit.\"},{\"verse\":28,\"text\":\"Debuerat enim profugus usque ad mortem pontificis in urbe residere. Postquam autem ille obierit, homicida revertetur in terram suam.\"},{\"verse\":29,\"text\":\"Hæc sempiterna erunt, et legitima in cunctis habitationibus vestris.\"},{\"verse\":30,\"text\":\"Homicida sub testibus punietur : ad unius testimonium nullus condemnabitur.\"},{\"verse\":31,\"text\":\"Non accipietis pretium ab eo qui reus est sanguinis, statim et ipse morietur.\"},{\"verse\":32,\"text\":\"Exules et profugi ante mortem pontificis nullo modo in urbes suas reverti poterunt,\"},{\"verse\":33,\"text\":\"ne polluatis terram habitationis vestræ, quæ insontium cruore maculatur : nec aliter expiari potest, nisi per ejus sanguinem, qui alterius sanguinem fuderit.\"},{\"verse\":34,\"text\":\"Atque ita emundabitur vestra possessio me commorante vobiscum. Ego enim sum Dominus qui habito inter filios Israël.\"}],\"summary\":\"Cities are appointed for the Levites. Of which six are to be the cities of refuge.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":34,\"label\":\"Numbers 34\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":36,\"label\":\"Numbers 36\"}}]]\n"])</script></body></html>
