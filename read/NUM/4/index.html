[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The age and time of the Levites’ service: their offices and burdens.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, and Aaron, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Take the sum of the sons of Caath from the midst of the Levites, by their houses and families.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>From thirty years old and upward, to fifty years old, of all that go in to stand and to minister in the tabernacle of the covenant.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>This is the service of the sons of Caath:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>When the camp is; to set forward, Aaron and his sons shall go into the tabernacle of the covenant, and the holy of holies, and shall take down the veil that hangeth before the door, and shall wrap up the ark of the testimony in it,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And shall cover it again with a cover of violet skins, and shall spread over it a cloth all of violet, and shall put in the bars.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They shall wrap up also the table of proposition in a cloth of violet, and shall put with it the censers and little mortars, the cups and bowls to pour out the libations: the loaves shall be always on it:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they shall spread over it a cloth of scarlet, which again they shall cover with a covering of violet skins, and shall put in the bars.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They shall take also a cloth of violet wherewith they shall cover the candlestick with the lamps and tongs thereof and the snuffers and all the oil vessels, which are necessary for the dressing of the lamps:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And over all they shall put a cover of violet skins and put in the bars.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they shall wrap up the golden altar also in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All the vessels wherewith they minister in the sanctuary, they shall wrap up in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They shall cleanse the altar also from the ashes, and shall wrap it up in a purple cloth,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And shall put it with all the vessels that they use in the ministry thereof, that is to say, firepans, fleshhooks and forks, pothooks and shovels. They shall cover all the vessels of the altar together with a covering of violet skins, and shall put in the bars.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when Aaron and his sons have wrapped up the sanctuary and the vessels thereof at the removing of the camp, then shall the sons of Caath enter in to carry the things wrapped up: and they shall not touch the vessels of the sanctuary, lest they die. These are the burdens of the sons of Caath: in the tabernacle of the covenant:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And over them shall be Eleazar the son of Aaron the priest, to whose charge pertaineth the oil to dress the lamps, and the sweet incense, and the sacrifice, that is always offered, and the oil of unction, and whatsoever pertaineth to the service of the tabernacle, and of all the vessels that are in the sanctuary.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Destroy not the people of Caath from the midst of the Levites:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But do this to them, that they may live, and not die, by touching the holies of holies. Aaron and his sons shall go in, and they shall appoint every man his work, and shall divide the burdens that every man is to carry.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Let not others by any curiosity see the things that are in the sanctuary before they be wrapped up, otherwise they shall die.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Take the sum of the sons of Gerson also by their houses and families and kindreds.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>From thirty years old and upward, unto fifty years old. Number them all that go in and minister in the tabernacle of the covenant.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>This is the office of the family of the Gersonites:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>To carry the curtains of the tabernacle and the roof of the covenant, the other covering, and the violet covering over all, and the hanging that hangeth in the entry of the tabernacle of the covenant,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The curtains of the court, and the veil in the entry that is before tabernacle. All things that pertain to the altar, the cords and the vessels of the ministry,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The sons of Gerson shall carry, by the commandment of Aaron and his sons: and each man shall know to what burden he must be assigned.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>This is the service of the family of the Gersonites in the tabernacle of the covenant, and they shall be under the hand of Ithamar the son of Aaron the priest.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Thou shalt reckon up the sons of Merari also by the families and houses of their fathers,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>From thirty years old and upward, unto fifty years old, all that go in to the office of their ministry, and to the service of the covenant of the testimony.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>These are their burdens: They shall carry the boards of the tabernacle and the bars thereof, the pillars and their sockets,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The pillars also of the court round about, with their sockets and pins and cords. They shall receive by account all the vessels and furniture, and so shall carry them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>This is the office of the family of the Merarites, and their ministry in the tabernacle of the covenant: and they shall be under the hand of Ithamar the son of Aaron the priest.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>So Moses and Aaron and the princes of the synagogue reckoned up the sons of Caath, by their kindreds and the houses of their fathers,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>From thirty years old and upward, unto fifty years old, all that go in to the ministry of the tabernacle of the covenant:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And they were found two thousand seven hundred and fifty.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>This is the number of the people of Caath that go in to the tabernacle of the covenant: these did Moses and Aaron number according to the word of the Lord by the hand of Moses.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>The sons of Gerson also were numbered by the kindreds and houses of their fathers,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>From thirty years old and upward, unto fifty years old, all that go in to minister in the tabernacle of the covenant:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And they were found two thousand six hundred and thirty.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>This is the people of the Gersonites, whom Moses and Aaron numbered according to the word of the Lord.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The sons of Merari also were numbered by the kindreds and houses of their fathers,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>From thirty years old and upward, unto fifty years old, all that go in to fulfil the rites of the tabernacle of the covenant:</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And they were found three thousand two hundred.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>This is the number of the sons of Merari, whom Moses and Aaron reckoned up according to the commandment of the Lord by the hand of Moses.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>All that were reckoned up of the Levites, and whom Moses and Aaron and the princes of Israel took by name, by the kindreds and houses of their fathers,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>From thirty years old and upward, until fifty years old, that go into the ministry of the tabernacle, and to carry the burdens,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Were in all eight thousand five hundred and eighty.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Moses reckoned them up according to the word of the Lord, every one according to their office and burdens, as the Lord had commanded him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tolle summam filiorum Caath de medio Levitarum per domos et familias suas,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>a trigesimo anno et supra, usque ad quinquagesimum annum, omnium qui ingrediuntur ut stent et ministrent in tabernaculo fœderis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hic est cultus filiorum Caath : tabernaculum fœderis, et Sanctum sanctorum</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ingredientur Aaron et filii ejus, quando movenda sunt castra, et deponent velum quod pendet ante fores, involventque eo arcam testimonii,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et operient rursum velamine janthinarum pellium, extendentque desuper pallium totum hyacinthinum, et inducent vectes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Mensam quoque propositionis involvent hyacinthino pallio, et ponent cum ea thuribula et mortariola, cyathos et crateras ad liba fundenda : panes semper in ea erunt :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>extendentque desuper pallium coccineum, quod rursum operient velamento janthinarum pellium, et inducent vectes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sument et pallium hyacinthinum, quo operient candelabrum cum lucernis et forcipibus suis et emunctoriis et cunctis vasis olei, quæ ad concinnandas lucernas necessaria sunt :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et super omnia ponent operimentum janthinarum pellium, et inducent vectes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Necnon et altare aureum involvent hyacinthino vestimento, et extendent desuper operimentum janthinarum pellium, inducentque vectes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Omnia vasa, quibus ministratur in sanctuario, involvent hyacinthino pallio, et extendent desuper operimentum janthinarum pellium, inducentque vectes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sed et altare mundabunt cinere, et involvent illud purpureo vestimento,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ponentque cum eo omnia vasa, quibus in ministerio ejus utuntur, id est, ignium receptacula, fuscinulas ac tridentes, uncinos et batilla. Cuncta vasa altaris operient simul velamine janthinarum pellium, et inducent vectes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cumque involverint Aaron et filii ejus sanctuarium et omnia vasa ejus in commotione castrorum, tunc intrabunt filii Caath ut portent involuta : et non tangent vasa sanctuarii, ne moriantur. Ista sunt onera filiorum Caath in tabernaculo fœderis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>super quos erit Eleazar filius Aaron sacerdotis, ad cujus curam pertinet oleum ad concinnandas lucernas, et compositionis incensum, et sacrificium, quod semper offertur, et oleum unctionis, et quidquid ad cultum tabernaculi pertinet, omniumque vasorum, quæ in sanctuario sunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Nolite perdere populum Caath de medio Levitarum :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>sed hoc facite eis, ut vivant, et non moriantur, si tetigerint Sancta sanctorum. Aaron et filii ejus intrabunt, ipsique disponent opera singulorum, et divident quid portare quis debeat.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Alii nulla curiositate videant quæ sunt in sanctuario priusquam involvantur, alioquin morientur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tolle summam etiam filiorum Gerson per domos ac familias et cognationes suas,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>a triginta annis et supra, usque ad annos quinquaginta. Numera omnes qui ingrediuntur et ministrant in tabernaculo fœderis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Hoc est officium familiæ Gersonitarum,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ut portent cortinas tabernaculi et tectum fœderis, operimentum aliud, et super omnia velamen janthinum tentoriumque quod pendet in introitu tabernaculi fœderis,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>cortinas atrii, et velum in introitu quod est ante tabernaculum. Omnia quæ ad altare pertinent, funiculos, et vasa ministerii,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>jubente Aaron et filiis ejus, portabunt filii Gerson : et scient singuli cui debeant oneri mancipari.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Hic est cultus familiæ Gersonitarum in tabernaculo fœderis, eruntque sub manu Ithamar filii Aaron sacerdotis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Filios quoque Merari per familias et domos patrum suorum recensebis,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>a triginta annis et supra, usque ad annos quinquaginta, omnes qui ingrediuntur ad officium ministerii sui et cultum fœderis testimonii.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Hæc sunt onera eorum : portabunt tabulas tabernaculi et vectes ejus, columnas ac bases earum,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>columnas quoque atrii per circuitum cum basibus et paxillis et funibus suis. Omnia vasa et supellectilem ad numerum accipient, sicque portabunt.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hoc est officium familiæ Meraritarum et ministerium in tabernaculo fœderis : eruntque sub manu Ithamar filii Aaron sacerdotis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Recensuerunt igitur Moyses et Aaron et principes synagogæ filios Caath per cognationes et domos patrum suorum,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad ministerium tabernaculi fœderis :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>et inventi sunt duo millia septingenti quinquaginta.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Hic est numerus populi Caath qui intrant tabernaculum fœderis : hos numeravit Moyses et Aaron juxta sermonem Domini per manum Moysi.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Numerati sunt et filii Gerson per cognationes et domos patrum suorum,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>a triginta annos et supra, usque ad quinquagesimum annum, omnes qui ingrediuntur ut ministrent in tabernaculo fœderis :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et inventi sunt duo millia sexcenti triginta.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Hic est populus Gersonitarum, quos numeraverunt Moyses et Aaron juxta verbum Domini.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Numerati sunt et filii Merari per cognationes et domos patrum suorum,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad explendos ritus tabernaculi fœderis :</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>et inventi sunt tria millia ducenti.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Hic est numerus filiorum Merari, quos recensuerunt Moyses et Aaron juxta imperium Domini per manum Moysi.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Omnes qui recensiti sunt de Levitis, et quos recenseri fecit ad nomen Moyses et Aaron, et principes Israël per cognationes et domos patrum suorum,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>a triginta annis et supra, usque ad annum quinquagesimum, ingredientes ad ministerium tabernaculi, et onera portanda,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>fuerunt simul octo millia quingenti octoginta.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Juxta verbum Domini recensuit eos Moyses, unumquemque juxta officium et onera sua, sicut præceperat ei Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 activ se.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.4\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":4,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses, and Aaron, saying:\"},{\"verse\":2,\"text\":\"Take the sum of the sons of Caath from the midst of the Levites, by their houses and families.\"},{\"verse\":3,\"text\":\"From thirty years old and upward, to fifty years old, of all that go in to stand and to minister in the tabernacle of the covenant.\"},{\"verse\":4,\"text\":\"This is the service of the sons of Caath:\"},{\"verse\":5,\"text\":\"When the camp is; to set forward, Aaron and his sons shall go into the tabernacle of the covenant, and the holy of holies, and shall take down the veil that hangeth before the door, and shall wrap up the ark of the testimony in it,\"},{\"verse\":6,\"text\":\"And shall cover it again with a cover of violet skins, and shall spread over it a cloth all of violet, and shall put in the bars.\"},{\"verse\":7,\"text\":\"They shall wrap up also the table of proposition in a cloth of violet, and shall put with it the censers and little mortars, the cups and bowls to pour out the libations: the loaves shall be always on it:\"},{\"verse\":8,\"text\":\"And they shall spread over it a cloth of scarlet, which again they shall cover with a covering of violet skins, and shall put in the bars.\"},{\"verse\":9,\"text\":\"They shall take also a cloth of violet wherewith they shall cover the candlestick with the lamps and tongs thereof and the snuffers and all the oil vessels, which are necessary for the dressing of the lamps:\"},{\"verse\":10,\"text\":\"And over all they shall put a cover of violet skins and put in the bars.\"},{\"verse\":11,\"text\":\"And they shall wrap up the golden altar also in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars.\"},{\"verse\":12,\"text\":\"All the vessels wherewith they minister in the sanctuary, they shall wrap up in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars.\"},{\"verse\":13,\"text\":\"They shall cleanse the altar also from the ashes, and shall wrap it up in a purple cloth,\"},{\"verse\":14,\"text\":\"And shall put it with all the vessels that they use in the ministry thereof, that is to say, firepans, fleshhooks and forks, pothooks and shovels. They shall cover all the vessels of the altar together with a covering of violet skins, and shall put in the bars.\"},{\"verse\":15,\"text\":\"And when Aaron and his sons have wrapped up the sanctuary and the vessels thereof at the removing of the camp, then shall the sons of Caath enter in to carry the things wrapped up: and they shall not touch the vessels of the sanctuary, lest they die. These are the burdens of the sons of Caath: in the tabernacle of the covenant:\"},{\"verse\":16,\"text\":\"And over them shall be Eleazar the son of Aaron the priest, to whose charge pertaineth the oil to dress the lamps, and the sweet incense, and the sacrifice, that is always offered, and the oil of unction, and whatsoever pertaineth to the service of the tabernacle, and of all the vessels that are in the sanctuary.\"},{\"verse\":17,\"text\":\"And the Lord spoke to Moses and Aaron, saying:\"},{\"verse\":18,\"text\":\"Destroy not the people of Caath from the midst of the Levites:\"},{\"verse\":19,\"text\":\"But do this to them, that they may live, and not die, by touching the holies of holies. Aaron and his sons shall go in, and they shall appoint every man his work, and shall divide the burdens that every man is to carry.\"},{\"verse\":20,\"text\":\"Let not others by any curiosity see the things that are in the sanctuary before they be wrapped up, otherwise they shall die.\"},{\"verse\":21,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":22,\"text\":\"Take the sum of the sons of Gerson also by their houses and families and kindreds.\"},{\"verse\":23,\"text\":\"From thirty years old and upward, unto fifty years old. Number them all that go in and minister in the tabernacle of the covenant.\"},{\"verse\":24,\"text\":\"This is the office of the family of the Gersonites:\"},{\"verse\":25,\"text\":\"To carry the curtains of the tabernacle and the roof of the covenant, the other covering, and the violet covering over all, and the hanging that hangeth in the entry of the tabernacle of the covenant,\"},{\"verse\":26,\"text\":\"The curtains of the court, and the veil in the entry that is before tabernacle. All things that pertain to the altar, the cords and the vessels of the ministry,\"},{\"verse\":27,\"text\":\"The sons of Gerson shall carry, by the commandment of Aaron and his sons: and each man shall know to what burden he must be assigned.\"},{\"verse\":28,\"text\":\"This is the service of the family of the Gersonites in the tabernacle of the covenant, and they shall be under the hand of Ithamar the son of Aaron the priest.\"},{\"verse\":29,\"text\":\"Thou shalt reckon up the sons of Merari also by the families and houses of their fathers,\"},{\"verse\":30,\"text\":\"From thirty years old and upward, unto fifty years old, all that go in to the office of their ministry, and to the service of the covenant of the testimony.\"},{\"verse\":31,\"text\":\"These are their burdens: They shall carry the boards of the tabernacle and the bars thereof, the pillars and their sockets,\"},{\"verse\":32,\"text\":\"The pillars also of the court round about, with their sockets and pins and cords. They shall receive by account all the vessels and furniture, and so shall carry them.\"},{\"verse\":33,\"text\":\"This is the office of the family of the Merarites, and their ministry in the tabernacle of the covenant: and they shall be under the hand of Ithamar the son of Aaron the priest.\"},{\"verse\":34,\"text\":\"So Moses and Aaron and the princes of the synagogue reckoned up the sons of Caath, by their kindreds and the houses of their fathers,\"},{\"verse\":35,\"text\":\"From thirty years old and upward, unto fifty years old, all that go in to the ministry of the tabernacle of the covenant:\"},{\"verse\":36,\"text\":\"And they were found two thousand seven hundred and fifty.\"},{\"verse\":37,\"text\":\"This is the number of the people of Caath that go in to the tabernacle of the covenant: these did Moses and Aaron number according to the word of the Lord by the hand of Moses.\"},{\"verse\":38,\"text\":\"The sons of Gerson also were numbered by the kindreds and houses of their fathers,\"},{\"verse\":39,\"text\":\"From thirty years old and upward, unto fifty years old, all that go in to minister in the tabernacle of the covenant:\"},{\"verse\":40,\"text\":\"And they were found two thousand six hundred and thirty.\"},{\"verse\":41,\"text\":\"This is the people of the Gersonites, whom Moses and Aaron numbered according to the word of the Lord.\"},{\"verse\":42,\"text\":\"The sons of Merari also were numbered by the kindreds and houses of their fathers,\"},{\"verse\":43,\"text\":\"From thirty years old and upward, unto fifty years old, all that go in to fulfil the rites of the tabernacle of the covenant:\"},{\"verse\":44,\"text\":\"And they were found three thousand two hundred.\"},{\"verse\":45,\"text\":\"This is the number of the sons of Merari, whom Moses and Aaron reckoned up according to the commandment of the Lord by the hand of Moses.\"},{\"verse\":46,\"text\":\"All that were reckoned up of the Levites, and whom Moses and Aaron and the princes of Israel took by name, by the kindreds and houses of their fathers,\"},{\"verse\":47,\"text\":\"From thirty years old and upward, until fifty years old, that go into the ministry of the tabernacle, and to carry the burdens,\"},{\"verse\":48,\"text\":\"Were in all eight thousand five hundred and eighty.\"},{\"verse\":49,\"text\":\"Moses reckoned them up according to the word of the Lord, every one according to their office and burdens, as the Lord had commanded him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Tolle summam filiorum Caath de medio Levitarum per domos et familias suas,\"},{\"verse\":3,\"text\":\"a trigesimo anno et supra, usque ad quinquagesimum annum, omnium qui ingrediuntur ut stent et ministrent in tabernaculo fœderis.\"},{\"verse\":4,\"text\":\"Hic est cultus filiorum Caath : tabernaculum fœderis, et Sanctum sanctorum\"},{\"verse\":5,\"text\":\"ingredientur Aaron et filii ejus, quando movenda sunt castra, et deponent velum quod pendet ante fores, involventque eo arcam testimonii,\"},{\"verse\":6,\"text\":\"et operient rursum velamine janthinarum pellium, extendentque desuper pallium totum hyacinthinum, et inducent vectes.\"},{\"verse\":7,\"text\":\"Mensam quoque propositionis involvent hyacinthino pallio, et ponent cum ea thuribula et mortariola, cyathos et crateras ad liba fundenda : panes semper in ea erunt :\"},{\"verse\":8,\"text\":\"extendentque desuper pallium coccineum, quod rursum operient velamento janthinarum pellium, et inducent vectes.\"},{\"verse\":9,\"text\":\"Sument et pallium hyacinthinum, quo operient candelabrum cum lucernis et forcipibus suis et emunctoriis et cunctis vasis olei, quæ ad concinnandas lucernas necessaria sunt :\"},{\"verse\":10,\"text\":\"et super omnia ponent operimentum janthinarum pellium, et inducent vectes.\"},{\"verse\":11,\"text\":\"Necnon et altare aureum involvent hyacinthino vestimento, et extendent desuper operimentum janthinarum pellium, inducentque vectes.\"},{\"verse\":12,\"text\":\"Omnia vasa, quibus ministratur in sanctuario, involvent hyacinthino pallio, et extendent desuper operimentum janthinarum pellium, inducentque vectes.\"},{\"verse\":13,\"text\":\"Sed et altare mundabunt cinere, et involvent illud purpureo vestimento,\"},{\"verse\":14,\"text\":\"ponentque cum eo omnia vasa, quibus in ministerio ejus utuntur, id est, ignium receptacula, fuscinulas ac tridentes, uncinos et batilla. Cuncta vasa altaris operient simul velamine janthinarum pellium, et inducent vectes.\"},{\"verse\":15,\"text\":\"Cumque involverint Aaron et filii ejus sanctuarium et omnia vasa ejus in commotione castrorum, tunc intrabunt filii Caath ut portent involuta : et non tangent vasa sanctuarii, ne moriantur. Ista sunt onera filiorum Caath in tabernaculo fœderis :\"},{\"verse\":16,\"text\":\"super quos erit Eleazar filius Aaron sacerdotis, ad cujus curam pertinet oleum ad concinnandas lucernas, et compositionis incensum, et sacrificium, quod semper offertur, et oleum unctionis, et quidquid ad cultum tabernaculi pertinet, omniumque vasorum, quæ in sanctuario sunt.\"},{\"verse\":17,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":18,\"text\":\"Nolite perdere populum Caath de medio Levitarum :\"},{\"verse\":19,\"text\":\"sed hoc facite eis, ut vivant, et non moriantur, si tetigerint Sancta sanctorum. Aaron et filii ejus intrabunt, ipsique disponent opera singulorum, et divident quid portare quis debeat.\"},{\"verse\":20,\"text\":\"Alii nulla curiositate videant quæ sunt in sanctuario priusquam involvantur, alioquin morientur.\"},{\"verse\":21,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":22,\"text\":\"Tolle summam etiam filiorum Gerson per domos ac familias et cognationes suas,\"},{\"verse\":23,\"text\":\"a triginta annis et supra, usque ad annos quinquaginta. Numera omnes qui ingrediuntur et ministrant in tabernaculo fœderis.\"},{\"verse\":24,\"text\":\"Hoc est officium familiæ Gersonitarum,\"},{\"verse\":25,\"text\":\"ut portent cortinas tabernaculi et tectum fœderis, operimentum aliud, et super omnia velamen janthinum tentoriumque quod pendet in introitu tabernaculi fœderis,\"},{\"verse\":26,\"text\":\"cortinas atrii, et velum in introitu quod est ante tabernaculum. Omnia quæ ad altare pertinent, funiculos, et vasa ministerii,\"},{\"verse\":27,\"text\":\"jubente Aaron et filiis ejus, portabunt filii Gerson : et scient singuli cui debeant oneri mancipari.\"},{\"verse\":28,\"text\":\"Hic est cultus familiæ Gersonitarum in tabernaculo fœderis, eruntque sub manu Ithamar filii Aaron sacerdotis.\"},{\"verse\":29,\"text\":\"Filios quoque Merari per familias et domos patrum suorum recensebis,\"},{\"verse\":30,\"text\":\"a triginta annis et supra, usque ad annos quinquaginta, omnes qui ingrediuntur ad officium ministerii sui et cultum fœderis testimonii.\"},{\"verse\":31,\"text\":\"Hæc sunt onera eorum : portabunt tabulas tabernaculi et vectes ejus, columnas ac bases earum,\"},{\"verse\":32,\"text\":\"columnas quoque atrii per circuitum cum basibus et paxillis et funibus suis. Omnia vasa et supellectilem ad numerum accipient, sicque portabunt.\"},{\"verse\":33,\"text\":\"Hoc est officium familiæ Meraritarum et ministerium in tabernaculo fœderis : eruntque sub manu Ithamar filii Aaron sacerdotis.\"},{\"verse\":34,\"text\":\"Recensuerunt igitur Moyses et Aaron et principes synagogæ filios Caath per cognationes et domos patrum suorum,\"},{\"verse\":35,\"text\":\"a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad ministerium tabernaculi fœderis :\"},{\"verse\":36,\"text\":\"et inventi sunt duo millia septingenti quinquaginta.\"},{\"verse\":37,\"text\":\"Hic est numerus populi Caath qui intrant tabernaculum fœderis : hos numeravit Moyses et Aaron juxta sermonem Domini per manum Moysi.\"},{\"verse\":38,\"text\":\"Numerati sunt et filii Gerson per cognationes et domos patrum suorum,\"},{\"verse\":39,\"text\":\"a triginta annos et supra, usque ad quinquagesimum annum, omnes qui ingrediuntur ut ministrent in tabernaculo fœderis :\"},{\"verse\":40,\"text\":\"et inventi sunt duo millia sexcenti triginta.\"},{\"verse\":41,\"text\":\"Hic est populus Gersonitarum, quos numeraverunt Moyses et Aaron juxta verbum Domini.\"},{\"verse\":42,\"text\":\"Numerati sunt et filii Merari per cognationes et domos patrum suorum,\"},{\"verse\":43,\"text\":\"a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad explendos ritus tabernaculi fœderis :\"},{\"verse\":44,\"text\":\"et inventi sunt tria millia ducenti.\"},{\"verse\":45,\"text\":\"Hic est numerus filiorum Merari, quos recensuerunt Moyses et Aaron juxta imperium Domini per manum Moysi.\"},{\"verse\":46,\"text\":\"Omnes qui recensiti sunt de Levitis, et quos recenseri fecit ad nomen Moyses et Aaron, et principes Israël per cognationes et domos patrum suorum,\"},{\"verse\":47,\"text\":\"a triginta annis et supra, usque ad annum quinquagesimum, ingredientes ad ministerium tabernaculi, et onera portanda,\"},{\"verse\":48,\"text\":\"fuerunt simul octo millia quingenti octoginta.\"},{\"verse\":49,\"text\":\"Juxta verbum Domini recensuit eos Moyses, unumquemque juxta officium et onera sua, sicut præceperat ei Dominus.\"}],\"summary\":\"The age and time of the Levites’ service: their offices and burdens.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":3,\"label\":\"Numbers 3\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":5,\"label\":\"Numbers 5\"}}]]\n"])</script></body></html>
