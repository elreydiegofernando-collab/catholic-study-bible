<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Numbers 26 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">26</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The people are again numbered by their tribes and families.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After the blood of the guilty was shed, the Lord said to Moses and to Eleazar the son of Aaron, the priest:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Number the whole sum of the children of Israel from twenty years old and upward, by their houses and kindreds, all that are able to go forth to war.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Moses therefore and Eleazar the priest, being in the plains of Moab upon the Jordan over against Jericho, spoke to them that were</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>From twenty years old and upward, as the Lord had commanded: and this is the number of them:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ruben the firstborn of Israel. His sons were Henoch, of whom is the family of the Henochites: and Phallu, of whom is the family of the Phalluites:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Hesron, of whom is the family of the Hesronites: and Charmi, of whom is the family of the Charmites.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>These are the families of the stock of Ruben: whose number was found to be forty-three thousand seven hundred and thirty.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The son of Phallu was Eliab.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>His sons, were Namuel and Dathan and Abiron. These are Dathan and Abiron the princes of the people, that rose against Moses and Aaron in the sedition of Core, when they rebelled against the Lord:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the earth opening her mouth swallowed up Core, many others dying, when the fire burned two hundred and fifty men. And there was a great miracle wrought,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That when Core perished, his sons did not perish.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The sons of Simeon by their kindreds: Namuel, of him is the family of the Namuelites: Jamin, of him is the family of the Jaminites: Jachim, of him is the family of the Jachimites:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Zare, of him is the family of the Zarites: Saul, of him is the family of the Saulites.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>These are the families of the stock of Simeon, of which the whole number was twenty-two thousand two hundred.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The sons of Gad by their kindreds: Sephon, of him is the family of the Sephonites: Aggi, of him is the family of the Aggites: Suni, of him is the family of the Sunites:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ozni, of him is the family of the Oznites: Her, of him is the family of the Herites:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Arod, of him is the family of the Arodites: Ariel, of him is the family of the Arielites.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>These are the families of Gad, of which the whole number was forty thousand five hundred.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The sons of Juda, Her and Onan, who both died in the land of Chanaan.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the sons of Juda by their kindreds were: Sela, of whom is the family of the Selaites: Phares, of whom is the family of the Pharesites: Zare, of whom is the family of the Zarites.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Moreover the sons of Phares were: Hesron, of whom is the family of the Hesronites: and Hamul, of whom is the family of the Hamulites.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>These are the families of Juda, of which the whole number was seventy-six thousand five hundred.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The sons of Issachar, by their kindreds: Thola of whom is the family of the Tholaites: Phua, of whom is the family of the Phuaites:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Jasub, of whom is the family of the Jasubites: Semran, of whom is the family of the Semranites.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>These are the kindreds of Issachar, whose number was sixty-four thousand three hundred.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The sons of Zabulon by their kindreds: Sared, of whom is the family of the Saredites: Elon, of whom is the family of the Elonites: Jalel, of whom is the family of the Jalelites.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>These are the kindreds of Zabulon, whose number was sixty thousand five hundred.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The sons of Joseph by their kindred, Manasses and Ephraim.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Of Manasses was born Machir, of whom is the family of the Machirites. Machir begot Galaad, of whom is the family of the Galaadites.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Galaad had sons: Jezer, of whom is the family of the Jezerites: and Helec, of whom is the family of the Helecites:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Asriel, of whom is the family of the Asrielites: and Sechem, of whom is the family of the Sechemites:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And Semida, of whom is the family of the Semidaites: and Hepher, of whom is the family of the Hepherites.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And Hepher was the father of Salphaad, who had no sons, but only daughters, whose names are these: Maala, and Noa, and Hegla, and Melcha, and Thersa.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>These are the families of Manasses, and the number of them fifty-two thousand seven hundred.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the sons of Ephraim by their kindreds were these: Suthala, of whom is the family of the Suthalaites: Becher, of whom is the family of the Becherites: Thehen, of whom is the family of the Thehenites.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Now the son of Suthala was Heran, of whom is the family of the Heranites.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>These are the kindreds of the sons of Ephraim: whose number was thirty-two thousand five hundred.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>These are the sons of Joseph by their families. The sons of Benjamin in their kindreds: Bela, of whom is the family of the Belaites: Asbel, of whom is the family of the Asbelites: Ahiram, of whom is the family of the Ahiramites:</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Supham, of whom is the family of the Suphamites: Hupham, of whom is the family of the Huphamites.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The sons of Bela: Hered, and Noeman. Of Hered, is the family of the Heredites: of Noeman, the family of the Noemanites.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>These are the sons of Benjamin by their kindreds, whose number was forty-five thousand six hundred.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The sons of Dan by their kindreds: Suham, of whom is the family of the Suhamites: These are the kindreds of Dan by their families.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>All were Suhamites, whose number was sixty-four thousand four hundred.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>The sons of Aser by their kindreds: Jemna, of whom is the family of the Jemnaites: Jessui, of whom is the family of the Jessuites: Brie, of whom is the family of the Brieites.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>The sons of Brie: Heber, of whom is the family of the Heberites: and Melchiel, of whom is the family of the Melchielites.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And the name of the daughter of Aser, was Sara.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>These are the kindreds of the sons of Aser, and their number fifty-three thousand four hundred.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>The sons of Nephtali by their kindreds: Jesiel, of whom is the family of the Jesielites: Guni, of whom is the family of the Gunites:</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Jeser, of whom is the family of the Jeserites: Sellem, of whom is the family of the Sellemites.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>These are the kindreds of the sons of Nephtali by their families: whose number was forty-five thousand four hundred.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>This is the sum of the children of Israel, that were reckoned up, six hundred and one thousand seven hundred and thirty.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>To these shall the land be divided for their possessions according to the number of names.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>To the greater number thou shalt give a greater portion, and to the fewer a less: to every one, as they have now been reckoned up, shall a possession be delivered:</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Yet so that by lot the land be divided to the tribe and families.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Whatsoever shall fall by lot, that shall be taken by the more, or the fewer.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>This also is the number of the sons of Levi by their families: Gerson, of whom is the family of the Gersonites: Caath, of whom is the family of the Caathites: Merari, of whom is the family of the Merarites.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>These are the families of Levi: The family of Lobni, the family of Hebroni, the family of Moholi, the family of Musi, the family of Core. Now Caath begot Amram:</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Who had to wife Jochabed the daughter of Levi, who was born to him in Egypt. She bore to her husband Amram sons, Aaron and Moses, and Mary their sister.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Of Aaron were born Nadab and Abiu, and Eleazar and Ithamar:</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Of whom Nadab and Abiu died, when they had offered the strange fire before the Lord.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And all that were numbered, were twenty-three thousand males from one month old and upward: for they were not reckoned up among the children of Israel, neither was a possession given to them with the rest.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>This is the number of the children of Israel, that were enrolled by Moses and Eleazar the priest, in the plains of Moab upon the Jordan, over against Jericho.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Among whom there was not one of them that were numbered before by Moses and Aaron in the desert of Sinai.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>For the Lord had foretold that they should die in the wilderness. And none remained of them, but Caleb the son of Jephone, and Josue the son of Nun.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Postquam noxiorum sanguis effusus est, dixit Dominus ad Moysen et Eleazarum filium Aaron sacerdotem :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Numerate omnem summam filiorum Israël a viginti annis et supra, per domos et cognationes suas, cunctos qui possunt ad bella procedere.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Locuti sunt itaque Moyses et Eleazar sacerdos, in campestribus Moab super Jordanem contra Jericho, ad eos qui erant</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>a viginti annis et supra, sicut Dominus imperaverat, quorum iste est numerus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ruben primogenitus Israël : hujus filius, Henoch, a quo familia Henochitarum : et Phallu, a quo familia Phalluitarum :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et Hesron, a quo familia Hesronitarum : et Charmi, a quo familia Charmitarum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hæ sunt familiæ de stirpe Ruben : quarum numerus inventus est quadraginta tria millia, et septingenti triginta.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Filius Phallu, Eliab :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>hujus filii, Namuel et Dathan et Abiron : isti sunt Dathan et Abiron principes populi, qui surrexerunt contra Moysen et Aaron in seditione Core, quando adversus Dominum rebellaverunt :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et aperiens terra os suum devoravit Core, morientibus plurimis, quando combussit ignis ducentos quinquaginta viros. Et factum est grande miraculum,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ut, Core pereunte, filii illius non perirent.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Filii Simeon per cognationes suas : Namuel, ab hoc familia Namuelitarum : Jamin, ab hoc familia Jaminitarum : Jachin, ab hoc familia Jachinitarum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Zare, ab hoc familia Zareitarum : Saul, ab hoc familia Saulitarum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hæ sunt familiæ de stirpe Simeon, quarum omnis numerus fuit viginti duo millia ducenti.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Filii Gad per cognationes suas : Sephon, ab hoc familia Sephonitarum : Aggi, ab hoc familia Aggitarum : Suni, ab hoc familia Sunitarum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ozni, ab hoc familia Oznitarum : Her, ab hoc familia Heritarum :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Arod, ab hoc familia Aroditarum : Ariel, ab hoc familia Arielitarum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Istæ sunt familiæ Gad, quarum omnis numerus fuit quadraginta millia quingenti.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Filii Juda, Her et Onan, qui ambo mortui sunt in terra Chanaan.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Fueruntque filii Juda per cognationes suas : Sela, a quo familia Selaitarum : Phares, a quo familia Pharesitarum : Zare, a quo familia Zareitarum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Porro filii Phares : Hesron, a quo familia Hesronitarum : et Hamul, a quo familia Hamulitarum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Istæ sunt familiæ Juda, quarum omnis numerus fuit septuaginta sex millia quingenti.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Filii Issachar per cognationes suas : Thola, a quo familia Tholaitarum : Phua, a quo familia Phuaitarum :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Jasub, a quo familia Jasubitarum : Semran, a quo familia Semranitarum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hæ sunt cognationes Issachar, quarum numerus fuit sexaginta quatuor millia trecenti.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Filii Zabulon per cognationes suas : Sared, a quo familia Sareditarum : Elon, a quo familia Elonitarum : Jalel, a quo familia Jalelitarum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Hæ sunt cognationes Zabulon, quarum numerus fuit sexaginta millia quingenti.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Filii Joseph per cognationes suas, Manasse et Ephraim.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>De Manasse ortus est Machir, a quo familia Machiritarum. Machir genuit Galaad, a quo familia Galaaditarum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Galaad habuit filios : Jezer, a quo familia Jezeritarum : et Helec, a quo familia Helecitarum :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et Asriel, a quo familia Asrielitarum : et Sechem, a quo familia Sechemitarum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et Semida, a quo familia Semidaitarum : et Hepher, a quo familia Hepheritarum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Fuit autem Hepher pater Salphaad, qui filios non habebat, sed tantum filias : quarum ista sunt nomina : Maala, et Noa, et Hegla, et Melcha, et Thersa.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hæ sunt familiæ Manasse, et numerus earum quinquaginta duo millia septingenti.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Filii autem Ephraim per cognationes suas fuerunt hi : Suthala, a quo familia Suthalaitarum : Becher, a quo familia Becheritarum : Thehen, a quo familia Thehenitarum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Porro filius Suthala fuit Heran, a quo familia Heranitarum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Hæ sunt cognationes filiorum Ephraim : quarum numerus fuit triginta duo millia quingenti.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Isti sunt filii Joseph per familias suas. Filii Benjamin in cognationibus suis : Bela, a quo familia Belaitarum : Asbel, a quo familia Asbelitarum : Ahiram, a quo familia Ahiramitarum :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Supham, a quo familia Suphamitarum : Hupham, a quo familia Huphamitarum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Filii Bela : Hered, et Noëman. De Hered, familia Hereditarum : de Noëman, familia Noëmanitarum.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Hi sunt filii Benjamin per cognationes suas : quorum numerus fuit quadraginta quinque millia sexcenti.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Filii Dan per cognationes suas : Suham, a quo familia Suhamitarum. Hæ sunt cognationes Dan per familias suas.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Omnes fuere Suhamitæ, quorum numerus erat sexaginta quatuor millia quadringenti.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Filii Aser per cognationes suas : Jemna, a quo familia Jemnaitarum : Jessui, a quo familia Jessuitarum : Brie, a quo familia Brieitarum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Filii Brie : Heber, a quo familia Heberitarum : et Melchiel, a quo familia Melchielitarum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Nomen autem filiæ Aser fuit Sara.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Hæ cognationes filiorum Aser, et numerus eorum quinquaginta tria millia quadringenti.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Filii Nephthali per cognationes suas : Jesiel, a quo familia Jesielitarum : Guni, a quo familia Gunitarum :</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Jeser, a quo familia Jeseritarum : Sellem, a quo familia Sellemitarum.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Hæ sunt cognationes filiorum Nephthali per familias suas : quorum numerus quadraginta quinque millia quadringenti.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Ista est summa filiorum Israël, qui recensiti sunt, sexcenta millia, et mille septingenti triginta.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Istis dividetur terra juxta numerum vocabulorum in possessiones suas.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Pluribus majorem partem dabis, et paucioribus minorem : singulis, sicut nunc recensiti sunt, tradetur possessio :</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>ita dumtaxat ut sors terram tribubus dividat et familiis.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Quidquid sorte contigerit, hoc vel plures accipiant, vel pauciores.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Hic quoque est numerus filiorum Levi per familias suas : Gerson, a quo familia Gersonitarum : Caath, a quo familia Caathitarum : Merari, a quo familia Meraritarum.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Hæ sunt familiæ Levi : familia Lobni, familia Hebroni, familia Moholi, familia Musi, familia Core. At vero Caath genuit Amram :</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>qui habuit uxorem Jochabed filiam Levi, quæ nata est ei in Ægypto. Hæc genuit Amram viro suo filios, Aaron, et Moysen, et Mariam sororem eorum.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>De Aaron orti sunt Nadab et Abiu, et Eleazar et Ithamar :</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>quorum Nadab et Abiu mortui sunt, cum obtulissent ignem alienum coram Domino.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Fueruntque omnes qui numerati sunt, viginti tria millia generis masculini ab uno mense et supra : quia non sunt recensiti inter filios Israël, nec eis cum ceteris data possessio est.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Hic est numerus filiorum Israël, qui descripti sunt a Moyse et Eleazaro sacerdote, in campestribus Moab supra Jordanem contra Jericho :</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>inter quos, nullus fuit eorum qui ante numerati sunt a Moyse et Aaron in deserto Sinai :</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>prædixerat enim Dominus quod omnes morerentur in solitudine. Nullusque remansit ex eis, nisi Caleb filius Jephone, et Josue filius Nun.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 25</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/27/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 27</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->26<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdr ",\"h\",{\"children\":[null,[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L15\",null,{\"children\":[\"$\",\"$7\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L16\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n10:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\nd:C\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7f4ee\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Numbers 26 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.26\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":26,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"After the blood of the guilty was shed, the Lord said to Moses and to Eleazar the son of Aaron, the priest:\"},{\"verse\":2,\"text\":\"Number the whole sum of the children of Israel from twenty years old and upward, by their houses and kindreds, all that are able to go forth to war.\"},{\"verse\":3,\"text\":\"Moses therefore and Eleazar the priest, being in the plains of Moab upon the Jordan over against Jericho, spoke to them that were\"},{\"verse\":4,\"text\":\"From twenty years old and upward, as the Lord had commanded: and this is the number of them:\"},{\"verse\":5,\"text\":\"Ruben the firstborn of Israel. His sons were Henoch, of whom is the family of the Henochites: and Phallu, of whom is the family of the Phalluites:\"},{\"verse\":6,\"text\":\"And Hesron, of whom is the family of the Hesronites: and Charmi, of whom is the family of the Charmites.\"},{\"verse\":7,\"text\":\"These are the families of the stock of Ruben: whose number was found to be forty-three thousand seven hundred and thirty.\"},{\"verse\":8,\"text\":\"The son of Phallu was Eliab.\"},{\"verse\":9,\"text\":\"His sons, were Namuel and Dathan and Abiron. These are Dathan and Abiron the princes of the people, that rose against Moses and Aaron in the sedition of Core, when they rebelled against the Lord:\"},{\"verse\":10,\"text\":\"And the earth opening her mouth swallowed up Core, many others dying, when the fire burned two hundred and fifty men. And there was a great miracle wrought,\"},{\"verse\":11,\"text\":\"That when Core perished, his sons did not perish.\"},{\"verse\":12,\"text\":\"The sons of Simeon by their kindreds: Namuel, of him is the family of the Namuelites: Jamin, of him is the family of the Jaminites: Jachim, of him is the family of the Jachimites:\"},{\"verse\":13,\"text\":\"Zare, of him is the family of the Zarites: Saul, of him is the family of the Saulites.\"},{\"verse\":14,\"text\":\"These are the families of the stock of Simeon, of which the whole number was twenty-two thousand two hundred.\"},{\"verse\":15,\"text\":\"The sons of Gad by their kindreds: Sephon, of him is the family of the Sephonites: Aggi, of him is the family of the Aggites: Suni, of him is the family of the Sunites:\"},{\"verse\":16,\"text\":\"Ozni, of him is the family of the Oznites: Her, of him is the family of the Herites:\"},{\"verse\":17,\"text\":\"Arod, of him is the family of the Arodites: Ariel, of him is the family of the Arielites.\"},{\"verse\":18,\"text\":\"These are the families of Gad, of which the whole number was forty thousand five hundred.\"},{\"verse\":19,\"text\":\"The sons of Juda, Her and Onan, who both died in the land of Chanaan.\"},{\"verse\":20,\"text\":\"And the sons of Juda by their kindreds were: Sela, of whom is the family of the Selaites: Phares, of whom is the family of the Pharesites: Zare, of whom is the family of the Zarites.\"},{\"verse\":21,\"text\":\"Moreover the sons of Phares were: Hesron, of whom is the family of the Hesronites: and Hamul, of whom is the family of the Hamulites.\"},{\"verse\":22,\"text\":\"These are the families of Juda, of which the whole number was seventy-six thousand five hundred.\"},{\"verse\":23,\"text\":\"The sons of Issachar, by their kindreds: Thola of whom is the family of the Tholaites: Phua, of whom is the family of the Phuaites:\"},{\"verse\":24,\"text\":\"Jasub, of whom is the family of the Jasubites: Semran, of whom is the family of the Semranites.\"},{\"verse\":25,\"text\":\"These are the kindreds of Issachar, whose number was sixty-four thousand three hundred.\"},{\"verse\":26,\"text\":\"The sons of Zabulon by their kindreds: Sared, of whom is the family of the Saredites: Elon, of whom is the family of the Elonites: Jalel, of whom is the family of the Jalelites.\"},{\"verse\":27,\"text\":\"These are the kindreds of Zabulon, whose number was sixty thousand five hundred.\"},{\"verse\":28,\"text\":\"The sons of Joseph by their kindred, Manasses and Ephraim.\"},{\"verse\":29,\"text\":\"Of Manasses was born Machir, of whom is the family of the Machirites. Machir begot Galaad, of whom is the family of the Galaadites.\"},{\"verse\":30,\"text\":\"Galaad had sons: Jezer, of whom is the family of the Jezerites: and Helec, of whom is the family of the Helecites:\"},{\"verse\":31,\"text\":\"And Asriel, of whom is the family of the Asrielites: and Sechem, of whom is the family of the Sechemites:\"},{\"verse\":32,\"text\":\"And Semida, of whom is the family of the Semidaites: and Hepher, of whom is the family of the Hepherites.\"},{\"verse\":33,\"text\":\"And Hepher was the father of Salphaad, who had no sons, but only daughters, whose names are these: Maala, and Noa, and Hegla, and Melcha, and Thersa.\"},{\"verse\":34,\"text\":\"These are the families of Manasses, and the number of them fifty-two thousand seven hundred.\"},{\"verse\":35,\"text\":\"And the sons of Ephraim by their kindreds were these: Suthala, of whom is the family of the Suthalaites: Becher, of whom is the family of the Becherites: Thehen, of whom is the family of the Thehenites.\"},{\"verse\":36,\"text\":\"Now the son of Suthala was Heran, of whom is the family of the Heranites.\"},{\"verse\":37,\"text\":\"These are the kindreds of the sons of Ephraim: whose number was thirty-two thousand five hundred.\"},{\"verse\":38,\"text\":\"These are the sons of Joseph by their families. The sons of Benjamin in their kindreds: Bela, of whom is the family of the Belaites: Asbel, of whom is the family of the Asbelites: Ahiram, of whom is the family of the Ahiramites:\"},{\"verse\":39,\"text\":\"Supham, of whom is the family of the Suphamites: Hupham, of whom is the family of the Huphamites.\"},{\"verse\":40,\"text\":\"The sons of Bela: Hered, and Noeman. Of Hered, is the family of the Heredites: of Noeman, the family of the Noemanites.\"},{\"verse\":41,\"text\":\"These are the sons of Benjamin by their kindreds, whose number was forty-five thousand six hundred.\"},{\"verse\":42,\"text\":\"The sons of Dan by their kindreds: Suham, of whom is the family of the Suhamites: These are the kindreds of Dan by their families.\"},{\"verse\":43,\"text\":\"All were Suhamites, whose number was sixty-four thousand four hundred.\"},{\"verse\":44,\"text\":\"The sons of Aser by their kindreds: Jemna, of whom is the family of the Jemnaites: Jessui, of whom is the family of the Jessuites: Brie, of whom is the family of the Brieites.\"},{\"verse\":45,\"text\":\"The sons of Brie: Heber, of whom is the family of the Heberites: and Melchiel, of whom is the family of the Melchielites.\"},{\"verse\":46,\"text\":\"And the name of the daughter of Aser, was Sara.\"},{\"verse\":47,\"text\":\"These are the kindreds of the sons of Aser, and their number fifty-three thousand four hundred.\"},{\"verse\":48,\"text\":\"The sons of Nephtali by their kindreds: Jesiel, of whom is the family of the Jesielites: Guni, of whom is the family of the Gunites:\"},{\"verse\":49,\"text\":\"Jeser, of whom is the family of the Jeserites: Sellem, of whom is the family of the Sellemites.\"},{\"verse\":50,\"text\":\"These are the kindreds of the sons of Nephtali by their families: whose number was forty-five thousand four hundred.\"},{\"verse\":51,\"text\":\"This is the sum of the children of Israel, that were reckoned up, six hundred and one thousand seven hundred and thirty.\"},{\"verse\":52,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":53,\"text\":\"To these shall the land be divided for their possessions according to the number of names.\"},{\"verse\":54,\"text\":\"To the greater number thou shalt give a greater portion, and to the fewer a less: to every one, as they have now been reckoned up, shall a possession be delivered:\"},{\"verse\":55,\"text\":\"Yet so that by lot the land be divided to the tribe and families.\"},{\"verse\":56,\"text\":\"Whatsoever shall fall by lot, that shall be taken by the more, or the fewer.\"},{\"verse\":57,\"text\":\"This also is the number of the sons of Levi by their families: Gerson, of whom is the family of the Gersonites: Caath, of whom is the family of the Caathites: Merari, of whom is the family of the Merarites.\"},{\"verse\":58,\"text\":\"These are the families of Levi: The family of Lobni, the family of Hebroni, the family of Moholi, the family of Musi, the family of Core. Now Caath begot Amram:\"},{\"verse\":59,\"text\":\"Who had to wife Jochabed the daughter of Levi, who was born to him in Egypt. She bore to her husband Amram sons, Aaron and Moses, and Mary their sister.\"},{\"verse\":60,\"text\":\"Of Aaron were born Nadab and Abiu, and Eleazar and Ithamar:\"},{\"verse\":61,\"text\":\"Of whom Nadab and Abiu died, when they had offered the strange fire before the Lord.\"},{\"verse\":62,\"text\":\"And all that were numbered, were twenty-three thousand males from one month old and upward: for they were not reckoned up among the children of Israel, neither was a possession given to them with the rest.\"},{\"verse\":63,\"text\":\"This is the number of the children of Israel, that were enrolled by Moses and Eleazar the priest, in the plains of Moab upon the Jordan, over against Jericho.\"},{\"verse\":64,\"text\":\"Among whom there was not one of them that were numbered before by Moses and Aaron in the desert of Sinai.\"},{\"verse\":65,\"text\":\"For the Lord had foretold that they should die in the wilderness. And none remained of them, but Caleb the son of Jephone, and Josue the son of Nun.\"}],\"vul\":[{\"verse\":1,\"text\":\"Postquam noxiorum sanguis effusus est, dixit Dominus ad Moysen et Eleazarum filium Aaron sacerdotem :\"},{\"verse\":2,\"text\":\"Numerate omnem summam filiorum Israël a viginti annis et supra, per domos et cognationes suas, cunctos qui possunt ad bella procedere.\"},{\"verse\":3,\"text\":\"Locuti sunt itaque Moyses et Eleazar sacerdos, in campestribus Moab super Jordanem contra Jericho, ad eos qui erant\"},{\"verse\":4,\"text\":\"a viginti annis et supra, sicut Dominus imperaverat, quorum iste est numerus.\"},{\"verse\":5,\"text\":\"Ruben primogenitus Israël : hujus filius, Henoch, a quo familia Henochitarum : et Phallu, a quo familia Phalluitarum :\"},{\"verse\":6,\"text\":\"et Hesron, a quo familia Hesronitarum : et Charmi, a quo familia Charmitarum.\"},{\"verse\":7,\"text\":\"Hæ sunt familiæ de stirpe Ruben : quarum numerus inventus est quadraginta tria millia, et septingenti triginta.\"},{\"verse\":8,\"text\":\"Filius Phallu, Eliab :\"},{\"verse\":9,\"text\":\"hujus filii, Namuel et Dathan et Abiron : isti sunt Dathan et Abiron principes populi, qui surrexerunt contra Moysen et Aaron in seditione Core, quando adversus Dominum rebellaverunt :\"},{\"verse\":10,\"text\":\"et aperiens terra os suum devoravit Core, morientibus plurimis, quando combussit ignis ducentos quinquaginta viros. Et factum est grande miraculum,\"},{\"verse\":11,\"text\":\"ut, Core pereunte, filii illius non perirent.\"},{\"verse\":12,\"text\":\"Filii Simeon per cognationes suas : Namuel, ab hoc familia Namuelitarum : Jamin, ab hoc familia Jaminitarum : Jachin, ab hoc familia Jachinitarum :\"},{\"verse\":13,\"text\":\"Zare, ab hoc familia Zareitarum : Saul, ab hoc familia Saulitarum.\"},{\"verse\":14,\"text\":\"Hæ sunt familiæ de stirpe Simeon, quarum omnis numerus fuit viginti duo millia ducenti.\"},{\"verse\":15,\"text\":\"Filii Gad per cognationes suas : Sephon, ab hoc familia Sephonitarum : Aggi, ab hoc familia Aggitarum : Suni, ab hoc familia Sunitarum :\"},{\"verse\":16,\"text\":\"Ozni, ab hoc familia Oznitarum : Her, ab hoc familia Heritarum :\"},{\"verse\":17,\"text\":\"Arod, ab hoc familia Aroditarum : Ariel, ab hoc familia Arielitarum.\"},{\"verse\":18,\"text\":\"Istæ sunt familiæ Gad, quarum omnis numerus fuit quadraginta millia quingenti.\"},{\"verse\":19,\"text\":\"Filii Juda, Her et Onan, qui ambo mortui sunt in terra Chanaan.\"},{\"verse\":20,\"text\":\"Fueruntque filii Juda per cognationes suas : Sela, a quo familia Selaitarum : Phares, a quo familia Pharesitarum : Zare, a quo familia Zareitarum.\"},{\"verse\":21,\"text\":\"Porro filii Phares : Hesron, a quo familia Hesronitarum : et Hamul, a quo familia Hamulitarum.\"},{\"verse\":22,\"text\":\"Istæ sunt familiæ Juda, quarum omnis numerus fuit septuaginta sex millia quingenti.\"},{\"verse\":23,\"text\":\"Filii Issachar per cognationes suas : Thola, a quo familia Tholaitarum : Phua, a quo familia Phuaitarum :\"},{\"verse\":24,\"text\":\"Jasub, a quo familia Jasubitarum : Semran, a quo familia Semranitarum.\"},{\"verse\":25,\"text\":\"Hæ sunt cognationes Issachar, quarum numerus fuit sexaginta quatuor millia trecenti.\"},{\"verse\":26,\"text\":\"Filii Zabulon per cognationes suas : Sared, a quo familia Sareditarum : Elon, a quo familia Elonitarum : Jalel, a quo familia Jalelitarum.\"},{\"verse\":27,\"text\":\"Hæ sunt cognationes Zabulon, quarum numerus fuit sexaginta millia quingenti.\"},{\"verse\":28,\"text\":\"Filii Joseph per cognationes suas, Manasse et Ephraim.\"},{\"verse\":29,\"text\":\"De Manasse ortus est Machir, a quo familia Machiritarum. Machir genuit Galaad, a quo familia Galaaditarum.\"},{\"verse\":30,\"text\":\"Galaad habuit filios : Jezer, a quo familia Jezeritarum : et Helec, a quo familia Helecitarum :\"},{\"verse\":31,\"text\":\"et Asriel, a quo familia Asrielitarum : et Sechem, a quo familia Sechemitarum :\"},{\"verse\":32,\"text\":\"et Semida, a quo familia Semidaitarum : et Hepher, a quo familia Hepheritarum.\"},{\"verse\":33,\"text\":\"Fuit autem Hepher pater Salphaad, qui filios non habebat, sed tantum filias : quarum ista sunt nomina : Maala, et Noa, et Hegla, et Melcha, et Thersa.\"},{\"verse\":34,\"text\":\"Hæ sunt familiæ Manasse, et numerus earum quinquaginta duo millia septingenti.\"},{\"verse\":35,\"text\":\"Filii autem Ephraim per cognationes suas fuerunt hi : Suthala, a quo familia Suthalaitarum : Becher, a quo familia Becheritarum : Thehen, a quo familia Thehenitarum.\"},{\"verse\":36,\"text\":\"Porro filius Suthala fuit Heran, a quo familia Heranitarum.\"},{\"verse\":37,\"text\":\"Hæ sunt cognationes filiorum Ephraim : quarum numerus fuit triginta duo millia quingenti.\"},{\"verse\":38,\"text\":\"Isti sunt filii Joseph per familias suas. Filii Benjamin in cognationibus suis : Bela, a quo familia Belaitarum : Asbel, a quo familia Asbelitarum : Ahiram, a quo familia Ahiramitarum :\"},{\"verse\":39,\"text\":\"Supham, a quo familia Suphamitarum : Hupham, a quo familia Huphamitarum.\"},{\"verse\":40,\"text\":\"Filii Bela : Hered, et Noëman. De Hered, familia Hereditarum : de Noëman, familia Noëmanitarum.\"},{\"verse\":41,\"text\":\"Hi sunt filii Benjamin per cognationes suas : quorum numerus fuit quadraginta quinque millia sexcenti.\"},{\"verse\":42,\"text\":\"Filii Dan per cognationes suas : Suham, a quo familia Suhamitarum. Hæ sunt cognationes Dan per familias suas.\"},{\"verse\":43,\"text\":\"Omnes fuere Suhamitæ, quorum numerus erat sexaginta quatuor millia quadringenti.\"},{\"verse\":44,\"text\":\"Filii Aser per cognationes suas : Jemna, a quo familia Jemnaitarum : Jessui, a quo familia Jessuitarum : Brie, a quo familia Brieitarum.\"},{\"verse\":45,\"text\":\"Filii Brie : Heber, a quo familia Heberitarum : et Melchiel, a quo familia Melchielitarum.\"},{\"verse\":46,\"text\":\"Nomen autem filiæ Aser fuit Sara.\"},{\"verse\":47,\"text\":\"Hæ cognationes filiorum Aser, et numerus eorum quinquaginta tria millia quadringenti.\"},{\"verse\":48,\"text\":\"Filii Nephthali per cognationes suas : Jesiel, a quo familia Jesielitarum : Guni, a quo familia Gunitarum :\"},{\"verse\":49,\"text\":\"Jeser, a quo familia Jeseritarum : Sellem, a quo familia Sellemitarum.\"},{\"verse\":50,\"text\":\"Hæ sunt cognationes filiorum Nephthali per familias suas : quorum numerus quadraginta quinque millia quadringenti.\"},{\"verse\":51,\"text\":\"Ista est summa filiorum Israël, qui recensiti sunt, sexcenta millia, et mille septingenti triginta.\"},{\"verse\":52,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":53,\"text\":\"Istis dividetur terra juxta numerum vocabulorum in possessiones suas.\"},{\"verse\":54,\"text\":\"Pluribus majorem partem dabis, et paucioribus minorem : singulis, sicut nunc recensiti sunt, tradetur possessio :\"},{\"verse\":55,\"text\":\"ita dumtaxat ut sors terram tribubus dividat et familiis.\"},{\"verse\":56,\"text\":\"Quidquid sorte contigerit, hoc vel plures accipiant, vel pauciores.\"},{\"verse\":57,\"text\":\"Hic quoque est numerus filiorum Levi per familias suas : Gerson, a quo familia Gersonitarum : Caath, a quo familia Caathitarum : Merari, a quo familia Meraritarum.\"},{\"verse\":58,\"text\":\"Hæ sunt familiæ Levi : familia Lobni, familia Hebroni, familia Moholi, familia Musi, familia Core. At vero Caath genuit Amram :\"},{\"verse\":59,\"text\":\"qui habuit uxorem Jochabed filiam Levi, quæ nata est ei in Ægypto. Hæc genuit Amram viro suo filios, Aaron, et Moysen, et Mariam sororem eorum.\"},{\"verse\":60,\"text\":\"De Aaron orti sunt Nadab et Abiu, et Eleazar et Ithamar :\"},{\"verse\":61,\"text\":\"quorum Nadab et Abiu mortui sunt, cum obtulissent ignem alienum coram Domino.\"},{\"verse\":62,\"text\":\"Fueruntque omnes qui numerati sunt, viginti tria millia generis masculini ab uno mense et supra : quia non sunt recensiti inter filios Israël, nec eis cum ceteris data possessio est.\"},{\"verse\":63,\"text\":\"Hic est numerus filiorum Israël, qui descripti sunt a Moyse et Eleazaro sacerdote, in campestribus Moab supra Jordanem contra Jericho :\"},{\"verse\":64,\"text\":\"inter quos, nullus fuit eorum qui ante numerati sunt a Moyse et Aaron in deserto Sinai :\"},{\"verse\":65,\"text\":\"prædixerat enim Dominus quod omnes morerentur in solitudine. Nullusque remansit ex eis, nisi Caleb filius Jephone, et Josue filius Nun.\"}],\"summary\":\"The people are again numbered by their tribes and families.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":25,\"label\":\"Numbers 25\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":27,\"label\":\"Numbers 27\"}}]]\n"])</script></body></html>
