tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">33</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The mansions or journeys of the children of Israel towards the land of promise.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>These are the mansions of the children of Israel, who went out of Egypt by their troops under the conduct of Moses and Aaron,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Which Moses wrote down according to the places of their encamping, which they changed by the commandment of the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Now the children of Israel departed from Ramesses the first month, on the fifteenth day of the first month, the day after the phase, with a mighty hand, in the sight of all the Egyptians,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who were burying their firstborn, whom the Lord had slain (upon their gods also he had executed vengeance,)</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they camped in Soccoth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And from Soccoth they came into Etham, which is in the uttermost borders of the wilderness.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Departing from thence they came over against Phihahiroth, which looketh towards Beelsephon, and they camped before Magdalum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And departing from Phihahiroth, they passed through the midst of the sea into the wilderness: and having marched three days through the desert of Etham, they camped in Mara.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And departing from Mara, they came into Elim, where there were twelve fountains of waters, and seventy palm trees: and there they camped.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But departing from thence also, they pitched their tents by the Red Sea. And departing from the Red Sea,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>They camped in the desert of Sin.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they removed from thence, and came to Daphca.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And departing from Daphca, they camped in Alus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And departing from Alus, they pitched their tents in Raphidim, where the people wanted water to drink.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And departing from Raphidim, they camped in the desert of Sinai.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But departing also from the desert of Sinai, they came to the graves of lust.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And departing from the graves of lust, they camped in Haseroth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And from Haseroth they came to Rethma.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And departing from Rethma, they camped in Remmomphares.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they departed from thence and came to Lebna.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Removing from Lebna they camped in Ressa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And departing from Ressa, they came to Ceelatha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they removed from thence and camped in the mountain Sepher.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Departing from the mountain Sepher, they came to Arada,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>From thence they went and camped in Maceloth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And departing from Maceloth, they came to Thahath.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Removing from Thahath they camped in Thare.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they departed from thence, and pitched their tents in Methca.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And removing from Methca, they camped in Hesmona.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And departing from Hesmona, they came to Moseroth.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And removing from Moseroth, they camped in Benejaacan.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And departing from Benejaacan, they came to mount Gadgad.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>From thence they went and camped in Jetebatha.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And from Jetebatha they came to Hebrona.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And departing from Hebrona, they camped in Asiongaber.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>They removed from thence and came into the desert of Sin, which is Cades.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And departing from Cades, they camped in mount Hor, in the uttermost borders of the land of Edom.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Aaron the priest went up into mount Hor at the commandment of the Lord: and there he died in the fortieth year of the coming forth of the children of Israel out of Egypt, the fifth month, the first day of the month,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>When he was a hundred and twenty-three years old.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And king Arad the Chanaanite, who dwelt towards the south, heard that the children of Israel were come to the land of Chanaan.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And they departed from mount Hor, and camped in Salmona.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>From whence they removed and came to Phunon.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And departing from Phunon, they camped in Oboth.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And from Oboth they came to Ijeabarim, which is in the borders of the Moabites.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And departing from Ijeabarim they pitched their tents in Dibongab.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>From thence they went and camped in Helmondeblathaim.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And departing from Helmondeblathaim, they came to the mountains of Abarim over against Nabo.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And departing from the mountains of Abarim, they passed to the plains of Moab, by the Jordan, over against Jericho.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And there they camped from Bethsimoth even to Ablesatim in the plains of the Moabites,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Where the Lord said to Moses:</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Command the children of Israel, and say to them: When you shall have passed over the Jordan, entering into the land of Chanaan,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Destroy all the inhabitants of that land: Beat down their pillars, and break in pieces their statues, and waste all their high places,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Cleansing the land, and dwelling in it. For I have given it you for a possession.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And you shall divide it among you by lot. To the more you shall give a larger part, and to the fewer a lesser. To every one as the lot shall fall, so shall the inheritance be given. The possession shall be divided by the tribes and the families.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>But if you will not kill the inhabitants of the land: they that remain, shall be unto you as nails in your eyes, and spears in your sides, and they shall be your adversaries in the land of your habitation.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And whatsoever I had thought to do to them, I will do to you.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæ sunt mansiones filiorum Israël, qui egressi sunt de Ægypto per turmas suas in manu Moysi et Aaron,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>quas descripsit Moyses juxta castrorum loca, quæ Domini jussione mutabant.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Profecti igitur de Ramesse mense primo, quintadecima die mensis primi, altera die Phase, filii Israël in manu excelsa, videntibus cunctis Ægyptiis,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et sepelientibus primogenitos, quos percusserat Dominus (nam et in diis eorum exercuerat ultionem),</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>castrametati sunt in Soccoth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et de Soccoth venerunt in Etham, quæ est in extremis finibus solitudinis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Inde egressi venerunt contra Phihahiroth, quæ respicit Beelsephon, et castrametati sunt ante Magdalum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Profectique de Phihahiroth, transierunt per medium mare in solitudinem : et ambulantes tribus diebus per desertum Etham, castrametati sunt in Mara.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Profectique de Mara, venerunt in Elim, ubi erant duodecim fontes aquarum, et palmæ septuaginta : ibique castrametati sunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sed et inde egressi, fixerunt tentoria super mare Rubrum. Profectique de mari Rubro,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>castrametati sunt in deserto Sin.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Unde egressi, venerunt in Daphca.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Profectique de Daphca, castrametati sunt in Alus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Egressique de Alus, in Raphidim fixere tentoria, ubi populo defuit aqua ad bibendum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Profectique de Raphidim, castrametati sunt in deserto Sinai.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sed et de solitudine Sinai egressi, venerunt ad sepulchra concupiscentiæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Profectique de sepulchris concupiscentiæ, castrametati sunt in Haseroth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et de Haseroth venerunt in Rethma.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Profectique de Rethma, castrametati sunt in Remmomphares.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Unde egressi venerunt in Lebna.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>De Lebna castrametati sunt in Ressa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Egressique de Ressa, venerunt in Ceelatha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Unde profecti, castrametati sunt in monte Sepher.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Egressi de monte Sepher, venerunt in Arada.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Inde proficiscentes, castrametati sunt in Maceloth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Profectique de Maceloth, venerunt in Thahath.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>De Thahath, castrametati sunt in Thare.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Unde egressi, fixere tentoria in Methca.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et de Methca, castrametati sunt in Hesmona.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Profectique de Hesmona, venerunt in Moseroth.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et de Moseroth, castrametati sunt in Benejaacan.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Profectique de Benejaacan, venerunt in montem Gadgad.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Unde profecti, castrametati sunt in Jetebatha.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et de Jetebatha venerunt in Hebrona.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Egressique de Hebrona, castrametati sunt in Asiongaber.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Inde profecti, venerunt in desertum Sin, hæc est Cades.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Egressique de Cades, castrametati sunt in monte Hor, in extremis finibus terræ Edom.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ascenditque Aaron sacerdos in montem Hor jubente Domino : et ibi mortuus est anno quadragesimo egressionis filiorum Israël ex Ægypto, mense quinto, prima die mensis,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>cum esset annorum centum viginti trium.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Audivitque Chananæus rex Arad, qui habitabat ad meridiem, in terram Chanaan venisse filios Israël.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et profecti de monte Hor, castrametati sunt in Salmona.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Unde egressi, venerunt in Phunon.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Profectique de Phunon, castrametati sunt in Oboth.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et de Oboth venerunt in Ijeabarim, quæ est in finibus Moabitarum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Profectique de Ijeabarim, fixere tentoria in Dibongad.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Unde egressi, castrametati sunt in Helmondeblathaim.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Egressique de Helmondeblathaim, venerunt ad montes Abarim contra Nabo.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Profectique de montibus Abarim, transierunt ad campestria Moab, supra Jordanem, contra Jericho.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Ibique castrametati sunt de Bethsimoth usque ad Abelsatim in planioribus locis Moabitarum.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Ubi locutus est Dominus ad Moysen :</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Præcipe filiis Israël, et dic ad eos : Quando transieritis Jordanem, intrantes terram Chanaan,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>disperdite cunctos habitatores terræ illius : confringite titulos, et statuas comminuite, atque omnia excelsa vastate,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>mundantes terram, et habitantes in ea. Ego enim dedi vobis illam in possessionem,</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>quam dividetis vobis sorte. Pluribus dabitis latiorem, et paucis angustiorem. Singulis ut sors ceciderit, ita tribuetur hæreditas. Per tribus et familias possessio dividetur.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Sin autem nolueritis interficere habitatores terræ : qui remanserint, erunt vobis quasi clavi in oculis, et lanceæ in lateribus, et adversabuntur vobis in terra habitationis vestræ :</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>et quidquid illis cogitaveram facere, vobis faciam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/32/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 32</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border bord th the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.33\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":33,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"These are the mansions of the children of Israel, who went out of Egypt by their troops under the conduct of Moses and Aaron,\"},{\"verse\":2,\"text\":\"Which Moses wrote down according to the places of their encamping, which they changed by the commandment of the Lord.\"},{\"verse\":3,\"text\":\"Now the children of Israel departed from Ramesses the first month, on the fifteenth day of the first month, the day after the phase, with a mighty hand, in the sight of all the Egyptians,\"},{\"verse\":4,\"text\":\"Who were burying their firstborn, whom the Lord had slain (upon their gods also he had executed vengeance,)\"},{\"verse\":5,\"text\":\"And they camped in Soccoth.\"},{\"verse\":6,\"text\":\"And from Soccoth they came into Etham, which is in the uttermost borders of the wilderness.\"},{\"verse\":7,\"text\":\"Departing from thence they came over against Phihahiroth, which looketh towards Beelsephon, and they camped before Magdalum.\"},{\"verse\":8,\"text\":\"And departing from Phihahiroth, they passed through the midst of the sea into the wilderness: and having marched three days through the desert of Etham, they camped in Mara.\"},{\"verse\":9,\"text\":\"And departing from Mara, they came into Elim, where there were twelve fountains of waters, and seventy palm trees: and there they camped.\"},{\"verse\":10,\"text\":\"But departing from thence also, they pitched their tents by the Red Sea. And departing from the Red Sea,\"},{\"verse\":11,\"text\":\"They camped in the desert of Sin.\"},{\"verse\":12,\"text\":\"And they removed from thence, and came to Daphca.\"},{\"verse\":13,\"text\":\"And departing from Daphca, they camped in Alus.\"},{\"verse\":14,\"text\":\"And departing from Alus, they pitched their tents in Raphidim, where the people wanted water to drink.\"},{\"verse\":15,\"text\":\"And departing from Raphidim, they camped in the desert of Sinai.\"},{\"verse\":16,\"text\":\"But departing also from the desert of Sinai, they came to the graves of lust.\"},{\"verse\":17,\"text\":\"And departing from the graves of lust, they camped in Haseroth.\"},{\"verse\":18,\"text\":\"And from Haseroth they came to Rethma.\"},{\"verse\":19,\"text\":\"And departing from Rethma, they camped in Remmomphares.\"},{\"verse\":20,\"text\":\"And they departed from thence and came to Lebna.\"},{\"verse\":21,\"text\":\"Removing from Lebna they camped in Ressa.\"},{\"verse\":22,\"text\":\"And departing from Ressa, they came to Ceelatha.\"},{\"verse\":23,\"text\":\"And they removed from thence and camped in the mountain Sepher.\"},{\"verse\":24,\"text\":\"Departing from the mountain Sepher, they came to Arada,\"},{\"verse\":25,\"text\":\"From thence they went and camped in Maceloth.\"},{\"verse\":26,\"text\":\"And departing from Maceloth, they came to Thahath.\"},{\"verse\":27,\"text\":\"Removing from Thahath they camped in Thare.\"},{\"verse\":28,\"text\":\"And they departed from thence, and pitched their tents in Methca.\"},{\"verse\":29,\"text\":\"And removing from Methca, they camped in Hesmona.\"},{\"verse\":30,\"text\":\"And departing from Hesmona, they came to Moseroth.\"},{\"verse\":31,\"text\":\"And removing from Moseroth, they camped in Benejaacan.\"},{\"verse\":32,\"text\":\"And departing from Benejaacan, they came to mount Gadgad.\"},{\"verse\":33,\"text\":\"From thence they went and camped in Jetebatha.\"},{\"verse\":34,\"text\":\"And from Jetebatha they came to Hebrona.\"},{\"verse\":35,\"text\":\"And departing from Hebrona, they camped in Asiongaber.\"},{\"verse\":36,\"text\":\"They removed from thence and came into the desert of Sin, which is Cades.\"},{\"verse\":37,\"text\":\"And departing from Cades, they camped in mount Hor, in the uttermost borders of the land of Edom.\"},{\"verse\":38,\"text\":\"And Aaron the priest went up into mount Hor at the commandment of the Lord: and there he died in the fortieth year of the coming forth of the children of Israel out of Egypt, the fifth month, the first day of the month,\"},{\"verse\":39,\"text\":\"When he was a hundred and twenty-three years old.\"},{\"verse\":40,\"text\":\"And king Arad the Chanaanite, who dwelt towards the south, heard that the children of Israel were come to the land of Chanaan.\"},{\"verse\":41,\"text\":\"And they departed from mount Hor, and camped in Salmona.\"},{\"verse\":42,\"text\":\"From whence they removed and came to Phunon.\"},{\"verse\":43,\"text\":\"And departing from Phunon, they camped in Oboth.\"},{\"verse\":44,\"text\":\"And from Oboth they came to Ijeabarim, which is in the borders of the Moabites.\"},{\"verse\":45,\"text\":\"And departing from Ijeabarim they pitched their tents in Dibongab.\"},{\"verse\":46,\"text\":\"From thence they went and camped in Helmondeblathaim.\"},{\"verse\":47,\"text\":\"And departing from Helmondeblathaim, they came to the mountains of Abarim over against Nabo.\"},{\"verse\":48,\"text\":\"And departing from the mountains of Abarim, they passed to the plains of Moab, by the Jordan, over against Jericho.\"},{\"verse\":49,\"text\":\"And there they camped from Bethsimoth even to Ablesatim in the plains of the Moabites,\"},{\"verse\":50,\"text\":\"Where the Lord said to Moses:\"},{\"verse\":51,\"text\":\"Command the children of Israel, and say to them: When you shall have passed over the Jordan, entering into the land of Chanaan,\"},{\"verse\":52,\"text\":\"Destroy all the inhabitants of that land: Beat down their pillars, and break in pieces their statues, and waste all their high places,\"},{\"verse\":53,\"text\":\"Cleansing the land, and dwelling in it. For I have given it you for a possession.\"},{\"verse\":54,\"text\":\"And you shall divide it among you by lot. To the more you shall give a larger part, and to the fewer a lesser. To every one as the lot shall fall, so shall the inheritance be given. The possession shall be divided by the tribes and the families.\"},{\"verse\":55,\"text\":\"But if you will not kill the inhabitants of the land: they that remain, shall be unto you as nails in your eyes, and spears in your sides, and they shall be your adversaries in the land of your habitation.\"},{\"verse\":56,\"text\":\"And whatsoever I had thought to do to them, I will do to you.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæ sunt mansiones filiorum Israël, qui egressi sunt de Ægypto per turmas suas in manu Moysi et Aaron,\"},{\"verse\":2,\"text\":\"quas descripsit Moyses juxta castrorum loca, quæ Domini jussione mutabant.\"},{\"verse\":3,\"text\":\"Profecti igitur de Ramesse mense primo, quintadecima die mensis primi, altera die Phase, filii Israël in manu excelsa, videntibus cunctis Ægyptiis,\"},{\"verse\":4,\"text\":\"et sepelientibus primogenitos, quos percusserat Dominus (nam et in diis eorum exercuerat ultionem),\"},{\"verse\":5,\"text\":\"castrametati sunt in Soccoth.\"},{\"verse\":6,\"text\":\"Et de Soccoth venerunt in Etham, quæ est in extremis finibus solitudinis.\"},{\"verse\":7,\"text\":\"Inde egressi venerunt contra Phihahiroth, quæ respicit Beelsephon, et castrametati sunt ante Magdalum.\"},{\"verse\":8,\"text\":\"Profectique de Phihahiroth, transierunt per medium mare in solitudinem : et ambulantes tribus diebus per desertum Etham, castrametati sunt in Mara.\"},{\"verse\":9,\"text\":\"Profectique de Mara, venerunt in Elim, ubi erant duodecim fontes aquarum, et palmæ septuaginta : ibique castrametati sunt.\"},{\"verse\":10,\"text\":\"Sed et inde egressi, fixerunt tentoria super mare Rubrum. Profectique de mari Rubro,\"},{\"verse\":11,\"text\":\"castrametati sunt in deserto Sin.\"},{\"verse\":12,\"text\":\"Unde egressi, venerunt in Daphca.\"},{\"verse\":13,\"text\":\"Profectique de Daphca, castrametati sunt in Alus.\"},{\"verse\":14,\"text\":\"Egressique de Alus, in Raphidim fixere tentoria, ubi populo defuit aqua ad bibendum.\"},{\"verse\":15,\"text\":\"Profectique de Raphidim, castrametati sunt in deserto Sinai.\"},{\"verse\":16,\"text\":\"Sed et de solitudine Sinai egressi, venerunt ad sepulchra concupiscentiæ.\"},{\"verse\":17,\"text\":\"Profectique de sepulchris concupiscentiæ, castrametati sunt in Haseroth.\"},{\"verse\":18,\"text\":\"Et de Haseroth venerunt in Rethma.\"},{\"verse\":19,\"text\":\"Profectique de Rethma, castrametati sunt in Remmomphares.\"},{\"verse\":20,\"text\":\"Unde egressi venerunt in Lebna.\"},{\"verse\":21,\"text\":\"De Lebna castrametati sunt in Ressa.\"},{\"verse\":22,\"text\":\"Egressique de Ressa, venerunt in Ceelatha.\"},{\"verse\":23,\"text\":\"Unde profecti, castrametati sunt in monte Sepher.\"},{\"verse\":24,\"text\":\"Egressi de monte Sepher, venerunt in Arada.\"},{\"verse\":25,\"text\":\"Inde proficiscentes, castrametati sunt in Maceloth.\"},{\"verse\":26,\"text\":\"Profectique de Maceloth, venerunt in Thahath.\"},{\"verse\":27,\"text\":\"De Thahath, castrametati sunt in Thare.\"},{\"verse\":28,\"text\":\"Unde egressi, fixere tentoria in Methca.\"},{\"verse\":29,\"text\":\"Et de Methca, castrametati sunt in Hesmona.\"},{\"verse\":30,\"text\":\"Profectique de Hesmona, venerunt in Moseroth.\"},{\"verse\":31,\"text\":\"Et de Moseroth, castrametati sunt in Benejaacan.\"},{\"verse\":32,\"text\":\"Profectique de Benejaacan, venerunt in montem Gadgad.\"},{\"verse\":33,\"text\":\"Unde profecti, castrametati sunt in Jetebatha.\"},{\"verse\":34,\"text\":\"Et de Jetebatha venerunt in Hebrona.\"},{\"verse\":35,\"text\":\"Egressique de Hebrona, castrametati sunt in Asiongaber.\"},{\"verse\":36,\"text\":\"Inde profecti, venerunt in desertum Sin, hæc est Cades.\"},{\"verse\":37,\"text\":\"Egressique de Cades, castrametati sunt in monte Hor, in extremis finibus terræ Edom.\"},{\"verse\":38,\"text\":\"Ascenditque Aaron sacerdos in montem Hor jubente Domino : et ibi mortuus est anno quadragesimo egressionis filiorum Israël ex Ægypto, mense quinto, prima die mensis,\"},{\"verse\":39,\"text\":\"cum esset annorum centum viginti trium.\"},{\"verse\":40,\"text\":\"Audivitque Chananæus rex Arad, qui habitabat ad meridiem, in terram Chanaan venisse filios Israël.\"},{\"verse\":41,\"text\":\"Et profecti de monte Hor, castrametati sunt in Salmona.\"},{\"verse\":42,\"text\":\"Unde egressi, venerunt in Phunon.\"},{\"verse\":43,\"text\":\"Profectique de Phunon, castrametati sunt in Oboth.\"},{\"verse\":44,\"text\":\"Et de Oboth venerunt in Ijeabarim, quæ est in finibus Moabitarum.\"},{\"verse\":45,\"text\":\"Profectique de Ijeabarim, fixere tentoria in Dibongad.\"},{\"verse\":46,\"text\":\"Unde egressi, castrametati sunt in Helmondeblathaim.\"},{\"verse\":47,\"text\":\"Egressique de Helmondeblathaim, venerunt ad montes Abarim contra Nabo.\"},{\"verse\":48,\"text\":\"Profectique de montibus Abarim, transierunt ad campestria Moab, supra Jordanem, contra Jericho.\"},{\"verse\":49,\"text\":\"Ibique castrametati sunt de Bethsimoth usque ad Abelsatim in planioribus locis Moabitarum.\"},{\"verse\":50,\"text\":\"Ubi locutus est Dominus ad Moysen :\"},{\"verse\":51,\"text\":\"Præcipe filiis Israël, et dic ad eos : Quando transieritis Jordanem, intrantes terram Chanaan,\"},{\"verse\":52,\"text\":\"disperdite cunctos habitatores terræ illius : confringite titulos, et statuas comminuite, atque omnia excelsa vastate,\"},{\"verse\":53,\"text\":\"mundantes terram, et habitantes in ea. Ego enim dedi vobis illam in possessionem,\"},{\"verse\":54,\"text\":\"quam dividetis vobis sorte. Pluribus dabitis latiorem, et paucis angustiorem. Singulis ut sors ceciderit, ita tribuetur hæreditas. Per tribus et familias possessio dividetur.\"},{\"verse\":55,\"text\":\"Sin autem nolueritis interficere habitatores terræ : qui remanserint, erunt vobis quasi clavi in oculis, et lanceæ in lateribus, et adversabuntur vobis in terra habitationis vestræ :\"},{\"verse\":56,\"text\":\"et quidquid illis cogitaveram facere, vobis faciam.\"}],\"summary\":\"The mansions or journeys of the children of Israel towards the land of promise.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":32,\"label\":\"Numbers 32\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":34,\"label\":\"Numbers 34\"}}]]\n"])</script></body></html>
