-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">19</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The law of the sacrifice of the red cow, and the water of expiation.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>This is the observance of the victim, which the Lord hath ordained. Command the children of Israel, that they bring unto thee a red cow of full age, in which there is no blemish, and which hath not carried the yoke:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And you shall deliver her to Eleazar the priest, who shall bring her forth without the camp, and shall immolate her in the sight of all:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And dipping his finger in her blood, shall sprinkle it over against the door of the tabernacle seven times,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And shall burn her in the sight of all delivering up to the fire her skin, and her flesh, and her blood, and her dung.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The priest shall also take cedar wood, and hyssop, and scarlet twice dyed, and cast it into the flame, with which the cow is consumed.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And then after washing his garments, and body, he shall enter into the camp, and shall be unclean until the evening.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He also that hath burned her, shall wash his garments, and his body, and shall be unclean until the evening.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And a man that is clean shall gather up the ashes of the cow, and shall pour them forth without the camp in a most clean place, that they may be reserved for the multitude of the children of Israel, and for a water of aspersion: because the cow was burnt for sin.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when he that carried the ashes of the cow, hath washed his garments, he shall be unclean until the evening. The children of Israel, and the strangers that dwell among them, shall observe this for a holy thing by a perpetual ordinance.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He that toucheth the corpse of a man, and is therefore unclean seven days,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Shall be sprinkled with this water on the third day, and on the seventh, and so shall be cleansed. If he were not sprinkled on the third day, he cannot be cleansed on the seventh.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Every one that toucheth the corpse of a man, and is not sprinkled with this mixture, shall profane the tabernacle of the Lord, and shall perish out of Israel: because he was not sprinkled with the water of expiation, he shall be unclean, and his uncleanness shall remain upon him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>This is the law of a man that dieth in a tent: All that go into his tent and all the vessels that are there, shall be unclean seven days.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The vessel that hath no cover, nor binding over it, shall be unclean.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If any man in the field touch the corpse of a man that was slain, or that died of himself, or his bone, or his grave, he shall be unclean seven days.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they shall take of the ashes of the burning and of the sin offering, and shall pour living waters upon them into a vessel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And a man that is clean shall dip hyssop in them, and shall sprinkle therewith all the tent, and all the furniture, and the men that are defiled with touching any such thing:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And in this manner he that is clean shall purify the unclean on the third and on the seventh day. And being expiated the seventh day, he shall wash both himself and his garments, and be unclean until the evening.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If any man be not expiated after this rite, his soul shall perish out of the midst of the church: because he hath profaned the sanctuary of the Lord, and was not sprinkled with the water of purification.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>This precept shall be an ordinance for ever. He also that sprinkled the water, shall wash his garments. Every one that shall touch the waters of expiation, shall be unclean until the evening.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Whatsoever a person toucheth who is unclean, he shall make it unclean: and the person that toucheth any of these things, shall be unclean until the evening.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ista est religio victimæ, quam constituit Dominus. Præcipe filiis Israël, ut adducant ad te vaccam rufam ætatis integræ, in qua nulla sit macula, nec portaverit jugum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>tradetisque eam Eleazaro sacerdoti, qui eductam extra castra, immolabit in conspectu omnium :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et tingens digitum in sanguine ejus, asperget contra fores tabernaculi septem vicibus,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>comburetque eam cunctis videntibus, tam pelle et carnibus ejus quam sanguine et fimo flammæ traditis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Lignum quoque cedrinum, et hyssopum, coccumque bis tinctum sacerdos mittet in flammam, quæ vaccam vorat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et tunc demum, lotis vestibus et corpore suo, ingredietur in castra, commaculatusque erit usque ad vesperum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sed et ille qui combusserit eam, lavabit vestimenta sua et corpus, et immundus erit usque ad vesperum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Colliget autem vir mundus cineres vaccæ, et effundet eos extra castra in loco purissimo, ut sint multitudini filiorum Israël in custodiam, et in aquam aspersionis : quia pro peccato vacca combusta est.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque laverit qui vaccæ portaverat cineres vestimenta sua, immundus erit usque ad vesperum. Habebunt hoc filii Israël, et advenæ qui habitant inter eos, sanctum jure perpetuo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui tetigerit cadaver hominis, et propter hoc septem diebus fuerit immundus,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>aspergetur ex hac aqua die tertio et septimo, et sic mundabitur. Si die tertio aspersus non fuerit, septimo non poterit emundari.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Omnis qui tetigerit humanæ animæ morticinum, et aspersus hac commistione non fuerit, polluet tabernaculum Domini et peribit ex Israël : quia aqua expiationis non est aspersus, immundus erit, et manebit spurcitia ejus super eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ista est lex hominis qui moritur in tabernaculo : omnes qui ingrediuntur tentorium illius, et universa vasa quæ ibi sunt, polluta erunt septem diebus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vas, quod non habuerit operculum nec ligaturam desuper, immundum erit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si quis in agro tetigerit cadaver occisi hominis, aut per se mortui, sive os illius, vel sepulchrum, immundus erit septem diebus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tollentque de cineribus combustionis atque peccati, et mittent aquas vivas super eos in vas :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>in quibus cum homo mundus tinxerit hyssopum, asperget ex eo omne tentorium, et cunctam supellectilem, et homines hujuscemodi contagione pollutos :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>atque hoc modo mundus lustrabit immundum tertio et septimo die : expiatusque die septimo, lavabit et se et vestimenta sua, et immundus erit usque ad vesperum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si quis hoc ritu non fuerit expiatus, peribit anima illius de medio ecclesiæ : quia sanctuarium Domini polluit, et non est aqua lustrationis aspersus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Erit hoc præceptum legitimum sempiternum. Ipse quoque qui aspergit aquas, lavabit vestimenta sua. Omnis qui tetigerit aquas expiationis, immundus erit usque ad vesperum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quidquid tetigerit immundus, immundum faciet : et anima, quæ horum quippiam tetigerit, immunda erit usque ad vesperum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/20/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 20</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->19<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg- t\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.19\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":19,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses and Aaron, saying:\"},{\"verse\":2,\"text\":\"This is the observance of the victim, which the Lord hath ordained. Command the children of Israel, that they bring unto thee a red cow of full age, in which there is no blemish, and which hath not carried the yoke:\"},{\"verse\":3,\"text\":\"And you shall deliver her to Eleazar the priest, who shall bring her forth without the camp, and shall immolate her in the sight of all:\"},{\"verse\":4,\"text\":\"And dipping his finger in her blood, shall sprinkle it over against the door of the tabernacle seven times,\"},{\"verse\":5,\"text\":\"And shall burn her in the sight of all delivering up to the fire her skin, and her flesh, and her blood, and her dung.\"},{\"verse\":6,\"text\":\"The priest shall also take cedar wood, and hyssop, and scarlet twice dyed, and cast it into the flame, with which the cow is consumed.\"},{\"verse\":7,\"text\":\"And then after washing his garments, and body, he shall enter into the camp, and shall be unclean until the evening.\"},{\"verse\":8,\"text\":\"He also that hath burned her, shall wash his garments, and his body, and shall be unclean until the evening.\"},{\"verse\":9,\"text\":\"And a man that is clean shall gather up the ashes of the cow, and shall pour them forth without the camp in a most clean place, that they may be reserved for the multitude of the children of Israel, and for a water of aspersion: because the cow was burnt for sin.\"},{\"verse\":10,\"text\":\"And when he that carried the ashes of the cow, hath washed his garments, he shall be unclean until the evening. The children of Israel, and the strangers that dwell among them, shall observe this for a holy thing by a perpetual ordinance.\"},{\"verse\":11,\"text\":\"He that toucheth the corpse of a man, and is therefore unclean seven days,\"},{\"verse\":12,\"text\":\"Shall be sprinkled with this water on the third day, and on the seventh, and so shall be cleansed. If he were not sprinkled on the third day, he cannot be cleansed on the seventh.\"},{\"verse\":13,\"text\":\"Every one that toucheth the corpse of a man, and is not sprinkled with this mixture, shall profane the tabernacle of the Lord, and shall perish out of Israel: because he was not sprinkled with the water of expiation, he shall be unclean, and his uncleanness shall remain upon him.\"},{\"verse\":14,\"text\":\"This is the law of a man that dieth in a tent: All that go into his tent and all the vessels that are there, shall be unclean seven days.\"},{\"verse\":15,\"text\":\"The vessel that hath no cover, nor binding over it, shall be unclean.\"},{\"verse\":16,\"text\":\"If any man in the field touch the corpse of a man that was slain, or that died of himself, or his bone, or his grave, he shall be unclean seven days.\"},{\"verse\":17,\"text\":\"And they shall take of the ashes of the burning and of the sin offering, and shall pour living waters upon them into a vessel.\"},{\"verse\":18,\"text\":\"And a man that is clean shall dip hyssop in them, and shall sprinkle therewith all the tent, and all the furniture, and the men that are defiled with touching any such thing:\"},{\"verse\":19,\"text\":\"And in this manner he that is clean shall purify the unclean on the third and on the seventh day. And being expiated the seventh day, he shall wash both himself and his garments, and be unclean until the evening.\"},{\"verse\":20,\"text\":\"If any man be not expiated after this rite, his soul shall perish out of the midst of the church: because he hath profaned the sanctuary of the Lord, and was not sprinkled with the water of purification.\"},{\"verse\":21,\"text\":\"This precept shall be an ordinance for ever. He also that sprinkled the water, shall wash his garments. Every one that shall touch the waters of expiation, shall be unclean until the evening.\"},{\"verse\":22,\"text\":\"Whatsoever a person toucheth who is unclean, he shall make it unclean: and the person that toucheth any of these things, shall be unclean until the evening.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Ista est religio victimæ, quam constituit Dominus. Præcipe filiis Israël, ut adducant ad te vaccam rufam ætatis integræ, in qua nulla sit macula, nec portaverit jugum :\"},{\"verse\":3,\"text\":\"tradetisque eam Eleazaro sacerdoti, qui eductam extra castra, immolabit in conspectu omnium :\"},{\"verse\":4,\"text\":\"et tingens digitum in sanguine ejus, asperget contra fores tabernaculi septem vicibus,\"},{\"verse\":5,\"text\":\"comburetque eam cunctis videntibus, tam pelle et carnibus ejus quam sanguine et fimo flammæ traditis.\"},{\"verse\":6,\"text\":\"Lignum quoque cedrinum, et hyssopum, coccumque bis tinctum sacerdos mittet in flammam, quæ vaccam vorat.\"},{\"verse\":7,\"text\":\"Et tunc demum, lotis vestibus et corpore suo, ingredietur in castra, commaculatusque erit usque ad vesperum.\"},{\"verse\":8,\"text\":\"Sed et ille qui combusserit eam, lavabit vestimenta sua et corpus, et immundus erit usque ad vesperum.\"},{\"verse\":9,\"text\":\"Colliget autem vir mundus cineres vaccæ, et effundet eos extra castra in loco purissimo, ut sint multitudini filiorum Israël in custodiam, et in aquam aspersionis : quia pro peccato vacca combusta est.\"},{\"verse\":10,\"text\":\"Cumque laverit qui vaccæ portaverat cineres vestimenta sua, immundus erit usque ad vesperum. Habebunt hoc filii Israël, et advenæ qui habitant inter eos, sanctum jure perpetuo.\"},{\"verse\":11,\"text\":\"Qui tetigerit cadaver hominis, et propter hoc septem diebus fuerit immundus,\"},{\"verse\":12,\"text\":\"aspergetur ex hac aqua die tertio et septimo, et sic mundabitur. Si die tertio aspersus non fuerit, septimo non poterit emundari.\"},{\"verse\":13,\"text\":\"Omnis qui tetigerit humanæ animæ morticinum, et aspersus hac commistione non fuerit, polluet tabernaculum Domini et peribit ex Israël : quia aqua expiationis non est aspersus, immundus erit, et manebit spurcitia ejus super eum.\"},{\"verse\":14,\"text\":\"Ista est lex hominis qui moritur in tabernaculo : omnes qui ingrediuntur tentorium illius, et universa vasa quæ ibi sunt, polluta erunt septem diebus.\"},{\"verse\":15,\"text\":\"Vas, quod non habuerit operculum nec ligaturam desuper, immundum erit.\"},{\"verse\":16,\"text\":\"Si quis in agro tetigerit cadaver occisi hominis, aut per se mortui, sive os illius, vel sepulchrum, immundus erit septem diebus.\"},{\"verse\":17,\"text\":\"Tollentque de cineribus combustionis atque peccati, et mittent aquas vivas super eos in vas :\"},{\"verse\":18,\"text\":\"in quibus cum homo mundus tinxerit hyssopum, asperget ex eo omne tentorium, et cunctam supellectilem, et homines hujuscemodi contagione pollutos :\"},{\"verse\":19,\"text\":\"atque hoc modo mundus lustrabit immundum tertio et septimo die : expiatusque die septimo, lavabit et se et vestimenta sua, et immundus erit usque ad vesperum.\"},{\"verse\":20,\"text\":\"Si quis hoc ritu non fuerit expiatus, peribit anima illius de medio ecclesiæ : quia sanctuarium Domini polluit, et non est aqua lustrationis aspersus.\"},{\"verse\":21,\"text\":\"Erit hoc præceptum legitimum sempiternum. Ipse quoque qui aspergit aquas, lavabit vestimenta sua. Omnis qui tetigerit aquas expiationis, immundus erit usque ad vesperum.\"},{\"verse\":22,\"text\":\"Quidquid tetigerit immundus, immundum faciet : et anima, quæ horum quippiam tetigerit, immunda erit usque ad vesperum.\"}],\"summary\":\"The law of the sacrifice of the red cow, and the water of expiation.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":18,\"label\":\"Numbers 18\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":20,\"label\":\"Numbers 20\"}}]]\n"])</script></body></html>
