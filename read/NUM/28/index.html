-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">28</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Sacrifices are appointed as well for every day as for sabbaths, and other festivals.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The Lord also said to Moses:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Command the children of Israel, and thou shalt say to them: Offer ye my oblation and my bread, and burnt sacrifice of most sweet odour, in their due seasons.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>These are the sacrifices which you shall offer: Two lambs of a year old without blemish every day for the perpetual holocaust:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>One you shall offer in the mornings, and the other in the evening:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the tenth part of an ephi of flour, which shall be tempered with the purest oil, of the measure of the fourth part of a hin.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>It is the continual holocaust which you offered in mount Sinai for a most sweet odour of a sacrifice by fire to the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And for a libation you shall offer of wine the fourth part of a hin for every lamb in the sanctuary of the Lord.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And you shall offer the other lamb in like manner in the evening according to all the rites of the morning sacrifice, and of the libations thereof, an oblation of most sweet odour to the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And on the sabbath day you shall offer two lambs of a year old without blemish, and two tenths of flour tempered with oil in sacrifice, and the libations,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Which regularly are poured out every sabbath for the perpetual holocaust.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And on the first day of the month you shall offer a holocaust to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And three tenths of flour tempered with oil in sacrifice for every calf: and two tenths of flour tempered with oil for every ram:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the tenth of a tenth of flour tempered with oil in sacrifice for every lamb. It is a holocaust of most sweet odour and an offering by fire to the Lord.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And these shall be the libations of wine that are to be poured out for every victim: Half a hin for every calf, a third for a ram, and a fourth for a lamb. This shall be the holocaust for every month, as they succeed one another in the course of the year.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>A buck goat also shall be offered to the Lord for a sin offering over and above the perpetual holocaust with its libations.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And in the first month, on the fourteenth day of the month, shall be the phase of the Lord,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And on the fifteenth day the solemn feast: seven days shall they eat unleavened bread.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the first day of them shall be venerable and holy: you shall not do any servile work therein.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And you shall offer a burnt sacrifice a holocaust to the Lord, two calves of the herd, one ram, seven lambs of a year old, without blemish:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And for the sacrifice of every one three tenths of flour which shall be tempered with oil to every calf, and two tenths to every ram,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the tenth of a tenth, to every lamb, that is to say, to all the seven lambs:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And one buck goat for sin, to make atonement for you,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Besides the morning holocaust which you shall always offer.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>So shall you do every day of the seven days for the food of the fire, and for a most sweet odour to the Lord, which shall rise from the holocaust, and from the libations of each.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The seventh day also shall be most solemn and holy unto you, you shall do no servile work therein.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The day also of firstfruits, when after the weeks are accomplished, you shall offer new fruits to the Lord, shall be venerable and holy: you shall do no servile work therein.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And you shall offer a holocaust for a most sweet odour to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And in the sacrifices of them three tenths of flour tempered with oil to every calf, two to every ram,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The tenth of a tenth to every lamb, which in all are seven lambs: a buck goat also,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Which is slain for expiation: besides the perpetual holocaust and the libations thereof.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>You shall offer them all without blemish with their libations.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixit quoque Dominus ad Moysen :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Præcipe filiis Israël, et dices ad eos : Oblationem meam et panes, et incensum odoris suavissimi offerte per tempora sua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hæc sunt sacrificia quæ offerre debetis : agnos anniculos immaculatos duos quotidie in holocaustum sempiternum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>unum offeretis mane, et alterum ad vesperum :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>decimam partem ephi similæ, quæ conspersa sit oleo purissimo, et habeat quartam partem hin.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Holocaustum juge est quod obtulistis in monte Sinai in odorem suavissimum incensi Domini.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et libabitis vini quartam partem hin per agnos singulos in sanctuario Domini.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Alterumque agnum similiter offeretis ad vesperam juxta omnem ritum sacrificii matutini, et libamentorum ejus, oblationem suavissimi odoris Domino.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Die autem sabbati offeretis duos agnos anniculos immaculatos, et duas decimas similæ oleo conspersæ in sacrificio, et liba :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>quæ rite funduntur per singula sabbata in holocaustum sempiternum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In calendis autem offeretis holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos septem immaculatos,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et tres decimas similæ oleo conspersæ in sacrificio per singulos vitulos : et duas decimas similæ oleo conspersæ per singulos arietes :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et decimam decimæ similæ ex oleo in sacrificio per agnos singulos : holocaustum suavissimi odoris atque incensi est Domino.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Libamenta autem vini, quæ per singulas fundenda sunt victimas, ista erunt : media pars hin per singulos vitulos, tertia per arietem, quarta per agnum. Hoc erit holocaustum per omnes menses, qui sibi anno vertente succedunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hircus quoque offeretur Domino pro peccatis in holocaustum sempiternum cum libamentis suis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mense autem primo, quartadecima die mensis, Phase Domini erit,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et quintadecima die solemnitas : septem diebus vescentur azymis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quarum dies prima venerabilis et sancta erit : omne opus servile non facietis in ea.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Offeretisque incensum holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos immaculatos septem :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et sacrificia singulorum ex simila quæ conspersa sit oleo, tres decimas per singulos vitulos, et duas decimas per arietem,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et decimam decimæ per agnos singulos, id est, per septem agnos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et hircum pro peccato unum, ut expietur pro vobis,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>præter holocaustum matutinum, quod semper offeretis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ita facietis per singulos dies septem dierum in fomitem ignis, et in odorem suavissimum Domino, qui surget de holocausto, et de libationibus singulorum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dies quoque septimus celeberrimus et sanctus erit vobis : omne opus servile non facietis in eo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dies etiam primitivorum, quando offeretis novas fruges Domino, expletis hebdomadibus, venerabilis et sancta erit : omne opus servile non facietis in ea.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Offeretisque holocaustum in odorem suavissimum Domino, vitulos de armento duos, arietem unum, et agnos anniculos immaculatos septem :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>atque in sacrificiis eorum, similæ oleo conspersæ tres decimas per singulos vitulos, per arietes duas,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>per agnos decimam decimæ, qui simul sunt agni septem. Hircum quoque,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>qui mactatur pro expiatione : præter holocaustum sempiternum et liba ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Immaculata offeretis omnia cum libationibus suis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/27/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 27</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/29/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 29</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->28<!-- --> of <!  all the rites of the morning sacrifice, and of the libations thereof, an oblation of most sweet odour to the Lord.\"},{\"verse\":9,\"text\":\"And on the sabbath day you shall offer two lambs of a year old without blemish, and two tenths of flour tempered with oil in sacrifice, and the libations,\"},{\"verse\":10,\"text\":\"Which regularly are poured out every sabbath for the perpetual holocaust.\"},{\"verse\":11,\"text\":\"And on the first day of the month you shall offer a holocaust to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish,\"},{\"verse\":12,\"text\":\"And three tenths of flour tempered with oil in sacrifice for every calf: and two tenths of flour tempered with oil for every ram:\"},{\"verse\":13,\"text\":\"And the tenth of a tenth of flour tempered with oil in sacrifice for every lamb. It is a holocaust of most sweet odour and an offering by fire to the Lord.\"},{\"verse\":14,\"text\":\"And these shall be the libations of wine that are to be poured out for every victim: Half a hin for every calf, a third for a ram, and a fourth for a lamb. This shall be the holocaust for every month, as they succeed one another in the course of the year.\"},{\"verse\":15,\"text\":\"A buck goat also shall be offered to the Lord for a sin offering over and above the perpetual holocaust with its libations.\"},{\"verse\":16,\"text\":\"And in the first month, on the fourteenth day of the month, shall be the phase of the Lord,\"},{\"verse\":17,\"text\":\"And on the fifteenth day the solemn feast: seven days shall they eat unleavened bread.\"},{\"verse\":18,\"text\":\"And the first day of them shall be venerable and holy: you shall not do any servile work therein.\"},{\"verse\":19,\"text\":\"And you shall offer a burnt sacrifice a holocaust to the Lord, two calves of the herd, one ram, seven lambs of a year old, without blemish:\"},{\"verse\":20,\"text\":\"And for the sacrifice of every one three tenths of flour which shall be tempered with oil to every calf, and two tenths to every ram,\"},{\"verse\":21,\"text\":\"And the tenth of a tenth, to every lamb, that is to say, to all the seven lambs:\"},{\"verse\":22,\"text\":\"And one buck goat for sin, to make atonement for you,\"},{\"verse\":23,\"text\":\"Besides the morning holocaust which you shall always offer.\"},{\"verse\":24,\"text\":\"So shall you do every day of the seven days for the food of the fire, and for a most sweet odour to the Lord, which shall rise from the holocaust, and from the libations of each.\"},{\"verse\":25,\"text\":\"The seventh day also shall be most solemn and holy unto you, you shall do no servile work therein.\"},{\"verse\":26,\"text\":\"The day also of firstfruits, when after the weeks are accomplished, you shall offer new fruits to the Lord, shall be venerable and holy: you shall do no servile work therein.\"},{\"verse\":27,\"text\":\"And you shall offer a holocaust for a most sweet odour to the Lord, two calves of the herd, one ram, and seven lambs of a year old, without blemish:\"},{\"verse\":28,\"text\":\"And in the sacrifices of them three tenths of flour tempered with oil to every calf, two to every ram,\"},{\"verse\":29,\"text\":\"The tenth of a tenth to every lamb, which in all are seven lambs: a buck goat also,\"},{\"verse\":30,\"text\":\"Which is slain for expiation: besides the perpetual holocaust and the libations thereof.\"},{\"verse\":31,\"text\":\"You shall offer them all without blemish with their libations.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixit quoque Dominus ad Moysen :\"},{\"verse\":2,\"text\":\"Præcipe filiis Israël, et dices ad eos : Oblationem meam et panes, et incensum odoris suavissimi offerte per tempora sua.\"},{\"verse\":3,\"text\":\"Hæc sunt sacrificia quæ offerre debetis : agnos anniculos immaculatos duos quotidie in holocaustum sempiternum :\"},{\"verse\":4,\"text\":\"unum offeretis mane, et alterum ad vesperum :\"},{\"verse\":5,\"text\":\"decimam partem ephi similæ, quæ conspersa sit oleo purissimo, et habeat quartam partem hin.\"},{\"verse\":6,\"text\":\"Holocaustum juge est quod obtulistis in monte Sinai in odorem suavissimum incensi Domini.\"},{\"verse\":7,\"text\":\"Et libabitis vini quartam partem hin per agnos singulos in sanctuario Domini.\"},{\"verse\":8,\"text\":\"Alterumque agnum similiter offeretis ad vesperam juxta omnem ritum sacrificii matutini, et libamentorum ejus, oblationem suavissimi odoris Domino.\"},{\"verse\":9,\"text\":\"Die autem sabbati offeretis duos agnos anniculos immaculatos, et duas decimas similæ oleo conspersæ in sacrificio, et liba :\"},{\"verse\":10,\"text\":\"quæ rite funduntur per singula sabbata in holocaustum sempiternum.\"},{\"verse\":11,\"text\":\"In calendis autem offeretis holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos septem immaculatos,\"},{\"verse\":12,\"text\":\"et tres decimas similæ oleo conspersæ in sacrificio per singulos vitulos : et duas decimas similæ oleo conspersæ per singulos arietes :\"},{\"verse\":13,\"text\":\"et decimam decimæ similæ ex oleo in sacrificio per agnos singulos : holocaustum suavissimi odoris atque incensi est Domino.\"},{\"verse\":14,\"text\":\"Libamenta autem vini, quæ per singulas fundenda sunt victimas, ista erunt : media pars hin per singulos vitulos, tertia per arietem, quarta per agnum. Hoc erit holocaustum per omnes menses, qui sibi anno vertente succedunt.\"},{\"verse\":15,\"text\":\"Hircus quoque offeretur Domino pro peccatis in holocaustum sempiternum cum libamentis suis.\"},{\"verse\":16,\"text\":\"Mense autem primo, quartadecima die mensis, Phase Domini erit,\"},{\"verse\":17,\"text\":\"et quintadecima die solemnitas : septem diebus vescentur azymis.\"},{\"verse\":18,\"text\":\"Quarum dies prima venerabilis et sancta erit : omne opus servile non facietis in ea.\"},{\"verse\":19,\"text\":\"Offeretisque incensum holocaustum Domino, vitulos de armento duos, arietem unum, agnos anniculos immaculatos septem :\"},{\"verse\":20,\"text\":\"et sacrificia singulorum ex simila quæ conspersa sit oleo, tres decimas per singulos vitulos, et duas decimas per arietem,\"},{\"verse\":21,\"text\":\"et decimam decimæ per agnos singulos, id est, per septem agnos.\"},{\"verse\":22,\"text\":\"Et hircum pro peccato unum, ut expietur pro vobis,\"},{\"verse\":23,\"text\":\"præter holocaustum matutinum, quod semper offeretis.\"},{\"verse\":24,\"text\":\"Ita facietis per singulos dies septem dierum in fomitem ignis, et in odorem suavissimum Domino, qui surget de holocausto, et de libationibus singulorum.\"},{\"verse\":25,\"text\":\"Dies quoque septimus celeberrimus et sanctus erit vobis : omne opus servile non facietis in eo.\"},{\"verse\":26,\"text\":\"Dies etiam primitivorum, quando offeretis novas fruges Domino, expletis hebdomadibus, venerabilis et sancta erit : omne opus servile non facietis in ea.\"},{\"verse\":27,\"text\":\"Offeretisque holocaustum in odorem suavissimum Domino, vitulos de armento duos, arietem unum, et agnos anniculos immaculatos septem :\"},{\"verse\":28,\"text\":\"atque in sacrificiis eorum, similæ oleo conspersæ tres decimas per singulos vitulos, per arietes duas,\"},{\"verse\":29,\"text\":\"per agnos decimam decimæ, qui simul sunt agni septem. Hircum quoque,\"},{\"verse\":30,\"text\":\"qui mactatur pro expiatione : præter holocaustum sempiternum et liba ejus.\"},{\"verse\":31,\"text\":\"Immaculata offeretis omnia cum libationibus suis.\"}],\"summary\":\"Sacrifices are appointed as well for every day as for sabbaths, and other festivals.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":27,\"label\":\"Numbers 27\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":29,\"label\":\"Numbers 29\"}}]]\n"])</script></body></html>
