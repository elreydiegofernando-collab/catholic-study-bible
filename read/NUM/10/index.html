-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The silver trumpets and their use. They march from Sinai.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Make thee two trumpets of beaten silver, wherewith thou mayest call together the multitude when the camp is to be removed.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when thou shalt sound the trumpets, all the multitude shall gather unto thee to the door of the tabernacle of the covenant.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>If thou sound but once, the princes and the heads of the multitude of Israel shall come to thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But if the sound of the trumpets be longer, and with interruptions, they that are on the east side, shall first go forward.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And at the second sounding and like noise of the trumpet, they who lie on the south side shall take up their tents. And after this manner shall the rest do, when the trumpets shall sound for a march.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But when the people is to be gathered together, the sound of the trumpets shall be plain, and they shall not make a broken sound.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the sons of Aaron the priest shall sound the trumpets: and this shall be an ordinance for ever in your generations.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If you go forth to war out of your land against the enemies that fight against you, you shall sound aloud with the trumpets, and there shall be a remembrance of you before the Lord your God, that you may be delivered out of the hands of your enemies.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If at any time you shall have a banquet, and on your festival days, and on the first days of your months, you shall sound the trumpets over the holocausts, and the sacrifices of peace offerings, that they may be to you for a remembrance of your God. I am the Lord your God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The second year, in the second month, the twentieth day of the month, the cloud was taken up from the tabernacle of the covenant.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the children of Israel marched by their troops from the desert of Sinai, and the cloud rested in the wilderness of Pharan.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the first went forward according to the commandment of the Lord by the hand of Moses.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The sons of Juda by their troops: whose prince was Nahasson the son of Aminadab.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In the tribe of the sons of Issachar, the prince was Nathanael the son of Suar.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In the tribe of Zabulon, the prince was Eliab the son of Helon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the tabernacle was taken down, and the sons of Gerson and Merari set forward, bearing it.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the sons of Ruben also marched, by their troops and ranks, whose prince was Helisur the son of Sedeur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And in the tribe of Simeon, the prince was Salamiel the son of Surisaddai.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And in the tribe of Gad, the prince was Eliasaph the son of Duel.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then the Caathites also marched carrying the sanctuary. So long was the tabernacle carried, till they came to the place of setting it up.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sons of Ephraim also moved their camp by their troops, in whose army the prince was Elisama the son of Ammiud.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And in the tribe of the sons of Manasses, the prince was Gamaliel the son of Phadassur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And in the tribe of Benjamin, the prince was Abidan the son of Gedeon.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The last of all the camp marched the sons of Dan by their troops, in whose army the prince was Ahiezer the son of Ammisaddai.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And in the tribe of the sons of Aser, the prince was Phegiel the son of Ochran.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And in the tribe of the sons of Nephtali, the prince was Ahira the son of Enan.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>This was the order of the camps, and marches of the children of Israel by their troops, when they set forward.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Moses said to Hobab the son of Raguel the Madianite, his kinsman: We are going towards the place which the Lord will give us: come with us, that we may do thee good: for the Lord hath promised good things to Israel.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But he answered him: I will not go with thee, but I will return to my country, wherein I was born.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And he said: Do not leave us: for thou knowest in what places we should encamp in the wilderness, and thou shalt be our guide.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And if thou comest with us, we will give thee what is the best of the riches which the Lord shall deliver to us.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>So they marched from the mount of the Lord three days’ journey, and the ark of the covenant of the Lord went before them, for three days providing a place for the camp.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The cloud also of the Lord was over them by day when they marched.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when the ark was lifted up, Moses said: Arise, O Lord, and let thy enemies be scattered, and let them that hate thee, flee from before thy face.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And when it was set down, he said: Return, O Lord, to the multitude of the host of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fac tibi duas tubas argenteas ductiles, quibus convocare possis multitudinem quando movenda sunt castra.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cumque increpueris tubis, congregabitur ad te omnis turba ad ostium tabernaculi fœderis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si semel clangueris, venient ad te principes, et capita multitudinis Israël.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si autem prolixior atque concisus clangor increpuerit, movebunt castra primi qui sunt ad orientalem plagam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In secundo autem sonitu et pari ululatu tubæ, levabunt tentoria qui habitant ad meridiem ; et juxta hunc modum reliqui facient, ululantibus tubis in profectionem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quando autem congregandus est populus, simplex tubarum clangor erit, et non concise ululabunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Filii autem Aaron sacerdotes clangent tubis : eritque hoc legitimum sempiternum in generationibus vestris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si exieritis ad bellum de terra vestra contra hostes qui dimicant adversum vos, clangetis ululantibus tubis, et erit recordatio vestri coram Domino Deo vestro, ut eruamini de manibus inimicorum vestrorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Siquando habebitis epulum, et dies festos, et calendas, canetis tubis super holocaustis, et pacificis victimis, ut sint vobis in recordationem Dei vestri. Ego Dominus Deus vester.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Anno secundo, mense secundo, vigesima die mensis, elevata est nubes de tabernaculo fœderis :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>profectique sunt filii Israël per turmas suas de deserto Sinai, et recubuit nubes in solitudine Pharan.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Moveruntque castra primi juxta imperium Domini in manu Moysi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Filii Juda per turmas suas : quorum princeps erat Nahasson filius Aminadab.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In tribu filiorum Issachar fuit princeps Nathanaël filius Suar.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In tribu Zabulon erat princeps Eliab filius Helon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Depositumque est tabernaculum, quod portantes egressi sunt filii Gerson et Merari.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Profectique sunt et filii Ruben, per turmas et ordinem suum : quorum princeps erat Helisur filius Sedeur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In tribu autem filiorum Simeon, princeps fuit Salamiel filius Surisaddai.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Porro in tribu Gad erat princeps Eliasaph filius Duel.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Profectique sunt et Caathitæ portantes sanctuarium. Tamdiu tabernaculum portabatur, donec venirent ad erectionis locum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Moverunt castra et filii Ephraim per turmas suas, in quorum exercitu princeps erat Elisama filius Ammiud.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>In tribu autem filiorum Manasse princeps fuit Gamaliel filius Phadassur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et in tribu Benjamin erat dux Abidan filius Gedeonis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Novissimi castrorum omnium profecti sunt filii Dan per turmas suas, in quorum exercitu princeps fuit Ahiezer filius Ammisaddai.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In tribu autem filiorum Aser erat princeps Phegiel filius Ochran.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et in tribu filiorum Nephthali princeps fuit Ahira filius Enan.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Hæc sunt castra, et profectiones filiorum Israël per turmas suas quando egrediebantur.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dixitque Moyses Hobab filio Raguel Madianitæ, cognato suo : Proficiscimur ad locum quem Dominus daturus est nobis : veni nobiscum, ut benefaciamus tibi, quia Dominus bona promisit Israëli.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Cui ille respondit : Non vadam tecum, sed revertar in terram meam, in qua natus sum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et ille : Noli, inquit, nos relinquere : tu enim nosti in quibus locis per desertum castra ponere debeamus, et eris ductor noster.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Cumque nobiscum veneris, quidquid optimum fuerit ex opibus, quas nobis traditurus est Dominus, dabimus tibi.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Profecti sunt ergo de monte Domini viam trium dierum, arcaque fœderis Domini præcedebat eos, per dies tres providens castrorum locum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Nubes quoque Domini super eos erat per diem cum incederent.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Cumque elevaretur arca, dicebat Moyses : Surge, Domine, et dissipentur inimici tui, et fugiant qui oderunt te, a facie tua.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Cum autem deponeretur, aiebat : Revertere, Domine, ad multitudinem exercitus Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 9</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/11/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 11</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->10<!-- --> of <!-- -->36<!-- --> · swipe left or ri n the priest shall sound the trumpets: and this shall be an ordinance for ever in your generations.\"},{\"verse\":9,\"text\":\"If you go forth to war out of your land against the enemies that fight against you, you shall sound aloud with the trumpets, and there shall be a remembrance of you before the Lord your God, that you may be delivered out of the hands of your enemies.\"},{\"verse\":10,\"text\":\"If at any time you shall have a banquet, and on your festival days, and on the first days of your months, you shall sound the trumpets over the holocausts, and the sacrifices of peace offerings, that they may be to you for a remembrance of your God. I am the Lord your God.\"},{\"verse\":11,\"text\":\"The second year, in the second month, the twentieth day of the month, the cloud was taken up from the tabernacle of the covenant.\"},{\"verse\":12,\"text\":\"And the children of Israel marched by their troops from the desert of Sinai, and the cloud rested in the wilderness of Pharan.\"},{\"verse\":13,\"text\":\"And the first went forward according to the commandment of the Lord by the hand of Moses.\"},{\"verse\":14,\"text\":\"The sons of Juda by their troops: whose prince was Nahasson the son of Aminadab.\"},{\"verse\":15,\"text\":\"In the tribe of the sons of Issachar, the prince was Nathanael the son of Suar.\"},{\"verse\":16,\"text\":\"In the tribe of Zabulon, the prince was Eliab the son of Helon.\"},{\"verse\":17,\"text\":\"And the tabernacle was taken down, and the sons of Gerson and Merari set forward, bearing it.\"},{\"verse\":18,\"text\":\"And the sons of Ruben also marched, by their troops and ranks, whose prince was Helisur the son of Sedeur.\"},{\"verse\":19,\"text\":\"And in the tribe of Simeon, the prince was Salamiel the son of Surisaddai.\"},{\"verse\":20,\"text\":\"And in the tribe of Gad, the prince was Eliasaph the son of Duel.\"},{\"verse\":21,\"text\":\"Then the Caathites also marched carrying the sanctuary. So long was the tabernacle carried, till they came to the place of setting it up.\"},{\"verse\":22,\"text\":\"The sons of Ephraim also moved their camp by their troops, in whose army the prince was Elisama the son of Ammiud.\"},{\"verse\":23,\"text\":\"And in the tribe of the sons of Manasses, the prince was Gamaliel the son of Phadassur.\"},{\"verse\":24,\"text\":\"And in the tribe of Benjamin, the prince was Abidan the son of Gedeon.\"},{\"verse\":25,\"text\":\"The last of all the camp marched the sons of Dan by their troops, in whose army the prince was Ahiezer the son of Ammisaddai.\"},{\"verse\":26,\"text\":\"And in the tribe of the sons of Aser, the prince was Phegiel the son of Ochran.\"},{\"verse\":27,\"text\":\"And in the tribe of the sons of Nephtali, the prince was Ahira the son of Enan.\"},{\"verse\":28,\"text\":\"This was the order of the camps, and marches of the children of Israel by their troops, when they set forward.\"},{\"verse\":29,\"text\":\"And Moses said to Hobab the son of Raguel the Madianite, his kinsman: We are going towards the place which the Lord will give us: come with us, that we may do thee good: for the Lord hath promised good things to Israel.\"},{\"verse\":30,\"text\":\"But he answered him: I will not go with thee, but I will return to my country, wherein I was born.\"},{\"verse\":31,\"text\":\"And he said: Do not leave us: for thou knowest in what places we should encamp in the wilderness, and thou shalt be our guide.\"},{\"verse\":32,\"text\":\"And if thou comest with us, we will give thee what is the best of the riches which the Lord shall deliver to us.\"},{\"verse\":33,\"text\":\"So they marched from the mount of the Lord three days’ journey, and the ark of the covenant of the Lord went before them, for three days providing a place for the camp.\"},{\"verse\":34,\"text\":\"The cloud also of the Lord was over them by day when they marched.\"},{\"verse\":35,\"text\":\"And when the ark was lifted up, Moses said: Arise, O Lord, and let thy enemies be scattered, and let them that hate thee, flee from before thy face.\"},{\"verse\":36,\"text\":\"And when it was set down, he said: Return, O Lord, to the multitude of the host of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Fac tibi duas tubas argenteas ductiles, quibus convocare possis multitudinem quando movenda sunt castra.\"},{\"verse\":3,\"text\":\"Cumque increpueris tubis, congregabitur ad te omnis turba ad ostium tabernaculi fœderis.\"},{\"verse\":4,\"text\":\"Si semel clangueris, venient ad te principes, et capita multitudinis Israël.\"},{\"verse\":5,\"text\":\"Si autem prolixior atque concisus clangor increpuerit, movebunt castra primi qui sunt ad orientalem plagam.\"},{\"verse\":6,\"text\":\"In secundo autem sonitu et pari ululatu tubæ, levabunt tentoria qui habitant ad meridiem ; et juxta hunc modum reliqui facient, ululantibus tubis in profectionem.\"},{\"verse\":7,\"text\":\"Quando autem congregandus est populus, simplex tubarum clangor erit, et non concise ululabunt.\"},{\"verse\":8,\"text\":\"Filii autem Aaron sacerdotes clangent tubis : eritque hoc legitimum sempiternum in generationibus vestris.\"},{\"verse\":9,\"text\":\"Si exieritis ad bellum de terra vestra contra hostes qui dimicant adversum vos, clangetis ululantibus tubis, et erit recordatio vestri coram Domino Deo vestro, ut eruamini de manibus inimicorum vestrorum.\"},{\"verse\":10,\"text\":\"Siquando habebitis epulum, et dies festos, et calendas, canetis tubis super holocaustis, et pacificis victimis, ut sint vobis in recordationem Dei vestri. Ego Dominus Deus vester.\"},{\"verse\":11,\"text\":\"Anno secundo, mense secundo, vigesima die mensis, elevata est nubes de tabernaculo fœderis :\"},{\"verse\":12,\"text\":\"profectique sunt filii Israël per turmas suas de deserto Sinai, et recubuit nubes in solitudine Pharan.\"},{\"verse\":13,\"text\":\"Moveruntque castra primi juxta imperium Domini in manu Moysi.\"},{\"verse\":14,\"text\":\"Filii Juda per turmas suas : quorum princeps erat Nahasson filius Aminadab.\"},{\"verse\":15,\"text\":\"In tribu filiorum Issachar fuit princeps Nathanaël filius Suar.\"},{\"verse\":16,\"text\":\"In tribu Zabulon erat princeps Eliab filius Helon.\"},{\"verse\":17,\"text\":\"Depositumque est tabernaculum, quod portantes egressi sunt filii Gerson et Merari.\"},{\"verse\":18,\"text\":\"Profectique sunt et filii Ruben, per turmas et ordinem suum : quorum princeps erat Helisur filius Sedeur.\"},{\"verse\":19,\"text\":\"In tribu autem filiorum Simeon, princeps fuit Salamiel filius Surisaddai.\"},{\"verse\":20,\"text\":\"Porro in tribu Gad erat princeps Eliasaph filius Duel.\"},{\"verse\":21,\"text\":\"Profectique sunt et Caathitæ portantes sanctuarium. Tamdiu tabernaculum portabatur, donec venirent ad erectionis locum.\"},{\"verse\":22,\"text\":\"Moverunt castra et filii Ephraim per turmas suas, in quorum exercitu princeps erat Elisama filius Ammiud.\"},{\"verse\":23,\"text\":\"In tribu autem filiorum Manasse princeps fuit Gamaliel filius Phadassur.\"},{\"verse\":24,\"text\":\"Et in tribu Benjamin erat dux Abidan filius Gedeonis.\"},{\"verse\":25,\"text\":\"Novissimi castrorum omnium profecti sunt filii Dan per turmas suas, in quorum exercitu princeps fuit Ahiezer filius Ammisaddai.\"},{\"verse\":26,\"text\":\"In tribu autem filiorum Aser erat princeps Phegiel filius Ochran.\"},{\"verse\":27,\"text\":\"Et in tribu filiorum Nephthali princeps fuit Ahira filius Enan.\"},{\"verse\":28,\"text\":\"Hæc sunt castra, et profectiones filiorum Israël per turmas suas quando egrediebantur.\"},{\"verse\":29,\"text\":\"Dixitque Moyses Hobab filio Raguel Madianitæ, cognato suo : Proficiscimur ad locum quem Dominus daturus est nobis : veni nobiscum, ut benefaciamus tibi, quia Dominus bona promisit Israëli.\"},{\"verse\":30,\"text\":\"Cui ille respondit : Non vadam tecum, sed revertar in terram meam, in qua natus sum.\"},{\"verse\":31,\"text\":\"Et ille : Noli, inquit, nos relinquere : tu enim nosti in quibus locis per desertum castra ponere debeamus, et eris ductor noster.\"},{\"verse\":32,\"text\":\"Cumque nobiscum veneris, quidquid optimum fuerit ex opibus, quas nobis traditurus est Dominus, dabimus tibi.\"},{\"verse\":33,\"text\":\"Profecti sunt ergo de monte Domini viam trium dierum, arcaque fœderis Domini præcedebat eos, per dies tres providens castrorum locum.\"},{\"verse\":34,\"text\":\"Nubes quoque Domini super eos erat per diem cum incederent.\"},{\"verse\":35,\"text\":\"Cumque elevaretur arca, dicebat Moyses : Surge, Domine, et dissipentur inimici tui, et fugiant qui oderunt te, a facie tua.\"},{\"verse\":36,\"text\":\"Cum autem deponeretur, aiebat : Revertere, Domine, ad multitudinem exercitus Israël.\"}],\"summary\":\"The silver trumpets and their use. They march from Sinai.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":9,\"label\":\"Numbers 9\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":11,\"label\":\"Numbers 11\"}}]]\n"])</script></body></html>
