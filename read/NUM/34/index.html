-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">34</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The limits of Chanaan; with the names of the men that make the division of it.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Command the children of Israel, and thou shalt say to them: When you are entered into the land of Chanaan, and it shall be fallen into your possession by lot, it shall be bounded by these limits:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The south side shall begin from the wilderness of Sin, which is by Edom: and shall have the most salt sea for its furthest limits eastward:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Which limits shall go round on the south side by the ascent of the Scorpion and so into Senna, and reach toward the south as far as Cadesbarne, from whence the frontiers shall go out to the town called Adar, and shall reach as far as Asemona.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the limits shall fetch a compass from Asemona to the torrent of Egypt, and shall end in the shore of the great sea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the west side shall begin from the great sea, and the same shall be the end thereof.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But toward the north side the borders shall begin from the great sea, reaching to the most high mountain,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>From which they shall come to Emath, as far as the borders of Sedada:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the limits shall go as far as Zephrona, and the village of Enan. These shall be the borders on the north side.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>From thence they shall mark out the bounds towards the east side from the village of Enan unto Sephama.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And from Sephama the bounds shall go down to Rebla over against the fountain of Daphnis: from thence they shall come eastward to the sea of Cenereth,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And shall reach as far as the Jordan, and at the last shall be closed in by the most salt sea. This shall be your land with its borders round about.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Moses commanded the children of Israel, saying: This shall be the land which you shall possess by lot, and which the Lord hath commanded to be given to the nine tribes, and to the half tribe.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For the tribe of the children of Ruben by their families, and the tribe of the children of Gad according to the number of their kindreds, and half of the tribe of Manasses,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>That is, two tribes and a half, have received their portion beyond the Jordan over against Jericho at the east side.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Lord said to Moses:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>These are the names of the men, that shall divide the land unto you: Eleazar the priest, and Josue the son of Nun,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And one prince of every tribe,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Whose names are these: Of the tribe of Juda, Caleb the son of Jephone.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of the tribe of Simeon, Samuel the son of Ammiud.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Of the tribe of Benjamin, Elidad the son of Chaselon.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Of the tribe of the children of Dan, Bocci the son of Jogli.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Of the children of Joseph of the tribe of Manasses, Hanniel the son of Ephod.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Of the tribe of Ephraim, Camuel the son of Sephtan.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Of the tribe of Zabulon, Elisaphan the son of Pharnach.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Of the tribe of Issachar, Phaltiel the prince, the son of Ozan.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Of the tribe of Aser, Ahiud the son of Salomi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Of the tribe of Nephtali: Phedael the son of Ammiud.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>These are they Whom the Lord hath commanded to divide the land of Chanaan to the children of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Præcipe filiis Israël, et dices ad eos : Cum ingressi fueritis terram Chanaan, et in possessionem vobis sorte ceciderit, his finibus terminabitur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pars meridiana incipiet a solitudine Sin, quæ est juxta Edom : et habebit terminos contra orientem mare salsissimum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui circuibunt australem plagam per ascensum Scorpionis, ita ut transeant in Senna, et perveniant a meridie usque ad Cadesbarne, unde egredientur confinia ad villam nomine Adar, et tendent usque ad Asemona.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ibitque per gyrum terminus ab Asemona usque ad torrentem Ægypti, et maris magni littore finietur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Plaga autem occidentalis a mari magno incipiet, et ipso fine claudetur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Porro ad septentrionalem plagam a mari magno termini incipient, pervenientes usque ad montem altissimum,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>a quo venient in Emath usque ad terminos Sedada :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>ibuntque confinia usque ad Zephrona, et villam Enan. Hi erunt termini in parte aquilonis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Inde metabuntur fines contra orientalem plagam de villa Enan usque Sephama,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et de Sephama descendent termini in Rebla contra fontem Daphnim : inde pervenient contra orientem ad mare Cenereth,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et tendent usque ad Jordanem, et ad ultimum salsissimo claudentur mari. Hanc habebitis terram per fines suos in circuitu.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Præcepitque Moyses filiis Israël, dicens : Hæc erit terra, quam possidebitis sorte, et quam jussit Dominus dari novem tribubus, et dimidiæ tribui.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tribus enim filiorum Ruben per familias suas, et tribus filiorum Gad juxta cognationum numerum, media quoque tribus Manasse,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>id est, duæ semis tribus, acceperunt partem suam trans Jordanem contra Jericho ad orientalem plagam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et ait Dominus ad Moysen :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hæc sunt nomina virorum qui terram vobis divident, Eleazar sacerdos, et Josue filius Nun,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et singuli principes de tribubus singulis,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>quorum ista sunt vocabula. De tribu Juda, Caleb filius Jephone.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De tribu Simeon, Samuel filius Ammiud.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>De tribu Benjamin, Elidad filius Chaselon.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>De tribu filiorum Dan, Bocci filius Jogli.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Filiorum Joseph de tribu Manasse, Hanniel filius Ephod.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>De tribu Ephraim, Camuel filius Sephthan.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>De tribu Zabulon, Elisaphan filius Pharnach.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>De tribu Issachar, dux Phaltiel filius Ozan.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>De tribu Aser, Ahiud filius Salomi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>De tribu Nephthali, Phedaël filius Ammiud.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Hi sunt, quibus præcepit Dominus ut dividerent filiis Israël terram Chanaan.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 33</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/35/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 35</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-x },{\"verse\":7,\"text\":\"But toward the north side the borders shall begin from the great sea, reaching to the most high mountain,\"},{\"verse\":8,\"text\":\"From which they shall come to Emath, as far as the borders of Sedada:\"},{\"verse\":9,\"text\":\"And the limits shall go as far as Zephrona, and the village of Enan. These shall be the borders on the north side.\"},{\"verse\":10,\"text\":\"From thence they shall mark out the bounds towards the east side from the village of Enan unto Sephama.\"},{\"verse\":11,\"text\":\"And from Sephama the bounds shall go down to Rebla over against the fountain of Daphnis: from thence they shall come eastward to the sea of Cenereth,\"},{\"verse\":12,\"text\":\"And shall reach as far as the Jordan, and at the last shall be closed in by the most salt sea. This shall be your land with its borders round about.\"},{\"verse\":13,\"text\":\"And Moses commanded the children of Israel, saying: This shall be the land which you shall possess by lot, and which the Lord hath commanded to be given to the nine tribes, and to the half tribe.\"},{\"verse\":14,\"text\":\"For the tribe of the children of Ruben by their families, and the tribe of the children of Gad according to the number of their kindreds, and half of the tribe of Manasses,\"},{\"verse\":15,\"text\":\"That is, two tribes and a half, have received their portion beyond the Jordan over against Jericho at the east side.\"},{\"verse\":16,\"text\":\"And the Lord said to Moses:\"},{\"verse\":17,\"text\":\"These are the names of the men, that shall divide the land unto you: Eleazar the priest, and Josue the son of Nun,\"},{\"verse\":18,\"text\":\"And one prince of every tribe,\"},{\"verse\":19,\"text\":\"Whose names are these: Of the tribe of Juda, Caleb the son of Jephone.\"},{\"verse\":20,\"text\":\"Of the tribe of Simeon, Samuel the son of Ammiud.\"},{\"verse\":21,\"text\":\"Of the tribe of Benjamin, Elidad the son of Chaselon.\"},{\"verse\":22,\"text\":\"Of the tribe of the children of Dan, Bocci the son of Jogli.\"},{\"verse\":23,\"text\":\"Of the children of Joseph of the tribe of Manasses, Hanniel the son of Ephod.\"},{\"verse\":24,\"text\":\"Of the tribe of Ephraim, Camuel the son of Sephtan.\"},{\"verse\":25,\"text\":\"Of the tribe of Zabulon, Elisaphan the son of Pharnach.\"},{\"verse\":26,\"text\":\"Of the tribe of Issachar, Phaltiel the prince, the son of Ozan.\"},{\"verse\":27,\"text\":\"Of the tribe of Aser, Ahiud the son of Salomi.\"},{\"verse\":28,\"text\":\"Of the tribe of Nephtali: Phedael the son of Ammiud.\"},{\"verse\":29,\"text\":\"These are they Whom the Lord hath commanded to divide the land of Chanaan to the children of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Præcipe filiis Israël, et dices ad eos : Cum ingressi fueritis terram Chanaan, et in possessionem vobis sorte ceciderit, his finibus terminabitur.\"},{\"verse\":3,\"text\":\"Pars meridiana incipiet a solitudine Sin, quæ est juxta Edom : et habebit terminos contra orientem mare salsissimum.\"},{\"verse\":4,\"text\":\"Qui circuibunt australem plagam per ascensum Scorpionis, ita ut transeant in Senna, et perveniant a meridie usque ad Cadesbarne, unde egredientur confinia ad villam nomine Adar, et tendent usque ad Asemona.\"},{\"verse\":5,\"text\":\"Ibitque per gyrum terminus ab Asemona usque ad torrentem Ægypti, et maris magni littore finietur.\"},{\"verse\":6,\"text\":\"Plaga autem occidentalis a mari magno incipiet, et ipso fine claudetur.\"},{\"verse\":7,\"text\":\"Porro ad septentrionalem plagam a mari magno termini incipient, pervenientes usque ad montem altissimum,\"},{\"verse\":8,\"text\":\"a quo venient in Emath usque ad terminos Sedada :\"},{\"verse\":9,\"text\":\"ibuntque confinia usque ad Zephrona, et villam Enan. Hi erunt termini in parte aquilonis.\"},{\"verse\":10,\"text\":\"Inde metabuntur fines contra orientalem plagam de villa Enan usque Sephama,\"},{\"verse\":11,\"text\":\"et de Sephama descendent termini in Rebla contra fontem Daphnim : inde pervenient contra orientem ad mare Cenereth,\"},{\"verse\":12,\"text\":\"et tendent usque ad Jordanem, et ad ultimum salsissimo claudentur mari. Hanc habebitis terram per fines suos in circuitu.\"},{\"verse\":13,\"text\":\"Præcepitque Moyses filiis Israël, dicens : Hæc erit terra, quam possidebitis sorte, et quam jussit Dominus dari novem tribubus, et dimidiæ tribui.\"},{\"verse\":14,\"text\":\"Tribus enim filiorum Ruben per familias suas, et tribus filiorum Gad juxta cognationum numerum, media quoque tribus Manasse,\"},{\"verse\":15,\"text\":\"id est, duæ semis tribus, acceperunt partem suam trans Jordanem contra Jericho ad orientalem plagam.\"},{\"verse\":16,\"text\":\"Et ait Dominus ad Moysen :\"},{\"verse\":17,\"text\":\"Hæc sunt nomina virorum qui terram vobis divident, Eleazar sacerdos, et Josue filius Nun,\"},{\"verse\":18,\"text\":\"et singuli principes de tribubus singulis,\"},{\"verse\":19,\"text\":\"quorum ista sunt vocabula. De tribu Juda, Caleb filius Jephone.\"},{\"verse\":20,\"text\":\"De tribu Simeon, Samuel filius Ammiud.\"},{\"verse\":21,\"text\":\"De tribu Benjamin, Elidad filius Chaselon.\"},{\"verse\":22,\"text\":\"De tribu filiorum Dan, Bocci filius Jogli.\"},{\"verse\":23,\"text\":\"Filiorum Joseph de tribu Manasse, Hanniel filius Ephod.\"},{\"verse\":24,\"text\":\"De tribu Ephraim, Camuel filius Sephthan.\"},{\"verse\":25,\"text\":\"De tribu Zabulon, Elisaphan filius Pharnach.\"},{\"verse\":26,\"text\":\"De tribu Issachar, dux Phaltiel filius Ozan.\"},{\"verse\":27,\"text\":\"De tribu Aser, Ahiud filius Salomi.\"},{\"verse\":28,\"text\":\"De tribu Nephthali, Phedaël filius Ammiud.\"},{\"verse\":29,\"text\":\"Hi sunt, quibus præcepit Dominus ut dividerent filiis Israël terram Chanaan.\"}],\"summary\":\"The limits of Chanaan; with the names of the men that make the division of it.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":33,\"label\":\"Numbers 33\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":35,\"label\":\"Numbers 35\"}}]]\n"])</script></body></html>
