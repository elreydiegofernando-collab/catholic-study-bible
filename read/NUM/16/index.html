<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Numbers 16 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The schism of Core and his adherents: their punishment.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And behold Core the son of Isaar, the son of Caath, the son of Levi, and Dathan and Abiron the sons of Eliab, and Hon the son of Pheleth of the children of Ruben,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Rose up against Moses, and with them two hundred and fifty others of the children of Israel, leading men of the synagogue, and who in the time of assembly were called by name.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when they had stood up against Moses and Aaron, they said: Let it be enough for you, that all the multitude consisteth of holy ones, and the Lord is among them: Why lift you up yourselves above the people of the Lord?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>When Moses heard this, he fell flat on his face:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And speaking to Core and all the multitude, he said: In the morning the Lord will make known who belong to him, and the holy he will join to himself: and whom he shall choose, they shall approach to him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Do this therefore: Take every man of you your censers, thou Core, and all thy company.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And putting fire in them to morrow, put incense upon it before the Lord: and whomsoever he shall choose, the same shall be holy: you take too much upon you, ye sons of Levi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he said again to Core: Hear ye sons of Levi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Is it a small thing unto you, that the God of Israel hath spared you from all the people, and joined you to himself, that you should serve him in the service of the tabernacle, and should stand before the congregation of the people, and should minister to him?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Did he therefore make thee and all thy brethren the sons of Levi to approach unto him, that you should challenge to yourselves the priesthood also,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And that all thy company should stand against the Lord? for what is Aaron that you murmur against him?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then Moses sent to call Dathan and Abiron the sons of Eliab. But they answered: We will not come.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Is it a small matter to thee, that thou hast brought us out of a land that flowed with milk and honey, to kill us in the desert, except thou rule also like a lord over us?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou hast brought us indeed into a land that floweth with rivers of milk and honey, and hast given us possessions of fields and vineyards; wilt thou also pull out our eyes? We will not come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Moses therefore being very angry, said to the Lord: Respect not their sacrifices: thou knowest that I have not taken of them so much as a young ass at any time, nor have injured any of them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he said to Core: Do thou and thy congregation stand apart before the Lord to morrow, and Aaron apart.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Take every one of you censers, and put incense upon them, offering to the Lord two hundred and fifty censers: let Aaron also hold his censer.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When they had done this, Moses and Aaron standing,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And had drawn up all the multitude against them to the door of the tabernacle, the glory of the Lord appeared to them all.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the Lord speaking to Moses and Aaron, said:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Separate yourselves from among this congregation, that I may presently destroy them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>They fell flat on their face, and said: O most mighty, the God of the spirits of all flesh, for one man’s sin shall thy wrath rage against all?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the Lord said to Moses:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Command the whole people to separate themselves from the tents of Core and Dathan and Abiron.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Moses arose, and went to Dathan and Abiron: and the ancients of Israel following him,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He said to the multitude: Depart from the tents of these wicked men, and touch nothing of theirs, lest you be involved in their sins.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when they were departed from their tents round about, Dathan and Abiron coming out stood in the entry of their pavilions with their wives and children, and all the people.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Moses said: By this you shall know that the Lord hath sent me to do all things that you see, and that I have not forged them of my own head:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>If these men die the common death of men, and if they be visited with a plague, wherewith others also are wont to be visited, the Lord did not send me.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But if the Lord do a new thing, and the earth opening her mouth swallow them down, and all things that belong to them, and they go down alive into hell, you shall know that they have blasphemed the Lord.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And immediately as he had made an end of speaking, the earth broke asunder under their feet:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And opening her mouth, devoured them with their tents and all their substance.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they went down alive into hell, the ground closing upon them, and they perished from among the people.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But all Israel, that was standing round about, fled at the cry of them that were perishing: saying: Lest perhaps the earth swallow us up also.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And a fire coming out from the Lord, destroyed the two hundred and fifty men that offered the incense.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Command Eleazar the son of Aaron the priest to take up the censers that lie in the burning, and to scatter the fire of one side and the other: because they are sanctified</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>In the deaths of the sinners: and let him beat them into plates, and fasten them to the altar, because incense hath been offered in them to the Lord, and they are sanctified, that the children of Israel may see them for a sign and a memorial.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Then Eleazar the priest took the brazen censers, wherein they had offered, whom the burning fire had devoured, and beat them into plates, fastening them to the altar:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>That the children of Israel might have for the time to come wherewith they should be admonished, that no stranger or any one that is not of the seed of Aaron should come near to offer incense to the Lord, lest he should suffer as Core suffered, and all his congregation, according as the Lord spoke to Moses.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The following day all the multitude of the children of Israel murmured against Moses and Aaron, saying: You have killed the people of the Lord.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And when there arose a sedition, and the tumult increased,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Moses and Aaron fled to the tabernacle of the covenant. And when they were gone into it, the cloud covered it, and the glory of the Lord appeared.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the Lord said to Moses:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Get you out from the midst of this multitude, this moment will I destroy them. And as they were lying on the ground,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Moses said to Aaron: Take the censer, and putting fire in it from the altar, put incense upon it, and go quickly to the people to pray for them: for already wrath is gone out from the Lord, and the plague rageth.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>When Aaron had done this, and had run to the midst of the multitude which the burning fire was now destroying, he offered the incense:</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And standing between the dead and the living, he prayed for the people, and the plague ceased.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And the number of them that were slain was fourteen thousand and seven hundred men, besides them that had perished in the sedition of Core.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And Aaron returned to Moses to the door of the tabernacle of the covenant after the destruction was over.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ecce autem Core filius Isaar, filii Caath, filii Levi, et Dathan atque Abiron filii Eliab, Hon quoque filius Pheleth de filiis Ruben,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>surrexerunt contra Moysen, aliique filiorum Israël ducenti quinquaginta viri proceres synagogæ, et qui tempore concilii per nomina vocabantur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cumque stetissent adversum Moysen et Aaron, dixerunt : Sufficiat vobis, quia omnis multitudo sanctorum est, et in ipsis est Dominus : cur elevamini super populum Domini ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quod cum audisset Moyses, cecidit pronus in faciem :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>locutusque ad Core et ad omnem multitudinem : Mane, inquit, notum faciet Dominus qui ad se pertineant, et sanctos applicabit sibi : et quos elegerit, appropinquabunt ei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hoc igitur facite : tollat unusquisque thuribula sua, tu Core, et omne concilium tuum :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et hausto cras igne, ponite desuper thymiama coram Domino : et quemcumque elegerit, ipse erit sanctus : multum erigimini filii Levi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixitque rursum ad Core : Audite, filii Levi :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>num parum vobis est quod separavit vos Deus Israël ab omni populo, et junxit sibi, ut serviretis ei in cultu tabernaculi, et staretis coram frequentia populi, et ministraretis ei ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>idcirco ad se fecit accedere te et omnes fratres tuos filios Levi, ut vobis etiam sacerdotium vindicetis,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et omnis globus tuus stet contra Dominum ? quid est enim Aaron ut murmuretis contra eum ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Misit ergo Moyses ut vocaret Dathan et Abiron filios Eliab. Qui responderunt : Non venimus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Numquid parum est tibi quod eduxisti nos de terra, quæ lacte et melle manabat, ut occideres in deserto, nisi et dominatus fueris nostri ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Revera induxisti nos in terram, quæ fluit rivis lactis et mellis, et dedisti nobis possessiones agrorum et vinearum : an et oculos nostros vis eruere ? non venimus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Iratusque Moyses valde, ait ad Dominum : Ne respicias sacrificia eorum : tu scis quod ne asellum quidem umquam acceperim ab eis, nec afflixerim quempiam eorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dixitque ad Core : Tu, et omnis congregatio tua, state seorsum coram Domino, et Aaron die crastino separatim.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tollite singuli thuribula vestra, et ponite super ea incensum, offerentes Domino ducenta quinquaginta thuribula : Aaron quoque teneat thuribulum suum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quod cum fecissent, stantibus Moyses et Aaron,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et coacervassent adversum eos omnem multitudinem ad ostium tabernaculi, apparuit cunctis gloria Domini.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Locutusque Dominus ad Moysen et Aaron, ait :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Separamini de medio congregationis hujus, ut eos repente disperdam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui ceciderunt proni in faciem, atque dixerunt : Fortissime Deus spirituum universæ carnis, num uno peccante, contra omnes ira tua desæviet ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ait Dominus ad Moysen :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Præcipe universo populo ut separetur a tabernaculis Core et Dathan et Abiron.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Surrexitque Moyses, et abiit ad Dathan et Abiron : et sequentibus eum senioribus Israël,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>dixit ad turbam : Recedite a tabernaculis hominum impiorum, et nolite tangere quæ ad eos pertinent, ne involvamini in peccatis eorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Cumque recessissent a tentoriis eorum per circuitum, Dathan et Abiron egressi stabant in introitu papilionum suorum cum uxoribus et liberis, omnique frequentia.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et ait Moyses : In hoc scietis quod Dominus miserit me ut facerem universa quæ cernitis, et non ex proprio ea corde protulerim :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>si consueta hominum morte interierint, et visitaverit eos plaga, qua et ceteri visitari solent, non misit me Dominus :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>sin autem novam rem fecerit Dominus, ut aperiens terra os suum deglutiat eos et omnia quæ ad illos pertinent, descenderintque viventes in infernum, scietis quod blasphemaverint Dominum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Confestim igitur ut cessavit loqui, dirupta est terra sub pedibus eorum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et aperiens os suum, devoravit illos cum tabernaculis suis et universa substantia eorum,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>descenderuntque vivi in infernum operti humo, et perierunt de medio multitudinis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>At vero omnis Israël, qui stabat per gyrum, fugit ad clamorem pereuntium, dicens : Ne forte et nos terra deglutiat.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Sed et ignis egressus a Domino interfecit ducentos quinquaginta viros, qui offerebant incensum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Præcipe Eleazaro filio Aaron sacerdoti ut tollat thuribula quæ jacent in incendio, et ignem huc illucque dispergat : quoniam sanctificata sunt</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>in mortibus peccatorum : producatque ea in laminas, et affigat altari, eo quod oblatum sit in eis incensum Domino, et sanctificata sint, ut cernant ea pro signo et monimento filii Israël.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Tulit ergo Eleazar sacerdos thuribula ænea, in quibus obtulerant hi quos incendium devoravit, et produxit ea in laminas, affigens altari :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>ut haberent postea filii Israël, quibus commonerentur ne quis accedat alienigena, et qui non est de semine Aaron ad offerendum incensum Domino, ne patiatur sicut passus est Core, et omnis congregatio ejus, loquente Domino ad Moysen.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Murmuravit autem omnis multitudo filiorum Israël sequenti die contra Moysen et Aaron, dicens : Vos interfecistis populum Domini.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Cumque oriretur seditio, et tumultus incresceret,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Moyses et Aaron fugerunt ad tabernaculum fœderis. Quod, postquam ingressi sunt, operuit nubes, et apparuit gloria Domini.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Dixitque Dominus ad Moysen :</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Recedite de medio hujus multitudinis, etiam nunc delebo eos. Cumque jacerent in terra,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>dixit Moyses ad Aaron : Tolle thuribulum, et hausto igne de altari, mitte incensum desuper, pergens cito ad populum, ut roges pro eis : jam enim egressa est ira a Domino, et plaga desævit.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Quod cum fecisset Aaron, et cucurrisset ad mediam multitudinem, quam jam vastabat incendium, obtulit thymiama :</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>et stans inter mortuos ac viventes, pro populo deprecatus est, et plaga cessavit.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Fuerunt autem qui percussi sunt, quatuordecim millia hominum, et septingenti, absque his qui perierant in seditione Core.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Reversusque est Aaron ad Moysen ad ostium tabernaculi fœderis postquam quievit interitus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone Name\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":16,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And behold Core the son of Isaar, the son of Caath, the son of Levi, and Dathan and Abiron the sons of Eliab, and Hon the son of Pheleth of the children of Ruben,\"},{\"verse\":2,\"text\":\"Rose up against Moses, and with them two hundred and fifty others of the children of Israel, leading men of the synagogue, and who in the time of assembly were called by name.\"},{\"verse\":3,\"text\":\"And when they had stood up against Moses and Aaron, they said: Let it be enough for you, that all the multitude consisteth of holy ones, and the Lord is among them: Why lift you up yourselves above the people of the Lord?\"},{\"verse\":4,\"text\":\"When Moses heard this, he fell flat on his face:\"},{\"verse\":5,\"text\":\"And speaking to Core and all the multitude, he said: In the morning the Lord will make known who belong to him, and the holy he will join to himself: and whom he shall choose, they shall approach to him.\"},{\"verse\":6,\"text\":\"Do this therefore: Take every man of you your censers, thou Core, and all thy company.\"},{\"verse\":7,\"text\":\"And putting fire in them to morrow, put incense upon it before the Lord: and whomsoever he shall choose, the same shall be holy: you take too much upon you, ye sons of Levi.\"},{\"verse\":8,\"text\":\"And he said again to Core: Hear ye sons of Levi.\"},{\"verse\":9,\"text\":\"Is it a small thing unto you, that the God of Israel hath spared you from all the people, and joined you to himself, that you should serve him in the service of the tabernacle, and should stand before the congregation of the people, and should minister to him?\"},{\"verse\":10,\"text\":\"Did he therefore make thee and all thy brethren the sons of Levi to approach unto him, that you should challenge to yourselves the priesthood also,\"},{\"verse\":11,\"text\":\"And that all thy company should stand against the Lord? for what is Aaron that you murmur against him?\"},{\"verse\":12,\"text\":\"Then Moses sent to call Dathan and Abiron the sons of Eliab. But they answered: We will not come.\"},{\"verse\":13,\"text\":\"Is it a small matter to thee, that thou hast brought us out of a land that flowed with milk and honey, to kill us in the desert, except thou rule also like a lord over us?\"},{\"verse\":14,\"text\":\"Thou hast brought us indeed into a land that floweth with rivers of milk and honey, and hast given us possessions of fields and vineyards; wilt thou also pull out our eyes? We will not come.\"},{\"verse\":15,\"text\":\"Moses therefore being very angry, said to the Lord: Respect not their sacrifices: thou knowest that I have not taken of them so much as a young ass at any time, nor have injured any of them.\"},{\"verse\":16,\"text\":\"And he said to Core: Do thou and thy congregation stand apart before the Lord to morrow, and Aaron apart.\"},{\"verse\":17,\"text\":\"Take every one of you censers, and put incense upon them, offering to the Lord two hundred and fifty censers: let Aaron also hold his censer.\"},{\"verse\":18,\"text\":\"When they had done this, Moses and Aaron standing,\"},{\"verse\":19,\"text\":\"And had drawn up all the multitude against them to the door of the tabernacle, the glory of the Lord appeared to them all.\"},{\"verse\":20,\"text\":\"And the Lord speaking to Moses and Aaron, said:\"},{\"verse\":21,\"text\":\"Separate yourselves from among this congregation, that I may presently destroy them.\"},{\"verse\":22,\"text\":\"They fell flat on their face, and said: O most mighty, the God of the spirits of all flesh, for one man’s sin shall thy wrath rage against all?\"},{\"verse\":23,\"text\":\"And the Lord said to Moses:\"},{\"verse\":24,\"text\":\"Command the whole people to separate themselves from the tents of Core and Dathan and Abiron.\"},{\"verse\":25,\"text\":\"And Moses arose, and went to Dathan and Abiron: and the ancients of Israel following him,\"},{\"verse\":26,\"text\":\"He said to the multitude: Depart from the tents of these wicked men, and touch nothing of theirs, lest you be involved in their sins.\"},{\"verse\":27,\"text\":\"And when they were departed from their tents round about, Dathan and Abiron coming out stood in the entry of their pavilions with their wives and children, and all the people.\"},{\"verse\":28,\"text\":\"And Moses said: By this you shall know that the Lord hath sent me to do all things that you see, and that I have not forged them of my own head:\"},{\"verse\":29,\"text\":\"If these men die the common death of men, and if they be visited with a plague, wherewith others also are wont to be visited, the Lord did not send me.\"},{\"verse\":30,\"text\":\"But if the Lord do a new thing, and the earth opening her mouth swallow them down, and all things that belong to them, and they go down alive into hell, you shall know that they have blasphemed the Lord.\"},{\"verse\":31,\"text\":\"And immediately as he had made an end of speaking, the earth broke asunder under their feet:\"},{\"verse\":32,\"text\":\"And opening her mouth, devoured them with their tents and all their substance.\"},{\"verse\":33,\"text\":\"And they went down alive into hell, the ground closing upon them, and they perished from among the people.\"},{\"verse\":34,\"text\":\"But all Israel, that was standing round about, fled at the cry of them that were perishing: saying: Lest perhaps the earth swallow us up also.\"},{\"verse\":35,\"text\":\"And a fire coming out from the Lord, destroyed the two hundred and fifty men that offered the incense.\"},{\"verse\":36,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":37,\"text\":\"Command Eleazar the son of Aaron the priest to take up the censers that lie in the burning, and to scatter the fire of one side and the other: because they are sanctified\"},{\"verse\":38,\"text\":\"In the deaths of the sinners: and let him beat them into plates, and fasten them to the altar, because incense hath been offered in them to the Lord, and they are sanctified, that the children of Israel may see them for a sign and a memorial.\"},{\"verse\":39,\"text\":\"Then Eleazar the priest took the brazen censers, wherein they had offered, whom the burning fire had devoured, and beat them into plates, fastening them to the altar:\"},{\"verse\":40,\"text\":\"That the children of Israel might have for the time to come wherewith they should be admonished, that no stranger or any one that is not of the seed of Aaron should come near to offer incense to the Lord, lest he should suffer as Core suffered, and all his congregation, according as the Lord spoke to Moses.\"},{\"verse\":41,\"text\":\"The following day all the multitude of the children of Israel murmured against Moses and Aaron, saying: You have killed the people of the Lord.\"},{\"verse\":42,\"text\":\"And when there arose a sedition, and the tumult increased,\"},{\"verse\":43,\"text\":\"Moses and Aaron fled to the tabernacle of the covenant. And when they were gone into it, the cloud covered it, and the glory of the Lord appeared.\"},{\"verse\":44,\"text\":\"And the Lord said to Moses:\"},{\"verse\":45,\"text\":\"Get you out from the midst of this multitude, this moment will I destroy them. And as they were lying on the ground,\"},{\"verse\":46,\"text\":\"Moses said to Aaron: Take the censer, and putting fire in it from the altar, put incense upon it, and go quickly to the people to pray for them: for already wrath is gone out from the Lord, and the plague rageth.\"},{\"verse\":47,\"text\":\"When Aaron had done this, and had run to the midst of the multitude which the burning fire was now destroying, he offered the incense:\"},{\"verse\":48,\"text\":\"And standing between the dead and the living, he prayed for the people, and the plague ceased.\"},{\"verse\":49,\"text\":\"And the number of them that were slain was fourteen thousand and seven hundred men, besides them that had perished in the sedition of Core.\"},{\"verse\":50,\"text\":\"And Aaron returned to Moses to the door of the tabernacle of the covenant after the destruction was over.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ecce autem Core filius Isaar, filii Caath, filii Levi, et Dathan atque Abiron filii Eliab, Hon quoque filius Pheleth de filiis Ruben,\"},{\"verse\":2,\"text\":\"surrexerunt contra Moysen, aliique filiorum Israël ducenti quinquaginta viri proceres synagogæ, et qui tempore concilii per nomina vocabantur.\"},{\"verse\":3,\"text\":\"Cumque stetissent adversum Moysen et Aaron, dixerunt : Sufficiat vobis, quia omnis multitudo sanctorum est, et in ipsis est Dominus : cur elevamini super populum Domini ?\"},{\"verse\":4,\"text\":\"Quod cum audisset Moyses, cecidit pronus in faciem :\"},{\"verse\":5,\"text\":\"locutusque ad Core et ad omnem multitudinem : Mane, inquit, notum faciet Dominus qui ad se pertineant, et sanctos applicabit sibi : et quos elegerit, appropinquabunt ei.\"},{\"verse\":6,\"text\":\"Hoc igitur facite : tollat unusquisque thuribula sua, tu Core, et omne concilium tuum :\"},{\"verse\":7,\"text\":\"et hausto cras igne, ponite desuper thymiama coram Domino : et quemcumque elegerit, ipse erit sanctus : multum erigimini filii Levi.\"},{\"verse\":8,\"text\":\"Dixitque rursum ad Core : Audite, filii Levi :\"},{\"verse\":9,\"text\":\"num parum vobis est quod separavit vos Deus Israël ab omni populo, et junxit sibi, ut serviretis ei in cultu tabernaculi, et staretis coram frequentia populi, et ministraretis ei ?\"},{\"verse\":10,\"text\":\"idcirco ad se fecit accedere te et omnes fratres tuos filios Levi, ut vobis etiam sacerdotium vindicetis,\"},{\"verse\":11,\"text\":\"et omnis globus tuus stet contra Dominum ? quid est enim Aaron ut murmuretis contra eum ?\"},{\"verse\":12,\"text\":\"Misit ergo Moyses ut vocaret Dathan et Abiron filios Eliab. Qui responderunt : Non venimus.\"},{\"verse\":13,\"text\":\"Numquid parum est tibi quod eduxisti nos de terra, quæ lacte et melle manabat, ut occideres in deserto, nisi et dominatus fueris nostri ?\"},{\"verse\":14,\"text\":\"Revera induxisti nos in terram, quæ fluit rivis lactis et mellis, et dedisti nobis possessiones agrorum et vinearum : an et oculos nostros vis eruere ? non venimus.\"},{\"verse\":15,\"text\":\"Iratusque Moyses valde, ait ad Dominum : Ne respicias sacrificia eorum : tu scis quod ne asellum quidem umquam acceperim ab eis, nec afflixerim quempiam eorum.\"},{\"verse\":16,\"text\":\"Dixitque ad Core : Tu, et omnis congregatio tua, state seorsum coram Domino, et Aaron die crastino separatim.\"},{\"verse\":17,\"text\":\"Tollite singuli thuribula vestra, et ponite super ea incensum, offerentes Domino ducenta quinquaginta thuribula : Aaron quoque teneat thuribulum suum.\"},{\"verse\":18,\"text\":\"Quod cum fecissent, stantibus Moyses et Aaron,\"},{\"verse\":19,\"text\":\"et coacervassent adversum eos omnem multitudinem ad ostium tabernaculi, apparuit cunctis gloria Domini.\"},{\"verse\":20,\"text\":\"Locutusque Dominus ad Moysen et Aaron, ait :\"},{\"verse\":21,\"text\":\"Separamini de medio congregationis hujus, ut eos repente disperdam.\"},{\"verse\":22,\"text\":\"Qui ceciderunt proni in faciem, atque dixerunt : Fortissime Deus spirituum universæ carnis, num uno peccante, contra omnes ira tua desæviet ?\"},{\"verse\":23,\"text\":\"Et ait Dominus ad Moysen :\"},{\"verse\":24,\"text\":\"Præcipe universo populo ut separetur a tabernaculis Core et Dathan et Abiron.\"},{\"verse\":25,\"text\":\"Surrexitque Moyses, et abiit ad Dathan et Abiron : et sequentibus eum senioribus Israël,\"},{\"verse\":26,\"text\":\"dixit ad turbam : Recedite a tabernaculis hominum impiorum, et nolite tangere quæ ad eos pertinent, ne involvamini in peccatis eorum.\"},{\"verse\":27,\"text\":\"Cumque recessissent a tentoriis eorum per circuitum, Dathan et Abiron egressi stabant in introitu papilionum suorum cum uxoribus et liberis, omnique frequentia.\"},{\"verse\":28,\"text\":\"Et ait Moyses : In hoc scietis quod Dominus miserit me ut facerem universa quæ cernitis, et non ex proprio ea corde protulerim :\"},{\"verse\":29,\"text\":\"si consueta hominum morte interierint, et visitaverit eos plaga, qua et ceteri visitari solent, non misit me Dominus :\"},{\"verse\":30,\"text\":\"sin autem novam rem fecerit Dominus, ut aperiens terra os suum deglutiat eos et omnia quæ ad illos pertinent, descenderintque viventes in infernum, scietis quod blasphemaverint Dominum.\"},{\"verse\":31,\"text\":\"Confestim igitur ut cessavit loqui, dirupta est terra sub pedibus eorum :\"},{\"verse\":32,\"text\":\"et aperiens os suum, devoravit illos cum tabernaculis suis et universa substantia eorum,\"},{\"verse\":33,\"text\":\"descenderuntque vivi in infernum operti humo, et perierunt de medio multitudinis.\"},{\"verse\":34,\"text\":\"At vero omnis Israël, qui stabat per gyrum, fugit ad clamorem pereuntium, dicens : Ne forte et nos terra deglutiat.\"},{\"verse\":35,\"text\":\"Sed et ignis egressus a Domino interfecit ducentos quinquaginta viros, qui offerebant incensum.\"},{\"verse\":36,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":37,\"text\":\"Præcipe Eleazaro filio Aaron sacerdoti ut tollat thuribula quæ jacent in incendio, et ignem huc illucque dispergat : quoniam sanctificata sunt\"},{\"verse\":38,\"text\":\"in mortibus peccatorum : producatque ea in laminas, et affigat altari, eo quod oblatum sit in eis incensum Domino, et sanctificata sint, ut cernant ea pro signo et monimento filii Israël.\"},{\"verse\":39,\"text\":\"Tulit ergo Eleazar sacerdos thuribula ænea, in quibus obtulerant hi quos incendium devoravit, et produxit ea in laminas, affigens altari :\"},{\"verse\":40,\"text\":\"ut haberent postea filii Israël, quibus commonerentur ne quis accedat alienigena, et qui non est de semine Aaron ad offerendum incensum Domino, ne patiatur sicut passus est Core, et omnis congregatio ejus, loquente Domino ad Moysen.\"},{\"verse\":41,\"text\":\"Murmuravit autem omnis multitudo filiorum Israël sequenti die contra Moysen et Aaron, dicens : Vos interfecistis populum Domini.\"},{\"verse\":42,\"text\":\"Cumque oriretur seditio, et tumultus incresceret,\"},{\"verse\":43,\"text\":\"Moyses et Aaron fugerunt ad tabernaculum fœderis. Quod, postquam ingressi sunt, operuit nubes, et apparuit gloria Domini.\"},{\"verse\":44,\"text\":\"Dixitque Dominus ad Moysen :\"},{\"verse\":45,\"text\":\"Recedite de medio hujus multitudinis, etiam nunc delebo eos. Cumque jacerent in terra,\"},{\"verse\":46,\"text\":\"dixit Moyses ad Aaron : Tolle thuribulum, et hausto igne de altari, mitte incensum desuper, pergens cito ad populum, ut roges pro eis : jam enim egressa est ira a Domino, et plaga desævit.\"},{\"verse\":47,\"text\":\"Quod cum fecisset Aaron, et cucurrisset ad mediam multitudinem, quam jam vastabat incendium, obtulit thymiama :\"},{\"verse\":48,\"text\":\"et stans inter mortuos ac viventes, pro populo deprecatus est, et plaga cessavit.\"},{\"verse\":49,\"text\":\"Fuerunt autem qui percussi sunt, quatuordecim millia hominum, et septingenti, absque his qui perierant in seditione Core.\"},{\"verse\":50,\"text\":\"Reversusque est Aaron ad Moysen ad ostium tabernaculi fœderis postquam quievit interitus.\"}],\"summary\":\"The schism of Core and his adherents: their punishment.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":15,\"label\":\"Numbers 15\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":17,\"label\":\"Numbers 17\"}}]]\n"])</script></body></html>
