-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The twelve spies are sent to view the land. The relation they make of it.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the people marched from Haseroth, and pitched their tents in the desert of Pharan.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And there the Lord spoke to Moses, saying.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Send men to view the land of Chanaan, which I will give to the children of Israel, one of every tribe, of the rulers.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Moses did what the Lord had commanded, sending from the desert of Pharan, principal men, whose names are these:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Of the tribe of Ruben, Sammua the son of Zechur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Of the tribe of Simeon, Saphat the son of Huri.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Of the tribe of Juda, Caleb the son of Jephone.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Of the tribe of Issachar, Igal the son of Joseph.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Of the tribe of Ephraim, Osee the son of Nun.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Of the tribe of Benjamin, Phalti the son of Raphu.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Of the tribe of Zabulon, Geddiel the son of Sodi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Of the tribe of Joseph, of the sceptre of Manasses, Gaddi the son of Susi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Of the tribe of Dan, Ammiel the son of Gemalli.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Of the tribe of Aser, Sthur the son of Michael.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Of the tribe of Nephtali, Nahabi the son of Vapsi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Of the tribe of Gad, Guel the son of Machi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>These are the names of the men, whom Moses sent to view the land: and he called Osee the son of Nun, Josue.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Moses sent them to view the land of Chanaan, and said to them: Go you up by the south side. And when you shall come to the mountains,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>View the land, of what sort it is, and the people that are the inhabitants thereof, whether they be strong or weak: few in number or many:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The land itself, whether it be good or bad: what manner of cities, walled or without walls:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The ground, fat or barren, woody or without trees. Be of good courage, and bring us of the fruits of the land. Now it was the time when the firstripe grapes are fit to be eaten.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And when they were gone up, they viewed the land from the desert of Sin, unto Rohob as you enter into Emath.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they went up at the south side, and came to Hebron, where were Achiman and Sisai and Tholmai the sons of Enac. For Hebron was built seven years before Tanis the city of Egypt.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And going forward as far as the torrent of the cluster of grapes, they cut off a branch with its cluster of grapes, which two men carried upon a lever. They took also of the pomegranates and of the figs of that place:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Which was called Nehelescol, that is to say, the torrent of the cluster of grapes, because from thence the children of Israel had carried a cluster of grapes.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they that went to spy out the land returned after forty days, having gone round all the country,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And came to Moses and Aaron and to all the assembly of the children of Israel to the desert of Pharan, which is in Cades. And speaking to them and to all the multitude, they shewed them the fruits of the land:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they related and said: We came into the land to which thou sentest us, which in very deed floweth with milk and honey as may be known by these fruits:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But it hath very strong inhabitants, and the cities are great and walled. We saw there the race of Enac.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Amalec dwelleth in the south, the Hethite and the Jebusite and the Amorrhite in the mountains: but the Chanaanite abideth by the sea and near the streams of the Jordan.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In the mean time Caleb, to still the murmuring of the people that rose against Moses, said: Let us go up and possess the land, for we shall be able to conquer it.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But the others, that had been with him, said: No, we are not able to go up to this people, because they are stronger than we.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they spoke ill of the land, which they had viewed, before the children of Israel, saying: The land which we have viewed, devoureth its inhabitants: the people, that we beheld are of a tall stature.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>There we saw certain monsters of the sons of Enac, of the giant kind: in comparison of whom, we seemed like locusts.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Profectusque est populus de Haseroth, fixis tentoriis in deserto Pharan.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ibique locutus est Dominus ad Moysen, dicens :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Mitte viros, qui considerent terram Chanaan, quam daturus sum filiis Israël, singulos de singulis tribubus, ex principibus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Fecit Moyses quod Dominus imperaverat, de deserto Pharan mittens principes viros, quorum ista sunt nomina.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>De tribu Ruben, Sammua filium Zechur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>De tribu Simeon, Saphat filium Huri.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>De tribu Juda, Caleb filium Jephone.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>De tribu Issachar, Igal filium Joseph.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>De tribu Ephraim, Osee filium Nun.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>De tribu Benjamin, Phalti filium Raphu.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>De tribu Zabulon, Geddiel filium Sodi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>De tribu Joseph, sceptri Manasse, Gaddi filium Susi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>De tribu Dan, Ammiel filium Gemalli.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>De tribu Aser, Sthur filium Michaël.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>De tribu Nephthali, Nahabi filium Vapsi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>De tribu Gad, Guel filium Machi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hæc sunt nomina virorum, quos misit Moyses ad considerandam terram : vocavitque Osee filium Nun, Josue.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Misit ergo eos Moyses ad considerandam terram Chanaan, et dixit ad eos : Ascendite per meridianam plagam. Cumque veneritis ad montes,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>considerate terram, qualis sit : et populum qui habitator est ejus, utrum fortis sit an infirmus : si pauci numero an plures :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ipsa terra, bona an mala : urbes quales, muratæ an absque muris :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>humus, pinguis an sterilis, nemorosa an absque arboribus. Confortamini, et afferte nobis de fructibus terræ. Erat autem tempus quando jam præcoquæ uvæ vesci possunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cumque ascendissent, exploraverunt terram a deserto Sin, usque Rohob intrantibus Emath.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ascenderuntque ad meridiem, et venerunt in Hebron, ubi erant Achiman et Sisai et Tholmai filii Enac : nam Hebron septem annis ante Tanim urbem Ægypti condita est.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pergentesque usque ad Torrentem botri, absciderunt palmitem cum uva sua, quem portaverunt in vecte duo viri. De malis quoque granatis et de ficis loci illius tulerunt :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>qui appellatus est Nehelescol, id est Torrens botri, eo quod botrum portassent inde filii Israël.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Reversique exploratores terræ post quadraginta dies, omni regione circuita,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>venerunt ad Moysen et Aaron et ad omnem cœtum filiorum Israël in desertum Pharan, quod est in Cades. Locutique eis et omni multitudini ostenderunt fructus terræ :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et narraverunt, dicentes : Venimus in terram, ad quam misisti nos, quæ revera fluit lacte et melle, ut ex his fructibus cognosci potest :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>sed cultores fortissimos habet, et urbes grandes atque muratas. Stirpem Enac vidimus ibi.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Amalec habitat in meridie, Hethæus et Jebusæus et Amorrhæus in montanis : Chananæus vero moratur juxta mare et circa fluenta Jordanis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Inter hæc Caleb compescens murmur populi, qui oriebatur contra Moysen, ait : Ascendamus, et possideamus terram, quoniam poterimus obtinere eam.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Alii vero, qui fuerant cum eo, dicebant : Nequaquam ad hunc populum valemus ascendere, quia fortior nobis est.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Detraxeruntque terræ, quam inspexerant, apud filios Israël, dicentes : Terra, quam lustravimus, devorat habitatores suos : populus, quem aspeximus, proceræ staturæ est.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Ibi vidimus monstra quædam filiorum Enac de genere giganteo : quibus comparati, quasi locustæ videbamur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" h }],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.13\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":13,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And the people marched from Haseroth, and pitched their tents in the desert of Pharan.\"},{\"verse\":2,\"text\":\"And there the Lord spoke to Moses, saying.\"},{\"verse\":3,\"text\":\"Send men to view the land of Chanaan, which I will give to the children of Israel, one of every tribe, of the rulers.\"},{\"verse\":4,\"text\":\"Moses did what the Lord had commanded, sending from the desert of Pharan, principal men, whose names are these:\"},{\"verse\":5,\"text\":\"Of the tribe of Ruben, Sammua the son of Zechur.\"},{\"verse\":6,\"text\":\"Of the tribe of Simeon, Saphat the son of Huri.\"},{\"verse\":7,\"text\":\"Of the tribe of Juda, Caleb the son of Jephone.\"},{\"verse\":8,\"text\":\"Of the tribe of Issachar, Igal the son of Joseph.\"},{\"verse\":9,\"text\":\"Of the tribe of Ephraim, Osee the son of Nun.\"},{\"verse\":10,\"text\":\"Of the tribe of Benjamin, Phalti the son of Raphu.\"},{\"verse\":11,\"text\":\"Of the tribe of Zabulon, Geddiel the son of Sodi.\"},{\"verse\":12,\"text\":\"Of the tribe of Joseph, of the sceptre of Manasses, Gaddi the son of Susi.\"},{\"verse\":13,\"text\":\"Of the tribe of Dan, Ammiel the son of Gemalli.\"},{\"verse\":14,\"text\":\"Of the tribe of Aser, Sthur the son of Michael.\"},{\"verse\":15,\"text\":\"Of the tribe of Nephtali, Nahabi the son of Vapsi.\"},{\"verse\":16,\"text\":\"Of the tribe of Gad, Guel the son of Machi.\"},{\"verse\":17,\"text\":\"These are the names of the men, whom Moses sent to view the land: and he called Osee the son of Nun, Josue.\"},{\"verse\":18,\"text\":\"And Moses sent them to view the land of Chanaan, and said to them: Go you up by the south side. And when you shall come to the mountains,\"},{\"verse\":19,\"text\":\"View the land, of what sort it is, and the people that are the inhabitants thereof, whether they be strong or weak: few in number or many:\"},{\"verse\":20,\"text\":\"The land itself, whether it be good or bad: what manner of cities, walled or without walls:\"},{\"verse\":21,\"text\":\"The ground, fat or barren, woody or without trees. Be of good courage, and bring us of the fruits of the land. Now it was the time when the firstripe grapes are fit to be eaten.\"},{\"verse\":22,\"text\":\"And when they were gone up, they viewed the land from the desert of Sin, unto Rohob as you enter into Emath.\"},{\"verse\":23,\"text\":\"And they went up at the south side, and came to Hebron, where were Achiman and Sisai and Tholmai the sons of Enac. For Hebron was built seven years before Tanis the city of Egypt.\"},{\"verse\":24,\"text\":\"And going forward as far as the torrent of the cluster of grapes, they cut off a branch with its cluster of grapes, which two men carried upon a lever. They took also of the pomegranates and of the figs of that place:\"},{\"verse\":25,\"text\":\"Which was called Nehelescol, that is to say, the torrent of the cluster of grapes, because from thence the children of Israel had carried a cluster of grapes.\"},{\"verse\":26,\"text\":\"And they that went to spy out the land returned after forty days, having gone round all the country,\"},{\"verse\":27,\"text\":\"And came to Moses and Aaron and to all the assembly of the children of Israel to the desert of Pharan, which is in Cades. And speaking to them and to all the multitude, they shewed them the fruits of the land:\"},{\"verse\":28,\"text\":\"And they related and said: We came into the land to which thou sentest us, which in very deed floweth with milk and honey as may be known by these fruits:\"},{\"verse\":29,\"text\":\"But it hath very strong inhabitants, and the cities are great and walled. We saw there the race of Enac.\"},{\"verse\":30,\"text\":\"Amalec dwelleth in the south, the Hethite and the Jebusite and the Amorrhite in the mountains: but the Chanaanite abideth by the sea and near the streams of the Jordan.\"},{\"verse\":31,\"text\":\"In the mean time Caleb, to still the murmuring of the people that rose against Moses, said: Let us go up and possess the land, for we shall be able to conquer it.\"},{\"verse\":32,\"text\":\"But the others, that had been with him, said: No, we are not able to go up to this people, because they are stronger than we.\"},{\"verse\":33,\"text\":\"And they spoke ill of the land, which they had viewed, before the children of Israel, saying: The land which we have viewed, devoureth its inhabitants: the people, that we beheld are of a tall stature.\"},{\"verse\":34,\"text\":\"There we saw certain monsters of the sons of Enac, of the giant kind: in comparison of whom, we seemed like locusts.\"}],\"vul\":[{\"verse\":1,\"text\":\"Profectusque est populus de Haseroth, fixis tentoriis in deserto Pharan.\"},{\"verse\":2,\"text\":\"Ibique locutus est Dominus ad Moysen, dicens :\"},{\"verse\":3,\"text\":\"Mitte viros, qui considerent terram Chanaan, quam daturus sum filiis Israël, singulos de singulis tribubus, ex principibus.\"},{\"verse\":4,\"text\":\"Fecit Moyses quod Dominus imperaverat, de deserto Pharan mittens principes viros, quorum ista sunt nomina.\"},{\"verse\":5,\"text\":\"De tribu Ruben, Sammua filium Zechur.\"},{\"verse\":6,\"text\":\"De tribu Simeon, Saphat filium Huri.\"},{\"verse\":7,\"text\":\"De tribu Juda, Caleb filium Jephone.\"},{\"verse\":8,\"text\":\"De tribu Issachar, Igal filium Joseph.\"},{\"verse\":9,\"text\":\"De tribu Ephraim, Osee filium Nun.\"},{\"verse\":10,\"text\":\"De tribu Benjamin, Phalti filium Raphu.\"},{\"verse\":11,\"text\":\"De tribu Zabulon, Geddiel filium Sodi.\"},{\"verse\":12,\"text\":\"De tribu Joseph, sceptri Manasse, Gaddi filium Susi.\"},{\"verse\":13,\"text\":\"De tribu Dan, Ammiel filium Gemalli.\"},{\"verse\":14,\"text\":\"De tribu Aser, Sthur filium Michaël.\"},{\"verse\":15,\"text\":\"De tribu Nephthali, Nahabi filium Vapsi.\"},{\"verse\":16,\"text\":\"De tribu Gad, Guel filium Machi.\"},{\"verse\":17,\"text\":\"Hæc sunt nomina virorum, quos misit Moyses ad considerandam terram : vocavitque Osee filium Nun, Josue.\"},{\"verse\":18,\"text\":\"Misit ergo eos Moyses ad considerandam terram Chanaan, et dixit ad eos : Ascendite per meridianam plagam. Cumque veneritis ad montes,\"},{\"verse\":19,\"text\":\"considerate terram, qualis sit : et populum qui habitator est ejus, utrum fortis sit an infirmus : si pauci numero an plures :\"},{\"verse\":20,\"text\":\"ipsa terra, bona an mala : urbes quales, muratæ an absque muris :\"},{\"verse\":21,\"text\":\"humus, pinguis an sterilis, nemorosa an absque arboribus. Confortamini, et afferte nobis de fructibus terræ. Erat autem tempus quando jam præcoquæ uvæ vesci possunt.\"},{\"verse\":22,\"text\":\"Cumque ascendissent, exploraverunt terram a deserto Sin, usque Rohob intrantibus Emath.\"},{\"verse\":23,\"text\":\"Ascenderuntque ad meridiem, et venerunt in Hebron, ubi erant Achiman et Sisai et Tholmai filii Enac : nam Hebron septem annis ante Tanim urbem Ægypti condita est.\"},{\"verse\":24,\"text\":\"Pergentesque usque ad Torrentem botri, absciderunt palmitem cum uva sua, quem portaverunt in vecte duo viri. De malis quoque granatis et de ficis loci illius tulerunt :\"},{\"verse\":25,\"text\":\"qui appellatus est Nehelescol, id est Torrens botri, eo quod botrum portassent inde filii Israël.\"},{\"verse\":26,\"text\":\"Reversique exploratores terræ post quadraginta dies, omni regione circuita,\"},{\"verse\":27,\"text\":\"venerunt ad Moysen et Aaron et ad omnem cœtum filiorum Israël in desertum Pharan, quod est in Cades. Locutique eis et omni multitudini ostenderunt fructus terræ :\"},{\"verse\":28,\"text\":\"et narraverunt, dicentes : Venimus in terram, ad quam misisti nos, quæ revera fluit lacte et melle, ut ex his fructibus cognosci potest :\"},{\"verse\":29,\"text\":\"sed cultores fortissimos habet, et urbes grandes atque muratas. Stirpem Enac vidimus ibi.\"},{\"verse\":30,\"text\":\"Amalec habitat in meridie, Hethæus et Jebusæus et Amorrhæus in montanis : Chananæus vero moratur juxta mare et circa fluenta Jordanis.\"},{\"verse\":31,\"text\":\"Inter hæc Caleb compescens murmur populi, qui oriebatur contra Moysen, ait : Ascendamus, et possideamus terram, quoniam poterimus obtinere eam.\"},{\"verse\":32,\"text\":\"Alii vero, qui fuerant cum eo, dicebant : Nequaquam ad hunc populum valemus ascendere, quia fortior nobis est.\"},{\"verse\":33,\"text\":\"Detraxeruntque terræ, quam inspexerant, apud filios Israël, dicentes : Terra, quam lustravimus, devorat habitatores suos : populus, quem aspeximus, proceræ staturæ est.\"},{\"verse\":34,\"text\":\"Ibi vidimus monstra quædam filiorum Enac de genere giganteo : quibus comparati, quasi locustæ videbamur.\"}],\"summary\":\"The twelve spies are sent to view the land. The relation they make of it.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":12,\"label\":\"Numbers 12\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":14,\"label\":\"Numbers 14\"}}]]\n"])</script></body></html>
