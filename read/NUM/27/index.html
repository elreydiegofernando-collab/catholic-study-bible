-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">27</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The law of inheritance. Josue is appointed to succeed Moses.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then came the daughters of Salphaad, the son of Hepher, the son of Galaad, the son of Machir, the son of Manasses, who was the son of Joseph: and their names are Maala, and Noa, and Hegla, and Melcha, and Thersa.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they stood before Moses and Eleazar the priest, and all the princes of the people at the door of the tabernacle of the covenant, and said:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Our father died in the desert, and was not in the sedition, that was raised against the Lord under Core, but he died in his own sin: and he had no male children. Why is his name taken away out of his family, because he had no son? Give us a possession among the kinsmen of our father.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Moses referred their cause to the judgment of the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the Lord said to him:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The daughters of Salphaad demand a just thing: Give them a possession among their father’s kindred, and let them succeed him in his inheritance.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And to the children of Israel thou shalt speak these things:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>When a man dieth without a son, his inheritance shall pass to his daughter.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If he have no daughter, his brethren shall succeed him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And if he have no brethren, you shall give the inheritance to his father’s brethren.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But if he have no uncles by the father, the inheritance shall be given to them that are the next akin. And this shall be to the children of Israel sacred by a perpetual law, as the Lord hath commanded Moses.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The Lord also said to Moses: Go up into this mountain Abarim, and view from thence the land which I will give to the children of Israel.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when thou shalt have seen it, thou also shalt go to thy people, as thy brother Aaron is gone:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Because you offended me in the desert of Sin in the contradiction of the multitude, neither would you sanctify me before them at the waters. These are the waters of contradiction in Cades of the desert of Sin.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Moses answered him:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>May the Lord the God of the spirits of all flesh provide a man, that may be over this multitude:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And may go out and in before them, and may lead them out, or bring them in: lest the people of the Lord be as sheep without a shepherd.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the Lord said to him: take Josue the son of Nun, a man in whom is the Spirit, and put thy hand upon him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he shall stand before Eleazar the priest and all the multitude:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And thou shalt give him precepts in the sight of all, and part of thy glory, that all the congregation of the children of Israel may hear him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>If any thing be to be done, Eleazar the priest shall consult the Lord for him. He and all the children of Israel with him, and the rest of the multitude shall go out and go in at his word.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Moses did as the Lord had commanded. And, when he had taken Josue, he set him before Eleazar the priest, and all the assembly of the people,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And laying his hands on his head, he repeated all things that the Lord had commanded.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Accesserunt autem filiæ Salphaad, filii Hepher, filii Galaad, filii Machir, filii Manasse, qui fuit filius Joseph : quarum sunt nomina, Maala, et Noa, et Hegla, et Melcha, et Thersa.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Steteruntque coram Moyse et Eleazaro sacerdote et cunctis principibus populi ad ostium tabernaculi fœderis, atque dixerunt :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pater noster mortuus est in deserto, nec fuit in seditione, quæ concitata est contra Dominum sub Core, sed in peccato suo mortuus est : hic non habuit mares filios. Cur tollitur nomen illius de familia sua, quia non habuit filium ? date nobis possessionem inter cognatos patris nostri.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Retulitque Moyses causam earum ad judicium Domini.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui dixit ad eum :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Justam rem postulant filiæ Salphaad : da eis possessionem inter cognatos patris sui, et ei in hæreditatem succedant.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ad filios autem Israël loqueris hæc :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Homo cum mortuus fuerit absque filio, ad filiam ejus transibit hæreditas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si filiam non habuerit, habebit successores fratres suos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quod si et fratres non fuerint, dabitis hæreditatem fratribus patris ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sin autem nec patruos habuerit, dabitur hæreditas his qui ei proximi sunt. Eritque hoc filiis Israël sanctum lege perpetua, sicut præcepit Dominus Moysi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixit quoque Dominus ad Moysen : Ascende in montem istum Abarim, et contemplare inde terram, quam daturus sum filiis Israël.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cumque videris eam, ibis et tu ad populum tuum, sicut ivit frater tuus Aaron :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quia offendistis me in deserto Sin in contradictione multitudinis, nec sanctificare me voluistis coram ea super aquas. Hæ sunt aquæ contradictionis in Cades deserti Sin.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cui respondit Moyses :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Provideat Dominus Deus spirituum omnis carnis hominem, qui sit super multitudinem hanc :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et possit exire et intrare ante eos, et educere eos vel introducere : ne sit populus Domini sicut oves absque pastore.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dixitque Dominus ad eum : Tolle Josue filium Nun, virum in quo est spiritus, et pone manum tuam super eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui stabit coram Eleazaro sacerdote et omni multitudine :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et dabis ei præcepta cunctis videntibus, et partem gloriæ tuæ, ut audiat eum omnis synagoga filiorum Israël.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Pro hoc, si quid agendum erit, Eleazar sacerdos consulet Dominum. Ad verbum ejus egredietur et ingredietur ipse, et omnes filii Israël cum eo, et cetera multitudo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fecit Moyses ut præceperat Dominus : cumque tulisset Josue, statuit eum coram Eleazaro sacerdote et omni frequentia populi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et impositis capiti ejus manibus, cuncta replicavit quæ mandaverat Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-  of Galaad, the son of Machir, the son of Manasses, who was the son of Joseph: and their names are Maala, and Noa, and Hegla, and Melcha, and Thersa.\"},{\"verse\":2,\"text\":\"And they stood before Moses and Eleazar the priest, and all the princes of the people at the door of the tabernacle of the covenant, and said:\"},{\"verse\":3,\"text\":\"Our father died in the desert, and was not in the sedition, that was raised against the Lord under Core, but he died in his own sin: and he had no male children. Why is his name taken away out of his family, because he had no son? Give us a possession among the kinsmen of our father.\"},{\"verse\":4,\"text\":\"And Moses referred their cause to the judgment of the Lord.\"},{\"verse\":5,\"text\":\"And the Lord said to him:\"},{\"verse\":6,\"text\":\"The daughters of Salphaad demand a just thing: Give them a possession among their father’s kindred, and let them succeed him in his inheritance.\"},{\"verse\":7,\"text\":\"And to the children of Israel thou shalt speak these things:\"},{\"verse\":8,\"text\":\"When a man dieth without a son, his inheritance shall pass to his daughter.\"},{\"verse\":9,\"text\":\"If he have no daughter, his brethren shall succeed him.\"},{\"verse\":10,\"text\":\"And if he have no brethren, you shall give the inheritance to his father’s brethren.\"},{\"verse\":11,\"text\":\"But if he have no uncles by the father, the inheritance shall be given to them that are the next akin. And this shall be to the children of Israel sacred by a perpetual law, as the Lord hath commanded Moses.\"},{\"verse\":12,\"text\":\"The Lord also said to Moses: Go up into this mountain Abarim, and view from thence the land which I will give to the children of Israel.\"},{\"verse\":13,\"text\":\"And when thou shalt have seen it, thou also shalt go to thy people, as thy brother Aaron is gone:\"},{\"verse\":14,\"text\":\"Because you offended me in the desert of Sin in the contradiction of the multitude, neither would you sanctify me before them at the waters. These are the waters of contradiction in Cades of the desert of Sin.\"},{\"verse\":15,\"text\":\"And Moses answered him:\"},{\"verse\":16,\"text\":\"May the Lord the God of the spirits of all flesh provide a man, that may be over this multitude:\"},{\"verse\":17,\"text\":\"And may go out and in before them, and may lead them out, or bring them in: lest the people of the Lord be as sheep without a shepherd.\"},{\"verse\":18,\"text\":\"And the Lord said to him: take Josue the son of Nun, a man in whom is the Spirit, and put thy hand upon him.\"},{\"verse\":19,\"text\":\"And he shall stand before Eleazar the priest and all the multitude:\"},{\"verse\":20,\"text\":\"And thou shalt give him precepts in the sight of all, and part of thy glory, that all the congregation of the children of Israel may hear him.\"},{\"verse\":21,\"text\":\"If any thing be to be done, Eleazar the priest shall consult the Lord for him. He and all the children of Israel with him, and the rest of the multitude shall go out and go in at his word.\"},{\"verse\":22,\"text\":\"Moses did as the Lord had commanded. And, when he had taken Josue, he set him before Eleazar the priest, and all the assembly of the people,\"},{\"verse\":23,\"text\":\"And laying his hands on his head, he repeated all things that the Lord had commanded.\"}],\"vul\":[{\"verse\":1,\"text\":\"Accesserunt autem filiæ Salphaad, filii Hepher, filii Galaad, filii Machir, filii Manasse, qui fuit filius Joseph : quarum sunt nomina, Maala, et Noa, et Hegla, et Melcha, et Thersa.\"},{\"verse\":2,\"text\":\"Steteruntque coram Moyse et Eleazaro sacerdote et cunctis principibus populi ad ostium tabernaculi fœderis, atque dixerunt :\"},{\"verse\":3,\"text\":\"Pater noster mortuus est in deserto, nec fuit in seditione, quæ concitata est contra Dominum sub Core, sed in peccato suo mortuus est : hic non habuit mares filios. Cur tollitur nomen illius de familia sua, quia non habuit filium ? date nobis possessionem inter cognatos patris nostri.\"},{\"verse\":4,\"text\":\"Retulitque Moyses causam earum ad judicium Domini.\"},{\"verse\":5,\"text\":\"Qui dixit ad eum :\"},{\"verse\":6,\"text\":\"Justam rem postulant filiæ Salphaad : da eis possessionem inter cognatos patris sui, et ei in hæreditatem succedant.\"},{\"verse\":7,\"text\":\"Ad filios autem Israël loqueris hæc :\"},{\"verse\":8,\"text\":\"Homo cum mortuus fuerit absque filio, ad filiam ejus transibit hæreditas.\"},{\"verse\":9,\"text\":\"Si filiam non habuerit, habebit successores fratres suos.\"},{\"verse\":10,\"text\":\"Quod si et fratres non fuerint, dabitis hæreditatem fratribus patris ejus.\"},{\"verse\":11,\"text\":\"Sin autem nec patruos habuerit, dabitur hæreditas his qui ei proximi sunt. Eritque hoc filiis Israël sanctum lege perpetua, sicut præcepit Dominus Moysi.\"},{\"verse\":12,\"text\":\"Dixit quoque Dominus ad Moysen : Ascende in montem istum Abarim, et contemplare inde terram, quam daturus sum filiis Israël.\"},{\"verse\":13,\"text\":\"Cumque videris eam, ibis et tu ad populum tuum, sicut ivit frater tuus Aaron :\"},{\"verse\":14,\"text\":\"quia offendistis me in deserto Sin in contradictione multitudinis, nec sanctificare me voluistis coram ea super aquas. Hæ sunt aquæ contradictionis in Cades deserti Sin.\"},{\"verse\":15,\"text\":\"Cui respondit Moyses :\"},{\"verse\":16,\"text\":\"Provideat Dominus Deus spirituum omnis carnis hominem, qui sit super multitudinem hanc :\"},{\"verse\":17,\"text\":\"et possit exire et intrare ante eos, et educere eos vel introducere : ne sit populus Domini sicut oves absque pastore.\"},{\"verse\":18,\"text\":\"Dixitque Dominus ad eum : Tolle Josue filium Nun, virum in quo est spiritus, et pone manum tuam super eum.\"},{\"verse\":19,\"text\":\"Qui stabit coram Eleazaro sacerdote et omni multitudine :\"},{\"verse\":20,\"text\":\"et dabis ei præcepta cunctis videntibus, et partem gloriæ tuæ, ut audiat eum omnis synagoga filiorum Israël.\"},{\"verse\":21,\"text\":\"Pro hoc, si quid agendum erit, Eleazar sacerdos consulet Dominum. Ad verbum ejus egredietur et ingredietur ipse, et omnes filii Israël cum eo, et cetera multitudo.\"},{\"verse\":22,\"text\":\"Fecit Moyses ut præceperat Dominus : cumque tulisset Josue, statuit eum coram Eleazaro sacerdote et omni frequentia populi.\"},{\"verse\":23,\"text\":\"Et impositis capiti ejus manibus, cuncta replicavit quæ mandaverat Dominus.\"}],\"summary\":\"The law of inheritance. Josue is appointed to succeed Moses.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":26,\"label\":\"Numbers 26\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":28,\"label\":\"Numbers 28\"}}]]\n"])</script></body></html>
