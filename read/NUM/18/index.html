tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">18</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The charge of the priests and of the Levites, and their portion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord said to Aaron: Thou, and thy sons, and thy father’s house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the sins of your priesthood.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And take with thee thy brethren also of the tribe of Levi, and the sceptre of thy father, and let them be ready in hand, and minister to thee: but thou and thy sons shall minister in the tabernacle of the testimony.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the Levites shall watch to do thy commands, and about all the works of the tabernacle: only they shall not come nigh the vessels of the sanctuary nor the altar, lest both they die, and you also perish with them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But let them be with thee, and watch in the charge of the tabernacle, and in all the ceremonies thereof. A stranger shall not join himself with you.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Watch ye in the charge of the sanctuary, and in the ministry of the altar: lest indignation rise upon the children of Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I have given you your brethren the Levites from among the children of Israel, and have delivered them for a gift to the Lord, to serve in the ministries of the tabernacle.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But thou and thy sons look ye to the priesthood: and all things that pertain to the service of the altar, and that are within the veil, shall be executed by the priests. If any stranger shall approach, he shall be slain.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the Lord said to Aaron: Behold I have given thee the charge of my firstfruits. All things that are sanctified by the children of Israel, I have delivered to thee and to thy sons for the priestly office, by everlasting ordinances.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>These therefore shalt thou take of the things that are sanctified, and are offered to the Lord. Every offering, and sacrifice, and whatsoever is rendered to me for sin and for trespass, and becometh holy of holies, shall be for thee and thy sons.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou shalt eat it in the sanctuary: the males only shall eat thereof, because it is a consecrated thing to thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the firstfruits, which the children of Israel shall vow and offer, I have given to thee, and to thy sons, and to thy daughters, by a perpetual law. He that is clean in thy house, shall eat them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All the best of the oil, and of the wine, and of the corn, whatsoever firstfruits they offer to the Lord, I have given them to thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>All the firstripe of the fruits, that the ground bringeth forth, and which are brought to the Lord, shall be for thy use: he that is clean in thy house, shall eat them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Every thing that the children of Israel shall give by vow, shall be thine.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Whatsoever is firstborn of all flesh, which they offer to the Lord, whether it be of men, or of beasts, shall belong to thee: only for the firstborn of man thou shalt take a price, and every beast that is unclean thou shalt cause to be redeemed,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the redemption of it shall be after one month, for five sicles of silver, by the weight of the sanctuary. A sicle hath twenty obols.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But the firstling of a cow, and of a sheep and of a goat thou shalt not cause to be redeemed, because they are sanctified to the Lord. Their blood only thou shalt pour upon the altar, and their fat thou shalt burn for a most sweet odour to the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But the flesh shall fall to thy use, as the consecrated breast, and the right shoulder shall be thine.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>All the firstfruits of the sanctuary which the children of Israel offer to the Lord, I have given to thee and to thy sons and daughters, by a perpetual ordinance. It is a covenant of salt for ever before the Lord, to thee and to thy sons.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the Lord said to Aaron: You shall possess nothing in their land, neither shall you have a portion among them: I am thy portion and inheritance in the midst of the children of Israel.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I have given to the sons of Levi all the tithes of Israel for a possession, for the ministry wherewith they serve me in the tabernacle of the covenant:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>That the children of Israel may not approach any more to the tabernacle, nor commit deadly sin,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But only the sons of Levi may serve me in the tabernacle, and bear the sins of the people. It shall be an everlasting ordinance in your generations. They shall not possess any other thing,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But be content with the oblation or tithes, which I have separated for their uses and necessities.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Command the Levites, and declare unto them: When you shall receive of the children of Israel the tithes, which I have given you, offer the firstfruits of them to the Lord, that is to say, the tenth part of the tenth:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>That it may be reckoned to you as an oblation of firstfruits, as well of the barnfloors as of the winepresses:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And of all the things of which you receive tithes, offer the firstfruits to the Lord, and give them to Aaron the priest.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>All the things that you shall offer of the tithes, and shall separate for the gifts of the Lord, shall be the best and choicest things.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And thou shalt say to them: If you offer all the goodly and the better things of the tithes, it shall be reckoned to you as if you had given the firstfruits of the barnfloor and the winepress:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And you shall eat them in all your places, both you and your families: because it is your reward for the ministry, wherewith you serve in the tabernacle of the testimony.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And you shall not sin in this point, by reserving the choicest and fat things to yourselves, lest you profane the oblations of the children of Israel, and die.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixitque Dominus ad Aaron : Tu, et filii tui, et domus patris tui tecum, portabitis iniquitatem sanctuarii : et tu et filii tui simul sustinebitis peccata sacerdotii vestri.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sed et fratres tuos de tribu Levi, et sceptrum patris tui sume tecum, præstoque sint, et ministrent tibi : tu autem et filii tui ministrabitis in tabernaculo testimonii.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Excubabuntque Levitæ ad præcepta tua, et ad cuncta opera tabernaculi : ita dumtaxat ut ad vasa sanctuarii et ad altare non accedant, ne et illi moriantur, et vos pereatis simul.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sint autem tecum, et excubent in custodiis tabernaculi, et in omnibus cæremoniis ejus. Alienigena non miscebitur vobis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Excubate in custodia sanctuarii, et in ministerio altaris : ne oriatur indignatio super filios Israël.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ego dedi vobis fratres vestros Levitas de medio filiorum Israël, et tradidi donum Domino, ut serviant in ministeriis tabernaculi ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tu autem et filii tui custodite sacerdotium vestrum : et omnia quæ ad cultum altaris pertinent, et intra velum sunt, per sacerdotes administrabuntur : si quis externus accesserit, occidetur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Locutusque est Dominus ad Aaron : Ecce dedi tibi custodiam primitiarum mearum. Omnia quæ sanctificantur a filiis Israël, tradidi tibi et filiis tuis pro officio sacerdotali legitima sempiterna.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæc ergo accipies de his, quæ sanctificantur et oblata sunt Domino. Omnis oblatio, et sacrificium, et quidquid pro peccato atque delicto redditur mihi, et cedit in Sancta sanctorum, tuum erit, et filiorum tuorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In sanctuario comedes illud : mares tantum edent ex eo, quia consecratum est tibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Primitias autem, quas voverint et obtulerint filii Israël, tibi dedi, et filiis tuis, ac filiabus tuis, jure perpetuo : qui mundus est in domo tua, vescetur eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Omnem medullam olei, et vini, ac frumenti, quidquid offerunt primitiarum Domino, tibi dedi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Universa frugum initia, quas gignit humus, et Domino deportantur, cedent in usus tuos : qui mundus est in domo tua, vescetur eis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Omne quod ex voto reddiderint filii Israël, tuum erit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quidquid primum erumpit e vulva cunctæ carnis, quam offerunt Domino, sive ex hominibus, sive de pecoribus fuerit, tui juris erit : ita dumtaxat ut pro hominis primogenito pretium accipias, et omne animal quod immundum est redimi facias,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>cujus redemptio erit post unum mensem, siclis argenti quinque, pondere sanctuarii. Siclus viginti obolos habet.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Primogenitum autem bovis, et ovis, et capræ, non facies redimi, quia sanctificata sunt Domino. Sanguinem tantum eorum fundes super altare, et adipes adolebis in suavissimum odorem Domino.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Carnes vero in usum tuum cedent, sicut pectusculum consecratum, et armus dexter : tua erunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnes primitias sanctuarii, quas offerunt filii Israël Domino, tibi dedi, et filiis, ac filiabus tuis, jure perpetuo. Pactum salis est sempiternum coram Domino, tibi ac filiis tuis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dixitque Dominus ad Aaron : In terra eorum nihil possidebitis, nec habebitis partem inter eos : ego pars et hæreditas tua in medio filiorum Israël.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Filiis autem Levi dedi omnes decimas Israëlis in possessionem, pro ministerio, quo serviunt mihi in tabernaculo fœderis :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>ut non accedant ultra filii Israël ad tabernaculum, nec committant peccatum mortiferum,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>solis filiis Levi mihi in tabernaculo servientibus, et portantibus peccata populi. Legitimum sempiternum erit in generationibus vestris. Nihil aliud possidebunt,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>decimarum oblatione contenti, quas in usus eorum et necessaria separavi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Præcipe Levitis, atque denuntia : Cum acceperitis a filiis Israël decimas, quas dedi vobis, primitias earum offerte Domino, id est, decimam partem decimæ,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>ut reputetur vobis in oblationem primitivorum, tam de areis quam de torcularibus :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et universis quorum accipitis primitias, offerte Domino, et date Aaron sacerdoti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Omnia quæ offeretis ex decimis, et in donaria Domini separabitis, optima et electa erunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Dicesque ad eos : Si præclara et meliora quæque obtuleritis ex decimis, reputabitur vobis quasi de area, et torculari dederitis primitias :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et comedetis eas in omnibus locis vestris, tam vos quam familiæ vestræ : quia pretium est pro ministerio, quo servitis in tabernaculo testimonii.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et non peccabitis super hoc, egregia vobis et pinguia reservantes, ne polluatis oblationes filiorum Israël, et moriamini.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/17/"><svg viewBox="0 0 24 24" fill="none" stroke="curre  Lord said to Aaron: Thou, and thy sons, and thy father’s house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the sins of your priesthood.\"},{\"verse\":2,\"text\":\"And take with thee thy brethren also of the tribe of Levi, and the sceptre of thy father, and let them be ready in hand, and minister to thee: but thou and thy sons shall minister in the tabernacle of the testimony.\"},{\"verse\":3,\"text\":\"And the Levites shall watch to do thy commands, and about all the works of the tabernacle: only they shall not come nigh the vessels of the sanctuary nor the altar, lest both they die, and you also perish with them.\"},{\"verse\":4,\"text\":\"But let them be with thee, and watch in the charge of the tabernacle, and in all the ceremonies thereof. A stranger shall not join himself with you.\"},{\"verse\":5,\"text\":\"Watch ye in the charge of the sanctuary, and in the ministry of the altar: lest indignation rise upon the children of Israel.\"},{\"verse\":6,\"text\":\"I have given you your brethren the Levites from among the children of Israel, and have delivered them for a gift to the Lord, to serve in the ministries of the tabernacle.\"},{\"verse\":7,\"text\":\"But thou and thy sons look ye to the priesthood: and all things that pertain to the service of the altar, and that are within the veil, shall be executed by the priests. If any stranger shall approach, he shall be slain.\"},{\"verse\":8,\"text\":\"And the Lord said to Aaron: Behold I have given thee the charge of my firstfruits. All things that are sanctified by the children of Israel, I have delivered to thee and to thy sons for the priestly office, by everlasting ordinances.\"},{\"verse\":9,\"text\":\"These therefore shalt thou take of the things that are sanctified, and are offered to the Lord. Every offering, and sacrifice, and whatsoever is rendered to me for sin and for trespass, and becometh holy of holies, shall be for thee and thy sons.\"},{\"verse\":10,\"text\":\"Thou shalt eat it in the sanctuary: the males only shall eat thereof, because it is a consecrated thing to thee.\"},{\"verse\":11,\"text\":\"But the firstfruits, which the children of Israel shall vow and offer, I have given to thee, and to thy sons, and to thy daughters, by a perpetual law. He that is clean in thy house, shall eat them.\"},{\"verse\":12,\"text\":\"All the best of the oil, and of the wine, and of the corn, whatsoever firstfruits they offer to the Lord, I have given them to thee.\"},{\"verse\":13,\"text\":\"All the firstripe of the fruits, that the ground bringeth forth, and which are brought to the Lord, shall be for thy use: he that is clean in thy house, shall eat them.\"},{\"verse\":14,\"text\":\"Every thing that the children of Israel shall give by vow, shall be thine.\"},{\"verse\":15,\"text\":\"Whatsoever is firstborn of all flesh, which they offer to the Lord, whether it be of men, or of beasts, shall belong to thee: only for the firstborn of man thou shalt take a price, and every beast that is unclean thou shalt cause to be redeemed,\"},{\"verse\":16,\"text\":\"And the redemption of it shall be after one month, for five sicles of silver, by the weight of the sanctuary. A sicle hath twenty obols.\"},{\"verse\":17,\"text\":\"But the firstling of a cow, and of a sheep and of a goat thou shalt not cause to be redeemed, because they are sanctified to the Lord. Their blood only thou shalt pour upon the altar, and their fat thou shalt burn for a most sweet odour to the Lord.\"},{\"verse\":18,\"text\":\"But the flesh shall fall to thy use, as the consecrated breast, and the right shoulder shall be thine.\"},{\"verse\":19,\"text\":\"All the firstfruits of the sanctuary which the children of Israel offer to the Lord, I have given to thee and to thy sons and daughters, by a perpetual ordinance. It is a covenant of salt for ever before the Lord, to thee and to thy sons.\"},{\"verse\":20,\"text\":\"And the Lord said to Aaron: You shall possess nothing in their land, neither shall you have a portion among them: I am thy portion and inheritance in the midst of the children of Israel.\"},{\"verse\":21,\"text\":\"And I have given to the sons of Levi all the tithes of Israel for a possession, for the ministry wherewith they serve me in the tabernacle of the covenant:\"},{\"verse\":22,\"text\":\"That the children of Israel may not approach any more to the tabernacle, nor commit deadly sin,\"},{\"verse\":23,\"text\":\"But only the sons of Levi may serve me in the tabernacle, and bear the sins of the people. It shall be an everlasting ordinance in your generations. They shall not possess any other thing,\"},{\"verse\":24,\"text\":\"But be content with the oblation or tithes, which I have separated for their uses and necessities.\"},{\"verse\":25,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":26,\"text\":\"Command the Levites, and declare unto them: When you shall receive of the children of Israel the tithes, which I have given you, offer the firstfruits of them to the Lord, that is to say, the tenth part of the tenth:\"},{\"verse\":27,\"text\":\"That it may be reckoned to you as an oblation of firstfruits, as well of the barnfloors as of the winepresses:\"},{\"verse\":28,\"text\":\"And of all the things of which you receive tithes, offer the firstfruits to the Lord, and give them to Aaron the priest.\"},{\"verse\":29,\"text\":\"All the things that you shall offer of the tithes, and shall separate for the gifts of the Lord, shall be the best and choicest things.\"},{\"verse\":30,\"text\":\"And thou shalt say to them: If you offer all the goodly and the better things of the tithes, it shall be reckoned to you as if you had given the firstfruits of the barnfloor and the winepress:\"},{\"verse\":31,\"text\":\"And you shall eat them in all your places, both you and your families: because it is your reward for the ministry, wherewith you serve in the tabernacle of the testimony.\"},{\"verse\":32,\"text\":\"And you shall not sin in this point, by reserving the choicest and fat things to yourselves, lest you profane the oblations of the children of Israel, and die.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixitque Dominus ad Aaron : Tu, et filii tui, et domus patris tui tecum, portabitis iniquitatem sanctuarii : et tu et filii tui simul sustinebitis peccata sacerdotii vestri.\"},{\"verse\":2,\"text\":\"Sed et fratres tuos de tribu Levi, et sceptrum patris tui sume tecum, præstoque sint, et ministrent tibi : tu autem et filii tui ministrabitis in tabernaculo testimonii.\"},{\"verse\":3,\"text\":\"Excubabuntque Levitæ ad præcepta tua, et ad cuncta opera tabernaculi : ita dumtaxat ut ad vasa sanctuarii et ad altare non accedant, ne et illi moriantur, et vos pereatis simul.\"},{\"verse\":4,\"text\":\"Sint autem tecum, et excubent in custodiis tabernaculi, et in omnibus cæremoniis ejus. Alienigena non miscebitur vobis.\"},{\"verse\":5,\"text\":\"Excubate in custodia sanctuarii, et in ministerio altaris : ne oriatur indignatio super filios Israël.\"},{\"verse\":6,\"text\":\"Ego dedi vobis fratres vestros Levitas de medio filiorum Israël, et tradidi donum Domino, ut serviant in ministeriis tabernaculi ejus.\"},{\"verse\":7,\"text\":\"Tu autem et filii tui custodite sacerdotium vestrum : et omnia quæ ad cultum altaris pertinent, et intra velum sunt, per sacerdotes administrabuntur : si quis externus accesserit, occidetur.\"},{\"verse\":8,\"text\":\"Locutusque est Dominus ad Aaron : Ecce dedi tibi custodiam primitiarum mearum. Omnia quæ sanctificantur a filiis Israël, tradidi tibi et filiis tuis pro officio sacerdotali legitima sempiterna.\"},{\"verse\":9,\"text\":\"Hæc ergo accipies de his, quæ sanctificantur et oblata sunt Domino. Omnis oblatio, et sacrificium, et quidquid pro peccato atque delicto redditur mihi, et cedit in Sancta sanctorum, tuum erit, et filiorum tuorum.\"},{\"verse\":10,\"text\":\"In sanctuario comedes illud : mares tantum edent ex eo, quia consecratum est tibi.\"},{\"verse\":11,\"text\":\"Primitias autem, quas voverint et obtulerint filii Israël, tibi dedi, et filiis tuis, ac filiabus tuis, jure perpetuo : qui mundus est in domo tua, vescetur eis.\"},{\"verse\":12,\"text\":\"Omnem medullam olei, et vini, ac frumenti, quidquid offerunt primitiarum Domino, tibi dedi.\"},{\"verse\":13,\"text\":\"Universa frugum initia, quas gignit humus, et Domino deportantur, cedent in usus tuos : qui mundus est in domo tua, vescetur eis.\"},{\"verse\":14,\"text\":\"Omne quod ex voto reddiderint filii Israël, tuum erit.\"},{\"verse\":15,\"text\":\"Quidquid primum erumpit e vulva cunctæ carnis, quam offerunt Domino, sive ex hominibus, sive de pecoribus fuerit, tui juris erit : ita dumtaxat ut pro hominis primogenito pretium accipias, et omne animal quod immundum est redimi facias,\"},{\"verse\":16,\"text\":\"cujus redemptio erit post unum mensem, siclis argenti quinque, pondere sanctuarii. Siclus viginti obolos habet.\"},{\"verse\":17,\"text\":\"Primogenitum autem bovis, et ovis, et capræ, non facies redimi, quia sanctificata sunt Domino. Sanguinem tantum eorum fundes super altare, et adipes adolebis in suavissimum odorem Domino.\"},{\"verse\":18,\"text\":\"Carnes vero in usum tuum cedent, sicut pectusculum consecratum, et armus dexter : tua erunt.\"},{\"verse\":19,\"text\":\"Omnes primitias sanctuarii, quas offerunt filii Israël Domino, tibi dedi, et filiis, ac filiabus tuis, jure perpetuo. Pactum salis est sempiternum coram Domino, tibi ac filiis tuis.\"},{\"verse\":20,\"text\":\"Dixitque Dominus ad Aaron : In terra eorum nihil possidebitis, nec habebitis partem inter eos : ego pars et hæreditas tua in medio filiorum Israël.\"},{\"verse\":21,\"text\":\"Filiis autem Levi dedi omnes decimas Israëlis in possessionem, pro ministerio, quo serviunt mihi in tabernaculo fœderis :\"},{\"verse\":22,\"text\":\"ut non accedant ultra filii Israël ad tabernaculum, nec committant peccatum mortiferum,\"},{\"verse\":23,\"text\":\"solis filiis Levi mihi in tabernaculo servientibus, et portantibus peccata populi. Legitimum sempiternum erit in generationibus vestris. Nihil aliud possidebunt,\"},{\"verse\":24,\"text\":\"decimarum oblatione contenti, quas in usus eorum et necessaria separavi.\"},{\"verse\":25,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":26,\"text\":\"Præcipe Levitis, atque denuntia : Cum acceperitis a filiis Israël decimas, quas dedi vobis, primitias earum offerte Domino, id est, decimam partem decimæ,\"},{\"verse\":27,\"text\":\"ut reputetur vobis in oblationem primitivorum, tam de areis quam de torcularibus :\"},{\"verse\":28,\"text\":\"et universis quorum accipitis primitias, offerte Domino, et date Aaron sacerdoti.\"},{\"verse\":29,\"text\":\"Omnia quæ offeretis ex decimis, et in donaria Domini separabitis, optima et electa erunt.\"},{\"verse\":30,\"text\":\"Dicesque ad eos : Si præclara et meliora quæque obtuleritis ex decimis, reputabitur vobis quasi de area, et torculari dederitis primitias :\"},{\"verse\":31,\"text\":\"et comedetis eas in omnibus locis vestris, tam vos quam familiæ vestræ : quia pretium est pro ministerio, quo servitis in tabernaculo testimonii.\"},{\"verse\":32,\"text\":\"Et non peccabitis super hoc, egregia vobis et pinguia reservantes, ne polluatis oblationes filiorum Israël, et moriamini.\"}],\"summary\":\"The charge of the priests and of the Levites, and their portion.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":17,\"label\":\"Numbers 17\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":19,\"label\":\"Numbers 19\"}}]]\n"])</script></body></html>
