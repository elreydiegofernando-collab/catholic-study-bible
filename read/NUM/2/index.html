houses of their kindreds, round about the tabernacle of the covenant.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>On the east Juda shall pitch his tents by the bands of his army: and the prince of his sons; shall be Nahasson the son of Aminadab.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the whole sum of the fighting men of his stock, were seventy-four thousand six hundred.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Next unto him they of the tribe of Issachar encamped, whose prince was Nathanael, the son of Suar.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the whole number of his fighting men were fifty-four thousand four hundred.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In the tribe of Zabulon the prince was Eliab the son of Helon.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And all the army of fighting men of his stock, were fifty-seven thousand four hundred.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>All that were numbered in the camp of Juda, were a hundred and eighty-six thousand four hundred: and they by their troops shall march first.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In the camp of the sons of Ruben, on the south side, the prince shall be Elisur the son of Sedeur:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the whole army of his fighting men, that were numbered, were forty-six thousand five hundred.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Beside him camped they of the tribe of Simeon: whose prince was Salamiel the son of Surisaddai.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the whole army of his fighting men, that were numbered, were fifty-nine thousand three hundred.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In the tribe of Gad the prince was Eliasaph the son of Duel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the whole army of his fighting men that were numbered, were forty-five thousand six hundred and fifty.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>All that were reckoned up in the camp of Ruben, were a hundred and fifty-one thousand four hundred and fifty, by their troops: they shall march in the second place.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the tabernacle of the testimony shall be carried by the officers of the Levites and their troops. As it shall be set up, so shall it be taken down. Every one shall march according to their places, and ranks.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>On the west side shall be the camp of the sons of Ephraim, whose prince was Elisama the son of Ammiud.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The whole army of his fighting men, that were numbered, were forty thousand five hundred.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And with them the tribe of the sons of Manasses, whose prince was Gamaliel the son of Phadassur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the whole army of his fighting men, that were numbered, were thirty-two thousand two hundred.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In the tribe of the sons of Benjamin the prince was Abidan the son of Gedeon.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the whole army of fighting men, that were reckoned up, were thirty-five thousand four hundred.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>All that were numbered in the camp of Ephraim, were a hundred and eight-thousand one hundred by their troops: they shall march in the third place.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>On the north side camped the sons of Dan: whose prince was Ahiezar the son of Ammisaddai.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The whole army of his fighting men, that were numbered, were sixty-two thousand seven hundred.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Beside him they of the tribe of Aser pitched their tents: whose prince was Phegiel the son of Ochran.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The whole army of his fighting men, that were numbered, were forty-one thousand five hundred.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Of the tribe of the sons of Nephtali the prince was Ahira the son of Enan.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The whole army of his fighting men, were fifty-three thousand four hundred.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>All that were numbered in the camp of Dan, were a hundred and fifty-seven thousand six hundred: and they shall march last.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>This is the number of the children of Israel, of their army divided according to the houses of their kindreds and their troops, six hundred and three thousand five hundred and fifty.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the Levites were not numbered among the children of Israel: for so the Lord had commanded Moses.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And the children of Israel did according to all things that the Lord had commanded. They camped by their troops, and marched by the families and houses of their fathers.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Singuli per turmas, signa, atque vexilla, et domos cognationum suarum, castrametabuntur filii Israël, per gyrum tabernaculi fœderis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ad orientem Judas figet tentoria per turmas exercitus sui : eritque princeps filiorum ejus Nahasson filius Aminadab.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et omnis de stirpe ejus summa pugnantium, septuaginta quatuor millia sexcenti.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Juxta eum castrametati sunt de tribu Issachar, quorum princeps fuit Nathanaël filius Suar.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et omnis numerus pugnatorum ejus quinquaginta quatuor millia quadringenti.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In tribu Zabulon princeps fuit Eliab filius Helon.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnis de stirpe ejus exercitus pugnatorum, quinquaginta septem millia quadringenti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Universi qui in castris Judæ enumerati sunt, fuerunt centum octoginta sex millia quadringenti : et per turmas suas primi egredientur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In castris filiorum Ruben ad meridianam plagam erit princeps Elisur filius Sedeur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et cunctus exercitus pugnatorum ejus qui numerati sunt, quadraginta sex millia quingenti.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Juxta eum castrametati sunt de tribu Simeon : quorum princeps fuit Salamiel filius Surisaddai.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et cunctus exercitus pugnatorum ejus qui numerati sunt, quinquaginta novem millia trecenti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In tribu Gad princeps fuit Eliasaph filius Duel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta quinque millia sexcenti quinquaginta.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Omnes qui recensiti sunt in castris Ruben, centum quinquaginta millia et mille quadringenti quinquaginta per turmas suas : in secundo loco proficiscentur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Levabitur autem tabernaculum testimonii per officia Levitarum, et turmas eorum : quomodo erigetur, ita et deponetur. Singuli per loca et ordines suos proficiscentur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ad occidentalem plagam erunt castra filiorum Ephraim, quorum princeps fuit Elisama filius Ammiud.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta millia quingenti.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et cum eis tribus filiorum Manasse, quorum princeps fuit Gamaliel filius Phadassur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Cunctusque exercitus pugnatorum ejus, qui numerati sunt, triginta duo millia ducenti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In tribu filiorum Benjamin princeps fuit Abidan filius Gedeonis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et cunctus exercitus pugnatorum ejus, qui recensiti sunt, triginta quinque millia quadringenti.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omnes qui numerati sunt in castris Ephraim, centum octo millia centum per turmas suas : tertii proficiscentur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ad aquilonis partem castrametati sunt filii Dan : quorum princeps fuit Ahiezer filius Ammisaddai.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cunctus exercitus pugnatorum ejus, qui numerati sunt, sexaginta duo millia septingenti.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Juxta eum fixere tentoria de tribu Aser : quorum princeps fuit Phegiel filius Ochran.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta millia et mille quingenti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>De tribu filiorum Nephthali princeps fuit Ahira filius Enan.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Cunctus exercitus pugnatorum ejus, quinquaginta tria millia quadringenti.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Omnes qui numerati sunt in castris Dan, fuerunt centum quinquaginta septem millia sexcenti : et novissimi proficiscentur.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Hic numerus filiorum Israël, per domos cognationum suarum et turmas divisi exercitus, sexcenta tria millia quingenti quinquaginta.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Levitæ autem non sunt numerati inter filios Israël : sic enim præceperat Dominus Moysi.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Feceruntque filii Israël juxta omnia quæ mandaverat Dominus. Castrametati sunt per turmas suas, et profecti per familias ac domos patrum suorum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Nex he army of fighting men of his stock, were fifty-seven thousand four hundred.\"},{\"verse\":9,\"text\":\"All that were numbered in the camp of Juda, were a hundred and eighty-six thousand four hundred: and they by their troops shall march first.\"},{\"verse\":10,\"text\":\"In the camp of the sons of Ruben, on the south side, the prince shall be Elisur the son of Sedeur:\"},{\"verse\":11,\"text\":\"And the whole army of his fighting men, that were numbered, were forty-six thousand five hundred.\"},{\"verse\":12,\"text\":\"Beside him camped they of the tribe of Simeon: whose prince was Salamiel the son of Surisaddai.\"},{\"verse\":13,\"text\":\"And the whole army of his fighting men, that were numbered, were fifty-nine thousand three hundred.\"},{\"verse\":14,\"text\":\"In the tribe of Gad the prince was Eliasaph the son of Duel.\"},{\"verse\":15,\"text\":\"And the whole army of his fighting men that were numbered, were forty-five thousand six hundred and fifty.\"},{\"verse\":16,\"text\":\"All that were reckoned up in the camp of Ruben, were a hundred and fifty-one thousand four hundred and fifty, by their troops: they shall march in the second place.\"},{\"verse\":17,\"text\":\"And the tabernacle of the testimony shall be carried by the officers of the Levites and their troops. As it shall be set up, so shall it be taken down. Every one shall march according to their places, and ranks.\"},{\"verse\":18,\"text\":\"On the west side shall be the camp of the sons of Ephraim, whose prince was Elisama the son of Ammiud.\"},{\"verse\":19,\"text\":\"The whole army of his fighting men, that were numbered, were forty thousand five hundred.\"},{\"verse\":20,\"text\":\"And with them the tribe of the sons of Manasses, whose prince was Gamaliel the son of Phadassur.\"},{\"verse\":21,\"text\":\"And the whole army of his fighting men, that were numbered, were thirty-two thousand two hundred.\"},{\"verse\":22,\"text\":\"In the tribe of the sons of Benjamin the prince was Abidan the son of Gedeon.\"},{\"verse\":23,\"text\":\"And the whole army of fighting men, that were reckoned up, were thirty-five thousand four hundred.\"},{\"verse\":24,\"text\":\"All that were numbered in the camp of Ephraim, were a hundred and eight-thousand one hundred by their troops: they shall march in the third place.\"},{\"verse\":25,\"text\":\"On the north side camped the sons of Dan: whose prince was Ahiezar the son of Ammisaddai.\"},{\"verse\":26,\"text\":\"The whole army of his fighting men, that were numbered, were sixty-two thousand seven hundred.\"},{\"verse\":27,\"text\":\"Beside him they of the tribe of Aser pitched their tents: whose prince was Phegiel the son of Ochran.\"},{\"verse\":28,\"text\":\"The whole army of his fighting men, that were numbered, were forty-one thousand five hundred.\"},{\"verse\":29,\"text\":\"Of the tribe of the sons of Nephtali the prince was Ahira the son of Enan.\"},{\"verse\":30,\"text\":\"The whole army of his fighting men, were fifty-three thousand four hundred.\"},{\"verse\":31,\"text\":\"All that were numbered in the camp of Dan, were a hundred and fifty-seven thousand six hundred: and they shall march last.\"},{\"verse\":32,\"text\":\"This is the number of the children of Israel, of their army divided according to the houses of their kindreds and their troops, six hundred and three thousand five hundred and fifty.\"},{\"verse\":33,\"text\":\"And the Levites were not numbered among the children of Israel: for so the Lord had commanded Moses.\"},{\"verse\":34,\"text\":\"And the children of Israel did according to all things that the Lord had commanded. They camped by their troops, and marched by the families and houses of their fathers.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Singuli per turmas, signa, atque vexilla, et domos cognationum suarum, castrametabuntur filii Israël, per gyrum tabernaculi fœderis.\"},{\"verse\":3,\"text\":\"Ad orientem Judas figet tentoria per turmas exercitus sui : eritque princeps filiorum ejus Nahasson filius Aminadab.\"},{\"verse\":4,\"text\":\"Et omnis de stirpe ejus summa pugnantium, septuaginta quatuor millia sexcenti.\"},{\"verse\":5,\"text\":\"Juxta eum castrametati sunt de tribu Issachar, quorum princeps fuit Nathanaël filius Suar.\"},{\"verse\":6,\"text\":\"Et omnis numerus pugnatorum ejus quinquaginta quatuor millia quadringenti.\"},{\"verse\":7,\"text\":\"In tribu Zabulon princeps fuit Eliab filius Helon.\"},{\"verse\":8,\"text\":\"Omnis de stirpe ejus exercitus pugnatorum, quinquaginta septem millia quadringenti.\"},{\"verse\":9,\"text\":\"Universi qui in castris Judæ enumerati sunt, fuerunt centum octoginta sex millia quadringenti : et per turmas suas primi egredientur.\"},{\"verse\":10,\"text\":\"In castris filiorum Ruben ad meridianam plagam erit princeps Elisur filius Sedeur.\"},{\"verse\":11,\"text\":\"Et cunctus exercitus pugnatorum ejus qui numerati sunt, quadraginta sex millia quingenti.\"},{\"verse\":12,\"text\":\"Juxta eum castrametati sunt de tribu Simeon : quorum princeps fuit Salamiel filius Surisaddai.\"},{\"verse\":13,\"text\":\"Et cunctus exercitus pugnatorum ejus qui numerati sunt, quinquaginta novem millia trecenti.\"},{\"verse\":14,\"text\":\"In tribu Gad princeps fuit Eliasaph filius Duel.\"},{\"verse\":15,\"text\":\"Et cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta quinque millia sexcenti quinquaginta.\"},{\"verse\":16,\"text\":\"Omnes qui recensiti sunt in castris Ruben, centum quinquaginta millia et mille quadringenti quinquaginta per turmas suas : in secundo loco proficiscentur.\"},{\"verse\":17,\"text\":\"Levabitur autem tabernaculum testimonii per officia Levitarum, et turmas eorum : quomodo erigetur, ita et deponetur. Singuli per loca et ordines suos proficiscentur.\"},{\"verse\":18,\"text\":\"Ad occidentalem plagam erunt castra filiorum Ephraim, quorum princeps fuit Elisama filius Ammiud.\"},{\"verse\":19,\"text\":\"Cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta millia quingenti.\"},{\"verse\":20,\"text\":\"Et cum eis tribus filiorum Manasse, quorum princeps fuit Gamaliel filius Phadassur.\"},{\"verse\":21,\"text\":\"Cunctusque exercitus pugnatorum ejus, qui numerati sunt, triginta duo millia ducenti.\"},{\"verse\":22,\"text\":\"In tribu filiorum Benjamin princeps fuit Abidan filius Gedeonis.\"},{\"verse\":23,\"text\":\"Et cunctus exercitus pugnatorum ejus, qui recensiti sunt, triginta quinque millia quadringenti.\"},{\"verse\":24,\"text\":\"Omnes qui numerati sunt in castris Ephraim, centum octo millia centum per turmas suas : tertii proficiscentur.\"},{\"verse\":25,\"text\":\"Ad aquilonis partem castrametati sunt filii Dan : quorum princeps fuit Ahiezer filius Ammisaddai.\"},{\"verse\":26,\"text\":\"Cunctus exercitus pugnatorum ejus, qui numerati sunt, sexaginta duo millia septingenti.\"},{\"verse\":27,\"text\":\"Juxta eum fixere tentoria de tribu Aser : quorum princeps fuit Phegiel filius Ochran.\"},{\"verse\":28,\"text\":\"Cunctus exercitus pugnatorum ejus, qui numerati sunt, quadraginta millia et mille quingenti.\"},{\"verse\":29,\"text\":\"De tribu filiorum Nephthali princeps fuit Ahira filius Enan.\"},{\"verse\":30,\"text\":\"Cunctus exercitus pugnatorum ejus, quinquaginta tria millia quadringenti.\"},{\"verse\":31,\"text\":\"Omnes qui numerati sunt in castris Dan, fuerunt centum quinquaginta septem millia sexcenti : et novissimi proficiscentur.\"},{\"verse\":32,\"text\":\"Hic numerus filiorum Israël, per domos cognationum suarum et turmas divisi exercitus, sexcenta tria millia quingenti quinquaginta.\"},{\"verse\":33,\"text\":\"Levitæ autem non sunt numerati inter filios Israël : sic enim præceperat Dominus Moysi.\"},{\"verse\":34,\"text\":\"Feceruntque filii Israël juxta omnia quæ mandaverat Dominus. Castrametati sunt per turmas suas, et profecti per familias ac domos patrum suorum.\"}],\"summary\":\"The order of the tribes in their camp.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":1,\"label\":\"Numbers 1\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":3,\"label\":\"Numbers 3\"}}]]\n"])</script></body></html>
