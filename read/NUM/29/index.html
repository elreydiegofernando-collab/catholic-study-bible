-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">29</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Sacrifices for the festivals of the seventh month.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The first day also of the seventh month shall be venerable and holy unto you; you shall do no servile work therein, because it is the day of the sounding and of trumpets.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And you shall offer a holocaust for a most sweet odour to the Lord, one calf of the herd, one ram and seven lambs of a year old, without blemish.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And for their sacrifices, three tenths of flour tempered with oil to every calf, two tenths to a ram,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>One tenth to a lamb, which in all are seven lambs:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And a buck goat for sin, which is offered for the expiation of the people,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Besides the holocaust of the first day of the month with the sacrifices thereof, and the perpetual holocaust with the accustomed libations. With the same ceremonies you shall offer a burnt sacrifice for a most sweet odour to the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The tenth day also of this seventh month shall be holy and venerable unto you, and you shall afflict your souls; you shall do no servile work therein.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And you shall offer a holocaust to the Lord for a most sweet odour, one calf of the herd, one ram, and seven lambs of a year old, without blemish:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And for their sacrifices, three tenths of flour tempered with oil to every calf, two tenths to a ram,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The tenth of a tenth to every lamb, which are in all seven lambs:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And a buck goat for sin, besides the things that are wont to be offered for sin, for expiation, and for the perpetual holocaust with their sacrifice and libations.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And on the fifteenth day of the seventh month, which shall be unto you holy and venerable, you shall do no servile work, but shall celebrate a solemnity to the Lord seven days.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And you shall offer a holocaust for a most sweet odour to the Lord, thirteen calves of the herd, two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And for their libations three tenths of flour tempered with oil to every calf, being in all thirteen calves: and two tenths to each ram, being two rams,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the tenth of a tenth to every lamb, being in all fourteen lambs:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>On the second day you shall offer twelve calves of the herd, two rams and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the sacrifices and the libations for every one, for the calves and for the rams and for the lambs you shall duly celebrate:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And a buck goat for a sin offering besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The third day you shall offer eleven calves, two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall offer according to the rite:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice, and the libation thereof.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The fourth day you shall offer ten calves, two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate in right manner:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The fifth day you shall offer nine calves, two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The sixth day you shall offer eight calves, two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The seventh day you shall offer seven calves and two rams, and fourteen lambs of a year old, without blemish:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>On the eighth day, which is most solemn, you shall do no servile work:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But you shall offer a holocaust for a most sweet odour to the Lord, one calf, one ram, and seven lambs of a year old, without blemish:</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>These things shall you offer to the Lord in your solemnities: besides your vows and voluntary oblations for holocaust, for sacrifice, for libation, and for victims of peace offerings.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Mensis etiam septimi prima dies venerabilis et sancta erit vobis. Omne opus servile non facietis in ea, quia dies clangoris est et tubarum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Offeretisque holocaustum in odorem suavissimum Domino, vitulum de armento unum, arietem unum, et agnos anniculos immaculatos septem :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et in sacrificiis eorum, similæ oleo conspersæ tres decimas per singulos vitulos, duas decimas per arietem,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>unam decimam per agnum, qui simul sunt agni septem :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et hircum pro peccato, qui offertur in expiationem populi,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>præter holocaustum calendarum cum sacrificiis suis, et holocaustum sempiternum cum libationibus solitis : eisdem cæremoniis offeretis in odorem suavissimum incensum Domino.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Decima quoque dies mensis hujus septimi erit vobis sancta atque venerabilis, et affligetis animas vestras : omne opus servile non facietis in ea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Offeretisque holocaustum Domino in odorem suavissimum, vitulum de armento unum, arietem unum, agnos anniculos immaculatos septem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et in sacrificiis eorum similæ oleo conspersæ tres decimas per singulos vitulos, duas decimas per arietem,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>decimam decimæ per agnos singulos, qui sunt simul agni septem :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et hircum pro peccato, absque his quæ offerri pro delicto solent in expiationem, et holocaustum sempiternum, cum sacrificio et libaminibus eorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quintadecima vero die mensis septimi, quæ vobis sancta erit atque venerabilis, omne opus servile non facietis in ea, sed celebrabitis solemnitatem Domino septem diebus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Offeretisque holocaustum in odorem suavissimum Domino, vitulos de armento tredecim, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et in libamentis eorum, similæ oleo conspersæ tres decimas per vitulos singulos, qui sunt simul vituli tredecim, et duas decimas arieti uno, id est, simul arietibus duobus,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et decimam decimæ agnis singulis, qui sunt simul agni quatuordecim :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et hircum pro peccato, absque holocausto sempiterno, et sacrificio, et libamine ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In die altero offeretis vitulos de armento duodecim, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque et libamine ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Die tertio offeretis vitulos undecim, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque et libamine ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Die quarto offeretis vitulos decem, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Die quinto offeretis vitulos novem, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Die sexto offeretis vitulos octo, arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Die septimo offeretis vitulos septem, et arietes duos, agnos anniculos immaculatos quatuordecim :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Die octavo, qui est celeberrimus, omne opus servile non facietis,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>offerentes holocaustum in odorem suavissimum Domino, vitulum unum, arietem unum, agnos anniculos immaculatos septem :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Hæc offeretis Domino in solemnitatibus vestris : præter vota et oblationes spontaneas in holocausto, in sacrificio, in libamine, et in hostiis pacificis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/28/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 28</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/30/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 30</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->29<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Numbers 28" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl t\":\"The tenth of a tenth to every lamb, which are in all seven lambs:\"},{\"verse\":11,\"text\":\"And a buck goat for sin, besides the things that are wont to be offered for sin, for expiation, and for the perpetual holocaust with their sacrifice and libations.\"},{\"verse\":12,\"text\":\"And on the fifteenth day of the seventh month, which shall be unto you holy and venerable, you shall do no servile work, but shall celebrate a solemnity to the Lord seven days.\"},{\"verse\":13,\"text\":\"And you shall offer a holocaust for a most sweet odour to the Lord, thirteen calves of the herd, two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":14,\"text\":\"And for their libations three tenths of flour tempered with oil to every calf, being in all thirteen calves: and two tenths to each ram, being two rams,\"},{\"verse\":15,\"text\":\"And the tenth of a tenth to every lamb, being in all fourteen lambs:\"},{\"verse\":16,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":17,\"text\":\"On the second day you shall offer twelve calves of the herd, two rams and fourteen lambs of a year old, without blemish:\"},{\"verse\":18,\"text\":\"And the sacrifices and the libations for every one, for the calves and for the rams and for the lambs you shall duly celebrate:\"},{\"verse\":19,\"text\":\"And a buck goat for a sin offering besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":20,\"text\":\"The third day you shall offer eleven calves, two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":21,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall offer according to the rite:\"},{\"verse\":22,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice, and the libation thereof.\"},{\"verse\":23,\"text\":\"The fourth day you shall offer ten calves, two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":24,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate in right manner:\"},{\"verse\":25,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":26,\"text\":\"The fifth day you shall offer nine calves, two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":27,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:\"},{\"verse\":28,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":29,\"text\":\"The sixth day you shall offer eight calves, two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":30,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:\"},{\"verse\":31,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":32,\"text\":\"The seventh day you shall offer seven calves and two rams, and fourteen lambs of a year old, without blemish:\"},{\"verse\":33,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:\"},{\"verse\":34,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":35,\"text\":\"On the eighth day, which is most solemn, you shall do no servile work:\"},{\"verse\":36,\"text\":\"But you shall offer a holocaust for a most sweet odour to the Lord, one calf, one ram, and seven lambs of a year old, without blemish:\"},{\"verse\":37,\"text\":\"And the sacrifices and the libations of every one for the calves and for the rams and for the lambs you shall celebrate according to the rite:\"},{\"verse\":38,\"text\":\"And a buck goat for sin, besides the perpetual holocaust, and the sacrifice and the libation thereof.\"},{\"verse\":39,\"text\":\"These things shall you offer to the Lord in your solemnities: besides your vows and voluntary oblations for holocaust, for sacrifice, for libation, and for victims of peace offerings.\"}],\"vul\":[{\"verse\":1,\"text\":\"Mensis etiam septimi prima dies venerabilis et sancta erit vobis. Omne opus servile non facietis in ea, quia dies clangoris est et tubarum.\"},{\"verse\":2,\"text\":\"Offeretisque holocaustum in odorem suavissimum Domino, vitulum de armento unum, arietem unum, et agnos anniculos immaculatos septem :\"},{\"verse\":3,\"text\":\"et in sacrificiis eorum, similæ oleo conspersæ tres decimas per singulos vitulos, duas decimas per arietem,\"},{\"verse\":4,\"text\":\"unam decimam per agnum, qui simul sunt agni septem :\"},{\"verse\":5,\"text\":\"et hircum pro peccato, qui offertur in expiationem populi,\"},{\"verse\":6,\"text\":\"præter holocaustum calendarum cum sacrificiis suis, et holocaustum sempiternum cum libationibus solitis : eisdem cæremoniis offeretis in odorem suavissimum incensum Domino.\"},{\"verse\":7,\"text\":\"Decima quoque dies mensis hujus septimi erit vobis sancta atque venerabilis, et affligetis animas vestras : omne opus servile non facietis in ea.\"},{\"verse\":8,\"text\":\"Offeretisque holocaustum Domino in odorem suavissimum, vitulum de armento unum, arietem unum, agnos anniculos immaculatos septem :\"},{\"verse\":9,\"text\":\"et in sacrificiis eorum similæ oleo conspersæ tres decimas per singulos vitulos, duas decimas per arietem,\"},{\"verse\":10,\"text\":\"decimam decimæ per agnos singulos, qui sunt simul agni septem :\"},{\"verse\":11,\"text\":\"et hircum pro peccato, absque his quæ offerri pro delicto solent in expiationem, et holocaustum sempiternum, cum sacrificio et libaminibus eorum.\"},{\"verse\":12,\"text\":\"Quintadecima vero die mensis septimi, quæ vobis sancta erit atque venerabilis, omne opus servile non facietis in ea, sed celebrabitis solemnitatem Domino septem diebus.\"},{\"verse\":13,\"text\":\"Offeretisque holocaustum in odorem suavissimum Domino, vitulos de armento tredecim, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":14,\"text\":\"et in libamentis eorum, similæ oleo conspersæ tres decimas per vitulos singulos, qui sunt simul vituli tredecim, et duas decimas arieti uno, id est, simul arietibus duobus,\"},{\"verse\":15,\"text\":\"et decimam decimæ agnis singulis, qui sunt simul agni quatuordecim :\"},{\"verse\":16,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, et sacrificio, et libamine ejus.\"},{\"verse\":17,\"text\":\"In die altero offeretis vitulos de armento duodecim, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":18,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":19,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque et libamine ejus.\"},{\"verse\":20,\"text\":\"Die tertio offeretis vitulos undecim, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":21,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":22,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque et libamine ejus.\"},{\"verse\":23,\"text\":\"Die quarto offeretis vitulos decem, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":24,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":25,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.\"},{\"verse\":26,\"text\":\"Die quinto offeretis vitulos novem, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":27,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":28,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.\"},{\"verse\":29,\"text\":\"Die sexto offeretis vitulos octo, arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":30,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":31,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.\"},{\"verse\":32,\"text\":\"Die septimo offeretis vitulos septem, et arietes duos, agnos anniculos immaculatos quatuordecim :\"},{\"verse\":33,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":34,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.\"},{\"verse\":35,\"text\":\"Die octavo, qui est celeberrimus, omne opus servile non facietis,\"},{\"verse\":36,\"text\":\"offerentes holocaustum in odorem suavissimum Domino, vitulum unum, arietem unum, agnos anniculos immaculatos septem :\"},{\"verse\":37,\"text\":\"sacrificiaque et libamina singulorum, per vitulos, et arietes, et agnos rite celebrabitis :\"},{\"verse\":38,\"text\":\"et hircum pro peccato, absque holocausto sempiterno, sacrificioque ejus et libamine.\"},{\"verse\":39,\"text\":\"Hæc offeretis Domino in solemnitatibus vestris : præter vota et oblationes spontaneas in holocausto, in sacrificio, in libamine, et in hostiis pacificis.\"}],\"summary\":\"Sacrifices for the festivals of the seventh month.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":28,\"label\":\"Numbers 28\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":30,\"label\":\"Numbers 30\"}}]]\n"])</script></body></html>
