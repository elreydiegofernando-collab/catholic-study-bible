[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Numbers<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NUM/">About <!-- -->Numbers</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The law of the Nazarites: the form of blessing the people.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, and thou shalt say to them: When a man, or woman, shall make a vow to be sanctified, and will consecrate themselves to the Lord:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They shall abstain from wine, and from every thing that may make a man drunk. They shall not drink vinegar of wine, or of any other drink, nor any thing that is pressed out of the grape: nor shall they eat grapes either fresh or dried.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>All the days that they are consecrated to the Lord by vow: they shall eat nothing that cometh of the vineyard, from the raisin even to the kernel.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>All the time of his separation no razor shall pass over his head, until the day be fulfilled of his consecration to the Lord. He shall be holy, and shall let the hair of his head grow.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>All the time of his consecration he shall not go in to any dead,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Neither shall he make himself unclean, even for his father, or for his mother, or for his brother, or for his sister, when they die, because the consecration of his God is upon his head.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>All the days of his separation he shall be holy to the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But if any man die suddenly before him: the head of his consecration shall be defiled: and he shall shave it forthwith on the same day of his purification, and again on the seventh day.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And on the eighth day he shall bring two turtles, or two young pigeons to the priest in the entry of the covenant of the testimony.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the priest shall offer one for sin, and the other for a holocaust, and shall pray for him, for that he hath sinned by the dead: and he shall sanctify his head that day:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And shall consecrate to the Lord the days of his separation, offering a lamb of one year for sin: yet so that the former days be made void, because his sanctification was profaned.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>This is the law of consecration. When the days which he had determined by vow shall be expired, he shall bring him to the door of the tabernacle of the covenant,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And shall offer his oblation to the Lord: one he lamb of a year old without blemish for a holocaust, and one ewe lamb of a year old without blemish for a sin offering, and one ram without blemish for a victim of peace offering,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>A basket also of unleavened bread, tempered with oil, and wafers without leaven anointed with oil, and the libations of each:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the priest shall present them before the Lord, and shall offer both the sin offering and the holocaust.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But the ram he shall immolate for a sacrifice of peace offering to the Lord, offering at the same time the basket of unleavened bread, and the libations that are due by custom.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Then shall the hair of the consecration of the Nazarite, be shaved off before the door of the tabernacle of the covenant: and he shall take his hair, and lay it upon the fire, which is under the sacrifice of the peace offerings.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And shall take the boiled shoulder of the ram, and one unleavened cake out of the basket, and one unleavened wafer, and he shall deliver them into the hands of the Nazarite, after his head is shaven.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And receiving them again from him, he shall elevate them in the sight of the Lord: and they being sanctified shall belong to the priest, as the breast, which was commanded to be separated, and the shoulder. After this the Nazarite may drink wine.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>This is the law of the Nazarite, when he hath vowed his oblation to the Lord in the time of his consecration, besides those things which his hand shall find, according to that which he had vowed in his mind, so shall he do for the fulfilling of his sanctification.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Say to Aaron and his sons: Thus shall you bless the children of Israel, and you shall say to them:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The Lord bless thee, and keep thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The Lord shew his face to thee, and have mercy on thee.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The Lord turn his countenance to thee, and give thee peace.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And they shall invoke my name upon the children of Israel, and I will bless them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere ad filios Israël, et dices ad eos : Vir, sive mulier, cum fecerint votum ut sanctificentur, et se voluerint Domino consecrare :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>a vino, et omni quod inebriare potest, abstinebunt. Acetum ex vino, et ex qualibet alia potione, et quidquid de uva exprimitur, non bibent : uvas recentes siccasque non comedent</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>cunctis diebus quibus ex voto Domino consecrantur : quidquid ex vinea esse potest, ab uva passa usque ad acinum non comedent.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Omni tempore separationis suæ novacula non transibit per caput ejus usque ad completum diem, quo Domino consecratur. Sanctus erit, crescente cæsarie capitis ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Omni tempore consecrationis suæ, super mortuum non ingredietur,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>nec super patris quidem et matris et fratris sororisque funere contaminabitur, quia consecratio Dei sui super caput ejus est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnibus diebus separationis suæ sanctus erit Domino.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sin autem mortuus fuerit subito quispiam coram eo, polluetur caput consecrationis ejus : quod radet illico in eadem die purgationis suæ, et rursum septima.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In octava autem die offeret duos turtures, vel duos pullos columbæ sacerdoti in introitu fœderis testimonii.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Facietque sacerdos unum pro peccato, et alterum in holocaustum, et deprecabitur pro eo, quia peccavit super mortuo : sanctificabitque caput ejus in die illo :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et consecrabit Domino dies separationis illius, offerens agnum anniculum pro peccato : ita tamen ut dies priores irriti fiant, quoniam polluta est sanctificatio ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ista est lex consecrationis. Cum dies, quos ex voto decreverat, complebuntur, adducet eum ad ostium tabernaculi fœderis,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et offeret oblationes ejus Domino, agnum anniculum immaculatum in holocaustum, et ovem anniculam immaculatam pro peccato, et arietem immaculatum, hostiam pacificam,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>canistrum quoque panum azymorum qui conspersi sint oleo, et lagana absque fermento uncta oleo, ac libamina singulorum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>quæ offeret sacerdos coram Domino, et faciet tam pro peccato, quam in holocaustum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Arietem vero immolabit hostiam pacificam Domino, offerens simul canistrum azymorum, et libamenta quæ ex more debentur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tunc radetur nazaræus ante ostium tabernaculi fœderis cæsarie consecrationis suæ : tolletque capillos ejus, et ponet super ignem, qui est suppositus sacrificio pacificorum :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et armum coctum arietis, tortamque absque fermento unam de canistro, et laganum azymum unum, et tradet in manus nazaræi, postquam rasum fuerit caput ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Susceptaque rursum ab eo, elevabit in conspectu Domini : et sanctificata sacerdotis erunt, sicut pectusculum, quod separari jussum est, et femur. Post hæc, potest bibere nazaræus vinum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ista est lex nazaræi, cum voverit oblationem suam Domino tempore consecrationis suæ, exceptis his, quæ invenerit manus ejus : juxta quod mente devoverat, ita faciet ad perfectionem sanctificationis suæ.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Loquere Aaron et filiis ejus : Sic benedicetis filiis Israël, et dicetis eis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Benedicat tibi Dominus, et custodiat te.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ostendat Dominus faciem suam tibi, et misereatur tui.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Convertat Dominus vultum suum ad te, et det tibi pacem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Invocabuntque nomen meum super filios Israël, et ego benedicam eis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Numbers 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Numbers 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-s $L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NUM.6\",{\"bookId\":4,\"usfm\":\"NUM\",\"bookName\":\"Numbers\",\"drName\":\"Numbers\",\"chapter\":6,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":2,\"text\":\"Speak to the children of Israel, and thou shalt say to them: When a man, or woman, shall make a vow to be sanctified, and will consecrate themselves to the Lord:\"},{\"verse\":3,\"text\":\"They shall abstain from wine, and from every thing that may make a man drunk. They shall not drink vinegar of wine, or of any other drink, nor any thing that is pressed out of the grape: nor shall they eat grapes either fresh or dried.\"},{\"verse\":4,\"text\":\"All the days that they are consecrated to the Lord by vow: they shall eat nothing that cometh of the vineyard, from the raisin even to the kernel.\"},{\"verse\":5,\"text\":\"All the time of his separation no razor shall pass over his head, until the day be fulfilled of his consecration to the Lord. He shall be holy, and shall let the hair of his head grow.\"},{\"verse\":6,\"text\":\"All the time of his consecration he shall not go in to any dead,\"},{\"verse\":7,\"text\":\"Neither shall he make himself unclean, even for his father, or for his mother, or for his brother, or for his sister, when they die, because the consecration of his God is upon his head.\"},{\"verse\":8,\"text\":\"All the days of his separation he shall be holy to the Lord.\"},{\"verse\":9,\"text\":\"But if any man die suddenly before him: the head of his consecration shall be defiled: and he shall shave it forthwith on the same day of his purification, and again on the seventh day.\"},{\"verse\":10,\"text\":\"And on the eighth day he shall bring two turtles, or two young pigeons to the priest in the entry of the covenant of the testimony.\"},{\"verse\":11,\"text\":\"And the priest shall offer one for sin, and the other for a holocaust, and shall pray for him, for that he hath sinned by the dead: and he shall sanctify his head that day:\"},{\"verse\":12,\"text\":\"And shall consecrate to the Lord the days of his separation, offering a lamb of one year for sin: yet so that the former days be made void, because his sanctification was profaned.\"},{\"verse\":13,\"text\":\"This is the law of consecration. When the days which he had determined by vow shall be expired, he shall bring him to the door of the tabernacle of the covenant,\"},{\"verse\":14,\"text\":\"And shall offer his oblation to the Lord: one he lamb of a year old without blemish for a holocaust, and one ewe lamb of a year old without blemish for a sin offering, and one ram without blemish for a victim of peace offering,\"},{\"verse\":15,\"text\":\"A basket also of unleavened bread, tempered with oil, and wafers without leaven anointed with oil, and the libations of each:\"},{\"verse\":16,\"text\":\"And the priest shall present them before the Lord, and shall offer both the sin offering and the holocaust.\"},{\"verse\":17,\"text\":\"But the ram he shall immolate for a sacrifice of peace offering to the Lord, offering at the same time the basket of unleavened bread, and the libations that are due by custom.\"},{\"verse\":18,\"text\":\"Then shall the hair of the consecration of the Nazarite, be shaved off before the door of the tabernacle of the covenant: and he shall take his hair, and lay it upon the fire, which is under the sacrifice of the peace offerings.\"},{\"verse\":19,\"text\":\"And shall take the boiled shoulder of the ram, and one unleavened cake out of the basket, and one unleavened wafer, and he shall deliver them into the hands of the Nazarite, after his head is shaven.\"},{\"verse\":20,\"text\":\"And receiving them again from him, he shall elevate them in the sight of the Lord: and they being sanctified shall belong to the priest, as the breast, which was commanded to be separated, and the shoulder. After this the Nazarite may drink wine.\"},{\"verse\":21,\"text\":\"This is the law of the Nazarite, when he hath vowed his oblation to the Lord in the time of his consecration, besides those things which his hand shall find, according to that which he had vowed in his mind, so shall he do for the fulfilling of his sanctification.\"},{\"verse\":22,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":23,\"text\":\"Say to Aaron and his sons: Thus shall you bless the children of Israel, and you shall say to them:\"},{\"verse\":24,\"text\":\"The Lord bless thee, and keep thee.\"},{\"verse\":25,\"text\":\"The Lord shew his face to thee, and have mercy on thee.\"},{\"verse\":26,\"text\":\"The Lord turn his countenance to thee, and give thee peace.\"},{\"verse\":27,\"text\":\"And they shall invoke my name upon the children of Israel, and I will bless them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere ad filios Israël, et dices ad eos : Vir, sive mulier, cum fecerint votum ut sanctificentur, et se voluerint Domino consecrare :\"},{\"verse\":3,\"text\":\"a vino, et omni quod inebriare potest, abstinebunt. Acetum ex vino, et ex qualibet alia potione, et quidquid de uva exprimitur, non bibent : uvas recentes siccasque non comedent\"},{\"verse\":4,\"text\":\"cunctis diebus quibus ex voto Domino consecrantur : quidquid ex vinea esse potest, ab uva passa usque ad acinum non comedent.\"},{\"verse\":5,\"text\":\"Omni tempore separationis suæ novacula non transibit per caput ejus usque ad completum diem, quo Domino consecratur. Sanctus erit, crescente cæsarie capitis ejus.\"},{\"verse\":6,\"text\":\"Omni tempore consecrationis suæ, super mortuum non ingredietur,\"},{\"verse\":7,\"text\":\"nec super patris quidem et matris et fratris sororisque funere contaminabitur, quia consecratio Dei sui super caput ejus est.\"},{\"verse\":8,\"text\":\"Omnibus diebus separationis suæ sanctus erit Domino.\"},{\"verse\":9,\"text\":\"Sin autem mortuus fuerit subito quispiam coram eo, polluetur caput consecrationis ejus : quod radet illico in eadem die purgationis suæ, et rursum septima.\"},{\"verse\":10,\"text\":\"In octava autem die offeret duos turtures, vel duos pullos columbæ sacerdoti in introitu fœderis testimonii.\"},{\"verse\":11,\"text\":\"Facietque sacerdos unum pro peccato, et alterum in holocaustum, et deprecabitur pro eo, quia peccavit super mortuo : sanctificabitque caput ejus in die illo :\"},{\"verse\":12,\"text\":\"et consecrabit Domino dies separationis illius, offerens agnum anniculum pro peccato : ita tamen ut dies priores irriti fiant, quoniam polluta est sanctificatio ejus.\"},{\"verse\":13,\"text\":\"Ista est lex consecrationis. Cum dies, quos ex voto decreverat, complebuntur, adducet eum ad ostium tabernaculi fœderis,\"},{\"verse\":14,\"text\":\"et offeret oblationes ejus Domino, agnum anniculum immaculatum in holocaustum, et ovem anniculam immaculatam pro peccato, et arietem immaculatum, hostiam pacificam,\"},{\"verse\":15,\"text\":\"canistrum quoque panum azymorum qui conspersi sint oleo, et lagana absque fermento uncta oleo, ac libamina singulorum :\"},{\"verse\":16,\"text\":\"quæ offeret sacerdos coram Domino, et faciet tam pro peccato, quam in holocaustum.\"},{\"verse\":17,\"text\":\"Arietem vero immolabit hostiam pacificam Domino, offerens simul canistrum azymorum, et libamenta quæ ex more debentur.\"},{\"verse\":18,\"text\":\"Tunc radetur nazaræus ante ostium tabernaculi fœderis cæsarie consecrationis suæ : tolletque capillos ejus, et ponet super ignem, qui est suppositus sacrificio pacificorum :\"},{\"verse\":19,\"text\":\"et armum coctum arietis, tortamque absque fermento unam de canistro, et laganum azymum unum, et tradet in manus nazaræi, postquam rasum fuerit caput ejus.\"},{\"verse\":20,\"text\":\"Susceptaque rursum ab eo, elevabit in conspectu Domini : et sanctificata sacerdotis erunt, sicut pectusculum, quod separari jussum est, et femur. Post hæc, potest bibere nazaræus vinum.\"},{\"verse\":21,\"text\":\"Ista est lex nazaræi, cum voverit oblationem suam Domino tempore consecrationis suæ, exceptis his, quæ invenerit manus ejus : juxta quod mente devoverat, ita faciet ad perfectionem sanctificationis suæ.\"},{\"verse\":22,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":23,\"text\":\"Loquere Aaron et filiis ejus : Sic benedicetis filiis Israël, et dicetis eis :\"},{\"verse\":24,\"text\":\"Benedicat tibi Dominus, et custodiat te.\"},{\"verse\":25,\"text\":\"Ostendat Dominus faciem suam tibi, et misereatur tui.\"},{\"verse\":26,\"text\":\"Convertat Dominus vultum suum ad te, et det tibi pacem.\"},{\"verse\":27,\"text\":\"Invocabuntque nomen meum super filios Israël, et ego benedicam eis.\"}],\"summary\":\"The law of the Nazarites: the form of blessing the people.\",\"intro\":null,\"prev\":{\"usfm\":\"NUM\",\"chapter\":5,\"label\":\"Numbers 5\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":7,\"label\":\"Numbers 7\"}}]]\n"])</script></body></html>
