[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Joshua<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Josue</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOS/">About <!-- -->Joshua</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Cities with their suburbs are assigned for the priests and Levites.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then the princes of the families of Levi came to Eleazar the priest, and to Josue the son of Nun, and to the princes of the kindreds of all the tribes of the children of Israel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they spoke to them in Silo in the land of Chanaan, and said: The Lord commanded by the hand of Moses, that cities should be given us to dwell in, and their suburbs to feed our cattle.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the children of Israel gave out of their possessions according to the commandment of the Lord, cities and their suburbs.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the lot came out for the family of Caath of the children of Aaron the priest out of the tribes of Juda, and of Simeon, and of Benjamin, thirteen cities.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And to the rest of the children of Caath, that is, to the Levites, who remained, out of the tribes of Ephraim, and of Dan, and the half tribe of Manasses, ten cities.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the lot came out to the children of Gerson, that they should take of the tribes of Issachar and of Aser and of Nephtali, and of the half tribe of Manasses in Basan, thirteen cities.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And to the sons of Merari by their kindreds, of the tribes of Ruben and of Gad and of Zabulon, twelve cities.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the children of Israel gave to the Levites the cities and their suburbs, as the Lord commanded by the hand of Moses, giving to every one by lot.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Of the tribes of the children of Juda and of Simeon Josue gave cities: whose names are these,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>To the sons of Aaron, of the families of Caath of the race of Levi (for the first lot came out for them)</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The city of Arbe the father of Enac, which is called Hebron, in the mountain of Juda, and the suburbs thereof round about.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But the fields and the villages thereof he had given to Caleb the son of Jephone for his possession.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He gave therefore to the children of Aaron the priest, Hebron a city of refuge, and the suburbs thereof, and Lebna with the suburbs thereof,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Jether and Estemo,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Holon, and Dabir,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Ain, and Jeta, and Bethsames, with their suburbs: nine cities out of the two tribes, as hath been said.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And out of the tribe of the children of Benjamin, Gabaon, and Gabae,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Anathoth and Almon, with, their suburbs: four cities.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>All the cities together of the children of Aaron the priest, were thirteen, with their suburbs,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And to the rest of the families of the children of Caath of the race of Levi was given this possession.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Of the tribe of Ephraim, Sichem one of the cities of refuge, with the suburbs thereof in mount Ephraim, and Gazer,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Cibsaim, and Beth-horon, with their suburbs, four cities.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And of he tribe of Dan, Eltheco and Gabathon,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Aialon and Gethremmon, with their suburbs, four cities.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And of the half tribe of Manasses, Thanac and Gethremmon, with their suburbs, two cities.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>All the cities were ten, with their suburbs, which were given to the children of Caath, of the inferior degree.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>To the children of Gerson also of the race of Levi out of the half tribe of Manasses, Gaulon in Basan, one of the cities of refuge, and Bosra, with their suburbs, two cities.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And of the tribe of Issachar, Cesion, and Dabereth,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Jaramoth, and Engannim, with their suburbs, four cities.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And of the tribe of Aser, Masal and Abdon,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Helcath, and Rohob, with their suburbs, four cities.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Of the tribe also of Nephtali, Cedes in Galilee, one of the cities of refuge: and Hammoth Dor, and Carthan, with their suburbs, three cities.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>All the cities of the families of Gerson, were thirteen, with their suburbs.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And to the children of Merari, Levites of the inferior degree, by their families were given of the tribe of Zabulon, Jecnam and Cartha,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Damna and Naalol, four cities with their suburbs.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Of the tribe of Ruben beyond the Jordan over against Jericho, Bosor in the wilderness, one of the cities of refuge, Misor and Jaser and Jethson and Mephaath, four cities with their suburbs.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Of the tribe of Gad, Ramoth in Galaad, one of the cities of refuge, and Manaim and Hesebon and Jaser, four cities with their suburbs,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>All the cities of the children of Merari by their families and kindreds, were twelve.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>So all the cities of the Levites within the possession of the children of Israel were forty-eight,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>With their suburbs, each distributed by the families.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And the Lord God gave to Israel all the land that he had sworn to give to their fathers: and they possessed it, and dwelt in it.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And he gave them peace from all nations round about: and none of their enemies durst stand against them, but were brought under their dominion.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Not so much as one word, which he had promised to perform unto them, was made void, but all came to pass.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Accesseruntque principes familiarum Levi ad Eleazarum sacerdotem, et Josue filium Nun, et ad duces cognationum per singulas tribus filiorum Israël :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>locutique sunt ad eos in Silo terræ Chanaan, atque dixerunt : Dominus præcepit per manum Moysi, ut darentur nobis urbes ad habitandum, et suburbana earum ad alenda jumenta.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dederuntque filii Israël de possessionibus suis juxta imperium Domini, civitates et suburbana earum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Egressaque est sors in familiam Caath filiorum Aaron sacerdotis, de tribubus Juda, et Simeon, et Benjamin, civitates tredecim :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et reliquis filiorum Caath, id est Levitis, qui superfuerant, de tribubus Ephraim, et Dan, et dimidia tribu Manasse, civitates decem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Porro filii Gerson egressa est sors, ut acciperent de tribubus Issachar et Aser et Nephthali, dimidiaque tribu Manasse in Basan, civitates numero tredecim.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et filiis Merari per cognationes suas de tribubus Ruben et Gad et Zabulon urbes duodecim.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dederuntque filii Israël Levitis civitates et suburbana earum, sicut præcepit Dominus per manum Moysi, singulis sorte tribuentes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>De tribubus filiorum Juda et Simeon dedit Josue civitates, quarum ista sunt nomina,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>filiis Aaron per familias Caath Levitici generis (prima enim sors illis egressa est),</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cariatharbe patris Enac, quæ vocatur Hebron, in monte Juda, et suburbana ejus per circuitum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Agros vero et villas ejus dederat Caleb filio Jephone ad possidendum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dedit ergo filiis Aaron sacerdotis Hebron confugii civitatem, ac suburbana ejus : et Lobnam cum suburbanis suis :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et Jether, et Esthemo,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et Holon, et Dabir,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et Ain, et Jeta, et Bethsames, cum suburbanis suis : civitates novem de tribubus, ut dictum est, duabus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>De tribu autem filiorum Benjamin, Gabaon, et Gabæ,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et Anathoth et Almon, cum suburbanis suis : civitates quatuor.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnes simul civitates filiorum Aaron sacerdotis, tredecim, cum suburbanis suis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Reliquis vero per familias filiorum Caath Levitici generis, hæc est data possessio.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>De tribu Ephraim urbes confugii, Sichem cum suburbanis suis in monte Ephraim, et Gazer</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et Cibsaim et Beth-horon, cum suburbanis suis, civitates quatuor.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>De tribu quoque Dan, Eltheco et Gabathon,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et Ajalon et Gethremmon, cum suburbanis suis, civitates quatuor.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Porro de dimidia tribu Manasse, Thanach et Gethremmon, cum suburbanis suis, civitates duæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Omnes civitates decem, et suburbana earum, datæ sunt filiis Caath inferioris gradus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Filiis quoque Gerson Levitici generis dedit de dimidia tribu Manasse confugii civitates, Gaulon in Basan, et Bosram, cum suburbanis suis, civitates duas.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Porro de tribu Issachar, Cesion, et Dabereth,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et Jaramoth, et Engannim, cum suburbanis suis, civitates quatuor.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>De tribu autem Aser, Masal et Abdon,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et Helcath, et Rohob, cum suburbanis suis, civitates quatuor.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>De tribu quoque Nephthali civitates confugii, Cedes in Galilæa, et Hammoth Dor, et Carthan, cum suburbanis suis, civitates tres.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Omnes urbes familiarum Gerson, tredecim, cum suburbanis suis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Filiis autem Merari Levitis inferioris gradus per familias suas data est de tribu Zabulon, Jecnam, et Cartha</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et Damna et Naalol, civitates quatuor cum suburbanis suis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>De tribu Ruben ultra Jordanem contra Jericho civitates refugii, Bosor in solitudine, Misor et Jaser et Jethson et Mephaath, civitates quatuor cum suburbanis suis.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>De tribu Gad civitates confugii, Ramoth in Galaad, et Manaim et Hesebon et Jazer, civitates quatuor cum suburbanis suis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Omnes urbes filiorum Merari per familias et cognationes suas, duodecim.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Itaque civitates universæ Levitarum in medio possessionis filiorum Israël fuerunt quadraginta octo</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>cum suburbanis suis, singulæ per familias distributæ.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Deditque Dominus Deus Israëli omnem terram, quam traditurum se patribus eorum juraverat : et possederunt illam, atque habitaverunt in ea.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Dataque est ab eo pax in omnes per circuitum nationes : nullusque eis hostium resistere ausus est, sed cuncti in eorum ditionem redacti sunt.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Ne unum quidem verbum, quod illis præstiturum se esse promiserat, irritum fuit, sed rebus expleta sunt omnia.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joshua 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/22/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Joshua 22</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs tex the children of Gerson, that they should take of the tribes of Issachar and of Aser and of Nephtali, and of the half tribe of Manasses in Basan, thirteen cities.\"},{\"verse\":7,\"text\":\"And to the sons of Merari by their kindreds, of the tribes of Ruben and of Gad and of Zabulon, twelve cities.\"},{\"verse\":8,\"text\":\"And the children of Israel gave to the Levites the cities and their suburbs, as the Lord commanded by the hand of Moses, giving to every one by lot.\"},{\"verse\":9,\"text\":\"Of the tribes of the children of Juda and of Simeon Josue gave cities: whose names are these,\"},{\"verse\":10,\"text\":\"To the sons of Aaron, of the families of Caath of the race of Levi (for the first lot came out for them)\"},{\"verse\":11,\"text\":\"The city of Arbe the father of Enac, which is called Hebron, in the mountain of Juda, and the suburbs thereof round about.\"},{\"verse\":12,\"text\":\"But the fields and the villages thereof he had given to Caleb the son of Jephone for his possession.\"},{\"verse\":13,\"text\":\"He gave therefore to the children of Aaron the priest, Hebron a city of refuge, and the suburbs thereof, and Lebna with the suburbs thereof,\"},{\"verse\":14,\"text\":\"And Jether and Estemo,\"},{\"verse\":15,\"text\":\"And Holon, and Dabir,\"},{\"verse\":16,\"text\":\"And Ain, and Jeta, and Bethsames, with their suburbs: nine cities out of the two tribes, as hath been said.\"},{\"verse\":17,\"text\":\"And out of the tribe of the children of Benjamin, Gabaon, and Gabae,\"},{\"verse\":18,\"text\":\"And Anathoth and Almon, with, their suburbs: four cities.\"},{\"verse\":19,\"text\":\"All the cities together of the children of Aaron the priest, were thirteen, with their suburbs,\"},{\"verse\":20,\"text\":\"And to the rest of the families of the children of Caath of the race of Levi was given this possession.\"},{\"verse\":21,\"text\":\"Of the tribe of Ephraim, Sichem one of the cities of refuge, with the suburbs thereof in mount Ephraim, and Gazer,\"},{\"verse\":22,\"text\":\"And Cibsaim, and Beth-horon, with their suburbs, four cities.\"},{\"verse\":23,\"text\":\"And of he tribe of Dan, Eltheco and Gabathon,\"},{\"verse\":24,\"text\":\"And Aialon and Gethremmon, with their suburbs, four cities.\"},{\"verse\":25,\"text\":\"And of the half tribe of Manasses, Thanac and Gethremmon, with their suburbs, two cities.\"},{\"verse\":26,\"text\":\"All the cities were ten, with their suburbs, which were given to the children of Caath, of the inferior degree.\"},{\"verse\":27,\"text\":\"To the children of Gerson also of the race of Levi out of the half tribe of Manasses, Gaulon in Basan, one of the cities of refuge, and Bosra, with their suburbs, two cities.\"},{\"verse\":28,\"text\":\"And of the tribe of Issachar, Cesion, and Dabereth,\"},{\"verse\":29,\"text\":\"And Jaramoth, and Engannim, with their suburbs, four cities.\"},{\"verse\":30,\"text\":\"And of the tribe of Aser, Masal and Abdon,\"},{\"verse\":31,\"text\":\"And Helcath, and Rohob, with their suburbs, four cities.\"},{\"verse\":32,\"text\":\"Of the tribe also of Nephtali, Cedes in Galilee, one of the cities of refuge: and Hammoth Dor, and Carthan, with their suburbs, three cities.\"},{\"verse\":33,\"text\":\"All the cities of the families of Gerson, were thirteen, with their suburbs.\"},{\"verse\":34,\"text\":\"And to the children of Merari, Levites of the inferior degree, by their families were given of the tribe of Zabulon, Jecnam and Cartha,\"},{\"verse\":35,\"text\":\"And Damna and Naalol, four cities with their suburbs.\"},{\"verse\":36,\"text\":\"Of the tribe of Ruben beyond the Jordan over against Jericho, Bosor in the wilderness, one of the cities of refuge, Misor and Jaser and Jethson and Mephaath, four cities with their suburbs.\"},{\"verse\":37,\"text\":\"Of the tribe of Gad, Ramoth in Galaad, one of the cities of refuge, and Manaim and Hesebon and Jaser, four cities with their suburbs,\"},{\"verse\":38,\"text\":\"All the cities of the children of Merari by their families and kindreds, were twelve.\"},{\"verse\":39,\"text\":\"So all the cities of the Levites within the possession of the children of Israel were forty-eight,\"},{\"verse\":40,\"text\":\"With their suburbs, each distributed by the families.\"},{\"verse\":41,\"text\":\"And the Lord God gave to Israel all the land that he had sworn to give to their fathers: and they possessed it, and dwelt in it.\"},{\"verse\":42,\"text\":\"And he gave them peace from all nations round about: and none of their enemies durst stand against them, but were brought under their dominion.\"},{\"verse\":43,\"text\":\"Not so much as one word, which he had promised to perform unto them, was made void, but all came to pass.\"}],\"vul\":[{\"verse\":1,\"text\":\"Accesseruntque principes familiarum Levi ad Eleazarum sacerdotem, et Josue filium Nun, et ad duces cognationum per singulas tribus filiorum Israël :\"},{\"verse\":2,\"text\":\"locutique sunt ad eos in Silo terræ Chanaan, atque dixerunt : Dominus præcepit per manum Moysi, ut darentur nobis urbes ad habitandum, et suburbana earum ad alenda jumenta.\"},{\"verse\":3,\"text\":\"Dederuntque filii Israël de possessionibus suis juxta imperium Domini, civitates et suburbana earum.\"},{\"verse\":4,\"text\":\"Egressaque est sors in familiam Caath filiorum Aaron sacerdotis, de tribubus Juda, et Simeon, et Benjamin, civitates tredecim :\"},{\"verse\":5,\"text\":\"et reliquis filiorum Caath, id est Levitis, qui superfuerant, de tribubus Ephraim, et Dan, et dimidia tribu Manasse, civitates decem.\"},{\"verse\":6,\"text\":\"Porro filii Gerson egressa est sors, ut acciperent de tribubus Issachar et Aser et Nephthali, dimidiaque tribu Manasse in Basan, civitates numero tredecim.\"},{\"verse\":7,\"text\":\"Et filiis Merari per cognationes suas de tribubus Ruben et Gad et Zabulon urbes duodecim.\"},{\"verse\":8,\"text\":\"Dederuntque filii Israël Levitis civitates et suburbana earum, sicut præcepit Dominus per manum Moysi, singulis sorte tribuentes.\"},{\"verse\":9,\"text\":\"De tribubus filiorum Juda et Simeon dedit Josue civitates, quarum ista sunt nomina,\"},{\"verse\":10,\"text\":\"filiis Aaron per familias Caath Levitici generis (prima enim sors illis egressa est),\"},{\"verse\":11,\"text\":\"Cariatharbe patris Enac, quæ vocatur Hebron, in monte Juda, et suburbana ejus per circuitum.\"},{\"verse\":12,\"text\":\"Agros vero et villas ejus dederat Caleb filio Jephone ad possidendum.\"},{\"verse\":13,\"text\":\"Dedit ergo filiis Aaron sacerdotis Hebron confugii civitatem, ac suburbana ejus : et Lobnam cum suburbanis suis :\"},{\"verse\":14,\"text\":\"et Jether, et Esthemo,\"},{\"verse\":15,\"text\":\"et Holon, et Dabir,\"},{\"verse\":16,\"text\":\"et Ain, et Jeta, et Bethsames, cum suburbanis suis : civitates novem de tribubus, ut dictum est, duabus.\"},{\"verse\":17,\"text\":\"De tribu autem filiorum Benjamin, Gabaon, et Gabæ,\"},{\"verse\":18,\"text\":\"et Anathoth et Almon, cum suburbanis suis : civitates quatuor.\"},{\"verse\":19,\"text\":\"Omnes simul civitates filiorum Aaron sacerdotis, tredecim, cum suburbanis suis.\"},{\"verse\":20,\"text\":\"Reliquis vero per familias filiorum Caath Levitici generis, hæc est data possessio.\"},{\"verse\":21,\"text\":\"De tribu Ephraim urbes confugii, Sichem cum suburbanis suis in monte Ephraim, et Gazer\"},{\"verse\":22,\"text\":\"et Cibsaim et Beth-horon, cum suburbanis suis, civitates quatuor.\"},{\"verse\":23,\"text\":\"De tribu quoque Dan, Eltheco et Gabathon,\"},{\"verse\":24,\"text\":\"et Ajalon et Gethremmon, cum suburbanis suis, civitates quatuor.\"},{\"verse\":25,\"text\":\"Porro de dimidia tribu Manasse, Thanach et Gethremmon, cum suburbanis suis, civitates duæ.\"},{\"verse\":26,\"text\":\"Omnes civitates decem, et suburbana earum, datæ sunt filiis Caath inferioris gradus.\"},{\"verse\":27,\"text\":\"Filiis quoque Gerson Levitici generis dedit de dimidia tribu Manasse confugii civitates, Gaulon in Basan, et Bosram, cum suburbanis suis, civitates duas.\"},{\"verse\":28,\"text\":\"Porro de tribu Issachar, Cesion, et Dabereth,\"},{\"verse\":29,\"text\":\"et Jaramoth, et Engannim, cum suburbanis suis, civitates quatuor.\"},{\"verse\":30,\"text\":\"De tribu autem Aser, Masal et Abdon,\"},{\"verse\":31,\"text\":\"et Helcath, et Rohob, cum suburbanis suis, civitates quatuor.\"},{\"verse\":32,\"text\":\"De tribu quoque Nephthali civitates confugii, Cedes in Galilæa, et Hammoth Dor, et Carthan, cum suburbanis suis, civitates tres.\"},{\"verse\":33,\"text\":\"Omnes urbes familiarum Gerson, tredecim, cum suburbanis suis.\"},{\"verse\":34,\"text\":\"Filiis autem Merari Levitis inferioris gradus per familias suas data est de tribu Zabulon, Jecnam, et Cartha\"},{\"verse\":35,\"text\":\"et Damna et Naalol, civitates quatuor cum suburbanis suis.\"},{\"verse\":36,\"text\":\"De tribu Ruben ultra Jordanem contra Jericho civitates refugii, Bosor in solitudine, Misor et Jaser et Jethson et Mephaath, civitates quatuor cum suburbanis suis.\"},{\"verse\":37,\"text\":\"De tribu Gad civitates confugii, Ramoth in Galaad, et Manaim et Hesebon et Jazer, civitates quatuor cum suburbanis suis.\"},{\"verse\":38,\"text\":\"Omnes urbes filiorum Merari per familias et cognationes suas, duodecim.\"},{\"verse\":39,\"text\":\"Itaque civitates universæ Levitarum in medio possessionis filiorum Israël fuerunt quadraginta octo\"},{\"verse\":40,\"text\":\"cum suburbanis suis, singulæ per familias distributæ.\"},{\"verse\":41,\"text\":\"Deditque Dominus Deus Israëli omnem terram, quam traditurum se patribus eorum juraverat : et possederunt illam, atque habitaverunt in ea.\"},{\"verse\":42,\"text\":\"Dataque est ab eo pax in omnes per circuitum nationes : nullusque eis hostium resistere ausus est, sed cuncti in eorum ditionem redacti sunt.\"},{\"verse\":43,\"text\":\"Ne unum quidem verbum, quod illis præstiturum se esse promiserat, irritum fuit, sed rebus expleta sunt omnia.\"}],\"summary\":\"Cities with their suburbs are assigned for the priests and Levites.\",\"intro\":null,\"prev\":{\"usfm\":\"JOS\",\"chapter\":20,\"label\":\"Joshua 20\"},\"next\":{\"usfm\":\"JOS\",\"chapter\":22,\"label\":\"Joshua 22\"}}]]\n"])</script></body></html>
