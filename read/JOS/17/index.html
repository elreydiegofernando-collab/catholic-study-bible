f text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And this lot fell to the tribe of Manasses for he is the firstborn of Joseph to Machir the firstborn of Manasses the father of Galaad, who was a warlike man, and had for possession Galaad and Basan.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And to the rest of the children of Manasses according to their families: to the children of Abiezer, and to the children of Helec, and to the children of Esriel, and to the children of Sechem, and to the children of Hepher, and to the children of Semida: these are the male children of Manasses the son of Joseph, by their kindreds.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But Salphaad the son of Hepher the son of Galaad the son of Machir the son of Manasses had no sons, but only daughters: whose names are these, Maala and Noa and Hegla and Melcha and Thersa.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they came in the presence of Eleazar the priest and of Josue the son of Nun, and of the princes, saying: The Lord commanded by the hand of Moses, that a possession should be given us in the midst of our brethren. And he gave them according to the commandment of the Lord a possession amongst the brethren of their father.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And there fell ten portions to Manasses, beside the land of Galaad and Basan beyond the Jordan.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For the daughters of Manasses possessed inheritance in the midst of his sons. And the land of Galaad fell to the lot of the rest of the children of Manasses.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the border of Manasses was from Aser, Machmethath which looketh towards Sichem: and it goeth out on the right hand by the inhabitants of the fountain of Taphua.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For the lot of Manasses took in the land of Taphua, which is on the borders of Manasses, and belongs to the children of Ephraim.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the border goeth down to the valley of the reeds, to the south of the torrent of the cities of Ephraim, which are in the midst of the cities of Manasses: the border of Manasses is on the north side of the torrent, and the outgoings of it are at the sea:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>So that the possession of Ephraim is on the south, and on the north that of Manasses, and the sea is the border of both, and they are joined together in the tribe of Aser on the north, and in the tribe of Issachar on the east.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the inheritance of Manasses in Issachar and in Aser, was Bethsan and its villages, and Jeblaam with its villages, and the inhabitants of Dor, with the towns thereof: the inhabitants also of Endor with the villages thereof: and in like manner the inhabitants of Thenac with the villages thereof: and the inhabitants of Mageddo with their villages, and the third part of the city of Nopheth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Neither could the children of Manasses overthrow these cities, but the Chanaanite began to dwell in his land.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But after that the children of Israel were grown strong, they subdued the Chanaanites, and made them their tributaries, and they did not kill them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the children of Joseph spoke to Josue, and said: Why hast thou given me but one lot and one portion to possess, whereas I am of so great a multitude, and the Lord hath blessed me?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Josue said to them: If thou be a great people, go up into the woodland, and cut down room for thyself in the land of the Pherezite and the Raphaims: because the possession of mount Ephraim is too narrow for thee.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the children of Joseph answered him: We cannot go up to the mountains, for the Chanaanites that dwell in the low lands, wherein are situate Bethsan with its towns, and Jezrael in the midst of the valley, have chariots of iron.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Josue said to the house of Joseph, to Ephraim and Manasses: Thou art a great people, and of great strength, thou shalt not have one lot only:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But thou shalt pass to the mountain, and shalt cut down the wood, and make thyself room to dwell in: and mayst proceed farther, when thou hast destroyed the Chanaanites, who as thou sayest have iron chariots, and are very strong.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cecidit autem sors tribui Manasse (ipse enim est primogenitus Joseph) : Machir primogenito Manasse patri Galaad, qui fuit vir pugnator, habuitque possessionem Galaad et Basan :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et reliquis filiorum Manasse juxta familias suas, filiis Abiezer, et filiis Helec, et filiis Esriel, et filiis Sechem, et filiis Hepher, et filiis Semida. Isti sunt filii Manasse filii Joseph, mares, per cognationes suas.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Salphaad vero filio Hepher filii Galaad filii Machir filii Manasse non erant filii, sed solæ filiæ : quarum ista sunt nomina : Maala et Noa et Hegla et Melcha et Thersa.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Veneruntque in conspectu Eleazari sacerdotis, et Josue filii Nun, et principum, dicentes : Dominus præcepit per manum Moysi, ut daretur nobis possessio in medio fratrum nostrorum. Deditque eis juxta imperium Domini possessionem in medio fratrum patris earum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ceciderunt funiculi Manasse, decem, absque terra Galaad et Basan trans Jordanem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Filiæ enim Manasse possederunt hæreditatem in medio filiorum ejus. Terra autem Galaad cecidit in sortem filiorum Manasse qui reliqui erant.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fuitque terminus Manasse ab Aser, Machmethath quæ respicit Sichem : et egreditur ad dexteram juxta habitatores fontis Taphuæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Etenim in sorte Manasse ceciderat terra Taphuæ, quæ est juxta terminos Manasse filiorum Ephraim.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Descenditque terminus vallis arundineti in meridiem torrentis civitatum Ephraim, quæ in medio sunt urbium Manasse : terminus Manasse ab aquilone torrentis, et exitus ejus pergit ad mare :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ita ut possessio Ephraim sit ab austro, et ab aquilone Manasse, et utramque claudat mare, et conjungantur sibi in tribu Aser ab aquilone, et in tribu Issachar ab oriente.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fuitque hæreditas Manasse in Issachar et in Aser, Bethsan et viculi ejus, et Jeblaam cum viculis suis, et habitatores Dor cum oppidis suis, habitatores quoque Endor cum viculis suis : similiterque habitatores Thenac cum viculis suis, et habitatores Mageddo cum viculis suis, et tertia pars urbis Nopheth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nec potuerunt filii Manasse has civitates subvertere, sed cœpit Chananæus habitare in terra sua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Postquam autem convaluerunt filii Israël, subjecerunt Chananæos, et fecerunt sibi tributarios, nec interfecerunt eos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Locutique sunt filii Joseph ad Josue, et dixerunt : Quare dedisti mihi possessionem sortis et funiculi unius, cum sim tantæ multitudinis, et benedixerit mihi Dominus ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ad quos Josue ait : Si populus multus es, ascende in silvam, et succide tibi spatia in terra Pherezæi et Raphaim : quia angusta est tibi possessio montis Ephraim.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cui responderunt filii Joseph : Non poterimus ad montana conscendere, cum ferreis curribus utantur Chananæi, qui habitant in terra campestri, in qua sitæ sunt Bethsan cum viculis suis, et Jezraël mediam possidens vallem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixitque Josue ad domum Joseph, Ephraim et Manasse : Populus multus es, et magnæ fortitudinis : non habebis sortem unam,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>sed transibis ad montem, et succides tibi, atque purgabis ad habitandum spatia : et poteris ultra procedere cum subverteris Chananæum, quem dicis ferreos habere currus, et esse fortissimum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joshua 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Joshua 18</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->17<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Joshua 16" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-s stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JOS.17\",{\"bookId\":6,\"usfm\":\"JOS\",\"bookName\":\"Joshua\",\"drName\":\"Josue\",\"chapter\":17,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And this lot fell to the tribe of Manasses for he is the firstborn of Joseph to Machir the firstborn of Manasses the father of Galaad, who was a warlike man, and had for possession Galaad and Basan.\"},{\"verse\":2,\"text\":\"And to the rest of the children of Manasses according to their families: to the children of Abiezer, and to the children of Helec, and to the children of Esriel, and to the children of Sechem, and to the children of Hepher, and to the children of Semida: these are the male children of Manasses the son of Joseph, by their kindreds.\"},{\"verse\":3,\"text\":\"But Salphaad the son of Hepher the son of Galaad the son of Machir the son of Manasses had no sons, but only daughters: whose names are these, Maala and Noa and Hegla and Melcha and Thersa.\"},{\"verse\":4,\"text\":\"And they came in the presence of Eleazar the priest and of Josue the son of Nun, and of the princes, saying: The Lord commanded by the hand of Moses, that a possession should be given us in the midst of our brethren. And he gave them according to the commandment of the Lord a possession amongst the brethren of their father.\"},{\"verse\":5,\"text\":\"And there fell ten portions to Manasses, beside the land of Galaad and Basan beyond the Jordan.\"},{\"verse\":6,\"text\":\"For the daughters of Manasses possessed inheritance in the midst of his sons. And the land of Galaad fell to the lot of the rest of the children of Manasses.\"},{\"verse\":7,\"text\":\"And the border of Manasses was from Aser, Machmethath which looketh towards Sichem: and it goeth out on the right hand by the inhabitants of the fountain of Taphua.\"},{\"verse\":8,\"text\":\"For the lot of Manasses took in the land of Taphua, which is on the borders of Manasses, and belongs to the children of Ephraim.\"},{\"verse\":9,\"text\":\"And the border goeth down to the valley of the reeds, to the south of the torrent of the cities of Ephraim, which are in the midst of the cities of Manasses: the border of Manasses is on the north side of the torrent, and the outgoings of it are at the sea:\"},{\"verse\":10,\"text\":\"So that the possession of Ephraim is on the south, and on the north that of Manasses, and the sea is the border of both, and they are joined together in the tribe of Aser on the north, and in the tribe of Issachar on the east.\"},{\"verse\":11,\"text\":\"And the inheritance of Manasses in Issachar and in Aser, was Bethsan and its villages, and Jeblaam with its villages, and the inhabitants of Dor, with the towns thereof: the inhabitants also of Endor with the villages thereof: and in like manner the inhabitants of Thenac with the villages thereof: and the inhabitants of Mageddo with their villages, and the third part of the city of Nopheth.\"},{\"verse\":12,\"text\":\"Neither could the children of Manasses overthrow these cities, but the Chanaanite began to dwell in his land.\"},{\"verse\":13,\"text\":\"But after that the children of Israel were grown strong, they subdued the Chanaanites, and made them their tributaries, and they did not kill them.\"},{\"verse\":14,\"text\":\"And the children of Joseph spoke to Josue, and said: Why hast thou given me but one lot and one portion to possess, whereas I am of so great a multitude, and the Lord hath blessed me?\"},{\"verse\":15,\"text\":\"And Josue said to them: If thou be a great people, go up into the woodland, and cut down room for thyself in the land of the Pherezite and the Raphaims: because the possession of mount Ephraim is too narrow for thee.\"},{\"verse\":16,\"text\":\"And the children of Joseph answered him: We cannot go up to the mountains, for the Chanaanites that dwell in the low lands, wherein are situate Bethsan with its towns, and Jezrael in the midst of the valley, have chariots of iron.\"},{\"verse\":17,\"text\":\"And Josue said to the house of Joseph, to Ephraim and Manasses: Thou art a great people, and of great strength, thou shalt not have one lot only:\"},{\"verse\":18,\"text\":\"But thou shalt pass to the mountain, and shalt cut down the wood, and make thyself room to dwell in: and mayst proceed farther, when thou hast destroyed the Chanaanites, who as thou sayest have iron chariots, and are very strong.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cecidit autem sors tribui Manasse (ipse enim est primogenitus Joseph) : Machir primogenito Manasse patri Galaad, qui fuit vir pugnator, habuitque possessionem Galaad et Basan :\"},{\"verse\":2,\"text\":\"et reliquis filiorum Manasse juxta familias suas, filiis Abiezer, et filiis Helec, et filiis Esriel, et filiis Sechem, et filiis Hepher, et filiis Semida. Isti sunt filii Manasse filii Joseph, mares, per cognationes suas.\"},{\"verse\":3,\"text\":\"Salphaad vero filio Hepher filii Galaad filii Machir filii Manasse non erant filii, sed solæ filiæ : quarum ista sunt nomina : Maala et Noa et Hegla et Melcha et Thersa.\"},{\"verse\":4,\"text\":\"Veneruntque in conspectu Eleazari sacerdotis, et Josue filii Nun, et principum, dicentes : Dominus præcepit per manum Moysi, ut daretur nobis possessio in medio fratrum nostrorum. Deditque eis juxta imperium Domini possessionem in medio fratrum patris earum.\"},{\"verse\":5,\"text\":\"Et ceciderunt funiculi Manasse, decem, absque terra Galaad et Basan trans Jordanem.\"},{\"verse\":6,\"text\":\"Filiæ enim Manasse possederunt hæreditatem in medio filiorum ejus. Terra autem Galaad cecidit in sortem filiorum Manasse qui reliqui erant.\"},{\"verse\":7,\"text\":\"Fuitque terminus Manasse ab Aser, Machmethath quæ respicit Sichem : et egreditur ad dexteram juxta habitatores fontis Taphuæ.\"},{\"verse\":8,\"text\":\"Etenim in sorte Manasse ceciderat terra Taphuæ, quæ est juxta terminos Manasse filiorum Ephraim.\"},{\"verse\":9,\"text\":\"Descenditque terminus vallis arundineti in meridiem torrentis civitatum Ephraim, quæ in medio sunt urbium Manasse : terminus Manasse ab aquilone torrentis, et exitus ejus pergit ad mare :\"},{\"verse\":10,\"text\":\"ita ut possessio Ephraim sit ab austro, et ab aquilone Manasse, et utramque claudat mare, et conjungantur sibi in tribu Aser ab aquilone, et in tribu Issachar ab oriente.\"},{\"verse\":11,\"text\":\"Fuitque hæreditas Manasse in Issachar et in Aser, Bethsan et viculi ejus, et Jeblaam cum viculis suis, et habitatores Dor cum oppidis suis, habitatores quoque Endor cum viculis suis : similiterque habitatores Thenac cum viculis suis, et habitatores Mageddo cum viculis suis, et tertia pars urbis Nopheth.\"},{\"verse\":12,\"text\":\"Nec potuerunt filii Manasse has civitates subvertere, sed cœpit Chananæus habitare in terra sua.\"},{\"verse\":13,\"text\":\"Postquam autem convaluerunt filii Israël, subjecerunt Chananæos, et fecerunt sibi tributarios, nec interfecerunt eos.\"},{\"verse\":14,\"text\":\"Locutique sunt filii Joseph ad Josue, et dixerunt : Quare dedisti mihi possessionem sortis et funiculi unius, cum sim tantæ multitudinis, et benedixerit mihi Dominus ?\"},{\"verse\":15,\"text\":\"Ad quos Josue ait : Si populus multus es, ascende in silvam, et succide tibi spatia in terra Pherezæi et Raphaim : quia angusta est tibi possessio montis Ephraim.\"},{\"verse\":16,\"text\":\"Cui responderunt filii Joseph : Non poterimus ad montana conscendere, cum ferreis curribus utantur Chananæi, qui habitant in terra campestri, in qua sitæ sunt Bethsan cum viculis suis, et Jezraël mediam possidens vallem.\"},{\"verse\":17,\"text\":\"Dixitque Josue ad domum Joseph, Ephraim et Manasse : Populus multus es, et magnæ fortitudinis : non habebis sortem unam,\"},{\"verse\":18,\"text\":\"sed transibis ad montem, et succides tibi, atque purgabis ad habitandum spatia : et poteris ultra procedere cum subverteris Chananæum, quem dicis ferreos habere currus, et esse fortissimum.\"}],\"summary\":\"The lot of the half tribe of Manasses.\",\"intro\":null,\"prev\":{\"usfm\":\"JOS\",\"chapter\":16,\"label\":\"Joshua 16\"},\"next\":{\"usfm\":\"JOS\",\"chapter\":18,\"label\":\"Joshua 18\"}}]]\n"])</script></body></html>
