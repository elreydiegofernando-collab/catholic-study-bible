RA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the lot of the sons of Joseph fell from the Jordan over against Jericho and the waters thereof, on the east: the wilderness which goeth up from Jericho to the mountain of Bethel:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And goeth out from Bethel to Luza: and passeth the border of Archi, to Ataroth,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And goeth down westward, by the border of Jephleti, unto the borders of Beth-horon the nether, and to Gazer: and the countries of it are ended by the great sea:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Manasses and Ephraim the children of Joseph possessed it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the border of the children of Ephraim was according to their kindreds: and their possession towards the east was Ataroth-addar unto Beth-horon the upper.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the confines go out unto the sea: but Machmethath looketh to the north, and it goeth round the borders eastward into Thanath-selo: and passeth along on the east side to Janoe.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And it goeth down from Janoe into Ataroth and Naaratha: and it cometh to Jericho, and goeth out to the Jordan.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>From Taphua it passeth on towards the sea into the valley of reeds, and the goings out thereof are at the most salt sea. This is the possession of the tribe of the children of Ephraim by their families.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And there were cities with their villages separated for the children of Ephraim in the midst of the possession of the children of Manasses.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the children of Ephraim slew not the Chanaanite, who dwelt in Gazer: and the Chanaanite dwelt in the midst of Ephraim until this day, paying tribute.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cecidit quoque sors filiorum Joseph ab Jordane contra Jericho et aquas ejus ab oriente : solitudo quæ ascendit de Jericho ad montem Bethel :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et egreditur de Bethel Luza : transitque terminum Archi, Ataroth :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et descendit ad occidentem juxta terminum Jephleti, usque ad terminos Beth-horon inferioris, et Gazer : finiunturque regiones ejus mari magno :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>possederuntque filii Joseph, Manasses et Ephraim.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et factus est terminus filiorum Ephraim per cognationes suas : et possessio eorum contra orientem Ataroth Addar usque Beth-horon superiorem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Egrediunturque confinia in mare : Machmethath vero aquilonem respicit, et circuit terminos contra orientem in Thanathselo : et pertransit ab oriente Janoë.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Descenditque de Janoë in Ataroth et Naaratha : et pervenit in Jericho, egrediturque ad Jordanem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>De Taphua pertransit contra mare in vallem arundineti, suntque egressus ejus in mare salsissimum. Hæc est possessio tribus filiorum Ephraim per familias suas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Urbesque separatæ sunt filiis Ephraim in medio possessionis filiorum Manasse, et villæ earum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et non interfecerunt filii Ephraim Chananæum, qui habitabat in Gazer : habitavitque Chananæus in medio Ephraim usque in diem hanc tributarius.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joshua 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Joshua 17</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->16<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page< th out to the Jordan.\"},{\"verse\":8,\"text\":\"From Taphua it passeth on towards the sea into the valley of reeds, and the goings out thereof are at the most salt sea. This is the possession of the tribe of the children of Ephraim by their families.\"},{\"verse\":9,\"text\":\"And there were cities with their villages separated for the children of Ephraim in the midst of the possession of the children of Manasses.\"},{\"verse\":10,\"text\":\"And the children of Ephraim slew not the Chanaanite, who dwelt in Gazer: and the Chanaanite dwelt in the midst of Ephraim until this day, paying tribute.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cecidit quoque sors filiorum Joseph ab Jordane contra Jericho et aquas ejus ab oriente : solitudo quæ ascendit de Jericho ad montem Bethel :\"},{\"verse\":2,\"text\":\"et egreditur de Bethel Luza : transitque terminum Archi, Ataroth :\"},{\"verse\":3,\"text\":\"et descendit ad occidentem juxta terminum Jephleti, usque ad terminos Beth-horon inferioris, et Gazer : finiunturque regiones ejus mari magno :\"},{\"verse\":4,\"text\":\"possederuntque filii Joseph, Manasses et Ephraim.\"},{\"verse\":5,\"text\":\"Et factus est terminus filiorum Ephraim per cognationes suas : et possessio eorum contra orientem Ataroth Addar usque Beth-horon superiorem.\"},{\"verse\":6,\"text\":\"Egrediunturque confinia in mare : Machmethath vero aquilonem respicit, et circuit terminos contra orientem in Thanathselo : et pertransit ab oriente Janoë.\"},{\"verse\":7,\"text\":\"Descenditque de Janoë in Ataroth et Naaratha : et pervenit in Jericho, egrediturque ad Jordanem.\"},{\"verse\":8,\"text\":\"De Taphua pertransit contra mare in vallem arundineti, suntque egressus ejus in mare salsissimum. Hæc est possessio tribus filiorum Ephraim per familias suas.\"},{\"verse\":9,\"text\":\"Urbesque separatæ sunt filiis Ephraim in medio possessionis filiorum Manasse, et villæ earum.\"},{\"verse\":10,\"text\":\"Et non interfecerunt filii Ephraim Chananæum, qui habitabat in Gazer
