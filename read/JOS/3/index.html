he, and all the children of Israel, and they abode there for three days.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>After which, the heralds went through the midst of the camp,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And began to proclaim: When you shall see the ark of the covenant of the Lord your God, and the priests of the race of Levi carrying it, rise you up also, and follow them as they go before:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And let there be between you and the ark the space of two thousand cubits: that you may see it afar off, and know which way you must go: for you have not gone this way before: and take care you come not near the ark.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Josue said to the people: Be ye sanctified: for tomorrow the Lord will do wonders among you.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said to the priests: Take up the ark of the covenant, and go before the people. And they obeyed his commands, and took it up, and walked before them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the Lord said to Josue: This day will I begin to exalt thee before Israel: that they may know that as I was with Moses, so I am with thee also.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And do thou command the priests, that carry the ark of the covenant, and say to them: When you shall have entered into part of the water of the Jordan, stand in it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Josue said to the children of Israel: Come hither, and hear the word of the Lord your God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And again he said: By this you shall know, that the Lord, the living God, is in the midst of you, and that he shall destroy, before your sight, the Chanaanite and the Hethite, the Hevite and the Pherezite, the Gergesite also, and the Jebusite, and the Amorrhite.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Behold, the ark of the covenant of the Lord of all the earth shall go before you into the Jordan.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Prepare ye twelve men of the tribes of Israel, one of every tribe.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when the priests, that carry the ark of the Lord the God of the whole earth, shall set the soles of their feet in the waters of the Jordan, the waters that are beneath shall run down and go off: and those that come from above, shall stand together upon a heap.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So the people went out of their tents, to pass over the Jordan: and the priests that carried the ark of the covenant, went on before them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And as soon as they came into the Jordan, and their feet were dipped in part of the water, (now the Jordan, it being harvest time, had filled the banks of its channel,)</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The waters that came down from above stood in one place, and swelling up like a mountain, were seen afar off, from the city that is called Adom, to the place of Sarthan: but those that were beneath, ran down into the sea of the wilderness, (which now is called the Dead Sea) until they wholly failed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the people marched over against Jericho: and the priests that carried the ark of the covenant of the Lord, stood girded upon the dry ground in the midst of the Jordan, and all the people passed over, through the channel that was dried up.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur Josue de nocte consurgens movit castra : egredientesque de Setim, venerunt ad Jordanem ipse et omnes filii Israël, et morati sunt ibi tres dies.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quibus evolutis transierunt præcones per castrorum medium,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et clamare cœperunt : Quando videritis arcam fœderis Domini Dei vestri, et sacerdotes stirpis Leviticæ portantes eam, vos quoque consurgite, et sequimini præcedentes :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sitque inter vos et arcam spatium cubitorum duum millium : ut procul videre possitis, et nosse per quam viam ingrediamini : quia prius non ambulastis per eam : et cavete ne appropinquetis ad arcam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixitque Josue ad populum : Sanctificamini : cras enim faciet Dominus inter vos mirabilia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et ait ad sacerdotes : Tollite arcam fœderis, et præcedite populum. Qui jussa complentes, tulerunt, et ambulaverunt ante eos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixitque Dominus ad Josue : Hodie incipiam exaltare te coram omni Israël : ut sciant quod sicut cum Moyse fui, ita et tecum sim.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tu autem præcipe sacerdotibus, qui portant arcam fœderis, et dic eis : Cum ingressi fueritis partem aquæ Jordanis, state in ea.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixitque Josue ad filios Israël : Accedite huc, et audite verbum Domini Dei vestri.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et rursum : In hoc, inquit, scietis quod Dominus Deus vivens in medio vestri est, et disperdet in conspectu vestro Chananæum et Hethæum, Hevæum et Pherezæum, Gergesæum quoque et Jebusæum, et Amorrhæum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ecce arca fœderis Domini omnis terræ antecedet vos per Jordanem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Parate duodecim viros de tribubus Israël, singulos per singulas tribus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et cum posuerint vestigia pedum suorum sacerdotes qui portant arcam Domini Dei universæ terræ in aquis Jordanis, aquæ quæ inferiores sunt, decurrent atque deficient : quæ autem desuper veniunt, in una mole consistent.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Igitur egressus est populus de tabernaculis suis, ut transiret Jordanem : et sacerdotes, qui portabant arcam fœderis, pergebant ante eum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ingressisque eis Jordanem, et pedibus eorum in parte aquæ tinctis (Jordanis autem ripas alvei sui tempore messis impleverat),</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>steterunt aquæ descendentes in loco uno, et ad instar montis intumescentes apparebant procul, ab urbe quæ vocatur Adom usque ad locum Sarthan : quæ autem inferiores erant, in mare Solitudinis (quod nunc vocatur Mortuum) descenderunt, usquequo omnino deficerent.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Populus autem incedebat contra Jericho : et sacerdotes qui portabant arcam fœderis Domini, stabant super siccam humum in medio Jordanis accincti, omnisque populus per arentem alveum transibat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joshua 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Joshua 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Joshua 2" class="inline-flex h-12 w-14 s \",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JOS.3\",{\"bookId\":6,\"usfm\":\"JOS\",\"bookName\":\"Joshua\",\"drName\":\"Josue\",\"chapter\":3,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And Josue rose before daylight, and removed the camp: and they departed from Setim, and came to the Jordan: he, and all the children of Israel, and they abode there for three days.\"},{\"verse\":2,\"text\":\"After which, the heralds went through the midst of the camp,\"},{\"verse\":3,\"text\":\"And began to proclaim: When you shall see the ark of the covenant of the Lord your God, and the priests of the race of Levi carrying it, rise you up also, and follow them as they go before:\"},{\"verse\":4,\"text\":\"And let there be between you and the ark the space of two thousand cubits: that you may see it afar off, and know which way you must go: for you have not gone this way before: and take care you come not near the ark.\"},{\"verse\":5,\"text\":\"And Josue said to the people: Be ye sanctified: for tomorrow the Lord will do wonders among you.\"},{\"verse\":6,\"text\":\"And he said to the priests: Take up the ark of the covenant, and go before the people. And they obeyed his commands, and took it up, and walked before them.\"},{\"verse\":7,\"text\":\"And the Lord said to Josue: This day will I begin to exalt thee before Israel: that they may know that as I was with Moses, so I am with thee also.\"},{\"verse\":8,\"text\":\"And do thou command the priests, that carry the ark of the covenant, and say to them: When you shall have entered into part of the water of the Jordan, stand in it.\"},{\"verse\":9,\"text\":\"And Josue said to the children of Israel: Come hither, and hear the word of the Lord your God.\"},{\"verse\":10,\"text\":\"And again he said: By this you shall know, that the Lord, the living God, is in the midst of you, and that he shall destroy, before your sight, the Chanaanite and the Hethite, the Hevite and the Pherezite, the Gergesite also, and the Jebusite, and the Amorrhite.\"},{\"verse\":11,\"text\":\"Behold, the ark of the covenant of the Lord of all the earth shall go before you into the Jordan.\"},{\"verse\":12,\"text\":\"Prepare ye twelve men of the tribes of Israel, one of every tribe.\"},{\"verse\":13,\"text\":\"And when the priests, that carry the ark of the Lord the God of the whole earth, shall set the soles of their feet in the waters of the Jordan, the waters that are beneath shall run down and go off: and those that come from above, shall stand together upon a heap.\"},{\"verse\":14,\"text\":\"So the people went out of their tents, to pass over the Jordan: and the priests that carried the ark of the covenant, went on before them.\"},{\"verse\":15,\"text\":\"And as soon as they came into the Jordan, and their feet were dipped in part of the water, (now the Jordan, it being harvest time, had filled the banks of its channel,)\"},{\"verse\":16,\"text\":\"The waters that came down from above stood in one place, and swelling up like a mountain, were seen afar off, from the city that is called Adom, to the place of Sarthan: but those that were beneath, ran down into the sea of the wilderness, (which now is called the Dead Sea) until they wholly failed.\"},{\"verse\":17,\"text\":\"And the people marched over against Jericho: and the priests that carried the ark of the covenant of the Lord, stood girded upon the dry ground in the midst of the Jordan, and all the people passed over, through the channel that was dried up.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur Josue de nocte consurgens movit castra : egredientesque de Setim, venerunt ad Jordanem ipse et omnes filii Israël, et morati sunt ibi tres dies.\"},{\"verse\":2,\"text\":\"Quibus evolutis transierunt præcones per castrorum medium,\"},{\"verse\":3,\"text\":\"et clamare cœperunt : Quando videritis arcam fœderis Domini Dei vestri, et sacerdotes stirpis Leviticæ portantes eam, vos quoque consurgite, et sequimini præcedentes :\"},{\"verse\":4,\"text\":\"sitque inter vos et arcam spatium cubitorum duum millium : ut procul videre possitis, et nosse per quam viam ingrediamini : quia prius non ambulastis per eam : et cavete ne appropinquetis ad arcam.\"},{\"verse\":5,\"text\":\"Dixitque Josue ad populum : Sanctificamini : cras enim faciet Dominus inter vos mirabilia.\"},{\"verse\":6,\"text\":\"Et ait ad sacerdotes : Tollite arcam fœderis, et præcedite populum. Qui jussa complentes, tulerunt, et ambulaverunt ante eos.\"},{\"verse\":7,\"text\":\"Dixitque Dominus ad Josue : Hodie incipiam exaltare te coram omni Israël : ut sciant quod sicut cum Moyse fui, ita et tecum sim.\"},{\"verse\":8,\"text\":\"Tu autem præcipe sacerdotibus, qui portant arcam fœderis, et dic eis : Cum ingressi fueritis partem aquæ Jordanis, state in ea.\"},{\"verse\":9,\"text\":\"Dixitque Josue ad filios Israël : Accedite huc, et audite verbum Domini Dei vestri.\"},{\"verse\":10,\"text\":\"Et rursum : In hoc, inquit, scietis quod Dominus Deus vivens in medio vestri est, et disperdet in conspectu vestro Chananæum et Hethæum, Hevæum et Pherezæum, Gergesæum quoque et Jebusæum, et Amorrhæum.\"},{\"verse\":11,\"text\":\"Ecce arca fœderis Domini omnis terræ antecedet vos per Jordanem.\"},{\"verse\":12,\"text\":\"Parate duodecim viros de tribubus Israël, singulos per singulas tribus.\"},{\"verse\":13,\"text\":\"Et cum posuerint vestigia pedum suorum sacerdotes qui portant arcam Domini Dei universæ terræ in aquis Jordanis, aquæ quæ inferiores sunt, decurrent atque deficient : quæ autem desuper veniunt, in una mole consistent.\"},{\"verse\":14,\"text\":\"Igitur egressus est populus de tabernaculis suis, ut transiret Jordanem : et sacerdotes, qui portabant arcam fœderis, pergebant ante eum.\"},{\"verse\":15,\"text\":\"Ingressisque eis Jordanem, et pedibus eorum in parte aquæ tinctis (Jordanis autem ripas alvei sui tempore messis impleverat),\"},{\"verse\":16,\"text\":\"steterunt aquæ descendentes in loco uno, et ad instar montis intumescentes apparebant procul, ab urbe quæ vocatur Adom usque ad locum Sarthan : quæ autem inferiores erant, in mare Solitudinis (quod nunc vocatur Mortuum) descenderunt, usquequo omnino deficerent.\"},{\"verse\":17,\"text\":\"Populus autem incedebat contra Jericho : et sacerdotes qui portabant arcam fœderis Domini, stabant super siccam humum in medio Jordanis accincti, omnisque populus per arentem alveum transibat.\"}],\"summary\":\"The river Jordan is miraculously dried up for the passage of the children of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"JOS\",\"chapter\":2,\"label\":\"Joshua 2\"},\"next\":{\"usfm\":\"JOS\",\"chapter\":4,\"label\":\"Joshua 4\"}}]]\n"])</script></body></html>
