A" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when Jabin king of Asor had heard these things, he sent to Jobab king of Madon, and to the king of Semeron, and to the king of Achsaph:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And to the kings of the north, that dwelt in the mountains and in the plains over against the south side of Ceneroth, and in the levels and the countries of Dor by the sea side:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To the Chanaanites also on the east and on the west, and the Amorrhite, and the Hethite, and the Pherezite, and the Jebusite in the mountains: to the Hevite also who dwelt at the foot of Hermon in the land of Maspha.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they all came out with their troops, a people exceeding numerous as the sand that is on the sea shore, their horses also and chariots a very great multitude,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And all these kings assembled together at the waters of Merom, to fight against Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Lord said to Josue: Fear them not: for to morrow at this same hour I will deliver all these to be slain in the sight of Israel: thou shalt hamstring their horses, and thou shalt burn their chariots with fire.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Josue came, and all the army with him, against them to the waters of Merom on a sudden, and fell upon them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the Lord delivered them into the hands of Israel. And they defeated them, and chased them as far as the great Sidon and the waters of Maserophot, and the field of Masphe, which is on the east thereof. He slew them all, so as to leave no remains of them:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he did as the Lord had commanded him, he hamstringed their horses and burned their chariots.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And presently turning back he took Asor: and slew the king thereof with the sword. Now Asor of old was the head of all these kingdoms.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he cut off all the souls that abode there: he left not in it any remains, but utterly destroyed all, and burned the city itself with fire.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he took and put to the sword and destroyed all the cities round about, and their kings, as Moses the servant of God had commanded him.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Except the cities that were on hills and high places, the rest Israel burned: only Asor that was very strong he consumed with fire.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the children of Israel divided among themselves all the spoil of these cities and the cattle, killing all the men.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>As the Lord had commanded Moses his servant, so did Moses command Josue, and he accomplished all: he left not one thing undone of all the commandments which the Lord had commanded Moses.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So Josue took all the country of the hills, and of the south, and the land of Gosen, and the plains and the west country, and the mountain of Israel, and the plains thereof:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And part of the mountain that goeth up to Seir as far as Baalgad, by the plain of Libanus under mount Hermon: all their kings he took, smote and slew.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Josue made war a long time against these kings.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>There was not a city that delivered itself to the children of Israel, except the Hevite, who dwelt in Gabaon: for he took all by fight.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For it was the sentence of the Lord, that their hearts should be hardened, and they should fight against Israel, and fall, and should not deserve any clemency, and should be destroyed as the Lord had commanded Moses.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At that time Josue came and cut off the Enacims from the mountains, from Hebron, and Dabir, and Anab, and from all the mountain of Juda and Israel, and destroyed their cities.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He left not any of the stock of the Enacims, in the land of the children of Israel: except the cities of Gaza, and Geth, and Azotus, in which alone they were left.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>So Josue took all the land, as the Lord spoke to Moses, and delivered it in possession to the children of Israel, according to their divisions and tribes. And the land rested from wars.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quæ cum audisset Jabin rex Asor, misit ad Jobab regem Madon, et ad regem Semeron, atque ad regem Achsaph :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ad reges quoque aquilonis, qui habitabant in montanis et in planitie contra meridiem Ceneroth, in campestribus quoque et in regionibus Dor juxta mare :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Chananæum quoque ab oriente et occidente, et Amorrhæum atque Hethæum ac Pherezæum et Jebusæum in montanis : Hevæum quoque qui habitabat ad radices Hermon in terra Maspha.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Egressique sunt omnes cum turmis suis, populus multus nimis sicut arena quæ est in littore maris, equi quoque et currus immensæ multitudinis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Conveneruntque omnes reges isti in unum ad aquas Merom, ut pugnarent contra Israël.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque Dominus ad Josue : Ne timeas eos : cras enim hac eadem hora ego tradam omnes istos vulnerandos in conspectu Israël : equos eorum subnervabis, et currus igne combures.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venitque Josue, et omnis exercitus cum eo, adversus illos ad aquas Merom subito, et irruerunt super eos,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>tradiditque illos Dominus in manus Israël. Qui percusserunt eos, et persecuti sunt usque ad Sidonem magnam, et aquas Maserephoth, campumque Masphe, qui est ad orientalem illius partem. Ita percussit omnes, ut nullas dimitteret ex eis reliquias :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>fecitque sicut præceperat ei Dominus : equos eorum subnervavit, currusque combussit igni.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Reversusque statim cepit Asor, et regem ejus percussit gladio. Asor enim antiquitus inter omnia regna hæc principatum tenebat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Percussitque omnes animas quæ ibidem morabantur : non dimisit in ea ullas reliquias, sed usque ad internecionem universa vastavit, ipsamque urbem peremit incendio.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et omnes per circuitum civitates, regesque earum, cepit, percussit atque delevit, sicut præceperat ei Moyses famulus Domini.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Absque urbibus, quæ erant in collibus et in tumulis sitæ, ceteras succendit Israël : unam tantum Asor munitissimam flamma consumpsit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Omnemque prædam istarum urbium ac jumenta diviserunt sibi filii Israël, cunctis hominibus interfectis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sicut præceperat Dominus Moysi servo suo, ita præcepit Moyses Josue, et ille universa complevit : non præteriit de universis mandatis, nec unum quidem verbum quod jusserat Dominus Moysi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cepit itaque Josue omnem terram montanam et meridianam, terramque Gosen, et planitiem, et occidentalem plagam, montemque Israël, et campestria ejus,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et partem montis, quæ ascendit Seir usque Baalgad, per planitiem Libani subter montem Hermon : omnes reges eorum cepit, percussit, et occidit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Multo tempore pugnavit Josue contra reges istos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non fuit civitas quæ se traderet filiis Israël, præter Hevæum, qui habitabat in Gabaon : omnes enim bellando cepit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Domini enim sententia fuerat, ut indurarentur corda eorum, et pugnarent contra Israël, et caderent, et non mererentur ullam clementiam, ac perirent, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In illo tempore venit Josue, et interfecit Enacim de montanis, Hebron, et Dabir, et Anab, et de omni monte Juda et Israël, urbesque eorum delevit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non reliquit ullum de stirpe Enacim, in terra filiorum Israël : absque civitatibus Gaza, et Geth, et Azoto, in quibus solis relicti sunt.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cepit ergo Josue omnem terram, sicut locutus est Dominus ad Moysen, et tradidit eam in possessionem filiis Israël secundum partes et tribus suas : quievitque terra a præliis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Joshua 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hove Pherezite, and the Jebusite in the mountains: to the Hevite also who dwelt at the foot of Hermon in the land of Maspha.\"},{\"verse\":4,\"text\":\"And they all came out with their troops, a people exceeding numerous as the sand that is on the sea shore, their horses also and chariots a very great multitude,\"},{\"verse\":5,\"text\":\"And all these kings assembled together at the waters of Merom, to fight against Israel.\"},{\"verse\":6,\"text\":\"And the Lord said to Josue: Fear them not: for to morrow at this same hour I will deliver all these to be slain in the sight of Israel: thou shalt hamstring their horses, and thou shalt burn their chariots with fire.\"},{\"verse\":7,\"text\":\"And Josue came, and all the army with him, against them to the waters of Merom on a sudden, and fell upon them.\"},{\"verse\":8,\"text\":\"And the Lord delivered them into the hands of Israel. And they defeated them, and chased them as far as the great Sidon and the waters of Maserophot, and the field of Masphe, which is on the east thereof. He slew them all, so as to leave no remains of them:\"},{\"verse\":9,\"text\":\"And he did as the Lord had commanded him, he hamstringed their horses and burned their chariots.\"},{\"verse\":10,\"text\":\"And presently turning back he took Asor: and slew the king thereof with the sword. Now Asor of old was the head of all these kingdoms.\"},{\"verse\":11,\"text\":\"And he cut off all the souls that abode there: he left not in it any remains, but utterly destroyed all, and burned the city itself with fire.\"},{\"verse\":12,\"text\":\"And he took and put to the sword and destroyed all the cities round about, and their kings, as Moses the servant of God had commanded him.\"},{\"verse\":13,\"text\":\"Except the cities that were on hills and high places, the rest Israel burned: only Asor that was very strong he consumed with fire.\"},{\"verse\":14,\"text\":\"And the children of Israel divided among themselves all the spoil of these cities and the cattle, killing all the men.\"},{\"verse\":15,\"text\":\"As the Lord had commanded Moses his servant, so did Moses command Josue, and he accomplished all: he left not one thing undone of all the commandments which the Lord had commanded Moses.\"},{\"verse\":16,\"text\":\"So Josue took all the country of the hills, and of the south, and the land of Gosen, and the plains and the west country, and the mountain of Israel, and the plains thereof:\"},{\"verse\":17,\"text\":\"And part of the mountain that goeth up to Seir as far as Baalgad, by the plain of Libanus under mount Hermon: all their kings he took, smote and slew.\"},{\"verse\":18,\"text\":\"Josue made war a long time against these kings.\"},{\"verse\":19,\"text\":\"There was not a city that delivered itself to the children of Israel, except the Hevite, who dwelt in Gabaon: for he took all by fight.\"},{\"verse\":20,\"text\":\"For it was the sentence of the Lord, that their hearts should be hardened, and they should fight against Israel, and fall, and should not deserve any clemency, and should be destroyed as the Lord had commanded Moses.\"},{\"verse\":21,\"text\":\"At that time Josue came and cut off the Enacims from the mountains, from Hebron, and Dabir, and Anab, and from all the mountain of Juda and Israel, and destroyed their cities.\"},{\"verse\":22,\"text\":\"He left not any of the stock of the Enacims, in the land of the children of Israel: except the cities of Gaza, and Geth, and Azotus, in which alone they were left.\"},{\"verse\":23,\"text\":\"So Josue took all the land, as the Lord spoke to Moses, and delivered it in possession to the children of Israel, according to their divisions and tribes. And the land rested from wars.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quæ cum audisset Jabin rex Asor, misit ad Jobab regem Madon, et ad regem Semeron, atque ad regem Achsaph :\"},{\"verse\":2,\"text\":\"ad reges quoque aquilonis, qui habitabant in montanis et in planitie contra meridiem Ceneroth, in campestribus quoque et in regionibus Dor juxta mare :\"},{\"verse\":3,\"text\":\"Chananæum quoque ab oriente et occidente, et Amorrhæum atque Hethæum ac Pherezæum et Jebusæum in montanis : Hevæum quoque qui habitabat ad radices Hermon in terra Maspha.\"},{\"verse\":4,\"text\":\"Egressique sunt omnes cum turmis suis, populus multus nimis sicut arena quæ est in littore maris, equi quoque et currus immensæ multitudinis.\"},{\"verse\":5,\"text\":\"Conveneruntque omnes reges isti in unum ad aquas Merom, ut pugnarent contra Israël.\"},{\"verse\":6,\"text\":\"Dixitque Dominus ad Josue : Ne timeas eos : cras enim hac eadem hora ego tradam omnes istos vulnerandos in conspectu Israël : equos eorum subnervabis, et currus igne combures.\"},{\"verse\":7,\"text\":\"Venitque Josue, et omnis exercitus cum eo, adversus illos ad aquas Merom subito, et irruerunt super eos,\"},{\"verse\":8,\"text\":\"tradiditque illos Dominus in manus Israël. Qui percusserunt eos, et persecuti sunt usque ad Sidonem magnam, et aquas Maserephoth, campumque Masphe, qui est ad orientalem illius partem. Ita percussit omnes, ut nullas dimitteret ex eis reliquias :\"},{\"verse\":9,\"text\":\"fecitque sicut præceperat ei Dominus : equos eorum subnervavit, currusque combussit igni.\"},{\"verse\":10,\"text\":\"Reversusque statim cepit Asor, et regem ejus percussit gladio. Asor enim antiquitus inter omnia regna hæc principatum tenebat.\"},{\"verse\":11,\"text\":\"Percussitque omnes animas quæ ibidem morabantur : non dimisit in ea ullas reliquias, sed usque ad internecionem universa vastavit, ipsamque urbem peremit incendio.\"},{\"verse\":12,\"text\":\"Et omnes per circuitum civitates, regesque earum, cepit, percussit atque delevit, sicut præceperat ei Moyses famulus Domini.\"},{\"verse\":13,\"text\":\"Absque urbibus, quæ erant in collibus et in tumulis sitæ, ceteras succendit Israël : unam tantum Asor munitissimam flamma consumpsit.\"},{\"verse\":14,\"text\":\"Omnemque prædam istarum urbium ac jumenta diviserunt sibi filii Israël, cunctis hominibus interfectis.\"},{\"verse\":15,\"text\":\"Sicut præceperat Dominus Moysi servo suo, ita præcepit Moyses Josue, et ille universa complevit : non præteriit de universis mandatis, nec unum quidem verbum quod jusserat Dominus Moysi.\"},{\"verse\":16,\"text\":\"Cepit itaque Josue omnem terram montanam et meridianam, terramque Gosen, et planitiem, et occidentalem plagam, montemque Israël, et campestria ejus,\"},{\"verse\":17,\"text\":\"et partem montis, quæ ascendit Seir usque Baalgad, per planitiem Libani subter montem Hermon : omnes reges eorum cepit, percussit, et occidit.\"},{\"verse\":18,\"text\":\"Multo tempore pugnavit Josue contra reges istos.\"},{\"verse\":19,\"text\":\"Non fuit civitas quæ se traderet filiis Israël, præter Hevæum, qui habitabat in Gabaon : omnes enim bellando cepit.\"},{\"verse\":20,\"text\":\"Domini enim sententia fuerat, ut indurarentur corda eorum, et pugnarent contra Israël, et caderent, et non mererentur ullam clementiam, ac perirent, sicut præceperat Dominus Moysi.\"},{\"verse\":21,\"text\":\"In illo tempore venit Josue, et interfecit Enacim de montanis, Hebron, et Dabir, et Anab, et de omni monte Juda et Israël, urbesque eorum delevit.\"},{\"verse\":22,\"text\":\"Non reliquit ullum de stirpe Enacim, in terra filiorum Israël : absque civitatibus Gaza, et Geth, et Azoto, in quibus solis relicti sunt.\"},{\"verse\":23,\"text\":\"Cepit ergo Josue omnem terram, sicut locutus est Dominus ad Moysen, et tradidit eam in possessionem filiis Israël secundum partes et tribus suas : quievitque terra a præliis.\"}],\"summary\":\"The kings of the north are overthrown: the whole country is taken.\",\"intro\":null,\"prev\":{\"usfm\":\"JOS\",\"chapter\":10,\"label\":\"Joshua 10\"},\"next\":{\"usfm\":\"JOS\",\"chapter\":12,\"label\":\"Joshua 12\"}}]]\n"])</script></body></html>
