0 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Joshua<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Josue</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Two spies are sent to Jericho, who are received and concealed by Rahab.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Josue, the son of Nun, sent from Setim two men, to spy secretly: and said to them: Go, and view the land, and the city of Jericho. They went, and entered into the house of a woman that was a harlot, named Rahab, and lodged with her.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And it was told the king of Jericho, and was said: Behold there are men come in hither, by night, of the children of Israel, to spy the land.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the king of Jericho sent to Rahab, saying: Bring forth the men that came to thee, and are entered into thy house: for they are spies, and are come to view all the land.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the woman taking the men, hid them, and said: I confess they came to me, but I knew not whence they were:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And at the time of shutting the gate in the dark, they also went out together. I know not whither they are gone: pursue after them quickly, and you will overtake them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But she made the men go up to the top of her house, and covered them with the stalks of flax, which was there.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now they that were sent, pursued after them, by the way that leadeth to the fords of the Jordan: and as soon as they were gone out, the gate was presently shut.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The men that were hid were not yet asleep, when behold the woman went up to them, and said:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I know that the Lord hath given this land to you: for the dread of you is fallen upon us, and all the inhabitants of the land have lost all strength.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>We have heard that the Lord dried up the water of the Red Sea, at your going in, when you came out of Egypt: and what things you did to the two kings of the Amorrhites, that were beyond the Jordan, Sehon and Og whom you slew.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And at the hearing these things, we were affrighted, and our heart fainted away, neither did there remain any spirit in us, at your coming in: for the Lord your God he is God in heaven above, and in the earth beneath.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now, therefore, swear ye to me by the Lord, that as I have shewed mercy to you, so you also will shew mercy to my father’s house: and give me a true token.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>That you will save my father and mother, my brethren and sisters, and all things that are theirs, and deliver our souls from death.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They answered her: Be our lives for you unto death, only if thou betray us not. And when the Lord shall have delivered us the land, we will shew thee mercy and truth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then she let them down with a cord out of a window: for her house joined close to the wall.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And she said to them: Get ye up to the mountains, lest perhaps they meet you as they return: and there lie ye hid three days, till they come back, and so you shall go on your way.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they said to her: We shall be blameless of this oath, which thou hast made us swear,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If, when we come into the land, this scarlet cord be a sign, and thou tie it in the window, by which thou hast let us down: and gather together thy father and mother, and brethren, and all thy kindred into thy house.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Whosoever shall go out of the door of thy house, his blood shall be upon his own head, and we shall be quit. But the blood of all that shall be with thee in the house, shall light upon our head, if any man touch them.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But if thou wilt betray us, and utter this word abroad, we shall be quit of this oath, which thou hast made us swear.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And she answered: As you have spoken, so be it done: and sending them on their way, she hung the scarlet cord in the window.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But they went and came to the mountains, and stayed there three days, till they that pursued them were returned. For having sought them through all the way, they found them not.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And when they were gone back into the city, the spies returned, and came down from the mountain: and passing over the Jordan, they came to Josue, the son of Nun, and told him all that befel them,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And said: the Lord hath delivered all this land into our hands, and all the inhabitants thereof are overthrown with fear.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Misit igitur Josue filius Nun de Setim duos viros exploratores in abscondito : et dixit eis : Ite, et considerate terram, urbemque Jericho. Qui pergentes ingressi sunt domum mulieris meretricis, nomine Rahab, et quieverunt apud eam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Nuntiatumque est regi Jericho, et dictum : Ecce viri ingressi sunt huc per noctem de filiis Israël, ut explorarent terram.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Misitque rex Jericho ad Rahab, dicens : Educ viros, qui venerunt ad te, et ingressi sunt domum tuam : exploratores quippe sunt, et omnem terram considerare venerunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tollensque mulier viros, abscondit, et ait : Fateor, venerunt ad me, sed nesciebam unde essent :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>cumque porta clauderetur in tenebris, et illi pariter exierunt ; nescio quo abierunt : persequimini cito, et comprehendetis eos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ipsa autem fecit ascendere viros in solarium domus suæ, operuitque eos stipula lini, quæ ibi erat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hi autem, qui missi fuerant, secuti sunt eos per viam, quæ ducit ad vadum Jordanis : illisque egressis statim porta clausa est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Necdum obdormierant qui latebant, et ecce mulier ascendit ad eos, et ait :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Novi quod Dominus tradiderit vobis terram : etenim irruit in nos terror vester, et elanguerunt omnes habitatores terræ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Audivimus quod siccaverit Dominus aquas maris Rubri ad vestrum introitum, quando egressi estis ex Ægypto : et quæ feceritis duobus Amorrhæorum regibus, qui erant trans Jordanem, Sehon et Og, quos interfecistis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et hæc audientes pertimuimus, et elanguit cor nostrum, nec remansit in nobis spiritus ad introitum vestrum : Dominus enim Deus vester ipse est Deus in cælo sursum et in terra deorsum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nunc ergo jurate mihi per Dominum, ut quomodo ego misericordiam feci vobiscum, ita et vos faciatis cum domo patris mei : detisque mihi verum signum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ut salvetis patrem meum et matrem, et fratres ac sorores meas, et omnia quæ illorum sunt, et eruatis animas nostras a morte.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui responderunt ei : Anima nostra sit pro vobis in mortem, si tamen non prodideris nos : cumque tradiderit nobis Dominus terram, faciemus in te misericordiam et veritatem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Demisit ergo eos per funem de fenestra : domus enim ejus hærebat muro.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dixitque ad eos : Ad montana conscendite, ne forte occurrant vobis revertentes : ibique latitate tribus diebus, donec redeant, et sic ibitis per viam vestram.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui dixerunt ad eam : Innoxii erimus a juramento hoc, quo adjurasti nos :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>si ingredientibus nobis terram, signum fuerit funiculus iste coccineus, et ligaveris eum in fenestra, per quam demisisti nos : et patrem tuum ac matrem, fratresque et omnem cognationem tuam congregaveris in domum tuam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui ostium domus tuæ egressus fuerit, sanguis ipsius erit in caput ejus, et nos erimus alieni. Cunctorum autem sanguis, qui tecum in domo fuerint, redundabit in caput nostrum, si eos aliquis tetigerit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quod si nos prodere volueris, et sermonem istum proferre in medium, erimus mundi ab hoc juramento, quo adjurasti nos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et illa respondit : Sicut locuti estis, ita fiat : dimittensque eos ut pergerent, appendit funiculum coccineum in fenestra.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Illi vero ambulantes pervenerunt ad montana, et manserunt ibi tres dies, donec reverterentur qui fuerant persecuti : quærentes enim per omnem viam, non repererunt eos.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quibus urbem ingressis, reversi sunt, et descenderunt exploratores de monte : et, transmisso Jordane, venerunt ad Josue filium Nun, narraveruntque ei omnia quæ acciderant sibi,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>atque dixerunt : Tradidit Dominus omnem terram hanc in manus nostras, et timore prostrati sunt cuncti habitatores ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOS/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" ",{\"children\":\"Joshua 2 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JOS.2\",{\"bookId\":6,\"usfm\":\"JOS\",\"bookName\":\"Joshua\",\"drName\":\"Josue\",\"chapter\":2,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And Josue, the son of Nun, sent from Setim two men, to spy secretly: and said to them: Go, and view the land, and the city of Jericho. They went, and entered into the house of a woman that was a harlot, named Rahab, and lodged with her.\"},{\"verse\":2,\"text\":\"And it was told the king of Jericho, and was said: Behold there are men come in hither, by night, of the children of Israel, to spy the land.\"},{\"verse\":3,\"text\":\"And the king of Jericho sent to Rahab, saying: Bring forth the men that came to thee, and are entered into thy house: for they are spies, and are come to view all the land.\"},{\"verse\":4,\"text\":\"And the woman taking the men, hid them, and said: I confess they came to me, but I knew not whence they were:\"},{\"verse\":5,\"text\":\"And at the time of shutting the gate in the dark, they also went out together. I know not whither they are gone: pursue after them quickly, and you will overtake them.\"},{\"verse\":6,\"text\":\"But she made the men go up to the top of her house, and covered them with the stalks of flax, which was there.\"},{\"verse\":7,\"text\":\"Now they that were sent, pursued after them, by the way that leadeth to the fords of the Jordan: and as soon as they were gone out, the gate was presently shut.\"},{\"verse\":8,\"text\":\"The men that were hid were not yet asleep, when behold the woman went up to them, and said:\"},{\"verse\":9,\"text\":\"I know that the Lord hath given this land to you: for the dread of you is fallen upon us, and all the inhabitants of the land have lost all strength.\"},{\"verse\":10,\"text\":\"We have heard that the Lord dried up the water of the Red Sea, at your going in, when you came out of Egypt: and what things you did to the two kings of the Amorrhites, that were beyond the Jordan, Sehon and Og whom you slew.\"},{\"verse\":11,\"text\":\"And at the hearing these things, we were affrighted, and our heart fainted away, neither did there remain any spirit in us, at your coming in: for the Lord your God he is God in heaven above, and in the earth beneath.\"},{\"verse\":12,\"text\":\"Now, therefore, swear ye to me by the Lord, that as I have shewed mercy to you, so you also will shew mercy to my father’s house: and give me a true token.\"},{\"verse\":13,\"text\":\"That you will save my father and mother, my brethren and sisters, and all things that are theirs, and deliver our souls from death.\"},{\"verse\":14,\"text\":\"They answered her: Be our lives for you unto death, only if thou betray us not. And when the Lord shall have delivered us the land, we will shew thee mercy and truth.\"},{\"verse\":15,\"text\":\"Then she let them down with a cord out of a window: for her house joined close to the wall.\"},{\"verse\":16,\"text\":\"And she said to them: Get ye up to the mountains, lest perhaps they meet you as they return: and there lie ye hid three days, till they come back, and so you shall go on your way.\"},{\"verse\":17,\"text\":\"And they said to her: We shall be blameless of this oath, which thou hast made us swear,\"},{\"verse\":18,\"text\":\"If, when we come into the land, this scarlet cord be a sign, and thou tie it in the window, by which thou hast let us down: and gather together thy father and mother, and brethren, and all thy kindred into thy house.\"},{\"verse\":19,\"text\":\"Whosoever shall go out of the door of thy house, his blood shall be upon his own head, and we shall be quit. But the blood of all that shall be with thee in the house, shall light upon our head, if any man touch them.\"},{\"verse\":20,\"text\":\"But if thou wilt betray us, and utter this word abroad, we shall be quit of this oath, which thou hast made us swear.\"},{\"verse\":21,\"text\":\"And she answered: As you have spoken, so be it done: and sending them on their way, she hung the scarlet cord in the window.\"},{\"verse\":22,\"text\":\"But they went and came to the mountains, and stayed there three days, till they that pursued them were returned. For having sought them through all the way, they found them not.\"},{\"verse\":23,\"text\":\"And when they were gone back into the city, the spies returned, and came down from the mountain: and passing over the Jordan, they came to Josue, the son of Nun, and told him all that befel them,\"},{\"verse\":24,\"text\":\"And said: the Lord hath delivered all this land into our hands, and all the inhabitants thereof are overthrown with fear.\"}],\"vul\":[{\"verse\":1,\"text\":\"Misit igitur Josue filius Nun de Setim duos viros exploratores in abscondito : et dixit eis : Ite, et considerate terram, urbemque Jericho. Qui pergentes ingressi sunt domum mulieris meretricis, nomine Rahab, et quieverunt apud eam.\"},{\"verse\":2,\"text\":\"Nuntiatumque est regi Jericho, et dictum : Ecce viri ingressi sunt huc per noctem de filiis Israël, ut explorarent terram.\"},{\"verse\":3,\"text\":\"Misitque rex Jericho ad Rahab, dicens : Educ viros, qui venerunt ad te, et ingressi sunt domum tuam : exploratores quippe sunt, et omnem terram considerare venerunt.\"},{\"verse\":4,\"text\":\"Tollensque mulier viros, abscondit, et ait : Fateor, venerunt ad me, sed nesciebam unde essent :\"},{\"verse\":5,\"text\":\"cumque porta clauderetur in tenebris, et illi pariter exierunt ; nescio quo abierunt : persequimini cito, et comprehendetis eos.\"},{\"verse\":6,\"text\":\"Ipsa autem fecit ascendere viros in solarium domus suæ, operuitque eos stipula lini, quæ ibi erat.\"},{\"verse\":7,\"text\":\"Hi autem, qui missi fuerant, secuti sunt eos per viam, quæ ducit ad vadum Jordanis : illisque egressis statim porta clausa est.\"},{\"verse\":8,\"text\":\"Necdum obdormierant qui latebant, et ecce mulier ascendit ad eos, et ait :\"},{\"verse\":9,\"text\":\"Novi quod Dominus tradiderit vobis terram : etenim irruit in nos terror vester, et elanguerunt omnes habitatores terræ.\"},{\"verse\":10,\"text\":\"Audivimus quod siccaverit Dominus aquas maris Rubri ad vestrum introitum, quando egressi estis ex Ægypto : et quæ feceritis duobus Amorrhæorum regibus, qui erant trans Jordanem, Sehon et Og, quos interfecistis.\"},{\"verse\":11,\"text\":\"Et hæc audientes pertimuimus, et elanguit cor nostrum, nec remansit in nobis spiritus ad introitum vestrum : Dominus enim Deus vester ipse est Deus in cælo sursum et in terra deorsum.\"},{\"verse\":12,\"text\":\"Nunc ergo jurate mihi per Dominum, ut quomodo ego misericordiam feci vobiscum, ita et vos faciatis cum domo patris mei : detisque mihi verum signum,\"},{\"verse\":13,\"text\":\"ut salvetis patrem meum et matrem, et fratres ac sorores meas, et omnia quæ illorum sunt, et eruatis animas nostras a morte.\"},{\"verse\":14,\"text\":\"Qui responderunt ei : Anima nostra sit pro vobis in mortem, si tamen non prodideris nos : cumque tradiderit nobis Dominus terram, faciemus in te misericordiam et veritatem.\"},{\"verse\":15,\"text\":\"Demisit ergo eos per funem de fenestra : domus enim ejus hærebat muro.\"},{\"verse\":16,\"text\":\"Dixitque ad eos : Ad montana conscendite, ne forte occurrant vobis revertentes : ibique latitate tribus diebus, donec redeant, et sic ibitis per viam vestram.\"},{\"verse\":17,\"text\":\"Qui dixerunt ad eam : Innoxii erimus a juramento hoc, quo adjurasti nos :\"},{\"verse\":18,\"text\":\"si ingredientibus nobis terram, signum fuerit funiculus iste coccineus, et ligaveris eum in fenestra, per quam demisisti nos : et patrem tuum ac matrem, fratresque et omnem cognationem tuam congregaveris in domum tuam.\"},{\"verse\":19,\"text\":\"Qui ostium domus tuæ egressus fuerit, sanguis ipsius erit in caput ejus, et nos erimus alieni. Cunctorum autem sanguis, qui tecum in domo fuerint, redundabit in caput nostrum, si eos aliquis tetigerit.\"},{\"verse\":20,\"text\":\"Quod si nos prodere volueris, et sermonem istum proferre in medium, erimus mundi ab hoc juramento, quo adjurasti nos.\"},{\"verse\":21,\"text\":\"Et illa respondit : Sicut locuti estis, ita fiat : dimittensque eos ut pergerent, appendit funiculum coccineum in fenestra.\"},{\"verse\":22,\"text\":\"Illi vero ambulantes pervenerunt ad montana, et manserunt ibi tres dies, donec reverterentur qui fuerant persecuti : quærentes enim per omnem viam, non repererunt eos.\"},{\"verse\":23,\"text\":\"Quibus urbem ingressis, reversi sunt, et descenderunt exploratores de monte : et, transmisso Jordane, venerunt ad Josue filium Nun, narraveruntque ei omnia quæ acciderant sibi,\"},{\"verse\":24,\"text\":\"atque dixerunt : Tradidit Dominus omnem terram hanc in manus nostras, et timore prostrati sunt cuncti habitatores ejus.\"}],\"summary\":\"Two spies are sent to Jericho, who are received and concealed by Rahab.\",\"intro\":null,\"prev\":{\"usfm\":\"JOS\",\"chapter\":1,\"label\":\"Joshua 1\"},\"next\":{\"usfm\":\"JOS\",\"chapter\":3,\"label\":\"Joshua 3\"}}]]\n"])</script></body></html>
