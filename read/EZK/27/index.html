/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezekiel<!-- --> <span class="text-stone-500">27</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ezechiel</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A description of the glory and riches of Tyre: and of her irrecoverable fall.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the word of the Lord came to me, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thou therefore, O son of man, take up a lamentation for Tyre:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And say to Tyre that dwelleth at the entry of the sea, being the mart of the people for many islands: Thus saith the Lord God: O Tyre, thou hast said: I am of perfect beauty,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And situate in the heart of the sea. Thy neighbours, that built thee, have perfected thy beauty:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>With fir trees of Sanir they have built thee with all sea planks: they have taken cedars from Libanus to make thee masts.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They have cut thy oars out of the oaks of Basan: and they have made thee benches of Indian ivory and cabins with things brought from the islands of Italy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fine broidered linen from Egypt was woven for thy sail, to be spread on thy mast: blue and purple from the islands of Elisa, were made thy covering.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The inhabitants of Sidon, and the Arabians were thy rowers: thy wise men, O Tyre, were thy pilots.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The ancients of Gebal, and the wise men thereof furnished mariners for the service of thy various furniture: all the ships of the sea, and their mariners were thy factors.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The Persians, and Lydians, and the Libyans were thy soldiers in thy army: they hung up the buckler and the helmet in thee for thy ornament.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The men of Arad were with thy army upon thy walls round about: the Pygmeans also that were in thy towers, hung up their quivers on thy walls round about: they perfected thy beauty.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The Carthaginians thy merchants supplied thy fairs with a multitude of all kinds of riches, with silver, iron, tin, and lead,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Greece, Thubal, and Mosoch, they were thy merchants, they brought to thy people slaves and vessels of brass.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>From the house of Thogorma they brought horses, and horsemen, and mules to thy market.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The men of Dedan were thy merchants: many islands were the traffic of thy hand, they exchanged for thy price teeth of ivory and ebony.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The Syrian was thy merchant: by reason of the multitude of thy works, they set forth precious stones, and purple, and broidered works, and fine linen, and silk, and chodchod in thy market.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Juda and the land of Israel, they were thy merchants with the best corn: they set forth balm, and honey, and oil and rosin in thy fairs.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The men of Damascus were thy merchants in the multitude of thy works, in the multitude of divers riches, in rich wine, in wool of the best colour.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dan, and Greece, and Mosel have set forth in thy marts wrought iron: stacte, and calamus were in thy market.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The men of Dedan were thy merchants in tapestry for seats.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Arabia, and all the princes of Cedar, they were the merchants of thy hand: thy merchants came to thee with lambs, and rams, and kids.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sellers of Saba, and Reema, they were thy merchants: with all the best spices, and precious stones, and gold, which they set forth in thy market.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Haran, and Chene, and Eden were thy merchants; Saba, Assur, and Chelmad sold to thee.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>They were thy merchants in divers manners, with bales of blue cloth, and of embroidered work, and of precious riches, which were wrapped up and bound with cords: they had cedars also in thy merchandise.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The ships of the sea, were thy chief in thy merchandise: and thou wast replenished, and glorified exceedingly in the heart of the sea.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thy rowers have brought thee into great waters: the south wind hath broken thee in the heart of the sea.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Thy riches, and thy treasures, and thy manifold furniture, thy mariners, and thy pilots, who kept thy goods, and were chief over thy people: thy men of war also, that were in thee, with all thy multitude that is in the midst of thee: shall fall in the heart of the sea in the day of thy ruin.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thy fleets shall be troubled at the sound of the cry of thy pilots.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And all that handled the oar shall come down from their ships: the mariners, and all the pilots of the sea shall stand upon the land:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And they shall mourn over thee with a loud voice and shall cry bitterly: and they shall cast up dust upon their heads and shall be sprinkled with ashes.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And they shall shave themselves bald for thee, and shall be girded with haircloth: and they shall weep for thee with bitterness of soul, with most bitter weeping.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they shall take up a mournful song for thee, and shall lament thee: What city is like Tyre, which is become silent in the midst of the sea?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Which by thy merchandise that went from thee by sea didst fill many people: which by the multitude of thy riches, and of thy people didst enrich the kings of the earth.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Now thou art destroyed by the sea, thy riches are in the bottom of the waters, and all the multitude that was in the midst of thee is fallen.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>All the inhabitants of the islands are astonished at thee: and all their kings being struck with the storm have changed their countenance.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The merchants of people have hissed at thee: thou art brought to nothing, and thou shalt never be any more.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est verbum Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tu ergo, fili hominis, assume super Tyrum lamentum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dices Tyro, quæ habitat in introitu maris, negotiationi populorum ad insulas multas : Hæc dicit Dominus Deus : O Tyre, tu dixisti : Perfecti decoris ego sum,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et in corde maris sita. Finitimi tui qui te ædificaverunt, impleverunt decorem tuum :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>abietibus de Sanir exstruxerunt te cum omnibus tabulatis maris : cedrum de Libano tulerunt ut facerent tibi malum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quercus de Basan dolaverunt in remos tuos, et transtra tua fecerunt tibi ex ebore indico, et prætoriola de insulis Italiæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Byssus varia de Ægypto texta est tibi in velum ut poneretur in malo : hyacinthus et purpura de insulis Elisa facta sunt operimentum tuum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Habitatores Sidonis et Aradii fuerunt remiges tui : sapientes tui, Tyre, facti sunt gubernatores tui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Senes Giblii et prudentes ejus habuerunt nautas ad ministerium variæ supellectilis tuæ : omnes naves maris, et nautæ earum, fuerunt in populo negotiationis tuæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Persæ, et Lydii, et Libyes erant in exercitu tuo viri bellatores tui : clypeum et galeam suspenderunt in te pro ornatu tuo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Filii Aradii cum exercitu tuo erant super muros tuos in circuitu : sed et Pigmæi qui erant in turribus tuis, pharetras suas suspenderunt in muris tuis per gyrum : ipsi compleverunt pulchritudinem tuam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Carthaginenses negotiatores tui, a multitudine cunctarum divitiarum, argento, ferro, stanno, plumboque repleverunt nundinas tuas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Græcia, Thubal, et Mosoch, ipsi institores tui : mancipia, et vasa ærea advexerunt populo tuo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>De domo Thogorma, equos, et equites, et mulos adduxerunt ad forum tuum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Filii Dedan negotiatores tui ; insulæ multæ, negotiatio manus tuæ : dentes eburneos et hebeninos commutaverunt in pretio tuo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Syrus negotiator tuus propter multitudinem operum tuorum : gemmam, et purpuram, et scutulata, et byssum, et sericum, et chodchod proposuerunt in mercatu tuo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Juda et terra Israël, ipsi institores tui in frumento primo : balsamum, et mel, et oleum, et resinam proposuerunt in nundinis tuis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Damascenus negotiator tuus in multitudine operum tuorum, in multitudine diversarum opum, in vino pingui, in lanis coloris optimi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dan, et Græcia, et Mosel, in nundinis tuis proposuerunt ferrum fabrefactum : stacte et calamus in negotiatione tua.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dedan institores tui in tapetibus ad sedendum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Arabia et universi principes Cedar, ipsi negotiatores manus tuæ : cum agnis, et arietibus, et hædis, venerunt ad te negotiatores tui.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Venditores Saba et Reema, ipsi negotiatores tui : cum universis primis aromatibus, et lapide pretioso, et auro, quod proposuerunt in mercatu tuo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Haran, et Chene, et Eden, negotiatores tui ; Saba, Assur, et Chelmad venditores tui.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ipsi negotiatores tui multifariam, involucris hyacinthi, et polymitorum, gazarumque pretiosarum, quæ obvolutæ et astrictæ erant funibus : cedros quoque habebant in negotiationibus tuis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Naves maris, principes tui in negotiatione tua : et repleta es, et glorificata nimis in corde maris.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In aquis multis adduxerunt te remiges tui : ventus auster contrivit te in corde maris.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Divitiæ tuæ, et thesauri tui, et multiplex instrumentum tuum : nautæ tui et gubernatores tui, qui tenebant supellectilem tuam, et populo tuo præerant : viri quoque bellatores tui, qui erant in te, cum universa multitudine tua quæ est in medio tui, cadent in corde maris in die ruinæ tuæ :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>a sonitu clamoris gubernatorum tuorum conturbabuntur classes.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et descendent de navibus suis omnes qui tenebant remum : nautæ et universi gubernatores maris in terra stabunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ejulabunt super te voce magna : et clamabunt amare, et superjacient pulverem capitibus suis, et cinere conspergentur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et radent super te calvitium, et accingentur ciliciis : et plorabunt te in amaritudine animæ, ploratu amarissimo.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et assument super te carmen lugubre, et plangent te : Quæ est ut Tyrus, quæ obmutuit in medio maris ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quæ in exitu negotiationum tuarum de mari implesti populos multos : in multitudine divitiarum tuarum, et populorum tuorum, ditasti reges terræ.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Nunc contrita es a mari : in profundis aquarum opes tuæ, et omnis multitudo tua quæ erat in medio tui, ceciderunt.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Universi habitatores insularum obstupuerunt super te, et reges earum omnes tempestate perculsi mutaverunt vultus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Negotiatores populorum sibilaverunt super te : ad nihilum deducta es, et non eris usque in perpetuum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/28/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 28</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->27<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Ezekiel 26" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><button type="button" aria-label="Ezekiel 27. Choose another book or chapter" class="flex h-12 min-w-0 flex-1 items-center justify-center gap-1.5 rounded r Tyre:\"},{\"verse\":3,\"text\":\"And say to Tyre that dwelleth at the entry of the sea, being the mart of the people for many islands: Thus saith the Lord God: O Tyre, thou hast said: I am of perfect beauty,\"},{\"verse\":4,\"text\":\"And situate in the heart of the sea. Thy neighbours, that built thee, have perfected thy beauty:\"},{\"verse\":5,\"text\":\"With fir trees of Sanir they have built thee with all sea planks: they have taken cedars from Libanus to make thee masts.\"},{\"verse\":6,\"text\":\"They have cut thy oars out of the oaks of Basan: and they have made thee benches of Indian ivory and cabins with things brought from the islands of Italy.\"},{\"verse\":7,\"text\":\"Fine broidered linen from Egypt was woven for thy sail, to be spread on thy mast: blue and purple from the islands of Elisa, were made thy covering.\"},{\"verse\":8,\"text\":\"The inhabitants of Sidon, and the Arabians were thy rowers: thy wise men, O Tyre, were thy pilots.\"},{\"verse\":9,\"text\":\"The ancients of Gebal, and the wise men thereof furnished mariners for the service of thy various furniture: all the ships of the sea, and their mariners were thy factors.\"},{\"verse\":10,\"text\":\"The Persians, and Lydians, and the Libyans were thy soldiers in thy army: they hung up the buckler and the helmet in thee for thy ornament.\"},{\"verse\":11,\"text\":\"The men of Arad were with thy army upon thy walls round about: the Pygmeans also that were in thy towers, hung up their quivers on thy walls round about: they perfected thy beauty.\"},{\"verse\":12,\"text\":\"The Carthaginians thy merchants supplied thy fairs with a multitude of all kinds of riches, with silver, iron, tin, and lead,\"},{\"verse\":13,\"text\":\"Greece, Thubal, and Mosoch, they were thy merchants, they brought to thy people slaves and vessels of brass.\"},{\"verse\":14,\"text\":\"From the house of Thogorma they brought horses, and horsemen, and mules to thy market.\"},{\"verse\":15,\"text\":\"The men of Dedan were thy merchants: many islands were the traffic of thy hand, they exchanged for thy price teeth of ivory and ebony.\"},{\"verse\":16,\"text\":\"The Syrian was thy merchant: by reason of the multitude of thy works, they set forth precious stones, and purple, and broidered works, and fine linen, and silk, and chodchod in thy market.\"},{\"verse\":17,\"text\":\"Juda and the land of Israel, they were thy merchants with the best corn: they set forth balm, and honey, and oil and rosin in thy fairs.\"},{\"verse\":18,\"text\":\"The men of Damascus were thy merchants in the multitude of thy works, in the multitude of divers riches, in rich wine, in wool of the best colour.\"},{\"verse\":19,\"text\":\"Dan, and Greece, and Mosel have set forth in thy marts wrought iron: stacte, and calamus were in thy market.\"},{\"verse\":20,\"text\":\"The men of Dedan were thy merchants in tapestry for seats.\"},{\"verse\":21,\"text\":\"Arabia, and all the princes of Cedar, they were the merchants of thy hand: thy merchants came to thee with lambs, and rams, and kids.\"},{\"verse\":22,\"text\":\"The sellers of Saba, and Reema, they were thy merchants: with all the best spices, and precious stones, and gold, which they set forth in thy market.\"},{\"verse\":23,\"text\":\"Haran, and Chene, and Eden were thy merchants; Saba, Assur, and Chelmad sold to thee.\"},{\"verse\":24,\"text\":\"They were thy merchants in divers manners, with bales of blue cloth, and of embroidered work, and of precious riches, which were wrapped up and bound with cords: they had cedars also in thy merchandise.\"},{\"verse\":25,\"text\":\"The ships of the sea, were thy chief in thy merchandise: and thou wast replenished, and glorified exceedingly in the heart of the sea.\"},{\"verse\":26,\"text\":\"Thy rowers have brought thee into great waters: the south wind hath broken thee in the heart of the sea.\"},{\"verse\":27,\"text\":\"Thy riches, and thy treasures, and thy manifold furniture, thy mariners, and thy pilots, who kept thy goods, and were chief over thy people: thy men of war also, that were in thee, with all thy multitude that is in the midst of thee: shall fall in the heart of the sea in the day of thy ruin.\"},{\"verse\":28,\"text\":\"Thy fleets shall be troubled at the sound of the cry of thy pilots.\"},{\"verse\":29,\"text\":\"And all that handled the oar shall come down from their ships: the mariners, and all the pilots of the sea shall stand upon the land:\"},{\"verse\":30,\"text\":\"And they shall mourn over thee with a loud voice and shall cry bitterly: and they shall cast up dust upon their heads and shall be sprinkled with ashes.\"},{\"verse\":31,\"text\":\"And they shall shave themselves bald for thee, and shall be girded with haircloth: and they shall weep for thee with bitterness of soul, with most bitter weeping.\"},{\"verse\":32,\"text\":\"And they shall take up a mournful song for thee, and shall lament thee: What city is like Tyre, which is become silent in the midst of the sea?\"},{\"verse\":33,\"text\":\"Which by thy merchandise that went from thee by sea didst fill many people: which by the multitude of thy riches, and of thy people didst enrich the kings of the earth.\"},{\"verse\":34,\"text\":\"Now thou art destroyed by the sea, thy riches are in the bottom of the waters, and all the multitude that was in the midst of thee is fallen.\"},{\"verse\":35,\"text\":\"All the inhabitants of the islands are astonished at thee: and all their kings being struck with the storm have changed their countenance.\"},{\"verse\":36,\"text\":\"The merchants of people have hissed at thee: thou art brought to nothing, and thou shalt never be any more.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est verbum Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Tu ergo, fili hominis, assume super Tyrum lamentum :\"},{\"verse\":3,\"text\":\"et dices Tyro, quæ habitat in introitu maris, negotiationi populorum ad insulas multas : Hæc dicit Dominus Deus : O Tyre, tu dixisti : Perfecti decoris ego sum,\"},{\"verse\":4,\"text\":\"et in corde maris sita. Finitimi tui qui te ædificaverunt, impleverunt decorem tuum :\"},{\"verse\":5,\"text\":\"abietibus de Sanir exstruxerunt te cum omnibus tabulatis maris : cedrum de Libano tulerunt ut facerent tibi malum.\"},{\"verse\":6,\"text\":\"Quercus de Basan dolaverunt in remos tuos, et transtra tua fecerunt tibi ex ebore indico, et prætoriola de insulis Italiæ.\"},{\"verse\":7,\"text\":\"Byssus varia de Ægypto texta est tibi in velum ut poneretur in malo : hyacinthus et purpura de insulis Elisa facta sunt operimentum tuum.\"},{\"verse\":8,\"text\":\"Habitatores Sidonis et Aradii fuerunt remiges tui : sapientes tui, Tyre, facti sunt gubernatores tui.\"},{\"verse\":9,\"text\":\"Senes Giblii et prudentes ejus habuerunt nautas ad ministerium variæ supellectilis tuæ : omnes naves maris, et nautæ earum, fuerunt in populo negotiationis tuæ.\"},{\"verse\":10,\"text\":\"Persæ, et Lydii, et Libyes erant in exercitu tuo viri bellatores tui : clypeum et galeam suspenderunt in te pro ornatu tuo.\"},{\"verse\":11,\"text\":\"Filii Aradii cum exercitu tuo erant super muros tuos in circuitu : sed et Pigmæi qui erant in turribus tuis, pharetras suas suspenderunt in muris tuis per gyrum : ipsi compleverunt pulchritudinem tuam.\"},{\"verse\":12,\"text\":\"Carthaginenses negotiatores tui, a multitudine cunctarum divitiarum, argento, ferro, stanno, plumboque repleverunt nundinas tuas.\"},{\"verse\":13,\"text\":\"Græcia, Thubal, et Mosoch, ipsi institores tui : mancipia, et vasa ærea advexerunt populo tuo.\"},{\"verse\":14,\"text\":\"De domo Thogorma, equos, et equites, et mulos adduxerunt ad forum tuum.\"},{\"verse\":15,\"text\":\"Filii Dedan negotiatores tui ; insulæ multæ, negotiatio manus tuæ : dentes eburneos et hebeninos commutaverunt in pretio tuo.\"},{\"verse\":16,\"text\":\"Syrus negotiator tuus propter multitudinem operum tuorum : gemmam, et purpuram, et scutulata, et byssum, et sericum, et chodchod proposuerunt in mercatu tuo.\"},{\"verse\":17,\"text\":\"Juda et terra Israël, ipsi institores tui in frumento primo : balsamum, et mel, et oleum, et resinam proposuerunt in nundinis tuis.\"},{\"verse\":18,\"text\":\"Damascenus negotiator tuus in multitudine operum tuorum, in multitudine diversarum opum, in vino pingui, in lanis coloris optimi.\"},{\"verse\":19,\"text\":\"Dan, et Græcia, et Mosel, in nundinis tuis proposuerunt ferrum fabrefactum : stacte et calamus in negotiatione tua.\"},{\"verse\":20,\"text\":\"Dedan institores tui in tapetibus ad sedendum.\"},{\"verse\":21,\"text\":\"Arabia et universi principes Cedar, ipsi negotiatores manus tuæ : cum agnis, et arietibus, et hædis, venerunt ad te negotiatores tui.\"},{\"verse\":22,\"text\":\"Venditores Saba et Reema, ipsi negotiatores tui : cum universis primis aromatibus, et lapide pretioso, et auro, quod proposuerunt in mercatu tuo.\"},{\"verse\":23,\"text\":\"Haran, et Chene, et Eden, negotiatores tui ; Saba, Assur, et Chelmad venditores tui.\"},{\"verse\":24,\"text\":\"Ipsi negotiatores tui multifariam, involucris hyacinthi, et polymitorum, gazarumque pretiosarum, quæ obvolutæ et astrictæ erant funibus : cedros quoque habebant in negotiationibus tuis.\"},{\"verse\":25,\"text\":\"Naves maris, principes tui in negotiatione tua : et repleta es, et glorificata nimis in corde maris.\"},{\"verse\":26,\"text\":\"In aquis multis adduxerunt te remiges tui : ventus auster contrivit te in corde maris.\"},{\"verse\":27,\"text\":\"Divitiæ tuæ, et thesauri tui, et multiplex instrumentum tuum : nautæ tui et gubernatores tui, qui tenebant supellectilem tuam, et populo tuo præerant : viri quoque bellatores tui, qui erant in te, cum universa multitudine tua quæ est in medio tui, cadent in corde maris in die ruinæ tuæ :\"},{\"verse\":28,\"text\":\"a sonitu clamoris gubernatorum tuorum conturbabuntur classes.\"},{\"verse\":29,\"text\":\"Et descendent de navibus suis omnes qui tenebant remum : nautæ et universi gubernatores maris in terra stabunt.\"},{\"verse\":30,\"text\":\"Et ejulabunt super te voce magna : et clamabunt amare, et superjacient pulverem capitibus suis, et cinere conspergentur.\"},{\"verse\":31,\"text\":\"Et radent super te calvitium, et accingentur ciliciis : et plorabunt te in amaritudine animæ, ploratu amarissimo.\"},{\"verse\":32,\"text\":\"Et assument super te carmen lugubre, et plangent te : Quæ est ut Tyrus, quæ obmutuit in medio maris ?\"},{\"verse\":33,\"text\":\"Quæ in exitu negotiationum tuarum de mari implesti populos multos : in multitudine divitiarum tuarum, et populorum tuorum, ditasti reges terræ.\"},{\"verse\":34,\"text\":\"Nunc contrita es a mari : in profundis aquarum opes tuæ, et omnis multitudo tua quæ erat in medio tui, ceciderunt.\"},{\"verse\":35,\"text\":\"Universi habitatores insularum obstupuerunt super te, et reges earum omnes tempestate perculsi mutaverunt vultus.\"},{\"verse\":36,\"text\":\"Negotiatores populorum sibilaverunt super te : ad nihilum deducta es, et non eris usque in perpetuum.\"}],\"summary\":\"A description of the glory and riches of Tyre: and of her irrecoverable fall.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":26,\"label\":\"Ezekiel 26\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":28,\"label\":\"Ezekiel 28\"}}]]\n"])</script></body></html>
