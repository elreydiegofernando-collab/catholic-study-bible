adth of the tabernacle.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the breadth of the gate was ten cubits: and the sides of the gate five cubits on this side, and five cubits on that side: and he measured the length thereof forty cubits, and the breadth twenty cubits.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Then going inward he measured the front of the gate two cubits: and the gate six cubits, and the breadth of the gate seven cubits.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he measured the length thereof twenty cubits, and the breadth twenty cubits, before the face of the temple: and he said to me: This is the holy of holies.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he measured the wall of the house six cubits: and the breadth of every side chamber four cubits round about the house on every side.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the side chambers one by another, were twice thirty-three: and they bore outwards, that they might enter in through the wall of the house in the sides round about, to hold in, and not to touch the wall of the temple.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And there was a broad passage round about, going up by winding stairs, and it led into the upper loft of the temple all round: therefore was the temple broader in the higher parts: and so from the lower parts they went to the higher by the midst.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I saw in the house the height round about, the foundations of the side chambers which were the measure of a reed the space of six cubits:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the thickness of the wall for the side chamber without, which was five cubits: and the inner house was within the side chambers of the house,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And between the chambers was the breadth of twenty cubits round about the house on every side.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the door of the side chambers was turned towards the place of prayer: one door was toward the north, and another door was toward the south: and the breadth of the place for prayer, was five cubits round about.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the building that was separate, and turned to the way that looked toward the sea, was seventy cubits broad and the wall of the building, five cubits thick round about: and ninety cubits long.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he measured the length of the house, a hundred cubits: and the separate building, and the walls thereof, a hundred cubits in length.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the breadth before the face of the house, and of the separate place toward the east, a hundred cubits.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he measured the length of the building over against it, which was separated at the back of it: and the galleries on both sides a hundred cubits: and the inner temple, and the porches of the court.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The thresholds, and the oblique windows, and the galleries round about on three sides, over against the threshold of every one, and floored with wood all round about: and the ground was up to the windows, and the windows were shut over the doors.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And even to the inner house, and without all the wall round about within and without, by measure.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And there were cherubims and palm trees wrought, so that a palm tree was between a cherub and a cherub, and every cherub had two faces.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The face of a man was toward the palm tree on one side, and the face of a lion was toward the palm tree on the other side: set forth through all the house round about.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>From the ground even to the upper parts of the gate, were cherubims and palm trees wrought in the wall of the temple.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The threshold was foursquare, and the face of the sanctuary sight to sight.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The altar of wood was three cubits high: and the length thereof was two cubits: and the corners thereof, and the length thereof, and the walls thereof, were of wood. And he said to me: This is the table before the Lord.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And there were two doors in the temple, and in the sanctuary.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And in the two doors on both sides were two little doors, which were folded within each other: for there were two wickets on both sides of the doors.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And there were cherubims also wrought in the doors of the temple, and the figures of palm trees, like as were made on the walls: for which cause also the planks were thicker in the front of the porch without.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Upon which were the oblique windows, and the representation of palm trees on this side, and on that side in the sides of the porch, according to the sides of the house, and the breadth of the walls.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et introduxit me in templum, et mensus est frontes : sex cubitos latitudinis hinc, et sex cubitos latitudinis inde, latitudinem tabernaculi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et latitudo portæ decem cubitorum erat : et latera portæ, quinque cubitis hinc, et quinque cubitis inde : et mensus est longitudinem ejus quadraginta cubitorum, et latitudinem viginti cubitorum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et introgressus intrinsecus, mensus est in fronte portæ duos cubitos : et portam, sex cubitorum : et latitudinem portæ septem cubitorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et mensus est longitudinem ejus viginti cubitorum, et latitudinem ejus viginti cubitorum, ante faciem templi. Et dixit ad me : Hoc est Sanctum sanctorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et mensus est parietem domus sex cubitorum : et latitudinem lateris quatuor cubitorum undique per circuitum domus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Latera autem, latus ad latus, bis triginta tria : et erant eminentia, quæ ingrederentur per parietem domus, in lateribus per circuitum, ut continerent, et non attingerent parietem templi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et platea erat in rotundum, ascendens sursum per cochleam, et in cœnaculum templi deferebat per gyrum : idcirco latius erat templum in superioribus : et sic de inferioribus ascendebatur ad superiora in medium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et vidi in domo altitudinem per circuitum, fundata latera ad mensuram calami sex cubitorum spatio :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et latitudinem per parietem lateris forinsecus quinque cubitorum : et erat interior domus in lateribus domus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et inter gazophylacia latitudinem viginti cubitorum in circuitu domus undique,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et ostium lateris ad orationem : ostium unum ad viam aquilonis, et ostium unum ad viam australem : et latitudinem loci ad orationem, quinque cubitorum in circuitu.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et ædificium, quod erat separatum, versumque ad viam respicientem ad mare, latitudinis septuaginta cubitorum : paries autem ædificii, quinque cubitorum latitudinis per circuitum : et longitudo ejus nonaginta cubitorum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et mensus est domus longitudinem, centum cubitorum : et quod separatum erat ædificium, et parietes ejus, longitudinis centum cubitorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Latitudo autem ante faciem domus, et ejus quod erat separatum contra orientem, centum cubitorum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et mensus est longitudinem ædificii contra faciem ejus, quod erat separatum ad dorsum : ethecas ex utraque parte centum cubitorum : et templum interius, et vestibula atrii.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Limina, et fenestras obliquas, et ethecas in circuitu per tres partes, contra uniuscujusque limen, stratumque ligno per gyrum in circuitu : terra autem usque ad fenestras, et fenestræ clausæ super ostia.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et usque ad domum interiorem, et forinsecus per omnem parietem in circuitu, intrinsecus et forinsecus, ad mensuram.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et fabrefacta cherubim et palmæ : et palma inter cherub et cherub, duasque facies habebat cherub.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Faciem hominis juxta palmam ex hac parte, et faciem leonis juxta palmam ex alia parte : expressam per omnem domum in circuitu.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De terra usque ad superiora portæ, cherubim et palmæ cælatæ erant in pariete templi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Limen quadrangulum, et facies sanctuarii, aspectus contra aspectum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Altaris lignei trium cubitorum altitudo, et longitudo ejus duorum cubitorum : et anguli ejus, et longitudo ejus, et parietes ejus lignei. Et locutus est ad me : Hæc est mensa coram Domino.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et duo ostia erant in templo et in sanctuario.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et in duobus ostiis ex utraque parte bina erant ostiola quæ in se invicem plicabantur : bina enim ostia erant ex utraque parte ostiorum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et cælata erant in ipsis ostiis templi cherubim, et sculpturæ palmarum, sicut in parietibus quoque expressæ erant : quam ob rem et grossiora erant ligna in vestibuli fronte forinsecus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Super quæ fenestræ obliquæ, et similitudo palmarum hinc atque inde in humerulis vestibuli, secundum latera domus, latitudinemque parietum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/40/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 40</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/42/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 42</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->41<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-ston ":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"EZK.41\",{\"bookId\":31,\"usfm\":\"EZK\",\"bookName\":\"Ezekiel\",\"drName\":\"Ezechiel\",\"chapter\":41,\"totalChapters\":48,\"dra\":[{\"verse\":1,\"text\":\"And he brought me into the temple, and he measured the fronts six cubits broad on this side, and six cubits on that side, the breadth of the tabernacle.\"},{\"verse\":2,\"text\":\"And the breadth of the gate was ten cubits: and the sides of the gate five cubits on this side, and five cubits on that side: and he measured the length thereof forty cubits, and the breadth twenty cubits.\"},{\"verse\":3,\"text\":\"Then going inward he measured the front of the gate two cubits: and the gate six cubits, and the breadth of the gate seven cubits.\"},{\"verse\":4,\"text\":\"And he measured the length thereof twenty cubits, and the breadth twenty cubits, before the face of the temple: and he said to me: This is the holy of holies.\"},{\"verse\":5,\"text\":\"And he measured the wall of the house six cubits: and the breadth of every side chamber four cubits round about the house on every side.\"},{\"verse\":6,\"text\":\"And the side chambers one by another, were twice thirty-three: and they bore outwards, that they might enter in through the wall of the house in the sides round about, to hold in, and not to touch the wall of the temple.\"},{\"verse\":7,\"text\":\"And there was a broad passage round about, going up by winding stairs, and it led into the upper loft of the temple all round: therefore was the temple broader in the higher parts: and so from the lower parts they went to the higher by the midst.\"},{\"verse\":8,\"text\":\"And I saw in the house the height round about, the foundations of the side chambers which were the measure of a reed the space of six cubits:\"},{\"verse\":9,\"text\":\"And the thickness of the wall for the side chamber without, which was five cubits: and the inner house was within the side chambers of the house,\"},{\"verse\":10,\"text\":\"And between the chambers was the breadth of twenty cubits round about the house on every side.\"},{\"verse\":11,\"text\":\"And the door of the side chambers was turned towards the place of prayer: one door was toward the north, and another door was toward the south: and the breadth of the place for prayer, was five cubits round about.\"},{\"verse\":12,\"text\":\"And the building that was separate, and turned to the way that looked toward the sea, was seventy cubits broad and the wall of the building, five cubits thick round about: and ninety cubits long.\"},{\"verse\":13,\"text\":\"And he measured the length of the house, a hundred cubits: and the separate building, and the walls thereof, a hundred cubits in length.\"},{\"verse\":14,\"text\":\"And the breadth before the face of the house, and of the separate place toward the east, a hundred cubits.\"},{\"verse\":15,\"text\":\"And he measured the length of the building over against it, which was separated at the back of it: and the galleries on both sides a hundred cubits: and the inner temple, and the porches of the court.\"},{\"verse\":16,\"text\":\"The thresholds, and the oblique windows, and the galleries round about on three sides, over against the threshold of every one, and floored with wood all round about: and the ground was up to the windows, and the windows were shut over the doors.\"},{\"verse\":17,\"text\":\"And even to the inner house, and without all the wall round about within and without, by measure.\"},{\"verse\":18,\"text\":\"And there were cherubims and palm trees wrought, so that a palm tree was between a cherub and a cherub, and every cherub had two faces.\"},{\"verse\":19,\"text\":\"The face of a man was toward the palm tree on one side, and the face of a lion was toward the palm tree on the other side: set forth through all the house round about.\"},{\"verse\":20,\"text\":\"From the ground even to the upper parts of the gate, were cherubims and palm trees wrought in the wall of the temple.\"},{\"verse\":21,\"text\":\"The threshold was foursquare, and the face of the sanctuary sight to sight.\"},{\"verse\":22,\"text\":\"The altar of wood was three cubits high: and the length thereof was two cubits: and the corners thereof, and the length thereof, and the walls thereof, were of wood. And he said to me: This is the table before the Lord.\"},{\"verse\":23,\"text\":\"And there were two doors in the temple, and in the sanctuary.\"},{\"verse\":24,\"text\":\"And in the two doors on both sides were two little doors, which were folded within each other: for there were two wickets on both sides of the doors.\"},{\"verse\":25,\"text\":\"And there were cherubims also wrought in the doors of the temple, and the figures of palm trees, like as were made on the walls: for which cause also the planks were thicker in the front of the porch without.\"},{\"verse\":26,\"text\":\"Upon which were the oblique windows, and the representation of palm trees on this side, and on that side in the sides of the porch, according to the sides of the house, and the breadth of the walls.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et introduxit me in templum, et mensus est frontes : sex cubitos latitudinis hinc, et sex cubitos latitudinis inde, latitudinem tabernaculi.\"},{\"verse\":2,\"text\":\"Et latitudo portæ decem cubitorum erat : et latera portæ, quinque cubitis hinc, et quinque cubitis inde : et mensus est longitudinem ejus quadraginta cubitorum, et latitudinem viginti cubitorum.\"},{\"verse\":3,\"text\":\"Et introgressus intrinsecus, mensus est in fronte portæ duos cubitos : et portam, sex cubitorum : et latitudinem portæ septem cubitorum.\"},{\"verse\":4,\"text\":\"Et mensus est longitudinem ejus viginti cubitorum, et latitudinem ejus viginti cubitorum, ante faciem templi. Et dixit ad me : Hoc est Sanctum sanctorum.\"},{\"verse\":5,\"text\":\"Et mensus est parietem domus sex cubitorum : et latitudinem lateris quatuor cubitorum undique per circuitum domus.\"},{\"verse\":6,\"text\":\"Latera autem, latus ad latus, bis triginta tria : et erant eminentia, quæ ingrederentur per parietem domus, in lateribus per circuitum, ut continerent, et non attingerent parietem templi.\"},{\"verse\":7,\"text\":\"Et platea erat in rotundum, ascendens sursum per cochleam, et in cœnaculum templi deferebat per gyrum : idcirco latius erat templum in superioribus : et sic de inferioribus ascendebatur ad superiora in medium.\"},{\"verse\":8,\"text\":\"Et vidi in domo altitudinem per circuitum, fundata latera ad mensuram calami sex cubitorum spatio :\"},{\"verse\":9,\"text\":\"et latitudinem per parietem lateris forinsecus quinque cubitorum : et erat interior domus in lateribus domus.\"},{\"verse\":10,\"text\":\"Et inter gazophylacia latitudinem viginti cubitorum in circuitu domus undique,\"},{\"verse\":11,\"text\":\"et ostium lateris ad orationem : ostium unum ad viam aquilonis, et ostium unum ad viam australem : et latitudinem loci ad orationem, quinque cubitorum in circuitu.\"},{\"verse\":12,\"text\":\"Et ædificium, quod erat separatum, versumque ad viam respicientem ad mare, latitudinis septuaginta cubitorum : paries autem ædificii, quinque cubitorum latitudinis per circuitum : et longitudo ejus nonaginta cubitorum.\"},{\"verse\":13,\"text\":\"Et mensus est domus longitudinem, centum cubitorum : et quod separatum erat ædificium, et parietes ejus, longitudinis centum cubitorum.\"},{\"verse\":14,\"text\":\"Latitudo autem ante faciem domus, et ejus quod erat separatum contra orientem, centum cubitorum.\"},{\"verse\":15,\"text\":\"Et mensus est longitudinem ædificii contra faciem ejus, quod erat separatum ad dorsum : ethecas ex utraque parte centum cubitorum : et templum interius, et vestibula atrii.\"},{\"verse\":16,\"text\":\"Limina, et fenestras obliquas, et ethecas in circuitu per tres partes, contra uniuscujusque limen, stratumque ligno per gyrum in circuitu : terra autem usque ad fenestras, et fenestræ clausæ super ostia.\"},{\"verse\":17,\"text\":\"Et usque ad domum interiorem, et forinsecus per omnem parietem in circuitu, intrinsecus et forinsecus, ad mensuram.\"},{\"verse\":18,\"text\":\"Et fabrefacta cherubim et palmæ : et palma inter cherub et cherub, duasque facies habebat cherub.\"},{\"verse\":19,\"text\":\"Faciem hominis juxta palmam ex hac parte, et faciem leonis juxta palmam ex alia parte : expressam per omnem domum in circuitu.\"},{\"verse\":20,\"text\":\"De terra usque ad superiora portæ, cherubim et palmæ cælatæ erant in pariete templi.\"},{\"verse\":21,\"text\":\"Limen quadrangulum, et facies sanctuarii, aspectus contra aspectum.\"},{\"verse\":22,\"text\":\"Altaris lignei trium cubitorum altitudo, et longitudo ejus duorum cubitorum : et anguli ejus, et longitudo ejus, et parietes ejus lignei. Et locutus est ad me : Hæc est mensa coram Domino.\"},{\"verse\":23,\"text\":\"Et duo ostia erant in templo et in sanctuario.\"},{\"verse\":24,\"text\":\"Et in duobus ostiis ex utraque parte bina erant ostiola quæ in se invicem plicabantur : bina enim ostia erant ex utraque parte ostiorum.\"},{\"verse\":25,\"text\":\"Et cælata erant in ipsis ostiis templi cherubim, et sculpturæ palmarum, sicut in parietibus quoque expressæ erant : quam ob rem et grossiora erant ligna in vestibuli fronte forinsecus.\"},{\"verse\":26,\"text\":\"Super quæ fenestræ obliquæ, et similitudo palmarum hinc atque inde in humerulis vestibuli, secundum latera domus, latitudinemque parietum.\"}],\"summary\":\"A description of the temple, and of all the parts of it.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":40,\"label\":\"Ezekiel 40\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":42,\"label\":\"Ezekiel 42\"}}]]\n"])</script></body></html>
