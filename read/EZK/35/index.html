2</sup>Son of man, set thy face against mount Seir, and prophesy concerning it, and say to it:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thus saith the Lord God: Behold I come against thee, mount Seir, and I will stretch forth my hand upon thee, and I will make thee desolate and waste.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I will destroy thy cities, and thou shalt be desolate: and thou shalt know that I am the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Because thou hast been an everlasting enemy, and hast shut up the children of Israel in the hands of the sword in the time of their affliction, in the time of their last iniquity.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Therefore as I live, saith the Lord God, I will deliver thee up to blood, and blood shall pursue thee: and whereas thou hast hated blood, blood shall pursue thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I will make mount Seir waste and desolate: and I will take away from it him that goeth and him that returneth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I will fill his mountains with his men that are slain: in thy hills, and in thy valleys, and in thy torrents they shall fall that are slain with the sword.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I will make thee everlasting desolations, and thy cities shall not be inhabited: and thou shalt know that I am the Lord God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Because thou hast said: The two nations, and the two lands shall be mine, and I will possess them by inheritance: whereas the Lord was there.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore as I live, saith the Lord God, I will do according to thy wrath, and according to thy envy, which thou hast exercised in hatred to them: and I will be made known by them, when I shall have judged thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And thou shalt know that I the Lord have heard all thy reproaches, that thou hast spoken against the mountains of Israel, saying. They are desolate, they are given to us to consume.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And you rose up against me with your mouth, and have derogated from me by your words: I have heard them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thus saith the Lord God: When the whole earth shall rejoice, I will make thee a wilderness.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>As thou hast rejoiced over the inheritance of the house of Israel, because it was laid waste, so will I do to thee: thou shalt be laid waste, O mount Seir, and all Idumea: and they shall know that I am the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factus est sermo Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fili hominis, pone faciem tuam adversum montem Seir, et prophetabis de eo, et dices illi :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hæc dicit Dominus Deus : Ecce ego ad te, mons Seir : et extendam manum meam super te, et dabo te desolatum atque desertum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Urbes tuas demoliar, et tu desertus eris : et scies quia ego Dominus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Eo quod fueris inimicus sempiternus, et concluseris filios Israël in manus gladii in tempore afflictionis eorum, in tempore iniquitatis extremæ :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>propterea vivo ego, dicit Dominus Deus, quoniam sanguini tradam te, et sanguis te persequetur : et cum sanguinem oderis, sanguis persequetur te.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et dabo montem Seir desolatum atque desertum, et auferam de eo euntem et redeuntem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et implebo montes ejus occisorum suorum : in collibus tuis, et in vallibus tuis atque in torrentibus, interfecti gladio cadent.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In solitudines sempiternas tradam te, et civitates tuæ non habitabuntur : et scietis quia ego Dominus Deus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Eo quod dixeris : Duæ gentes et duæ terræ meæ erunt, et hæreditate possidebo eas, cum Dominus esset ibi :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>propterea vivo ego, dicit Dominus Deus, quia faciam juxta iram tuam, et secundum zelum tuum, quem fecisti odio habens eos : et notus efficiar per eos, cum te judicavero.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et scies quia ego Dominus audivi universa opprobria tua quæ locutus es de montibus Israël, dicens : Deserti nobis ad devorandum dati sunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et insurrexistis super me ore vestro, et derogastis adversum me verba vestra : ego audivi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hæc dicit Dominus Deus : Lætante universa terra, in solitudinem te redigam :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>sicuti gavisus es super hæreditatem domus Israël eo quod fuerit dissipata, sic faciam tibi : dissipatus eris, mons Seir, et Idumæa omnis : et scient quia ego Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/34/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 34</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/36/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 36</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->35<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max- ble/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"EZK.35\",{\"bookId\":31,\"usfm\":\"EZK\",\"bookName\":\"Ezekiel\",\"drName\":\"Ezechiel\",\"chapter\":35,\"totalChapters\":48,\"dra\":[{\"verse\":1,\"text\":\"And the word of the Lord came to me, saying:\"},{\"verse\":2,\"text\":\"Son of man, set thy face against mount Seir, and prophesy concerning it, and say to it:\"},{\"verse\":3,\"text\":\"Thus saith the Lord God: Behold I come against thee, mount Seir, and I will stretch forth my hand upon thee, and I will make thee desolate and waste.\"},{\"verse\":4,\"text\":\"I will destroy thy cities, and thou shalt be desolate: and thou shalt know that I am the Lord.\"},{\"verse\":5,\"text\":\"Because thou hast been an everlasting enemy, and hast shut up the children of Israel in the hands of the sword in the time of their affliction, in the time of their last iniquity.\"},{\"verse\":6,\"text\":\"Therefore as I live, saith the Lord God, I will deliver thee up to blood, and blood shall pursue thee: and whereas thou hast hated blood, blood shall pursue thee.\"},{\"verse\":7,\"text\":\"And I will make mount Seir waste and desolate: and I will take away from it him that goeth and him that returneth.\"},{\"verse\":8,\"text\":\"And I will fill his mountains with his men that are slain: in thy hills, and in thy valleys, and in thy torrents they shall fall that are slain with the sword.\"},{\"verse\":9,\"text\":\"I will make thee everlasting desolations, and thy cities shall not be inhabited: and thou shalt know that I am the Lord God.\"},{\"verse\":10,\"text\":\"Because thou hast said: The two nations, and the two lands shall be mine, and I will possess them by inheritance: whereas the Lord was there.\"},{\"verse\":11,\"text\":\"Therefore as I live, saith the Lord God, I will do according to thy wrath, and according to thy envy, which thou hast exercised in hatred to them: and I will be made known by them, when I shall have judged thee.\"},{\"verse\":12,\"text\":\"And thou shalt know that I the Lord have heard all thy reproaches, that thou hast spoken against the mountains of Israel, saying. They are desolate, they are given to us to consume.\"},{\"verse\":13,\"text\":\"And you rose up against me with your mouth, and have derogated from me by your words: I have heard them.\"},{\"verse\":14,\"text\":\"Thus saith the Lord God: When the whole earth shall rejoice, I will make thee a wilderness.\"},{\"verse\":15,\"text\":\"As thou hast rejoiced over the inheritance of the house of Israel, because it was laid waste, so will I do to thee: thou shalt be laid waste, O mount Seir, and all Idumea: and they shall know that I am the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factus est sermo Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Fili hominis, pone faciem tuam adversum montem Seir, et prophetabis de eo, et dices illi :\"},{\"verse\":3,\"text\":\"Hæc dicit Dominus Deus : Ecce ego ad te, mons Seir : et extendam manum meam super te, et dabo te desolatum atque desertum.\"},{\"verse\":4,\"text\":\"Urbes tuas demoliar, et tu desertus eris : et scies quia ego Dominus.\"},{\"verse\":5,\"text\":\"Eo quod fueris inimicus sempiternus, et concluseris filios Israël in manus gladii in tempore afflictionis eorum, in tempore iniquitatis extremæ :\"},{\"verse\":6,\"text\":\"propterea vivo ego, dicit Dominus Deus, quoniam sanguini tradam te, et sanguis te persequetur : et cum sanguinem oderis, sanguis persequetur te.\"},{\"verse\":7,\"text\":\"Et dabo montem Seir desolatum atque desertum, et auferam de eo euntem et redeuntem.\"},{\"verse\":8,\"text\":\"Et implebo montes ejus occisorum suorum : in collibus tuis, et in vallibus tuis atque in torrentibus, interfecti gladio cadent.\"},{\"verse\":9,\"text\":\"In solitudines sempiternas tradam te, et civitates tuæ non habitabuntur : et scietis quia ego Dominus Deus.\"},{\"verse\":10,\"text\":\"Eo quod dixeris : Duæ gentes et duæ terræ meæ erunt, et hæreditate possidebo eas, cum Dominus esset ibi :\"},{\"verse\":11,\"text\":\"propterea vivo ego, dicit Dominus Deus, quia faciam juxta iram tuam, et secundum zelum tuum, quem fecisti odio habens eos : et notus efficiar per eos, cum te judicavero.\"},{\"verse\":12,\"text\":\"Et scies quia ego Dominus audivi universa opprobria tua quæ locutus es de montibus Israël, dicens : Deserti nobis ad devorandum dati sunt.\"},{\"verse\":13,\"text\":\"Et insurrexistis super me ore vestro, et derogastis adversum me verba vestra : ego audivi.\"},{\"verse\":14,\"text\":\"Hæc dicit Dominus Deus : Lætante universa terra, in solitudinem te redigam :\"},{\"verse\":15,\"text\":\"sicuti gavisus es super hæreditatem domus Israël eo quod fuerit dissipata, sic faciam tibi : dissipatus eris, mons Seir, et Idumæa omnis : et scient quia ego Dominus.\"}],\"summary\":\"The judgment of mount Seir, for their hatred of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":34,\"label\":\"Ezekiel 34\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":36,\"label\":\"Ezekiel 36\"}}]]\n"])</script></body></html>
