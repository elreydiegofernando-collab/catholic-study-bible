-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezekiel<!-- --> <span class="text-stone-500">19</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ezechiel</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EZK/">About <!-- -->Ezekiel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parable of the young lions, and of the vineyard that is wasted.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Moreover take thou up a lamentation for the princes of Israel,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And say: Why did thy mother the lioness lie down among the lions, and bring up her whelps in the midst of young lions?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And she brought out one of her whelps, and he became a lion: and he learned to catch the prey, and to devour men.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the nations heard of him, and took him, but not without receiving wounds: and they brought him in chains into the land of Egypt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But she seeing herself weakened, and that her hope was lost, took one of her young lions, and set him up for a lion.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he went up and down among the lions, and became a lion: and he learned to catch the prey, and to devour men.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He learned to make widows, and to lay waste their cities: and the land became desolate, and the fulness thereof by the noise of his roaring.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the nations came together against him on every side out of the provinces, and they spread their net over him, in their wounds he was taken.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they put him into a cage, they brought him in chains to the king of Babylon: and they cast him into prison, that his voice should no more be heard upon the mountains of Israel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thy mother is like a vine in thy blood planted by the water: her fruit and her branches have grown out of many waters.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And she hath strong rods to make sceptres for them that bear rule, and her stature was exalted among the branches: and she saw her height in the multitude of her branches.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But she was plucked up in wrath, and cast on the ground, and the burning wind dried up her fruit: her strong rods are withered, and dried up: the fire hath devoured her.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And now she is transplanted into the desert, in a land not passable, and dry.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And a fire is gone out from a rod of her branches, which hath devoured her fruit: so that she now hath no strong rod, to be a sceptre of rulers. This is a lamentation, and it shall be for a lamentation.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et tu assume planctum super principes Israël,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et dices : Quare mater tua leæna inter leones cubavit ? in medio leunculorum enutrivit catulos suos ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et eduxit unum de leunculis suis, et leo factus est : et didicit capere prædam, hominemque comedere.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et audierunt de eo gentes : et non absque vulneribus suis ceperunt eum, et adduxerunt eum in catenis in terram Ægypti.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quæ cum vidisset quoniam infirmata est, et periit exspectatio ejus, tulit unum de leunculis suis ; leonem constituit eum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui incedebat inter leones, et factus est leo : et didicit prædam capere, et homines devorare :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>didicit viduas facere, et civitates earum in desertum adducere : et desolata est terra et plenitudo ejus a voce rugitus illius.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et convenerunt adversus eum gentes undique de provinciis, et expanderunt super eum rete suum : in vulneribus earum captus est,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et miserunt eum in caveam : in catenis adduxerunt eum ad regem Babylonis, miseruntque eum in carcerem, ne audiretur vox ejus ultra super montes Israël.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Mater tua quasi vinea in sanguine tuo super aquam plantata est : fructus ejus et frondes ejus creverunt ex aquis multis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et factæ sunt ei virgæ solidæ in sceptra dominantium, et exaltata est statura ejus inter frondes, et vidit altitudinem suam in multitudine palmitum suorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et evulsa est in ira, in terramque projecta, et ventus urens siccavit fructum ejus : marcuerunt et arefactæ sunt virgæ roboris ejus : ignis comedit eam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et nunc transplantata est in desertum, in terra invia et sitienti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et egressus est ignis de virga ramorum ejus, qui fructum ejus comedit : et non fuit in ea virga fortis, sceptrum dominantium. Planctus est, et erit in planctum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/20/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 20</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->19<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Ezekiel 18" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounde nted by the water: her fruit and her branches have grown out of many waters.\"},{\"verse\":11,\"text\":\"And she hath strong rods to make sceptres for them that bear rule, and her stature was exalted among the branches: and she saw her height in the multitude of her branches.\"},{\"verse\":12,\"text\":\"But she was plucked up in wrath, and cast on the ground, and the burning wind dried up her fruit: her strong rods are withered, and dried up: the fire hath devoured her.\"},{\"verse\":13,\"text\":\"And now she is transplanted into the desert, in a land not passable, and dry.\"},{\"verse\":14,\"text\":\"And a fire is gone out from a rod of her branches, which hath devoured her fruit: so that she now hath no strong rod, to be a sceptre of rulers. This is a lamentation, and it shall be for a lamentation.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et tu assume planctum super principes Israël,\"},{\"verse\":2,\"text\":\"et dices : Quare mater tua leæna inter leones cubavit ? in medio leunculorum enutrivit catulos suos ?\"},{\"verse\":3,\"text\":\"Et eduxit unum de leunculis suis, et leo factus est : et didicit capere prædam, hominemque comedere.\"},{\"verse\":4,\"text\":\"Et audierunt de eo gentes : et non absque vulneribus suis ceperunt eum, et adduxerunt eum in catenis in terram Ægypti.\"},{\"verse\":5,\"text\":\"Quæ cum vidisset quoniam infirmata est, et periit exspectatio ejus, tulit unum de leunculis suis ; leonem constituit eum.\"},{\"verse\":6,\"text\":\"Qui incedebat inter leones, et factus est leo : et didicit prædam capere, et homines devorare :\"},{\"verse\":7,\"text\":\"didicit viduas facere, et civitates earum in desertum adducere : et desolata est terra et plenitudo ejus a voce rugitus illius.\"},{\"verse\":8,\"text\":\"Et convenerunt adversus eum gentes undique de provinciis, et expanderunt super eum rete suum : in vulneribus earum captus est,\"},{\"verse\":9,\"text\":\"et miserunt eum in caveam : in catenis adduxerunt eum ad regem Babylonis, miseruntque eum in carcerem, ne audiretur vox ejus ultra super montes Israël.\"},{\"verse\":10,\"text\":\"Mater tua quasi vinea in sanguine tuo super aquam plantata est : fructus ejus et frondes ejus creverunt ex aquis multis.\"},{\"verse\":11,\"text\":\"Et factæ sunt ei virgæ solidæ in sceptra dominantium, et exaltata est statura ejus inter frondes, et vidit altitudinem suam in multitudine palmitum suorum.\"},{\"verse\":12,\"text\":\"Et evulsa est in ira, in terramque projecta, et ventus urens siccavit fructum ejus : marcuerunt et arefactæ sunt virgæ roboris ejus : ignis comedit eam.\"},{\"verse\":13,\"text\":\"Et nunc transplantata est in desertum, in terra invia et sitienti.\"},{\"verse\":14,\"text\":\"Et egressus est ignis de virga ramorum ejus, qui fructum ejus comedit : et non fuit in ea virga fortis, sceptrum dominantium. Planctus est, et erit in planctum.\"}],\"summary\":\"The parable of the young lions, and of the vineyard that is wasted.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":18,\"label\":\"Ezekiel 18\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":20,\"label\":\"Ezekiel 20\"}}]]\n"])</script></body></html>
