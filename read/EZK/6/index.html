"verse"><sup>2</sup>Son of man set thy face towards the mountains of Israel, and prophesy against them.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And say: Ye mountains of Israel, hear the word of the Lord God: Thus saith the Lord God to the mountains, and to the hills, and to the rocks, and the valleys: Behold, I will bring upon you the sword, and I will destroy your high places.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And I will throw down your altars, and your idols shall be broken in pieces: and I will cast down your slain before your idols.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I will lay the dead carcasses of the children of Israel before your idols: and I will scatter your bones round about your altars,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In all your dwelling places. The cities shall be laid waste, and the high places shall be thrown down, and destroyed, and your altars shall be abolished, and shall be broken in pieces: and your idols shall be no more, and your temples shall be destroyed, and your works shall be defaced.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the slain shall fall in the midst of you: and you shall know that I am the Lord.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I will leave in you some that shall escape the sword among the nations, when I shall have scattered you through the countries.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they that are saved of you shall remember me amongst the nations, to which they are carried captives: because I have broken their heart that was faithless, and revolted from me: and their eyes that went a fornicating after their idols: and they shall be displeased with themselves because of the evils which they have committed in all their abominations.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they shall know that I the Lord have not spoken in vain that I would do this evil to them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thus saith the Lord God: Strike with thy hand and stamp with thy foot, and say: Alas, for all the abominations of the evils of the house of Israel: for they shall fall by the sword, by the famine, and by the pestilence.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He that is far off shall die of the pestilence: and he that is near, shall fall by the sword: and he that remaineth, and is besieged, shall die by the famine: and I will accomplish my indignation upon them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And you shall know that I am the Lord, when your slain shall be amongst your idols, round about your altars, in every high hill, and on all the tops of mountains, and under every woody tree, and under every thick oak, the place where they burnt sweet smelling frankincense to all their idols.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And I will stretch forth my hand upon them: and I will make the land desolate, and abandoned from the desert of Deblatha in all their dwelling places: and they shall know that I am the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factus est sermo Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fili hominis, pone faciem tuam ad montes Israël, et prophetabis ad eos,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dices : Montes Israël, audite verbum Domini Dei. Hæc dicit Dominus Deus montibus et collibus, rupibus et vallibus : Ecce ego inducam super vos gladium, et disperdam excelsa vestra,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et demoliar aras vestras, et confringentur simulacra vestra, et dejiciam interfectos vestros ante idola vestra :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et dabo cadavera filiorum Israël ante faciem simulacrorum vestrorum, et dispergam ossa vestra circum aras vestras :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>in omnibus habitationibus vestris urbes desertæ erunt, et excelsa demolientur et dissipabuntur : et interibunt aræ vestræ, et confringentur, et cessabunt idola vestra, et conterentur delubra vestra, et delebuntur opera vestra :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et cadet interfectus in medio vestri, et scietis quia ego sum Dominus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et relinquam in vobis eos qui fugerint gladium in gentibus, cum dispersero vos in terris :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et recordabuntur mei liberati vestri in gentibus ad quas captivi ducti sunt : quia contrivi cor eorum fornicans et recedens a me, et oculos eorum fornicantes post idola sua : et displicebunt sibimet super malis quæ fecerunt in universis abominationibus suis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et scient quia ego Dominus non frustra locutus sum, ut facerem eis malum hoc.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hæc dicit Dominus Deus : Percute manum tuam et allide pedem tuum, et dic : Heu ! ad omnes abominationes malorum domus Israël : quia gladio, fame et peste ruituri sunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui longe est, peste morietur : qui autem prope, gladio corruet : et qui relictus fuerit et obsessus, fame morietur : et complebo indignationem meam in eis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et scietis quia ego Dominus, cum fuerint interfecti vestri in medio idolorum vestrorum, in circuitu ararum vestrarum, in omni colle excelso, et in cunctis summitatibus montium, et subtus omne lignum nemorosum, et subtus universam quercum frondosam, locum ubi accenderunt thura redolentia universis idolis suis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et extendam manum meam super eos : et faciam terram desolatam et destitutam, a deserto Deblatha, in omnibus habitationibus eorum : et scient quia ego Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="blo altars shall be abolished, and shall be broken in pieces: and your idols shall be no more, and your temples shall be destroyed, and your works shall be defaced.\"},{\"verse\":7,\"text\":\"And the slain shall fall in the midst of you: and you shall know that I am the Lord.\"},{\"verse\":8,\"text\":\"And I will leave in you some that shall escape the sword among the nations, when I shall have scattered you through the countries.\"},{\"verse\":9,\"text\":\"And they that are saved of you shall remember me amongst the nations, to which they are carried captives: because I have broken their heart that was faithless, and revolted from me: and their eyes that went a fornicating after their idols: and they shall be displeased with themselves because of the evils which they have committed in all their abominations.\"},{\"verse\":10,\"text\":\"And they shall know that I the Lord have not spoken in vain that I would do this evil to them.\"},{\"verse\":11,\"text\":\"Thus saith the Lord God: Strike with thy hand and stamp with thy foot, and say: Alas, for all the abominations of the evils of the house of Israel: for they shall fall by the sword, by the famine, and by the pestilence.\"},{\"verse\":12,\"text\":\"He that is far off shall die of the pestilence: and he that is near, shall fall by the sword: and he that remaineth, and is besieged, shall die by the famine: and I will accomplish my indignation upon them.\"},{\"verse\":13,\"text\":\"And you shall know that I am the Lord, when your slain shall be amongst your idols, round about your altars, in every high hill, and on all the tops of mountains, and under every woody tree, and under every thick oak, the place where they burnt sweet smelling frankincense to all their idols.\"},{\"verse\":14,\"text\":\"And I will stretch forth my hand upon them: and I will make the land desolate, and abandoned from the desert of Deblatha in all their dwelling places: and they shall know that I am the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factus est sermo Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Fili hominis, pone faciem tuam ad montes Israël, et prophetabis ad eos,\"},{\"verse\":3,\"text\":\"et dices : Montes Israël, audite verbum Domini Dei. Hæc dicit Dominus Deus montibus et collibus, rupibus et vallibus : Ecce ego inducam super vos gladium, et disperdam excelsa vestra,\"},{\"verse\":4,\"text\":\"et demoliar aras vestras, et confringentur simulacra vestra, et dejiciam interfectos vestros ante idola vestra :\"},{\"verse\":5,\"text\":\"et dabo cadavera filiorum Israël ante faciem simulacrorum vestrorum, et dispergam ossa vestra circum aras vestras :\"},{\"verse\":6,\"text\":\"in omnibus habitationibus vestris urbes desertæ erunt, et excelsa demolientur et dissipabuntur : et interibunt aræ vestræ, et confringentur, et cessabunt idola vestra, et conterentur delubra vestra, et delebuntur opera vestra :\"},{\"verse\":7,\"text\":\"et cadet interfectus in medio vestri, et scietis quia ego sum Dominus.\"},{\"verse\":8,\"text\":\"Et relinquam in vobis eos qui fugerint gladium in gentibus, cum dispersero vos in terris :\"},{\"verse\":9,\"text\":\"et recordabuntur mei liberati vestri in gentibus ad quas captivi ducti sunt : quia contrivi cor eorum fornicans et recedens a me, et oculos eorum fornicantes post idola sua : et displicebunt sibimet super malis quæ fecerunt in universis abominationibus suis.\"},{\"verse\":10,\"text\":\"Et scient quia ego Dominus non frustra locutus sum, ut facerem eis malum hoc.\"},{\"verse\":11,\"text\":\"Hæc dicit Dominus Deus : Percute manum tuam et allide pedem tuum, et dic : Heu ! ad omnes abominationes malorum domus Israël : quia gladio, fame et peste ruituri sunt.\"},{\"verse\":12,\"text\":\"Qui longe est, peste morietur : qui autem prope, gladio corruet : et qui relictus fuerit et obsessus, fame morietur : et complebo indignationem meam in eis.\"},{\"verse\":13,\"text\":\"Et scietis quia ego Dominus, cum fuerint interfecti vestri in medio idolorum vestrorum, in circuitu ararum vestrarum, in omni colle excelso, et in cunctis summitatibus montium, et subtus omne lignum nemorosum, et subtus universam quercum frondosam, locum ubi accenderunt thura redolentia universis idolis suis.\"},{\"verse\":14,\"text\":\"Et extendam manum meam super eos : et faciam terram desolatam et destitutam, a deserto Deblatha, in omnibus habitationibus eorum : et scient quia ego Dominus.\"}],\"summary\":\"The punishment of Israel for their idolatry: a remnant shall be saved.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":5,\"label\":\"Ezekiel 5\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":7,\"label\":\"Ezekiel 7\"}}]]\n"])</script></body></html>
