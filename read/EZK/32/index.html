tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezekiel<!-- --> <span class="text-stone-500">32</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ezechiel</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EZK/">About <!-- -->Ezekiel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The prophet’s lamentation for the king of Egypt.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass in the twelfth year, in the twelfth month, in the first day of the month, that the word of the Lord came to me, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Son of man, take up a lamentation for Pharao the king of Egypt, and say to him: Thou art like the lion of the nations, and the dragon that is in the sea: and thou didst push with the horn in thy rivers, and didst trouble the waters with thy feet, and didst trample upon their streams.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Therefore, thus saith the Lord God: I will spread out my net over thee with the multitude of many people, and I will draw thee up in my net.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And I will throw thee out on the land, I will cast thee away into the open field and I will cause all the fowls of the air to dwell upon thee, and I will fill the beasts of all the earth with thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I will lay thy flesh upon the mountains, and will fill thy hills with thy corruption,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And I will water the earth with thy stinking blood upon the mountains, and the valleys shall be filled with thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I will cover the heavens, when thou shalt be put out, and I will make the stars thereof dark: I will cover the sun with a cloud, and the moon shall not give her light.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I will make all the lights of heaven to mourn over thee and I will cause darkness upon thy land, saith the Lord God, when thy wounded shall fall in the midst of the land, saith the Lord God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And I shall provoke to anger the heart of many people, when I shall have brought in thy destruction among the nations upon the lands, which thou knowest not.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And I will make many people to be amazed at thee, and their kings shall be horribly afraid for thee, when my sword shall begin to fly upon their faces: and they shall be astonished on a sudden, every one for his own life, in the day of their ruin.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For thus saith the Lord God: The sword of the king of Babylon shall come upon thee,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>By the swords of the mighty I will overthrow thy multitude: all these nations are invincible: and they shall waste the pride of Egypt, and the multitude thereof shall be destroyed.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I will destroy also all the beasts thereof that were beside the great waters: and the foot of man shall trouble them no more, neither shall the hoof of beasts trouble them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Then will I make their waters clear, and cause their rivers to run like oil, saith the Lord God:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>When I shall have made the land of Egypt desolate: and the land shall be destitute of her fulness, when I shall have struck all the inhabitants thereof and they shall know that I am the Lord.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>This is the lamentation, and they shall lament therewith: the daughters of the nations shall lament therewith for Egypt, and for the multitude thereof they shall lament therewith, saith the Lord God.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And it came to pass in the twelfth year, in the fifteenth day of the month, that the word of the Lord came to me saying:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Son of man, sing a mournful song for the multitude of Egypt: and cast her down, both her, and the daughters of the mighty nations to the lowest part of the earth, with them that go down into the pit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Whom dost thou excel in beauty? go down and sleep with the uncircumcised.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>They shall fall in the midst of them that are slain with the sword: the sword is given, they have drawn her down, and all her people.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The most mighty among the strong ones shall speak to him from the midst of hell, they that went down with his helpers and slept uncircumcised, slain by the sword.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Assur is there, and all his multitude: their graves are round about him, all of them slain, and that fell by the sword.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Whose graves are set in the lowest parts of the pit: and his multitude lay round about his grave: all of them slain, and fallen by the sword, they that heretofore spread terror in the land of the living.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>There is Elam and all his multitude round about his grave, all of them slain, and fallen by the sword; that went down uncircumcised to the lowest parts of the earth: that caused their terror in the land of the living, and they have borne their shame with them that go down into the pit.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In the midst of the slain they have set him a bed among all his people: their graves are round about him: all these are uncircumcised, and slain by the sword: for they spread their terror in the land of the living, and have borne their shame with them that descend into the pit: they are laid in the midst of the slain.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>There is Mosoch, and Thubal, and all their multitude: their graves are round about him: all of them uncircumcised and slain, and fallen by the sword: though they spread their terror in the land of the living.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And they shall not sleep with the brave, and with them that fell uncircumcised, that went down to hell with their weapons, and laid their swords under their heads, and their iniquities were in their bones, because they were the terror of the mighty in the land of the living.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>So thou also shalt be broken in the midst of the uncircumcised, and shalt sleep with them that are slain by the sword.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>There is Edom, and her kings, and all her princes, who with their army are joined with them that are slain by the sword: and have slept with the uncircumcised, and with them that go down into the pit.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>There are all the princes of the north, and all the hunters: who were brought down with the slain, fearing, and confounded in their strength: who slept uncircumcised with them that are slain by the sword, and have borne their shame with them that go down into the pit.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Pharao saw them, and he was comforted concerning all his multitude, which was slain by the sword: Pharao, and all his army, saith the Lord God:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Because I have spread my terror in the land of the living, and he hath slept in the midst of the uncircumcised with them that are slain by the sword: Pharao and all his multitude, saith the Lord God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est, duodecimo anno, in mense duodecimo, in una mensis : factum est verbum Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fili hominis, assume lamentum super Pharaonem regem Ægypti, et dices ad eum : Leoni gentium assimilatus es, et draconi qui est in mari : et ventilabas cornu in fluminibus tuis, et conturbabas aquas pedibus tuis, et conculcabas flumina earum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Propterea hæc dicit Dominus Deus : Expandam super te rete meum in multitudine populorum multorum, et extraham te in sagena mea.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et projiciam te in terram ; super faciem agri abjiciam te : et habitare faciam super te omnia volatilia cæli, et saturabo de te bestias universæ terræ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et dabo carnes tuas super montes, et implebo colles tuos sanie tua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et irrigabo terram fœtore sanguinis tui super montes, et valles implebuntur ex te.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et operiam, cum extinctus fueris, cælum, et nigrescere faciam stellas ejus : solem nube tegam, et luna non dabit lumen suum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnia luminaria cæli mœrere faciam super te, et dabo tenebras super terram tuam, dicit Dominus Deus, cum ceciderint vulnerati tui in medio terræ, ait Dominus Deus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et irritabo cor populorum multorum, cum induxero contritionem tuam in gentibus super terras quas nescis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et stupescere faciam super te populos multos, et reges eorum horrore nimio formidabunt super te, cum volare cœperit gladius meus super facies eorum : et obstupescent repente singuli pro anima sua in die ruinæ tuæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quia hæc dicit Dominus Deus : Gladius regis Babylonis veniet tibi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In gladiis fortium dejiciam multitudinem tuam : inexpugnabiles omnes gentes hæ, et vastabunt superbiam Ægypti, et dissipabitur multitudo ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et perdam omnia jumenta ejus, quæ erant super aquas plurimas : et non conturbabit eas pes hominis ultra, neque ungula jumentorum turbabit eas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tunc purissimas reddam aquas eorum, et flumina eorum quasi oleum adducam, ait Dominus Deus,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>cum dedero terram Ægypti desolatam : deseretur autem terra a plenitudine sua quando percussero omnes habitatores ejus : et scient quia ego Dominus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Planctus est, et plangent eum : filiæ gentium plangent eum : super Ægyptum et super multitudinem ejus plangent eum, ait Dominus Deus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et factum est in duodecimo anno, in quintadecima mensis : factum est verbum Domini ad me, dicens :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Fili hominis, cane lugubre super multitudinem Ægypti : et detrahe eam ipsam, et filias gentium robustarum, ad terram ultimam, cum his qui descendunt in lacum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quo pulchrior es ? descende, et dormi cum incircumcisis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In medio interfectorum gladio cadent ; gladius datus est : attraxerunt eam et omnes populos ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Loquentur ei potentissimi robustorum de medio inferni, qui cum auxiliatoribus ejus descenderunt, et dormierunt incircumcisi interfecti gladio.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ibi Assur, et omnis multitudo ejus : in circuitu illius sepulchra ejus, omnes interfecti, et qui ceciderunt gladio.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quorum data sunt sepulchra in novissimis laci, et facta est multitudo ejus per gyrum sepulchri ejus : universi interfecti, cadentesque gladio, qui dederant quondam formidinem in terra viventium.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ibi Ælam, et omnis multitudo ejus per gyrum sepulchri sui : omnes hi interfecti, ruentesque gladio, qui descenderunt incircumcisi ad terram ultimam ; qui posuerunt terrorem suum in terra viventium, et portaverunt ignominiam suam cum his qui descendunt in lacum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In medio interfectorum posuerunt cubile ejus in universis populis ejus : in circuitu ejus sepulchrum illius : omnes hi incircumcisi, interfectique gladio. Dederunt enim terrorem suum in terra viventium, et portaverunt ignominiam suam cum his qui descendunt in lacum : in medio interfectorum positi sunt.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ibi Mosoch et Thubal, et omnis multitudo ejus : in circuitu ejus sepulchra illius : omnes hi incircumcisi, interfectique et cadentes gladio, quia dederunt formidinem suam in terra viventium.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et non dormient cum fortibus, cadentibusque, et incircumcisis, qui descenderunt ad infernum cum armis suis, et posuerunt gladios suos sub capitibus suis, et fuerunt iniquitates eorum in ossibus eorum : quia terror fortium facti sunt in terra viventium.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et tu ergo in medio incircumcisorum contereris, et dormies cum interfectis gladio.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ibi Idumæa, et reges ejus, et omnes duces ejus, qui dati sunt cum exercitu suo cum interfectis gladio, et qui cum incircumcisis dormierunt, et cum his qui descendunt in lacum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ibi principes aquilonis omnes, et universi venatores, qui deducti sunt cum interfectis, paventes, et in sua fortitudine confusi : qui dormierunt incircumcisi cum interfectis gladio, et portaverunt confusionem suam cum his qui descendunt in lacum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Vidit eos Pharao, et consolatus est super universa multitudine sua, quæ interfecta est gladio : Pharao, et omnis exercitus ejus, ait Dominus Deus.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quia dedi terrorem meum in terra viventium, et dormivit in medio incircumcisorum cum interfectis gladio : Pharao, et omnis multitudo ejus, ait Dominus Deus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/31/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 31</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/33/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 33</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->32<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn ns, and the valleys shall be filled with thee.\"},{\"verse\":7,\"text\":\"And I will cover the heavens, when thou shalt be put out, and I will make the stars thereof dark: I will cover the sun with a cloud, and the moon shall not give her light.\"},{\"verse\":8,\"text\":\"I will make all the lights of heaven to mourn over thee and I will cause darkness upon thy land, saith the Lord God, when thy wounded shall fall in the midst of the land, saith the Lord God.\"},{\"verse\":9,\"text\":\"And I shall provoke to anger the heart of many people, when I shall have brought in thy destruction among the nations upon the lands, which thou knowest not.\"},{\"verse\":10,\"text\":\"And I will make many people to be amazed at thee, and their kings shall be horribly afraid for thee, when my sword shall begin to fly upon their faces: and they shall be astonished on a sudden, every one for his own life, in the day of their ruin.\"},{\"verse\":11,\"text\":\"For thus saith the Lord God: The sword of the king of Babylon shall come upon thee,\"},{\"verse\":12,\"text\":\"By the swords of the mighty I will overthrow thy multitude: all these nations are invincible: and they shall waste the pride of Egypt, and the multitude thereof shall be destroyed.\"},{\"verse\":13,\"text\":\"I will destroy also all the beasts thereof that were beside the great waters: and the foot of man shall trouble them no more, neither shall the hoof of beasts trouble them.\"},{\"verse\":14,\"text\":\"Then will I make their waters clear, and cause their rivers to run like oil, saith the Lord God:\"},{\"verse\":15,\"text\":\"When I shall have made the land of Egypt desolate: and the land shall be destitute of her fulness, when I shall have struck all the inhabitants thereof and they shall know that I am the Lord.\"},{\"verse\":16,\"text\":\"This is the lamentation, and they shall lament therewith: the daughters of the nations shall lament therewith for Egypt, and for the multitude thereof they shall lament therewith, saith the Lord God.\"},{\"verse\":17,\"text\":\"And it came to pass in the twelfth year, in the fifteenth day of the month, that the word of the Lord came to me saying:\"},{\"verse\":18,\"text\":\"Son of man, sing a mournful song for the multitude of Egypt: and cast her down, both her, and the daughters of the mighty nations to the lowest part of the earth, with them that go down into the pit.\"},{\"verse\":19,\"text\":\"Whom dost thou excel in beauty? go down and sleep with the uncircumcised.\"},{\"verse\":20,\"text\":\"They shall fall in the midst of them that are slain with the sword: the sword is given, they have drawn her down, and all her people.\"},{\"verse\":21,\"text\":\"The most mighty among the strong ones shall speak to him from the midst of hell, they that went down with his helpers and slept uncircumcised, slain by the sword.\"},{\"verse\":22,\"text\":\"Assur is there, and all his multitude: their graves are round about him, all of them slain, and that fell by the sword.\"},{\"verse\":23,\"text\":\"Whose graves are set in the lowest parts of the pit: and his multitude lay round about his grave: all of them slain, and fallen by the sword, they that heretofore spread terror in the land of the living.\"},{\"verse\":24,\"text\":\"There is Elam and all his multitude round about his grave, all of them slain, and fallen by the sword; that went down uncircumcised to the lowest parts of the earth: that caused their terror in the land of the living, and they have borne their shame with them that go down into the pit.\"},{\"verse\":25,\"text\":\"In the midst of the slain they have set him a bed among all his people: their graves are round about him: all these are uncircumcised, and slain by the sword: for they spread their terror in the land of the living, and have borne their shame with them that descend into the pit: they are laid in the midst of the slain.\"},{\"verse\":26,\"text\":\"There is Mosoch, and Thubal, and all their multitude: their graves are round about him: all of them uncircumcised and slain, and fallen by the sword: though they spread their terror in the land of the living.\"},{\"verse\":27,\"text\":\"And they shall not sleep with the brave, and with them that fell uncircumcised, that went down to hell with their weapons, and laid their swords under their heads, and their iniquities were in their bones, because they were the terror of the mighty in the land of the living.\"},{\"verse\":28,\"text\":\"So thou also shalt be broken in the midst of the uncircumcised, and shalt sleep with them that are slain by the sword.\"},{\"verse\":29,\"text\":\"There is Edom, and her kings, and all her princes, who with their army are joined with them that are slain by the sword: and have slept with the uncircumcised, and with them that go down into the pit.\"},{\"verse\":30,\"text\":\"There are all the princes of the north, and all the hunters: who were brought down with the slain, fearing, and confounded in their strength: who slept uncircumcised with them that are slain by the sword, and have borne their shame with them that go down into the pit.\"},{\"verse\":31,\"text\":\"Pharao saw them, and he was comforted concerning all his multitude, which was slain by the sword: Pharao, and all his army, saith the Lord God:\"},{\"verse\":32,\"text\":\"Because I have spread my terror in the land of the living, and he hath slept in the midst of the uncircumcised with them that are slain by the sword: Pharao and all his multitude, saith the Lord God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est, duodecimo anno, in mense duodecimo, in una mensis : factum est verbum Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Fili hominis, assume lamentum super Pharaonem regem Ægypti, et dices ad eum : Leoni gentium assimilatus es, et draconi qui est in mari : et ventilabas cornu in fluminibus tuis, et conturbabas aquas pedibus tuis, et conculcabas flumina earum.\"},{\"verse\":3,\"text\":\"Propterea hæc dicit Dominus Deus : Expandam super te rete meum in multitudine populorum multorum, et extraham te in sagena mea.\"},{\"verse\":4,\"text\":\"Et projiciam te in terram ; super faciem agri abjiciam te : et habitare faciam super te omnia volatilia cæli, et saturabo de te bestias universæ terræ.\"},{\"verse\":5,\"text\":\"Et dabo carnes tuas super montes, et implebo colles tuos sanie tua.\"},{\"verse\":6,\"text\":\"Et irrigabo terram fœtore sanguinis tui super montes, et valles implebuntur ex te.\"},{\"verse\":7,\"text\":\"Et operiam, cum extinctus fueris, cælum, et nigrescere faciam stellas ejus : solem nube tegam, et luna non dabit lumen suum.\"},{\"verse\":8,\"text\":\"Omnia luminaria cæli mœrere faciam super te, et dabo tenebras super terram tuam, dicit Dominus Deus, cum ceciderint vulnerati tui in medio terræ, ait Dominus Deus.\"},{\"verse\":9,\"text\":\"Et irritabo cor populorum multorum, cum induxero contritionem tuam in gentibus super terras quas nescis.\"},{\"verse\":10,\"text\":\"Et stupescere faciam super te populos multos, et reges eorum horrore nimio formidabunt super te, cum volare cœperit gladius meus super facies eorum : et obstupescent repente singuli pro anima sua in die ruinæ tuæ.\"},{\"verse\":11,\"text\":\"Quia hæc dicit Dominus Deus : Gladius regis Babylonis veniet tibi.\"},{\"verse\":12,\"text\":\"In gladiis fortium dejiciam multitudinem tuam : inexpugnabiles omnes gentes hæ, et vastabunt superbiam Ægypti, et dissipabitur multitudo ejus.\"},{\"verse\":13,\"text\":\"Et perdam omnia jumenta ejus, quæ erant super aquas plurimas : et non conturbabit eas pes hominis ultra, neque ungula jumentorum turbabit eas.\"},{\"verse\":14,\"text\":\"Tunc purissimas reddam aquas eorum, et flumina eorum quasi oleum adducam, ait Dominus Deus,\"},{\"verse\":15,\"text\":\"cum dedero terram Ægypti desolatam : deseretur autem terra a plenitudine sua quando percussero omnes habitatores ejus : et scient quia ego Dominus.\"},{\"verse\":16,\"text\":\"Planctus est, et plangent eum : filiæ gentium plangent eum : super Ægyptum et super multitudinem ejus plangent eum, ait Dominus Deus.\"},{\"verse\":17,\"text\":\"Et factum est in duodecimo anno, in quintadecima mensis : factum est verbum Domini ad me, dicens :\"},{\"verse\":18,\"text\":\"Fili hominis, cane lugubre super multitudinem Ægypti : et detrahe eam ipsam, et filias gentium robustarum, ad terram ultimam, cum his qui descendunt in lacum.\"},{\"verse\":19,\"text\":\"Quo pulchrior es ? descende, et dormi cum incircumcisis.\"},{\"verse\":20,\"text\":\"In medio interfectorum gladio cadent ; gladius datus est : attraxerunt eam et omnes populos ejus.\"},{\"verse\":21,\"text\":\"Loquentur ei potentissimi robustorum de medio inferni, qui cum auxiliatoribus ejus descenderunt, et dormierunt incircumcisi interfecti gladio.\"},{\"verse\":22,\"text\":\"Ibi Assur, et omnis multitudo ejus : in circuitu illius sepulchra ejus, omnes interfecti, et qui ceciderunt gladio.\"},{\"verse\":23,\"text\":\"Quorum data sunt sepulchra in novissimis laci, et facta est multitudo ejus per gyrum sepulchri ejus : universi interfecti, cadentesque gladio, qui dederant quondam formidinem in terra viventium.\"},{\"verse\":24,\"text\":\"Ibi Ælam, et omnis multitudo ejus per gyrum sepulchri sui : omnes hi interfecti, ruentesque gladio, qui descenderunt incircumcisi ad terram ultimam ; qui posuerunt terrorem suum in terra viventium, et portaverunt ignominiam suam cum his qui descendunt in lacum.\"},{\"verse\":25,\"text\":\"In medio interfectorum posuerunt cubile ejus in universis populis ejus : in circuitu ejus sepulchrum illius : omnes hi incircumcisi, interfectique gladio. Dederunt enim terrorem suum in terra viventium, et portaverunt ignominiam suam cum his qui descendunt in lacum : in medio interfectorum positi sunt.\"},{\"verse\":26,\"text\":\"Ibi Mosoch et Thubal, et omnis multitudo ejus : in circuitu ejus sepulchra illius : omnes hi incircumcisi, interfectique et cadentes gladio, quia dederunt formidinem suam in terra viventium.\"},{\"verse\":27,\"text\":\"Et non dormient cum fortibus, cadentibusque, et incircumcisis, qui descenderunt ad infernum cum armis suis, et posuerunt gladios suos sub capitibus suis, et fuerunt iniquitates eorum in ossibus eorum : quia terror fortium facti sunt in terra viventium.\"},{\"verse\":28,\"text\":\"Et tu ergo in medio incircumcisorum contereris, et dormies cum interfectis gladio.\"},{\"verse\":29,\"text\":\"Ibi Idumæa, et reges ejus, et omnes duces ejus, qui dati sunt cum exercitu suo cum interfectis gladio, et qui cum incircumcisis dormierunt, et cum his qui descendunt in lacum.\"},{\"verse\":30,\"text\":\"Ibi principes aquilonis omnes, et universi venatores, qui deducti sunt cum interfectis, paventes, et in sua fortitudine confusi : qui dormierunt incircumcisi cum interfectis gladio, et portaverunt confusionem suam cum his qui descendunt in lacum.\"},{\"verse\":31,\"text\":\"Vidit eos Pharao, et consolatus est super universa multitudine sua, quæ interfecta est gladio : Pharao, et omnis exercitus ejus, ait Dominus Deus.\"},{\"verse\":32,\"text\":\"Quia dedi terrorem meum in terra viventium, et dormivit in medio incircumcisorum cum interfectis gladio : Pharao, et omnis multitudo ejus, ait Dominus Deus.\"}],\"summary\":\"The prophet’s lamentation for the king of Egypt.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":31,\"label\":\"Ezekiel 31\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":33,\"label\":\"Ezekiel 33\"}}]]\n"])</script></body></html>
