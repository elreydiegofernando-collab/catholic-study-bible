up>2</sup>And thou son of man, thus saith the Lord God to the land of Israel: The end is come, the end is come upon the four quarters of the land.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Now is an end come upon thee, and I will send my wrath upon thee, and I will judge thee according to thy ways: and I will set all thy abominations against thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And my eye shall not spare thee, and I will shew thee no pity: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thus saith the Lord God: One affliction, behold an affliction is come.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>An end is come, the end is come, it hath awaked against thee: behold it is come.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Destruction is come upon thee that dwellest in the land: the time is come, the day of slaughter is near, and not of the joy of mountains.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Now very shortly I will pour out my wrath upon thee, and I will accomplish my anger in thee: and I will judge thee according to thy ways, and I will lay upon thee all thy crimes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And my eye shall not spare, neither will I shew mercy: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord that strike.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Behold the day, behold it is come: destruction is gone forth, the rod hath blossomed, pride hath budded.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Iniquity is risen up into a rod of impiety: nothing of them shall remain, nor of their people, nor of the noise of them: and there shall be no rest among them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The time is come, the day is at hand: let not the buyer rejoice: nor the seller mourn: for wrath is upon all the people thereof.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the seller shall not return to that which he hath sold, although their life be yet among the living. For the vision which regardeth all the multitude thereof, shall not go back: neither shall man be strengthened in the iniquity of his life.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Blow the trumpet, let all be made ready, yet there is none to go to the battle: for my wrath shall be upon all the people thereof.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The sword without: and the pestilence, and the famine within: he that is in the field shall die by the sword: and they that are in the city, shall be devoured by the pestilence, and the famine.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And such of them as shall flee shall escape: and they shall be in the mountains like doves of the valleys, all of them trembling, every one for his iniquity.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>All hands shall be made feeble, and all knees shall run with water.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they shall gird themselves with haircloth, and fear shall cover them and shame shall be upon every face, and baldness upon all their heads.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Their silver shall be cast forth, and their gold shall become a dunghill. Their silver and their gold shall not be able to deliver them in the day of the wrath of the Lord. They shall not satisfy their soul, and their bellies shall not be filled: because it hath been the stumblingblock of their iniquity.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they have turned the ornament of their jewels into pride, and have made of it the images of their abominations, and idols: therefore I have made it an uncleanness to them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I will give it into the hands of strangers for spoil, and to the wicked of the earth for a prey, and they shall defile it.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And I will turn away my face from them, and they shall violate my secret place: and robbers shall enter into it, and defile it.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Make a shutting up: for the land is full of the judgment of blood, and the city is full of iniquity.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And I will bring the worst of the nations, and they shall possess their houses: and I will make the pride of the mighty to cease, and they shall possess their sanctuary.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>When distress cometh upon them, they will seek for peace and there shall be none.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Trouble shall come upon trouble, and rumour upon rumour, and they shall seek a vision of the prophet, and the law shall perish from the priest, and counsel from the ancients.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The king shall mourn, and the prince shall be clothed with sorrow, and the hands of the people of the land shall be troubled. I will do to them according to their way, and will judge them according to their judgments: and they shall know that I am the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factus est sermo Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et tu, fili hominis, hæc dicit Dominus Deus terræ Israël : Finis venit : venit finis super quatuor plagas terræ.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Nunc finis super te, et immittam furorem meum in te : et judicabo te juxta vias tuas, et ponam contra te omnes abominationes tuas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et non parcet oculus meus super te, et non miserebor : sed vias tuas ponam super te, et abominationes tuæ in medio tui erunt, et scietis quia ego Dominus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hæc dicit Dominus Deus : Afflictio una, afflictio ecce venit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Finis venit, venit finis : evigilavit adversum te, ecce venit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venit contritio super te, qui habitas in terra : venit tempus, prope est dies occisionis, et non gloriæ montium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nunc de propinquo effundam iram meam super te, et complebo furorem meum in te : et judicabo te juxta vias tuas, et imponam tibi omnia scelera tua,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et non parcet oculus meus, nec miserebor : sed vias tuas imponam tibi, et abominationes tuæ in medio tui erunt, et scietis quia ego sum Dominus percutiens.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ecce dies, ecce venit : egressa est contritio, floruit virga, germinavit superbia,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>iniquitas surrexit in virga impietatis : non ex eis, et non ex populo, neque ex sonitu eorum : et non erit requies in eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Venit tempus, appropinquavit dies : qui emit, non lætetur, et qui vendit, non lugeat : quia ira super omnem populum ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quia qui vendit, ad id quod vendidit non revertetur : et adhuc in viventibus vita eorum : visio enim ad omnem multitudinem ejus non regredietur, et vir in iniquitate vitæ suæ non confortabitur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Canite tuba, præparentur omnes : et non est qui vadat ad prælium : ira enim mea super universum populum ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gladium foris, et pestis et fames intrinsecus : qui in agro est, gladio morietur, et qui in civitate, pestilentia et fame devorabuntur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et salvabuntur qui fugerint ex eis : et erunt in montibus quasi columbæ convallium omnes trepidi, unusquisque in iniquitate sua.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Omnes manus dissolventur, et omnia genua fluent aquis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et accingent se ciliciis, et operiet eos formido : et in omni facie confusio, et in universis capitibus eorum calvitium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Argentum eorum foras projicietur, et aurum eorum in sterquilinium erit : argentum eorum et aurum eorum non valebit liberare eos in die furoris Domini : animam suam non saturabunt, et ventres eorum non implebuntur, quia scandalum iniquitatis eorum factum est.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et ornamentum monilium suorum in superbiam posuerunt, et imagines abominationum suarum et simulacrorum fecerunt ex eo : propter hoc dedi eis illud in immunditiam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et dabo illud in manus alienorum ad diripiendum, et impiis terræ in prædam, et contaminabunt illud.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et avertam faciem meam ab eis, et violabunt arcanum meum : et introibunt in illud emissarii, et contaminabunt illud.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Fac conclusionem, quoniam terra plena est judicio sanguinum, et civitas plena iniquitate.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et adducam pessimos de gentibus, et possidebunt domos eorum : et quiescere faciam superbiam potentium, et possidebunt sanctuaria eorum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Angustia superveniente, requirent pacem, et non erit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Conturbatio super conturbationem veniet, et auditus super auditum : et quærent visionem de propheta, et lex peribit a sacerdote, et consilium a senioribus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Rex lugebit, et princeps induetur mœrore, et manus populi terræ conturbabuntur : secundum viam eorum faciam eis, et secundum judicia eorum judicabo eos, et scient quia ego Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Ezekiel 6" class="inline-flex h-12 w-14 shrink-0 items-center justify-center roun self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"EZK.7\",{\"bookId\":31,\"usfm\":\"EZK\",\"bookName\":\"Ezekiel\",\"drName\":\"Ezechiel\",\"chapter\":7,\"totalChapters\":48,\"dra\":[{\"verse\":1,\"text\":\"And the word of the Lord came to me, saying:\"},{\"verse\":2,\"text\":\"And thou son of man, thus saith the Lord God to the land of Israel: The end is come, the end is come upon the four quarters of the land.\"},{\"verse\":3,\"text\":\"Now is an end come upon thee, and I will send my wrath upon thee, and I will judge thee according to thy ways: and I will set all thy abominations against thee.\"},{\"verse\":4,\"text\":\"And my eye shall not spare thee, and I will shew thee no pity: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord.\"},{\"verse\":5,\"text\":\"Thus saith the Lord God: One affliction, behold an affliction is come.\"},{\"verse\":6,\"text\":\"An end is come, the end is come, it hath awaked against thee: behold it is come.\"},{\"verse\":7,\"text\":\"Destruction is come upon thee that dwellest in the land: the time is come, the day of slaughter is near, and not of the joy of mountains.\"},{\"verse\":8,\"text\":\"Now very shortly I will pour out my wrath upon thee, and I will accomplish my anger in thee: and I will judge thee according to thy ways, and I will lay upon thee all thy crimes.\"},{\"verse\":9,\"text\":\"And my eye shall not spare, neither will I shew mercy: but I will lay thy ways upon thee, and thy abominations shall be in the midst of thee: and you shall know that I am the Lord that strike.\"},{\"verse\":10,\"text\":\"Behold the day, behold it is come: destruction is gone forth, the rod hath blossomed, pride hath budded.\"},{\"verse\":11,\"text\":\"Iniquity is risen up into a rod of impiety: nothing of them shall remain, nor of their people, nor of the noise of them: and there shall be no rest among them.\"},{\"verse\":12,\"text\":\"The time is come, the day is at hand: let not the buyer rejoice: nor the seller mourn: for wrath is upon all the people thereof.\"},{\"verse\":13,\"text\":\"For the seller shall not return to that which he hath sold, although their life be yet among the living. For the vision which regardeth all the multitude thereof, shall not go back: neither shall man be strengthened in the iniquity of his life.\"},{\"verse\":14,\"text\":\"Blow the trumpet, let all be made ready, yet there is none to go to the battle: for my wrath shall be upon all the people thereof.\"},{\"verse\":15,\"text\":\"The sword without: and the pestilence, and the famine within: he that is in the field shall die by the sword: and they that are in the city, shall be devoured by the pestilence, and the famine.\"},{\"verse\":16,\"text\":\"And such of them as shall flee shall escape: and they shall be in the mountains like doves of the valleys, all of them trembling, every one for his iniquity.\"},{\"verse\":17,\"text\":\"All hands shall be made feeble, and all knees shall run with water.\"},{\"verse\":18,\"text\":\"And they shall gird themselves with haircloth, and fear shall cover them and shame shall be upon every face, and baldness upon all their heads.\"},{\"verse\":19,\"text\":\"Their silver shall be cast forth, and their gold shall become a dunghill. Their silver and their gold shall not be able to deliver them in the day of the wrath of the Lord. They shall not satisfy their soul, and their bellies shall not be filled: because it hath been the stumblingblock of their iniquity.\"},{\"verse\":20,\"text\":\"And they have turned the ornament of their jewels into pride, and have made of it the images of their abominations, and idols: therefore I have made it an uncleanness to them.\"},{\"verse\":21,\"text\":\"And I will give it into the hands of strangers for spoil, and to the wicked of the earth for a prey, and they shall defile it.\"},{\"verse\":22,\"text\":\"And I will turn away my face from them, and they shall violate my secret place: and robbers shall enter into it, and defile it.\"},{\"verse\":23,\"text\":\"Make a shutting up: for the land is full of the judgment of blood, and the city is full of iniquity.\"},{\"verse\":24,\"text\":\"And I will bring the worst of the nations, and they shall possess their houses: and I will make the pride of the mighty to cease, and they shall possess their sanctuary.\"},{\"verse\":25,\"text\":\"When distress cometh upon them, they will seek for peace and there shall be none.\"},{\"verse\":26,\"text\":\"Trouble shall come upon trouble, and rumour upon rumour, and they shall seek a vision of the prophet, and the law shall perish from the priest, and counsel from the ancients.\"},{\"verse\":27,\"text\":\"The king shall mourn, and the prince shall be clothed with sorrow, and the hands of the people of the land shall be troubled. I will do to them according to their way, and will judge them according to their judgments: and they shall know that I am the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factus est sermo Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Et tu, fili hominis, hæc dicit Dominus Deus terræ Israël : Finis venit : venit finis super quatuor plagas terræ.\"},{\"verse\":3,\"text\":\"Nunc finis super te, et immittam furorem meum in te : et judicabo te juxta vias tuas, et ponam contra te omnes abominationes tuas.\"},{\"verse\":4,\"text\":\"Et non parcet oculus meus super te, et non miserebor : sed vias tuas ponam super te, et abominationes tuæ in medio tui erunt, et scietis quia ego Dominus.\"},{\"verse\":5,\"text\":\"Hæc dicit Dominus Deus : Afflictio una, afflictio ecce venit.\"},{\"verse\":6,\"text\":\"Finis venit, venit finis : evigilavit adversum te, ecce venit.\"},{\"verse\":7,\"text\":\"Venit contritio super te, qui habitas in terra : venit tempus, prope est dies occisionis, et non gloriæ montium.\"},{\"verse\":8,\"text\":\"Nunc de propinquo effundam iram meam super te, et complebo furorem meum in te : et judicabo te juxta vias tuas, et imponam tibi omnia scelera tua,\"},{\"verse\":9,\"text\":\"et non parcet oculus meus, nec miserebor : sed vias tuas imponam tibi, et abominationes tuæ in medio tui erunt, et scietis quia ego sum Dominus percutiens.\"},{\"verse\":10,\"text\":\"Ecce dies, ecce venit : egressa est contritio, floruit virga, germinavit superbia,\"},{\"verse\":11,\"text\":\"iniquitas surrexit in virga impietatis : non ex eis, et non ex populo, neque ex sonitu eorum : et non erit requies in eis.\"},{\"verse\":12,\"text\":\"Venit tempus, appropinquavit dies : qui emit, non lætetur, et qui vendit, non lugeat : quia ira super omnem populum ejus.\"},{\"verse\":13,\"text\":\"Quia qui vendit, ad id quod vendidit non revertetur : et adhuc in viventibus vita eorum : visio enim ad omnem multitudinem ejus non regredietur, et vir in iniquitate vitæ suæ non confortabitur.\"},{\"verse\":14,\"text\":\"Canite tuba, præparentur omnes : et non est qui vadat ad prælium : ira enim mea super universum populum ejus.\"},{\"verse\":15,\"text\":\"Gladium foris, et pestis et fames intrinsecus : qui in agro est, gladio morietur, et qui in civitate, pestilentia et fame devorabuntur.\"},{\"verse\":16,\"text\":\"Et salvabuntur qui fugerint ex eis : et erunt in montibus quasi columbæ convallium omnes trepidi, unusquisque in iniquitate sua.\"},{\"verse\":17,\"text\":\"Omnes manus dissolventur, et omnia genua fluent aquis.\"},{\"verse\":18,\"text\":\"Et accingent se ciliciis, et operiet eos formido : et in omni facie confusio, et in universis capitibus eorum calvitium.\"},{\"verse\":19,\"text\":\"Argentum eorum foras projicietur, et aurum eorum in sterquilinium erit : argentum eorum et aurum eorum non valebit liberare eos in die furoris Domini : animam suam non saturabunt, et ventres eorum non implebuntur, quia scandalum iniquitatis eorum factum est.\"},{\"verse\":20,\"text\":\"Et ornamentum monilium suorum in superbiam posuerunt, et imagines abominationum suarum et simulacrorum fecerunt ex eo : propter hoc dedi eis illud in immunditiam.\"},{\"verse\":21,\"text\":\"Et dabo illud in manus alienorum ad diripiendum, et impiis terræ in prædam, et contaminabunt illud.\"},{\"verse\":22,\"text\":\"Et avertam faciem meam ab eis, et violabunt arcanum meum : et introibunt in illud emissarii, et contaminabunt illud.\"},{\"verse\":23,\"text\":\"Fac conclusionem, quoniam terra plena est judicio sanguinum, et civitas plena iniquitate.\"},{\"verse\":24,\"text\":\"Et adducam pessimos de gentibus, et possidebunt domos eorum : et quiescere faciam superbiam potentium, et possidebunt sanctuaria eorum.\"},{\"verse\":25,\"text\":\"Angustia superveniente, requirent pacem, et non erit.\"},{\"verse\":26,\"text\":\"Conturbatio super conturbationem veniet, et auditus super auditum : et quærent visionem de propheta, et lex peribit a sacerdote, et consilium a senioribus.\"},{\"verse\":27,\"text\":\"Rex lugebit, et princeps induetur mœrore, et manus populi terræ conturbabuntur : secundum viam eorum faciam eis, et secundum judicia eorum judicabo eos, et scient quia ego Dominus.\"}],\"summary\":\"The final desolation of Israel: from which few shall escape.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":6,\"label\":\"Ezekiel 6\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":8,\"label\":\"Ezekiel 8\"}}]]\n"])</script></body></html>
