m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezekiel<!-- --> <span class="text-stone-500">46</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ezechiel</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Other ordinances for the prince and for the sacrifices.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Thus saith the Lord God: The gate of the inner court that looketh toward the east, shall be shut the six days, on which work is done; but on the sabbath day it shall be opened, yea and on the day of the new moon it shall be opened.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the prince shall enter by the way of the porch of the gate from without, and he shall stand at the threshold of the gate: and the priests shall offer his holocaust, and his peace offerings: and he shall adore upon the threshold of the gate, and shall go out: but the gate shall not be shut till the evening.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the people of the land shall adore at the door of that gate before the Lord on the sabbaths, and on the new moons.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the holocaust that the prince shall offer to the Lord on the sabbath day, shall be six lambs without blemish, and a ram without blemish.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the sacrifice of an ephi for a ram: but for the lambs what sacrifice his hand shall allow: and a hin of oil for every ephi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And on the day of the new moon a calf of the herd without blemish: and the six lambs, and the rams shall be without blemish.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he shall offer in sacrifice an ephi for a calf, an ephi also for a ram: but for the lambs, as his hand shall find: and a hin of oil for every ephi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the prince is to go in, let him go in by the way of the porch of the gate, and let him go out the same way.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But when the people of the land shall go in before the Lord in the solemn feasts, he that goeth in by the north gate to adore, shall go out by the way of the south gate; and he that goeth in by the way of the south gate, shall go out by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go out at that over against it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the prince in the midst of them, shall go in when they go in, and go out when they go out.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And in the fairs, and in the solemnities there shall be the sacrifice of an ephi to a calf, and an ephi to a ram: and to the lambs, the sacrifice shall be as his hand shall find: and a hin of oil to every ephi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But when the prince shall offer a voluntary holocaust, or voluntary peace offering to the Lord: the gate that looketh towards the east shall be opened to him, and he shall offer his holocaust, and his peace offerings, as it is wont to be done on the sabbath day: and he shall go out, and the gate shall be shut after he is gone forth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he shall offer every day for a holocaust to the Lord, a lamb of the same year without blemish: he shall offer it always in the morning.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he shall offer the sacrifice for it morning by morning, the sixth part of an ephi: and the third part of a hin of oil to be mingled with the fine flour: a sacrifice to the Lord by ordinance continual and everlasting.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He shall offer the lamb, and the sacrifice, and the oil morning by morning: an everlasting holocaust.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thus saith the Lord God: If the prince give a gift to any of his sons: the inheritance of it shall go to his children, they shall possess it by inheritance.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But if he give a legacy out of his inheritance to one of his servants, it shall be his until the year of release, and it shall return to the prince: but his inheritance shall go to his sons.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the prince shall not take of the people’s inheritance by violence, nor of their possession: but out of his own possession he shall give an inheritance to his sons: that my people be not dispersed every man from his possession.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he brought me in by the entry that was at the side of the gate, into the chambers of the sanctuary that were for the priests, which looked toward the north. And there was a place bending to the west.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he said to me: This is the place where the priests shall boil the sin offering, and the trespass offering: where they shall dress the sacrifice, that they may not bring it out into the outward court, and the people be sanctified.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he brought me into the outward court, and he led me about by the four corners of the court: and behold there was a little court in the corner of the court, to every corner of the court there was a little court.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In the four corners of the court were little courts disposed, forty cubits long, and thirty broad, all the four were of one measure.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And there was a wall round about compassing the four little courts, and there were kitchens built under the rows round about.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he said to me: This is the house of the kitchens wherein the ministers of the house of the Lord shall boil the victims of the people.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc dicit Dominus Deus : Porta atrii interioris quæ respicit ad orientem, erit clausa sex diebus in quibus opus fit : die autem sabbati aperietur, sed et in die calendarum aperietur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et intrabit princeps per viam vestibuli portæ deforis, et stabit in limine portæ : et facient sacerdotes holocaustum ejus, et pacifica ejus : et adorabit super limen portæ, et egredietur : porta autem non claudetur usque ad vesperam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et adorabit populus terræ ad ostium portæ illius in sabbatis et in calendis coram Domino.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Holocaustum autem hoc offeret princeps Domino : in die sabbati, sex agnos immaculatos, et arietem immaculatum,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et sacrificium ephi per arietem, in agnis autem sacrificium quod dederit manus ejus, et olei hin per singula ephi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In die autem calendarum vitulum de armento immaculatum, et sex agni et arietes immaculati erunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ephi per vitulum, ephi quoque per arietem faciet sacrificium : de agnis autem sicut invenerit manus ejus, et olei hin per singula ephi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cumque ingressurus est princeps, per viam vestibuli portæ ingrediatur, et per eamdem viam exeat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et cum intrabit populus terræ in conspectu Domini in solemnitatibus, qui ingreditur per portam aquilonis ut adoret, egrediatur per viam portæ meridianæ : porro qui ingreditur per viam portæ meridianæ, egrediatur per viam portæ aquilonis. Non revertetur per viam portæ per quam ingressus est, sed e regione illius egredietur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Princeps autem in medio eorum cum ingredientibus ingredietur, et cum egredientibus egredietur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et in nundinis, et in solemnitatibus, erit sacrificium ephi per vitulum, et ephi per arietem : agnis autem erit sacrificium sicut invenerit manus ejus, et olei hin per singula ephi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum autem fecerit princeps spontaneum holocaustum, aut pacifica voluntaria Domino, aperietur ei porta quæ respicit ad orientem, et faciet holocaustum suum et pacifica sua, sicut fieri solet in die sabbati : et egredietur, claudeturque porta postquam exierit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et agnum ejusdem anni immaculatum faciet holocaustum quotidie Domino : semper mane faciet illud.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et faciet sacrificium super eo cata mane mane sextam partem ephi, et de oleo tertiam partem hin, ut misceatur similæ : sacrificium Domino legitimum, juge atque perpetuum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Faciet agnum, et sacrificium, et oleum cata mane mane, holocaustum sempiternum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hæc dicit Dominus Deus : Si dederit princeps donum alicui de filiis suis, hæreditas ejus filiorum suorum erit : possidebunt eam hæreditarie.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si autem dederit legatum de hæreditate sua uni servorum suorum, erit illius usque ad annum remissionis, et revertetur ad principem : hæreditas autem ejus filiis ejus erit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et non accipiet princeps de hæreditate populi per violentiam, et de possessione eorum : sed de possessione sua hæreditatem dabit filiis suis, ut non dispergatur populus meus unusquisque a possessione sua.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et introduxit me per ingressum qui erat ex latere portæ, in gazophylacia sanctuarii ad sacerdotes, quæ respiciebant ad aquilonem : et erat ibi locus vergens ad occidentem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et dixit ad me : Iste est locus ubi coquent sacerdotes pro peccato et pro delicto : ubi coquent sacrificium, ut non efferant in atrium exterius, et sanctificetur populus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et eduxit me in atrium exterius, et circumduxit me per quatuor angulos atrii : et ecce atriolum erat in angulo atrii, atriola singula per angulos atrii.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In quatuor angulis atrii atriola disposita, quadraginta cubitorum per longum, et triginta per latum : mensuræ unius quatuor erant.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et paries per circuitum ambiens quatuor atriola : et culinæ fabricatæ erant subter porticus per gyrum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et dixit ad me : Hæc est domus culinarum, in qua coquent ministri domus Domini victimas populi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/45/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 45</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/47/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 47</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->46<!-- --> of <!-- -->48<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-cen png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"EZK.46\",{\"bookId\":31,\"usfm\":\"EZK\",\"bookName\":\"Ezekiel\",\"drName\":\"Ezechiel\",\"chapter\":46,\"totalChapters\":48,\"dra\":[{\"verse\":1,\"text\":\"Thus saith the Lord God: The gate of the inner court that looketh toward the east, shall be shut the six days, on which work is done; but on the sabbath day it shall be opened, yea and on the day of the new moon it shall be opened.\"},{\"verse\":2,\"text\":\"And the prince shall enter by the way of the porch of the gate from without, and he shall stand at the threshold of the gate: and the priests shall offer his holocaust, and his peace offerings: and he shall adore upon the threshold of the gate, and shall go out: but the gate shall not be shut till the evening.\"},{\"verse\":3,\"text\":\"And the people of the land shall adore at the door of that gate before the Lord on the sabbaths, and on the new moons.\"},{\"verse\":4,\"text\":\"And the holocaust that the prince shall offer to the Lord on the sabbath day, shall be six lambs without blemish, and a ram without blemish.\"},{\"verse\":5,\"text\":\"And the sacrifice of an ephi for a ram: but for the lambs what sacrifice his hand shall allow: and a hin of oil for every ephi.\"},{\"verse\":6,\"text\":\"And on the day of the new moon a calf of the herd without blemish: and the six lambs, and the rams shall be without blemish.\"},{\"verse\":7,\"text\":\"And he shall offer in sacrifice an ephi for a calf, an ephi also for a ram: but for the lambs, as his hand shall find: and a hin of oil for every ephi.\"},{\"verse\":8,\"text\":\"And when the prince is to go in, let him go in by the way of the porch of the gate, and let him go out the same way.\"},{\"verse\":9,\"text\":\"But when the people of the land shall go in before the Lord in the solemn feasts, he that goeth in by the north gate to adore, shall go out by the way of the south gate; and he that goeth in by the way of the south gate, shall go out by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go out at that over against it.\"},{\"verse\":10,\"text\":\"And the prince in the midst of them, shall go in when they go in, and go out when they go out.\"},{\"verse\":11,\"text\":\"And in the fairs, and in the solemnities there shall be the sacrifice of an ephi to a calf, and an ephi to a ram: and to the lambs, the sacrifice shall be as his hand shall find: and a hin of oil to every ephi.\"},{\"verse\":12,\"text\":\"But when the prince shall offer a voluntary holocaust, or voluntary peace offering to the Lord: the gate that looketh towards the east shall be opened to him, and he shall offer his holocaust, and his peace offerings, as it is wont to be done on the sabbath day: and he shall go out, and the gate shall be shut after he is gone forth.\"},{\"verse\":13,\"text\":\"And he shall offer every day for a holocaust to the Lord, a lamb of the same year without blemish: he shall offer it always in the morning.\"},{\"verse\":14,\"text\":\"And he shall offer the sacrifice for it morning by morning, the sixth part of an ephi: and the third part of a hin of oil to be mingled with the fine flour: a sacrifice to the Lord by ordinance continual and everlasting.\"},{\"verse\":15,\"text\":\"He shall offer the lamb, and the sacrifice, and the oil morning by morning: an everlasting holocaust.\"},{\"verse\":16,\"text\":\"Thus saith the Lord God: If the prince give a gift to any of his sons: the inheritance of it shall go to his children, they shall possess it by inheritance.\"},{\"verse\":17,\"text\":\"But if he give a legacy out of his inheritance to one of his servants, it shall be his until the year of release, and it shall return to the prince: but his inheritance shall go to his sons.\"},{\"verse\":18,\"text\":\"And the prince shall not take of the people’s inheritance by violence, nor of their possession: but out of his own possession he shall give an inheritance to his sons: that my people be not dispersed every man from his possession.\"},{\"verse\":19,\"text\":\"And he brought me in by the entry that was at the side of the gate, into the chambers of the sanctuary that were for the priests, which looked toward the north. And there was a place bending to the west.\"},{\"verse\":20,\"text\":\"And he said to me: This is the place where the priests shall boil the sin offering, and the trespass offering: where they shall dress the sacrifice, that they may not bring it out into the outward court, and the people be sanctified.\"},{\"verse\":21,\"text\":\"And he brought me into the outward court, and he led me about by the four corners of the court: and behold there was a little court in the corner of the court, to every corner of the court there was a little court.\"},{\"verse\":22,\"text\":\"In the four corners of the court were little courts disposed, forty cubits long, and thirty broad, all the four were of one measure.\"},{\"verse\":23,\"text\":\"And there was a wall round about compassing the four little courts, and there were kitchens built under the rows round about.\"},{\"verse\":24,\"text\":\"And he said to me: This is the house of the kitchens wherein the ministers of the house of the Lord shall boil the victims of the people.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc dicit Dominus Deus : Porta atrii interioris quæ respicit ad orientem, erit clausa sex diebus in quibus opus fit : die autem sabbati aperietur, sed et in die calendarum aperietur.\"},{\"verse\":2,\"text\":\"Et intrabit princeps per viam vestibuli portæ deforis, et stabit in limine portæ : et facient sacerdotes holocaustum ejus, et pacifica ejus : et adorabit super limen portæ, et egredietur : porta autem non claudetur usque ad vesperam.\"},{\"verse\":3,\"text\":\"Et adorabit populus terræ ad ostium portæ illius in sabbatis et in calendis coram Domino.\"},{\"verse\":4,\"text\":\"Holocaustum autem hoc offeret princeps Domino : in die sabbati, sex agnos immaculatos, et arietem immaculatum,\"},{\"verse\":5,\"text\":\"et sacrificium ephi per arietem, in agnis autem sacrificium quod dederit manus ejus, et olei hin per singula ephi.\"},{\"verse\":6,\"text\":\"In die autem calendarum vitulum de armento immaculatum, et sex agni et arietes immaculati erunt.\"},{\"verse\":7,\"text\":\"Et ephi per vitulum, ephi quoque per arietem faciet sacrificium : de agnis autem sicut invenerit manus ejus, et olei hin per singula ephi.\"},{\"verse\":8,\"text\":\"Cumque ingressurus est princeps, per viam vestibuli portæ ingrediatur, et per eamdem viam exeat.\"},{\"verse\":9,\"text\":\"Et cum intrabit populus terræ in conspectu Domini in solemnitatibus, qui ingreditur per portam aquilonis ut adoret, egrediatur per viam portæ meridianæ : porro qui ingreditur per viam portæ meridianæ, egrediatur per viam portæ aquilonis. Non revertetur per viam portæ per quam ingressus est, sed e regione illius egredietur.\"},{\"verse\":10,\"text\":\"Princeps autem in medio eorum cum ingredientibus ingredietur, et cum egredientibus egredietur.\"},{\"verse\":11,\"text\":\"Et in nundinis, et in solemnitatibus, erit sacrificium ephi per vitulum, et ephi per arietem : agnis autem erit sacrificium sicut invenerit manus ejus, et olei hin per singula ephi.\"},{\"verse\":12,\"text\":\"Cum autem fecerit princeps spontaneum holocaustum, aut pacifica voluntaria Domino, aperietur ei porta quæ respicit ad orientem, et faciet holocaustum suum et pacifica sua, sicut fieri solet in die sabbati : et egredietur, claudeturque porta postquam exierit.\"},{\"verse\":13,\"text\":\"Et agnum ejusdem anni immaculatum faciet holocaustum quotidie Domino : semper mane faciet illud.\"},{\"verse\":14,\"text\":\"Et faciet sacrificium super eo cata mane mane sextam partem ephi, et de oleo tertiam partem hin, ut misceatur similæ : sacrificium Domino legitimum, juge atque perpetuum.\"},{\"verse\":15,\"text\":\"Faciet agnum, et sacrificium, et oleum cata mane mane, holocaustum sempiternum.\"},{\"verse\":16,\"text\":\"Hæc dicit Dominus Deus : Si dederit princeps donum alicui de filiis suis, hæreditas ejus filiorum suorum erit : possidebunt eam hæreditarie.\"},{\"verse\":17,\"text\":\"Si autem dederit legatum de hæreditate sua uni servorum suorum, erit illius usque ad annum remissionis, et revertetur ad principem : hæreditas autem ejus filiis ejus erit.\"},{\"verse\":18,\"text\":\"Et non accipiet princeps de hæreditate populi per violentiam, et de possessione eorum : sed de possessione sua hæreditatem dabit filiis suis, ut non dispergatur populus meus unusquisque a possessione sua.\"},{\"verse\":19,\"text\":\"Et introduxit me per ingressum qui erat ex latere portæ, in gazophylacia sanctuarii ad sacerdotes, quæ respiciebant ad aquilonem : et erat ibi locus vergens ad occidentem.\"},{\"verse\":20,\"text\":\"Et dixit ad me : Iste est locus ubi coquent sacerdotes pro peccato et pro delicto : ubi coquent sacrificium, ut non efferant in atrium exterius, et sanctificetur populus.\"},{\"verse\":21,\"text\":\"Et eduxit me in atrium exterius, et circumduxit me per quatuor angulos atrii : et ecce atriolum erat in angulo atrii, atriola singula per angulos atrii.\"},{\"verse\":22,\"text\":\"In quatuor angulis atrii atriola disposita, quadraginta cubitorum per longum, et triginta per latum : mensuræ unius quatuor erant.\"},{\"verse\":23,\"text\":\"Et paries per circuitum ambiens quatuor atriola : et culinæ fabricatæ erant subter porticus per gyrum.\"},{\"verse\":24,\"text\":\"Et dixit ad me : Hæc est domus culinarum, in qua coquent ministri domus Domini victimas populi.\"}],\"summary\":\"Other ordinances for the prince and for the sacrifices.\",\"intro\":null,\"prev\":{\"usfm\":\"EZK\",\"chapter\":45,\"label\":\"Ezekiel 45\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":47,\"label\":\"Ezekiel 47\"}}]]\n"])</script></body></html>
