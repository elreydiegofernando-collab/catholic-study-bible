rif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>This was the vision of the likeness of the glory of the Lord, and I saw, and I fell upon my face, and I heard the voice of one that spoke, and he said to me: Son of man, stand upon thy feet, and I will speak to thee.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the spirit entered into me after that he spoke to me, and he set me upon my feet: and I heard him speaking to me,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And saying: Son of man, I send thee to the children of Israel, to a rebellious people, that hath revolted from me, they, and their fathers, have transgressed my covenant even unto this day.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they to whom I send thee are children of a hard face, and of an obstinate heart: and thou shalt say to them: Thus saith the Lord God:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If so be they at least will hear, and if so be they will forbear, for they are a provoking house: and they shall know that there hath been a prophet in the midst of them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And thou, O son of man, fear not, neither be thou afraid of their words: for thou art among unbelievers and destroyers, and thou dwellest with scorpions. Fear not their words, neither be thou dismayed at their looks: for they are a provoking house.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And thou shalt speak my words to them, if perhaps they will hear, and forbear: for they provoke me to anger.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But thou, O son of man, hear all that I say to thee: and do not thou provoke me, as that house provoketh me: open thy mouth, and eat what I give thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And I looked, and behold, a hand was sent to me, wherein was a book rolled up: and he spread it before me, and it was written within and without: and there were written in it lamentations, and canticles, and woe.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc visio similitudinis gloriæ Domini. Et vidi, et cecidi in faciem meam, et audivi vocem loquentis, et dixit ad me : Fili hominis, sta super pedes tuos, et loquar tecum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ingressus est in me spiritus postquam locutus est mihi, et statuit me supra pedes meos : et audivi loquentem ad me,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dicentem : Fili hominis, mitto ego te ad filios Israël, ad gentes apostatrices quæ recesserunt a me : ipsi et patres eorum prævaricati sunt pactum meum usque ad diem hanc :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et filii dura facie et indomabili corde sunt, ad quos ego mitto te. Et dices ad eos : Hæc dicit Dominus Deus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>si forte vel ipsi audiant, et si forte quiescant, quoniam domus exasperans est : et scient quia propheta fuerit in medio eorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tu ergo, fili hominis, ne timeas eos, neque sermones eorum metuas, quoniam increduli et subversores sunt tecum, et cum scorpionibus habitas. Verba eorum ne timeas, et vultus eorum ne formides, quia domus exasperans est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Loqueris ergo verba mea ad eos, si forte audiant, et quiescant : quoniam irritatores sunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tu autem, fili hominis, audi quæcumque loquor ad te, et noli esse exasperans, sicut domus exasperatrix est : aperi os tuum, et comede quæcumque ego do tibi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et vidi : et ecce manus missa ad me, in qua erat involutus liber : et expandit illum coram me, qui erat scriptus intus et foris : et scriptæ erant in eo lamentationes, et carmen, et væ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezekiel 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -
