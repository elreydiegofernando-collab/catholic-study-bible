[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">37</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of the choice of friends and counsellors.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Every friend will say: I also am his friend: but there is a friend, that is only a friend in name. Is not this a grief even to death?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But a companion and a friend shall be turned to an enemy.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>O wicked presumption, whence camest thou to cover the earth with thy malice, and deceitfulness?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>There is a companion who rejoiceth with his friend in his joys, but in the time of trouble, he will be against him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>There is a companion who condoleth with his friend for his belly’s sake, and he will take up a shield against the enemy.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Forget not thy friend in thy mind, and be not unmindful of him in thy riches.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Consult not with him that layeth a snare for thee, and hide thy counsel from them that envy thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Every counsellor giveth out counsel, but there is one that is a counsellor for himself.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Beware of a counsellor. And know before what need he hath: for he will devise to his own mind:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lest he thrust a stake into the ground, and say to thee:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thy way is good; and then stand on the other side to see what shall befall thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Treat not with a man without religion concerning holiness, nor with an unjust man concerning justice, nor with a woman touching her of whom she is jealous, nor with a coward concerning war, nor with a merchant about traffic, nor with a buyer of selling, nor with an envious man of giving thanks,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nor with the ungodly of piety, nor with the dishonest of honesty, nor with the field laborer of every work,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nor with him that worketh by the year of the finishing of the year, nor with an idle servant of much business: give no heed to these in any matter of counsel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But be continually with a holy man, whomsoever thou shalt know to observe the fear of God,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Whose soul is according to thy own soul: and who, when thou shalt stumble in the dark, will be sorry for thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And establish within thyself a heart of good counsel: for there is no other thing of more worth to thee than it.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The soul of a holy man discovereth sometimes true things, more than seven watchmen that sit in a high place to watch.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But above all these things pray to the most High, that he may direct thy way in truth.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In all thy works let the true word go before thee, and steady counsel before every action.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A wicked word shall change the heart: out of which four manner of things arise, good and evil, life and death: and the tongue is continually the ruler of them. There is a man that is subtle and a teacher of many, and yet is unprofitable to his own soul.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A skilful man hath taught many, and is sweet to his own soul.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He that speaketh sophistically, is hateful: he shall be destitute of every thing.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Grace is not given him from the Lord: for he is deprived of all wisdom.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>There is a wise man that is wise to his own soul: and the fruit of his understanding is commendable.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A wise man instructeth his own people, and the fruits of his understanding are faithful.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>A wise man shall be filled with blessings, and they that see shall praise him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The life of a man is in the number of his days: but the days of Israel are innumerable.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>A wise man shall inherit honour among his people, and his name shall live for ever.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>My son, prove thy soul in thy life: and if it be wicked, give it no power:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For all things are not expedient for all, and every kind pleaseth not every soul.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Be not greedy in any feasting, and pour not out thyself upon any meat:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>For in many meats there will be sickness, and greediness will turn to choler.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>By surfeiting many have perished, but he that is temperate, shall prolong life.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Omnis amicus dicet : Et ego amicitiam copulavi : sed est amicus solo nomine amicus. Nonne tristitia inest usque ad mortem ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sodalis autem et amicus ad inimicitiam convertentur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>O præsumptio nequissima, unde creata es cooperire aridam malitia et dolositate illius ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sodalis amico conjucundatur in oblectationibus, et in tempore tribulationis adversarius erit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sodalis amico condolet causa ventris, et contra hostem accipiet scutum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non obliviscaris amici tui in animo tuo, et non immemor sis illius in opibus tuis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Noli consiliari cum eo qui tibi insidiatur, et a zelantibus te absconde consilium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnis consiliarius prodit consilium, sed est consiliarius in semetipso.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>A consiliario serva animam tuam : prius scito quæ sit illius necessitas : et ipse enim animo suo cogitabit :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ne forte mittat sudem in terram, et dicat tibi :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Bona est via tua : et stet e contrario videre quid tibi eveniat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum viro irreligioso tracta de sanctitate, et cum injusto de justitia, et cum muliere de ea quæ æmulatur, cum timido de bello, cum negotiatore de trajectione, cum emptore de venditione, cum viro livido de gratiis agendis,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>cum impio de pietate, cum inhonesto de honestate, cum operario agrario de omni opere,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>cum operario annuali de consummatione anni, cum servo pigro de multa operatione. Non attendas his in omni consilio :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>sed cum viro sancto assiduus esto, quemcumque cognoveris observantem timorem Dei :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>cujus anima est secundum animam tuam, et qui, cum titubaveris in tenebris, condolebit tibi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cor boni consilii statue tecum : non est enim tibi aliud pluris illo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Anima viri sancti enuntiat aliquando vera, quam septem circumspectores sedentes in excelso ad speculandum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et in his omnibus deprecare Altissimum, ut dirigat in veritate viam tuam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ante omnia opera verbum verax præcedat te, et ante omnem actum consilium stabile.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Verbum nequam immutabit cor : ex quo partes quatuor oriuntur : bonum et malum, vita et mors : et dominatrix illorum est assidua lingua. Est vir astutus multorum eruditor, et animæ suæ inutilis est.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vir peritus multos erudivit, et animæ suæ suavis est.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui sophistice loquitur odibilis est : in omni re defraudabitur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Non est illi data a Domino gratia, omni enim sapientia defraudatus est.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Est sapiens animæ suæ sapiens, et fructus sensus illius laudabilis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vir sapiens plebem suam erudit, et fructus sensus illius fideles sunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Vir sapiens implebitur benedictionibus, et videntes illum laudabunt.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Vita viri in numero dierum : dies autem Israël innumerabiles sunt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Sapiens in populo hæreditabit honorem, et nomen illius erit vivens in æternum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Fili, in vita tua tenta animam tuam, et si fuerit nequam non des illi potestatem :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>non enim omnia omnibus expediunt, et non omni animæ omne genus placet.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Noli avidus esse in omni epulatione, et non te effundas super omnem escam :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>in multis enim escis erit infirmitas, et aviditas appropinquabit usque ad choleram.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Propter crapulam multi obierunt : qui autem abstinens est adjiciet vitam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/36/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 36</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/38/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 38</span></span><svg viewBox="0 0 24 24" fill="no erse\":7,\"text\":\"Consult not with him that layeth a snare for thee, and hide thy counsel from them that envy thee.\"},{\"verse\":8,\"text\":\"Every counsellor giveth out counsel, but there is one that is a counsellor for himself.\"},{\"verse\":9,\"text\":\"Beware of a counsellor. And know before what need he hath: for he will devise to his own mind:\"},{\"verse\":10,\"text\":\"Lest he thrust a stake into the ground, and say to thee:\"},{\"verse\":11,\"text\":\"Thy way is good; and then stand on the other side to see what shall befall thee.\"},{\"verse\":12,\"text\":\"Treat not with a man without religion concerning holiness, nor with an unjust man concerning justice, nor with a woman touching her of whom she is jealous, nor with a coward concerning war, nor with a merchant about traffic, nor with a buyer of selling, nor with an envious man of giving thanks,\"},{\"verse\":13,\"text\":\"Nor with the ungodly of piety, nor with the dishonest of honesty, nor with the field laborer of every work,\"},{\"verse\":14,\"text\":\"Nor with him that worketh by the year of the finishing of the year, nor with an idle servant of much business: give no heed to these in any matter of counsel.\"},{\"verse\":15,\"text\":\"But be continually with a holy man, whomsoever thou shalt know to observe the fear of God,\"},{\"verse\":16,\"text\":\"Whose soul is according to thy own soul: and who, when thou shalt stumble in the dark, will be sorry for thee.\"},{\"verse\":17,\"text\":\"And establish within thyself a heart of good counsel: for there is no other thing of more worth to thee than it.\"},{\"verse\":18,\"text\":\"The soul of a holy man discovereth sometimes true things, more than seven watchmen that sit in a high place to watch.\"},{\"verse\":19,\"text\":\"But above all these things pray to the most High, that he may direct thy way in truth.\"},{\"verse\":20,\"text\":\"In all thy works let the true word go before thee, and steady counsel before every action.\"},{\"verse\":21,\"text\":\"A wicked word shall change the heart: out of which four manner of things arise, good and evil, life and death: and the tongue is continually the ruler of them. There is a man that is subtle and a teacher of many, and yet is unprofitable to his own soul.\"},{\"verse\":22,\"text\":\"A skilful man hath taught many, and is sweet to his own soul.\"},{\"verse\":23,\"text\":\"He that speaketh sophistically, is hateful: he shall be destitute of every thing.\"},{\"verse\":24,\"text\":\"Grace is not given him from the Lord: for he is deprived of all wisdom.\"},{\"verse\":25,\"text\":\"There is a wise man that is wise to his own soul: and the fruit of his understanding is commendable.\"},{\"verse\":26,\"text\":\"A wise man instructeth his own people, and the fruits of his understanding are faithful.\"},{\"verse\":27,\"text\":\"A wise man shall be filled with blessings, and they that see shall praise him.\"},{\"verse\":28,\"text\":\"The life of a man is in the number of his days: but the days of Israel are innumerable.\"},{\"verse\":29,\"text\":\"A wise man shall inherit honour among his people, and his name shall live for ever.\"},{\"verse\":30,\"text\":\"My son, prove thy soul in thy life: and if it be wicked, give it no power:\"},{\"verse\":31,\"text\":\"For all things are not expedient for all, and every kind pleaseth not every soul.\"},{\"verse\":32,\"text\":\"Be not greedy in any feasting, and pour not out thyself upon any meat:\"},{\"verse\":33,\"text\":\"For in many meats there will be sickness, and greediness will turn to choler.\"},{\"verse\":34,\"text\":\"By surfeiting many have perished, but he that is temperate, shall prolong life.\"}],\"vul\":[{\"verse\":1,\"text\":\"Omnis amicus dicet : Et ego amicitiam copulavi : sed est amicus solo nomine amicus. Nonne tristitia inest usque ad mortem ?\"},{\"verse\":2,\"text\":\"sodalis autem et amicus ad inimicitiam convertentur.\"},{\"verse\":3,\"text\":\"O præsumptio nequissima, unde creata es cooperire aridam malitia et dolositate illius ?\"},{\"verse\":4,\"text\":\"Sodalis amico conjucundatur in oblectationibus, et in tempore tribulationis adversarius erit.\"},{\"verse\":5,\"text\":\"Sodalis amico condolet causa ventris, et contra hostem accipiet scutum.\"},{\"verse\":6,\"text\":\"Non obliviscaris amici tui in animo tuo, et non immemor sis illius in opibus tuis.\"},{\"verse\":7,\"text\":\"Noli consiliari cum eo qui tibi insidiatur, et a zelantibus te absconde consilium.\"},{\"verse\":8,\"text\":\"Omnis consiliarius prodit consilium, sed est consiliarius in semetipso.\"},{\"verse\":9,\"text\":\"A consiliario serva animam tuam : prius scito quæ sit illius necessitas : et ipse enim animo suo cogitabit :\"},{\"verse\":10,\"text\":\"ne forte mittat sudem in terram, et dicat tibi :\"},{\"verse\":11,\"text\":\"Bona est via tua : et stet e contrario videre quid tibi eveniat.\"},{\"verse\":12,\"text\":\"Cum viro irreligioso tracta de sanctitate, et cum injusto de justitia, et cum muliere de ea quæ æmulatur, cum timido de bello, cum negotiatore de trajectione, cum emptore de venditione, cum viro livido de gratiis agendis,\"},{\"verse\":13,\"text\":\"cum impio de pietate, cum inhonesto de honestate, cum operario agrario de omni opere,\"},{\"verse\":14,\"text\":\"cum operario annuali de consummatione anni, cum servo pigro de multa operatione. Non attendas his in omni consilio :\"},{\"verse\":15,\"text\":\"sed cum viro sancto assiduus esto, quemcumque cognoveris observantem timorem Dei :\"},{\"verse\":16,\"text\":\"cujus anima est secundum animam tuam, et qui, cum titubaveris in tenebris, condolebit tibi.\"},{\"verse\":17,\"text\":\"Cor boni consilii statue tecum : non est enim tibi aliud pluris illo.\"},{\"verse\":18,\"text\":\"Anima viri sancti enuntiat aliquando vera, quam septem circumspectores sedentes in excelso ad speculandum.\"},{\"verse\":19,\"text\":\"Et in his omnibus deprecare Altissimum, ut dirigat in veritate viam tuam.\"},{\"verse\":20,\"text\":\"Ante omnia opera verbum verax præcedat te, et ante omnem actum consilium stabile.\"},{\"verse\":21,\"text\":\"Verbum nequam immutabit cor : ex quo partes quatuor oriuntur : bonum et malum, vita et mors : et dominatrix illorum est assidua lingua. Est vir astutus multorum eruditor, et animæ suæ inutilis est.\"},{\"verse\":22,\"text\":\"Vir peritus multos erudivit, et animæ suæ suavis est.\"},{\"verse\":23,\"text\":\"Qui sophistice loquitur odibilis est : in omni re defraudabitur.\"},{\"verse\":24,\"text\":\"Non est illi data a Domino gratia, omni enim sapientia defraudatus est.\"},{\"verse\":25,\"text\":\"Est sapiens animæ suæ sapiens, et fructus sensus illius laudabilis.\"},{\"verse\":26,\"text\":\"Vir sapiens plebem suam erudit, et fructus sensus illius fideles sunt.\"},{\"verse\":27,\"text\":\"Vir sapiens implebitur benedictionibus, et videntes illum laudabunt.\"},{\"verse\":28,\"text\":\"Vita viri in numero dierum : dies autem Israël innumerabiles sunt.\"},{\"verse\":29,\"text\":\"Sapiens in populo hæreditabit honorem, et nomen illius erit vivens in æternum.\"},{\"verse\":30,\"text\":\"Fili, in vita tua tenta animam tuam, et si fuerit nequam non des illi potestatem :\"},{\"verse\":31,\"text\":\"non enim omnia omnibus expediunt, et non omni animæ omne genus placet.\"},{\"verse\":32,\"text\":\"Noli avidus esse in omni epulatione, et non te effundas super omnem escam :\"},{\"verse\":33,\"text\":\"in multis enim escis erit infirmitas, et aviditas appropinquabit usque ad choleram.\"},{\"verse\":34,\"text\":\"Propter crapulam multi obierunt : qui autem abstinens est adjiciet vitam.\"}],\"summary\":\"Of the choice of friends and counsellors.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":36,\"label\":\"Sirach 36\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":38,\"label\":\"Sirach 38\"}}]]\n"])</script></body></html>
