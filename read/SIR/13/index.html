-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that toucheth pitch, shall be defiled with it: and he that hath fellowship with the proud, shall put on pride.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He shall take a burden upon him that hath fellowship with one more honourable than himself. And have no fellowship with one that is richer than thyself.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>What agreement shall the earthen pot have with the kettle? for if they knock one against the other, it shall be broken.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The rich man hath done wrong, and yet he will fume: but the poor is wronged and must hold his peace.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If thou give, he will make use of thee: and if thou have nothing, he will forsake thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>If thou have any thing, he will live with thee, and will make thee bare, and he will not be sorry for thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If he have need of thee he will deceive thee, and smiling upon thee will put thee in hope; he will speak thee fair, and will say: What wantest thou?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he will shame thee by his meats, till he have drawn thee dry twice or thrice, and at last he will laugh at thee: and afterward when he seeth thee, he will forsake thee, and shake his head at thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Humble thyself to God, and wait for his hands.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Beware that thou be not deceived into folly, and be humbled.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Be not lowly in thy wisdom, lest being humbled thou be deceived into folly.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If thou be invited by one that is mightier, withdraw thyself: for so he will invite thee the more.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Be not troublesome to him, lest thou be put back: and keep not far from him, lest thou be forgotten.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Affect not to speak with him as an equal, and believe not his many words: for by much talk he will sift thee, and smiling will examine thee concerning thy secrets.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>His cruel mind will lay up thy words: and he will not spare to do thee hurt, and to cast thee into prison.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Take heed to thyself, and attend diligently to what thou hearest: for thou walkest in danger of thy ruin.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>When thou hearest those things, see as it were in sleep, and thou shalt awake.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Love God all thy life, and call upon him for thy salvation.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Every beast loveth its like: so also every man him that is nearest to himself.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>All flesh shall consort with the like to itself, and every man shall associate himself to his like.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>If the wolf shall at any time have fellowship with the lamb, so the sinner with the just.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>What fellowship hath a holy man with a dog, or what part hath the rich with the poor?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The wild ass is the lion’s prey in the desert: so also the poor are devoured by the rich.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And as humility is an abomination to the proud: so also the rich man abhorreth the poor.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>When a rich man is shaken, he is kept up by his friends: but when a poor man is fallen down, he is thrust away even by his acquaintance.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>When a rich man hath been deceived, he hath many helpers: he hath spoken proud things, and they have justified him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The poor man was deceived, and he is rebuked also: he hath spoken wisely, and could have no place.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The rich man spoke, and all held their peace, and what he said they extol even to the clouds.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The poor man spoke, and they say: Who is this? and if he stumble, they will overthrow him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Riches are good to him that hath no sin in his conscience: and poverty is very wicked in the mouth of the ungodly.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The heart of a man changeth his countenance, either for good, or for evil.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The token of a good heart, and a good countenance thou shalt hardly find, and with labour.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui tetigerit picem inquinabitur ab ea : et qui communicaverit superbo induet superbiam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Pondus super se tollat qui honestiori se communicat, et ditiori te ne socius fueris.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quid communicabit cacabus ad ollam ? quando enim se colliserint, confringetur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dives injuste egit, et fremet : pauper autem læsus tacebit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si largitus fueris, assumet te : et si non habueris, derelinquet te.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si habes, convivet tecum, et evacuabit te : et ipse non dolebit super te.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si necessarius illi fueris, supplantabit te, et subridens spem dabit, narrans tibi bona, et dicet : Quid opus est tibi ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et confundet te in cibis suis, donec te exinaniat bis et ter : et in novissimo deridebit te, et postea videns derelinquet te, et caput suum movebit ad te.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Humiliare Deo, et exspecta manus ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Attende ne seductus in stultitiam humilieris.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Noli esse humilis in sapientia tua, ne humiliatus in stultitiam seducaris.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Advocatus a potentiore, discede : ex hoc enim magis te advocabit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ne improbus sis, ne impingaris : et ne longe sis ab eo, ne eas in oblivionem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ne retineas ex æquo loqui cum illo, nec credas multis verbis illius : ex multa enim loquela tentabit te, et subridens interrogabit te de absconditis tuis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Immitis animus illius conservabit verba tua : et non parcet de malitia, et de vinculis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cave tibi, et attende diligenter auditui tuo, quoniam cum subversione tua ambulas :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>audiens vero illa, quasi in somnis vide, et vigilabis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omni vita tua dilige Deum, et invoca illum in salute tua.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omne animal diligit simile sibi, sic et omnis homo proximum sibi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omnis caro ad similem sibi conjungetur, et omnis homo simili sui sociabitur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Si communicabit lupus agno aliquando, sic peccator justo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quæ communicatio sancto homini ad canem ? aut quæ pars diviti ad pauperem ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Venatio leonis onager in eremo : sic et pascua divitum sunt pauperes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et sicut abominatio est superbo humilitas, sic et execratio divitis pauper.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dives commotus confirmatur ab amicis suis : humilis autem cum ceciderit, expelletur et a notis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Diviti decepto multi recuperatores : locutus est superbia, et justificaverunt illum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Humilis deceptus est, insuper et arguitur : locutus est sensate, et non est datus ei locus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dives locutus est, et omnes tacuerunt, et verbum illius usque ad nubes perducent.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Pauper locutus est, et dicunt : Quis est hic ? et si offenderit, subvertent illum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Bona est substantia cui non est peccatum in conscientia : et nequissima paupertas in ore impii.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cor hominis immutat faciem illius, sive in bona, sive in mala.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Vestigium cordis boni et faciem bonam difficile invenies, et cum labore.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 12" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 t2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.13\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":13,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"He that toucheth pitch, shall be defiled with it: and he that hath fellowship with the proud, shall put on pride.\"},{\"verse\":2,\"text\":\"He shall take a burden upon him that hath fellowship with one more honourable than himself. And have no fellowship with one that is richer than thyself.\"},{\"verse\":3,\"text\":\"What agreement shall the earthen pot have with the kettle? for if they knock one against the other, it shall be broken.\"},{\"verse\":4,\"text\":\"The rich man hath done wrong, and yet he will fume: but the poor is wronged and must hold his peace.\"},{\"verse\":5,\"text\":\"If thou give, he will make use of thee: and if thou have nothing, he will forsake thee.\"},{\"verse\":6,\"text\":\"If thou have any thing, he will live with thee, and will make thee bare, and he will not be sorry for thee.\"},{\"verse\":7,\"text\":\"If he have need of thee he will deceive thee, and smiling upon thee will put thee in hope; he will speak thee fair, and will say: What wantest thou?\"},{\"verse\":8,\"text\":\"And he will shame thee by his meats, till he have drawn thee dry twice or thrice, and at last he will laugh at thee: and afterward when he seeth thee, he will forsake thee, and shake his head at thee.\"},{\"verse\":9,\"text\":\"Humble thyself to God, and wait for his hands.\"},{\"verse\":10,\"text\":\"Beware that thou be not deceived into folly, and be humbled.\"},{\"verse\":11,\"text\":\"Be not lowly in thy wisdom, lest being humbled thou be deceived into folly.\"},{\"verse\":12,\"text\":\"If thou be invited by one that is mightier, withdraw thyself: for so he will invite thee the more.\"},{\"verse\":13,\"text\":\"Be not troublesome to him, lest thou be put back: and keep not far from him, lest thou be forgotten.\"},{\"verse\":14,\"text\":\"Affect not to speak with him as an equal, and believe not his many words: for by much talk he will sift thee, and smiling will examine thee concerning thy secrets.\"},{\"verse\":15,\"text\":\"His cruel mind will lay up thy words: and he will not spare to do thee hurt, and to cast thee into prison.\"},{\"verse\":16,\"text\":\"Take heed to thyself, and attend diligently to what thou hearest: for thou walkest in danger of thy ruin.\"},{\"verse\":17,\"text\":\"When thou hearest those things, see as it were in sleep, and thou shalt awake.\"},{\"verse\":18,\"text\":\"Love God all thy life, and call upon him for thy salvation.\"},{\"verse\":19,\"text\":\"Every beast loveth its like: so also every man him that is nearest to himself.\"},{\"verse\":20,\"text\":\"All flesh shall consort with the like to itself, and every man shall associate himself to his like.\"},{\"verse\":21,\"text\":\"If the wolf shall at any time have fellowship with the lamb, so the sinner with the just.\"},{\"verse\":22,\"text\":\"What fellowship hath a holy man with a dog, or what part hath the rich with the poor?\"},{\"verse\":23,\"text\":\"The wild ass is the lion’s prey in the desert: so also the poor are devoured by the rich.\"},{\"verse\":24,\"text\":\"And as humility is an abomination to the proud: so also the rich man abhorreth the poor.\"},{\"verse\":25,\"text\":\"When a rich man is shaken, he is kept up by his friends: but when a poor man is fallen down, he is thrust away even by his acquaintance.\"},{\"verse\":26,\"text\":\"When a rich man hath been deceived, he hath many helpers: he hath spoken proud things, and they have justified him.\"},{\"verse\":27,\"text\":\"The poor man was deceived, and he is rebuked also: he hath spoken wisely, and could have no place.\"},{\"verse\":28,\"text\":\"The rich man spoke, and all held their peace, and what he said they extol even to the clouds.\"},{\"verse\":29,\"text\":\"The poor man spoke, and they say: Who is this? and if he stumble, they will overthrow him.\"},{\"verse\":30,\"text\":\"Riches are good to him that hath no sin in his conscience: and poverty is very wicked in the mouth of the ungodly.\"},{\"verse\":31,\"text\":\"The heart of a man changeth his countenance, either for good, or for evil.\"},{\"verse\":32,\"text\":\"The token of a good heart, and a good countenance thou shalt hardly find, and with labour.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui tetigerit picem inquinabitur ab ea : et qui communicaverit superbo induet superbiam.\"},{\"verse\":2,\"text\":\"Pondus super se tollat qui honestiori se communicat, et ditiori te ne socius fueris.\"},{\"verse\":3,\"text\":\"Quid communicabit cacabus ad ollam ? quando enim se colliserint, confringetur.\"},{\"verse\":4,\"text\":\"Dives injuste egit, et fremet : pauper autem læsus tacebit.\"},{\"verse\":5,\"text\":\"Si largitus fueris, assumet te : et si non habueris, derelinquet te.\"},{\"verse\":6,\"text\":\"Si habes, convivet tecum, et evacuabit te : et ipse non dolebit super te.\"},{\"verse\":7,\"text\":\"Si necessarius illi fueris, supplantabit te, et subridens spem dabit, narrans tibi bona, et dicet : Quid opus est tibi ?\"},{\"verse\":8,\"text\":\"Et confundet te in cibis suis, donec te exinaniat bis et ter : et in novissimo deridebit te, et postea videns derelinquet te, et caput suum movebit ad te.\"},{\"verse\":9,\"text\":\"Humiliare Deo, et exspecta manus ejus.\"},{\"verse\":10,\"text\":\"Attende ne seductus in stultitiam humilieris.\"},{\"verse\":11,\"text\":\"Noli esse humilis in sapientia tua, ne humiliatus in stultitiam seducaris.\"},{\"verse\":12,\"text\":\"Advocatus a potentiore, discede : ex hoc enim magis te advocabit.\"},{\"verse\":13,\"text\":\"Ne improbus sis, ne impingaris : et ne longe sis ab eo, ne eas in oblivionem.\"},{\"verse\":14,\"text\":\"Ne retineas ex æquo loqui cum illo, nec credas multis verbis illius : ex multa enim loquela tentabit te, et subridens interrogabit te de absconditis tuis.\"},{\"verse\":15,\"text\":\"Immitis animus illius conservabit verba tua : et non parcet de malitia, et de vinculis.\"},{\"verse\":16,\"text\":\"Cave tibi, et attende diligenter auditui tuo, quoniam cum subversione tua ambulas :\"},{\"verse\":17,\"text\":\"audiens vero illa, quasi in somnis vide, et vigilabis.\"},{\"verse\":18,\"text\":\"Omni vita tua dilige Deum, et invoca illum in salute tua.\"},{\"verse\":19,\"text\":\"Omne animal diligit simile sibi, sic et omnis homo proximum sibi.\"},{\"verse\":20,\"text\":\"Omnis caro ad similem sibi conjungetur, et omnis homo simili sui sociabitur.\"},{\"verse\":21,\"text\":\"Si communicabit lupus agno aliquando, sic peccator justo.\"},{\"verse\":22,\"text\":\"Quæ communicatio sancto homini ad canem ? aut quæ pars diviti ad pauperem ?\"},{\"verse\":23,\"text\":\"Venatio leonis onager in eremo : sic et pascua divitum sunt pauperes.\"},{\"verse\":24,\"text\":\"Et sicut abominatio est superbo humilitas, sic et execratio divitis pauper.\"},{\"verse\":25,\"text\":\"Dives commotus confirmatur ab amicis suis : humilis autem cum ceciderit, expelletur et a notis.\"},{\"verse\":26,\"text\":\"Diviti decepto multi recuperatores : locutus est superbia, et justificaverunt illum.\"},{\"verse\":27,\"text\":\"Humilis deceptus est, insuper et arguitur : locutus est sensate, et non est datus ei locus.\"},{\"verse\":28,\"text\":\"Dives locutus est, et omnes tacuerunt, et verbum illius usque ad nubes perducent.\"},{\"verse\":29,\"text\":\"Pauper locutus est, et dicunt : Quis est hic ? et si offenderit, subvertent illum.\"},{\"verse\":30,\"text\":\"Bona est substantia cui non est peccatum in conscientia : et nequissima paupertas in ore impii.\"},{\"verse\":31,\"text\":\"Cor hominis immutat faciem illius, sive in bona, sive in mala.\"},{\"verse\":32,\"text\":\"Vestigium cordis boni et faciem bonam difficile invenies, et cum labore.\"}],\"summary\":\"Cautions in the choice of company.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":12,\"label\":\"Sirach 12\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":14,\"label\":\"Sirach 14\"}}]]\n"])</script></body></html>
