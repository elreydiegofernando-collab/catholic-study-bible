RA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Son, defraud not the poor of alms, and turn not away thy eyes from the poor.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Despise not the hungry soul: and provoke not the poor in his want.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Afflict not the heart of the needy, and defer not to give to him that is in distress.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Reject not the petition of the afflicted: and turn not away thy face from the needy.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Turn not away thy eyes from the poor for fear of anger: and leave not to them that ask of thee to curse thee behind thy back.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For the prayer of him that curseth thee in the bitterness of his soul, shall be heard, for he that made him will hear him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Make thyself affable to the congregation of the poor, and humble thy soul to the ancient, and bow thy head to a great man.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Bow down thy ear cheerfully to the poor, and pay what thou owest, and answer him peaceable words with mildness.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Deliver him that suffereth wrong out of the hand of the proud: and be not fainthearted in thy soul.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In judging be merciful to the fatherless as a father, and as a husband to their mother.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And thou shalt be as the obedient son of the most High, and he will have mercy on thee more than a mother.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wisdom inspireth life into her children, and protecteth them that seek after her, and will go before them in the way of justice.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he that loveth her, loveth life: and they that watch for her, shall embrace her sweetness.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They that hold her fast, shall inherit life: and whithersoever she entereth, God will give a blessing.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They that serve her, shall be servants to the holy one: and God loveth them that love her.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that hearkeneth to her, shall judge nations: and he that looketh upon her, shall remain secure.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If he trust to her, he shall inherit her, and his generation shall be in assurance.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For she walketh with him in temptation, and at the first she chooseth him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>She will bring upon him fear and dread and trial: and she will scourge him with the affliction of her discipline, till she try him by her laws, and trust his soul.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Then she will strengthen him, and make a straight way to him, and give him joy,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And will disclose her secrets to him, and will heap upon him treasures of knowledge and understanding of justice.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But if he go astray, she will forsake him, and deliver him into the hands of his enemy.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Son, observe the time, and fly from evil.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For thy soul be not ashamed to say the truth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For there is a shame that bringeth sin, and there is a shame that bringeth glory and grace.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Accept no person against thy own person, nor against thy soul a lie.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Reverence not thy neighbour in his fall:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And refrain not to speak in the time of salvation. Hide not thy wisdom in her beauty.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For by the tongue wisdom is discerned: and understanding, and knowledge, and learning by the word of the wise, and steadfastness in the works of justice.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>In nowise speak against the truth, but be ashamed of the lie of thy ignorance.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Be not ashamed to confess thy sins, but submit not thyself to every man for sin.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Resist not against the face of the mighty, and do not strive against the stream of the river.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Strive for justice for thy soul, and even unto death fight for justice, and God will overthrow thy enemies for thee.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Be not hasty in thy tongue: and slack and remiss in thy works.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Be not as a lion in thy house, terrifying them of thy household, and oppressing them that are under thee.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Let not thy hand be stretched out to receive, and shut when thou shouldst give.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fili, eleemosynam pauperis ne defraudes, et oculos tuos ne transvertas a paupere.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Animam esurientem ne despexeris, et non exasperes pauperem in inopia sua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cor inopis ne afflixeris, et non protrahas datum angustianti.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Rogationem contribulati ne abjicias, et non avertas faciem tuam ab egeno.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ab inope ne avertas oculos tuos propter iram : et non relinquas quærentibus tibi retro maledicere.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Maledicentis enim tibi in amaritudine animæ, exaudietur deprecatio illius : exaudiet autem eum qui fecit illum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Congregationi pauperum affabilem te facito : et presbytero humilia animam tuam, et magnato humilia caput tuum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Declina pauperi sine tristitia aurem tuam, et redde debitum tuum, et responde illi pacifica in mansuetudine.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Libera eum qui injuriam patitur de manu superbi, et non acide feras in anima tua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In judicando esto pupillis misericors ut pater, et pro viro matri illorum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et eris tu velut filius Altissimi obediens, et miserebitur tui magis quam mater.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sapientia filiis suis vitam inspirat : et suscipit inquirentes se, et præibit in via justitiæ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et qui illam diligit, diligit vitam, et qui vigilaverint ad illam complectentur placorem ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui tenuerint illam, vitam hæreditabunt : et quo introibit benedicet Deus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui serviunt ei obsequentes erunt sancto : et eos qui diligunt illam, diligit Deus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui audit illam judicabit gentes : et qui intuetur illam permanebit confidens.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si crediderit ei, hæreditabit illam, et erunt in confirmatione creaturæ illius :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quoniam in tentatione ambulat cum eo, et in primis eligit eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Timorem, et metum, et probationem inducet super illum : et cruciabit illum in tribulatione doctrinæ suæ, donec tentet eum in cogitationibus suis, et credat animæ illius.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et firmabit illum, et iter adducet directum ad illum, et lætificabit illum :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et denudabit absconsa sua illi, et thesaurizabit super illum scientiam et intellectum justitiæ.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si autem oberraverit, derelinquet eum, et tradet eum in manus inimici sui.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Fili, conserva tempus, et devita a malo.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pro anima tua ne confundaris dicere verum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>est enim confusio adducens peccatum, et est confusio adducens gloriam et gratiam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ne accipias faciem adversus faciem tuam, nec adversus animam tuam mendacium.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ne reverearis proximum tuum in casu suo,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>nec retineas verbum in tempore salutis. Non abscondas sapientiam tuam in decore suo :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>in lingua enim sapientia dignoscitur : et sensus, et scientia, et doctrina in verbo sensati, et firmamentum in operibus justitiæ.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Non contradicas verbo veritatis ullo modo, et de mendacio ineruditionis tuæ confundere.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Non confundaris confiteri peccata tua, et ne subjicias te omni homini pro peccato.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Noli resistere contra faciem potentis, nec coneris contra ictum fluvii.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Pro justitia agonizare pro anima tua, et usque ad mortem certa pro justitia : et Deus expugnabit pro te inimicos tuos.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Noli citatus esse in lingua tua, et inutilis, et remissus in operibus tuis.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Noli esse sicut leo in domo tua, evertens domesticos tuos, et opprimens subjectos tibi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Non sit porrecta manus tua ad accipiendum, et ad dandum collecta.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 3</span></span></a><a class="flex min-h-14 items-center justify-end ga canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.4\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":4,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Son, defraud not the poor of alms, and turn not away thy eyes from the poor.\"},{\"verse\":2,\"text\":\"Despise not the hungry soul: and provoke not the poor in his want.\"},{\"verse\":3,\"text\":\"Afflict not the heart of the needy, and defer not to give to him that is in distress.\"},{\"verse\":4,\"text\":\"Reject not the petition of the afflicted: and turn not away thy face from the needy.\"},{\"verse\":5,\"text\":\"Turn not away thy eyes from the poor for fear of anger: and leave not to them that ask of thee to curse thee behind thy back.\"},{\"verse\":6,\"text\":\"For the prayer of him that curseth thee in the bitterness of his soul, shall be heard, for he that made him will hear him.\"},{\"verse\":7,\"text\":\"Make thyself affable to the congregation of the poor, and humble thy soul to the ancient, and bow thy head to a great man.\"},{\"verse\":8,\"text\":\"Bow down thy ear cheerfully to the poor, and pay what thou owest, and answer him peaceable words with mildness.\"},{\"verse\":9,\"text\":\"Deliver him that suffereth wrong out of the hand of the proud: and be not fainthearted in thy soul.\"},{\"verse\":10,\"text\":\"In judging be merciful to the fatherless as a father, and as a husband to their mother.\"},{\"verse\":11,\"text\":\"And thou shalt be as the obedient son of the most High, and he will have mercy on thee more than a mother.\"},{\"verse\":12,\"text\":\"Wisdom inspireth life into her children, and protecteth them that seek after her, and will go before them in the way of justice.\"},{\"verse\":13,\"text\":\"And he that loveth her, loveth life: and they that watch for her, shall embrace her sweetness.\"},{\"verse\":14,\"text\":\"They that hold her fast, shall inherit life: and whithersoever she entereth, God will give a blessing.\"},{\"verse\":15,\"text\":\"They that serve her, shall be servants to the holy one: and God loveth them that love her.\"},{\"verse\":16,\"text\":\"He that hearkeneth to her, shall judge nations: and he that looketh upon her, shall remain secure.\"},{\"verse\":17,\"text\":\"If he trust to her, he shall inherit her, and his generation shall be in assurance.\"},{\"verse\":18,\"text\":\"For she walketh with him in temptation, and at the first she chooseth him.\"},{\"verse\":19,\"text\":\"She will bring upon him fear and dread and trial: and she will scourge him with the affliction of her discipline, till she try him by her laws, and trust his soul.\"},{\"verse\":20,\"text\":\"Then she will strengthen him, and make a straight way to him, and give him joy,\"},{\"verse\":21,\"text\":\"And will disclose her secrets to him, and will heap upon him treasures of knowledge and understanding of justice.\"},{\"verse\":22,\"text\":\"But if he go astray, she will forsake him, and deliver him into the hands of his enemy.\"},{\"verse\":23,\"text\":\"Son, observe the time, and fly from evil.\"},{\"verse\":24,\"text\":\"For thy soul be not ashamed to say the truth.\"},{\"verse\":25,\"text\":\"For there is a shame that bringeth sin, and there is a shame that bringeth glory and grace.\"},{\"verse\":26,\"text\":\"Accept no person against thy own person, nor against thy soul a lie.\"},{\"verse\":27,\"text\":\"Reverence not thy neighbour in his fall:\"},{\"verse\":28,\"text\":\"And refrain not to speak in the time of salvation. Hide not thy wisdom in her beauty.\"},{\"verse\":29,\"text\":\"For by the tongue wisdom is discerned: and understanding, and knowledge, and learning by the word of the wise, and steadfastness in the works of justice.\"},{\"verse\":30,\"text\":\"In nowise speak against the truth, but be ashamed of the lie of thy ignorance.\"},{\"verse\":31,\"text\":\"Be not ashamed to confess thy sins, but submit not thyself to every man for sin.\"},{\"verse\":32,\"text\":\"Resist not against the face of the mighty, and do not strive against the stream of the river.\"},{\"verse\":33,\"text\":\"Strive for justice for thy soul, and even unto death fight for justice, and God will overthrow thy enemies for thee.\"},{\"verse\":34,\"text\":\"Be not hasty in thy tongue: and slack and remiss in thy works.\"},{\"verse\":35,\"text\":\"Be not as a lion in thy house, terrifying them of thy household, and oppressing them that are under thee.\"},{\"verse\":36,\"text\":\"Let not thy hand be stretched out to receive, and shut when thou shouldst give.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fili, eleemosynam pauperis ne defraudes, et oculos tuos ne transvertas a paupere.\"},{\"verse\":2,\"text\":\"Animam esurientem ne despexeris, et non exasperes pauperem in inopia sua.\"},{\"verse\":3,\"text\":\"Cor inopis ne afflixeris, et non protrahas datum angustianti.\"},{\"verse\":4,\"text\":\"Rogationem contribulati ne abjicias, et non avertas faciem tuam ab egeno.\"},{\"verse\":5,\"text\":\"Ab inope ne avertas oculos tuos propter iram : et non relinquas quærentibus tibi retro maledicere.\"},{\"verse\":6,\"text\":\"Maledicentis enim tibi in amaritudine animæ, exaudietur deprecatio illius : exaudiet autem eum qui fecit illum.\"},{\"verse\":7,\"text\":\"Congregationi pauperum affabilem te facito : et presbytero humilia animam tuam, et magnato humilia caput tuum.\"},{\"verse\":8,\"text\":\"Declina pauperi sine tristitia aurem tuam, et redde debitum tuum, et responde illi pacifica in mansuetudine.\"},{\"verse\":9,\"text\":\"Libera eum qui injuriam patitur de manu superbi, et non acide feras in anima tua.\"},{\"verse\":10,\"text\":\"In judicando esto pupillis misericors ut pater, et pro viro matri illorum :\"},{\"verse\":11,\"text\":\"et eris tu velut filius Altissimi obediens, et miserebitur tui magis quam mater.\"},{\"verse\":12,\"text\":\"Sapientia filiis suis vitam inspirat : et suscipit inquirentes se, et præibit in via justitiæ.\"},{\"verse\":13,\"text\":\"Et qui illam diligit, diligit vitam, et qui vigilaverint ad illam complectentur placorem ejus.\"},{\"verse\":14,\"text\":\"Qui tenuerint illam, vitam hæreditabunt : et quo introibit benedicet Deus.\"},{\"verse\":15,\"text\":\"Qui serviunt ei obsequentes erunt sancto : et eos qui diligunt illam, diligit Deus.\"},{\"verse\":16,\"text\":\"Qui audit illam judicabit gentes : et qui intuetur illam permanebit confidens.\"},{\"verse\":17,\"text\":\"Si crediderit ei, hæreditabit illam, et erunt in confirmatione creaturæ illius :\"},{\"verse\":18,\"text\":\"quoniam in tentatione ambulat cum eo, et in primis eligit eum.\"},{\"verse\":19,\"text\":\"Timorem, et metum, et probationem inducet super illum : et cruciabit illum in tribulatione doctrinæ suæ, donec tentet eum in cogitationibus suis, et credat animæ illius.\"},{\"verse\":20,\"text\":\"Et firmabit illum, et iter adducet directum ad illum, et lætificabit illum :\"},{\"verse\":21,\"text\":\"et denudabit absconsa sua illi, et thesaurizabit super illum scientiam et intellectum justitiæ.\"},{\"verse\":22,\"text\":\"Si autem oberraverit, derelinquet eum, et tradet eum in manus inimici sui.\"},{\"verse\":23,\"text\":\"Fili, conserva tempus, et devita a malo.\"},{\"verse\":24,\"text\":\"Pro anima tua ne confundaris dicere verum :\"},{\"verse\":25,\"text\":\"est enim confusio adducens peccatum, et est confusio adducens gloriam et gratiam.\"},{\"verse\":26,\"text\":\"Ne accipias faciem adversus faciem tuam, nec adversus animam tuam mendacium.\"},{\"verse\":27,\"text\":\"Ne reverearis proximum tuum in casu suo,\"},{\"verse\":28,\"text\":\"nec retineas verbum in tempore salutis. Non abscondas sapientiam tuam in decore suo :\"},{\"verse\":29,\"text\":\"in lingua enim sapientia dignoscitur : et sensus, et scientia, et doctrina in verbo sensati, et firmamentum in operibus justitiæ.\"},{\"verse\":30,\"text\":\"Non contradicas verbo veritatis ullo modo, et de mendacio ineruditionis tuæ confundere.\"},{\"verse\":31,\"text\":\"Non confundaris confiteri peccata tua, et ne subjicias te omni homini pro peccato.\"},{\"verse\":32,\"text\":\"Noli resistere contra faciem potentis, nec coneris contra ictum fluvii.\"},{\"verse\":33,\"text\":\"Pro justitia agonizare pro anima tua, et usque ad mortem certa pro justitia : et Deus expugnabit pro te inimicos tuos.\"},{\"verse\":34,\"text\":\"Noli citatus esse in lingua tua, et inutilis, et remissus in operibus tuis.\"},{\"verse\":35,\"text\":\"Noli esse sicut leo in domo tua, evertens domesticos tuos, et opprimens subjectos tibi.\"},{\"verse\":36,\"text\":\"Non sit porrecta manus tua ad accipiendum, et ad dandum collecta.\"}],\"summary\":\"An exhortation to works of mercy, and to the love of wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":3,\"label\":\"Sirach 3\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":5,\"label\":\"Sirach 5\"}}]]\n"])</script></body></html>
