><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">39</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ecclesiasticus</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The exercises of the wise man. The Lord is to be glorified for his works.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The wise man will seek out the wisdom of all the ancients, and will be occupied in the prophets.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He will keep the sayings of renowned men, and will enter withal into the subtilties of parables.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He will search out the hidden meanings of proverbs, and will be conversant in the secrets of parables.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He shall serve among great men, and appear before the governor.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He shall pass into strange countries: for he shall try good and evil among men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He will open his mouth in prayer, and will make supplication for his sins.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For if it shall please the great Lord, he will fill him with the spirit of understanding:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he will pour forth the words of his wisdom as showers, and in his prayer he will confess to the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he shall direct his counsel, and his knowledge, and in his secrets shall he meditate.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He shall shew forth the discipline he hath learned, and shall glory in the law of the covenant of the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Many shall praise his wisdom, and it shall never be forgotten.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The memory of him shall not depart away, and his name shall be in request from generation to generation.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nations shall declare his wisdom, and the church shall shew forth his praise.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>If he continue, he shall leave a name above a thousand: and if he rest, it shall be to his advantage.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I will yet meditate that I may declare: for I am filled as with a holy transport.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>By a voice he saith: Hear me, ye divine offspring, and bud forth as the rose planted by the brooks of waters.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Give ye a sweet odour as frankincense.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Send forth flowers, as the lily, and yield a smell, and bring forth leaves in grace, and praise with canticles, and bless the Lord in his works.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Magnify his name, and give glory to him with the voice of your lips, and with the canticles of your mouths, and with harps, and in praising him, you shall say in this manner:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>All the works of the Lord are exceeding good.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>At his word the waters stood as a heap: and at the words of his mouth the receptacles of waters:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For at his commandment favour is shewn, and there is no diminishing of his salvation.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The works of all flesh are before him, and there is nothing hid from his eyes.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He seeth from eternity to eternity, and there is nothing wonderful before him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>There is no saying: What is this, or what is that? for all things shall be sought in their time.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>His blessing hath overflowed like a river.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And as a flood hath watered the earth; so shall his wrath inherit the nations, that have not sought after him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Even as he turned the waters into a dry land, and the earth was made dry: and his ways were made plain for their journey: so to sinners they are stumblingblocks in his wrath.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Good things were created for the good from the beginning, so for the wicked, good and evil things.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The principal things necessary for the life of men, are water, fire, and iron, salt, milk, and bread of flour, and honey, and the cluster of the grape, and oil, and clothing.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>All these things shall be for good to the holy, so to the sinners and the ungodly they shall be turned into evil.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>There are spirits that are created for vengeance, and in their fury they lay on grievous torments.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>In the time of destruction they shall pour out their force: and they shall appease the wrath of him that made them.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Fire, hail, famine, and death, all these were created for vengeance.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The teeth of beasts, and scorpions, and serpents, and the sword taking vengeance upon the ungodly unto destruction.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>In his commandments they shall feast, and they shall be ready upon earth when need is, and when their time is come they shall not transgress his word.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Therefore from the beginning I was resolved, and I have meditated, and thought on these things and left them in writing,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>All the works of the Lord are good, and he will furnish every work in due time.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>It is not to be said: This is worse than that: for all shall be well approved in their time.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Now therefore with the whole heart and mouth praise ye him, and bless the name of the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sapientiam omnium antiquorum exquiret sapiens, et in prophetis vacabit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Narrationem virorum nominatorum conservabit, et in versutias parabolarum simul introibit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Occulta proverbiorum exquiret, et in absconditis parabolarum conversabitur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In medio magnatorum ministrabit, et in conspectu præsidis apparebit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In terram alienigenarum gentium pertransiet : bona enim et mala in hominibus tentabit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cor suum tradet ad vigilandum diluculo ad Dominum, qui fecit illum, et in conspectu Altissimi deprecabitur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Aperiet os suum in oratione, et pro delictis suis deprecabitur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si enim Dominus magnus voluerit, spiritu intelligentiæ replebit illum :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et ipse tamquam imbres mittet eloquia sapientiæ suæ, et in oratione confitebitur Domino :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et ipse diriget consilium ejus, et disciplinam, et in absconditis suis consiliabitur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ipse palam faciet disciplinam doctrinæ suæ, et in lege testamenti Domini gloriabitur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Collaudabunt multi sapientiam ejus, et usque in sæculum non delebitur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non recedet memoria ejus, et nomen ejus requiretur a generatione in generationem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sapientiam ejus enarrabunt gentes, et laudem ejus enuntiabit ecclesia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si permanserit, nomen derelinquet plus quam mille : et si requieverit, proderit illi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Adhuc consiliabor ut enarrem : ut furore enim repletus sum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In voce dicit : Obaudite me, divini fructus, et quasi rosa plantata super rivos aquarum fructificate.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quasi Libanus odorem suavitatis habete.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Florete flores quasi lilium : et date odorem, et frondete in gratiam : et collaudate canticum, et benedicite Dominum in operibus suis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Date nomini ejus magnificentiam, et confitemini illi in voce labiorum vestrorum, et in canticis labiorum, et citharis : et sic dicetis in confessione :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Opera Domini universa bona valde.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In verbo ejus stetit aqua sicut congeries : et in sermone oris illius sicut exceptoria aquarum :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quoniam in præcepto ipsius placor fit, et non est minoratio in salute ipsius.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Opera omnis carnis coram illo, et non est quidquam absconditum ab oculis ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>A sæculo usque in sæculum respicit, et nihil est mirabile in conspectu ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non est dicere : Quid est hoc, aut quid est istud ? omnia enim in tempore suo quærentur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Benedictio illius quasi fluvius inundavit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quomodo cataclysmus aridam inebriavit, sic ira ipsius gentes quæ non exquisierunt eum hæreditabit.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quomodo convertit aquas in siccitatem, et siccata est terra, et viæ illius viis illorum directæ sunt, sic peccatoribus offensiones in ira ejus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Bona bonis creata sunt ab initio : sic nequissimis bona et mala.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Initium necessariæ rei vitæ hominum, aqua, ignis, et ferrum, sal, lac, et panis similagineus, et mel, et botrus uvæ, et oleum, et vestimentum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Hæc omnia sanctis in bona, sic et impiis et peccatoribus in mala convertentur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Sunt spiritus qui ad vindictam creati sunt, et in furore suo confirmaverunt tormenta sua.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>In tempore consummationis effundent virtutem, et furorem ejus qui fecit illos placabunt.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Ignis, grando, fames, et mors, omnia hæc ad vindictam creata sunt :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>bestiarum dentes, et scorpii, et serpentes, et rhomphæa vindicans in exterminium impios.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>In mandatis ejus epulabuntur : et super terram in necessitatem præparabuntur, et in temporibus suis non præterient verbum.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Propterea ab initio confirmatus sum, et consiliatus sum, et cogitavi, et scripta dimisi.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Omnia opera Domini bona, et omne opus hora sua subministrabit.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Non est dicere : Hoc illo nequius est : omnia enim in tempore suo comprobabuntur.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et nunc in omni corde et ore collaudate, et benedicite nomen Domini.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/38/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 38</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/40/"><span class="min-w-0"><span s.\"},{\"verse\":8,\"text\":\"For if it shall please the great Lord, he will fill him with the spirit of understanding:\"},{\"verse\":9,\"text\":\"And he will pour forth the words of his wisdom as showers, and in his prayer he will confess to the Lord.\"},{\"verse\":10,\"text\":\"And he shall direct his counsel, and his knowledge, and in his secrets shall he meditate.\"},{\"verse\":11,\"text\":\"He shall shew forth the discipline he hath learned, and shall glory in the law of the covenant of the Lord.\"},{\"verse\":12,\"text\":\"Many shall praise his wisdom, and it shall never be forgotten.\"},{\"verse\":13,\"text\":\"The memory of him shall not depart away, and his name shall be in request from generation to generation.\"},{\"verse\":14,\"text\":\"Nations shall declare his wisdom, and the church shall shew forth his praise.\"},{\"verse\":15,\"text\":\"If he continue, he shall leave a name above a thousand: and if he rest, it shall be to his advantage.\"},{\"verse\":16,\"text\":\"I will yet meditate that I may declare: for I am filled as with a holy transport.\"},{\"verse\":17,\"text\":\"By a voice he saith: Hear me, ye divine offspring, and bud forth as the rose planted by the brooks of waters.\"},{\"verse\":18,\"text\":\"Give ye a sweet odour as frankincense.\"},{\"verse\":19,\"text\":\"Send forth flowers, as the lily, and yield a smell, and bring forth leaves in grace, and praise with canticles, and bless the Lord in his works.\"},{\"verse\":20,\"text\":\"Magnify his name, and give glory to him with the voice of your lips, and with the canticles of your mouths, and with harps, and in praising him, you shall say in this manner:\"},{\"verse\":21,\"text\":\"All the works of the Lord are exceeding good.\"},{\"verse\":22,\"text\":\"At his word the waters stood as a heap: and at the words of his mouth the receptacles of waters:\"},{\"verse\":23,\"text\":\"For at his commandment favour is shewn, and there is no diminishing of his salvation.\"},{\"verse\":24,\"text\":\"The works of all flesh are before him, and there is nothing hid from his eyes.\"},{\"verse\":25,\"text\":\"He seeth from eternity to eternity, and there is nothing wonderful before him.\"},{\"verse\":26,\"text\":\"There is no saying: What is this, or what is that? for all things shall be sought in their time.\"},{\"verse\":27,\"text\":\"His blessing hath overflowed like a river.\"},{\"verse\":28,\"text\":\"And as a flood hath watered the earth; so shall his wrath inherit the nations, that have not sought after him.\"},{\"verse\":29,\"text\":\"Even as he turned the waters into a dry land, and the earth was made dry: and his ways were made plain for their journey: so to sinners they are stumblingblocks in his wrath.\"},{\"verse\":30,\"text\":\"Good things were created for the good from the beginning, so for the wicked, good and evil things.\"},{\"verse\":31,\"text\":\"The principal things necessary for the life of men, are water, fire, and iron, salt, milk, and bread of flour, and honey, and the cluster of the grape, and oil, and clothing.\"},{\"verse\":32,\"text\":\"All these things shall be for good to the holy, so to the sinners and the ungodly they shall be turned into evil.\"},{\"verse\":33,\"text\":\"There are spirits that are created for vengeance, and in their fury they lay on grievous torments.\"},{\"verse\":34,\"text\":\"In the time of destruction they shall pour out their force: and they shall appease the wrath of him that made them.\"},{\"verse\":35,\"text\":\"Fire, hail, famine, and death, all these were created for vengeance.\"},{\"verse\":36,\"text\":\"The teeth of beasts, and scorpions, and serpents, and the sword taking vengeance upon the ungodly unto destruction.\"},{\"verse\":37,\"text\":\"In his commandments they shall feast, and they shall be ready upon earth when need is, and when their time is come they shall not transgress his word.\"},{\"verse\":38,\"text\":\"Therefore from the beginning I was resolved, and I have meditated, and thought on these things and left them in writing,\"},{\"verse\":39,\"text\":\"All the works of the Lord are good, and he will furnish every work in due time.\"},{\"verse\":40,\"text\":\"It is not to be said: This is worse than that: for all shall be well approved in their time.\"},{\"verse\":41,\"text\":\"Now therefore with the whole heart and mouth praise ye him, and bless the name of the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sapientiam omnium antiquorum exquiret sapiens, et in prophetis vacabit.\"},{\"verse\":2,\"text\":\"Narrationem virorum nominatorum conservabit, et in versutias parabolarum simul introibit.\"},{\"verse\":3,\"text\":\"Occulta proverbiorum exquiret, et in absconditis parabolarum conversabitur.\"},{\"verse\":4,\"text\":\"In medio magnatorum ministrabit, et in conspectu præsidis apparebit.\"},{\"verse\":5,\"text\":\"In terram alienigenarum gentium pertransiet : bona enim et mala in hominibus tentabit.\"},{\"verse\":6,\"text\":\"Cor suum tradet ad vigilandum diluculo ad Dominum, qui fecit illum, et in conspectu Altissimi deprecabitur.\"},{\"verse\":7,\"text\":\"Aperiet os suum in oratione, et pro delictis suis deprecabitur.\"},{\"verse\":8,\"text\":\"Si enim Dominus magnus voluerit, spiritu intelligentiæ replebit illum :\"},{\"verse\":9,\"text\":\"et ipse tamquam imbres mittet eloquia sapientiæ suæ, et in oratione confitebitur Domino :\"},{\"verse\":10,\"text\":\"et ipse diriget consilium ejus, et disciplinam, et in absconditis suis consiliabitur.\"},{\"verse\":11,\"text\":\"Ipse palam faciet disciplinam doctrinæ suæ, et in lege testamenti Domini gloriabitur.\"},{\"verse\":12,\"text\":\"Collaudabunt multi sapientiam ejus, et usque in sæculum non delebitur.\"},{\"verse\":13,\"text\":\"Non recedet memoria ejus, et nomen ejus requiretur a generatione in generationem.\"},{\"verse\":14,\"text\":\"Sapientiam ejus enarrabunt gentes, et laudem ejus enuntiabit ecclesia.\"},{\"verse\":15,\"text\":\"Si permanserit, nomen derelinquet plus quam mille : et si requieverit, proderit illi.\"},{\"verse\":16,\"text\":\"Adhuc consiliabor ut enarrem : ut furore enim repletus sum.\"},{\"verse\":17,\"text\":\"In voce dicit : Obaudite me, divini fructus, et quasi rosa plantata super rivos aquarum fructificate.\"},{\"verse\":18,\"text\":\"Quasi Libanus odorem suavitatis habete.\"},{\"verse\":19,\"text\":\"Florete flores quasi lilium : et date odorem, et frondete in gratiam : et collaudate canticum, et benedicite Dominum in operibus suis.\"},{\"verse\":20,\"text\":\"Date nomini ejus magnificentiam, et confitemini illi in voce labiorum vestrorum, et in canticis labiorum, et citharis : et sic dicetis in confessione :\"},{\"verse\":21,\"text\":\"Opera Domini universa bona valde.\"},{\"verse\":22,\"text\":\"In verbo ejus stetit aqua sicut congeries : et in sermone oris illius sicut exceptoria aquarum :\"},{\"verse\":23,\"text\":\"quoniam in præcepto ipsius placor fit, et non est minoratio in salute ipsius.\"},{\"verse\":24,\"text\":\"Opera omnis carnis coram illo, et non est quidquam absconditum ab oculis ejus.\"},{\"verse\":25,\"text\":\"A sæculo usque in sæculum respicit, et nihil est mirabile in conspectu ejus.\"},{\"verse\":26,\"text\":\"Non est dicere : Quid est hoc, aut quid est istud ? omnia enim in tempore suo quærentur.\"},{\"verse\":27,\"text\":\"Benedictio illius quasi fluvius inundavit.\"},{\"verse\":28,\"text\":\"Quomodo cataclysmus aridam inebriavit, sic ira ipsius gentes quæ non exquisierunt eum hæreditabit.\"},{\"verse\":29,\"text\":\"Quomodo convertit aquas in siccitatem, et siccata est terra, et viæ illius viis illorum directæ sunt, sic peccatoribus offensiones in ira ejus.\"},{\"verse\":30,\"text\":\"Bona bonis creata sunt ab initio : sic nequissimis bona et mala.\"},{\"verse\":31,\"text\":\"Initium necessariæ rei vitæ hominum, aqua, ignis, et ferrum, sal, lac, et panis similagineus, et mel, et botrus uvæ, et oleum, et vestimentum.\"},{\"verse\":32,\"text\":\"Hæc omnia sanctis in bona, sic et impiis et peccatoribus in mala convertentur.\"},{\"verse\":33,\"text\":\"Sunt spiritus qui ad vindictam creati sunt, et in furore suo confirmaverunt tormenta sua.\"},{\"verse\":34,\"text\":\"In tempore consummationis effundent virtutem, et furorem ejus qui fecit illos placabunt.\"},{\"verse\":35,\"text\":\"Ignis, grando, fames, et mors, omnia hæc ad vindictam creata sunt :\"},{\"verse\":36,\"text\":\"bestiarum dentes, et scorpii, et serpentes, et rhomphæa vindicans in exterminium impios.\"},{\"verse\":37,\"text\":\"In mandatis ejus epulabuntur : et super terram in necessitatem præparabuntur, et in temporibus suis non præterient verbum.\"},{\"verse\":38,\"text\":\"Propterea ab initio confirmatus sum, et consiliatus sum, et cogitavi, et scripta dimisi.\"},{\"verse\":39,\"text\":\"Omnia opera Domini bona, et omne opus hora sua subministrabit.\"},{\"verse\":40,\"text\":\"Non est dicere : Hoc illo nequius est : omnia enim in tempore suo comprobabuntur.\"},{\"verse\":41,\"text\":\"Et nunc in omni corde et ore collaudate, et benedicite nomen Domini.\"}],\"summary\":\"The exercises of the wise man. The Lord is to be glorified for his works.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":38,\"label\":\"Sirach 38\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":40,\"label\":\"Sirach 40\"}}]]\n"])</script></body></html>
