A" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Be not jealous over the wife of thy bosom, lest she shew in thy regard the malice of a wicked lesson.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Give not the power of thy soul to a woman, lest she enter upon thy strength, and thou be confounded.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Look not upon a woman that hath a mind for many: lest thou fall into her snares.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Use not much the company of her that is a dancer, and hearken not to her, lest thou perish by the force of her charms.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Gaze not upon a maiden, lest her beauty be a stumblingblock to thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Give not thy soul to harlots in any point: lest thou destroy thyself and thy inheritance.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Look not round about thee in the ways of the city, nor wander up and down in the streets thereof.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Turn away thy face from a woman dressed up, and gaze not about upon another’s beauty.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For many have perished by the beauty of a woman, and hereby lust is enkindled as a fire.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Every woman that is a harlot, shall be trodden upon as dung in the way.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Many by admiring the beauty of another man’s wife, have become reprobate, for her conversation burneth as fire.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sit not at all with another man’s wife, nor repose upon the bed with her:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And strive not with her over wine, lest thy heart decline towards her and by thy blood thou fall into destruction.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Forsake not an old friend, for the new will not be like to him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>A new friend is as new wine: it shall grow old, and thou shalt drink it with pleasure.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Envy not the glory and riches of a sinner: for thou knowest not what his ruin shall be.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Be not pleased with the wrong done by the unjust, knowing that even to hell the wicked shall not please.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Keep thee far from the man that hath power to kill, so thou shalt not suspect the fear of death.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And if thou come to him, commit no fault, lest he take away thy life.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Know it to be a communication with death: for thou art going in the midst of snares, and walking upon the arms of them that are grieved.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>According to thy power beware of thy neighbour, and treat with the wise and prudent.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Let just men be thy guests, and let thy glory be in the fear of God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And let the thought of God be in thy mind, and all thy discourse on the commandments of the Highest.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Works shall be praised for the hand of the artificers, and the prince of the people for the wisdom of his speech, but the word of the ancients for the sense.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>A man full of tongue is terrible in his city, and he that is rash in his word shall be hateful.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Non zeles mulierem sinus tui, ne ostendat super te malitiam doctrinæ nequam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Non des mulieri potestatem animæ tuæ, ne ingrediatur in virtutem tuam, et confundaris.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ne respicias mulierem multivolam, ne forte incidas in laqueos illius.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cum saltatrice ne assiduus sis, nec audias illam, ne forte pereas in efficacia illius.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Virginem ne conspicias, ne forte scandalizeris in decore illius.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ne des fornicariis animam tuam in ullo, ne perdas te et hæreditatem tuam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Noli circumspicere in vicis civitatis, nec oberraveris in plateis illius.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Averte faciem tuam a muliere compta, et ne circumspicias speciem alienam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Propter speciem mulieris multi perierunt : et ex hoc concupiscentia quasi ignis exardescit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnis mulier quæ est fornicaria, quasi stercus in via conculcabitur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Speciem mulieris alienæ multi admirati, reprobi facti sunt : colloquium enim illius quasi ignis exardescit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum aliena muliere ne sedeas omnino, nec accumbas cum ea super cubitum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et non alterceris cum illa in vino, ne forte declinet cor tuum in illam, et sanguine tuo labaris in perditionem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ne derelinquas amicum antiquum : novus enim non erit similis illi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vinum novum amicus novus : veterascet, et cum suavitate bibes illud.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non zeles gloriam et opes peccatoris : non enim scis quæ futura sit illius subversio.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non placeat tibi injuria injustorum, sciens quoniam usque ad inferos non placebit impius.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Longe abesto ab homine potestatem habente occidendi, et non suspicaberis timorem mortis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et si accesseris ad illum, noli aliquid committere, ne forte auferat vitam tuam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Communionem mortis scito, quoniam in medio laqueorum ingredieris, et super dolentium arma ambulabis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Secundum virtutem tuam cave te a proximo tuo, et cum sapientibus et prudentibus tracta.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Viri justi sint tibi convivæ, et in timore Dei sit tibi gloriatio :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et in sensu sit tibi cogitatus Dei, et omnis enarratio tua in præceptis Altissimi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In manu artificum opera laudabuntur, et princeps populi in sapientia sermonis sui, in sensu vero seniorum verbum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Terribilis est in civitate sua homo linguosus : et temerarius in verbo suo odibilis erit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border bord l languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.9\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":9,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Be not jealous over the wife of thy bosom, lest she shew in thy regard the malice of a wicked lesson.\"},{\"verse\":2,\"text\":\"Give not the power of thy soul to a woman, lest she enter upon thy strength, and thou be confounded.\"},{\"verse\":3,\"text\":\"Look not upon a woman that hath a mind for many: lest thou fall into her snares.\"},{\"verse\":4,\"text\":\"Use not much the company of her that is a dancer, and hearken not to her, lest thou perish by the force of her charms.\"},{\"verse\":5,\"text\":\"Gaze not upon a maiden, lest her beauty be a stumblingblock to thee.\"},{\"verse\":6,\"text\":\"Give not thy soul to harlots in any point: lest thou destroy thyself and thy inheritance.\"},{\"verse\":7,\"text\":\"Look not round about thee in the ways of the city, nor wander up and down in the streets thereof.\"},{\"verse\":8,\"text\":\"Turn away thy face from a woman dressed up, and gaze not about upon another’s beauty.\"},{\"verse\":9,\"text\":\"For many have perished by the beauty of a woman, and hereby lust is enkindled as a fire.\"},{\"verse\":10,\"text\":\"Every woman that is a harlot, shall be trodden upon as dung in the way.\"},{\"verse\":11,\"text\":\"Many by admiring the beauty of another man’s wife, have become reprobate, for her conversation burneth as fire.\"},{\"verse\":12,\"text\":\"Sit not at all with another man’s wife, nor repose upon the bed with her:\"},{\"verse\":13,\"text\":\"And strive not with her over wine, lest thy heart decline towards her and by thy blood thou fall into destruction.\"},{\"verse\":14,\"text\":\"Forsake not an old friend, for the new will not be like to him.\"},{\"verse\":15,\"text\":\"A new friend is as new wine: it shall grow old, and thou shalt drink it with pleasure.\"},{\"verse\":16,\"text\":\"Envy not the glory and riches of a sinner: for thou knowest not what his ruin shall be.\"},{\"verse\":17,\"text\":\"Be not pleased with the wrong done by the unjust, knowing that even to hell the wicked shall not please.\"},{\"verse\":18,\"text\":\"Keep thee far from the man that hath power to kill, so thou shalt not suspect the fear of death.\"},{\"verse\":19,\"text\":\"And if thou come to him, commit no fault, lest he take away thy life.\"},{\"verse\":20,\"text\":\"Know it to be a communication with death: for thou art going in the midst of snares, and walking upon the arms of them that are grieved.\"},{\"verse\":21,\"text\":\"According to thy power beware of thy neighbour, and treat with the wise and prudent.\"},{\"verse\":22,\"text\":\"Let just men be thy guests, and let thy glory be in the fear of God.\"},{\"verse\":23,\"text\":\"And let the thought of God be in thy mind, and all thy discourse on the commandments of the Highest.\"},{\"verse\":24,\"text\":\"Works shall be praised for the hand of the artificers, and the prince of the people for the wisdom of his speech, but the word of the ancients for the sense.\"},{\"verse\":25,\"text\":\"A man full of tongue is terrible in his city, and he that is rash in his word shall be hateful.\"}],\"vul\":[{\"verse\":1,\"text\":\"Non zeles mulierem sinus tui, ne ostendat super te malitiam doctrinæ nequam.\"},{\"verse\":2,\"text\":\"Non des mulieri potestatem animæ tuæ, ne ingrediatur in virtutem tuam, et confundaris.\"},{\"verse\":3,\"text\":\"Ne respicias mulierem multivolam, ne forte incidas in laqueos illius.\"},{\"verse\":4,\"text\":\"Cum saltatrice ne assiduus sis, nec audias illam, ne forte pereas in efficacia illius.\"},{\"verse\":5,\"text\":\"Virginem ne conspicias, ne forte scandalizeris in decore illius.\"},{\"verse\":6,\"text\":\"Ne des fornicariis animam tuam in ullo, ne perdas te et hæreditatem tuam.\"},{\"verse\":7,\"text\":\"Noli circumspicere in vicis civitatis, nec oberraveris in plateis illius.\"},{\"verse\":8,\"text\":\"Averte faciem tuam a muliere compta, et ne circumspicias speciem alienam.\"},{\"verse\":9,\"text\":\"Propter speciem mulieris multi perierunt : et ex hoc concupiscentia quasi ignis exardescit.\"},{\"verse\":10,\"text\":\"Omnis mulier quæ est fornicaria, quasi stercus in via conculcabitur.\"},{\"verse\":11,\"text\":\"Speciem mulieris alienæ multi admirati, reprobi facti sunt : colloquium enim illius quasi ignis exardescit.\"},{\"verse\":12,\"text\":\"Cum aliena muliere ne sedeas omnino, nec accumbas cum ea super cubitum :\"},{\"verse\":13,\"text\":\"et non alterceris cum illa in vino, ne forte declinet cor tuum in illam, et sanguine tuo labaris in perditionem.\"},{\"verse\":14,\"text\":\"Ne derelinquas amicum antiquum : novus enim non erit similis illi.\"},{\"verse\":15,\"text\":\"Vinum novum amicus novus : veterascet, et cum suavitate bibes illud.\"},{\"verse\":16,\"text\":\"Non zeles gloriam et opes peccatoris : non enim scis quæ futura sit illius subversio.\"},{\"verse\":17,\"text\":\"Non placeat tibi injuria injustorum, sciens quoniam usque ad inferos non placebit impius.\"},{\"verse\":18,\"text\":\"Longe abesto ab homine potestatem habente occidendi, et non suspicaberis timorem mortis.\"},{\"verse\":19,\"text\":\"Et si accesseris ad illum, noli aliquid committere, ne forte auferat vitam tuam.\"},{\"verse\":20,\"text\":\"Communionem mortis scito, quoniam in medio laqueorum ingredieris, et super dolentium arma ambulabis.\"},{\"verse\":21,\"text\":\"Secundum virtutem tuam cave te a proximo tuo, et cum sapientibus et prudentibus tracta.\"},{\"verse\":22,\"text\":\"Viri justi sint tibi convivæ, et in timore Dei sit tibi gloriatio :\"},{\"verse\":23,\"text\":\"et in sensu sit tibi cogitatus Dei, et omnis enarratio tua in præceptis Altissimi.\"},{\"verse\":24,\"text\":\"In manu artificum opera laudabuntur, et princeps populi in sapientia sermonis sui, in sensu vero seniorum verbum.\"},{\"verse\":25,\"text\":\"Terribilis est in civitate sua homo linguosus : et temerarius in verbo suo odibilis erit.\"}],\"summary\":\"Cautions with regard to women, and dangerous conversations.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":8,\"label\":\"Sirach 8\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":10,\"label\":\"Sirach 10\"}}]]\n"])</script></body></html>
