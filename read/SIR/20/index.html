20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">20</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ecclesiasticus</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Rules with regard to correction, discretion, and avoiding lies.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>How much better is it to reprove, than to be angry, and not to hinder him that confesseth in prayer.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The lust of an eunuch shall deflour a young maiden:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>So is he that by violence executeth of the unwise.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>How good is it, when thou art reproved, to shew repentance! for so thou shalt escape wilful sin.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>There is one that holdeth his peace, that is found wise: and there is another that is hateful, that is bold in speech.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>There is one that holdeth his peace, because he knoweth not what to say: and there is another that holdeth his peace, knowing the proper time.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>A wise man will hold his peace till he see opportunity: but a babbler, and a fool, will regard no time.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that useth many words shall hurt his own soul: and he that taketh authority to himself unjustly shall be hated.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>There is success in evil things to a man without discipline, and there is a finding that turneth to loss.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>There is a gift that is not profitable: and there is a gift, the recompense of which is double.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>There is an abasement because of glory: and there is one that shall lift up his head from a low estate.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>There is that buyeth much for a small price, and restoreth the same sevenfold.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>A man wise in words shall make himself beloved: but the graces of fools shall be poured out.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The gift of the fool shall do thee no good: for his eyes are sevenfold.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He will give a few things, and upbraid much: and the opening of his mouth is the kindling of a fire.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>To day a man lendeth, and to morrow he asketh it again: such a man as this is hateful.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>A fool shall have no friend, and there shall be no thanks for his good deeds.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For they that eat his bread, are of a false tongue. How often, and how many will laugh him to scorn!</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For he doth not distribute with right understanding that which was to be had: in like manner also that which was not to be had.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The slipping of a false tongue is as one that falleth on the pavement: so the fall of the wicked shall come speedily.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A man without grace is as a vain fable, it shall be continually in the mouth of the unwise.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A parable coming out of a fool’s mouth shall be rejected: for he doth not speak it in due season.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>There is that is hindered from sinning through want, and in his rest he shall be pricked.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>There is that will destroy his own soul through shamefacedness, and by occasion of an unwise person he will destroy it: and by respect of person he will destroy himself.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>There is that for bashfulness promiseth to his friend, and maketh him his enemy for nothing.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A lie is a foul blot in a man, and yet it will be continually in the mouth of men without discipline.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>A thief is better than a man that is always lying: but both of them shall inherit destruction.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The manners of lying men are without honour: and their confusion is with them without ceasing.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>A wise man shall advance himself with his words, and a prudent man shall please the great ones.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>He that tilleth his land shall make a high heap of corn: and he that worketh justice shall be exalted: and he that pleaseth great men shall escape iniquity.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Presents and gifts blind the eyes of judges, and make them dumb in the mouth, so that they cannot correct.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>O Wisdom that is hid, and treasure that is not seen: what profit is there in them both?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Better is he that hideth his folly, than the man that hideth his wisdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quam bonum est arguere, quam irasci, et confitentem in oratione non prohibere !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Concupiscentia spadonis devirginabit juvenculam :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>sic qui facit per vim judicium iniquum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quam bonum est correptum manifestare pœnitentiam ! sic enim effugies voluntarium peccatum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Est tacens qui invenitur sapiens : et est odibilis qui procax est ad loquendum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Est tacens non habens sensum loquelæ : et est tacens sciens tempus aptum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Homo sapiens tacebit usque ad tempus : lascivus autem et imprudens non servabunt tempus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui multis utitur verbis lædet animam suam : et qui potestatem sibi sumit injuste, odietur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Est processio in malis viro indisciplinato, et est inventio in detrimentum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Est datum quod non est utile, et est datum cujus retributio duplex.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Est propter gloriam minoratio, et est qui ab humilitate levabit caput.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Est qui multa redimat modico pretio, et restituens ea in septuplum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sapiens in verbis seipsum amabilem facit : gratiæ autem fatuorum effundentur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Datus insipientis non erit utilis tibi : oculi enim illius septemplices sunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Exigua dabit, et multa improperabit : et apertio oris illius inflammatio est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hodie fœneratur quis, et cras expetit : odibilis est homo hujusmodi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fatuo non erit amicus, et non erit gratia bonis illius :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>qui enim edunt panem illius, falsæ linguæ sunt. Quoties et quanti irridebunt eum !</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>neque enim quod habendum erat directo sensu distribuit ; similiter et quod non erat habendum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Lapsus falsæ linguæ quasi qui in pavimento cadens : sic casus malorum festinanter veniet.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Homo acharis quasi fabula vana, in ore indisciplinatorum assidua erit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ex ore fatui reprobabitur parabola : non enim dicit illam in tempore suo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Est qui vetatur peccare præ inopia, et in requie sua stimulabitur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Est qui perdet animam suam præ confusione, et ab imprudenti persona perdet eam : personæ autem acceptione perdet se.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Est qui præ confusione promittit amico, et lucratus est eum inimicum gratis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Opprobrium nequam in homine mendacium : et in ore indisciplinatorum assidue erit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Potior fur quam assiduitas viri mendacis : perditionem autem ambo hæreditabunt.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mores hominum mendacium sine honore, et confusio illorum cum ipsis sine intermissione.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Sapiens in verbis producet seipsum, et homo prudens placebit magnatis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Qui operatur terram suam inaltabit acervum frugum, et qui operatur justitiam, ipse exaltabitur : qui vero placet magnatis effugiet iniquitatem.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Xenia et dona excæcant oculos judicum, et quasi mutus, in ore avertit correptiones eorum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sapientia absconsa, et thesaurus invisus, quæ utilitas in utrisque ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Melior est qui celat insipientiam suam, quam homo qui abscondit sapientiam suam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->20<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 19" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path apter\":20,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"How much better is it to reprove, than to be angry, and not to hinder him that confesseth in prayer.\"},{\"verse\":2,\"text\":\"The lust of an eunuch shall deflour a young maiden:\"},{\"verse\":3,\"text\":\"So is he that by violence executeth of the unwise.\"},{\"verse\":4,\"text\":\"How good is it, when thou art reproved, to shew repentance! for so thou shalt escape wilful sin.\"},{\"verse\":5,\"text\":\"There is one that holdeth his peace, that is found wise: and there is another that is hateful, that is bold in speech.\"},{\"verse\":6,\"text\":\"There is one that holdeth his peace, because he knoweth not what to say: and there is another that holdeth his peace, knowing the proper time.\"},{\"verse\":7,\"text\":\"A wise man will hold his peace till he see opportunity: but a babbler, and a fool, will regard no time.\"},{\"verse\":8,\"text\":\"He that useth many words shall hurt his own soul: and he that taketh authority to himself unjustly shall be hated.\"},{\"verse\":9,\"text\":\"There is success in evil things to a man without discipline, and there is a finding that turneth to loss.\"},{\"verse\":10,\"text\":\"There is a gift that is not profitable: and there is a gift, the recompense of which is double.\"},{\"verse\":11,\"text\":\"There is an abasement because of glory: and there is one that shall lift up his head from a low estate.\"},{\"verse\":12,\"text\":\"There is that buyeth much for a small price, and restoreth the same sevenfold.\"},{\"verse\":13,\"text\":\"A man wise in words shall make himself beloved: but the graces of fools shall be poured out.\"},{\"verse\":14,\"text\":\"The gift of the fool shall do thee no good: for his eyes are sevenfold.\"},{\"verse\":15,\"text\":\"He will give a few things, and upbraid much: and the opening of his mouth is the kindling of a fire.\"},{\"verse\":16,\"text\":\"To day a man lendeth, and to morrow he asketh it again: such a man as this is hateful.\"},{\"verse\":17,\"text\":\"A fool shall have no friend, and there shall be no thanks for his good deeds.\"},{\"verse\":18,\"text\":\"For they that eat his bread, are of a false tongue. How often, and how many will laugh him to scorn!\"},{\"verse\":19,\"text\":\"For he doth not distribute with right understanding that which was to be had: in like manner also that which was not to be had.\"},{\"verse\":20,\"text\":\"The slipping of a false tongue is as one that falleth on the pavement: so the fall of the wicked shall come speedily.\"},{\"verse\":21,\"text\":\"A man without grace is as a vain fable, it shall be continually in the mouth of the unwise.\"},{\"verse\":22,\"text\":\"A parable coming out of a fool’s mouth shall be rejected: for he doth not speak it in due season.\"},{\"verse\":23,\"text\":\"There is that is hindered from sinning through want, and in his rest he shall be pricked.\"},{\"verse\":24,\"text\":\"There is that will destroy his own soul through shamefacedness, and by occasion of an unwise person he will destroy it: and by respect of person he will destroy himself.\"},{\"verse\":25,\"text\":\"There is that for bashfulness promiseth to his friend, and maketh him his enemy for nothing.\"},{\"verse\":26,\"text\":\"A lie is a foul blot in a man, and yet it will be continually in the mouth of men without discipline.\"},{\"verse\":27,\"text\":\"A thief is better than a man that is always lying: but both of them shall inherit destruction.\"},{\"verse\":28,\"text\":\"The manners of lying men are without honour: and their confusion is with them without ceasing.\"},{\"verse\":29,\"text\":\"A wise man shall advance himself with his words, and a prudent man shall please the great ones.\"},{\"verse\":30,\"text\":\"He that tilleth his land shall make a high heap of corn: and he that worketh justice shall be exalted: and he that pleaseth great men shall escape iniquity.\"},{\"verse\":31,\"text\":\"Presents and gifts blind the eyes of judges, and make them dumb in the mouth, so that they cannot correct.\"},{\"verse\":32,\"text\":\"O Wisdom that is hid, and treasure that is not seen: what profit is there in them both?\"},{\"verse\":33,\"text\":\"Better is he that hideth his folly, than the man that hideth his wisdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quam bonum est arguere, quam irasci, et confitentem in oratione non prohibere !\"},{\"verse\":2,\"text\":\"Concupiscentia spadonis devirginabit juvenculam :\"},{\"verse\":3,\"text\":\"sic qui facit per vim judicium iniquum.\"},{\"verse\":4,\"text\":\"Quam bonum est correptum manifestare pœnitentiam ! sic enim effugies voluntarium peccatum.\"},{\"verse\":5,\"text\":\"Est tacens qui invenitur sapiens : et est odibilis qui procax est ad loquendum.\"},{\"verse\":6,\"text\":\"Est tacens non habens sensum loquelæ : et est tacens sciens tempus aptum.\"},{\"verse\":7,\"text\":\"Homo sapiens tacebit usque ad tempus : lascivus autem et imprudens non servabunt tempus.\"},{\"verse\":8,\"text\":\"Qui multis utitur verbis lædet animam suam : et qui potestatem sibi sumit injuste, odietur.\"},{\"verse\":9,\"text\":\"Est processio in malis viro indisciplinato, et est inventio in detrimentum.\"},{\"verse\":10,\"text\":\"Est datum quod non est utile, et est datum cujus retributio duplex.\"},{\"verse\":11,\"text\":\"Est propter gloriam minoratio, et est qui ab humilitate levabit caput.\"},{\"verse\":12,\"text\":\"Est qui multa redimat modico pretio, et restituens ea in septuplum.\"},{\"verse\":13,\"text\":\"Sapiens in verbis seipsum amabilem facit : gratiæ autem fatuorum effundentur.\"},{\"verse\":14,\"text\":\"Datus insipientis non erit utilis tibi : oculi enim illius septemplices sunt.\"},{\"verse\":15,\"text\":\"Exigua dabit, et multa improperabit : et apertio oris illius inflammatio est.\"},{\"verse\":16,\"text\":\"Hodie fœneratur quis, et cras expetit : odibilis est homo hujusmodi.\"},{\"verse\":17,\"text\":\"Fatuo non erit amicus, et non erit gratia bonis illius :\"},{\"verse\":18,\"text\":\"qui enim edunt panem illius, falsæ linguæ sunt. Quoties et quanti irridebunt eum !\"},{\"verse\":19,\"text\":\"neque enim quod habendum erat directo sensu distribuit ; similiter et quod non erat habendum.\"},{\"verse\":20,\"text\":\"Lapsus falsæ linguæ quasi qui in pavimento cadens : sic casus malorum festinanter veniet.\"},{\"verse\":21,\"text\":\"Homo acharis quasi fabula vana, in ore indisciplinatorum assidua erit.\"},{\"verse\":22,\"text\":\"Ex ore fatui reprobabitur parabola : non enim dicit illam in tempore suo.\"},{\"verse\":23,\"text\":\"Est qui vetatur peccare præ inopia, et in requie sua stimulabitur.\"},{\"verse\":24,\"text\":\"Est qui perdet animam suam præ confusione, et ab imprudenti persona perdet eam : personæ autem acceptione perdet se.\"},{\"verse\":25,\"text\":\"Est qui præ confusione promittit amico, et lucratus est eum inimicum gratis.\"},{\"verse\":26,\"text\":\"Opprobrium nequam in homine mendacium : et in ore indisciplinatorum assidue erit.\"},{\"verse\":27,\"text\":\"Potior fur quam assiduitas viri mendacis : perditionem autem ambo hæreditabunt.\"},{\"verse\":28,\"text\":\"Mores hominum mendacium sine honore, et confusio illorum cum ipsis sine intermissione.\"},{\"verse\":29,\"text\":\"Sapiens in verbis producet seipsum, et homo prudens placebit magnatis.\"},{\"verse\":30,\"text\":\"Qui operatur terram suam inaltabit acervum frugum, et qui operatur justitiam, ipse exaltabitur : qui vero placet magnatis effugiet iniquitatem.\"},{\"verse\":31,\"text\":\"Xenia et dona excæcant oculos judicum, et quasi mutus, in ore avertit correptiones eorum.\"},{\"verse\":32,\"text\":\"Sapientia absconsa, et thesaurus invisus, quæ utilitas in utrisque ?\"},{\"verse\":33,\"text\":\"Melior est qui celat insipientiam suam, quam homo qui abscondit sapientiam suam.\"}],\"summary\":\"Rules with regard to correction, discretion, and avoiding lies.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":19,\"label\":\"Sirach 19\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":21,\"label\":\"Sirach 21\"}}]]\n"])</script></body></html>
