[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">51</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A prayer of praise and thanksgiving.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A prayer of Jesus the son of Sirach. I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will give glory to thy name: for thou hast been a helper and protector to me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And hast preserved my body from destruction, from the snare of an unjust tongue, and from the lips of them that forge lies, and in the sight of them that stood by, thou hast been my helper.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>From the oppression of the flame which surrounded me, and in the midst of the fire I was not burnt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>From the depth of the belly of hell, and from an unclean tongue, and from lying words, from an unjust king, and from a slanderous tongue:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>My soul shall praise the Lord even to death.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And my life was drawing near to hell beneath.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They compassed me on every side, and there was no one that would help me. I looked for the succour of men, and there was none.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I remembered thy mercy, O Lord, and thy works, which are from the beginning of the world.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I will praise thy name continually, and will praise it with thanksgiving, and my prayer was heard.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And thou hast saved me from destruction, and hast delivered me from the evil time.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Therefore I will give thanks, and praise thee, and bless the name of the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When I was yet young, before I wandered about, I sought for wisdom openly in my prayer.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I prayed for her before the temple, and unto the very end I will seek after her, and she flourished as a grape soon ripe.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>My heart delighted in her, my foot walked in the right way, from my youth up I sought after her.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I bowed down my ear a little, and received her.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>I found much wisdom in myself, and profited much therein.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>To him that giveth me wisdom, will I give glory.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For I have determined to follow her: I have had a zeal for good, and shall not be confounded.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>My soul hath wrestled for her, and in doing it I have been confirmed.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>I stretched forth my hands on high, and I bewailed my ignorance of her.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>I directed my soul to her, and in knowledge I found her.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>I possessed my heart with her from the beginning: therefore I shall not be forsaken.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>My entrails were troubled in seeking her: therefore shall I possess a good possession.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The Lord hath given me a tongue for my reward: and with it I will praise him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Draw near to me, ye unlearned, and gather yourselves together into the house of discipline.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Why are ye slow and what do you say of these things? your souls are exceeding thirsty.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>I have opened my mouth, and have spoken: buy her for yourselves without silver,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And submit your neck to the yoke, and let your soul receive discipline: for she is near at hand to be found.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Behold with your eyes how I have laboured a little, and have found much rest to myself.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Receive ye discipline as a great sum of money, and possess abundance of gold by her.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Let your soul rejoice in his mercy and you shall not be confounded in his praise.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Work your work before the time, and he will give you your reward in his time.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Oratio Jesu filii Sirach. Confitebor tibi, Domine rex, et collaudabo te Deum salvatorem meum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Confitebor nomini tuo, quoniam adjutor et protector factus es mihi,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et liberasti corpus meum a perditione : a laqueo linguæ iniquæ, et a labiis operantium mendacium : et in conspectu astantium factus es mihi adjutor.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et liberasti me, secundum multitudinem misericordiæ nominis tui, a rugientibus præparatis ad escam :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>de manibus quærentium animam meam, et de portis tribulationum quæ circumdederunt me ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>a pressura flammæ quæ circumdedit me, et in medio ignis non sum æstuatus ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>de altitudine ventris inferi, et a lingua coinquinata, et a verbo mendacii, a rege iniquo, et a lingua injusta.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Laudabit usque ad mortem anima mea Dominum,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et vita mea appropinquans erat in inferno deorsum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Circumdederunt me undique, et non erat qui adjuvaret : respiciens eram ad adjutorium hominum, et non erat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Memoratus sum misericordiæ tuæ Domine, et operationis tuæ, quæ a sæculo sunt :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quoniam eruis sustinentes te, Domine, et liberas eos de manibus gentium.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Exaltasti super terram habitationem meam, et pro morte defluente deprecatus sum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Invocavi Dominum patrem Domini mei, ut non derelinquat me in die tribulationis meæ, et in tempore superborum, sine adjutorio.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Laudabo nomen tuum assidue, et collaudabo illud in confessione : et exaudita est oratio mea,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et liberasti me de perditione, et eripuisti me de tempore iniquo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Propterea confitebor, et laudem dicam tibi, et benedicam nomini Domini.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cum adhuc junior essem, priusquam oberrarem, quæsivi sapientiam palam in oratione mea.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ante templum postulabam pro illis, et usque in novissimis inquiram eam : et effloruit tamquam præcox uva.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Lætatum est cor meum in ea : ambulavit pes meus iter rectum : a juventute mea investigabam eam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Inclinavi modico aurem meam, et excepi illam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Multam inveni in meipso sapientiam, et multum profeci in ea.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Danti mihi sapientiam dabo gloriam :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>consiliatus sum enim ut facerem illam. Zelatus sum bonum, et non confundar.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Colluctata est anima mea in illa, et in faciendo eam confirmatus sum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Manus meas extendi in altum, et insipientiam ejus luxi ;</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>animam meam direxi ad illam, et in agnitione inveni eam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Possedi cum ipsa cor ab initio : propter hoc, non derelinquar.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Venter meus conturbatus est quærendo illam : propterea bonam possidebo possessionem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Dedit mihi Dominus linguam mercedem meam, et in ipsa laudabo eum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Appropiate ad me, indocti, et congregate vos in domum disciplinæ.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quid adhuc retardatis ? et quid dicitis in his ? animæ vestræ sitiunt vehementer.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Aperui os meum, et locutus sum : Comparate vobis sine argento,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et collum vestrum subjicite jugo : et suscipiat anima vestra disciplinam : in proximo est enim invenire eam.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Videte oculis vestris, quia modicum laboravi, et inveni mihi multam requiem.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Assumite disciplinam in multo numero argenti, et copiosum aurum possidete in ea.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Lætetur anima vestra in misericordia ejus, et non confundemini in laude ipsius.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Operamini opus vestrum ante tempus, et dabit vobis mercedem vestram in tempore suo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/re otalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"A prayer of Jesus the son of Sirach. I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour.\"},{\"verse\":2,\"text\":\"I will give glory to thy name: for thou hast been a helper and protector to me.\"},{\"verse\":3,\"text\":\"And hast preserved my body from destruction, from the snare of an unjust tongue, and from the lips of them that forge lies, and in the sight of them that stood by, thou hast been my helper.\"},{\"verse\":4,\"text\":\"And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour.\"},{\"verse\":5,\"text\":\"Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about:\"},{\"verse\":6,\"text\":\"From the oppression of the flame which surrounded me, and in the midst of the fire I was not burnt.\"},{\"verse\":7,\"text\":\"From the depth of the belly of hell, and from an unclean tongue, and from lying words, from an unjust king, and from a slanderous tongue:\"},{\"verse\":8,\"text\":\"My soul shall praise the Lord even to death.\"},{\"verse\":9,\"text\":\"And my life was drawing near to hell beneath.\"},{\"verse\":10,\"text\":\"They compassed me on every side, and there was no one that would help me. I looked for the succour of men, and there was none.\"},{\"verse\":11,\"text\":\"I remembered thy mercy, O Lord, and thy works, which are from the beginning of the world.\"},{\"verse\":12,\"text\":\"How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations.\"},{\"verse\":13,\"text\":\"Thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away.\"},{\"verse\":14,\"text\":\"I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help.\"},{\"verse\":15,\"text\":\"I will praise thy name continually, and will praise it with thanksgiving, and my prayer was heard.\"},{\"verse\":16,\"text\":\"And thou hast saved me from destruction, and hast delivered me from the evil time.\"},{\"verse\":17,\"text\":\"Therefore I will give thanks, and praise thee, and bless the name of the Lord.\"},{\"verse\":18,\"text\":\"When I was yet young, before I wandered about, I sought for wisdom openly in my prayer.\"},{\"verse\":19,\"text\":\"I prayed for her before the temple, and unto the very end I will seek after her, and she flourished as a grape soon ripe.\"},{\"verse\":20,\"text\":\"My heart delighted in her, my foot walked in the right way, from my youth up I sought after her.\"},{\"verse\":21,\"text\":\"I bowed down my ear a little, and received her.\"},{\"verse\":22,\"text\":\"I found much wisdom in myself, and profited much therein.\"},{\"verse\":23,\"text\":\"To him that giveth me wisdom, will I give glory.\"},{\"verse\":24,\"text\":\"For I have determined to follow her: I have had a zeal for good, and shall not be confounded.\"},{\"verse\":25,\"text\":\"My soul hath wrestled for her, and in doing it I have been confirmed.\"},{\"verse\":26,\"text\":\"I stretched forth my hands on high, and I bewailed my ignorance of her.\"},{\"verse\":27,\"text\":\"I directed my soul to her, and in knowledge I found her.\"},{\"verse\":28,\"text\":\"I possessed my heart with her from the beginning: therefore I shall not be forsaken.\"},{\"verse\":29,\"text\":\"My entrails were troubled in seeking her: therefore shall I possess a good possession.\"},{\"verse\":30,\"text\":\"The Lord hath given me a tongue for my reward: and with it I will praise him.\"},{\"verse\":31,\"text\":\"Draw near to me, ye unlearned, and gather yourselves together into the house of discipline.\"},{\"verse\":32,\"text\":\"Why are ye slow and what do you say of these things? your souls are exceeding thirsty.\"},{\"verse\":33,\"text\":\"I have opened my mouth, and have spoken: buy her for yourselves without silver,\"},{\"verse\":34,\"text\":\"And submit your neck to the yoke, and let your soul receive discipline: for she is near at hand to be found.\"},{\"verse\":35,\"text\":\"Behold with your eyes how I have laboured a little, and have found much rest to myself.\"},{\"verse\":36,\"text\":\"Receive ye discipline as a great sum of money, and possess abundance of gold by her.\"},{\"verse\":37,\"text\":\"Let your soul rejoice in his mercy and you shall not be confounded in his praise.\"},{\"verse\":38,\"text\":\"Work your work before the time, and he will give you your reward in his time.\"}],\"vul\":[{\"verse\":1,\"text\":\"Oratio Jesu filii Sirach. Confitebor tibi, Domine rex, et collaudabo te Deum salvatorem meum.\"},{\"verse\":2,\"text\":\"Confitebor nomini tuo, quoniam adjutor et protector factus es mihi,\"},{\"verse\":3,\"text\":\"et liberasti corpus meum a perditione : a laqueo linguæ iniquæ, et a labiis operantium mendacium : et in conspectu astantium factus es mihi adjutor.\"},{\"verse\":4,\"text\":\"Et liberasti me, secundum multitudinem misericordiæ nominis tui, a rugientibus præparatis ad escam :\"},{\"verse\":5,\"text\":\"de manibus quærentium animam meam, et de portis tribulationum quæ circumdederunt me ;\"},{\"verse\":6,\"text\":\"a pressura flammæ quæ circumdedit me, et in medio ignis non sum æstuatus ;\"},{\"verse\":7,\"text\":\"de altitudine ventris inferi, et a lingua coinquinata, et a verbo mendacii, a rege iniquo, et a lingua injusta.\"},{\"verse\":8,\"text\":\"Laudabit usque ad mortem anima mea Dominum,\"},{\"verse\":9,\"text\":\"et vita mea appropinquans erat in inferno deorsum.\"},{\"verse\":10,\"text\":\"Circumdederunt me undique, et non erat qui adjuvaret : respiciens eram ad adjutorium hominum, et non erat.\"},{\"verse\":11,\"text\":\"Memoratus sum misericordiæ tuæ Domine, et operationis tuæ, quæ a sæculo sunt :\"},{\"verse\":12,\"text\":\"quoniam eruis sustinentes te, Domine, et liberas eos de manibus gentium.\"},{\"verse\":13,\"text\":\"Exaltasti super terram habitationem meam, et pro morte defluente deprecatus sum.\"},{\"verse\":14,\"text\":\"Invocavi Dominum patrem Domini mei, ut non derelinquat me in die tribulationis meæ, et in tempore superborum, sine adjutorio.\"},{\"verse\":15,\"text\":\"Laudabo nomen tuum assidue, et collaudabo illud in confessione : et exaudita est oratio mea,\"},{\"verse\":16,\"text\":\"et liberasti me de perditione, et eripuisti me de tempore iniquo.\"},{\"verse\":17,\"text\":\"Propterea confitebor, et laudem dicam tibi, et benedicam nomini Domini.\"},{\"verse\":18,\"text\":\"Cum adhuc junior essem, priusquam oberrarem, quæsivi sapientiam palam in oratione mea.\"},{\"verse\":19,\"text\":\"Ante templum postulabam pro illis, et usque in novissimis inquiram eam : et effloruit tamquam præcox uva.\"},{\"verse\":20,\"text\":\"Lætatum est cor meum in ea : ambulavit pes meus iter rectum : a juventute mea investigabam eam.\"},{\"verse\":21,\"text\":\"Inclinavi modico aurem meam, et excepi illam.\"},{\"verse\":22,\"text\":\"Multam inveni in meipso sapientiam, et multum profeci in ea.\"},{\"verse\":23,\"text\":\"Danti mihi sapientiam dabo gloriam :\"},{\"verse\":24,\"text\":\"consiliatus sum enim ut facerem illam. Zelatus sum bonum, et non confundar.\"},{\"verse\":25,\"text\":\"Colluctata est anima mea in illa, et in faciendo eam confirmatus sum.\"},{\"verse\":26,\"text\":\"Manus meas extendi in altum, et insipientiam ejus luxi ;\"},{\"verse\":27,\"text\":\"animam meam direxi ad illam, et in agnitione inveni eam.\"},{\"verse\":28,\"text\":\"Possedi cum ipsa cor ab initio : propter hoc, non derelinquar.\"},{\"verse\":29,\"text\":\"Venter meus conturbatus est quærendo illam : propterea bonam possidebo possessionem.\"},{\"verse\":30,\"text\":\"Dedit mihi Dominus linguam mercedem meam, et in ipsa laudabo eum.\"},{\"verse\":31,\"text\":\"Appropiate ad me, indocti, et congregate vos in domum disciplinæ.\"},{\"verse\":32,\"text\":\"Quid adhuc retardatis ? et quid dicitis in his ? animæ vestræ sitiunt vehementer.\"},{\"verse\":33,\"text\":\"Aperui os meum, et locutus sum : Comparate vobis sine argento,\"},{\"verse\":34,\"text\":\"et collum vestrum subjicite jugo : et suscipiat anima vestra disciplinam : in proximo est enim invenire eam.\"},{\"verse\":35,\"text\":\"Videte oculis vestris, quia modicum laboravi, et inveni mihi multam requiem.\"},{\"verse\":36,\"text\":\"Assumite disciplinam in multo numero argenti, et copiosum aurum possidete in ea.\"},{\"verse\":37,\"text\":\"Lætetur anima vestra in misericordia ejus, et non confundemini in laude ipsius.\"},{\"verse\":38,\"text\":\"Operamini opus vestrum ante tempus, et dabit vobis mercedem vestram in tempore suo.\"}],\"summary\":\"A prayer of praise and thanksgiving.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":50,\"label\":\"Sirach 50\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":1,\"label\":\"Isaiah 1\"}}]]\n"])</script></body></html>
