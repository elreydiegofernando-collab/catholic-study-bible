tton type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>By him also the height of the temple was founded, the double building and the high walls of the temple.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In his days the wells of water flowed out, and they were filled as the sea above measure.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He took care of his nation, and delivered it from destruction.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He prevailed to enlarge the city, and obtained glory in his conversation with the people: and enlarged the entrance of the house and the court.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He shone in his days as the morning star in the midst of a cloud, and as the moon at the full.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And as the sun when it shineth, so did he shine in the temple of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And as the rainbow giving light in bright clouds, and as the flower of roses in the days of the spring, and as the lilies that are on the brink of the water, and as the sweet smelling frankincense in the time of summer.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>As a bright fire, and frankincense burning in the fire.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>As a massy vessel of gold, adorned with every precious stone.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As an olive tree budding forth, and a cypress tree rearing itself on high, when he put on the robe of glory, and was clothed with the perfection of power.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>When he went up to the holy altar, he honoured the vesture of holiness.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when he took the portions out of the hands of the priests, he himself stood by the altar. And about him was the ring of his brethren: and as the cedar planted in mount Libanus,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And as branches of palm trees, they stood round about him, and all the sons of Aaron in their glory.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the oblation of the Lord was in their hands, before all the congregation of Israel: and finishing his service, on the altar, to honour the offering of the most high King,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He stretched forth his hand to make a libation, and offered of the blood of the grape.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He poured out at the foot of the altar a divine odour to the most high Prince.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Then the sons of Aaron shouted, they sounded with beaten trumpets, and made a great noise to be heard for a remembrance before God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Then all the people together made haste, and fell down to the earth upon their faces, to adore the Lord their God, and to pray to the Almighty God the most High.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the singers lifted up their voices, and in the great house the sound of sweet melody was increased.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the people in prayer besought the Lord the most High, until the worship of the Lord was perfected, and they had finished their office.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Then coming down, he lifted up his hands over all the congregation of the children of Israel, to give glory to God with his lips, and to glory in his name:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he repeated his prayer, willing to shew the power of God.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And now pray ye to the God of all, who hath done great things in all the earth, who hath increased our days from our mother’s womb, and hath done with us according to his mercy.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>May he grant us joyfulness of heart, and that there be peace in our days in Israel for ever:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>That Israel may believe that the mercy of God is with us, to deliver us in his days.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>There are two nations which my soul abhorreth: and the third is no nation: which I hate:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They that sit on mount Seir, and the Philistines, and the foolish people that dwell in Sichem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Jesus the son of Sirach, of Jerusalem, hath written in this book the doctrine of wisdom and instruction, who renewed wisdom from his heart.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Blessed is he that is conversant in these good things and he that layeth them up in his heart, shall be wise always.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For if he do them, he shall be strong to do all things: because the light of God guideth his steps.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Simon, Oniæ filius, sacerdos magnus, qui in vita sua suffulsit domum, et in diebus suis corroboravit templum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Templi etiam altitudo ab ipso fundata est, duplex ædificatio, et excelsi parietes templi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In diebus ipsius emanaverunt putei aquarum, et quasi mare adimpleti sunt supra modum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui curavit gentem suam, et liberavit eam a perditione :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui prævaluit amplificare civitatem, qui adeptus est gloriam in conversatione gentis, et ingressum domus et atrii amplificavit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quasi stella matutina in medio nebulæ, et quasi luna plena, in diebus suis lucet :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et quasi sol refulgens, sic ille effulsit in templo Dei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quasi arcus refulgens inter nebulas gloriæ, et quasi flos rosarum in diebus vernis, et quasi lilia quæ sunt in transitu aquæ, et quasi thus redolens in diebus æstatis :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>quasi ignis effulgens, et thus ardens in igne :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>quasi vas auri solidum, ornatum omni lapide pretioso :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>quasi oliva pullulans, et cypressus in altitudinem se extollens, in accipiendo ipsum stolam gloriæ, et vestiri eum in consummationem virtutis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In ascensu altaris sancti gloriam dedit sanctitatis amictum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In accipiendo autem partes de manu sacerdotum, et ipse stans juxta aram : et circa illum corona fratrum : quasi plantatio cedri in monte Libano,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>sic circa illum steterunt quasi rami palmæ : et omnes filii Aaron in gloria sua.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Oblatio autem Domini in manibus ipsorum coram omni synagoga Israël : et consummatione fungens in ara, amplificare oblationem excelsi Regis,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>porrexit manum suam in libatione, et libavit de sanguine uvæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Effudit in fundamento altaris odorem divinum excelso Principi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tunc exclamaverunt filii Aaron, in tubis productilibus sonuerunt : et auditam fecerunt vocem magnam in memoriam coram Deo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Tunc omnis populus simul properaverunt, et ceciderunt in faciem super terram, adorare Dominum Deum suum, et dare preces omnipotenti Deo excelso.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et amplificaverunt psallentes in vocibus suis, et in magna domo auctus est sonus suavitatis plenus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et rogavit populus Dominum excelsum in prece, usque dum perfectus est honor Domini, et munus suum perfecerunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tunc descendens, manus suas extulit in omne congregationem filiorum Israël, dare gloriam Deo a labiis suis, et in nomine ipsius gloriari :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et iteravit orationem suam, volens ostendere virtutem Dei.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et nunc orate Deum omnium, qui magna fecit in omni terra, qui auxit dies nostros a ventre matris nostræ, et fecit nobiscum secundum suam misericordiam :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>det nobis jucunditatem cordis, et fieri pacem in diebus nostris in Israël per dies sempiternos :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>credere Israël nobiscum esse Dei misericordiam, ut liberet nos in diebus suis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Duas gentes odit anima mea : tertia autem non est gens quam oderim :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui sedent in monte Seir, et Philisthiim, et stultus populus qui habitat in Sichimis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Doctrinam sapientiæ et disciplinæ scripsit in codice isto Jesus, filius Sirach, Jerosolymita, qui renovavit sapientiam de corde suo.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Beatus qui in istis versatur bonis : qui ponit illa in corde suo, sapiens erit semper.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si enim hæc fecerit, ad omnia valebit, quia lux Dei vestigium ejus est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/49/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 49</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/51/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 51</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->50<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 49" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-80 y-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"SIR.50\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":50,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Simon the high priest, the son of Onias, who in his life propped up the house, and in his days fortified the temple.\"},{\"verse\":2,\"text\":\"By him also the height of the temple was founded, the double building and the high walls of the temple.\"},{\"verse\":3,\"text\":\"In his days the wells of water flowed out, and they were filled as the sea above measure.\"},{\"verse\":4,\"text\":\"He took care of his nation, and delivered it from destruction.\"},{\"verse\":5,\"text\":\"He prevailed to enlarge the city, and obtained glory in his conversation with the people: and enlarged the entrance of the house and the court.\"},{\"verse\":6,\"text\":\"He shone in his days as the morning star in the midst of a cloud, and as the moon at the full.\"},{\"verse\":7,\"text\":\"And as the sun when it shineth, so did he shine in the temple of God.\"},{\"verse\":8,\"text\":\"And as the rainbow giving light in bright clouds, and as the flower of roses in the days of the spring, and as the lilies that are on the brink of the water, and as the sweet smelling frankincense in the time of summer.\"},{\"verse\":9,\"text\":\"As a bright fire, and frankincense burning in the fire.\"},{\"verse\":10,\"text\":\"As a massy vessel of gold, adorned with every precious stone.\"},{\"verse\":11,\"text\":\"As an olive tree budding forth, and a cypress tree rearing itself on high, when he put on the robe of glory, and was clothed with the perfection of power.\"},{\"verse\":12,\"text\":\"When he went up to the holy altar, he honoured the vesture of holiness.\"},{\"verse\":13,\"text\":\"And when he took the portions out of the hands of the priests, he himself stood by the altar. And about him was the ring of his brethren: and as the cedar planted in mount Libanus,\"},{\"verse\":14,\"text\":\"And as branches of palm trees, they stood round about him, and all the sons of Aaron in their glory.\"},{\"verse\":15,\"text\":\"And the oblation of the Lord was in their hands, before all the congregation of Israel: and finishing his service, on the altar, to honour the offering of the most high King,\"},{\"verse\":16,\"text\":\"He stretched forth his hand to make a libation, and offered of the blood of the grape.\"},{\"verse\":17,\"text\":\"He poured out at the foot of the altar a divine odour to the most high Prince.\"},{\"verse\":18,\"text\":\"Then the sons of Aaron shouted, they sounded with beaten trumpets, and made a great noise to be heard for a remembrance before God.\"},{\"verse\":19,\"text\":\"Then all the people together made haste, and fell down to the earth upon their faces, to adore the Lord their God, and to pray to the Almighty God the most High.\"},{\"verse\":20,\"text\":\"And the singers lifted up their voices, and in the great house the sound of sweet melody was increased.\"},{\"verse\":21,\"text\":\"And the people in prayer besought the Lord the most High, until the worship of the Lord was perfected, and they had finished their office.\"},{\"verse\":22,\"text\":\"Then coming down, he lifted up his hands over all the congregation of the children of Israel, to give glory to God with his lips, and to glory in his name:\"},{\"verse\":23,\"text\":\"And he repeated his prayer, willing to shew the power of God.\"},{\"verse\":24,\"text\":\"And now pray ye to the God of all, who hath done great things in all the earth, who hath increased our days from our mother’s womb, and hath done with us according to his mercy.\"},{\"verse\":25,\"text\":\"May he grant us joyfulness of heart, and that there be peace in our days in Israel for ever:\"},{\"verse\":26,\"text\":\"That Israel may believe that the mercy of God is with us, to deliver us in his days.\"},{\"verse\":27,\"text\":\"There are two nations which my soul abhorreth: and the third is no nation: which I hate:\"},{\"verse\":28,\"text\":\"They that sit on mount Seir, and the Philistines, and the foolish people that dwell in Sichem.\"},{\"verse\":29,\"text\":\"Jesus the son of Sirach, of Jerusalem, hath written in this book the doctrine of wisdom and instruction, who renewed wisdom from his heart.\"},{\"verse\":30,\"text\":\"Blessed is he that is conversant in these good things and he that layeth them up in his heart, shall be wise always.\"},{\"verse\":31,\"text\":\"For if he do them, he shall be strong to do all things: because the light of God guideth his steps.\"}],\"vul\":[{\"verse\":1,\"text\":\"Simon, Oniæ filius, sacerdos magnus, qui in vita sua suffulsit domum, et in diebus suis corroboravit templum.\"},{\"verse\":2,\"text\":\"Templi etiam altitudo ab ipso fundata est, duplex ædificatio, et excelsi parietes templi.\"},{\"verse\":3,\"text\":\"In diebus ipsius emanaverunt putei aquarum, et quasi mare adimpleti sunt supra modum.\"},{\"verse\":4,\"text\":\"Qui curavit gentem suam, et liberavit eam a perditione :\"},{\"verse\":5,\"text\":\"qui prævaluit amplificare civitatem, qui adeptus est gloriam in conversatione gentis, et ingressum domus et atrii amplificavit.\"},{\"verse\":6,\"text\":\"Quasi stella matutina in medio nebulæ, et quasi luna plena, in diebus suis lucet :\"},{\"verse\":7,\"text\":\"et quasi sol refulgens, sic ille effulsit in templo Dei.\"},{\"verse\":8,\"text\":\"Quasi arcus refulgens inter nebulas gloriæ, et quasi flos rosarum in diebus vernis, et quasi lilia quæ sunt in transitu aquæ, et quasi thus redolens in diebus æstatis :\"},{\"verse\":9,\"text\":\"quasi ignis effulgens, et thus ardens in igne :\"},{\"verse\":10,\"text\":\"quasi vas auri solidum, ornatum omni lapide pretioso :\"},{\"verse\":11,\"text\":\"quasi oliva pullulans, et cypressus in altitudinem se extollens, in accipiendo ipsum stolam gloriæ, et vestiri eum in consummationem virtutis.\"},{\"verse\":12,\"text\":\"In ascensu altaris sancti gloriam dedit sanctitatis amictum.\"},{\"verse\":13,\"text\":\"In accipiendo autem partes de manu sacerdotum, et ipse stans juxta aram : et circa illum corona fratrum : quasi plantatio cedri in monte Libano,\"},{\"verse\":14,\"text\":\"sic circa illum steterunt quasi rami palmæ : et omnes filii Aaron in gloria sua.\"},{\"verse\":15,\"text\":\"Oblatio autem Domini in manibus ipsorum coram omni synagoga Israël : et consummatione fungens in ara, amplificare oblationem excelsi Regis,\"},{\"verse\":16,\"text\":\"porrexit manum suam in libatione, et libavit de sanguine uvæ.\"},{\"verse\":17,\"text\":\"Effudit in fundamento altaris odorem divinum excelso Principi.\"},{\"verse\":18,\"text\":\"Tunc exclamaverunt filii Aaron, in tubis productilibus sonuerunt : et auditam fecerunt vocem magnam in memoriam coram Deo.\"},{\"verse\":19,\"text\":\"Tunc omnis populus simul properaverunt, et ceciderunt in faciem super terram, adorare Dominum Deum suum, et dare preces omnipotenti Deo excelso.\"},{\"verse\":20,\"text\":\"Et amplificaverunt psallentes in vocibus suis, et in magna domo auctus est sonus suavitatis plenus.\"},{\"verse\":21,\"text\":\"Et rogavit populus Dominum excelsum in prece, usque dum perfectus est honor Domini, et munus suum perfecerunt.\"},{\"verse\":22,\"text\":\"Tunc descendens, manus suas extulit in omne congregationem filiorum Israël, dare gloriam Deo a labiis suis, et in nomine ipsius gloriari :\"},{\"verse\":23,\"text\":\"et iteravit orationem suam, volens ostendere virtutem Dei.\"},{\"verse\":24,\"text\":\"Et nunc orate Deum omnium, qui magna fecit in omni terra, qui auxit dies nostros a ventre matris nostræ, et fecit nobiscum secundum suam misericordiam :\"},{\"verse\":25,\"text\":\"det nobis jucunditatem cordis, et fieri pacem in diebus nostris in Israël per dies sempiternos :\"},{\"verse\":26,\"text\":\"credere Israël nobiscum esse Dei misericordiam, ut liberet nos in diebus suis.\"},{\"verse\":27,\"text\":\"Duas gentes odit anima mea : tertia autem non est gens quam oderim :\"},{\"verse\":28,\"text\":\"qui sedent in monte Seir, et Philisthiim, et stultus populus qui habitat in Sichimis.\"},{\"verse\":29,\"text\":\"Doctrinam sapientiæ et disciplinæ scripsit in codice isto Jesus, filius Sirach, Jerosolymita, qui renovavit sapientiam de corde suo.\"},{\"verse\":30,\"text\":\"Beatus qui in istis versatur bonis : qui ponit illa in corde suo, sapiens erit semper.\"},{\"verse\":31,\"text\":\"Si enim hæc fecerit, ad omnia valebit, quia lux Dei vestigium ejus est.\"}],\"summary\":\"The praises of Simon the high priest. The conclusion.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":49,\"label\":\"Sirach 49\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":51,\"label\":\"Sirach 51\"}}]]\n"])</script></body></html>
