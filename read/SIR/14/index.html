of sin.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Happy is he that hath had no sadness of his mind, and who is not fallen from his hope.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Riches are not comely for a covetous man and a niggard, and what should an envious man do with gold?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He that gathereth together by wronging his own soul, gathereth for others, and another will squander away his goods in rioting.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He that is evil to himself, to whom will he be good? and he shall not take pleasure in his goods.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>There is none worse than he that envieth himself, and this is the reward of his wickedness:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And if he do good, he doth it ignorantly, and unwillingly: and at the last he discovereth his wickedness.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The eye of the envious is wicked: and he turneth away his face, and despiseth his own soul.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The eye of the covetous man is insatiable in his portion of iniquity: he will not be satisfied till he consume his own soul, drying it up.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>An evil eye is towards evil things: and he shall not have his fill of bread, but shall be needy and pensive at his own table.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My son, if thou have any thing, do good to thyself, and offer to God worthy offerings.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Remember that death is not slow, and that the covenant of hell hath been shewn to thee: for the covenant of this world shall surely die.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Do good to thy friend before thou die, and according to thy ability, stretching out thy hand give to the poor.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Defraud not thyself of the good day, and let not the part of a good gift overpass thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Shalt thou not leave to others to divide by lot thy sorrows and labours?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Give and take, and justify thy soul.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Before thy death work justice: for in hell there is no finding food.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>All flesh shall fade as grass, and as the leaf that springeth out on a green tree.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Some grow, and some fall off: so is the generation of flesh and blood, one cometh to an end, and another is born.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Every work that is corruptible shall fail in the end: and the worker thereof shall go with it.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And every excellent work shall be justified: and the worker thereof shall be honoured therein.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Blessed is the man that shall continue in wisdom, and that shall meditate in his justice, and in his mind shall think of the all seeing eye of God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He that considereth her ways in his heart, and hath understanding in her secrets, who goeth after her as one that traceth, and stayeth in her ways.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He who looketh in at her windows, and hearkeneth at her door.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He that lodgeth near her house, and fastening a pin in her walls shall set up his tent high unto her, where good things shall rest in his lodging for ever.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He shall set his children under her shelter, and shall lodge under her branches:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He shall be protected under her covering from the heat, and shall rest in her glory.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Beatus vir qui non est lapsus verbo ex ore suo, et non est stimulatus in tristitia delicti.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Felix qui non habuit animi sui tristitiam, et non excidit a spe sua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Viro cupido et tenaci sine ratione est substantia : et homini livido ad quid aurum ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui acervat ex animo suo injuste, aliis congregat, et in bonis illius alius luxuriabitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui sibi nequam est, cui alii bonus erit ? et non jucundabitur in bonis suis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui sibi invidet, nihil est illo nequius : et hæc redditio est malitiæ illius.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et si bene fecerit, ignoranter et non volens facit : et in novissimo manifestat malitiam suam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nequam est oculus lividi : et avertens faciem suam, et despiciens animam suam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Insatiabilis oculus cupidi in parte iniquitatis : non satiabitur donec consumat arefaciens animam suam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Oculus malus ad mala, et non saturabitur pane, sed indigens et in tristitia erit super mensam suam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fili, si habes, benefac tecum, et Deo dignas oblationes offer.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Memor esto quoniam mors non tardat, et testamentum inferorum, quia demonstratum est tibi : testamentum enim hujus mundi morte morietur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ante mortem benefac amico tuo, et secundum vires tuas exporrigens da pauperi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non defrauderis a die bono, et particula boni doni non te prætereat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nonne aliis relinques dolores et labores tuos in divisione sortis ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Da et accipe, et justifica animam tuam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ante obitum tuum operare justitiam, quoniam non est apud inferos invenire cibum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omnis caro sicut fœnum veterascet, et sicut folium fructificans in arbore viridi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Alia generantur, et alia dejiciuntur : sic generatio carnis et sanguinis, alia finitur, et alia nascitur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omne opus corruptibile in fine deficiet, et qui illud operatur ibit cum illo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et omne opus electum justificabitur, et qui operatur illud honorabitur in illo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Beatus vir qui in sapientia morabitur, et qui in justitia sua meditabitur, et in sensu cogitabit circumspectionem Dei :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>qui excogitat vias illius in corde suo, et in absconditis suis intelligens, vadens post illam quasi investigator, et in viis illius consistens :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>qui respicit per fenestras illius, et in januis illius audiens :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>qui requiescit juxta domum illius, et in parietibus illius figens palum, statuet casulam suam ad manus illius, et requiescent in casula illius bona per ævum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Statuet filios suos sub tegmine illius, et sub ramis ejus morabitur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Protegetur sub tegmine illius a fervore, et in gloria ejus requiescet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->14<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 13" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strok SIR.14\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":14,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Blessed is the man that hath not slipped by a word out of his mouth, and is not pricked with the remorse of sin.\"},{\"verse\":2,\"text\":\"Happy is he that hath had no sadness of his mind, and who is not fallen from his hope.\"},{\"verse\":3,\"text\":\"Riches are not comely for a covetous man and a niggard, and what should an envious man do with gold?\"},{\"verse\":4,\"text\":\"He that gathereth together by wronging his own soul, gathereth for others, and another will squander away his goods in rioting.\"},{\"verse\":5,\"text\":\"He that is evil to himself, to whom will he be good? and he shall not take pleasure in his goods.\"},{\"verse\":6,\"text\":\"There is none worse than he that envieth himself, and this is the reward of his wickedness:\"},{\"verse\":7,\"text\":\"And if he do good, he doth it ignorantly, and unwillingly: and at the last he discovereth his wickedness.\"},{\"verse\":8,\"text\":\"The eye of the envious is wicked: and he turneth away his face, and despiseth his own soul.\"},{\"verse\":9,\"text\":\"The eye of the covetous man is insatiable in his portion of iniquity: he will not be satisfied till he consume his own soul, drying it up.\"},{\"verse\":10,\"text\":\"An evil eye is towards evil things: and he shall not have his fill of bread, but shall be needy and pensive at his own table.\"},{\"verse\":11,\"text\":\"My son, if thou have any thing, do good to thyself, and offer to God worthy offerings.\"},{\"verse\":12,\"text\":\"Remember that death is not slow, and that the covenant of hell hath been shewn to thee: for the covenant of this world shall surely die.\"},{\"verse\":13,\"text\":\"Do good to thy friend before thou die, and according to thy ability, stretching out thy hand give to the poor.\"},{\"verse\":14,\"text\":\"Defraud not thyself of the good day, and let not the part of a good gift overpass thee.\"},{\"verse\":15,\"text\":\"Shalt thou not leave to others to divide by lot thy sorrows and labours?\"},{\"verse\":16,\"text\":\"Give and take, and justify thy soul.\"},{\"verse\":17,\"text\":\"Before thy death work justice: for in hell there is no finding food.\"},{\"verse\":18,\"text\":\"All flesh shall fade as grass, and as the leaf that springeth out on a green tree.\"},{\"verse\":19,\"text\":\"Some grow, and some fall off: so is the generation of flesh and blood, one cometh to an end, and another is born.\"},{\"verse\":20,\"text\":\"Every work that is corruptible shall fail in the end: and the worker thereof shall go with it.\"},{\"verse\":21,\"text\":\"And every excellent work shall be justified: and the worker thereof shall be honoured therein.\"},{\"verse\":22,\"text\":\"Blessed is the man that shall continue in wisdom, and that shall meditate in his justice, and in his mind shall think of the all seeing eye of God.\"},{\"verse\":23,\"text\":\"He that considereth her ways in his heart, and hath understanding in her secrets, who goeth after her as one that traceth, and stayeth in her ways.\"},{\"verse\":24,\"text\":\"He who looketh in at her windows, and hearkeneth at her door.\"},{\"verse\":25,\"text\":\"He that lodgeth near her house, and fastening a pin in her walls shall set up his tent high unto her, where good things shall rest in his lodging for ever.\"},{\"verse\":26,\"text\":\"He shall set his children under her shelter, and shall lodge under her branches:\"},{\"verse\":27,\"text\":\"He shall be protected under her covering from the heat, and shall rest in her glory.\"}],\"vul\":[{\"verse\":1,\"text\":\"Beatus vir qui non est lapsus verbo ex ore suo, et non est stimulatus in tristitia delicti.\"},{\"verse\":2,\"text\":\"Felix qui non habuit animi sui tristitiam, et non excidit a spe sua.\"},{\"verse\":3,\"text\":\"Viro cupido et tenaci sine ratione est substantia : et homini livido ad quid aurum ?\"},{\"verse\":4,\"text\":\"Qui acervat ex animo suo injuste, aliis congregat, et in bonis illius alius luxuriabitur.\"},{\"verse\":5,\"text\":\"Qui sibi nequam est, cui alii bonus erit ? et non jucundabitur in bonis suis.\"},{\"verse\":6,\"text\":\"Qui sibi invidet, nihil est illo nequius : et hæc redditio est malitiæ illius.\"},{\"verse\":7,\"text\":\"Et si bene fecerit, ignoranter et non volens facit : et in novissimo manifestat malitiam suam.\"},{\"verse\":8,\"text\":\"Nequam est oculus lividi : et avertens faciem suam, et despiciens animam suam.\"},{\"verse\":9,\"text\":\"Insatiabilis oculus cupidi in parte iniquitatis : non satiabitur donec consumat arefaciens animam suam.\"},{\"verse\":10,\"text\":\"Oculus malus ad mala, et non saturabitur pane, sed indigens et in tristitia erit super mensam suam.\"},{\"verse\":11,\"text\":\"Fili, si habes, benefac tecum, et Deo dignas oblationes offer.\"},{\"verse\":12,\"text\":\"Memor esto quoniam mors non tardat, et testamentum inferorum, quia demonstratum est tibi : testamentum enim hujus mundi morte morietur.\"},{\"verse\":13,\"text\":\"Ante mortem benefac amico tuo, et secundum vires tuas exporrigens da pauperi.\"},{\"verse\":14,\"text\":\"Non defrauderis a die bono, et particula boni doni non te prætereat.\"},{\"verse\":15,\"text\":\"Nonne aliis relinques dolores et labores tuos in divisione sortis ?\"},{\"verse\":16,\"text\":\"Da et accipe, et justifica animam tuam.\"},{\"verse\":17,\"text\":\"Ante obitum tuum operare justitiam, quoniam non est apud inferos invenire cibum.\"},{\"verse\":18,\"text\":\"Omnis caro sicut fœnum veterascet, et sicut folium fructificans in arbore viridi.\"},{\"verse\":19,\"text\":\"Alia generantur, et alia dejiciuntur : sic generatio carnis et sanguinis, alia finitur, et alia nascitur.\"},{\"verse\":20,\"text\":\"Omne opus corruptibile in fine deficiet, et qui illud operatur ibit cum illo.\"},{\"verse\":21,\"text\":\"Et omne opus electum justificabitur, et qui operatur illud honorabitur in illo.\"},{\"verse\":22,\"text\":\"Beatus vir qui in sapientia morabitur, et qui in justitia sua meditabitur, et in sensu cogitabit circumspectionem Dei :\"},{\"verse\":23,\"text\":\"qui excogitat vias illius in corde suo, et in absconditis suis intelligens, vadens post illam quasi investigator, et in viis illius consistens :\"},{\"verse\":24,\"text\":\"qui respicit per fenestras illius, et in januis illius audiens :\"},{\"verse\":25,\"text\":\"qui requiescit juxta domum illius, et in parietibus illius figens palum, statuet casulam suam ad manus illius, et requiescent in casula illius bona per ævum.\"},{\"verse\":26,\"text\":\"Statuet filios suos sub tegmine illius, et sub ramis ejus morabitur.\"},{\"verse\":27,\"text\":\"Protegetur sub tegmine illius a fervore, et in gloria ejus requiescet.\"}],\"summary\":\"The evil of avarice: works of mercy are recommended, and the love of wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":13,\"label\":\"Sirach 13\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":15,\"label\":\"Sirach 15\"}}]]\n"])</script></body></html>
