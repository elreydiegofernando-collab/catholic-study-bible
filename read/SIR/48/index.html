"DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Elias the prophet stood up, as a fire, and his word burnt like a torch.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He brought a famine upon them, and they that provoked him in their envy, were reduced to a small number, for they could not endure the commandments of the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>By the word of the Lord he shut up the heaven, and he brought down fire from heaven thrice.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thus was Elias magnified in his wondrous works. And who can glory like to thee?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who raisedst up a dead man from below, from the lot of death, by the word of the Lord God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who broughtest down kings to destruction, and brokest easily their power in pieces, and the glorious from their bed.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Who heardest judgment in Sina, and in Horeb the judgments of vengeance.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who anointedst kings to penance, and madest prophets successors after thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who wast taken up in a whirlwind of fire, in a chariot of fiery horses.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Who art registered in the judgments of times to appease the wrath of the Lord, to reconcile the heart of the father to the son, and to restore the tribes of Jacob.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Blessed are they that saw thee, and were honoured with thy friendship.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For we live only in our life, but after death our name shall not be such.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Elias was indeed covered with the whirlwind, and his spirit was filled up in Eliseus: in his days he feared not the prince, and no man was more powerful than he.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>No word could overcome him, and after death his body prophesied.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In his life he did great wonders, and in death he wrought miracles.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For all this the people repented not, neither did they depart from their sins till they were cast out of their land, and were scattered through all the earth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And there was left but a small people, and a prince in the house of David.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Some of these did that which pleased God: but others committed many sins.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ezechias fortified his city, and brought in water into the midst thereof, and he digged a rock with iron, and made a well for water.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In his days Sennacherib came up, and sent Rabsaces, and lifted up his hand against them, and he stretched out his hand against Sion, and became proud through his power.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then their hearts and hands trembled, and they were in pain as women in travail.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they called upon the Lord who is merciful, and spreading their hands, they lifted them up to heaven: and the holy Lord God quickly heard their voice.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He was not mindful of their sins, neither did he deliver them up to their enemies, but he purified them by the hand of Isaias, the holy prophet.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He overthrew the army of the Assyrians, and the angel of the Lord destroyed them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For Ezechias did that which pleased God, and walked valiantly in the way of David his father, which Isaias, the great prophet, and faithful in the sight of God, had commanded him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In his days the sun went backward, and he lengthened the king’s life.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>With a great spirit he saw the things that are to come to pass at last, and comforted the mourners in Sion.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He showed what should come to pass for ever, and secret things before they came.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et surrexit Elias propheta quasi ignis, et verbum ipsius quasi facula ardebat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui induxit in illos famem : et irritantes illum invidia sua pauci facti sunt : non enim poterant sustinere præcepta Domini.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Verbo Domini continuit cælum, et dejecit de cælo ignem ter.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sic amplificatus est Elias in mirabilibus suis. Et quis potest similiter sic gloriari tibi ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui sustulisti mortuum ab inferis de sorte mortis, in verbo Domini Dei :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>qui dejecisti reges ad pernicem, et confregisti facile potentiam ipsorum, et gloriosos de lecto suo :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>qui audis in Sina judicium, et in Horeb judicia defensionis :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui ungis reges ad pœnitentiam, et prophetas facis successores post te :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>qui receptus es in turbine ignis, in curru equorum igneorum :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>qui scriptus es in judiciis temporum, lenire iracundiam Domini, conciliare cor patris ad filium, et restituere tribus Jacob.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Beati sunt qui te viderunt, et in amicitia tua decorati sunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nam nos vita vivimus tantum : post mortem autem non erit tale nomen nostrum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Elias quidem in turbine tectus est, et in Eliseo completus est spiritus ejus : in diebus suis non pertimuit principem, et potentia nemo vicit illum :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>nec superavit illum verbum aliquod, et mortuum prophetavit corpus ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In vita sua fecit monstra, et in morte mirabilia operatus est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In omnibus istis non pœnituit populus, et non recesserunt a peccatis suis, usque dum ejecti sunt de terra sua, et dispersi sunt in omnem terram :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et relicta est gens perpauca, et princeps in domo David.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quidam ipsorum fecerunt quod placeret Deo : alii autem multa commiserunt peccata.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ezechias munivit civitatem suam, et induxit in medium ipsius aquam : et fodit ferro rupem, et ædificavit ad aquam puteum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In diebus ipsius ascendit Sennacherib, et misit Rabsacen, et sustulit manum suam contra illos : et extulit manum suam in Sion, et superbus factus est potentia sua.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tunc mota sunt corda et manus ipsorum : et doluerunt quasi parturientes mulieres.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et invocaverunt Dominum misericordem, et expandentes manus suas extulerunt ad cælum : et Sanctus, Dominus Deus, audivit cito vocem ipsorum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Non est commemoratus peccatorum illorum, neque dedit illos inimicis suis : sed purgavit eos in manu Isaiæ sancti prophetæ.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dejecit castra Assyriorum, et contrivit illos angelus Domini :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>nam fecit Ezechias quod placuit Deo, et fortiter ivit in via David patris sui, quam mandavit illi Isaias, propheta magnus, et fidelis in conspectu Dei.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In diebus ipsius retro rediit sol, et addidit regi vitam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Spiritu magno vidit ultima, et consolatus est lugentes in Sion usque in sempiternum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ostendit futura, et abscondita antequam evenirent.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/47/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 47</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/49/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 49</span></span><svg viewBox="0 0 24 24" fill="none" ame\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.48\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":48,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"And Elias the prophet stood up, as a fire, and his word burnt like a torch.\"},{\"verse\":2,\"text\":\"He brought a famine upon them, and they that provoked him in their envy, were reduced to a small number, for they could not endure the commandments of the Lord.\"},{\"verse\":3,\"text\":\"By the word of the Lord he shut up the heaven, and he brought down fire from heaven thrice.\"},{\"verse\":4,\"text\":\"Thus was Elias magnified in his wondrous works. And who can glory like to thee?\"},{\"verse\":5,\"text\":\"Who raisedst up a dead man from below, from the lot of death, by the word of the Lord God.\"},{\"verse\":6,\"text\":\"Who broughtest down kings to destruction, and brokest easily their power in pieces, and the glorious from their bed.\"},{\"verse\":7,\"text\":\"Who heardest judgment in Sina, and in Horeb the judgments of vengeance.\"},{\"verse\":8,\"text\":\"Who anointedst kings to penance, and madest prophets successors after thee.\"},{\"verse\":9,\"text\":\"Who wast taken up in a whirlwind of fire, in a chariot of fiery horses.\"},{\"verse\":10,\"text\":\"Who art registered in the judgments of times to appease the wrath of the Lord, to reconcile the heart of the father to the son, and to restore the tribes of Jacob.\"},{\"verse\":11,\"text\":\"Blessed are they that saw thee, and were honoured with thy friendship.\"},{\"verse\":12,\"text\":\"For we live only in our life, but after death our name shall not be such.\"},{\"verse\":13,\"text\":\"Elias was indeed covered with the whirlwind, and his spirit was filled up in Eliseus: in his days he feared not the prince, and no man was more powerful than he.\"},{\"verse\":14,\"text\":\"No word could overcome him, and after death his body prophesied.\"},{\"verse\":15,\"text\":\"In his life he did great wonders, and in death he wrought miracles.\"},{\"verse\":16,\"text\":\"For all this the people repented not, neither did they depart from their sins till they were cast out of their land, and were scattered through all the earth.\"},{\"verse\":17,\"text\":\"And there was left but a small people, and a prince in the house of David.\"},{\"verse\":18,\"text\":\"Some of these did that which pleased God: but others committed many sins.\"},{\"verse\":19,\"text\":\"Ezechias fortified his city, and brought in water into the midst thereof, and he digged a rock with iron, and made a well for water.\"},{\"verse\":20,\"text\":\"In his days Sennacherib came up, and sent Rabsaces, and lifted up his hand against them, and he stretched out his hand against Sion, and became proud through his power.\"},{\"verse\":21,\"text\":\"Then their hearts and hands trembled, and they were in pain as women in travail.\"},{\"verse\":22,\"text\":\"And they called upon the Lord who is merciful, and spreading their hands, they lifted them up to heaven: and the holy Lord God quickly heard their voice.\"},{\"verse\":23,\"text\":\"He was not mindful of their sins, neither did he deliver them up to their enemies, but he purified them by the hand of Isaias, the holy prophet.\"},{\"verse\":24,\"text\":\"He overthrew the army of the Assyrians, and the angel of the Lord destroyed them.\"},{\"verse\":25,\"text\":\"For Ezechias did that which pleased God, and walked valiantly in the way of David his father, which Isaias, the great prophet, and faithful in the sight of God, had commanded him.\"},{\"verse\":26,\"text\":\"In his days the sun went backward, and he lengthened the king’s life.\"},{\"verse\":27,\"text\":\"With a great spirit he saw the things that are to come to pass at last, and comforted the mourners in Sion.\"},{\"verse\":28,\"text\":\"He showed what should come to pass for ever, and secret things before they came.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et surrexit Elias propheta quasi ignis, et verbum ipsius quasi facula ardebat.\"},{\"verse\":2,\"text\":\"Qui induxit in illos famem : et irritantes illum invidia sua pauci facti sunt : non enim poterant sustinere præcepta Domini.\"},{\"verse\":3,\"text\":\"Verbo Domini continuit cælum, et dejecit de cælo ignem ter.\"},{\"verse\":4,\"text\":\"Sic amplificatus est Elias in mirabilibus suis. Et quis potest similiter sic gloriari tibi ?\"},{\"verse\":5,\"text\":\"qui sustulisti mortuum ab inferis de sorte mortis, in verbo Domini Dei :\"},{\"verse\":6,\"text\":\"qui dejecisti reges ad pernicem, et confregisti facile potentiam ipsorum, et gloriosos de lecto suo :\"},{\"verse\":7,\"text\":\"qui audis in Sina judicium, et in Horeb judicia defensionis :\"},{\"verse\":8,\"text\":\"qui ungis reges ad pœnitentiam, et prophetas facis successores post te :\"},{\"verse\":9,\"text\":\"qui receptus es in turbine ignis, in curru equorum igneorum :\"},{\"verse\":10,\"text\":\"qui scriptus es in judiciis temporum, lenire iracundiam Domini, conciliare cor patris ad filium, et restituere tribus Jacob.\"},{\"verse\":11,\"text\":\"Beati sunt qui te viderunt, et in amicitia tua decorati sunt.\"},{\"verse\":12,\"text\":\"Nam nos vita vivimus tantum : post mortem autem non erit tale nomen nostrum.\"},{\"verse\":13,\"text\":\"Elias quidem in turbine tectus est, et in Eliseo completus est spiritus ejus : in diebus suis non pertimuit principem, et potentia nemo vicit illum :\"},{\"verse\":14,\"text\":\"nec superavit illum verbum aliquod, et mortuum prophetavit corpus ejus.\"},{\"verse\":15,\"text\":\"In vita sua fecit monstra, et in morte mirabilia operatus est.\"},{\"verse\":16,\"text\":\"In omnibus istis non pœnituit populus, et non recesserunt a peccatis suis, usque dum ejecti sunt de terra sua, et dispersi sunt in omnem terram :\"},{\"verse\":17,\"text\":\"et relicta est gens perpauca, et princeps in domo David.\"},{\"verse\":18,\"text\":\"Quidam ipsorum fecerunt quod placeret Deo : alii autem multa commiserunt peccata.\"},{\"verse\":19,\"text\":\"Ezechias munivit civitatem suam, et induxit in medium ipsius aquam : et fodit ferro rupem, et ædificavit ad aquam puteum.\"},{\"verse\":20,\"text\":\"In diebus ipsius ascendit Sennacherib, et misit Rabsacen, et sustulit manum suam contra illos : et extulit manum suam in Sion, et superbus factus est potentia sua.\"},{\"verse\":21,\"text\":\"Tunc mota sunt corda et manus ipsorum : et doluerunt quasi parturientes mulieres.\"},{\"verse\":22,\"text\":\"Et invocaverunt Dominum misericordem, et expandentes manus suas extulerunt ad cælum : et Sanctus, Dominus Deus, audivit cito vocem ipsorum.\"},{\"verse\":23,\"text\":\"Non est commemoratus peccatorum illorum, neque dedit illos inimicis suis : sed purgavit eos in manu Isaiæ sancti prophetæ.\"},{\"verse\":24,\"text\":\"Dejecit castra Assyriorum, et contrivit illos angelus Domini :\"},{\"verse\":25,\"text\":\"nam fecit Ezechias quod placuit Deo, et fortiter ivit in via David patris sui, quam mandavit illi Isaias, propheta magnus, et fidelis in conspectu Dei.\"},{\"verse\":26,\"text\":\"In diebus ipsius retro rediit sol, et addidit regi vitam.\"},{\"verse\":27,\"text\":\"Spiritu magno vidit ultima, et consolatus est lugentes in Sion usque in sempiternum.\"},{\"verse\":28,\"text\":\"Ostendit futura, et abscondita antequam evenirent.\"}],\"summary\":\"The praise of Elias, of Eliseus, of Ezechias, and of Isaias.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":47,\"label\":\"Sirach 47\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":49,\"label\":\"Sirach 49\"}}]]\n"])</script></body></html>
