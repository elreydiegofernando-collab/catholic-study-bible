1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">7</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Religious and moral duties.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Do no evils, and no evils shall lay hold of thee.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Depart from the unjust, and evils shall depart from thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>My son, sow not evils in the furrows of injustice, and thou shalt not reap them sevenfold.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Seek not of the Lord a preeminence, nor of the king the seat of honour.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Justify not thyself before God, for he knoweth the heart: and desire not to appear wise before the king.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Seek not to be made a judge, unless thou have strength enough to extirpate iniquities: lest thou fear the person of the powerful, and lay a stumblingblock for thy integrity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Offend not against the multitude of a city, neither cast thyself in upon the people,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nor bind sin to sin: for even in one thou shalt not be unpunished.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Be not fainthearted in thy mind:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Neglect not to pray, and to give alms.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Say not: God will have respect to the multitude of my gifts, and when I offer to the most high God, he will accept my offerings.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Laugh no man to scorn in the bitterness of his soul: for there is one that humbleth and exalteth, God who seeth all.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Devise not a lie against thy brother: neither do the like against thy friend.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Be not willing to make any manner of lie: for the custom thereof is not good.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Be not full of words in a multitude of ancients, and repeat not the word in thy prayer.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hate not laborious works, nor husbandry ordained by the most High.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Number not thyself among the multitude of the disorderly.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Remember wrath, for it will not tarry long.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Humble thy spirit very much: for the vengeance on the flesh of the ungodly is fire and worms.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Do not transgress against thy friend deferring money, nor despise thy dear brother for the sake of gold.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Depart not from a wise and good wife, whom thou hast gotten in the fear of the Lord: for the grace of her modesty is above gold.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hurt not the servant that worketh faithfully, nor the hired man that giveth thee his life.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Let a wise servant be dear to thee as thy own soul, defraud him not of liberty, nor leave him needy.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Hast thou cattle? have an eye to them: and if they be for thy profit, keep them with thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hast thou children? instruct them, and bow down their neck from their childhood.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Hast thou daughters? have a care of their body, and shew not thy countenance gay towards them.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Marry thy daughter well, and thou shalt do a great work, and give her to a wise man.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>If thou hast a wife according to thy soul, cast her not off: and to her that is hateful, trust not thyself. With thy whole heart,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Honour thy father, and forget not the groanings of thy mother:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Remember that thou hadst not been born but through them: and make a return to them as they have done for thee.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>With all thy soul fear the Lord, and reverence his priests.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>With all thy strength love him that made thee: and forsake not his ministers.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Honour God with all thy soul and give honour to the priests, and purify thyself with thy arms.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Give them their portion, as it is commanded thee, of the firstfruits and of purifications: and for thy negligences purify thyself with a few.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Offer to the Lord the gift of thy shoulders, and the sacrifice of sanctification, and the firstfruits of the holy things:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And stretch out thy hand to the poor, that thy expiation and thy blessing may be perfected.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>A gift hath grace in the sight of all the living, and restrain not grace from the dead.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Be not wanting in comforting them that weep, and walk with them that mourn.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Be not slow to visit the sick: for by these things thou shalt be confirmed in love.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>In all thy works remember thy last end, and thou shalt never sin.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Noli facere mala, et non te apprehendent :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>discede ab iniquo, et deficient mala abs te.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Fili, non semines mala in sulcis injustitiæ, et non metes ea in septuplum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Noli quærere a Domino ducatum, neque a rege cathedram honoris.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non te justifices ante Deum, quoniam agnitor cordis ipse est : et penes regem noli velle videri sapiens.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Noli quærere fieri judex, nisi valeas virtute irrumpere iniquitates : ne forte extimescas faciem potentis, et ponas scandalum in æquitate tua.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non pecces in multitudinem civitatis, nec te immittas in populum :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>neque alliges duplicia peccata, nec enim in uno eris immunis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Noli esse pusillanimis in animo tuo :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>exorare et facere eleemosynam ne despicias.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ne dicas : In multitudine munerum meorum respiciet Deus, et offerente me Deo altissimo, munera mea suscipiet.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non irrideas hominem in amaritudine animæ : est enim qui humiliat et exaltat circumspector Deus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Noli amare mendacium adversus fratrem tuum, neque in amicum similiter facias.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Noli velle mentiri omne mendacium : assiduitas enim illius non est bona.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Noli verbosus esse in multitudine presbyterorum, et non iteres verbum in oratione tua.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non oderis laboriosa opera, et rusticationem creatam ab Altissimo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non te reputes in multitudine indisciplinatorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Memento iræ, quoniam non tardabit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Humilia valde spiritum tuum, quoniam vindicta carnis impii ignis et vermis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Noli prævaricari in amicum pecuniam differentem, neque fratrem carissimum auro spreveris.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Noli discedere a muliere sensata et bona, quam sortitus es in timore Domini : gratia enim verecundiæ illius super aurum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non lædas servum in veritate operantem, neque mercenarium dantem animam suam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Servus sensatus sit tibi dilectus quasi anima tua : non defraudes illum libertate, neque inopem derelinquas illum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pecora tibi sunt, attende illis : et si sunt utilia, perseverent apud te.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Filii tibi sunt ? erudi illos, et curva illos a pueritia illorum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Filiæ tibi sunt ? serva corpus illarum, et non ostendas hilarem faciem tuam ad illas.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Trade filiam, et grande opus feceris : et homini sensato da illam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mulier si est tibi secundum animam tuam, non projicias illam : et odibili non credas te. In toto corde tuo</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>honora patrem tuum, et gemitus matris tuæ ne obliviscaris :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>memento quoniam nisi per illos natus non fuisses : et retribue illis, quomodo et illi tibi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In tota anima tua time Dominum, et sacerdotes illius sanctifica.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In omni virtute tua dilige eum qui te fecit, et ministros ejus ne derelinquas.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Honora Deum ex tota anima tua, et honorifica sacerdotes, et propurga te cum brachiis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Da illis partem, sicut mandatum est tibi, primitiarum et purgationis, et de negligentia tua purga te cum paucis.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Datum brachiorum tuorum, et sacrificium sanctificationis offeres Domino, et initia sanctorum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et pauperi porrige manum tuam, ut perficiatur propitiatio et benedictio tua.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Gratia dati in conspectu omnis viventis, et mortuo non prohibeas gratiam.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Non desis plorantibus in consolatione, et cum lugentibus ambula.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Non te pigeat visitare infirmum : ex his enim in dilectione firmaberis.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>In omnibus operibus tuis memorare novissima tua, et in æternum non peccabis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 6" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone- ng\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.7\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":7,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Do no evils, and no evils shall lay hold of thee.\"},{\"verse\":2,\"text\":\"Depart from the unjust, and evils shall depart from thee.\"},{\"verse\":3,\"text\":\"My son, sow not evils in the furrows of injustice, and thou shalt not reap them sevenfold.\"},{\"verse\":4,\"text\":\"Seek not of the Lord a preeminence, nor of the king the seat of honour.\"},{\"verse\":5,\"text\":\"Justify not thyself before God, for he knoweth the heart: and desire not to appear wise before the king.\"},{\"verse\":6,\"text\":\"Seek not to be made a judge, unless thou have strength enough to extirpate iniquities: lest thou fear the person of the powerful, and lay a stumblingblock for thy integrity.\"},{\"verse\":7,\"text\":\"Offend not against the multitude of a city, neither cast thyself in upon the people,\"},{\"verse\":8,\"text\":\"Nor bind sin to sin: for even in one thou shalt not be unpunished.\"},{\"verse\":9,\"text\":\"Be not fainthearted in thy mind:\"},{\"verse\":10,\"text\":\"Neglect not to pray, and to give alms.\"},{\"verse\":11,\"text\":\"Say not: God will have respect to the multitude of my gifts, and when I offer to the most high God, he will accept my offerings.\"},{\"verse\":12,\"text\":\"Laugh no man to scorn in the bitterness of his soul: for there is one that humbleth and exalteth, God who seeth all.\"},{\"verse\":13,\"text\":\"Devise not a lie against thy brother: neither do the like against thy friend.\"},{\"verse\":14,\"text\":\"Be not willing to make any manner of lie: for the custom thereof is not good.\"},{\"verse\":15,\"text\":\"Be not full of words in a multitude of ancients, and repeat not the word in thy prayer.\"},{\"verse\":16,\"text\":\"Hate not laborious works, nor husbandry ordained by the most High.\"},{\"verse\":17,\"text\":\"Number not thyself among the multitude of the disorderly.\"},{\"verse\":18,\"text\":\"Remember wrath, for it will not tarry long.\"},{\"verse\":19,\"text\":\"Humble thy spirit very much: for the vengeance on the flesh of the ungodly is fire and worms.\"},{\"verse\":20,\"text\":\"Do not transgress against thy friend deferring money, nor despise thy dear brother for the sake of gold.\"},{\"verse\":21,\"text\":\"Depart not from a wise and good wife, whom thou hast gotten in the fear of the Lord: for the grace of her modesty is above gold.\"},{\"verse\":22,\"text\":\"Hurt not the servant that worketh faithfully, nor the hired man that giveth thee his life.\"},{\"verse\":23,\"text\":\"Let a wise servant be dear to thee as thy own soul, defraud him not of liberty, nor leave him needy.\"},{\"verse\":24,\"text\":\"Hast thou cattle? have an eye to them: and if they be for thy profit, keep them with thee.\"},{\"verse\":25,\"text\":\"Hast thou children? instruct them, and bow down their neck from their childhood.\"},{\"verse\":26,\"text\":\"Hast thou daughters? have a care of their body, and shew not thy countenance gay towards them.\"},{\"verse\":27,\"text\":\"Marry thy daughter well, and thou shalt do a great work, and give her to a wise man.\"},{\"verse\":28,\"text\":\"If thou hast a wife according to thy soul, cast her not off: and to her that is hateful, trust not thyself. With thy whole heart,\"},{\"verse\":29,\"text\":\"Honour thy father, and forget not the groanings of thy mother:\"},{\"verse\":30,\"text\":\"Remember that thou hadst not been born but through them: and make a return to them as they have done for thee.\"},{\"verse\":31,\"text\":\"With all thy soul fear the Lord, and reverence his priests.\"},{\"verse\":32,\"text\":\"With all thy strength love him that made thee: and forsake not his ministers.\"},{\"verse\":33,\"text\":\"Honour God with all thy soul and give honour to the priests, and purify thyself with thy arms.\"},{\"verse\":34,\"text\":\"Give them their portion, as it is commanded thee, of the firstfruits and of purifications: and for thy negligences purify thyself with a few.\"},{\"verse\":35,\"text\":\"Offer to the Lord the gift of thy shoulders, and the sacrifice of sanctification, and the firstfruits of the holy things:\"},{\"verse\":36,\"text\":\"And stretch out thy hand to the poor, that thy expiation and thy blessing may be perfected.\"},{\"verse\":37,\"text\":\"A gift hath grace in the sight of all the living, and restrain not grace from the dead.\"},{\"verse\":38,\"text\":\"Be not wanting in comforting them that weep, and walk with them that mourn.\"},{\"verse\":39,\"text\":\"Be not slow to visit the sick: for by these things thou shalt be confirmed in love.\"},{\"verse\":40,\"text\":\"In all thy works remember thy last end, and thou shalt never sin.\"}],\"vul\":[{\"verse\":1,\"text\":\"Noli facere mala, et non te apprehendent :\"},{\"verse\":2,\"text\":\"discede ab iniquo, et deficient mala abs te.\"},{\"verse\":3,\"text\":\"Fili, non semines mala in sulcis injustitiæ, et non metes ea in septuplum.\"},{\"verse\":4,\"text\":\"Noli quærere a Domino ducatum, neque a rege cathedram honoris.\"},{\"verse\":5,\"text\":\"Non te justifices ante Deum, quoniam agnitor cordis ipse est : et penes regem noli velle videri sapiens.\"},{\"verse\":6,\"text\":\"Noli quærere fieri judex, nisi valeas virtute irrumpere iniquitates : ne forte extimescas faciem potentis, et ponas scandalum in æquitate tua.\"},{\"verse\":7,\"text\":\"Non pecces in multitudinem civitatis, nec te immittas in populum :\"},{\"verse\":8,\"text\":\"neque alliges duplicia peccata, nec enim in uno eris immunis.\"},{\"verse\":9,\"text\":\"Noli esse pusillanimis in animo tuo :\"},{\"verse\":10,\"text\":\"exorare et facere eleemosynam ne despicias.\"},{\"verse\":11,\"text\":\"Ne dicas : In multitudine munerum meorum respiciet Deus, et offerente me Deo altissimo, munera mea suscipiet.\"},{\"verse\":12,\"text\":\"Non irrideas hominem in amaritudine animæ : est enim qui humiliat et exaltat circumspector Deus.\"},{\"verse\":13,\"text\":\"Noli amare mendacium adversus fratrem tuum, neque in amicum similiter facias.\"},{\"verse\":14,\"text\":\"Noli velle mentiri omne mendacium : assiduitas enim illius non est bona.\"},{\"verse\":15,\"text\":\"Noli verbosus esse in multitudine presbyterorum, et non iteres verbum in oratione tua.\"},{\"verse\":16,\"text\":\"Non oderis laboriosa opera, et rusticationem creatam ab Altissimo.\"},{\"verse\":17,\"text\":\"Non te reputes in multitudine indisciplinatorum.\"},{\"verse\":18,\"text\":\"Memento iræ, quoniam non tardabit.\"},{\"verse\":19,\"text\":\"Humilia valde spiritum tuum, quoniam vindicta carnis impii ignis et vermis.\"},{\"verse\":20,\"text\":\"Noli prævaricari in amicum pecuniam differentem, neque fratrem carissimum auro spreveris.\"},{\"verse\":21,\"text\":\"Noli discedere a muliere sensata et bona, quam sortitus es in timore Domini : gratia enim verecundiæ illius super aurum.\"},{\"verse\":22,\"text\":\"Non lædas servum in veritate operantem, neque mercenarium dantem animam suam.\"},{\"verse\":23,\"text\":\"Servus sensatus sit tibi dilectus quasi anima tua : non defraudes illum libertate, neque inopem derelinquas illum.\"},{\"verse\":24,\"text\":\"Pecora tibi sunt, attende illis : et si sunt utilia, perseverent apud te.\"},{\"verse\":25,\"text\":\"Filii tibi sunt ? erudi illos, et curva illos a pueritia illorum.\"},{\"verse\":26,\"text\":\"Filiæ tibi sunt ? serva corpus illarum, et non ostendas hilarem faciem tuam ad illas.\"},{\"verse\":27,\"text\":\"Trade filiam, et grande opus feceris : et homini sensato da illam.\"},{\"verse\":28,\"text\":\"Mulier si est tibi secundum animam tuam, non projicias illam : et odibili non credas te. In toto corde tuo\"},{\"verse\":29,\"text\":\"honora patrem tuum, et gemitus matris tuæ ne obliviscaris :\"},{\"verse\":30,\"text\":\"memento quoniam nisi per illos natus non fuisses : et retribue illis, quomodo et illi tibi.\"},{\"verse\":31,\"text\":\"In tota anima tua time Dominum, et sacerdotes illius sanctifica.\"},{\"verse\":32,\"text\":\"In omni virtute tua dilige eum qui te fecit, et ministros ejus ne derelinquas.\"},{\"verse\":33,\"text\":\"Honora Deum ex tota anima tua, et honorifica sacerdotes, et propurga te cum brachiis.\"},{\"verse\":34,\"text\":\"Da illis partem, sicut mandatum est tibi, primitiarum et purgationis, et de negligentia tua purga te cum paucis.\"},{\"verse\":35,\"text\":\"Datum brachiorum tuorum, et sacrificium sanctificationis offeres Domino, et initia sanctorum.\"},{\"verse\":36,\"text\":\"Et pauperi porrige manum tuam, ut perficiatur propitiatio et benedictio tua.\"},{\"verse\":37,\"text\":\"Gratia dati in conspectu omnis viventis, et mortuo non prohibeas gratiam.\"},{\"verse\":38,\"text\":\"Non desis plorantibus in consolatione, et cum lugentibus ambula.\"},{\"verse\":39,\"text\":\"Non te pigeat visitare infirmum : ex his enim in dilectione firmaberis.\"},{\"verse\":40,\"text\":\"In omnibus operibus tuis memorare novissima tua, et in æternum non peccabis.\"}],\"summary\":\"Religious and moral duties.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":6,\"label\":\"Sirach 6\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":8,\"label\":\"Sirach 8\"}}]]\n"])</script></body></html>
