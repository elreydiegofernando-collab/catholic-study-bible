st="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A wise judge shall judge his people, and the government of a prudent man shall be steady.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>As the judge of the people is himself, so also are his ministers: and what manner of man the ruler of a city is, such also are they that dwell therein.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>An unwise king shall be the ruin of his people: and cities shall be inhabited through the prudence of the rulers.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The power of the earth is in the hand of God, and in his time he will raise up a profitable ruler over it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The prosperity of man is in the hand of God, and upon the person of the scribe he shall lay his honour.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Remember not any injury done thee by thy neighbour, and do thou nothing by deeds of injury.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Pride is hateful before God and men: and all iniquity of nations is execrable.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>A kingdom is translated from one people to another, because of injustices, and wrongs, and injuries, and divers deceits.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But nothing is more wicked than the covetous man. Why is earth, and ashes proud?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>There is not a more wicked thing than to love money: for such a one setteth even his own soul to sale: because while he liveth he hath cast away his bowels.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>All power is of short life. A long sickness is troublesome to the physician.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The physician cutteth off a short sickness: so also a king is to day, and to morrow he shall die.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For when a man shall die, he shall inherit serpents, and beasts, and worms.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The beginning of the pride of man, is to fall off from God:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Because his heart is departed from him that made him: for pride is the beginning of all sin: he that holdeth it, shall be filled with maledictions, and it shall ruin him in the end.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Therefore hath the Lord disgraced the assemblies of the wicked, and hath utterly destroyed them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>God hath overturned the thrones of proud princes, and hath set up the meek in their stead.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>God hath made the roots of proud nations to wither, and hath planted the humble of these nations.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Lord hath overthrown the lands of the Gentiles, and hath destroyed them even to the foundation.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He hath made some of them to wither away, and hath destroyed them, and hath made the memory of them to cease from the earth.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>God hath abolished the memory of the proud, and hath preserved the memory of them that are humble in mind.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Pride was not made for men: nor wrath for the race of women.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>That seed of men shall be honoured, which feareth God: but that seed shall be dishonoured, which transgresseth the commandments of the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In the midst of brethren their chief is honourable: so shall they that fear the Lord, be in his eyes.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The fear of God is the glory of the rich, and of the honourable, and of the poor.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Despise not a just man that is poor, and do not magnify a sinful man that is rich.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The great man, and the judge, and the mighty is in honour: and there is none greater than he that feareth God.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They that are free shall serve a servant that is wise: and a man that is prudent and well instructed will not murmur when he is reproved; and he that is ignorant, shall not be honoured.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Extol not thyself in doing thy work, and linger not in the time of distress;</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Better is he that laboureth, and aboundeth in all things, than he that boasteth himself and wanteth bread.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>My son, keep thy soul in meekness, and give it honour according to its desert.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Who will justify him that sinneth against his own soul? and who will honour him that dishonoureth his own soul?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The poor man is glorified by his discipline and fear, and there is a man that is honoured for his wealth.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But he that is glorified in poverty, how much more in wealth? and he that is glorified in wealth, let him fear poverty.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Judex sapiens judicabit populum suum, et principatus sensati stabilis erit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Secundum judicem populi, sic et ministri ejus : et qualis rector est civitatis, tales et inhabitantes in ea.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Rex insipiens perdet populum suum : et civitates inhabitabuntur per sensum potentium.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In manu Dei potestas terræ : et utilem rectorem suscitabit in tempus super illam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In manu Dei prosperitas hominis, et super faciem scribæ imponet honorem suum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Omnis injuriæ proximi ne memineris, et nihil agas in operibus injuriæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Odibilis coram Deo est et hominibus superbia, et execrabilis omnis iniquitas gentium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Regnum a gente in gentem transfertur propter injustitias, et injurias, et contumelias, et diversos dolos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Avaro autem nihil est scelestius. Quid superbit terra et cinis ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nihil est iniquius quam amare pecuniam : hic enim et animam suam venalem habet, quoniam in vita sua projecit intima sua.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Omnis potentatus brevis vita ; languor prolixior gravat medicum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Brevem languorem præcidit medicus : sic et rex hodie est, et cras morietur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cum enim morietur homo, hæreditabit serpentes, et bestias, et vermes.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Initium superbiæ hominis apostatare a Deo :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>quoniam ab eo qui fecit illum recessit cor ejus, quoniam initium omnis peccati est superbia. Qui tenuerit illam adimplebitur maledictis, et subvertet eum in finem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Propterea exhonoravit Dominus conventus malorum, et destruxit eos usque in finem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sedes ducum superborum destruxit Deus, et sedere fecit mites pro eis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Radices gentium superbarum arefecit Deus, et plantavit humiles ex ipsis gentibus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Terras gentium evertit Dominus, et perdidit eas usque ad fundamentum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Arefecit ex ipsis, et disperdidit eos, et cessare fecit memoriam eorum a terra.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Memoria superborum perdidit Deus, et reliquit memoriam humilium sensu.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non est creata hominibus superbia, neque iracundia nationi mulierum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Semen hominum honorabitur hoc, quod timet Deum : semen autem hoc exhonorabitur, quod præterit mandata Domini.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In medio fratrum rector illorum in honore : et qui timent Dominum erunt in oculis illius.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Gloria divitum, honoratorum, et pauperum, timor Dei est.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Noli despicere hominem justum pauperem, et noli magnificare virum peccatorem divitem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Magnus, et judex, et potens est in honore : et non est major illo qui timet Deum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Servo sensato liberi servient : et vir prudens et disciplinatus non murmurabit correptus, et inscius non honorabitur.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Noli extollere te in faciendo opere tuo, et noli cunctari in tempore angustiæ.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Melior est qui operatur et abundat in omnibus, quam qui gloriatur et eget pane.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Fili, in mansuetudine serva animam tuam, et da illi honorem secundum meritum suum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Peccantem in animam suam quis justificabit ? et quis honorificabit exhonorantem animam suam ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Pauper gloriatur per disciplinam et timorem suum : et est homo qui honorificatur propter substantiam suam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Qui autem gloriatur in paupertate, quanto magis in substantia ! et qui gloriatur in substantia, paupertatem vereatur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 9</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/11/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate fon .webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.10\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":10,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"A wise judge shall judge his people, and the government of a prudent man shall be steady.\"},{\"verse\":2,\"text\":\"As the judge of the people is himself, so also are his ministers: and what manner of man the ruler of a city is, such also are they that dwell therein.\"},{\"verse\":3,\"text\":\"An unwise king shall be the ruin of his people: and cities shall be inhabited through the prudence of the rulers.\"},{\"verse\":4,\"text\":\"The power of the earth is in the hand of God, and in his time he will raise up a profitable ruler over it.\"},{\"verse\":5,\"text\":\"The prosperity of man is in the hand of God, and upon the person of the scribe he shall lay his honour.\"},{\"verse\":6,\"text\":\"Remember not any injury done thee by thy neighbour, and do thou nothing by deeds of injury.\"},{\"verse\":7,\"text\":\"Pride is hateful before God and men: and all iniquity of nations is execrable.\"},{\"verse\":8,\"text\":\"A kingdom is translated from one people to another, because of injustices, and wrongs, and injuries, and divers deceits.\"},{\"verse\":9,\"text\":\"But nothing is more wicked than the covetous man. Why is earth, and ashes proud?\"},{\"verse\":10,\"text\":\"There is not a more wicked thing than to love money: for such a one setteth even his own soul to sale: because while he liveth he hath cast away his bowels.\"},{\"verse\":11,\"text\":\"All power is of short life. A long sickness is troublesome to the physician.\"},{\"verse\":12,\"text\":\"The physician cutteth off a short sickness: so also a king is to day, and to morrow he shall die.\"},{\"verse\":13,\"text\":\"For when a man shall die, he shall inherit serpents, and beasts, and worms.\"},{\"verse\":14,\"text\":\"The beginning of the pride of man, is to fall off from God:\"},{\"verse\":15,\"text\":\"Because his heart is departed from him that made him: for pride is the beginning of all sin: he that holdeth it, shall be filled with maledictions, and it shall ruin him in the end.\"},{\"verse\":16,\"text\":\"Therefore hath the Lord disgraced the assemblies of the wicked, and hath utterly destroyed them.\"},{\"verse\":17,\"text\":\"God hath overturned the thrones of proud princes, and hath set up the meek in their stead.\"},{\"verse\":18,\"text\":\"God hath made the roots of proud nations to wither, and hath planted the humble of these nations.\"},{\"verse\":19,\"text\":\"The Lord hath overthrown the lands of the Gentiles, and hath destroyed them even to the foundation.\"},{\"verse\":20,\"text\":\"He hath made some of them to wither away, and hath destroyed them, and hath made the memory of them to cease from the earth.\"},{\"verse\":21,\"text\":\"God hath abolished the memory of the proud, and hath preserved the memory of them that are humble in mind.\"},{\"verse\":22,\"text\":\"Pride was not made for men: nor wrath for the race of women.\"},{\"verse\":23,\"text\":\"That seed of men shall be honoured, which feareth God: but that seed shall be dishonoured, which transgresseth the commandments of the Lord.\"},{\"verse\":24,\"text\":\"In the midst of brethren their chief is honourable: so shall they that fear the Lord, be in his eyes.\"},{\"verse\":25,\"text\":\"The fear of God is the glory of the rich, and of the honourable, and of the poor.\"},{\"verse\":26,\"text\":\"Despise not a just man that is poor, and do not magnify a sinful man that is rich.\"},{\"verse\":27,\"text\":\"The great man, and the judge, and the mighty is in honour: and there is none greater than he that feareth God.\"},{\"verse\":28,\"text\":\"They that are free shall serve a servant that is wise: and a man that is prudent and well instructed will not murmur when he is reproved; and he that is ignorant, shall not be honoured.\"},{\"verse\":29,\"text\":\"Extol not thyself in doing thy work, and linger not in the time of distress;\"},{\"verse\":30,\"text\":\"Better is he that laboureth, and aboundeth in all things, than he that boasteth himself and wanteth bread.\"},{\"verse\":31,\"text\":\"My son, keep thy soul in meekness, and give it honour according to its desert.\"},{\"verse\":32,\"text\":\"Who will justify him that sinneth against his own soul? and who will honour him that dishonoureth his own soul?\"},{\"verse\":33,\"text\":\"The poor man is glorified by his discipline and fear, and there is a man that is honoured for his wealth.\"},{\"verse\":34,\"text\":\"But he that is glorified in poverty, how much more in wealth? and he that is glorified in wealth, let him fear poverty.\"}],\"vul\":[{\"verse\":1,\"text\":\"Judex sapiens judicabit populum suum, et principatus sensati stabilis erit.\"},{\"verse\":2,\"text\":\"Secundum judicem populi, sic et ministri ejus : et qualis rector est civitatis, tales et inhabitantes in ea.\"},{\"verse\":3,\"text\":\"Rex insipiens perdet populum suum : et civitates inhabitabuntur per sensum potentium.\"},{\"verse\":4,\"text\":\"In manu Dei potestas terræ : et utilem rectorem suscitabit in tempus super illam.\"},{\"verse\":5,\"text\":\"In manu Dei prosperitas hominis, et super faciem scribæ imponet honorem suum.\"},{\"verse\":6,\"text\":\"Omnis injuriæ proximi ne memineris, et nihil agas in operibus injuriæ.\"},{\"verse\":7,\"text\":\"Odibilis coram Deo est et hominibus superbia, et execrabilis omnis iniquitas gentium.\"},{\"verse\":8,\"text\":\"Regnum a gente in gentem transfertur propter injustitias, et injurias, et contumelias, et diversos dolos.\"},{\"verse\":9,\"text\":\"Avaro autem nihil est scelestius. Quid superbit terra et cinis ?\"},{\"verse\":10,\"text\":\"Nihil est iniquius quam amare pecuniam : hic enim et animam suam venalem habet, quoniam in vita sua projecit intima sua.\"},{\"verse\":11,\"text\":\"Omnis potentatus brevis vita ; languor prolixior gravat medicum.\"},{\"verse\":12,\"text\":\"Brevem languorem præcidit medicus : sic et rex hodie est, et cras morietur.\"},{\"verse\":13,\"text\":\"Cum enim morietur homo, hæreditabit serpentes, et bestias, et vermes.\"},{\"verse\":14,\"text\":\"Initium superbiæ hominis apostatare a Deo :\"},{\"verse\":15,\"text\":\"quoniam ab eo qui fecit illum recessit cor ejus, quoniam initium omnis peccati est superbia. Qui tenuerit illam adimplebitur maledictis, et subvertet eum in finem.\"},{\"verse\":16,\"text\":\"Propterea exhonoravit Dominus conventus malorum, et destruxit eos usque in finem.\"},{\"verse\":17,\"text\":\"Sedes ducum superborum destruxit Deus, et sedere fecit mites pro eis.\"},{\"verse\":18,\"text\":\"Radices gentium superbarum arefecit Deus, et plantavit humiles ex ipsis gentibus.\"},{\"verse\":19,\"text\":\"Terras gentium evertit Dominus, et perdidit eas usque ad fundamentum.\"},{\"verse\":20,\"text\":\"Arefecit ex ipsis, et disperdidit eos, et cessare fecit memoriam eorum a terra.\"},{\"verse\":21,\"text\":\"Memoria superborum perdidit Deus, et reliquit memoriam humilium sensu.\"},{\"verse\":22,\"text\":\"Non est creata hominibus superbia, neque iracundia nationi mulierum.\"},{\"verse\":23,\"text\":\"Semen hominum honorabitur hoc, quod timet Deum : semen autem hoc exhonorabitur, quod præterit mandata Domini.\"},{\"verse\":24,\"text\":\"In medio fratrum rector illorum in honore : et qui timent Dominum erunt in oculis illius.\"},{\"verse\":25,\"text\":\"Gloria divitum, honoratorum, et pauperum, timor Dei est.\"},{\"verse\":26,\"text\":\"Noli despicere hominem justum pauperem, et noli magnificare virum peccatorem divitem.\"},{\"verse\":27,\"text\":\"Magnus, et judex, et potens est in honore : et non est major illo qui timet Deum.\"},{\"verse\":28,\"text\":\"Servo sensato liberi servient : et vir prudens et disciplinatus non murmurabit correptus, et inscius non honorabitur.\"},{\"verse\":29,\"text\":\"Noli extollere te in faciendo opere tuo, et noli cunctari in tempore angustiæ.\"},{\"verse\":30,\"text\":\"Melior est qui operatur et abundat in omnibus, quam qui gloriatur et eget pane.\"},{\"verse\":31,\"text\":\"Fili, in mansuetudine serva animam tuam, et da illi honorem secundum meritum suum.\"},{\"verse\":32,\"text\":\"Peccantem in animam suam quis justificabit ? et quis honorificabit exhonorantem animam suam ?\"},{\"verse\":33,\"text\":\"Pauper gloriatur per disciplinam et timorem suum : et est homo qui honorificatur propter substantiam suam.\"},{\"verse\":34,\"text\":\"Qui autem gloriatur in paupertate, quanto magis in substantia ! et qui gloriatur in substantia, paupertatem vereatur.\"}],\"summary\":\"The virtues and vices of men in power: the great evil of pride.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":9,\"label\":\"Sirach 9\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":11,\"label\":\"Sirach 11\"}}]]\n"])</script></body></html>
