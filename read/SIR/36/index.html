list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Have mercy upon us, O God of all, and behold us, and shew us the light of thy mercies:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And send thy fear upon the nations, that have not sought after thee: that they may know that there is no God beside thee, and that they may shew forth thy wonders.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lift up thy hand over the strange nations, that they may see thy power.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For as thou hast been sanctified in us in their sight, so thou shalt be magnified among them in our presence,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>That they may know thee, as we also have known thee, that there is no God beside thee, O Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Renew thy signs, and work new miracles.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Glorify thy hand, and thy right arm.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Raise up indignation, and pour out wrath.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Take away the adversary, and crush the enemy.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hasten the time, and remember the end, that they may declare thy wonderful works.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Let him that escapeth be consumed by the rage of the fire: and let them perish that oppress thy people.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Crush the head of the princes of the enemies that say: There is no other beside us.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Gather together all the tribes of Jacob: that they may know that there no God besides thee, and may declare thy great works: and thou shalt inherit them as from the beginning.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Have mercy on thy people, upon whom thy name is invoked: and upon Israel, whom thou hast raised up to be thy firstborn.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Have mercy on Jerusalem, the city which thou hast sanctified, the city of thy rest.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fill Sion with thy unspeakable words, and thy people with thy glory.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Give testimony to them that are thy creatures from the beginning, and raise up the prophecies which the former prophets spoke in thy name.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Reward them that patiently wait for thee, that thy prophets may be found faithful: and hear the prayers of thy servants,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>According to the blessing of Aaron over thy people, and direct us into the way of justice, and let all know that dwell upon the earth, that thou art God the beholder of all ages.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The belly will devour all meat, yet one is better than another.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The palate tasteth venison and the wise heart false speeches.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A perverse heart will cause grief, and a man of experience will resist it.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>A woman will receive every man: yet one daughter is better than another.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The beauty of a woman cheereth the countenance of her husband, and a man desireth nothing more.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>If she have a tongue that can cure, and likewise mitigate and shew mercy: her husband is not like other men.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He that possesseth a good wife, beginneth a possession: she is a help like to himself, and a pillar of rest.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Where there is no hedge, the possession shall be spoiled: and where there is no wife, he mourneth that is in want.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who will trust him that hath no rest, and that lodgeth wheresoever the night taketh him, as a robber well appointed, that skippeth from city to city.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Miserere nostri, Deus omnium, et respice nos, et ostende nobis lucem miserationum tuarum :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et immitte timorem tuum super gentes quæ non exquisierunt te, ut cognoscant quia non est deus nisi tu, et enarrent magnalia tua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Alleva manum tuam super gentes alienas, ut videant potentiam tuam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sicut enim in conspectu eorum sanctificatus es in nobis, sic in conspectu nostro magnificaberis in eis :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ut cognoscant te, sicut et nos cognovimus quoniam non est deus præter te, Domine.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Innova signa, et immuta mirabilia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Glorifica manum et brachium dextrum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Excita furorem, et effunde iram.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tolle adversarium, et afflige inimicum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Festina tempus, et memento finis, ut enarrent mirabilia tua.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In ira flammæ devoretur qui salvatur : et qui pessimant plebem tuam inveniant perditionem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Contere caput principum inimicorum, dicentium : Non est alius præter nos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Congrega omnes tribus Jacob, ut cognoscant quia non est deus nisi tu, et enarrent magnalia tua, et hæreditabis eos sicut ab initio.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Miserere plebi tuæ, super quam invocatum est nomen tuum, et Israël quem coæquasti primogenito tuo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Miserere civitati sanctificationis tuæ, Jerusalem, civitati requiei tuæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Reple Sion inenarrabilibus verbis tuis, et gloria tua populum tuum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Da testimonium his qui ab initio creaturæ tuæ sunt, et suscita prædicationes quas locuti sunt in nomine tuo prophetæ priores.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Da mercedem sustinentibus te, ut prophetæ tui fideles inveniantur : et exaudi orationes servorum tuorum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>secundum benedictionem Aaron de populo tuo : et dirige nos in viam justitiæ, et sciant omnes qui habitant terram quia tu es Deus conspector sæculorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omnem escam manducabit venter : et est cibus cibo melior.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fauces contingunt cibum feræ, et cor sensatum verba mendacia.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cor pravum dabit tristitiam, et homo peritus resistet illi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Omnem masculum excipiet mulier : et est filia melior filia.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Species mulieris exhilarat faciem viri sui, et super omnem concupiscentiam hominis superducit desiderium.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Si est lingua curationis, est et mitigationis et misericordiæ : non est vir illius secundum filios hominum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui possidet mulierem bonam inchoat possessionem : adjutorium secundum illum est, et columna ut requies.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ubi non est sepes, diripietur possessio : et ubi non est mulier, ingemiscit egens.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quis credit ei qui non habet nidum, et deflectens ubicumque obscuraverit, quasi succinctus latro exiliens de civitate in civitatem ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/35/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 35</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/37/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 37</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->36<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom) ,\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.36\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":36,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Have mercy upon us, O God of all, and behold us, and shew us the light of thy mercies:\"},{\"verse\":2,\"text\":\"And send thy fear upon the nations, that have not sought after thee: that they may know that there is no God beside thee, and that they may shew forth thy wonders.\"},{\"verse\":3,\"text\":\"Lift up thy hand over the strange nations, that they may see thy power.\"},{\"verse\":4,\"text\":\"For as thou hast been sanctified in us in their sight, so thou shalt be magnified among them in our presence,\"},{\"verse\":5,\"text\":\"That they may know thee, as we also have known thee, that there is no God beside thee, O Lord.\"},{\"verse\":6,\"text\":\"Renew thy signs, and work new miracles.\"},{\"verse\":7,\"text\":\"Glorify thy hand, and thy right arm.\"},{\"verse\":8,\"text\":\"Raise up indignation, and pour out wrath.\"},{\"verse\":9,\"text\":\"Take away the adversary, and crush the enemy.\"},{\"verse\":10,\"text\":\"Hasten the time, and remember the end, that they may declare thy wonderful works.\"},{\"verse\":11,\"text\":\"Let him that escapeth be consumed by the rage of the fire: and let them perish that oppress thy people.\"},{\"verse\":12,\"text\":\"Crush the head of the princes of the enemies that say: There is no other beside us.\"},{\"verse\":13,\"text\":\"Gather together all the tribes of Jacob: that they may know that there no God besides thee, and may declare thy great works: and thou shalt inherit them as from the beginning.\"},{\"verse\":14,\"text\":\"Have mercy on thy people, upon whom thy name is invoked: and upon Israel, whom thou hast raised up to be thy firstborn.\"},{\"verse\":15,\"text\":\"Have mercy on Jerusalem, the city which thou hast sanctified, the city of thy rest.\"},{\"verse\":16,\"text\":\"Fill Sion with thy unspeakable words, and thy people with thy glory.\"},{\"verse\":17,\"text\":\"Give testimony to them that are thy creatures from the beginning, and raise up the prophecies which the former prophets spoke in thy name.\"},{\"verse\":18,\"text\":\"Reward them that patiently wait for thee, that thy prophets may be found faithful: and hear the prayers of thy servants,\"},{\"verse\":19,\"text\":\"According to the blessing of Aaron over thy people, and direct us into the way of justice, and let all know that dwell upon the earth, that thou art God the beholder of all ages.\"},{\"verse\":20,\"text\":\"The belly will devour all meat, yet one is better than another.\"},{\"verse\":21,\"text\":\"The palate tasteth venison and the wise heart false speeches.\"},{\"verse\":22,\"text\":\"A perverse heart will cause grief, and a man of experience will resist it.\"},{\"verse\":23,\"text\":\"A woman will receive every man: yet one daughter is better than another.\"},{\"verse\":24,\"text\":\"The beauty of a woman cheereth the countenance of her husband, and a man desireth nothing more.\"},{\"verse\":25,\"text\":\"If she have a tongue that can cure, and likewise mitigate and shew mercy: her husband is not like other men.\"},{\"verse\":26,\"text\":\"He that possesseth a good wife, beginneth a possession: she is a help like to himself, and a pillar of rest.\"},{\"verse\":27,\"text\":\"Where there is no hedge, the possession shall be spoiled: and where there is no wife, he mourneth that is in want.\"},{\"verse\":28,\"text\":\"Who will trust him that hath no rest, and that lodgeth wheresoever the night taketh him, as a robber well appointed, that skippeth from city to city.\"}],\"vul\":[{\"verse\":1,\"text\":\"Miserere nostri, Deus omnium, et respice nos, et ostende nobis lucem miserationum tuarum :\"},{\"verse\":2,\"text\":\"et immitte timorem tuum super gentes quæ non exquisierunt te, ut cognoscant quia non est deus nisi tu, et enarrent magnalia tua.\"},{\"verse\":3,\"text\":\"Alleva manum tuam super gentes alienas, ut videant potentiam tuam.\"},{\"verse\":4,\"text\":\"Sicut enim in conspectu eorum sanctificatus es in nobis, sic in conspectu nostro magnificaberis in eis :\"},{\"verse\":5,\"text\":\"ut cognoscant te, sicut et nos cognovimus quoniam non est deus præter te, Domine.\"},{\"verse\":6,\"text\":\"Innova signa, et immuta mirabilia.\"},{\"verse\":7,\"text\":\"Glorifica manum et brachium dextrum.\"},{\"verse\":8,\"text\":\"Excita furorem, et effunde iram.\"},{\"verse\":9,\"text\":\"Tolle adversarium, et afflige inimicum.\"},{\"verse\":10,\"text\":\"Festina tempus, et memento finis, ut enarrent mirabilia tua.\"},{\"verse\":11,\"text\":\"In ira flammæ devoretur qui salvatur : et qui pessimant plebem tuam inveniant perditionem.\"},{\"verse\":12,\"text\":\"Contere caput principum inimicorum, dicentium : Non est alius præter nos.\"},{\"verse\":13,\"text\":\"Congrega omnes tribus Jacob, ut cognoscant quia non est deus nisi tu, et enarrent magnalia tua, et hæreditabis eos sicut ab initio.\"},{\"verse\":14,\"text\":\"Miserere plebi tuæ, super quam invocatum est nomen tuum, et Israël quem coæquasti primogenito tuo.\"},{\"verse\":15,\"text\":\"Miserere civitati sanctificationis tuæ, Jerusalem, civitati requiei tuæ.\"},{\"verse\":16,\"text\":\"Reple Sion inenarrabilibus verbis tuis, et gloria tua populum tuum.\"},{\"verse\":17,\"text\":\"Da testimonium his qui ab initio creaturæ tuæ sunt, et suscita prædicationes quas locuti sunt in nomine tuo prophetæ priores.\"},{\"verse\":18,\"text\":\"Da mercedem sustinentibus te, ut prophetæ tui fideles inveniantur : et exaudi orationes servorum tuorum,\"},{\"verse\":19,\"text\":\"secundum benedictionem Aaron de populo tuo : et dirige nos in viam justitiæ, et sciant omnes qui habitant terram quia tu es Deus conspector sæculorum.\"},{\"verse\":20,\"text\":\"Omnem escam manducabit venter : et est cibus cibo melior.\"},{\"verse\":21,\"text\":\"Fauces contingunt cibum feræ, et cor sensatum verba mendacia.\"},{\"verse\":22,\"text\":\"Cor pravum dabit tristitiam, et homo peritus resistet illi.\"},{\"verse\":23,\"text\":\"Omnem masculum excipiet mulier : et est filia melior filia.\"},{\"verse\":24,\"text\":\"Species mulieris exhilarat faciem viri sui, et super omnem concupiscentiam hominis superducit desiderium.\"},{\"verse\":25,\"text\":\"Si est lingua curationis, est et mitigationis et misericordiæ : non est vir illius secundum filios hominum.\"},{\"verse\":26,\"text\":\"Qui possidet mulierem bonam inchoat possessionem : adjutorium secundum illum est, et columna ut requies.\"},{\"verse\":27,\"text\":\"Ubi non est sepes, diripietur possessio : et ubi non est mulier, ingemiscit egens.\"},{\"verse\":28,\"text\":\"Quis credit ei qui non habet nidum, et deflectens ubicumque obscuraverit, quasi succinctus latro exiliens de civitate in civitatem ?\"}],\"summary\":\"A prayer for the church of God. Of a good heart, and a good wife.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":35,\"label\":\"Sirach 35\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":37,\"label\":\"Sirach 37\"}}]]\n"])</script></body></html>
