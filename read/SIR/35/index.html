nt-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that keepeth the law, multiplieth offerings.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>It is a wholesome sacrifice to take heed to the commandments, and to depart from all iniquity.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And to depart from injustice, is to offer a propitiatory sacrifice for injustices, and a begging of pardon for sins.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He shall return thanks, that offereth fine flour: and he that doth mercy, offereth sacrifice.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>To depart from iniquity is that which pleaseth the Lord, and to depart from injustice, is an entreaty for sins.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thou shalt not appear empty in the sight of the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For all these things are to be done because of the commandment of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The oblation of the just maketh the altar fat, and is an odour of sweetness in the sight of the most High.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The sacrifice of the just is acceptable, and the Lord will not forget the memorial thereof.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Give glory to God with a good heart: and diminish not the firstfruits of thy hands.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In every gift shew a cheerful countenance, and sanctify thy tithes with joy.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Give to the most High according to what he hath given to thee, and with a good eye do according to the ability of thy hands:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the Lord maketh recompense, and will give thee seven times as much.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Do not offer wicked gifts, for such he will not receive.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And look not upon an unjust sacrifice, for the Lord is judge, and there is not with him respect of person.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The Lord will not accept any person against a poor man, and he will hear the prayer of him that is wronged.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He will not despise the prayers of the fatherless: nor the widow, when she poureth out her complaint.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Do not the widow’s tears run down the cheek, and her cry against him that causeth them to fall?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For from the cheek they go up even to heaven, and the Lord that heareth will not be delighted with them.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that adoreth God with joy, shall be accepted, and his prayer shall approach even to the clouds.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The prayer of him that humbleth himself, shall pierce the clouds: and till it come nigh he will not be comforted: and he will not depart till the most High behold.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the Lord will not be slack, but will judge for the just, and will do judgment: and the Almighty will not have patience with them, that he may crush their back:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he will repay vengeance to the Gentiles, till he have taken away the multitude of the proud, and broken the sceptres of the unjust,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Till he have rendered to men according to their deeds: and according to the works of Adam, and according to his presumption,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Till he have judged the cause of his people, and he shall delight the just with his mercy.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The mercy of God is beautiful in the time of affliction, as a cloud of rain in the time of drought.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui conservat legem multiplicat oblationem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sacrificium salutare est attendere mandatis, et discedere ab omni iniquitate.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et propitiationem litare sacrificii super injustitias : et deprecatio pro peccatis, recedere ab injustitia.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Retribuet gratiam qui offert similaginem : et qui facit misericordiam offert sacrificium.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Beneplacitum est Domino recedere ab iniquitate : et deprecatio pro peccatis recedere ab injustitia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non apparebis ante conspectum Domini vacuus :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>hæc enim omnia propter mandatum Dei fiunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Oblatio justi impinguat altare, et odor suavitatis est in conspectu Altissimi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sacrificium justi acceptum est, et memoriam ejus non obliviscetur Dominus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Bono animo gloriam redde Deo, et non minuas primitias manuum tuarum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In omni dato hilarem fac vultum tuum, et in exsultatione sanctifica decimas tuas.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Da Altissimo secundum datum ejus, et in bono oculo adinventionem facito manuum tuarum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>quoniam Dominus retribuens est, et septies tantum reddet tibi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Noli offerre munera prava, non enim suscipiet illa.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et noli inspicere sacrificum injustum, quoniam Dominus judex est, et non est apud illum gloria personæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non accipiet Dominus personam in pauperem, et deprecationem læsi exaudiet.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non despiciet preces pupilli, nec viduam, si effundat loquelam gemitus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Nonne lacrimæ viduæ ad maxillam descendunt, et exclamatio ejus super deducentem eas ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A maxilla enim ascendunt usque ad cælum, et Dominus exauditor non delectabitur in illis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui adorat Deum in oblectatione suscipietur, et deprecatio illius usque ad nubes propinquabit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Oratio humiliantis se nubes penetrabit, et donec propinquet non consolabitur, et non discedet donec Altissimus aspiciat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et Dominus non elongabit : et judicabit justos, et faciet judicium : et Fortissimus non habebit in illis patientiam, ut contribulet dorsum ipsorum :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et gentibus reddet vindictam, donec tollat plenitudinem superborum, et sceptra iniquorum contribulet :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>donec reddat hominibus secundum actus suos, et secundum opera Adæ, et secundum præsumptionem illius :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>donec judicet judicium plebis suæ, et oblectabit justos misericordia sua.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Speciosa misericordia Dei in tempore tribulationis, quasi nubes pluviæ in tempore siccitatis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href=" asticus\",\"chapter\":35,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"He that keepeth the law, multiplieth offerings.\"},{\"verse\":2,\"text\":\"It is a wholesome sacrifice to take heed to the commandments, and to depart from all iniquity.\"},{\"verse\":3,\"text\":\"And to depart from injustice, is to offer a propitiatory sacrifice for injustices, and a begging of pardon for sins.\"},{\"verse\":4,\"text\":\"He shall return thanks, that offereth fine flour: and he that doth mercy, offereth sacrifice.\"},{\"verse\":5,\"text\":\"To depart from iniquity is that which pleaseth the Lord, and to depart from injustice, is an entreaty for sins.\"},{\"verse\":6,\"text\":\"Thou shalt not appear empty in the sight of the Lord.\"},{\"verse\":7,\"text\":\"For all these things are to be done because of the commandment of God.\"},{\"verse\":8,\"text\":\"The oblation of the just maketh the altar fat, and is an odour of sweetness in the sight of the most High.\"},{\"verse\":9,\"text\":\"The sacrifice of the just is acceptable, and the Lord will not forget the memorial thereof.\"},{\"verse\":10,\"text\":\"Give glory to God with a good heart: and diminish not the firstfruits of thy hands.\"},{\"verse\":11,\"text\":\"In every gift shew a cheerful countenance, and sanctify thy tithes with joy.\"},{\"verse\":12,\"text\":\"Give to the most High according to what he hath given to thee, and with a good eye do according to the ability of thy hands:\"},{\"verse\":13,\"text\":\"For the Lord maketh recompense, and will give thee seven times as much.\"},{\"verse\":14,\"text\":\"Do not offer wicked gifts, for such he will not receive.\"},{\"verse\":15,\"text\":\"And look not upon an unjust sacrifice, for the Lord is judge, and there is not with him respect of person.\"},{\"verse\":16,\"text\":\"The Lord will not accept any person against a poor man, and he will hear the prayer of him that is wronged.\"},{\"verse\":17,\"text\":\"He will not despise the prayers of the fatherless: nor the widow, when she poureth out her complaint.\"},{\"verse\":18,\"text\":\"Do not the widow’s tears run down the cheek, and her cry against him that causeth them to fall?\"},{\"verse\":19,\"text\":\"For from the cheek they go up even to heaven, and the Lord that heareth will not be delighted with them.\"},{\"verse\":20,\"text\":\"He that adoreth God with joy, shall be accepted, and his prayer shall approach even to the clouds.\"},{\"verse\":21,\"text\":\"The prayer of him that humbleth himself, shall pierce the clouds: and till it come nigh he will not be comforted: and he will not depart till the most High behold.\"},{\"verse\":22,\"text\":\"And the Lord will not be slack, but will judge for the just, and will do judgment: and the Almighty will not have patience with them, that he may crush their back:\"},{\"verse\":23,\"text\":\"And he will repay vengeance to the Gentiles, till he have taken away the multitude of the proud, and broken the sceptres of the unjust,\"},{\"verse\":24,\"text\":\"Till he have rendered to men according to their deeds: and according to the works of Adam, and according to his presumption,\"},{\"verse\":25,\"text\":\"Till he have judged the cause of his people, and he shall delight the just with his mercy.\"},{\"verse\":26,\"text\":\"The mercy of God is beautiful in the time of affliction, as a cloud of rain in the time of drought.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui conservat legem multiplicat oblationem.\"},{\"verse\":2,\"text\":\"Sacrificium salutare est attendere mandatis, et discedere ab omni iniquitate.\"},{\"verse\":3,\"text\":\"Et propitiationem litare sacrificii super injustitias : et deprecatio pro peccatis, recedere ab injustitia.\"},{\"verse\":4,\"text\":\"Retribuet gratiam qui offert similaginem : et qui facit misericordiam offert sacrificium.\"},{\"verse\":5,\"text\":\"Beneplacitum est Domino recedere ab iniquitate : et deprecatio pro peccatis recedere ab injustitia.\"},{\"verse\":6,\"text\":\"Non apparebis ante conspectum Domini vacuus :\"},{\"verse\":7,\"text\":\"hæc enim omnia propter mandatum Dei fiunt.\"},{\"verse\":8,\"text\":\"Oblatio justi impinguat altare, et odor suavitatis est in conspectu Altissimi.\"},{\"verse\":9,\"text\":\"Sacrificium justi acceptum est, et memoriam ejus non obliviscetur Dominus.\"},{\"verse\":10,\"text\":\"Bono animo gloriam redde Deo, et non minuas primitias manuum tuarum.\"},{\"verse\":11,\"text\":\"In omni dato hilarem fac vultum tuum, et in exsultatione sanctifica decimas tuas.\"},{\"verse\":12,\"text\":\"Da Altissimo secundum datum ejus, et in bono oculo adinventionem facito manuum tuarum,\"},{\"verse\":13,\"text\":\"quoniam Dominus retribuens est, et septies tantum reddet tibi.\"},{\"verse\":14,\"text\":\"Noli offerre munera prava, non enim suscipiet illa.\"},{\"verse\":15,\"text\":\"Et noli inspicere sacrificum injustum, quoniam Dominus judex est, et non est apud illum gloria personæ.\"},{\"verse\":16,\"text\":\"Non accipiet Dominus personam in pauperem, et deprecationem læsi exaudiet.\"},{\"verse\":17,\"text\":\"Non despiciet preces pupilli, nec viduam, si effundat loquelam gemitus.\"},{\"verse\":18,\"text\":\"Nonne lacrimæ viduæ ad maxillam descendunt, et exclamatio ejus super deducentem eas ?\"},{\"verse\":19,\"text\":\"A maxilla enim ascendunt usque ad cælum, et Dominus exauditor non delectabitur in illis.\"},{\"verse\":20,\"text\":\"Qui adorat Deum in oblectatione suscipietur, et deprecatio illius usque ad nubes propinquabit.\"},{\"verse\":21,\"text\":\"Oratio humiliantis se nubes penetrabit, et donec propinquet non consolabitur, et non discedet donec Altissimus aspiciat.\"},{\"verse\":22,\"text\":\"Et Dominus non elongabit : et judicabit justos, et faciet judicium : et Fortissimus non habebit in illis patientiam, ut contribulet dorsum ipsorum :\"},{\"verse\":23,\"text\":\"et gentibus reddet vindictam, donec tollat plenitudinem superborum, et sceptra iniquorum contribulet :\"},{\"verse\":24,\"text\":\"donec reddat hominibus secundum actus suos, et secundum opera Adæ, et secundum præsumptionem illius :\"},{\"verse\":25,\"text\":\"donec judicet judicium plebis suæ, et oblectabit justos misericordia sua.\"},{\"verse\":26,\"text\":\"Speciosa misericordia Dei in tempore tribulationis, quasi nubes pluviæ in tempore siccitatis.\"}],\"summary\":\"What sacrifices are pleasing to God.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":34,\"label\":\"Sirach 34\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":36,\"label\":\"Sirach 36\"}}]]\n"])</script></body></html>
