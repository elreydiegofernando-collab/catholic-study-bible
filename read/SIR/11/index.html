[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Lessons of humility and moderation in all things.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The wisdom of the humble shall exalt his head, and shall make him sit in the midst of great men.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Praise not a man for his beauty, neither despise a man for his look.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The bee is small among flying things but her fruit hath the chiefest sweetness.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Glory not in apparel at any time, and be not exalted in the day of thy honour: for the works of the Highest only are wonderful, and his works are glorious, and secret, and hidden.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Many tyrants have sat on the throne, and he whom no man would think on, hath worn the crown.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Many mighty men have been greatly brought down, and the glorious have been delivered into the hand of others.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Before thou inquire, blame no man: and when thou hast inquired, reprove justly.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Before thou hear, answer not a word: and interrupt not others in the midst of their discourse.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Strive not in a matter which doth not concern thee, and sit not in judgment with sinners.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>My son, meddle not with many matters: and if thou be rich, thou shalt not be free from sin: for if thou pursue after thou shalt not overtake; and if thou run before thou shalt not escape.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>There is an ungodly man that laboureth, and maketh haste, and is in sorrow, and is so much the more in want.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Again, there is an inactive man that wanteth help, is very weak in ability, and full of poverty:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Yet the eye of God hath looked upon him for good, and hath lifted him up from his low estate, and hath exalted his head: and many have wondered at him, and have glorified God.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Good things and evil, life and death, poverty and riches, are from God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Wisdom and discipline, and the knowledge of the law are with God. Love and the ways of good things are with him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Error and darkness are created with sinners: and they that glory in evil things, grow old in evil.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The gift of God abideth with the just, and his advancement shall have success for ever.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>There is one that is enriched by living sparingly, and this is the portion of his reward.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In that he saith: I have found me rest, and now I will eat of my goods alone:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he knoweth not what time shall pass, and that death approacheth, and that he must leave all to others, and shall die.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Be steadfast in thy covenant, and be conversant therein, and grow old in the work of thy commandments.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Abide not in the works of sinners. But trust in God, and stay in thy place,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For it is easy in the eyes of God on a sudden to make the poor man rich.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The blessing of God maketh haste to reward the just, and in a swift hour his blessing beareth fruit.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Say not: What need I, and what good shall I have by this?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Say not: I am sufficient for myself: and what shall I be made worse by this?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In the day of good things be not unmindful of evils: and in the day of evils be not unmindful of good things:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For it is easy before God in the day of death to reward every one according to his ways.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The affliction of an hour maketh one forget great delights, and in the end of a man is the disclosing of his works.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Praise not any man before death, for a man is known by his children.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Bring not every man into thy house: for many are the snares of the deceitful.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For as corrupted bowels send forth stinking breath, and as the partridge is brought into the cage, and as the roe into the snare: so also is the heart of the proud, and as a spy that looketh on the fall of his neighbour.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>For he lieth in wait and turneth good into evil, and on the elect he will lay a blot.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Of one spark cometh a great fire, and of one deceitful man much blood: and a sinful man lieth in wait for blood.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Take heed to thyself of a mischievous man, for he worketh evils: lest he bring upon thee reproach for ever.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Receive a stranger in, and he shall overthrow thee with a whirlwind, and shall turn thee out of thy own.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sapientia humiliati exaltabit caput illius, et in medio magnatorum consedere illum faciet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Non laudes virum in specie sua, neque spernas hominem in visu suo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Brevis in volatilibus est apis, et initium dulcoris habet fructus illius.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In vestitu ne glorieris umquam, nec in die honoris tui extollaris : quoniam mirabilia opera Altissimi solius, et gloriosa, et absconsa, et invisa opera illius.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Multi tyranni sederunt in throno : et insuspicabilis portavit diadema.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Multi potentes oppressi sunt valide, et gloriosi traditi sunt in manus alterorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Priusquam interroges, ne vituperes quemquam : et cum interrogaveris, corripe juste.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Priusquam audias, ne respondeas verbum : et in medio sermonum ne adjicias loqui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>De ea re quæ te non molestat, ne certeris : et in judicio peccantium ne consistas.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fili, ne in multis sint actus tui : et si dives fueris, non eris immunis a delicto. Si enim secutus fueris, non apprehendes : et non effugies, si præcucurreris.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Est homo laborans et festinans, et dolens : impius, et tanto magis non abundabit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Est homo marcidus egens recuperatione, plus deficiens virtute, et abundans paupertate :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et oculus Dei respexit illum in bono, et erexit eum ab humilitate ipsius, et exaltavit caput ejus : et mirati sunt in illo multi, et honoraverunt Deum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Bona et mala, vita et mors, paupertas et honestas, a Deo sunt :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>sapientia, et disciplina, et scientia legis, apud Deum : dilectio, et viæ bonorum, apud ipsum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Error et tenebræ peccatoribus concreata sunt : qui autem exsultant in malis consenescunt in malo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Datio Dei permanet justis, et profectus illius successus habebit in æternum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Est qui locupletatur parce agendo, et hæc est pars mercedis illius.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In eo quod dicit : Inveni requiem mihi, et nunc manducabo de bonis meis solus :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et nescit quod tempus præteriet, et mors appropinquet, et relinquat omnia aliis, et morietur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sta in testamento tuo, et in illo colloquere, et in opere mandatorum tuorum veterasce.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ne manseris in operibus peccatorum : confide autem in Deo, et mane in loco tuo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Facile est enim in oculis Dei subito honestare pauperem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Benedictio Dei in mercedem justi festinat, et in hora veloci processus illius fructificat.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ne dicas : Quid est mihi opus ? et quæ erunt mihi ex hoc bona ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ne dicas : Sufficiens mihi sum : et quid ex hoc pessimabor ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In die bonorum ne immemor sis malorum, et in die malorum ne immemor sis bonorum :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>quoniam facile est coram Deo in die obitus retribuere unicuique secundum vias suas.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Malitia horæ oblivionem facit luxuriæ magnæ, et in fine hominis denudatio operum illius.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ante mortem ne laudes hominem quemquam : quoniam in filiis suis agnoscitur vir.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Non omnem hominem inducas in domum tuam : multæ enim sunt insidiæ dolosi.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sicut enim eructant præcordia fœtentium, et sicut perdix inducitur in caveam, et ut caprea in laqueum : sic et cor superborum, et sicut prospector videns casum proximi sui.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Bona enim in mala convertens insidiatur, et in electis imponet maculam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>A scintilla una augetur ignis, et ab uno doloso augetur sanguis : homo vero peccator sanguini insidiatur.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Attende tibi a pestifero, fabricat enim mala, ne inducat super te subsannationem in perpetuum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Admitte ad te alienigenam : et subvertet te in turbine, et abalienabit te a tuis propriis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-ca sfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":11,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"The wisdom of the humble shall exalt his head, and shall make him sit in the midst of great men.\"},{\"verse\":2,\"text\":\"Praise not a man for his beauty, neither despise a man for his look.\"},{\"verse\":3,\"text\":\"The bee is small among flying things but her fruit hath the chiefest sweetness.\"},{\"verse\":4,\"text\":\"Glory not in apparel at any time, and be not exalted in the day of thy honour: for the works of the Highest only are wonderful, and his works are glorious, and secret, and hidden.\"},{\"verse\":5,\"text\":\"Many tyrants have sat on the throne, and he whom no man would think on, hath worn the crown.\"},{\"verse\":6,\"text\":\"Many mighty men have been greatly brought down, and the glorious have been delivered into the hand of others.\"},{\"verse\":7,\"text\":\"Before thou inquire, blame no man: and when thou hast inquired, reprove justly.\"},{\"verse\":8,\"text\":\"Before thou hear, answer not a word: and interrupt not others in the midst of their discourse.\"},{\"verse\":9,\"text\":\"Strive not in a matter which doth not concern thee, and sit not in judgment with sinners.\"},{\"verse\":10,\"text\":\"My son, meddle not with many matters: and if thou be rich, thou shalt not be free from sin: for if thou pursue after thou shalt not overtake; and if thou run before thou shalt not escape.\"},{\"verse\":11,\"text\":\"There is an ungodly man that laboureth, and maketh haste, and is in sorrow, and is so much the more in want.\"},{\"verse\":12,\"text\":\"Again, there is an inactive man that wanteth help, is very weak in ability, and full of poverty:\"},{\"verse\":13,\"text\":\"Yet the eye of God hath looked upon him for good, and hath lifted him up from his low estate, and hath exalted his head: and many have wondered at him, and have glorified God.\"},{\"verse\":14,\"text\":\"Good things and evil, life and death, poverty and riches, are from God.\"},{\"verse\":15,\"text\":\"Wisdom and discipline, and the knowledge of the law are with God. Love and the ways of good things are with him.\"},{\"verse\":16,\"text\":\"Error and darkness are created with sinners: and they that glory in evil things, grow old in evil.\"},{\"verse\":17,\"text\":\"The gift of God abideth with the just, and his advancement shall have success for ever.\"},{\"verse\":18,\"text\":\"There is one that is enriched by living sparingly, and this is the portion of his reward.\"},{\"verse\":19,\"text\":\"In that he saith: I have found me rest, and now I will eat of my goods alone:\"},{\"verse\":20,\"text\":\"And he knoweth not what time shall pass, and that death approacheth, and that he must leave all to others, and shall die.\"},{\"verse\":21,\"text\":\"Be steadfast in thy covenant, and be conversant therein, and grow old in the work of thy commandments.\"},{\"verse\":22,\"text\":\"Abide not in the works of sinners. But trust in God, and stay in thy place,\"},{\"verse\":23,\"text\":\"For it is easy in the eyes of God on a sudden to make the poor man rich.\"},{\"verse\":24,\"text\":\"The blessing of God maketh haste to reward the just, and in a swift hour his blessing beareth fruit.\"},{\"verse\":25,\"text\":\"Say not: What need I, and what good shall I have by this?\"},{\"verse\":26,\"text\":\"Say not: I am sufficient for myself: and what shall I be made worse by this?\"},{\"verse\":27,\"text\":\"In the day of good things be not unmindful of evils: and in the day of evils be not unmindful of good things:\"},{\"verse\":28,\"text\":\"For it is easy before God in the day of death to reward every one according to his ways.\"},{\"verse\":29,\"text\":\"The affliction of an hour maketh one forget great delights, and in the end of a man is the disclosing of his works.\"},{\"verse\":30,\"text\":\"Praise not any man before death, for a man is known by his children.\"},{\"verse\":31,\"text\":\"Bring not every man into thy house: for many are the snares of the deceitful.\"},{\"verse\":32,\"text\":\"For as corrupted bowels send forth stinking breath, and as the partridge is brought into the cage, and as the roe into the snare: so also is the heart of the proud, and as a spy that looketh on the fall of his neighbour.\"},{\"verse\":33,\"text\":\"For he lieth in wait and turneth good into evil, and on the elect he will lay a blot.\"},{\"verse\":34,\"text\":\"Of one spark cometh a great fire, and of one deceitful man much blood: and a sinful man lieth in wait for blood.\"},{\"verse\":35,\"text\":\"Take heed to thyself of a mischievous man, for he worketh evils: lest he bring upon thee reproach for ever.\"},{\"verse\":36,\"text\":\"Receive a stranger in, and he shall overthrow thee with a whirlwind, and shall turn thee out of thy own.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sapientia humiliati exaltabit caput illius, et in medio magnatorum consedere illum faciet.\"},{\"verse\":2,\"text\":\"Non laudes virum in specie sua, neque spernas hominem in visu suo.\"},{\"verse\":3,\"text\":\"Brevis in volatilibus est apis, et initium dulcoris habet fructus illius.\"},{\"verse\":4,\"text\":\"In vestitu ne glorieris umquam, nec in die honoris tui extollaris : quoniam mirabilia opera Altissimi solius, et gloriosa, et absconsa, et invisa opera illius.\"},{\"verse\":5,\"text\":\"Multi tyranni sederunt in throno : et insuspicabilis portavit diadema.\"},{\"verse\":6,\"text\":\"Multi potentes oppressi sunt valide, et gloriosi traditi sunt in manus alterorum.\"},{\"verse\":7,\"text\":\"Priusquam interroges, ne vituperes quemquam : et cum interrogaveris, corripe juste.\"},{\"verse\":8,\"text\":\"Priusquam audias, ne respondeas verbum : et in medio sermonum ne adjicias loqui.\"},{\"verse\":9,\"text\":\"De ea re quæ te non molestat, ne certeris : et in judicio peccantium ne consistas.\"},{\"verse\":10,\"text\":\"Fili, ne in multis sint actus tui : et si dives fueris, non eris immunis a delicto. Si enim secutus fueris, non apprehendes : et non effugies, si præcucurreris.\"},{\"verse\":11,\"text\":\"Est homo laborans et festinans, et dolens : impius, et tanto magis non abundabit.\"},{\"verse\":12,\"text\":\"Est homo marcidus egens recuperatione, plus deficiens virtute, et abundans paupertate :\"},{\"verse\":13,\"text\":\"et oculus Dei respexit illum in bono, et erexit eum ab humilitate ipsius, et exaltavit caput ejus : et mirati sunt in illo multi, et honoraverunt Deum.\"},{\"verse\":14,\"text\":\"Bona et mala, vita et mors, paupertas et honestas, a Deo sunt :\"},{\"verse\":15,\"text\":\"sapientia, et disciplina, et scientia legis, apud Deum : dilectio, et viæ bonorum, apud ipsum.\"},{\"verse\":16,\"text\":\"Error et tenebræ peccatoribus concreata sunt : qui autem exsultant in malis consenescunt in malo.\"},{\"verse\":17,\"text\":\"Datio Dei permanet justis, et profectus illius successus habebit in æternum.\"},{\"verse\":18,\"text\":\"Est qui locupletatur parce agendo, et hæc est pars mercedis illius.\"},{\"verse\":19,\"text\":\"In eo quod dicit : Inveni requiem mihi, et nunc manducabo de bonis meis solus :\"},{\"verse\":20,\"text\":\"et nescit quod tempus præteriet, et mors appropinquet, et relinquat omnia aliis, et morietur.\"},{\"verse\":21,\"text\":\"Sta in testamento tuo, et in illo colloquere, et in opere mandatorum tuorum veterasce.\"},{\"verse\":22,\"text\":\"Ne manseris in operibus peccatorum : confide autem in Deo, et mane in loco tuo.\"},{\"verse\":23,\"text\":\"Facile est enim in oculis Dei subito honestare pauperem.\"},{\"verse\":24,\"text\":\"Benedictio Dei in mercedem justi festinat, et in hora veloci processus illius fructificat.\"},{\"verse\":25,\"text\":\"Ne dicas : Quid est mihi opus ? et quæ erunt mihi ex hoc bona ?\"},{\"verse\":26,\"text\":\"Ne dicas : Sufficiens mihi sum : et quid ex hoc pessimabor ?\"},{\"verse\":27,\"text\":\"In die bonorum ne immemor sis malorum, et in die malorum ne immemor sis bonorum :\"},{\"verse\":28,\"text\":\"quoniam facile est coram Deo in die obitus retribuere unicuique secundum vias suas.\"},{\"verse\":29,\"text\":\"Malitia horæ oblivionem facit luxuriæ magnæ, et in fine hominis denudatio operum illius.\"},{\"verse\":30,\"text\":\"Ante mortem ne laudes hominem quemquam : quoniam in filiis suis agnoscitur vir.\"},{\"verse\":31,\"text\":\"Non omnem hominem inducas in domum tuam : multæ enim sunt insidiæ dolosi.\"},{\"verse\":32,\"text\":\"Sicut enim eructant præcordia fœtentium, et sicut perdix inducitur in caveam, et ut caprea in laqueum : sic et cor superborum, et sicut prospector videns casum proximi sui.\"},{\"verse\":33,\"text\":\"Bona enim in mala convertens insidiatur, et in electis imponet maculam.\"},{\"verse\":34,\"text\":\"A scintilla una augetur ignis, et ab uno doloso augetur sanguis : homo vero peccator sanguini insidiatur.\"},{\"verse\":35,\"text\":\"Attende tibi a pestifero, fabricat enim mala, ne inducat super te subsannationem in perpetuum.\"},{\"verse\":36,\"text\":\"Admitte ad te alienigenam : et subvertet te in turbine, et abalienabit te a tuis propriis.\"}],\"summary\":\"Lessons of humility and moderation in all things.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":10,\"label\":\"Sirach 10\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":12,\"label\":\"Sirach 12\"}}]]\n"])</script></body></html>
