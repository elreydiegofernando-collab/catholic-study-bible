ly-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Valiant in war was Jesus the son of Nave, who was successor of Moses among the prophets, who was great according to his name,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Very great for the saving the elect of God, to overthrow the enemies that rose up against them, that he might get the inheritance for Israel.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>How great glory did he gain when he lifted up his hands, and stretched out swords against the cities?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who before him hath so resisted? for the Lord himself brought the enemies.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Was not the sun stopped in his anger, and one day made as two?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He called upon the most high Sovereign when the enemies assaulted him on every side, and the great and holy God heard him by hailstones of exceeding great force.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He made a violent assault against the nation of his enemies, and in the descent he destroyed the adversaries.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>That the nations might know his power, that it is not easy to fight against God. And he followed the mighty one:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And in the days of Moses he did a work of mercy, he and Caleb the son of Jephone, in standing against the enemy, and withholding the people from sins, and appeasing the wicked murmuring.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they two being appointed, were delivered out of the danger from among the number of six hundred thousand men on foot, to bring them into their inheritance, into the land that floweth with milk and honey.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the Lord gave strength also to Caleb, and his strength continued even to his old age, so that he went up to the high places of the land, and his seed obtained it for an inheritance:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>That all the children of Israel might see, that it is good to obey the holy God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then all the judges, every one by name, whose heart was not corrupted: who turned not away from the Lord,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>That their memory might be blessed, and their bones spring up out of their place,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And their name continue for ever, the glory of the holy men remaining unto their children.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Samuel the prophet of the Lord, the beloved of the Lord his God, established a new government, and anointed princes over his people.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>By the law of the Lord he judged the congregation, and the God of Jacob beheld, and by his fidelity he was proved a prophet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he was known to be faithful in his words, because he saw the God of light:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And called upon the name of the Lord Almighty, in fighting against the enemies who beset him on every side, when he offered a lamb without blemish.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the Lord thundered from heaven, and with a great noise made his voice to be heard.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he crushed the princes of the Tyrians, and all the lords of the Philistines:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And before the time of the end of his life in the world, he protested before the Lord, and his anointed: money, or any thing else, even to a shoe, he had not taken of any man, and no man did accuse him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And after this he slept, and he made known to the king, and shewed him the end of his life, and he lifted up his voice from the earth in prophecy to blot out the wickedness of the nation.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fortis in bello Jesus Nave, successor Moysi in prophetis, qui fuit magnus secundum nomen suum,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>maximus in salutem electorum Dei, expugnare insurgentes hostes, ut consequeretur hæreditatem Israël.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quam gloriam adeptus est in tollendo manus suas, et jactando contra civitates rhomphæas !</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quis ante illum sic restitit ? nam hostes ipse Dominus perduxit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>An non in iracundia ejus impeditus est sol, et una dies facta est quasi duo ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Invocavit Altissimum potentem, in oppugnando inimicos undique : et audivit illum magnus et sanctus Deus, in saxis grandinis virtutis valde fortis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Impetum fecit contra gentem hostilem, et in descensu perdidit contrarios :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>ut cognoscant gentes potentiam ejus, quia contra Deum pugnare non est facile. Et secutus est a tergo potentis :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et in diebus Moysi misericordiam fecit, ipse, et Caleb filius Jephone, stare contra hostem, et prohibere gentem a peccatis, et perfringere murmur malitiæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et ipsi duo constituti a periculo liberati sunt a numero sexcentorum millium peditum, inducere illos in hæreditatem, in terram quæ manat lac et mel.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et dedit Dominus ipsi Caleb fortitudinem, et usque in senectutem permansit illi virtus, ut ascenderet in excelsum terræ locum, et semen ipsius obtinuit hæreditatem,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ut viderent omnes filii Israël quia bonum est obsequi sancto Deo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et judices singuli suo nomine, quorum non est corruptum cor, qui non aversi sunt a Domino,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ut sit memoria illorum in benedictione, et ossa eorum pullulent de loco suo :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et nomen eorum permaneat in æternum, permanens ad filios illorum, sanctorum virorum gloria.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dilectus a Domino Deo suo Samuel, propheta Domini, renovavit imperium, et unxit principes in gente sua.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In lege Domini congregationem judicavit, et vidit Deus Jacob : et in fide sua probatus est propheta,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et cognitus est in verbis suis fidelis, quia vidit Deum lucis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et invocavit Dominum omnipotentem, in oppugnando hostes circumstantes undique, in oblatione agni inviolati.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et intonuit de cælo Dominus, et in sonitu magno auditam fecit vocem suam :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et contrivit principes Tyriorum, et omnes duces Philisthiim :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et ante tempus finis vitæ suæ et sæculi, testimonium præbuit in conspectu Domini et christi : pecunias et usque ad calceamenta ab omni carne non accepit, et non accusavit illum homo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et post hoc dormivit : et notum fecit regi, et ostendit illi finem vitæ suæ : et exaltavit vocem suam de terra in prophetia, delere impietatem gentis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/45/"><svg viewBox="0 0 :[{\"verse\":1,\"text\":\"Valiant in war was Jesus the son of Nave, who was successor of Moses among the prophets, who was great according to his name,\"},{\"verse\":2,\"text\":\"Very great for the saving the elect of God, to overthrow the enemies that rose up against them, that he might get the inheritance for Israel.\"},{\"verse\":3,\"text\":\"How great glory did he gain when he lifted up his hands, and stretched out swords against the cities?\"},{\"verse\":4,\"text\":\"Who before him hath so resisted? for the Lord himself brought the enemies.\"},{\"verse\":5,\"text\":\"Was not the sun stopped in his anger, and one day made as two?\"},{\"verse\":6,\"text\":\"He called upon the most high Sovereign when the enemies assaulted him on every side, and the great and holy God heard him by hailstones of exceeding great force.\"},{\"verse\":7,\"text\":\"He made a violent assault against the nation of his enemies, and in the descent he destroyed the adversaries.\"},{\"verse\":8,\"text\":\"That the nations might know his power, that it is not easy to fight against God. And he followed the mighty one:\"},{\"verse\":9,\"text\":\"And in the days of Moses he did a work of mercy, he and Caleb the son of Jephone, in standing against the enemy, and withholding the people from sins, and appeasing the wicked murmuring.\"},{\"verse\":10,\"text\":\"And they two being appointed, were delivered out of the danger from among the number of six hundred thousand men on foot, to bring them into their inheritance, into the land that floweth with milk and honey.\"},{\"verse\":11,\"text\":\"And the Lord gave strength also to Caleb, and his strength continued even to his old age, so that he went up to the high places of the land, and his seed obtained it for an inheritance:\"},{\"verse\":12,\"text\":\"That all the children of Israel might see, that it is good to obey the holy God.\"},{\"verse\":13,\"text\":\"Then all the judges, every one by name, whose heart was not corrupted: who turned not away from the Lord,\"},{\"verse\":14,\"text\":\"That their memory might be blessed, and their bones spring up out of their place,\"},{\"verse\":15,\"text\":\"And their name continue for ever, the glory of the holy men remaining unto their children.\"},{\"verse\":16,\"text\":\"Samuel the prophet of the Lord, the beloved of the Lord his God, established a new government, and anointed princes over his people.\"},{\"verse\":17,\"text\":\"By the law of the Lord he judged the congregation, and the God of Jacob beheld, and by his fidelity he was proved a prophet.\"},{\"verse\":18,\"text\":\"And he was known to be faithful in his words, because he saw the God of light:\"},{\"verse\":19,\"text\":\"And called upon the name of the Lord Almighty, in fighting against the enemies who beset him on every side, when he offered a lamb without blemish.\"},{\"verse\":20,\"text\":\"And the Lord thundered from heaven, and with a great noise made his voice to be heard.\"},{\"verse\":21,\"text\":\"And he crushed the princes of the Tyrians, and all the lords of the Philistines:\"},{\"verse\":22,\"text\":\"And before the time of the end of his life in the world, he protested before the Lord, and his anointed: money, or any thing else, even to a shoe, he had not taken of any man, and no man did accuse him.\"},{\"verse\":23,\"text\":\"And after this he slept, and he made known to the king, and shewed him the end of his life, and he lifted up his voice from the earth in prophecy to blot out the wickedness of the nation.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fortis in bello Jesus Nave, successor Moysi in prophetis, qui fuit magnus secundum nomen suum,\"},{\"verse\":2,\"text\":\"maximus in salutem electorum Dei, expugnare insurgentes hostes, ut consequeretur hæreditatem Israël.\"},{\"verse\":3,\"text\":\"Quam gloriam adeptus est in tollendo manus suas, et jactando contra civitates rhomphæas !\"},{\"verse\":4,\"text\":\"Quis ante illum sic restitit ? nam hostes ipse Dominus perduxit.\"},{\"verse\":5,\"text\":\"An non in iracundia ejus impeditus est sol, et una dies facta est quasi duo ?\"},{\"verse\":6,\"text\":\"Invocavit Altissimum potentem, in oppugnando inimicos undique : et audivit illum magnus et sanctus Deus, in saxis grandinis virtutis valde fortis.\"},{\"verse\":7,\"text\":\"Impetum fecit contra gentem hostilem, et in descensu perdidit contrarios :\"},{\"verse\":8,\"text\":\"ut cognoscant gentes potentiam ejus, quia contra Deum pugnare non est facile. Et secutus est a tergo potentis :\"},{\"verse\":9,\"text\":\"et in diebus Moysi misericordiam fecit, ipse, et Caleb filius Jephone, stare contra hostem, et prohibere gentem a peccatis, et perfringere murmur malitiæ.\"},{\"verse\":10,\"text\":\"Et ipsi duo constituti a periculo liberati sunt a numero sexcentorum millium peditum, inducere illos in hæreditatem, in terram quæ manat lac et mel.\"},{\"verse\":11,\"text\":\"Et dedit Dominus ipsi Caleb fortitudinem, et usque in senectutem permansit illi virtus, ut ascenderet in excelsum terræ locum, et semen ipsius obtinuit hæreditatem,\"},{\"verse\":12,\"text\":\"ut viderent omnes filii Israël quia bonum est obsequi sancto Deo.\"},{\"verse\":13,\"text\":\"Et judices singuli suo nomine, quorum non est corruptum cor, qui non aversi sunt a Domino,\"},{\"verse\":14,\"text\":\"ut sit memoria illorum in benedictione, et ossa eorum pullulent de loco suo :\"},{\"verse\":15,\"text\":\"et nomen eorum permaneat in æternum, permanens ad filios illorum, sanctorum virorum gloria.\"},{\"verse\":16,\"text\":\"Dilectus a Domino Deo suo Samuel, propheta Domini, renovavit imperium, et unxit principes in gente sua.\"},{\"verse\":17,\"text\":\"In lege Domini congregationem judicavit, et vidit Deus Jacob : et in fide sua probatus est propheta,\"},{\"verse\":18,\"text\":\"et cognitus est in verbis suis fidelis, quia vidit Deum lucis.\"},{\"verse\":19,\"text\":\"Et invocavit Dominum omnipotentem, in oppugnando hostes circumstantes undique, in oblatione agni inviolati.\"},{\"verse\":20,\"text\":\"Et intonuit de cælo Dominus, et in sonitu magno auditam fecit vocem suam :\"},{\"verse\":21,\"text\":\"et contrivit principes Tyriorum, et omnes duces Philisthiim :\"},{\"verse\":22,\"text\":\"et ante tempus finis vitæ suæ et sæculi, testimonium præbuit in conspectu Domini et christi : pecunias et usque ad calceamenta ab omni carne non accepit, et non accusavit illum homo.\"},{\"verse\":23,\"text\":\"Et post hoc dormivit : et notum fecit regi, et ostendit illi finem vitæ suæ : et exaltavit vocem suam de terra in prophetia, delere impietatem gentis.\"}],\"summary\":\"The praise of Josue, of Caleb, and of Samuel.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":45,\"label\":\"Sirach 45\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":47,\"label\":\"Sirach 47\"}}]]\n"])</script></body></html>
