0 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ecclesiasticus</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Lessons concerning the honour of parents, and humility, and avoiding curiosity.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The sons of wisdom are the church of the just: and their generation, obedience and love.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Children, hear the judgment of your father, and so do that you may be saved.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For God hath made the father honourable to the children: and seeking the judgment of the mothers, hath confirmed it upon the children.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He that loveth God, shall obtain pardon for his sins by prayer, and shall refrain himself from them, and shall be heard in the prayer of days.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he that honoureth his mother is as one that layeth up a treasure.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He that honoureth his father shall have joy in his own children, and in the day of his prayer he shall be heard.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that honoureth his father shall enjoy a long life: and he that obeyeth the father, shall be a comfort to his mother.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that feareth the Lord, honoureth his parents, and will serve them as his masters that brought him into the world.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Honour thy father, in work and word, and all patience,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>That a blessing may come upon thee from him, and his blessing may remain in the latter end.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The father’s blessing establisheth the houses of the children: but the mother’s curse rooteth up the foundation.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Glory not in the dishonour of thy father: for his shame is no glory to thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the glory of a man is from the honour of his father, and a father without honour is the disgrace of the son.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Son, support the old age of thy father, and grieve him not in his life;</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And if his understanding fail, have patience with him, and despise him not when thou art in thy strength: for the relieving of the father shall not be forgotten.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For good shall be repaid to thee for the sin of thy mother.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And in justice thou shalt be built up, and in the day of affliction thou shalt be remembered: and thy sins shall melt away as the ice in the fair warm weather.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Of what an evil fame is he that forsaketh his father: and he is cursed of God that angereth his mother.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>My son, do thy works in meekness, and thou shalt be beloved above the glory of men.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The greater thou art, the more humble thyself in all things, and thou shalt find grace before God:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For great is the power of God alone, and he is honoured by the humble.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Seek not the things that are too high for thee, and search not into things above thy ability: but the things that God hath commanded thee, think on them always, and in many of his works be not curious.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For it is not necessary for thee to see with thy eyes those things that are hid.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In unnecessary matters be not over curious, and in many of his works thou shalt not be inquisitive.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For many things are shewn to thee above the understanding of men.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the suspicion of them hath deceived many, and hath detained their minds in vanity.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>A hard heart shall fear evil at the last: and he that loveth danger shall perish in it.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>A heart that goeth two ways shall not have success, and the perverse of heart shall be scandalized therein.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>A wicked heart shall be laden with sorrows, and the sinner will add sin to sin.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The congregation of the proud shall not be healed: for the plant of wickedness shall take root in them, and it shall not be perceived.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The heart of the wise is understood in wisdom, and a good ear will hear wisdom with all desire.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>A wise heart, and which hath understanding, will abstain from sins, and in the works of justice shall have success.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Water quencheth a flaming fire, and alms resisteth sins:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And God provideth for him that sheweth favour: he remembereth him afterwards, and in the time of his fall he shall find a sure stay.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Filii sapientiæ ecclesia justorum, et natio illorum obedientia et dilectio.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Judicium patris audite, filii, et sic facite, ut salvi sitis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deus enim honoravit patrem in filiis : et judicium matris exquirens, firmavit in filios.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui diligit Deum exorabit pro peccatis, et continebit se ab illis, et in oratione dierum exaudietur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et sicut qui thesaurizat, ita et qui honorificat matrem suam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui honorat patrem suum jucundabitur in filiis, et in die orationis suæ exaudietur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui honorat patrem suum vita vivet longiore, et qui obedit patri refrigerabit matrem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui timet Dominum honorat parentes, et quasi dominis serviet his qui se genuerunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In opere, et sermone, et omni patientia, honora patrem tuum,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ut superveniat tibi benedictio ab eo, et benedictio illius in novissimo maneat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Benedictio patris firmat domos filiorum : maledictio autem matris eradicat fundamenta.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ne glorieris in contumelia patris tui : non enim est tibi gloria ejus confusio.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Gloria enim hominis ex honore patris sui, et dedecus filii pater sine honore.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fili, suscipe senectam patris tui, et non contristes eum in vita illius :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et si defecerit sensu, veniam da, et ne spernas eum in virtute tua : eleemosyna enim patris non erit in oblivione.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nam pro peccato matris restituetur tibi bonum :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et in justitia ædificabitur tibi, et in die tribulationis commemorabitur tui, et sicut in sereno glacies, solventur peccata tua.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quam malæ famæ est qui derelinquit patrem, et est maledictus a Deo qui exasperat matrem !</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fili, in mansuetudine opera tua perfice, et super hominum gloriam diligeris.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quanto magnus es, humilia te in omnibus, et coram Deo invenies gratiam :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quoniam magna potentia Dei solius, et ab humilibus honoratur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Altiora te ne quæsieris, et fortiora te ne scrutatus fueris : sed quæ præcepit tibi Deus, illa cogita semper, et in pluribus operibus ejus ne fueris curiosus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Non est enim tibi necessarium ea, quæ abscondita sunt, videre oculis tuis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In supervacuis rebus noli scrutari multipliciter, et in pluribus operibus ejus non eris curiosus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Plurima enim super sensum hominum ostensa sunt tibi :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>multos quoque supplantavit suspicio illorum, et in vanitate detinuit sensus illorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Cor durum habebit male in novissimo, et qui amat periculum in illo peribit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Cor ingrediens duas vias non habebit successus, et pravus corde in illis scandalizabitur.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Cor nequam gravabitur in doloribus, et peccator adjiciet ad peccandum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Synagogæ superborum non erit sanitas, frutex enim peccati radicabitur in illis, et non intelligetur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cor sapientis intelligitur in sapientia, et auris bona audiet cum omni concupiscentia sapientiam.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sapiens cor et intelligibile abstinebit se a peccatis, et in operibus justitiæ successus habebit.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Ignem ardentem exstinguit aqua, et eleemosyna resistit peccatis :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et Deus prospector est ejus qui reddit gratiam : meminit ejus in posterum, et in tempore casus sui inveniet firmamentum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></ ng establisheth the houses of the children: but the mother’s curse rooteth up the foundation.\"},{\"verse\":12,\"text\":\"Glory not in the dishonour of thy father: for his shame is no glory to thee.\"},{\"verse\":13,\"text\":\"For the glory of a man is from the honour of his father, and a father without honour is the disgrace of the son.\"},{\"verse\":14,\"text\":\"Son, support the old age of thy father, and grieve him not in his life;\"},{\"verse\":15,\"text\":\"And if his understanding fail, have patience with him, and despise him not when thou art in thy strength: for the relieving of the father shall not be forgotten.\"},{\"verse\":16,\"text\":\"For good shall be repaid to thee for the sin of thy mother.\"},{\"verse\":17,\"text\":\"And in justice thou shalt be built up, and in the day of affliction thou shalt be remembered: and thy sins shall melt away as the ice in the fair warm weather.\"},{\"verse\":18,\"text\":\"Of what an evil fame is he that forsaketh his father: and he is cursed of God that angereth his mother.\"},{\"verse\":19,\"text\":\"My son, do thy works in meekness, and thou shalt be beloved above the glory of men.\"},{\"verse\":20,\"text\":\"The greater thou art, the more humble thyself in all things, and thou shalt find grace before God:\"},{\"verse\":21,\"text\":\"For great is the power of God alone, and he is honoured by the humble.\"},{\"verse\":22,\"text\":\"Seek not the things that are too high for thee, and search not into things above thy ability: but the things that God hath commanded thee, think on them always, and in many of his works be not curious.\"},{\"verse\":23,\"text\":\"For it is not necessary for thee to see with thy eyes those things that are hid.\"},{\"verse\":24,\"text\":\"In unnecessary matters be not over curious, and in many of his works thou shalt not be inquisitive.\"},{\"verse\":25,\"text\":\"For many things are shewn to thee above the understanding of men.\"},{\"verse\":26,\"text\":\"And the suspicion of them hath deceived many, and hath detained their minds in vanity.\"},{\"verse\":27,\"text\":\"A hard heart shall fear evil at the last: and he that loveth danger shall perish in it.\"},{\"verse\":28,\"text\":\"A heart that goeth two ways shall not have success, and the perverse of heart shall be scandalized therein.\"},{\"verse\":29,\"text\":\"A wicked heart shall be laden with sorrows, and the sinner will add sin to sin.\"},{\"verse\":30,\"text\":\"The congregation of the proud shall not be healed: for the plant of wickedness shall take root in them, and it shall not be perceived.\"},{\"verse\":31,\"text\":\"The heart of the wise is understood in wisdom, and a good ear will hear wisdom with all desire.\"},{\"verse\":32,\"text\":\"A wise heart, and which hath understanding, will abstain from sins, and in the works of justice shall have success.\"},{\"verse\":33,\"text\":\"Water quencheth a flaming fire, and alms resisteth sins:\"},{\"verse\":34,\"text\":\"And God provideth for him that sheweth favour: he remembereth him afterwards, and in the time of his fall he shall find a sure stay.\"}],\"vul\":[{\"verse\":1,\"text\":\"Filii sapientiæ ecclesia justorum, et natio illorum obedientia et dilectio.\"},{\"verse\":2,\"text\":\"Judicium patris audite, filii, et sic facite, ut salvi sitis.\"},{\"verse\":3,\"text\":\"Deus enim honoravit patrem in filiis : et judicium matris exquirens, firmavit in filios.\"},{\"verse\":4,\"text\":\"Qui diligit Deum exorabit pro peccatis, et continebit se ab illis, et in oratione dierum exaudietur.\"},{\"verse\":5,\"text\":\"Et sicut qui thesaurizat, ita et qui honorificat matrem suam.\"},{\"verse\":6,\"text\":\"Qui honorat patrem suum jucundabitur in filiis, et in die orationis suæ exaudietur.\"},{\"verse\":7,\"text\":\"Qui honorat patrem suum vita vivet longiore, et qui obedit patri refrigerabit matrem.\"},{\"verse\":8,\"text\":\"Qui timet Dominum honorat parentes, et quasi dominis serviet his qui se genuerunt.\"},{\"verse\":9,\"text\":\"In opere, et sermone, et omni patientia, honora patrem tuum,\"},{\"verse\":10,\"text\":\"ut superveniat tibi benedictio ab eo, et benedictio illius in novissimo maneat.\"},{\"verse\":11,\"text\":\"Benedictio patris firmat domos filiorum : maledictio autem matris eradicat fundamenta.\"},{\"verse\":12,\"text\":\"Ne glorieris in contumelia patris tui : non enim est tibi gloria ejus confusio.\"},{\"verse\":13,\"text\":\"Gloria enim hominis ex honore patris sui, et dedecus filii pater sine honore.\"},{\"verse\":14,\"text\":\"Fili, suscipe senectam patris tui, et non contristes eum in vita illius :\"},{\"verse\":15,\"text\":\"et si defecerit sensu, veniam da, et ne spernas eum in virtute tua : eleemosyna enim patris non erit in oblivione.\"},{\"verse\":16,\"text\":\"Nam pro peccato matris restituetur tibi bonum :\"},{\"verse\":17,\"text\":\"et in justitia ædificabitur tibi, et in die tribulationis commemorabitur tui, et sicut in sereno glacies, solventur peccata tua.\"},{\"verse\":18,\"text\":\"Quam malæ famæ est qui derelinquit patrem, et est maledictus a Deo qui exasperat matrem !\"},{\"verse\":19,\"text\":\"Fili, in mansuetudine opera tua perfice, et super hominum gloriam diligeris.\"},{\"verse\":20,\"text\":\"Quanto magnus es, humilia te in omnibus, et coram Deo invenies gratiam :\"},{\"verse\":21,\"text\":\"quoniam magna potentia Dei solius, et ab humilibus honoratur.\"},{\"verse\":22,\"text\":\"Altiora te ne quæsieris, et fortiora te ne scrutatus fueris : sed quæ præcepit tibi Deus, illa cogita semper, et in pluribus operibus ejus ne fueris curiosus.\"},{\"verse\":23,\"text\":\"Non est enim tibi necessarium ea, quæ abscondita sunt, videre oculis tuis.\"},{\"verse\":24,\"text\":\"In supervacuis rebus noli scrutari multipliciter, et in pluribus operibus ejus non eris curiosus.\"},{\"verse\":25,\"text\":\"Plurima enim super sensum hominum ostensa sunt tibi :\"},{\"verse\":26,\"text\":\"multos quoque supplantavit suspicio illorum, et in vanitate detinuit sensus illorum.\"},{\"verse\":27,\"text\":\"Cor durum habebit male in novissimo, et qui amat periculum in illo peribit.\"},{\"verse\":28,\"text\":\"Cor ingrediens duas vias non habebit successus, et pravus corde in illis scandalizabitur.\"},{\"verse\":29,\"text\":\"Cor nequam gravabitur in doloribus, et peccator adjiciet ad peccandum.\"},{\"verse\":30,\"text\":\"Synagogæ superborum non erit sanitas, frutex enim peccati radicabitur in illis, et non intelligetur.\"},{\"verse\":31,\"text\":\"Cor sapientis intelligitur in sapientia, et auris bona audiet cum omni concupiscentia sapientiam.\"},{\"verse\":32,\"text\":\"Sapiens cor et intelligibile abstinebit se a peccatis, et in operibus justitiæ successus habebit.\"},{\"verse\":33,\"text\":\"Ignem ardentem exstinguit aqua, et eleemosyna resistit peccatis :\"},{\"verse\":34,\"text\":\"et Deus prospector est ejus qui reddit gratiam : meminit ejus in posterum, et in tempore casus sui inveniet firmamentum.\"}],\"summary\":\"Lessons concerning the honour of parents, and humility, and avoiding curiosity.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":2,\"label\":\"Sirach 2\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":4,\"label\":\"Sirach 4\"}}]]\n"])</script></body></html>
