-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that feareth God, will do good: and he that possesseth justice, shall lay hold on her,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And she will meet him as an honourable mother, and will receive him as a wife married of a virgin.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink: and she shall be made strong in him, and he shall not be moved.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And she shall hold him fast, and he shall not be confounded: and she shall exalt him among his neighbours.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And in the midst of the church she shall open his mouth, and shall fill him with the spirit of wisdom and understanding, and shall clothe him with a robe of glory.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>She shall heap upon him a treasure of joy and gladness, and shall cause him to inherit an everlasting name.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But foolish men shall not obtain her, and wise men shall meet her, foolish men shall not see her: for she is far from pride and deceit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Lying men shall be mindful of her: but men that speak truth shall be found with her, and shall advance, even till they come to the sight of God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Praise is not seemly in the mouth of a sinner:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For wisdom came forth from God: for praise shall be with the wisdom of God, and shall abound in a faithful mouth, and the sovereign Lord will give praise unto it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Say not: It is through God, that she is not with me: for do not thou the things that he hateth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Say not: He hath caused me to err: for he hath no need of wicked men.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The Lord hateth all abomination of error, and they that fear him shall not love it.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>God made man from the beginning, and left him in the hand of his own counsel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He added his commandments and precepts.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If thou wilt keep the commandments and perform acceptable fidelity for ever, they shall preserve thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He hath set water and fire before thee: stretch forth thy hand to which thou wilt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Before man is life and death, good and evil, that which he shall choose shall be given him:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For the wisdom of God is great, and he is strong in power, seeing all men without ceasing.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The eyes of the Lord are towards them that fear him, and he knoweth al the work of man.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He hath commanded no man to do wickedly, and he hath given no man license to sin;</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For he desireth not a multitude of faithless and unprofitable children.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui timet Deum faciet bona, et qui continens est justitiæ apprehendet illam :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et obviabit illi quasi mater honorificata, et quasi mulier a virginitate suscipiet illum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cibabit illum pane vitæ et intellectus, et aqua sapientiæ salutaris potabit illum : et firmabitur in illo, et non flectetur :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et continebit illum, et non confundetur : et exaltabit illum apud proximos suos,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et in medio ecclesiæ aperiet os ejus, et adimplebit illum spiritu sapientiæ et intellectus, et stola gloriæ vestiet illum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Jucunditatem et exsultationem thesaurizabit super illum, et nomine æterno hæreditabit illum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Homines stulti non apprehendent illam, et homines sensati obviabunt illi. Homines stulti non videbunt eam : longe enim abest a superbia et dolo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Viri mendaces non erunt illius memores : et viri veraces invenientur in illa, et successum habebunt usque ad inspectionem Dei.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non est speciosa laus in ore peccatoris,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>quoniam a Deo profecta est sapientia. Sapientiæ enim Dei astabit laus, et in ore fideli abundabit, et Dominator dabit eam illi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non dixeris : Per Deum abest : quæ enim odit ne feceris.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non dicas : Ille me implanavit : non enim necessarii sunt ei homines impii.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Omne execramentum erroris odit Dominus, et non erit amabile timentibus eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Deus ab initio constituit hominem, et reliquit illum in manu consilii sui :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>adjecit mandata et præcepta sua.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si volueris mandata servare, conservabunt te, et in perpetuum fidem placitam facere.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Apposuit tibi aquam et ignem, ad quod volueris porrige manum tuam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ante hominem vita et mors, bonum et malum : quod placuerit ei dabitur illi :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>quoniam multa sapientia Dei, et fortis in potentia, videns omnes sine intermissione.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Oculi Domini ad timentes eum, et ipse agnoscit omnem operam hominis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nemini mandavit impie agere, et nemini dedit spatium peccandi :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>non enim concupiscit multitudinem filiorum infidelium et inutilium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/16/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 16</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->15<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 14" class \"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.15\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":15,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"He that feareth God, will do good: and he that possesseth justice, shall lay hold on her,\"},{\"verse\":2,\"text\":\"And she will meet him as an honourable mother, and will receive him as a wife married of a virgin.\"},{\"verse\":3,\"text\":\"With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink: and she shall be made strong in him, and he shall not be moved.\"},{\"verse\":4,\"text\":\"And she shall hold him fast, and he shall not be confounded: and she shall exalt him among his neighbours.\"},{\"verse\":5,\"text\":\"And in the midst of the church she shall open his mouth, and shall fill him with the spirit of wisdom and understanding, and shall clothe him with a robe of glory.\"},{\"verse\":6,\"text\":\"She shall heap upon him a treasure of joy and gladness, and shall cause him to inherit an everlasting name.\"},{\"verse\":7,\"text\":\"But foolish men shall not obtain her, and wise men shall meet her, foolish men shall not see her: for she is far from pride and deceit.\"},{\"verse\":8,\"text\":\"Lying men shall be mindful of her: but men that speak truth shall be found with her, and shall advance, even till they come to the sight of God.\"},{\"verse\":9,\"text\":\"Praise is not seemly in the mouth of a sinner:\"},{\"verse\":10,\"text\":\"For wisdom came forth from God: for praise shall be with the wisdom of God, and shall abound in a faithful mouth, and the sovereign Lord will give praise unto it.\"},{\"verse\":11,\"text\":\"Say not: It is through God, that she is not with me: for do not thou the things that he hateth.\"},{\"verse\":12,\"text\":\"Say not: He hath caused me to err: for he hath no need of wicked men.\"},{\"verse\":13,\"text\":\"The Lord hateth all abomination of error, and they that fear him shall not love it.\"},{\"verse\":14,\"text\":\"God made man from the beginning, and left him in the hand of his own counsel.\"},{\"verse\":15,\"text\":\"He added his commandments and precepts.\"},{\"verse\":16,\"text\":\"If thou wilt keep the commandments and perform acceptable fidelity for ever, they shall preserve thee.\"},{\"verse\":17,\"text\":\"He hath set water and fire before thee: stretch forth thy hand to which thou wilt.\"},{\"verse\":18,\"text\":\"Before man is life and death, good and evil, that which he shall choose shall be given him:\"},{\"verse\":19,\"text\":\"For the wisdom of God is great, and he is strong in power, seeing all men without ceasing.\"},{\"verse\":20,\"text\":\"The eyes of the Lord are towards them that fear him, and he knoweth al the work of man.\"},{\"verse\":21,\"text\":\"He hath commanded no man to do wickedly, and he hath given no man license to sin;\"},{\"verse\":22,\"text\":\"For he desireth not a multitude of faithless and unprofitable children.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui timet Deum faciet bona, et qui continens est justitiæ apprehendet illam :\"},{\"verse\":2,\"text\":\"et obviabit illi quasi mater honorificata, et quasi mulier a virginitate suscipiet illum.\"},{\"verse\":3,\"text\":\"Cibabit illum pane vitæ et intellectus, et aqua sapientiæ salutaris potabit illum : et firmabitur in illo, et non flectetur :\"},{\"verse\":4,\"text\":\"et continebit illum, et non confundetur : et exaltabit illum apud proximos suos,\"},{\"verse\":5,\"text\":\"et in medio ecclesiæ aperiet os ejus, et adimplebit illum spiritu sapientiæ et intellectus, et stola gloriæ vestiet illum.\"},{\"verse\":6,\"text\":\"Jucunditatem et exsultationem thesaurizabit super illum, et nomine æterno hæreditabit illum.\"},{\"verse\":7,\"text\":\"Homines stulti non apprehendent illam, et homines sensati obviabunt illi. Homines stulti non videbunt eam : longe enim abest a superbia et dolo.\"},{\"verse\":8,\"text\":\"Viri mendaces non erunt illius memores : et viri veraces invenientur in illa, et successum habebunt usque ad inspectionem Dei.\"},{\"verse\":9,\"text\":\"Non est speciosa laus in ore peccatoris,\"},{\"verse\":10,\"text\":\"quoniam a Deo profecta est sapientia. Sapientiæ enim Dei astabit laus, et in ore fideli abundabit, et Dominator dabit eam illi.\"},{\"verse\":11,\"text\":\"Non dixeris : Per Deum abest : quæ enim odit ne feceris.\"},{\"verse\":12,\"text\":\"Non dicas : Ille me implanavit : non enim necessarii sunt ei homines impii.\"},{\"verse\":13,\"text\":\"Omne execramentum erroris odit Dominus, et non erit amabile timentibus eum.\"},{\"verse\":14,\"text\":\"Deus ab initio constituit hominem, et reliquit illum in manu consilii sui :\"},{\"verse\":15,\"text\":\"adjecit mandata et præcepta sua.\"},{\"verse\":16,\"text\":\"Si volueris mandata servare, conservabunt te, et in perpetuum fidem placitam facere.\"},{\"verse\":17,\"text\":\"Apposuit tibi aquam et ignem, ad quod volueris porrige manum tuam.\"},{\"verse\":18,\"text\":\"Ante hominem vita et mors, bonum et malum : quod placuerit ei dabitur illi :\"},{\"verse\":19,\"text\":\"quoniam multa sapientia Dei, et fortis in potentia, videns omnes sine intermissione.\"},{\"verse\":20,\"text\":\"Oculi Domini ad timentes eum, et ipse agnoscit omnem operam hominis.\"},{\"verse\":21,\"text\":\"Nemini mandavit impie agere, et nemini dedit spatium peccandi :\"},{\"verse\":22,\"text\":\"non enim concupiscit multitudinem filiorum infidelium et inutilium.\"}],\"summary\":\"Wisdom embraceth them that fear God. God is not the author of sin.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":14,\"label\":\"Sirach 14\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":16,\"label\":\"Sirach 16\"}}]]\n"])</script></body></html>
