erif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A workman that is a drunkard shall not be rich: and he that contemneth small things, shall fall by little and little.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Wine and women make wise men fall off, and shall rebuke the prudent:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he that joineth himself to harlots, will be wicked. Rottenness and worms shall inherit him, and he shall be lifted up for a greater example, and his soul shall be taken away out of the number.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He that is hasty to give credit, is light of heart, and shall be lessened: and he that sinneth against his own soul, shall be despised.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He that rejoiceth in iniquity, shall be censured, and he that hateth chastisement, shall have less life: and he that hateth babbling, extinguisheth evil.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He that sinneth against his own soul, shall repent: and he that is delighted with wickedness, shall be condemned.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Rehearse not again a wicked and harsh word, and thou shalt not fare the worse.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tell not thy mind to friend or foe: and if there be a sin with thee, disclose it not.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For he will hearken to thee, and will watch thee, and as it were defending thy sin he will hate thee, and so will he be with thee always.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hast thou heard a word against thy neighbour? let it die within thee, trusting that it will not burst thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>At the hearing of a word the fool is in travail, as a woman groaning in the bringing forth a child.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>As an arrow that sticketh in a man’s thigh: so is a word in the heart of a fool.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Reprove a friend, lest he may not have understood, and say: I did it not: or if he did it, that he may do it no more.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Reprove thy neighbour, for it may be he hath not said it: and if he hath said it, that he may not say it again.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Admonish thy friend: for there is often a fault committed.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And believe not every word. There is one, that slippeth with the tongue, but not from his heart.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For who is there that hath not offended with his tongue? Admonish thy neighbour before thou threaten him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And give place to the fear of the most High: for the fear of God is all wisdom, and therein is to fear God, and the disposition of the law is in all wisdom.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But the learning of wickedness is not wisdom: and the device of sinners is not prudence.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>There is a subtle wickedness, and the same is detestable: and there is a man that is foolish, wanting in wisdom.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Better is a man that hath less wisdom, and wanteth understanding, with the fear of God, than he that aboundeth in understanding, and transgresseth the law of the most High.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>There is an exquisite subtilty, and the same is unjust.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And there is one that uttereth an exact word telling the truth. There is one that humbleth himself wickedly, and his interior is full of deceit:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And there is one that submitteth himself exceedingly with a great lowliness: and there is one that casteth down his countenance, and maketh as if he did not see that which is unknown:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And if he be hindered from sinning for want of power, if he shall find opportunity to do evil, he will do it.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A man is known by his look, and a wise man, when thou meetest him, is known by his countenance.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The attire of the body, and the laughter of the teeth, and the gait of the man, shew what he is.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>There is a lying rebuke in the anger of an injurious man: and there is a judgment that is not allowed to be good: and there is one that holdeth his peace, he is wise.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Operarius ebriosus non locupletabitur : et qui spernit modica paulatim decidet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vinum et mulieres apostatare faciunt sapientes, et arguent sensatos.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et qui se jungit fornicariis erit nequam : putredo et vermes hæreditabunt illum : et extolletur in exemplum majus, et tolletur de numero anima ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui credit cito levis corde est, et minorabitur : et qui delinquit in animam suam, insuper habebitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui gaudet iniquitate, denotabitur : et qui odit correptionem, minuetur vita : et qui odit loquacitatem, extinguit malitiam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui peccat in animam suam, pœnitebit : et qui jucundatur in malitia, denotabitur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ne iteres verbum nequam et durum, et non minoraberis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Amico et inimico noli narrare sensum tuum : et si est tibi delictum, noli denudare :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>audiet enim te, et custodiet te, et quasi defendens peccatum, odiet te, et sic aderit tibi semper.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Audisti verbum adversus proximum tuum ? commoriatur in te, fidens quoniam non te dirumpet.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>A facie verbi parturit fatuus, tamquam gemitus partus infantis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sagitta infixa femori carnis, sic verbum in corde stulti.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Corripe amicum, ne forte non intellexerit, et dicat : Non feci : aut, si fecerit, ne iterum addat facere.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Corripe proximum, ne forte non dixerit : et si dixerit, ne forte iteret.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Corripe amicum, sæpe enim fit commissio :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et non omni verbo credas. Est qui labitur lingua, sed non ex animo :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>quis est enim qui non deliquerit in lingua sua ? Corripe proximum antequam commineris,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et da locum timori Altissimi : quia omnis sapientia timor Dei, et in illa timere Deum, et in omni sapientia dispositio legis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et non est sapientia nequitiæ disciplina, et non est cogitatus peccatorum prudentia.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Est nequitia, et in ipsa execratio, et est insipiens qui minuitur sapientia.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Melior est homo qui minuitur sapientia, et deficiens sensu, in timore, quam qui abundat sensu, et transgreditur legem Altissimi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Est solertia certa, et ipsa iniqua :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et est qui emittit verbum certum enarrans veritatem. Est qui nequiter humiliat se, et interiora ejus plena sunt dolo :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et est qui se nimium submittit a multa humilitate : et est qui inclinat faciem suam, et fingit se non videre quod ignoratum est :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et si ab imbecillitate virium vetetur peccare, si invenerit tempus malefaciendi, malefaciet.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ex visu cognoscitur vir, et ab occursu faciei cognoscitur sensatus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Amictus corporis, et risus dentium, et ingressus hominis, enuntiant de illo.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Est correptio mendax in ira contumeliosi, et est judicium quod non probatur esse bonum : et est tacens, et ipse est prudens.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/20/"><span class="min-w-0"><span cl c Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.19\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":19,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"A workman that is a drunkard shall not be rich: and he that contemneth small things, shall fall by little and little.\"},{\"verse\":2,\"text\":\"Wine and women make wise men fall off, and shall rebuke the prudent:\"},{\"verse\":3,\"text\":\"And he that joineth himself to harlots, will be wicked. Rottenness and worms shall inherit him, and he shall be lifted up for a greater example, and his soul shall be taken away out of the number.\"},{\"verse\":4,\"text\":\"He that is hasty to give credit, is light of heart, and shall be lessened: and he that sinneth against his own soul, shall be despised.\"},{\"verse\":5,\"text\":\"He that rejoiceth in iniquity, shall be censured, and he that hateth chastisement, shall have less life: and he that hateth babbling, extinguisheth evil.\"},{\"verse\":6,\"text\":\"He that sinneth against his own soul, shall repent: and he that is delighted with wickedness, shall be condemned.\"},{\"verse\":7,\"text\":\"Rehearse not again a wicked and harsh word, and thou shalt not fare the worse.\"},{\"verse\":8,\"text\":\"Tell not thy mind to friend or foe: and if there be a sin with thee, disclose it not.\"},{\"verse\":9,\"text\":\"For he will hearken to thee, and will watch thee, and as it were defending thy sin he will hate thee, and so will he be with thee always.\"},{\"verse\":10,\"text\":\"Hast thou heard a word against thy neighbour? let it die within thee, trusting that it will not burst thee.\"},{\"verse\":11,\"text\":\"At the hearing of a word the fool is in travail, as a woman groaning in the bringing forth a child.\"},{\"verse\":12,\"text\":\"As an arrow that sticketh in a man’s thigh: so is a word in the heart of a fool.\"},{\"verse\":13,\"text\":\"Reprove a friend, lest he may not have understood, and say: I did it not: or if he did it, that he may do it no more.\"},{\"verse\":14,\"text\":\"Reprove thy neighbour, for it may be he hath not said it: and if he hath said it, that he may not say it again.\"},{\"verse\":15,\"text\":\"Admonish thy friend: for there is often a fault committed.\"},{\"verse\":16,\"text\":\"And believe not every word. There is one, that slippeth with the tongue, but not from his heart.\"},{\"verse\":17,\"text\":\"For who is there that hath not offended with his tongue? Admonish thy neighbour before thou threaten him.\"},{\"verse\":18,\"text\":\"And give place to the fear of the most High: for the fear of God is all wisdom, and therein is to fear God, and the disposition of the law is in all wisdom.\"},{\"verse\":19,\"text\":\"But the learning of wickedness is not wisdom: and the device of sinners is not prudence.\"},{\"verse\":20,\"text\":\"There is a subtle wickedness, and the same is detestable: and there is a man that is foolish, wanting in wisdom.\"},{\"verse\":21,\"text\":\"Better is a man that hath less wisdom, and wanteth understanding, with the fear of God, than he that aboundeth in understanding, and transgresseth the law of the most High.\"},{\"verse\":22,\"text\":\"There is an exquisite subtilty, and the same is unjust.\"},{\"verse\":23,\"text\":\"And there is one that uttereth an exact word telling the truth. There is one that humbleth himself wickedly, and his interior is full of deceit:\"},{\"verse\":24,\"text\":\"And there is one that submitteth himself exceedingly with a great lowliness: and there is one that casteth down his countenance, and maketh as if he did not see that which is unknown:\"},{\"verse\":25,\"text\":\"And if he be hindered from sinning for want of power, if he shall find opportunity to do evil, he will do it.\"},{\"verse\":26,\"text\":\"A man is known by his look, and a wise man, when thou meetest him, is known by his countenance.\"},{\"verse\":27,\"text\":\"The attire of the body, and the laughter of the teeth, and the gait of the man, shew what he is.\"},{\"verse\":28,\"text\":\"There is a lying rebuke in the anger of an injurious man: and there is a judgment that is not allowed to be good: and there is one that holdeth his peace, he is wise.\"}],\"vul\":[{\"verse\":1,\"text\":\"Operarius ebriosus non locupletabitur : et qui spernit modica paulatim decidet.\"},{\"verse\":2,\"text\":\"Vinum et mulieres apostatare faciunt sapientes, et arguent sensatos.\"},{\"verse\":3,\"text\":\"Et qui se jungit fornicariis erit nequam : putredo et vermes hæreditabunt illum : et extolletur in exemplum majus, et tolletur de numero anima ejus.\"},{\"verse\":4,\"text\":\"Qui credit cito levis corde est, et minorabitur : et qui delinquit in animam suam, insuper habebitur.\"},{\"verse\":5,\"text\":\"Qui gaudet iniquitate, denotabitur : et qui odit correptionem, minuetur vita : et qui odit loquacitatem, extinguit malitiam.\"},{\"verse\":6,\"text\":\"Qui peccat in animam suam, pœnitebit : et qui jucundatur in malitia, denotabitur.\"},{\"verse\":7,\"text\":\"Ne iteres verbum nequam et durum, et non minoraberis.\"},{\"verse\":8,\"text\":\"Amico et inimico noli narrare sensum tuum : et si est tibi delictum, noli denudare :\"},{\"verse\":9,\"text\":\"audiet enim te, et custodiet te, et quasi defendens peccatum, odiet te, et sic aderit tibi semper.\"},{\"verse\":10,\"text\":\"Audisti verbum adversus proximum tuum ? commoriatur in te, fidens quoniam non te dirumpet.\"},{\"verse\":11,\"text\":\"A facie verbi parturit fatuus, tamquam gemitus partus infantis.\"},{\"verse\":12,\"text\":\"Sagitta infixa femori carnis, sic verbum in corde stulti.\"},{\"verse\":13,\"text\":\"Corripe amicum, ne forte non intellexerit, et dicat : Non feci : aut, si fecerit, ne iterum addat facere.\"},{\"verse\":14,\"text\":\"Corripe proximum, ne forte non dixerit : et si dixerit, ne forte iteret.\"},{\"verse\":15,\"text\":\"Corripe amicum, sæpe enim fit commissio :\"},{\"verse\":16,\"text\":\"et non omni verbo credas. Est qui labitur lingua, sed non ex animo :\"},{\"verse\":17,\"text\":\"quis est enim qui non deliquerit in lingua sua ? Corripe proximum antequam commineris,\"},{\"verse\":18,\"text\":\"et da locum timori Altissimi : quia omnis sapientia timor Dei, et in illa timere Deum, et in omni sapientia dispositio legis.\"},{\"verse\":19,\"text\":\"Et non est sapientia nequitiæ disciplina, et non est cogitatus peccatorum prudentia.\"},{\"verse\":20,\"text\":\"Est nequitia, et in ipsa execratio, et est insipiens qui minuitur sapientia.\"},{\"verse\":21,\"text\":\"Melior est homo qui minuitur sapientia, et deficiens sensu, in timore, quam qui abundat sensu, et transgreditur legem Altissimi.\"},{\"verse\":22,\"text\":\"Est solertia certa, et ipsa iniqua :\"},{\"verse\":23,\"text\":\"et est qui emittit verbum certum enarrans veritatem. Est qui nequiter humiliat se, et interiora ejus plena sunt dolo :\"},{\"verse\":24,\"text\":\"et est qui se nimium submittit a multa humilitate : et est qui inclinat faciem suam, et fingit se non videre quod ignoratum est :\"},{\"verse\":25,\"text\":\"et si ab imbecillitate virium vetetur peccare, si invenerit tempus malefaciendi, malefaciet.\"},{\"verse\":26,\"text\":\"Ex visu cognoscitur vir, et ab occursu faciei cognoscitur sensatus.\"},{\"verse\":27,\"text\":\"Amictus corporis, et risus dentium, et ingressus hominis, enuntiant de illo.\"},{\"verse\":28,\"text\":\"Est correptio mendax in ira contumeliosi, et est judicium quod non probatur esse bonum : et est tacens, et ipse est prudens.\"}],\"summary\":\"Admonition against sundry vices.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":18,\"label\":\"Sirach 18\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":20,\"label\":\"Sirach 20\"}}]]\n"])</script></body></html>
