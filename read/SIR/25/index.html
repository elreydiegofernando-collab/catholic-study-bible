a font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>With three things my spirit is pleased, which are approved before God and men:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The concord of brethren, and the love of neighbours, and man and wife that agree well together.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Three sorts my soul hateth, and I am greatly grieved at their life:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>A poor man that is proud: a rich man that is a liar: an old man that is a fool, and doting.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The things that thou hast not gathered in thy youth, how shalt thou find them in thy old age?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>O how comely is judgment for a grey head, and for ancients to know counsel!</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>O how comely is wisdom for the aged, and understanding and counsel to men of honour!</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Much experience is the crown of old men, and the fear of God is their glory.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nine things that are not to be imagined by the heart have I magnified, and the tenth I will utter to men with my tongue.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>A man that hath joy of his children: and he that liveth and seeth the fall of his enemies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Blessed is he that dwelleth with a wise woman, and that hath not slipped with his tongue, and that hath not served such as are unworthy of him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Blessed is he that findeth a true friend, and that declareth justice to an ear that heareth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>How great is he that findeth wisdom and knowledge! but there is none above him that feareth the Lord.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The fear of God hath set itself above all things:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Blessed is the man, to whom it is given to have the fear of God: he that holdeth it, to whom shall he be likened?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The fear of God is the beginning of his love: and the beginning of faith is to be fast joined unto it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The sadness of the heart is every plague: and the wickedness of a woman is all evil.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And a man will choose any plague, but the plague of the heart:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And any wickedness, but the wickedness of a woman:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And any affliction, but the affliction from them that hate him:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And any revenge, but the revenge of enemies.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>There is no head worse than the head of a serpent:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And there is no anger above the anger of a woman. It will be more agreeable to abide with a lion and a dragon, than to dwell with a wicked woman.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The wickedness of a woman changeth her face: and she darkeneth her countenance as a bear: and sheweth it like sackcloth. In the midst of her neighbours,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Her husband groaned, and hearing he sighed a little.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>All malice is short to the malice of a woman, let the lot of sinners fall upon her.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>As the climbing of a sandy way is to the feet of the aged, so is a wife full of tongue to a quiet man.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Look not upon a woman’s beauty, and desire not a woman for beauty.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>A woman’s anger, and impudence, and confusion is great.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>A woman, if she have superiority, is contrary to her husband.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>A wicked woman abateth the courage, and maketh a heavy countenance, and a wounded heart.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Feeble hands, and disjointed knees, a woman that doth not make her husband happy.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>From the woman came the beginning of sin, and by her we all die.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Give no issue to thy water, no, not a little: nor to a wicked woman liberty to gad abroad.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If she walk not at thy hand, she will confound thee in the sight of thy enemies.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Cut her off from thy flesh, lest she always abuse thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In tribus placitum est spiritui meo, quæ sunt probata coram Deo et hominibus :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>concordia fratrum, et amor proximorum, et vir et mulier bene sibi consentientes.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tres species odivit anima mea, et aggravor valde animæ illorum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>pauperem superbum, divitem mendacem, senem fatuum et insensatum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quæ in juventute tua non congregasti, quomodo in senectute tua invenies ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quam speciosum canitiei judicium, et presbyteris cognoscere consilium !</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quam speciosa veteranis sapientia, et gloriosus intellectus et consilium !</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Corona senum multa peritia, et gloria illorum timor Dei.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Novem insuspicabilia cordis magnificavi : et decimum dicam in lingua hominibus :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>homo qui jucundatur in filiis, vivens et videns subversionem inimicorum suorum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Beatus qui habitat cum muliere sensata, et qui lingua sua non est lapsus, et qui non servivit indignis se.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Beatus qui invenit amicum verum, et qui enarrat justitiam auri audienti.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quam magnus qui invenit sapientiam et scientiam ! sed non est super timentem Dominum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Timor Dei super omnia se superposuit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Beatus homo cui donatum est habere timorem Dei : qui tenet illum, cui assimilabitur ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Timor Dei initium dilectionis ejus : fidei autem initium agglutinandum est ei.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Omnis plaga tristitia cordis est, et omnis malitia nequitia mulieris.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et omnem plagam, et non plagam videbit cordis :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et omnem nequitiam, et non nequitiam mulieris :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et omnem obductum, et non obductum odientium :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et omnem vindictam, et non vindictam inimicorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non est caput nequius super caput colubri,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et non est ira super iram mulieris. Commorari leoni et draconi placebit, quam habitare cum muliere nequam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nequitia mulieris immutat faciem ejus : et obcæcat vultum suum tamquam ursus, et quasi saccum ostendit. In medio proximorum ejus</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ingemuit vir ejus, et audiens suspiravit modicum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Brevis omnis malitia super malitiam mulieris : sors peccatorum cadat super illam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sicut ascensus arenosus in pedibus veterani, sic mulier linguata homini quieto.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ne respicias in mulieris speciem, et non concupiscas mulierem in specie.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Mulieris ira, et irreverentia, et confusio magna.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Mulier si primatum habeat, contraria est viro suo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cor humile, et facies tristis, et plaga cordis, mulier nequam.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Manus debiles et genua dissoluta, mulier quæ non beatificat virum suum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>A muliere initium factum est peccati, et per illam omnes morimur.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Non des aquæ tuæ exitum, nec modicum : nec mulieri nequam veniam prodeundi.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Si non ambulaverit ad manum tuam, confundet te in conspectu inimicorum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>A carnibus tuis abscinde illam, ne semper te abutatur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/24/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 24</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/26/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 26</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->25<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto f  served such as are unworthy of him.\"},{\"verse\":12,\"text\":\"Blessed is he that findeth a true friend, and that declareth justice to an ear that heareth.\"},{\"verse\":13,\"text\":\"How great is he that findeth wisdom and knowledge! but there is none above him that feareth the Lord.\"},{\"verse\":14,\"text\":\"The fear of God hath set itself above all things:\"},{\"verse\":15,\"text\":\"Blessed is the man, to whom it is given to have the fear of God: he that holdeth it, to whom shall he be likened?\"},{\"verse\":16,\"text\":\"The fear of God is the beginning of his love: and the beginning of faith is to be fast joined unto it.\"},{\"verse\":17,\"text\":\"The sadness of the heart is every plague: and the wickedness of a woman is all evil.\"},{\"verse\":18,\"text\":\"And a man will choose any plague, but the plague of the heart:\"},{\"verse\":19,\"text\":\"And any wickedness, but the wickedness of a woman:\"},{\"verse\":20,\"text\":\"And any affliction, but the affliction from them that hate him:\"},{\"verse\":21,\"text\":\"And any revenge, but the revenge of enemies.\"},{\"verse\":22,\"text\":\"There is no head worse than the head of a serpent:\"},{\"verse\":23,\"text\":\"And there is no anger above the anger of a woman. It will be more agreeable to abide with a lion and a dragon, than to dwell with a wicked woman.\"},{\"verse\":24,\"text\":\"The wickedness of a woman changeth her face: and she darkeneth her countenance as a bear: and sheweth it like sackcloth. In the midst of her neighbours,\"},{\"verse\":25,\"text\":\"Her husband groaned, and hearing he sighed a little.\"},{\"verse\":26,\"text\":\"All malice is short to the malice of a woman, let the lot of sinners fall upon her.\"},{\"verse\":27,\"text\":\"As the climbing of a sandy way is to the feet of the aged, so is a wife full of tongue to a quiet man.\"},{\"verse\":28,\"text\":\"Look not upon a woman’s beauty, and desire not a woman for beauty.\"},{\"verse\":29,\"text\":\"A woman’s anger, and impudence, and confusion is great.\"},{\"verse\":30,\"text\":\"A woman, if she have superiority, is contrary to her husband.\"},{\"verse\":31,\"text\":\"A wicked woman abateth the courage, and maketh a heavy countenance, and a wounded heart.\"},{\"verse\":32,\"text\":\"Feeble hands, and disjointed knees, a woman that doth not make her husband happy.\"},{\"verse\":33,\"text\":\"From the woman came the beginning of sin, and by her we all die.\"},{\"verse\":34,\"text\":\"Give no issue to thy water, no, not a little: nor to a wicked woman liberty to gad abroad.\"},{\"verse\":35,\"text\":\"If she walk not at thy hand, she will confound thee in the sight of thy enemies.\"},{\"verse\":36,\"text\":\"Cut her off from thy flesh, lest she always abuse thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"In tribus placitum est spiritui meo, quæ sunt probata coram Deo et hominibus :\"},{\"verse\":2,\"text\":\"concordia fratrum, et amor proximorum, et vir et mulier bene sibi consentientes.\"},{\"verse\":3,\"text\":\"Tres species odivit anima mea, et aggravor valde animæ illorum :\"},{\"verse\":4,\"text\":\"pauperem superbum, divitem mendacem, senem fatuum et insensatum.\"},{\"verse\":5,\"text\":\"Quæ in juventute tua non congregasti, quomodo in senectute tua invenies ?\"},{\"verse\":6,\"text\":\"Quam speciosum canitiei judicium, et presbyteris cognoscere consilium !\"},{\"verse\":7,\"text\":\"Quam speciosa veteranis sapientia, et gloriosus intellectus et consilium !\"},{\"verse\":8,\"text\":\"Corona senum multa peritia, et gloria illorum timor Dei.\"},{\"verse\":9,\"text\":\"Novem insuspicabilia cordis magnificavi : et decimum dicam in lingua hominibus :\"},{\"verse\":10,\"text\":\"homo qui jucundatur in filiis, vivens et videns subversionem inimicorum suorum.\"},{\"verse\":11,\"text\":\"Beatus qui habitat cum muliere sensata, et qui lingua sua non est lapsus, et qui non servivit indignis se.\"},{\"verse\":12,\"text\":\"Beatus qui invenit amicum verum, et qui enarrat justitiam auri audienti.\"},{\"verse\":13,\"text\":\"Quam magnus qui invenit sapientiam et scientiam ! sed non est super timentem Dominum.\"},{\"verse\":14,\"text\":\"Timor Dei super omnia se superposuit.\"},{\"verse\":15,\"text\":\"Beatus homo cui donatum est habere timorem Dei : qui tenet illum, cui assimilabitur ?\"},{\"verse\":16,\"text\":\"Timor Dei initium dilectionis ejus : fidei autem initium agglutinandum est ei.\"},{\"verse\":17,\"text\":\"Omnis plaga tristitia cordis est, et omnis malitia nequitia mulieris.\"},{\"verse\":18,\"text\":\"Et omnem plagam, et non plagam videbit cordis :\"},{\"verse\":19,\"text\":\"et omnem nequitiam, et non nequitiam mulieris :\"},{\"verse\":20,\"text\":\"et omnem obductum, et non obductum odientium :\"},{\"verse\":21,\"text\":\"et omnem vindictam, et non vindictam inimicorum.\"},{\"verse\":22,\"text\":\"Non est caput nequius super caput colubri,\"},{\"verse\":23,\"text\":\"et non est ira super iram mulieris. Commorari leoni et draconi placebit, quam habitare cum muliere nequam.\"},{\"verse\":24,\"text\":\"Nequitia mulieris immutat faciem ejus : et obcæcat vultum suum tamquam ursus, et quasi saccum ostendit. In medio proximorum ejus\"},{\"verse\":25,\"text\":\"ingemuit vir ejus, et audiens suspiravit modicum.\"},{\"verse\":26,\"text\":\"Brevis omnis malitia super malitiam mulieris : sors peccatorum cadat super illam.\"},{\"verse\":27,\"text\":\"Sicut ascensus arenosus in pedibus veterani, sic mulier linguata homini quieto.\"},{\"verse\":28,\"text\":\"Ne respicias in mulieris speciem, et non concupiscas mulierem in specie.\"},{\"verse\":29,\"text\":\"Mulieris ira, et irreverentia, et confusio magna.\"},{\"verse\":30,\"text\":\"Mulier si primatum habeat, contraria est viro suo.\"},{\"verse\":31,\"text\":\"Cor humile, et facies tristis, et plaga cordis, mulier nequam.\"},{\"verse\":32,\"text\":\"Manus debiles et genua dissoluta, mulier quæ non beatificat virum suum.\"},{\"verse\":33,\"text\":\"A muliere initium factum est peccati, et per illam omnes morimur.\"},{\"verse\":34,\"text\":\"Non des aquæ tuæ exitum, nec modicum : nec mulieri nequam veniam prodeundi.\"},{\"verse\":35,\"text\":\"Si non ambulaverit ad manum tuam, confundet te in conspectu inimicorum.\"},{\"verse\":36,\"text\":\"A carnibus tuis abscinde illam, ne semper te abutatur.\"}],\"summary\":\"Documents of wisdom on several subjects.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":24,\"label\":\"Sirach 24\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":26,\"label\":\"Sirach 26\"}}]]\n"])</script></body></html>
