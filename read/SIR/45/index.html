20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">45</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ecclesiasticus</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The praises of Moses, of Aaron, and of Phinees.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Moses was beloved of God, and men: whose memory is in benediction.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He made him like the saints in glory, and magnified him in the fear of his enemies, and with his words he made prodigies to cease.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He glorified him in the sight of kings, and gave him commandments in the sight of his people, and shewed him his glory.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He sanctified him in his faith, and meekness, and chose him out of all flesh.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For he heard him, and his voice, and brought him into a cloud.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he gave him commandments before his face, and a law of life and instruction, that he might teach Jacob his covenant, and Israel his judgments.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He exalted Aaron his brother, and like to himself of the tribe of Levi:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He made an everlasting covenant with him, and gave him the priesthood of the nation, and made him blessed in glory,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he girded him about with a glorious girdle, and clothed him with a robe of glory, and crowned him with majestic attire.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He put upon him a garment to the feet, and breeches, and an ephod, and he compassed him with many little bells of gold all round about,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That as he went there might be a sound, and a noise made that might be heard in the temple, for a memorial to the children of his people.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He gave him a holy robe of gold, and blue, and purple, a woven work of a wise man, endued with judgment and truth:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Of twisted scarlet the work of an artist, with precious stones cut and set in gold, and graven by the work of a lapidary for a memorial, according to the number of the tribes of Israel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And a crown of gold upon his mitre wherein was engraved Holiness, an ornament of honour: a work of power, and delightful to the eyes for its beauty.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Before him there were none so beautiful, even from the beginning.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>No stranger was ever clothed with them, but only his children alone, and his grandchildren for ever.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>His sacrifices were consumed with fire every day.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Moses filled his hands and anointed him with holy oil.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>This was made to him for an everlasting testament, and to his seed as the days of heaven, to execute the office of the priesthood, and to have praise, and to glorify his people in his name.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He chose him out of all men living, to offer sacrifice to God, incense, and a good savour, for a memorial to make reconciliation for his people:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he gave him power in his commandments, in the covenants of his judgments, that he should teach Jacob his testimonies, and give light to Israel in his law.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And strangers stood up against him, and through envy the men that were with Dathan and Abiron, compassed him about in the wilderness, and the congregation of Core in their wrath.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The Lord God saw and it pleased him not, and they were consumed in his wrathful indignation.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He wrought wonders upon them, and consumed them with a flame of fire.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he added glory to Aaron, and gave him an inheritance, and divided unto him the firstfruits of the increase of the earth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He prepared them bread in the first place unto fulness: for the sacrifices also of the Lord they shall eat, which he gave to him, and to his seed.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But he shall not inherit among the people in the land, and he hath no portion among the people: for he himself is his portion and inheritance.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Phinees the son of Eleazar is the third in glory, by imitating him in the fear of the Lord:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he stood up in the shameful fall of the people: in the goodness and readiness of his soul he appeased God for Israel.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Therefore he made to him a covenant of peace, to be the prince of the sanctuary, and of his people, that the dignity of priesthood should be to him and to his seed for ever.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And a covenant to David the king, the son of Jesse of the tribe of Juda, an inheritance to him and to his seed, that he might give wisdom into our heart to judge his people in justice, that their good things might not be abolished, and he made their glory in their nation everlasting.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dilectus Deo et hominibus Moyses, cujus memoria in benedictione est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Similem illum fecit in gloria sanctorum, et magnificavit eum in timore inimicorum, et in verbis suis monstra placavit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Glorificavit illum in conspectu regum, et jussit illi coram populo suo, et ostendit illi gloriam suam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In fide et lenitate ipsius sanctum fecit illum, et elegit eum ex omni carne.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Audivit enim eum, et vocem ipsius, et induxit illum in nubem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et dedit illi coram præcepta, et legem vitæ et disciplinæ, docere Jacob testamentum suum, et judicia sua Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Excelsum fecit Aaron fratrem ejus, et similem sibi, de tribu Levi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Statuit ei testamentum æternum, et dedit illi sacerdotium gentis, et beatificavit illum in gloria :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et circumcinxit eum zona gloriæ, et induit eum stolam gloriæ, et coronavit eum in vasis virtutis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Circumpedes, et femoralia, et humerale posuit ei : et cinxit illum tintinnabulis aureis plurimis in gyro :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>dare sonitum in incessu suo, auditum facere sonitum in templo in memoriam filiis gentis suæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Stolam sanctam auro, et hyacintho, et purpura, opus textile viri sapientis, judicio et veritate præditi :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>torto cocco opus artificis gemmis pretiosis figuratis in ligatura auri, et opere lapidarii sculptis, in memoriam secundum numerum tribuum Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Corona aurea super mitram ejus expressa signo sanctitatis, et gloria honoris : opus virtutis, et desideria oculorum ornata.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sic pulchra ante ipsum non fuerunt talia usque ad originem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non est indutus illa alienigena aliquis, sed tantum filii ipsius soli, et nepotes ejus per omne tempus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sacrificia ipsius consumpta sunt igne quotidie.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Complevit Moyses manus ejus, et unxit illum oleo sancto.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Factum est illi in testamentum æternum, et semini ejus, sicut dies cæli, fungi sacerdotio, et habere laudem, et glorificare populum suum in nomine ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ipsum elegit ab omni vivente, offerre sacrificium Deo, incensum, et bonum odorem, in memoriam placare pro populo suo :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et dedit illi in præceptis suis potestatem, in testamentis judiciorum : docere Jacob testimonia, et in lege sua lucem dare Israël.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quia contra illum steterunt alieni, et propter invidiam circumdederunt illum homines in deserto, qui erant cum Dathan et Abiron, et congregatio Core in iracundia.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Vidit Dominus Deus, et non placuit illi, et consumpti sunt in impetu iracundiæ.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Fecit illis monstra, et consumpsit illos in flamma ignis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et addidit Aaron gloriam, et dedit illi hæreditatem, et primitias frugum terræ divisit illi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Panem ipsis in primis paravit in satietatem : nam et sacrificia Domini edent, quæ dedit illi et semini ejus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ceterum in terra gentes non hæreditabit, et pars non est illi in gente : ipse est enim pars ejus, et hæreditas.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Phinees, filius Eleazari, tertius in gloria est, imitando eum in timore Domini,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et stare in reverentia gentis : in bonitate et alacritate animæ suæ placuit Deo pro Israël.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ideo statuit illi testamentum pacis, principem sanctorum et gentis suæ, ut sit illi et semini ejus sacerdotii dignitas in æternum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et testamentum David regi filio Jesse de tribu Juda, hæreditas ipsi et semini ejus : ut daret sapientiam in cor nostrum, judicare gentem suam in justitia, ne abolerentur bona ipsorum : et gloriam ipsorum in gentem eorum æternam fecit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/44/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 44</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/46/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 46</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500" p-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"SIR.45\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":45,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Moses was beloved of God, and men: whose memory is in benediction.\"},{\"verse\":2,\"text\":\"He made him like the saints in glory, and magnified him in the fear of his enemies, and with his words he made prodigies to cease.\"},{\"verse\":3,\"text\":\"He glorified him in the sight of kings, and gave him commandments in the sight of his people, and shewed him his glory.\"},{\"verse\":4,\"text\":\"He sanctified him in his faith, and meekness, and chose him out of all flesh.\"},{\"verse\":5,\"text\":\"For he heard him, and his voice, and brought him into a cloud.\"},{\"verse\":6,\"text\":\"And he gave him commandments before his face, and a law of life and instruction, that he might teach Jacob his covenant, and Israel his judgments.\"},{\"verse\":7,\"text\":\"He exalted Aaron his brother, and like to himself of the tribe of Levi:\"},{\"verse\":8,\"text\":\"He made an everlasting covenant with him, and gave him the priesthood of the nation, and made him blessed in glory,\"},{\"verse\":9,\"text\":\"And he girded him about with a glorious girdle, and clothed him with a robe of glory, and crowned him with majestic attire.\"},{\"verse\":10,\"text\":\"He put upon him a garment to the feet, and breeches, and an ephod, and he compassed him with many little bells of gold all round about,\"},{\"verse\":11,\"text\":\"That as he went there might be a sound, and a noise made that might be heard in the temple, for a memorial to the children of his people.\"},{\"verse\":12,\"text\":\"He gave him a holy robe of gold, and blue, and purple, a woven work of a wise man, endued with judgment and truth:\"},{\"verse\":13,\"text\":\"Of twisted scarlet the work of an artist, with precious stones cut and set in gold, and graven by the work of a lapidary for a memorial, according to the number of the tribes of Israel.\"},{\"verse\":14,\"text\":\"And a crown of gold upon his mitre wherein was engraved Holiness, an ornament of honour: a work of power, and delightful to the eyes for its beauty.\"},{\"verse\":15,\"text\":\"Before him there were none so beautiful, even from the beginning.\"},{\"verse\":16,\"text\":\"No stranger was ever clothed with them, but only his children alone, and his grandchildren for ever.\"},{\"verse\":17,\"text\":\"His sacrifices were consumed with fire every day.\"},{\"verse\":18,\"text\":\"Moses filled his hands and anointed him with holy oil.\"},{\"verse\":19,\"text\":\"This was made to him for an everlasting testament, and to his seed as the days of heaven, to execute the office of the priesthood, and to have praise, and to glorify his people in his name.\"},{\"verse\":20,\"text\":\"He chose him out of all men living, to offer sacrifice to God, incense, and a good savour, for a memorial to make reconciliation for his people:\"},{\"verse\":21,\"text\":\"And he gave him power in his commandments, in the covenants of his judgments, that he should teach Jacob his testimonies, and give light to Israel in his law.\"},{\"verse\":22,\"text\":\"And strangers stood up against him, and through envy the men that were with Dathan and Abiron, compassed him about in the wilderness, and the congregation of Core in their wrath.\"},{\"verse\":23,\"text\":\"The Lord God saw and it pleased him not, and they were consumed in his wrathful indignation.\"},{\"verse\":24,\"text\":\"He wrought wonders upon them, and consumed them with a flame of fire.\"},{\"verse\":25,\"text\":\"And he added glory to Aaron, and gave him an inheritance, and divided unto him the firstfruits of the increase of the earth.\"},{\"verse\":26,\"text\":\"He prepared them bread in the first place unto fulness: for the sacrifices also of the Lord they shall eat, which he gave to him, and to his seed.\"},{\"verse\":27,\"text\":\"But he shall not inherit among the people in the land, and he hath no portion among the people: for he himself is his portion and inheritance.\"},{\"verse\":28,\"text\":\"Phinees the son of Eleazar is the third in glory, by imitating him in the fear of the Lord:\"},{\"verse\":29,\"text\":\"And he stood up in the shameful fall of the people: in the goodness and readiness of his soul he appeased God for Israel.\"},{\"verse\":30,\"text\":\"Therefore he made to him a covenant of peace, to be the prince of the sanctuary, and of his people, that the dignity of priesthood should be to him and to his seed for ever.\"},{\"verse\":31,\"text\":\"And a covenant to David the king, the son of Jesse of the tribe of Juda, an inheritance to him and to his seed, that he might give wisdom into our heart to judge his people in justice, that their good things might not be abolished, and he made their glory in their nation everlasting.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dilectus Deo et hominibus Moyses, cujus memoria in benedictione est.\"},{\"verse\":2,\"text\":\"Similem illum fecit in gloria sanctorum, et magnificavit eum in timore inimicorum, et in verbis suis monstra placavit.\"},{\"verse\":3,\"text\":\"Glorificavit illum in conspectu regum, et jussit illi coram populo suo, et ostendit illi gloriam suam.\"},{\"verse\":4,\"text\":\"In fide et lenitate ipsius sanctum fecit illum, et elegit eum ex omni carne.\"},{\"verse\":5,\"text\":\"Audivit enim eum, et vocem ipsius, et induxit illum in nubem.\"},{\"verse\":6,\"text\":\"Et dedit illi coram præcepta, et legem vitæ et disciplinæ, docere Jacob testamentum suum, et judicia sua Israël.\"},{\"verse\":7,\"text\":\"Excelsum fecit Aaron fratrem ejus, et similem sibi, de tribu Levi.\"},{\"verse\":8,\"text\":\"Statuit ei testamentum æternum, et dedit illi sacerdotium gentis, et beatificavit illum in gloria :\"},{\"verse\":9,\"text\":\"et circumcinxit eum zona gloriæ, et induit eum stolam gloriæ, et coronavit eum in vasis virtutis.\"},{\"verse\":10,\"text\":\"Circumpedes, et femoralia, et humerale posuit ei : et cinxit illum tintinnabulis aureis plurimis in gyro :\"},{\"verse\":11,\"text\":\"dare sonitum in incessu suo, auditum facere sonitum in templo in memoriam filiis gentis suæ.\"},{\"verse\":12,\"text\":\"Stolam sanctam auro, et hyacintho, et purpura, opus textile viri sapientis, judicio et veritate præditi :\"},{\"verse\":13,\"text\":\"torto cocco opus artificis gemmis pretiosis figuratis in ligatura auri, et opere lapidarii sculptis, in memoriam secundum numerum tribuum Israël.\"},{\"verse\":14,\"text\":\"Corona aurea super mitram ejus expressa signo sanctitatis, et gloria honoris : opus virtutis, et desideria oculorum ornata.\"},{\"verse\":15,\"text\":\"Sic pulchra ante ipsum non fuerunt talia usque ad originem.\"},{\"verse\":16,\"text\":\"Non est indutus illa alienigena aliquis, sed tantum filii ipsius soli, et nepotes ejus per omne tempus.\"},{\"verse\":17,\"text\":\"Sacrificia ipsius consumpta sunt igne quotidie.\"},{\"verse\":18,\"text\":\"Complevit Moyses manus ejus, et unxit illum oleo sancto.\"},{\"verse\":19,\"text\":\"Factum est illi in testamentum æternum, et semini ejus, sicut dies cæli, fungi sacerdotio, et habere laudem, et glorificare populum suum in nomine ejus.\"},{\"verse\":20,\"text\":\"Ipsum elegit ab omni vivente, offerre sacrificium Deo, incensum, et bonum odorem, in memoriam placare pro populo suo :\"},{\"verse\":21,\"text\":\"et dedit illi in præceptis suis potestatem, in testamentis judiciorum : docere Jacob testimonia, et in lege sua lucem dare Israël.\"},{\"verse\":22,\"text\":\"Quia contra illum steterunt alieni, et propter invidiam circumdederunt illum homines in deserto, qui erant cum Dathan et Abiron, et congregatio Core in iracundia.\"},{\"verse\":23,\"text\":\"Vidit Dominus Deus, et non placuit illi, et consumpti sunt in impetu iracundiæ.\"},{\"verse\":24,\"text\":\"Fecit illis monstra, et consumpsit illos in flamma ignis.\"},{\"verse\":25,\"text\":\"Et addidit Aaron gloriam, et dedit illi hæreditatem, et primitias frugum terræ divisit illi.\"},{\"verse\":26,\"text\":\"Panem ipsis in primis paravit in satietatem : nam et sacrificia Domini edent, quæ dedit illi et semini ejus.\"},{\"verse\":27,\"text\":\"Ceterum in terra gentes non hæreditabit, et pars non est illi in gente : ipse est enim pars ejus, et hæreditas.\"},{\"verse\":28,\"text\":\"Phinees, filius Eleazari, tertius in gloria est, imitando eum in timore Domini,\"},{\"verse\":29,\"text\":\"et stare in reverentia gentis : in bonitate et alacritate animæ suæ placuit Deo pro Israël.\"},{\"verse\":30,\"text\":\"Ideo statuit illi testamentum pacis, principem sanctorum et gentis suæ, ut sit illi et semini ejus sacerdotii dignitas in æternum.\"},{\"verse\":31,\"text\":\"Et testamentum David regi filio Jesse de tribu Juda, hæreditas ipsi et semini ejus : ut daret sapientiam in cor nostrum, judicare gentem suam in justitia, ne abolerentur bona ipsorum : et gloriam ipsorum in gentem eorum æternam fecit.\"}],\"summary\":\"The praises of Moses, of Aaron, and of Phinees.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":44,\"label\":\"Sirach 44\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":46,\"label\":\"Sirach 46\"}}]]\n"])</script></body></html>
