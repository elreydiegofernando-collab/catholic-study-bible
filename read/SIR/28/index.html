t="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that seeketh to revenge himself, shall find vengeance from the Lord, and he will surely keep his sins in remembrance.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Forgive thy neighbour if he hath hurt thee: and then shall thy sins be forgiven to thee when thou prayest.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Man to man reserveth anger, and doth he seek remedy of God?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He hath no mercy on a man like himself, and doth he entreat for his own sins?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He that is but flesh, nourisheth anger, and doth he ask forgiveness of God? who shall obtain pardon for his sins?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Remember thy last things, and let enmity cease:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For corruption and death hang over in his commandments.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Remember the fear of God, and be not angry with thy neighbour.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Remember the covenant of the most High, and overlook the ignorance of thy neighbour.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Refrain from strife, and thou shalt diminish thy sins.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For a passionate man kindleth strife, and a sinful man will trouble his friends, and bring in debate in the midst of them that are at peace.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For as the wood of the forest is, so the fire burneth, and as a man’s strength is, so shall his anger be, and according to his riches he shall increase his anger.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>A hasty contention kindleth a fire and a hasty quarrel sheddeth blood and a tongue that beareth witness bringeth death.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If thou blow the spark, it shall burn as a fire: and if thou spit upon it, it shall be quenched: both come out of the mouth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The whisperer and the double tongue is accursed: for he hath troubled many that were at peace.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The tongue of a third person hath disquieted many, and scattered them from nation to nation.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>It hath destroyed the strong cities of the rich, and hath overthrown the houses of great men.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>It hath cut in pieces the forces of people, and undone strong nations.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The tongue of a third person hath cast out valiant women, and deprived them of their labours.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that hearkeneth to it, shall never have rest, neither shall he have a friend in whom he may repose.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The stroke of a whip maketh a blue mark: but the stroke of the tongue will break the bones.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Many have fallen by the edge of the sword, but not so many as have perished by their own tongue.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Blessed is he that is defended from a wicked tongue, that hath not passed into the wrath thereof, and that hath not drawn the yoke thereof, and hath not been bound in its bands.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For its yoke is a yoke of iron: and its bands are bands of brass.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The death thereof is a most evil death: and hell is preferable to it.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Its continuance shall not be for a long time, but it shall possess the ways of the unjust: and the just shall not be burnt with its flame.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>They that forsake God shall fall into it, and it shall burn in them, and shall not be quenched, and it shall be sent upon them as a lion, and as a leopard it shall tear them.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Hedge in thy ears with thorns, hear not a wicked tongue, and make doors and bars to thy mouth.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Melt down thy gold and silver, and make a balance for thy words, and a just bridle for thy mouth:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And take heed lest thou slip with thy tongue, and fall in the sight of thy enemies who lie in wait for thee, and thy fall be incurable unto death.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui vindicari vult, a Domino inveniet vindictam, et peccata illius servans servabit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Relinque proximo tuo nocenti te, et tunc deprecanti tibi peccata solventur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Homo homini reservat iram, et a Deo quærit medelam :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>in hominem similem sibi non habet misericordiam, et de peccatis suis deprecatur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ipse cum caro sit reservat iram, et propitiationem petit a Deo : quis exorabit pro delictis illius ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Memento novissimorum, et desine inimicari :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>tabitudo enim et mors imminent in mandatis ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Memorare timorem Dei, et non irascaris proximo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Memorare testamentum Altissimi, et despice ignorantiam proximi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Abstine te a lite, et minues peccata.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Homo enim iracundus incendit litem, et vir peccator turbabit amicos, et in medio pacem habentium immittet inimicitiam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Secundum enim ligna silvæ sic ignis exardescit : et secundum virtutem hominis sic iracundia illius erit, et secundum substantiam suam exaltabit iram suam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Certamen festinatum incendit ignem, et lis festinans effundit sanguinem : et lingua testificans adducit mortem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si sufflaveris in scintillam, quasi ignis exardebit : et si exspueris super illam, extinguetur : utraque ex ore proficiscuntur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Susurro et bilinguis maledictus, multos enim turbabit pacem habentes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Lingua tertia multos commovit, et dispersit illos de gente in gentem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Civitates muratas divitum destruxit, et domus magnatorum effodit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Virtutes populorum concidit, et gentes fortes dissolvit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Lingua tertia mulieres viratas ejecit, et privavit illas laboribus suis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui respicit illam non habebit requiem, nec habebit amicum in quo requiescat.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Flagelli plaga livorem facit : plaga autem linguæ comminuet ossa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Multi ceciderunt in ore gladii : sed non sic quasi qui interierunt per linguam suam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Beatus qui tectus est a lingua nequam, qui in iracundiam illius non transivit, et qui non attraxit jugum illius, et in vinculis ejus non est ligatus :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>jugum enim illius jugum ferreum est, et vinculum illius vinculum æreum est ;</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>mors illius mors nequissima : et utilis potius infernus quam illa.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Perseverantia illius non permanebit, sed obtinebit vias injustorum, et in flamma sua non comburet justos.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui relinquunt Deum incident in illam, et exardebit in illis, et non extinguetur, et immittetur in illos quasi leo, et quasi pardus lædet illos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sepi aures tuas spinis : linguam nequam noli audire : et ori tuo facito ostia et seras.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Aurum tuum et argentum tuum confla, et verbis tuis facito stateram, et frenos ori tuo rectos :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et attende ne forte labaris in lingua, et cadas in conspectu inimicorum insidiantium tibi, et sit casus tuus insanabilis in mortem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/27/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-seri · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.28\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":28,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"He that seeketh to revenge himself, shall find vengeance from the Lord, and he will surely keep his sins in remembrance.\"},{\"verse\":2,\"text\":\"Forgive thy neighbour if he hath hurt thee: and then shall thy sins be forgiven to thee when thou prayest.\"},{\"verse\":3,\"text\":\"Man to man reserveth anger, and doth he seek remedy of God?\"},{\"verse\":4,\"text\":\"He hath no mercy on a man like himself, and doth he entreat for his own sins?\"},{\"verse\":5,\"text\":\"He that is but flesh, nourisheth anger, and doth he ask forgiveness of God? who shall obtain pardon for his sins?\"},{\"verse\":6,\"text\":\"Remember thy last things, and let enmity cease:\"},{\"verse\":7,\"text\":\"For corruption and death hang over in his commandments.\"},{\"verse\":8,\"text\":\"Remember the fear of God, and be not angry with thy neighbour.\"},{\"verse\":9,\"text\":\"Remember the covenant of the most High, and overlook the ignorance of thy neighbour.\"},{\"verse\":10,\"text\":\"Refrain from strife, and thou shalt diminish thy sins.\"},{\"verse\":11,\"text\":\"For a passionate man kindleth strife, and a sinful man will trouble his friends, and bring in debate in the midst of them that are at peace.\"},{\"verse\":12,\"text\":\"For as the wood of the forest is, so the fire burneth, and as a man’s strength is, so shall his anger be, and according to his riches he shall increase his anger.\"},{\"verse\":13,\"text\":\"A hasty contention kindleth a fire and a hasty quarrel sheddeth blood and a tongue that beareth witness bringeth death.\"},{\"verse\":14,\"text\":\"If thou blow the spark, it shall burn as a fire: and if thou spit upon it, it shall be quenched: both come out of the mouth.\"},{\"verse\":15,\"text\":\"The whisperer and the double tongue is accursed: for he hath troubled many that were at peace.\"},{\"verse\":16,\"text\":\"The tongue of a third person hath disquieted many, and scattered them from nation to nation.\"},{\"verse\":17,\"text\":\"It hath destroyed the strong cities of the rich, and hath overthrown the houses of great men.\"},{\"verse\":18,\"text\":\"It hath cut in pieces the forces of people, and undone strong nations.\"},{\"verse\":19,\"text\":\"The tongue of a third person hath cast out valiant women, and deprived them of their labours.\"},{\"verse\":20,\"text\":\"He that hearkeneth to it, shall never have rest, neither shall he have a friend in whom he may repose.\"},{\"verse\":21,\"text\":\"The stroke of a whip maketh a blue mark: but the stroke of the tongue will break the bones.\"},{\"verse\":22,\"text\":\"Many have fallen by the edge of the sword, but not so many as have perished by their own tongue.\"},{\"verse\":23,\"text\":\"Blessed is he that is defended from a wicked tongue, that hath not passed into the wrath thereof, and that hath not drawn the yoke thereof, and hath not been bound in its bands.\"},{\"verse\":24,\"text\":\"For its yoke is a yoke of iron: and its bands are bands of brass.\"},{\"verse\":25,\"text\":\"The death thereof is a most evil death: and hell is preferable to it.\"},{\"verse\":26,\"text\":\"Its continuance shall not be for a long time, but it shall possess the ways of the unjust: and the just shall not be burnt with its flame.\"},{\"verse\":27,\"text\":\"They that forsake God shall fall into it, and it shall burn in them, and shall not be quenched, and it shall be sent upon them as a lion, and as a leopard it shall tear them.\"},{\"verse\":28,\"text\":\"Hedge in thy ears with thorns, hear not a wicked tongue, and make doors and bars to thy mouth.\"},{\"verse\":29,\"text\":\"Melt down thy gold and silver, and make a balance for thy words, and a just bridle for thy mouth:\"},{\"verse\":30,\"text\":\"And take heed lest thou slip with thy tongue, and fall in the sight of thy enemies who lie in wait for thee, and thy fall be incurable unto death.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui vindicari vult, a Domino inveniet vindictam, et peccata illius servans servabit.\"},{\"verse\":2,\"text\":\"Relinque proximo tuo nocenti te, et tunc deprecanti tibi peccata solventur.\"},{\"verse\":3,\"text\":\"Homo homini reservat iram, et a Deo quærit medelam :\"},{\"verse\":4,\"text\":\"in hominem similem sibi non habet misericordiam, et de peccatis suis deprecatur.\"},{\"verse\":5,\"text\":\"Ipse cum caro sit reservat iram, et propitiationem petit a Deo : quis exorabit pro delictis illius ?\"},{\"verse\":6,\"text\":\"Memento novissimorum, et desine inimicari :\"},{\"verse\":7,\"text\":\"tabitudo enim et mors imminent in mandatis ejus.\"},{\"verse\":8,\"text\":\"Memorare timorem Dei, et non irascaris proximo.\"},{\"verse\":9,\"text\":\"Memorare testamentum Altissimi, et despice ignorantiam proximi.\"},{\"verse\":10,\"text\":\"Abstine te a lite, et minues peccata.\"},{\"verse\":11,\"text\":\"Homo enim iracundus incendit litem, et vir peccator turbabit amicos, et in medio pacem habentium immittet inimicitiam.\"},{\"verse\":12,\"text\":\"Secundum enim ligna silvæ sic ignis exardescit : et secundum virtutem hominis sic iracundia illius erit, et secundum substantiam suam exaltabit iram suam.\"},{\"verse\":13,\"text\":\"Certamen festinatum incendit ignem, et lis festinans effundit sanguinem : et lingua testificans adducit mortem.\"},{\"verse\":14,\"text\":\"Si sufflaveris in scintillam, quasi ignis exardebit : et si exspueris super illam, extinguetur : utraque ex ore proficiscuntur.\"},{\"verse\":15,\"text\":\"Susurro et bilinguis maledictus, multos enim turbabit pacem habentes.\"},{\"verse\":16,\"text\":\"Lingua tertia multos commovit, et dispersit illos de gente in gentem.\"},{\"verse\":17,\"text\":\"Civitates muratas divitum destruxit, et domus magnatorum effodit.\"},{\"verse\":18,\"text\":\"Virtutes populorum concidit, et gentes fortes dissolvit.\"},{\"verse\":19,\"text\":\"Lingua tertia mulieres viratas ejecit, et privavit illas laboribus suis.\"},{\"verse\":20,\"text\":\"Qui respicit illam non habebit requiem, nec habebit amicum in quo requiescat.\"},{\"verse\":21,\"text\":\"Flagelli plaga livorem facit : plaga autem linguæ comminuet ossa.\"},{\"verse\":22,\"text\":\"Multi ceciderunt in ore gladii : sed non sic quasi qui interierunt per linguam suam.\"},{\"verse\":23,\"text\":\"Beatus qui tectus est a lingua nequam, qui in iracundiam illius non transivit, et qui non attraxit jugum illius, et in vinculis ejus non est ligatus :\"},{\"verse\":24,\"text\":\"jugum enim illius jugum ferreum est, et vinculum illius vinculum æreum est ;\"},{\"verse\":25,\"text\":\"mors illius mors nequissima : et utilis potius infernus quam illa.\"},{\"verse\":26,\"text\":\"Perseverantia illius non permanebit, sed obtinebit vias injustorum, et in flamma sua non comburet justos.\"},{\"verse\":27,\"text\":\"Qui relinquunt Deum incident in illam, et exardebit in illis, et non extinguetur, et immittetur in illos quasi leo, et quasi pardus lædet illos.\"},{\"verse\":28,\"text\":\"Sepi aures tuas spinis : linguam nequam noli audire : et ori tuo facito ostia et seras.\"},{\"verse\":29,\"text\":\"Aurum tuum et argentum tuum confla, et verbis tuis facito stateram, et frenos ori tuo rectos :\"},{\"verse\":30,\"text\":\"et attende ne forte labaris in lingua, et cadas in conspectu inimicorum insidiantium tibi, et sit casus tuus insanabilis in mortem.\"}],\"summary\":\"Lessons against revenge and quarrels. The evils of the tongue.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":27,\"label\":\"Sirach 27\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":29,\"label\":\"Sirach 29\"}}]]\n"])</script></body></html>
