serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Strive not with a powerful man, lest thou fall into his hands.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Contend not with a rich man, lest he bring an action against thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For gold and silver hath destroyed many, and hath reached even to the heart of kings, and perverted them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Strive not with a man that is full of tongue, and heap not wood upon his fire.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Communicate not with an ignorant man, lest he speak ill of thy family.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Despise not a man that turneth away from sin, nor reproach him therewith: remember that we are all worthy of reproof.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Despise not a man in his old age; for we also shall become old.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Rejoice not at the death of thy enemy; knowing that we all die, and are not willing that others should rejoice at our death.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Despise not the discourse of them that are ancient and wise, but acquaint thyself with their proverbs.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For of them thou shalt learn wisdom, and instruction of understanding, and to serve great men without blame.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Let not the discourse of the ancients escape thee, for they have learned of their fathers:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For of them thou shalt learn understanding, and to give an answer in time of need.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Kindle not the coals of sinners by rebuking them, lest thou be burnt with the flame of the fire of their sins.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Stand not against the face of an injurious person, lest he sit as a spy to entrap thee in thy words.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Lend not to a man that is mightier than thyself: and if thou lendest, count it as lost.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Be not surety above thy power: and if thou be surety, think as if thou wert to pay it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Judge not against a judge: for he judgeth according to that which is just.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Go not on the way with a bold man, lest he burden thee with his evils: for he goeth according to his own will, and thou shalt perish together with his folly.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quarrel not with a passionate man, and go not into the desert with a bold man: for blood is as nothing in his sight, and where there is no help he will overthrow thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Advise not with fools, for they cannot love but such things as please them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Before a stranger do no matter of counsel: for thou knowest not what he will bring forth.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Open not thy heart to every man: lest he repay thee with an evil turn, and speak reproachfully to thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Non litiges cum homine potente, ne forte incidas in manus illius.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Non contendas cum viro locuplete, ne forte contra te constituat litem tibi :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>multos enim perdidit aurum et argentum, et usque ad cor regum extendit et convertit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non litiges cum homine linguato, et non strues in ignem illius ligna.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non communices homini indocto, ne male de progenie tua loquatur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ne despicias hominem avertentem se a peccato, neque improperes ei : memento quoniam omnes in correptione sumus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ne spernas hominem in sua senectute, etenim ex nobis senescunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Noli de mortuo inimico tuo gaudere : sciens quoniam omnes morimur, et in gaudium nolumus venire.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ne despicias narrationem presbyterorum sapientium, et in proverbiis eorum conversare :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ab ipsis enim disces sapientiam et doctrinam intellectus, et servire magnatis sine querela.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non te prætereat narratio seniorum, ipsi enim didicerunt a patribus suis :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quoniam ab ipsis disces intellectum, et in tempore necessitatis dare responsum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non incendas carbones peccatorum arguens eos, et ne incendaris flamma ignis peccatorum illorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ne contra faciem stes contumeliosi, ne sedeat quasi insidiator ori tuo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Noli fœnerari homini fortiori te : quod si fœneraveris, quasi perditum habe.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non spondeas super virtutem tuam : quod si spoponderis, quasi restituens cogita.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non judices contra judicem, quoniam secundum quod justum est judicat.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cum audace non eas in via, ne forte gravet mala sua in te : ipse enim secundum voluntatem suam vadit, et simul cum stultitia illius peries.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cum iracundo non facias rixam, et cum audace non eas in desertum : quoniam quasi nihil est ante illum sanguis, et ubi non est adjutorium, elidet te.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cum fatuis consilium non habeas : non enim poterunt diligere nisi quæ eis placent.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Coram extraneo ne facias consilium : nescis enim quid pariet.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non omni homini cor tuum manifestes, ne forte inferat tibi gratiam falsam, et convicietur tibi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->8<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 7" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-st  rebuking them, lest thou be burnt with the flame of the fire of their sins.\"},{\"verse\":14,\"text\":\"Stand not against the face of an injurious person, lest he sit as a spy to entrap thee in thy words.\"},{\"verse\":15,\"text\":\"Lend not to a man that is mightier than thyself: and if thou lendest, count it as lost.\"},{\"verse\":16,\"text\":\"Be not surety above thy power: and if thou be surety, think as if thou wert to pay it.\"},{\"verse\":17,\"text\":\"Judge not against a judge: for he judgeth according to that which is just.\"},{\"verse\":18,\"text\":\"Go not on the way with a bold man, lest he burden thee with his evils: for he goeth according to his own will, and thou shalt perish together with his folly.\"},{\"verse\":19,\"text\":\"Quarrel not with a passionate man, and go not into the desert with a bold man: for blood is as nothing in his sight, and where there is no help he will overthrow thee.\"},{\"verse\":20,\"text\":\"Advise not with fools, for they cannot love but such things as please them.\"},{\"verse\":21,\"text\":\"Before a stranger do no matter of counsel: for thou knowest not what he will bring forth.\"},{\"verse\":22,\"text\":\"Open not thy heart to every man: lest he repay thee with an evil turn, and speak reproachfully to thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Non litiges cum homine potente, ne forte incidas in manus illius.\"},{\"verse\":2,\"text\":\"Non contendas cum viro locuplete, ne forte contra te constituat litem tibi :\"},{\"verse\":3,\"text\":\"multos enim perdidit aurum et argentum, et usque ad cor regum extendit et convertit.\"},{\"verse\":4,\"text\":\"Non litiges cum homine linguato, et non strues in ignem illius ligna.\"},{\"verse\":5,\"text\":\"Non communices homini indocto, ne male de progenie tua loquatur.\"},{\"verse\":6,\"text\":\"Ne despicias hominem avertentem se a peccato, neque improperes ei : memento quoniam omnes in correptione sumus.\"},{\"verse\":7,\"text\":\"Ne spernas hominem in sua senectute, etenim ex nobis senescunt.\"},{\"verse\":8,\"text\":\"Noli de mortuo inimico tuo gaudere : sciens quoniam omnes morimur, et in gaudium nolumus venire.\"},{\"verse\":9,\"text\":\"Ne despicias narrationem presbyterorum sapientium, et in proverbiis eorum conversare :\"},{\"verse\":10,\"text\":\"ab ipsis enim disces sapientiam et doctrinam intellectus, et servire magnatis sine querela.\"},{\"verse\":11,\"text\":\"Non te prætereat narratio seniorum, ipsi enim didicerunt a patribus suis :\"},{\"verse\":12,\"text\":\"quoniam ab ipsis disces intellectum, et in tempore necessitatis dare responsum.\"},{\"verse\":13,\"text\":\"Non incendas carbones peccatorum arguens eos, et ne incendaris flamma ignis peccatorum illorum.\"},{\"verse\":14,\"text\":\"Ne contra faciem stes contumeliosi, ne sedeat quasi insidiator ori tuo.\"},{\"verse\":15,\"text\":\"Noli fœnerari homini fortiori te : quod si fœneraveris, quasi perditum habe.\"},{\"verse\":16,\"text\":\"Non spondeas super virtutem tuam : quod si spoponderis, quasi restituens cogita.\"},{\"verse\":17,\"text\":\"Non judices contra judicem, quoniam secundum quod justum est judicat.\"},{\"verse\":18,\"text\":\"Cum audace non eas in via, ne forte gravet mala sua in te : ipse enim secundum voluntatem suam vadit, et simul cum stultitia illius peries.\"},{\"verse\":19,\"text\":\"Cum iracundo non facias rixam, et cum audace non eas in desertum : quoniam quasi nihil est ante illum sanguis, et ubi non est adjutorium, elidet te.\"},{\"verse\":20,\"text\":\"Cum fatuis consilium non habeas : non enim poterunt diligere nisi quæ eis placent.\"},{\"verse\":21,\"text\":\"Coram extraneo ne facias consilium : nescis enim quid pariet.\"},{\"verse\":22,\"text\":\"Non omni homini cor tuum manifestes, ne forte inferat tibi gratiam falsam, et convicietur tibi.\"}],\"summary\":\"Other lessons of wisdom and virtue.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":7,\"label\":\"Sirach 7\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":9,\"label\":\"Sirach 9\"}}]]\n"])</script></body></html>
