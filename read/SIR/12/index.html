t="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>If thou do good, know to whom thou dost it, and there shall be much thanks for thy good deeds.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Do good to the just, and thou shalt find great recompense: and if not of him, assuredly of the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For there is no good for him that is always occupied in evil, and that giveth no alms: for the Highest hateth sinners, and hath mercy on the penitent.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Give to the merciful and uphold not the sinner: God will repay vengeance to the ungodly and to sinners, and keep them against the day of vengeance.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Give to the good, and receive not a sinner.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Do good to the humble, and give not to the ungodly: hold back thy bread, and give it not to him, lest thereby he overmaster thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For thou shalt receive twice as much evil for all the good thou shalt have done to him: for the Highest also hateth sinners, and will repay vengeance to the ungodly.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>A friend shall not be known in prosperity, and an enemy shall not be hidden in adversity.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In the prosperity of a man, his enemies are grieved: and a friend is known in his adversity.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Never trust thy enemy for as a brass pot his wickedness rusteth:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Though he humble himself and go crouching, yet take good heed and beware of him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Set him not by thee, neither let him sit on thy right hand, lest he turn into thy place, and seek to take thy seat and at the last thou acknowledge my words, and be pricked with my sayings.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who will pity an enchanter struck by a serpent, or any that come near wild beasts? so is it with him that keepeth company with a wicked man, and is involved in his sins.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For an hour he will abide with thee: but if thou begin to decline, he will not endure it.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>An enemy speaketh sweetly with his lips, but in his heart he lieth in wait, to throw thee into a pit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>An enemy weepeth with his eyes: but if he find an opportunity he will not be satisfied with blood:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And if evils come upon thee, thou shalt find him there first.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>An enemy hath tears in his eyes, and while he pretendeth to help thee, will undermine thy feet.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He will shake his head, and clap his hands, and whisper much, and change his countenance.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Si benefeceris, scito cui feceris, et erit gratia in bonis tuis multa.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Benefac justo, et invenies retributionem magnam : et si non ab ipso, certe a Domino.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non est enim ei bene qui assiduus est in malis, et eleemosynas non danti : quoniam et Altissimus odio habet peccatores, et misertus est pœnitentibus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Da misericordi, et ne suscipias peccatorem : et impiis et peccatoribus reddet vindictam, custodiens eos in diem vindictæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Da bono, et non receperis peccatorem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Benefac humili, et non dederis impio : prohibe panes illi dari, ne in ipsis potentior te sit :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>nam duplicia mala invenies in omnibus bonis quæcumque feceris illi, quoniam et Altissimus odio habet peccatores, et impiis reddet vindictam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non agnoscetur in bonis amicus, et non abscondetur in malis inimicus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In bonis viri, inimici illius in tristitia : et in malitia illius, amicus agnitus est.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non credas inimico tuo in æternum : sicut enim æramentum æruginat nequitia illius :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et si humiliatus vadat curvus, adjice animum tuum, et custodi te ab illo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non statuas illum penes te, nec sedeat ad dexteram tuam, ne forte conversus in locum tuum, inquirat cathedram tuam, et in novissimo agnosces verba mea, et in sermonibus meis stimuleris.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quis miserebitur incantatori a serpente percusso, et omnibus qui appropiant bestiis ? et sic qui comitatur cum viro iniquo, et obvolutus est in peccatis ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Una hora tecum permanebit : si autem declinaveris, non supportabit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In labiis suis indulcat inimicus, et in corde suo insidiatur ut subvertat te in foveam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In oculis suis lacrimatur inimicus, et si invenerit tempus, non satiabitur sanguine.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et si incurrerint tibi mala, invenies eum illic priorem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In oculis suis lacrimatur inimicus, et quasi adjuvans suffodiet plantas tuas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Caput suum movebit, et plaudet manu, et multa susurrans commutabit vultum suum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hi "text\":\"Do good to the just, and thou shalt find great recompense: and if not of him, assuredly of the Lord.\"},{\"verse\":3,\"text\":\"For there is no good for him that is always occupied in evil, and that giveth no alms: for the Highest hateth sinners, and hath mercy on the penitent.\"},{\"verse\":4,\"text\":\"Give to the merciful and uphold not the sinner: God will repay vengeance to the ungodly and to sinners, and keep them against the day of vengeance.\"},{\"verse\":5,\"text\":\"Give to the good, and receive not a sinner.\"},{\"verse\":6,\"text\":\"Do good to the humble, and give not to the ungodly: hold back thy bread, and give it not to him, lest thereby he overmaster thee.\"},{\"verse\":7,\"text\":\"For thou shalt receive twice as much evil for all the good thou shalt have done to him: for the Highest also hateth sinners, and will repay vengeance to the ungodly.\"},{\"verse\":8,\"text\":\"A friend shall not be known in prosperity, and an enemy shall not be hidden in adversity.\"},{\"verse\":9,\"text\":\"In the prosperity of a man, his enemies are grieved: and a friend is known in his adversity.\"},{\"verse\":10,\"text\":\"Never trust thy enemy for as a brass pot his wickedness rusteth:\"},{\"verse\":11,\"text\":\"Though he humble himself and go crouching, yet take good heed and beware of him.\"},{\"verse\":12,\"text\":\"Set him not by thee, neither let him sit on thy right hand, lest he turn into thy place, and seek to take thy seat and at the last thou acknowledge my words, and be pricked with my sayings.\"},{\"verse\":13,\"text\":\"Who will pity an enchanter struck by a serpent, or any that come near wild beasts? so is it with him that keepeth company with a wicked man, and is involved in his sins.\"},{\"verse\":14,\"text\":\"For an hour he will abide with thee: but if thou begin to decline, he will not endure it.\"},{\"verse\":15,\"text\":\"An enemy speaketh sweetly with his lips, but in his heart he lieth in wait, to throw thee into a pit.\"},{\"verse\":16,\"text\":\"An enemy weepeth with his eyes: but if he find an opportunity he will not be satisfied with blood:\"},{\"verse\":17,\"text\":\"And if evils come upon thee, thou shalt find him there first.\"},{\"verse\":18,\"text\":\"An enemy hath tears in his eyes, and while he pretendeth to help thee, will undermine thy feet.\"},{\"verse\":19,\"text\":\"He will shake his head, and clap his hands, and whisper much, and change his countenance.\"}],\"vul\":[{\"verse\":1,\"text\":\"Si benefeceris, scito cui feceris, et erit gratia in bonis tuis multa.\"},{\"verse\":2,\"text\":\"Benefac justo, et invenies retributionem magnam : et si non ab ipso, certe a Domino.\"},{\"verse\":3,\"text\":\"Non est enim ei bene qui assiduus est in malis, et eleemosynas non danti : quoniam et Altissimus odio habet peccatores, et misertus est pœnitentibus.\"},{\"verse\":4,\"text\":\"Da misericordi, et ne suscipias peccatorem : et impiis et peccatoribus reddet vindictam, custodiens eos in diem vindictæ.\"},{\"verse\":5,\"text\":\"Da bono, et non receperis peccatorem.\"},{\"verse\":6,\"text\":\"Benefac humili, et non dederis impio : prohibe panes illi dari, ne in ipsis potentior te sit :\"},{\"verse\":7,\"text\":\"nam duplicia mala invenies in omnibus bonis quæcumque feceris illi, quoniam et Altissimus odio habet peccatores, et impiis reddet vindictam.\"},{\"verse\":8,\"text\":\"Non agnoscetur in bonis amicus, et non abscondetur in malis inimicus.\"},{\"verse\":9,\"text\":\"In bonis viri, inimici illius in tristitia : et in malitia illius, amicus agnitus est.\"},{\"verse\":10,\"text\":\"Non credas inimico tuo in æternum : sicut enim æramentum æruginat nequitia illius :\"},{\"verse\":11,\"text\":\"et si humiliatus vadat curvus, adjice animum tuum, et custodi te ab illo.\"},{\"verse\":12,\"text\":\"Non statuas illum penes te, nec sedeat ad dexteram tuam, ne forte conversus in locum tuum, inquirat cathedram tuam, et in novissimo agnosces verba mea, et in sermonibus meis stimuleris.\"},{\"verse\":13,\"text\":\"Quis miserebitur incantatori a serpente percusso, et omnibus qui appropiant bestiis ? et sic qui comitatur cum viro iniquo, et obvolutus est in peccatis ejus.\"},{\"verse\":14,\"text\":\"Una hora tecum permanebit : si autem declinaveris, non supportabit.\"},{\"verse\":15,\"text\":\"In labiis suis indulcat inimicus, et in corde suo insidiatur ut subvertat te in foveam.\"},{\"verse\":16,\"text\":\"In oculis suis lacrimatur inimicus, et si invenerit tempus, non satiabitur sanguine.\"},{\"verse\":17,\"text\":\"Et si incurrerint tibi mala, invenies eum illic priorem.\"},{\"verse\":18,\"text\":\"In oculis suis lacrimatur inimicus, et quasi adjuvans suffodiet plantas tuas.\"},{\"verse\":19,\"text\":\"Caput suum movebit, et plaudet manu, et multa susurrans commutabit vultum suum.\"}],\"summary\":\"We are to be liberal to the just: and not to trust the wicked.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":11,\"label\":\"Sirach 11\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":13,\"label\":\"Sirach 13\"}}]]\n"])</script></body></html>
