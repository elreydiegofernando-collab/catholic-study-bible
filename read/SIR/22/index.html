erif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The sluggard is pelted with a dirty stone, and all men will speak of his disgrace.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The sluggard is pelted with the dung of oxen: and every one that toucheth him will shake his hands.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A son ill taught is the confusion of the father: and a foolish daughter shall be to his loss.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>A wise daughter shall bring an inheritance to her husband: but she that confoundeth, becometh a disgrace to her father.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>She that is bold shameth both her father and husband, and will not be inferior to the ungodly: and shall be disgraced by them both.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A tale out of time is like music in mourning: but the stripes and instruction of wisdom are never out of time.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that teacheth a fool, is like one that glueth a potsherd together.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that telleth a word to him that heareth not, is like one that waketh a man out of a deep sleep.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He speaketh with one that is asleep, who uttereth wisdom to a fool: and in the end of the discourse he saith: Who is this?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Weep for the dead, for his light hath failed: and weep for the fool, for his understanding faileth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Weep but a little for the dead, for he is at rest.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For the wicked life of a wicked fool is worse than death.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The mourning for the dead is seven days: but for a fool and an ungodly man all the days of their life.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Talk not much with a fool and go not with him that hath no sense.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Keep thyself from him, that thou mayst not have trouble, and thou shalt not be defiled with his sin.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Turn away from him, and thou shalt find rest, and shalt not be wearied out with his folly.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>What is heavier than lead? and what other name hath he but fool?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sand and salt, and a mass of iron is easier to bear, than a man without sense, that is both foolish and wicked.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A frame of wood bound together in the foundation of a building, shall not be loosed: so neither shall the heart that is established by advised counsel.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The thought of him that is wise at all times, shall not be depraved by fear.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>As pales set in high places, and plasterings made without cost, will not stand against the face of the wind:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>So also a fearful heart in the imagination of a fool shall not resist against the violence of fear.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>As a fearful heart in the thought of a fool at all times will not fear, so neither shall he that continueth always in the commandments of God.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He that pricketh the eye, bringeth out tears: and he that pricketh the heart, bringeth forth resentment.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He that flingeth a stone at birds, shall drive them away: so he that upbraideth his friend, breaketh friendship.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Although thou hast drawn a sword at a friend, despair not: for there may be a returning. To a friend,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>If thou hast opened a sad mouth, fear not, for there may be a reconciliation: except upbraiding, and reproach, and pride, and disclosing of secrets, or a treacherous wound: for in all these cases a friend will flee away.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Keep fidelity with a friend in his poverty, that in his prosperity also thou mayst rejoice.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>In the time of his trouble continue faithful to him, that thou mayst also be heir with him in his inheritance.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>As the vapour of a chimney, and the smoke of the fire goeth up before the fire: so also injurious words, and reproaches, and threats, before blood.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>I will not be ashamed to salute a friend, neither will I hide myself from his face: and if any evil happen to me by him, I will bear it.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But every one that shall hear it, will beware of him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who will set a guard before my mouth, and a sure seal upon my lips, that I fall not by them, and that my tongue destroy me not?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In lapide luteo lapidatus est piger : et omnes loquentur super aspernationem illius.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>De stercore boum lapidatus est piger : et omnis qui tetigerit eum excutiet manus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Confusio patris est de filio indisciplinato : filia autem in deminoratione fiet.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Filia prudens hæreditas viro suo : nam quæ confundit, in contumeliam fit genitoris.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Patrem et virum confundit audax, et ab impiis non minorabitur : ab utrisque autem inhonorabitur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Musica in luctu importuna narratio : flagella et doctrina in omni tempore sapientia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui docet fatuum, quasi qui conglutinat testam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui narrat verbum non audienti, quasi qui excitat dormientem de gravi somno.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cum dormiente loquitur qui enarrat stulto sapientiam : et in fine narrationis dicit : Quis est hic ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Supra mortuum plora, defecit enim lux ejus : et supra fatuum plora, defecit enim sensus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Modicum plora super mortuum, quoniam requievit :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>nequissimi enim nequissima vita super mortem fatui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Luctus mortui septem dies : fatui autem et impii omnes dies vitæ illorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cum stulto ne multum loquaris, et cum insensato ne abieris.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Serva te ab illo, ut non molestiam habeas, et non coinquinaberis peccato illius.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Deflecte ab illo, et invenies requiem, et non acediaberis in stultitia illius.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Super plumbum quid gravabitur ? et quod illi aliud nomen quam fatuus ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Arenam, et salem, et massam ferri facilius est ferre quam hominem imprudentem, et fatuum, et impium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Loramentum ligneum colligatum in fundamento ædificii non dissolvetur, sic et cor confirmatum in cogitatione consilii.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cogitatus sensati in omni tempore metu non depravabitur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sicut pali in excelsis, et cæmenta sine impensa posita, contra faciem venti non permanebunt :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>sic et cor timidum in cogitatione stulti contra impetum timoris non resistet.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sicut cor trepidum in cogitatione fatui omni tempore non metuet, sic et qui in præceptis Dei permanet semper.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pungens oculum deducit lacrimas, et qui pungit cor profert sensum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Mittens lapidem in volatilia, dejiciet illa : sic et qui conviciatur amico, dissolvit amicitiam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ad amicum etsi produxeris gladium, non desperes : est enim regressus. Ad amicum</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>si aperueris os triste, non timeas : est enim concordatio : excepto convitio, et improperio, et superbia, et mysterii revelatione, et plaga dolosa : in his omnibus effugiet amicus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Fidem posside cum amico in paupertate illius, ut et in bonis illius læteris.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>In tempore tribulationis illius permane illi fidelis, ut et in hæreditate illius cohæres sis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ante ignem camini vapor et fumus ignis inaltatur : sic et ante sanguinem maledicta, et contumeliæ, et minæ.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Amicum salutare non confundar, a facie illius non me abscondam : et si mala mihi evenerint per illum, sustinebo.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Omnis qui audiet cavebit se ab eo.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quis dabit ori meo custodiam, et super labia mea signaculum certum, ut non cadam ab ipsis, et lingua mea perdat me ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 21</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/23/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 23</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->22<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-labe "8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.22\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":22,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"The sluggard is pelted with a dirty stone, and all men will speak of his disgrace.\"},{\"verse\":2,\"text\":\"The sluggard is pelted with the dung of oxen: and every one that toucheth him will shake his hands.\"},{\"verse\":3,\"text\":\"A son ill taught is the confusion of the father: and a foolish daughter shall be to his loss.\"},{\"verse\":4,\"text\":\"A wise daughter shall bring an inheritance to her husband: but she that confoundeth, becometh a disgrace to her father.\"},{\"verse\":5,\"text\":\"She that is bold shameth both her father and husband, and will not be inferior to the ungodly: and shall be disgraced by them both.\"},{\"verse\":6,\"text\":\"A tale out of time is like music in mourning: but the stripes and instruction of wisdom are never out of time.\"},{\"verse\":7,\"text\":\"He that teacheth a fool, is like one that glueth a potsherd together.\"},{\"verse\":8,\"text\":\"He that telleth a word to him that heareth not, is like one that waketh a man out of a deep sleep.\"},{\"verse\":9,\"text\":\"He speaketh with one that is asleep, who uttereth wisdom to a fool: and in the end of the discourse he saith: Who is this?\"},{\"verse\":10,\"text\":\"Weep for the dead, for his light hath failed: and weep for the fool, for his understanding faileth.\"},{\"verse\":11,\"text\":\"Weep but a little for the dead, for he is at rest.\"},{\"verse\":12,\"text\":\"For the wicked life of a wicked fool is worse than death.\"},{\"verse\":13,\"text\":\"The mourning for the dead is seven days: but for a fool and an ungodly man all the days of their life.\"},{\"verse\":14,\"text\":\"Talk not much with a fool and go not with him that hath no sense.\"},{\"verse\":15,\"text\":\"Keep thyself from him, that thou mayst not have trouble, and thou shalt not be defiled with his sin.\"},{\"verse\":16,\"text\":\"Turn away from him, and thou shalt find rest, and shalt not be wearied out with his folly.\"},{\"verse\":17,\"text\":\"What is heavier than lead? and what other name hath he but fool?\"},{\"verse\":18,\"text\":\"Sand and salt, and a mass of iron is easier to bear, than a man without sense, that is both foolish and wicked.\"},{\"verse\":19,\"text\":\"A frame of wood bound together in the foundation of a building, shall not be loosed: so neither shall the heart that is established by advised counsel.\"},{\"verse\":20,\"text\":\"The thought of him that is wise at all times, shall not be depraved by fear.\"},{\"verse\":21,\"text\":\"As pales set in high places, and plasterings made without cost, will not stand against the face of the wind:\"},{\"verse\":22,\"text\":\"So also a fearful heart in the imagination of a fool shall not resist against the violence of fear.\"},{\"verse\":23,\"text\":\"As a fearful heart in the thought of a fool at all times will not fear, so neither shall he that continueth always in the commandments of God.\"},{\"verse\":24,\"text\":\"He that pricketh the eye, bringeth out tears: and he that pricketh the heart, bringeth forth resentment.\"},{\"verse\":25,\"text\":\"He that flingeth a stone at birds, shall drive them away: so he that upbraideth his friend, breaketh friendship.\"},{\"verse\":26,\"text\":\"Although thou hast drawn a sword at a friend, despair not: for there may be a returning. To a friend,\"},{\"verse\":27,\"text\":\"If thou hast opened a sad mouth, fear not, for there may be a reconciliation: except upbraiding, and reproach, and pride, and disclosing of secrets, or a treacherous wound: for in all these cases a friend will flee away.\"},{\"verse\":28,\"text\":\"Keep fidelity with a friend in his poverty, that in his prosperity also thou mayst rejoice.\"},{\"verse\":29,\"text\":\"In the time of his trouble continue faithful to him, that thou mayst also be heir with him in his inheritance.\"},{\"verse\":30,\"text\":\"As the vapour of a chimney, and the smoke of the fire goeth up before the fire: so also injurious words, and reproaches, and threats, before blood.\"},{\"verse\":31,\"text\":\"I will not be ashamed to salute a friend, neither will I hide myself from his face: and if any evil happen to me by him, I will bear it.\"},{\"verse\":32,\"text\":\"But every one that shall hear it, will beware of him.\"},{\"verse\":33,\"text\":\"Who will set a guard before my mouth, and a sure seal upon my lips, that I fall not by them, and that my tongue destroy me not?\"}],\"vul\":[{\"verse\":1,\"text\":\"In lapide luteo lapidatus est piger : et omnes loquentur super aspernationem illius.\"},{\"verse\":2,\"text\":\"De stercore boum lapidatus est piger : et omnis qui tetigerit eum excutiet manus.\"},{\"verse\":3,\"text\":\"Confusio patris est de filio indisciplinato : filia autem in deminoratione fiet.\"},{\"verse\":4,\"text\":\"Filia prudens hæreditas viro suo : nam quæ confundit, in contumeliam fit genitoris.\"},{\"verse\":5,\"text\":\"Patrem et virum confundit audax, et ab impiis non minorabitur : ab utrisque autem inhonorabitur.\"},{\"verse\":6,\"text\":\"Musica in luctu importuna narratio : flagella et doctrina in omni tempore sapientia.\"},{\"verse\":7,\"text\":\"Qui docet fatuum, quasi qui conglutinat testam.\"},{\"verse\":8,\"text\":\"Qui narrat verbum non audienti, quasi qui excitat dormientem de gravi somno.\"},{\"verse\":9,\"text\":\"Cum dormiente loquitur qui enarrat stulto sapientiam : et in fine narrationis dicit : Quis est hic ?\"},{\"verse\":10,\"text\":\"Supra mortuum plora, defecit enim lux ejus : et supra fatuum plora, defecit enim sensus.\"},{\"verse\":11,\"text\":\"Modicum plora super mortuum, quoniam requievit :\"},{\"verse\":12,\"text\":\"nequissimi enim nequissima vita super mortem fatui.\"},{\"verse\":13,\"text\":\"Luctus mortui septem dies : fatui autem et impii omnes dies vitæ illorum.\"},{\"verse\":14,\"text\":\"Cum stulto ne multum loquaris, et cum insensato ne abieris.\"},{\"verse\":15,\"text\":\"Serva te ab illo, ut non molestiam habeas, et non coinquinaberis peccato illius.\"},{\"verse\":16,\"text\":\"Deflecte ab illo, et invenies requiem, et non acediaberis in stultitia illius.\"},{\"verse\":17,\"text\":\"Super plumbum quid gravabitur ? et quod illi aliud nomen quam fatuus ?\"},{\"verse\":18,\"text\":\"Arenam, et salem, et massam ferri facilius est ferre quam hominem imprudentem, et fatuum, et impium.\"},{\"verse\":19,\"text\":\"Loramentum ligneum colligatum in fundamento ædificii non dissolvetur, sic et cor confirmatum in cogitatione consilii.\"},{\"verse\":20,\"text\":\"Cogitatus sensati in omni tempore metu non depravabitur.\"},{\"verse\":21,\"text\":\"Sicut pali in excelsis, et cæmenta sine impensa posita, contra faciem venti non permanebunt :\"},{\"verse\":22,\"text\":\"sic et cor timidum in cogitatione stulti contra impetum timoris non resistet.\"},{\"verse\":23,\"text\":\"Sicut cor trepidum in cogitatione fatui omni tempore non metuet, sic et qui in præceptis Dei permanet semper.\"},{\"verse\":24,\"text\":\"Pungens oculum deducit lacrimas, et qui pungit cor profert sensum.\"},{\"verse\":25,\"text\":\"Mittens lapidem in volatilia, dejiciet illa : sic et qui conviciatur amico, dissolvit amicitiam.\"},{\"verse\":26,\"text\":\"Ad amicum etsi produxeris gladium, non desperes : est enim regressus. Ad amicum\"},{\"verse\":27,\"text\":\"si aperueris os triste, non timeas : est enim concordatio : excepto convitio, et improperio, et superbia, et mysterii revelatione, et plaga dolosa : in his omnibus effugiet amicus.\"},{\"verse\":28,\"text\":\"Fidem posside cum amico in paupertate illius, ut et in bonis illius læteris.\"},{\"verse\":29,\"text\":\"In tempore tribulationis illius permane illi fidelis, ut et in hæreditate illius cohæres sis.\"},{\"verse\":30,\"text\":\"Ante ignem camini vapor et fumus ignis inaltatur : sic et ante sanguinem maledicta, et contumeliæ, et minæ.\"},{\"verse\":31,\"text\":\"Amicum salutare non confundar, a facie illius non me abscondam : et si mala mihi evenerint per illum, sustinebo.\"},{\"verse\":32,\"text\":\"Omnis qui audiet cavebit se ab eo.\"},{\"verse\":33,\"text\":\"Quis dabit ori meo custodiam, et super labia mea signaculum certum, ut non cadam ab ipsis, et lingua mea perdat me ?\"}],\"summary\":\"Wise sayings on divers subjects.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":21,\"label\":\"Sirach 21\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":23,\"label\":\"Sirach 23\"}}]]\n"])</script></body></html>
