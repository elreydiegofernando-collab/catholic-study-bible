[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Happy is the husband of a good wife: for the number of his years is double.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A virtuous woman rejoiceth her husband, and shall fulfil the years of his life in peace.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A good wife is a good portion, she shall be given in the portion of them that fear God, to a man for his good deeds.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Rich or poor, if his heart is good, his countenance shall be cheerful at all times.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Of three things my heart hath been afraid, and at the fourth my face hath trembled:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The accusation of a city, and the gathering together of the people:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And a false calumny, all are more grievous than death.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>A jealous woman is the grief and mourning of the heart.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>With a jealous woman is a scourge of the tongue which communicateth with all.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>As a yoke of oxen that is moved to and fro, so also is a wicked woman: he that hath hold of her, is as he that taketh hold of a scorpion.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>A drunken woman is a great wrath: and her reproach and shame shall not be hid.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The fornication of a woman shall be known by the haughtiness of her eyes and by her eyelids.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>On a daughter that turneth not away herself, set a strict watch: lest finding an opportunity she abuse herself.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Take heed of the impudence of her eyes, and wonder not if she slight thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>She will open her mouth as a thirsty traveller to the fountain, and will drink of every water near her, and will sit down by every hedge, and open her quiver against every arrow, until she fail.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The grace of a diligent woman shall delight her husband, and shall fat his bones.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Her discipline is the gift of God.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Such is a wise and silent woman, and there is nothing so much worth as a well instructed soul.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A holy and shamefaced woman is grace upon grace.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And no price is worthy of a continent soul.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>As the sun when it riseth to the world in the high places of God, so is the beauty of a good wife for the ornament of her house.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>As the lamp shining upon the holy candlestick, so is the beauty of the face in a ripe age,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>As golden pillars upon bases of silver, so are the firm feet upon the soles of a steady woman.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>As everlasting foundations upon a solid rock, so the commandments of God in the heart of a holy woman.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>At two things my heart is grieved, and the third bringeth anger upon me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A man of war fainting through poverty, and a man of sense despised:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he that passeth over from justice to sin, God hath prepared such an one for the sword.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Two sorts of callings have appeared to me hard and dangerous: a merchant is hardly free from negligence: and a huckster shall not be justified from the sins of the lips.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Mulieris bonæ beatus vir : numerus enim annorum illius duplex.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Mulier fortis oblectat virum suum, et annos vitæ illius in pace implebit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pars bona mulier bona, in parte timentium Deum dabitur viro pro factis bonis :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>divitis autem et pauperis cor bonum, in omni tempore vultus illorum hilaris.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A tribus timuit cor meum, et in quarto facies mea metuit :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>delaturam civitatis, et collectionem populi :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>calumniam mendacem super mortem omnia gravia :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>dolor cordis et luctus, mulier zelotypa.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In muliere zelotypa flagellum linguæ, omnibus communicans.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sicut boum jugum quod movetur, ita et mulier nequam : qui tenet illam quasi qui apprehendit scorpionem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mulier ebriosa ira magna, et contumelia : et turpitudo illius non tegetur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fornicatio mulieris in extollentia oculorum, et in palpebris illius agnoscetur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In filia non avertente se, firma custodiam, ne inventa occasione utatur se.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ab omni irreverentia oculorum ejus cave, et ne mireris si te neglexerit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sicut viator sitiens ad fontem os aperiet, et ab omni aqua proxima bibet, et contra omnem palum sedebit, et contra omnem sagittam aperiet pharetram donec deficiat.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Gratia mulieris sedulæ delectabit virum suum, et ossa illius impinguabit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Disciplina illius datum Dei est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Mulier sensata et tacita, non est immutatio eruditæ animæ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Gratia super gratiam mulier sancta et pudorata.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omnis autem ponderatio non est digna continentis animæ.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sicut sol oriens mundo in altissimis Dei, sic mulieris bonæ species in ornamentum domus ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Lucerna splendens super candelabrum sanctum, et species faciei super ætatem stabilem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Columnæ aureæ super bases argenteas, et pedes firmi super plantas stabilis mulieris.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Fundamenta æterna supra petram solidam, et mandata Dei in corde mulieris sanctæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In duobus contristatum est cor meum, et in tertio iracundia mihi advenit :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>vir bellator deficiens per inopiam ; et vir sensatus contemptus ;</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et qui transgreditur a justitia ad peccatum : Deus paravit eum ad rhomphæam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Duæ species difficiles et periculosæ mihi apparuerunt : difficile exuitur negotians a negligentia, et non justificabitur caupo a peccatis labiorum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 25</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/27/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 27</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->26<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 25" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d=" nhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"SIR.26\",{\"bookId\":26,\"usfm\":\"SIR\",\"bookName\":\"Sirach\",\"drName\":\"Ecclesiasticus\",\"chapter\":26,\"totalChapters\":51,\"dra\":[{\"verse\":1,\"text\":\"Happy is the husband of a good wife: for the number of his years is double.\"},{\"verse\":2,\"text\":\"A virtuous woman rejoiceth her husband, and shall fulfil the years of his life in peace.\"},{\"verse\":3,\"text\":\"A good wife is a good portion, she shall be given in the portion of them that fear God, to a man for his good deeds.\"},{\"verse\":4,\"text\":\"Rich or poor, if his heart is good, his countenance shall be cheerful at all times.\"},{\"verse\":5,\"text\":\"Of three things my heart hath been afraid, and at the fourth my face hath trembled:\"},{\"verse\":6,\"text\":\"The accusation of a city, and the gathering together of the people:\"},{\"verse\":7,\"text\":\"And a false calumny, all are more grievous than death.\"},{\"verse\":8,\"text\":\"A jealous woman is the grief and mourning of the heart.\"},{\"verse\":9,\"text\":\"With a jealous woman is a scourge of the tongue which communicateth with all.\"},{\"verse\":10,\"text\":\"As a yoke of oxen that is moved to and fro, so also is a wicked woman: he that hath hold of her, is as he that taketh hold of a scorpion.\"},{\"verse\":11,\"text\":\"A drunken woman is a great wrath: and her reproach and shame shall not be hid.\"},{\"verse\":12,\"text\":\"The fornication of a woman shall be known by the haughtiness of her eyes and by her eyelids.\"},{\"verse\":13,\"text\":\"On a daughter that turneth not away herself, set a strict watch: lest finding an opportunity she abuse herself.\"},{\"verse\":14,\"text\":\"Take heed of the impudence of her eyes, and wonder not if she slight thee.\"},{\"verse\":15,\"text\":\"She will open her mouth as a thirsty traveller to the fountain, and will drink of every water near her, and will sit down by every hedge, and open her quiver against every arrow, until she fail.\"},{\"verse\":16,\"text\":\"The grace of a diligent woman shall delight her husband, and shall fat his bones.\"},{\"verse\":17,\"text\":\"Her discipline is the gift of God.\"},{\"verse\":18,\"text\":\"Such is a wise and silent woman, and there is nothing so much worth as a well instructed soul.\"},{\"verse\":19,\"text\":\"A holy and shamefaced woman is grace upon grace.\"},{\"verse\":20,\"text\":\"And no price is worthy of a continent soul.\"},{\"verse\":21,\"text\":\"As the sun when it riseth to the world in the high places of God, so is the beauty of a good wife for the ornament of her house.\"},{\"verse\":22,\"text\":\"As the lamp shining upon the holy candlestick, so is the beauty of the face in a ripe age,\"},{\"verse\":23,\"text\":\"As golden pillars upon bases of silver, so are the firm feet upon the soles of a steady woman.\"},{\"verse\":24,\"text\":\"As everlasting foundations upon a solid rock, so the commandments of God in the heart of a holy woman.\"},{\"verse\":25,\"text\":\"At two things my heart is grieved, and the third bringeth anger upon me.\"},{\"verse\":26,\"text\":\"A man of war fainting through poverty, and a man of sense despised:\"},{\"verse\":27,\"text\":\"And he that passeth over from justice to sin, God hath prepared such an one for the sword.\"},{\"verse\":28,\"text\":\"Two sorts of callings have appeared to me hard and dangerous: a merchant is hardly free from negligence: and a huckster shall not be justified from the sins of the lips.\"}],\"vul\":[{\"verse\":1,\"text\":\"Mulieris bonæ beatus vir : numerus enim annorum illius duplex.\"},{\"verse\":2,\"text\":\"Mulier fortis oblectat virum suum, et annos vitæ illius in pace implebit.\"},{\"verse\":3,\"text\":\"Pars bona mulier bona, in parte timentium Deum dabitur viro pro factis bonis :\"},{\"verse\":4,\"text\":\"divitis autem et pauperis cor bonum, in omni tempore vultus illorum hilaris.\"},{\"verse\":5,\"text\":\"A tribus timuit cor meum, et in quarto facies mea metuit :\"},{\"verse\":6,\"text\":\"delaturam civitatis, et collectionem populi :\"},{\"verse\":7,\"text\":\"calumniam mendacem super mortem omnia gravia :\"},{\"verse\":8,\"text\":\"dolor cordis et luctus, mulier zelotypa.\"},{\"verse\":9,\"text\":\"In muliere zelotypa flagellum linguæ, omnibus communicans.\"},{\"verse\":10,\"text\":\"Sicut boum jugum quod movetur, ita et mulier nequam : qui tenet illam quasi qui apprehendit scorpionem.\"},{\"verse\":11,\"text\":\"Mulier ebriosa ira magna, et contumelia : et turpitudo illius non tegetur.\"},{\"verse\":12,\"text\":\"Fornicatio mulieris in extollentia oculorum, et in palpebris illius agnoscetur.\"},{\"verse\":13,\"text\":\"In filia non avertente se, firma custodiam, ne inventa occasione utatur se.\"},{\"verse\":14,\"text\":\"Ab omni irreverentia oculorum ejus cave, et ne mireris si te neglexerit.\"},{\"verse\":15,\"text\":\"Sicut viator sitiens ad fontem os aperiet, et ab omni aqua proxima bibet, et contra omnem palum sedebit, et contra omnem sagittam aperiet pharetram donec deficiat.\"},{\"verse\":16,\"text\":\"Gratia mulieris sedulæ delectabit virum suum, et ossa illius impinguabit.\"},{\"verse\":17,\"text\":\"Disciplina illius datum Dei est.\"},{\"verse\":18,\"text\":\"Mulier sensata et tacita, non est immutatio eruditæ animæ.\"},{\"verse\":19,\"text\":\"Gratia super gratiam mulier sancta et pudorata.\"},{\"verse\":20,\"text\":\"Omnis autem ponderatio non est digna continentis animæ.\"},{\"verse\":21,\"text\":\"Sicut sol oriens mundo in altissimis Dei, sic mulieris bonæ species in ornamentum domus ejus.\"},{\"verse\":22,\"text\":\"Lucerna splendens super candelabrum sanctum, et species faciei super ætatem stabilem.\"},{\"verse\":23,\"text\":\"Columnæ aureæ super bases argenteas, et pedes firmi super plantas stabilis mulieris.\"},{\"verse\":24,\"text\":\"Fundamenta æterna supra petram solidam, et mandata Dei in corde mulieris sanctæ.\"},{\"verse\":25,\"text\":\"In duobus contristatum est cor meum, et in tertio iracundia mihi advenit :\"},{\"verse\":26,\"text\":\"vir bellator deficiens per inopiam ; et vir sensatus contemptus ;\"},{\"verse\":27,\"text\":\"et qui transgreditur a justitia ad peccatum : Deus paravit eum ad rhomphæam.\"},{\"verse\":28,\"text\":\"Duæ species difficiles et periculosæ mihi apparuerunt : difficile exuitur negotians a negligentia, et non justificabitur caupo a peccatis labiorum.\"}],\"summary\":\"Of good and bad women.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":25,\"label\":\"Sirach 25\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":27,\"label\":\"Sirach 27\"}}]]\n"])</script></body></html>
