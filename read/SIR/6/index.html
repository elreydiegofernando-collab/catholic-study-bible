1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of true and false friends: and of the of the fruits of wisdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Instead of a friend become not an enemy to thy neighbour: for an evil man shall inherit reproach and shame, so shall every sinner that is envious and double tongued.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Extol not thyself in the thoughts of thy soul like a bull: lest thy strength be quashed by folly,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And it eat up thy leaves, and destroy thy fruit, and thou be left as a dry tree in the wilderness.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For a wicked soul shall destroy him that hath it, and maketh him to be a joy to his enemies, and shall lead him into the lot of the wicked.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A sweet word multiplieth friends, and appeaseth enemies, and a gracious tongue in a good man aboundeth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Be in peace with many, but let one of a thousand be thy counsellor.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If thou wouldst get a friend, try him before thou takest him, and do not credit him easily.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For there is a friend for his own occasion, and he will not abide in the day of thy trouble.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And there is a friend that turneth to enmity; and there is a friend that will disclose hatred and strife and reproaches.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And there is a friend a companion at the table, and he will not abide in the day of distress.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>A friend if he continue steadfast, shall be to thee as thyself, and shall act with confidence among them of thy household.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If he humble himself before thee, and hide himself from thy face, thou shalt have unanimous friendship for good.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Separate thyself from thy enemies, and take heed of thy friends.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>A faithful friend is a strong defence: and he that hath found him, hath found a treasure.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nothing can be compared to a faithful friend, and no weight of gold and silver is able to countervail the goodness of his fidelity.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A faithful friend is the medicine of life and immortality: and they that fear the Lord, shall find him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He that feareth God, shall likewise have good friendship: because according to him shall his friend be.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>My son, from thy youth up receive instruction, and even to thy grey hairs thou shalt find wisdom.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Come to her as one that plougheth, and soweth, and wait for her good fruits:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For in working about her thou shalt labour a little, and shalt quickly eat of her fruits.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>How very unpleasant is wisdom to the unlearned, and the unwise will not continue with her.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>She shall be to them as a mighty stone of trial, and they will cast her from them before it be long.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For the wisdom of doctrine is according to her name, and she is not manifest unto many, but with them to whom she is known, she continueth even to the sight of God.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Give ear, my son, and take wise counsel, and cast not away my advice.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Put thy feet into her fetters, and thy neck into her chains:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Bow down thy shoulder, and bear her, and be not grieved with her bands.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Come to her with all thy mind, and keep her ways with all thy power.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Search for her, and she shall be made known to thee, and when thou hast gotten her, let her not go:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For in the latter end thou shalt find rest in her, and she shall be turned to thy joy.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Then shall her fetters be a strong defence for thee, and a firm foundation, and her chain a robe of glory:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For in her is the beauty of life, and her bands are a healthful binding.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Thou shalt put her on as a robe of glory, and thou shalt set her upon thee as a crown of joy.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>My son, if thou wilt attend to me, thou shalt learn: and if thou wilt apply thy mind, thou shalt be wise.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>If thou wilt incline thy ear, thou shalt receive instruction: and if thou love to hear, thou shalt be wise.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Stand in the multitude of ancients that are wise, and join thyself from thy heart to their wisdom, that thou mayst hear every discourse of God, and the sayings of praise may not escape thee.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And if thou see a man of understanding, go to him early in the morning, and let thy foot wear the steps of his doors.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Let thy thoughts be upon the precepts of God, and meditate continually on his commandments: and he will give thee a heart, and the desire of wisdom shall be given to thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Noli fieri pro amico inimicus proximo : improperium enim et contumeliam malus hæreditabit : et omnis peccator invidus et bilinguis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Non te extollas in cogitatione animæ tuæ velut taurus, ne forte elidatur virtus tua per stultitiam :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et folia tua comedat, et fructus tuos perdat, et relinquaris velut lignum aridum in eremo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Anima enim nequam disperdet qui se habet, et in gaudium inimicis dat illum, et deducet in sortem impiorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Verbum dulce multiplicat amicos et mitigat inimicos, et lingua eucharis in bono homine abundat.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Multi pacifici sint tibi : et consiliarius sit tibi unus de mille.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si possides amicum, in tentatione posside eum, et ne facile credas ei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Est enim amicus secundum tempus suum, et non permanebit in die tribulationis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et est amicus qui convertitur ad inimicitiam, et est amicus qui odium et rixam et convitia denudabit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Est autem amicus socius mensæ, et non permanebit in die necessitatis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Amicus si permanserit fixus, erit tibi quasi coæqualis, et in domesticis tuis fiducialiter aget.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si humiliaverit se contra te, et a facie tua absconderit se, unanimem habebis amicitiam bonam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ab inimicis tuis separare, et ab amicis tuis attende.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Amicus fidelis protectio fortis : qui autem invenit illum, invenit thesaurum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Amico fideli nulla est comparatio, et non est digna ponderatio auri et argenti contra bonitatem fidei illius.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Amicus fidelis medicamentum vitæ et immortalitatis : et qui metuunt Dominum, invenient illum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui timet Deum æque habebit amicitiam bonam, quoniam secundum illum erit amicus illius.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Fili, a juventute tua excipe doctrinam, et usque ad canos invenies sapientiam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quasi is qui arat et seminat accede ad eam, et sustine bonos fructus illius.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In opere enim ipsius exiguum laborabis, et cito edes de generationibus illius.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quam aspera est nimium sapientia indoctis hominibus ! et non permanebit in illa excors.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quasi lapidis virtus probatio erit in illis : et non demorabuntur projicere illam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sapientia enim doctrinæ secundum nomen est ejus, et non est multis manifestata : quibus autem cognita est, permanet usque ad conspectum Dei.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Audi, fili, et accipe consilium intellectus, et ne abjicias consilium meum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Injice pedem tuum in compedes illius, et in torques illius collum tuum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Subjice humerum tuum, et porta illam, et ne acedieris vinculis ejus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In omni animo tuo accede ad illam, et in omni virtute tua conserva vias ejus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Investiga illam, et manifestabitur tibi : et continens factus, ne derelinquas eam :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>in novissimis enim invenies requiem in ea, et convertetur tibi in oblectationem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et erunt tibi compedes ejus in protectionem fortitudinis et bases virtutis, et torques illius in stolam gloriæ :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>decor enim vitæ est in illa, et vincula illius alligatura salutaris.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Stolam gloriæ indues eam, et coronam gratulationis superpones tibi.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Fili, si attenderis mihi, disces : et si accommodaveris animum tuum, sapiens eris.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Si inclinaveris aurem tuam, excipies doctrinam : et si dilexeris audire, sapiens eris.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>In multitudine presbyterorum prudentium sta, et sapientiæ illorum ex corde conjungere, ut omnem narrationem Dei possis audire, et proverbia laudis non effugiant a te.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et si videris sensatum, evigila ad eum, et gradus ostiorum illius exterat pes tuus.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Cogitatum tuum habe in præceptis Dei, et in mandatis illius maxime assiduus esto : et ipse dabit tibi cor, et concupiscentia sapientiæ dabitur tibi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center d shall act with confidence among them of thy household.\"},{\"verse\":12,\"text\":\"If he humble himself before thee, and hide himself from thy face, thou shalt have unanimous friendship for good.\"},{\"verse\":13,\"text\":\"Separate thyself from thy enemies, and take heed of thy friends.\"},{\"verse\":14,\"text\":\"A faithful friend is a strong defence: and he that hath found him, hath found a treasure.\"},{\"verse\":15,\"text\":\"Nothing can be compared to a faithful friend, and no weight of gold and silver is able to countervail the goodness of his fidelity.\"},{\"verse\":16,\"text\":\"A faithful friend is the medicine of life and immortality: and they that fear the Lord, shall find him.\"},{\"verse\":17,\"text\":\"He that feareth God, shall likewise have good friendship: because according to him shall his friend be.\"},{\"verse\":18,\"text\":\"My son, from thy youth up receive instruction, and even to thy grey hairs thou shalt find wisdom.\"},{\"verse\":19,\"text\":\"Come to her as one that plougheth, and soweth, and wait for her good fruits:\"},{\"verse\":20,\"text\":\"For in working about her thou shalt labour a little, and shalt quickly eat of her fruits.\"},{\"verse\":21,\"text\":\"How very unpleasant is wisdom to the unlearned, and the unwise will not continue with her.\"},{\"verse\":22,\"text\":\"She shall be to them as a mighty stone of trial, and they will cast her from them before it be long.\"},{\"verse\":23,\"text\":\"For the wisdom of doctrine is according to her name, and she is not manifest unto many, but with them to whom she is known, she continueth even to the sight of God.\"},{\"verse\":24,\"text\":\"Give ear, my son, and take wise counsel, and cast not away my advice.\"},{\"verse\":25,\"text\":\"Put thy feet into her fetters, and thy neck into her chains:\"},{\"verse\":26,\"text\":\"Bow down thy shoulder, and bear her, and be not grieved with her bands.\"},{\"verse\":27,\"text\":\"Come to her with all thy mind, and keep her ways with all thy power.\"},{\"verse\":28,\"text\":\"Search for her, and she shall be made known to thee, and when thou hast gotten her, let her not go:\"},{\"verse\":29,\"text\":\"For in the latter end thou shalt find rest in her, and she shall be turned to thy joy.\"},{\"verse\":30,\"text\":\"Then shall her fetters be a strong defence for thee, and a firm foundation, and her chain a robe of glory:\"},{\"verse\":31,\"text\":\"For in her is the beauty of life, and her bands are a healthful binding.\"},{\"verse\":32,\"text\":\"Thou shalt put her on as a robe of glory, and thou shalt set her upon thee as a crown of joy.\"},{\"verse\":33,\"text\":\"My son, if thou wilt attend to me, thou shalt learn: and if thou wilt apply thy mind, thou shalt be wise.\"},{\"verse\":34,\"text\":\"If thou wilt incline thy ear, thou shalt receive instruction: and if thou love to hear, thou shalt be wise.\"},{\"verse\":35,\"text\":\"Stand in the multitude of ancients that are wise, and join thyself from thy heart to their wisdom, that thou mayst hear every discourse of God, and the sayings of praise may not escape thee.\"},{\"verse\":36,\"text\":\"And if thou see a man of understanding, go to him early in the morning, and let thy foot wear the steps of his doors.\"},{\"verse\":37,\"text\":\"Let thy thoughts be upon the precepts of God, and meditate continually on his commandments: and he will give thee a heart, and the desire of wisdom shall be given to thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Noli fieri pro amico inimicus proximo : improperium enim et contumeliam malus hæreditabit : et omnis peccator invidus et bilinguis.\"},{\"verse\":2,\"text\":\"Non te extollas in cogitatione animæ tuæ velut taurus, ne forte elidatur virtus tua per stultitiam :\"},{\"verse\":3,\"text\":\"et folia tua comedat, et fructus tuos perdat, et relinquaris velut lignum aridum in eremo.\"},{\"verse\":4,\"text\":\"Anima enim nequam disperdet qui se habet, et in gaudium inimicis dat illum, et deducet in sortem impiorum.\"},{\"verse\":5,\"text\":\"Verbum dulce multiplicat amicos et mitigat inimicos, et lingua eucharis in bono homine abundat.\"},{\"verse\":6,\"text\":\"Multi pacifici sint tibi : et consiliarius sit tibi unus de mille.\"},{\"verse\":7,\"text\":\"Si possides amicum, in tentatione posside eum, et ne facile credas ei.\"},{\"verse\":8,\"text\":\"Est enim amicus secundum tempus suum, et non permanebit in die tribulationis.\"},{\"verse\":9,\"text\":\"Et est amicus qui convertitur ad inimicitiam, et est amicus qui odium et rixam et convitia denudabit.\"},{\"verse\":10,\"text\":\"Est autem amicus socius mensæ, et non permanebit in die necessitatis.\"},{\"verse\":11,\"text\":\"Amicus si permanserit fixus, erit tibi quasi coæqualis, et in domesticis tuis fiducialiter aget.\"},{\"verse\":12,\"text\":\"Si humiliaverit se contra te, et a facie tua absconderit se, unanimem habebis amicitiam bonam.\"},{\"verse\":13,\"text\":\"Ab inimicis tuis separare, et ab amicis tuis attende.\"},{\"verse\":14,\"text\":\"Amicus fidelis protectio fortis : qui autem invenit illum, invenit thesaurum.\"},{\"verse\":15,\"text\":\"Amico fideli nulla est comparatio, et non est digna ponderatio auri et argenti contra bonitatem fidei illius.\"},{\"verse\":16,\"text\":\"Amicus fidelis medicamentum vitæ et immortalitatis : et qui metuunt Dominum, invenient illum.\"},{\"verse\":17,\"text\":\"Qui timet Deum æque habebit amicitiam bonam, quoniam secundum illum erit amicus illius.\"},{\"verse\":18,\"text\":\"Fili, a juventute tua excipe doctrinam, et usque ad canos invenies sapientiam.\"},{\"verse\":19,\"text\":\"Quasi is qui arat et seminat accede ad eam, et sustine bonos fructus illius.\"},{\"verse\":20,\"text\":\"In opere enim ipsius exiguum laborabis, et cito edes de generationibus illius.\"},{\"verse\":21,\"text\":\"Quam aspera est nimium sapientia indoctis hominibus ! et non permanebit in illa excors.\"},{\"verse\":22,\"text\":\"Quasi lapidis virtus probatio erit in illis : et non demorabuntur projicere illam.\"},{\"verse\":23,\"text\":\"Sapientia enim doctrinæ secundum nomen est ejus, et non est multis manifestata : quibus autem cognita est, permanet usque ad conspectum Dei.\"},{\"verse\":24,\"text\":\"Audi, fili, et accipe consilium intellectus, et ne abjicias consilium meum.\"},{\"verse\":25,\"text\":\"Injice pedem tuum in compedes illius, et in torques illius collum tuum.\"},{\"verse\":26,\"text\":\"Subjice humerum tuum, et porta illam, et ne acedieris vinculis ejus.\"},{\"verse\":27,\"text\":\"In omni animo tuo accede ad illam, et in omni virtute tua conserva vias ejus.\"},{\"verse\":28,\"text\":\"Investiga illam, et manifestabitur tibi : et continens factus, ne derelinquas eam :\"},{\"verse\":29,\"text\":\"in novissimis enim invenies requiem in ea, et convertetur tibi in oblectationem.\"},{\"verse\":30,\"text\":\"Et erunt tibi compedes ejus in protectionem fortitudinis et bases virtutis, et torques illius in stolam gloriæ :\"},{\"verse\":31,\"text\":\"decor enim vitæ est in illa, et vincula illius alligatura salutaris.\"},{\"verse\":32,\"text\":\"Stolam gloriæ indues eam, et coronam gratulationis superpones tibi.\"},{\"verse\":33,\"text\":\"Fili, si attenderis mihi, disces : et si accommodaveris animum tuum, sapiens eris.\"},{\"verse\":34,\"text\":\"Si inclinaveris aurem tuam, excipies doctrinam : et si dilexeris audire, sapiens eris.\"},{\"verse\":35,\"text\":\"In multitudine presbyterorum prudentium sta, et sapientiæ illorum ex corde conjungere, ut omnem narrationem Dei possis audire, et proverbia laudis non effugiant a te.\"},{\"verse\":36,\"text\":\"Et si videris sensatum, evigila ad eum, et gradus ostiorum illius exterat pes tuus.\"},{\"verse\":37,\"text\":\"Cogitatum tuum habe in præceptis Dei, et in mandatis illius maxime assiduus esto : et ipse dabit tibi cor, et concupiscentia sapientiæ dabitur tibi.\"}],\"summary\":\"Of true and false friends: and of the of the fruits of wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":5,\"label\":\"Sirach 5\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":7,\"label\":\"Sirach 7\"}}]]\n"])</script></body></html>
