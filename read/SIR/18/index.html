20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">18</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Ecclesiasticus</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God’s works are wonderful: we must serve him, and not our lusts.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that liveth for ever created all things together. God only shall be justified, and he remaineth an invincible king for ever.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who is able to declare his works?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For who shall search out his glorious acts?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And who shall show forth the power of his majesty? or who shall be able to declare his mercy?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nothing may be taken away, nor added, neither is it possible to find out the glorious works of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>When a man hath done, then shall he begin: and when he leaveth off, he shall be at a loss.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>What is man, and what is his grace? and what is his good, or what is his evil?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The number of the days of men at the most are a hundred years, as a drop of water of the sea are they esteemed: and as a pebble of the sand, so are a few years compared to eternity.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Therefore God is patient in them, and poureth forth his mercy upon them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He hath seen the presumption of their heart that it is wicked, and hath known their end that it is evil.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore hath he filled up his mercy in their favour, and hath shewn them the way of justice.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The compassion of man is toward his neighbour: but the mercy of God is upon all flesh.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He hath mercy, and teacheth, and correcteth, as a shepherd doth his flock.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He hath mercy on him that receiveth the discipline of mercy, and that maketh haste in his judgments.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My son, in thy good deeds, make no complaint, and when thou givest any thing, add not grief by an evil word.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Shall not the dew assuage the heat? so also the good word is better than the gift.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Lo, is not a word better than a gift? but both are with a justified man.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A fool will upbraid bitterly: and a gift of one ill taught consumeth the eyes.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Before judgment prepare thee justice, and learn before thou speak.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Before sickness take a medicine, and before judgment examine thyself, and thou shalt find mercy in the sight of God.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Humble thyself before thou art sick, and in the time of sickness shew thy conversation.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Let nothing hinder thee from praying always, and be not afraid to be justified even to death: for the reward of God continueth for ever.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Before prayer prepare thy soul: and be not as a man that tempteth God.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Remember the wrath that shall be at the last day, and the time of repaying when he shall turn away his face.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Remember poverty in the time of abundance, and the necessities of poverty in the day of riches.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>From the morning until the evening the time shall be changed, and all these are swift in the eyes of God.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>A wise man will fear in every thing, and in the days of sins will beware of sloth.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Every man of understanding knoweth wisdom, and will give praise to him that findeth her.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>They that were of good understanding in words, have also done wisely themselves: and have understood truth and justice, and have poured forth proverbs and judgments.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Go not after thy lusts, but turn away from thy own will.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>If thou give to thy soul her desires, she will make thee a joy to thy enemies.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Take no pleasure in riotous assemblies, be they ever so small: for their concertation is continual.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Make not thyself poor by borrowing to contribute to feasts when thou hast nothing in thy purse: for thou shalt be an enemy to thy own life.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui vivet in æternum creavit omnia simul. Deus solus justificabitur, et manet invictus rex in æternum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quis sufficit enarrare opera illius ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>quis enim investigabit magnalia ejus ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>virtutem autem magnitudinis ejus quis enuntiabit ? aut quis adjiciet enarrare misericordiam ejus ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non est minuere neque adjicere, nec est invenire magnalia Dei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cum consummaverit homo, tunc incipiet : et cum quieverit, aporiabitur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quid est homo ? et quæ est gratia illius ? et quid bonum aut quid nequam illius ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Numerus dierum hominum, ut multum centum anni, quasi gutta aquæ maris deputati sunt : et sicut calculus arenæ, sic exigui anni in die ævi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Propter hoc patiens est Deus in illis, et effundit super eos misericordiam suam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Vidit præsumptionem cordis eorum, quoniam mala est : et cognovit subversionem illorum, quoniam nequam est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ideo adimplevit propitiationem suam in illis, et ostendit eis viam æquitatis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Miseratio hominis circa proximum suum : misericordia autem Dei super omnem carnem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui misericordiam habet, docet et erudit quasi pastor gregem suum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Miseretur excipientis doctrinam miserationis, et qui festinat in judiciis ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fili, in bonis non des querelam, et in omni dato non des tristitiam verbi mali.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nonne ardorem refrigerabit ros ? sic et verbum melius quam datum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nonne ecce verbum super datum bonum ? sed utraque cum homine justificato.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Stultus acriter improperabit : et datus indisciplinati tabescere facit oculos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ante judicium para justitiam tibi, et antequam loquaris, disce.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ante languorem adhibe medicinam : et ante judicium interroga teipsum, et in conspectu Dei invenies propitiationem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ante languorem humilia te, et in tempore infirmitatis ostende conversationem tuam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non impediaris orare semper, et ne verearis usque ad mortem justificari, quoniam merces Dei manet in æternum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ante orationem præpara animam tuam, et noli esse quasi homo qui tentat Deum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Memento iræ in die consummationis, et tempus retributionis in conversatione faciei.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Memento paupertatis in tempore abundantiæ, et necessitatum paupertatis in die divitiarum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A mane usque ad vesperam immutabitur tempus, et hæc omnia citata in oculis Dei.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Homo sapiens in omnibus metuet, et in diebus delictorum attendet ab inertia.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Omnis astutus agnoscit sapientiam, et invenienti eam dabit confessionem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Sensati in verbis et ipsi sapienter egerunt, et intellexerunt veritatem et justitiam, et impluerunt proverbia et judicia.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Post concupiscentias tuas non eas, et a voluntate tua avertere.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si præstes animæ tuæ concupiscentias ejus, faciat te in gaudium inimicis tuis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ne oblecteris in turbis nec in modicis : assidua enim est commissio illorum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Ne fueris mediocris in contentione ex fœnore, et est tibi nihil in sacculo : eris enim invidus vitæ tuæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 17</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/19/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 19</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->18<!-- --> of <!-- -->51<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Sirach 17" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><button type= ":1,\"text\":\"He that liveth for ever created all things together. God only shall be justified, and he remaineth an invincible king for ever.\"},{\"verse\":2,\"text\":\"Who is able to declare his works?\"},{\"verse\":3,\"text\":\"For who shall search out his glorious acts?\"},{\"verse\":4,\"text\":\"And who shall show forth the power of his majesty? or who shall be able to declare his mercy?\"},{\"verse\":5,\"text\":\"Nothing may be taken away, nor added, neither is it possible to find out the glorious works of God.\"},{\"verse\":6,\"text\":\"When a man hath done, then shall he begin: and when he leaveth off, he shall be at a loss.\"},{\"verse\":7,\"text\":\"What is man, and what is his grace? and what is his good, or what is his evil?\"},{\"verse\":8,\"text\":\"The number of the days of men at the most are a hundred years, as a drop of water of the sea are they esteemed: and as a pebble of the sand, so are a few years compared to eternity.\"},{\"verse\":9,\"text\":\"Therefore God is patient in them, and poureth forth his mercy upon them.\"},{\"verse\":10,\"text\":\"He hath seen the presumption of their heart that it is wicked, and hath known their end that it is evil.\"},{\"verse\":11,\"text\":\"Therefore hath he filled up his mercy in their favour, and hath shewn them the way of justice.\"},{\"verse\":12,\"text\":\"The compassion of man is toward his neighbour: but the mercy of God is upon all flesh.\"},{\"verse\":13,\"text\":\"He hath mercy, and teacheth, and correcteth, as a shepherd doth his flock.\"},{\"verse\":14,\"text\":\"He hath mercy on him that receiveth the discipline of mercy, and that maketh haste in his judgments.\"},{\"verse\":15,\"text\":\"My son, in thy good deeds, make no complaint, and when thou givest any thing, add not grief by an evil word.\"},{\"verse\":16,\"text\":\"Shall not the dew assuage the heat? so also the good word is better than the gift.\"},{\"verse\":17,\"text\":\"Lo, is not a word better than a gift? but both are with a justified man.\"},{\"verse\":18,\"text\":\"A fool will upbraid bitterly: and a gift of one ill taught consumeth the eyes.\"},{\"verse\":19,\"text\":\"Before judgment prepare thee justice, and learn before thou speak.\"},{\"verse\":20,\"text\":\"Before sickness take a medicine, and before judgment examine thyself, and thou shalt find mercy in the sight of God.\"},{\"verse\":21,\"text\":\"Humble thyself before thou art sick, and in the time of sickness shew thy conversation.\"},{\"verse\":22,\"text\":\"Let nothing hinder thee from praying always, and be not afraid to be justified even to death: for the reward of God continueth for ever.\"},{\"verse\":23,\"text\":\"Before prayer prepare thy soul: and be not as a man that tempteth God.\"},{\"verse\":24,\"text\":\"Remember the wrath that shall be at the last day, and the time of repaying when he shall turn away his face.\"},{\"verse\":25,\"text\":\"Remember poverty in the time of abundance, and the necessities of poverty in the day of riches.\"},{\"verse\":26,\"text\":\"From the morning until the evening the time shall be changed, and all these are swift in the eyes of God.\"},{\"verse\":27,\"text\":\"A wise man will fear in every thing, and in the days of sins will beware of sloth.\"},{\"verse\":28,\"text\":\"Every man of understanding knoweth wisdom, and will give praise to him that findeth her.\"},{\"verse\":29,\"text\":\"They that were of good understanding in words, have also done wisely themselves: and have understood truth and justice, and have poured forth proverbs and judgments.\"},{\"verse\":30,\"text\":\"Go not after thy lusts, but turn away from thy own will.\"},{\"verse\":31,\"text\":\"If thou give to thy soul her desires, she will make thee a joy to thy enemies.\"},{\"verse\":32,\"text\":\"Take no pleasure in riotous assemblies, be they ever so small: for their concertation is continual.\"},{\"verse\":33,\"text\":\"Make not thyself poor by borrowing to contribute to feasts when thou hast nothing in thy purse: for thou shalt be an enemy to thy own life.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui vivet in æternum creavit omnia simul. Deus solus justificabitur, et manet invictus rex in æternum.\"},{\"verse\":2,\"text\":\"Quis sufficit enarrare opera illius ?\"},{\"verse\":3,\"text\":\"quis enim investigabit magnalia ejus ?\"},{\"verse\":4,\"text\":\"virtutem autem magnitudinis ejus quis enuntiabit ? aut quis adjiciet enarrare misericordiam ejus ?\"},{\"verse\":5,\"text\":\"Non est minuere neque adjicere, nec est invenire magnalia Dei.\"},{\"verse\":6,\"text\":\"Cum consummaverit homo, tunc incipiet : et cum quieverit, aporiabitur.\"},{\"verse\":7,\"text\":\"Quid est homo ? et quæ est gratia illius ? et quid bonum aut quid nequam illius ?\"},{\"verse\":8,\"text\":\"Numerus dierum hominum, ut multum centum anni, quasi gutta aquæ maris deputati sunt : et sicut calculus arenæ, sic exigui anni in die ævi.\"},{\"verse\":9,\"text\":\"Propter hoc patiens est Deus in illis, et effundit super eos misericordiam suam.\"},{\"verse\":10,\"text\":\"Vidit præsumptionem cordis eorum, quoniam mala est : et cognovit subversionem illorum, quoniam nequam est.\"},{\"verse\":11,\"text\":\"Ideo adimplevit propitiationem suam in illis, et ostendit eis viam æquitatis.\"},{\"verse\":12,\"text\":\"Miseratio hominis circa proximum suum : misericordia autem Dei super omnem carnem.\"},{\"verse\":13,\"text\":\"Qui misericordiam habet, docet et erudit quasi pastor gregem suum.\"},{\"verse\":14,\"text\":\"Miseretur excipientis doctrinam miserationis, et qui festinat in judiciis ejus.\"},{\"verse\":15,\"text\":\"Fili, in bonis non des querelam, et in omni dato non des tristitiam verbi mali.\"},{\"verse\":16,\"text\":\"Nonne ardorem refrigerabit ros ? sic et verbum melius quam datum.\"},{\"verse\":17,\"text\":\"Nonne ecce verbum super datum bonum ? sed utraque cum homine justificato.\"},{\"verse\":18,\"text\":\"Stultus acriter improperabit : et datus indisciplinati tabescere facit oculos.\"},{\"verse\":19,\"text\":\"Ante judicium para justitiam tibi, et antequam loquaris, disce.\"},{\"verse\":20,\"text\":\"Ante languorem adhibe medicinam : et ante judicium interroga teipsum, et in conspectu Dei invenies propitiationem.\"},{\"verse\":21,\"text\":\"Ante languorem humilia te, et in tempore infirmitatis ostende conversationem tuam.\"},{\"verse\":22,\"text\":\"Non impediaris orare semper, et ne verearis usque ad mortem justificari, quoniam merces Dei manet in æternum.\"},{\"verse\":23,\"text\":\"Ante orationem præpara animam tuam, et noli esse quasi homo qui tentat Deum.\"},{\"verse\":24,\"text\":\"Memento iræ in die consummationis, et tempus retributionis in conversatione faciei.\"},{\"verse\":25,\"text\":\"Memento paupertatis in tempore abundantiæ, et necessitatum paupertatis in die divitiarum.\"},{\"verse\":26,\"text\":\"A mane usque ad vesperam immutabitur tempus, et hæc omnia citata in oculis Dei.\"},{\"verse\":27,\"text\":\"Homo sapiens in omnibus metuet, et in diebus delictorum attendet ab inertia.\"},{\"verse\":28,\"text\":\"Omnis astutus agnoscit sapientiam, et invenienti eam dabit confessionem.\"},{\"verse\":29,\"text\":\"Sensati in verbis et ipsi sapienter egerunt, et intellexerunt veritatem et justitiam, et impluerunt proverbia et judicia.\"},{\"verse\":30,\"text\":\"Post concupiscentias tuas non eas, et a voluntate tua avertere.\"},{\"verse\":31,\"text\":\"Si præstes animæ tuæ concupiscentias ejus, faciat te in gaudium inimicis tuis.\"},{\"verse\":32,\"text\":\"Ne oblecteris in turbis nec in modicis : assidua enim est commissio illorum.\"},{\"verse\":33,\"text\":\"Ne fueris mediocris in contentione ex fœnore, et est tibi nihil in sacculo : eris enim invidus vitæ tuæ.\"}],\"summary\":\"God’s works are wonderful: we must serve him, and not our lusts.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":17,\"label\":\"Sirach 17\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":19,\"label\":\"Sirach 19\"}}]]\n"])</script></body></html>
