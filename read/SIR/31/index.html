holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Sirach<!-- --> <span class="text-stone-500">31</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Ecclesiasticus</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/SIR/">About <!-- -->Sirach</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of the desire of riches, and of moderation in eating and drinking.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Watching for riches consumeth the flesh, and the thought thereof driveth away sleep.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The thinking beforehand turneth away the understanding, and a grievous sickness maketh the soul sober.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The rich man hath laboured in gathering riches together, and when he resteth he shall be filled with his goods.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The poor man hath laboured in his low way of life, and in the end he is still poor.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He that loveth gold, shall not be justified: and he that followeth after corruption, shall be filled with it.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Many have been brought to fall for gold, and the beauty thereof hath been their ruin.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Gold is a stumblingblock to them that sacrifice to it: woe to them that eagerly follow after it, and every fool shall perish by it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Blessed is the rich man that is found without blemish: and that hath not gone after gold, nor put his trust in money nor in treasures.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who is he, and we will praise him? for he hath done wonderful things in his life.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Who hath been tried thereby, and made perfect, he shall have glory everlasting. He that could have transgressed, and hath not transgressed: and could do evil things, and hath not done them:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore are his goods established in the Lord, and all the church of the saints shall declare his alms.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Art thou set at a great table? be not the first to open thy mouth upon it.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Say not: There are many things which are upon it.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Remember that a wicked eye is evil.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>What is created more wicked than an eye? therefore shall it weep over all the face when it shall see.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Stretch not out thy hand first, lest being disgraced with envy thou be put to confusion.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Be not hasty in a feast.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Judge of the disposition of thy neighbour by thyself.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Use as a frugal man the things that are set before thee: lest if thou eatest much, thou be hated.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Leave off first, for manners’ sake: and exceed not, lest thou offend.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And if thou sittest among many, reach not thy hand out first of all, and be not the first to ask for drink.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>How sufficient is a little wine for a man well taught, and in sleeping thou shalt not be uneasy with it, and thou shalt feel no pain.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Watching, and choler, and gripes, are with an intemperate man:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Sound and wholesome sleep with a moderate man: he shall sleep till morning, and his soul shall be delighted with him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And if thou hast been forced to eat much, arise, go out, and vomit: and it shall refresh thee, and thou shalt not bring sickness upon thy body.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Hear me, my son, and despise me not: and in the end thou shalt find my words.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In all thy works be quick, and no infirmity shall come to thee.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The lips of many shall bless him that is liberal of his bread, and the testimony of his truth is faithful.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Against him that is niggardly of his bread, the city will murmur, and the testimony of his niggardliness is true.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Challenge not them that love wine: for wine hath destroyed very many.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Fire trieth hard iron: so wine drunk to excess shall rebuke the hearts of the proud.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Wine taken with sobriety is equal life to men: if thou drink it moderately, thou shalt be sober.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>What is his life, who is diminished with wine?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>What taketh away life? death.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Wine was created from the beginning to make men joyful, and not to make them drunk.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Wine drunken with moderation is the joy of the soul and the heart.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Sober drinking is health to soul and body.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Wine drunken with excess raiseth quarrels, and wrath, and many ruins.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Wine drunken with excess is bitterness of the soul.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The heat of drunkenness is the stumblingblock of the fool, lessening strength and causing wounds.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Rebuke not thy neighbour in a banquet of wine: and despise him not in his mirth.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Speak not to him words of reproach: and press him not in demanding again.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vigilia honestatis tabefaciet carnes, et cogitatus illius auferet somnum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cogitatus præscientiæ avertit sensum, et infirmitas gravis sobriam facit animam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Laboravit dives in congregatione substantiæ, et in requie sua replebitur bonis suis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Laboravit pauper in diminutione victus, et in fine inops fit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui aurum diligit non justificabitur, et qui insequitur consumptionem replebitur ex ea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Multi dati sunt in auri casus, et facta est in specie ipsius perditio illorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Lignum offensionis est aurum sacrificantium : væ illis qui sectantur illud ! et omnis imprudens deperiet in illo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Beatus dives qui inventus est sine macula, et qui post aurum non abiit, nec speravit in pecunia et thesauris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quis est hic ? et laudabimus eum : fecit enim mirabilia in vita sua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui probatus est in illo, et perfectus est, erit illi gloria æterna : qui potuit transgredi, et non est transgressus ; facere mala, et non fecit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ideo stabilita sunt bona illius in Domino, et eleemosynas illius enarrabit omnis ecclesia sanctorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Supra mensam magnam sedisti ? non aperias super illam faucem tuam prior.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non dicas sic : Multa sunt, quæ super illam sunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Memento quoniam malus est oculus nequam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nequius oculo quid creatum est ? ideo ab omni facie sua lacrimabitur, cum viderit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ne extendas manum tuam prior, et invidia contaminatus erubescas.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ne comprimaris in convivio.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Intellige quæ sunt proximi tui ex teipso.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Utere quasi homo frugi his quæ tibi apponuntur : ne, cum manducas multum, odio habearis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cessa prior causa disciplinæ : et noli nimius esse, ne forte offendas.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et si in medio multorum sedisti, prior illis ne extendas manum tuam, nec prior poscas bibere.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quam sufficiens est homini erudito vinum exiguum ! et in dormiendo non laborabis ab illo, et non senties dolorem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Vigilia, cholera et tortura viro infrunito,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>somnus sanitatis in homine parco : dormiet usque mane, et anima illius cum ipso delectabitur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et si coactus fueris in edendo multum, surge e medio, evome, et refrigerabit te, et non adduces corpori tuo infirmitatem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Audi me, fili, et ne spernas me, et in novissimo invenies verba mea.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In omnibus operibus tuis esto velox, et omnis infirmitas non occurret tibi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Splendidum in panibus benedicent labia multorum, et testimonium veritatis illius fidele.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Nequissimo in pane murmurabit civitas, et testimonium nequitiæ illius verum est.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Diligentes in vino noli provocare : multos enim exterminavit vinum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ignis probat ferrum durum : sic vinum corda superborum arguet in ebrietate potatum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Æqua vita hominibus vinum in sobrietate : si bibas illud moderate, eris sobrius.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quæ vita est ei qui minuitur vino ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quid defraudat vitam ? mors.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Vinum in jucunditatem creatum est, et non in ebrietatem ab initio.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Exsultatio animæ et cordis vinum moderate potatum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Sanitas est animæ et corpori sobrius potus.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Vinum multum potatum irritationem, et iram, et ruinas multas facit.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Amaritudo animæ vinum multum potatum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Ebrietatis animositas, imprudentis offensio, minorans virtutem, et faciens vulnera.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>In convivio vini non arguas proximum, et non despicias eum in jucunditate illius.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Verba improperii non dicas illi, et non premas illum repetendo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/30/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Sirach 30</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SIR/32/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Sirach 32</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><pat se\":8,\"text\":\"Blessed is the rich man that is found without blemish: and that hath not gone after gold, nor put his trust in money nor in treasures.\"},{\"verse\":9,\"text\":\"Who is he, and we will praise him? for he hath done wonderful things in his life.\"},{\"verse\":10,\"text\":\"Who hath been tried thereby, and made perfect, he shall have glory everlasting. He that could have transgressed, and hath not transgressed: and could do evil things, and hath not done them:\"},{\"verse\":11,\"text\":\"Therefore are his goods established in the Lord, and all the church of the saints shall declare his alms.\"},{\"verse\":12,\"text\":\"Art thou set at a great table? be not the first to open thy mouth upon it.\"},{\"verse\":13,\"text\":\"Say not: There are many things which are upon it.\"},{\"verse\":14,\"text\":\"Remember that a wicked eye is evil.\"},{\"verse\":15,\"text\":\"What is created more wicked than an eye? therefore shall it weep over all the face when it shall see.\"},{\"verse\":16,\"text\":\"Stretch not out thy hand first, lest being disgraced with envy thou be put to confusion.\"},{\"verse\":17,\"text\":\"Be not hasty in a feast.\"},{\"verse\":18,\"text\":\"Judge of the disposition of thy neighbour by thyself.\"},{\"verse\":19,\"text\":\"Use as a frugal man the things that are set before thee: lest if thou eatest much, thou be hated.\"},{\"verse\":20,\"text\":\"Leave off first, for manners’ sake: and exceed not, lest thou offend.\"},{\"verse\":21,\"text\":\"And if thou sittest among many, reach not thy hand out first of all, and be not the first to ask for drink.\"},{\"verse\":22,\"text\":\"How sufficient is a little wine for a man well taught, and in sleeping thou shalt not be uneasy with it, and thou shalt feel no pain.\"},{\"verse\":23,\"text\":\"Watching, and choler, and gripes, are with an intemperate man:\"},{\"verse\":24,\"text\":\"Sound and wholesome sleep with a moderate man: he shall sleep till morning, and his soul shall be delighted with him.\"},{\"verse\":25,\"text\":\"And if thou hast been forced to eat much, arise, go out, and vomit: and it shall refresh thee, and thou shalt not bring sickness upon thy body.\"},{\"verse\":26,\"text\":\"Hear me, my son, and despise me not: and in the end thou shalt find my words.\"},{\"verse\":27,\"text\":\"In all thy works be quick, and no infirmity shall come to thee.\"},{\"verse\":28,\"text\":\"The lips of many shall bless him that is liberal of his bread, and the testimony of his truth is faithful.\"},{\"verse\":29,\"text\":\"Against him that is niggardly of his bread, the city will murmur, and the testimony of his niggardliness is true.\"},{\"verse\":30,\"text\":\"Challenge not them that love wine: for wine hath destroyed very many.\"},{\"verse\":31,\"text\":\"Fire trieth hard iron: so wine drunk to excess shall rebuke the hearts of the proud.\"},{\"verse\":32,\"text\":\"Wine taken with sobriety is equal life to men: if thou drink it moderately, thou shalt be sober.\"},{\"verse\":33,\"text\":\"What is his life, who is diminished with wine?\"},{\"verse\":34,\"text\":\"What taketh away life? death.\"},{\"verse\":35,\"text\":\"Wine was created from the beginning to make men joyful, and not to make them drunk.\"},{\"verse\":36,\"text\":\"Wine drunken with moderation is the joy of the soul and the heart.\"},{\"verse\":37,\"text\":\"Sober drinking is health to soul and body.\"},{\"verse\":38,\"text\":\"Wine drunken with excess raiseth quarrels, and wrath, and many ruins.\"},{\"verse\":39,\"text\":\"Wine drunken with excess is bitterness of the soul.\"},{\"verse\":40,\"text\":\"The heat of drunkenness is the stumblingblock of the fool, lessening strength and causing wounds.\"},{\"verse\":41,\"text\":\"Rebuke not thy neighbour in a banquet of wine: and despise him not in his mirth.\"},{\"verse\":42,\"text\":\"Speak not to him words of reproach: and press him not in demanding again.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vigilia honestatis tabefaciet carnes, et cogitatus illius auferet somnum.\"},{\"verse\":2,\"text\":\"Cogitatus præscientiæ avertit sensum, et infirmitas gravis sobriam facit animam.\"},{\"verse\":3,\"text\":\"Laboravit dives in congregatione substantiæ, et in requie sua replebitur bonis suis.\"},{\"verse\":4,\"text\":\"Laboravit pauper in diminutione victus, et in fine inops fit.\"},{\"verse\":5,\"text\":\"Qui aurum diligit non justificabitur, et qui insequitur consumptionem replebitur ex ea.\"},{\"verse\":6,\"text\":\"Multi dati sunt in auri casus, et facta est in specie ipsius perditio illorum.\"},{\"verse\":7,\"text\":\"Lignum offensionis est aurum sacrificantium : væ illis qui sectantur illud ! et omnis imprudens deperiet in illo.\"},{\"verse\":8,\"text\":\"Beatus dives qui inventus est sine macula, et qui post aurum non abiit, nec speravit in pecunia et thesauris.\"},{\"verse\":9,\"text\":\"Quis est hic ? et laudabimus eum : fecit enim mirabilia in vita sua.\"},{\"verse\":10,\"text\":\"Qui probatus est in illo, et perfectus est, erit illi gloria æterna : qui potuit transgredi, et non est transgressus ; facere mala, et non fecit.\"},{\"verse\":11,\"text\":\"Ideo stabilita sunt bona illius in Domino, et eleemosynas illius enarrabit omnis ecclesia sanctorum.\"},{\"verse\":12,\"text\":\"Supra mensam magnam sedisti ? non aperias super illam faucem tuam prior.\"},{\"verse\":13,\"text\":\"Non dicas sic : Multa sunt, quæ super illam sunt.\"},{\"verse\":14,\"text\":\"Memento quoniam malus est oculus nequam.\"},{\"verse\":15,\"text\":\"Nequius oculo quid creatum est ? ideo ab omni facie sua lacrimabitur, cum viderit.\"},{\"verse\":16,\"text\":\"Ne extendas manum tuam prior, et invidia contaminatus erubescas.\"},{\"verse\":17,\"text\":\"Ne comprimaris in convivio.\"},{\"verse\":18,\"text\":\"Intellige quæ sunt proximi tui ex teipso.\"},{\"verse\":19,\"text\":\"Utere quasi homo frugi his quæ tibi apponuntur : ne, cum manducas multum, odio habearis.\"},{\"verse\":20,\"text\":\"Cessa prior causa disciplinæ : et noli nimius esse, ne forte offendas.\"},{\"verse\":21,\"text\":\"Et si in medio multorum sedisti, prior illis ne extendas manum tuam, nec prior poscas bibere.\"},{\"verse\":22,\"text\":\"Quam sufficiens est homini erudito vinum exiguum ! et in dormiendo non laborabis ab illo, et non senties dolorem.\"},{\"verse\":23,\"text\":\"Vigilia, cholera et tortura viro infrunito,\"},{\"verse\":24,\"text\":\"somnus sanitatis in homine parco : dormiet usque mane, et anima illius cum ipso delectabitur.\"},{\"verse\":25,\"text\":\"Et si coactus fueris in edendo multum, surge e medio, evome, et refrigerabit te, et non adduces corpori tuo infirmitatem.\"},{\"verse\":26,\"text\":\"Audi me, fili, et ne spernas me, et in novissimo invenies verba mea.\"},{\"verse\":27,\"text\":\"In omnibus operibus tuis esto velox, et omnis infirmitas non occurret tibi.\"},{\"verse\":28,\"text\":\"Splendidum in panibus benedicent labia multorum, et testimonium veritatis illius fidele.\"},{\"verse\":29,\"text\":\"Nequissimo in pane murmurabit civitas, et testimonium nequitiæ illius verum est.\"},{\"verse\":30,\"text\":\"Diligentes in vino noli provocare : multos enim exterminavit vinum.\"},{\"verse\":31,\"text\":\"Ignis probat ferrum durum : sic vinum corda superborum arguet in ebrietate potatum.\"},{\"verse\":32,\"text\":\"Æqua vita hominibus vinum in sobrietate : si bibas illud moderate, eris sobrius.\"},{\"verse\":33,\"text\":\"Quæ vita est ei qui minuitur vino ?\"},{\"verse\":34,\"text\":\"Quid defraudat vitam ? mors.\"},{\"verse\":35,\"text\":\"Vinum in jucunditatem creatum est, et non in ebrietatem ab initio.\"},{\"verse\":36,\"text\":\"Exsultatio animæ et cordis vinum moderate potatum.\"},{\"verse\":37,\"text\":\"Sanitas est animæ et corpori sobrius potus.\"},{\"verse\":38,\"text\":\"Vinum multum potatum irritationem, et iram, et ruinas multas facit.\"},{\"verse\":39,\"text\":\"Amaritudo animæ vinum multum potatum.\"},{\"verse\":40,\"text\":\"Ebrietatis animositas, imprudentis offensio, minorans virtutem, et faciens vulnera.\"},{\"verse\":41,\"text\":\"In convivio vini non arguas proximum, et non despicias eum in jucunditate illius.\"},{\"verse\":42,\"text\":\"Verba improperii non dicas illi, et non premas illum repetendo.\"}],\"summary\":\"Of the desire of riches, and of moderation in eating and drinking.\",\"intro\":null,\"prev\":{\"usfm\":\"SIR\",\"chapter\":30,\"label\":\"Sirach 30\"},\"next\":{\"usfm\":\"SIR\",\"chapter\":32,\"label\":\"Sirach 32\"}}]]\n"])</script></body></html>
