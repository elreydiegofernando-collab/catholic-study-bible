"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Zechariah<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Zacharias</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Joyful promises to Jerusalem: fully verified in the church of Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the word of the Lord of hosts came to me, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thus saith the Lord of hosts: I have been jealous for Sion with a great jealousy, and with a great indignation have I been jealous for her.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thus saith the Lord of hosts: I am returned to Sion, and I will dwell in the midst of Jerusalem: and Jerusalem shall be called The city of truth, and the mountain of the Lord of hosts, The sanctified mountain.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thus saith the Lord of hosts: There shall yet old men and old women dwell in the streets of Jerusalem: and every man with his staff in his hand through multitude of days.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the streets of the city shall be full of boys and girls, playing in the streets thereof.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thus saith the Lord of hosts: If it seem hard in the eyes of the remnant of this people in those days: shall it be hard in my eyes, saith the Lord of hosts?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thus saith the Lord of hosts: Behold I will save my people from the land of the east, and from the land of the going down of the sun.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I will bring them, and they shall dwell in the midst of Jerusalem: and they shall be my people, and I will be their God in truth and in justice.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thus saith the Lord of hosts: Let your hands be strengthened, you that hear in these days these words by the mouth of the prophets, in the day that the house of the Lord of hosts was founded, that the temple might be built.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For before those days there was no hire for men, neither was there hire for beasts, neither was there peace to him that came in, nor to him that went out, because of the tribulation: and I let all men go every one against his neighbour.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But now I will not deal with the remnant of this people according to the former days, saith the Lord of hosts.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But there shall be the seed of peace: the vine shall yield her fruit, and the earth shall give her increase, and the heavens shall give their dew: and I will cause the remnant of this people to possess all these things.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And it shall come to pass, that as you were a curse among the Gentiles, O house of Juda, and house of Israel: so will I save you, and you shall be a blessing: fear not, let your hands be strengthened.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For thus saith the Lord of hosts: As I purposed to afflict you, when your fathers had provoked me to wrath, saith the Lord,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I had no mercy: so turning again I have thought in these days to do good to the house of Juda, and Jerusalem: fear not.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>These then are the things, which you shall do: Speak ye truth every one to his neighbour; judge ye truth and judgment of peace in your gates.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And let none of you imagine evil in your hearts against his friend: and love not a false oath: for all these are the things that I hate, saith the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the word of the Lord of hosts came to me, saying:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thus saith the Lord of hosts: The fast of the fourth month, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth shall be to the house of Juda, joy, and gladness, and great solemnities: only love ye truth and peace.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thus saith the Lord of hosts, until people come and dwell in many cities,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the inhabitants go one to another, saying: Let us go, and entreat the face of the Lord, and let us seek the Lord of hosts: I also will go.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And many peoples, and strong nations shall come to seek the Lord of hosts in Jerusalem, and to entreat the face of the Lord.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Thus saith the Lord of hosts: In those days, wherein ten men of all languages of the Gentiles shall take hold, and shall hold fast the skirt of one that is a Jew, saying: We will go with you: for we have heard that God is with you.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est verbum Domini exercituum, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hæc dicit Dominus exercituum : Zelatus sum Sion zelo magno, et indignatione magna zelatus sum eam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hæc dicit Dominus exercituum : Reversus sum ad Sion, et habitabo in medio Jerusalem : et vocabitur Jerusalem civitas veritatis, et mons Domini exercituum mons sanctificatus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæc dicit Dominus exercituum : Adhuc habitabunt senes et anus in plateis Jerusalem, et viri baculus in manu ejus præ multitudine dierum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et plateæ civitatis complebuntur infantibus et puellis, ludentibus in plateis ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hæc dicit Dominus exercituum : Si videbitur difficile in oculis reliquiarum populi hujus in diebus illis, numquid in oculis meis difficile erit ? dicit Dominus exercituum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hæc dicit Dominus exercituum : Ecce ego salvabo populum meum de terra orientis et de terra occasus solis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et adducam eos, et habitabunt in medio Jerusalem : et erunt mihi in populum, et ego ero eis in Deum, in veritate et in justitia.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæc dicit Dominus exercituum : Confortentur manus vestræ, qui auditis in his diebus sermones istos per os prophetarum, in die qua fundata est domus Domini exercituum, ut templum ædificaretur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Siquidem ante dies illos merces hominum non erat, nec merces jumentorum erat : neque introëunti, neque exeunti erat pax præ tribulatione : et dimisi omnes homines, unumquemque contra proximum suum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nunc autem non juxta dies priores ego faciam reliquiis populi hujus, dicit Dominus exercituum,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>sed semen pacis erit : vinea dabit fructum suum, et terra dabit germen suum, et cæli dabunt rorem suum : et possidere faciam reliquias populi hujus universa hæc.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et erit : sicut eratis maledictio in gentibus, domus Juda et domus Israël, sic salvabo vos, et eritis benedictio. Nolite timere ; confortentur manus vestræ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quia hæc dicit Dominus exercituum : Sicut cogitavi ut affligerem vos, cum ad iracundiam provocassent patres vestri me, dicit Dominus,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et non sum misertus : sic conversus cogitavi, in diebus istis, ut benefaciam domui Juda et Jerusalem. Nolite timere.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hæc sunt ergo verba quæ facietis : loquimini veritatem unusquisque cum proximo suo : veritatem et judicium pacis judicate in portis vestris.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et unusquisque malum contra amicum suum ne cogitetis in cordibus vestris, et juramentum mendax ne diligatis : omnia enim hæc sunt quæ odi, dicit Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et factum est verbum Domini exercituum ad me, dicens :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hæc dicit Dominus exercituum : Jejunium quarti, et jejunium quinti, et jejunium septimi, et jejunium decimi erit domui Juda in gaudium et lætitiam et in solemnitates præclaras. Veritatem tantum et pacem diligite.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hæc dicit Dominus exercituum, usquequo veniant populi et habitent in civitatibus multis :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et vadant habitatores, unus ad alterum, dicentes : Eamus, et deprecemur faciem Domini, et quæramus Dominum exercituum : vadam etiam ego.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et venient populi multi, et gentes robustæ, ad quærendum Dominum exercituum in Jerusalem, et deprecandam faciem Domini.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Hæc dicit Dominus exercituum : In diebus illis, in quibus apprehendent decem homines ex omnibus linguis gentium, et apprehendent fimbriam viri Judæi, dicentes : Ibimus vobiscum : audivimus enim quoniam Deus vobiscum est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ZEC/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Zechariah 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ZEC/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Zechariah 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 s , and from the land of the going down of the sun.\"},{\"verse\":8,\"text\":\"And I will bring them, and they shall dwell in the midst of Jerusalem: and they shall be my people, and I will be their God in truth and in justice.\"},{\"verse\":9,\"text\":\"Thus saith the Lord of hosts: Let your hands be strengthened, you that hear in these days these words by the mouth of the prophets, in the day that the house of the Lord of hosts was founded, that the temple might be built.\"},{\"verse\":10,\"text\":\"For before those days there was no hire for men, neither was there hire for beasts, neither was there peace to him that came in, nor to him that went out, because of the tribulation: and I let all men go every one against his neighbour.\"},{\"verse\":11,\"text\":\"But now I will not deal with the remnant of this people according to the former days, saith the Lord of hosts.\"},{\"verse\":12,\"text\":\"But there shall be the seed of peace: the vine shall yield her fruit, and the earth shall give her increase, and the heavens shall give their dew: and I will cause the remnant of this people to possess all these things.\"},{\"verse\":13,\"text\":\"And it shall come to pass, that as you were a curse among the Gentiles, O house of Juda, and house of Israel: so will I save you, and you shall be a blessing: fear not, let your hands be strengthened.\"},{\"verse\":14,\"text\":\"For thus saith the Lord of hosts: As I purposed to afflict you, when your fathers had provoked me to wrath, saith the Lord,\"},{\"verse\":15,\"text\":\"And I had no mercy: so turning again I have thought in these days to do good to the house of Juda, and Jerusalem: fear not.\"},{\"verse\":16,\"text\":\"These then are the things, which you shall do: Speak ye truth every one to his neighbour; judge ye truth and judgment of peace in your gates.\"},{\"verse\":17,\"text\":\"And let none of you imagine evil in your hearts against his friend: and love not a false oath: for all these are the things that I hate, saith the Lord.\"},{\"verse\":18,\"text\":\"And the word of the Lord of hosts came to me, saying:\"},{\"verse\":19,\"text\":\"Thus saith the Lord of hosts: The fast of the fourth month, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth shall be to the house of Juda, joy, and gladness, and great solemnities: only love ye truth and peace.\"},{\"verse\":20,\"text\":\"Thus saith the Lord of hosts, until people come and dwell in many cities,\"},{\"verse\":21,\"text\":\"And the inhabitants go one to another, saying: Let us go, and entreat the face of the Lord, and let us seek the Lord of hosts: I also will go.\"},{\"verse\":22,\"text\":\"And many peoples, and strong nations shall come to seek the Lord of hosts in Jerusalem, and to entreat the face of the Lord.\"},{\"verse\":23,\"text\":\"Thus saith the Lord of hosts: In those days, wherein ten men of all languages of the Gentiles shall take hold, and shall hold fast the skirt of one that is a Jew, saying: We will go with you: for we have heard that God is with you.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est verbum Domini exercituum, dicens :\"},{\"verse\":2,\"text\":\"Hæc dicit Dominus exercituum : Zelatus sum Sion zelo magno, et indignatione magna zelatus sum eam.\"},{\"verse\":3,\"text\":\"Hæc dicit Dominus exercituum : Reversus sum ad Sion, et habitabo in medio Jerusalem : et vocabitur Jerusalem civitas veritatis, et mons Domini exercituum mons sanctificatus.\"},{\"verse\":4,\"text\":\"Hæc dicit Dominus exercituum : Adhuc habitabunt senes et anus in plateis Jerusalem, et viri baculus in manu ejus præ multitudine dierum.\"},{\"verse\":5,\"text\":\"Et plateæ civitatis complebuntur infantibus et puellis, ludentibus in plateis ejus.\"},{\"verse\":6,\"text\":\"Hæc dicit Dominus exercituum : Si videbitur difficile in oculis reliquiarum populi hujus in diebus illis, numquid in oculis meis difficile erit ? dicit Dominus exercituum.\"},{\"verse\":7,\"text\":\"Hæc dicit Dominus exercituum : Ecce ego salvabo populum meum de terra orientis et de terra occasus solis.\"},{\"verse\":8,\"text\":\"Et adducam eos, et habitabunt in medio Jerusalem : et erunt mihi in populum, et ego ero eis in Deum, in veritate et in justitia.\"},{\"verse\":9,\"text\":\"Hæc dicit Dominus exercituum : Confortentur manus vestræ, qui auditis in his diebus sermones istos per os prophetarum, in die qua fundata est domus Domini exercituum, ut templum ædificaretur.\"},{\"verse\":10,\"text\":\"Siquidem ante dies illos merces hominum non erat, nec merces jumentorum erat : neque introëunti, neque exeunti erat pax præ tribulatione : et dimisi omnes homines, unumquemque contra proximum suum.\"},{\"verse\":11,\"text\":\"Nunc autem non juxta dies priores ego faciam reliquiis populi hujus, dicit Dominus exercituum,\"},{\"verse\":12,\"text\":\"sed semen pacis erit : vinea dabit fructum suum, et terra dabit germen suum, et cæli dabunt rorem suum : et possidere faciam reliquias populi hujus universa hæc.\"},{\"verse\":13,\"text\":\"Et erit : sicut eratis maledictio in gentibus, domus Juda et domus Israël, sic salvabo vos, et eritis benedictio. Nolite timere ; confortentur manus vestræ.\"},{\"verse\":14,\"text\":\"Quia hæc dicit Dominus exercituum : Sicut cogitavi ut affligerem vos, cum ad iracundiam provocassent patres vestri me, dicit Dominus,\"},{\"verse\":15,\"text\":\"et non sum misertus : sic conversus cogitavi, in diebus istis, ut benefaciam domui Juda et Jerusalem. Nolite timere.\"},{\"verse\":16,\"text\":\"Hæc sunt ergo verba quæ facietis : loquimini veritatem unusquisque cum proximo suo : veritatem et judicium pacis judicate in portis vestris.\"},{\"verse\":17,\"text\":\"Et unusquisque malum contra amicum suum ne cogitetis in cordibus vestris, et juramentum mendax ne diligatis : omnia enim hæc sunt quæ odi, dicit Dominus.\"},{\"verse\":18,\"text\":\"Et factum est verbum Domini exercituum ad me, dicens :\"},{\"verse\":19,\"text\":\"Hæc dicit Dominus exercituum : Jejunium quarti, et jejunium quinti, et jejunium septimi, et jejunium decimi erit domui Juda in gaudium et lætitiam et in solemnitates præclaras. Veritatem tantum et pacem diligite.\"},{\"verse\":20,\"text\":\"Hæc dicit Dominus exercituum, usquequo veniant populi et habitent in civitatibus multis :\"},{\"verse\":21,\"text\":\"et vadant habitatores, unus ad alterum, dicentes : Eamus, et deprecemur faciem Domini, et quæramus Dominum exercituum : vadam etiam ego.\"},{\"verse\":22,\"text\":\"Et venient populi multi, et gentes robustæ, ad quærendum Dominum exercituum in Jerusalem, et deprecandam faciem Domini.\"},{\"verse\":23,\"text\":\"Hæc dicit Dominus exercituum : In diebus illis, in quibus apprehendent decem homines ex omnibus linguis gentium, et apprehendent fimbriam viri Judæi, dicentes : Ibimus vobiscum : audivimus enim quoniam Deus vobiscum est.\"}],\"summary\":\"Joyful promises to Jerusalem: fully verified in the church of Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"ZEC\",\"chapter\":7,\"label\":\"Zechariah 7\"},\"next\":{\"usfm\":\"ZEC\",\"chapter\":9,\"label\":\"Zechariah 9\"}}]]\n"])</script></body></html>
