"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Samuel<!-- --> <span class="text-stone-500">23</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The last words of David. A catalogue of his valiant men.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now these are David’s last words. David the son of Isai said: The man to whom it was appointed concerning the Christ of the God of Jacob, the excellent psalmist of Israel said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The spirit of the Lord hath spoken by me and his word by my tongue.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The God of Israel said to me, the strong one of Israel spoke, the ruler of men, the just ruler in the fear of God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>As the light of the morning, when the sun riseth, shineth in the morning without clouds, and as the grass springeth out of the earth by rain.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Neither is my house so great with God, that he should make with me an eternal covenant, firm in all things and assured. For he is all my salvation, and all my will: neither is there ought thereof that springeth not up.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But transgressors shall all of them be plucked up as thorns: which are not taken away with hands.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And if a man will touch them, he must be armed with iron and with the staff of a lance: but they shall be set on fire and burnt to nothing.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>These are the names of the valiant men of David: Jesbaham sitting in the chair was the wisest chief among the three, he was like the most tender little worm of the wood, who killed eight hundred men at one onset.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>After him was Eleazar the son of Dodo the Ahohite, one of the three valiant men that were with David when they defied the Philistines, and they were there gathered together to battle.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when the men of Israel were gone away, he stood and smote the Philistines till his hand was weary, and grew stiff with the sword: and the Lord wrought a great victory that day: and the people that were fled away, returned to take spoils of them that were slain.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And after him was Semma the son of Age of Arari. And the Philistines were gathered together in a troop: for there was a field full of lentils. And when the people were fled from the face of the Philistines,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He stood in the midst of the field, and defended it, and defeated the Philistines: and the Lord gave a great victory.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Moreover also before this the three who were princes among the thirty, went down and came to David in the harvest time into the cave of Odollam: and the camp of the Philistines was in the valley of the giants.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And David was then in a hold: and there was a garrison of the Philistines then in Bethlehem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And David longed, and said: O that some man would get me a drink of the water out of the cistern, that is in Bethlehem, by the gate.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the three valiant men broke through the camp of the Philistines, and drew water out of the cistern of Bethlehem, that was by the gate, and brought it to David: but he would not drink, but offered it to the Lord,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Saying: The Lord be merciful to me, that I may not do this: shall I drink the blood of these men that went, and the peril of their lives? therefore he would not drink. These things did these three mighty men.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Abisai also the brother of Joab, the son of Sarvia, was chief among three: and he lifted up his spear against three hundred whom he slew, and he was renowned among the three,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the noblest of three, and was their chief, but to the three first he attained not.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Banaias the son of Joiada a most valiant man, of great deeds, of Cabseel: he slew the two lions of Moab, and he went down, and slew a lion in the midst of a pit, in the time of snow.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He also slew an Egyptian, a man worthy to be a sight, having a spear in his hand: but he went down to him with a rod, and forced the spear out of the hand of the Egyptian, and slew him with his own spear.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>These things did Banaias the son of Joiada.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he was renowned among the three valiant men, who were the most honourable among the thirty: but he attained not to the first three: and David made him of his privy council.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Asael the brother of Joab was one of the thirty, Elehanan the son of Dodo of Bethlehem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Semma of Harodi, Elica of Harodi,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Heles of Phalti, Hira the son of Acces of Thecua,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Abiezer of Anathoth, Mobonnai of Husati,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Selmon the Ahohite, Maharai the Netophathite,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Heled the son of Baana, also a Netophathite, Ithai the son of Ribai of Gabaath of the children of Benjamin,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Banaia the Pharathonite, Heddai of the torrent Gaas,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Abialbon the Arbathite, Azmaveth of Beromi,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Eliaba of Salaboni. The sons of Jassen, Jonathan,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Semma of Orori, Aliam the son of Sarar the Arorite,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Eliphelet the son of Aasbai the son of Machati, Eliam the son of Achitophel the Gelonite,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Hesrai of Carmel, Pharai of Arbi,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Igaal the son of Nathan of Soba, Bonni of Gadi,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Selec of Ammoni, Naharai the Berothite, armourbearer of Joab the son of Sarvia,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ira the Jethrite, Gareb also a Jethrite;</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Urias the Hethite, thirty and seven in all.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc autem sunt verba David novissima. Dixit David filius Isai : Dixit vir, cui constitutum est de christo Dei Jacob, egregius psaltes Israël :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Spiritus Domini locutus est per me, et sermo ejus per linguam meam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixit Deus Israël mihi, locutus est fortis Israël : Dominator hominum, justus dominator in timore Dei,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sicut lux auroræ, oriente sole, mane absque nubibus rutilat : et sicut pluviis germinat herba de terra.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nec tanta est domus mea apud Deum, ut pactum æternum iniret mecum, firmum in omnibus atque munitum. Cuncta enim salus mea, et omnis voluntas, nec est quidquam ex ea quod non germinet.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Prævaricatores autem quasi spinæ evellentur universi, quæ non tolluntur manibus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et si quis tangere voluerit eas, armabitur ferro et ligno lanceato, igneque succensæ comburentur usque ad nihilum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Hæc nomina fortium David. Sedens in cathedra sapientissimus princeps inter tres, ipse est quasi tenerrimus ligni vermiculus, qui octingentos interfecit impetu uno.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Post hunc, Eleazar filius patrui ejus Ahohites inter tres fortes, qui erant cum David quando exprobraverunt Philisthiim, et congregati sunt illuc in prælium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque ascendissent viri Israël, ipse stetit et percussit Philisthæos donec deficeret manus ejus, et obrigesceret cum gladio : fecitque Dominus salutem magnam in die illa : et populus qui fugerat, reversus est ad cæsorum spolia detrahenda.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et post hunc, Semma filius Age de Arari. Et congregati sunt Philisthiim in statione : erat quippe ibi ager lente plenus. Cumque fugisset populus a facie Philisthiim,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>stetit ille in medio agri, et tuitus est eum, percussitque Philisthæos : et fecit Dominus salutem magnam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Necnon et ante descenderant tres qui erant principes inter triginta, et venerant tempore messis ad David in speluncam Odollam : castra autem Philisthinorum erant posita in Valle gigantum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et David erat in præsidio : porro statio Philisthinorum tunc erat in Bethlehem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Desideravit ergo David, et ait : O si quis mihi daret potum aquæ de cisterna quæ est in Bethlehem juxta portam !</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Irruperunt ergo tres fortes castra Philisthinorum, et hauserunt aquam de cisterna Bethlehem, quæ erat juxta portam, et attulerunt ad David : at ille noluit bibere, sed libavit eam Domino,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>dicens : Propitius sit mihi Dominus, ne faciam hoc : num sanguinem hominum istorum qui profecti sunt, et animarum periculum bibam ? Noluit ergo bibere. Hæc fecerunt tres robustissimi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Abisai quoque frater Joab filius Sarviæ, princeps erat de tribus : ipse est qui levavit hastam suam contra trecentos, quos interfecit : nominatus in tribus,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et inter tres nobilior, eratque eorum princeps, sed usque ad tres primos non pervenerat.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et Banaias filius Jojadæ viri fortissimi, magnorum operum, de Cabseel. Ipse percussit duos leones Moab, et ipse descendit, et percussit leonem in media cisterna in diebus nivis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ipse quoque interfecit virum ægyptium, virum dignum spectaculo, habentem in manu hastam : itaque cum descendisset ad eum in virga, vi extorsit hastam de manu Ægyptii, et interfecit eum hasta sua.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hæc fecit Banaias filius Jojadæ.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ipse nominatus inter tres robustos, qui erant inter triginta nobiliores : verumtamen usque ad tres non pervenerat : fecitque eum sibi David auricularium, a secreto.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Asaël frater Joab inter triginta, Elehanan filius patrui ejus de Bethlehem,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Semma de Harodi, Elica de Harodi,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Heles de Phalti, Hira filius Acces de Thecua,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Abiezer de Anathoth, Mobonnai de Husati,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Selmon Ahohites, Maharai Netophathites,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Heled filius Baana, et ipse Netophathites, Ithai filius Ribai de Gabaath filiorum Benjamin,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Banaia Pharathonites, Heddai de torrente Gaas,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Abialbon Arbathites, Azmaveth de Beromi,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Eliaba de Salaboni. Filii Jassen, Jonathan,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Semma de Orori, Ajam filius Sarar Arorites,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Eliphelet filius Aasbai filii Machati, Eliam filius Achitophel Gelonites,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Hesrai de Carmelo, Pharai de Arbi,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Igaal filius Nathan de Soba, Bonni de Gadi,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Selec de Ammoni, Naharai Berothites armiger Joab filii Sarviæ,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ira Jethrites, Gareb et ipse Jethrites,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Urias Hethæus : omnes triginta septem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href=" cob, the excellent psalmist of Israel said:\"},{\"verse\":2,\"text\":\"The spirit of the Lord hath spoken by me and his word by my tongue.\"},{\"verse\":3,\"text\":\"The God of Israel said to me, the strong one of Israel spoke, the ruler of men, the just ruler in the fear of God.\"},{\"verse\":4,\"text\":\"As the light of the morning, when the sun riseth, shineth in the morning without clouds, and as the grass springeth out of the earth by rain.\"},{\"verse\":5,\"text\":\"Neither is my house so great with God, that he should make with me an eternal covenant, firm in all things and assured. For he is all my salvation, and all my will: neither is there ought thereof that springeth not up.\"},{\"verse\":6,\"text\":\"But transgressors shall all of them be plucked up as thorns: which are not taken away with hands.\"},{\"verse\":7,\"text\":\"And if a man will touch them, he must be armed with iron and with the staff of a lance: but they shall be set on fire and burnt to nothing.\"},{\"verse\":8,\"text\":\"These are the names of the valiant men of David: Jesbaham sitting in the chair was the wisest chief among the three, he was like the most tender little worm of the wood, who killed eight hundred men at one onset.\"},{\"verse\":9,\"text\":\"After him was Eleazar the son of Dodo the Ahohite, one of the three valiant men that were with David when they defied the Philistines, and they were there gathered together to battle.\"},{\"verse\":10,\"text\":\"And when the men of Israel were gone away, he stood and smote the Philistines till his hand was weary, and grew stiff with the sword: and the Lord wrought a great victory that day: and the people that were fled away, returned to take spoils of them that were slain.\"},{\"verse\":11,\"text\":\"And after him was Semma the son of Age of Arari. And the Philistines were gathered together in a troop: for there was a field full of lentils. And when the people were fled from the face of the Philistines,\"},{\"verse\":12,\"text\":\"He stood in the midst of the field, and defended it, and defeated the Philistines: and the Lord gave a great victory.\"},{\"verse\":13,\"text\":\"Moreover also before this the three who were princes among the thirty, went down and came to David in the harvest time into the cave of Odollam: and the camp of the Philistines was in the valley of the giants.\"},{\"verse\":14,\"text\":\"And David was then in a hold: and there was a garrison of the Philistines then in Bethlehem.\"},{\"verse\":15,\"text\":\"And David longed, and said: O that some man would get me a drink of the water out of the cistern, that is in Bethlehem, by the gate.\"},{\"verse\":16,\"text\":\"And the three valiant men broke through the camp of the Philistines, and drew water out of the cistern of Bethlehem, that was by the gate, and brought it to David: but he would not drink, but offered it to the Lord,\"},{\"verse\":17,\"text\":\"Saying: The Lord be merciful to me, that I may not do this: shall I drink the blood of these men that went, and the peril of their lives? therefore he would not drink. These things did these three mighty men.\"},{\"verse\":18,\"text\":\"Abisai also the brother of Joab, the son of Sarvia, was chief among three: and he lifted up his spear against three hundred whom he slew, and he was renowned among the three,\"},{\"verse\":19,\"text\":\"And the noblest of three, and was their chief, but to the three first he attained not.\"},{\"verse\":20,\"text\":\"And Banaias the son of Joiada a most valiant man, of great deeds, of Cabseel: he slew the two lions of Moab, and he went down, and slew a lion in the midst of a pit, in the time of snow.\"},{\"verse\":21,\"text\":\"He also slew an Egyptian, a man worthy to be a sight, having a spear in his hand: but he went down to him with a rod, and forced the spear out of the hand of the Egyptian, and slew him with his own spear.\"},{\"verse\":22,\"text\":\"These things did Banaias the son of Joiada.\"},{\"verse\":23,\"text\":\"And he was renowned among the three valiant men, who were the most honourable among the thirty: but he attained not to the first three: and David made him of his privy council.\"},{\"verse\":24,\"text\":\"Asael the brother of Joab was one of the thirty, Elehanan the son of Dodo of Bethlehem.\"},{\"verse\":25,\"text\":\"Semma of Harodi, Elica of Harodi,\"},{\"verse\":26,\"text\":\"Heles of Phalti, Hira the son of Acces of Thecua,\"},{\"verse\":27,\"text\":\"Abiezer of Anathoth, Mobonnai of Husati,\"},{\"verse\":28,\"text\":\"Selmon the Ahohite, Maharai the Netophathite,\"},{\"verse\":29,\"text\":\"Heled the son of Baana, also a Netophathite, Ithai the son of Ribai of Gabaath of the children of Benjamin,\"},{\"verse\":30,\"text\":\"Banaia the Pharathonite, Heddai of the torrent Gaas,\"},{\"verse\":31,\"text\":\"Abialbon the Arbathite, Azmaveth of Beromi,\"},{\"verse\":32,\"text\":\"Eliaba of Salaboni. The sons of Jassen, Jonathan,\"},{\"verse\":33,\"text\":\"Semma of Orori, Aliam the son of Sarar the Arorite,\"},{\"verse\":34,\"text\":\"Eliphelet the son of Aasbai the son of Machati, Eliam the son of Achitophel the Gelonite,\"},{\"verse\":35,\"text\":\"Hesrai of Carmel, Pharai of Arbi,\"},{\"verse\":36,\"text\":\"Igaal the son of Nathan of Soba, Bonni of Gadi,\"},{\"verse\":37,\"text\":\"Selec of Ammoni, Naharai the Berothite, armourbearer of Joab the son of Sarvia,\"},{\"verse\":38,\"text\":\"Ira the Jethrite, Gareb also a Jethrite;\"},{\"verse\":39,\"text\":\"Urias the Hethite, thirty and seven in all.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc autem sunt verba David novissima. Dixit David filius Isai : Dixit vir, cui constitutum est de christo Dei Jacob, egregius psaltes Israël :\"},{\"verse\":2,\"text\":\"Spiritus Domini locutus est per me, et sermo ejus per linguam meam.\"},{\"verse\":3,\"text\":\"Dixit Deus Israël mihi, locutus est fortis Israël : Dominator hominum, justus dominator in timore Dei,\"},{\"verse\":4,\"text\":\"sicut lux auroræ, oriente sole, mane absque nubibus rutilat : et sicut pluviis germinat herba de terra.\"},{\"verse\":5,\"text\":\"Nec tanta est domus mea apud Deum, ut pactum æternum iniret mecum, firmum in omnibus atque munitum. Cuncta enim salus mea, et omnis voluntas, nec est quidquam ex ea quod non germinet.\"},{\"verse\":6,\"text\":\"Prævaricatores autem quasi spinæ evellentur universi, quæ non tolluntur manibus.\"},{\"verse\":7,\"text\":\"Et si quis tangere voluerit eas, armabitur ferro et ligno lanceato, igneque succensæ comburentur usque ad nihilum.\"},{\"verse\":8,\"text\":\"Hæc nomina fortium David. Sedens in cathedra sapientissimus princeps inter tres, ipse est quasi tenerrimus ligni vermiculus, qui octingentos interfecit impetu uno.\"},{\"verse\":9,\"text\":\"Post hunc, Eleazar filius patrui ejus Ahohites inter tres fortes, qui erant cum David quando exprobraverunt Philisthiim, et congregati sunt illuc in prælium.\"},{\"verse\":10,\"text\":\"Cumque ascendissent viri Israël, ipse stetit et percussit Philisthæos donec deficeret manus ejus, et obrigesceret cum gladio : fecitque Dominus salutem magnam in die illa : et populus qui fugerat, reversus est ad cæsorum spolia detrahenda.\"},{\"verse\":11,\"text\":\"Et post hunc, Semma filius Age de Arari. Et congregati sunt Philisthiim in statione : erat quippe ibi ager lente plenus. Cumque fugisset populus a facie Philisthiim,\"},{\"verse\":12,\"text\":\"stetit ille in medio agri, et tuitus est eum, percussitque Philisthæos : et fecit Dominus salutem magnam.\"},{\"verse\":13,\"text\":\"Necnon et ante descenderant tres qui erant principes inter triginta, et venerant tempore messis ad David in speluncam Odollam : castra autem Philisthinorum erant posita in Valle gigantum.\"},{\"verse\":14,\"text\":\"Et David erat in præsidio : porro statio Philisthinorum tunc erat in Bethlehem.\"},{\"verse\":15,\"text\":\"Desideravit ergo David, et ait : O si quis mihi daret potum aquæ de cisterna quæ est in Bethlehem juxta portam !\"},{\"verse\":16,\"text\":\"Irruperunt ergo tres fortes castra Philisthinorum, et hauserunt aquam de cisterna Bethlehem, quæ erat juxta portam, et attulerunt ad David : at ille noluit bibere, sed libavit eam Domino,\"},{\"verse\":17,\"text\":\"dicens : Propitius sit mihi Dominus, ne faciam hoc : num sanguinem hominum istorum qui profecti sunt, et animarum periculum bibam ? Noluit ergo bibere. Hæc fecerunt tres robustissimi.\"},{\"verse\":18,\"text\":\"Abisai quoque frater Joab filius Sarviæ, princeps erat de tribus : ipse est qui levavit hastam suam contra trecentos, quos interfecit : nominatus in tribus,\"},{\"verse\":19,\"text\":\"et inter tres nobilior, eratque eorum princeps, sed usque ad tres primos non pervenerat.\"},{\"verse\":20,\"text\":\"Et Banaias filius Jojadæ viri fortissimi, magnorum operum, de Cabseel. Ipse percussit duos leones Moab, et ipse descendit, et percussit leonem in media cisterna in diebus nivis.\"},{\"verse\":21,\"text\":\"Ipse quoque interfecit virum ægyptium, virum dignum spectaculo, habentem in manu hastam : itaque cum descendisset ad eum in virga, vi extorsit hastam de manu Ægyptii, et interfecit eum hasta sua.\"},{\"verse\":22,\"text\":\"Hæc fecit Banaias filius Jojadæ.\"},{\"verse\":23,\"text\":\"Et ipse nominatus inter tres robustos, qui erant inter triginta nobiliores : verumtamen usque ad tres non pervenerat : fecitque eum sibi David auricularium, a secreto.\"},{\"verse\":24,\"text\":\"Asaël frater Joab inter triginta, Elehanan filius patrui ejus de Bethlehem,\"},{\"verse\":25,\"text\":\"Semma de Harodi, Elica de Harodi,\"},{\"verse\":26,\"text\":\"Heles de Phalti, Hira filius Acces de Thecua,\"},{\"verse\":27,\"text\":\"Abiezer de Anathoth, Mobonnai de Husati,\"},{\"verse\":28,\"text\":\"Selmon Ahohites, Maharai Netophathites,\"},{\"verse\":29,\"text\":\"Heled filius Baana, et ipse Netophathites, Ithai filius Ribai de Gabaath filiorum Benjamin,\"},{\"verse\":30,\"text\":\"Banaia Pharathonites, Heddai de torrente Gaas,\"},{\"verse\":31,\"text\":\"Abialbon Arbathites, Azmaveth de Beromi,\"},{\"verse\":32,\"text\":\"Eliaba de Salaboni. Filii Jassen, Jonathan,\"},{\"verse\":33,\"text\":\"Semma de Orori, Ajam filius Sarar Arorites,\"},{\"verse\":34,\"text\":\"Eliphelet filius Aasbai filii Machati, Eliam filius Achitophel Gelonites,\"},{\"verse\":35,\"text\":\"Hesrai de Carmelo, Pharai de Arbi,\"},{\"verse\":36,\"text\":\"Igaal filius Nathan de Soba, Bonni de Gadi,\"},{\"verse\":37,\"text\":\"Selec de Ammoni, Naharai Berothites armiger Joab filii Sarviæ,\"},{\"verse\":38,\"text\":\"Ira Jethrites, Gareb et ipse Jethrites,\"},{\"verse\":39,\"text\":\"Urias Hethæus : omnes triginta septem.\"}],\"summary\":\"The last words of David. A catalogue of his valiant men.\",\"intro\":null,\"prev\":{\"usfm\":\"2SA\",\"chapter\":22,\"label\":\"2 Samuel 22\"},\"next\":{\"usfm\":\"2SA\",\"chapter\":24,\"label\":\"2 Samuel 24\"}}]]\n"])</script></body></html>
