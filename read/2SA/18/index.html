<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>2 Samuel 18 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Samuel<!-- --> <span class="text-stone-500">18</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2SA/">About <!-- -->2 Samuel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Absalom is defeated, and slain by Joab. David mourneth for him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And David, having reviewed his people, appointed over them captains of thousands and of hundreds,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abisai the son of Sarvia Joab’s brother, and a third part under the hand of Ethai, who was of Geth: and the king said to the people: I also will go forth with you.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the people answered: Thou shalt not go forth: for if we flee away, they will not much mind us: or if half of us should fall, they will not greatly care: for thou alone art accounted for ten thousand: it is better therefore that thou shouldst be in the city to succour us.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the king said to them: What seemeth good to you, that will I do. And the king stood by the gate: and all the people went forth by their troops, by hundreds and by thousands.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the king commanded Joab, and Abisai, and Ethai, saying: Save me the boy Absalom. And all the people heard the king giving charge to all the princes concerning Absalom.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>So the people went out into the field against Israel, and the battle was fought in the forest of Ephraim.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the people of Israel were defeated there by David’s army, and a great slaughter was made that day of twenty thousand men.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the battle there was scattered over the face of all the country, and there were many more of the people whom the forest consumed, than whom the sword devoured that day.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And it happened that Absalom met the servants of David, riding on a mule: and as the mule went under a thick and large oak, his head stuck in the oak: and while he hung between the heaven and the earth, the mule on which he rode passed on.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And one saw this and told Joab, saying: I saw Absalom hanging upon an oak.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Joab said to the man that told him: If thou sawest him, why didst thou not stab him to the ground, and I would have given thee ten sicles of silver, and a belt?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he said to Joab: If thou wouldst have paid down in my hands a thousand pieces of silver, I would not lay my hands upon the king’s son for in our hearing the king charged thee, and Abisai, and Ethai, saying: Save me the boy Absalom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Yea and if I should have acted boldly against my own life, this could not have been hid from the king, and wouldst thou have stood by me?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Joab said: Not as thou wilt, but I will set upon him in thy sight. So he took three lances in his hand, and thrust them into the heart of Absalom: and whilst he yet panted for life, sticking on the oak,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ten young men, armourbearers of Joab, ran up, and striking him slew him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Joab sounded the trumpet, and kept back the people from pursuing after Israel in their flight, being willing to spare the multitude.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they took Absalom, and cast him into a great pit in the forest, and they laid an exceeding great heap of stones upon him: but all Israel fled to their own dwellings.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Now Absalom had reared up for himself, in his lifetime, a pillar, which is in the king’s valley: for he said: I have no son, and this shall be the monument of my name. And he called the pillar by his own name, and it is called the hand of Absalom, to this day.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Achimaas the son of Sadoc said: I will run and tell the king, that the Lord hath done judgment for him from the hand of his enemies.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Joab said to him: Thou shalt not be the messenger this day, but shalt bear tidings another day: this day I will not have thee bear tidings, because the king’s son is dead.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Joab said to Chusai: Go, and tell the king what thou hast seen. Chusai bowed down to Joab, and ran.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Then Achimaas the son of Sadoc said to Joab again: Why might not I also run after Chusai? And Joab said to him: Why wilt thou run, my son? thou wilt not be the bearer of good tidings.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He answered: But what if I run? And he said to him: Run. Then Achimaas running by a nearer way passed Chusai.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And David sat between the two gates: and the watchman that was on the top of the gate upon the wall, lifting up his eyes, saw a man running alone.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And crying out he told the king: and the king said: If he be alone, there are good tidings in his mouth. And as he was coming apace, and drawing nearer,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The watchman saw another man running, and crying aloud from above, he said: I see another man running alone. And the king said: He also is a good messenger.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the watchman said: The running of the foremost seemeth to me like the running of Achimaas the son of Sadoc. And the king said: He is a good man: and cometh with good news.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Achimaas crying out, said to the king: God save thee, O king. And falling down before the king with his face to the ground, he said: Blessed be the Lord thy God, who hath shut up the men that have lifted up their hands against the lord my king.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the king said: Is the young man Absalom safe? And Achimaas said: I saw a great tumult, O king, when thy servant Joab sent me thy servant: I know nothing else.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the king said to him: Pass, and stand here.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And when he had passed, and stood still, Chusai appeared and coming up he said: I bring good tidings, my lord, the king, for the Lord hath judged for thee this day from the hand of all that have risen up against thee.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the king said to Chusai: Is the young man Absalom safe? And Chusai answering him, said: Let the enemies of my lord, the king, and all that rise against him unto evil, be as the young man is.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The king therefore being much moved, went up to the high chamber over the gate, and wept. And as he went he spoke in this manner: My son Absalom, Absalom my son: would to God that I might die for thee, Absalom my son, my son Absalom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur considerato David populo suo, constituit super eos tribunos et centuriones,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et dedit populi tertiam partem sub manu Joab, et tertiam partem sub manu Abisai filii Sarviæ fratris Joab, et tertiam partem sub manu Ethai, qui erat de Geth. Dixitque rex ad populum : Egrediar et ego vobiscum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et respondit populus : Non exibis : sive enim fugerimus, non magnopere ad eos de nobis pertinebit : sive media pars ceciderit e nobis, non satis curabunt, quia tu unus pro decem millibus computaris : melius est igitur ut sis nobis in urbe præsidio.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ad quos rex ait : Quod vobis videtur rectum, hoc faciam. Stetit ergo rex juxta portam : egrediebaturque populus per turmas suas centeni et milleni.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et præcepit rex Joab, et Abisai, et Ethai, dicens : Servate mihi puerum Absalom. Et omnis populus audiebat præcipientem regem cunctis principibus pro Absalom.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Itaque egressus est populus in campum contra Israël, et factum est prælium in saltu Ephraim.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cæsus est ibi populus Israël ab exercitu David, factaque est plaga magna in die illa, viginti millium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Fuit autem ibi prælium dispersum super faciem omnis terræ, et multo plures erant quos saltus consumpserat de populo, quam hi quos voraverat gladius in die illa.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Accidit autem ut occurreret Absalom servis David, sedens mulo : cumque ingressus fuisset mulus subter condensam quercum et magnam, adhæsit caput ejus quercui : et illo suspenso inter cælum et terram, mulus cui insederat, pertransivit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Vidit autem hoc quispiam, et nuntiavit Joab, dicens : Vidi Absalom pendere de quercu.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et ait Joab viro qui nuntiaverat ei : Si vidisti, quare non confodisti eum cum terra, et ego dedissem tibi decem argenti siclos, et unum balteum ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui dixit ad Joab : Si appenderes in manibus meis mille argenteos, nequaquam mitterem manum meam in filium regis : audientibus enim nobis præcepit rex tibi, et Abisai, et Ethai, dicens : Custodite mihi puerum Absalom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sed etsi fecissem contra animam meam audacter, nequaquam hoc regem latere potuisset, et tu stares ex adverso ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ait Joab : Non sicut tu vis, sed aggrediar eum coram te. Tulit ergo tres lanceas in manu sua, et infixit eas in corde Absalom : cumque adhuc palpitaret hærens in quercu,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>cucurrerunt decem juvenes armigeri Joab, et percutientes interfecerunt eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cecinit autem Joab buccina, et retinuit populum, ne persequeretur fugientem Israël, volens parcere multitudini.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et tulerunt Absalom, et projecerunt eum in saltu, in foveam grandem, et comportaverunt super eum acervum lapidum magnum nimis : omnis autem Israël fugit in tabernacula sua.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Porro Absalom erexerat sibi, cum adhuc viveret, titulum qui est in Valle regis : dixerat enim : Non habeo filium, et hoc erit monimentum nominis mei. Vocavitque titulum nomine suo, et appellatur Manus Absalom, usque ad hanc diem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Achimaas autem filius Sadoc, ait : Curram, et nuntiabo regi quia judicium fecerit ei Dominus de manu inimicorum ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ad quem Joab dixit : Non eris nuntius in hac die, sed nuntiabis in alia : hodie nolo te nuntiare : filius enim regis est mortuus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et ait Joab Chusi : Vade, et nuntia regi quæ vidisti. Adoravit Chusi Joab, et cucurrit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Rursus autem Achimaas filius Sadoc dixit ad Joab : Quid impedit si etiam ego curram post Chusi ? Dixitque ei Joab : Quid vis currere, fili mi ? non eris boni nuntii bajulus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui respondit : Quid enim si cucurrero ? Et ait ei : Curre. Currens ergo Achimaas per viam compendii, transivit Chusi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>David autem sedebat inter duas portas : speculator vero, qui erat in fastigio portæ super murum, elevans oculos, vidit hominem currentem solum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et exclamans indicavit regi : dixitque rex : Si solus est, bonus est nuntius in ore ejus. Properante autem illo, et accedente propius,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>vidit speculator hominem alterum currentem, et vociferans in culmine, ait : Apparet mihi alter homo currens solus. Dixitque rex : Et iste bonus est nuntius.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Speculator autem : Contemplor, ait, cursum prioris, quasi cursum Achimaas filii Sadoc. Et ait rex : Vir bonus est, et nuntium portans bonum venit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Clamans autem Achimaas, dixit ad regem : Salve rex. Et adorans regem coram eo pronus in terram, ait : Benedictus Dominus Deus tuus, qui conclusit homines qui levaverunt manus suas contra dominum meum regem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et ait rex : Estne pax puero Absalom ? Dixitque Achimaas : Vidi tumultum magnum cum mitteret Joab servus tuus, o rex, me servum tuum : nescio aliud.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ad quem rex : Transi, ait, et sta hic. Cumque ille transisset, et staret,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>apparuit Chusi : et veniens ait : Bonum apporto nuntium, domine mi rex : judicavit enim pro te Dominus hodie de manu omnium qui surrexerunt contra te.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Dixit autem rex ad Chusi : Estne pax puero Absalom ? Cui respondens Chusi : Fiant, inquit, sicut puer, inimici domini mei regis, et universi qui consurgunt adversus eum in malum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Contristatus itaque rex, ascendit cœnaculum portæ, et flevit. Et sic loquebatur, vadens : Fili mi Absalom, Absalom fili mi : quis mihi tribuat ut ego moriar pro te, Absalom fili mi, fili mi Absalom ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2SA/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Samuel 17</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2SA/19/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Samuel 19</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hi oops, by hundreds and by thousands.\"},{\"verse\":5,\"text\":\"And the king commanded Joab, and Abisai, and Ethai, saying: Save me the boy Absalom. And all the people heard the king giving charge to all the princes concerning Absalom.\"},{\"verse\":6,\"text\":\"So the people went out into the field against Israel, and the battle was fought in the forest of Ephraim.\"},{\"verse\":7,\"text\":\"And the people of Israel were defeated there by David’s army, and a great slaughter was made that day of twenty thousand men.\"},{\"verse\":8,\"text\":\"And the battle there was scattered over the face of all the country, and there were many more of the people whom the forest consumed, than whom the sword devoured that day.\"},{\"verse\":9,\"text\":\"And it happened that Absalom met the servants of David, riding on a mule: and as the mule went under a thick and large oak, his head stuck in the oak: and while he hung between the heaven and the earth, the mule on which he rode passed on.\"},{\"verse\":10,\"text\":\"And one saw this and told Joab, saying: I saw Absalom hanging upon an oak.\"},{\"verse\":11,\"text\":\"And Joab said to the man that told him: If thou sawest him, why didst thou not stab him to the ground, and I would have given thee ten sicles of silver, and a belt?\"},{\"verse\":12,\"text\":\"And he said to Joab: If thou wouldst have paid down in my hands a thousand pieces of silver, I would not lay my hands upon the king’s son for in our hearing the king charged thee, and Abisai, and Ethai, saying: Save me the boy Absalom.\"},{\"verse\":13,\"text\":\"Yea and if I should have acted boldly against my own life, this could not have been hid from the king, and wouldst thou have stood by me?\"},{\"verse\":14,\"text\":\"And Joab said: Not as thou wilt, but I will set upon him in thy sight. So he took three lances in his hand, and thrust them into the heart of Absalom: and whilst he yet panted for life, sticking on the oak,\"},{\"verse\":15,\"text\":\"Ten young men, armourbearers of Joab, ran up, and striking him slew him.\"},{\"verse\":16,\"text\":\"And Joab sounded the trumpet, and kept back the people from pursuing after Israel in their flight, being willing to spare the multitude.\"},{\"verse\":17,\"text\":\"And they took Absalom, and cast him into a great pit in the forest, and they laid an exceeding great heap of stones upon him: but all Israel fled to their own dwellings.\"},{\"verse\":18,\"text\":\"Now Absalom had reared up for himself, in his lifetime, a pillar, which is in the king’s valley: for he said: I have no son, and this shall be the monument of my name. And he called the pillar by his own name, and it is called the hand of Absalom, to this day.\"},{\"verse\":19,\"text\":\"And Achimaas the son of Sadoc said: I will run and tell the king, that the Lord hath done judgment for him from the hand of his enemies.\"},{\"verse\":20,\"text\":\"And Joab said to him: Thou shalt not be the messenger this day, but shalt bear tidings another day: this day I will not have thee bear tidings, because the king’s son is dead.\"},{\"verse\":21,\"text\":\"And Joab said to Chusai: Go, and tell the king what thou hast seen. Chusai bowed down to Joab, and ran.\"},{\"verse\":22,\"text\":\"Then Achimaas the son of Sadoc said to Joab again: Why might not I also run after Chusai? And Joab said to him: Why wilt thou run, my son? thou wilt not be the bearer of good tidings.\"},{\"verse\":23,\"text\":\"He answered: But what if I run? And he said to him: Run. Then Achimaas running by a nearer way passed Chusai.\"},{\"verse\":24,\"text\":\"And David sat between the two gates: and the watchman that was on the top of the gate upon the wall, lifting up his eyes, saw a man running alone.\"},{\"verse\":25,\"text\":\"And crying out he told the king: and the king said: If he be alone, there are good tidings in his mouth. And as he was coming apace, and drawing nearer,\"},{\"verse\":26,\"text\":\"The watchman saw another man running, and crying aloud from above, he said: I see another man running alone. And the king said: He also is a good messenger.\"},{\"verse\":27,\"text\":\"And the watchman said: The running of the foremost seemeth to me like the running of Achimaas the son of Sadoc. And the king said: He is a good man: and cometh with good news.\"},{\"verse\":28,\"text\":\"And Achimaas crying out, said to the king: God save thee, O king. And falling down before the king with his face to the ground, he said: Blessed be the Lord thy God, who hath shut up the men that have lifted up their hands against the lord my king.\"},{\"verse\":29,\"text\":\"And the king said: Is the young man Absalom safe? And Achimaas said: I saw a great tumult, O king, when thy servant Joab sent me thy servant: I know nothing else.\"},{\"verse\":30,\"text\":\"And the king said to him: Pass, and stand here.\"},{\"verse\":31,\"text\":\"And when he had passed, and stood still, Chusai appeared and coming up he said: I bring good tidings, my lord, the king, for the Lord hath judged for thee this day from the hand of all that have risen up against thee.\"},{\"verse\":32,\"text\":\"And the king said to Chusai: Is the young man Absalom safe? And Chusai answering him, said: Let the enemies of my lord, the king, and all that rise against him unto evil, be as the young man is.\"},{\"verse\":33,\"text\":\"The king therefore being much moved, went up to the high chamber over the gate, and wept. And as he went he spoke in this manner: My son Absalom, Absalom my son: would to God that I might die for thee, Absalom my son, my son Absalom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur considerato David populo suo, constituit super eos tribunos et centuriones,\"},{\"verse\":2,\"text\":\"et dedit populi tertiam partem sub manu Joab, et tertiam partem sub manu Abisai filii Sarviæ fratris Joab, et tertiam partem sub manu Ethai, qui erat de Geth. Dixitque rex ad populum : Egrediar et ego vobiscum.\"},{\"verse\":3,\"text\":\"Et respondit populus : Non exibis : sive enim fugerimus, non magnopere ad eos de nobis pertinebit : sive media pars ceciderit e nobis, non satis curabunt, quia tu unus pro decem millibus computaris : melius est igitur ut sis nobis in urbe præsidio.\"},{\"verse\":4,\"text\":\"Ad quos rex ait : Quod vobis videtur rectum, hoc faciam. Stetit ergo rex juxta portam : egrediebaturque populus per turmas suas centeni et milleni.\"},{\"verse\":5,\"text\":\"Et præcepit rex Joab, et Abisai, et Ethai, dicens : Servate mihi puerum Absalom. Et omnis populus audiebat præcipientem regem cunctis principibus pro Absalom.\"},{\"verse\":6,\"text\":\"Itaque egressus est populus in campum contra Israël, et factum est prælium in saltu Ephraim.\"},{\"verse\":7,\"text\":\"Et cæsus est ibi populus Israël ab exercitu David, factaque est plaga magna in die illa, viginti millium.\"},{\"verse\":8,\"text\":\"Fuit autem ibi prælium dispersum super faciem omnis terræ, et multo plures erant quos saltus consumpserat de populo, quam hi quos voraverat gladius in die illa.\"},{\"verse\":9,\"text\":\"Accidit autem ut occurreret Absalom servis David, sedens mulo : cumque ingressus fuisset mulus subter condensam quercum et magnam, adhæsit caput ejus quercui : et illo suspenso inter cælum et terram, mulus cui insederat, pertransivit.\"},{\"verse\":10,\"text\":\"Vidit autem hoc quispiam, et nuntiavit Joab, dicens : Vidi Absalom pendere de quercu.\"},{\"verse\":11,\"text\":\"Et ait Joab viro qui nuntiaverat ei : Si vidisti, quare non confodisti eum cum terra, et ego dedissem tibi decem argenti siclos, et unum balteum ?\"},{\"verse\":12,\"text\":\"Qui dixit ad Joab : Si appenderes in manibus meis mille argenteos, nequaquam mitterem manum meam in filium regis : audientibus enim nobis præcepit rex tibi, et Abisai, et Ethai, dicens : Custodite mihi puerum Absalom.\"},{\"verse\":13,\"text\":\"Sed etsi fecissem contra animam meam audacter, nequaquam hoc regem latere potuisset, et tu stares ex adverso ?\"},{\"verse\":14,\"text\":\"Et ait Joab : Non sicut tu vis, sed aggrediar eum coram te. Tulit ergo tres lanceas in manu sua, et infixit eas in corde Absalom : cumque adhuc palpitaret hærens in quercu,\"},{\"verse\":15,\"text\":\"cucurrerunt decem juvenes armigeri Joab, et percutientes interfecerunt eum.\"},{\"verse\":16,\"text\":\"Cecinit autem Joab buccina, et retinuit populum, ne persequeretur fugientem Israël, volens parcere multitudini.\"},{\"verse\":17,\"text\":\"Et tulerunt Absalom, et projecerunt eum in saltu, in foveam grandem, et comportaverunt super eum acervum lapidum magnum nimis : omnis autem Israël fugit in tabernacula sua.\"},{\"verse\":18,\"text\":\"Porro Absalom erexerat sibi, cum adhuc viveret, titulum qui est in Valle regis : dixerat enim : Non habeo filium, et hoc erit monimentum nominis mei. Vocavitque titulum nomine suo, et appellatur Manus Absalom, usque ad hanc diem.\"},{\"verse\":19,\"text\":\"Achimaas autem filius Sadoc, ait : Curram, et nuntiabo regi quia judicium fecerit ei Dominus de manu inimicorum ejus.\"},{\"verse\":20,\"text\":\"Ad quem Joab dixit : Non eris nuntius in hac die, sed nuntiabis in alia : hodie nolo te nuntiare : filius enim regis est mortuus.\"},{\"verse\":21,\"text\":\"Et ait Joab Chusi : Vade, et nuntia regi quæ vidisti. Adoravit Chusi Joab, et cucurrit.\"},{\"verse\":22,\"text\":\"Rursus autem Achimaas filius Sadoc dixit ad Joab : Quid impedit si etiam ego curram post Chusi ? Dixitque ei Joab : Quid vis currere, fili mi ? non eris boni nuntii bajulus.\"},{\"verse\":23,\"text\":\"Qui respondit : Quid enim si cucurrero ? Et ait ei : Curre. Currens ergo Achimaas per viam compendii, transivit Chusi.\"},{\"verse\":24,\"text\":\"David autem sedebat inter duas portas : speculator vero, qui erat in fastigio portæ super murum, elevans oculos, vidit hominem currentem solum.\"},{\"verse\":25,\"text\":\"Et exclamans indicavit regi : dixitque rex : Si solus est, bonus est nuntius in ore ejus. Properante autem illo, et accedente propius,\"},{\"verse\":26,\"text\":\"vidit speculator hominem alterum currentem, et vociferans in culmine, ait : Apparet mihi alter homo currens solus. Dixitque rex : Et iste bonus est nuntius.\"},{\"verse\":27,\"text\":\"Speculator autem : Contemplor, ait, cursum prioris, quasi cursum Achimaas filii Sadoc. Et ait rex : Vir bonus est, et nuntium portans bonum venit.\"},{\"verse\":28,\"text\":\"Clamans autem Achimaas, dixit ad regem : Salve rex. Et adorans regem coram eo pronus in terram, ait : Benedictus Dominus Deus tuus, qui conclusit homines qui levaverunt manus suas contra dominum meum regem.\"},{\"verse\":29,\"text\":\"Et ait rex : Estne pax puero Absalom ? Dixitque Achimaas : Vidi tumultum magnum cum mitteret Joab servus tuus, o rex, me servum tuum : nescio aliud.\"},{\"verse\":30,\"text\":\"Ad quem rex : Transi, ait, et sta hic. Cumque ille transisset, et staret,\"},{\"verse\":31,\"text\":\"apparuit Chusi : et veniens ait : Bonum apporto nuntium, domine mi rex : judicavit enim pro te Dominus hodie de manu omnium qui surrexerunt contra te.\"},{\"verse\":32,\"text\":\"Dixit autem rex ad Chusi : Estne pax puero Absalom ? Cui respondens Chusi : Fiant, inquit, sicut puer, inimici domini mei regis, et universi qui consurgunt adversus eum in malum.\"},{\"verse\":33,\"text\":\"Contristatus itaque rex, ascendit cœnaculum portæ, et flevit. Et sic loquebatur, vadens : Fili mi Absalom, Absalom fili mi : quis mihi tribuat ut ego moriar pro te, Absalom fili mi, fili mi Absalom ?\"}],\"summary\":\"Absalom is defeated, and slain by Joab. David mourneth for him.\",\"intro\":null,\"prev\":{\"usfm\":\"2SA\",\"chapter\":17,\"label\":\"2 Samuel 17\"},\"next\":{\"usfm\":\"2SA\",\"chapter\":19,\"label\":\"2 Samuel 19\"}}]]\n"])</script></body></html>
