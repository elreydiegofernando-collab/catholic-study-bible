<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>2 Samuel 15 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Samuel<!-- --> <span class="text-stone-500">15</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2SA/">About <!-- -->2 Samuel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Absalom’s policy and conspiracy. David is obliged to flee.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now after these things Absalom made himself chariots, and horsemen, and fifty men to run before him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Absalom rising up early stood by the entrance of the gate, and when any man had business to come to the king’s judgment, Absalom called him to him, and said: Of what city art thou? He answered, and said: Thy servant is of such tribe of Israel.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Absalom answered him: Thy words seem to me good and just. But there is no man appointed by the king to hear thee. And Absalom said:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O that they would make me judge over the land, that all that have business might come to me, that I might do them justice.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Moreover when any man came to him to salute him, he put forth his hand, and took him, and kissed him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And this he did to all Israel that came for judgment, to be heard by the king, and he enticed the hearts of the men of Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And after forty years, Absalom said to king David: Let me go, and pay my vows which I have vowed to the Lord in Hebron.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For thy servant made a vow, when he was in Gessur of Syria, saying: If the Lord shall bring me again into Jerusalem, I will offer sacrifice to the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And king David said to him: Go in peace. And he arose, and went to Hebron.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Absalom sent spies into all the tribes of Israel, saying: As soon as you shall hear the sound of the trumpet, say ye: Absalom reigneth in Hebron.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now there went with Absalom two hundred men out of Jerusalem that were called, going with simplicity of heart, and knowing nothing of the design.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Absalom also sent for Achitophel the Gilonite, David’s counsellor, from his city Gilo. And while he was offering sacrifices, there was a strong conspiracy, and the people running together increased with Absalom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And there came a messenger to David, saying: All Israel with their whole heart followeth Absalom.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And David said to his servants, that were with him in Jerusalem: Arise and let us flee: for we shall not escape else from the face of Absalom: make haste to go out, lest he come and overtake us, and bring ruin upon us, and smite the city with the edge of the sword.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the king’s servants said to him: Whatsoever our lord the king shall command, we thy servants will willingly execute.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the king went forth, and all his household on foot: and the king left ten women his concubines to keep the house:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the king going forth and all Israel on foot, stood afar off from the house:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all his servants walked by him, and the bands of the Cerethi, and the Phelethi, and all the Gethites, valiant warriors, six hundred men who had followed him from Geth on foot, went before the king.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the king said to Ethai the Gethite: Why comest thou with us: return and dwell with the king, for thou art a stranger, and art come out of thy own place.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Yesterday thou camest, and to day shalt thou be forced to go forth with us? but I shall go whither I am going: return thou, and take back thy brethren with thee, and the Lord will shew thee mercy, and truth, because thou hast shewn grace and fidelity.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Ethai answered the king, saying: As the Lord liveth, and as my lord the king liveth: in what place soever thou shalt be, my lord, O king, either in death, or in life, there will thy servant be.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And David said to Ethai: Come, and pass over. And Ethai the Gethite passed, and all the men that were with him, and the rest of the people.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they all wept with a loud voice, and all the people passed over: the king also himself went over the brook Cedron, and all the people marched towards the way that looketh to the desert.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Sadoc the priest also came, and all the Levites with him carrying the ark of the covenant of God, and they set down the ark of God: and Abiathar went up, till all the people that was come out of the city had done passing.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the king said to Sadoc: Carry back the ark of God into the city: if I shall find grace in the sight of the Lord, he will bring me again, and he will shew me it, and his tabernacle.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But if he shall say to me: Thou pleasest me not: I am ready, let him do that which is good before him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the king said to Sadoc the priest: O seer, return into the city in peace: and let Achimaas thy son, and Jonathan the son of Abiathar, your two sons, be with you.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Behold I will lie hid in the plains of the wilderness, till there come word from you to certify me.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>So Sadoc and Abiathar carried back the ark of God into Jerusalem: and they tarried there.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But David went up by the ascent of mount Olivet, going up and weeping, walking barefoot, and with his head covered, and all the people that were with them, went up with their heads covered weeping.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And it was told David that Achitophel also was in the conspiracy with Absalom, and David said: Infatuate, O Lord, I beseech thee, the counsel of Achitophel.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when David was come to the top of the mountain, where he was about to adore the Lord, behold Chusai the Arachite, came to meet him with his garment rent and his head covered with earth.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And David said to him: If thou come with me, thou wilt be a burden to me:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But if thou return into the city, and wilt say to Absalom: I am thy servant, O king: as I have been thy father’s servant, so I will be thy servant: thou shalt defeat the counsel of Achitophel.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And thou hast with thee Sadoc, and Abiathar the priests: and what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Sadoc and Abiathar the priests.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And there are with them their two sons Achimaas; the son of Sadoc, and Jonathan the son of Abiathar: and you shall send by them to me every thing that you shall hear.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Then Chusai the friend of David went into the city, and Absalom came into Jerusalem.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur post hæc fecit sibi Absalom currus, et equites, et quinquaginta viros qui præcederent eum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et mane consurgens Absalom, stabat juxta introitum portæ, et omnem virum qui habebat negotium ut veniret ad regis judicium, vocabat Absalom ad se, et dicebat : De qua civitate es tu ? Qui respondens aiebat : Ex una tribu Israël ego sum servus tuus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Respondebatque ei Absalom : Videntur mihi sermones tui boni et justi, sed non est qui te audiat constitutus a rege. Dicebatque Absalom :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quis me constituat judicem super terram, ut ad me veniant omnes qui habent negotium, et juste judicem ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sed et cum accederet ad eum homo ut salutaret illum, extendebat manum suam, et apprehendens osculabatur eum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Faciebatque hoc omni Israël venienti ad judicium ut audiretur a rege, et sollicitabat corda virorum Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Post quadraginta autem annos, dixit Absalom ad regem David : Vadam, et reddam vota mea quæ vovi Domino in Hebron.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Vovens enim vovit servus tuus cum esset in Gessur Syriæ, dicens : Si reduxerit me Dominus in Jerusalem, sacrificabo Domino.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixitque ei rex David : Vade in pace. Et surrexit, et abiit in Hebron.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Misit autem Absalom exploratores in universas tribus Israël, dicens : Statim ut audieritis clangorem buccinæ, dicite : Regnavit Absalom in Hebron.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Porro cum Absalom ierunt ducenti viri de Jerusalem vocati, euntes simplici corde, et causam penitus ignorantes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Accersivit quoque Absalom Achitophel Gilonitem consiliarium David, de civitate sua Gilo. Cumque immolaret victimas, facta est conjuratio valida, populusque concurrens augebatur cum Absalom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Venit igitur nuntius ad David, dicens : Toto corde universus Israël sequitur Absalom.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ait David servis suis qui erant cum eo in Jerusalem : Surgite, fugiamus : neque enim erit nobis effugium a facie Absalom : festinate egredi, ne forte veniens occupet nos, et impellat super nos ruinam, et percutiat civitatem in ore gladii.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dixeruntque servi regis ad eum : Omnia quæcumque præceperit dominus noster rex, libenter exequemur servi tui.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Egressus est ergo rex et universa domus ejus pedibus suis : et dereliquit rex decem mulieres concubinas ad custodiendam domum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Egressusque rex et omnis Israël pedibus suis, stetit procul a domo :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et universi servi ejus ambulabant juxta eum, et legiones Cerethi, et Phelethi, et omnes Gethæi, pugnatores validi, sexcenti viri qui secuti eum fuerant de Geth pedites, præcedebant regem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dixit autem rex ad Ethai Gethæum : Cur venis nobiscum ? revertere, et habita cum rege, quia peregrinus es, et egressus es de loco tuo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Heri venisti, et hodie compelleris nobiscum egredi ? ego autem vadam quo iturus sum : revertere, et reduc tecum fratres tuos, et Dominus faciet tecum misericordiam et veritatem, quia ostendisti gratiam et fidem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et respondit Ethai regi dicens : Vivit Dominus, et vivit dominus meus rex, quoniam in quocumque loco fueris, domine mi rex, sive in morte, sive in vita, ibi erit servus tuus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et ait David Ethai : Veni, et transi. Et transivit Ethai Gethæus, et omnes viri qui cum eo erant, et reliqua multitudo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Omnesque flebant voce magna, et universus populus transibat : rex quoque transgrediebatur torrentem Cedron, et cunctus populus incedebat contra viam quæ respicit ad desertum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Venit autem et Sadoc sacerdos, et universi Levitæ cum eo, portantes arcam fœderis Dei : et deposuerunt arcam Dei. Et ascendit Abiathar, donec expletus esset omnis populus qui egressus fuerat de civitate.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et dixit rex ad Sadoc : Reporta arcam Dei in urbem : si invenero gratiam in oculis Domini, reducet me, et ostendet mihi eam, et tabernaculum suum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Si autem dixerit mihi : Non places : præsto sum : faciat quod bonum est coram se.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et dixit rex ad Sadoc sacerdotem : O videns, revertere in civitatem in pace : et Achimaas filius tuus, et Jonathas filius Abiathar, duo filii vestri, sint vobiscum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ecce ego abscondar in campestribus deserti, donec veniat sermo a vobis indicans mihi.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Reportaverunt ergo Sadoc et Abiathar arcam Dei in Jerusalem, et manserunt ibi.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Porro David ascendebat clivum Olivarum, scandens et flens, nudis pedibus incedens, et operto capite : sed et omnis populus qui erat cum eo, operto capite ascendebat plorans.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Nuntiatum est autem David quod et Achitophel esset in conjuratione cum Absalom : dixitque David : Infatua, quæso, Domine, consilium Achitophel.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Cumque ascenderet David summitatem montis in quo adoraturus erat Dominum, ecce occurrit ei Chusai Arachites, scissa veste, et terra pleno capite.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et dixit ei David : Si veneris mecum, eris mihi oneri :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>si autem in civitatem revertaris, et dixeris Absalom : Servus tuus sum, rex : sicut fui servus patris tui, sic ero servus tuus : dissipabis consilium Achitophel.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Habes autem tecum Sadoc et Abiathar sacerdotes : et omne verbum quodcumque audieris de domo regis, indicabis Sadoc et Abiathar sacerdotibus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Sunt autem cum eis duo filii eorum Achimaas filius Sadoc, et Jonathas filius Abiathar : et mittetis per eos ad me omne verbum quod audieritis.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Veniente ergo Chusai amico David in civitatem, Absalom quoque ingressus est Jerusalem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2SA/14/"><svg viewBox="0 24,\"dra\":[{\"verse\":1,\"text\":\"Now after these things Absalom made himself chariots, and horsemen, and fifty men to run before him.\"},{\"verse\":2,\"text\":\"And Absalom rising up early stood by the entrance of the gate, and when any man had business to come to the king’s judgment, Absalom called him to him, and said: Of what city art thou? He answered, and said: Thy servant is of such tribe of Israel.\"},{\"verse\":3,\"text\":\"And Absalom answered him: Thy words seem to me good and just. But there is no man appointed by the king to hear thee. And Absalom said:\"},{\"verse\":4,\"text\":\"O that they would make me judge over the land, that all that have business might come to me, that I might do them justice.\"},{\"verse\":5,\"text\":\"Moreover when any man came to him to salute him, he put forth his hand, and took him, and kissed him.\"},{\"verse\":6,\"text\":\"And this he did to all Israel that came for judgment, to be heard by the king, and he enticed the hearts of the men of Israel.\"},{\"verse\":7,\"text\":\"And after forty years, Absalom said to king David: Let me go, and pay my vows which I have vowed to the Lord in Hebron.\"},{\"verse\":8,\"text\":\"For thy servant made a vow, when he was in Gessur of Syria, saying: If the Lord shall bring me again into Jerusalem, I will offer sacrifice to the Lord.\"},{\"verse\":9,\"text\":\"And king David said to him: Go in peace. And he arose, and went to Hebron.\"},{\"verse\":10,\"text\":\"And Absalom sent spies into all the tribes of Israel, saying: As soon as you shall hear the sound of the trumpet, say ye: Absalom reigneth in Hebron.\"},{\"verse\":11,\"text\":\"Now there went with Absalom two hundred men out of Jerusalem that were called, going with simplicity of heart, and knowing nothing of the design.\"},{\"verse\":12,\"text\":\"Absalom also sent for Achitophel the Gilonite, David’s counsellor, from his city Gilo. And while he was offering sacrifices, there was a strong conspiracy, and the people running together increased with Absalom.\"},{\"verse\":13,\"text\":\"And there came a messenger to David, saying: All Israel with their whole heart followeth Absalom.\"},{\"verse\":14,\"text\":\"And David said to his servants, that were with him in Jerusalem: Arise and let us flee: for we shall not escape else from the face of Absalom: make haste to go out, lest he come and overtake us, and bring ruin upon us, and smite the city with the edge of the sword.\"},{\"verse\":15,\"text\":\"And the king’s servants said to him: Whatsoever our lord the king shall command, we thy servants will willingly execute.\"},{\"verse\":16,\"text\":\"And the king went forth, and all his household on foot: and the king left ten women his concubines to keep the house:\"},{\"verse\":17,\"text\":\"And the king going forth and all Israel on foot, stood afar off from the house:\"},{\"verse\":18,\"text\":\"And all his servants walked by him, and the bands of the Cerethi, and the Phelethi, and all the Gethites, valiant warriors, six hundred men who had followed him from Geth on foot, went before the king.\"},{\"verse\":19,\"text\":\"And the king said to Ethai the Gethite: Why comest thou with us: return and dwell with the king, for thou art a stranger, and art come out of thy own place.\"},{\"verse\":20,\"text\":\"Yesterday thou camest, and to day shalt thou be forced to go forth with us? but I shall go whither I am going: return thou, and take back thy brethren with thee, and the Lord will shew thee mercy, and truth, because thou hast shewn grace and fidelity.\"},{\"verse\":21,\"text\":\"And Ethai answered the king, saying: As the Lord liveth, and as my lord the king liveth: in what place soever thou shalt be, my lord, O king, either in death, or in life, there will thy servant be.\"},{\"verse\":22,\"text\":\"And David said to Ethai: Come, and pass over. And Ethai the Gethite passed, and all the men that were with him, and the rest of the people.\"},{\"verse\":23,\"text\":\"And they all wept with a loud voice, and all the people passed over: the king also himself went over the brook Cedron, and all the people marched towards the way that looketh to the desert.\"},{\"verse\":24,\"text\":\"And Sadoc the priest also came, and all the Levites with him carrying the ark of the covenant of God, and they set down the ark of God: and Abiathar went up, till all the people that was come out of the city had done passing.\"},{\"verse\":25,\"text\":\"And the king said to Sadoc: Carry back the ark of God into the city: if I shall find grace in the sight of the Lord, he will bring me again, and he will shew me it, and his tabernacle.\"},{\"verse\":26,\"text\":\"But if he shall say to me: Thou pleasest me not: I am ready, let him do that which is good before him.\"},{\"verse\":27,\"text\":\"And the king said to Sadoc the priest: O seer, return into the city in peace: and let Achimaas thy son, and Jonathan the son of Abiathar, your two sons, be with you.\"},{\"verse\":28,\"text\":\"Behold I will lie hid in the plains of the wilderness, till there come word from you to certify me.\"},{\"verse\":29,\"text\":\"So Sadoc and Abiathar carried back the ark of God into Jerusalem: and they tarried there.\"},{\"verse\":30,\"text\":\"But David went up by the ascent of mount Olivet, going up and weeping, walking barefoot, and with his head covered, and all the people that were with them, went up with their heads covered weeping.\"},{\"verse\":31,\"text\":\"And it was told David that Achitophel also was in the conspiracy with Absalom, and David said: Infatuate, O Lord, I beseech thee, the counsel of Achitophel.\"},{\"verse\":32,\"text\":\"And when David was come to the top of the mountain, where he was about to adore the Lord, behold Chusai the Arachite, came to meet him with his garment rent and his head covered with earth.\"},{\"verse\":33,\"text\":\"And David said to him: If thou come with me, thou wilt be a burden to me:\"},{\"verse\":34,\"text\":\"But if thou return into the city, and wilt say to Absalom: I am thy servant, O king: as I have been thy father’s servant, so I will be thy servant: thou shalt defeat the counsel of Achitophel.\"},{\"verse\":35,\"text\":\"And thou hast with thee Sadoc, and Abiathar the priests: and what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Sadoc and Abiathar the priests.\"},{\"verse\":36,\"text\":\"And there are with them their two sons Achimaas; the son of Sadoc, and Jonathan the son of Abiathar: and you shall send by them to me every thing that you shall hear.\"},{\"verse\":37,\"text\":\"Then Chusai the friend of David went into the city, and Absalom came into Jerusalem.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur post hæc fecit sibi Absalom currus, et equites, et quinquaginta viros qui præcederent eum.\"},{\"verse\":2,\"text\":\"Et mane consurgens Absalom, stabat juxta introitum portæ, et omnem virum qui habebat negotium ut veniret ad regis judicium, vocabat Absalom ad se, et dicebat : De qua civitate es tu ? Qui respondens aiebat : Ex una tribu Israël ego sum servus tuus.\"},{\"verse\":3,\"text\":\"Respondebatque ei Absalom : Videntur mihi sermones tui boni et justi, sed non est qui te audiat constitutus a rege. Dicebatque Absalom :\"},{\"verse\":4,\"text\":\"Quis me constituat judicem super terram, ut ad me veniant omnes qui habent negotium, et juste judicem ?\"},{\"verse\":5,\"text\":\"Sed et cum accederet ad eum homo ut salutaret illum, extendebat manum suam, et apprehendens osculabatur eum.\"},{\"verse\":6,\"text\":\"Faciebatque hoc omni Israël venienti ad judicium ut audiretur a rege, et sollicitabat corda virorum Israël.\"},{\"verse\":7,\"text\":\"Post quadraginta autem annos, dixit Absalom ad regem David : Vadam, et reddam vota mea quæ vovi Domino in Hebron.\"},{\"verse\":8,\"text\":\"Vovens enim vovit servus tuus cum esset in Gessur Syriæ, dicens : Si reduxerit me Dominus in Jerusalem, sacrificabo Domino.\"},{\"verse\":9,\"text\":\"Dixitque ei rex David : Vade in pace. Et surrexit, et abiit in Hebron.\"},{\"verse\":10,\"text\":\"Misit autem Absalom exploratores in universas tribus Israël, dicens : Statim ut audieritis clangorem buccinæ, dicite : Regnavit Absalom in Hebron.\"},{\"verse\":11,\"text\":\"Porro cum Absalom ierunt ducenti viri de Jerusalem vocati, euntes simplici corde, et causam penitus ignorantes.\"},{\"verse\":12,\"text\":\"Accersivit quoque Absalom Achitophel Gilonitem consiliarium David, de civitate sua Gilo. Cumque immolaret victimas, facta est conjuratio valida, populusque concurrens augebatur cum Absalom.\"},{\"verse\":13,\"text\":\"Venit igitur nuntius ad David, dicens : Toto corde universus Israël sequitur Absalom.\"},{\"verse\":14,\"text\":\"Et ait David servis suis qui erant cum eo in Jerusalem : Surgite, fugiamus : neque enim erit nobis effugium a facie Absalom : festinate egredi, ne forte veniens occupet nos, et impellat super nos ruinam, et percutiat civitatem in ore gladii.\"},{\"verse\":15,\"text\":\"Dixeruntque servi regis ad eum : Omnia quæcumque præceperit dominus noster rex, libenter exequemur servi tui.\"},{\"verse\":16,\"text\":\"Egressus est ergo rex et universa domus ejus pedibus suis : et dereliquit rex decem mulieres concubinas ad custodiendam domum.\"},{\"verse\":17,\"text\":\"Egressusque rex et omnis Israël pedibus suis, stetit procul a domo :\"},{\"verse\":18,\"text\":\"et universi servi ejus ambulabant juxta eum, et legiones Cerethi, et Phelethi, et omnes Gethæi, pugnatores validi, sexcenti viri qui secuti eum fuerant de Geth pedites, præcedebant regem.\"},{\"verse\":19,\"text\":\"Dixit autem rex ad Ethai Gethæum : Cur venis nobiscum ? revertere, et habita cum rege, quia peregrinus es, et egressus es de loco tuo.\"},{\"verse\":20,\"text\":\"Heri venisti, et hodie compelleris nobiscum egredi ? ego autem vadam quo iturus sum : revertere, et reduc tecum fratres tuos, et Dominus faciet tecum misericordiam et veritatem, quia ostendisti gratiam et fidem.\"},{\"verse\":21,\"text\":\"Et respondit Ethai regi dicens : Vivit Dominus, et vivit dominus meus rex, quoniam in quocumque loco fueris, domine mi rex, sive in morte, sive in vita, ibi erit servus tuus.\"},{\"verse\":22,\"text\":\"Et ait David Ethai : Veni, et transi. Et transivit Ethai Gethæus, et omnes viri qui cum eo erant, et reliqua multitudo.\"},{\"verse\":23,\"text\":\"Omnesque flebant voce magna, et universus populus transibat : rex quoque transgrediebatur torrentem Cedron, et cunctus populus incedebat contra viam quæ respicit ad desertum.\"},{\"verse\":24,\"text\":\"Venit autem et Sadoc sacerdos, et universi Levitæ cum eo, portantes arcam fœderis Dei : et deposuerunt arcam Dei. Et ascendit Abiathar, donec expletus esset omnis populus qui egressus fuerat de civitate.\"},{\"verse\":25,\"text\":\"Et dixit rex ad Sadoc : Reporta arcam Dei in urbem : si invenero gratiam in oculis Domini, reducet me, et ostendet mihi eam, et tabernaculum suum.\"},{\"verse\":26,\"text\":\"Si autem dixerit mihi : Non places : præsto sum : faciat quod bonum est coram se.\"},{\"verse\":27,\"text\":\"Et dixit rex ad Sadoc sacerdotem : O videns, revertere in civitatem in pace : et Achimaas filius tuus, et Jonathas filius Abiathar, duo filii vestri, sint vobiscum.\"},{\"verse\":28,\"text\":\"Ecce ego abscondar in campestribus deserti, donec veniat sermo a vobis indicans mihi.\"},{\"verse\":29,\"text\":\"Reportaverunt ergo Sadoc et Abiathar arcam Dei in Jerusalem, et manserunt ibi.\"},{\"verse\":30,\"text\":\"Porro David ascendebat clivum Olivarum, scandens et flens, nudis pedibus incedens, et operto capite : sed et omnis populus qui erat cum eo, operto capite ascendebat plorans.\"},{\"verse\":31,\"text\":\"Nuntiatum est autem David quod et Achitophel esset in conjuratione cum Absalom : dixitque David : Infatua, quæso, Domine, consilium Achitophel.\"},{\"verse\":32,\"text\":\"Cumque ascenderet David summitatem montis in quo adoraturus erat Dominum, ecce occurrit ei Chusai Arachites, scissa veste, et terra pleno capite.\"},{\"verse\":33,\"text\":\"Et dixit ei David : Si veneris mecum, eris mihi oneri :\"},{\"verse\":34,\"text\":\"si autem in civitatem revertaris, et dixeris Absalom : Servus tuus sum, rex : sicut fui servus patris tui, sic ero servus tuus : dissipabis consilium Achitophel.\"},{\"verse\":35,\"text\":\"Habes autem tecum Sadoc et Abiathar sacerdotes : et omne verbum quodcumque audieris de domo regis, indicabis Sadoc et Abiathar sacerdotibus.\"},{\"verse\":36,\"text\":\"Sunt autem cum eis duo filii eorum Achimaas filius Sadoc, et Jonathas filius Abiathar : et mittetis per eos ad me omne verbum quod audieritis.\"},{\"verse\":37,\"text\":\"Veniente ergo Chusai amico David in civitatem, Absalom quoque ingressus est Jerusalem.\"}],\"summary\":\"Absalom’s policy and conspiracy. David is obliged to flee.\",\"intro\":null,\"prev\":{\"usfm\":\"2SA\",\"chapter\":14,\"label\":\"2 Samuel 14\"},\"next\":{\"usfm\":\"2SA\",\"chapter\":16,\"label\":\"2 Samuel 16\"}}]]\n"])</script></body></html>
