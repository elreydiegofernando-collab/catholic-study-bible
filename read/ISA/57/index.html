[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">57</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Isaias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ISA/">About <!-- -->Isaiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The infidelity of the Jews: their idolatry. Promises to humble penitents.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The just perisheth, and no man layeth it to heart, and men of mercy are taken away, because there is none that understandeth; for the just man is taken away from before the face of evil.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let peace come, let him rest in his bed that hath walked in his uprightness.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But draw near hither, you sons of the sorceress, the seed of the adulterer, and of the harlot.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Upon whom have you jested? upon whom have you opened your mouth wide, and put out your tongue? are not you wicked children, a false seed,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who seek your comfort in idols under every green tree, sacrificing children in the torrents, under the high rocks?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In the parts of the torrent is thy portion, this is thy lot: and thou hast poured out libations to them, thou hast offered sacrifice. Shall I not be angry at these things?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Upon a high and lofty mountain thou hast laid thy bed, and hast gone up thither to offer victims.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And behind the door, and behind the post thou hast set up thy remembrance: for thou hast discovered thyself near me, and hast received an adulterer: thou hast enlarged thy bed, and made a covenant with them: thou hast loved their bed with open hand.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And thou hast adorned thyself for the king with ointment, and hast multiplied thy perfumes. Thou hast sent thy messengers far off, and wast debased even to hell.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou hast been wearied in the multitude of thy ways: yet thou saidst not: I will rest: thou hast found life of thy hand, therefore thou hast not asked.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For whom hast thou been solicitous and afraid, that thou hast lied, and hast not been mindful of me, nor thought on me in thy heart? for I am silent, and as one that seeth not, and thou hast forgotten me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I will declare thy justice, and thy works shall not profit thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>When thou shalt cry, let thy companies deliver thee, but the wind shall carry them all off, a breeze shall take them away, but he that putteth his trust in me, shall inherit the land, and shall possess my holy mount.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And I will say: Make a way: give free passage, turn out of the path, take away the stumblingblocks out of the way of my people.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For thus saith the High and the Eminent that inhabiteth eternity: and his name is Holy, who dwelleth in the high and holy place, and with a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For I will not contend for ever, neither will I be angry unto the end: because the spirit shall go forth from my face, and breathings I will make.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the iniquity of his covetousness I was angry, and I struck him: I hid my face from thee, and was angry: and he went away wandering in his own heart.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I saw his ways, and I healed him, and brought him back, and restored comforts to him, and to them that mourn for him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I created the fruit of the lips, peace, peace to him that is far off, and to him that is near, said the Lord, and I healed him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But the wicked are like the raging sea, which cannot rest, and the waves thereof cast up dirt and mire.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>There is no peace to the wicked, saith the Lord God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Justus perit, et non est qui recogitet in corde suo ; et viri misericordiæ colliguntur, quia non est qui intelligat : a facie enim malitiæ collectus est justus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Veniat pax ; requiescat in cubili suo qui ambulavit in directione sua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Vos autem accedite huc, filii auguratricis, semen adulteri et fornicariæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Super quem lusistis ? super quem dilatastis os, et ejecistis linguam ? Numquid non vos filii scelesti, semen mendax,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui consolamini in diis subter omne lignum frondosum, immolantes parvulos in torrentibus, subter eminentes petras ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In partibus torrentis pars tua ; hæc est sors tua : et ipsis effudisti libamen, obtulisti sacrificium. Numquid super his non indignabor ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Super montem excelsum et sublimem posuisti cubile tuum, et illuc ascendisti ut immolares hostias.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et post ostium, et retro postem, posuisti memoriale tuum. Quia juxta me discooperuisti, et suscepisti adulterum, dilatasti cubile tuum, et pepigisti cum eis fœdus ; dilexisti stratum eorum manu aperta.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ornasti te regi unguento, et multiplicasti pigmenta tua. Misisti legatos tuos procul, et humiliata es usque ad inferos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In multitudine viæ tuæ laborasti ; non dixisti : Quiescam. Vitam manus tuæ invenisti ; propterea non rogasti.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pro quo sollicita timuisti, quia mentita es, et mei non es recordata, neque cogitasti in corde tuo ? Quia ego tacens et quasi non videns, et mei oblita es.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ego annuntiabo justitiam tuam, et opera tua non proderunt tibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cum clamaveris, liberent te congregati tui, et omnes eos auferet ventus, tollet aura. Qui autem fiduciam habet mei, hæreditabit terram, et possidebit montem sanctum meum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et dicam : Viam facite, præbete iter ; declinate de semita, auferte offendicula de via populi mei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quia hæc dicit Excelsus, et Sublimis, habitans æternitatem, et sanctum nomen ejus : in excelso et in sancto habitans, et cum contrito et humili spiritu : ut vivificet spiritum humilium, et vivificet cor contritorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non enim in sempiternum litigabo, neque usque ad finem irascar, quia spiritus a facie mea egredietur, et flatus ego faciam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Propter iniquitatem avaritiæ ejus iratus sum, et percussi eum. Abscondi a te faciem meam, et indignatus sum ; et abiit vagus in via cordis sui.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vias ejus vidi, et sanavi eum ; et reduxi eum, et reddidi consolationes ipsi, et lugentibus ejus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Creavi fructum labiorum pacem ; pacem ei qui longe est et qui prope, dixit Dominus, et sanavi eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Impii autem quasi mare fervens, quod quiescere non potest, et redundant fluctus ejus in conculcationem et lutum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non est pax impiis, dicit Dominus Deus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/56/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin way, because there is none that understandeth; for the just man is taken away from before the face of evil.\"},{\"verse\":2,\"text\":\"Let peace come, let him rest in his bed that hath walked in his uprightness.\"},{\"verse\":3,\"text\":\"But draw near hither, you sons of the sorceress, the seed of the adulterer, and of the harlot.\"},{\"verse\":4,\"text\":\"Upon whom have you jested? upon whom have you opened your mouth wide, and put out your tongue? are not you wicked children, a false seed,\"},{\"verse\":5,\"text\":\"Who seek your comfort in idols under every green tree, sacrificing children in the torrents, under the high rocks?\"},{\"verse\":6,\"text\":\"In the parts of the torrent is thy portion, this is thy lot: and thou hast poured out libations to them, thou hast offered sacrifice. Shall I not be angry at these things?\"},{\"verse\":7,\"text\":\"Upon a high and lofty mountain thou hast laid thy bed, and hast gone up thither to offer victims.\"},{\"verse\":8,\"text\":\"And behind the door, and behind the post thou hast set up thy remembrance: for thou hast discovered thyself near me, and hast received an adulterer: thou hast enlarged thy bed, and made a covenant with them: thou hast loved their bed with open hand.\"},{\"verse\":9,\"text\":\"And thou hast adorned thyself for the king with ointment, and hast multiplied thy perfumes. Thou hast sent thy messengers far off, and wast debased even to hell.\"},{\"verse\":10,\"text\":\"Thou hast been wearied in the multitude of thy ways: yet thou saidst not: I will rest: thou hast found life of thy hand, therefore thou hast not asked.\"},{\"verse\":11,\"text\":\"For whom hast thou been solicitous and afraid, that thou hast lied, and hast not been mindful of me, nor thought on me in thy heart? for I am silent, and as one that seeth not, and thou hast forgotten me.\"},{\"verse\":12,\"text\":\"I will declare thy justice, and thy works shall not profit thee.\"},{\"verse\":13,\"text\":\"When thou shalt cry, let thy companies deliver thee, but the wind shall carry them all off, a breeze shall take them away, but he that putteth his trust in me, shall inherit the land, and shall possess my holy mount.\"},{\"verse\":14,\"text\":\"And I will say: Make a way: give free passage, turn out of the path, take away the stumblingblocks out of the way of my people.\"},{\"verse\":15,\"text\":\"For thus saith the High and the Eminent that inhabiteth eternity: and his name is Holy, who dwelleth in the high and holy place, and with a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite.\"},{\"verse\":16,\"text\":\"For I will not contend for ever, neither will I be angry unto the end: because the spirit shall go forth from my face, and breathings I will make.\"},{\"verse\":17,\"text\":\"For the iniquity of his covetousness I was angry, and I struck him: I hid my face from thee, and was angry: and he went away wandering in his own heart.\"},{\"verse\":18,\"text\":\"I saw his ways, and I healed him, and brought him back, and restored comforts to him, and to them that mourn for him.\"},{\"verse\":19,\"text\":\"I created the fruit of the lips, peace, peace to him that is far off, and to him that is near, said the Lord, and I healed him.\"},{\"verse\":20,\"text\":\"But the wicked are like the raging sea, which cannot rest, and the waves thereof cast up dirt and mire.\"},{\"verse\":21,\"text\":\"There is no peace to the wicked, saith the Lord God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Justus perit, et non est qui recogitet in corde suo ; et viri misericordiæ colliguntur, quia non est qui intelligat : a facie enim malitiæ collectus est justus.\"},{\"verse\":2,\"text\":\"Veniat pax ; requiescat in cubili suo qui ambulavit in directione sua.\"},{\"verse\":3,\"text\":\"Vos autem accedite huc, filii auguratricis, semen adulteri et fornicariæ.\"},{\"verse\":4,\"text\":\"Super quem lusistis ? super quem dilatastis os, et ejecistis linguam ? Numquid non vos filii scelesti, semen mendax,\"},{\"verse\":5,\"text\":\"qui consolamini in diis subter omne lignum frondosum, immolantes parvulos in torrentibus, subter eminentes petras ?\"},{\"verse\":6,\"text\":\"In partibus torrentis pars tua ; hæc est sors tua : et ipsis effudisti libamen, obtulisti sacrificium. Numquid super his non indignabor ?\"},{\"verse\":7,\"text\":\"Super montem excelsum et sublimem posuisti cubile tuum, et illuc ascendisti ut immolares hostias.\"},{\"verse\":8,\"text\":\"Et post ostium, et retro postem, posuisti memoriale tuum. Quia juxta me discooperuisti, et suscepisti adulterum, dilatasti cubile tuum, et pepigisti cum eis fœdus ; dilexisti stratum eorum manu aperta.\"},{\"verse\":9,\"text\":\"Et ornasti te regi unguento, et multiplicasti pigmenta tua. Misisti legatos tuos procul, et humiliata es usque ad inferos.\"},{\"verse\":10,\"text\":\"In multitudine viæ tuæ laborasti ; non dixisti : Quiescam. Vitam manus tuæ invenisti ; propterea non rogasti.\"},{\"verse\":11,\"text\":\"Pro quo sollicita timuisti, quia mentita es, et mei non es recordata, neque cogitasti in corde tuo ? Quia ego tacens et quasi non videns, et mei oblita es.\"},{\"verse\":12,\"text\":\"Ego annuntiabo justitiam tuam, et opera tua non proderunt tibi.\"},{\"verse\":13,\"text\":\"Cum clamaveris, liberent te congregati tui, et omnes eos auferet ventus, tollet aura. Qui autem fiduciam habet mei, hæreditabit terram, et possidebit montem sanctum meum.\"},{\"verse\":14,\"text\":\"Et dicam : Viam facite, præbete iter ; declinate de semita, auferte offendicula de via populi mei.\"},{\"verse\":15,\"text\":\"Quia hæc dicit Excelsus, et Sublimis, habitans æternitatem, et sanctum nomen ejus : in excelso et in sancto habitans, et cum contrito et humili spiritu : ut vivificet spiritum humilium, et vivificet cor contritorum.\"},{\"verse\":16,\"text\":\"Non enim in sempiternum litigabo, neque usque ad finem irascar, quia spiritus a facie mea egredietur, et flatus ego faciam.\"},{\"verse\":17,\"text\":\"Propter iniquitatem avaritiæ ejus iratus sum, et percussi eum. Abscondi a te faciem meam, et indignatus sum ; et abiit vagus in via cordis sui.\"},{\"verse\":18,\"text\":\"Vias ejus vidi, et sanavi eum ; et reduxi eum, et reddidi consolationes ipsi, et lugentibus ejus.\"},{\"verse\":19,\"text\":\"Creavi fructum labiorum pacem ; pacem ei qui longe est et qui prope, dixit Dominus, et sanavi eum.\"},{\"verse\":20,\"text\":\"Impii autem quasi mare fervens, quod quiescere non potest, et redundant fluctus ejus in conculcationem et lutum.\"},{\"verse\":21,\"text\":\"Non est pax impiis, dicit Dominus Deus.\"}],\"summary\":\"The infidelity of the Jews: their idolatry. Promises to humble penitents.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":56,\"label\":\"Isaiah 56\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":58,\"label\":\"Isaiah 58\"}}]]\n"])</script></body></html>
