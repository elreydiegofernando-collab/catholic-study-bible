t="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And there shall come forth a rod out of the root of Jesse, and a flower shall rise up out of his root.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the spirit of the Lord shall rest upon him: the spirit of wisdom, and of understanding, the spirit of counsel, and of fortitude, the spirit of knowledge, and of godliness.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he shall be filled with the spirit of the fear of the Lord, He shall not judge according to the sight of the eyes, nor reprove according to the hearing of the ears.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But he shall judge the poor with justice, and shall reprove with equity for the meek of the earth: and he shall strike the earth with the rod of his mouth, and with the breath of his lips he shall slay the wicked.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And justice shall be the girdle of his loins: and faith the girdle of his reins.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The wolf shall dwell with the lamb: and the leopard shall lie down with the kid: the calf and the lion, and the sheep shall abide together, and a little child shall lead them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The calf and the bear shall feed: their young ones shall rest together: and the lion shall eat straw like the ox.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the sucking child shall play on the hole of the asp: and the weaned child shall thrust his hand into the den of the basilisk.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They shall not hurt, nor shall they kill in all my holy mountain, for the earth is filled with the knowledge of the Lord, as the covering waters of the sea.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In that day the root of Jesse, who standeth for an ensign of the people, him the Gentiles shall beseech, and his sepulchre shall be glorious.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And it shall come to pass in that day, that the Lord shall set his hand the second time to possess the remnant of his people, which shall be left from the Assyrians, and from Egypt, and from Phetros, and from Ethiopia, and from Elam, and from Sennaar, and from Emath, and from the islands of the sea.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he shall set up a standard unto the nations, and shall assemble the fugitives of Israel, and shall gather together the dispersed of Juda from the four quarters of the earth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the envy of Ephraim shall be taken away, and the enemies of Juda shall perish: Ephraim shall not envy Juda, and Juda shall not fight against Ephraim.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But they shall fly upon the shoulders of the Philistines by the sea, they together shall spoil the children of the east: Edom, and Moab shall be under the rule of their hand, and the children of Ammon shall be obedient.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the Lord shall lay waste the tongue of the sea of Egypt, and shall lift up his hand over the river in the strength of his spirit: and he shall strike it in the seven streams, so that men may pass through it in their shoes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And there shall be a highway for the remnant of my people, which shall be left from the Assyrians: as there was for Israel in the day that he came up out of the land of Egypt.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et egredietur virga de radice Jesse, et flos de radice ejus ascendet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et requiescet super eum spiritus Domini : spiritus sapientiæ et intellectus, spiritus consilii et fortitudinis, spiritus scientiæ et pietatis ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et replebit eum spiritus timoris Domini. Non secundum visionem oculorum judicabit, neque secundum auditum aurium arguet ;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sed judicabit in justitia pauperes, et arguet in æquitate pro mansuetis terræ ; et percutiet terram virga oris sui, et spiritu labiorum suorum interficiet impium.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et erit justitia cingulum lumborum ejus, et fides cinctorium renum ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Habitabit lupus cum agno, et pardus cum hædo accubabit ; vitulus, et leo, et ovis, simul morabuntur, et puer parvulus minabit eos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Vitulus et ursus pascentur, simul requiescent catuli eorum ; et leo quasi bos comedet paleas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et delectabitur infans ab ubere super foramine aspidis ; et in caverna reguli qui ablactatus fuerit manum suam mittet.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non nocebunt, et non occident in universo monte sancto meo, quia repleta est terra scientia Domini, sicut aquæ maris operientes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In die illa radix Jesse, qui stat in signum populorum, ipsum gentes deprecabuntur, et erit sepulchrum ejus gloriosum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et erit in die illa : adjiciet Dominus secundo manum suam ad possidendum residuum populi sui, quod relinquetur ab Assyriis, et ab Ægypto, et a Phetros, et ab Æthiopia, et ab Ælam, et a Sennaar, et ab Emath, et ab insulis maris.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et levabit signum in nationes, et congregabit profugos Israël, et dispersos Juda colliget a quatuor plagis terræ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et auferetur zelus Ephraim, et hostes Juda peribunt ; Ephraim non æmulabitur Judam, et Judas non pugnabit contra Ephraim.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et volabunt in humeros Philisthiim per mare, simul prædabuntur filios orientis ; Idumæa et Moab præceptum manus eorum, et filii Ammon obedientes erunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et desolabit Dominus linguam maris Ægypti, et levabit manum suam super flumen in fortitudine spiritus sui ; et percutiet eum in septem rivis, ita ut transeant per eum calceati.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et erit via residuo populo meo qui relinquetur ab Assyriis, sicut fuit Israëli in die illa qua ascendit de terra Ægypti.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous tatic/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ISA.11\",{\"bookId\":27,\"usfm\":\"ISA\",\"bookName\":\"Isaiah\",\"drName\":\"Isaias\",\"chapter\":11,\"totalChapters\":66,\"dra\":[{\"verse\":1,\"text\":\"And there shall come forth a rod out of the root of Jesse, and a flower shall rise up out of his root.\"},{\"verse\":2,\"text\":\"And the spirit of the Lord shall rest upon him: the spirit of wisdom, and of understanding, the spirit of counsel, and of fortitude, the spirit of knowledge, and of godliness.\"},{\"verse\":3,\"text\":\"And he shall be filled with the spirit of the fear of the Lord, He shall not judge according to the sight of the eyes, nor reprove according to the hearing of the ears.\"},{\"verse\":4,\"text\":\"But he shall judge the poor with justice, and shall reprove with equity for the meek of the earth: and he shall strike the earth with the rod of his mouth, and with the breath of his lips he shall slay the wicked.\"},{\"verse\":5,\"text\":\"And justice shall be the girdle of his loins: and faith the girdle of his reins.\"},{\"verse\":6,\"text\":\"The wolf shall dwell with the lamb: and the leopard shall lie down with the kid: the calf and the lion, and the sheep shall abide together, and a little child shall lead them.\"},{\"verse\":7,\"text\":\"The calf and the bear shall feed: their young ones shall rest together: and the lion shall eat straw like the ox.\"},{\"verse\":8,\"text\":\"And the sucking child shall play on the hole of the asp: and the weaned child shall thrust his hand into the den of the basilisk.\"},{\"verse\":9,\"text\":\"They shall not hurt, nor shall they kill in all my holy mountain, for the earth is filled with the knowledge of the Lord, as the covering waters of the sea.\"},{\"verse\":10,\"text\":\"In that day the root of Jesse, who standeth for an ensign of the people, him the Gentiles shall beseech, and his sepulchre shall be glorious.\"},{\"verse\":11,\"text\":\"And it shall come to pass in that day, that the Lord shall set his hand the second time to possess the remnant of his people, which shall be left from the Assyrians, and from Egypt, and from Phetros, and from Ethiopia, and from Elam, and from Sennaar, and from Emath, and from the islands of the sea.\"},{\"verse\":12,\"text\":\"And he shall set up a standard unto the nations, and shall assemble the fugitives of Israel, and shall gather together the dispersed of Juda from the four quarters of the earth.\"},{\"verse\":13,\"text\":\"And the envy of Ephraim shall be taken away, and the enemies of Juda shall perish: Ephraim shall not envy Juda, and Juda shall not fight against Ephraim.\"},{\"verse\":14,\"text\":\"But they shall fly upon the shoulders of the Philistines by the sea, they together shall spoil the children of the east: Edom, and Moab shall be under the rule of their hand, and the children of Ammon shall be obedient.\"},{\"verse\":15,\"text\":\"And the Lord shall lay waste the tongue of the sea of Egypt, and shall lift up his hand over the river in the strength of his spirit: and he shall strike it in the seven streams, so that men may pass through it in their shoes.\"},{\"verse\":16,\"text\":\"And there shall be a highway for the remnant of my people, which shall be left from the Assyrians: as there was for Israel in the day that he came up out of the land of Egypt.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et egredietur virga de radice Jesse, et flos de radice ejus ascendet.\"},{\"verse\":2,\"text\":\"Et requiescet super eum spiritus Domini : spiritus sapientiæ et intellectus, spiritus consilii et fortitudinis, spiritus scientiæ et pietatis ;\"},{\"verse\":3,\"text\":\"et replebit eum spiritus timoris Domini. Non secundum visionem oculorum judicabit, neque secundum auditum aurium arguet ;\"},{\"verse\":4,\"text\":\"sed judicabit in justitia pauperes, et arguet in æquitate pro mansuetis terræ ; et percutiet terram virga oris sui, et spiritu labiorum suorum interficiet impium.\"},{\"verse\":5,\"text\":\"Et erit justitia cingulum lumborum ejus, et fides cinctorium renum ejus.\"},{\"verse\":6,\"text\":\"Habitabit lupus cum agno, et pardus cum hædo accubabit ; vitulus, et leo, et ovis, simul morabuntur, et puer parvulus minabit eos.\"},{\"verse\":7,\"text\":\"Vitulus et ursus pascentur, simul requiescent catuli eorum ; et leo quasi bos comedet paleas.\"},{\"verse\":8,\"text\":\"Et delectabitur infans ab ubere super foramine aspidis ; et in caverna reguli qui ablactatus fuerit manum suam mittet.\"},{\"verse\":9,\"text\":\"Non nocebunt, et non occident in universo monte sancto meo, quia repleta est terra scientia Domini, sicut aquæ maris operientes.\"},{\"verse\":10,\"text\":\"In die illa radix Jesse, qui stat in signum populorum, ipsum gentes deprecabuntur, et erit sepulchrum ejus gloriosum.\"},{\"verse\":11,\"text\":\"Et erit in die illa : adjiciet Dominus secundo manum suam ad possidendum residuum populi sui, quod relinquetur ab Assyriis, et ab Ægypto, et a Phetros, et ab Æthiopia, et ab Ælam, et a Sennaar, et ab Emath, et ab insulis maris.\"},{\"verse\":12,\"text\":\"Et levabit signum in nationes, et congregabit profugos Israël, et dispersos Juda colliget a quatuor plagis terræ.\"},{\"verse\":13,\"text\":\"Et auferetur zelus Ephraim, et hostes Juda peribunt ; Ephraim non æmulabitur Judam, et Judas non pugnabit contra Ephraim.\"},{\"verse\":14,\"text\":\"Et volabunt in humeros Philisthiim per mare, simul prædabuntur filios orientis ; Idumæa et Moab præceptum manus eorum, et filii Ammon obedientes erunt.\"},{\"verse\":15,\"text\":\"Et desolabit Dominus linguam maris Ægypti, et levabit manum suam super flumen in fortitudine spiritus sui ; et percutiet eum in septem rivis, ita ut transeant per eum calceati.\"},{\"verse\":16,\"text\":\"Et erit via residuo populo meo qui relinquetur ab Assyriis, sicut fuit Israëli in die illa qua ascendit de terra Ægypti.\"}],\"summary\":\"Of the spiritual kingdom of Christ, to which all nations shall repair.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":10,\"label\":\"Isaiah 10\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":12,\"label\":\"Isaiah 12\"}}]]\n"])</script></body></html>
