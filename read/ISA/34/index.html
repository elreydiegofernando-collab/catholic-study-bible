20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">34</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Isaias</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The general judgment of the wicked.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Come near, ye Gentiles, and hear, and hearken, ye people: let the earth hear, and all that is therein, the world, and every thing that cometh forth of it.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For the indignation of the Lord is upon all nations, and his fury upon all their armies: he hath killed them, and delivered them to slaughter.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Their slain shall be cast forth, and out of their carcasses shall rise a stink: the mountains shall be melted with their blood.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And all the host of the heavens shall pine away, and the heavens shall be folded together as a book: and all their host shall fall down as the leaf falleth from the vine, and from the fig tree.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For my sword is inebriated in heaven: behold it shall come down upon Idumea, and upon the people of my slaughter unto judgment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The sword of the Lord is filled with blood, it is made thick with the blood of lambs and buck goats, with the blood of rams full of marrow: for there is a victim of the Lord in Bosra and a great slaughter in the land of Edom.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the unicorns shall go down with them, and the bulls with the mighty: their land shall be soaked with blood, and their ground with the fat of fat ones.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For it is the day of the vengeance of the Lord, the year of recompenses of the judgment of Sion.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the streams thereof shall be turned into pitch, and the ground thereof into brimstone: and the land thereof shall become burning pitch.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Night and day it shall not be quenched, the smoke thereof shall go up for ever: from generation to generation it shall lie waste, none shall pass through it for ever and ever.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The bittern and ericius shall possess it: and the ibis and the raven shall dwell in it: and a line shall be stretched out upon it, to bring it to nothing, and a plummet, unto desolation.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The nobles thereof shall not be there: they shall call rather upon the king, and all the princes thereof shall be nothing.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And thorns and nettles shall grow up in its houses, and the thistle in the fortresses thereof: and it shall be the habitation of dragons, and the pasture of ostriches.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And demons and monsters shall meet, and the hairy ones shall cry out one to another, there hath the lamia lain down, and found rest for herself.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>There hath the ericius had its hole, and brought up its young ones, and hath dug round about, and cherished them in the shadow thereof: thither are the kites gathered together one to another.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Search ye diligently in the book of the Lord, and read: not one of them was wanting, one hath not sought for the other: for that which proceedeth out of my mouth, he hath commanded, and his spirit it hath gathered them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he hath cast the lot for them, and his hand hath divided it to them by line: they shall possess it for ever, from generation to generation they shall dwell therein.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Accedite, gentes, et audite ; et populi, attendite : audiat terra, et plenitudo ejus ; orbis, et omne germen ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quia indignatio Domini super omnes gentes, et furor super universam militiam eorum : interfecit eos, et dedit eos in occisionem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Interfecti eorum projicientur, et de cadaveribus eorum ascendet fœtor ; tabescent montes a sanguine eorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et tabescet omnis militia cælorum, et complicabuntur sicut liber cæli : et omnis militia eorum defluet, sicut defluit folium de vinea et de ficu.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam inebriatus est in cælo gladius meus ; ecce super Idumæam descendet, et super populum interfectionis meæ, ad judicium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Gladius Domini repletus est sanguine, incrassatus est adipe, de sanguine agnorum et hircorum, de sanguine medullatorum arietum : victima enim Domini in Bosra, et interfectio magna in terra Edom.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et descendent unicornes cum eis, et tauri cum potentibus ; inebriabitur terra eorum sanguine, et humus eorum adipe pinguium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quia dies ultionis Domini, annus retributionum judicii Sion.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et convertentur torrentes ejus in picem, et humus ejus in sulphur ; et erit terra ejus in picem ardentem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nocte et die non extinguetur, in sempiternum ascendet fumus ejus, a generatione in generationem desolabitur, in sæcula sæculorum non erit transiens per eam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et possidebunt illam onocrotalus et ericius ; ibis et corvus habitabunt in ea : et extendetur super eam mensura, ut redigatur ad nihilum, et perpendiculum in desolationem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nobiles ejus non erunt ibi ; regem potius invocabunt, et omnes principes ejus erunt in nihilum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et orientur in domibus ejus spinæ et urticæ, et paliurus in munitionibus ejus ; et erit cubile draconum, et pascua struthionum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et occurrent dæmonia onocentauris, et pilosus clamabit alter ad alterum ; ibi cubavit lamia, et invenit sibi requiem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ibi habuit foveam ericius, et enutrivit catulos, et circumfodit, et fovit in umbra ejus ; illuc congregati sunt milvi, alter ad alterum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Requirite diligenter in libro Domini, et legite : Unum ex eis non defuit, alter alterum non quæsivit ; quia quod ex ore meo procedit, ille mandavit, et spiritus ejus ipse congregavit ea.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et ipse misit eis sortem, et manus ejus divisit eam illis in mensuram : usque in æternum possidebunt eam ; in generationem et generationem habitabunt in ea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 33</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/35/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Isaiah 35</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->34<!-- --> of <!-- -->66<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Isaiah 33" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin=" ":\"Isaiah\",\"drName\":\"Isaias\",\"chapter\":34,\"totalChapters\":66,\"dra\":[{\"verse\":1,\"text\":\"Come near, ye Gentiles, and hear, and hearken, ye people: let the earth hear, and all that is therein, the world, and every thing that cometh forth of it.\"},{\"verse\":2,\"text\":\"For the indignation of the Lord is upon all nations, and his fury upon all their armies: he hath killed them, and delivered them to slaughter.\"},{\"verse\":3,\"text\":\"Their slain shall be cast forth, and out of their carcasses shall rise a stink: the mountains shall be melted with their blood.\"},{\"verse\":4,\"text\":\"And all the host of the heavens shall pine away, and the heavens shall be folded together as a book: and all their host shall fall down as the leaf falleth from the vine, and from the fig tree.\"},{\"verse\":5,\"text\":\"For my sword is inebriated in heaven: behold it shall come down upon Idumea, and upon the people of my slaughter unto judgment.\"},{\"verse\":6,\"text\":\"The sword of the Lord is filled with blood, it is made thick with the blood of lambs and buck goats, with the blood of rams full of marrow: for there is a victim of the Lord in Bosra and a great slaughter in the land of Edom.\"},{\"verse\":7,\"text\":\"And the unicorns shall go down with them, and the bulls with the mighty: their land shall be soaked with blood, and their ground with the fat of fat ones.\"},{\"verse\":8,\"text\":\"For it is the day of the vengeance of the Lord, the year of recompenses of the judgment of Sion.\"},{\"verse\":9,\"text\":\"And the streams thereof shall be turned into pitch, and the ground thereof into brimstone: and the land thereof shall become burning pitch.\"},{\"verse\":10,\"text\":\"Night and day it shall not be quenched, the smoke thereof shall go up for ever: from generation to generation it shall lie waste, none shall pass through it for ever and ever.\"},{\"verse\":11,\"text\":\"The bittern and ericius shall possess it: and the ibis and the raven shall dwell in it: and a line shall be stretched out upon it, to bring it to nothing, and a plummet, unto desolation.\"},{\"verse\":12,\"text\":\"The nobles thereof shall not be there: they shall call rather upon the king, and all the princes thereof shall be nothing.\"},{\"verse\":13,\"text\":\"And thorns and nettles shall grow up in its houses, and the thistle in the fortresses thereof: and it shall be the habitation of dragons, and the pasture of ostriches.\"},{\"verse\":14,\"text\":\"And demons and monsters shall meet, and the hairy ones shall cry out one to another, there hath the lamia lain down, and found rest for herself.\"},{\"verse\":15,\"text\":\"There hath the ericius had its hole, and brought up its young ones, and hath dug round about, and cherished them in the shadow thereof: thither are the kites gathered together one to another.\"},{\"verse\":16,\"text\":\"Search ye diligently in the book of the Lord, and read: not one of them was wanting, one hath not sought for the other: for that which proceedeth out of my mouth, he hath commanded, and his spirit it hath gathered them.\"},{\"verse\":17,\"text\":\"And he hath cast the lot for them, and his hand hath divided it to them by line: they shall possess it for ever, from generation to generation they shall dwell therein.\"}],\"vul\":[{\"verse\":1,\"text\":\"Accedite, gentes, et audite ; et populi, attendite : audiat terra, et plenitudo ejus ; orbis, et omne germen ejus.\"},{\"verse\":2,\"text\":\"Quia indignatio Domini super omnes gentes, et furor super universam militiam eorum : interfecit eos, et dedit eos in occisionem.\"},{\"verse\":3,\"text\":\"Interfecti eorum projicientur, et de cadaveribus eorum ascendet fœtor ; tabescent montes a sanguine eorum.\"},{\"verse\":4,\"text\":\"Et tabescet omnis militia cælorum, et complicabuntur sicut liber cæli : et omnis militia eorum defluet, sicut defluit folium de vinea et de ficu.\"},{\"verse\":5,\"text\":\"Quoniam inebriatus est in cælo gladius meus ; ecce super Idumæam descendet, et super populum interfectionis meæ, ad judicium.\"},{\"verse\":6,\"text\":\"Gladius Domini repletus est sanguine, incrassatus est adipe, de sanguine agnorum et hircorum, de sanguine medullatorum arietum : victima enim Domini in Bosra, et interfectio magna in terra Edom.\"},{\"verse\":7,\"text\":\"Et descendent unicornes cum eis, et tauri cum potentibus ; inebriabitur terra eorum sanguine, et humus eorum adipe pinguium.\"},{\"verse\":8,\"text\":\"Quia dies ultionis Domini, annus retributionum judicii Sion.\"},{\"verse\":9,\"text\":\"Et convertentur torrentes ejus in picem, et humus ejus in sulphur ; et erit terra ejus in picem ardentem.\"},{\"verse\":10,\"text\":\"Nocte et die non extinguetur, in sempiternum ascendet fumus ejus, a generatione in generationem desolabitur, in sæcula sæculorum non erit transiens per eam.\"},{\"verse\":11,\"text\":\"Et possidebunt illam onocrotalus et ericius ; ibis et corvus habitabunt in ea : et extendetur super eam mensura, ut redigatur ad nihilum, et perpendiculum in desolationem.\"},{\"verse\":12,\"text\":\"Nobiles ejus non erunt ibi ; regem potius invocabunt, et omnes principes ejus erunt in nihilum.\"},{\"verse\":13,\"text\":\"Et orientur in domibus ejus spinæ et urticæ, et paliurus in munitionibus ejus ; et erit cubile draconum, et pascua struthionum.\"},{\"verse\":14,\"text\":\"Et occurrent dæmonia onocentauris, et pilosus clamabit alter ad alterum ; ibi cubavit lamia, et invenit sibi requiem.\"},{\"verse\":15,\"text\":\"Ibi habuit foveam ericius, et enutrivit catulos, et circumfodit, et fovit in umbra ejus ; illuc congregati sunt milvi, alter ad alterum.\"},{\"verse\":16,\"text\":\"Requirite diligenter in libro Domini, et legite : Unum ex eis non defuit, alter alterum non quæsivit ; quia quod ex ore meo procedit, ille mandavit, et spiritus ejus ipse congregavit ea.\"},{\"verse\":17,\"text\":\"Et ipse misit eis sortem, et manus ejus divisit eam illis in mensuram : usque in æternum possidebunt eam ; in generationem et generationem habitabunt in ea.\"}],\"summary\":\"The general judgment of the wicked.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":33,\"label\":\"Isaiah 33\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":35,\"label\":\"Isaiah 35\"}}]]\n"])</script></body></html>
