[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">66</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Isaias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ISA/">About <!-- -->Isaiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">More of the reprobation of the Jews, and of the call of the Gentiles.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Thus saith the Lord: Heaven is my throne, and the earth my footstool: what is this house that you will build to me? and what is this place of my rest?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>My hand made all these things, and all these things were made, saith the Lord. But to whom shall I have respect, but to him that is poor and little, and of a contrite spirit, and that trembleth at my words?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He that sacrificeth an ox, is as if he slew a man: he that killeth a sheep in sacrifice, as if he should brain a dog: he that offereth an oblation, as if he should offer swine’s blood; he that remembereth incense, as if he should bless an idol. All these things have they chosen in their ways, and their soul is delighted in their abominations.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Wherefore I also will choose their mockeries, and will bring upon them the things they feared: because I called, and there was none that would answer; I have spoken, and they heard not; and they have done evil in my eyes, and have chosen the things that displease me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hear the word of the Lord, you that tremble at his word: Your brethren that hate you, and cast you out for my name’s sake, have said: Let the Lord be glorified, and we shall see in your joy: but they shall be confounded.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A voice of the people from the city, a voice from the temple, the voice of the Lord that rendereth recompense to his enemies.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Before she was in labour, she brought forth; before her time came to be delivered, she brought forth a man child.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who hath ever heard such a thing? and who hath seen the like to this? shall the earth bring forth in one day? or shall a nation be brought forth at once, because Sion hath been in labour, and hath brought forth her children?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Shall not I that make others to bring forth children, myself bring forth, saith the Lord? shall I, that give generation to others, be barren, saith the Lord thy God?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Rejoice with Jerusalem, and be glad with her, all you that love her: rejoice for joy with her, all you that mourn for her.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That you may suck, and be filled with the breasts of her consolations: that you may milk out, and flow with delights, from the abundance of her glory.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck; you shall be carried at the breasts, and upon the knees they shall caress you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>As one whom the mother caresseth, so will I comfort you, and you shall be comforted in Jerusalem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>You shall see and your heart shall rejoice, and your bones shall flourish like an herb, and the hand of the Lord shall be known to his servants, and he shall be angry with his enemies.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For behold the Lord will come with fire, and his chariots are like a whirlwind, to render his wrath in indignation, and his rebuke with flames of fire.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For the Lord shall judge by fire, and by his sword unto all flesh, and the slain of the Lord shall be many.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>They that were sanctified, and thought themselves clean in the gardens behind the gate within, they that did eat swine’s flesh, and the abomination, and the mouse: they shall be consumed together, saith the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But I know their works, and their thoughts: I come that I may gather them together with all nations and tongues: and they shall come and shall see my glory.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I will set a sign among them, and I will send of them that shall be saved, to the Gentiles into the sea, into Africa, and Lydia them that draw the bow: into Italy, and Greece, to the islands afar off, to them that have not heard of me, and have not seen my glory. And they shall declare my glory to the Gentiles:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they shall bring all your brethren out of all nations for a gift to the Lord, upon horses, and in chariots, and in litters, and on mules, and in coaches, to my holy mountain Jerusalem, saith the Lord, as if the children of Israel should bring an offering in a clean vessel into the house of the Lord.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I will take of them to be priests, and Levites, saith the Lord.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For as the new heavens, and the new earth, which I will make to stand before me, saith the Lord: so shall your seed stand, and your name.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And there shall be month after month, and sabbath after sabbath: and all flesh shall come to adore before my face, saith the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they shall go out, and see the carcasses of the men that have transgressed against me: their worm shall not die, and their fire shall not be quenched: and they shall be a loathsome sight to all flesh.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc dicit Dominus : Cælum sedes mea, terra autem scabellum pedum meorum. Quæ est ista domus quam ædificabitis mihi ? et quis est iste locus quietis meæ ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Omnia hæc manus mea fecit, et facta sunt universa ista, dicit Dominus ; ad quem autem respiciam, nisi ad pauperculum, et contritum spiritu, et trementem sermones meos ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Qui immolat bovem, quasi qui interficiat virum ; qui mactat pecus, quasi qui excerebret canem ; qui offert oblationem, quasi qui sanguinem suillum offerat ; qui recordatur thuris, quasi qui benedicat idolo. Hæc omnia elegerunt in viis suis, et in abominationibus suis anima eorum delectata est.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Unde et ego eligam illusiones eorum, et quæ timebant adducam eis ; quia vocavi, et non erat qui responderet ; locutus sum, et non audierunt ; feceruntque malum in oculis meis, et quæ nolui elegerunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Audite verbum Domini, qui tremitis ad verbum ejus. Dixerunt fratres vestri odientes vos, et abjicientes propter nomen meum : Glorificetur Dominus, et videbimus in lætitia vestra ; ipsi autem confundentur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vox populi de civitate, vox de templo, vox Domini reddentis retributionem inimicis suis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Antequam parturiret, peperit ; antequam veniret partus ejus, peperit masculum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quis audivit umquam tale ? et quis vidit huic simile ? numquid parturiet terra in die una, aut parietur gens simul, quia parturivit et peperit Sion filios suos ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Numquid ego qui alios parere facio, ipse non pariam ? dicit Dominus. Si ego, qui generationem ceteris tribuo, sterilis ero ? ait Dominus Deus tuus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lætamini cum Jerusalem et exsultate in ea, omnes qui diligitis eam ; gaudete cum ea gaudio, universi qui lugetis super eam :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ut sugatis et repleamini ab ubere consolationis ejus ; ut mulgeatis et deliciis affluatis ab omnimoda gloria ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quia hæc dicit Dominus : Ecce ego declinabo super eam quasi fluvium pacis, et quasi torrentem inundantem gloriam gentium, quam sugetis : ad ubera portabimini, et super genua blandientur vobis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quomodo si cui mater blandiatur, ita ego consolabor vos, et in Jerusalem consolabimini.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Videbitis, et gaudebit cor vestrum, et ossa vestra quasi herba germinabunt : et cognoscetur manus Domini servis ejus, et indignabitur inimicis suis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quia ecce Dominus in igne veniet, et quasi turbo quadrigæ ejus, reddere in indignatione furorem suum et increpationem suam in flamma ignis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>quia in igne Dominus dijudicabit, et in gladio suo ad omnem carnem ; et multiplicabuntur interfecti a Domino,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>qui sanctificabantur et mundos se putabant in hortis post januam intrinsecus, qui comedebant carnem suillam, et abominationem et murem : simul consumentur, dicit Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ego autem opera eorum et cogitationes eorum venio ut congregem, cum omnibus gentibus et linguis : et venient, et videbunt gloriam meam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et ponam in eis signum, et mittam ex eis qui salvati fuerint, ad gentes in mare, in Africam, et Lydiam, tendentes sagittam ; in Italiam et Græciam, ad insulas longe, ad eos qui non audierunt de me, et non viderunt gloriam meam. Et annuntiabunt gloriam meam gentibus ;</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et adducent omnes fratres vestros de cunctis gentibus donum Domino, in equis, et in quadrigis, et in lecticis, et in mulis, et in carrucis, ad montem sanctum meum Jerusalem, dicit Dominus : quomodo si inferant filii Israël munus in vase mundo in domum Domini.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et assumam ex eis in sacerdotes et Levitas, dicit Dominus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quia sicut cæli novi et terra nova, quæ ego facio stare coram me, dicit Dominus, sic stabit semen vestrum et nomen vestrum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et erit mensis ex mense, et sabbatum ex sabbato : veniet omnis caro ut adoret coram facie mea, dicit Dominus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et egredientur, et videbunt cadavera virorum qui prævaricati sunt in me ; vermis eorum non morietur, et ignis eorum non extinguetur : et erunt usque ad satietatem visionis omni carni.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/65/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 65</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Jeremiah 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></ ne that would answer; I have spoken, and they heard not; and they have done evil in my eyes, and have chosen the things that displease me.\"},{\"verse\":5,\"text\":\"Hear the word of the Lord, you that tremble at his word: Your brethren that hate you, and cast you out for my name’s sake, have said: Let the Lord be glorified, and we shall see in your joy: but they shall be confounded.\"},{\"verse\":6,\"text\":\"A voice of the people from the city, a voice from the temple, the voice of the Lord that rendereth recompense to his enemies.\"},{\"verse\":7,\"text\":\"Before she was in labour, she brought forth; before her time came to be delivered, she brought forth a man child.\"},{\"verse\":8,\"text\":\"Who hath ever heard such a thing? and who hath seen the like to this? shall the earth bring forth in one day? or shall a nation be brought forth at once, because Sion hath been in labour, and hath brought forth her children?\"},{\"verse\":9,\"text\":\"Shall not I that make others to bring forth children, myself bring forth, saith the Lord? shall I, that give generation to others, be barren, saith the Lord thy God?\"},{\"verse\":10,\"text\":\"Rejoice with Jerusalem, and be glad with her, all you that love her: rejoice for joy with her, all you that mourn for her.\"},{\"verse\":11,\"text\":\"That you may suck, and be filled with the breasts of her consolations: that you may milk out, and flow with delights, from the abundance of her glory.\"},{\"verse\":12,\"text\":\"For thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck; you shall be carried at the breasts, and upon the knees they shall caress you.\"},{\"verse\":13,\"text\":\"As one whom the mother caresseth, so will I comfort you, and you shall be comforted in Jerusalem.\"},{\"verse\":14,\"text\":\"You shall see and your heart shall rejoice, and your bones shall flourish like an herb, and the hand of the Lord shall be known to his servants, and he shall be angry with his enemies.\"},{\"verse\":15,\"text\":\"For behold the Lord will come with fire, and his chariots are like a whirlwind, to render his wrath in indignation, and his rebuke with flames of fire.\"},{\"verse\":16,\"text\":\"For the Lord shall judge by fire, and by his sword unto all flesh, and the slain of the Lord shall be many.\"},{\"verse\":17,\"text\":\"They that were sanctified, and thought themselves clean in the gardens behind the gate within, they that did eat swine’s flesh, and the abomination, and the mouse: they shall be consumed together, saith the Lord.\"},{\"verse\":18,\"text\":\"But I know their works, and their thoughts: I come that I may gather them together with all nations and tongues: and they shall come and shall see my glory.\"},{\"verse\":19,\"text\":\"And I will set a sign among them, and I will send of them that shall be saved, to the Gentiles into the sea, into Africa, and Lydia them that draw the bow: into Italy, and Greece, to the islands afar off, to them that have not heard of me, and have not seen my glory. And they shall declare my glory to the Gentiles:\"},{\"verse\":20,\"text\":\"And they shall bring all your brethren out of all nations for a gift to the Lord, upon horses, and in chariots, and in litters, and on mules, and in coaches, to my holy mountain Jerusalem, saith the Lord, as if the children of Israel should bring an offering in a clean vessel into the house of the Lord.\"},{\"verse\":21,\"text\":\"And I will take of them to be priests, and Levites, saith the Lord.\"},{\"verse\":22,\"text\":\"For as the new heavens, and the new earth, which I will make to stand before me, saith the Lord: so shall your seed stand, and your name.\"},{\"verse\":23,\"text\":\"And there shall be month after month, and sabbath after sabbath: and all flesh shall come to adore before my face, saith the Lord.\"},{\"verse\":24,\"text\":\"And they shall go out, and see the carcasses of the men that have transgressed against me: their worm shall not die, and their fire shall not be quenched: and they shall be a loathsome sight to all flesh.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc dicit Dominus : Cælum sedes mea, terra autem scabellum pedum meorum. Quæ est ista domus quam ædificabitis mihi ? et quis est iste locus quietis meæ ?\"},{\"verse\":2,\"text\":\"Omnia hæc manus mea fecit, et facta sunt universa ista, dicit Dominus ; ad quem autem respiciam, nisi ad pauperculum, et contritum spiritu, et trementem sermones meos ?\"},{\"verse\":3,\"text\":\"Qui immolat bovem, quasi qui interficiat virum ; qui mactat pecus, quasi qui excerebret canem ; qui offert oblationem, quasi qui sanguinem suillum offerat ; qui recordatur thuris, quasi qui benedicat idolo. Hæc omnia elegerunt in viis suis, et in abominationibus suis anima eorum delectata est.\"},{\"verse\":4,\"text\":\"Unde et ego eligam illusiones eorum, et quæ timebant adducam eis ; quia vocavi, et non erat qui responderet ; locutus sum, et non audierunt ; feceruntque malum in oculis meis, et quæ nolui elegerunt.\"},{\"verse\":5,\"text\":\"Audite verbum Domini, qui tremitis ad verbum ejus. Dixerunt fratres vestri odientes vos, et abjicientes propter nomen meum : Glorificetur Dominus, et videbimus in lætitia vestra ; ipsi autem confundentur.\"},{\"verse\":6,\"text\":\"Vox populi de civitate, vox de templo, vox Domini reddentis retributionem inimicis suis.\"},{\"verse\":7,\"text\":\"Antequam parturiret, peperit ; antequam veniret partus ejus, peperit masculum.\"},{\"verse\":8,\"text\":\"Quis audivit umquam tale ? et quis vidit huic simile ? numquid parturiet terra in die una, aut parietur gens simul, quia parturivit et peperit Sion filios suos ?\"},{\"verse\":9,\"text\":\"Numquid ego qui alios parere facio, ipse non pariam ? dicit Dominus. Si ego, qui generationem ceteris tribuo, sterilis ero ? ait Dominus Deus tuus.\"},{\"verse\":10,\"text\":\"Lætamini cum Jerusalem et exsultate in ea, omnes qui diligitis eam ; gaudete cum ea gaudio, universi qui lugetis super eam :\"},{\"verse\":11,\"text\":\"ut sugatis et repleamini ab ubere consolationis ejus ; ut mulgeatis et deliciis affluatis ab omnimoda gloria ejus.\"},{\"verse\":12,\"text\":\"Quia hæc dicit Dominus : Ecce ego declinabo super eam quasi fluvium pacis, et quasi torrentem inundantem gloriam gentium, quam sugetis : ad ubera portabimini, et super genua blandientur vobis.\"},{\"verse\":13,\"text\":\"Quomodo si cui mater blandiatur, ita ego consolabor vos, et in Jerusalem consolabimini.\"},{\"verse\":14,\"text\":\"Videbitis, et gaudebit cor vestrum, et ossa vestra quasi herba germinabunt : et cognoscetur manus Domini servis ejus, et indignabitur inimicis suis.\"},{\"verse\":15,\"text\":\"Quia ecce Dominus in igne veniet, et quasi turbo quadrigæ ejus, reddere in indignatione furorem suum et increpationem suam in flamma ignis :\"},{\"verse\":16,\"text\":\"quia in igne Dominus dijudicabit, et in gladio suo ad omnem carnem ; et multiplicabuntur interfecti a Domino,\"},{\"verse\":17,\"text\":\"qui sanctificabantur et mundos se putabant in hortis post januam intrinsecus, qui comedebant carnem suillam, et abominationem et murem : simul consumentur, dicit Dominus.\"},{\"verse\":18,\"text\":\"Ego autem opera eorum et cogitationes eorum venio ut congregem, cum omnibus gentibus et linguis : et venient, et videbunt gloriam meam.\"},{\"verse\":19,\"text\":\"Et ponam in eis signum, et mittam ex eis qui salvati fuerint, ad gentes in mare, in Africam, et Lydiam, tendentes sagittam ; in Italiam et Græciam, ad insulas longe, ad eos qui non audierunt de me, et non viderunt gloriam meam. Et annuntiabunt gloriam meam gentibus ;\"},{\"verse\":20,\"text\":\"et adducent omnes fratres vestros de cunctis gentibus donum Domino, in equis, et in quadrigis, et in lecticis, et in mulis, et in carrucis, ad montem sanctum meum Jerusalem, dicit Dominus : quomodo si inferant filii Israël munus in vase mundo in domum Domini.\"},{\"verse\":21,\"text\":\"Et assumam ex eis in sacerdotes et Levitas, dicit Dominus.\"},{\"verse\":22,\"text\":\"Quia sicut cæli novi et terra nova, quæ ego facio stare coram me, dicit Dominus, sic stabit semen vestrum et nomen vestrum.\"},{\"verse\":23,\"text\":\"Et erit mensis ex mense, et sabbatum ex sabbato : veniet omnis caro ut adoret coram facie mea, dicit Dominus.\"},{\"verse\":24,\"text\":\"Et egredientur, et videbunt cadavera virorum qui prævaricati sunt in me ; vermis eorum non morietur, et ignis eorum non extinguetur : et erunt usque ad satietatem visionis omni carni.\"}],\"summary\":\"More of the reprobation of the Jews, and of the call of the Gentiles.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":65,\"label\":\"Isaiah 65\"},\"next\":{\"usfm\":\"JER\",\"chapter\":1,\"label\":\"Jeremiah 1\"}}]]\n"])</script></body></html>
