[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">36</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Isaias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ISA/">About <!-- -->Isaiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Sennacherib invades Juda: his blasphemies.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass in the fourteenth year of king Ezechias, that Sennacherib king of the Assyrians came up against all the fenced cities of Juda, and took them.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the king of the Assyrians sent Rabsaces from Lachis to Jerusalem, to king Ezechias with a great army, and he stood by the conduit of the upper pool in the way of the fuller’s field.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And there went out to him Eliacim the son of Helcias, who was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Rabsaces said to them: Tell Ezechias: Thus saith the great king, the king of the Assyrians: What is this confidence wherein thou trustest?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Or with what counsel or strength dost thou prepare for war? on whom dost thou trust, that thou art revolted from me?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Lo thou trustest upon this broken staff of a reed, upon Egypt: upon which if a man lean, it will go into his hand, and pierce it: so is Pharao king of Egypt to all that trust in him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But if thou wilt answer me: We trust in the Lord our God: is it not he whose high places and altars Ezechias hath taken away, and hath said to Juda and Jerusalem: You shall worship before this altar?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And now deliver thyself up to my lord the king of the Assyrians, and I will give thee two thousand horses, and thou wilt not be able on thy part to find riders for them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And how wilt thou stand against the face of the judge of one place, of the least of my master’s servants? But if thou trust in Egypt, in chariots and in horsemen:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And am I now come up without the Lord against this land to destroy it? The Lord said to me: Go up against this land, and destroy it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Eliacim, and Sobna, and Joahe said to Rabsaces: Speak to thy servants in the Syrian tongue: for we understand it: speak not to us in the Jews’ language in the hearing of the people, that are upon the wall.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Rabsaces said to them: Hath my master sent me to thy master and to thee, to speak all these words; and not rather to the men that sit on the wall; that they may eat their own dung, and drink their urine with you?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then Rabsaces stood, and cried out with a loud voice in the Jews’ language, and said: Hear the words of the great king, the king of the Assyrians.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thus saith the king: Let not Ezechias deceive you, for he shall not be able to deliver you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And let not Ezechias make you trust in the Lord, saying: The Lord will surely deliver us, and this city shall not be given into the hands of the king of the Assyrians.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Do not hearken to Ezechias: for thus said the king of the Assyrians: Do with me that which is for your advantage, and come out to me, and eat ye every one of his vine, and every one of his fig tree, and drink ye every one the water of his cistern,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Till I come and take you away to a land, like to your own, a land of corn and of wine, a land of bread and vineyards.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Neither let Ezechias trouble you, saying: The Lord will deliver us. Have any of the gods of the nations delivered their land out of the hand of the king of the Assyrians?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Where is the god of Emath and of Arphad? where is the god of Sepharvaim? have they delivered Samaria out of my hand?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Who is there among all the gods of these lands, that hath delivered his country out of my hand, that the Lord may deliver Jerusalem out of my hand?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they held their peace, and answered him not a word. For the king had commanded, saying: Answer him not.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Eliacim the son of Helcias, that was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder, went in to Ezechias with their garments rent, and told him the words of Rabsaces.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est in quartodecimo anno regis Ezechiæ, ascendit Sennacherib, rex Assyriorum, super omnes civitates Juda munitas, et cepit eas.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et misit rex Assyriorum Rabsacen de Lachis in Jerusalem, ad regem Ezechiam in manu gravi : et stetit in aquæductu piscinæ superioris in via Agri fullonis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et egressus est ad eum Eliacim, filius Helciæ, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dixit ad eos Rabsaces : Dicite Ezechiæ : Hæc dicit rex magnus, rex Assyriorum : Quæ est ista fiducia qua confidis ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>aut quo consilio vel fortitudine rebellare disponis ? super quem habes fiduciam, quia recessisti a me ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ecce confidis super baculum arundineum confractum istum, super Ægyptum ; cui si innixus fuerit homo, intrabit in manum ejus, et perforabit eam : sic Pharao, rex Ægypti, omnibus qui confidunt in eo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quod si responderis mihi : In Domino Deo nostro confidimus ; nonne ipse est cujus abstulit Ezechias excelsa et altaria, et dixit Judæ et Jerusalem : Coram altari isto adorabitis ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et nunc trade te domino meo, regi Assyriorum, et dabo tibi duo millia equorum, nec poteris ex te præbere ascensores eorum :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et quomodo sustinebis faciem judicis unius loci ex servis domini mei minoribus ? Quod si confidis in Ægypto, in quadrigis et in equitibus,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et nunc numquid sine Domino ascendi ad terram istam, ut disperderem eam ? Dominus dixit ad me : Ascende super terram istam, et disperde eam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et dixit Eliacim, et Sobna, et Joahe, ad Rabsacen : Loquere ad servos tuos syra lingua ; intelligimus enim ; ne loquaris ad nos judaice in auribus populi qui est super murum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et dixit ad eos Rabsaces : Numquid ad dominum tuum et ad te misit me dominus meus, ut loquerer omnia verba ista ? et non potius ad viros qui sedent in muro, ut comedant stercora sua, et bibant urinam pedum suorum vobiscum ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et stetit Rabsaces, et clamavit voce magna judaice, et dixit : Audite verba regis magni, regis Assyriorum !</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hæc dicit rex : Non seducat vos Ezechias, quia non poterit eruere vos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et non vobis tribuat fiduciam Ezechias super Domino, dicens : Eruens liberabit nos Dominus : non dabitur civitas ista in manu regis Assyriorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nolite audire Ezechiam ; hæc enim dicit rex Assyriorum : Facite mecum benedictionem, et egredimini ad me, et comedite unusquisque vineam suam, et unusquisque ficum suam, et bibite unusquisque aquam cisternæ suæ,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>donec veniam, et tollam vos ad terram quæ est ut terra vestra, terram frumenti et vini, terram panum et vinearum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Nec conturbet vos Ezechias, dicens : Dominus liberabit nos. Numquid liberaverunt dii gentium unusquisque terram suam de manu regis Assyriorum ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ubi est deus Emath et Arphad ? ubi est deus Sepharvaim ? numquid liberaverunt Samariam de manu mea ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quis est ex omnibus diis terrarum istarum qui eruerit terram suam de manu mea, ut eruat Dominus Jerusalem de manu mea ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et siluerunt, et non responderunt ei verbum. Mandaverat enim rex, dicens : Ne respondeatis ei.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et ingressus est Eliacim, filius Helciæ, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis, ad Ezechiam, scissis vestibus, et nuntiaverunt ei verba Rabsacis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/35/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 35</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/37/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Isaiah 37</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-li om dost thou trust, that thou art revolted from me?\"},{\"verse\":6,\"text\":\"Lo thou trustest upon this broken staff of a reed, upon Egypt: upon which if a man lean, it will go into his hand, and pierce it: so is Pharao king of Egypt to all that trust in him.\"},{\"verse\":7,\"text\":\"But if thou wilt answer me: We trust in the Lord our God: is it not he whose high places and altars Ezechias hath taken away, and hath said to Juda and Jerusalem: You shall worship before this altar?\"},{\"verse\":8,\"text\":\"And now deliver thyself up to my lord the king of the Assyrians, and I will give thee two thousand horses, and thou wilt not be able on thy part to find riders for them.\"},{\"verse\":9,\"text\":\"And how wilt thou stand against the face of the judge of one place, of the least of my master’s servants? But if thou trust in Egypt, in chariots and in horsemen:\"},{\"verse\":10,\"text\":\"And am I now come up without the Lord against this land to destroy it? The Lord said to me: Go up against this land, and destroy it.\"},{\"verse\":11,\"text\":\"And Eliacim, and Sobna, and Joahe said to Rabsaces: Speak to thy servants in the Syrian tongue: for we understand it: speak not to us in the Jews’ language in the hearing of the people, that are upon the wall.\"},{\"verse\":12,\"text\":\"And Rabsaces said to them: Hath my master sent me to thy master and to thee, to speak all these words; and not rather to the men that sit on the wall; that they may eat their own dung, and drink their urine with you?\"},{\"verse\":13,\"text\":\"Then Rabsaces stood, and cried out with a loud voice in the Jews’ language, and said: Hear the words of the great king, the king of the Assyrians.\"},{\"verse\":14,\"text\":\"Thus saith the king: Let not Ezechias deceive you, for he shall not be able to deliver you.\"},{\"verse\":15,\"text\":\"And let not Ezechias make you trust in the Lord, saying: The Lord will surely deliver us, and this city shall not be given into the hands of the king of the Assyrians.\"},{\"verse\":16,\"text\":\"Do not hearken to Ezechias: for thus said the king of the Assyrians: Do with me that which is for your advantage, and come out to me, and eat ye every one of his vine, and every one of his fig tree, and drink ye every one the water of his cistern,\"},{\"verse\":17,\"text\":\"Till I come and take you away to a land, like to your own, a land of corn and of wine, a land of bread and vineyards.\"},{\"verse\":18,\"text\":\"Neither let Ezechias trouble you, saying: The Lord will deliver us. Have any of the gods of the nations delivered their land out of the hand of the king of the Assyrians?\"},{\"verse\":19,\"text\":\"Where is the god of Emath and of Arphad? where is the god of Sepharvaim? have they delivered Samaria out of my hand?\"},{\"verse\":20,\"text\":\"Who is there among all the gods of these lands, that hath delivered his country out of my hand, that the Lord may deliver Jerusalem out of my hand?\"},{\"verse\":21,\"text\":\"And they held their peace, and answered him not a word. For the king had commanded, saying: Answer him not.\"},{\"verse\":22,\"text\":\"And Eliacim the son of Helcias, that was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder, went in to Ezechias with their garments rent, and told him the words of Rabsaces.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est in quartodecimo anno regis Ezechiæ, ascendit Sennacherib, rex Assyriorum, super omnes civitates Juda munitas, et cepit eas.\"},{\"verse\":2,\"text\":\"Et misit rex Assyriorum Rabsacen de Lachis in Jerusalem, ad regem Ezechiam in manu gravi : et stetit in aquæductu piscinæ superioris in via Agri fullonis.\"},{\"verse\":3,\"text\":\"Et egressus est ad eum Eliacim, filius Helciæ, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis.\"},{\"verse\":4,\"text\":\"Et dixit ad eos Rabsaces : Dicite Ezechiæ : Hæc dicit rex magnus, rex Assyriorum : Quæ est ista fiducia qua confidis ?\"},{\"verse\":5,\"text\":\"aut quo consilio vel fortitudine rebellare disponis ? super quem habes fiduciam, quia recessisti a me ?\"},{\"verse\":6,\"text\":\"Ecce confidis super baculum arundineum confractum istum, super Ægyptum ; cui si innixus fuerit homo, intrabit in manum ejus, et perforabit eam : sic Pharao, rex Ægypti, omnibus qui confidunt in eo.\"},{\"verse\":7,\"text\":\"Quod si responderis mihi : In Domino Deo nostro confidimus ; nonne ipse est cujus abstulit Ezechias excelsa et altaria, et dixit Judæ et Jerusalem : Coram altari isto adorabitis ?\"},{\"verse\":8,\"text\":\"Et nunc trade te domino meo, regi Assyriorum, et dabo tibi duo millia equorum, nec poteris ex te præbere ascensores eorum :\"},{\"verse\":9,\"text\":\"et quomodo sustinebis faciem judicis unius loci ex servis domini mei minoribus ? Quod si confidis in Ægypto, in quadrigis et in equitibus,\"},{\"verse\":10,\"text\":\"et nunc numquid sine Domino ascendi ad terram istam, ut disperderem eam ? Dominus dixit ad me : Ascende super terram istam, et disperde eam.\"},{\"verse\":11,\"text\":\"Et dixit Eliacim, et Sobna, et Joahe, ad Rabsacen : Loquere ad servos tuos syra lingua ; intelligimus enim ; ne loquaris ad nos judaice in auribus populi qui est super murum.\"},{\"verse\":12,\"text\":\"Et dixit ad eos Rabsaces : Numquid ad dominum tuum et ad te misit me dominus meus, ut loquerer omnia verba ista ? et non potius ad viros qui sedent in muro, ut comedant stercora sua, et bibant urinam pedum suorum vobiscum ?\"},{\"verse\":13,\"text\":\"Et stetit Rabsaces, et clamavit voce magna judaice, et dixit : Audite verba regis magni, regis Assyriorum !\"},{\"verse\":14,\"text\":\"Hæc dicit rex : Non seducat vos Ezechias, quia non poterit eruere vos.\"},{\"verse\":15,\"text\":\"Et non vobis tribuat fiduciam Ezechias super Domino, dicens : Eruens liberabit nos Dominus : non dabitur civitas ista in manu regis Assyriorum.\"},{\"verse\":16,\"text\":\"Nolite audire Ezechiam ; hæc enim dicit rex Assyriorum : Facite mecum benedictionem, et egredimini ad me, et comedite unusquisque vineam suam, et unusquisque ficum suam, et bibite unusquisque aquam cisternæ suæ,\"},{\"verse\":17,\"text\":\"donec veniam, et tollam vos ad terram quæ est ut terra vestra, terram frumenti et vini, terram panum et vinearum.\"},{\"verse\":18,\"text\":\"Nec conturbet vos Ezechias, dicens : Dominus liberabit nos. Numquid liberaverunt dii gentium unusquisque terram suam de manu regis Assyriorum ?\"},{\"verse\":19,\"text\":\"Ubi est deus Emath et Arphad ? ubi est deus Sepharvaim ? numquid liberaverunt Samariam de manu mea ?\"},{\"verse\":20,\"text\":\"Quis est ex omnibus diis terrarum istarum qui eruerit terram suam de manu mea, ut eruat Dominus Jerusalem de manu mea ?\"},{\"verse\":21,\"text\":\"Et siluerunt, et non responderunt ei verbum. Mandaverat enim rex, dicens : Ne respondeatis ei.\"},{\"verse\":22,\"text\":\"Et ingressus est Eliacim, filius Helciæ, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis, ad Ezechiam, scissis vestibus, et nuntiaverunt ei verba Rabsacis.\"}],\"summary\":\"Sennacherib invades Juda: his blasphemies.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":35,\"label\":\"Isaiah 35\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":37,\"label\":\"Isaiah 37\"}}]]\n"])</script></body></html>
