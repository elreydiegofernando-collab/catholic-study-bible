ist="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The burden of Tyre. Howl, ye ships of the sea, for the house is destroyed, from whence they were wont to come: from the land of Cethim it is revealed to them.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Be silent, you that dwell in the island: the merchants of Sidon passing over the sea, have filled thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The seed of the Nile in many waters, the harvest of the river is her revenue: and she is become the mart of the nations.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Be thou ashamed, O Sidon: for the sea speaketh, even the strength of the sea, saying: I have not been in labour, nor have I brought forth, nor have I nourished up young men, nor brought up virgins.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>When it shall be heard in Egypt, they will be sorry when they shall hear of Tyre:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Pass over the seas, howl, ye inhabitants of the island.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Is not this your city, which gloried from of old in her antiquity? her feet shall carry her afar off to sojourn.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who hath taken this counsel against Tyre, that was formerly crowned, whose merchants were princes, and her traders the nobles of the earth?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The Lord of hosts hath designed it, to pull down the pride of all glory, and bring to disgrace all the glorious ones of the earth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pass thy land as a river, O daughter of the sea, thou hast a girdle no more.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He stretched out his hand over the sea, he troubled kingdoms: the Lord hath given a charge against Chanaan, to destroy the strong ones thereof.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he said: Thou shalt glory no more, O virgin daughter of Sidon, who art oppressed: arise and sail over to Cethim, there also thou shalt have no rest.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Behold the land of the Chaldeans, there was not such a people, the Assyrians founded it: they have led away the strong ones thereof into captivity, they have destroyed the houses thereof, they have, brought it to ruin.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Howl, O ye ships of the sea, for your strength is laid waste.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it shall come to pass in that day that thou, O Tyre, shalt be forgotten, seventy years, according to the days of one king: but after seventy years, there shall be unto Tyre as the song of a harlot.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Take a harp, go about the city, harlot that hast been forgotten: sing well, sing many a song, that thou mayst be remembered.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And it shall come to pass after seventy years, that the Lord will visit Tyre, and will bring her back again to her traffic: and she shall commit fornication again with all the kingdoms of the world upon the face of the earth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And her merchandise and her hire shall be sanctified to the Lord: they shall not be kept in store, nor laid up: for her merchandise shall be for them that shall dwell before the Lord, that they may eat unto fulness, and be clothed for a continuance.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Onus Tyri. Ululate, naves maris, quia vastata est domus unde venire consueverant : de terra Cethim revelatum est eis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tacete, qui habitatis in insula ; negotiatores Sidonis, transfretantes mare, repleverunt te.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In aquis multis semen Nili ; messis fluminis fruges ejus : et facta est negotiatio gentium.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erubesce, Sidon ; ait enim mare, fortitudo maris, dicens : Non parturivi, et non peperi, et non enutrivi juvenes, nec ad incrementum perduxi virgines.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cum auditum fuerit in Ægypto, dolebunt cum audierint de Tiro.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Transite maria, ululate, qui habitatis in insula !</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Numquid non vestra hæc est, quæ gloriabatur a diebus pristinis in antiquitate sua ? Ducent eam pedes sui longe ad peregrinandum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quis cogitavit hoc super Tyrum quondam coronatam, cujus negotiatores principes, institores ejus inclyti terræ ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dominus exercituum cogitavit hoc, ut detraheret superbiam omnis gloriæ, et ad ignominiam deduceret universos inclytos terræ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Transi terram tuam quasi flumen, filia maris ! non est cingulum ultra tibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Manum suam extendit super mare ; conturbavit regna. Dominus mandavit adversus Chanaan, ut contereret fortes ejus ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et dixit : Non adjicies ultra ut glorieris, calumniam sustinens virgo filia Sidonis : in Cethim consurgens transfreta : ibi quoque non erit requies tibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ecce terra Chaldæorum, talis populus non fuit : Assur fundavit eam ; in captivitatem traduxerunt robustos ejus, suffoderunt domos ejus, posuerunt eam in ruinam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ululate, naves maris, quia devastata est fortitudo vestra.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et erit in die illa : in oblivione eris, o Tyre ! septuaginta annis, sicut dies regis unius ; post septuaginta autem annos erit Tyro quasi canticum meretricis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sume citharam, circui civitatem, meretrix oblivioni tradita : bene cane, frequenta canticum, ut memoria tui sit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et erit post septuaginta annos : visitabit Dominus Tyrum, et reducet eam ad mercedes suas, et rursum fornicabitur cum universis regnis terræ super faciem terræ ;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et erunt negotiationes ejus et mercedes ejus sanctificatæ Domino : non condentur neque reponentur, quia his qui habitaverint coram Domino erit negotiatio ejus, ut manducent in saturitatem, et vestiantur usque ad vetustatem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 22</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/24/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Isaiah 24</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->23<!-- --> of <!-- -->66<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Isaiah 22" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-ston dt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ISA.23\",{\"bookId\":27,\"usfm\":\"ISA\",\"bookName\":\"Isaiah\",\"drName\":\"Isaias\",\"chapter\":23,\"totalChapters\":66,\"dra\":[{\"verse\":1,\"text\":\"The burden of Tyre. Howl, ye ships of the sea, for the house is destroyed, from whence they were wont to come: from the land of Cethim it is revealed to them.\"},{\"verse\":2,\"text\":\"Be silent, you that dwell in the island: the merchants of Sidon passing over the sea, have filled thee.\"},{\"verse\":3,\"text\":\"The seed of the Nile in many waters, the harvest of the river is her revenue: and she is become the mart of the nations.\"},{\"verse\":4,\"text\":\"Be thou ashamed, O Sidon: for the sea speaketh, even the strength of the sea, saying: I have not been in labour, nor have I brought forth, nor have I nourished up young men, nor brought up virgins.\"},{\"verse\":5,\"text\":\"When it shall be heard in Egypt, they will be sorry when they shall hear of Tyre:\"},{\"verse\":6,\"text\":\"Pass over the seas, howl, ye inhabitants of the island.\"},{\"verse\":7,\"text\":\"Is not this your city, which gloried from of old in her antiquity? her feet shall carry her afar off to sojourn.\"},{\"verse\":8,\"text\":\"Who hath taken this counsel against Tyre, that was formerly crowned, whose merchants were princes, and her traders the nobles of the earth?\"},{\"verse\":9,\"text\":\"The Lord of hosts hath designed it, to pull down the pride of all glory, and bring to disgrace all the glorious ones of the earth.\"},{\"verse\":10,\"text\":\"Pass thy land as a river, O daughter of the sea, thou hast a girdle no more.\"},{\"verse\":11,\"text\":\"He stretched out his hand over the sea, he troubled kingdoms: the Lord hath given a charge against Chanaan, to destroy the strong ones thereof.\"},{\"verse\":12,\"text\":\"And he said: Thou shalt glory no more, O virgin daughter of Sidon, who art oppressed: arise and sail over to Cethim, there also thou shalt have no rest.\"},{\"verse\":13,\"text\":\"Behold the land of the Chaldeans, there was not such a people, the Assyrians founded it: they have led away the strong ones thereof into captivity, they have destroyed the houses thereof, they have, brought it to ruin.\"},{\"verse\":14,\"text\":\"Howl, O ye ships of the sea, for your strength is laid waste.\"},{\"verse\":15,\"text\":\"And it shall come to pass in that day that thou, O Tyre, shalt be forgotten, seventy years, according to the days of one king: but after seventy years, there shall be unto Tyre as the song of a harlot.\"},{\"verse\":16,\"text\":\"Take a harp, go about the city, harlot that hast been forgotten: sing well, sing many a song, that thou mayst be remembered.\"},{\"verse\":17,\"text\":\"And it shall come to pass after seventy years, that the Lord will visit Tyre, and will bring her back again to her traffic: and she shall commit fornication again with all the kingdoms of the world upon the face of the earth.\"},{\"verse\":18,\"text\":\"And her merchandise and her hire shall be sanctified to the Lord: they shall not be kept in store, nor laid up: for her merchandise shall be for them that shall dwell before the Lord, that they may eat unto fulness, and be clothed for a continuance.\"}],\"vul\":[{\"verse\":1,\"text\":\"Onus Tyri. Ululate, naves maris, quia vastata est domus unde venire consueverant : de terra Cethim revelatum est eis.\"},{\"verse\":2,\"text\":\"Tacete, qui habitatis in insula ; negotiatores Sidonis, transfretantes mare, repleverunt te.\"},{\"verse\":3,\"text\":\"In aquis multis semen Nili ; messis fluminis fruges ejus : et facta est negotiatio gentium.\"},{\"verse\":4,\"text\":\"Erubesce, Sidon ; ait enim mare, fortitudo maris, dicens : Non parturivi, et non peperi, et non enutrivi juvenes, nec ad incrementum perduxi virgines.\"},{\"verse\":5,\"text\":\"Cum auditum fuerit in Ægypto, dolebunt cum audierint de Tiro.\"},{\"verse\":6,\"text\":\"Transite maria, ululate, qui habitatis in insula !\"},{\"verse\":7,\"text\":\"Numquid non vestra hæc est, quæ gloriabatur a diebus pristinis in antiquitate sua ? Ducent eam pedes sui longe ad peregrinandum.\"},{\"verse\":8,\"text\":\"Quis cogitavit hoc super Tyrum quondam coronatam, cujus negotiatores principes, institores ejus inclyti terræ ?\"},{\"verse\":9,\"text\":\"Dominus exercituum cogitavit hoc, ut detraheret superbiam omnis gloriæ, et ad ignominiam deduceret universos inclytos terræ.\"},{\"verse\":10,\"text\":\"Transi terram tuam quasi flumen, filia maris ! non est cingulum ultra tibi.\"},{\"verse\":11,\"text\":\"Manum suam extendit super mare ; conturbavit regna. Dominus mandavit adversus Chanaan, ut contereret fortes ejus ;\"},{\"verse\":12,\"text\":\"et dixit : Non adjicies ultra ut glorieris, calumniam sustinens virgo filia Sidonis : in Cethim consurgens transfreta : ibi quoque non erit requies tibi.\"},{\"verse\":13,\"text\":\"Ecce terra Chaldæorum, talis populus non fuit : Assur fundavit eam ; in captivitatem traduxerunt robustos ejus, suffoderunt domos ejus, posuerunt eam in ruinam.\"},{\"verse\":14,\"text\":\"Ululate, naves maris, quia devastata est fortitudo vestra.\"},{\"verse\":15,\"text\":\"Et erit in die illa : in oblivione eris, o Tyre ! septuaginta annis, sicut dies regis unius ; post septuaginta autem annos erit Tyro quasi canticum meretricis :\"},{\"verse\":16,\"text\":\"Sume citharam, circui civitatem, meretrix oblivioni tradita : bene cane, frequenta canticum, ut memoria tui sit.\"},{\"verse\":17,\"text\":\"Et erit post septuaginta annos : visitabit Dominus Tyrum, et reducet eam ad mercedes suas, et rursum fornicabitur cum universis regnis terræ super faciem terræ ;\"},{\"verse\":18,\"text\":\"et erunt negotiationes ejus et mercedes ejus sanctificatæ Domino : non condentur neque reponentur, quia his qui habitaverint coram Domino erit negotiatio ejus, ut manducent in saturitatem, et vestiantur usque ad vetustatem.\"}],\"summary\":\"The destruction of Tyre. It shall be repaired again after seventy years.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":22,\"label\":\"Isaiah 22\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":24,\"label\":\"Isaiah 24\"}}]]\n"])</script></body></html>
