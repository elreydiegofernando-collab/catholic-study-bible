"DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The burden of Damascus. Behold Damascus shall cease to be a city, and shall be as a ruinous heap of stones.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The cities of Aroer shall be left for flocks, and they shall rest there, and there shall be none to make them afraid.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And aid shall cease from Ephraim, and the kingdom from Damascus: and the remnant of Syria shall be as the glory of the children of Israel: saith the Lord of hosts.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And it shall come to pass in that day, that the glory of Jacob shall be made thin, and the fatness of his flesh shall grow lean.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And it shall be as when one gathereth in the harvest that which remaineth, and his arm shall gather the ears of corn: and it shall be as he that seeketh ears in the vale of Raphaim.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the fruit thereof that shall be left upon it, shall be as one cluster of grapes, and as the shaking of the olive tree, two or three berries in the top of a bough, or four or five upon the top of the tree, saith the Lord the God of Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In that day man shall bow down himself to his Maker, and his eyes shall look to the Holy One of Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he shall not look to the altars which his hands made; and he shall not have respect to the things that his fingers wrought, such as groves and temples.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In that day his strong cities shall be forsaken, as the ploughs, and the corn that were left before the face of the children of Israel, and thou shalt be desolate.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Because thou hast forgotten God thy saviour, and hast not remembered thy strong helper: therefore shalt thou plant good plants, and shalt sow strange seed.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In the day of thy planting shall be the wild grape, and in the morning thy seed shall flourish: the harvest is taken away in the day of inheritance, and shall grieve thee much.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Woe to the multitude of many people, like the multitude of the roaring sea: and the tumult of crowds, like the noise of many waters.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nations shall make a noise like the noise of waters overflowing, but he shall rebuke him, and he shall flee far off: and he shall be carried away as the dust of the mountains before the wind, and as a whirlwind before a tempest.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In the time of the evening, behold there shall be trouble: the morning shall come, and he shall not be: this is the portion of them that have wasted us, and the lot of them that spoiled us.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Onus Damasci. Ecce Damascus desinet esse civitas, et erit sicut acervus lapidum in ruina.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Derelictæ civitates Aroër gregibus erunt, et requiescent ibi, et non erit qui exterreat.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et cessabit adjutorium ab Ephraim, et regnum a Damasco ; et reliquiæ Syriæ sicut gloria filiorum Israël erunt, dicit Dominus exercituum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et erit in die illa : attenuabitur gloria Jacob, et pinguedo carnis ejus marcescet.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et erit sicut congregans in messe quod restiterit, et brachium ejus spicas leget ; et erit sicut quærens spicas in valle Raphaim.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et relinquetur in eo sicut racemus et sicut excussio oleæ duarum vel trium olivarum in summitate rami, sive quatuor aut quinque in cacuminibus ejus fructus ejus, dicit Dominus Deus Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In die illa inclinabitur homo ad factorem suum, et oculi ejus ad Sanctum Israël respicient ;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et non inclinabitur ad altaria quæ fecerunt manus ejus ; et quæ operati sunt digiti ejus non respiciet lucos et delubra.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In die illa erunt civitates fortitudinis ejus derelictæ sicut aratra, et segetes quæ derelictæ sunt a facie filiorum Israël ; et eris deserta.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quia oblitus es Dei salvatoris tui, et fortis adjutoris tui non es recordata : propterea plantabis plantationem fidelem, et germen alienum seminabis ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>in die plantationis tuæ labrusca, et mane semen tuum florebit ; ablata est messis in die hæreditatis, et dolebit graviter.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Væ multitudini populorum multorum, ut multitudo maris sonantis ; et tumultus turbarum, sicut sonitus aquarum multarum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sonabunt populi sicut sonitus aquarum inundantium, et increpabit eum, et fugiet procul ; et rapietur sicut pulvis montium a facie venti, et sicut turbo coram tempestate.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In tempore vespere, et ecce turbatio ; in matutino, et non subsistet. Hæc est pars eorum qui vastaverunt nos, et sors diripientium nos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Isaiah 18</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></pa apes, and as the shaking of the olive tree, two or three berries in the top of a bough, or four or five upon the top of the tree, saith the Lord the God of Israel.\"},{\"verse\":7,\"text\":\"In that day man shall bow down himself to his Maker, and his eyes shall look to the Holy One of Israel.\"},{\"verse\":8,\"text\":\"And he shall not look to the altars which his hands made; and he shall not have respect to the things that his fingers wrought, such as groves and temples.\"},{\"verse\":9,\"text\":\"In that day his strong cities shall be forsaken, as the ploughs, and the corn that were left before the face of the children of Israel, and thou shalt be desolate.\"},{\"verse\":10,\"text\":\"Because thou hast forgotten God thy saviour, and hast not remembered thy strong helper: therefore shalt thou plant good plants, and shalt sow strange seed.\"},{\"verse\":11,\"text\":\"In the day of thy planting shall be the wild grape, and in the morning thy seed shall flourish: the harvest is taken away in the day of inheritance, and shall grieve thee much.\"},{\"verse\":12,\"text\":\"Woe to the multitude of many people, like the multitude of the roaring sea: and the tumult of crowds, like the noise of many waters.\"},{\"verse\":13,\"text\":\"Nations shall make a noise like the noise of waters overflowing, but he shall rebuke him, and he shall flee far off: and he shall be carried away as the dust of the mountains before the wind, and as a whirlwind before a tempest.\"},{\"verse\":14,\"text\":\"In the time of the evening, behold there shall be trouble: the morning shall come, and he shall not be: this is the portion of them that have wasted us, and the lot of them that spoiled us.\"}],\"vul\":[{\"verse\":1,\"text\":\"Onus Damasci. Ecce Damascus desinet esse civitas, et erit sicut acervus lapidum in ruina.\"},{\"verse\":2,\"text\":\"Derelictæ civitates Aroër gregibus erunt, et requiescent ibi, et non erit qui exterreat.\"},{\"verse\":3,\"text\":\"Et cessabit adjutorium ab Ephraim, et regnum a Damasco ; et reliquiæ Syriæ sicut gloria filiorum Israël erunt, dicit Dominus exercituum.\"},{\"verse\":4,\"text\":\"Et erit in die illa : attenuabitur gloria Jacob, et pinguedo carnis ejus marcescet.\"},{\"verse\":5,\"text\":\"Et erit sicut congregans in messe quod restiterit, et brachium ejus spicas leget ; et erit sicut quærens spicas in valle Raphaim.\"},{\"verse\":6,\"text\":\"Et relinquetur in eo sicut racemus et sicut excussio oleæ duarum vel trium olivarum in summitate rami, sive quatuor aut quinque in cacuminibus ejus fructus ejus, dicit Dominus Deus Israël.\"},{\"verse\":7,\"text\":\"In die illa inclinabitur homo ad factorem suum, et oculi ejus ad Sanctum Israël respicient ;\"},{\"verse\":8,\"text\":\"et non inclinabitur ad altaria quæ fecerunt manus ejus ; et quæ operati sunt digiti ejus non respiciet lucos et delubra.\"},{\"verse\":9,\"text\":\"In die illa erunt civitates fortitudinis ejus derelictæ sicut aratra, et segetes quæ derelictæ sunt a facie filiorum Israël ; et eris deserta.\"},{\"verse\":10,\"text\":\"Quia oblitus es Dei salvatoris tui, et fortis adjutoris tui non es recordata : propterea plantabis plantationem fidelem, et germen alienum seminabis ;\"},{\"verse\":11,\"text\":\"in die plantationis tuæ labrusca, et mane semen tuum florebit ; ablata est messis in die hæreditatis, et dolebit graviter.\"},{\"verse\":12,\"text\":\"Væ multitudini populorum multorum, ut multitudo maris sonantis ; et tumultus turbarum, sicut sonitus aquarum multarum.\"},{\"verse\":13,\"text\":\"Sonabunt populi sicut sonitus aquarum inundantium, et increpabit eum, et fugiet procul ; et rapietur sicut pulvis montium a facie venti, et sicut turbo coram tempestate.\"},{\"verse\":14,\"text\":\"In tempore vespere, et ecce turbatio ; in matutino, et non subsistet. Hæc est pars eorum qui vastaverunt nos, et sors diripientium nos.\"}],\"summary\":\"Judgments upon Damascus and Samaria. The overthrow of the Assyrians.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":16,\"label\":\"Isaiah 16\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":18,\"label\":\"Isaiah 18\"}}]]\n"])</script></body></html>
