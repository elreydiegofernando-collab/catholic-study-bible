875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The burden of Babylon which Isaias the son of Amos saw.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Upon the dark mountain lift ye up a banner, exalt the voice, lift up the hand, and let the rulers go into the gates.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I have commanded my sanctified ones, and have called my strong ones in my wrath, them that rejoice in my glory.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The noise of a multitude in the mountains, as it were of many people, the noise of the sound of kings, of nations gathered together: the Lord of hosts hath given charge to the troops of war.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>To them that come from a country afar off, from the end of heaven: the Lord and the instruments of his wrath, to destroy the whole land.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Howl ye, for the day of the Lord is near: it shall come as a destruction from the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Therefore shall all hands be faint, and every heart of man shall melt,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And shall be broken. Gripings and pains, shall take hold of them, they shall be in pain as a woman in labour. Every one shall be amazed at his neighbour, their countenances shall be as faces burnt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Behold, the day of the Lord shall come, a cruel day, and full of indignation, and of wrath, and fury, to lay the land desolate, and to destroy the sinners thereof out of it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For the stars of heaven, and their brightness shall not display their light: the sun shall be darkened in his rising, and the moon shall not shine with her light.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I will visit the evils of the world, and against the wicked for their iniquity: and I will make the pride of infidels to cease, and will bring down the arrogancy of the mighty.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A man shall be more precious than gold, yea a man than the finest of gold.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For this I will trouble the heaven: and the earth shall be moved out of her place, for the indignation of the Lord of hosts, and for the day of his fierce wrath.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they shall be as a doe fleeing away, and as a sheep: and there shall be none to gather them together: every man shall turn to his own people, and every one shall flee to his own land.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Every one that shall be found, shall be slain: and every one that shall come to their aid, shall fall by the sword.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Their infants shall be dashed in pieces before their eyes: their houses shall be pillaged, and their wives shall be ravished.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Behold I will stir up the Medes against them, who shall not seek silver, nor desire gold:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But with their arrows they shall kill the children, and shall have no pity upon the sucklings of the womb, and their eye shall not spare their sons.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And that Babylon, glorious among kingdoms, the famous pride of the Chaldeans, shall be even as the Lord destroyed Sodom and Gomorrha.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>It shall no more be inhabited for ever, and it shall not be founded unto generation and generation: neither shall the Arabian pitch his tents there, nor shall shepherds rest there.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But wild beasts shall rest there, and their houses shall be filled with serpents, and ostriches shall dwell there, and the hairy ones shall dance there:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And owls shall answer one another there, in the houses thereof, and sirens in the temples of pleasure.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Onus Babylonis, quod vidit Isaias, filius Amos.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Super montem caliginosum levate signum : exaltate vocem, levate manum, et ingrediantur portas duces.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ego mandavi sanctificatis meis, et vocavi fortes meos in ira mea, exsultantes in gloria mea.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Vox multitudinis in montibus, quasi populorum frequentium ; vox sonitus regum, gentium congregatarum. Dominus exercituum præcepit militiæ belli,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>venientibus de terra procul, a summitate cæli ; Dominus, et vasa furoris ejus, ut disperdat omnem terram.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ululate, quia prope est dies Domini ; quasi vastitas a Domino veniet.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Propter hoc omnes manus dissolventur, et omne cor hominis contabescet,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et conteretur. Torsiones et dolores tenebunt ; quasi parturiens dolebunt : unusquisque ad proximum suum stupebit, facies combustæ vultus eorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ecce dies Domini veniet, crudelis, et indignationis plenus, et iræ, furorisque, ad ponendam terram in solitudinem, et peccatores ejus conterendos de ea.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam stellæ cæli, et splendor earum, non expandent lumen suum ; obtenebratus est sol in ortu suo, et luna non splendebit in lumine suo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et visitabo super orbis mala, et contra impios iniquitatem eorum ; et quiescere faciam superbiam infidelium, et arrogantiam fortium humiliabo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Pretiosior erit vir auro, et homo mundo obrizo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Super hoc cælum turbabo ; et movebitur terra de loco suo, propter indignationem Domini exercituum, et propter diem iræ furoris ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et erit quasi damula fugiens, et quasi ovis, et non erit qui congreget. Unusquisque ad populum suum convertetur, et singuli ad terram suam fugient.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnis qui inventus fuerit occidetur, et omnis qui supervenerit cadet in gladio ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>infantes eorum allidentur in oculis eorum, diripientur domus eorum, et uxores eorum violabuntur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ecce ego suscitabo super eos Medos, qui argentum non quærant, nec aurum velint ;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>sed sagittis parvulos interficient, et lactantibus uteris non miserebuntur, et super filios non parcet oculus eorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et erit Babylon illa gloriosa in regnis, inclyta superbia Chaldæorum, sicut subvertit Dominus Sodomam et Gomorrham.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Non habitabitur usque in finem, et non fundabitur usque ad generationem et generationem ; nec ponet ibi tentoria Arabs, nec pastores requiescent ibi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sed requiescent ibi bestiæ, et replebuntur domus eorum draconibus, et habitabunt ibi struthiones, et pilosi saltabunt ibi ;</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et respondebunt ibi ululæ in ædibus ejus, et sirenes in delubris voluptatis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true" t the voice, lift up the hand, and let the rulers go into the gates.\"},{\"verse\":3,\"text\":\"I have commanded my sanctified ones, and have called my strong ones in my wrath, them that rejoice in my glory.\"},{\"verse\":4,\"text\":\"The noise of a multitude in the mountains, as it were of many people, the noise of the sound of kings, of nations gathered together: the Lord of hosts hath given charge to the troops of war.\"},{\"verse\":5,\"text\":\"To them that come from a country afar off, from the end of heaven: the Lord and the instruments of his wrath, to destroy the whole land.\"},{\"verse\":6,\"text\":\"Howl ye, for the day of the Lord is near: it shall come as a destruction from the Lord.\"},{\"verse\":7,\"text\":\"Therefore shall all hands be faint, and every heart of man shall melt,\"},{\"verse\":8,\"text\":\"And shall be broken. Gripings and pains, shall take hold of them, they shall be in pain as a woman in labour. Every one shall be amazed at his neighbour, their countenances shall be as faces burnt.\"},{\"verse\":9,\"text\":\"Behold, the day of the Lord shall come, a cruel day, and full of indignation, and of wrath, and fury, to lay the land desolate, and to destroy the sinners thereof out of it.\"},{\"verse\":10,\"text\":\"For the stars of heaven, and their brightness shall not display their light: the sun shall be darkened in his rising, and the moon shall not shine with her light.\"},{\"verse\":11,\"text\":\"And I will visit the evils of the world, and against the wicked for their iniquity: and I will make the pride of infidels to cease, and will bring down the arrogancy of the mighty.\"},{\"verse\":12,\"text\":\"A man shall be more precious than gold, yea a man than the finest of gold.\"},{\"verse\":13,\"text\":\"For this I will trouble the heaven: and the earth shall be moved out of her place, for the indignation of the Lord of hosts, and for the day of his fierce wrath.\"},{\"verse\":14,\"text\":\"And they shall be as a doe fleeing away, and as a sheep: and there shall be none to gather them together: every man shall turn to his own people, and every one shall flee to his own land.\"},{\"verse\":15,\"text\":\"Every one that shall be found, shall be slain: and every one that shall come to their aid, shall fall by the sword.\"},{\"verse\":16,\"text\":\"Their infants shall be dashed in pieces before their eyes: their houses shall be pillaged, and their wives shall be ravished.\"},{\"verse\":17,\"text\":\"Behold I will stir up the Medes against them, who shall not seek silver, nor desire gold:\"},{\"verse\":18,\"text\":\"But with their arrows they shall kill the children, and shall have no pity upon the sucklings of the womb, and their eye shall not spare their sons.\"},{\"verse\":19,\"text\":\"And that Babylon, glorious among kingdoms, the famous pride of the Chaldeans, shall be even as the Lord destroyed Sodom and Gomorrha.\"},{\"verse\":20,\"text\":\"It shall no more be inhabited for ever, and it shall not be founded unto generation and generation: neither shall the Arabian pitch his tents there, nor shall shepherds rest there.\"},{\"verse\":21,\"text\":\"But wild beasts shall rest there, and their houses shall be filled with serpents, and ostriches shall dwell there, and the hairy ones shall dance there:\"},{\"verse\":22,\"text\":\"And owls shall answer one another there, in the houses thereof, and sirens in the temples of pleasure.\"}],\"vul\":[{\"verse\":1,\"text\":\"Onus Babylonis, quod vidit Isaias, filius Amos.\"},{\"verse\":2,\"text\":\"Super montem caliginosum levate signum : exaltate vocem, levate manum, et ingrediantur portas duces.\"},{\"verse\":3,\"text\":\"Ego mandavi sanctificatis meis, et vocavi fortes meos in ira mea, exsultantes in gloria mea.\"},{\"verse\":4,\"text\":\"Vox multitudinis in montibus, quasi populorum frequentium ; vox sonitus regum, gentium congregatarum. Dominus exercituum præcepit militiæ belli,\"},{\"verse\":5,\"text\":\"venientibus de terra procul, a summitate cæli ; Dominus, et vasa furoris ejus, ut disperdat omnem terram.\"},{\"verse\":6,\"text\":\"Ululate, quia prope est dies Domini ; quasi vastitas a Domino veniet.\"},{\"verse\":7,\"text\":\"Propter hoc omnes manus dissolventur, et omne cor hominis contabescet,\"},{\"verse\":8,\"text\":\"et conteretur. Torsiones et dolores tenebunt ; quasi parturiens dolebunt : unusquisque ad proximum suum stupebit, facies combustæ vultus eorum.\"},{\"verse\":9,\"text\":\"Ecce dies Domini veniet, crudelis, et indignationis plenus, et iræ, furorisque, ad ponendam terram in solitudinem, et peccatores ejus conterendos de ea.\"},{\"verse\":10,\"text\":\"Quoniam stellæ cæli, et splendor earum, non expandent lumen suum ; obtenebratus est sol in ortu suo, et luna non splendebit in lumine suo.\"},{\"verse\":11,\"text\":\"Et visitabo super orbis mala, et contra impios iniquitatem eorum ; et quiescere faciam superbiam infidelium, et arrogantiam fortium humiliabo.\"},{\"verse\":12,\"text\":\"Pretiosior erit vir auro, et homo mundo obrizo.\"},{\"verse\":13,\"text\":\"Super hoc cælum turbabo ; et movebitur terra de loco suo, propter indignationem Domini exercituum, et propter diem iræ furoris ejus.\"},{\"verse\":14,\"text\":\"Et erit quasi damula fugiens, et quasi ovis, et non erit qui congreget. Unusquisque ad populum suum convertetur, et singuli ad terram suam fugient.\"},{\"verse\":15,\"text\":\"Omnis qui inventus fuerit occidetur, et omnis qui supervenerit cadet in gladio ;\"},{\"verse\":16,\"text\":\"infantes eorum allidentur in oculis eorum, diripientur domus eorum, et uxores eorum violabuntur.\"},{\"verse\":17,\"text\":\"Ecce ego suscitabo super eos Medos, qui argentum non quærant, nec aurum velint ;\"},{\"verse\":18,\"text\":\"sed sagittis parvulos interficient, et lactantibus uteris non miserebuntur, et super filios non parcet oculus eorum.\"},{\"verse\":19,\"text\":\"Et erit Babylon illa gloriosa in regnis, inclyta superbia Chaldæorum, sicut subvertit Dominus Sodomam et Gomorrham.\"},{\"verse\":20,\"text\":\"Non habitabitur usque in finem, et non fundabitur usque ad generationem et generationem ; nec ponet ibi tentoria Arabs, nec pastores requiescent ibi.\"},{\"verse\":21,\"text\":\"Sed requiescent ibi bestiæ, et replebuntur domus eorum draconibus, et habitabunt ibi struthiones, et pilosi saltabunt ibi ;\"},{\"verse\":22,\"text\":\"et respondebunt ibi ululæ in ædibus ejus, et sirenes in delubris voluptatis.\"}],\"summary\":\"The desolation of Babylon.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":12,\"label\":\"Isaiah 12\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":14,\"label\":\"Isaiah 14\"}}]]\n"])</script></body></html>
