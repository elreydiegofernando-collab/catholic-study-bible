[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">26</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Isaias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ISA/">About <!-- -->Isaiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A canticle of thanks for the deliverance of God’s people.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In that day shall this canticle be sung in the land of Juda. Sion the city of our strength a saviour, a wall and a bulwark shall be set therein.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Open ye the gates, and let the just nation, that keepeth the truth, enter in.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The old error is passed away: thou wilt keep peace: peace, because we have hoped in thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>You have hoped in the Lord for evermore, in the Lord God mighty for ever.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For he shall bring down them that dwell on high, the high city he shall lay low. He shall bring it down even to the ground, he shall pull it down even to the dust.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The foot shall tread it down, the feet of the poor, the steps of the needy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The way of the just is right, the path of the just is right to walk in.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And in the way of thy judgments, O Lord, we have patiently waited for thee: thy name, and thy remembrance are the desire of the soul.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>My soul hath desired thee in the night: yea, and with my spirit within me in the morning early I will watch to thee. When thou shalt do thy judgments on the earth, the inhabitants of the world shall learn justice.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Let us have pity on the wicked, but he will not learn justice: in the land of the saints he hath done wicked things, and he shall not see the glory of the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Lord, let thy hand be exalted, and let them not see: let the envious people see, and be confounded: and let fire devour thy enemies.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Lord, thou wilt give us peace: for thou hast wrought all our works for us.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>O Lord our God, other lords besides thee have had dominion over us, only in thee let us remember thy name.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Let not the dead live, let not the giants rise again: therefore hast visited and destroyed them, and hast destroyed all their memory.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou hast been favourable to the nation, O Lord, thou hast been favourable to the nation: art thou glorified? thou hast removed all the ends of the earth far off.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Lord, they have sought after thee in distress, in the tribulation of murmuring thy instruction was with them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>As a woman with child, when she draweth near the time of her delivery, is in pain, and crieth out in her pangs: so are we become in thy presence, O Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>We have conceived, and been as it were in labour, and have brought forth wind: we have not wrought salvation on the earth, therefore the inhabitants of the earth have not fallen.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thy dead men shall live, my slain shall rise again: awake, and give praise, ye that dwell in the dust: for thy dew is the dew of the light: and the land of the giants thou shalt pull down into ruin.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Go, my people, enter into thy chambers, shut thy doors upon thee, hide thyself a little for a moment, until the indignation pass away.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For behold the Lord will come out of his place, to visit the iniquity of the inhabitant of the earth against him: and the earth shall disclose her blood, and shall cover her slain no more.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In die illa cantabitur canticum istud in terra Juda : Urbs fortitudinis nostræ Sion ; salvator ponetur in ea murus et antemurale.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Aperite portas, et ingrediatur gens justa, custodiens veritatem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Vetus error abiit : servabis pacem ; pacem, quia in te speravimus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sperastis in Domino in sæculis æternis ; in Domino Deo forti in perpetuum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quia incurvabit habitantes in excelso ; civitatem sublimem humiliabit : humiliabit eam usque ad terram, detrahet eam usque ad pulverem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Conculcabit eam pes, pedes pauperis, gressus egenorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Semita justi recta est, rectus callis justi ad ambulandum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et in semita judiciorum tuorum, Domine, sustinuimus te : nomen tuum et memoriale tuum in desiderio animæ.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Anima mea desideravit te in nocte, sed et spiritu meo in præcordiis meis de mane vigilabo ad te. Cum feceris judicia tua in terra, justitiam discent habitatores orbis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Misereamur impio, et non discet justitiam ; in terra sanctorum iniqua gessit, et non videbit gloriam Domini.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Domine, exaltetur manus tua, et non videant ; videant, et confundantur zelantes populi ; et ignis hostes tuos devoret.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Domine, dabis pacem nobis : omnia enim opera nostra operatus es nobis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Domine Deus noster, possederunt nos domini absque te ; tantum in te recordemur nominis tui.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Morientes non vivant, gigantes non resurgant : propterea visitasti et contrivisti eos, et perdidisti omnem memoriam eorum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Indulsisti genti, Domine, indulsisti genti, numquid glorificatus es ? elongasti omnes terminos terræ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Domine, in angustia requisierunt te, in tribulatione murmuris doctrina tua eis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sicut quæ concipit, cum appropinquaverit ad partum, dolens clamat in doloribus suis, sic facti sumus a facie tua, Domine.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Concepimus, et quasi parturivimus, et peperimus spiritum. Salutes non fecimus in terra ; ideo non ceciderunt habitatores terræ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Vivent mortui tui, interfecti mei resurgent. Expergiscimini, et laudate, qui habitatis in pulvere, quia ros lucis ros tuus, et terram gigantum detrahes in ruinam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vade, populus meus, intra in cubicula tua ; claude ostia tua super te, abscondere modicum ad momentum, donec pertranseat indignatio.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ecce enim Dominus egredietur de loco suo, ut visitet iniquitatem habitatoris terræ contra eum ; et revelabit terra sanguinem suum, et non operiet ultra interfectos suos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 25</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/27/"><span class="min-w-0"><span cl shall bring it down even to the ground, he shall pull it down even to the dust.\"},{\"verse\":6,\"text\":\"The foot shall tread it down, the feet of the poor, the steps of the needy.\"},{\"verse\":7,\"text\":\"The way of the just is right, the path of the just is right to walk in.\"},{\"verse\":8,\"text\":\"And in the way of thy judgments, O Lord, we have patiently waited for thee: thy name, and thy remembrance are the desire of the soul.\"},{\"verse\":9,\"text\":\"My soul hath desired thee in the night: yea, and with my spirit within me in the morning early I will watch to thee. When thou shalt do thy judgments on the earth, the inhabitants of the world shall learn justice.\"},{\"verse\":10,\"text\":\"Let us have pity on the wicked, but he will not learn justice: in the land of the saints he hath done wicked things, and he shall not see the glory of the Lord.\"},{\"verse\":11,\"text\":\"Lord, let thy hand be exalted, and let them not see: let the envious people see, and be confounded: and let fire devour thy enemies.\"},{\"verse\":12,\"text\":\"Lord, thou wilt give us peace: for thou hast wrought all our works for us.\"},{\"verse\":13,\"text\":\"O Lord our God, other lords besides thee have had dominion over us, only in thee let us remember thy name.\"},{\"verse\":14,\"text\":\"Let not the dead live, let not the giants rise again: therefore hast visited and destroyed them, and hast destroyed all their memory.\"},{\"verse\":15,\"text\":\"Thou hast been favourable to the nation, O Lord, thou hast been favourable to the nation: art thou glorified? thou hast removed all the ends of the earth far off.\"},{\"verse\":16,\"text\":\"Lord, they have sought after thee in distress, in the tribulation of murmuring thy instruction was with them.\"},{\"verse\":17,\"text\":\"As a woman with child, when she draweth near the time of her delivery, is in pain, and crieth out in her pangs: so are we become in thy presence, O Lord.\"},{\"verse\":18,\"text\":\"We have conceived, and been as it were in labour, and have brought forth wind: we have not wrought salvation on the earth, therefore the inhabitants of the earth have not fallen.\"},{\"verse\":19,\"text\":\"Thy dead men shall live, my slain shall rise again: awake, and give praise, ye that dwell in the dust: for thy dew is the dew of the light: and the land of the giants thou shalt pull down into ruin.\"},{\"verse\":20,\"text\":\"Go, my people, enter into thy chambers, shut thy doors upon thee, hide thyself a little for a moment, until the indignation pass away.\"},{\"verse\":21,\"text\":\"For behold the Lord will come out of his place, to visit the iniquity of the inhabitant of the earth against him: and the earth shall disclose her blood, and shall cover her slain no more.\"}],\"vul\":[{\"verse\":1,\"text\":\"In die illa cantabitur canticum istud in terra Juda : Urbs fortitudinis nostræ Sion ; salvator ponetur in ea murus et antemurale.\"},{\"verse\":2,\"text\":\"Aperite portas, et ingrediatur gens justa, custodiens veritatem.\"},{\"verse\":3,\"text\":\"Vetus error abiit : servabis pacem ; pacem, quia in te speravimus.\"},{\"verse\":4,\"text\":\"Sperastis in Domino in sæculis æternis ; in Domino Deo forti in perpetuum.\"},{\"verse\":5,\"text\":\"Quia incurvabit habitantes in excelso ; civitatem sublimem humiliabit : humiliabit eam usque ad terram, detrahet eam usque ad pulverem.\"},{\"verse\":6,\"text\":\"Conculcabit eam pes, pedes pauperis, gressus egenorum.\"},{\"verse\":7,\"text\":\"Semita justi recta est, rectus callis justi ad ambulandum.\"},{\"verse\":8,\"text\":\"Et in semita judiciorum tuorum, Domine, sustinuimus te : nomen tuum et memoriale tuum in desiderio animæ.\"},{\"verse\":9,\"text\":\"Anima mea desideravit te in nocte, sed et spiritu meo in præcordiis meis de mane vigilabo ad te. Cum feceris judicia tua in terra, justitiam discent habitatores orbis.\"},{\"verse\":10,\"text\":\"Misereamur impio, et non discet justitiam ; in terra sanctorum iniqua gessit, et non videbit gloriam Domini.\"},{\"verse\":11,\"text\":\"Domine, exaltetur manus tua, et non videant ; videant, et confundantur zelantes populi ; et ignis hostes tuos devoret.\"},{\"verse\":12,\"text\":\"Domine, dabis pacem nobis : omnia enim opera nostra operatus es nobis.\"},{\"verse\":13,\"text\":\"Domine Deus noster, possederunt nos domini absque te ; tantum in te recordemur nominis tui.\"},{\"verse\":14,\"text\":\"Morientes non vivant, gigantes non resurgant : propterea visitasti et contrivisti eos, et perdidisti omnem memoriam eorum.\"},{\"verse\":15,\"text\":\"Indulsisti genti, Domine, indulsisti genti, numquid glorificatus es ? elongasti omnes terminos terræ.\"},{\"verse\":16,\"text\":\"Domine, in angustia requisierunt te, in tribulatione murmuris doctrina tua eis.\"},{\"verse\":17,\"text\":\"Sicut quæ concipit, cum appropinquaverit ad partum, dolens clamat in doloribus suis, sic facti sumus a facie tua, Domine.\"},{\"verse\":18,\"text\":\"Concepimus, et quasi parturivimus, et peperimus spiritum. Salutes non fecimus in terra ; ideo non ceciderunt habitatores terræ.\"},{\"verse\":19,\"text\":\"Vivent mortui tui, interfecti mei resurgent. Expergiscimini, et laudate, qui habitatis in pulvere, quia ros lucis ros tuus, et terram gigantum detrahes in ruinam.\"},{\"verse\":20,\"text\":\"Vade, populus meus, intra in cubicula tua ; claude ostia tua super te, abscondere modicum ad momentum, donec pertranseat indignatio.\"},{\"verse\":21,\"text\":\"Ecce enim Dominus egredietur de loco suo, ut visitet iniquitatem habitatoris terræ contra eum ; et revelabit terra sanguinem suum, et non operiet ultra interfectos suos.\"}],\"summary\":\"A canticle of thanks for the deliverance of God’s people.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":25,\"label\":\"Isaiah 25\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":27,\"label\":\"Isaiah 27\"}}]]\n"])</script></body></html>
