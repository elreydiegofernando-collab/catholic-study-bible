20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Isaiah<!-- --> <span class="text-stone-500">63</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Isaias</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s victory over his enemies: his mercies to his people: their complaint.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Who is this that cometh from Edom, with dyed garments from Bosra, this beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Why then is thy apparel red, and thy garments like theirs that tread in the winepress?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I have trodden the winepress alone, and of the Gentiles there is not a man with me: I have trampled on them in my indignation, and have trodden them down in my wrath, and their blood is sprinkled upon my garments, and I have stained all my apparel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For the day of vengeance is in my heart, the year of my redemption is come.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I looked about, and there was none to help: I sought, and there was none to give aid: and my own arm hath saved for me, and my indignation itself hath helped me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And I have trodden down the people in my wrath, and have made them drunk in my indignation, and have brought down their strength to the earth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I will remember the tender mercies of the Lord, the praise of the Lord for all the things that the Lord hath bestowed upon us, and for the multitude of his good things to the house of Israel, which he hath given them according to his kindness, and according to the multitude of his mercies.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he said: Surely they are my people, children that will not deny: so he became their saviour.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In all their affliction he was not troubled, and the angel of his presence saved them: in his love, and in his mercy he redeemed them, and he carried them and lifted them up all the days of old.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But they provoked to wrath, and afflicted the spirit of his Holy One: and he was turned to be their enemy, and he fought against them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he remembered the days of old of Moses, and of his people: Where is he that brought them up out of the sea, with the shepherds of his flock? where is he that put in the midst of them the spirit of his Holy One?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He that brought out Moses by the right hand, by the arm of his majesty: that divided the waters before them, to make himself an everlasting name.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that led them out through the deep, as a horse in the wilderness that stumbleth not.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>As a beast that goeth down in the field, the spirit of the Lord was their leader: so didst thou lead thy people to make thyself a glorious name.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Look down from heaven, and behold from thy holy habitation and the place of thy glory: where is thy zeal, and thy strength, the multitude of thy bowels, and of thy mercies? they have held back themselves from me.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For thou art our father, and Abraham hath not known us, and Israel hath been ignorant of us: thou, O Lord, art our father, our redeemer, from everlasting is thy name.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Why hast thou made us to err, O Lord, from thy ways: why hast thou hardened our heart, that we should not fear thee? return for the sake of thy servants, the tribes of thy inheritance.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They have possessed thy holy people as nothing: our enemies have trodden down thy sanctuary.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>We are become as in the beginning, when thou didst not rule over us, and when we were not called by thy name.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quis est iste, qui venit de Edom, tinctis vestibus de Bosra ? iste formosus in stola sua, gradiens in multitudine fortitudinis suæ ? Ego qui loquor justitiam, et propugnator sum ad salvandum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quare ergo rubrum est indumentum tuum, et vestimenta tua sicut calcantium in torculari ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Torcular calcavi solus, et de gentibus non est vir mecum ; calcavi eos in furore meo, et conculcavi eos in ira mea : et aspersus est sanguis eorum super vestimenta mea, et omnia indumenta mea inquinavi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dies enim ultionis in corde meo ; annus redemptionis meæ venit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Circumspexi, et non erat auxiliator ; quæsivi, et non fuit qui adjuvaret : et salvavit mihi brachium meum, et indignatio mea ipsa auxiliata est mihi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et conculcavi populos in furore meo, et inebriavi eos in indignatione mea, et detraxi in terram virtutem eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Miserationum Domini recordabor ; laudem Domini super omnibus quæ reddidit nobis Dominus, et super multitudinem bonorum domui Israël, quæ largitus est eis secundum indulgentiam suam, et secundum multitudinem misericordiarum suarum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et dixit : Verumtamen populus meus est, filii non negantes ; et factus est eis salvator.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In omni tribulatione eorum non est tribulatus, et angelus faciei ejus salvavit eos : in dilectione sua et in indulgentia sua ipse redemit eos, et portavit eos, et elevavit eos cunctis diebus sæculi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ipsi autem ad iracundiam provocaverunt, et afflixerunt spiritum Sancti ejus : et conversus est eis in inimicum, et ipse debellavit eos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et recordatus est dierum sæculi Moysi, et populi sui. Ubi est qui eduxit eos de mari cum pastoribus gregis sui ? Ubi est qui posuit in medio ejus spiritum Sancti sui ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>qui eduxit ad dexteram Moysen, brachio majestatis suæ ; qui scidit aquas ante eos, ut faceret sibi nomen sempiternum ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>qui eduxit eos per abyssos, quasi equum in deserto non impingentem ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quasi animal in campo descendens, spiritus Domini ductor ejus fuit. Sic adduxisti populum tuum, ut faceres tibi nomen gloriæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Attende de cælo, et vide de habitaculo sancto tuo, et gloriæ tuæ. Ubi est zelus tuus, et fortitudo tua, multitudo viscerum tuorum et miserationum tuarum ? Super me continuerunt se.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tu enim pater noster : et Abraham nescivit nos, et Israël ignoravit nos : tu, Domine, pater noster, redemptor noster, a sæculo nomen tuum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quare errare nos fecisti, Domine, de viis tuis ; indurasti cor nostrum ne timeremus te ? Convertere propter servos tuos, tribus hæreditatis tuæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quasi nihilum possederunt populum sanctum tuum : hostes nostri conculcaverunt sanctificationem tuam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Facti sumus quasi in principio, cum non dominareris nostri, neque invocaretur nomen tuum super nos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/62/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Isaiah 62</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ISA/64/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="bl \",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"ISA.63\",{\"bookId\":27,\"usfm\":\"ISA\",\"bookName\":\"Isaiah\",\"drName\":\"Isaias\",\"chapter\":63,\"totalChapters\":66,\"dra\":[{\"verse\":1,\"text\":\"Who is this that cometh from Edom, with dyed garments from Bosra, this beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save.\"},{\"verse\":2,\"text\":\"Why then is thy apparel red, and thy garments like theirs that tread in the winepress?\"},{\"verse\":3,\"text\":\"I have trodden the winepress alone, and of the Gentiles there is not a man with me: I have trampled on them in my indignation, and have trodden them down in my wrath, and their blood is sprinkled upon my garments, and I have stained all my apparel.\"},{\"verse\":4,\"text\":\"For the day of vengeance is in my heart, the year of my redemption is come.\"},{\"verse\":5,\"text\":\"I looked about, and there was none to help: I sought, and there was none to give aid: and my own arm hath saved for me, and my indignation itself hath helped me.\"},{\"verse\":6,\"text\":\"And I have trodden down the people in my wrath, and have made them drunk in my indignation, and have brought down their strength to the earth.\"},{\"verse\":7,\"text\":\"I will remember the tender mercies of the Lord, the praise of the Lord for all the things that the Lord hath bestowed upon us, and for the multitude of his good things to the house of Israel, which he hath given them according to his kindness, and according to the multitude of his mercies.\"},{\"verse\":8,\"text\":\"And he said: Surely they are my people, children that will not deny: so he became their saviour.\"},{\"verse\":9,\"text\":\"In all their affliction he was not troubled, and the angel of his presence saved them: in his love, and in his mercy he redeemed them, and he carried them and lifted them up all the days of old.\"},{\"verse\":10,\"text\":\"But they provoked to wrath, and afflicted the spirit of his Holy One: and he was turned to be their enemy, and he fought against them.\"},{\"verse\":11,\"text\":\"And he remembered the days of old of Moses, and of his people: Where is he that brought them up out of the sea, with the shepherds of his flock? where is he that put in the midst of them the spirit of his Holy One?\"},{\"verse\":12,\"text\":\"He that brought out Moses by the right hand, by the arm of his majesty: that divided the waters before them, to make himself an everlasting name.\"},{\"verse\":13,\"text\":\"He that led them out through the deep, as a horse in the wilderness that stumbleth not.\"},{\"verse\":14,\"text\":\"As a beast that goeth down in the field, the spirit of the Lord was their leader: so didst thou lead thy people to make thyself a glorious name.\"},{\"verse\":15,\"text\":\"Look down from heaven, and behold from thy holy habitation and the place of thy glory: where is thy zeal, and thy strength, the multitude of thy bowels, and of thy mercies? they have held back themselves from me.\"},{\"verse\":16,\"text\":\"For thou art our father, and Abraham hath not known us, and Israel hath been ignorant of us: thou, O Lord, art our father, our redeemer, from everlasting is thy name.\"},{\"verse\":17,\"text\":\"Why hast thou made us to err, O Lord, from thy ways: why hast thou hardened our heart, that we should not fear thee? return for the sake of thy servants, the tribes of thy inheritance.\"},{\"verse\":18,\"text\":\"They have possessed thy holy people as nothing: our enemies have trodden down thy sanctuary.\"},{\"verse\":19,\"text\":\"We are become as in the beginning, when thou didst not rule over us, and when we were not called by thy name.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quis est iste, qui venit de Edom, tinctis vestibus de Bosra ? iste formosus in stola sua, gradiens in multitudine fortitudinis suæ ? Ego qui loquor justitiam, et propugnator sum ad salvandum.\"},{\"verse\":2,\"text\":\"Quare ergo rubrum est indumentum tuum, et vestimenta tua sicut calcantium in torculari ?\"},{\"verse\":3,\"text\":\"Torcular calcavi solus, et de gentibus non est vir mecum ; calcavi eos in furore meo, et conculcavi eos in ira mea : et aspersus est sanguis eorum super vestimenta mea, et omnia indumenta mea inquinavi.\"},{\"verse\":4,\"text\":\"Dies enim ultionis in corde meo ; annus redemptionis meæ venit.\"},{\"verse\":5,\"text\":\"Circumspexi, et non erat auxiliator ; quæsivi, et non fuit qui adjuvaret : et salvavit mihi brachium meum, et indignatio mea ipsa auxiliata est mihi.\"},{\"verse\":6,\"text\":\"Et conculcavi populos in furore meo, et inebriavi eos in indignatione mea, et detraxi in terram virtutem eorum.\"},{\"verse\":7,\"text\":\"Miserationum Domini recordabor ; laudem Domini super omnibus quæ reddidit nobis Dominus, et super multitudinem bonorum domui Israël, quæ largitus est eis secundum indulgentiam suam, et secundum multitudinem misericordiarum suarum.\"},{\"verse\":8,\"text\":\"Et dixit : Verumtamen populus meus est, filii non negantes ; et factus est eis salvator.\"},{\"verse\":9,\"text\":\"In omni tribulatione eorum non est tribulatus, et angelus faciei ejus salvavit eos : in dilectione sua et in indulgentia sua ipse redemit eos, et portavit eos, et elevavit eos cunctis diebus sæculi.\"},{\"verse\":10,\"text\":\"Ipsi autem ad iracundiam provocaverunt, et afflixerunt spiritum Sancti ejus : et conversus est eis in inimicum, et ipse debellavit eos.\"},{\"verse\":11,\"text\":\"Et recordatus est dierum sæculi Moysi, et populi sui. Ubi est qui eduxit eos de mari cum pastoribus gregis sui ? Ubi est qui posuit in medio ejus spiritum Sancti sui ;\"},{\"verse\":12,\"text\":\"qui eduxit ad dexteram Moysen, brachio majestatis suæ ; qui scidit aquas ante eos, ut faceret sibi nomen sempiternum ;\"},{\"verse\":13,\"text\":\"qui eduxit eos per abyssos, quasi equum in deserto non impingentem ?\"},{\"verse\":14,\"text\":\"Quasi animal in campo descendens, spiritus Domini ductor ejus fuit. Sic adduxisti populum tuum, ut faceres tibi nomen gloriæ.\"},{\"verse\":15,\"text\":\"Attende de cælo, et vide de habitaculo sancto tuo, et gloriæ tuæ. Ubi est zelus tuus, et fortitudo tua, multitudo viscerum tuorum et miserationum tuarum ? Super me continuerunt se.\"},{\"verse\":16,\"text\":\"Tu enim pater noster : et Abraham nescivit nos, et Israël ignoravit nos : tu, Domine, pater noster, redemptor noster, a sæculo nomen tuum.\"},{\"verse\":17,\"text\":\"Quare errare nos fecisti, Domine, de viis tuis ; indurasti cor nostrum ne timeremus te ? Convertere propter servos tuos, tribus hæreditatis tuæ.\"},{\"verse\":18,\"text\":\"Quasi nihilum possederunt populum sanctum tuum : hostes nostri conculcaverunt sanctificationem tuam.\"},{\"verse\":19,\"text\":\"Facti sumus quasi in principio, cum non dominareris nostri, neque invocaretur nomen tuum super nos.\"}],\"summary\":\"Christ’s victory over his enemies: his mercies to his people: their complaint.\",\"intro\":null,\"prev\":{\"usfm\":\"ISA\",\"chapter\":62,\"label\":\"Isaiah 62\"},\"next\":{\"usfm\":\"ISA\",\"chapter\":64,\"label\":\"Isaiah 64\"}}]]\n"])</script></body></html>
