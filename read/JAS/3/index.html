 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">James<!-- --> <span class="text-stone-500">3</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of the evils of the tongue. Of the difference between the earthly and heavenly wisdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Be ye not many masters, my brethren, knowing that you receive the greater judgment.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For in many things we all offend. If any man offend not in word, the same is a perfect man. He is able also with a bridle to lead about the whole body.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For if we put bits into the mouths of horses, that they may obey us: and we turn about their whole body.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Behold also ships, whereas they are great and are driven by strong winds, yet are they turned about with a small helm, whithersoever the force of the governor willeth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Even so the tongue is indeed a little member and boasteth great things. Behold how small a fire kindleth a great wood.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the tongue is a fire, a world of iniquity. The tongue is placed among our members, which defileth the whole body and inflameth the wheel of our nativity, being set on fire by hell.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For every nature of beasts and of birds and of serpents and of the rest is tamed and hath been tamed, by the nature of man.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the tongue no man can tame, an unquiet evil, full of deadly poison.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>By it we bless God and the Father: and by it we curse men who are made after the likeness of God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Doth a fountain send forth, out of the same hole, sweet and bitter water?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Can the fig tree, my brethren, bear grapes? Or the vine, figs? So neither can the salt water yield sweet.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who is a wise man and endued with knowledge, among you? Let him shew, by a good conversation, his work in the meekness of wisdom.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But if you have bitter zeal, and there be contentions in your hearts: glory not and be not liars against the truth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For this is not wisdom, descending from above: but earthly, sensual, devilish.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For where envying and contention is: there is inconstancy and every evil work.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But the wisdom that is from above, first indeed is chaste, then peaceable, modest, easy to be persuaded, consenting to the good, full of mercy and good fruits, without judging, without dissimulation.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the fruit of justice is sown in peace, to them that make peace.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nolite plures magistri fieri fratres mei, scientes quoniam majus judicium sumitis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In multis enim offendimus omnes. Si quis in verbo non offendit, hic perfectus est vir : potest etiam freno circumducere totum corpus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Si autem equis frena in ora mittimus ad consentiendum nobis, et omne corpus illorum circumferimus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ecce et naves, cum magnæ sint, et a ventis validis minentur, circumferuntur a modico gubernaculo ubi impetus dirigentis voluerit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ita et lingua modicum quidem membrum est, et magna exaltat. Ecce quantus ignis quam magnam silvam incendit !</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et lingua ignis est, universitas iniquitatis. Lingua constituitur in membris nostris, quæ maculat totum corpus, et inflammat rotam nativitatis nostræ inflammata a gehenna.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Omnis enim natura bestiarum, et volucrum, et serpentium, et ceterorum domantur, et domita sunt a natura humana :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>linguam autem nullus hominum domare potest : inquietum malum, plena veneno mortifero.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In ipsa benedicimus Deum et Patrem : et in ipsa maledicimus homines, qui ad similitudinem Dei facti sunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ex ipso ore procedit benedictio et maledictio. Non oportet, fratres mei, hæc ita fieri.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Numquid fons de eodem foramine emanat dulcem et amaram aquam ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Numquid potest, fratres mei, ficus uvas facere, aut vitis ficus ? Sic neque salsa dulcem potest facere aquam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quis sapiens et disciplinatus inter vos ? Ostendat ex bona conversatione operationem suam in mansuetudine sapientiæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quod si zelum amarum habetis, et contentiones sint in cordibus vestris : nolite gloriari, et mendaces esse adversus veritatem :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>non est enim ista sapientia desursum descendens : sed terrena, animalis, diabolica.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ubi enim zelus et contentio, ibi inconstantia et omne opus pravum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quæ autem desursum est sapientia, primum quidem pudica est, deinde pacifica, modesta, suadibilis, bonus consentiens, plena misericordia et fructibus bonis, non judicans, sine simulatione.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Fructus autem justitiæ, in pace seminatur, facientibus pacem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JAS/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">James 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-stud ongue is a fire, a world of iniquity. The tongue is placed among our members, which defileth the whole body and inflameth the wheel of our nativity, being set on fire by hell.\"},{\"verse\":7,\"text\":\"For every nature of beasts and of birds and of serpents and of the rest is tamed and hath been tamed, by the nature of man.\"},{\"verse\":8,\"text\":\"But the tongue no man can tame, an unquiet evil, full of deadly poison.\"},{\"verse\":9,\"text\":\"By it we bless God and the Father: and by it we curse men who are made after the likeness of God.\"},{\"verse\":10,\"text\":\"Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.\"},{\"verse\":11,\"text\":\"Doth a fountain send forth, out of the same hole, sweet and bitter water?\"},{\"verse\":12,\"text\":\"Can the fig tree, my brethren, bear grapes? Or the vine, figs? So neither can the salt water yield sweet.\"},{\"verse\":13,\"text\":\"Who is a wise man and endued with knowledge, among you? Let him shew, by a good conversation, his work in the meekness of wisdom.\"},{\"verse\":14,\"text\":\"But if you have bitter zeal, and there be contentions in your hearts: glory not and be not liars against the truth.\"},{\"verse\":15,\"text\":\"For this is not wisdom, descending from above: but earthly, sensual, devilish.\"},{\"verse\":16,\"text\":\"For where envying and contention is: there is inconstancy and every evil work.\"},{\"verse\":17,\"text\":\"But the wisdom that is from above, first indeed is chaste, then peaceable, modest, easy to be persuaded, consenting to the good, full of mercy and good fruits, without judging, without dissimulation.\"},{\"verse\":18,\"text\":\"And the fruit of justice is sown in peace, to them that make peace.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nolite plures magistri fieri fratres mei, scientes quoniam majus judicium sumitis.\"},{\"verse\":2,\"text\":\"In multis enim offendimus omnes. Si quis in verbo non offendit, hic perfectus est vir : potest etiam freno circumducere totum corpus.\"},{\"verse\":3,\"text\":\"Si autem equis frena in ora mittimus ad consentiendum nobis, et omne corpus illorum circumferimus.\"},{\"verse\":4,\"text\":\"Ecce et naves, cum magnæ sint, et a ventis validis minentur, circumferuntur a modico gubernaculo ubi impetus dirigentis voluerit.\"},{\"verse\":5,\"text\":\"Ita et lingua modicum quidem membrum est, et magna exaltat. Ecce quantus ignis quam magnam silvam incendit !\"},{\"verse\":6,\"text\":\"Et lingua ignis est, universitas iniquitatis. Lingua constituitur in membris nostris, quæ maculat totum corpus, et inflammat rotam nativitatis nostræ inflammata a gehenna.\"},{\"verse\":7,\"text\":\"Omnis enim natura bestiarum, et volucrum, et serpentium, et ceterorum domantur, et domita sunt a natura humana :\"},{\"verse\":8,\"text\":\"linguam autem nullus hominum domare potest : inquietum malum, plena veneno mortifero.\"},{\"verse\":9,\"text\":\"In ipsa benedicimus Deum et Patrem : et in ipsa maledicimus homines, qui ad similitudinem Dei facti sunt.\"},{\"verse\":10,\"text\":\"Ex ipso ore procedit benedictio et maledictio. Non oportet, fratres mei, hæc ita fieri.\"},{\"verse\":11,\"text\":\"Numquid fons de eodem foramine emanat dulcem et amaram aquam ?\"},{\"verse\":12,\"text\":\"Numquid potest, fratres mei, ficus uvas facere, aut vitis ficus ? Sic neque salsa dulcem potest facere aquam.\"},{\"verse\":13,\"text\":\"Quis sapiens et disciplinatus inter vos ? Ostendat ex bona conversatione operationem suam in mansuetudine sapientiæ.\"},{\"verse\":14,\"text\":\"Quod si zelum amarum habetis, et contentiones sint in cordibus vestris : nolite gloriari, et mendaces esse adversus veritatem :\"},{\"verse\":15,\"text\":\"non est enim ista sapientia desursum descendens : sed terrena, animalis, diabolica.\"},{\"verse\":16,\"text\":\"Ubi enim zelus et contentio, ibi inconstantia et omne opus pravum.\"},{\"verse\":17,\"text\":\"Quæ autem desursum est sapientia, primum quidem pudica est, deinde pacifica, modesta, suadibilis, bonus consentiens, plena misericordia et fructibus bonis, non judicans, sine simulatione.\"},{\"verse\":18,\"text\":\"Fructus autem justitiæ, in pace seminatur, facientibus pacem.\"}],\"summary\":\"Of the evils of the tongue. Of the difference between the earthly and heavenly wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"JAS\",\"chapter\":2,\"label\":\"James 2\"},\"next\":{\"usfm\":\"JAS\",\"chapter\":4,\"label\":\"James 4\"}}]]\n"])</script></body></html>
