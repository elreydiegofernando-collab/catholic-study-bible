tton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a psalm for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>O God, be not thou silent in my praise: for the mouth of the wicked and the mouth of the deceitful man is opened against me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They have spoken against me with deceitful tongues; and they have compassed me about with words of hatred; and have fought against me without cause.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Instead of making me a return of love, they detracted me: but I gave myself to prayer.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they repaid me evil for good: and hatred for my love.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Set thou the sinner over him: and may the devil stand at his right hand.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>When he is judged, may he go out condemned; and may his prayer be turned to sin.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>May his days be few: and his bishopric let another take.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>May his children be fatherless, and his wife a widow.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Let his children be carried about vagabonds, and beg; and let them be cast out of their dwellings.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>May the usurer search all his substance: and let strangers plunder his labours.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>May there be none to help him: nor none to pity his fatherless offspring.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>May his posterity be cut off; in one generation may his name be blotted out.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>May the iniquity of his fathers be remembered in the sight of the Lord: and let not the sin of his mother be blotted out.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>May they be before the Lord continually, and let the memory of them perish from the earth:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>because he remembered not to shew mercy,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But persecuted the poor man and the beggar; and the broken in heart, to put him to death.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he loved cursing, and it shall come unto him: and he would not have blessing, and it shall be far from him. And he put on cursing, like a garment: and it went in like water into his entrails, and like oil in his bones.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>May it be unto him like a garment which covereth him; and like a girdle with which he is girded continually.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>This is the work of them who detract me before the Lord; and who speak evils against my soul.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But thou, O Lord, do with me for thy name’s sake: because thy mercy is sweet. Do thou deliver me,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For I am poor and needy, and my heart is troubled within me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I am taken away like the shadow when it declineth: and I am shaken off as locusts.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>My knees are weakened through fasting: and my flesh is changed for oil.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And I am become a reproach to them: they saw me and they shaked their heads.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Help me, O Lord my God; save me; according to thy mercy.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And let them know that this is thy hand: and that thou, O Lord, hast done it.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They will curse and thou wilt bless: let them that rise up against me be confounded: but thy servant shall rejoice.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Let them that detract me be clothed with shame: and let them be covered with their confusion as with a double cloak.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I will give great thanks to the Lord with my mouth: and in the midst of many I will praise him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Because he hath stood at the right hand of the poor, to save my soul from persecutors.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deus, laudem meam ne tacueris, quia os peccatoris et os dolosi super me apertum est.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Locuti sunt adversum me lingua dolosa, et sermonibus odii circumdederunt me : et expugnaverunt me gratis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Pro eo ut me diligerent, detrahebant mihi ; ego autem orabam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et posuerunt adversum me mala pro bonis, et odium pro dilectione mea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Constitue super eum peccatorem, et diabolus stet a dextris ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cum judicatur, exeat condemnatus ; et oratio ejus fiat in peccatum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Fiant dies ejus pauci, et episcopatum ejus accipiat alter.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Fiant filii ejus orphani, et uxor ejus vidua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nutantes transferantur filii ejus et mendicent, et ejiciantur de habitationibus suis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Scrutetur fœnerator omnem substantiam ejus, et diripiant alieni labores ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non sit illi adjutor, nec sit qui misereatur pupillis ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Fiant nati ejus in interitum ; in generatione una deleatur nomen ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In memoriam redeat iniquitas patrum ejus in conspectu Domini, et peccatum matris ejus non deleatur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fiant contra Dominum semper, et dispereat de terra memoria eorum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>pro eo quod non est recordatus facere misericordiam,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et persecutus est hominem inopem et mendicum, et compunctum corde, mortificare.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et dilexit maledictionem, et veniet ei ; et noluit benedictionem, et elongabitur ab eo. Et induit maledictionem sicut vestimentum ; et intravit sicut aqua in interiora ejus, et sicut oleum in ossibus ejus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fiat ei sicut vestimentum quo operitur, et sicut zona qua semper præcingitur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hoc opus eorum qui detrahunt mihi apud Dominum, et qui loquuntur mala adversus animam meam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et tu, Domine, Domine, fac mecum propter nomen tuum, quia suavis est misericordia tua.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Libera me, quia egenus et pauper ego sum, et cor meum conturbatum est intra me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sicut umbra cum declinat ablatus sum, et excussus sum sicut locustæ.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Genua mea infirmata sunt a jejunio, et caro mea immutata est propter oleum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ego factus sum opprobrium illis ; viderunt me, et moverunt capita sua.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Adjuva me, Domine Deus meus ; salvum me fac secundum misericordiam tuam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et sciant quia manus tua hæc, et tu, Domine, fecisti eam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Maledicent illi, et tu benedices : qui insurgunt in me confundantur ; servus autem tuus lætabitur.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Induantur qui detrahunt mihi pudore, et operiantur sicut diploide confusione sua.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Confitebor Domino nimis in ore meo, et in medio multorum laudabo eum :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>quia astitit a dextris pauperis, ut salvam faceret a persequentibus animam meam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/107/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 107</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/109/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class is right hand.\"},{\"verse\":7,\"text\":\"When he is judged, may he go out condemned; and may his prayer be turned to sin.\"},{\"verse\":8,\"text\":\"May his days be few: and his bishopric let another take.\"},{\"verse\":9,\"text\":\"May his children be fatherless, and his wife a widow.\"},{\"verse\":10,\"text\":\"Let his children be carried about vagabonds, and beg; and let them be cast out of their dwellings.\"},{\"verse\":11,\"text\":\"May the usurer search all his substance: and let strangers plunder his labours.\"},{\"verse\":12,\"text\":\"May there be none to help him: nor none to pity his fatherless offspring.\"},{\"verse\":13,\"text\":\"May his posterity be cut off; in one generation may his name be blotted out.\"},{\"verse\":14,\"text\":\"May the iniquity of his fathers be remembered in the sight of the Lord: and let not the sin of his mother be blotted out.\"},{\"verse\":15,\"text\":\"May they be before the Lord continually, and let the memory of them perish from the earth:\"},{\"verse\":16,\"text\":\"because he remembered not to shew mercy,\"},{\"verse\":17,\"text\":\"But persecuted the poor man and the beggar; and the broken in heart, to put him to death.\"},{\"verse\":18,\"text\":\"And he loved cursing, and it shall come unto him: and he would not have blessing, and it shall be far from him. And he put on cursing, like a garment: and it went in like water into his entrails, and like oil in his bones.\"},{\"verse\":19,\"text\":\"May it be unto him like a garment which covereth him; and like a girdle with which he is girded continually.\"},{\"verse\":20,\"text\":\"This is the work of them who detract me before the Lord; and who speak evils against my soul.\"},{\"verse\":21,\"text\":\"But thou, O Lord, do with me for thy name’s sake: because thy mercy is sweet. Do thou deliver me,\"},{\"verse\":22,\"text\":\"For I am poor and needy, and my heart is troubled within me.\"},{\"verse\":23,\"text\":\"I am taken away like the shadow when it declineth: and I am shaken off as locusts.\"},{\"verse\":24,\"text\":\"My knees are weakened through fasting: and my flesh is changed for oil.\"},{\"verse\":25,\"text\":\"And I am become a reproach to them: they saw me and they shaked their heads.\"},{\"verse\":26,\"text\":\"Help me, O Lord my God; save me; according to thy mercy.\"},{\"verse\":27,\"text\":\"And let them know that this is thy hand: and that thou, O Lord, hast done it.\"},{\"verse\":28,\"text\":\"They will curse and thou wilt bless: let them that rise up against me be confounded: but thy servant shall rejoice.\"},{\"verse\":29,\"text\":\"Let them that detract me be clothed with shame: and let them be covered with their confusion as with a double cloak.\"},{\"verse\":30,\"text\":\"I will give great thanks to the Lord with my mouth: and in the midst of many I will praise him.\"},{\"verse\":31,\"text\":\"Because he hath stood at the right hand of the poor, to save my soul from persecutors.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus David.\"},{\"verse\":2,\"text\":\"Deus, laudem meam ne tacueris, quia os peccatoris et os dolosi super me apertum est.\"},{\"verse\":3,\"text\":\"Locuti sunt adversum me lingua dolosa, et sermonibus odii circumdederunt me : et expugnaverunt me gratis.\"},{\"verse\":4,\"text\":\"Pro eo ut me diligerent, detrahebant mihi ; ego autem orabam.\"},{\"verse\":5,\"text\":\"Et posuerunt adversum me mala pro bonis, et odium pro dilectione mea.\"},{\"verse\":6,\"text\":\"Constitue super eum peccatorem, et diabolus stet a dextris ejus.\"},{\"verse\":7,\"text\":\"Cum judicatur, exeat condemnatus ; et oratio ejus fiat in peccatum.\"},{\"verse\":8,\"text\":\"Fiant dies ejus pauci, et episcopatum ejus accipiat alter.\"},{\"verse\":9,\"text\":\"Fiant filii ejus orphani, et uxor ejus vidua.\"},{\"verse\":10,\"text\":\"Nutantes transferantur filii ejus et mendicent, et ejiciantur de habitationibus suis.\"},{\"verse\":11,\"text\":\"Scrutetur fœnerator omnem substantiam ejus, et diripiant alieni labores ejus.\"},{\"verse\":12,\"text\":\"Non sit illi adjutor, nec sit qui misereatur pupillis ejus.\"},{\"verse\":13,\"text\":\"Fiant nati ejus in interitum ; in generatione una deleatur nomen ejus.\"},{\"verse\":14,\"text\":\"In memoriam redeat iniquitas patrum ejus in conspectu Domini, et peccatum matris ejus non deleatur.\"},{\"verse\":15,\"text\":\"Fiant contra Dominum semper, et dispereat de terra memoria eorum :\"},{\"verse\":16,\"text\":\"pro eo quod non est recordatus facere misericordiam,\"},{\"verse\":17,\"text\":\"et persecutus est hominem inopem et mendicum, et compunctum corde, mortificare.\"},{\"verse\":18,\"text\":\"Et dilexit maledictionem, et veniet ei ; et noluit benedictionem, et elongabitur ab eo. Et induit maledictionem sicut vestimentum ; et intravit sicut aqua in interiora ejus, et sicut oleum in ossibus ejus.\"},{\"verse\":19,\"text\":\"Fiat ei sicut vestimentum quo operitur, et sicut zona qua semper præcingitur.\"},{\"verse\":20,\"text\":\"Hoc opus eorum qui detrahunt mihi apud Dominum, et qui loquuntur mala adversus animam meam.\"},{\"verse\":21,\"text\":\"Et tu, Domine, Domine, fac mecum propter nomen tuum, quia suavis est misericordia tua.\"},{\"verse\":22,\"text\":\"Libera me, quia egenus et pauper ego sum, et cor meum conturbatum est intra me.\"},{\"verse\":23,\"text\":\"Sicut umbra cum declinat ablatus sum, et excussus sum sicut locustæ.\"},{\"verse\":24,\"text\":\"Genua mea infirmata sunt a jejunio, et caro mea immutata est propter oleum.\"},{\"verse\":25,\"text\":\"Et ego factus sum opprobrium illis ; viderunt me, et moverunt capita sua.\"},{\"verse\":26,\"text\":\"Adjuva me, Domine Deus meus ; salvum me fac secundum misericordiam tuam.\"},{\"verse\":27,\"text\":\"Et sciant quia manus tua hæc, et tu, Domine, fecisti eam.\"},{\"verse\":28,\"text\":\"Maledicent illi, et tu benedices : qui insurgunt in me confundantur ; servus autem tuus lætabitur.\"},{\"verse\":29,\"text\":\"Induantur qui detrahunt mihi pudore, et operiantur sicut diploide confusione sua.\"},{\"verse\":30,\"text\":\"Confitebor Domino nimis in ore meo, et in medio multorum laudabo eum :\"},{\"verse\":31,\"text\":\"quia astitit a dextris pauperis, ut salvam faceret a persequentibus animam meam.\"}],\"summary\":\"Deus, laudem meam.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":107,\"label\":\"Psalms 107\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":109,\"label\":\"Psalms 109\"}}]]\n"])</script></body></html>
