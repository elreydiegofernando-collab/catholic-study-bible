ton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a psalm of David. Lord, thou hast proved me, and known me:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thou hast known my sitting down, and my rising up.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou hast understood my thoughts afar off: my path and my line thou hast searched out.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou hast foreseen all my ways: for there is no speech in my tongue.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Behold, O Lord, thou hast known all things, the last and those of old: thou hast formed me, and hast laid thy hand upon me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thy knowledge is become wonderful to me: it is high, and I cannot reach to it.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Whither shall I go from thy spirit? or whither shall I flee from thy face?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If I ascend into heaven, thou art there: if I descend into hell, thou art present.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If I take my wings early in the morning, and dwell in the uttermost parts of the sea:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Even there also shall thy hand lead me: and thy right hand shall hold me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I said: Perhaps darkness shall cover me: and night shall be my light in my pleasures.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But darkness shall not be dark to thee, and night shall be light all the day: the darkness thereof, and the light thereof are alike to thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For thou hast possessed my reins: thou hast protected me from my mother’s womb.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My bone is not hidden from thee, which thou hast made in secret: and my substance in the lower parts of the earth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thy eyes did see my imperfect being, and in thy book all shall be written: days shall be formed, and no one in them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But to me thy friends, O God, are made exceedingly honourable: their principality is exceedingly strengthened.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will number them, and they shall be multiplied above the sand, I rose up and am still with thee.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If thou wilt kill the wicked, O God: ye men of blood, depart from me:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Because you say in thought: They shall receive thy cities in vain.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Have I not hated them, O Lord, that hated thee: and pined away because of thy enemies?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>I have hated them with a perfect hatred: and they are become enemies to me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Prove me, O God, and know my heart: examine me, and know my paths.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And see if there be in me the way of iniquity: and lead me in the eternal way.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, psalmus David. Domine, probasti me, et cognovisti me ;</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>tu cognovisti sessionem meam et resurrectionem meam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Intellexisti cogitationes meas de longe ; semitam meam et funiculum meum investigasti :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et omnes vias meas prævidisti, quia non est sermo in lingua mea.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ecce, Domine, tu cognovisti omnia, novissima et antiqua. Tu formasti me, et posuisti super me manum tuam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Mirabilis facta est scientia tua ex me ; confortata est, et non potero ad eam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quo ibo a spiritu tuo ? et quo a facie tua fugiam ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si ascendero in cælum, tu illic es ; si descendero in infernum, ades.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si sumpsero pennas meas diluculo, et habitavero in extremis maris,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>etenim illuc manus tua deducet me, et tenebit me dextera tua.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et dixi : Forsitan tenebræ conculcabunt me ; et nox illuminatio mea in deliciis meis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quia tenebræ non obscurabuntur a te, et nox sicut dies illuminabitur : sicut tenebræ ejus, ita et lumen ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quia tu possedisti renes meos ; suscepisti me de utero matris meæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Confitebor tibi, quia terribiliter magnificatus es ; mirabilia opera tua, et anima mea cognoscit nimis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non est occultatum os meum a te, quod fecisti in occulto ; et substantia mea in inferioribus terræ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Imperfectum meum viderunt oculi tui, et in libro tuo omnes scribentur. Dies formabuntur, et nemo in eis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Mihi autem nimis honorificati sunt amici tui, Deus ; nimis confortatus est principatus eorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dinumerabo eos, et super arenam multiplicabuntur. Exsurrexi, et adhuc sum tecum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Si occideris, Deus, peccatores, viri sanguinum, declinate a me :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quia dicitis in cogitatione : Accipient in vanitate civitates tuas.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nonne qui oderunt te, Domine, oderam, et super inimicos tuos tabescebam ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Perfecto odio oderam illos, et inimici facti sunt mihi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Proba me, Deus, et scito cor meum ; interroga me, et cognosce semitas meas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et vide si via iniquitatis in me est, et deduc me in via æterna.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/137/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 137</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/139/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 139</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->138<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t bo  pleasures.\"},{\"verse\":12,\"text\":\"But darkness shall not be dark to thee, and night shall be light all the day: the darkness thereof, and the light thereof are alike to thee.\"},{\"verse\":13,\"text\":\"For thou hast possessed my reins: thou hast protected me from my mother’s womb.\"},{\"verse\":14,\"text\":\"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.\"},{\"verse\":15,\"text\":\"My bone is not hidden from thee, which thou hast made in secret: and my substance in the lower parts of the earth.\"},{\"verse\":16,\"text\":\"Thy eyes did see my imperfect being, and in thy book all shall be written: days shall be formed, and no one in them.\"},{\"verse\":17,\"text\":\"But to me thy friends, O God, are made exceedingly honourable: their principality is exceedingly strengthened.\"},{\"verse\":18,\"text\":\"I will number them, and they shall be multiplied above the sand, I rose up and am still with thee.\"},{\"verse\":19,\"text\":\"If thou wilt kill the wicked, O God: ye men of blood, depart from me:\"},{\"verse\":20,\"text\":\"Because you say in thought: They shall receive thy cities in vain.\"},{\"verse\":21,\"text\":\"Have I not hated them, O Lord, that hated thee: and pined away because of thy enemies?\"},{\"verse\":22,\"text\":\"I have hated them with a perfect hatred: and they are become enemies to me.\"},{\"verse\":23,\"text\":\"Prove me, O God, and know my heart: examine me, and know my paths.\"},{\"verse\":24,\"text\":\"And see if there be in me the way of iniquity: and lead me in the eternal way.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, psalmus David. Domine, probasti me, et cognovisti me ;\"},{\"verse\":2,\"text\":\"tu cognovisti sessionem meam et resurrectionem meam.\"},{\"verse\":3,\"text\":\"Intellexisti cogitationes meas de longe ; semitam meam et funiculum meum investigasti :\"},{\"verse\":4,\"text\":\"et omnes vias meas prævidisti, quia non est sermo in lingua mea.\"},{\"verse\":5,\"text\":\"Ecce, Domine, tu cognovisti omnia, novissima et antiqua. Tu formasti me, et posuisti super me manum tuam.\"},{\"verse\":6,\"text\":\"Mirabilis facta est scientia tua ex me ; confortata est, et non potero ad eam.\"},{\"verse\":7,\"text\":\"Quo ibo a spiritu tuo ? et quo a facie tua fugiam ?\"},{\"verse\":8,\"text\":\"Si ascendero in cælum, tu illic es ; si descendero in infernum, ades.\"},{\"verse\":9,\"text\":\"Si sumpsero pennas meas diluculo, et habitavero in extremis maris,\"},{\"verse\":10,\"text\":\"etenim illuc manus tua deducet me, et tenebit me dextera tua.\"},{\"verse\":11,\"text\":\"Et dixi : Forsitan tenebræ conculcabunt me ; et nox illuminatio mea in deliciis meis.\"},{\"verse\":12,\"text\":\"Quia tenebræ non obscurabuntur a te, et nox sicut dies illuminabitur : sicut tenebræ ejus, ita et lumen ejus.\"},{\"verse\":13,\"text\":\"Quia tu possedisti renes meos ; suscepisti me de utero matris meæ.\"},{\"verse\":14,\"text\":\"Confitebor tibi, quia terribiliter magnificatus es ; mirabilia opera tua, et anima mea cognoscit nimis.\"},{\"verse\":15,\"text\":\"Non est occultatum os meum a te, quod fecisti in occulto ; et substantia mea in inferioribus terræ.\"},{\"verse\":16,\"text\":\"Imperfectum meum viderunt oculi tui, et in libro tuo omnes scribentur. Dies formabuntur, et nemo in eis.\"},{\"verse\":17,\"text\":\"Mihi autem nimis honorificati sunt amici tui, Deus ; nimis confortatus est principatus eorum.\"},{\"verse\":18,\"text\":\"Dinumerabo eos, et super arenam multiplicabuntur. Exsurrexi, et adhuc sum tecum.\"},{\"verse\":19,\"text\":\"Si occideris, Deus, peccatores, viri sanguinum, declinate a me :\"},{\"verse\":20,\"text\":\"quia dicitis in cogitatione : Accipient in vanitate civitates tuas.\"},{\"verse\":21,\"text\":\"Nonne qui oderunt te, Domine, oderam, et super inimicos tuos tabescebam ?\"},{\"verse\":22,\"text\":\"Perfecto odio oderam illos, et inimici facti sunt mihi.\"},{\"verse\":23,\"text\":\"Proba me, Deus, et scito cor meum ; interroga me, et cognosce semitas meas.\"},{\"verse\":24,\"text\":\"Et vide si via iniquitatis in me est, et deduc me in via æterna.\"}],\"summary\":\"Domine, probasti.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":137,\"label\":\"Psalms 137\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":139,\"label\":\"Psalms 139\"}}]]\n"])</script></body></html>
