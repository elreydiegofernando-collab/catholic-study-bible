utton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A psalm for David, for a remembrance of the sabbath.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Rebuke me not, O Lord, in thy indignation; nor chastise me in thy wrath.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For thy arrows are fastened in me: and thy hand hath been strong upon me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>There is no health in my flesh, because of thy wrath: there is no peace for my bones, because of my sins.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For my iniquities are gone over my head: and as a heavy burden are become heavy upon me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>My sores are putrified and corrupted, because of my foolishness.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I am become miserable, and am bowed down even to the end: I walked sorrowful all the day long.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For my loins are filled with illusions; and there is no health in my flesh.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I am afflicted and humbled exceedingly: I roared with the groaning of my heart.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lord, all my desire is before thee, and my groaning is not hidden from thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My heart is troubled, my strength hath left me, and the light of my eyes itself is not with me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>My friends and my neighbours have drawn near, and stood against me. And they that were near me stood afar off:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they that sought my soul used violence. And they that sought evils to me spoke vain things, and studied deceits all the day long.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I, as a deaf man, heard not: and as a dumb man not opening his mouth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I became as a man that heareth not: and that hath no reproofs in his mouth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For in thee, O Lord, have I hoped: thou wilt hear me, O Lord my God.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For I said: Lest at any time my enemies rejoice over me: and whilst my feet are moved, they speak great things against me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For I am ready for scourges: and my sorrow is continually before me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For I will declare my iniquity: and I will think for my sin.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But my enemies live, and are stronger than I: and they that hate me wrongfully are multiplied.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>They that render evil for good, have detracted me, because I followed goodness.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For sake me not, O Lord my God: do not thou depart from me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Attend unto my help, O Lord, the God of my salvation.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David, in rememorationem de sabbato.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine, ne in furore tuo arguas me, neque in ira tua corripias me :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>quoniam sagittæ tuæ infixæ sunt mihi, et confirmasti super me manum tuam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non est sanitas in carne mea, a facie iræ tuæ ; non est pax ossibus meis, a facie peccatorum meorum :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quoniam iniquitates meæ supergressæ sunt caput meum, et sicut onus grave gravatæ sunt super me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Putruerunt et corruptæ sunt cicatrices meæ, a facie insipientiæ meæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Miser factus sum et curvatus sum usque in finem ; tota die contristatus ingrediebar.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quoniam lumbi mei impleti sunt illusionibus, et non est sanitas in carne mea.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Afflictus sum, et humiliatus sum nimis ; rugiebam a gemitu cordis mei.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Domine, ante te omne desiderium meum, et gemitus meus a te non est absconditus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cor meum conturbatum est ; dereliquit me virtus mea, et lumen oculorum meorum, et ipsum non est mecum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Amici mei et proximi mei adversum me appropinquaverunt, et steterunt ; et qui juxta me erant, de longe steterunt : et vim faciebant qui quærebant animam meam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et qui inquirebant mala mihi, locuti sunt vanitates, et dolos tota die meditabantur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego autem, tamquam surdus, non audiebam ; et sicut mutus non aperiens os suum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et factus sum sicut homo non audiens, et non habens in ore suo redargutiones.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quoniam in te, Domine, speravi ; tu exaudies me, Domine Deus meus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quia dixi : Nequando supergaudeant mihi inimici mei ; et dum commoventur pedes mei, super me magna locuti sunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quoniam ego in flagella paratus sum, et dolor meus in conspectu meo semper.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quoniam iniquitatem meam annuntiabo, et cogitabo pro peccato meo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Inimici autem mei vivunt, et confirmati sunt super me : et multiplicati sunt qui oderunt me inique.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui retribuunt mala pro bonis detrahebant mihi, quoniam sequebar bonitatem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ne derelinquas me, Domine Deus meus ; ne discesseris a me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Intende in adjutorium meum, Domine Deus salutis meæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/36/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 36</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/38/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 38</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->37<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Psalms 36" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/36 \n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.37\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":37,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"A psalm for David, for a remembrance of the sabbath.\"},{\"verse\":2,\"text\":\"Rebuke me not, O Lord, in thy indignation; nor chastise me in thy wrath.\"},{\"verse\":3,\"text\":\"For thy arrows are fastened in me: and thy hand hath been strong upon me.\"},{\"verse\":4,\"text\":\"There is no health in my flesh, because of thy wrath: there is no peace for my bones, because of my sins.\"},{\"verse\":5,\"text\":\"For my iniquities are gone over my head: and as a heavy burden are become heavy upon me.\"},{\"verse\":6,\"text\":\"My sores are putrified and corrupted, because of my foolishness.\"},{\"verse\":7,\"text\":\"I am become miserable, and am bowed down even to the end: I walked sorrowful all the day long.\"},{\"verse\":8,\"text\":\"For my loins are filled with illusions; and there is no health in my flesh.\"},{\"verse\":9,\"text\":\"I am afflicted and humbled exceedingly: I roared with the groaning of my heart.\"},{\"verse\":10,\"text\":\"Lord, all my desire is before thee, and my groaning is not hidden from thee.\"},{\"verse\":11,\"text\":\"My heart is troubled, my strength hath left me, and the light of my eyes itself is not with me.\"},{\"verse\":12,\"text\":\"My friends and my neighbours have drawn near, and stood against me. And they that were near me stood afar off:\"},{\"verse\":13,\"text\":\"And they that sought my soul used violence. And they that sought evils to me spoke vain things, and studied deceits all the day long.\"},{\"verse\":14,\"text\":\"But I, as a deaf man, heard not: and as a dumb man not opening his mouth.\"},{\"verse\":15,\"text\":\"And I became as a man that heareth not: and that hath no reproofs in his mouth.\"},{\"verse\":16,\"text\":\"For in thee, O Lord, have I hoped: thou wilt hear me, O Lord my God.\"},{\"verse\":17,\"text\":\"For I said: Lest at any time my enemies rejoice over me: and whilst my feet are moved, they speak great things against me.\"},{\"verse\":18,\"text\":\"For I am ready for scourges: and my sorrow is continually before me.\"},{\"verse\":19,\"text\":\"For I will declare my iniquity: and I will think for my sin.\"},{\"verse\":20,\"text\":\"But my enemies live, and are stronger than I: and they that hate me wrongfully are multiplied.\"},{\"verse\":21,\"text\":\"They that render evil for good, have detracted me, because I followed goodness.\"},{\"verse\":22,\"text\":\"For sake me not, O Lord my God: do not thou depart from me.\"},{\"verse\":23,\"text\":\"Attend unto my help, O Lord, the God of my salvation.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus David, in rememorationem de sabbato.\"},{\"verse\":2,\"text\":\"Domine, ne in furore tuo arguas me, neque in ira tua corripias me :\"},{\"verse\":3,\"text\":\"quoniam sagittæ tuæ infixæ sunt mihi, et confirmasti super me manum tuam.\"},{\"verse\":4,\"text\":\"Non est sanitas in carne mea, a facie iræ tuæ ; non est pax ossibus meis, a facie peccatorum meorum :\"},{\"verse\":5,\"text\":\"quoniam iniquitates meæ supergressæ sunt caput meum, et sicut onus grave gravatæ sunt super me.\"},{\"verse\":6,\"text\":\"Putruerunt et corruptæ sunt cicatrices meæ, a facie insipientiæ meæ.\"},{\"verse\":7,\"text\":\"Miser factus sum et curvatus sum usque in finem ; tota die contristatus ingrediebar.\"},{\"verse\":8,\"text\":\"Quoniam lumbi mei impleti sunt illusionibus, et non est sanitas in carne mea.\"},{\"verse\":9,\"text\":\"Afflictus sum, et humiliatus sum nimis ; rugiebam a gemitu cordis mei.\"},{\"verse\":10,\"text\":\"Domine, ante te omne desiderium meum, et gemitus meus a te non est absconditus.\"},{\"verse\":11,\"text\":\"Cor meum conturbatum est ; dereliquit me virtus mea, et lumen oculorum meorum, et ipsum non est mecum.\"},{\"verse\":12,\"text\":\"Amici mei et proximi mei adversum me appropinquaverunt, et steterunt ; et qui juxta me erant, de longe steterunt : et vim faciebant qui quærebant animam meam.\"},{\"verse\":13,\"text\":\"Et qui inquirebant mala mihi, locuti sunt vanitates, et dolos tota die meditabantur.\"},{\"verse\":14,\"text\":\"Ego autem, tamquam surdus, non audiebam ; et sicut mutus non aperiens os suum.\"},{\"verse\":15,\"text\":\"Et factus sum sicut homo non audiens, et non habens in ore suo redargutiones.\"},{\"verse\":16,\"text\":\"Quoniam in te, Domine, speravi ; tu exaudies me, Domine Deus meus.\"},{\"verse\":17,\"text\":\"Quia dixi : Nequando supergaudeant mihi inimici mei ; et dum commoventur pedes mei, super me magna locuti sunt.\"},{\"verse\":18,\"text\":\"Quoniam ego in flagella paratus sum, et dolor meus in conspectu meo semper.\"},{\"verse\":19,\"text\":\"Quoniam iniquitatem meam annuntiabo, et cogitabo pro peccato meo.\"},{\"verse\":20,\"text\":\"Inimici autem mei vivunt, et confirmati sunt super me : et multiplicati sunt qui oderunt me inique.\"},{\"verse\":21,\"text\":\"Qui retribuunt mala pro bonis detrahebant mihi, quoniam sequebar bonitatem.\"},{\"verse\":22,\"text\":\"Ne derelinquas me, Domine Deus meus ; ne discesseris a me.\"},{\"verse\":23,\"text\":\"Intende in adjutorium meum, Domine Deus salutis meæ.\"}],\"summary\":\"Domine, ne in furore.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":36,\"label\":\"Psalms 36\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":38,\"label\":\"Psalms 38\"}}]]\n"])</script></body></html>
