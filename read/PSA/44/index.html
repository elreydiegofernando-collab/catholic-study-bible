ton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for them that shall be changed, for the sons of Core, for understanding. A canticle for the Beloved.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>My heart hath uttered a good word: I speak my works to the king: My tongue is the pen of a scrivener that writeth swiftly.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou art beautiful above the sons of men: grace is poured abroad in thy lips; therefore hath God blessed thee for ever.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Gird thy sword upon thy thigh, O thou most mighty.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>With thy comeliness and thy beauty set out, proceed prosperously, and reign. Because of truth and meekness and justice: and thy right hand shall conduct thee wonderfully.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thy arrows are sharp: under thee shall people fall, into the hearts of the king’s enemies.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thy throne, O God, is forever and ever: the sceptre of thy kingdom is a sceptre of uprightness.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thou hast loved justice, and hated iniquity: therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Myrrh and stacte and cassia perfume thy garments, from the ivory houses: out of which</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The daughters of kings have delighted thee in thy glory. The queen stood on thy right hand, in gilded clothing; surrounded with variety.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hearken, O daughter, and see, and incline thy ear: and forget thy people and thy father’s house.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the king shall greatly desire thy beauty; for he is the Lord thy God, and him they shall adore.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the daughters of Tyre with gifts, yea, all the rich among the people, shall entreat thy countenance.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>All the glory of the king’s daughter is within in golden borders,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Clothed round about with varieties. After her shall virgins be brought to the king: her neighbours shall be brought to thee.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>They shall be brought with gladness and rejoicing: they shall be brought into the temple of the king.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Instead of thy fathers, sons are born to thee: thou shalt make them princes over all the earth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They shall remember thy name throughout all generations. Therefore shall people praise thee for ever; yea, for ever and ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, pro iis qui commutabuntur. Filiis Core, ad intellectum. Canticum pro dilecto.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Eructavit cor meum verbum bonum : dico ego opera mea regi. Lingua mea calamus scribæ velociter scribentis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Speciosus forma præ filiis hominum, diffusa est gratia in labiis tuis : propterea benedixit te Deus in æternum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Accingere gladio tuo super femur tuum, potentissime.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Specie tua et pulchritudine tua intende, prospere procede, et regna, propter veritatem, et mansuetudinem, et justitiam ; et deducet te mirabiliter dextera tua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sagittæ tuæ acutæ : populi sub te cadent, in corda inimicorum regis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sedes tua, Deus, in sæculum sæculi ; virga directionis virga regni tui.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dilexisti justitiam, et odisti iniquitatem ; propterea unxit te Deus, Deus tuus, oleo lætitiæ, præ consortibus tuis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Myrrha, et gutta, et casia a vestimentis tuis, a domibus eburneis ; ex quibus delectaverunt te</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>filiæ regum in honore tuo. Astitit regina a dextris tuis in vestitu deaurato, circumdata varietate.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Audi, filia, et vide, et inclina aurem tuam ; et obliviscere populum tuum, et domum patris tui.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et concupiscet rex decorem tuum, quoniam ipse est Dominus Deus tuus, et adorabunt eum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et filiæ Tyri in muneribus vultum tuum deprecabuntur ; omnes divites plebis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Omnis gloria ejus filiæ regis ab intus, in fimbriis aureis,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>circumamicta varietatibus. Adducentur regi virgines post eam ; proximæ ejus afferentur tibi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Afferentur in lætitia et exsultatione ; adducentur in templum regis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Pro patribus tuis nati sunt tibi filii ; constitues eos principes super omnem terram.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Memores erunt nominis tui in omni generatione et generationem : propterea populi confitebuntur tibi in æternum, et in sæculum sæculi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/43/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 43</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/45/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class all conduct thee wonderfully.\"},{\"verse\":6,\"text\":\"Thy arrows are sharp: under thee shall people fall, into the hearts of the king’s enemies.\"},{\"verse\":7,\"text\":\"Thy throne, O God, is forever and ever: the sceptre of thy kingdom is a sceptre of uprightness.\"},{\"verse\":8,\"text\":\"Thou hast loved justice, and hated iniquity: therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows.\"},{\"verse\":9,\"text\":\"Myrrh and stacte and cassia perfume thy garments, from the ivory houses: out of which\"},{\"verse\":10,\"text\":\"The daughters of kings have delighted thee in thy glory. The queen stood on thy right hand, in gilded clothing; surrounded with variety.\"},{\"verse\":11,\"text\":\"Hearken, O daughter, and see, and incline thy ear: and forget thy people and thy father’s house.\"},{\"verse\":12,\"text\":\"And the king shall greatly desire thy beauty; for he is the Lord thy God, and him they shall adore.\"},{\"verse\":13,\"text\":\"And the daughters of Tyre with gifts, yea, all the rich among the people, shall entreat thy countenance.\"},{\"verse\":14,\"text\":\"All the glory of the king’s daughter is within in golden borders,\"},{\"verse\":15,\"text\":\"Clothed round about with varieties. After her shall virgins be brought to the king: her neighbours shall be brought to thee.\"},{\"verse\":16,\"text\":\"They shall be brought with gladness and rejoicing: they shall be brought into the temple of the king.\"},{\"verse\":17,\"text\":\"Instead of thy fathers, sons are born to thee: thou shalt make them princes over all the earth.\"},{\"verse\":18,\"text\":\"They shall remember thy name throughout all generations. Therefore shall people praise thee for ever; yea, for ever and ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, pro iis qui commutabuntur. Filiis Core, ad intellectum. Canticum pro dilecto.\"},{\"verse\":2,\"text\":\"Eructavit cor meum verbum bonum : dico ego opera mea regi. Lingua mea calamus scribæ velociter scribentis.\"},{\"verse\":3,\"text\":\"Speciosus forma præ filiis hominum, diffusa est gratia in labiis tuis : propterea benedixit te Deus in æternum.\"},{\"verse\":4,\"text\":\"Accingere gladio tuo super femur tuum, potentissime.\"},{\"verse\":5,\"text\":\"Specie tua et pulchritudine tua intende, prospere procede, et regna, propter veritatem, et mansuetudinem, et justitiam ; et deducet te mirabiliter dextera tua.\"},{\"verse\":6,\"text\":\"Sagittæ tuæ acutæ : populi sub te cadent, in corda inimicorum regis.\"},{\"verse\":7,\"text\":\"Sedes tua, Deus, in sæculum sæculi ; virga directionis virga regni tui.\"},{\"verse\":8,\"text\":\"Dilexisti justitiam, et odisti iniquitatem ; propterea unxit te Deus, Deus tuus, oleo lætitiæ, præ consortibus tuis.\"},{\"verse\":9,\"text\":\"Myrrha, et gutta, et casia a vestimentis tuis, a domibus eburneis ; ex quibus delectaverunt te\"},{\"verse\":10,\"text\":\"filiæ regum in honore tuo. Astitit regina a dextris tuis in vestitu deaurato, circumdata varietate.\"},{\"verse\":11,\"text\":\"Audi, filia, et vide, et inclina aurem tuam ; et obliviscere populum tuum, et domum patris tui.\"},{\"verse\":12,\"text\":\"Et concupiscet rex decorem tuum, quoniam ipse est Dominus Deus tuus, et adorabunt eum.\"},{\"verse\":13,\"text\":\"Et filiæ Tyri in muneribus vultum tuum deprecabuntur ; omnes divites plebis.\"},{\"verse\":14,\"text\":\"Omnis gloria ejus filiæ regis ab intus, in fimbriis aureis,\"},{\"verse\":15,\"text\":\"circumamicta varietatibus. Adducentur regi virgines post eam ; proximæ ejus afferentur tibi.\"},{\"verse\":16,\"text\":\"Afferentur in lætitia et exsultatione ; adducentur in templum regis.\"},{\"verse\":17,\"text\":\"Pro patribus tuis nati sunt tibi filii ; constitues eos principes super omnem terram.\"},{\"verse\":18,\"text\":\"Memores erunt nominis tui in omni generatione et generationem : propterea populi confitebuntur tibi in æternum, et in sæculum sæculi.\"}],\"summary\":\"Eructavit cor meum.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":43,\"label\":\"Psalms 43\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":45,\"label\":\"Psalms 45\"}}]]\n"])</script></body></html>
