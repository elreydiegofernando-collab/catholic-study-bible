 data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for the morning protection, a psalm for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>O God my God, look upon me: why hast thou forsaken me? Far from my salvation are the words of my sins.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>O my God, I shall cry by day, and thou wilt not hear: and by night, and it shall not be reputed as folly in me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But thou dwellest in the holy place, the praise of Israel.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In thee have our fathers hoped: they have hoped, and thou hast delivered them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They cried to thee, and they were saved: they trusted in thee, and were not confounded.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But I am a worm, and no man: the reproach of men, and the outcast of the people.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>All they that saw me have laughed me to scorn: they have spoken with the lips, and wagged the head.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He hoped in the Lord, let him deliver him: let him save him, seeing he delighteth in him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For thou art he that hast drawn me out of the womb: my hope from the breasts of my mother.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I was cast upon thee from the womb. From my mother’s womb thou art my God,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Depart not from me. For tribulation is very near: for there is none to help me.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Many calves have surrounded me: fat bulls have besieged me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They have opened their mouths against me, as a lion ravening and roaring.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I am poured out like water; and all my bones are scattered. My heart is become like wax melting in the midst of my bowels.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>My strength is dried up like a potsherd, and my tongue hath cleaved to my jaws: and thou hast brought me down into the dust of death.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For many dogs have encompassed me: the council of the malignant hath besieged me. They have dug my hands and feet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They have numbered all my bones. And they have looked and stared upon me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They parted my garments amongst them; and upon my vesture they cast lots.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But thou, O Lord, remove not thy help to a distance from me; look towards my defence.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Deliver, O God, my soul from the sword: my only one from the hand of the dog.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Save me from the lion’s mouth; and my lowness from the horns of the unicorns.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I will declare thy name to my brethren: in the midst of the church will I praise thee.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ye that fear the Lord, praise him: all ye the seed of Jacob, glorify him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let all the seed of Israel fear him: because he hath not slighted nor despised the supplication of the poor man. Neither hath he turned away his face from me: and when I cried to him he heard me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>With thee is my praise in a great church: I will pay my vows in the sight of them that fear him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The poor shall eat and shall be filled: and they shall praise the Lord that seek him: their hearts shall live for ever and ever.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>All the ends of the earth shall remember, and shall be converted to the Lord: And all the kindreds of the Gentiles shall adore in his sight.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For the kingdom is the Lord’s; and he shall have dominion over the nations.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>All the fat ones of the earth have eaten and have adored: all they that go down to the earth shall fall before him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And to him my soul shall live: and my seed shall serve him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>There shall be declared to the Lord a generation to come: and the heavens shall shew forth his justice to a people that shall be born, which the Lord hath made.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, pro susceptione matutina. Psalmus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deus, Deus meus, respice in me : quare me dereliquisti ? longe a salute mea verba delictorum meorum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deus meus, clamabo per diem, et non exaudies ; et nocte, et non ad insipientiam mihi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tu autem in sancto habitas, laus Israël.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In te speraverunt patres nostri ; speraverunt, et liberasti eos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ad te clamaverunt, et salvi facti sunt ; in te speraverunt, et non sunt confusi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ego autem sum vermis, et non homo ; opprobrium hominum, et abjectio plebis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnes videntes me deriserunt me ; locuti sunt labiis, et moverunt caput.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Speravit in Domino, eripiat eum : salvum faciat eum, quoniam vult eum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam tu es qui extraxisti me de ventre, spes mea ab uberibus matris meæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In te projectus sum ex utero ; de ventre matris meæ Deus meus es tu :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ne discesseris a me, quoniam tribulatio proxima est, quoniam non est qui adjuvet.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Circumdederunt me vituli multi ; tauri pingues obsederunt me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Aperuerunt super me os suum, sicut leo rapiens et rugiens.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sicut aqua effusus sum, et dispersa sunt omnia ossa mea : factum est cor meum tamquam cera liquescens in medio ventris mei.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Aruit tamquam testa virtus mea, et lingua mea adhæsit faucibus meis : et in pulverem mortis deduxisti me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quoniam circumdederunt me canes multi ; concilium malignantium obsedit me. Foderunt manus meas et pedes meos ;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>dinumeraverunt omnia ossa mea. Ipsi vero consideraverunt et inspexerunt me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tu autem, Domine, ne elongaveris auxilium tuum a me ; ad defensionem meam conspice.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Erue a framea, Deus, animam meam, et de manu canis unicam meam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Salva me ex ore leonis, et a cornibus unicornium humilitatem meam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Narrabo nomen tuum fratribus meis ; in medio ecclesiæ laudabo te.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui timetis Dominum, laudate eum ; universum semen Jacob, glorificate eum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Timeat eum omne semen Israël, quoniam non sprevit, neque despexit deprecationem pauperis, nec avertit faciem suam a me : et cum clamarem ad eum, exaudivit me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Apud te laus mea in ecclesia magna ; vota mea reddam in conspectu timentium eum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Edent pauperes, et saturabuntur, et laudabunt Dominum qui requirunt eum : vivent corda eorum in sæculum sæculi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Reminiscentur et convertentur ad Dominum universi fines terræ ; et adorabunt in conspectu ejus universæ familiæ gentium :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>quoniam Domini est regnum, et ipse dominabitur gentium.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Manducaverunt et adoraverunt omnes pingues terræ ; in conspectu ejus cadent omnes qui descendunt in terram.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et anima mea illi vivet ; et semen meum serviet ipsi.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Annuntiabitur Domino generatio ventura ; et annuntiabunt cæli justitiam ejus populo qui nascetur, quem fecit Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bi \"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Unto the end, for the morning protection, a psalm for David.\"},{\"verse\":2,\"text\":\"O God my God, look upon me: why hast thou forsaken me? Far from my salvation are the words of my sins.\"},{\"verse\":3,\"text\":\"O my God, I shall cry by day, and thou wilt not hear: and by night, and it shall not be reputed as folly in me.\"},{\"verse\":4,\"text\":\"But thou dwellest in the holy place, the praise of Israel.\"},{\"verse\":5,\"text\":\"In thee have our fathers hoped: they have hoped, and thou hast delivered them.\"},{\"verse\":6,\"text\":\"They cried to thee, and they were saved: they trusted in thee, and were not confounded.\"},{\"verse\":7,\"text\":\"But I am a worm, and no man: the reproach of men, and the outcast of the people.\"},{\"verse\":8,\"text\":\"All they that saw me have laughed me to scorn: they have spoken with the lips, and wagged the head.\"},{\"verse\":9,\"text\":\"He hoped in the Lord, let him deliver him: let him save him, seeing he delighteth in him.\"},{\"verse\":10,\"text\":\"For thou art he that hast drawn me out of the womb: my hope from the breasts of my mother.\"},{\"verse\":11,\"text\":\"I was cast upon thee from the womb. From my mother’s womb thou art my God,\"},{\"verse\":12,\"text\":\"Depart not from me. For tribulation is very near: for there is none to help me.\"},{\"verse\":13,\"text\":\"Many calves have surrounded me: fat bulls have besieged me.\"},{\"verse\":14,\"text\":\"They have opened their mouths against me, as a lion ravening and roaring.\"},{\"verse\":15,\"text\":\"I am poured out like water; and all my bones are scattered. My heart is become like wax melting in the midst of my bowels.\"},{\"verse\":16,\"text\":\"My strength is dried up like a potsherd, and my tongue hath cleaved to my jaws: and thou hast brought me down into the dust of death.\"},{\"verse\":17,\"text\":\"For many dogs have encompassed me: the council of the malignant hath besieged me. They have dug my hands and feet.\"},{\"verse\":18,\"text\":\"They have numbered all my bones. And they have looked and stared upon me.\"},{\"verse\":19,\"text\":\"They parted my garments amongst them; and upon my vesture they cast lots.\"},{\"verse\":20,\"text\":\"But thou, O Lord, remove not thy help to a distance from me; look towards my defence.\"},{\"verse\":21,\"text\":\"Deliver, O God, my soul from the sword: my only one from the hand of the dog.\"},{\"verse\":22,\"text\":\"Save me from the lion’s mouth; and my lowness from the horns of the unicorns.\"},{\"verse\":23,\"text\":\"I will declare thy name to my brethren: in the midst of the church will I praise thee.\"},{\"verse\":24,\"text\":\"Ye that fear the Lord, praise him: all ye the seed of Jacob, glorify him.\"},{\"verse\":25,\"text\":\"Let all the seed of Israel fear him: because he hath not slighted nor despised the supplication of the poor man. Neither hath he turned away his face from me: and when I cried to him he heard me.\"},{\"verse\":26,\"text\":\"With thee is my praise in a great church: I will pay my vows in the sight of them that fear him.\"},{\"verse\":27,\"text\":\"The poor shall eat and shall be filled: and they shall praise the Lord that seek him: their hearts shall live for ever and ever.\"},{\"verse\":28,\"text\":\"All the ends of the earth shall remember, and shall be converted to the Lord: And all the kindreds of the Gentiles shall adore in his sight.\"},{\"verse\":29,\"text\":\"For the kingdom is the Lord’s; and he shall have dominion over the nations.\"},{\"verse\":30,\"text\":\"All the fat ones of the earth have eaten and have adored: all they that go down to the earth shall fall before him.\"},{\"verse\":31,\"text\":\"And to him my soul shall live: and my seed shall serve him.\"},{\"verse\":32,\"text\":\"There shall be declared to the Lord a generation to come: and the heavens shall shew forth his justice to a people that shall be born, which the Lord hath made.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, pro susceptione matutina. Psalmus David.\"},{\"verse\":2,\"text\":\"Deus, Deus meus, respice in me : quare me dereliquisti ? longe a salute mea verba delictorum meorum.\"},{\"verse\":3,\"text\":\"Deus meus, clamabo per diem, et non exaudies ; et nocte, et non ad insipientiam mihi.\"},{\"verse\":4,\"text\":\"Tu autem in sancto habitas, laus Israël.\"},{\"verse\":5,\"text\":\"In te speraverunt patres nostri ; speraverunt, et liberasti eos.\"},{\"verse\":6,\"text\":\"Ad te clamaverunt, et salvi facti sunt ; in te speraverunt, et non sunt confusi.\"},{\"verse\":7,\"text\":\"Ego autem sum vermis, et non homo ; opprobrium hominum, et abjectio plebis.\"},{\"verse\":8,\"text\":\"Omnes videntes me deriserunt me ; locuti sunt labiis, et moverunt caput.\"},{\"verse\":9,\"text\":\"Speravit in Domino, eripiat eum : salvum faciat eum, quoniam vult eum.\"},{\"verse\":10,\"text\":\"Quoniam tu es qui extraxisti me de ventre, spes mea ab uberibus matris meæ.\"},{\"verse\":11,\"text\":\"In te projectus sum ex utero ; de ventre matris meæ Deus meus es tu :\"},{\"verse\":12,\"text\":\"ne discesseris a me, quoniam tribulatio proxima est, quoniam non est qui adjuvet.\"},{\"verse\":13,\"text\":\"Circumdederunt me vituli multi ; tauri pingues obsederunt me.\"},{\"verse\":14,\"text\":\"Aperuerunt super me os suum, sicut leo rapiens et rugiens.\"},{\"verse\":15,\"text\":\"Sicut aqua effusus sum, et dispersa sunt omnia ossa mea : factum est cor meum tamquam cera liquescens in medio ventris mei.\"},{\"verse\":16,\"text\":\"Aruit tamquam testa virtus mea, et lingua mea adhæsit faucibus meis : et in pulverem mortis deduxisti me.\"},{\"verse\":17,\"text\":\"Quoniam circumdederunt me canes multi ; concilium malignantium obsedit me. Foderunt manus meas et pedes meos ;\"},{\"verse\":18,\"text\":\"dinumeraverunt omnia ossa mea. Ipsi vero consideraverunt et inspexerunt me.\"},{\"verse\":19,\"text\":\"Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem.\"},{\"verse\":20,\"text\":\"Tu autem, Domine, ne elongaveris auxilium tuum a me ; ad defensionem meam conspice.\"},{\"verse\":21,\"text\":\"Erue a framea, Deus, animam meam, et de manu canis unicam meam.\"},{\"verse\":22,\"text\":\"Salva me ex ore leonis, et a cornibus unicornium humilitatem meam.\"},{\"verse\":23,\"text\":\"Narrabo nomen tuum fratribus meis ; in medio ecclesiæ laudabo te.\"},{\"verse\":24,\"text\":\"Qui timetis Dominum, laudate eum ; universum semen Jacob, glorificate eum.\"},{\"verse\":25,\"text\":\"Timeat eum omne semen Israël, quoniam non sprevit, neque despexit deprecationem pauperis, nec avertit faciem suam a me : et cum clamarem ad eum, exaudivit me.\"},{\"verse\":26,\"text\":\"Apud te laus mea in ecclesia magna ; vota mea reddam in conspectu timentium eum.\"},{\"verse\":27,\"text\":\"Edent pauperes, et saturabuntur, et laudabunt Dominum qui requirunt eum : vivent corda eorum in sæculum sæculi.\"},{\"verse\":28,\"text\":\"Reminiscentur et convertentur ad Dominum universi fines terræ ; et adorabunt in conspectu ejus universæ familiæ gentium :\"},{\"verse\":29,\"text\":\"quoniam Domini est regnum, et ipse dominabitur gentium.\"},{\"verse\":30,\"text\":\"Manducaverunt et adoraverunt omnes pingues terræ ; in conspectu ejus cadent omnes qui descendunt in terram.\"},{\"verse\":31,\"text\":\"Et anima mea illi vivet ; et semen meum serviet ipsi.\"},{\"verse\":32,\"text\":\"Annuntiabitur Domino generatio ventura ; et annuntiabunt cæli justitiam ejus populo qui nascetur, quem fecit Dominus.\"}],\"summary\":\"Deus Deus meus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":20,\"label\":\"Psalms 20\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":22,\"label\":\"Psalms 22\"}}]]\n"])</script></body></html>
