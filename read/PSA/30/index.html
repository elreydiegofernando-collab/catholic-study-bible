[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">30</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">In te, Domine, speravi.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a psalm for David, in an ecstasy.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In thee, O Lord, have I hoped, let me never be confounded: deliver me in thy justice.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Bow down thy ear to me: make haste to deliver me. Be thou unto me a God, a protector, and a house of refuge, to save me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thou art my strength and my refuge; and for thy name’s sake thou wilt lead me, and nourish me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thou wilt bring me out of this snare, which they have hidden for me: for thou art my protector.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Into thy hands I commend my spirit: thou hast redeemed me, O Lord, the God of truth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou hast hated them that regard vanities, to no purpose. But I have hoped in the Lord:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I will be glad and rejoice in thy mercy. For thou hast regarded my humility, thou hast saved my soul out of distresses.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And thou hast not shut me up in the hands of the enemy: thou hast set my feet in a spacious place.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Have mercy on me, O Lord, for I am afflicted: my eye is troubled with wrath, my soul, and my belly:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For my life is wasted with grief: and my years in sighs. My strength is weakened through poverty and my bones are disturbed.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I am become a reproach among all my enemies, and very much to my neighbours; and a fear to my acquaintance. They that saw me without fled from me.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I am forgotten as one dead from the heart. I am become as a vessel that is destroyed.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For I have heard the blame of many that dwell round about. While they assembled together against me, they consulted to take away my life.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But I have put my trust in thee, O Lord: I said: Thou art my God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>My lots are in thy hands. Deliver me out of the hands of my enemies; and from them that persecute me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Make thy face to shine upon thy servant; save me in thy mercy.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Let me not be confounded, O Lord, for I have called upon thee. Let the wicked be ashamed, and be brought down to hell.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let deceitful lips be made dumb. Which speak iniquity against the just, with pride and abuse.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>O how great is the multitude of thy sweetness, O Lord, which thou hast hidden for them that fear thee! Which thou hast wrought for them that hope in thee, in the sight of the sons of men.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou shalt hide them in the secret of thy face, from the disturbance of men. Thou shalt protect them in thy tabernacle from the contradiction of tongues.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Blessed be the Lord, for he hath shewn his wonderful mercy to me in a fortified city.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But I said in the excess of my mind: I am cast away from before thy eyes. Therefore thou hast heard the voice of my prayer, when I cried to thee.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>O love the Lord, all ye his saints: for the Lord will require truth, and will repay them abundantly that act proudly.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Do ye manfully, and let your heart be strengthened, all ye that hope in the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus David, pro extasi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In te, Domine, speravi ; non confundar in æternum : in justitia tua libera me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Inclina ad me aurem tuam ; accelera ut eruas me. Esto mihi in Deum protectorem, et in domum refugii, ut salvum me facias :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quoniam fortitudo mea et refugium meum es tu ; et propter nomen tuum deduces me et enutries me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Educes me de laqueo hoc quem absconderunt mihi, quoniam tu es protector meus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In manus tuas commendo spiritum meum ; redemisti me, Domine Deus veritatis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Odisti observantes vanitates supervacue ; ego autem in Domino speravi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Exsultabo, et lætabor in misericordia tua, quoniam respexisti humilitatem meam ; salvasti de necessitatibus animam meam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nec conclusisti me in manibus inimici : statuisti in loco spatioso pedes meos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Miserere mei, Domine, quoniam tribulor ; conturbatus est in ira oculus meus, anima mea, et venter meus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quoniam defecit in dolore vita mea, et anni mei in gemitibus. Infirmata est in paupertate virtus mea, et ossa mea conturbata sunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Super omnes inimicos meos factus sum opprobrium, et vicinis meis valde, et timor notis meis ; qui videbant me foras fugerunt a me.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Oblivioni datus sum, tamquam mortuus a corde ; factus sum tamquam vas perditum :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quoniam audivi vituperationem multorum commorantium in circuitu. In eo dum convenirent simul adversum me, accipere animam meam consiliati sunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ego autem in te speravi, Domine ; dixi : Deus meus es tu ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>in manibus tuis sortes meæ : eripe me de manu inimicorum meorum, et a persequentibus me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Illustra faciem tuam super servum tuum ; salvum me fac in misericordia tua.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Domine, non confundar, quoniam invocavi te. Erubescant impii, et deducantur in infernum ;</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>muta fiant labia dolosa, quæ loquuntur adversus justum iniquitatem, in superbia, et in abusione.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quam magna multitudo dulcedinis tuæ, Domine, quam abscondisti timentibus te ; perfecisti eis qui sperant in te in conspectu filiorum hominum !</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Abscondes eos in abscondito faciei tuæ a conturbatione hominum ; proteges eos in tabernaculo tuo, a contradictione linguarum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Benedictus Dominus, quoniam mirificavit misericordiam suam mihi in civitate munita.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ego autem dixi in excessu mentis meæ : Projectus sum a facie oculorum tuorum : ideo exaudisti vocem orationis meæ, dum clamarem ad te.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Diligite Dominum, omnes sancti ejus, quoniam veritatem requiret Dominus, et retribuet abundanter facientibus superbiam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Viriliter agite, et confortetur cor vestrum, omnes qui speratis in Domino.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border bord ,{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":30,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Unto the end, a psalm for David, in an ecstasy.\"},{\"verse\":2,\"text\":\"In thee, O Lord, have I hoped, let me never be confounded: deliver me in thy justice.\"},{\"verse\":3,\"text\":\"Bow down thy ear to me: make haste to deliver me. Be thou unto me a God, a protector, and a house of refuge, to save me.\"},{\"verse\":4,\"text\":\"For thou art my strength and my refuge; and for thy name’s sake thou wilt lead me, and nourish me.\"},{\"verse\":5,\"text\":\"Thou wilt bring me out of this snare, which they have hidden for me: for thou art my protector.\"},{\"verse\":6,\"text\":\"Into thy hands I commend my spirit: thou hast redeemed me, O Lord, the God of truth.\"},{\"verse\":7,\"text\":\"Thou hast hated them that regard vanities, to no purpose. But I have hoped in the Lord:\"},{\"verse\":8,\"text\":\"I will be glad and rejoice in thy mercy. For thou hast regarded my humility, thou hast saved my soul out of distresses.\"},{\"verse\":9,\"text\":\"And thou hast not shut me up in the hands of the enemy: thou hast set my feet in a spacious place.\"},{\"verse\":10,\"text\":\"Have mercy on me, O Lord, for I am afflicted: my eye is troubled with wrath, my soul, and my belly:\"},{\"verse\":11,\"text\":\"For my life is wasted with grief: and my years in sighs. My strength is weakened through poverty and my bones are disturbed.\"},{\"verse\":12,\"text\":\"I am become a reproach among all my enemies, and very much to my neighbours; and a fear to my acquaintance. They that saw me without fled from me.\"},{\"verse\":13,\"text\":\"I am forgotten as one dead from the heart. I am become as a vessel that is destroyed.\"},{\"verse\":14,\"text\":\"For I have heard the blame of many that dwell round about. While they assembled together against me, they consulted to take away my life.\"},{\"verse\":15,\"text\":\"But I have put my trust in thee, O Lord: I said: Thou art my God.\"},{\"verse\":16,\"text\":\"My lots are in thy hands. Deliver me out of the hands of my enemies; and from them that persecute me.\"},{\"verse\":17,\"text\":\"Make thy face to shine upon thy servant; save me in thy mercy.\"},{\"verse\":18,\"text\":\"Let me not be confounded, O Lord, for I have called upon thee. Let the wicked be ashamed, and be brought down to hell.\"},{\"verse\":19,\"text\":\"Let deceitful lips be made dumb. Which speak iniquity against the just, with pride and abuse.\"},{\"verse\":20,\"text\":\"O how great is the multitude of thy sweetness, O Lord, which thou hast hidden for them that fear thee! Which thou hast wrought for them that hope in thee, in the sight of the sons of men.\"},{\"verse\":21,\"text\":\"Thou shalt hide them in the secret of thy face, from the disturbance of men. Thou shalt protect them in thy tabernacle from the contradiction of tongues.\"},{\"verse\":22,\"text\":\"Blessed be the Lord, for he hath shewn his wonderful mercy to me in a fortified city.\"},{\"verse\":23,\"text\":\"But I said in the excess of my mind: I am cast away from before thy eyes. Therefore thou hast heard the voice of my prayer, when I cried to thee.\"},{\"verse\":24,\"text\":\"O love the Lord, all ye his saints: for the Lord will require truth, and will repay them abundantly that act proudly.\"},{\"verse\":25,\"text\":\"Do ye manfully, and let your heart be strengthened, all ye that hope in the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus David, pro extasi.\"},{\"verse\":2,\"text\":\"In te, Domine, speravi ; non confundar in æternum : in justitia tua libera me.\"},{\"verse\":3,\"text\":\"Inclina ad me aurem tuam ; accelera ut eruas me. Esto mihi in Deum protectorem, et in domum refugii, ut salvum me facias :\"},{\"verse\":4,\"text\":\"quoniam fortitudo mea et refugium meum es tu ; et propter nomen tuum deduces me et enutries me.\"},{\"verse\":5,\"text\":\"Educes me de laqueo hoc quem absconderunt mihi, quoniam tu es protector meus.\"},{\"verse\":6,\"text\":\"In manus tuas commendo spiritum meum ; redemisti me, Domine Deus veritatis.\"},{\"verse\":7,\"text\":\"Odisti observantes vanitates supervacue ; ego autem in Domino speravi.\"},{\"verse\":8,\"text\":\"Exsultabo, et lætabor in misericordia tua, quoniam respexisti humilitatem meam ; salvasti de necessitatibus animam meam.\"},{\"verse\":9,\"text\":\"Nec conclusisti me in manibus inimici : statuisti in loco spatioso pedes meos.\"},{\"verse\":10,\"text\":\"Miserere mei, Domine, quoniam tribulor ; conturbatus est in ira oculus meus, anima mea, et venter meus.\"},{\"verse\":11,\"text\":\"Quoniam defecit in dolore vita mea, et anni mei in gemitibus. Infirmata est in paupertate virtus mea, et ossa mea conturbata sunt.\"},{\"verse\":12,\"text\":\"Super omnes inimicos meos factus sum opprobrium, et vicinis meis valde, et timor notis meis ; qui videbant me foras fugerunt a me.\"},{\"verse\":13,\"text\":\"Oblivioni datus sum, tamquam mortuus a corde ; factus sum tamquam vas perditum :\"},{\"verse\":14,\"text\":\"quoniam audivi vituperationem multorum commorantium in circuitu. In eo dum convenirent simul adversum me, accipere animam meam consiliati sunt.\"},{\"verse\":15,\"text\":\"Ego autem in te speravi, Domine ; dixi : Deus meus es tu ;\"},{\"verse\":16,\"text\":\"in manibus tuis sortes meæ : eripe me de manu inimicorum meorum, et a persequentibus me.\"},{\"verse\":17,\"text\":\"Illustra faciem tuam super servum tuum ; salvum me fac in misericordia tua.\"},{\"verse\":18,\"text\":\"Domine, non confundar, quoniam invocavi te. Erubescant impii, et deducantur in infernum ;\"},{\"verse\":19,\"text\":\"muta fiant labia dolosa, quæ loquuntur adversus justum iniquitatem, in superbia, et in abusione.\"},{\"verse\":20,\"text\":\"Quam magna multitudo dulcedinis tuæ, Domine, quam abscondisti timentibus te ; perfecisti eis qui sperant in te in conspectu filiorum hominum !\"},{\"verse\":21,\"text\":\"Abscondes eos in abscondito faciei tuæ a conturbatione hominum ; proteges eos in tabernaculo tuo, a contradictione linguarum.\"},{\"verse\":22,\"text\":\"Benedictus Dominus, quoniam mirificavit misericordiam suam mihi in civitate munita.\"},{\"verse\":23,\"text\":\"Ego autem dixi in excessu mentis meæ : Projectus sum a facie oculorum tuorum : ideo exaudisti vocem orationis meæ, dum clamarem ad te.\"},{\"verse\":24,\"text\":\"Diligite Dominum, omnes sancti ejus, quoniam veritatem requiret Dominus, et retribuet abundanter facientibus superbiam.\"},{\"verse\":25,\"text\":\"Viriliter agite, et confortetur cor vestrum, omnes qui speratis in Domino.\"}],\"summary\":\"In te, Domine, speravi.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":29,\"label\":\"Psalms 29\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":31,\"label\":\"Psalms 31\"}}]]\n"])</script></body></html>
