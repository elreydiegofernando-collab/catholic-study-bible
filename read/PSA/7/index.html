 that persecute me, and deliver me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lest at any time he seize upon my soul like a lion, while there is no one to redeem me, nor to save.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O Lord, my God, if I have done this thing, if there be iniquity in my hands:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If I have rendered to them that repaid me evils, let me deservedly fall empty before my enemies.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let the enemy pursue my soul, and take it, and tread down my life, on the earth, and bring down my glory to the dust.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Rise up, O Lord, in thy anger: and be thou exalted in the borders of my enemies. And arise, O Lord, my God, in the precept which thou hast commanded:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And a congregation of people shall surround thee. And for their sakes return thou on high.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The Lord judgeth the people. Judge me, O Lord, according to my justice, and according to my innocence in me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The wickedness of sinners shall be brought to nought; and thou shalt direct the just: the searcher of hearts and reins is God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Just is my help from the Lord; who saveth the upright of heart.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>God is a just judge, strong and patient: is he angry every day?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Except you will be converted, he will brandish his sword; he hath bent his bow, and made it ready.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And in it he hath prepared the instruments of death, he hath made ready his arrows for them that burn.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Behold he hath been in labour with injustice: he hath conceived sorrow, and brought forth iniquity.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He hath opened a pit and dug it: and he is fallen into the hole he made.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>His sorrow shall be turned on his own head: and his iniquity shall come down upon his crown.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will give glory to the Lord according to his justice: and will sing to the name of the Lord the most high.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David, quem cantavit Domino pro verbis Chusi, filii Jemini.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine Deus meus, in te speravi ; salvum me fac ex omnibus persequentibus me, et libera me :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>nequando rapiat ut leo animam meam, dum non est qui redimat, neque qui salvum faciat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Domine Deus meus, si feci istud, si est iniquitas in manibus meis,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>si reddidi retribuentibus mihi mala, decidam merito ab inimicis meis inanis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Persequatur inimicus animam meam, et comprehendat ; et conculcet in terra vitam meam, et gloriam meam in pulverem deducat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Exsurge, Domine, in ira tua, et exaltare in finibus inimicorum meorum : et exsurge, Domine Deus meus, in præcepto quod mandasti,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et synagoga populorum circumdabit te : et propter hanc in altum regredere :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dominus judicat populos. Judica me, Domine, secundum justitiam meam, et secundum innocentiam meam super me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Consumetur nequitia peccatorum, et diriges justum, scrutans corda et renes, Deus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Justum adjutorium meum a Domino, qui salvos facit rectos corde.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deus judex justus, fortis, et patiens ; numquid irascitur per singulos dies ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nisi conversi fueritis, gladium suum vibrabit ; arcum suum tetendit, et paravit illum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et in eo paravit vasa mortis, sagittas suas ardentibus effecit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ecce parturiit injustitiam ; concepit dolorem, et peperit iniquitatem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Lacum aperuit, et effodit eum ; et incidit in foveam quam fecit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Convertetur dolor ejus in caput ejus, et in verticem ipsius iniquitas ejus descendet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Confitebor Domino secundum justitiam ejus, et psallam nomini Domini altissimi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label ":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.7\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":7,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"The psalm of David, which he sung to the Lord, for the words of Chusi, the son of Jemini.\"},{\"verse\":2,\"text\":\"O Lord, my God, in thee have I put my trust; save me from all them that persecute me, and deliver me.\"},{\"verse\":3,\"text\":\"Lest at any time he seize upon my soul like a lion, while there is no one to redeem me, nor to save.\"},{\"verse\":4,\"text\":\"O Lord, my God, if I have done this thing, if there be iniquity in my hands:\"},{\"verse\":5,\"text\":\"If I have rendered to them that repaid me evils, let me deservedly fall empty before my enemies.\"},{\"verse\":6,\"text\":\"Let the enemy pursue my soul, and take it, and tread down my life, on the earth, and bring down my glory to the dust.\"},{\"verse\":7,\"text\":\"Rise up, O Lord, in thy anger: and be thou exalted in the borders of my enemies. And arise, O Lord, my God, in the precept which thou hast commanded:\"},{\"verse\":8,\"text\":\"And a congregation of people shall surround thee. And for their sakes return thou on high.\"},{\"verse\":9,\"text\":\"The Lord judgeth the people. Judge me, O Lord, according to my justice, and according to my innocence in me.\"},{\"verse\":10,\"text\":\"The wickedness of sinners shall be brought to nought; and thou shalt direct the just: the searcher of hearts and reins is God.\"},{\"verse\":11,\"text\":\"Just is my help from the Lord; who saveth the upright of heart.\"},{\"verse\":12,\"text\":\"God is a just judge, strong and patient: is he angry every day?\"},{\"verse\":13,\"text\":\"Except you will be converted, he will brandish his sword; he hath bent his bow, and made it ready.\"},{\"verse\":14,\"text\":\"And in it he hath prepared the instruments of death, he hath made ready his arrows for them that burn.\"},{\"verse\":15,\"text\":\"Behold he hath been in labour with injustice: he hath conceived sorrow, and brought forth iniquity.\"},{\"verse\":16,\"text\":\"He hath opened a pit and dug it: and he is fallen into the hole he made.\"},{\"verse\":17,\"text\":\"His sorrow shall be turned on his own head: and his iniquity shall come down upon his crown.\"},{\"verse\":18,\"text\":\"I will give glory to the Lord according to his justice: and will sing to the name of the Lord the most high.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus David, quem cantavit Domino pro verbis Chusi, filii Jemini.\"},{\"verse\":2,\"text\":\"Domine Deus meus, in te speravi ; salvum me fac ex omnibus persequentibus me, et libera me :\"},{\"verse\":3,\"text\":\"nequando rapiat ut leo animam meam, dum non est qui redimat, neque qui salvum faciat.\"},{\"verse\":4,\"text\":\"Domine Deus meus, si feci istud, si est iniquitas in manibus meis,\"},{\"verse\":5,\"text\":\"si reddidi retribuentibus mihi mala, decidam merito ab inimicis meis inanis.\"},{\"verse\":6,\"text\":\"Persequatur inimicus animam meam, et comprehendat ; et conculcet in terra vitam meam, et gloriam meam in pulverem deducat.\"},{\"verse\":7,\"text\":\"Exsurge, Domine, in ira tua, et exaltare in finibus inimicorum meorum : et exsurge, Domine Deus meus, in præcepto quod mandasti,\"},{\"verse\":8,\"text\":\"et synagoga populorum circumdabit te : et propter hanc in altum regredere :\"},{\"verse\":9,\"text\":\"Dominus judicat populos. Judica me, Domine, secundum justitiam meam, et secundum innocentiam meam super me.\"},{\"verse\":10,\"text\":\"Consumetur nequitia peccatorum, et diriges justum, scrutans corda et renes, Deus.\"},{\"verse\":11,\"text\":\"Justum adjutorium meum a Domino, qui salvos facit rectos corde.\"},{\"verse\":12,\"text\":\"Deus judex justus, fortis, et patiens ; numquid irascitur per singulos dies ?\"},{\"verse\":13,\"text\":\"Nisi conversi fueritis, gladium suum vibrabit ; arcum suum tetendit, et paravit illum.\"},{\"verse\":14,\"text\":\"Et in eo paravit vasa mortis, sagittas suas ardentibus effecit.\"},{\"verse\":15,\"text\":\"Ecce parturiit injustitiam ; concepit dolorem, et peperit iniquitatem.\"},{\"verse\":16,\"text\":\"Lacum aperuit, et effodit eum ; et incidit in foveam quam fecit.\"},{\"verse\":17,\"text\":\"Convertetur dolor ejus in caput ejus, et in verticem ipsius iniquitas ejus descendet.\"},{\"verse\":18,\"text\":\"Confitebor Domino secundum justitiam ejus, et psallam nomini Domini altissimi.\"}],\"summary\":\"Domine, Deus meus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":6,\"label\":\"Psalms 6\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":8,\"label\":\"Psalms 8\"}}]]\n"])</script></body></html>
