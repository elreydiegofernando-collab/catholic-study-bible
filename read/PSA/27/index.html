"verse"><sup>2</sup>Hear, O Lord, the voice of my supplication, when I pray to thee; when I lift up my hands to thy holy temple.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Draw me not away together with the wicked; and with the workers of iniquity destroy me not: Who speak peace with their neighbour, but evils are in their hearts.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Give them according to their works, and according to the wickedness of their inventions. According to the works of their hands give thou to them: render to them their reward.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Because they have not understood the works of the Lord, and the operations of his hands: thou shalt destroy them, and shalt not build them up.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Blessed be the Lord, for he hath heard the voice of my supplication.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The Lord is my helper and my protector: in him hath my heart confided, and I have been helped. And my flesh hath flourished again, and with my will I will give praise to him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord is the strength of his people, and the protector of the salvation of his anointed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Save, O Lord, thy people, and bless thy inheritance: and rule them and exalt them for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus ipsi David. Ad te, Domine, clamabo ; Deus meus, ne sileas a me : nequando taceas a me, et assimilabor descendentibus in lacum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Exaudi, Domine, vocem deprecationis meæ dum oro ad te ; dum extollo manus meas ad templum sanctum tuum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ne simul trahas me cum peccatoribus, et cum operantibus iniquitatem ne perdas me ; qui loquuntur pacem cum proximo suo, mala autem in cordibus eorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Da illis secundum opera eorum, et secundum nequitiam adinventionum ipsorum. Secundum opera manuum eorum tribue illis ; redde retributionem eorum ipsis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam non intellexerunt opera Domini, et in opera manuum ejus destrues illos, et non ædificabis eos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Benedictus Dominus, quoniam exaudivit vocem deprecationis meæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dominus adjutor meus et protector meus ; in ipso speravit cor meum, et adjutus sum : et refloruit caro mea, et ex voluntate mea confitebor ei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dominus fortitudo plebis suæ, et protector salvationum christi sui est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Salvum fac populum tuum, Domine, et benedic hæreditati tuæ ; et rege eos, et extolle illos usque in æternum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="r y hands to thy holy temple.\"},{\"verse\":3,\"text\":\"Draw me not away together with the wicked; and with the workers of iniquity destroy me not: Who speak peace with their neighbour, but evils are in their hearts.\"},{\"verse\":4,\"text\":\"Give them according to their works, and according to the wickedness of their inventions. According to the works of their hands give thou to them: render to them their reward.\"},{\"verse\":5,\"text\":\"Because they have not understood the works of the Lord, and the operations of his hands: thou shalt destroy them, and shalt not build them up.\"},{\"verse\":6,\"text\":\"Blessed be the Lord, for he hath heard the voice of my supplication.\"},{\"verse\":7,\"text\":\"The Lord is my helper and my protector: in him hath my heart confided, and I have been helped. And my flesh hath flourished again, and with my will I will give praise to him.\"},{\"verse\":8,\"text\":\"The Lord is the strength of his people, and the protector of the salvation of his anointed.\"},{\"verse\":9,\"text\":\"Save, O Lord, thy people, and bless thy inheritance: and rule them and exalt them for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus ipsi David. Ad te, Domine, clamabo ; Deus meus, ne sileas a me : nequando taceas a me, et assimilabor descendentibus in lacum.\"},{\"verse\":2,\"text\":\"Exaudi, Domine, vocem deprecationis meæ dum oro ad te ; dum extollo manus meas ad templum sanctum tuum.\"},{\"verse\":3,\"text\":\"Ne simul trahas me cum peccatoribus, et cum operantibus iniquitatem ne perdas me ; qui loquuntur pacem cum proximo suo, mala autem in cordibus eorum.\"},{\"verse\":4,\"text\":\"Da illis secundum opera eorum, et secundum nequitiam adinventionum ipsorum. Secundum opera manuum eorum tribue illis ; redde retributionem eorum ipsis.\"},{\"verse\":5,\"text\":\"Quoniam non intellexerunt opera Domini, et in opera manuum ejus destrues illos, et non ædificabis eos.\"},{\"verse\":6,\"text\":\"Benedictus Dominus, quoniam exaudivit vocem deprecationis meæ.\"},{\"verse\":7,\"text\":\"Dominus adjutor meus et protector meus ; in ipso speravit cor meum, et adjutus sum : et refloruit caro mea, et ex voluntate mea confitebor ei.\"},{\"verse\":8,\"text\":\"Dominus fortitudo plebis suæ, et protector salvationum christi sui est.\"},{\"verse\":9,\"text\":\"Salvum fac populum tuum, Domine, et benedic hæreditati tuæ ; et rege eos, et extolle illos usque in æternum.\"}],\"summary\":\"Ad te, Domine, clamabo.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":26,\"label\":\"Psalms 26\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":28,\"label\":\"Psalms 28\"}}]]\n"])</script></body></html>
