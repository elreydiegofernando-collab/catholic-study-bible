 trusteth in thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Have mercy on me, O Lord, for I have cried to thee all the day.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Give joy to the soul of thy servant, for to thee, O Lord, I have lifted up my soul.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For thou, O Lord, art sweet and mild: and plenteous in mercy to all that call upon thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Give ear, O Lord, to my prayer: and attend to the voice of my petition.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I have called upon thee in the day of my trouble: because thou hast heard me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>There is none among the gods like unto thee, O Lord: and there is none according to thy works.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>All the nations thou hast made shall come and adore before thee, O Lord: and they shall glorify thy name.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For thou art great and dost wonderful things: thou art God alone.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Conduct me, O Lord, in thy way, and I will walk in thy truth: let my heart rejoice that it may fear thy name.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I will praise thee, O Lord my God, with my whole heart, and I will glorify thy name for ever:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For thy mercy is great towards me: and thou hast delivered my soul out of the lower hell.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>O God, the wicked are risen up against me, and the assembly of the mighty have sought my soul: and they have not set thee before their eyes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou, O Lord, art a God of compassion, and merciful, patient, and of much mercy, and true.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>O look upon me, and have mercy on me: give thy command to thy servant, and save the son of thy handmaid.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Shew me a token for good: that they who hate me may see, and be confounded, because thou, O Lord, hast helped me and hast comforted me.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Oratio ipsi David. Inclina, Domine, aurem tuam et exaudi me, quoniam inops et pauper sum ego.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Custodi animam meam, quoniam sanctus sum ; salvum fac servum tuum, Deus meus, sperantem in te.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Miserere mei, Domine, quoniam ad te clamavi tota die ;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>lætifica animam servi tui, quoniam ad te, Domine, animam meam levavi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam tu, Domine, suavis et mitis, et multæ misericordiæ omnibus invocantibus te.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Auribus percipe, Domine, orationem meam, et intende voci deprecationis meæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In die tribulationis meæ clamavi ad te, quia exaudisti me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non est similis tui in diis, Domine, et non est secundum opera tua.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Omnes gentes quascumque fecisti venient, et adorabunt coram te, Domine, et glorificabunt nomen tuum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam magnus es tu, et faciens mirabilia ; tu es Deus solus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Deduc me, Domine, in via tua, et ingrediar in veritate tua ; lætetur cor meum, ut timeat nomen tuum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Confitebor tibi, Domine Deus meus, in toto corde meo, et glorificabo nomen tuum in æternum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>quia misericordia tua magna est super me, et eruisti animam meam ex inferno inferiori.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Deus, iniqui insurrexerunt super me, et synagoga potentium quæsierunt animam meam : et non proposuerunt te in conspectu suo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et tu, Domine Deus, miserator et misericors ; patiens, et multæ misericordiæ, et verax.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Respice in me, et miserere mei ; da imperium tuum puero tuo, et salvum fac filium ancillæ tuæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fac mecum signum in bonum, ut videant qui oderunt me, et confundantur : quoniam tu, Domine, adjuvisti me, et consolatus es me.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/84/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 84</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/86/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 86</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->85<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Psalms 84" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/84/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w- e\":\"Psalms\",\"chapter\":85,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"A prayer for David himself. Incline thy ear, O Lord, and hear me: for I am needy and poor.\"},{\"verse\":2,\"text\":\"Preserve my soul, for I am holy: save thy servant, O my God, that trusteth in thee.\"},{\"verse\":3,\"text\":\"Have mercy on me, O Lord, for I have cried to thee all the day.\"},{\"verse\":4,\"text\":\"Give joy to the soul of thy servant, for to thee, O Lord, I have lifted up my soul.\"},{\"verse\":5,\"text\":\"For thou, O Lord, art sweet and mild: and plenteous in mercy to all that call upon thee.\"},{\"verse\":6,\"text\":\"Give ear, O Lord, to my prayer: and attend to the voice of my petition.\"},{\"verse\":7,\"text\":\"I have called upon thee in the day of my trouble: because thou hast heard me.\"},{\"verse\":8,\"text\":\"There is none among the gods like unto thee, O Lord: and there is none according to thy works.\"},{\"verse\":9,\"text\":\"All the nations thou hast made shall come and adore before thee, O Lord: and they shall glorify thy name.\"},{\"verse\":10,\"text\":\"For thou art great and dost wonderful things: thou art God alone.\"},{\"verse\":11,\"text\":\"Conduct me, O Lord, in thy way, and I will walk in thy truth: let my heart rejoice that it may fear thy name.\"},{\"verse\":12,\"text\":\"I will praise thee, O Lord my God, with my whole heart, and I will glorify thy name for ever:\"},{\"verse\":13,\"text\":\"For thy mercy is great towards me: and thou hast delivered my soul out of the lower hell.\"},{\"verse\":14,\"text\":\"O God, the wicked are risen up against me, and the assembly of the mighty have sought my soul: and they have not set thee before their eyes.\"},{\"verse\":15,\"text\":\"And thou, O Lord, art a God of compassion, and merciful, patient, and of much mercy, and true.\"},{\"verse\":16,\"text\":\"O look upon me, and have mercy on me: give thy command to thy servant, and save the son of thy handmaid.\"},{\"verse\":17,\"text\":\"Shew me a token for good: that they who hate me may see, and be confounded, because thou, O Lord, hast helped me and hast comforted me.\"}],\"vul\":[{\"verse\":1,\"text\":\"Oratio ipsi David. Inclina, Domine, aurem tuam et exaudi me, quoniam inops et pauper sum ego.\"},{\"verse\":2,\"text\":\"Custodi animam meam, quoniam sanctus sum ; salvum fac servum tuum, Deus meus, sperantem in te.\"},{\"verse\":3,\"text\":\"Miserere mei, Domine, quoniam ad te clamavi tota die ;\"},{\"verse\":4,\"text\":\"lætifica animam servi tui, quoniam ad te, Domine, animam meam levavi.\"},{\"verse\":5,\"text\":\"Quoniam tu, Domine, suavis et mitis, et multæ misericordiæ omnibus invocantibus te.\"},{\"verse\":6,\"text\":\"Auribus percipe, Domine, orationem meam, et intende voci deprecationis meæ.\"},{\"verse\":7,\"text\":\"In die tribulationis meæ clamavi ad te, quia exaudisti me.\"},{\"verse\":8,\"text\":\"Non est similis tui in diis, Domine, et non est secundum opera tua.\"},{\"verse\":9,\"text\":\"Omnes gentes quascumque fecisti venient, et adorabunt coram te, Domine, et glorificabunt nomen tuum.\"},{\"verse\":10,\"text\":\"Quoniam magnus es tu, et faciens mirabilia ; tu es Deus solus.\"},{\"verse\":11,\"text\":\"Deduc me, Domine, in via tua, et ingrediar in veritate tua ; lætetur cor meum, ut timeat nomen tuum.\"},{\"verse\":12,\"text\":\"Confitebor tibi, Domine Deus meus, in toto corde meo, et glorificabo nomen tuum in æternum :\"},{\"verse\":13,\"text\":\"quia misericordia tua magna est super me, et eruisti animam meam ex inferno inferiori.\"},{\"verse\":14,\"text\":\"Deus, iniqui insurrexerunt super me, et synagoga potentium quæsierunt animam meam : et non proposuerunt te in conspectu suo.\"},{\"verse\":15,\"text\":\"Et tu, Domine Deus, miserator et misericors ; patiens, et multæ misericordiæ, et verax.\"},{\"verse\":16,\"text\":\"Respice in me, et miserere mei ; da imperium tuum puero tuo, et salvum fac filium ancillæ tuæ.\"},{\"verse\":17,\"text\":\"Fac mecum signum in bonum, ut videant qui oderunt me, et confundantur : quoniam tu, Domine, adjuvisti me, et consolatus es me.\"}],\"summary\":\"Inclina, Domine.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":84,\"label\":\"Psalms 84\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":86,\"label\":\"Psalms 86\"}}]]\n"])</script></body></html>
