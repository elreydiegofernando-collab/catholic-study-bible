" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The sea saw and fled: Jordan was turned back.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The mountains skipped like rams, and the hills like the lambs of the flock.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>What ailed thee, O thou sea, that thou didst flee: and thou, O Jordan, that thou wast turned back?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ye mountains, that ye skipped like rams, and ye hills, like lambs of the flock?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>At the presence of the Lord the earth was moved, at the presence of the God of Jacob:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who turned the rock into pools of water, and the stony hill into fountains of waters.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Not to us, O Lord, not to us; but to thy name give glory.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For thy mercy, and for thy truth’s sake: lest the Gentiles should say: Where is their God?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But our God is in heaven: he hath done all things whatsoever he would.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The idols of the Gentiles are silver and gold, the works of the hands of men.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They have mouths and speak not: they have eyes and see not.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They have ears and hear not: they have noses and smell not.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They have hands and feel not: they have feet and walk not: neither shall they cry out through their throat.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let them that make them become like unto them: and all such as trust in them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The house of Israel hath hoped in the Lord: he is their helper and their protector.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The house of Aaron hath hoped in the Lord: he is their helper and their protector.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They that fear the Lord have hoped in the Lord: he is their helper and their protector.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The Lord hath been mindful of us, and hath blessed us. He hath blessed the house of Israel: he hath blessed the house of Aaron.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He hath blessed all that fear the Lord, both little and great.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>May the Lord add blessings upon you: upon you, and upon your children.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Blessed be you of the Lord, who made heaven and earth.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The heaven of heaven is the Lord’s: but the earth he has given to the children of men.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The dead shall not praise thee, O Lord: nor any of them that go down to hell.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But we that live bless the Lord: from this time now and for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. In exitu Israël de Ægypto, domus Jacob de populo barbaro,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>facta est Judæa sanctificatio ejus ; Israël potestas ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Mare vidit, et fugit ; Jordanis conversus est retrorsum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Montes exsultaverunt ut arietes, et colles sicut agni ovium.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quid est tibi, mare, quod fugisti ? et tu, Jordanis, quia conversus es retrorsum ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>montes, exsultastis sicut arietes ? et colles, sicut agni ovium ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>A facie Domini mota est terra, a facie Dei Jacob :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui convertit petram in stagna aquarum, et rupem in fontes aquarum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non nobis, Domine, non nobis, sed nomini tuo da gloriam :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>super misericordia tua et veritate tua ; nequando dicant gentes : Ubi est Deus eorum ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Deus autem noster in cælo ; omnia quæcumque voluit fecit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Simulacra gentium argentum et aurum, opera manuum hominum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Os habent, et non loquentur ; oculos habent, et non videbunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Aures habent, et non audient ; nares habent, et non odorabunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Manus habent, et non palpabunt ; pedes habent, et non ambulabunt ; non clamabunt in gutture suo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Similes illis fiant qui faciunt ea, et omnes qui confidunt in eis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Domus Israël speravit in Domino ; adjutor eorum et protector eorum est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Domus Aaron speravit in Domino ; adjutor eorum et protector eorum est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui timent Dominum speraverunt in Domino ; adjutor eorum et protector eorum est.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dominus memor fuit nostri, et benedixit nobis. Benedixit domui Israël ; benedixit domui Aaron.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Benedixit omnibus qui timent Dominum, pusillis cum majoribus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Adjiciat Dominus super vos, super vos et super filios vestros.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Benedicti vos a Domino, qui fecit cælum et terram.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Cælum cæli Domino ; terram autem dedit filiis hominum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Non mortui laudabunt te, Domine, neque omnes qui descendunt in infernum :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>sed nos qui vivimus, benedicimus Domino, ex hoc nunc et usque in sæculum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/112/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 112</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/114/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 114</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->113<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3" con.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.113\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":113,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"When Israel went out of Egypt, the house of Jacob from a barbarous people:\"},{\"verse\":2,\"text\":\"Judea was made his sanctuary, Israel his dominion.\"},{\"verse\":3,\"text\":\"The sea saw and fled: Jordan was turned back.\"},{\"verse\":4,\"text\":\"The mountains skipped like rams, and the hills like the lambs of the flock.\"},{\"verse\":5,\"text\":\"What ailed thee, O thou sea, that thou didst flee: and thou, O Jordan, that thou wast turned back?\"},{\"verse\":6,\"text\":\"Ye mountains, that ye skipped like rams, and ye hills, like lambs of the flock?\"},{\"verse\":7,\"text\":\"At the presence of the Lord the earth was moved, at the presence of the God of Jacob:\"},{\"verse\":8,\"text\":\"Who turned the rock into pools of water, and the stony hill into fountains of waters.\"},{\"verse\":9,\"text\":\"Not to us, O Lord, not to us; but to thy name give glory.\"},{\"verse\":10,\"text\":\"For thy mercy, and for thy truth’s sake: lest the Gentiles should say: Where is their God?\"},{\"verse\":11,\"text\":\"But our God is in heaven: he hath done all things whatsoever he would.\"},{\"verse\":12,\"text\":\"The idols of the Gentiles are silver and gold, the works of the hands of men.\"},{\"verse\":13,\"text\":\"They have mouths and speak not: they have eyes and see not.\"},{\"verse\":14,\"text\":\"They have ears and hear not: they have noses and smell not.\"},{\"verse\":15,\"text\":\"They have hands and feel not: they have feet and walk not: neither shall they cry out through their throat.\"},{\"verse\":16,\"text\":\"Let them that make them become like unto them: and all such as trust in them.\"},{\"verse\":17,\"text\":\"The house of Israel hath hoped in the Lord: he is their helper and their protector.\"},{\"verse\":18,\"text\":\"The house of Aaron hath hoped in the Lord: he is their helper and their protector.\"},{\"verse\":19,\"text\":\"They that fear the Lord have hoped in the Lord: he is their helper and their protector.\"},{\"verse\":20,\"text\":\"The Lord hath been mindful of us, and hath blessed us. He hath blessed the house of Israel: he hath blessed the house of Aaron.\"},{\"verse\":21,\"text\":\"He hath blessed all that fear the Lord, both little and great.\"},{\"verse\":22,\"text\":\"May the Lord add blessings upon you: upon you, and upon your children.\"},{\"verse\":23,\"text\":\"Blessed be you of the Lord, who made heaven and earth.\"},{\"verse\":24,\"text\":\"The heaven of heaven is the Lord’s: but the earth he has given to the children of men.\"},{\"verse\":25,\"text\":\"The dead shall not praise thee, O Lord: nor any of them that go down to hell.\"},{\"verse\":26,\"text\":\"But we that live bless the Lord: from this time now and for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. In exitu Israël de Ægypto, domus Jacob de populo barbaro,\"},{\"verse\":2,\"text\":\"facta est Judæa sanctificatio ejus ; Israël potestas ejus.\"},{\"verse\":3,\"text\":\"Mare vidit, et fugit ; Jordanis conversus est retrorsum.\"},{\"verse\":4,\"text\":\"Montes exsultaverunt ut arietes, et colles sicut agni ovium.\"},{\"verse\":5,\"text\":\"Quid est tibi, mare, quod fugisti ? et tu, Jordanis, quia conversus es retrorsum ?\"},{\"verse\":6,\"text\":\"montes, exsultastis sicut arietes ? et colles, sicut agni ovium ?\"},{\"verse\":7,\"text\":\"A facie Domini mota est terra, a facie Dei Jacob :\"},{\"verse\":8,\"text\":\"qui convertit petram in stagna aquarum, et rupem in fontes aquarum.\"},{\"verse\":9,\"text\":\"Non nobis, Domine, non nobis, sed nomini tuo da gloriam :\"},{\"verse\":10,\"text\":\"super misericordia tua et veritate tua ; nequando dicant gentes : Ubi est Deus eorum ?\"},{\"verse\":11,\"text\":\"Deus autem noster in cælo ; omnia quæcumque voluit fecit.\"},{\"verse\":12,\"text\":\"Simulacra gentium argentum et aurum, opera manuum hominum.\"},{\"verse\":13,\"text\":\"Os habent, et non loquentur ; oculos habent, et non videbunt.\"},{\"verse\":14,\"text\":\"Aures habent, et non audient ; nares habent, et non odorabunt.\"},{\"verse\":15,\"text\":\"Manus habent, et non palpabunt ; pedes habent, et non ambulabunt ; non clamabunt in gutture suo.\"},{\"verse\":16,\"text\":\"Similes illis fiant qui faciunt ea, et omnes qui confidunt in eis.\"},{\"verse\":17,\"text\":\"Domus Israël speravit in Domino ; adjutor eorum et protector eorum est.\"},{\"verse\":18,\"text\":\"Domus Aaron speravit in Domino ; adjutor eorum et protector eorum est.\"},{\"verse\":19,\"text\":\"Qui timent Dominum speraverunt in Domino ; adjutor eorum et protector eorum est.\"},{\"verse\":20,\"text\":\"Dominus memor fuit nostri, et benedixit nobis. Benedixit domui Israël ; benedixit domui Aaron.\"},{\"verse\":21,\"text\":\"Benedixit omnibus qui timent Dominum, pusillis cum majoribus.\"},{\"verse\":22,\"text\":\"Adjiciat Dominus super vos, super vos et super filios vestros.\"},{\"verse\":23,\"text\":\"Benedicti vos a Domino, qui fecit cælum et terram.\"},{\"verse\":24,\"text\":\"Cælum cæli Domino ; terram autem dedit filiis hominum.\"},{\"verse\":25,\"text\":\"Non mortui laudabunt te, Domine, neque omnes qui descendunt in infernum :\"},{\"verse\":26,\"text\":\"sed nos qui vivimus, benedicimus Domino, ex hoc nunc et usque in sæculum.\"}],\"summary\":\"In exitu Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":112,\"label\":\"Psalms 112\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":114,\"label\":\"Psalms 114\"}}]]\n"])</script></body></html>
