<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Psalms 88 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">88</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Misericordias Domini.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Of understanding, for Ethan the Ezrahite.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The mercies of the Lord I will sing for ever. I will shew forth thy truth with my mouth to generation and generation.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For thou hast said: Mercy shall be built up for ever in the heavens: thy truth shall be prepared in them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I have made a covenant with my elect: I have sworn to David my servant:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thy seed will I settle for ever. And I will build up thy throne unto generation and generation.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The heavens shall confess thy wonders, O Lord: and thy truth in the church of the saints.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For who in the clouds can be compared to the Lord: or who among the sons of God shall be like to God?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>God, who is glorified in the assembly of the saints: great and terrible above all them that are about him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>O Lord God of hosts, who is like to thee? thou art mighty, O Lord, and thy truth is round about thee.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou rulest the power of the sea: and appeasest the motion of the waves thereof.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou hast humbled the proud one, as one that is slain: with the arm of thy strength thou hast scattered thy enemies.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thine are the heavens, and thine is the earth: the world and the fulness thereof thou hast founded:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The north and the sea thou hast created. Thabor and Hermon shall rejoice in thy name:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thy arm is with might. Let thy hand be strengthened, and thy right hand exalted:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Justice and judgment are the preparation of thy throne. Mercy and truth shall go before thy face:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Blessed is the people that knoweth jubilation. They shall walk, O Lord, in the light of thy countenance:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And in thy name they shall rejoice all the day, and in thy justice they shall be exalted.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For thou art the glory of their strength: and in thy good pleasure shall our horn be exalted.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For our protection is of the Lord, and of our king the holy one of Israel.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Then thou spokest in a vision to thy saints, and saidst: I have laid help upon one that is mighty, and have exalted one chosen out of my people.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I have found David my servant: with my holy oil I have anointed him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For my hand shall help him: and my arm shall strengthen him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The enemy shall have no advantage over him: nor the son of iniquity have power to hurt him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And I will cut down his enemies before his face; and them that hate him I will put to flight.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And my truth and my mercy shall be with him: and in my name shall his horn be exalted.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And I will set his hand in the sea; and his right hand in the rivers.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He shall cry out to me: Thou art my father: my God, and the support of my salvation.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And I will make him my firstborn, high above the kings of the earth.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>I will keep my mercy for him for ever: and my covenant faithful to him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And I will make his seed to endure for evermore: and his throne as the days of heaven.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And if his children forsake my law, and walk not in my judgments:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>If they profane my justices: and keep not my commandments:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>I will visit their iniquities with a rod and their sins with stripes.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But my mercy I will not take away from him: nor will I suffer my truth to fail.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Neither will I profane my covenant: and the words that proceed from my mouth I will not make void.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Once have I sworn by my holiness: I will not lie unto David:</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>His seed shall endure for ever.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And his throne as the sun before me: and as the moon perfect for ever, and a faithful witness in heaven.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>But thou hast rejected and despised: thou hast been angry with my anointed.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Thou hast overthrown the covenant of thy servant: thou hast profaned his sanctuary on the earth.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Thou hast broken down all his hedges: thou hast made his strength fear.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>All that pass by the way have robbed him: he is become a reproach to his neighbours.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Thou hast set up the right hand of them that oppress him: thou hast made all his enemies to rejoice.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Thou hast turned away the help of his sword; and hast not assisted him in battle.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Thou hast made his purification to cease: and thou hast cast his throne down to the ground.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Thou hast shortened the days of his time: thou hast covered him with confusion.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>How long, O Lord, turnest thou away unto the end? shall thy anger burn like fire?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Remember what my substance is: for hast thou made all the children of men in vain?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Who is the man that shall live, and not see death: that shall deliver his soul from the hand of hell?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Lord, where are thy ancient mercies, according to what thou didst swear to David in thy truth?</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Be mindful, O Lord, of the reproach of thy servants (which I have held in my bosom) of many nations:</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Wherewith thy enemies have reproached, O Lord; wherewith they have reproached the change of thy anointed.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Blessed be the Lord for evermore. So be it. So be it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Intellectus Ethan Ezrahitæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Misericordias Domini in æternum cantabo ; in generationem et generationem annuntiabo veritatem tuam in ore meo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quoniam dixisti : In æternum misericordia ædificabitur in cælis ; præparabitur veritas tua in eis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Disposui testamentum electis meis ; juravi David servo meo :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Usque in æternum præparabo semen tuum, et ædificabo in generationem et generationem sedem tuam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Confitebuntur cæli mirabilia tua, Domine ; etenim veritatem tuam in ecclesia sanctorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quoniam quis in nubibus æquabitur Domino ; similis erit Deo in filiis Dei ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Deus, qui glorificatur in consilio sanctorum, magnus et terribilis super omnes qui in circuitu ejus sunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Domine Deus virtutum, quis similis tibi ? potens es, Domine, et veritas tua in circuitu tuo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Tu dominaris potestati maris ; motum autem fluctuum ejus tu mitigas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Tu humiliasti, sicut vulneratum, superbum ; in brachio virtutis tuæ dispersisti inimicos tuos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tui sunt cæli, et tua est terra : orbem terræ, et plenitudinem ejus tu fundasti ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>aquilonem et mare tu creasti. Thabor et Hermon in nomine tuo exsultabunt :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>tuum brachium cum potentia. Firmetur manus tua, et exaltetur dextera tua :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>justitia et judicium præparatio sedis tuæ : misericordia et veritas præcedent faciem tuam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Beatus populus qui scit jubilationem : Domine, in lumine vultus tui ambulabunt,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et in nomine tuo exsultabunt tota die, et in justitia tua exaltabuntur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quoniam gloria virtutis eorum tu es, et in beneplacito tuo exaltabitur cornu nostrum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quia Domini est assumptio nostra, et sancti Israël regis nostri.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tunc locutus es in visione sanctis tuis, et dixisti : Posui adjutorium in potente, et exaltavi electum de plebe mea.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Inveni David, servum meum ; oleo sancto meo unxi eum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Manus enim mea auxiliabitur ei, et brachium meum confortabit eum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Nihil proficiet inimicus in eo, et filius iniquitatis non apponet nocere ei.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et concidam a facie ipsius inimicos ejus, et odientes eum in fugam convertam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et veritas mea et misericordia mea cum ipso, et in nomine meo exaltabitur cornu ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et ponam in mari manum ejus, et in fluminibus dexteram ejus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ipse invocabit me : Pater meus es tu, Deus meus, et susceptor salutis meæ.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et ego primogenitum ponam illum, excelsum præ regibus terræ.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>In æternum servabo illi misericordiam meam, et testamentum meum fidele ipsi.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ponam in sæculum sæculi semen ejus, et thronum ejus sicut dies cæli.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si autem dereliquerint filii ejus legem meam, et in judiciis meis non ambulaverint ;</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>si justitias meas profanaverint, et mandata mea non custodierint :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>visitabo in virga iniquitates eorum, et in verberibus peccata eorum ;</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>misericordiam autem meam non dispergam ab eo, neque nocebo in veritate mea,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>neque profanabo testamentum meum : et quæ procedunt de labiis meis non faciam irrita.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Semel juravi in sancto meo, si David mentiar :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>semen ejus in æternum manebit. Et thronus ejus sicut sol in conspectu meo,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et sicut luna perfecta in æternum, et testis in cælo fidelis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Tu vero repulisti et despexisti ; distulisti christum tuum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Evertisti testamentum servi tui ; profanasti in terra sanctuarium ejus.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Destruxisti omnes sepes ejus ; posuisti firmamentum ejus formidinem.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Diripuerunt eum omnes transeuntes viam ; factus est opprobrium vicinis suis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Exaltasti dexteram deprimentium eum ; lætificasti omnes inimicos ejus.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Avertisti adjutorium gladii ejus, et non es auxiliatus ei in bello.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Destruxisti eum ab emundatione, et sedem ejus in terram collisisti.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Minorasti dies temporis ejus ; perfudisti eum confusione.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Usquequo, Domine, avertis in finem ? exardescet sicut ignis ira tua ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Memorare quæ mea substantia : numquid enim vane constituisti omnes filios hominum ?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Quis est homo qui vivet et non videbit mortem ? eruet animam suam de manu inferi ?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Ubi sunt misericordiæ tuæ antiquæ, Domine, sicut jurasti David in veritate tua ?</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Memor esto, Domine, opprobrii servorum tuorum, quod continui in sinu meo, multarum gentium :</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>quod exprobraverunt inimici tui, Domine ; quod exprobraverunt commutationem christi tui.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Benedictus Dominus in æternum. Fiat, fiat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/87/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 87</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/89/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 89</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->88<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Psalms 87" class="inline-flex h-12 w-14 shrink-0 items-center justif </script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.88\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":88,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Of understanding, for Ethan the Ezrahite.\"},{\"verse\":2,\"text\":\"The mercies of the Lord I will sing for ever. I will shew forth thy truth with my mouth to generation and generation.\"},{\"verse\":3,\"text\":\"For thou hast said: Mercy shall be built up for ever in the heavens: thy truth shall be prepared in them.\"},{\"verse\":4,\"text\":\"I have made a covenant with my elect: I have sworn to David my servant:\"},{\"verse\":5,\"text\":\"Thy seed will I settle for ever. And I will build up thy throne unto generation and generation.\"},{\"verse\":6,\"text\":\"The heavens shall confess thy wonders, O Lord: and thy truth in the church of the saints.\"},{\"verse\":7,\"text\":\"For who in the clouds can be compared to the Lord: or who among the sons of God shall be like to God?\"},{\"verse\":8,\"text\":\"God, who is glorified in the assembly of the saints: great and terrible above all them that are about him.\"},{\"verse\":9,\"text\":\"O Lord God of hosts, who is like to thee? thou art mighty, O Lord, and thy truth is round about thee.\"},{\"verse\":10,\"text\":\"Thou rulest the power of the sea: and appeasest the motion of the waves thereof.\"},{\"verse\":11,\"text\":\"Thou hast humbled the proud one, as one that is slain: with the arm of thy strength thou hast scattered thy enemies.\"},{\"verse\":12,\"text\":\"Thine are the heavens, and thine is the earth: the world and the fulness thereof thou hast founded:\"},{\"verse\":13,\"text\":\"The north and the sea thou hast created. Thabor and Hermon shall rejoice in thy name:\"},{\"verse\":14,\"text\":\"Thy arm is with might. Let thy hand be strengthened, and thy right hand exalted:\"},{\"verse\":15,\"text\":\"Justice and judgment are the preparation of thy throne. Mercy and truth shall go before thy face:\"},{\"verse\":16,\"text\":\"Blessed is the people that knoweth jubilation. They shall walk, O Lord, in the light of thy countenance:\"},{\"verse\":17,\"text\":\"And in thy name they shall rejoice all the day, and in thy justice they shall be exalted.\"},{\"verse\":18,\"text\":\"For thou art the glory of their strength: and in thy good pleasure shall our horn be exalted.\"},{\"verse\":19,\"text\":\"For our protection is of the Lord, and of our king the holy one of Israel.\"},{\"verse\":20,\"text\":\"Then thou spokest in a vision to thy saints, and saidst: I have laid help upon one that is mighty, and have exalted one chosen out of my people.\"},{\"verse\":21,\"text\":\"I have found David my servant: with my holy oil I have anointed him.\"},{\"verse\":22,\"text\":\"For my hand shall help him: and my arm shall strengthen him.\"},{\"verse\":23,\"text\":\"The enemy shall have no advantage over him: nor the son of iniquity have power to hurt him.\"},{\"verse\":24,\"text\":\"And I will cut down his enemies before his face; and them that hate him I will put to flight.\"},{\"verse\":25,\"text\":\"And my truth and my mercy shall be with him: and in my name shall his horn be exalted.\"},{\"verse\":26,\"text\":\"And I will set his hand in the sea; and his right hand in the rivers.\"},{\"verse\":27,\"text\":\"He shall cry out to me: Thou art my father: my God, and the support of my salvation.\"},{\"verse\":28,\"text\":\"And I will make him my firstborn, high above the kings of the earth.\"},{\"verse\":29,\"text\":\"I will keep my mercy for him for ever: and my covenant faithful to him.\"},{\"verse\":30,\"text\":\"And I will make his seed to endure for evermore: and his throne as the days of heaven.\"},{\"verse\":31,\"text\":\"And if his children forsake my law, and walk not in my judgments:\"},{\"verse\":32,\"text\":\"If they profane my justices: and keep not my commandments:\"},{\"verse\":33,\"text\":\"I will visit their iniquities with a rod and their sins with stripes.\"},{\"verse\":34,\"text\":\"But my mercy I will not take away from him: nor will I suffer my truth to fail.\"},{\"verse\":35,\"text\":\"Neither will I profane my covenant: and the words that proceed from my mouth I will not make void.\"},{\"verse\":36,\"text\":\"Once have I sworn by my holiness: I will not lie unto David:\"},{\"verse\":37,\"text\":\"His seed shall endure for ever.\"},{\"verse\":38,\"text\":\"And his throne as the sun before me: and as the moon perfect for ever, and a faithful witness in heaven.\"},{\"verse\":39,\"text\":\"But thou hast rejected and despised: thou hast been angry with my anointed.\"},{\"verse\":40,\"text\":\"Thou hast overthrown the covenant of thy servant: thou hast profaned his sanctuary on the earth.\"},{\"verse\":41,\"text\":\"Thou hast broken down all his hedges: thou hast made his strength fear.\"},{\"verse\":42,\"text\":\"All that pass by the way have robbed him: he is become a reproach to his neighbours.\"},{\"verse\":43,\"text\":\"Thou hast set up the right hand of them that oppress him: thou hast made all his enemies to rejoice.\"},{\"verse\":44,\"text\":\"Thou hast turned away the help of his sword; and hast not assisted him in battle.\"},{\"verse\":45,\"text\":\"Thou hast made his purification to cease: and thou hast cast his throne down to the ground.\"},{\"verse\":46,\"text\":\"Thou hast shortened the days of his time: thou hast covered him with confusion.\"},{\"verse\":47,\"text\":\"How long, O Lord, turnest thou away unto the end? shall thy anger burn like fire?\"},{\"verse\":48,\"text\":\"Remember what my substance is: for hast thou made all the children of men in vain?\"},{\"verse\":49,\"text\":\"Who is the man that shall live, and not see death: that shall deliver his soul from the hand of hell?\"},{\"verse\":50,\"text\":\"Lord, where are thy ancient mercies, according to what thou didst swear to David in thy truth?\"},{\"verse\":51,\"text\":\"Be mindful, O Lord, of the reproach of thy servants (which I have held in my bosom) of many nations:\"},{\"verse\":52,\"text\":\"Wherewith thy enemies have reproached, O Lord; wherewith they have reproached the change of thy anointed.\"},{\"verse\":53,\"text\":\"Blessed be the Lord for evermore. So be it. So be it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Intellectus Ethan Ezrahitæ.\"},{\"verse\":2,\"text\":\"Misericordias Domini in æternum cantabo ; in generationem et generationem annuntiabo veritatem tuam in ore meo.\"},{\"verse\":3,\"text\":\"Quoniam dixisti : In æternum misericordia ædificabitur in cælis ; præparabitur veritas tua in eis.\"},{\"verse\":4,\"text\":\"Disposui testamentum electis meis ; juravi David servo meo :\"},{\"verse\":5,\"text\":\"Usque in æternum præparabo semen tuum, et ædificabo in generationem et generationem sedem tuam.\"},{\"verse\":6,\"text\":\"Confitebuntur cæli mirabilia tua, Domine ; etenim veritatem tuam in ecclesia sanctorum.\"},{\"verse\":7,\"text\":\"Quoniam quis in nubibus æquabitur Domino ; similis erit Deo in filiis Dei ?\"},{\"verse\":8,\"text\":\"Deus, qui glorificatur in consilio sanctorum, magnus et terribilis super omnes qui in circuitu ejus sunt.\"},{\"verse\":9,\"text\":\"Domine Deus virtutum, quis similis tibi ? potens es, Domine, et veritas tua in circuitu tuo.\"},{\"verse\":10,\"text\":\"Tu dominaris potestati maris ; motum autem fluctuum ejus tu mitigas.\"},{\"verse\":11,\"text\":\"Tu humiliasti, sicut vulneratum, superbum ; in brachio virtutis tuæ dispersisti inimicos tuos.\"},{\"verse\":12,\"text\":\"Tui sunt cæli, et tua est terra : orbem terræ, et plenitudinem ejus tu fundasti ;\"},{\"verse\":13,\"text\":\"aquilonem et mare tu creasti. Thabor et Hermon in nomine tuo exsultabunt :\"},{\"verse\":14,\"text\":\"tuum brachium cum potentia. Firmetur manus tua, et exaltetur dextera tua :\"},{\"verse\":15,\"text\":\"justitia et judicium præparatio sedis tuæ : misericordia et veritas præcedent faciem tuam.\"},{\"verse\":16,\"text\":\"Beatus populus qui scit jubilationem : Domine, in lumine vultus tui ambulabunt,\"},{\"verse\":17,\"text\":\"et in nomine tuo exsultabunt tota die, et in justitia tua exaltabuntur.\"},{\"verse\":18,\"text\":\"Quoniam gloria virtutis eorum tu es, et in beneplacito tuo exaltabitur cornu nostrum.\"},{\"verse\":19,\"text\":\"Quia Domini est assumptio nostra, et sancti Israël regis nostri.\"},{\"verse\":20,\"text\":\"Tunc locutus es in visione sanctis tuis, et dixisti : Posui adjutorium in potente, et exaltavi electum de plebe mea.\"},{\"verse\":21,\"text\":\"Inveni David, servum meum ; oleo sancto meo unxi eum.\"},{\"verse\":22,\"text\":\"Manus enim mea auxiliabitur ei, et brachium meum confortabit eum.\"},{\"verse\":23,\"text\":\"Nihil proficiet inimicus in eo, et filius iniquitatis non apponet nocere ei.\"},{\"verse\":24,\"text\":\"Et concidam a facie ipsius inimicos ejus, et odientes eum in fugam convertam.\"},{\"verse\":25,\"text\":\"Et veritas mea et misericordia mea cum ipso, et in nomine meo exaltabitur cornu ejus.\"},{\"verse\":26,\"text\":\"Et ponam in mari manum ejus, et in fluminibus dexteram ejus.\"},{\"verse\":27,\"text\":\"Ipse invocabit me : Pater meus es tu, Deus meus, et susceptor salutis meæ.\"},{\"verse\":28,\"text\":\"Et ego primogenitum ponam illum, excelsum præ regibus terræ.\"},{\"verse\":29,\"text\":\"In æternum servabo illi misericordiam meam, et testamentum meum fidele ipsi.\"},{\"verse\":30,\"text\":\"Et ponam in sæculum sæculi semen ejus, et thronum ejus sicut dies cæli.\"},{\"verse\":31,\"text\":\"Si autem dereliquerint filii ejus legem meam, et in judiciis meis non ambulaverint ;\"},{\"verse\":32,\"text\":\"si justitias meas profanaverint, et mandata mea non custodierint :\"},{\"verse\":33,\"text\":\"visitabo in virga iniquitates eorum, et in verberibus peccata eorum ;\"},{\"verse\":34,\"text\":\"misericordiam autem meam non dispergam ab eo, neque nocebo in veritate mea,\"},{\"verse\":35,\"text\":\"neque profanabo testamentum meum : et quæ procedunt de labiis meis non faciam irrita.\"},{\"verse\":36,\"text\":\"Semel juravi in sancto meo, si David mentiar :\"},{\"verse\":37,\"text\":\"semen ejus in æternum manebit. Et thronus ejus sicut sol in conspectu meo,\"},{\"verse\":38,\"text\":\"et sicut luna perfecta in æternum, et testis in cælo fidelis.\"},{\"verse\":39,\"text\":\"Tu vero repulisti et despexisti ; distulisti christum tuum.\"},{\"verse\":40,\"text\":\"Evertisti testamentum servi tui ; profanasti in terra sanctuarium ejus.\"},{\"verse\":41,\"text\":\"Destruxisti omnes sepes ejus ; posuisti firmamentum ejus formidinem.\"},{\"verse\":42,\"text\":\"Diripuerunt eum omnes transeuntes viam ; factus est opprobrium vicinis suis.\"},{\"verse\":43,\"text\":\"Exaltasti dexteram deprimentium eum ; lætificasti omnes inimicos ejus.\"},{\"verse\":44,\"text\":\"Avertisti adjutorium gladii ejus, et non es auxiliatus ei in bello.\"},{\"verse\":45,\"text\":\"Destruxisti eum ab emundatione, et sedem ejus in terram collisisti.\"},{\"verse\":46,\"text\":\"Minorasti dies temporis ejus ; perfudisti eum confusione.\"},{\"verse\":47,\"text\":\"Usquequo, Domine, avertis in finem ? exardescet sicut ignis ira tua ?\"},{\"verse\":48,\"text\":\"Memorare quæ mea substantia : numquid enim vane constituisti omnes filios hominum ?\"},{\"verse\":49,\"text\":\"Quis est homo qui vivet et non videbit mortem ? eruet animam suam de manu inferi ?\"},{\"verse\":50,\"text\":\"Ubi sunt misericordiæ tuæ antiquæ, Domine, sicut jurasti David in veritate tua ?\"},{\"verse\":51,\"text\":\"Memor esto, Domine, opprobrii servorum tuorum, quod continui in sinu meo, multarum gentium :\"},{\"verse\":52,\"text\":\"quod exprobraverunt inimici tui, Domine ; quod exprobraverunt commutationem christi tui.\"},{\"verse\":53,\"text\":\"Benedictus Dominus in æternum. Fiat, fiat.\"}],\"summary\":\"Misericordias Domini.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":87,\"label\":\"Psalms 87\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":89,\"label\":\"Psalms 89\"}}]]\n"])</script></body></html>
