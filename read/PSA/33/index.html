on" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For David, when he changed his countenance before Achimelech, who dismissed him, and he went his way. [1 Kings 21.]</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will bless the Lord at all times, his praise shall be always in my mouth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In the Lord shall my soul be praised: let the meek hear and rejoice.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O magnify the Lord with me; and let us extol his name together.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I sought the Lord, and he heard me; and he delivered me from all my troubles.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Come ye to him and be enlightened: and your faces shall not be confounded.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>This poor man cried, and the Lord heard him: and saved him out of all his troubles.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The angel of the Lord shall encamp round about them that fear him: and shall deliver them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>O taste, and see that the Lord is sweet: blessed is the man that hopeth in him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fear the Lord, all ye his saints: for there is no want to them that fear him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The rich have wanted, and have suffered hunger: but they that seek the Lord shall not be deprived of any good.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Come, children, hearken to me: I will teach you the fear of the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who is the man that desireth life: who loveth to see good days?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Keep thy tongue from evil, and thy lips from speaking guile.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Turn away from evil and do good: seek after peace and pursue it.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The eyes of the Lord are upon the just: and his ears unto their prayers.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But the countenance of the Lord is against them that do evil things: to cut off the remembrance of them from the earth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The just cried, and the Lord heard them: and delivered them out of all their troubles.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Many are the afflictions of the just; but out of them all will the Lord deliver them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The Lord keepeth all their bones, not one of them shall be broken.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The death of the wicked is very evil: and they that hate the just shall be guilty.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The Lord will redeem the souls of his servants: and none of them that trust in him shall offend.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Davidi, cum immutavit vultum suum coram Achimelech, et dimisit eum, et abiit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Benedicam Dominum in omni tempore ; semper laus ejus in ore meo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In Domino laudabitur anima mea : audiant mansueti, et lætentur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Magnificate Dominum mecum, et exaltemus nomen ejus in idipsum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Exquisivi Dominum, et exaudivit me ; et ex omnibus tribulationibus meis eripuit me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Accedite ad eum, et illuminamini ; et facies vestræ non confundentur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Iste pauper clamavit, et Dominus exaudivit eum, et de omnibus tribulationibus ejus salvavit eum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Immittet angelus Domini in circuitu timentium eum, et eripiet eos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Gustate et videte quoniam suavis est Dominus ; beatus vir qui sperat in eo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Timete Dominum, omnes sancti ejus, quoniam non est inopia timentibus eum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Divites eguerunt, et esurierunt ; inquirentes autem Dominum non minuentur omni bono.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Venite, filii ; audite me : timorem Domini docebo vos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quis est homo qui vult vitam ; diligit dies videre bonos ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Prohibe linguam tuam a malo, et labia tua ne loquantur dolum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Diverte a malo, et fac bonum ; inquire pacem, et persequere eam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Oculi Domini super justos, et aures ejus in preces eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vultus autem Domini super facientes mala, ut perdat de terra memoriam eorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Clamaverunt justi, et Dominus exaudivit eos ; et ex omnibus tribulationibus eorum liberavit eos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Juxta est Dominus iis qui tribulato sunt corde, et humiles spiritu salvabit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Multæ tribulationes justorum ; et de omnibus his liberabit eos Dominus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Custodit Dominus omnia ossa eorum : unum ex his non conteretur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Mors peccatorum pessima ; et qui oderunt justum delinquent.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Redimet Dominus animas servorum suorum, et non delinquent omnes qui sperant in eo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a c lk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.33\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":33,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"For David, when he changed his countenance before Achimelech, who dismissed him, and he went his way. [1 Kings 21.]\"},{\"verse\":2,\"text\":\"I will bless the Lord at all times, his praise shall be always in my mouth.\"},{\"verse\":3,\"text\":\"In the Lord shall my soul be praised: let the meek hear and rejoice.\"},{\"verse\":4,\"text\":\"O magnify the Lord with me; and let us extol his name together.\"},{\"verse\":5,\"text\":\"I sought the Lord, and he heard me; and he delivered me from all my troubles.\"},{\"verse\":6,\"text\":\"Come ye to him and be enlightened: and your faces shall not be confounded.\"},{\"verse\":7,\"text\":\"This poor man cried, and the Lord heard him: and saved him out of all his troubles.\"},{\"verse\":8,\"text\":\"The angel of the Lord shall encamp round about them that fear him: and shall deliver them.\"},{\"verse\":9,\"text\":\"O taste, and see that the Lord is sweet: blessed is the man that hopeth in him.\"},{\"verse\":10,\"text\":\"Fear the Lord, all ye his saints: for there is no want to them that fear him.\"},{\"verse\":11,\"text\":\"The rich have wanted, and have suffered hunger: but they that seek the Lord shall not be deprived of any good.\"},{\"verse\":12,\"text\":\"Come, children, hearken to me: I will teach you the fear of the Lord.\"},{\"verse\":13,\"text\":\"Who is the man that desireth life: who loveth to see good days?\"},{\"verse\":14,\"text\":\"Keep thy tongue from evil, and thy lips from speaking guile.\"},{\"verse\":15,\"text\":\"Turn away from evil and do good: seek after peace and pursue it.\"},{\"verse\":16,\"text\":\"The eyes of the Lord are upon the just: and his ears unto their prayers.\"},{\"verse\":17,\"text\":\"But the countenance of the Lord is against them that do evil things: to cut off the remembrance of them from the earth.\"},{\"verse\":18,\"text\":\"The just cried, and the Lord heard them: and delivered them out of all their troubles.\"},{\"verse\":19,\"text\":\"The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.\"},{\"verse\":20,\"text\":\"Many are the afflictions of the just; but out of them all will the Lord deliver them.\"},{\"verse\":21,\"text\":\"The Lord keepeth all their bones, not one of them shall be broken.\"},{\"verse\":22,\"text\":\"The death of the wicked is very evil: and they that hate the just shall be guilty.\"},{\"verse\":23,\"text\":\"The Lord will redeem the souls of his servants: and none of them that trust in him shall offend.\"}],\"vul\":[{\"verse\":1,\"text\":\"Davidi, cum immutavit vultum suum coram Achimelech, et dimisit eum, et abiit.\"},{\"verse\":2,\"text\":\"Benedicam Dominum in omni tempore ; semper laus ejus in ore meo.\"},{\"verse\":3,\"text\":\"In Domino laudabitur anima mea : audiant mansueti, et lætentur.\"},{\"verse\":4,\"text\":\"Magnificate Dominum mecum, et exaltemus nomen ejus in idipsum.\"},{\"verse\":5,\"text\":\"Exquisivi Dominum, et exaudivit me ; et ex omnibus tribulationibus meis eripuit me.\"},{\"verse\":6,\"text\":\"Accedite ad eum, et illuminamini ; et facies vestræ non confundentur.\"},{\"verse\":7,\"text\":\"Iste pauper clamavit, et Dominus exaudivit eum, et de omnibus tribulationibus ejus salvavit eum.\"},{\"verse\":8,\"text\":\"Immittet angelus Domini in circuitu timentium eum, et eripiet eos.\"},{\"verse\":9,\"text\":\"Gustate et videte quoniam suavis est Dominus ; beatus vir qui sperat in eo.\"},{\"verse\":10,\"text\":\"Timete Dominum, omnes sancti ejus, quoniam non est inopia timentibus eum.\"},{\"verse\":11,\"text\":\"Divites eguerunt, et esurierunt ; inquirentes autem Dominum non minuentur omni bono.\"},{\"verse\":12,\"text\":\"Venite, filii ; audite me : timorem Domini docebo vos.\"},{\"verse\":13,\"text\":\"Quis est homo qui vult vitam ; diligit dies videre bonos ?\"},{\"verse\":14,\"text\":\"Prohibe linguam tuam a malo, et labia tua ne loquantur dolum.\"},{\"verse\":15,\"text\":\"Diverte a malo, et fac bonum ; inquire pacem, et persequere eam.\"},{\"verse\":16,\"text\":\"Oculi Domini super justos, et aures ejus in preces eorum.\"},{\"verse\":17,\"text\":\"Vultus autem Domini super facientes mala, ut perdat de terra memoriam eorum.\"},{\"verse\":18,\"text\":\"Clamaverunt justi, et Dominus exaudivit eos ; et ex omnibus tribulationibus eorum liberavit eos.\"},{\"verse\":19,\"text\":\"Juxta est Dominus iis qui tribulato sunt corde, et humiles spiritu salvabit.\"},{\"verse\":20,\"text\":\"Multæ tribulationes justorum ; et de omnibus his liberabit eos Dominus.\"},{\"verse\":21,\"text\":\"Custodit Dominus omnia ossa eorum : unum ex his non conteretur.\"},{\"verse\":22,\"text\":\"Mors peccatorum pessima ; et qui oderunt justum delinquent.\"},{\"verse\":23,\"text\":\"Redimet Dominus animas servorum suorum, et non delinquent omnes qui sperant in eo.\"}],\"summary\":\"Benedicam Dominum.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":32,\"label\":\"Psalms 32\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":34,\"label\":\"Psalms 34\"}}]]\n"])</script></body></html>
