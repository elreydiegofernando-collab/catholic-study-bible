20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">26</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Dominus illuminatio.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The psalm of David before he was anointed. The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life: of whom shall I be afraid?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Whilst the wicked draw near against me, to eat my flesh. My enemies that trouble me, have themselves been weakened, and have fallen.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>If armies in camp should stand together against me, my heart shall not fear. If a battle should rise up against me, in this will I be confident.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>One thing I have asked of the Lord, this will I seek after; that I may dwell in the house of the Lord all the days of my life. That I may see the delight of the Lord, and may visit his temple.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For he hath hidden me in his tabernacle; in the day of evils, he hath protected me in the secret place of his tabernacle.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He hath exalted me upon a rock: and now he hath lifted up my head above my enemies. I have gone round, and have offered up in his tabernacle a sacrifice of jubilation: I will sing, and recite a psalm to the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hear, O Lord, my voice, with which I have cried to thee: have mercy on me and hear me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>My heart hath said to thee: My face hath sought thee: thy face, O Lord, will I still seek.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Turn not away thy face from me; decline not in thy wrath from thy servant. Be thou my helper, forsake me not; do not thou despise me, O God my Saviour.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For my father and my mother have left me: but the Lord hath taken me up.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Set me, O Lord, a law in thy way, and guide me in the right path, because of my enemies.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deliver me not over to the will of them that trouble me; for unjust witnesses have risen up against me; and iniquity hath lied to itself.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I believe to see the good things of the Lord in the land of the living.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Expect the Lord, do manfully, and let thy heart take courage, and wait thou for the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David, priusquam liniretur. Dominus illuminatio mea et salus mea : quem timebo ? Dominus protector vitæ meæ : a quo trepidabo ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dum appropiant super me nocentes ut edant carnes meas, qui tribulant me inimici mei, ipsi infirmati sunt et ceciderunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Si consistant adversum me castra, non timebit cor meum ; si exsurgat adversum me prælium, in hoc ego sperabo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Unam petii a Domino, hanc requiram, ut inhabitem in domo Domini omnibus diebus vitæ meæ ; ut videam voluptatem Domini, et visitem templum ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam abscondit me in tabernaculo suo ; in die malorum protexit me in abscondito tabernaculi sui.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In petra exaltavit me, et nunc exaltavit caput meum super inimicos meos. Circuivi, et immolavi in tabernaculo ejus hostiam vociferationis ; cantabo, et psalmum dicam Domino.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Exaudi, Domine, vocem meam, qua clamavi ad te ; miserere mei, et exaudi me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tibi dixit cor meum : Exquisivit te facies mea ; faciem tuam, Domine, requiram.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ne avertas faciem tuam a me ; ne declines in ira a servo tuo. Adjutor meus esto ; ne derelinquas me, neque despicias me, Deus salutaris meus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam pater meus et mater mea dereliquerunt me ; Dominus autem assumpsit me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Legem pone mihi, Domine, in via tua, et dirige me in semitam rectam, propter inimicos meos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ne tradideris me in animas tribulantium me, quoniam insurrexerunt in me testes iniqui, et mentita est iniquitas sibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Credo videre bona Domini in terra viventium.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Expecta Dominum, viriliter age : et confortetur cor tuum, et sustine Dominum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin  weakened, and have fallen.\"},{\"verse\":3,\"text\":\"If armies in camp should stand together against me, my heart shall not fear. If a battle should rise up against me, in this will I be confident.\"},{\"verse\":4,\"text\":\"One thing I have asked of the Lord, this will I seek after; that I may dwell in the house of the Lord all the days of my life. That I may see the delight of the Lord, and may visit his temple.\"},{\"verse\":5,\"text\":\"For he hath hidden me in his tabernacle; in the day of evils, he hath protected me in the secret place of his tabernacle.\"},{\"verse\":6,\"text\":\"He hath exalted me upon a rock: and now he hath lifted up my head above my enemies. I have gone round, and have offered up in his tabernacle a sacrifice of jubilation: I will sing, and recite a psalm to the Lord.\"},{\"verse\":7,\"text\":\"Hear, O Lord, my voice, with which I have cried to thee: have mercy on me and hear me.\"},{\"verse\":8,\"text\":\"My heart hath said to thee: My face hath sought thee: thy face, O Lord, will I still seek.\"},{\"verse\":9,\"text\":\"Turn not away thy face from me; decline not in thy wrath from thy servant. Be thou my helper, forsake me not; do not thou despise me, O God my Saviour.\"},{\"verse\":10,\"text\":\"For my father and my mother have left me: but the Lord hath taken me up.\"},{\"verse\":11,\"text\":\"Set me, O Lord, a law in thy way, and guide me in the right path, because of my enemies.\"},{\"verse\":12,\"text\":\"Deliver me not over to the will of them that trouble me; for unjust witnesses have risen up against me; and iniquity hath lied to itself.\"},{\"verse\":13,\"text\":\"I believe to see the good things of the Lord in the land of the living.\"},{\"verse\":14,\"text\":\"Expect the Lord, do manfully, and let thy heart take courage, and wait thou for the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus David, priusquam liniretur. Dominus illuminatio mea et salus mea : quem timebo ? Dominus protector vitæ meæ : a quo trepidabo ?\"},{\"verse\":2,\"text\":\"Dum appropiant super me nocentes ut edant carnes meas, qui tribulant me inimici mei, ipsi infirmati sunt et ceciderunt.\"},{\"verse\":3,\"text\":\"Si consistant adversum me castra, non timebit cor meum ; si exsurgat adversum me prælium, in hoc ego sperabo.\"},{\"verse\":4,\"text\":\"Unam petii a Domino, hanc requiram, ut inhabitem in domo Domini omnibus diebus vitæ meæ ; ut videam voluptatem Domini, et visitem templum ejus.\"},{\"verse\":5,\"text\":\"Quoniam abscondit me in tabernaculo suo ; in die malorum protexit me in abscondito tabernaculi sui.\"},{\"verse\":6,\"text\":\"In petra exaltavit me, et nunc exaltavit caput meum super inimicos meos. Circuivi, et immolavi in tabernaculo ejus hostiam vociferationis ; cantabo, et psalmum dicam Domino.\"},{\"verse\":7,\"text\":\"Exaudi, Domine, vocem meam, qua clamavi ad te ; miserere mei, et exaudi me.\"},{\"verse\":8,\"text\":\"Tibi dixit cor meum : Exquisivit te facies mea ; faciem tuam, Domine, requiram.\"},{\"verse\":9,\"text\":\"Ne avertas faciem tuam a me ; ne declines in ira a servo tuo. Adjutor meus esto ; ne derelinquas me, neque despicias me, Deus salutaris meus.\"},{\"verse\":10,\"text\":\"Quoniam pater meus et mater mea dereliquerunt me ; Dominus autem assumpsit me.\"},{\"verse\":11,\"text\":\"Legem pone mihi, Domine, in via tua, et dirige me in semitam rectam, propter inimicos meos.\"},{\"verse\":12,\"text\":\"Ne tradideris me in animas tribulantium me, quoniam insurrexerunt in me testes iniqui, et mentita est iniquitas sibi.\"},{\"verse\":13,\"text\":\"Credo videre bona Domini in terra viventium.\"},{\"verse\":14,\"text\":\"Expecta Dominum, viriliter age : et confortetur cor tuum, et sustine Dominum.\"}],\"summary\":\"Dominus illuminatio.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":25,\"label\":\"Psalms 25\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":27,\"label\":\"Psalms 27\"}}]]\n"])</script></body></html>
