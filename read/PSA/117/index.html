utton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Give praise to the Lord, for he is good: for his mercy endureth for ever.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let Israel now say, that he is good: that his mercy endureth for ever.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let the house of Aaron now say, that his mercy endureth for ever.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let them that fear the Lord now say, that his mercy endureth for ever.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In my trouble I called upon the Lord: and the Lord heard me, and enlarged me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The Lord is my helper: I will not fear what man can do unto me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The Lord is my helper: and I will look over my enemies.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>It is good to confide in the Lord, rather than to have confidence in man.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>It is good to trust in the Lord, rather than to trust in princes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>All nations compassed me about; and, in the name of the Lord I have been revenged on them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Surrounding me they compassed me about: and in the name of the Lord I have been revenged on them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They surrounded me like bees, and they burned like fire among thorns: and in the name of the Lord I was revenged on them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Being pushed I was overturned that I might fall: but the Lord supported me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The Lord is my strength and my praise: and he is become my salvation.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The voice of rejoicing and of salvation is in the tabernacles of the just.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The right hand of the Lord hath wrought strength: the right hand of the Lord hath exalted me: the right hand of the Lord hath wrought strength.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I shall not die, but live: and shall declare the works of the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Lord chastising hath chastised me: but he hath not delivered me over to death.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Open ye to me the gates of justice: I will go in to them, and give praise to the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>This is the gate of the Lord, the just shall enter into it.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I will give glory to thee because thou hast heard me: and art become my salvation.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The stone which the builders rejected; the same is become the head of the corner.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>This is the Lord’s doing, and it is wonderful in our eyes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>This is the day which the Lord hath made: let us be glad and rejoice therein.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>O Lord, save me: O Lord, give good success.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Blessed be he that cometh in the name of the Lord. We have blessed you out of the house of the Lord.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The Lord is God, and he hath shone upon us. Appoint a solemn day, with shady boughs, even to the horn of the altar.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thou art my God, and I will praise thee: thou art my God, and I will exalt thee. I will praise thee, because thou hast heard me, and art become my salvation.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>O praise ye the Lord, for he is good: for his mercy endureth for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dicat nunc Israël : Quoniam bonus, quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dicat nunc domus Aaron : Quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dicant nunc qui timent Dominum : Quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>De tribulatione invocavi Dominum, et exaudivit me in latitudine Dominus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dominus mihi adjutor ; non timebo quid faciat mihi homo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dominus mihi adjutor, et ego despiciam inimicos meos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Bonum est confidere in Domino, quam confidere in homine.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Bonum est sperare in Domino, quam sperare in principibus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnes gentes circuierunt me, et in nomine Domini, quia ultus sum in eos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Circumdantes circumdederunt me, et in nomine Domini, quia ultus sum in eos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Circumdederunt me sicut apes, et exarserunt sicut ignis in spinis : et in nomine Domini, quia ultus sum in eos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Impulsus eversus sum, ut caderem, et Dominus suscepit me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fortitudo mea et laus mea Dominus, et factus est mihi in salutem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vox exsultationis et salutis in tabernaculis justorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dextera Domini fecit virtutem ; dextera Domini exaltavit me : dextera Domini fecit virtutem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non moriar, sed vivam, et narrabo opera Domini.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Castigans castigavit me Dominus, et morti non tradidit me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Aperite mihi portas justitiæ : ingressus in eas confitebor Domino.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hæc porta Domini : justi intrabunt in eam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Lapidem quem reprobaverunt ædificantes, hic factus est in caput anguli.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>A Domino factum est istud, et est mirabile in oculis nostris.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Hæc est dies quam fecit Dominus ; exsultemus, et lætemur in ea.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>O Domine, salvum me fac ; o Domine, bene prosperare.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Benedictus qui venit in nomine Domini : benediximus vobis de domo Domini.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Deus Dominus, et illuxit nobis. Constituite diem solemnem in condensis, usque ad cornu altaris.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Deus meus es tu, et confitebor tibi ; Deus meus es tu, et exaltabo te. Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next _next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.117\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":117,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Give praise to the Lord, for he is good: for his mercy endureth for ever.\"},{\"verse\":2,\"text\":\"Let Israel now say, that he is good: that his mercy endureth for ever.\"},{\"verse\":3,\"text\":\"Let the house of Aaron now say, that his mercy endureth for ever.\"},{\"verse\":4,\"text\":\"Let them that fear the Lord now say, that his mercy endureth for ever.\"},{\"verse\":5,\"text\":\"In my trouble I called upon the Lord: and the Lord heard me, and enlarged me.\"},{\"verse\":6,\"text\":\"The Lord is my helper: I will not fear what man can do unto me.\"},{\"verse\":7,\"text\":\"The Lord is my helper: and I will look over my enemies.\"},{\"verse\":8,\"text\":\"It is good to confide in the Lord, rather than to have confidence in man.\"},{\"verse\":9,\"text\":\"It is good to trust in the Lord, rather than to trust in princes.\"},{\"verse\":10,\"text\":\"All nations compassed me about; and, in the name of the Lord I have been revenged on them.\"},{\"verse\":11,\"text\":\"Surrounding me they compassed me about: and in the name of the Lord I have been revenged on them.\"},{\"verse\":12,\"text\":\"They surrounded me like bees, and they burned like fire among thorns: and in the name of the Lord I was revenged on them.\"},{\"verse\":13,\"text\":\"Being pushed I was overturned that I might fall: but the Lord supported me.\"},{\"verse\":14,\"text\":\"The Lord is my strength and my praise: and he is become my salvation.\"},{\"verse\":15,\"text\":\"The voice of rejoicing and of salvation is in the tabernacles of the just.\"},{\"verse\":16,\"text\":\"The right hand of the Lord hath wrought strength: the right hand of the Lord hath exalted me: the right hand of the Lord hath wrought strength.\"},{\"verse\":17,\"text\":\"I shall not die, but live: and shall declare the works of the Lord.\"},{\"verse\":18,\"text\":\"The Lord chastising hath chastised me: but he hath not delivered me over to death.\"},{\"verse\":19,\"text\":\"Open ye to me the gates of justice: I will go in to them, and give praise to the Lord.\"},{\"verse\":20,\"text\":\"This is the gate of the Lord, the just shall enter into it.\"},{\"verse\":21,\"text\":\"I will give glory to thee because thou hast heard me: and art become my salvation.\"},{\"verse\":22,\"text\":\"The stone which the builders rejected; the same is become the head of the corner.\"},{\"verse\":23,\"text\":\"This is the Lord’s doing, and it is wonderful in our eyes.\"},{\"verse\":24,\"text\":\"This is the day which the Lord hath made: let us be glad and rejoice therein.\"},{\"verse\":25,\"text\":\"O Lord, save me: O Lord, give good success.\"},{\"verse\":26,\"text\":\"Blessed be he that cometh in the name of the Lord. We have blessed you out of the house of the Lord.\"},{\"verse\":27,\"text\":\"The Lord is God, and he hath shone upon us. Appoint a solemn day, with shady boughs, even to the horn of the altar.\"},{\"verse\":28,\"text\":\"Thou art my God, and I will praise thee: thou art my God, and I will exalt thee. I will praise thee, because thou hast heard me, and art become my salvation.\"},{\"verse\":29,\"text\":\"O praise ye the Lord, for he is good: for his mercy endureth for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.\"},{\"verse\":2,\"text\":\"Dicat nunc Israël : Quoniam bonus, quoniam in sæculum misericordia ejus.\"},{\"verse\":3,\"text\":\"Dicat nunc domus Aaron : Quoniam in sæculum misericordia ejus.\"},{\"verse\":4,\"text\":\"Dicant nunc qui timent Dominum : Quoniam in sæculum misericordia ejus.\"},{\"verse\":5,\"text\":\"De tribulatione invocavi Dominum, et exaudivit me in latitudine Dominus.\"},{\"verse\":6,\"text\":\"Dominus mihi adjutor ; non timebo quid faciat mihi homo.\"},{\"verse\":7,\"text\":\"Dominus mihi adjutor, et ego despiciam inimicos meos.\"},{\"verse\":8,\"text\":\"Bonum est confidere in Domino, quam confidere in homine.\"},{\"verse\":9,\"text\":\"Bonum est sperare in Domino, quam sperare in principibus.\"},{\"verse\":10,\"text\":\"Omnes gentes circuierunt me, et in nomine Domini, quia ultus sum in eos.\"},{\"verse\":11,\"text\":\"Circumdantes circumdederunt me, et in nomine Domini, quia ultus sum in eos.\"},{\"verse\":12,\"text\":\"Circumdederunt me sicut apes, et exarserunt sicut ignis in spinis : et in nomine Domini, quia ultus sum in eos.\"},{\"verse\":13,\"text\":\"Impulsus eversus sum, ut caderem, et Dominus suscepit me.\"},{\"verse\":14,\"text\":\"Fortitudo mea et laus mea Dominus, et factus est mihi in salutem.\"},{\"verse\":15,\"text\":\"Vox exsultationis et salutis in tabernaculis justorum.\"},{\"verse\":16,\"text\":\"Dextera Domini fecit virtutem ; dextera Domini exaltavit me : dextera Domini fecit virtutem.\"},{\"verse\":17,\"text\":\"Non moriar, sed vivam, et narrabo opera Domini.\"},{\"verse\":18,\"text\":\"Castigans castigavit me Dominus, et morti non tradidit me.\"},{\"verse\":19,\"text\":\"Aperite mihi portas justitiæ : ingressus in eas confitebor Domino.\"},{\"verse\":20,\"text\":\"Hæc porta Domini : justi intrabunt in eam.\"},{\"verse\":21,\"text\":\"Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem.\"},{\"verse\":22,\"text\":\"Lapidem quem reprobaverunt ædificantes, hic factus est in caput anguli.\"},{\"verse\":23,\"text\":\"A Domino factum est istud, et est mirabile in oculis nostris.\"},{\"verse\":24,\"text\":\"Hæc est dies quam fecit Dominus ; exsultemus, et lætemur in ea.\"},{\"verse\":25,\"text\":\"O Domine, salvum me fac ; o Domine, bene prosperare.\"},{\"verse\":26,\"text\":\"Benedictus qui venit in nomine Domini : benediximus vobis de domo Domini.\"},{\"verse\":27,\"text\":\"Deus Dominus, et illuxit nobis. Constituite diem solemnem in condensis, usque ad cornu altaris.\"},{\"verse\":28,\"text\":\"Deus meus es tu, et confitebor tibi ; Deus meus es tu, et exaltabo te. Confitebor tibi quoniam exaudisti me, et factus es mihi in salutem.\"},{\"verse\":29,\"text\":\"Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.\"}],\"summary\":\"Confitemini Domino.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":116,\"label\":\"Psalms 116\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":118,\"label\":\"Psalms 118\"}}]]\n"])</script></body></html>
