[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">67</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Exurgat Deus.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a psalm of a canticle for David himself.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let God arise, and let his enemies be scattered: and let them that hate him flee from before his face.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>As smoke vanisheth, so let them vanish away: as wax melteth before the fire, so let the wicked perish at the presence of God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And let the just feast, and rejoice before God: and be delighted with gladness.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sing ye to God, sing a psalm to his name, make a way for him who ascendeth upon the west: the Lord is his name. Rejoice ye before him: but the wicked shall be troubled at his presence,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who is the father of orphans, and the judge of widows. God in his holy place:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>God who maketh men of one manner to dwell in a house: Who bringeth out them that were bound in strength; in like manner them that provoke, that dwell in sepulchres.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>O God, when thou didst go forth in the sight of thy people, when thou didst pass through the desert:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The earth was moved, and the heavens dropped at the presence of the God of Sina, at the presence of the God of Israel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou shalt set aside for thy inheritance a free rain, O God: and it was weakened, but thou hast made it perfect.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In it shall thy animals dwell; in thy sweetness, O God, thou hast provided for the poor.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The Lord shall give the word to them that preach good tidings with great power.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The king of powers is of the beloved, of the beloved; and the beauty of the house shall divide spoils.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If you sleep among the midst of lots, you shall be as the wings of a dove covered with silver, and the hinder parts of her back with the paleness of gold.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>When he that is in heaven appointeth kings over her, they shall be whited with snow in Selmon.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The mountain of God is a fat mountain. A curdled mountain, a fat mountain.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Why suspect, ye curdled mountains? A mountain in which God is well pleased to dwell: for there the Lord shall dwell unto the end.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The chariot of God is attended by ten thousands; thousands of them that rejoice: the Lord is among them in Sina, in the holy place.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thou hast ascended on high, thou hast led captivity captive; thou hast received gifts in men. Yea for those also that do not believe, the dwelling of the Lord God.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Blessed be the Lord day by day: the God of our salvation will make our journey prosperous to us.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Our God is the God of salvation: and of the Lord, of the Lord are the issues from death.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But God shall break the heads of his enemies: the hairy crown of them that walk on in their sins.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The Lord said: I will turn them from Basan, I will turn them into the depth of the sea:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>That thy foot may be dipped in the blood of thy enemies; the tongue of thy dogs be red with the same.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>They have seen thy goings, O God, the goings of my God: of my king who is in his sanctuary.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Princes went before joined with singers, in the midst of young damsels playing on timbrels.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In the churches bless ye God the Lord, from the fountains of Israel.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>There is Benjamin a youth, in ecstasy of mind. The princes of Juda are their leaders: the princes of Zabulon, the princes of Nephthali.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Command thy strength, O God confirm, O God, what thou hast wrought in us.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>From thy temple in Jerusalem, kings shall offer presents to thee.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Rebuke the wild beasts of the reeds, the congregation of bulls with the kine of the people; who seek to exclude them who are tried with silver. Scatter thou the nations that delight in wars:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ambassadors shall come out of Egypt: Ethiopia shall soon stretch out her hands to God.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Sing to God, ye kingdoms of the earth: sing ye to the Lord: Sing ye to God,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Who mounteth above the heaven of heavens, to the east. Behold he will give to his voice the voice of power:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Give ye glory to God for Israel, his magnificence, and his power is in the clouds.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>God is wonderful in his saints: the God of Israel is he who will give power and strength to his people. Blessed be God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus cantici ipsi David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Exsurgat Deus, et dissipentur inimici ejus ; et fugiant qui oderunt eum a facie ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sicut deficit fumus, deficiant ; sicut fluit cera a facie ignis, sic pereant peccatores a facie Dei.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et justi epulentur, et exsultent in conspectu Dei, et delectentur in lætitia.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cantate Deo ; psalmum dicite nomini ejus : iter facite ei qui ascendit super occasum. Dominus nomen illi ; exsultate in conspectu ejus. Turbabuntur a facie ejus,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>patris orphanorum, et judicis viduarum ; Deus in loco sancto suo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Deus qui inhabitare facit unius moris in domo ; qui educit vinctos in fortitudine, similiter eos qui exasperant, qui habitant in sepulchris.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Deus, cum egredereris in conspectu populi tui, cum pertransires in deserto,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>terra mota est, etenim cæli distillaverunt, a facie Dei Sinai, a facie Dei Israël.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pluviam voluntariam segregabis, Deus, hæreditati tuæ ; et infirmata est, tu vero perfecisti eam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Animalia tua habitabunt in ea ; parasti in dulcedine tua pauperi, Deus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dominus dabit verbum evangelizantibus, virtute multa.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Rex virtutum dilecti, dilecti ; et speciei domus dividere spolia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si dormiatis inter medios cleros, pennæ columbæ deargentatæ, et posteriora dorsi ejus in pallore auri.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dum discernit cælestis reges super eam, nive dealbabuntur in Selmon.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mons Dei, mons pinguis : mons coagulatus, mons pinguis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ut quid suspicamini, montes coagulatos ? mons in quo beneplacitum est Deo habitare in eo ; etenim Dominus habitabit in finem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Currus Dei decem millibus multiplex, millia lætantium ; Dominus in eis in Sina, in sancto.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ascendisti in altum, cepisti captivitatem, accepisti dona in hominibus ; etenim non credentes inhabitare Dominum Deum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Benedictus Dominus die quotidie : prosperum iter faciet nobis Deus salutarium nostrorum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Deus noster, Deus salvos faciendi ; et Domini, Domini exitus mortis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Verumtamen Deus confringet capita inimicorum suorum, verticem capilli perambulantium in delictis suis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dixit Dominus : Ex Basan convertam, convertam in profundum maris :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>ut intingatur pes tuus in sanguine ; lingua canum tuorum ex inimicis, ab ipso.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Viderunt ingressus tuos, Deus, ingressus Dei mei, regis mei, qui est in sancto.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Prævenerunt principes conjuncti psallentibus, in medio juvencularum tympanistriarum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In ecclesiis benedicite Deo Domino de fontibus Israël.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ibi Benjamin adolescentulus, in mentis excessu ; principes Juda, duces eorum ; principes Zabulon, principes Nephthali.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Manda, Deus, virtuti tuæ ; confirma hoc, Deus, quod operatus es in nobis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>A templo tuo in Jerusalem, tibi offerent reges munera.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Increpa feras arundinis ; congregatio taurorum in vaccis populorum : ut excludant eos qui probati sunt argento. Dissipa gentes quæ bella volunt.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Venient legati ex Ægypto ; Æthiopia præveniet manus ejus Deo.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Regna terræ, cantate Deo ; psallite Domino ; psallite Deo.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Qui ascendit super cælum cæli, ad orientem : ecce dabit voci suæ vocem virtutis.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Date gloriam Deo super Israël ; magnificentia ejus et virtus ejus in nubibus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Mirabilis Deus in sanctis suis ; Deus Israël ipse dabit virtutem et fortitudinem plebi suæ. Benedictus Deus !</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/66/"><svg viewBox="0 0 24 \":1,\"text\":\"Unto the end, a psalm of a canticle for David himself.\"},{\"verse\":2,\"text\":\"Let God arise, and let his enemies be scattered: and let them that hate him flee from before his face.\"},{\"verse\":3,\"text\":\"As smoke vanisheth, so let them vanish away: as wax melteth before the fire, so let the wicked perish at the presence of God.\"},{\"verse\":4,\"text\":\"And let the just feast, and rejoice before God: and be delighted with gladness.\"},{\"verse\":5,\"text\":\"Sing ye to God, sing a psalm to his name, make a way for him who ascendeth upon the west: the Lord is his name. Rejoice ye before him: but the wicked shall be troubled at his presence,\"},{\"verse\":6,\"text\":\"Who is the father of orphans, and the judge of widows. God in his holy place:\"},{\"verse\":7,\"text\":\"God who maketh men of one manner to dwell in a house: Who bringeth out them that were bound in strength; in like manner them that provoke, that dwell in sepulchres.\"},{\"verse\":8,\"text\":\"O God, when thou didst go forth in the sight of thy people, when thou didst pass through the desert:\"},{\"verse\":9,\"text\":\"The earth was moved, and the heavens dropped at the presence of the God of Sina, at the presence of the God of Israel.\"},{\"verse\":10,\"text\":\"Thou shalt set aside for thy inheritance a free rain, O God: and it was weakened, but thou hast made it perfect.\"},{\"verse\":11,\"text\":\"In it shall thy animals dwell; in thy sweetness, O God, thou hast provided for the poor.\"},{\"verse\":12,\"text\":\"The Lord shall give the word to them that preach good tidings with great power.\"},{\"verse\":13,\"text\":\"The king of powers is of the beloved, of the beloved; and the beauty of the house shall divide spoils.\"},{\"verse\":14,\"text\":\"If you sleep among the midst of lots, you shall be as the wings of a dove covered with silver, and the hinder parts of her back with the paleness of gold.\"},{\"verse\":15,\"text\":\"When he that is in heaven appointeth kings over her, they shall be whited with snow in Selmon.\"},{\"verse\":16,\"text\":\"The mountain of God is a fat mountain. A curdled mountain, a fat mountain.\"},{\"verse\":17,\"text\":\"Why suspect, ye curdled mountains? A mountain in which God is well pleased to dwell: for there the Lord shall dwell unto the end.\"},{\"verse\":18,\"text\":\"The chariot of God is attended by ten thousands; thousands of them that rejoice: the Lord is among them in Sina, in the holy place.\"},{\"verse\":19,\"text\":\"Thou hast ascended on high, thou hast led captivity captive; thou hast received gifts in men. Yea for those also that do not believe, the dwelling of the Lord God.\"},{\"verse\":20,\"text\":\"Blessed be the Lord day by day: the God of our salvation will make our journey prosperous to us.\"},{\"verse\":21,\"text\":\"Our God is the God of salvation: and of the Lord, of the Lord are the issues from death.\"},{\"verse\":22,\"text\":\"But God shall break the heads of his enemies: the hairy crown of them that walk on in their sins.\"},{\"verse\":23,\"text\":\"The Lord said: I will turn them from Basan, I will turn them into the depth of the sea:\"},{\"verse\":24,\"text\":\"That thy foot may be dipped in the blood of thy enemies; the tongue of thy dogs be red with the same.\"},{\"verse\":25,\"text\":\"They have seen thy goings, O God, the goings of my God: of my king who is in his sanctuary.\"},{\"verse\":26,\"text\":\"Princes went before joined with singers, in the midst of young damsels playing on timbrels.\"},{\"verse\":27,\"text\":\"In the churches bless ye God the Lord, from the fountains of Israel.\"},{\"verse\":28,\"text\":\"There is Benjamin a youth, in ecstasy of mind. The princes of Juda are their leaders: the princes of Zabulon, the princes of Nephthali.\"},{\"verse\":29,\"text\":\"Command thy strength, O God confirm, O God, what thou hast wrought in us.\"},{\"verse\":30,\"text\":\"From thy temple in Jerusalem, kings shall offer presents to thee.\"},{\"verse\":31,\"text\":\"Rebuke the wild beasts of the reeds, the congregation of bulls with the kine of the people; who seek to exclude them who are tried with silver. Scatter thou the nations that delight in wars:\"},{\"verse\":32,\"text\":\"Ambassadors shall come out of Egypt: Ethiopia shall soon stretch out her hands to God.\"},{\"verse\":33,\"text\":\"Sing to God, ye kingdoms of the earth: sing ye to the Lord: Sing ye to God,\"},{\"verse\":34,\"text\":\"Who mounteth above the heaven of heavens, to the east. Behold he will give to his voice the voice of power:\"},{\"verse\":35,\"text\":\"Give ye glory to God for Israel, his magnificence, and his power is in the clouds.\"},{\"verse\":36,\"text\":\"God is wonderful in his saints: the God of Israel is he who will give power and strength to his people. Blessed be God.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus cantici ipsi David.\"},{\"verse\":2,\"text\":\"Exsurgat Deus, et dissipentur inimici ejus ; et fugiant qui oderunt eum a facie ejus.\"},{\"verse\":3,\"text\":\"Sicut deficit fumus, deficiant ; sicut fluit cera a facie ignis, sic pereant peccatores a facie Dei.\"},{\"verse\":4,\"text\":\"Et justi epulentur, et exsultent in conspectu Dei, et delectentur in lætitia.\"},{\"verse\":5,\"text\":\"Cantate Deo ; psalmum dicite nomini ejus : iter facite ei qui ascendit super occasum. Dominus nomen illi ; exsultate in conspectu ejus. Turbabuntur a facie ejus,\"},{\"verse\":6,\"text\":\"patris orphanorum, et judicis viduarum ; Deus in loco sancto suo.\"},{\"verse\":7,\"text\":\"Deus qui inhabitare facit unius moris in domo ; qui educit vinctos in fortitudine, similiter eos qui exasperant, qui habitant in sepulchris.\"},{\"verse\":8,\"text\":\"Deus, cum egredereris in conspectu populi tui, cum pertransires in deserto,\"},{\"verse\":9,\"text\":\"terra mota est, etenim cæli distillaverunt, a facie Dei Sinai, a facie Dei Israël.\"},{\"verse\":10,\"text\":\"Pluviam voluntariam segregabis, Deus, hæreditati tuæ ; et infirmata est, tu vero perfecisti eam.\"},{\"verse\":11,\"text\":\"Animalia tua habitabunt in ea ; parasti in dulcedine tua pauperi, Deus.\"},{\"verse\":12,\"text\":\"Dominus dabit verbum evangelizantibus, virtute multa.\"},{\"verse\":13,\"text\":\"Rex virtutum dilecti, dilecti ; et speciei domus dividere spolia.\"},{\"verse\":14,\"text\":\"Si dormiatis inter medios cleros, pennæ columbæ deargentatæ, et posteriora dorsi ejus in pallore auri.\"},{\"verse\":15,\"text\":\"Dum discernit cælestis reges super eam, nive dealbabuntur in Selmon.\"},{\"verse\":16,\"text\":\"Mons Dei, mons pinguis : mons coagulatus, mons pinguis.\"},{\"verse\":17,\"text\":\"Ut quid suspicamini, montes coagulatos ? mons in quo beneplacitum est Deo habitare in eo ; etenim Dominus habitabit in finem.\"},{\"verse\":18,\"text\":\"Currus Dei decem millibus multiplex, millia lætantium ; Dominus in eis in Sina, in sancto.\"},{\"verse\":19,\"text\":\"Ascendisti in altum, cepisti captivitatem, accepisti dona in hominibus ; etenim non credentes inhabitare Dominum Deum.\"},{\"verse\":20,\"text\":\"Benedictus Dominus die quotidie : prosperum iter faciet nobis Deus salutarium nostrorum.\"},{\"verse\":21,\"text\":\"Deus noster, Deus salvos faciendi ; et Domini, Domini exitus mortis.\"},{\"verse\":22,\"text\":\"Verumtamen Deus confringet capita inimicorum suorum, verticem capilli perambulantium in delictis suis.\"},{\"verse\":23,\"text\":\"Dixit Dominus : Ex Basan convertam, convertam in profundum maris :\"},{\"verse\":24,\"text\":\"ut intingatur pes tuus in sanguine ; lingua canum tuorum ex inimicis, ab ipso.\"},{\"verse\":25,\"text\":\"Viderunt ingressus tuos, Deus, ingressus Dei mei, regis mei, qui est in sancto.\"},{\"verse\":26,\"text\":\"Prævenerunt principes conjuncti psallentibus, in medio juvencularum tympanistriarum.\"},{\"verse\":27,\"text\":\"In ecclesiis benedicite Deo Domino de fontibus Israël.\"},{\"verse\":28,\"text\":\"Ibi Benjamin adolescentulus, in mentis excessu ; principes Juda, duces eorum ; principes Zabulon, principes Nephthali.\"},{\"verse\":29,\"text\":\"Manda, Deus, virtuti tuæ ; confirma hoc, Deus, quod operatus es in nobis.\"},{\"verse\":30,\"text\":\"A templo tuo in Jerusalem, tibi offerent reges munera.\"},{\"verse\":31,\"text\":\"Increpa feras arundinis ; congregatio taurorum in vaccis populorum : ut excludant eos qui probati sunt argento. Dissipa gentes quæ bella volunt.\"},{\"verse\":32,\"text\":\"Venient legati ex Ægypto ; Æthiopia præveniet manus ejus Deo.\"},{\"verse\":33,\"text\":\"Regna terræ, cantate Deo ; psallite Domino ; psallite Deo.\"},{\"verse\":34,\"text\":\"Qui ascendit super cælum cæli, ad orientem : ecce dabit voci suæ vocem virtutis.\"},{\"verse\":35,\"text\":\"Date gloriam Deo super Israël ; magnificentia ejus et virtus ejus in nubibus.\"},{\"verse\":36,\"text\":\"Mirabilis Deus in sanctis suis ; Deus Israël ipse dabit virtutem et fortitudinem plebi suæ. Benedictus Deus !\"}],\"summary\":\"Exurgat Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":66,\"label\":\"Psalms 66\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":68,\"label\":\"Psalms 68\"}}]]\n"])</script></body></html>
