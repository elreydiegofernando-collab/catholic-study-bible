n" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The prayer of the poor man, when he was anxious, and poured out his supplication before the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hear, O Lord, my prayer: and let my cry come to thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Turn not away thy face from me: in the day when I am in trouble, incline thy ear to me. In what day soever I shall call upon thee, hear me speedily.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For my days are vanished like smoke, and my bones are grown dry like fuel for the fire.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I am smitten as grass, and my heart is withered: because I forgot to eat my bread.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Through the voice of my groaning, my bone hath cleaved to my flesh.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I am become like to a pelican of the wilderness: I am like a night raven in the house.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I have watched, and am become as a sparrow all alone on the housetop.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>All the day long my enemies reproached me: and they that praised me did swear against me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For I did eat ashes like bread, and mingled my drink with weeping.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Because of thy anger and indignation: for having lifted me up thou hast thrown me down.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>My days have declined like a shadow, and I am withered like grass.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But thou, O Lord, endurest for ever: and thy memorial to all generations.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt arise and have mercy on Sion: for it is time to have mercy on it, for the time is come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For the stones thereof have pleased thy servants: and they shall have pity on the earth thereof.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Gentiles shall fear thy name, O Lord, and all the kings of the earth thy glory.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the Lord hath built up Sion: and he shall be seen in his glory.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He hath had regard to the prayer of the humble: and he hath not despised their petition.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let these things be written unto another generation: and the people that shall be created shall praise the Lord:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Because he hath looked forth from his high sanctuary: from heaven the Lord hath looked upon the earth.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That he might hear the groans of them that are in fetters: that he might release the children of the slain:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>That they may declare the name of the Lord in Sion: and his praise in Jerusalem;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>When the people assemble together, and kings, to serve the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He answered him in the way of his strength: Declare unto me the fewness of my days.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Call me not away in the midst of my days: thy years are unto generation and generation.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In the beginning, O Lord, thou foundedst the earth: and the heavens are the works of thy hands.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>They shall perish but thou remainest: and all of them shall grow old like a garment: And as a vesture thou shalt change them, and they shall be changed.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But thou art always the selfsame, and thy years shall not fail.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The children of thy servants shall continue and their seed shall be directed for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Oratio pauperis, cum anxius fuerit, et in conspectu Domini effuderit precem suam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine, exaudi orationem meam, et clamor meus ad te veniat.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non avertas faciem tuam a me : in quacumque die tribulor, inclina ad me aurem tuam ; in quacumque die invocavero te, velociter exaudi me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia defecerunt sicut fumus dies mei, et ossa mea sicut cremium aruerunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Percussus sum ut fœnum, et aruit cor meum, quia oblitus sum comedere panem meum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A voce gemitus mei adhæsit os meum carni meæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Similis factus sum pellicano solitudinis ; factus sum sicut nycticorax in domicilio.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Vigilavi, et factus sum sicut passer solitarius in tecto.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tota die exprobrabant mihi inimici mei, et qui laudabant me adversum me jurabant :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>quia cinerem tamquam panem manducabam, et potum meum cum fletu miscebam,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>a facie iræ et indignationis tuæ : quia elevans allisisti me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dies mei sicut umbra declinaverunt, et ego sicut fœnum arui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tu autem, Domine, in æternum permanes, et memoriale tuum in generationem et generationem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tu exsurgens misereberis Sion, quia tempus miserendi ejus, quia venit tempus :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>quoniam placuerunt servis tuis lapides ejus, et terræ ejus miserebuntur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et timebunt gentes nomen tuum, Domine, et omnes reges terræ gloriam tuam :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>quia ædificavit Dominus Sion, et videbitur in gloria sua.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Respexit in orationem humilium et non sprevit precem eorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Scribantur hæc in generatione altera, et populus qui creabitur laudabit Dominum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quia prospexit de excelso sancto suo ; Dominus de cælo in terram aspexit :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut audiret gemitus compeditorum ; ut solveret filios interemptorum :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>ut annuntient in Sion nomen Domini, et laudem ejus in Jerusalem :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>in conveniendo populos in unum, et reges, ut serviant Domino.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Respondit ei in via virtutis suæ : Paucitatem dierum meorum nuntia mihi :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ne revoces me in dimidio dierum meorum, in generationem et generationem anni tui.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Initio tu, Domine, terram fundasti, et opera manuum tuarum sunt cæli.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ipsi peribunt, tu autem permanes ; et omnes sicut vestimentum veterascent. Et sicut opertorium mutabis eos, et mutabuntur ;</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>tu autem idem ipse es, et anni tui non deficient.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Filii servorum tuorum habitabunt, et semen eorum in sæculum dirigetur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/100/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 100</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/102/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 102</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->101<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Psalms 100" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 tkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.101\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":101,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"The prayer of the poor man, when he was anxious, and poured out his supplication before the Lord.\"},{\"verse\":2,\"text\":\"Hear, O Lord, my prayer: and let my cry come to thee.\"},{\"verse\":3,\"text\":\"Turn not away thy face from me: in the day when I am in trouble, incline thy ear to me. In what day soever I shall call upon thee, hear me speedily.\"},{\"verse\":4,\"text\":\"For my days are vanished like smoke, and my bones are grown dry like fuel for the fire.\"},{\"verse\":5,\"text\":\"I am smitten as grass, and my heart is withered: because I forgot to eat my bread.\"},{\"verse\":6,\"text\":\"Through the voice of my groaning, my bone hath cleaved to my flesh.\"},{\"verse\":7,\"text\":\"I am become like to a pelican of the wilderness: I am like a night raven in the house.\"},{\"verse\":8,\"text\":\"I have watched, and am become as a sparrow all alone on the housetop.\"},{\"verse\":9,\"text\":\"All the day long my enemies reproached me: and they that praised me did swear against me.\"},{\"verse\":10,\"text\":\"For I did eat ashes like bread, and mingled my drink with weeping.\"},{\"verse\":11,\"text\":\"Because of thy anger and indignation: for having lifted me up thou hast thrown me down.\"},{\"verse\":12,\"text\":\"My days have declined like a shadow, and I am withered like grass.\"},{\"verse\":13,\"text\":\"But thou, O Lord, endurest for ever: and thy memorial to all generations.\"},{\"verse\":14,\"text\":\"Thou shalt arise and have mercy on Sion: for it is time to have mercy on it, for the time is come.\"},{\"verse\":15,\"text\":\"For the stones thereof have pleased thy servants: and they shall have pity on the earth thereof.\"},{\"verse\":16,\"text\":\"And the Gentiles shall fear thy name, O Lord, and all the kings of the earth thy glory.\"},{\"verse\":17,\"text\":\"For the Lord hath built up Sion: and he shall be seen in his glory.\"},{\"verse\":18,\"text\":\"He hath had regard to the prayer of the humble: and he hath not despised their petition.\"},{\"verse\":19,\"text\":\"Let these things be written unto another generation: and the people that shall be created shall praise the Lord:\"},{\"verse\":20,\"text\":\"Because he hath looked forth from his high sanctuary: from heaven the Lord hath looked upon the earth.\"},{\"verse\":21,\"text\":\"That he might hear the groans of them that are in fetters: that he might release the children of the slain:\"},{\"verse\":22,\"text\":\"That they may declare the name of the Lord in Sion: and his praise in Jerusalem;\"},{\"verse\":23,\"text\":\"When the people assemble together, and kings, to serve the Lord.\"},{\"verse\":24,\"text\":\"He answered him in the way of his strength: Declare unto me the fewness of my days.\"},{\"verse\":25,\"text\":\"Call me not away in the midst of my days: thy years are unto generation and generation.\"},{\"verse\":26,\"text\":\"In the beginning, O Lord, thou foundedst the earth: and the heavens are the works of thy hands.\"},{\"verse\":27,\"text\":\"They shall perish but thou remainest: and all of them shall grow old like a garment: And as a vesture thou shalt change them, and they shall be changed.\"},{\"verse\":28,\"text\":\"But thou art always the selfsame, and thy years shall not fail.\"},{\"verse\":29,\"text\":\"The children of thy servants shall continue and their seed shall be directed for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Oratio pauperis, cum anxius fuerit, et in conspectu Domini effuderit precem suam.\"},{\"verse\":2,\"text\":\"Domine, exaudi orationem meam, et clamor meus ad te veniat.\"},{\"verse\":3,\"text\":\"Non avertas faciem tuam a me : in quacumque die tribulor, inclina ad me aurem tuam ; in quacumque die invocavero te, velociter exaudi me.\"},{\"verse\":4,\"text\":\"Quia defecerunt sicut fumus dies mei, et ossa mea sicut cremium aruerunt.\"},{\"verse\":5,\"text\":\"Percussus sum ut fœnum, et aruit cor meum, quia oblitus sum comedere panem meum.\"},{\"verse\":6,\"text\":\"A voce gemitus mei adhæsit os meum carni meæ.\"},{\"verse\":7,\"text\":\"Similis factus sum pellicano solitudinis ; factus sum sicut nycticorax in domicilio.\"},{\"verse\":8,\"text\":\"Vigilavi, et factus sum sicut passer solitarius in tecto.\"},{\"verse\":9,\"text\":\"Tota die exprobrabant mihi inimici mei, et qui laudabant me adversum me jurabant :\"},{\"verse\":10,\"text\":\"quia cinerem tamquam panem manducabam, et potum meum cum fletu miscebam,\"},{\"verse\":11,\"text\":\"a facie iræ et indignationis tuæ : quia elevans allisisti me.\"},{\"verse\":12,\"text\":\"Dies mei sicut umbra declinaverunt, et ego sicut fœnum arui.\"},{\"verse\":13,\"text\":\"Tu autem, Domine, in æternum permanes, et memoriale tuum in generationem et generationem.\"},{\"verse\":14,\"text\":\"Tu exsurgens misereberis Sion, quia tempus miserendi ejus, quia venit tempus :\"},{\"verse\":15,\"text\":\"quoniam placuerunt servis tuis lapides ejus, et terræ ejus miserebuntur.\"},{\"verse\":16,\"text\":\"Et timebunt gentes nomen tuum, Domine, et omnes reges terræ gloriam tuam :\"},{\"verse\":17,\"text\":\"quia ædificavit Dominus Sion, et videbitur in gloria sua.\"},{\"verse\":18,\"text\":\"Respexit in orationem humilium et non sprevit precem eorum.\"},{\"verse\":19,\"text\":\"Scribantur hæc in generatione altera, et populus qui creabitur laudabit Dominum.\"},{\"verse\":20,\"text\":\"Quia prospexit de excelso sancto suo ; Dominus de cælo in terram aspexit :\"},{\"verse\":21,\"text\":\"ut audiret gemitus compeditorum ; ut solveret filios interemptorum :\"},{\"verse\":22,\"text\":\"ut annuntient in Sion nomen Domini, et laudem ejus in Jerusalem :\"},{\"verse\":23,\"text\":\"in conveniendo populos in unum, et reges, ut serviant Domino.\"},{\"verse\":24,\"text\":\"Respondit ei in via virtutis suæ : Paucitatem dierum meorum nuntia mihi :\"},{\"verse\":25,\"text\":\"ne revoces me in dimidio dierum meorum, in generationem et generationem anni tui.\"},{\"verse\":26,\"text\":\"Initio tu, Domine, terram fundasti, et opera manuum tuarum sunt cæli.\"},{\"verse\":27,\"text\":\"Ipsi peribunt, tu autem permanes ; et omnes sicut vestimentum veterascent. Et sicut opertorium mutabis eos, et mutabuntur ;\"},{\"verse\":28,\"text\":\"tu autem idem ipse es, et anni tui non deficient.\"},{\"verse\":29,\"text\":\"Filii servorum tuorum habitabunt, et semen eorum in sæculum dirigetur.\"}],\"summary\":\"Domine, exaudi.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":100,\"label\":\"Psalms 100\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":102,\"label\":\"Psalms 102\"}}]]\n"])</script></body></html>
