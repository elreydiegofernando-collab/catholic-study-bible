tton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for the sons of Core, a psalm.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Lord, thou hast blessed thy land: thou hast turned away the captivity of Jacob.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou hast forgiven the iniquity of thy people: thou hast covered all their sins.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou hast mitigated all thy anger: thou hast turned away from the wrath of thy indignation.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Convert us, O God our saviour: and turn off thy anger from us.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Wilt thou be angry with us for ever: or wilt thou extend thy wrath from generation to generation?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou wilt turn, O God, and bring us to life: and thy people shall rejoice in thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Shew us, O Lord, thy mercy; and grant us thy salvation.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I will hear what the Lord God will speak in me: for he will speak peace unto his people: And unto his saints: and unto them that are converted to the heart.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Surely his salvation is near to them that fear him: that glory may dwell in our land.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mercy and truth have met each other: justice and peace have kissed.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Truth is sprung out of the earth: and justice hath looked down from heaven.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the Lord will give goodness: and our earth shall yield her fruit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Justice shall walk before him: and shall set his steps in the way.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, filiis Core. Psalmus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Benedixisti, Domine, terram tuam ; avertisti captivitatem Jacob.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Remisisti iniquitatem plebis tuæ ; operuisti omnia peccata eorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Mitigasti omnem iram tuam ; avertisti ab ira indignationis tuæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Converte nos, Deus salutaris noster, et averte iram tuam a nobis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Numquid in æternum irasceris nobis ? aut extendes iram tuam a generatione in generationem ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Deus, tu conversus vivificabis nos, et plebs tua lætabitur in te.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ostende nobis, Domine, misericordiam tuam, et salutare tuum da nobis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Audiam quid loquatur in me Dominus Deus, quoniam loquetur pacem in plebem suam, et super sanctos suos, et in eos qui convertuntur ad cor.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Verumtamen prope timentes eum salutare ipsius, ut inhabitet gloria in terra nostra.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Misericordia et veritas obviaverunt sibi ; justitia et pax osculatæ sunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Veritas de terra orta est, et justitia de cælo prospexit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Etenim Dominus dabit benignitatem, et terra nostra dabit fructum suum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Justitia ante eum ambulabit, et ponet in via gressus suos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/83/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 83</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/85/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 85</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 eople: And unto his saints: and unto them that are converted to the heart.\"},{\"verse\":10,\"text\":\"Surely his salvation is near to them that fear him: that glory may dwell in our land.\"},{\"verse\":11,\"text\":\"Mercy and truth have met each other: justice and peace have kissed.\"},{\"verse\":12,\"text\":\"Truth is sprung out of the earth: and justice hath looked down from heaven.\"},{\"verse\":13,\"text\":\"For the Lord will give goodness: and our earth shall yield her fruit.\"},{\"verse\":14,\"text\":\"Justice shall walk before him: and shall set his steps in the way.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, filiis Core. Psalmus.\"},{\"verse\":2,\"text\":\"Benedixisti, Domine, terram tuam ; avertisti captivitatem Jacob.\"},{\"verse\":3,\"text\":\"Remisisti iniquitatem plebis tuæ ; operuisti omnia peccata eorum.\"},{\"verse\":4,\"text\":\"Mitigasti omnem iram tuam ; avertisti ab ira indignationis tuæ.\"},{\"verse\":5,\"text\":\"Converte nos, Deus salutaris noster, et averte iram tuam a nobis.\"},{\"verse\":6,\"text\":\"Numquid in æternum irasceris nobis ? aut extendes iram tuam a generatione in generationem ?\"},{\"verse\":7,\"text\":\"Deus, tu conversus vivificabis nos, et plebs tua lætabitur in te.\"},{\"verse\":8,\"text\":\"Ostende nobis, Domine, misericordiam tuam, et salutare tuum da nobis.\"},{\"verse\":9,\"text\":\"Audiam quid loquatur in me Dominus Deus, quoniam loquetur pacem in plebem suam, et super sanctos suos, et in eos qui convertuntur ad cor.\"},{\"verse\":10,\"text\":\"Verumtamen prope timentes eum salutare ipsius, ut inhabitet gloria in terra nostra.\"},{\"verse\":11,\"text\":\"Misericordia et veritas obviaverunt sibi ; justitia et pax osculatæ sunt.\"},{\"verse\":12,\"text\":\"Veritas de terra orta est, et justitia de cælo prospexit.\"},{\"verse\":13,\"text\":\"Etenim Dominus dabit benignitatem, et terra nostra dabit fructum suum.\"},{\"verse\":14,\"text\":\"Justitia ante eum ambulabit, et ponet in via gressus suos.\"}],\"summary\":\"Benedixisti, Domine.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":83,\"label\":\"Psalms 83\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":85,\"label\":\"Psalms 85\"}}]]\n"])</script></body></html>
