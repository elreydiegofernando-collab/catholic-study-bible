-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">106</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Confitemini Domino.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Give glory to the Lord, for he is good: for his mercy endureth for ever.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let them say so that have been redeemed by the Lord, whom he hath redeemed from the hand of the enemy: and gathered out of the countries.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>From the rising and from the setting of the sun, from the north and from the sea.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They wandered in a wilderness, in a place without water: they found not the way of a city for their habitation.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They were hungry and thirsty: their soul fainted in them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they cried to the Lord in their tribulation: and he delivered them out of their distresses.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he led them into the right way, that they might go to a city of habitation.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let the mercies of the Lord give glory to him: and his wonderful works to the children of men.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For he hath satisfied the empty soul, and hath filled the hungry soul with good things.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Such as sat in darkness and in the shadow of death: bound in want and in iron.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Because they had exasperated the words of God: and provoked the counsel of the most High:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And their heart was humbled with labours: they were weakened, and there was none to help them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then they cried to the Lord in their affliction: and he delivered them out of their distresses.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he brought them out of darkness, and the shadow of death; and broke their bonds in sunder.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Because he hath broken gates of brass, and burst iron bars.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He took them out of the way of their iniquity: for they were brought low for their injustices.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Their soul abhorred all manner of meat: and they drew nigh even to the gates of death.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they cried to the Lord in their affliction: and he delivered them out of their distresses.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He sent his word, and healed them: and delivered them from their destructions.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Let the mercies of the Lord give glory to him: and his wonderful works to the children of men.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And let them sacrifice the sacrifice of praise: and declare his works with joy.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>They that go down to the sea in ships, doing business in the great waters:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>These have seen the works of the Lord, and his wonders in the deep.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He said the word, and there arose a storm of wind: and the waves thereof were lifted up.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>They mount up to the heavens, and they go down to the depths: their soul pined away with evils.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>They were troubled, and reeled like a drunken man; and all their wisdom was swallowed up.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they cried to the Lord in their affliction: and he brought them out of their distresses.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he turned the storm into a breeze: and its waves were still.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And they rejoiced because they were still: and he brought them to the haven which they wished for.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And let them exalt him in the church of the people: and praise him in the chair of the ancients.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He hath turned rivers into a wilderness: and the sources of waters into dry ground:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>A fruitful land into barrenness, for the wickedness of them that dwell therein.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>He hath turned a wilderness into pools of waters, and a dry land into water springs.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And hath placed there the hungry; and they made a city for their habitation.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And they sowed fields, and planted vineyards: and they yielded fruit of birth.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he blessed them, and they were multiplied exceedingly: and their cattle he suffered not to decrease.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Then they were brought to be few: and they were afflicted through the trouble of evils and sorrow.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Contempt was poured forth upon their princes: and he caused them to wander where there was no passing, and out of the way.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And he helped the poor out of poverty: and made him families like a flock of sheep.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The just shall see, and shall rejoice, and all iniquity shall stop her mouth.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Who is wise, and will keep these things; and will understand the mercies of the Lord?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dicant qui redempti sunt a Domino, quos redemit de manu inimici, et de regionibus congregavit eos,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>a solis ortu, et occasu, ab aquilone, et mari.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erraverunt in solitudine, in inaquoso ; viam civitatis habitaculi non invenerunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Esurientes et sitientes, anima eorum in ipsis defecit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et clamaverunt ad Dominum cum tribularentur, et de necessitatibus eorum eripuit eos ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et deduxit eos in viam rectam, ut irent in civitatem habitationis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quia satiavit animam inanem, et animam esurientem satiavit bonis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sedentes in tenebris et umbra mortis ; vinctos in mendicitate et ferro.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quia exacerbaverunt eloquia Dei, et consilium Altissimi irritaverunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et humiliatum est in laboribus cor eorum ; infirmati sunt, nec fuit qui adjuvaret.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et clamaverunt ad Dominum cum tribularentur ; et de necessitatibus eorum liberavit eos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et eduxit eos de tenebris et umbra mortis, et vincula eorum dirupit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quia contrivit portas æreas, et vectes ferreos confregit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Suscepit eos de via iniquitatis eorum ; propter injustitias enim suas humiliati sunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omnem escam abominata est anima eorum, et appropinquaverunt usque ad portas mortis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et clamaverunt ad Dominum cum tribularentur, et de necessitatibus eorum liberavit eos.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Misit verbum suum, et sanavit eos, et eripuit eos de interitionibus eorum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et sacrificent sacrificium laudis, et annuntient opera ejus in exsultatione.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui descendunt mare in navibus, facientes operationem in aquis multis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>ipsi viderunt opera Domini, et mirabilia ejus in profundo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixit, et stetit spiritus procellæ, et exaltati sunt fluctus ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ascendunt usque ad cælos, et descendunt usque ad abyssos ; anima eorum in malis tabescebat.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Turbati sunt, et moti sunt sicut ebrius, et omnis sapientia eorum devorata est.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et clamaverunt ad Dominum cum tribularentur ; et de necessitatibus eorum eduxit eos.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et statuit procellam ejus in auram, et siluerunt fluctus ejus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et lætati sunt quia siluerunt ; et deduxit eos in portum voluntatis eorum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et exaltent eum in ecclesia plebis, et in cathedra seniorum laudent eum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Posuit flumina in desertum, et exitus aquarum in sitim ;</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>terram fructiferam in salsuginem, a malitia inhabitantium in ea.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Posuit desertum in stagna aquarum, et terram sine aqua in exitus aquarum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et collocavit illic esurientes, et constituerunt civitatem habitationis :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et seminaverunt agros et plantaverunt vineas, et fecerunt fructum nativitatis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et benedixit eis, et multiplicati sunt nimis ; et jumenta eorum non minoravit.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et pauci facti sunt et vexati sunt, a tribulatione malorum et dolore.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Effusa est contemptio super principes : et errare fecit eos in invio, et non in via.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et adjuvit pauperem de inopia, et posuit sicut oves familias.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Videbunt recti, et lætabuntur ; et omnis iniquitas oppilabit os suum.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Quis sapiens, et custodiet hæc, et intelliget misericordias Domini ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/105/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 105</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/107/"><span class="min-w-0"><span class= m.\"},{\"verse\":6,\"text\":\"And they cried to the Lord in their tribulation: and he delivered them out of their distresses.\"},{\"verse\":7,\"text\":\"And he led them into the right way, that they might go to a city of habitation.\"},{\"verse\":8,\"text\":\"Let the mercies of the Lord give glory to him: and his wonderful works to the children of men.\"},{\"verse\":9,\"text\":\"For he hath satisfied the empty soul, and hath filled the hungry soul with good things.\"},{\"verse\":10,\"text\":\"Such as sat in darkness and in the shadow of death: bound in want and in iron.\"},{\"verse\":11,\"text\":\"Because they had exasperated the words of God: and provoked the counsel of the most High:\"},{\"verse\":12,\"text\":\"And their heart was humbled with labours: they were weakened, and there was none to help them.\"},{\"verse\":13,\"text\":\"Then they cried to the Lord in their affliction: and he delivered them out of their distresses.\"},{\"verse\":14,\"text\":\"And he brought them out of darkness, and the shadow of death; and broke their bonds in sunder.\"},{\"verse\":15,\"text\":\"Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.\"},{\"verse\":16,\"text\":\"Because he hath broken gates of brass, and burst iron bars.\"},{\"verse\":17,\"text\":\"He took them out of the way of their iniquity: for they were brought low for their injustices.\"},{\"verse\":18,\"text\":\"Their soul abhorred all manner of meat: and they drew nigh even to the gates of death.\"},{\"verse\":19,\"text\":\"And they cried to the Lord in their affliction: and he delivered them out of their distresses.\"},{\"verse\":20,\"text\":\"He sent his word, and healed them: and delivered them from their destructions.\"},{\"verse\":21,\"text\":\"Let the mercies of the Lord give glory to him: and his wonderful works to the children of men.\"},{\"verse\":22,\"text\":\"And let them sacrifice the sacrifice of praise: and declare his works with joy.\"},{\"verse\":23,\"text\":\"They that go down to the sea in ships, doing business in the great waters:\"},{\"verse\":24,\"text\":\"These have seen the works of the Lord, and his wonders in the deep.\"},{\"verse\":25,\"text\":\"He said the word, and there arose a storm of wind: and the waves thereof were lifted up.\"},{\"verse\":26,\"text\":\"They mount up to the heavens, and they go down to the depths: their soul pined away with evils.\"},{\"verse\":27,\"text\":\"They were troubled, and reeled like a drunken man; and all their wisdom was swallowed up.\"},{\"verse\":28,\"text\":\"And they cried to the Lord in their affliction: and he brought them out of their distresses.\"},{\"verse\":29,\"text\":\"And he turned the storm into a breeze: and its waves were still.\"},{\"verse\":30,\"text\":\"And they rejoiced because they were still: and he brought them to the haven which they wished for.\"},{\"verse\":31,\"text\":\"Let the mercies of the Lord give glory to him, and his wonderful works to the children of men.\"},{\"verse\":32,\"text\":\"And let them exalt him in the church of the people: and praise him in the chair of the ancients.\"},{\"verse\":33,\"text\":\"He hath turned rivers into a wilderness: and the sources of waters into dry ground:\"},{\"verse\":34,\"text\":\"A fruitful land into barrenness, for the wickedness of them that dwell therein.\"},{\"verse\":35,\"text\":\"He hath turned a wilderness into pools of waters, and a dry land into water springs.\"},{\"verse\":36,\"text\":\"And hath placed there the hungry; and they made a city for their habitation.\"},{\"verse\":37,\"text\":\"And they sowed fields, and planted vineyards: and they yielded fruit of birth.\"},{\"verse\":38,\"text\":\"And he blessed them, and they were multiplied exceedingly: and their cattle he suffered not to decrease.\"},{\"verse\":39,\"text\":\"Then they were brought to be few: and they were afflicted through the trouble of evils and sorrow.\"},{\"verse\":40,\"text\":\"Contempt was poured forth upon their princes: and he caused them to wander where there was no passing, and out of the way.\"},{\"verse\":41,\"text\":\"And he helped the poor out of poverty: and made him families like a flock of sheep.\"},{\"verse\":42,\"text\":\"The just shall see, and shall rejoice, and all iniquity shall stop her mouth.\"},{\"verse\":43,\"text\":\"Who is wise, and will keep these things; and will understand the mercies of the Lord?\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.\"},{\"verse\":2,\"text\":\"Dicant qui redempti sunt a Domino, quos redemit de manu inimici, et de regionibus congregavit eos,\"},{\"verse\":3,\"text\":\"a solis ortu, et occasu, ab aquilone, et mari.\"},{\"verse\":4,\"text\":\"Erraverunt in solitudine, in inaquoso ; viam civitatis habitaculi non invenerunt.\"},{\"verse\":5,\"text\":\"Esurientes et sitientes, anima eorum in ipsis defecit.\"},{\"verse\":6,\"text\":\"Et clamaverunt ad Dominum cum tribularentur, et de necessitatibus eorum eripuit eos ;\"},{\"verse\":7,\"text\":\"et deduxit eos in viam rectam, ut irent in civitatem habitationis.\"},{\"verse\":8,\"text\":\"Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.\"},{\"verse\":9,\"text\":\"Quia satiavit animam inanem, et animam esurientem satiavit bonis.\"},{\"verse\":10,\"text\":\"Sedentes in tenebris et umbra mortis ; vinctos in mendicitate et ferro.\"},{\"verse\":11,\"text\":\"Quia exacerbaverunt eloquia Dei, et consilium Altissimi irritaverunt.\"},{\"verse\":12,\"text\":\"Et humiliatum est in laboribus cor eorum ; infirmati sunt, nec fuit qui adjuvaret.\"},{\"verse\":13,\"text\":\"Et clamaverunt ad Dominum cum tribularentur ; et de necessitatibus eorum liberavit eos.\"},{\"verse\":14,\"text\":\"Et eduxit eos de tenebris et umbra mortis, et vincula eorum dirupit.\"},{\"verse\":15,\"text\":\"Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.\"},{\"verse\":16,\"text\":\"Quia contrivit portas æreas, et vectes ferreos confregit.\"},{\"verse\":17,\"text\":\"Suscepit eos de via iniquitatis eorum ; propter injustitias enim suas humiliati sunt.\"},{\"verse\":18,\"text\":\"Omnem escam abominata est anima eorum, et appropinquaverunt usque ad portas mortis.\"},{\"verse\":19,\"text\":\"Et clamaverunt ad Dominum cum tribularentur, et de necessitatibus eorum liberavit eos.\"},{\"verse\":20,\"text\":\"Misit verbum suum, et sanavit eos, et eripuit eos de interitionibus eorum.\"},{\"verse\":21,\"text\":\"Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.\"},{\"verse\":22,\"text\":\"Et sacrificent sacrificium laudis, et annuntient opera ejus in exsultatione.\"},{\"verse\":23,\"text\":\"Qui descendunt mare in navibus, facientes operationem in aquis multis :\"},{\"verse\":24,\"text\":\"ipsi viderunt opera Domini, et mirabilia ejus in profundo.\"},{\"verse\":25,\"text\":\"Dixit, et stetit spiritus procellæ, et exaltati sunt fluctus ejus.\"},{\"verse\":26,\"text\":\"Ascendunt usque ad cælos, et descendunt usque ad abyssos ; anima eorum in malis tabescebat.\"},{\"verse\":27,\"text\":\"Turbati sunt, et moti sunt sicut ebrius, et omnis sapientia eorum devorata est.\"},{\"verse\":28,\"text\":\"Et clamaverunt ad Dominum cum tribularentur ; et de necessitatibus eorum eduxit eos.\"},{\"verse\":29,\"text\":\"Et statuit procellam ejus in auram, et siluerunt fluctus ejus.\"},{\"verse\":30,\"text\":\"Et lætati sunt quia siluerunt ; et deduxit eos in portum voluntatis eorum.\"},{\"verse\":31,\"text\":\"Confiteantur Domino misericordiæ ejus, et mirabilia ejus filiis hominum.\"},{\"verse\":32,\"text\":\"Et exaltent eum in ecclesia plebis, et in cathedra seniorum laudent eum.\"},{\"verse\":33,\"text\":\"Posuit flumina in desertum, et exitus aquarum in sitim ;\"},{\"verse\":34,\"text\":\"terram fructiferam in salsuginem, a malitia inhabitantium in ea.\"},{\"verse\":35,\"text\":\"Posuit desertum in stagna aquarum, et terram sine aqua in exitus aquarum.\"},{\"verse\":36,\"text\":\"Et collocavit illic esurientes, et constituerunt civitatem habitationis :\"},{\"verse\":37,\"text\":\"et seminaverunt agros et plantaverunt vineas, et fecerunt fructum nativitatis.\"},{\"verse\":38,\"text\":\"Et benedixit eis, et multiplicati sunt nimis ; et jumenta eorum non minoravit.\"},{\"verse\":39,\"text\":\"Et pauci facti sunt et vexati sunt, a tribulatione malorum et dolore.\"},{\"verse\":40,\"text\":\"Effusa est contemptio super principes : et errare fecit eos in invio, et non in via.\"},{\"verse\":41,\"text\":\"Et adjuvit pauperem de inopia, et posuit sicut oves familias.\"},{\"verse\":42,\"text\":\"Videbunt recti, et lætabuntur ; et omnis iniquitas oppilabit os suum.\"},{\"verse\":43,\"text\":\"Quis sapiens, et custodiet hæc, et intelliget misericordias Domini ?\"}],\"summary\":\"Confitemini Domino.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":105,\"label\":\"Psalms 105\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":107,\"label\":\"Psalms 107\"}}]]\n"])</script></body></html>
