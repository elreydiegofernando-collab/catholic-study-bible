 data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Why have the Gentiles raged, and the people devised vain things?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The kings of the earth stood up, and the princes met together, against the Lord, and against his Christ.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let us break their bonds asunder: and let us cast away their yoke from us.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He that dwelleth in heaven shall laugh at them: and the Lord shall deride them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Then shall he speak to them in his anger, and trouble them in his rage.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But I am appointed king by him over Sion, his holy mountain, preaching his commandment.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The Lord hath said to me: Thou art my son, this day have I begotten thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ask of me, and I will give thee the Gentiles for thy inheritance, and the utmost parts of the earth for thy possession.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou shalt rule them with a rod of iron, and shalt break them in pieces like a potter’s vessel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And now, O ye kings, understand: receive instruction, you that judge the earth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Serve ye the Lord with fear: and rejoice unto him with trembling.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Embrace discipline, lest at any time the Lord be angry, and you perish from the just way.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>When his wrath shall be kindled in a short time, blessed are all they that trust in him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quare fremuerunt gentes, et populi meditati sunt inania ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Astiterunt reges terræ, et principes convenerunt in unum adversus Dominum, et adversus christum ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dirumpamus vincula eorum, et projiciamus a nobis jugum ipsorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui habitat in cælis irridebit eos, et Dominus subsannabit eos.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tunc loquetur ad eos in ira sua, et in furore suo conturbabit eos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ego autem constitutus sum rex ab eo super Sion, montem sanctum ejus, prædicans præceptum ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dominus dixit ad me : Filius meus es tu ; ego hodie genui te.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Postula a me, et dabo tibi gentes hæreditatem tuam, et possessionem tuam terminos terræ.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Reges eos in virga ferrea, et tamquam vas figuli confringes eos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et nunc, reges, intelligite ; erudimini, qui judicatis terram.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Servite Domino in timore, et exsultate ei cum tremore.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Apprehendite disciplinam, nequando irascatur Dominus, et pereatis de via justa.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cum exarserit in brevi ira ejus, beati omnes qui confidunt in eo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-pape
