data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A psalm for David. Of the sons of Jonadab, and the former captives. In thee, O Lord, I have hoped, let me never be put to confusion:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deliver me in thy justice, and rescue me. Incline thy ear unto me, and save me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Be thou unto me a God, a protector, and a place of strength: that thou mayst make me safe. For thou art my firmament and my refuge.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Deliver me, O my God, out of the hand of the sinner, and out of the hand of the transgressor of the law and of the unjust.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For thou art my patience, O Lord: my hope, O Lord, from my youth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>By thee have I been confirmed from the womb: from my mother’s womb thou art my protector. Of thee I shall continually sing:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I am become unto many as a wonder, but thou art a strong helper.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let my mouth be filled with praise, that I may sing thy glory; thy greatness all the day long.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cast me not off in the time of old age: when my strength shall fail, do not thou forsake me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For my enemies have spoken against me; and they that watched my soul have consulted together,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Saying: God hath forsaken him: pursue and take him, for there is none to deliver him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>O God, be not thou far from me: O my God, make haste to my help.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let them be confounded and come to nothing that detract my soul; let them be covered with confusion and shame that seek my hurt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I will always hope; and will add to all thy praise.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My mouth shall shew forth thy justice; thy salvation all the day long. Because I have not known learning,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I will enter into the powers of the Lord: O Lord, I will be mindful of thy justice alone.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou hast taught me, O God, from my youth: and till now I will declare thy wonderful works.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And unto old age and grey hairs: O God, forsake me not, Until I shew forth thy arm to all the generation that is to come: Thy power,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And thy justice, O God, even to the highest great things thou hast done: O God, who is like to thee?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>How great troubles hast thou shewn me, many and grievous: and turning thou hast brought me to life, and hast brought me back again from the depths of the earth:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou hast multiplied thy magnificence; and turning to me thou hast comforted me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For I will also confess to thee thy truth with the instruments of psaltery: O God, I will sing to thee with the harp, thou holy one of Israel.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>My lips shall greatly rejoice, when I shall sing to thee; and my soul which thou hast redeemed.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Yea and my tongue shall meditate on thy justice all the day; when they shall be confounded and put to shame that seek evils to me.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David, filiorum Jonadab, et priorum captivorum. In te, Domine, speravi ; non confundar in æternum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In justitia tua libera me, et eripe me : inclina ad me aurem tuam, et salva me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Esto mihi in Deum protectorem, et in locum munitum, ut salvum me facias : quoniam firmamentum meum et refugium meum es tu.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Deus meus, eripe me de manu peccatoris, et de manu contra legem agentis, et iniqui :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quoniam tu es patientia mea, Domine ; Domine, spes mea a juventute mea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In te confirmatus sum ex utero ; de ventre matris meæ tu es protector meus ; in te cantatio mea semper.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tamquam prodigium factus sum multis ; et tu adjutor fortis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Repleatur os meum laude, ut cantem gloriam tuam, tota die magnitudinem tuam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ne projicias me in tempore senectutis ; cum defecerit virtus mea, ne derelinquas me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quia dixerunt inimici mei mihi, et qui custodiebant animam meam consilium fecerunt in unum,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>dicentes : Deus dereliquit eum : persequimini et comprehendite eum, quia non est qui eripiat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deus, ne elongeris a me ; Deus meus, in auxilium meum respice.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Confundantur et deficiant detrahentes animæ meæ ; operiantur confusione et pudore qui quærunt mala mihi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego autem semper sperabo, et adjiciam super omnem laudem tuam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Os meum annuntiabit justitiam tuam, tota die salutare tuum. Quoniam non cognovi litteraturam,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>introibo in potentias Domini ; Domine, memorabor justitiæ tuæ solius.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Deus, docuisti me a juventute mea ; et usque nunc pronuntiabo mirabilia tua.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et usque in senectam et senium, Deus, ne derelinquas me, donec annuntiem brachium tuum generationi omni quæ ventura est, potentiam tuam,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et justitiam tuam, Deus, usque in altissima ; quæ fecisti magnalia, Deus : quis similis tibi ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quantas ostendisti mihi tribulationes multas et malas ! et conversus vivificasti me, et de abyssis terræ iterum reduxisti me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Multiplicasti magnificentiam tuam ; et conversus consolatus es me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nam et ego confitebor tibi in vasis psalmi veritatem tuam, Deus ; psallam tibi in cithara, sanctus Israël.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Exsultabunt labia mea cum cantavero tibi ; et anima mea quam redemisti.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Sed et lingua mea tota die meditabitur justitiam tuam, cum confusi et reveriti fuerint qui quærunt mala mihi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/69/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 69</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href ",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.70\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":70,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"A psalm for David. Of the sons of Jonadab, and the former captives. In thee, O Lord, I have hoped, let me never be put to confusion:\"},{\"verse\":2,\"text\":\"Deliver me in thy justice, and rescue me. Incline thy ear unto me, and save me.\"},{\"verse\":3,\"text\":\"Be thou unto me a God, a protector, and a place of strength: that thou mayst make me safe. For thou art my firmament and my refuge.\"},{\"verse\":4,\"text\":\"Deliver me, O my God, out of the hand of the sinner, and out of the hand of the transgressor of the law and of the unjust.\"},{\"verse\":5,\"text\":\"For thou art my patience, O Lord: my hope, O Lord, from my youth.\"},{\"verse\":6,\"text\":\"By thee have I been confirmed from the womb: from my mother’s womb thou art my protector. Of thee I shall continually sing:\"},{\"verse\":7,\"text\":\"I am become unto many as a wonder, but thou art a strong helper.\"},{\"verse\":8,\"text\":\"Let my mouth be filled with praise, that I may sing thy glory; thy greatness all the day long.\"},{\"verse\":9,\"text\":\"Cast me not off in the time of old age: when my strength shall fail, do not thou forsake me.\"},{\"verse\":10,\"text\":\"For my enemies have spoken against me; and they that watched my soul have consulted together,\"},{\"verse\":11,\"text\":\"Saying: God hath forsaken him: pursue and take him, for there is none to deliver him.\"},{\"verse\":12,\"text\":\"O God, be not thou far from me: O my God, make haste to my help.\"},{\"verse\":13,\"text\":\"Let them be confounded and come to nothing that detract my soul; let them be covered with confusion and shame that seek my hurt.\"},{\"verse\":14,\"text\":\"But I will always hope; and will add to all thy praise.\"},{\"verse\":15,\"text\":\"My mouth shall shew forth thy justice; thy salvation all the day long. Because I have not known learning,\"},{\"verse\":16,\"text\":\"I will enter into the powers of the Lord: O Lord, I will be mindful of thy justice alone.\"},{\"verse\":17,\"text\":\"Thou hast taught me, O God, from my youth: and till now I will declare thy wonderful works.\"},{\"verse\":18,\"text\":\"And unto old age and grey hairs: O God, forsake me not, Until I shew forth thy arm to all the generation that is to come: Thy power,\"},{\"verse\":19,\"text\":\"And thy justice, O God, even to the highest great things thou hast done: O God, who is like to thee?\"},{\"verse\":20,\"text\":\"How great troubles hast thou shewn me, many and grievous: and turning thou hast brought me to life, and hast brought me back again from the depths of the earth:\"},{\"verse\":21,\"text\":\"Thou hast multiplied thy magnificence; and turning to me thou hast comforted me.\"},{\"verse\":22,\"text\":\"For I will also confess to thee thy truth with the instruments of psaltery: O God, I will sing to thee with the harp, thou holy one of Israel.\"},{\"verse\":23,\"text\":\"My lips shall greatly rejoice, when I shall sing to thee; and my soul which thou hast redeemed.\"},{\"verse\":24,\"text\":\"Yea and my tongue shall meditate on thy justice all the day; when they shall be confounded and put to shame that seek evils to me.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus David, filiorum Jonadab, et priorum captivorum. In te, Domine, speravi ; non confundar in æternum.\"},{\"verse\":2,\"text\":\"In justitia tua libera me, et eripe me : inclina ad me aurem tuam, et salva me.\"},{\"verse\":3,\"text\":\"Esto mihi in Deum protectorem, et in locum munitum, ut salvum me facias : quoniam firmamentum meum et refugium meum es tu.\"},{\"verse\":4,\"text\":\"Deus meus, eripe me de manu peccatoris, et de manu contra legem agentis, et iniqui :\"},{\"verse\":5,\"text\":\"quoniam tu es patientia mea, Domine ; Domine, spes mea a juventute mea.\"},{\"verse\":6,\"text\":\"In te confirmatus sum ex utero ; de ventre matris meæ tu es protector meus ; in te cantatio mea semper.\"},{\"verse\":7,\"text\":\"Tamquam prodigium factus sum multis ; et tu adjutor fortis.\"},{\"verse\":8,\"text\":\"Repleatur os meum laude, ut cantem gloriam tuam, tota die magnitudinem tuam.\"},{\"verse\":9,\"text\":\"Ne projicias me in tempore senectutis ; cum defecerit virtus mea, ne derelinquas me.\"},{\"verse\":10,\"text\":\"Quia dixerunt inimici mei mihi, et qui custodiebant animam meam consilium fecerunt in unum,\"},{\"verse\":11,\"text\":\"dicentes : Deus dereliquit eum : persequimini et comprehendite eum, quia non est qui eripiat.\"},{\"verse\":12,\"text\":\"Deus, ne elongeris a me ; Deus meus, in auxilium meum respice.\"},{\"verse\":13,\"text\":\"Confundantur et deficiant detrahentes animæ meæ ; operiantur confusione et pudore qui quærunt mala mihi.\"},{\"verse\":14,\"text\":\"Ego autem semper sperabo, et adjiciam super omnem laudem tuam.\"},{\"verse\":15,\"text\":\"Os meum annuntiabit justitiam tuam, tota die salutare tuum. Quoniam non cognovi litteraturam,\"},{\"verse\":16,\"text\":\"introibo in potentias Domini ; Domine, memorabor justitiæ tuæ solius.\"},{\"verse\":17,\"text\":\"Deus, docuisti me a juventute mea ; et usque nunc pronuntiabo mirabilia tua.\"},{\"verse\":18,\"text\":\"Et usque in senectam et senium, Deus, ne derelinquas me, donec annuntiem brachium tuum generationi omni quæ ventura est, potentiam tuam,\"},{\"verse\":19,\"text\":\"et justitiam tuam, Deus, usque in altissima ; quæ fecisti magnalia, Deus : quis similis tibi ?\"},{\"verse\":20,\"text\":\"Quantas ostendisti mihi tribulationes multas et malas ! et conversus vivificasti me, et de abyssis terræ iterum reduxisti me.\"},{\"verse\":21,\"text\":\"Multiplicasti magnificentiam tuam ; et conversus consolatus es me.\"},{\"verse\":22,\"text\":\"Nam et ego confitebor tibi in vasis psalmi veritatem tuam, Deus ; psallam tibi in cithara, sanctus Israël.\"},{\"verse\":23,\"text\":\"Exsultabunt labia mea cum cantavero tibi ; et anima mea quam redemisti.\"},{\"verse\":24,\"text\":\"Sed et lingua mea tota die meditabitur justitiam tuam, cum confusi et reveriti fuerint qui quærunt mala mihi.\"}],\"summary\":\"In te, Domine.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":69,\"label\":\"Psalms 69\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":71,\"label\":\"Psalms 71\"}}]]\n"])</script></body></html>
