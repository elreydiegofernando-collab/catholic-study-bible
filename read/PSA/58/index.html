20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">58</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Eripe me.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, destroy not, for David for an inscription of a title, when Saul sent and watched his house to kill him. [1 Kings 19.]</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deliver me from my enemies, O my God; and defend me from them that rise up against me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deliver me from them that work iniquity, and save me from bloody men.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For behold they have caught my soul: the mighty have rushed in upon me:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Neither is it my iniquity, nor my sin, O Lord: without iniquity have I run, and directed my steps.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Rise up thou to meet me, and behold: even thou, O Lord, the God of hosts, the God of Israel. Attend to visit all the nations: have no mercy on all them that work iniquity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They shall return at evening, and shall suffer hunger like dogs: and shall go round about the city.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Behold they shall speak with their mouth, and a sword is in their lips: for who, say they, hath heard us?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But thou, O Lord, shalt laugh at them: thou shalt bring all the nations to nothing.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I will keep my strength to thee: for thou art my protector:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My God, his mercy shall prevent me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>God shall let me see over my enemies: slay them not, lest at any time my people forget. Scatter them by thy power; and bring them down, O Lord, my protector:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the sin of their mouth, and the word of their lips: and let them be taken in their pride. And for their cursing and lying they shall be talked of,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>When they are consumed: when they are consumed by thy wrath, and they shall be no more. And they shall know that God will rule Jacob, and all the ends of the earth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They shall return at evening and shall suffer hunger like dogs: and shall go round about the city.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>They shall be scattered abroad to eat, and shall murmur if they be not filled.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But I will sing thy strength: and will extol thy mercy in the morning. For thou art become my support, and my refuge, in the day of my trouble.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Unto thee, O my helper, will I sing, for thou art God my defence: my God my mercy.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, ne disperdas. David in tituli inscriptionem, quando misit Saul et custodivit domum ejus ut eum interficeret.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Eripe me de inimicis meis, Deus meus, et ab insurgentibus in me libera me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Eripe me de operantibus iniquitatem, et de viris sanguinum salva me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia ecce ceperunt animam meam ; irruerunt in me fortes.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Neque iniquitas mea, neque peccatum meum, Domine ; sine iniquitate cucurri, et direxi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Exsurge in occursum meum, et vide : et tu, Domine Deus virtutum, Deus Israël, intende ad visitandas omnes gentes : non miserearis omnibus qui operantur iniquitatem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Convertentur ad vesperam, et famem patientur ut canes : et circuibunt civitatem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ecce loquentur in ore suo, et gladius in labiis eorum : quoniam quis audivit ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et tu, Domine, deridebis eos ; ad nihilum deduces omnes gentes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fortitudinem meam ad te custodiam, quia, Deus, susceptor meus es :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Deus meus misericordia ejus præveniet me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deus ostendet mihi super inimicos meos : ne occidas eos, nequando obliviscantur populi mei. Disperge illos in virtute tua, et depone eos, protector meus, Domine :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>delictum oris eorum, sermonem labiorum ipsorum ; et comprehendantur in superbia sua. Et de execratione et mendacio annuntiabuntur</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>in consummatione : in ira consummationis, et non erunt. Et scient quia Deus dominabitur Jacob, et finium terræ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Convertentur ad vesperam, et famem patientur ut canes : et circuibunt civitatem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ipsi dispergentur ad manducandum ; si vero non fuerint saturati, et murmurabunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ego autem cantabo fortitudinem tuam, et exsultabo mane misericordiam tuam : quia factus es susceptor meus, et refugium meum in die tribulationis meæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Adjutor meus, tibi psallam, quia Deus susceptor meus es ; Deus meus, misericordia mea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/57/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 57</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/59/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 59</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapt rt my protector:\"},{\"verse\":11,\"text\":\"My God, his mercy shall prevent me.\"},{\"verse\":12,\"text\":\"God shall let me see over my enemies: slay them not, lest at any time my people forget. Scatter them by thy power; and bring them down, O Lord, my protector:\"},{\"verse\":13,\"text\":\"For the sin of their mouth, and the word of their lips: and let them be taken in their pride. And for their cursing and lying they shall be talked of,\"},{\"verse\":14,\"text\":\"When they are consumed: when they are consumed by thy wrath, and they shall be no more. And they shall know that God will rule Jacob, and all the ends of the earth.\"},{\"verse\":15,\"text\":\"They shall return at evening and shall suffer hunger like dogs: and shall go round about the city.\"},{\"verse\":16,\"text\":\"They shall be scattered abroad to eat, and shall murmur if they be not filled.\"},{\"verse\":17,\"text\":\"But I will sing thy strength: and will extol thy mercy in the morning. For thou art become my support, and my refuge, in the day of my trouble.\"},{\"verse\":18,\"text\":\"Unto thee, O my helper, will I sing, for thou art God my defence: my God my mercy.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, ne disperdas. David in tituli inscriptionem, quando misit Saul et custodivit domum ejus ut eum interficeret.\"},{\"verse\":2,\"text\":\"Eripe me de inimicis meis, Deus meus, et ab insurgentibus in me libera me.\"},{\"verse\":3,\"text\":\"Eripe me de operantibus iniquitatem, et de viris sanguinum salva me.\"},{\"verse\":4,\"text\":\"Quia ecce ceperunt animam meam ; irruerunt in me fortes.\"},{\"verse\":5,\"text\":\"Neque iniquitas mea, neque peccatum meum, Domine ; sine iniquitate cucurri, et direxi.\"},{\"verse\":6,\"text\":\"Exsurge in occursum meum, et vide : et tu, Domine Deus virtutum, Deus Israël, intende ad visitandas omnes gentes : non miserearis omnibus qui operantur iniquitatem.\"},{\"verse\":7,\"text\":\"Convertentur ad vesperam, et famem patientur ut canes : et circuibunt civitatem.\"},{\"verse\":8,\"text\":\"Ecce loquentur in ore suo, et gladius in labiis eorum : quoniam quis audivit ?\"},{\"verse\":9,\"text\":\"Et tu, Domine, deridebis eos ; ad nihilum deduces omnes gentes.\"},{\"verse\":10,\"text\":\"Fortitudinem meam ad te custodiam, quia, Deus, susceptor meus es :\"},{\"verse\":11,\"text\":\"Deus meus misericordia ejus præveniet me.\"},{\"verse\":12,\"text\":\"Deus ostendet mihi super inimicos meos : ne occidas eos, nequando obliviscantur populi mei. Disperge illos in virtute tua, et depone eos, protector meus, Domine :\"},{\"verse\":13,\"text\":\"delictum oris eorum, sermonem labiorum ipsorum ; et comprehendantur in superbia sua. Et de execratione et mendacio annuntiabuntur\"},{\"verse\":14,\"text\":\"in consummatione : in ira consummationis, et non erunt. Et scient quia Deus dominabitur Jacob, et finium terræ.\"},{\"verse\":15,\"text\":\"Convertentur ad vesperam, et famem patientur ut canes : et circuibunt civitatem.\"},{\"verse\":16,\"text\":\"Ipsi dispergentur ad manducandum ; si vero non fuerint saturati, et murmurabunt.\"},{\"verse\":17,\"text\":\"Ego autem cantabo fortitudinem tuam, et exsultabo mane misericordiam tuam : quia factus es susceptor meus, et refugium meum in die tribulationis meæ.\"},{\"verse\":18,\"text\":\"Adjutor meus, tibi psallam, quia Deus susceptor meus es ; Deus meus, misericordia mea.\"}],\"summary\":\"Eripe me.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":57,\"label\":\"Psalms 57\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":59,\"label\":\"Psalms 59\"}}]]\n"])</script></body></html>
