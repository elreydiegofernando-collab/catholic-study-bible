 data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for Idithun himself, a canticle of David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I said: I will take heed to my ways: that I sin not with my tongue. I have set a guard to my mouth, when the sinner stood against me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I was dumb, and was humbled, and kept silence from good things: and my sorrow was renewed.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>My heart grew hot within me: and in my meditation a fire shall flame out.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I spoke with my tongue: O Lord, make me know my end. And what is the number of my days: that I may know what is wanting to me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Behold thou hast made my days measurable, and my substance is as nothing before thee. And indeed all things are vanity: every man living.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Surely man passeth as an image: yea, and he is disquieted in vain. He storeth up: and he knoweth not for whom he shall gather these things.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And now what is my hope? is it not the Lord? and my substance is with thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Deliver thou me from all my iniquities: thou hast made me a reproach to the fool.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I was dumb, and I opened not my mouth, because thou hast done it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Remove thy scourges from me. The strength of thy hand hath made me faint in rebukes:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou hast corrected man for iniquity. And thou hast made his soul to waste away like a spider: surely in vain is any man disquieted.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hear my prayer, O Lord, and my supplication: give ear to my tears. Be not silent: for I am a stranger with thee, and a sojourner as all my fathers were.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>O forgive me, that I may be refreshed, before I go hence, and be no more.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, ipsi Idithun. Canticum David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dixi : Custodiam vias meas : ut non delinquam in lingua mea. Posui ori meo custodiam, cum consisteret peccator adversum me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Obmutui, et humiliatus sum, et silui a bonis ; et dolor meus renovatus est.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Concaluit cor meum intra me ; et in meditatione mea exardescet ignis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Locutus sum in lingua mea : Notum fac mihi, Domine, finem meum, et numerum dierum meorum quis est, ut sciam quid desit mihi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ecce mensurabiles posuisti dies meos, et substantia mea tamquam nihilum ante te. Verumtamen universa vanitas, omnis homo vivens.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Verumtamen in imagine pertransit homo ; sed et frustra conturbatur : thesaurizat, et ignorat cui congregabit ea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et nunc quæ est exspectatio mea : nonne Dominus ? et substantia mea apud te est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ab omnibus iniquitatibus meis erue me : opprobrium insipienti dedisti me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Obmutui, et non aperui os meum, quoniam tu fecisti ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>amove a me plagas tuas.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A fortitudine manus tuæ ego defeci in increpationibus : propter iniquitatem corripuisti hominem. Et tabescere fecisti sicut araneam animam ejus : verumtamen vane conturbatur omnis homo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Exaudi orationem meam, Domine, et deprecationem meam ; auribus percipe lacrimas meas. Ne sileas, quoniam advena ego sum apud te, et peregrinus sicut omnes patres mei.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Remitte mihi, ut refrigerer priusquam abeam et amplius non ero.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/37/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span>< and kept silence from good things: and my sorrow was renewed.\"},{\"verse\":4,\"text\":\"My heart grew hot within me: and in my meditation a fire shall flame out.\"},{\"verse\":5,\"text\":\"I spoke with my tongue: O Lord, make me know my end. And what is the number of my days: that I may know what is wanting to me.\"},{\"verse\":6,\"text\":\"Behold thou hast made my days measurable, and my substance is as nothing before thee. And indeed all things are vanity: every man living.\"},{\"verse\":7,\"text\":\"Surely man passeth as an image: yea, and he is disquieted in vain. He storeth up: and he knoweth not for whom he shall gather these things.\"},{\"verse\":8,\"text\":\"And now what is my hope? is it not the Lord? and my substance is with thee.\"},{\"verse\":9,\"text\":\"Deliver thou me from all my iniquities: thou hast made me a reproach to the fool.\"},{\"verse\":10,\"text\":\"I was dumb, and I opened not my mouth, because thou hast done it.\"},{\"verse\":11,\"text\":\"Remove thy scourges from me. The strength of thy hand hath made me faint in rebukes:\"},{\"verse\":12,\"text\":\"Thou hast corrected man for iniquity. And thou hast made his soul to waste away like a spider: surely in vain is any man disquieted.\"},{\"verse\":13,\"text\":\"Hear my prayer, O Lord, and my supplication: give ear to my tears. Be not silent: for I am a stranger with thee, and a sojourner as all my fathers were.\"},{\"verse\":14,\"text\":\"O forgive me, that I may be refreshed, before I go hence, and be no more.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, ipsi Idithun. Canticum David.\"},{\"verse\":2,\"text\":\"Dixi : Custodiam vias meas : ut non delinquam in lingua mea. Posui ori meo custodiam, cum consisteret peccator adversum me.\"},{\"verse\":3,\"text\":\"Obmutui, et humiliatus sum, et silui a bonis ; et dolor meus renovatus est.\"},{\"verse\":4,\"text\":\"Concaluit cor meum intra me ; et in meditatione mea exardescet ignis.\"},{\"verse\":5,\"text\":\"Locutus sum in lingua mea : Notum fac mihi, Domine, finem meum, et numerum dierum meorum quis est, ut sciam quid desit mihi.\"},{\"verse\":6,\"text\":\"Ecce mensurabiles posuisti dies meos, et substantia mea tamquam nihilum ante te. Verumtamen universa vanitas, omnis homo vivens.\"},{\"verse\":7,\"text\":\"Verumtamen in imagine pertransit homo ; sed et frustra conturbatur : thesaurizat, et ignorat cui congregabit ea.\"},{\"verse\":8,\"text\":\"Et nunc quæ est exspectatio mea : nonne Dominus ? et substantia mea apud te est.\"},{\"verse\":9,\"text\":\"Ab omnibus iniquitatibus meis erue me : opprobrium insipienti dedisti me.\"},{\"verse\":10,\"text\":\"Obmutui, et non aperui os meum, quoniam tu fecisti ;\"},{\"verse\":11,\"text\":\"amove a me plagas tuas.\"},{\"verse\":12,\"text\":\"A fortitudine manus tuæ ego defeci in increpationibus : propter iniquitatem corripuisti hominem. Et tabescere fecisti sicut araneam animam ejus : verumtamen vane conturbatur omnis homo.\"},{\"verse\":13,\"text\":\"Exaudi orationem meam, Domine, et deprecationem meam ; auribus percipe lacrimas meas. Ne sileas, quoniam advena ego sum apud te, et peregrinus sicut omnes patres mei.\"},{\"verse\":14,\"text\":\"Remitte mihi, ut refrigerer priusquam abeam et amplius non ero.\"}],\"summary\":\"Dixi custodiam.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":37,\"label\":\"Psalms 37\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":39,\"label\":\"Psalms 39\"}}]]\n"])</script></body></html>
