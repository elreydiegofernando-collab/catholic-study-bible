tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">118</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Beati immaculati.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Blessed are the undefiled in the way, who walk in the law of the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Blessed are they that search his testimonies: that seek him with their whole heart.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For they that work iniquity, have not walked in his ways.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou hast commanded thy commandments to be kept most diligently.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>O! that my ways may be directed to keep thy justifications.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then shall I not be confounded, when I shall look into all thy commandments.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I will praise thee with uprightness of heart, when I shall have learned the judgments of thy justice.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I will keep thy justifications: O! do not thou utterly forsake me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>By what doth a young man correct his way? by observing thy words.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>With my whole heart have I sought after thee: let me not stray from thy commandments.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thy words have I hidden in my heart, that I may not sin against thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Blessed art thou, O Lord: teach me thy justifications.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>With my lips I have pronounced all the judgments of thy mouth.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I have been delighted in the way of thy testimonies, as in all riches.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I will meditate on thy commandments: and I will consider thy ways.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I will think of thy justifications: I will not forget thy words.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Give bountifully to thy servant, enliven me: and I shall keep thy words.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Open thou my eyes: and I will consider the wondrous things of thy law.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I am a sojourner on the earth: hide not thy commandments from me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>My soul hath coveted to long for thy justifications, at all times.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou hast rebuked the proud: they are cursed who decline from thy commandments.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Remove from me reproach and contempt: because I have sought after thy testimonies.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For princes sat, and spoke against me: but thy servant was employed in thy justifications.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For thy testimonies are my meditation: and thy justifications my counsel.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>My soul hath cleaved to the pavement: quicken thou me according to thy word.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>I have declared my ways, and thou hast heard me: teach me thy justifications.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Make me to understand the way of thy justifications: and I shall be exercised in thy wondrous works.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>My soul hath slumbered through heaviness: strengthen thou me in thy words.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Remove from me the way of iniquity: and out of thy law have mercy on me.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I have chosen the way of truth: thy judgments I have not forgotten.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>I have stuck to thy testimonies, O Lord: put me not to shame.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>I have run the way of thy commandments, when thou didst enlarge my heart.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Set before me for a law the way of thy justifications, O Lord: and I will always seek after it.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Give me understanding, and I will search thy law; and I will keep it with my whole heart.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Lead me into the path of thy commandments; for this same I have desired.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Incline my heart into thy testimonies and not to covetousness.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Turn away my eyes that they may not behold vanity: quicken me in thy way.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Establish thy word to thy servant, in thy fear.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Turn away my reproach, which I have apprehended: for thy judgments are delightful.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Behold I have longed after thy precepts: quicken me in thy justice.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Let thy mercy also come upon me, O Lord: thy salvation according to thy word.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>So shall I answer them that reproach me in any thing; that I have trusted in thy words.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And take not thou the word of truth utterly out of my mouth: for in thy words, I have hoped exceedingly.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>So shall I always keep thy law, for ever and ever.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And I walked at large: because I have sought after thy commandments.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And I spoke of thy testimonies before kings: and I was not ashamed.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>I meditated also on thy commandments, which I loved.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And I lifted up my hands to thy commandments, which I loved: and I was exercised in thy justifications.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Be thou mindful of thy word to thy servant, in which thou hast given me hope.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>This hath comforted me in my humiliation: because thy word hath enlivened me.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>The proud did iniquitously altogether: but I declined not from thy law.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>I remembered, O Lord, thy judgments of old: and I was comforted.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>A fainting hath taken hold of me, because of the wicked that forsake thy law.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Thy justifications were the subject of my song, in the place of my pilgrimage.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>In the night I have remembered thy name, O Lord: and have kept thy law.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>This happened to me: because I sought after thy justifications.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>O Lord, my portion, I have said, I would keep thy law.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>I entreated thy face with all my heart: have mercy on me according to thy word.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>I have thought on my ways: and turned my feet unto thy testimonies.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>I am ready, and am not troubled: that I may keep thy commandments.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>The cords of the wicked have encompassed me: but I have not forgotten thy law.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>I rose at midnight to give praise to thee; for the judgments of thy justification.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>I am a partaker with all them that fear thee, and that keep thy commandments.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>The earth, O Lord, is full of thy mercy: teach me thy justifications.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Thou hast done well with thy servant, O Lord, according to thy word.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Teach me goodness and discipline and knowledge; for I have believed thy commandments.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Before I was humbled I offended; therefore have I kept thy word.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Thou art good; and in thy goodness teach me thy justifications.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>The iniquity of the proud hath been multiplied over me: but I will seek thy commandments with my whole heart.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Their heart is curdled like milk: but I have meditated on thy law.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>It is good for me that thou hast humbled me, that I may learn thy justifications.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>The law of thy mouth is good to me, above thousands of gold and silver.</button><button type="button" data-verse="73" aria-pressed="false" class="verse"><sup>73</sup>Thy hands have made me and formed me: give me understanding, and I will learn thy commandments.</button><button type="button" data-verse="74" aria-pressed="false" class="verse"><sup>74</sup>They that fear thee shall see me, and shall be glad: because I have greatly hoped in thy words.</button><button type="button" data-verse="75" aria-pressed="false" class="verse"><sup>75</sup>I know, O Lord, that thy judgments are equity: and in thy truth thou hast humbled me.</button><button type="button" data-verse="76" aria-pressed="false" class="verse"><sup>76</sup>O! let thy mercy be for my comfort, according to thy word unto thy servant.</button><button type="button" data-verse="77" aria-pressed="false" class="verse"><sup>77</sup>Let thy tender mercies come unto me, and I shall live: for thy law is my meditation.</button><button type="button" data-verse="78" aria-pressed="false" class="verse"><sup>78</sup>Let the proud be ashamed, because they have done unjustly towards me: but I will be employed in thy commandments.</button><button type="button" data-verse="79" aria-pressed="false" class="verse"><sup>79</sup>Let them that fear thee turn to me: and they that know thy testimonies.</button><button type="button" data-verse="80" aria-pressed="false" class="verse"><sup>80</sup>Let my heart be undefiled in thy justifications, that I may not be confounded.</button><button type="button" data-verse="81" aria-pressed="false" class="verse"><sup>81</sup>My soul hath fainted after thy salvation: and in thy word I have very much hoped.</button><button type="button" data-verse="82" aria-pressed="false" class="verse"><sup>82</sup>My eyes have failed for thy word, saying: When wilt thou comfort me?</button><button type="button" data-verse="83" aria-pressed="false" class="verse"><sup>83</sup>For I am become like a bottle in the frost: I have not forgotten thy justifications.</button><button type="button" data-verse="84" aria-pressed="false" class="verse"><sup>84</sup>How many are the days of thy servant: when wilt thou execute judgment on them that persecute me?</button><button type="button" data-verse="85" aria-pressed="false" class="verse"><sup>85</sup>The wicked have told me fables: but not as thy law.</button><button type="button" data-verse="86" aria-pressed="false" class="verse"><sup>86</sup>All thy statutes are truth: they have persecuted me unjustly, do thou help me.</button><button type="button" data-verse="87" aria-pressed="false" class="verse"><sup>87</sup>They had almost made an end of me upon earth: but I have not forsaken thy commandments.</button><button type="button" data-verse="88" aria-pressed="false" class="verse"><sup>88</sup>Quicken thou me according to thy mercy: and I shall keep the testimonies of thy mouth.</button><button type="button" data-verse="89" aria-pressed="false" class="verse"><sup>89</sup>For ever, O Lord, thy word standeth firm in heaven.</button><button type="button" data-verse="90" aria-pressed="false" class="verse"><sup>90</sup>Thy truth unto all generations: thou hast founded the earth, and it continueth.</button><button type="button" data-verse="91" aria-pressed="false" class="verse"><sup>91</sup>By thy ordinance the day goeth on: for all things serve thee.</button><button type="button" data-verse="92" aria-pressed="false" class="verse"><sup>92</sup>Unless thy law had been my meditation, I had then perhaps perished in my abjection.</button><button type="button" data-verse="93" aria-pressed="false" class="verse"><sup>93</sup>Thy justifications I will never forget: for by them thou hast given me life.</button><button type="button" data-verse="94" aria-pressed="false" class="verse"><sup>94</sup>I am thine, save thou me: for I have sought thy justifications.</button><button type="button" data-verse="95" aria-pressed="false" class="verse"><sup>95</sup>The wicked have waited for me to destroy me: but I have understood thy testimonies.</button><button type="button" data-verse="96" aria-pressed="false" class="verse"><sup>96</sup>I have seen an end of all perfection: thy commandment is exceeding broad.</button><button type="button" data-verse="97" aria-pressed="false" class="verse"><sup>97</sup>O how have I loved thy law, O Lord! it is my meditation all the day.</button><button type="button" data-verse="98" aria-pressed="false" class="verse"><sup>98</sup>Through thy commandment, thou hast made me wiser than my enemies: for it is ever with me.</button><button type="button" data-verse="99" aria-pressed="false" class="verse"><sup>99</sup>I have understood more than all my teachers: because thy testimonies are my meditation.</button><button type="button" data-verse="100" aria-pressed="false" class="verse"><sup>100</sup>I have had understanding above ancients: because I have sought thy commandments.</button><button type="button" data-verse="101" aria-pressed="false" class="verse"><sup>101</sup>I have restrained my feet from every evil way: that I may keep thy words.</button><button type="button" data-verse="102" aria-pressed="false" class="verse"><sup>102</sup>I have not declined from thy judgments, because thou hast set me a law.</button><button type="button" data-verse="103" aria-pressed="false" class="verse"><sup>103</sup>How sweet are thy words to my palate! more than honey to my mouth.</button><button type="button" data-verse="104" aria-pressed="false" class="verse"><sup>104</sup>By thy commandments I have had understanding: therefore have I hated every way of iniquity.</button><button type="button" data-verse="105" aria-pressed="false" class="verse"><sup>105</sup>Thy word is a lamp to my feet, and a light to my paths.</button><button type="button" data-verse="106" aria-pressed="false" class="verse"><sup>106</sup>I have sworn and am determined to keep the judgments of thy justice.</button><button type="button" data-verse="107" aria-pressed="false" class="verse"><sup>107</sup>I have been humbled, O Lord, exceedingly: quicken thou me according to thy word.</button><button type="button" data-verse="108" aria-pressed="false" class="verse"><sup>108</sup>The free offerings of my mouth make acceptable, O Lord: and teach me thy judgments.</button><button type="button" data-verse="109" aria-pressed="false" class="verse"><sup>109</sup>My soul is continually in my hands: and I have not forgotten thy law.</button><button type="button" data-verse="110" aria-pressed="false" class="verse"><sup>110</sup>Sinners have laid a snare for me: but I have not erred from thy precepts.</button><button type="button" data-verse="111" aria-pressed="false" class="verse"><sup>111</sup>I have purchased thy testimonies for an inheritance for ever: because they are the joy of my heart.</button><button type="button" data-verse="112" aria-pressed="false" class="verse"><sup>112</sup>I have inclined my heart to do thy justifications for ever, for the reward.</button><button type="button" data-verse="113" aria-pressed="false" class="verse"><sup>113</sup>I have hated the unjust: and have loved thy law.</button><button type="button" data-verse="114" aria-pressed="false" class="verse"><sup>114</sup>Thou art my helper and my protector: and in thy word I have greatly hoped.</button><button type="button" data-verse="115" aria-pressed="false" class="verse"><sup>115</sup>Depart from me, ye malignant: and I will search the commandments of my God.</button><button type="button" data-verse="116" aria-pressed="false" class="verse"><sup>116</sup>Uphold me according to thy word, and I shall live: and let me not be confounded in my expectation.</button><button type="button" data-verse="117" aria-pressed="false" class="verse"><sup>117</sup>Help me, and I shall be saved: and I will meditate always on thy justifications.</button><button type="button" data-verse="118" aria-pressed="false" class="verse"><sup>118</sup>Thou hast despised all them that fall off from thy judgments; for their thought is unjust.</button><button type="button" data-verse="119" aria-pressed="false" class="verse"><sup>119</sup>I have accounted all the sinners of the earth prevaricators: therefore have I loved thy testimonies.</button><button type="button" data-verse="120" aria-pressed="false" class="verse"><sup>120</sup>Pierce thou my flesh with thy fear: for I am afraid of thy judgments.</button><button type="button" data-verse="121" aria-pressed="false" class="verse"><sup>121</sup>I have done judgment and justice: give me not up to them that slander me.</button><button type="button" data-verse="122" aria-pressed="false" class="verse"><sup>122</sup>Uphold thy servant unto good: let not the proud calumniate me.</button><button type="button" data-verse="123" aria-pressed="false" class="verse"><sup>123</sup>My eyes have fainted after thy salvation: and for the word of thy justice.</button><button type="button" data-verse="124" aria-pressed="false" class="verse"><sup>124</sup>Deal with thy servant according to thy mercy: and teach me thy justifications.</button><button type="button" data-verse="125" aria-pressed="false" class="verse"><sup>125</sup>I am thy servant: give me understanding that I may know thy testimonies.</button><button type="button" data-verse="126" aria-pressed="false" class="verse"><sup>126</sup>It is time, O Lord, to do: they have dissipated thy law.</button><button type="button" data-verse="127" aria-pressed="false" class="verse"><sup>127</sup>Therefore have I loved thy commandments above gold and the topaz.</button><button type="button" data-verse="128" aria-pressed="false" class="verse"><sup>128</sup>Therefore was I directed to all thy commandments: I have hated all wicked ways.</button><button type="button" data-verse="129" aria-pressed="false" class="verse"><sup>129</sup>Thy testimonies are wonderful: therefore my soul hath sought them.</button><button type="button" data-verse="130" aria-pressed="false" class="verse"><sup>130</sup>The declaration of thy words giveth light: and giveth understanding to little ones.</button><button type="button" data-verse="131" aria-pressed="false" class="verse"><sup>131</sup>I opened my mouth, and panted: because I longed for thy commandments.</button><button type="button" data-verse="132" aria-pressed="false" class="verse"><sup>132</sup>Look thou upon me, and have mercy on me according to the judgment of them that love thy name.</button><button type="button" data-verse="133" aria-pressed="false" class="verse"><sup>133</sup>Direct my steps according to thy word: and let no iniquity have dominion over me.</button><button type="button" data-verse="134" aria-pressed="false" class="verse"><sup>134</sup>Redeem me from the calumnies of men: that I may keep thy commandments.</button><button type="button" data-verse="135" aria-pressed="false" class="verse"><sup>135</sup>Make thy face to shine upon thy servant: and teach me thy justifications.</button><button type="button" data-verse="136" aria-pressed="false" class="verse"><sup>136</sup>My eyes have sent forth springs of water: because they have not kept thy law.</button><button type="button" data-verse="137" aria-pressed="false" class="verse"><sup>137</sup>Thou art just, O Lord: and thy judgment is right.</button><button type="button" data-verse="138" aria-pressed="false" class="verse"><sup>138</sup>Thou hast commanded justice thy testimonies: and thy truth exceedingly.</button><button type="button" data-verse="139" aria-pressed="false" class="verse"><sup>139</sup>My zeal hath made me pine away: because my enemies forgot thy words.</button><button type="button" data-verse="140" aria-pressed="false" class="verse"><sup>140</sup>Thy word is exceedingly refined: and thy servant hath loved it.</button><button type="button" data-verse="141" aria-pressed="false" class="verse"><sup>141</sup>I am very young and despised; but I forget not thy justifications.</button><button type="button" data-verse="142" aria-pressed="false" class="verse"><sup>142</sup>Thy justice is justice for ever: and thy law is the truth.</button><button type="button" data-verse="143" aria-pressed="false" class="verse"><sup>143</sup>Trouble and anguish have found me: thy commandments are my meditation.</button><button type="button" data-verse="144" aria-pressed="false" class="verse"><sup>144</sup>Thy testimonies are justice for ever: give me understanding, and I shall live.</button><button type="button" data-verse="145" aria-pressed="false" class="verse"><sup>145</sup>I cried with my whole heart, hear me, O Lord: I will seek thy justifications.</button><button type="button" data-verse="146" aria-pressed="false" class="verse"><sup>146</sup>I cried unto thee, save me: that I may keep thy commandments.</button><button type="button" data-verse="147" aria-pressed="false" class="verse"><sup>147</sup>I prevented the dawning of the day, and cried: because in thy words I very much hoped.</button><button type="button" data-verse="148" aria-pressed="false" class="verse"><sup>148</sup>My eyes to thee have prevented the morning: that I might meditate on thy words.</button><button type="button" data-verse="149" aria-pressed="false" class="verse"><sup>149</sup>Hear thou my voice, O Lord, according to thy mercy: and quicken me according to thy judgment.</button><button type="button" data-verse="150" aria-pressed="false" class="verse"><sup>150</sup>They that persecute me have drawn nigh to iniquity; but they are gone far off from thy law.</button><button type="button" data-verse="151" aria-pressed="false" class="verse"><sup>151</sup>Thou art near, O Lord: and all thy ways are truth.</button><button type="button" data-verse="152" aria-pressed="false" class="verse"><sup>152</sup>I have known from the beginning concerning thy testimonies: that thou hast founded them for ever.</button><button type="button" data-verse="153" aria-pressed="false" class="verse"><sup>153</sup>See my humiliation and deliver me for I have not forgotten thy law.</button><button type="button" data-verse="154" aria-pressed="false" class="verse"><sup>154</sup>Judge my judgment and redeem me: quicken thou me for thy word’s sake.</button><button type="button" data-verse="155" aria-pressed="false" class="verse"><sup>155</sup>Salvation is far from sinners; because they have not sought thy justifications.</button><button type="button" data-verse="156" aria-pressed="false" class="verse"><sup>156</sup>Many, O Lord, are thy mercies: quicken me according to thy judgment.</button><button type="button" data-verse="157" aria-pressed="false" class="verse"><sup>157</sup>Many are they that persecute me and afflict me; but I have not declined from thy testimonies.</button><button type="button" data-verse="158" aria-pressed="false" class="verse"><sup>158</sup>I beheld the transgressors, and pined away; because they kept not thy word.</button><button type="button" data-verse="159" aria-pressed="false" class="verse"><sup>159</sup>Behold I have loved thy commandments, O Lord; quicken me thou in thy mercy.</button><button type="button" data-verse="160" aria-pressed="false" class="verse"><sup>160</sup>The beginning of thy words is truth: all the judgments of thy justice are for ever.</button><button type="button" data-verse="161" aria-pressed="false" class="verse"><sup>161</sup>Princes have persecuted me without cause: and my heart hath been in awe of thy words.</button><button type="button" data-verse="162" aria-pressed="false" class="verse"><sup>162</sup>I will rejoice at thy words, as one that hath found great spoil.</button><button type="button" data-verse="163" aria-pressed="false" class="verse"><sup>163</sup>I have hated and abhorred iniquity; but I have loved thy law.</button><button type="button" data-verse="164" aria-pressed="false" class="verse"><sup>164</sup>Seven times a day I have given praise to thee, for the judgments of thy justice.</button><button type="button" data-verse="165" aria-pressed="false" class="verse"><sup>165</sup>Much peace have they that love thy law, and to them there is no stumbling block.</button><button type="button" data-verse="166" aria-pressed="false" class="verse"><sup>166</sup>I looked for thy salvation, O Lord: and I loved thy commandments.</button><button type="button" data-verse="167" aria-pressed="false" class="verse"><sup>167</sup>My soul hath kept thy testimonies and hath loved them exceedingly.</button><button type="button" data-verse="168" aria-pressed="false" class="verse"><sup>168</sup>I have kept thy commandments and thy testimonies: because all my ways are in thy sight.</button><button type="button" data-verse="169" aria-pressed="false" class="verse"><sup>169</sup>Let my supplication, O Lord, come near in thy sight: give me understanding according to thy word.</button><button type="button" data-verse="170" aria-pressed="false" class="verse"><sup>170</sup>Let my request come in before thee; deliver thou me according to thy word.</button><button type="button" data-verse="171" aria-pressed="false" class="verse"><sup>171</sup>My lips shall utter a hymn, when thou shalt teach me thy justifications.</button><button type="button" data-verse="172" aria-pressed="false" class="verse"><sup>172</sup>My tongue shall pronounce thy word: because all thy commandments are justice.</button><button type="button" data-verse="173" aria-pressed="false" class="verse"><sup>173</sup>Let thy hand be with me to save me; for I have chosen thy precepts.</button><button type="button" data-verse="174" aria-pressed="false" class="verse"><sup>174</sup>I have longed for thy salvation, O Lord; and thy law is my meditation.</button><button type="button" data-verse="175" aria-pressed="false" class="verse"><sup>175</sup>My soul shall live and shall praise thee: and thy judgments shall help me.</button><button type="button" data-verse="176" aria-pressed="false" class="verse"><sup>176</sup>I have gone astray like a sheep that is lost: seek thy servant, because I have not forgotten thy commandments.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. Aleph Beati immaculati in via, qui ambulant in lege Domini.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beati qui scrutantur testimonia ejus ; in toto corde exquirunt eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non enim qui operantur iniquitatem in viis ejus ambulaverunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tu mandasti mandata tua custodiri nimis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Utinam dirigantur viæ meæ ad custodiendas justificationes tuas.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tunc non confundar, cum perspexero in omnibus mandatis tuis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Confitebor tibi in directione cordis, in eo quod didici judicia justitiæ tuæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Justificationes tuas custodiam ; non me derelinquas usquequaque.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Beth In quo corrigit adolescentior viam suam ? in custodiendo sermones tuos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In toto corde meo exquisivi te ; ne repellas me a mandatis tuis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In corde meo abscondi eloquia tua, ut non peccem tibi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Benedictus es, Domine ; doce me justificationes tuas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In labiis meis pronuntiavi omnia judicia oris tui.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In via testimoniorum tuorum delectatus sum, sicut in omnibus divitiis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In mandatis tuis exercebor, et considerabo vias tuas.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In justificationibus tuis meditabor : non obliviscar sermones tuos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ghimel Retribue servo tuo, vivifica me, et custodiam sermones tuos.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Revela oculos meos, et considerabo mirabilia de lege tua.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Incola ego sum in terra : non abscondas a me mandata tua.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Concupivit anima mea desiderare justificationes tuas in omni tempore.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Increpasti superbos ; maledicti qui declinant a mandatis tuis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Aufer a me opprobrium et contemptum, quia testimonia tua exquisivi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Etenim sederunt principes, et adversum me loquebantur ; servus autem tuus exercebatur in justificationibus tuis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nam et testimonia tua meditatio mea est, et consilium meum justificationes tuæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Daleth Adhæsit pavimento anima mea : vivifica me secundum verbum tuum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vias meas enuntiavi, et exaudisti me ; doce me justificationes tuas.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Viam justificationum tuarum instrue me, et exercebor in mirabilibus tuis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dormitavit anima mea præ tædio : confirma me in verbis tuis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Viam iniquitatis amove a me, et de lege tua miserere mei.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Viam veritatis elegi ; judicia tua non sum oblitus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Adhæsi testimoniis tuis, Domine ; noli me confundere.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Viam mandatorum tuorum cucurri, cum dilatasti cor meum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He Legem pone mihi, Domine, viam justificationum tuarum, et exquiram eam semper.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Da mihi intellectum, et scrutabor legem tuam, et custodiam illam in toto corde meo.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Deduc me in semitam mandatorum tuorum, quia ipsam volui.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Inclina cor meum in testimonia tua, et non in avaritiam.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Averte oculos meos, ne videant vanitatem ; in via tua vivifica me.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Statue servo tuo eloquium tuum in timore tuo.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Amputa opprobrium meum quod suspicatus sum, quia judicia tua jucunda.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Ecce concupivi mandata tua : in æquitate tua vivifica me.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Vau Et veniat super me misericordia tua, Domine ; salutare tuum secundum eloquium tuum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et respondebo exprobrantibus mihi verbum, quia speravi in sermonibus tuis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et ne auferas de ore meo verbum veritatis usquequaque, quia in judiciis tuis supersperavi.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et custodiam legem tuam semper, in sæculum et in sæculum sæculi.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et ambulabam in latitudine, quia mandata tua exquisivi.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Et loquebar in testimoniis tuis in conspectu regum, et non confundebar.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Et meditabar in mandatis tuis, quæ dilexi.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Et levavi manus meas ad mandata tua, quæ dilexi, et exercebar in justificationibus tuis.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Zain Memor esto verbi tui servo tuo, in quo mihi spem dedisti.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Hæc me consolata est in humilitate mea, quia eloquium tuum vivificavit me.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Superbi inique agebant usquequaque ; a lege autem tua non declinavi.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Memor fui judiciorum tuorum a sæculo, Domine, et consolatus sum.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Defectio tenuit me, pro peccatoribus derelinquentibus legem tuam.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Cantabiles mihi erant justificationes tuæ in loco peregrinationis meæ.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Memor fui nocte nominis tui, Domine, et custodivi legem tuam.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Hæc facta est mihi, quia justificationes tuas exquisivi.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Heth Portio mea, Domine, dixi custodire legem tuam.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Deprecatus sum faciem tuam in toto corde meo ; miserere mei secundum eloquium tuum.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Cogitavi vias meas, et converti pedes meos in testimonia tua.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Paratus sum, et non sum turbatus, ut custodiam mandata tua.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Funes peccatorum circumplexi sunt me, et legem tuam non sum oblitus.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Media nocte surgebam ad confitendum tibi, super judicia justificationis tuæ.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Particeps ego sum omnium timentium te, et custodientium mandata tua.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Misericordia tua, Domine, plena est terra ; justificationes tuas doce me.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Teth Bonitatem fecisti cum servo tuo, Domine, secundum verbum tuum.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Bonitatem, et disciplinam, et scientiam doce me, quia mandatis tuis credidi.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Priusquam humiliarer ego deliqui : propterea eloquium tuum custodivi.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Bonus es tu, et in bonitate tua doce me justificationes tuas.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Multiplicata est super me iniquitas superborum ; ego autem in toto corde meo scrutabor mandata tua.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Coagulatum est sicut lac cor eorum ; ego vero legem tuam meditatus sum.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>Bonum mihi quia humiliasti me, ut discam justificationes tuas.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>Bonum mihi lex oris tui, super millia auri et argenti.</button><button type="button" data-verse="73" aria-pressed="false" class="verse"><sup>73</sup>Jod Manus tuæ fecerunt me, et plasmaverunt me : da mihi intellectum, et discam mandata tua.</button><button type="button" data-verse="74" aria-pressed="false" class="verse"><sup>74</sup>Qui timent te videbunt me et lætabuntur, quia in verba tua supersperavi.</button><button type="button" data-verse="75" aria-pressed="false" class="verse"><sup>75</sup>Cognovi, Domine, quia æquitas judicia tua, et in veritate tua humiliasti me.</button><button type="button" data-verse="76" aria-pressed="false" class="verse"><sup>76</sup>Fiat misericordia tua ut consoletur me, secundum eloquium tuum servo tuo.</button><button type="button" data-verse="77" aria-pressed="false" class="verse"><sup>77</sup>Veniant mihi miserationes tuæ, et vivam, quia lex tua meditatio mea est.</button><button type="button" data-verse="78" aria-pressed="false" class="verse"><sup>78</sup>Confundantur superbi, quia injuste iniquitatem fecerunt in me ; ego autem exercebor in mandatis tuis.</button><button type="button" data-verse="79" aria-pressed="false" class="verse"><sup>79</sup>Convertantur mihi timentes te, et qui noverunt testimonia tua.</button><button type="button" data-verse="80" aria-pressed="false" class="verse"><sup>80</sup>Fiat cor meum immaculatum in justificationibus tuis, ut non confundar.</button><button type="button" data-verse="81" aria-pressed="false" class="verse"><sup>81</sup>Caph Defecit in salutare tuum anima mea, et in verbum tuum supersperavi.</button><button type="button" data-verse="82" aria-pressed="false" class="verse"><sup>82</sup>Defecerunt oculi mei in eloquium tuum, dicentes : Quando consolaberis me ?</button><button type="button" data-verse="83" aria-pressed="false" class="verse"><sup>83</sup>Quia factus sum sicut uter in pruina ; justificationes tuas non sum oblitus.</button><button type="button" data-verse="84" aria-pressed="false" class="verse"><sup>84</sup>Quot sunt dies servi tui ? quando facies de persequentibus me judicium ?</button><button type="button" data-verse="85" aria-pressed="false" class="verse"><sup>85</sup>Narraverunt mihi iniqui fabulationes, sed non ut lex tua.</button><button type="button" data-verse="86" aria-pressed="false" class="verse"><sup>86</sup>Omnia mandata tua veritas : inique persecuti sunt me, adjuva me.</button><button type="button" data-verse="87" aria-pressed="false" class="verse"><sup>87</sup>Paulominus consummaverunt me in terra ; ego autem non dereliqui mandata tua.</button><button type="button" data-verse="88" aria-pressed="false" class="verse"><sup>88</sup>Secundum misericordiam tuam vivifica me, et custodiam testimonia oris tui.</button><button type="button" data-verse="89" aria-pressed="false" class="verse"><sup>89</sup>Lamed In æternum, Domine, verbum tuum permanet in cælo.</button><button type="button" data-verse="90" aria-pressed="false" class="verse"><sup>90</sup>In generationem et generationem veritas tua ; fundasti terram, et permanet.</button><button type="button" data-verse="91" aria-pressed="false" class="verse"><sup>91</sup>Ordinatione tua perseverat dies, quoniam omnia serviunt tibi.</button><button type="button" data-verse="92" aria-pressed="false" class="verse"><sup>92</sup>Nisi quod lex tua meditatio mea est, tunc forte periissem in humilitate mea.</button><button type="button" data-verse="93" aria-pressed="false" class="verse"><sup>93</sup>In æternum non obliviscar justificationes tuas, quia in ipsis vivificasti me.</button><button type="button" data-verse="94" aria-pressed="false" class="verse"><sup>94</sup>Tuus sum ego ; salvum me fac : quoniam justificationes tuas exquisivi.</button><button type="button" data-verse="95" aria-pressed="false" class="verse"><sup>95</sup>Me exspectaverunt peccatores ut perderent me ; testimonia tua intellexi.</button><button type="button" data-verse="96" aria-pressed="false" class="verse"><sup>96</sup>Omnis consummationis vidi finem, latum mandatum tuum nimis.</button><button type="button" data-verse="97" aria-pressed="false" class="verse"><sup>97</sup>Mem Quomodo dilexi legem tuam, Domine ! tota die meditatio mea est.</button><button type="button" data-verse="98" aria-pressed="false" class="verse"><sup>98</sup>Super inimicos meos prudentem me fecisti mandato tuo, quia in æternum mihi est.</button><button type="button" data-verse="99" aria-pressed="false" class="verse"><sup>99</sup>Super omnes docentes me intellexi, quia testimonia tua meditatio mea est.</button><button type="button" data-verse="100" aria-pressed="false" class="verse"><sup>100</sup>Super senes intellexi, quia mandata tua quæsivi.</button><button type="button" data-verse="101" aria-pressed="false" class="verse"><sup>101</sup>Ab omni via mala prohibui pedes meos, ut custodiam verba tua.</button><button type="button" data-verse="102" aria-pressed="false" class="verse"><sup>102</sup>A judiciis tuis non declinavi, quia tu legem posuisti mihi.</button><button type="button" data-verse="103" aria-pressed="false" class="verse"><sup>103</sup>Quam dulcia faucibus meis eloquia tua ! super mel ori meo.</button><button type="button" data-verse="104" aria-pressed="false" class="verse"><sup>104</sup>A mandatis tuis intellexi ; propterea odivi omnem viam iniquitatis.</button><button type="button" data-verse="105" aria-pressed="false" class="verse"><sup>105</sup>Nun Lucerna pedibus meis verbum tuum, et lumen semitis meis.</button><button type="button" data-verse="106" aria-pressed="false" class="verse"><sup>106</sup>Juravi et statui custodire judicia justitiæ tuæ.</button><button type="button" data-verse="107" aria-pressed="false" class="verse"><sup>107</sup>Humiliatus sum usquequaque, Domine ; vivifica me secundum verbum tuum.</button><button type="button" data-verse="108" aria-pressed="false" class="verse"><sup>108</sup>Voluntaria oris mei beneplacita fac, Domine, et judicia tua doce me.</button><button type="button" data-verse="109" aria-pressed="false" class="verse"><sup>109</sup>Anima mea in manibus meis semper, et legem tuam non sum oblitus.</button><button type="button" data-verse="110" aria-pressed="false" class="verse"><sup>110</sup>Posuerunt peccatores laqueum mihi, et de mandatis tuis non erravi.</button><button type="button" data-verse="111" aria-pressed="false" class="verse"><sup>111</sup>Hæreditate acquisivi testimonia tua in æternum, quia exsultatio cordis mei sunt.</button><button type="button" data-verse="112" aria-pressed="false" class="verse"><sup>112</sup>Inclinavi cor meum ad faciendas justificationes tuas in æternum, propter retributionem.</button><button type="button" data-verse="113" aria-pressed="false" class="verse"><sup>113</sup>Samech Iniquos odio habui, et legem tuam dilexi.</button><button type="button" data-verse="114" aria-pressed="false" class="verse"><sup>114</sup>Adjutor et susceptor meus es tu, et in verbum tuum supersperavi.</button><button type="button" data-verse="115" aria-pressed="false" class="verse"><sup>115</sup>Declinate a me, maligni, et scrutabor mandata Dei mei.</button><button type="button" data-verse="116" aria-pressed="false" class="verse"><sup>116</sup>Suscipe me secundum eloquium tuum, et vivam, et non confundas me ab exspectatione mea.</button><button type="button" data-verse="117" aria-pressed="false" class="verse"><sup>117</sup>Adjuva me, et salvus ero, et meditabor in justificationibus tuis semper.</button><button type="button" data-verse="118" aria-pressed="false" class="verse"><sup>118</sup>Sprevisti omnes discedentes a judiciis tuis, quia injusta cogitatio eorum.</button><button type="button" data-verse="119" aria-pressed="false" class="verse"><sup>119</sup>Prævaricantes reputavi omnes peccatores terræ ; ideo dilexi testimonia tua.</button><button type="button" data-verse="120" aria-pressed="false" class="verse"><sup>120</sup>Confige timore tuo carnes meas ; a judiciis enim tuis timui.</button><button type="button" data-verse="121" aria-pressed="false" class="verse"><sup>121</sup>Ain Feci judicium et justitiam : non tradas me calumniantibus me.</button><button type="button" data-verse="122" aria-pressed="false" class="verse"><sup>122</sup>Suscipe servum tuum in bonum : non calumnientur me superbi.</button><button type="button" data-verse="123" aria-pressed="false" class="verse"><sup>123</sup>Oculi mei defecerunt in salutare tuum, et in eloquium justitiæ tuæ.</button><button type="button" data-verse="124" aria-pressed="false" class="verse"><sup>124</sup>Fac cum servo tuo secundum misericordiam tuam, et justificationes tuas doce me.</button><button type="button" data-verse="125" aria-pressed="false" class="verse"><sup>125</sup>Servus tuus sum ego : da mihi intellectum, ut sciam testimonia tua.</button><button type="button" data-verse="126" aria-pressed="false" class="verse"><sup>126</sup>Tempus faciendi, Domine : dissipaverunt legem tuam.</button><button type="button" data-verse="127" aria-pressed="false" class="verse"><sup>127</sup>Ideo dilexi mandata tua super aurum et topazion.</button><button type="button" data-verse="128" aria-pressed="false" class="verse"><sup>128</sup>Propterea ad omnia mandata tua dirigebar ; omnem viam iniquam odio habui.</button><button type="button" data-verse="129" aria-pressed="false" class="verse"><sup>129</sup>Phe Mirabilia testimonia tua : ideo scrutata est ea anima mea.</button><button type="button" data-verse="130" aria-pressed="false" class="verse"><sup>130</sup>Declaratio sermonum tuorum illuminat, et intellectum dat parvulis.</button><button type="button" data-verse="131" aria-pressed="false" class="verse"><sup>131</sup>Os meum aperui, et attraxi spiritum : quia mandata tua desiderabam.</button><button type="button" data-verse="132" aria-pressed="false" class="verse"><sup>132</sup>Aspice in me, et miserere mei, secundum judicium diligentium nomen tuum.</button><button type="button" data-verse="133" aria-pressed="false" class="verse"><sup>133</sup>Gressus meos dirige secundum eloquium tuum, et non dominetur mei omnis injustitia.</button><button type="button" data-verse="134" aria-pressed="false" class="verse"><sup>134</sup>Redime me a calumniis hominum ut custodiam mandata tua.</button><button type="button" data-verse="135" aria-pressed="false" class="verse"><sup>135</sup>Faciem tuam illumina super servum tuum, et doce me justificationes tuas.</button><button type="button" data-verse="136" aria-pressed="false" class="verse"><sup>136</sup>Exitus aquarum deduxerunt oculi mei, quia non custodierunt legem tuam.</button><button type="button" data-verse="137" aria-pressed="false" class="verse"><sup>137</sup>Sade Justus es, Domine, et rectum judicium tuum.</button><button type="button" data-verse="138" aria-pressed="false" class="verse"><sup>138</sup>Mandasti justitiam testimonia tua, et veritatem tuam nimis.</button><button type="button" data-verse="139" aria-pressed="false" class="verse"><sup>139</sup>Tabescere me fecit zelus meus, quia obliti sunt verba tua inimici mei.</button><button type="button" data-verse="140" aria-pressed="false" class="verse"><sup>140</sup>Ignitum eloquium tuum vehementer, et servus tuus dilexit illud.</button><button type="button" data-verse="141" aria-pressed="false" class="verse"><sup>141</sup>Adolescentulus sum ego et contemptus ; justificationes tuas non sum oblitus.</button><button type="button" data-verse="142" aria-pressed="false" class="verse"><sup>142</sup>Justitia tua, justitia in æternum, et lex tua veritas.</button><button type="button" data-verse="143" aria-pressed="false" class="verse"><sup>143</sup>Tribulatio et angustia invenerunt me ; mandata tua meditatio mea est.</button><button type="button" data-verse="144" aria-pressed="false" class="verse"><sup>144</sup>Æquitas testimonia tua in æternum : intellectum da mihi, et vivam.</button><button type="button" data-verse="145" aria-pressed="false" class="verse"><sup>145</sup>Coph Clamavi in toto corde meo : exaudi me, Domine ; justificationes tuas requiram.</button><button type="button" data-verse="146" aria-pressed="false" class="verse"><sup>146</sup>Clamavi ad te ; salvum me fac : ut custodiam mandata tua.</button><button type="button" data-verse="147" aria-pressed="false" class="verse"><sup>147</sup>Præveni in maturitate, et clamavi : quia in verba tua supersperavi.</button><button type="button" data-verse="148" aria-pressed="false" class="verse"><sup>148</sup>Prævenerunt oculi mei ad te diluculo, ut meditarer eloquia tua.</button><button type="button" data-verse="149" aria-pressed="false" class="verse"><sup>149</sup>Vocem meam audi secundum misericordiam tuam, Domine, et secundum judicium tuum vivifica me.</button><button type="button" data-verse="150" aria-pressed="false" class="verse"><sup>150</sup>Appropinquaverunt persequentes me iniquitati : a lege autem tua longe facti sunt.</button><button type="button" data-verse="151" aria-pressed="false" class="verse"><sup>151</sup>Prope es tu, Domine, et omnes viæ tuæ veritas.</button><button type="button" data-verse="152" aria-pressed="false" class="verse"><sup>152</sup>Initio cognovi de testimoniis tuis, quia in æternum fundasti ea.</button><button type="button" data-verse="153" aria-pressed="false" class="verse"><sup>153</sup>Res Vide humilitatem meam, et eripe me, quia legem tuam non sum oblitus.</button><button type="button" data-verse="154" aria-pressed="false" class="verse"><sup>154</sup>Judica judicium meum, et redime me : propter eloquium tuum vivifica me.</button><button type="button" data-verse="155" aria-pressed="false" class="verse"><sup>155</sup>Longe a peccatoribus salus, quia justificationes tuas non exquisierunt.</button><button type="button" data-verse="156" aria-pressed="false" class="verse"><sup>156</sup>Misericordiæ tuæ multæ, Domine ; secundum judicium tuum vivifica me.</button><button type="button" data-verse="157" aria-pressed="false" class="verse"><sup>157</sup>Multi qui persequuntur me, et tribulant me ; a testimoniis tuis non declinavi.</button><button type="button" data-verse="158" aria-pressed="false" class="verse"><sup>158</sup>Vidi prævaricantes et tabescebam, quia eloquia tua non custodierunt.</button><button type="button" data-verse="159" aria-pressed="false" class="verse"><sup>159</sup>Vide quoniam mandata tua dilexi, Domine : in misericordia tua vivifica me.</button><button type="button" data-verse="160" aria-pressed="false" class="verse"><sup>160</sup>Principium verborum tuorum veritas ; in æternum omnia judicia justitiæ tuæ.</button><button type="button" data-verse="161" aria-pressed="false" class="verse"><sup>161</sup>Sin Principes persecuti sunt me gratis, et a verbis tuis formidavit cor meum.</button><button type="button" data-verse="162" aria-pressed="false" class="verse"><sup>162</sup>Lætabor ego super eloquia tua, sicut qui invenit spolia multa.</button><button type="button" data-verse="163" aria-pressed="false" class="verse"><sup>163</sup>Iniquitatem odio habui, et abominatus sum, legem autem tuam dilexi.</button><button type="button" data-verse="164" aria-pressed="false" class="verse"><sup>164</sup>Septies in die laudem dixi tibi, super judicia justitiæ tuæ.</button><button type="button" data-verse="165" aria-pressed="false" class="verse"><sup>165</sup>Pax multa diligentibus legem tuam, et non est illis scandalum.</button><button type="button" data-verse="166" aria-pressed="false" class="verse"><sup>166</sup>Exspectabam salutare tuum, Domine, et mandata tua dilexi.</button><button type="button" data-verse="167" aria-pressed="false" class="verse"><sup>167</sup>Custodivit anima mea testimonia tua, et dilexit ea vehementer.</button><button type="button" data-verse="168" aria-pressed="false" class="verse"><sup>168</sup>Servavi mandata tua et testimonia tua, quia omnes viæ meæ in conspectu tuo.</button><button type="button" data-verse="169" aria-pressed="false" class="verse"><sup>169</sup>Tau Appropinquet deprecatio mea in conspectu tuo, Domine ; juxta eloquium tuum da mihi intellectum.</button><button type="button" data-verse="170" aria-pressed="false" class="verse"><sup>170</sup>Intret postulatio mea in conspectu tuo ; secundum eloquium tuum eripe me.</button><button type="button" data-verse="171" aria-pressed="false" class="verse"><sup>171</sup>Eructabunt labia mea hymnum, cum docueris me justificationes tuas.</button><button type="button" data-verse="172" aria-pressed="false" class="verse"><sup>172</sup>Pronuntiabit lingua mea eloquium tuum, quia omnia mandata tua æquitas.</button><button type="button" data-verse="173" aria-pressed="false" class="verse"><sup>173</sup>Fiat manus tua ut salvet me, quoniam mandata tua elegi.</button><button type="button" data-verse="174" aria-pressed="false" class="verse"><sup>174</sup>Concupivi salutare tuum, Domine, et lex tua meditatio mea est.</button><button type="button" data-verse="175" aria-pressed="false" class="verse"><sup>175</sup>Vivet anima mea, et laudabit te, et judicia tua adjuvabunt me.</button><button type="button" data-verse="176" aria-pressed="false" class="verse"><sup>176</sup>Erravi sicut ovis quæ periit : quære servum tuum, quia mandata tua non sum oblitus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/117/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 117</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/119/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 119</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="
