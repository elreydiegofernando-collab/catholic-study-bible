},{\"verse\":10,\"text\":\"With my whole heart have I sought after thee: let me not stray from thy commandments.\"},{\"verse\":11,\"text\":\"Thy words have I hidden in my heart, that I may not sin against thee.\"},{\"verse\":12,\"text\":\"Blessed art thou, O Lord: teach me thy justifications.\"},{\"verse\":13,\"text\":\"With my lips I have pronounced all the judgments of thy mouth.\"},{\"verse\":14,\"text\":\"I have been delighted in the way of thy testimonies, as in all riches.\"},{\"verse\":15,\"text\":\"I will meditate on thy commandments: and I will consider thy ways.\"},{\"verse\":16,\"text\":\"I will think of thy justifications: I will not forget thy words.\"},{\"verse\":17,\"text\":\"Give bountifully to thy servant, enliven me: and I shall keep thy words.\"},{\"verse\":18,\"text\":\"Open thou my eyes: and I will consider the wondrous things of thy law.\"},{\"verse\":19,\"text\":\"I am a sojourner on the earth: hide not thy commandments from me.\"},{\"verse\":20,\"text\":\"My soul hath coveted to long for thy justifications, at all times.\"},{\"verse\":21,\"text\":\"Thou hast rebuked the proud: they are cursed who decline from thy commandments.\"},{\"verse\":22,\"text\":\"Remove from me reproach and contempt: because I have sought after thy testimonies.\"},{\"verse\":23,\"text\":\"For princes sat, and spoke against me: but thy servant was employed in thy justifications.\"},{\"verse\":24,\"text\":\"For thy testimonies are my meditation: and thy justifications my counsel.\"},{\"verse\":25,\"text\":\"My soul hath cleaved to the pavement: quicken thou me according to thy word.\"},{\"verse\":26,\"text\":\"I have declared my ways, and thou hast heard me: teach me thy justifications.\"},{\"verse\":27,\"text\":\"Make me to understand the way of thy justifications: and I shall be exercised in thy wondrous works.\"},{\"verse\":28,\"text\":\"My soul hath slumbered through heaviness: strengthen thou me in thy words.\"},{\"verse\":29,\"text\":\"Remove from me the way of iniquity: and out of thy law have mercy on me.\"},{\"verse\":30,\"text\":\"I have chosen the way of truth: thy judgments I have not forgotten.\"},{\"verse\":31,\"text\":\"I have stuck to thy testimonies, O Lord: put me not to shame.\"},{\"verse\":32,\"text\":\"I have run the way of thy commandments, when thou didst enlarge my heart.\"},{\"verse\":33,\"text\":\"Set before me for a law the way of thy justifications, O Lord: and I will always seek after it.\"},{\"verse\":34,\"text\":\"Give me understanding, and I will search thy law; and I will keep it with my whole heart.\"},{\"verse\":35,\"text\":\"Lead me into the path of thy commandments; for this same I have desired.\"},{\"verse\":36,\"text\":\"Incline my heart into thy testimonies and not to covetousness.\"},{\"verse\":37,\"text\":\"Turn away my eyes that they may not behold vanity: quicken me in thy way.\"},{\"verse\":38,\"text\":\"Establish thy word to thy servant, in thy fear.\"},{\"verse\":39,\"text\":\"Turn away my reproach, which I have apprehended: for thy judgments are delightful.\"},{\"verse\":40,\"text\":\"Behold I have longed after thy precepts: quicken me in thy justice.\"},{\"verse\":41,\"text\":\"Let thy mercy also come upon me, O Lord: thy salvation according to thy word.\"},{\"verse\":42,\"text\":\"So shall I answer them that reproach me in any thing; that I have trusted in thy words.\"},{\"verse\":43,\"text\":\"And take not thou the word of truth utterly out of my mouth: for in thy words, I have hoped exceedingly.\"},{\"verse\":44,\"text\":\"So shall I always keep thy law, for ever and ever.\"},{\"verse\":45,\"text\":\"And I walked at large: because I have sought after thy commandments.\"},{\"verse\":46,\"text\":\"And I spoke of thy testimonies before kings: and I was not ashamed.\"},{\"verse\":47,\"text\":\"I meditated also on thy commandments, which I loved.\"},{\"verse\":48,\"text\":\"And I lifted up my hands to thy commandments, which I loved: and I was exercised in thy justifications.\"},{\"verse\":49,\"text\":\"Be thou mindful of thy word to thy servant, in which thou hast given me hope.\"},{\"verse\":50,\"text\":\"This hath comforted me in my humiliation: because thy word hath enlivened me.\"},{\"verse\":51,\"text\":\"The proud did iniquitously altogether: but I declined not from thy law.\"},{\"verse\":52,\"text\":\"I remembered, O Lord, thy judgments of old: and I was comforted.\"},{\"verse\":53,\"text\":\"A fainting hath taken hold of me, because of the wicked that forsake thy law.\"},{\"verse\":54,\"text\":\"Thy justifications were the subject of my song, in the place of my pilgrimage.\"},{\"verse\":55,\"text\":\"In the night I have remembered thy name, O Lord: and have kept thy law.\"},{\"verse\":56,\"text\":\"This happened to me: because I sought after thy justifications.\"},{\"verse\":57,\"text\":\"O Lord, my portion, I have said, I would keep thy law.\"},{\"verse\":58,\"text\":\"I entreated thy face with all my heart: have mercy on me according to thy word.\"},{\"verse\":59,\"text\":\"I have thought on my ways: and turned my feet unto thy testimonies.\"},{\"verse\":60,\"text\":\"I am ready, and am not troubled: that I may keep thy commandments.\"},{\"verse\":61,\"text\":\"The cords of the wicked have encompassed me: but I have not forgotten thy law.\"},{\"verse\":62,\"text\":\"I rose at midnight to give praise to thee; for the judgments of thy justification.\"},{\"verse\":63,\"text\":\"I am a partaker with all them that fear thee, and that keep thy commandments.\"},{\"verse\":64,\"text\":\"The earth, O Lord, is full of thy mercy: teach me thy justifications.\"},{\"verse\":65,\"text\":\"Thou hast done well with thy servant, O Lord, according to thy word.\"},{\"verse\":66,\"text\":\"Teach me goodness and discipline and knowledge; for I have believed thy commandments.\"},{\"verse\":67,\"text\":\"Before I was humbled I offended; therefore have I kept thy word.\"},{\"verse\":68,\"text\":\"Thou art good; and in thy goodness teach me thy justifications.\"},{\"verse\":69,\"text\":\"The iniquity of the proud hath been multiplied over me: but I will seek thy commandments with my whole heart.\"},{\"verse\":70,\"text\":\"Their heart is curdled like milk: but I have meditated on thy law.\"},{\"verse\":71,\"text\":\"It is good for me that thou hast humbled me, that I may learn thy justifications.\"},{\"verse\":72,\"text\":\"The law of thy mouth is good to me, above thousands of gold and silver.\"},{\"verse\":73,\"text\":\"Thy hands have made me and formed me: give me understanding, and I will learn thy commandments.\"},{\"verse\":74,\"text\":\"They that fear thee shall see me, and shall be glad: because I have greatly hoped in thy words.\"},{\"verse\":75,\"text\":\"I know, O Lord, that thy judgments are equity: and in thy truth thou hast humbled me.\"},{\"verse\":76,\"text\":\"O! let thy mercy be for my comfort, according to thy word unto thy servant.\"},{\"verse\":77,\"text\":\"Let thy tender mercies come unto me, and I shall live: for thy law is my meditation.\"},{\"verse\":78,\"text\":\"Let the proud be ashamed, because they have done unjustly towards me: but I will be employed in thy commandments.\"},{\"verse\":79,\"text\":\"Let them that fear thee turn to me: and they that know thy testimonies.\"},{\"verse\":80,\"text\":\"Let my heart be undefiled in thy justifications, that I may not be confounded.\"},{\"verse\":81,\"text\":\"My soul hath fainted after thy salvation: and in thy word I have very much hoped.\"},{\"verse\":82,\"text\":\"My eyes have failed for thy word, saying: When wilt thou comfort me?\"},{\"verse\":83,\"text\":\"For I am become like a bottle in the frost: I have not forgotten thy justifications.\"},{\"verse\":84,\"text\":\"How many are the days of thy servant: when wilt thou execute judgment on them that persecute me?\"},{\"verse\":85,\"text\":\"The wicked have told me fables: but not as thy law.\"},{\"verse\":86,\"text\":\"All thy statutes are truth: they have persecuted me unjustly, do thou help me.\"},{\"verse\":87,\"text\":\"They had almost made an end of me upon earth: but I have not forsaken thy commandments.\"},{\"verse\":88,\"text\":\"Quicken thou me according to thy mercy: and I shall keep the testimonies of thy mouth.\"},{\"verse\":89,\"text\":\"For ever, O Lord, thy word standeth firm in heaven.\"},{\"verse\":90,\"text\":\"Thy truth unto all generations: thou hast founded the earth, and it continueth.\"},{\"verse\":91,\"text\":\"By thy ordinance the day goeth on: for all things serve thee.\"},{\"verse\":92,\"text\":\"Unless thy law had been my meditation, I had then perhaps perished in my abjection.\"},{\"verse\":93,\"text\":\"Thy justifications I will never forget: for by them thou hast given me life.\"},{\"verse\":94,\"text\":\"I am thine, save thou me: for I have sought thy justifications.\"},{\"verse\":95,\"text\":\"The wicked have waited for me to destroy me: but I have understood thy testimonies.\"},{\"verse\":96,\"text\":\"I have seen an end of all perfection: thy commandment is exceeding broad.\"},{\"verse\":97,\"text\":\"O how have I loved thy law, O Lord! it is my meditation all the day.\"},{\"verse\":98,\"text\":\"Through thy commandment, thou hast made me wiser than my enemies: for it is ever with me.\"},{\"verse\":99,\"text\":\"I have understood more than all my teachers: because thy testimonies are my meditation.\"},{\"verse\":100,\"text\":\"I have had understanding above ancients: because I have sought thy commandments.\"},{\"verse\":101,\"text\":\"I have restrained my feet from every evil way: that I may keep thy words.\"},{\"verse\":102,\"text\":\"I have not declined from thy judgments, because thou hast set me a law.\"},{\"verse\":103,\"text\":\"How sweet are thy words to my palate! more than honey to my mouth.\"},{\"verse\":104,\"text\":\"By thy commandments I have had understanding: therefore have I hated every way of iniquity.\"},{\"verse\":105,\"text\":\"Thy word is a lamp to my feet, and a light to my paths.\"},{\"verse\":106,\"text\":\"I have sworn and am determined to keep the judgments of thy justice.\"},{\"verse\":107,\"text\":\"I have been humbled, O Lord, exceedingly: quicken thou me according to thy word.\"},{\"verse\":108,\"text\":\"The free offerings of my mouth make acceptable, O Lord: and teach me thy judgments.\"},{\"verse\":109,\"text\":\"My soul is continually in my hands: and I have not forgotten thy law.\"},{\"verse\":110,\"text\":\"Sinners have laid a snare for me: but I have not erred from thy precepts.\"},{\"verse\":111,\"text\":\"I have purchased thy testimonies for an inheritance for ever: because they are the joy of my heart.\"},{\"verse\":112,\"text\":\"I have inclined my heart to do thy justifications for ever, for the reward.\"},{\"verse\":113,\"text\":\"I have hated the unjust: and have loved thy law.\"},{\"verse\":114,\"text\":\"Thou art my helper and my protector: and in thy word I have greatly hoped.\"},{\"verse\":115,\"text\":\"Depart from me, ye malignant: and I will search the commandments of my God.\"},{\"verse\":116,\"text\":\"Uphold me according to thy word, and I shall live: and let me not be confounded in my expectation.\"},{\"verse\":117,\"text\":\"Help me, and I shall be saved: and I will meditate always on thy justifications.\"},{\"verse\":118,\"text\":\"Thou hast despised all them that fall off from thy judgments; for their thought is unjust.\"},{\"verse\":119,\"text\":\"I have accounted all the sinners of the earth prevaricators: therefore have I loved thy testimonies.\"},{\"verse\":120,\"text\":\"Pierce thou my flesh with thy fear: for I am afraid of thy judgments.\"},{\"verse\":121,\"text\":\"I have done judgment and justice: give me not up to them that slander me.\"},{\"verse\":122,\"text\":\"Uphold thy servant unto good: let not the proud calumniate me.\"},{\"verse\":123,\"text\":\"My eyes have fainted after thy salvation: and for the word of thy justice.\"},{\"verse\":124,\"text\":\"Deal with thy servant according to thy mercy: and teach me thy justifications.\"},{\"verse\":125,\"text\":\"I am thy servant: give me understanding that I may know thy testimonies.\"},{\"verse\":126,\"text\":\"It is time, O Lord, to do: they have dissipated thy law.\"},{\"verse\":127,\"text\":\"Therefore have I loved thy commandments above gold and the topaz.\"},{\"verse\":128,\"text\":\"Therefore was I directed to all thy commandments: I have hated all wicked ways.\"},{\"verse\":129,\"text\":\"Thy testimonies are wonderful: therefore my soul hath sought them.\"},{\"verse\":130,\"text\":\"The declaration of thy words giveth light: and giveth understanding to little ones.\"},{\"verse\":131,\"text\":\"I opened my mouth, and panted: because I longed for thy commandments.\"},{\"verse\":132,\"text\":\"Look thou upon me, and have mercy on me according to the judgment of them that love thy name.\"},{\"verse\":133,\"text\":\"Direct my steps according to thy word: and let no iniquity have dominion over me.\"},{\"verse\":134,\"text\":\"Redeem me from the calumnies of men: that I may keep thy commandments.\"},{\"verse\":135,\"text\":\"Make thy face to shine upon thy servant: and teach me thy justifications.\"},{\"verse\":136,\"text\":\"My eyes have sent forth springs of water: because they have not kept thy law.\"},{\"verse\":137,\"text\":\"Thou art just, O Lord: and thy judgment is right.\"},{\"verse\":138,\"text\":\"Thou hast commanded justice thy testimonies: and thy truth exceedingly.\"},{\"verse\":139,\"text\":\"My zeal hath made me pine away: because my enemies forgot thy words.\"},{\"verse\":140,\"text\":\"Thy word is exceedingly refined: and thy servant hath loved it.\"},{\"verse\":141,\"text\":\"I am very young and despised; but I forget not thy justifications.\"},{\"verse\":142,\"text\":\"Thy justice is justice for ever: and thy law is the truth.\"},{\"verse\":143,\"text\":\"Trouble and anguish have found me: thy commandments are my meditation.\"},{\"verse\":144,\"text\":\"Thy testimonies are justice for ever: give me understanding, and I shall live.\"},{\"verse\":145,\"text\":\"I cried with my whole heart, hear me, O Lord: I will seek thy justifications.\"},{\"verse\":146,\"text\":\"I cried unto thee, save me: that I may keep thy commandments.\"},{\"verse\":147,\"text\":\"I prevented the dawning of the day, and cried: because in thy words I very much hoped.\"},{\"verse\":148,\"text\":\"My eyes to thee have prevented the morning: that I might meditate on thy words.\"},{\"verse\":149,\"text\":\"Hear thou my voice, O Lord, according to thy mercy: and quicken me according to thy judgment.\"},{\"verse\":150,\"text\":\"They that persecute me have drawn nigh to iniquity; but they are gone far off from thy law.\"},{\"verse\":151,\"text\":\"Thou art near, O Lord: and all thy ways are truth.\"},{\"verse\":152,\"text\":\"I have known from the beginning concerning thy testimonies: that thou hast founded them for ever.\"},{\"verse\":153,\"text\":\"See my humiliation and deliver me for I have not forgotten thy law.\"},{\"verse\":154,\"text\":\"Judge my judgment and redeem me: quicken thou me for thy word’s sake.\"},{\"verse\":155,\"text\":\"Salvation is far from sinners; because they have not sought thy justifications.\"},{\"verse\":156,\"text\":\"Many, O Lord, are thy mercies: quicken me according to thy judgment.\"},{\"verse\":157,\"text\":\"Many are they that persecute me and afflict me; but I have not declined from thy testimonies.\"},{\"verse\":158,\"text\":\"I beheld the transgressors, and pined away; because they kept not thy word.\"},{\"verse\":159,\"text\":\"Behold I have loved thy commandments, O Lord; quicken me thou in thy mercy.\"},{\"verse\":160,\"text\":\"The beginning of thy words is truth: all the judgments of thy justice are for ever.\"},{\"verse\":161,\"text\":\"Princes have persecuted me without cause: and my heart hath been in awe of thy words.\"},{\"verse\":162,\"text\":\"I will rejoice at thy words, as one that hath found great spoil.\"},{\"verse\":163,\"text\":\"I have hated and abhorred iniquity; but I have loved thy law.\"},{\"verse\":164,\"text\":\"Seven times a day I have given praise to thee, for the judgments of thy justice.\"},{\"verse\":165,\"text\":\"Much peace have they that love thy law, and to them there is no stumbling block.\"},{\"verse\":166,\"text\":\"I looked for thy salvation, O Lord: and I loved thy commandments.\"},{\"verse\":167,\"text\":\"My soul hath kept thy testimonies and hath loved them exceedingly.\"},{\"verse\":168,\"text\":\"I have kept thy commandments and thy testimonies: because all my ways are in thy sight.\"},{\"verse\":169,\"text\":\"Let my supplication, O Lord, come near in thy sight: give me understanding according to thy word.\"},{\"verse\":170,\"text\":\"Let my request come in before thee; deliver thou me according to thy word.\"},{\"verse\":171,\"text\":\"My lips shall utter a hymn, when thou shalt teach me thy justifications.\"},{\"verse\":172,\"text\":\"My tongue shall pronounce thy word: because all thy commandments are justice.\"},{\"verse\":173,\"text\":\"Let thy hand be with me to save me; for I have chosen thy precepts.\"},{\"verse\":174,\"text\":\"I have longed for thy salvation, O Lord; and thy law is my meditation.\"},{\"verse\":175,\"text\":\"My soul shall live and shall praise thee: and thy judgments shall help me.\"},{\"verse\":176,\"text\":\"I have gone astray like a sheep that is lost: seek thy servant, because I have not forgotten thy commandments.\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. Aleph Beati immaculati in via, qui ambulant in lege Domini.\"},{\"verse\":2,\"text\":\"Beati qui scrutantur testimonia ejus ; in toto corde exquirunt eum.\"},{\"verse\":3,\"text\":\"Non enim qui operantur iniquitatem in viis ejus ambulaverunt.\"},{\"verse\":4,\"text\":\"Tu mandasti mandata tua custodiri nimis.\"},{\"verse\":5,\"text\":\"Utinam dirigantur viæ meæ ad custodiendas justificationes tuas.\"},{\"verse\":6,\"text\":\"Tunc non confundar, cum perspexero in omnibus mandatis tuis.\"},{\"verse\":7,\"text\":\"Confitebor tibi in directione cordis, in eo quod didici judicia justitiæ tuæ.\"},{\"verse\":8,\"text\":\"Justificationes tuas custodiam ; non me derelinquas usquequaque.\"},{\"verse\":9,\"text\":\"Beth In quo corrigit adolescentior viam suam ? in custodiendo sermones tuos.\"},{\"verse\":10,\"text\":\"In toto corde meo exquisivi te ; ne repellas me a mandatis tuis.\"},{\"verse\":11,\"text\":\"In corde meo abscondi eloquia tua, ut non peccem tibi.\"},{\"verse\":12,\"text\":\"Benedictus es, Domine ; doce me justificationes tuas.\"},{\"verse\":13,\"text\":\"In labiis meis pronuntiavi omnia judicia oris tui.\"},{\"verse\":14,\"text\":\"In via testimoniorum tuorum delectatus sum, sicut in omnibus divitiis.\"},{\"verse\":15,\"text\":\"In mandatis tuis exercebor, et considerabo vias tuas.\"},{\"verse\":16,\"text\":\"In justificationibus tuis meditabor : non obliviscar sermones tuos.\"},{\"verse\":17,\"text\":\"Ghimel Retribue servo tuo, vivifica me, et custodiam sermones tuos.\"},{\"verse\":18,\"text\":\"Revela oculos meos, et considerabo mirabilia de lege tua.\"},{\"verse\":19,\"text\":\"Incola ego sum in terra : non abscondas a me mandata tua.\"},{\"verse\":20,\"text\":\"Concupivit anima mea desiderare justificationes tuas in omni tempore.\"},{\"verse\":21,\"text\":\"Increpasti superbos ; maledicti qui declinant a mandatis tuis.\"},{\"verse\":22,\"text\":\"Aufer a me opprobrium et contemptum, quia testimonia tua exquisivi.\"},{\"verse\":23,\"text\":\"Etenim sederunt principes, et adversum me loquebantur ; servus autem tuus exercebatur in justificationibus tuis.\"},{\"verse\":24,\"text\":\"Nam et testimonia tua meditatio mea est, et consilium meum justificationes tuæ.\"},{\"verse\":25,\"text\":\"Daleth Adhæsit pavimento anima mea : vivifica me secundum verbum tuum.\"},{\"verse\":26,\"text\":\"Vias meas enuntiavi, et exaudisti me ; doce me justificationes tuas.\"},{\"verse\":27,\"text\":\"Viam justificationum tuarum instrue me, et exercebor in mirabilibus tuis.\"},{\"verse\":28,\"text\":\"Dormitavit anima mea præ tædio : confirma me in verbis tuis.\"},{\"verse\":29,\"text\":\"Viam iniquitatis amove a me, et de lege tua miserere mei.\"},{\"verse\":30,\"text\":\"Viam veritatis elegi ; judicia tua non sum oblitus.\"},{\"verse\":31,\"text\":\"Adhæsi testimoniis tuis, Domine ; noli me confundere.\"},{\"verse\":32,\"text\":\"Viam mandatorum tuorum cucurri, cum dilatasti cor meum.\"},{\"verse\":33,\"text\":\"He Legem pone mihi, Domine, viam justificationum tuarum, et exquiram eam semper.\"},{\"verse\":34,\"text\":\"Da mihi intellectum, et scrutabor legem tuam, et custodiam illam in toto corde meo.\"},{\"verse\":35,\"text\":\"Deduc me in semitam mandatorum tuorum, quia ipsam volui.\"},{\"verse\":36,\"text\":\"Inclina cor meum in testimonia tua, et non in avaritiam.\"},{\"verse\":37,\"text\":\"Averte oculos meos, ne videant vanitatem ; in via tua vivifica me.\"},{\"verse\":38,\"text\":\"Statue servo tuo eloquium tuum in timore tuo.\"},{\"verse\":39,\"text\":\"Amputa opprobrium meum quod suspicatus sum, quia judicia tua jucunda.\"},{\"verse\":40,\"text\":\"Ecce concupivi mandata tua : in æquitate tua vivifica me.\"},{\"verse\":41,\"text\":\"Vau Et veniat super me misericordia tua, Domine ; salutare tuum secundum eloquium tuum.\"},{\"verse\":42,\"text\":\"Et respondebo exprobrantibus mihi verbum, quia speravi in sermonibus tuis.\"},{\"verse\":43,\"text\":\"Et ne auferas de ore meo verbum veritatis usquequaque, quia in judiciis tuis supersperavi.\"},{\"verse\":44,\"text\":\"Et custodiam legem tuam semper, in sæculum et in sæculum sæculi.\"},{\"verse\":45,\"text\":\"Et ambulabam in latitudine, quia mandata tua exquisivi.\"},{\"verse\":46,\"text\":\"Et loquebar in testimoniis tuis in conspectu regum, et non confundebar.\"},{\"verse\":47,\"text\":\"Et meditabar in mandatis tuis, quæ dilexi.\"},{\"verse\":48,\"text\":\"Et levavi manus meas ad mandata tua, quæ dilexi, et exercebar in justificationibus tuis.\"},{\"verse\":49,\"text\":\"Zain Memor esto verbi tui servo tuo, in quo mihi spem dedisti.\"},{\"verse\":50,\"text\":\"Hæc me consolata est in humilitate mea, quia eloquium tuum vivificavit me.\"},{\"verse\":51,\"text\":\"Superbi inique agebant usquequaque ; a lege autem tua non declinavi.\"},{\"verse\":52,\"text\":\"Memor fui judiciorum tuorum a sæculo, Domine, et consolatus sum.\"},{\"verse\":53,\"text\":\"Defectio tenuit me, pro peccatoribus derelinquentibus legem tuam.\"},{\"verse\":54,\"text\":\"Cantabiles mihi erant justificationes tuæ in loco peregrinationis meæ.\"},{\"verse\":55,\"text\":\"Memor fui nocte nominis tui, Domine, et custodivi legem tuam.\"},{\"verse\":56,\"text\":\"Hæc facta est mihi, quia justificationes tuas exquisivi.\"},{\"verse\":57,\"text\":\"Heth Portio mea, Domine, dixi custodire legem tuam.\"},{\"verse\":58,\"text\":\"Deprecatus sum faciem tuam in toto corde meo ; miserere mei secundum eloquium tuum.\"},{\"verse\":59,\"text\":\"Cogitavi vias meas, et converti pedes meos in testimonia tua.\"},{\"verse\":60,\"text\":\"Paratus sum, et non sum turbatus, ut custodiam mandata tua.\"},{\"verse\":61,\"text\":\"Funes peccatorum circumplexi sunt me, et legem tuam non sum oblitus.\"},{\"verse\":62,\"text\":\"Media nocte surgebam ad confitendum tibi, super judicia justificationis tuæ.\"},{\"verse\":63,\"text\":\"Particeps ego sum omnium timentium te, et custodientium mandata tua.\"},{\"verse\":64,\"text\":\"Misericordia tua, Domine, plena est terra ; justificationes tuas doce me.\"},{\"verse\":65,\"text\":\"Teth Bonitatem fecisti cum servo tuo, Domine, secundum verbum tuum.\"},{\"verse\":66,\"text\":\"Bonitatem, et disciplinam, et scientiam doce me, quia mandatis tuis credidi.\"},{\"verse\":67,\"text\":\"Priusquam humiliarer ego deliqui : propterea eloquium tuum custodivi.\"},{\"verse\":68,\"text\":\"Bonus es tu, et in bonitate tua doce me justificationes tuas.\"},{\"verse\":69,\"text\":\"Multiplicata est super me iniquitas superborum ; ego autem in toto corde meo scrutabor mandata tua.\"},{\"verse\":70,\"text\":\"Coagulatum est sicut lac cor eorum ; ego vero legem tuam meditatus sum.\"},{\"verse\":71,\"text\":\"Bonum mihi quia humiliasti me, ut discam justificationes tuas.\"},{\"verse\":72,\"text\":\"Bonum mihi lex oris tui, super millia auri et argenti.\"},{\"verse\":73,\"text\":\"Jod Manus tuæ fecerunt me, et plasmaverunt me : da mihi intellectum, et discam mandata tua.\"},{\"verse\":74,\"text\":\"Qui timent te videbunt me et lætabuntur, quia in verba tua supersperavi.\"},{\"verse\":75,\"text\":\"Cognovi, Domine, quia æquitas judicia tua, et in veritate tua humiliasti me.\"},{\"verse\":76,\"text\":\"Fiat misericordia tua ut consoletur me, secundum eloquium tuum servo tuo.\"},{\"verse\":77,\"text\":\"Veniant mihi miserationes tuæ, et vivam, quia lex tua meditatio mea est.\"},{\"verse\":78,\"text\":\"Confundantur superbi, quia injuste iniquitatem fecerunt in me ; ego autem exercebor in mandatis tuis.\"},{\"verse\":79,\"text\":\"Convertantur mihi timentes te, et qui noverunt testimonia tua.\"},{\"verse\":80,\"text\":\"Fiat cor meum immaculatum in justificationibus tuis, ut non confundar.\"},{\"verse\":81,\"text\":\"Caph Defecit in salutare tuum anima mea, et in verbum tuum supersperavi.\"},{\"verse\":82,\"text\":\"Defecerunt oculi mei in eloquium tuum, dicentes : Quando consolaberis me ?\"},{\"verse\":83,\"text\":\"Quia factus sum sicut uter in pruina ; justificationes tuas non sum oblitus.\"},{\"verse\":84,\"text\":\"Quot sunt dies servi tui ? quando facies de persequentibus me judicium ?\"},{\"verse\":85,\"text\":\"Narraverunt mihi iniqui fabulationes, sed non ut lex tua.\"},{\"verse\":86,\"text\":\"Omnia mandata tua veritas : inique persecuti sunt me, adjuva me.\"},{\"verse\":87,\"text\":\"Paulominus consummaverunt me in terra ; ego autem non dereliqui mandata tua.\"},{\"verse\":88,\"text\":\"Secundum misericordiam tuam vivifica me, et custodiam testimonia oris tui.\"},{\"verse\":89,\"text\":\"Lamed In æternum, Domine, verbum tuum permanet in cælo.\"},{\"verse\":90,\"text\":\"In generationem et generationem veritas tua ; fundasti terram, et permanet.\"},{\"verse\":91,\"text\":\"Ordinatione tua perseverat dies, quoniam omnia serviunt tibi.\"},{\"verse\":92,\"text\":\"Nisi quod lex tua meditatio mea est, tunc forte periissem in humilitate mea.\"},{\"verse\":93,\"text\":\"In æternum non obliviscar justificationes tuas, quia in ipsis vivificasti me.\"},{\"verse\":94,\"text\":\"Tuus sum ego ; salvum me fac : quoniam justificationes tuas exquisivi.\"},{\"verse\":95,\"text\":\"Me exspectaverunt peccatores ut perderent me ; testimonia tua intellexi.\"},{\"verse\":96,\"text\":\"Omnis consummationis vidi finem, latum mandatum tuum nimis.\"},{\"verse\":97,\"text\":\"Mem Quomodo dilexi legem tuam, Domine ! tota die meditatio mea est.\"},{\"verse\":98,\"text\":\"Super inimicos meos prudentem me fecisti mandato tuo, quia in æternum mihi est.\"},{\"verse\":99,\"text\":\"Super omnes docentes me intellexi, quia testimonia tua meditatio mea est.\"},{\"verse\":100,\"text\":\"Super senes intellexi, quia mandata tua quæsivi.\"},{\"verse\":101,\"text\":\"Ab omni via mala prohibui pedes meos, ut custodiam verba tua.\"},{\"verse\":102,\"text\":\"A judiciis tuis non declinavi, quia tu legem posuisti mihi.\"},{\"verse\":103,\"text\":\"Quam dulcia faucibus meis eloquia tua ! super mel ori meo.\"},{\"verse\":104,\"text\":\"A mandatis tuis intellexi ; propterea odivi omnem viam iniquitatis.\"},{\"verse\":105,\"text\":\"Nun Lucerna pedibus meis verbum tuum, et lumen semitis meis.\"},{\"verse\":106,\"text\":\"Juravi et statui custodire judicia justitiæ tuæ.\"},{\"verse\":107,\"text\":\"Humiliatus sum usquequaque, Domine ; vivifica me secundum verbum tuum.\"},{\"verse\":108,\"text\":\"Voluntaria oris mei beneplacita fac, Domine, et judicia tua doce me.\"},{\"verse\":109,\"text\":\"Anima mea in manibus meis semper, et legem tuam non sum oblitus.\"},{\"verse\":110,\"text\":\"Posuerunt peccatores laqueum mihi, et de mandatis tuis non erravi.\"},{\"verse\":111,\"text\":\"Hæreditate acquisivi testimonia tua in æternum, quia exsultatio cordis mei sunt.\"},{\"verse\":112,\"text\":\"Inclinavi cor meum ad faciendas justificationes tuas in æternum, propter retributionem.\"},{\"verse\":113,\"text\":\"Samech Iniquos odio habui, et legem tuam dilexi.\"},{\"verse\":114,\"text\":\"Adjutor et susceptor meus es tu, et in verbum tuum supersperavi.\"},{\"verse\":115,\"text\":\"Declinate a me, maligni, et scrutabor mandata Dei mei.\"},{\"verse\":116,\"text\":\"Suscipe me secundum eloquium tuum, et vivam, et non confundas me ab exspectatione mea.\"},{\"verse\":117,\"text\":\"Adjuva me, et salvus ero, et meditabor in justificationibus tuis semper.\"},{\"verse\":118,\"text\":\"Sprevisti omnes discedentes a judiciis tuis, quia injusta cogitatio eorum.\"},{\"verse\":119,\"text\":\"Prævaricantes reputavi omnes peccatores terræ ; ideo dilexi testimonia tua.\"},{\"verse\":120,\"text\":\"Confige timore tuo carnes meas ; a judiciis enim tuis timui.\"},{\"verse\":121,\"text\":\"Ain Feci judicium et justitiam : non tradas me calumniantibus me.\"},{\"verse\":122,\"text\":\"Suscipe servum tuum in bonum : non calumnientur me superbi.\"},{\"verse\":123,\"text\":\"Oculi mei defecerunt in salutare tuum, et in eloquium justitiæ tuæ.\"},{\"verse\":124,\"text\":\"Fac cum servo tuo secundum misericordiam tuam, et justificationes tuas doce me.\"},{\"verse\":125,\"text\":\"Servus tuus sum ego : da mihi intellectum, ut sciam testimonia tua.\"},{\"verse\":126,\"text\":\"Tempus faciendi, Domine : dissipaverunt legem tuam.\"},{\"verse\":127,\"text\":\"Ideo dilexi mandata tua super aurum et topazion.\"},{\"verse\":128,\"text\":\"Propterea ad omnia mandata tua dirigebar ; omnem viam iniquam odio habui.\"},{\"verse\":129,\"text\":\"Phe Mirabilia testimonia tua : ideo scrutata est ea anima mea.\"},{\"verse\":130,\"text\":\"Declaratio sermonum tuorum illuminat, et intellectum dat parvulis.\"},{\"verse\":131,\"text\":\"Os meum aperui, et attraxi spiritum : quia mandata tua desiderabam.\"},{\"verse\":132,\"text\":\"Aspice in me, et miserere mei, secundum judicium diligentium nomen tuum.\"},{\"verse\":133,\"text\":\"Gressus meos dirige secundum eloquium tuum, et non dominetur mei omnis injustitia.\"},{\"verse\":134,\"text\":\"Redime me a calumniis hominum ut custodiam mandata tua.\"},{\"verse\":135,\"text\":\"Faciem tuam illumina super servum tuum, et doce me justificationes tuas.\"},{\"verse\":136,\"text\":\"Exitus aquarum deduxerunt oculi mei, quia non custodierunt legem tuam.\"},{\"verse\":137,\"text\":\"Sade Justus es, Domine, et rectum judicium tuum.\"},{\"verse\":138,\"text\":\"Mandasti justitiam testimonia tua, et veritatem tuam nimis.\"},{\"verse\":139,\"text\":\"Tabescere me fecit zelus meus, quia obliti sunt verba tua inimici mei.\"},{\"verse\":140,\"text\":\"Ignitum eloquium tuum vehementer, et servus tuus dilexit illud.\"},{\"verse\":141,\"text\":\"Adolescentulus sum ego et contemptus ; justificationes tuas non sum oblitus.\"},{\"verse\":142,\"text\":\"Justitia tua, justitia in æternum, et lex tua veritas.\"},{\"verse\":143,\"text\":\"Tribulatio et angustia invenerunt me ; mandata tua meditatio mea est.\"},{\"verse\":144,\"text\":\"Æquitas testimonia tua in æternum : intellectum da mihi, et vivam.\"},{\"verse\":145,\"text\":\"Coph Clamavi in toto corde meo : exaudi me, Domine ; justificationes tuas requiram.\"},{\"verse\":146,\"text\":\"Clamavi ad te ; salvum me fac : ut custodiam mandata tua.\"},{\"verse\":147,\"text\":\"Præveni in maturitate, et clamavi : quia in verba tua supersperavi.\"},{\"verse\":148,\"text\":\"Prævenerunt oculi mei ad te diluculo, ut meditarer eloquia tua.\"},{\"verse\":149,\"text\":\"Vocem meam audi secundum misericordiam tuam, Domine, et secundum judicium tuum vivifica me.\"},{\"verse\":150,\"text\":\"Appropinquaverunt persequentes me iniquitati : a lege autem tua longe facti sunt.\"},{\"verse\":151,\"text\":\"Prope es tu, Domine, et omnes viæ tuæ veritas.\"},{\"verse\":152,\"text\":\"Initio cognovi de testimoniis tuis, quia in æternum fundasti ea.\"},{\"verse\":153,\"text\":\"Res Vide humilitatem meam, et eripe me, quia legem tuam non sum oblitus.\"},{\"verse\":154,\"text\":\"Judica judicium meum, et redime me : propter eloquium tuum vivifica me.\"},{\"verse\":155,\"text\":\"Longe a peccatoribus salus, quia justificationes tuas non exquisierunt.\"},{\"verse\":156,\"text\":\"Misericordiæ tuæ multæ, Domine ; secundum judicium tuum vivifica me.\"},{\"verse\":157,\"text\":\"Multi qui persequuntur me, et tribulant me ; a testimoniis tuis non declinavi.\"},{\"verse\":158,\"text\":\"Vidi prævaricantes et tabescebam, quia eloquia tua non custodierunt.\"},{\"verse\":159,\"text\":\"Vide quoniam mandata tua dilexi, Domine : in misericordia tua vivifica me.\"},{\"verse\":160,\"text\":\"Principium verborum tuorum veritas ; in æternum omnia judicia justitiæ tuæ.\"},{\"verse\":161,\"text\":\"Sin Principes persecuti sunt me gratis, et a verbis tuis formidavit cor meum.\"},{\"verse\":162,\"text\":\"Lætabor ego super eloquia tua, sicut qui invenit spolia multa.\"},{\"verse\":163,\"text\":\"Iniquitatem odio habui, et abominatus sum, legem autem tuam dilexi.\"},{\"verse\":164,\"text\":\"Septies in die laudem dixi tibi, super judicia justitiæ tuæ.\"},{\"verse\":165,\"text\":\"Pax multa diligentibus legem tuam, et non est illis scandalum.\"},{\"verse\":166,\"text\":\"Exspectabam salutare tuum, Domine, et mandata tua dilexi.\"},{\"verse\":167,\"text\":\"Custodivit anima mea testimonia tua, et dilexit ea vehementer.\"},{\"verse\":168,\"text\":\"Servavi mandata tua et testimonia tua, quia omnes viæ meæ in conspectu tuo.\"},{\"verse\":169,\"text\":\"Tau Appropinquet deprecatio mea in conspectu tuo, Domine ; juxta eloquium tuum da mihi intellectum.\"},{\"verse\":170,\"text\":\"Intret postulatio mea in conspectu tuo ; secundum eloquium tuum eripe me.\"},{\"verse\":171,\"text\":\"Eructabunt labia mea hymnum, cum docueris me justificationes tuas.\"},{\"verse\":172,\"text\":\"Pronuntiabit lingua mea eloquium tuum, quia omnia mandata tua æquitas.\"},{\"verse\":173,\"text\":\"Fiat manus tua ut salvet me, quoniam mandata tua elegi.\"},{\"verse\":174,\"text\":\"Concupivi salutare tuum, Domine, et lex tua meditatio mea est.\"},{\"verse\":175,\"text\":\"Vivet anima mea, et laudabit te, et judicia tua adjuvabunt me.\"},{\"verse\":176,\"text\":\"Erravi sicut ovis quæ periit : quære servum tuum, quia mandata tua non sum oblitus.\"}],\"summary\":\"Beati immaculati.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":117,\"label\":\"Psalms 117\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":119,\"label\":\"Psalms 119\"}}]]\n"])</script></body></html>
