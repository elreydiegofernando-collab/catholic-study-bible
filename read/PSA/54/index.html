essed="false" class="verse"><sup>3</sup>Be attentive to me and hear me. I am grieved in my exercise; and am troubled,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>At the voice of the enemy, and at the tribulation of the sinner. For they have cast iniquities upon me: and in wrath they were troublesome to me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>My heart is troubled within me: and the fear of death is fallen upon me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Fear and trembling are come upon me: and darkness hath covered me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I said: Who will give me wings like a dove, and I will fly and be at rest?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Lo, I have gone far off flying away; and I abode in the wilderness.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I waited for him that hath saved me from pusillanimity of spirit, and a storm.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cast down, O Lord, and divide their tongues; for I have seen iniquity and contradiction in the city.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Day and night shall iniquity surround it upon its walls: and in the midst thereof are labour,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And injustice. And usury and deceit have not departed from its streets.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For if my enemy had reviled me, I would verily have borne with it. And if he that hated me had spoken great things against me, I would perhaps have hidden my self from him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But thou a man of one mind, my guide, and my familiar,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Who didst take sweetmeats together with me: in the house of God we walked with consent.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let death come upon them, and let them go down alive into hell. For there is wickedness in their dwellings: in the midst of them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But I have cried to God: and the Lord will save me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Evening and morning, and at noon I will speak and declare: and he shall hear my voice.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He shall redeem my soul in peace from them that draw near to me: for among many they were with me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>God shall hear, and the Eternal shall humble them. For there is no change with them, and they have not feared God:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He hath stretched forth his hand to repay. They have defiled his covenant,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>They are divided by the wrath of his countenance, and his heart hath drawn near. His words are smoother than oil, and the same are darts.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cast thy care upon the Lord, and he shall sustain thee: he shall not suffer the just to waver for ever.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But thou, O God, shalt bring them down into the pit of destruction. Bloody and deceitful men shall not live out half their days; but I will trust in thee, O Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, in carminibus. Intellectus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Exaudi, Deus, orationem meam, et ne despexeris deprecationem meam :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>intende mihi, et exaudi me. Contristatus sum in exercitatione mea, et conturbatus sum</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>a voce inimici, et a tribulatione peccatoris. Quoniam declinaverunt in me iniquitates, et in ira molesti erant mihi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cor meum conturbatum est in me, et formido mortis cecidit super me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Timor et tremor venerunt super me, et contexerunt me tenebræ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et dixi : Quis dabit mihi pennas sicut columbæ, et volabo, et requiescam ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ecce elongavi fugiens, et mansi in solitudine.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Exspectabam eum qui salvum me fecit a pusillanimitate spiritus, et tempestate.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Præcipita, Domine ; divide linguas eorum : quoniam vidi iniquitatem et contradictionem in civitate.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Die ac nocte circumdabit eam super muros ejus iniquitas ; et labor in medio ejus,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et injustitia : et non defecit de plateis ejus usura et dolus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quoniam si inimicus meus maledixisset mihi, sustinuissem utique. Et si is qui oderat me super me magna locutus fuisset, abscondissem me forsitan ab eo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tu vero homo unanimis, dux meus, et notus meus :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui simul mecum dulces capiebas cibos ; in domo Dei ambulavimus cum consensu.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Veniat mors super illos, et descendant in infernum viventes : quoniam nequitiæ in habitaculis eorum, in medio eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ego autem ad Deum clamavi, et Dominus salvabit me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vespere, et mane, et meridie, narrabo, et annuntiabo ; et exaudiet vocem meam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Redimet in pace animam meam ab his qui appropinquant mihi : quoniam inter multos erant mecum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Exaudiet Deus, et humiliabit illos, qui est ante sæcula. Non enim est illis commutatio, et non timuerunt Deum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Extendit manum suam in retribuendo ; contaminaverunt testamentum ejus :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>divisi sunt ab ira vultus ejus, et appropinquavit cor illius. Molliti sunt sermones ejus super oleum ; et ipsi sunt jacula.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jacta super Dominum curam tuam, et ipse te enutriet ; non dabit in æternum fluctuationem justo.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Tu vero, Deus, deduces eos in puteum interitus. Viri sanguinum et dolosi non dimidiabunt dies suos ; ego autem sperabo in te, Domine.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/53/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 53</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/55/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 55</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->54<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border- :\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.54\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":54,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Unto the end, in verses, understanding for David.\"},{\"verse\":2,\"text\":\"Hear, O God, my prayer, and despise not my supplication:\"},{\"verse\":3,\"text\":\"Be attentive to me and hear me. I am grieved in my exercise; and am troubled,\"},{\"verse\":4,\"text\":\"At the voice of the enemy, and at the tribulation of the sinner. For they have cast iniquities upon me: and in wrath they were troublesome to me.\"},{\"verse\":5,\"text\":\"My heart is troubled within me: and the fear of death is fallen upon me.\"},{\"verse\":6,\"text\":\"Fear and trembling are come upon me: and darkness hath covered me.\"},{\"verse\":7,\"text\":\"And I said: Who will give me wings like a dove, and I will fly and be at rest?\"},{\"verse\":8,\"text\":\"Lo, I have gone far off flying away; and I abode in the wilderness.\"},{\"verse\":9,\"text\":\"I waited for him that hath saved me from pusillanimity of spirit, and a storm.\"},{\"verse\":10,\"text\":\"Cast down, O Lord, and divide their tongues; for I have seen iniquity and contradiction in the city.\"},{\"verse\":11,\"text\":\"Day and night shall iniquity surround it upon its walls: and in the midst thereof are labour,\"},{\"verse\":12,\"text\":\"And injustice. And usury and deceit have not departed from its streets.\"},{\"verse\":13,\"text\":\"For if my enemy had reviled me, I would verily have borne with it. And if he that hated me had spoken great things against me, I would perhaps have hidden my self from him.\"},{\"verse\":14,\"text\":\"But thou a man of one mind, my guide, and my familiar,\"},{\"verse\":15,\"text\":\"Who didst take sweetmeats together with me: in the house of God we walked with consent.\"},{\"verse\":16,\"text\":\"Let death come upon them, and let them go down alive into hell. For there is wickedness in their dwellings: in the midst of them.\"},{\"verse\":17,\"text\":\"But I have cried to God: and the Lord will save me.\"},{\"verse\":18,\"text\":\"Evening and morning, and at noon I will speak and declare: and he shall hear my voice.\"},{\"verse\":19,\"text\":\"He shall redeem my soul in peace from them that draw near to me: for among many they were with me.\"},{\"verse\":20,\"text\":\"God shall hear, and the Eternal shall humble them. For there is no change with them, and they have not feared God:\"},{\"verse\":21,\"text\":\"He hath stretched forth his hand to repay. They have defiled his covenant,\"},{\"verse\":22,\"text\":\"They are divided by the wrath of his countenance, and his heart hath drawn near. His words are smoother than oil, and the same are darts.\"},{\"verse\":23,\"text\":\"Cast thy care upon the Lord, and he shall sustain thee: he shall not suffer the just to waver for ever.\"},{\"verse\":24,\"text\":\"But thou, O God, shalt bring them down into the pit of destruction. Bloody and deceitful men shall not live out half their days; but I will trust in thee, O Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, in carminibus. Intellectus David.\"},{\"verse\":2,\"text\":\"Exaudi, Deus, orationem meam, et ne despexeris deprecationem meam :\"},{\"verse\":3,\"text\":\"intende mihi, et exaudi me. Contristatus sum in exercitatione mea, et conturbatus sum\"},{\"verse\":4,\"text\":\"a voce inimici, et a tribulatione peccatoris. Quoniam declinaverunt in me iniquitates, et in ira molesti erant mihi.\"},{\"verse\":5,\"text\":\"Cor meum conturbatum est in me, et formido mortis cecidit super me.\"},{\"verse\":6,\"text\":\"Timor et tremor venerunt super me, et contexerunt me tenebræ.\"},{\"verse\":7,\"text\":\"Et dixi : Quis dabit mihi pennas sicut columbæ, et volabo, et requiescam ?\"},{\"verse\":8,\"text\":\"Ecce elongavi fugiens, et mansi in solitudine.\"},{\"verse\":9,\"text\":\"Exspectabam eum qui salvum me fecit a pusillanimitate spiritus, et tempestate.\"},{\"verse\":10,\"text\":\"Præcipita, Domine ; divide linguas eorum : quoniam vidi iniquitatem et contradictionem in civitate.\"},{\"verse\":11,\"text\":\"Die ac nocte circumdabit eam super muros ejus iniquitas ; et labor in medio ejus,\"},{\"verse\":12,\"text\":\"et injustitia : et non defecit de plateis ejus usura et dolus.\"},{\"verse\":13,\"text\":\"Quoniam si inimicus meus maledixisset mihi, sustinuissem utique. Et si is qui oderat me super me magna locutus fuisset, abscondissem me forsitan ab eo.\"},{\"verse\":14,\"text\":\"Tu vero homo unanimis, dux meus, et notus meus :\"},{\"verse\":15,\"text\":\"qui simul mecum dulces capiebas cibos ; in domo Dei ambulavimus cum consensu.\"},{\"verse\":16,\"text\":\"Veniat mors super illos, et descendant in infernum viventes : quoniam nequitiæ in habitaculis eorum, in medio eorum.\"},{\"verse\":17,\"text\":\"Ego autem ad Deum clamavi, et Dominus salvabit me.\"},{\"verse\":18,\"text\":\"Vespere, et mane, et meridie, narrabo, et annuntiabo ; et exaudiet vocem meam.\"},{\"verse\":19,\"text\":\"Redimet in pace animam meam ab his qui appropinquant mihi : quoniam inter multos erant mecum.\"},{\"verse\":20,\"text\":\"Exaudiet Deus, et humiliabit illos, qui est ante sæcula. Non enim est illis commutatio, et non timuerunt Deum.\"},{\"verse\":21,\"text\":\"Extendit manum suam in retribuendo ; contaminaverunt testamentum ejus :\"},{\"verse\":22,\"text\":\"divisi sunt ab ira vultus ejus, et appropinquavit cor illius. Molliti sunt sermones ejus super oleum ; et ipsi sunt jacula.\"},{\"verse\":23,\"text\":\"Jacta super Dominum curam tuam, et ipse te enutriet ; non dabit in æternum fluctuationem justo.\"},{\"verse\":24,\"text\":\"Tu vero, Deus, deduces eos in puteum interitus. Viri sanguinum et dolosi non dimidiabunt dies suos ; ego autem sperabo in te, Domine.\"}],\"summary\":\"Exaudi, Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":53,\"label\":\"Psalms 53\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":55,\"label\":\"Psalms 55\"}}]]\n"])</script></body></html>
