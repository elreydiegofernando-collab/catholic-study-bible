20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">68</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Salvum me fac, Deus.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for them that shall be changed; for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Save me, O God: for the waters are come in even unto my soul.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I stick fast in the mire of the deep and there is no sure standing. I am come into the depth of the sea, and a tempest hath overwhelmed me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I have laboured with crying; my jaws are become hoarse, my eyes have failed, whilst I hope in my God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They are multiplied above the hairs of my head, who hate me without cause. My enemies are grown strong who have wrongfully persecuted me: then did I pay that which I took not away.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>O God, thou knowest my foolishness; and my offences are not hidden from thee:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Let not them be ashamed for me, who look for thee, O Lord, the Lord of hosts. Let them not be confounded on my account, who seek thee, O God of Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Because for thy sake I have borne reproach; shame hath covered my face.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I am become a stranger to my brethren, and an alien to the sons of my mother.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For the zeal of thy house hath eaten me up: and the reproaches of them that reproached thee are fallen upon me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I covered my soul in fasting: and it was made a reproach to me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And I made haircloth my garment: and I became a byword to them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They that sat in the gate spoke against me: and they that drank wine made me their song.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But as for me, my prayer is to thee, O Lord; for the time of thy good pleasure, O God. In the multitude of thy mercy hear me, in the truth of thy salvation.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Draw me out of the mire, that I may not stick fast: deliver me from them that hate me, and out of the deep waters.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let not the tempest of water drown me, nor the deep water swallow me up: and let not the pit shut her mouth upon me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hear me, O Lord, for thy mercy is kind; look upon me according to the multitude of thy tender mercies.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And turn not away thy face from thy servant: for I am in trouble, hear me speedily.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Attend to my soul, and deliver it: save me because of my enemies.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thou knowest my reproach, and my confusion, and my shame.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In thy sight are all they that afflict me; my heart hath expected reproach and misery. And I looked for one that would grieve together with me, but there was none: and for one that would comfort me, and I found none.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they gave me gall for my food, and in my thirst they gave me vinegar to drink.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Let their table become as a snare before them, and a recompense, and a stumblingblock.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Let their eyes be darkened that they see not; and their back bend thou down always.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Pour out thy indignation upon them: and let thy wrathful anger take hold of them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Let their habitation be made desolate: and let there be none to dwell in their tabernacles.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Because they have persecuted him whom thou hast smitten; and they have added to the grief of my wounds.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Add thou iniquity upon their iniquity: and let them not come into thy justice.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Let them be blotted out of the book of the living; and with the just let them not be written.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But I am poor and sorrowful: thy salvation, O God, hath set me up.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>I will praise the name of God with a canticle: and I will magnify him with praise.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And it shall please God better than a young calf, that bringeth forth horns and hoofs.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Let the poor see and rejoice: seek ye God, and your soul shall live.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>For the Lord hath heard the poor: and hath not despised his prisoners.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Let the heavens and the earth praise him; the sea, and every thing that creepeth therein.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For God will save Sion, and the cities of Juda shall be built up. And they shall dwell there, and acquire it by inheritance.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And the seed of his servants shall possess it; and they that love his name shall dwell therein.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, pro iis qui commutabuntur. David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Salvum me fac, Deus, quoniam intraverunt aquæ usque ad animam meam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Infixus sum in limo profundi et non est substantia. Veni in altitudinem maris, et tempestas demersit me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Laboravi clamans, raucæ factæ sunt fauces meæ ; defecerunt oculi mei, dum spero in Deum meum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Multiplicati sunt super capillos capitis mei qui oderunt me gratis. Confortati sunt qui persecuti sunt me inimici mei injuste ; quæ non rapui, tunc exsolvebam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Deus, tu scis insipientiam meam ; et delicta mea a te non sunt abscondita.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non erubescant in me qui exspectant te, Domine, Domine virtutum ; non confundantur super me qui quærunt te, Deus Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quoniam propter te sustinui opprobrium ; operuit confusio faciem meam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Extraneus factus sum fratribus meis, et peregrinus filiis matris meæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam zelus domus tuæ comedit me, et opprobria exprobrantium tibi ceciderunt super me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et operui in jejunio animam meam, et factum est in opprobrium mihi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et posui vestimentum meum cilicium ; et factus sum illis in parabolam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Adversum me loquebantur qui sedebant in porta, et in me psallebant qui bibebant vinum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego vero orationem meam ad te, Domine ; tempus beneplaciti, Deus. In multitudine misericordiæ tuæ, exaudi me in veritate salutis tuæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Eripe me de luto, ut non infigar ; libera me ab iis qui oderunt me, et de profundis aquarum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non me demergat tempestas aquæ, neque absorbeat me profundum, neque urgeat super me puteus os suum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Exaudi me, Domine, quoniam benigna est misericordia tua ; secundum multitudinem miserationum tuarum respice in me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et ne avertas faciem tuam a puero tuo ; quoniam tribulor, velociter exaudi me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Intende animæ meæ, et libera eam ; propter inimicos meos, eripe me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tu scis improperium meum, et confusionem meam, et reverentiam meam ;</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>in conspectu tuo sunt omnes qui tribulant me. Improperium exspectavit cor meum et miseriam : et sustinui qui simul contristaretur, et non fuit ; et qui consolaretur, et non inveni.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et dederunt in escam meam fel, et in siti mea potaverunt me aceto.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Fiat mensa eorum coram ipsis in laqueum, et in retributiones, et in scandalum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Obscurentur oculi eorum, ne videant, et dorsum eorum semper incurva.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Effunde super eos iram tuam, et furor iræ tuæ comprehendat eos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Fiat habitatio eorum deserta, et in tabernaculis eorum non sit qui inhabitet.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quoniam quem tu percussisti persecuti sunt, et super dolorem vulnerum meorum addiderunt.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Appone iniquitatem super iniquitatem eorum, et non intrent in justitiam tuam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Deleantur de libro viventium, et cum justis non scribantur.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ego sum pauper et dolens ; salus tua, Deus, suscepit me.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Laudabo nomen Dei cum cantico, et magnificabo eum in laude :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et placebit Deo super vitulum novellum, cornua producentem et ungulas.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Videant pauperes, et lætentur ; quærite Deum, et vivet anima vestra :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>quoniam exaudivit pauperes Dominus, et vinctos suos non despexit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Laudent illum cæli et terra ; mare, et omnia reptilia in eis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quoniam Deus salvam faciet Sion, et ædificabuntur civitates Juda, et inhabitabunt ibi, et hæreditate acquirent eam.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et semen servorum ejus possidebit eam ; et qui diligunt nomen ejus habitabunt in ea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/67/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif t rch's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.68\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":68,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Unto the end, for them that shall be changed; for David.\"},{\"verse\":2,\"text\":\"Save me, O God: for the waters are come in even unto my soul.\"},{\"verse\":3,\"text\":\"I stick fast in the mire of the deep and there is no sure standing. I am come into the depth of the sea, and a tempest hath overwhelmed me.\"},{\"verse\":4,\"text\":\"I have laboured with crying; my jaws are become hoarse, my eyes have failed, whilst I hope in my God.\"},{\"verse\":5,\"text\":\"They are multiplied above the hairs of my head, who hate me without cause. My enemies are grown strong who have wrongfully persecuted me: then did I pay that which I took not away.\"},{\"verse\":6,\"text\":\"O God, thou knowest my foolishness; and my offences are not hidden from thee:\"},{\"verse\":7,\"text\":\"Let not them be ashamed for me, who look for thee, O Lord, the Lord of hosts. Let them not be confounded on my account, who seek thee, O God of Israel.\"},{\"verse\":8,\"text\":\"Because for thy sake I have borne reproach; shame hath covered my face.\"},{\"verse\":9,\"text\":\"I am become a stranger to my brethren, and an alien to the sons of my mother.\"},{\"verse\":10,\"text\":\"For the zeal of thy house hath eaten me up: and the reproaches of them that reproached thee are fallen upon me.\"},{\"verse\":11,\"text\":\"And I covered my soul in fasting: and it was made a reproach to me.\"},{\"verse\":12,\"text\":\"And I made haircloth my garment: and I became a byword to them.\"},{\"verse\":13,\"text\":\"They that sat in the gate spoke against me: and they that drank wine made me their song.\"},{\"verse\":14,\"text\":\"But as for me, my prayer is to thee, O Lord; for the time of thy good pleasure, O God. In the multitude of thy mercy hear me, in the truth of thy salvation.\"},{\"verse\":15,\"text\":\"Draw me out of the mire, that I may not stick fast: deliver me from them that hate me, and out of the deep waters.\"},{\"verse\":16,\"text\":\"Let not the tempest of water drown me, nor the deep water swallow me up: and let not the pit shut her mouth upon me.\"},{\"verse\":17,\"text\":\"Hear me, O Lord, for thy mercy is kind; look upon me according to the multitude of thy tender mercies.\"},{\"verse\":18,\"text\":\"And turn not away thy face from thy servant: for I am in trouble, hear me speedily.\"},{\"verse\":19,\"text\":\"Attend to my soul, and deliver it: save me because of my enemies.\"},{\"verse\":20,\"text\":\"Thou knowest my reproach, and my confusion, and my shame.\"},{\"verse\":21,\"text\":\"In thy sight are all they that afflict me; my heart hath expected reproach and misery. And I looked for one that would grieve together with me, but there was none: and for one that would comfort me, and I found none.\"},{\"verse\":22,\"text\":\"And they gave me gall for my food, and in my thirst they gave me vinegar to drink.\"},{\"verse\":23,\"text\":\"Let their table become as a snare before them, and a recompense, and a stumblingblock.\"},{\"verse\":24,\"text\":\"Let their eyes be darkened that they see not; and their back bend thou down always.\"},{\"verse\":25,\"text\":\"Pour out thy indignation upon them: and let thy wrathful anger take hold of them.\"},{\"verse\":26,\"text\":\"Let their habitation be made desolate: and let there be none to dwell in their tabernacles.\"},{\"verse\":27,\"text\":\"Because they have persecuted him whom thou hast smitten; and they have added to the grief of my wounds.\"},{\"verse\":28,\"text\":\"Add thou iniquity upon their iniquity: and let them not come into thy justice.\"},{\"verse\":29,\"text\":\"Let them be blotted out of the book of the living; and with the just let them not be written.\"},{\"verse\":30,\"text\":\"But I am poor and sorrowful: thy salvation, O God, hath set me up.\"},{\"verse\":31,\"text\":\"I will praise the name of God with a canticle: and I will magnify him with praise.\"},{\"verse\":32,\"text\":\"And it shall please God better than a young calf, that bringeth forth horns and hoofs.\"},{\"verse\":33,\"text\":\"Let the poor see and rejoice: seek ye God, and your soul shall live.\"},{\"verse\":34,\"text\":\"For the Lord hath heard the poor: and hath not despised his prisoners.\"},{\"verse\":35,\"text\":\"Let the heavens and the earth praise him; the sea, and every thing that creepeth therein.\"},{\"verse\":36,\"text\":\"For God will save Sion, and the cities of Juda shall be built up. And they shall dwell there, and acquire it by inheritance.\"},{\"verse\":37,\"text\":\"And the seed of his servants shall possess it; and they that love his name shall dwell therein.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, pro iis qui commutabuntur. David.\"},{\"verse\":2,\"text\":\"Salvum me fac, Deus, quoniam intraverunt aquæ usque ad animam meam.\"},{\"verse\":3,\"text\":\"Infixus sum in limo profundi et non est substantia. Veni in altitudinem maris, et tempestas demersit me.\"},{\"verse\":4,\"text\":\"Laboravi clamans, raucæ factæ sunt fauces meæ ; defecerunt oculi mei, dum spero in Deum meum.\"},{\"verse\":5,\"text\":\"Multiplicati sunt super capillos capitis mei qui oderunt me gratis. Confortati sunt qui persecuti sunt me inimici mei injuste ; quæ non rapui, tunc exsolvebam.\"},{\"verse\":6,\"text\":\"Deus, tu scis insipientiam meam ; et delicta mea a te non sunt abscondita.\"},{\"verse\":7,\"text\":\"Non erubescant in me qui exspectant te, Domine, Domine virtutum ; non confundantur super me qui quærunt te, Deus Israël.\"},{\"verse\":8,\"text\":\"Quoniam propter te sustinui opprobrium ; operuit confusio faciem meam.\"},{\"verse\":9,\"text\":\"Extraneus factus sum fratribus meis, et peregrinus filiis matris meæ.\"},{\"verse\":10,\"text\":\"Quoniam zelus domus tuæ comedit me, et opprobria exprobrantium tibi ceciderunt super me.\"},{\"verse\":11,\"text\":\"Et operui in jejunio animam meam, et factum est in opprobrium mihi.\"},{\"verse\":12,\"text\":\"Et posui vestimentum meum cilicium ; et factus sum illis in parabolam.\"},{\"verse\":13,\"text\":\"Adversum me loquebantur qui sedebant in porta, et in me psallebant qui bibebant vinum.\"},{\"verse\":14,\"text\":\"Ego vero orationem meam ad te, Domine ; tempus beneplaciti, Deus. In multitudine misericordiæ tuæ, exaudi me in veritate salutis tuæ.\"},{\"verse\":15,\"text\":\"Eripe me de luto, ut non infigar ; libera me ab iis qui oderunt me, et de profundis aquarum.\"},{\"verse\":16,\"text\":\"Non me demergat tempestas aquæ, neque absorbeat me profundum, neque urgeat super me puteus os suum.\"},{\"verse\":17,\"text\":\"Exaudi me, Domine, quoniam benigna est misericordia tua ; secundum multitudinem miserationum tuarum respice in me.\"},{\"verse\":18,\"text\":\"Et ne avertas faciem tuam a puero tuo ; quoniam tribulor, velociter exaudi me.\"},{\"verse\":19,\"text\":\"Intende animæ meæ, et libera eam ; propter inimicos meos, eripe me.\"},{\"verse\":20,\"text\":\"Tu scis improperium meum, et confusionem meam, et reverentiam meam ;\"},{\"verse\":21,\"text\":\"in conspectu tuo sunt omnes qui tribulant me. Improperium exspectavit cor meum et miseriam : et sustinui qui simul contristaretur, et non fuit ; et qui consolaretur, et non inveni.\"},{\"verse\":22,\"text\":\"Et dederunt in escam meam fel, et in siti mea potaverunt me aceto.\"},{\"verse\":23,\"text\":\"Fiat mensa eorum coram ipsis in laqueum, et in retributiones, et in scandalum.\"},{\"verse\":24,\"text\":\"Obscurentur oculi eorum, ne videant, et dorsum eorum semper incurva.\"},{\"verse\":25,\"text\":\"Effunde super eos iram tuam, et furor iræ tuæ comprehendat eos.\"},{\"verse\":26,\"text\":\"Fiat habitatio eorum deserta, et in tabernaculis eorum non sit qui inhabitet.\"},{\"verse\":27,\"text\":\"Quoniam quem tu percussisti persecuti sunt, et super dolorem vulnerum meorum addiderunt.\"},{\"verse\":28,\"text\":\"Appone iniquitatem super iniquitatem eorum, et non intrent in justitiam tuam.\"},{\"verse\":29,\"text\":\"Deleantur de libro viventium, et cum justis non scribantur.\"},{\"verse\":30,\"text\":\"Ego sum pauper et dolens ; salus tua, Deus, suscepit me.\"},{\"verse\":31,\"text\":\"Laudabo nomen Dei cum cantico, et magnificabo eum in laude :\"},{\"verse\":32,\"text\":\"et placebit Deo super vitulum novellum, cornua producentem et ungulas.\"},{\"verse\":33,\"text\":\"Videant pauperes, et lætentur ; quærite Deum, et vivet anima vestra :\"},{\"verse\":34,\"text\":\"quoniam exaudivit pauperes Dominus, et vinctos suos non despexit.\"},{\"verse\":35,\"text\":\"Laudent illum cæli et terra ; mare, et omnia reptilia in eis.\"},{\"verse\":36,\"text\":\"Quoniam Deus salvam faciet Sion, et ædificabuntur civitates Juda, et inhabitabunt ibi, et hæreditate acquirent eam.\"},{\"verse\":37,\"text\":\"Et semen servorum ejus possidebit eam ; et qui diligunt nomen ejus habitabunt in ea.\"}],\"summary\":\"Salvum me fac, Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":67,\"label\":\"Psalms 67\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":69,\"label\":\"Psalms 69\"}}]]\n"])</script></body></html>
