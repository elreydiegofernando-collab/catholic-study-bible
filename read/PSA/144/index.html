m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">144</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Exaltabo te, Deus.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Praise, for David himself. I will extol thee, O God my king: and I will bless thy name for ever; yea, for ever and ever.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Every day will I bless thee: and I will praise thy name for ever; yea, for ever and ever.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Great is the Lord, and greatly to be praised: and of his greatness there is no end.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Generation and generation shall praise thy works: and they shall declare thy power.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They shall speak of the magnificence of the glory of thy holiness: and shall tell thy wondrous works.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they shall speak of the might of thy terrible acts: and shall declare thy greatness.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They shall publish the memory of the abundance of thy sweetness: and shall rejoice in thy justice.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord is gracious and merciful: patient and plenteous in mercy.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The Lord is sweet to all: and his tender mercies are over all his works.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Let all thy works, O lord, praise thee: and let thy saints bless thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>They shall speak of the glory of thy kingdom: and shall tell of thy power:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>To make thy might known to the sons of men: and the glory of the magnificence of thy kingdom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thy kingdom is a kingdom of all ages: and thy dominion endureth throughout all generations. The Lord is faithful in all his words: and holy in all his works.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The Lord lifteth up all that fall: and setteth up all that are cast down.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The eyes of all hope in thee, O Lord: and thou givest them meat in due season.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou openest thy hand, and fillest with blessing every living creature.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The Lord is just in all his ways: and holy in all his works.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Lord is nigh unto all them that call upon him: to all that call upon him in truth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He will do the will of them that fear him: and he will hear their prayer, and save them.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The Lord keepeth all them that love him; but all the wicked he will destroy.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>My mouth shall speak the praise of the Lord: and let all flesh bless his holy name forever; yea, for ever and ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Laudatio ipsi David. Exaltabo te, Deus meus rex, et benedicam nomini tuo in sæculum, et in sæculum sæculi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Per singulos dies benedicam tibi, et laudabo nomen tuum in sæculum, et in sæculum sæculi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Magnus Dominus, et laudabilis nimis, et magnitudinis ejus non est finis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Generatio et generatio laudabit opera tua, et potentiam tuam pronuntiabunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Magnificentiam gloriæ sanctitatis tuæ loquentur, et mirabilia tua narrabunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et virtutem terribilium tuorum dicent, et magnitudinem tuam narrabunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Memoriam abundantiæ suavitatis tuæ eructabunt, et justitia tua exsultabunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Miserator et misericors Dominus : patiens, et multum misericors.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Suavis Dominus universis, et miserationes ejus super omnia opera ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Confiteantur tibi, Domine, omnia opera tua, et sancti tui benedicant tibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Gloriam regni tui dicent, et potentiam tuam loquentur :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ut notam faciant filiis hominum potentiam tuam, et gloriam magnificentiæ regni tui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Regnum tuum regnum omnium sæculorum ; et dominatio tua in omni generatione et generationem. Fidelis Dominus in omnibus verbis suis, et sanctus in omnibus operibus suis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Allevat Dominus omnes qui corruunt, et erigit omnes elisos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Oculi omnium in te sperant, Domine, et tu das escam illorum in tempore opportuno.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Aperis tu manum tuam, et imples omne animal benedictione.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Justus Dominus in omnibus viis suis, et sanctus in omnibus operibus suis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Prope est Dominus omnibus invocantibus eum, omnibus invocantibus eum in veritate.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Voluntatem timentium se faciet, et deprecationem eorum exaudiet, et salvos faciet eos.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Custodit Dominus omnes diligentes se, et omnes peccatores disperdet.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Laudationem Domini loquetur os meum ; et benedicat omnis caro nomini sancto ejus in sæculum, et in sæculum sæculi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/143/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 143</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 b ight of thy terrible acts: and shall declare thy greatness.\"},{\"verse\":7,\"text\":\"They shall publish the memory of the abundance of thy sweetness: and shall rejoice in thy justice.\"},{\"verse\":8,\"text\":\"The Lord is gracious and merciful: patient and plenteous in mercy.\"},{\"verse\":9,\"text\":\"The Lord is sweet to all: and his tender mercies are over all his works.\"},{\"verse\":10,\"text\":\"Let all thy works, O lord, praise thee: and let thy saints bless thee.\"},{\"verse\":11,\"text\":\"They shall speak of the glory of thy kingdom: and shall tell of thy power:\"},{\"verse\":12,\"text\":\"To make thy might known to the sons of men: and the glory of the magnificence of thy kingdom.\"},{\"verse\":13,\"text\":\"Thy kingdom is a kingdom of all ages: and thy dominion endureth throughout all generations. The Lord is faithful in all his words: and holy in all his works.\"},{\"verse\":14,\"text\":\"The Lord lifteth up all that fall: and setteth up all that are cast down.\"},{\"verse\":15,\"text\":\"The eyes of all hope in thee, O Lord: and thou givest them meat in due season.\"},{\"verse\":16,\"text\":\"Thou openest thy hand, and fillest with blessing every living creature.\"},{\"verse\":17,\"text\":\"The Lord is just in all his ways: and holy in all his works.\"},{\"verse\":18,\"text\":\"The Lord is nigh unto all them that call upon him: to all that call upon him in truth.\"},{\"verse\":19,\"text\":\"He will do the will of them that fear him: and he will hear their prayer, and save them.\"},{\"verse\":20,\"text\":\"The Lord keepeth all them that love him; but all the wicked he will destroy.\"},{\"verse\":21,\"text\":\"My mouth shall speak the praise of the Lord: and let all flesh bless his holy name forever; yea, for ever and ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Laudatio ipsi David. Exaltabo te, Deus meus rex, et benedicam nomini tuo in sæculum, et in sæculum sæculi.\"},{\"verse\":2,\"text\":\"Per singulos dies benedicam tibi, et laudabo nomen tuum in sæculum, et in sæculum sæculi.\"},{\"verse\":3,\"text\":\"Magnus Dominus, et laudabilis nimis, et magnitudinis ejus non est finis.\"},{\"verse\":4,\"text\":\"Generatio et generatio laudabit opera tua, et potentiam tuam pronuntiabunt.\"},{\"verse\":5,\"text\":\"Magnificentiam gloriæ sanctitatis tuæ loquentur, et mirabilia tua narrabunt.\"},{\"verse\":6,\"text\":\"Et virtutem terribilium tuorum dicent, et magnitudinem tuam narrabunt.\"},{\"verse\":7,\"text\":\"Memoriam abundantiæ suavitatis tuæ eructabunt, et justitia tua exsultabunt.\"},{\"verse\":8,\"text\":\"Miserator et misericors Dominus : patiens, et multum misericors.\"},{\"verse\":9,\"text\":\"Suavis Dominus universis, et miserationes ejus super omnia opera ejus.\"},{\"verse\":10,\"text\":\"Confiteantur tibi, Domine, omnia opera tua, et sancti tui benedicant tibi.\"},{\"verse\":11,\"text\":\"Gloriam regni tui dicent, et potentiam tuam loquentur :\"},{\"verse\":12,\"text\":\"ut notam faciant filiis hominum potentiam tuam, et gloriam magnificentiæ regni tui.\"},{\"verse\":13,\"text\":\"Regnum tuum regnum omnium sæculorum ; et dominatio tua in omni generatione et generationem. Fidelis Dominus in omnibus verbis suis, et sanctus in omnibus operibus suis.\"},{\"verse\":14,\"text\":\"Allevat Dominus omnes qui corruunt, et erigit omnes elisos.\"},{\"verse\":15,\"text\":\"Oculi omnium in te sperant, Domine, et tu das escam illorum in tempore opportuno.\"},{\"verse\":16,\"text\":\"Aperis tu manum tuam, et imples omne animal benedictione.\"},{\"verse\":17,\"text\":\"Justus Dominus in omnibus viis suis, et sanctus in omnibus operibus suis.\"},{\"verse\":18,\"text\":\"Prope est Dominus omnibus invocantibus eum, omnibus invocantibus eum in veritate.\"},{\"verse\":19,\"text\":\"Voluntatem timentium se faciet, et deprecationem eorum exaudiet, et salvos faciet eos.\"},{\"verse\":20,\"text\":\"Custodit Dominus omnes diligentes se, et omnes peccatores disperdet.\"},{\"verse\":21,\"text\":\"Laudationem Domini loquetur os meum ; et benedicat omnis caro nomini sancto ejus in sæculum, et in sæculum sæculi.\"}],\"summary\":\"Exaltabo te, Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":143,\"label\":\"Psalms 143\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":145,\"label\":\"Psalms 145\"}}]]\n"])</script></body></html>
