, which thou hast possessed from the beginning. The sceptre of thy inheritance which thou hast redeemed: mount Sion in which thou hast dwelt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lift up thy hands against their pride unto the end; see what things the enemy hath done wickedly in the sanctuary.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they that hate thee have made their boasts, in the midst of thy solemnity. They have set up their ensigns for signs,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they knew not both in the going out and on the highest top. As with axes in a wood of trees,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They have cut down at once the gates thereof, with axe and hatchet they have brought it down.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They have set fire to thy sanctuary: they have defiled the dwelling place of thy name on the earth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>They said in their heart, the whole kindred of them together: Let us abolish all the festival days of God from the land.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Our signs we have not seen, there is now no prophet: and he will know us no more.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>How long, O God, shall the enemy reproach: is the adversary to provoke thy name for ever?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Why dost thou turn away thy hand: and thy right hand out of the midst of thy bosom for ever?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But God is our king before ages: he hath wrought salvation in the midst of the earth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou by thy strength didst make the sea firm: thou didst crush the heads of the dragons in the waters.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou hast broken the heads of the dragon: thou hast given him to be meat for the people of the Ethiopians.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou hast broken up the fountains and the torrents: thou hast dried up the Ethan rivers.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thine is the day, and thine is the night: thou hast made the morning light and the sun.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou hast made all the borders of the earth: the summer and the spring were formed by thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Remember this, the enemy hath reproached the Lord: and a foolish people hath provoked thy name.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Deliver not up to beasts the souls that confess to thee: and forget not to the end the souls of thy poor.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Have regard to thy covenant: for they that are the obscure of the earth have been filled with dwellings of iniquity.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Let not the humble be turned away with confusion: the poor and needy shall praise thy name.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Arise, O God, judge thy own cause: remember thy reproaches with which the foolish man hath reproached thee all the day.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Forget not the voices of thy enemies: the pride of them that hate thee ascendeth continually.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Intellectus Asaph. Ut quid, Deus, repulisti in finem, iratus est furor tuus super oves pascuæ tuæ ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Memor esto congregationis tuæ, quam possedisti ab initio. Redemisti virgam hæreditatis tuæ, mons Sion, in quo habitasti in eo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Leva manus tuas in superbias eorum in finem : quanta malignatus est inimicus in sancto !</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et gloriati sunt qui oderunt te in medio solemnitatis tuæ ; posuerunt signa sua, signa :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et non cognoverunt sicut in exitu super summum. Quasi in silva lignorum securibus</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>exciderunt januas ejus in idipsum ; in securi et ascia dejecerunt eam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Incenderunt igni sanctuarium tuum ; in terra polluerunt tabernaculum nominis tui.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixerunt in corde suo cognatio eorum simul : Quiescere faciamus omnes dies festos Dei a terra.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Signa nostra non vidimus ; jam non est propheta ; et nos non cognoscet amplius.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Usquequo, Deus, improperabit inimicus ? irritat adversarius nomen tuum in finem ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ut quid avertis manum tuam, et dexteram tuam de medio sinu tuo in finem ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deus autem rex noster ante sæcula : operatus est salutem in medio terræ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tu confirmasti in virtute tua mare ; contribulasti capita draconum in aquis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tu confregisti capita draconis ; dedisti eum escam populis Æthiopum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tu dirupisti fontes et torrentes ; tu siccasti fluvios Ethan.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tuus est dies, et tua est nox ; tu fabricatus es auroram et solem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tu fecisti omnes terminos terræ ; æstatem et ver tu plasmasti ea.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Memor esto hujus : inimicus improperavit Domino, et populus insipiens incitavit nomen tuum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ne tradas bestiis animas confitentes tibi, et animas pauperum tuorum ne obliviscaris in finem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Respice in testamentum tuum, quia repleti sunt qui obscurati sunt terræ domibus iniquitatum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ne avertatur humilis factus confusus ; pauper et inops laudabunt nomen tuum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Exsurge, Deus, judica causam tuam ; memor esto improperiorum tuorum, eorum quæ ab insipiente sunt tota die.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ne obliviscaris voces inimicorum tuorum : superbia eorum qui te oderunt ascendit semper.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/72/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 72</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/74/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 74</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->73<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3 king before ages: he hath wrought salvation in the midst of the earth.\"},{\"verse\":13,\"text\":\"Thou by thy strength didst make the sea firm: thou didst crush the heads of the dragons in the waters.\"},{\"verse\":14,\"text\":\"Thou hast broken the heads of the dragon: thou hast given him to be meat for the people of the Ethiopians.\"},{\"verse\":15,\"text\":\"Thou hast broken up the fountains and the torrents: thou hast dried up the Ethan rivers.\"},{\"verse\":16,\"text\":\"Thine is the day, and thine is the night: thou hast made the morning light and the sun.\"},{\"verse\":17,\"text\":\"Thou hast made all the borders of the earth: the summer and the spring were formed by thee.\"},{\"verse\":18,\"text\":\"Remember this, the enemy hath reproached the Lord: and a foolish people hath provoked thy name.\"},{\"verse\":19,\"text\":\"Deliver not up to beasts the souls that confess to thee: and forget not to the end the souls of thy poor.\"},{\"verse\":20,\"text\":\"Have regard to thy covenant: for they that are the obscure of the earth have been filled with dwellings of iniquity.\"},{\"verse\":21,\"text\":\"Let not the humble be turned away with confusion: the poor and needy shall praise thy name.\"},{\"verse\":22,\"text\":\"Arise, O God, judge thy own cause: remember thy reproaches with which the foolish man hath reproached thee all the day.\"},{\"verse\":23,\"text\":\"Forget not the voices of thy enemies: the pride of them that hate thee ascendeth continually.\"}],\"vul\":[{\"verse\":1,\"text\":\"Intellectus Asaph. Ut quid, Deus, repulisti in finem, iratus est furor tuus super oves pascuæ tuæ ?\"},{\"verse\":2,\"text\":\"Memor esto congregationis tuæ, quam possedisti ab initio. Redemisti virgam hæreditatis tuæ, mons Sion, in quo habitasti in eo.\"},{\"verse\":3,\"text\":\"Leva manus tuas in superbias eorum in finem : quanta malignatus est inimicus in sancto !\"},{\"verse\":4,\"text\":\"Et gloriati sunt qui oderunt te in medio solemnitatis tuæ ; posuerunt signa sua, signa :\"},{\"verse\":5,\"text\":\"et non cognoverunt sicut in exitu super summum. Quasi in silva lignorum securibus\"},{\"verse\":6,\"text\":\"exciderunt januas ejus in idipsum ; in securi et ascia dejecerunt eam.\"},{\"verse\":7,\"text\":\"Incenderunt igni sanctuarium tuum ; in terra polluerunt tabernaculum nominis tui.\"},{\"verse\":8,\"text\":\"Dixerunt in corde suo cognatio eorum simul : Quiescere faciamus omnes dies festos Dei a terra.\"},{\"verse\":9,\"text\":\"Signa nostra non vidimus ; jam non est propheta ; et nos non cognoscet amplius.\"},{\"verse\":10,\"text\":\"Usquequo, Deus, improperabit inimicus ? irritat adversarius nomen tuum in finem ?\"},{\"verse\":11,\"text\":\"Ut quid avertis manum tuam, et dexteram tuam de medio sinu tuo in finem ?\"},{\"verse\":12,\"text\":\"Deus autem rex noster ante sæcula : operatus est salutem in medio terræ.\"},{\"verse\":13,\"text\":\"Tu confirmasti in virtute tua mare ; contribulasti capita draconum in aquis.\"},{\"verse\":14,\"text\":\"Tu confregisti capita draconis ; dedisti eum escam populis Æthiopum.\"},{\"verse\":15,\"text\":\"Tu dirupisti fontes et torrentes ; tu siccasti fluvios Ethan.\"},{\"verse\":16,\"text\":\"Tuus est dies, et tua est nox ; tu fabricatus es auroram et solem.\"},{\"verse\":17,\"text\":\"Tu fecisti omnes terminos terræ ; æstatem et ver tu plasmasti ea.\"},{\"verse\":18,\"text\":\"Memor esto hujus : inimicus improperavit Domino, et populus insipiens incitavit nomen tuum.\"},{\"verse\":19,\"text\":\"Ne tradas bestiis animas confitentes tibi, et animas pauperum tuorum ne obliviscaris in finem.\"},{\"verse\":20,\"text\":\"Respice in testamentum tuum, quia repleti sunt qui obscurati sunt terræ domibus iniquitatum.\"},{\"verse\":21,\"text\":\"Ne avertatur humilis factus confusus ; pauper et inops laudabunt nomen tuum.\"},{\"verse\":22,\"text\":\"Exsurge, Deus, judica causam tuam ; memor esto improperiorum tuorum, eorum quæ ab insipiente sunt tota die.\"},{\"verse\":23,\"text\":\"Ne obliviscaris voces inimicorum tuorum : superbia eorum qui te oderunt ascendit semper.\"}],\"summary\":\"Ut quid, Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":72,\"label\":\"Psalms 72\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":74,\"label\":\"Psalms 74\"}}]]\n"])</script></body></html>
