tton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A psalm of a canticle, at the dedication of David’s house.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will extol thee, O Lord, for thou hast upheld me: and hast not made my enemies to rejoice over me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>O Lord my God, I have cried to thee, and thou hast healed me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou hast brought forth, O Lord, my soul from hell: thou hast saved me from them that go down into the pit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sing to the Lord, O ye his saints: and give praise to the memory of his holiness.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For wrath is in his indignation; and life in his good will. In the evening weeping shall have place, and in the morning gladness.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And in my abundance I said: I shall never be moved.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>O Lord, in thy favour, thou gavest strength to my beauty. Thou turnedst away thy face from me, and I became troubled.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>To thee, O Lord, will I cry: and I will make supplication to my God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>What profit is there in my blood, whilst I go down to corruption? Shall dust confess to thee, or declare thy truth?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The Lord hath heard, and hath had mercy on me: the Lord became my helper.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou hast turned for me my mourning into joy: thou hast cut my sackcloth, and hast compassed me with gladness:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>To the end that my glory may sing to thee, and I may not regret: O Lord my God, I will give praise to thee for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus cantici, in dedicatione domus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Exaltabo te, Domine, quoniam suscepisti me, nec delectasti inimicos meos super me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Domine Deus meus, clamavi ad te, et sanasti me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Domine, eduxisti ab inferno animam meam ; salvasti me a descendentibus in lacum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Psallite Domino, sancti ejus ; et confitemini memoriæ sanctitatis ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quoniam ira in indignatione ejus, et vita in voluntate ejus : ad vesperum demorabitur fletus, et ad matutinum lætitia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ego autem dixi in abundantia mea : Non movebor in æternum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Domine, in voluntate tua præstitisti decori meo virtutem ; avertisti faciem tuam a me, et factus sum conturbatus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ad te, Domine, clamabo, et ad Deum meum deprecabor.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quæ utilitas in sanguine meo, dum descendo in corruptionem ? numquid confitebitur tibi pulvis, aut annuntiabit veritatem tuam ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Audivit Dominus, et misertus est mei ; Dominus factus est adjutor meus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Convertisti planctum meum in gaudium mihi ; conscidisti saccum meum, et circumdedisti me lætitia :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ut cantet tibi gloria mea, et non compungar. Domine Deus meus, in æternum confitebor tibi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/28/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 28</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/30/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 30</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 te  I cry: and I will make supplication to my God.\"},{\"verse\":10,\"text\":\"What profit is there in my blood, whilst I go down to corruption? Shall dust confess to thee, or declare thy truth?\"},{\"verse\":11,\"text\":\"The Lord hath heard, and hath had mercy on me: the Lord became my helper.\"},{\"verse\":12,\"text\":\"Thou hast turned for me my mourning into joy: thou hast cut my sackcloth, and hast compassed me with gladness:\"},{\"verse\":13,\"text\":\"To the end that my glory may sing to thee, and I may not regret: O Lord my God, I will give praise to thee for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus cantici, in dedicatione domus David.\"},{\"verse\":2,\"text\":\"Exaltabo te, Domine, quoniam suscepisti me, nec delectasti inimicos meos super me.\"},{\"verse\":3,\"text\":\"Domine Deus meus, clamavi ad te, et sanasti me.\"},{\"verse\":4,\"text\":\"Domine, eduxisti ab inferno animam meam ; salvasti me a descendentibus in lacum.\"},{\"verse\":5,\"text\":\"Psallite Domino, sancti ejus ; et confitemini memoriæ sanctitatis ejus.\"},{\"verse\":6,\"text\":\"Quoniam ira in indignatione ejus, et vita in voluntate ejus : ad vesperum demorabitur fletus, et ad matutinum lætitia.\"},{\"verse\":7,\"text\":\"Ego autem dixi in abundantia mea : Non movebor in æternum.\"},{\"verse\":8,\"text\":\"Domine, in voluntate tua præstitisti decori meo virtutem ; avertisti faciem tuam a me, et factus sum conturbatus.\"},{\"verse\":9,\"text\":\"Ad te, Domine, clamabo, et ad Deum meum deprecabor.\"},{\"verse\":10,\"text\":\"Quæ utilitas in sanguine meo, dum descendo in corruptionem ? numquid confitebitur tibi pulvis, aut annuntiabit veritatem tuam ?\"},{\"verse\":11,\"text\":\"Audivit Dominus, et misertus est mei ; Dominus factus est adjutor meus.\"},{\"verse\":12,\"text\":\"Convertisti planctum meum in gaudium mihi ; conscidisti saccum meum, et circumdedisti me lætitia :\"},{\"verse\":13,\"text\":\"ut cantet tibi gloria mea, et non compungar. Domine Deus meus, in æternum confitebor tibi.\"}],\"summary\":\"Exaltabo te, Domine.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":28,\"label\":\"Psalms 28\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":30,\"label\":\"Psalms 30\"}}]]\n"])</script></body></html>
