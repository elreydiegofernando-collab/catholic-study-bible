ata-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, in hymns, for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hear, O God, my supplication: be attentive to my prayer.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To thee have I cried from the ends of the earth: when my heart was in anguish, thou hast exalted me on a rock. Thou hast conducted me;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thou hast been my hope; a tower of strength against the face of the enemy.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In thy tabernacle I shall dwell for ever: I shall be protected under the covert of thy wings.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For thou, my God, hast heard my prayer: thou hast given an inheritance to them that fear thy name.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou wilt add days to the days of the king: his years even to generation and generation.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He abideth for ever in the sight of God: his mercy and truth who shall search?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>So will I sing a psalm to thy name for ever and ever: that I may pay my vows from day to day.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. In hymnis David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Exaudi, Deus, deprecationem meam ; intende orationi meæ.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A finibus terræ ad te clamavi, dum anxiaretur cor meum ; in petra exaltasti me. Deduxisti me,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quia factus es spes mea : turris fortitudinis a facie inimici.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Inhabitabo in tabernaculo tuo in sæcula ; protegar in velamento alarum tuarum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quoniam tu, Deus meus, exaudisti orationem meam ; dedisti hæreditatem timentibus nomen tuum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dies super dies regis adjicies ; annos ejus usque in diem generationis et generationis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Permanet in æternum in conspectu Dei : misericordiam et veritatem ejus quis requiret ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sic psalmum dicam nomini tuo in sæculum sæculi, ut reddam vota mea de die in diem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/59/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 59</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/
