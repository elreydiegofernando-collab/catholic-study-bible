-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">103</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Benedic, anima.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For David himself. Bless the Lord, O my soul: O Lord my God, thou art exceedingly great. Thou hast put on praise and beauty:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And art clothed with light as with a garment. Who stretchest out the heaven like a pavilion:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Who coverest the higher rooms thereof with water. Who makest the clouds thy chariot: who walkest upon the wings of the winds.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who makest thy angels spirits: and thy ministers a burning fire.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who hast founded the earth upon its own bases: it shall not be moved for ever and ever.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The deep like a garment is its clothing: above the mountains shall the waters stand.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>At thy rebuke they shall flee: at the voice of thy thunder they shall fear.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The mountains ascend, and the plains descend into the place which thou hast founded for them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou hast set a bound which they shall not pass over; neither shall they return to cover the earth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou sendest forth springs in the vales: between the midst of the hills the waters shall pass.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>All the beasts of the field shall drink: the wild asses shall expect in their thirst.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Over them the birds of the air shall dwell: from the midst of the rocks they shall give forth their voices.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou waterest the hills from thy upper rooms: the earth shall be filled with the fruit of thy works:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Bringing forth grass for cattle, and herb for the service of men. That thou mayst bring bread out of the earth:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And that wine may cheer the heart of man. That he may make the face cheerful with oil: and that bread may strengthen man’s heart.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The trees of the field shall be filled, and the cedars of Libanus which he hath planted:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>There the sparrows shall make their nests. The highest of them is the house of the heron.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The high hills are a refuge for the harts, the rock for the irchins.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He hath made the moon for seasons: the sun knoweth his going down.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thou hast appointed darkness, and it is night: in it shall all the beasts of the woods go about:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The young lions roaring after their prey, and seeking their meat from God.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sun ariseth, and they are gathered together: and they shall lie down in their dens.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Man shall go forth to his work, and to his labour until the evening.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>How great are thy works, O Lord? thou hast made all things in wisdom: the earth is filled with thy riches.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>So is this great sea, which stretcheth wide its arms: there are creeping things without number: Creatures little and great.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>There the ships shall go. This sea dragon which thou hast formed to play therein.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>All expect of thee that thou give them food in season.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>What thou givest to them they shall gather up: when thou openest thy hand, they shall all be filled with good.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But if thou turnest away thy face, they shall be troubled: thou shalt take away their breath, and they shall fail, and shall return to their dust.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Thou shalt send forth thy spirit, and they shall be created: and thou shalt renew the face of the earth.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>May the glory of the Lord endure for ever: the Lord shall rejoice in his works.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>He looketh upon the earth, and maketh it tremble: he toucheth the mountains, and they smoke.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>I will sing to the Lord as long as I live: I will sing praise to my God while I have my being.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Let my speech be acceptable to him: but I will take delight in the Lord.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Let sinners be consumed out of the earth, and the unjust, so that they be no more: O my soul, bless thou the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ipsi David. Benedic, anima mea, Domino : Domine Deus meus, magnificatus es vehementer. Confessionem et decorem induisti,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>amictus lumine sicut vestimento. Extendens cælum sicut pellem,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>qui tegis aquis superiora ejus : qui ponis nubem ascensum tuum ; qui ambulas super pennas ventorum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>qui facis angelos tuos spiritus, et ministros tuos ignem urentem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui fundasti terram super stabilitatem suam : non inclinabitur in sæculum sæculi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Abyssus sicut vestimentum amictus ejus ; super montes stabunt aquæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ab increpatione tua fugient ; a voce tonitrui tui formidabunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ascendunt montes, et descendunt campi, in locum quem fundasti eis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Terminum posuisti quem non transgredientur, neque convertentur operire terram.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui emittis fontes in convallibus ; inter medium montium pertransibunt aquæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Potabunt omnes bestiæ agri ; expectabunt onagri in siti sua.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Super ea volucres cæli habitabunt ; de medio petrarum dabunt voces.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Rigans montes de superioribus suis ; de fructu operum tuorum satiabitur terra :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>producens fœnum jumentis, et herbam servituti hominum, ut educas panem de terra,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et vinum lætificet cor hominis : ut exhilaret faciem in oleo, et panis cor hominis confirmet.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Saturabuntur ligna campi, et cedri Libani quas plantavit :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>illic passeres nidificabunt : herodii domus dux est eorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Montes excelsi cervis ; petra refugium herinaciis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fecit lunam in tempora ; sol cognovit occasum suum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Posuisti tenebras, et facta est nox ; in ipsa pertransibunt omnes bestiæ silvæ :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>catuli leonum rugientes ut rapiant, et quærant a Deo escam sibi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ortus est sol, et congregati sunt, et in cubilibus suis collocabuntur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Exibit homo ad opus suum, et ad operationem suam usque ad vesperum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quam magnificata sunt opera tua, Domine ! omnia in sapientia fecisti ; impleta est terra possessione tua.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hoc mare magnum et spatiosum manibus ; illic reptilia quorum non est numerus : animalia pusilla cum magnis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Illic naves pertransibunt ; draco iste quem formasti ad illudendum ei.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Omnia a te expectant ut des illis escam in tempore.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dante te illis, colligent ; aperiente te manum tuam, omnia implebuntur bonitate.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Avertente autem te faciem, turbabuntur ; auferes spiritum eorum, et deficient, et in pulverem suum revertentur.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Emittes spiritum tuum, et creabuntur, et renovabis faciem terræ.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sit gloria Domini in sæculum ; lætabitur Dominus in operibus suis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Qui respicit terram, et facit eam tremere ; qui tangit montes, et fumigant.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Cantabo Domino in vita mea ; psallam Deo meo quamdiu sum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jucundum sit ei eloquium meum ; ego vero delectabor in Domino.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Deficiant peccatores a terra, et iniqui, ita ut non sint. Benedic, anima mea, Domino.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/102/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 102</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/104/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 104</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->103<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset  the vales: between the midst of the hills the waters shall pass.\"},{\"verse\":11,\"text\":\"All the beasts of the field shall drink: the wild asses shall expect in their thirst.\"},{\"verse\":12,\"text\":\"Over them the birds of the air shall dwell: from the midst of the rocks they shall give forth their voices.\"},{\"verse\":13,\"text\":\"Thou waterest the hills from thy upper rooms: the earth shall be filled with the fruit of thy works:\"},{\"verse\":14,\"text\":\"Bringing forth grass for cattle, and herb for the service of men. That thou mayst bring bread out of the earth:\"},{\"verse\":15,\"text\":\"And that wine may cheer the heart of man. That he may make the face cheerful with oil: and that bread may strengthen man’s heart.\"},{\"verse\":16,\"text\":\"The trees of the field shall be filled, and the cedars of Libanus which he hath planted:\"},{\"verse\":17,\"text\":\"There the sparrows shall make their nests. The highest of them is the house of the heron.\"},{\"verse\":18,\"text\":\"The high hills are a refuge for the harts, the rock for the irchins.\"},{\"verse\":19,\"text\":\"He hath made the moon for seasons: the sun knoweth his going down.\"},{\"verse\":20,\"text\":\"Thou hast appointed darkness, and it is night: in it shall all the beasts of the woods go about:\"},{\"verse\":21,\"text\":\"The young lions roaring after their prey, and seeking their meat from God.\"},{\"verse\":22,\"text\":\"The sun ariseth, and they are gathered together: and they shall lie down in their dens.\"},{\"verse\":23,\"text\":\"Man shall go forth to his work, and to his labour until the evening.\"},{\"verse\":24,\"text\":\"How great are thy works, O Lord? thou hast made all things in wisdom: the earth is filled with thy riches.\"},{\"verse\":25,\"text\":\"So is this great sea, which stretcheth wide its arms: there are creeping things without number: Creatures little and great.\"},{\"verse\":26,\"text\":\"There the ships shall go. This sea dragon which thou hast formed to play therein.\"},{\"verse\":27,\"text\":\"All expect of thee that thou give them food in season.\"},{\"verse\":28,\"text\":\"What thou givest to them they shall gather up: when thou openest thy hand, they shall all be filled with good.\"},{\"verse\":29,\"text\":\"But if thou turnest away thy face, they shall be troubled: thou shalt take away their breath, and they shall fail, and shall return to their dust.\"},{\"verse\":30,\"text\":\"Thou shalt send forth thy spirit, and they shall be created: and thou shalt renew the face of the earth.\"},{\"verse\":31,\"text\":\"May the glory of the Lord endure for ever: the Lord shall rejoice in his works.\"},{\"verse\":32,\"text\":\"He looketh upon the earth, and maketh it tremble: he toucheth the mountains, and they smoke.\"},{\"verse\":33,\"text\":\"I will sing to the Lord as long as I live: I will sing praise to my God while I have my being.\"},{\"verse\":34,\"text\":\"Let my speech be acceptable to him: but I will take delight in the Lord.\"},{\"verse\":35,\"text\":\"Let sinners be consumed out of the earth, and the unjust, so that they be no more: O my soul, bless thou the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ipsi David. Benedic, anima mea, Domino : Domine Deus meus, magnificatus es vehementer. Confessionem et decorem induisti,\"},{\"verse\":2,\"text\":\"amictus lumine sicut vestimento. Extendens cælum sicut pellem,\"},{\"verse\":3,\"text\":\"qui tegis aquis superiora ejus : qui ponis nubem ascensum tuum ; qui ambulas super pennas ventorum :\"},{\"verse\":4,\"text\":\"qui facis angelos tuos spiritus, et ministros tuos ignem urentem.\"},{\"verse\":5,\"text\":\"Qui fundasti terram super stabilitatem suam : non inclinabitur in sæculum sæculi.\"},{\"verse\":6,\"text\":\"Abyssus sicut vestimentum amictus ejus ; super montes stabunt aquæ.\"},{\"verse\":7,\"text\":\"Ab increpatione tua fugient ; a voce tonitrui tui formidabunt.\"},{\"verse\":8,\"text\":\"Ascendunt montes, et descendunt campi, in locum quem fundasti eis.\"},{\"verse\":9,\"text\":\"Terminum posuisti quem non transgredientur, neque convertentur operire terram.\"},{\"verse\":10,\"text\":\"Qui emittis fontes in convallibus ; inter medium montium pertransibunt aquæ.\"},{\"verse\":11,\"text\":\"Potabunt omnes bestiæ agri ; expectabunt onagri in siti sua.\"},{\"verse\":12,\"text\":\"Super ea volucres cæli habitabunt ; de medio petrarum dabunt voces.\"},{\"verse\":13,\"text\":\"Rigans montes de superioribus suis ; de fructu operum tuorum satiabitur terra :\"},{\"verse\":14,\"text\":\"producens fœnum jumentis, et herbam servituti hominum, ut educas panem de terra,\"},{\"verse\":15,\"text\":\"et vinum lætificet cor hominis : ut exhilaret faciem in oleo, et panis cor hominis confirmet.\"},{\"verse\":16,\"text\":\"Saturabuntur ligna campi, et cedri Libani quas plantavit :\"},{\"verse\":17,\"text\":\"illic passeres nidificabunt : herodii domus dux est eorum.\"},{\"verse\":18,\"text\":\"Montes excelsi cervis ; petra refugium herinaciis.\"},{\"verse\":19,\"text\":\"Fecit lunam in tempora ; sol cognovit occasum suum.\"},{\"verse\":20,\"text\":\"Posuisti tenebras, et facta est nox ; in ipsa pertransibunt omnes bestiæ silvæ :\"},{\"verse\":21,\"text\":\"catuli leonum rugientes ut rapiant, et quærant a Deo escam sibi.\"},{\"verse\":22,\"text\":\"Ortus est sol, et congregati sunt, et in cubilibus suis collocabuntur.\"},{\"verse\":23,\"text\":\"Exibit homo ad opus suum, et ad operationem suam usque ad vesperum.\"},{\"verse\":24,\"text\":\"Quam magnificata sunt opera tua, Domine ! omnia in sapientia fecisti ; impleta est terra possessione tua.\"},{\"verse\":25,\"text\":\"Hoc mare magnum et spatiosum manibus ; illic reptilia quorum non est numerus : animalia pusilla cum magnis.\"},{\"verse\":26,\"text\":\"Illic naves pertransibunt ; draco iste quem formasti ad illudendum ei.\"},{\"verse\":27,\"text\":\"Omnia a te expectant ut des illis escam in tempore.\"},{\"verse\":28,\"text\":\"Dante te illis, colligent ; aperiente te manum tuam, omnia implebuntur bonitate.\"},{\"verse\":29,\"text\":\"Avertente autem te faciem, turbabuntur ; auferes spiritum eorum, et deficient, et in pulverem suum revertentur.\"},{\"verse\":30,\"text\":\"Emittes spiritum tuum, et creabuntur, et renovabis faciem terræ.\"},{\"verse\":31,\"text\":\"Sit gloria Domini in sæculum ; lætabitur Dominus in operibus suis.\"},{\"verse\":32,\"text\":\"Qui respicit terram, et facit eam tremere ; qui tangit montes, et fumigant.\"},{\"verse\":33,\"text\":\"Cantabo Domino in vita mea ; psallam Deo meo quamdiu sum.\"},{\"verse\":34,\"text\":\"Jucundum sit ei eloquium meum ; ego vero delectabor in Domino.\"},{\"verse\":35,\"text\":\"Deficiant peccatores a terra, et iniqui, ita ut non sint. Benedic, anima mea, Domino.\"}],\"summary\":\"Benedic, anima.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":102,\"label\":\"Psalms 102\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":104,\"label\":\"Psalms 104\"}}]]\n"])</script></body></html>
