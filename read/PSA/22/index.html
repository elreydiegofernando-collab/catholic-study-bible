/button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He hath converted my soul. He hath led me on the paths of justice, for his own name’s sake.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For though I should walk in the midst of the shadow of death, I will fear no evils, for thou art with me. Thy rod and thy staff, they have comforted me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thou hast prepared a table before me against them that afflict me. Thou hast anointed my head with oil; and my chalice which inebriateth me, how goodly is it!</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And thy mercy will follow me all the days of my life. And that I may dwell in the house of the Lord unto length of days.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David. Dominus regit me, et nihil mihi deerit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>in loco pascuæ, ibi me collocavit. Super aquam refectionis educavit me ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>animam meam convertit. Deduxit me super semitas justitiæ propter nomen suum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nam etsi ambulavero in medio umbræ mortis, non timebo mala, quoniam tu mecum es. Virga tua, et baculus tuus, ipsa me consolata sunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Parasti in conspectu meo mensam adversus eos qui tribulant me ; impinguasti in oleo caput meum : et calix meus inebrians, quam præclarus est !</button><button type="button" data-verse="6" aria-pressed="false" cl
