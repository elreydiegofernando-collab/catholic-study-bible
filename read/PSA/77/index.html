holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">77</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Attendite.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Understanding for Asaph. Attend, O my people, to my law: incline your ears to the words of my mouth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will open my mouth in parables: I will utter propositions from the beginning.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>How great things have we heard and known, and our fathers have told us.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They have not been hidden from their children, in another generation. Declaring the praises of the Lord, and his powers, and his wonders which he hath done.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he set up a testimony in Jacob: and made a law in Israel. How great things he commanded our fathers, that they should make the same known to their children:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>That another generation might know them. The children that should be born and should rise up, and declare them to their children.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That they may put their hope in God and may not forget the works of God: and may seek his commandments.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>That they may not become like their fathers, a perverse and exasperating generation. A generation that set not their heart aright: and whose spirit was not faithful to God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The sons of Ephraim who bend and shoot with the bow: they have turned back in the day of battle.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They kept not the covenant of God: and in his law they would not walk.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they forgot his benefits, and his wonders that he had shewn them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wonderful things did he do in the sight of their fathers, in the land of Egypt, in the field of Tanis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He divided the sea and brought them through: and he made the waters to stand as in a vessel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he conducted them with a cloud by day: and all the night with a light of fire.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He struck the rock in the wilderness: and gave them to drink, as out of the great deep.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He brought forth water out of the rock: and made streams run down as rivers.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they added yet more sin against him: they provoked the most High to wrath in the place without water.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they tempted God in their hearts, by asking meat for their desires.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they spoke ill of God: they said: Can God furnish a table in the wilderness?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Because he struck the rock, and the waters gushed out, and the streams overflowed. Can he also give bread, or provide a table for his people?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Therefore the Lord heard, and was angry: and a fire was kindled against Jacob, and wrath came up against Israel.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Because they believed not in God: and trusted not in his salvation.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he had commanded the clouds from above, and had opened the doors of heaven.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And had rained down manna upon them to eat, and had given them the bread of heaven.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Man ate the bread of angels: he sent them provisions in abundance.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He removed the south wind from heaven: and by his power brought in the south-west wind.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he rained upon them flesh as dust: and feathered fowls like as the sand of the sea.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they fell in the midst of their camp, round about their pavilions.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>So they did eat, and were filled exceedingly, and he gave them their desire:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>they were not defrauded of that which they craved. As yet their meat was in their mouth:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the wrath of God came upon them. And he slew the fat ones amongst them, and brought down the chosen men of Israel.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In all these things they sinned still: and they believed not for his wondrous works.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And their days were consumed in vanity, and their years in haste.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>When he slew them, then they sought him: and they returned, and came to him early in the morning.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And they remembered that God was their helper: and the most high God their redeemer.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And they loved him with their mouth: and with their tongue they lied unto him:</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But their heart was not right with him: nor were they counted faithful in his covenant.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But he is merciful, and will forgive their sins: and will not destroy them. And many a time did he turn away his anger: and did not kindle all his wrath.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And he remembered that they are flesh: a wind that goeth and returneth not.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>How often did they provoke him in the desert: and move him to wrath in the place without water?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And they turned back and tempted God: and grieved the holy one of Israel.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>They remembered not his hand, in the day that he redeemed them from the hand of him that afflicted them:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>How he wrought his signs in Egypt, and his wonders in the field of Tanis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he turned their rivers into blood, and their showers that they might not drink.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>He sent amongst them divers sorts of flies, which devoured them: and frogs which destroyed them.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he gave up their fruits to the blast, and their labours to the locust.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And he destroyed their vineyards with hail, and their mulberry trees with hoarfrost.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And he gave up their cattle to the hail, and their stock to the fire.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And he sent upon them the wrath of his indignation: indignation and wrath and trouble, which he sent by evil angels.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>He made a way for a path to his anger: he spared not their souls from death, and their cattle he shut up in death.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And he killed all the firstborn in the land of Egypt: the firstfruits of all their labour in the tabernacles of Cham.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And he took away his own people as sheep: and guided them in the wilderness like a flock.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And he brought them out in hope and they feared not: and the sea overwhelmed their enemies.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And he brought them into the mountain of his sanctuary: the mountain which his right hand had purchased. And he cast out the Gentiles before them: and by lot divided to them their land by a line of distribution.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And he made the tribes of Israel to dwell in their tabernacles.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Yet they tempted, and provoked the most high God: and they kept not his testimonies.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And they turned away, and kept not the covenant: even like their fathers they were turned aside as a crooked bow.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>They provoked him to anger on their hills: and moved him to jealousy with their graven things.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>God heard, and despised them, and he reduced Israel exceedingly as it were to nothing.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And he put away the tabernacle of Silo, his tabernacle where he dwelt among men.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And he delivered their strength into captivity: and their beauty into the hands of the enemy.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And he shut up his people under the sword: and he despised his inheritance.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Fire consumed their young men: and their maidens were not lamented.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Their priests fell by the sword: and their widows did not mourn.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And the Lord was awaked as one out of sleep, and like a mighty man that hath been surfeited with wine.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>And he smote his enemies on the hinder parts: he put them to an everlasting reproach.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>And he rejected the tabernacle of Joseph: and chose not the tribe of Ephraim:</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>But he chose the tribe of Juda, mount Sion which he loved.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>And he built his sanctuary as of unicorns, in the land which he founded for ever.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>And he chose his servant David, and took him from the flocks of sheep: he brought him from following the ewes great with young,</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>To feed Jacob his servant and Israel his inheritance.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>And he fed them in the innocence of his heart: and conducted them by the skilfulness of his hands.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Intellectus Asaph. Attendite, popule meus, legem meam ; inclinate aurem vestram in verba oris mei.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Aperiam in parabolis os meum ; loquar propositiones ab initio.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quanta audivimus, et cognovimus ea, et patres nostri narraverunt nobis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non sunt occultata a filiis eorum in generatione altera, narrantes laudes Domini et virtutes ejus, et mirabilia ejus quæ fecit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et suscitavit testimonium in Jacob, et legem posuit in Israël, quanta mandavit patribus nostris nota facere ea filiis suis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>ut cognoscat generatio altera : filii qui nascentur et exsurgent, et narrabunt filiis suis,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ut ponant in Deo spem suam, et non obliviscantur operum Dei, et mandata ejus exquirant :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>ne fiant, sicut patres eorum, generatio prava et exasperans ; generatio quæ non direxit cor suum, et non est creditus cum Deo spiritus ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Filii Ephrem, intendentes et mittentes arcum, conversi sunt in die belli.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non custodierunt testamentum Dei, et in lege ejus noluerunt ambulare.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et obliti sunt benefactorum ejus, et mirabilium ejus quæ ostendit eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Coram patribus eorum fecit mirabilia in terra Ægypti, in campo Taneos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Interrupit mare, et perduxit eos, et statuit aquas quasi in utre :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et deduxit eos in nube diei, et tota nocte in illuminatione ignis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Interrupit petram in eremo, et adaquavit eos velut in abysso multa.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et eduxit aquam de petra, et deduxit tamquam flumina aquas.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et apposuerunt adhuc peccare ei ; in iram excitaverunt Excelsum in inaquoso.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et tentaverunt Deum in cordibus suis, ut peterent escas animabus suis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et male locuti sunt de Deo ; dixerunt : Numquid poterit Deus parare mensam in deserto ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quoniam percussit petram, et fluxerunt aquæ, et torrentes inundaverunt. Numquid et panem poterit dare, aut parare mensam populo suo ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ideo audivit Dominus et distulit ; et ignis accensus est in Jacob, et ira ascendit in Israël :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>quia non crediderunt in Deo, nec speraverunt in salutari ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et mandavit nubibus desuper, et januas cæli aperuit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et pluit illis manna ad manducandum, et panem cæli dedit eis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Panem angelorum manducavit homo ; cibaria misit eis in abundantia.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Transtulit austrum de cælo, et induxit in virtute sua africum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et pluit super eos sicut pulverem carnes, et sicut arenam maris volatilia pennata.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et ceciderunt in medio castrorum eorum, circa tabernacula eorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et manducaverunt, et saturati sunt nimis, et desiderium eorum attulit eis :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>non sunt fraudati a desiderio suo. Adhuc escæ eorum erant in ore ipsorum,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et ira Dei ascendit super eos : et occidit pingues eorum, et electos Israël impedivit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In omnibus his peccaverunt adhuc, et non crediderunt in mirabilibus ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et defecerunt in vanitate dies eorum, et anni eorum cum festinatione.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Cum occideret eos, quærebant eum et revertebantur, et diluculo veniebant ad eum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et rememorati sunt quia Deus adjutor est eorum, et Deus excelsus redemptor eorum est.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dilexerunt eum in ore suo, et lingua sua mentiti sunt ei ;</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>cor autem eorum non erat rectum cum eo, nec fideles habiti sunt in testamento ejus.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ipse autem est misericors, et propitius fiet peccatis eorum, et non disperdet eos. Et abundavit ut averteret iram suam, et non accendit omnem iram suam.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et recordatus est quia caro sunt, spiritus vadens et non rediens.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Quoties exacerbaverunt eum in deserto ; in iram concitaverunt eum in inaquoso ?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et conversi sunt, et tentaverunt Deum, et sanctum Israël exacerbaverunt.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Non sunt recordati manus ejus, die qua redemit eos de manu tribulantis :</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>sicut posuit in Ægypto signa sua, et prodigia sua in campo Taneos ;</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>et convertit in sanguinem flumina eorum, et imbres eorum, ne biberent.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Misit in eos cœnomyiam, et comedit eos, et ranam, et disperdidit eos ;</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>et dedit ærugini fructus eorum, et labores eorum locustæ ;</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>et occidit in grandine vineas eorum, et moros eorum in pruina ;</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>et tradidit grandini jumenta eorum, et possessionem eorum igni ;</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>misit in eos iram indignationis suæ, indignationem, et iram, et tribulationem, immissiones per angelos malos.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Viam fecit semitæ iræ suæ : non pepercit a morte animabus eorum, et jumenta eorum in morte conclusit :</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>et percussit omne primogenitum in terra Ægypti ; primitias omnis laboris eorum in tabernaculis Cham :</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>et abstulit sicut oves populum suum, et perduxit eos tamquam gregem in deserto :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>et deduxit eos in spe, et non timuerunt, et inimicos eorum operuit mare.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Et induxit eos in montem sanctificationis suæ, montem quem acquisivit dextera ejus ; et ejecit a facie eorum gentes, et sorte divisit eis terram in funiculo distributionis ;</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>et habitare fecit in tabernaculis eorum tribus Israël.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Et tentaverunt, et exacerbaverunt Deum excelsum, et testimonia ejus non custodierunt.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Et averterunt se, et non servaverunt pactum : quemadmodum patres eorum, conversi sunt in arcum pravum.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>In iram concitaverunt eum in collibus suis, et in sculptilibus suis ad æmulationem eum provocaverunt.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Audivit Deus, et sprevit, et ad nihilum redegit valde Israël.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Et repulit tabernaculum Silo, tabernaculum suum, ubi habitavit in hominibus.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Et tradidit in captivitatem virtutem eorum, et pulchritudinem eorum in manus inimici.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Et conclusit in gladio populum suum, et hæreditatem suam sprevit.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Juvenes eorum comedit ignis, et virgines eorum non sunt lamentatæ.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Sacerdotes eorum in gladio ceciderunt, et viduæ eorum non plorabantur.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Et excitatus est tamquam dormiens Dominus, tamquam potens crapulatus a vino.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Et percussit inimicos suos in posteriora ; opprobrium sempiternum dedit illis.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Et repulit tabernaculum Joseph, et tribum Ephraim non elegit :</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>sed elegit tribum Juda, montem Sion, quem dilexit.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Et ædificavit sicut unicornium sanctificium suum, in terra quam fundavit in sæcula.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Et elegit David, servum suum, et sustulit eum de gregibus ovium ; de post fœtantes accepit eum :</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>pascere Jacob servum suum, et Israël hæreditatem suam.</button><button type="button" data 11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.77\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":77,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Understanding for Asaph. Attend, O my people, to my law: incline your ears to the words of my mouth.\"},{\"verse\":2,\"text\":\"I will open my mouth in parables: I will utter propositions from the beginning.\"},{\"verse\":3,\"text\":\"How great things have we heard and known, and our fathers have told us.\"},{\"verse\":4,\"text\":\"They have not been hidden from their children, in another generation. Declaring the praises of the Lord, and his powers, and his wonders which he hath done.\"},{\"verse\":5,\"text\":\"And he set up a testimony in Jacob: and made a law in Israel. How great things he commanded our fathers, that they should make the same known to their children:\"},{\"verse\":6,\"text\":\"That another generation might know them. The children that should be born and should rise up, and declare them to their children.\"},{\"verse\":7,\"text\":\"That they may put their hope in God and may not forget the works of God: and may seek his commandments.\"},{\"verse\":8,\"text\":\"That they may not become like their fathers, a perverse and exasperating generation. A generation that set not their heart aright: and whose spirit was not faithful to God.\"},{\"verse\":9,\"text\":\"The sons of Ephraim who bend and shoot with the bow: they have turned back in the day of battle.\"},{\"verse\":10,\"text\":\"They kept not the covenant of God: and in his law they would not walk.\"},{\"verse\":11,\"text\":\"And they forgot his benefits, and his wonders that he had shewn them.\"},{\"verse\":12,\"text\":\"Wonderful things did he do in the sight of their fathers, in the land of Egypt, in the field of Tanis.\"},{\"verse\":13,\"text\":\"He divided the sea and brought them through: and he made the waters to stand as in a vessel.\"},{\"verse\":14,\"text\":\"And he conducted them with a cloud by day: and all the night with a light of fire.\"},{\"verse\":15,\"text\":\"He struck the rock in the wilderness: and gave them to drink, as out of the great deep.\"},{\"verse\":16,\"text\":\"He brought forth water out of the rock: and made streams run down as rivers.\"},{\"verse\":17,\"text\":\"And they added yet more sin against him: they provoked the most High to wrath in the place without water.\"},{\"verse\":18,\"text\":\"And they tempted God in their hearts, by asking meat for their desires.\"},{\"verse\":19,\"text\":\"And they spoke ill of God: they said: Can God furnish a table in the wilderness?\"},{\"verse\":20,\"text\":\"Because he struck the rock, and the waters gushed out, and the streams overflowed. Can he also give bread, or provide a table for his people?\"},{\"verse\":21,\"text\":\"Therefore the Lord heard, and was angry: and a fire was kindled against Jacob, and wrath came up against Israel.\"},{\"verse\":22,\"text\":\"Because they believed not in God: and trusted not in his salvation.\"},{\"verse\":23,\"text\":\"And he had commanded the clouds from above, and had opened the doors of heaven.\"},{\"verse\":24,\"text\":\"And had rained down manna upon them to eat, and had given them the bread of heaven.\"},{\"verse\":25,\"text\":\"Man ate the bread of angels: he sent them provisions in abundance.\"},{\"verse\":26,\"text\":\"He removed the south wind from heaven: and by his power brought in the south-west wind.\"},{\"verse\":27,\"text\":\"And he rained upon them flesh as dust: and feathered fowls like as the sand of the sea.\"},{\"verse\":28,\"text\":\"And they fell in the midst of their camp, round about their pavilions.\"},{\"verse\":29,\"text\":\"So they did eat, and were filled exceedingly, and he gave them their desire:\"},{\"verse\":30,\"text\":\"they were not defrauded of that which they craved. As yet their meat was in their mouth:\"},{\"verse\":31,\"text\":\"And the wrath of God came upon them. And he slew the fat ones amongst them, and brought down the chosen men of Israel.\"},{\"verse\":32,\"text\":\"In all these things they sinned still: and they believed not for his wondrous works.\"},{\"verse\":33,\"text\":\"And their days were consumed in vanity, and their years in haste.\"},{\"verse\":34,\"text\":\"When he slew them, then they sought him: and they returned, and came to him early in the morning.\"},{\"verse\":35,\"text\":\"And they remembered that God was their helper: and the most high God their redeemer.\"},{\"verse\":36,\"text\":\"And they loved him with their mouth: and with their tongue they lied unto him:\"},{\"verse\":37,\"text\":\"But their heart was not right with him: nor were they counted faithful in his covenant.\"},{\"verse\":38,\"text\":\"But he is merciful, and will forgive their sins: and will not destroy them. And many a time did he turn away his anger: and did not kindle all his wrath.\"},{\"verse\":39,\"text\":\"And he remembered that they are flesh: a wind that goeth and returneth not.\"},{\"verse\":40,\"text\":\"How often did they provoke him in the desert: and move him to wrath in the place without water?\"},{\"verse\":41,\"text\":\"And they turned back and tempted God: and grieved the holy one of Israel.\"},{\"verse\":42,\"text\":\"They remembered not his hand, in the day that he redeemed them from the hand of him that afflicted them:\"},{\"verse\":43,\"text\":\"How he wrought his signs in Egypt, and his wonders in the field of Tanis.\"},{\"verse\":44,\"text\":\"And he turned their rivers into blood, and their showers that they might not drink.\"},{\"verse\":45,\"text\":\"He sent amongst them divers sorts of flies, which devoured them: and frogs which destroyed them.\"},{\"verse\":46,\"text\":\"And he gave up their fruits to the blast, and their labours to the locust.\"},{\"verse\":47,\"text\":\"And he destroyed their vineyards with hail, and their mulberry trees with hoarfrost.\"},{\"verse\":48,\"text\":\"And he gave up their cattle to the hail, and their stock to the fire.\"},{\"verse\":49,\"text\":\"And he sent upon them the wrath of his indignation: indignation and wrath and trouble, which he sent by evil angels.\"},{\"verse\":50,\"text\":\"He made a way for a path to his anger: he spared not their souls from death, and their cattle he shut up in death.\"},{\"verse\":51,\"text\":\"And he killed all the firstborn in the land of Egypt: the firstfruits of all their labour in the tabernacles of Cham.\"},{\"verse\":52,\"text\":\"And he took away his own people as sheep: and guided them in the wilderness like a flock.\"},{\"verse\":53,\"text\":\"And he brought them out in hope and they feared not: and the sea overwhelmed their enemies.\"},{\"verse\":54,\"text\":\"And he brought them into the mountain of his sanctuary: the mountain which his right hand had purchased. And he cast out the Gentiles before them: and by lot divided to them their land by a line of distribution.\"},{\"verse\":55,\"text\":\"And he made the tribes of Israel to dwell in their tabernacles.\"},{\"verse\":56,\"text\":\"Yet they tempted, and provoked the most high God: and they kept not his testimonies.\"},{\"verse\":57,\"text\":\"And they turned away, and kept not the covenant: even like their fathers they were turned aside as a crooked bow.\"},{\"verse\":58,\"text\":\"They provoked him to anger on their hills: and moved him to jealousy with their graven things.\"},{\"verse\":59,\"text\":\"God heard, and despised them, and he reduced Israel exceedingly as it were to nothing.\"},{\"verse\":60,\"text\":\"And he put away the tabernacle of Silo, his tabernacle where he dwelt among men.\"},{\"verse\":61,\"text\":\"And he delivered their strength into captivity: and their beauty into the hands of the enemy.\"},{\"verse\":62,\"text\":\"And he shut up his people under the sword: and he despised his inheritance.\"},{\"verse\":63,\"text\":\"Fire consumed their young men: and their maidens were not lamented.\"},{\"verse\":64,\"text\":\"Their priests fell by the sword: and their widows did not mourn.\"},{\"verse\":65,\"text\":\"And the Lord was awaked as one out of sleep, and like a mighty man that hath been surfeited with wine.\"},{\"verse\":66,\"text\":\"And he smote his enemies on the hinder parts: he put them to an everlasting reproach.\"},{\"verse\":67,\"text\":\"And he rejected the tabernacle of Joseph: and chose not the tribe of Ephraim:\"},{\"verse\":68,\"text\":\"But he chose the tribe of Juda, mount Sion which he loved.\"},{\"verse\":69,\"text\":\"And he built his sanctuary as of unicorns, in the land which he founded for ever.\"},{\"verse\":70,\"text\":\"And he chose his servant David, and took him from the flocks of sheep: he brought him from following the ewes great with young,\"},{\"verse\":71,\"text\":\"To feed Jacob his servant and Israel his inheritance.\"},{\"verse\":72,\"text\":\"And he fed them in the innocence of his heart: and conducted them by the skilfulness of his hands.\"}],\"vul\":[{\"verse\":1,\"text\":\"Intellectus Asaph. Attendite, popule meus, legem meam ; inclinate aurem vestram in verba oris mei.\"},{\"verse\":2,\"text\":\"Aperiam in parabolis os meum ; loquar propositiones ab initio.\"},{\"verse\":3,\"text\":\"Quanta audivimus, et cognovimus ea, et patres nostri narraverunt nobis.\"},{\"verse\":4,\"text\":\"Non sunt occultata a filiis eorum in generatione altera, narrantes laudes Domini et virtutes ejus, et mirabilia ejus quæ fecit.\"},{\"verse\":5,\"text\":\"Et suscitavit testimonium in Jacob, et legem posuit in Israël, quanta mandavit patribus nostris nota facere ea filiis suis :\"},{\"verse\":6,\"text\":\"ut cognoscat generatio altera : filii qui nascentur et exsurgent, et narrabunt filiis suis,\"},{\"verse\":7,\"text\":\"ut ponant in Deo spem suam, et non obliviscantur operum Dei, et mandata ejus exquirant :\"},{\"verse\":8,\"text\":\"ne fiant, sicut patres eorum, generatio prava et exasperans ; generatio quæ non direxit cor suum, et non est creditus cum Deo spiritus ejus.\"},{\"verse\":9,\"text\":\"Filii Ephrem, intendentes et mittentes arcum, conversi sunt in die belli.\"},{\"verse\":10,\"text\":\"Non custodierunt testamentum Dei, et in lege ejus noluerunt ambulare.\"},{\"verse\":11,\"text\":\"Et obliti sunt benefactorum ejus, et mirabilium ejus quæ ostendit eis.\"},{\"verse\":12,\"text\":\"Coram patribus eorum fecit mirabilia in terra Ægypti, in campo Taneos.\"},{\"verse\":13,\"text\":\"Interrupit mare, et perduxit eos, et statuit aquas quasi in utre :\"},{\"verse\":14,\"text\":\"et deduxit eos in nube diei, et tota nocte in illuminatione ignis.\"},{\"verse\":15,\"text\":\"Interrupit petram in eremo, et adaquavit eos velut in abysso multa.\"},{\"verse\":16,\"text\":\"Et eduxit aquam de petra, et deduxit tamquam flumina aquas.\"},{\"verse\":17,\"text\":\"Et apposuerunt adhuc peccare ei ; in iram excitaverunt Excelsum in inaquoso.\"},{\"verse\":18,\"text\":\"Et tentaverunt Deum in cordibus suis, ut peterent escas animabus suis.\"},{\"verse\":19,\"text\":\"Et male locuti sunt de Deo ; dixerunt : Numquid poterit Deus parare mensam in deserto ?\"},{\"verse\":20,\"text\":\"quoniam percussit petram, et fluxerunt aquæ, et torrentes inundaverunt. Numquid et panem poterit dare, aut parare mensam populo suo ?\"},{\"verse\":21,\"text\":\"Ideo audivit Dominus et distulit ; et ignis accensus est in Jacob, et ira ascendit in Israël :\"},{\"verse\":22,\"text\":\"quia non crediderunt in Deo, nec speraverunt in salutari ejus.\"},{\"verse\":23,\"text\":\"Et mandavit nubibus desuper, et januas cæli aperuit.\"},{\"verse\":24,\"text\":\"Et pluit illis manna ad manducandum, et panem cæli dedit eis.\"},{\"verse\":25,\"text\":\"Panem angelorum manducavit homo ; cibaria misit eis in abundantia.\"},{\"verse\":26,\"text\":\"Transtulit austrum de cælo, et induxit in virtute sua africum.\"},{\"verse\":27,\"text\":\"Et pluit super eos sicut pulverem carnes, et sicut arenam maris volatilia pennata.\"},{\"verse\":28,\"text\":\"Et ceciderunt in medio castrorum eorum, circa tabernacula eorum.\"},{\"verse\":29,\"text\":\"Et manducaverunt, et saturati sunt nimis, et desiderium eorum attulit eis :\"},{\"verse\":30,\"text\":\"non sunt fraudati a desiderio suo. Adhuc escæ eorum erant in ore ipsorum,\"},{\"verse\":31,\"text\":\"et ira Dei ascendit super eos : et occidit pingues eorum, et electos Israël impedivit.\"},{\"verse\":32,\"text\":\"In omnibus his peccaverunt adhuc, et non crediderunt in mirabilibus ejus.\"},{\"verse\":33,\"text\":\"Et defecerunt in vanitate dies eorum, et anni eorum cum festinatione.\"},{\"verse\":34,\"text\":\"Cum occideret eos, quærebant eum et revertebantur, et diluculo veniebant ad eum.\"},{\"verse\":35,\"text\":\"Et rememorati sunt quia Deus adjutor est eorum, et Deus excelsus redemptor eorum est.\"},{\"verse\":36,\"text\":\"Et dilexerunt eum in ore suo, et lingua sua mentiti sunt ei ;\"},{\"verse\":37,\"text\":\"cor autem eorum non erat rectum cum eo, nec fideles habiti sunt in testamento ejus.\"},{\"verse\":38,\"text\":\"Ipse autem est misericors, et propitius fiet peccatis eorum, et non disperdet eos. Et abundavit ut averteret iram suam, et non accendit omnem iram suam.\"},{\"verse\":39,\"text\":\"Et recordatus est quia caro sunt, spiritus vadens et non rediens.\"},{\"verse\":40,\"text\":\"Quoties exacerbaverunt eum in deserto ; in iram concitaverunt eum in inaquoso ?\"},{\"verse\":41,\"text\":\"Et conversi sunt, et tentaverunt Deum, et sanctum Israël exacerbaverunt.\"},{\"verse\":42,\"text\":\"Non sunt recordati manus ejus, die qua redemit eos de manu tribulantis :\"},{\"verse\":43,\"text\":\"sicut posuit in Ægypto signa sua, et prodigia sua in campo Taneos ;\"},{\"verse\":44,\"text\":\"et convertit in sanguinem flumina eorum, et imbres eorum, ne biberent.\"},{\"verse\":45,\"text\":\"Misit in eos cœnomyiam, et comedit eos, et ranam, et disperdidit eos ;\"},{\"verse\":46,\"text\":\"et dedit ærugini fructus eorum, et labores eorum locustæ ;\"},{\"verse\":47,\"text\":\"et occidit in grandine vineas eorum, et moros eorum in pruina ;\"},{\"verse\":48,\"text\":\"et tradidit grandini jumenta eorum, et possessionem eorum igni ;\"},{\"verse\":49,\"text\":\"misit in eos iram indignationis suæ, indignationem, et iram, et tribulationem, immissiones per angelos malos.\"},{\"verse\":50,\"text\":\"Viam fecit semitæ iræ suæ : non pepercit a morte animabus eorum, et jumenta eorum in morte conclusit :\"},{\"verse\":51,\"text\":\"et percussit omne primogenitum in terra Ægypti ; primitias omnis laboris eorum in tabernaculis Cham :\"},{\"verse\":52,\"text\":\"et abstulit sicut oves populum suum, et perduxit eos tamquam gregem in deserto :\"},{\"verse\":53,\"text\":\"et deduxit eos in spe, et non timuerunt, et inimicos eorum operuit mare.\"},{\"verse\":54,\"text\":\"Et induxit eos in montem sanctificationis suæ, montem quem acquisivit dextera ejus ; et ejecit a facie eorum gentes, et sorte divisit eis terram in funiculo distributionis ;\"},{\"verse\":55,\"text\":\"et habitare fecit in tabernaculis eorum tribus Israël.\"},{\"verse\":56,\"text\":\"Et tentaverunt, et exacerbaverunt Deum excelsum, et testimonia ejus non custodierunt.\"},{\"verse\":57,\"text\":\"Et averterunt se, et non servaverunt pactum : quemadmodum patres eorum, conversi sunt in arcum pravum.\"},{\"verse\":58,\"text\":\"In iram concitaverunt eum in collibus suis, et in sculptilibus suis ad æmulationem eum provocaverunt.\"},{\"verse\":59,\"text\":\"Audivit Deus, et sprevit, et ad nihilum redegit valde Israël.\"},{\"verse\":60,\"text\":\"Et repulit tabernaculum Silo, tabernaculum suum, ubi habitavit in hominibus.\"},{\"verse\":61,\"text\":\"Et tradidit in captivitatem virtutem eorum, et pulchritudinem eorum in manus inimici.\"},{\"verse\":62,\"text\":\"Et conclusit in gladio populum suum, et hæreditatem suam sprevit.\"},{\"verse\":63,\"text\":\"Juvenes eorum comedit ignis, et virgines eorum non sunt lamentatæ.\"},{\"verse\":64,\"text\":\"Sacerdotes eorum in gladio ceciderunt, et viduæ eorum non plorabantur.\"},{\"verse\":65,\"text\":\"Et excitatus est tamquam dormiens Dominus, tamquam potens crapulatus a vino.\"},{\"verse\":66,\"text\":\"Et percussit inimicos suos in posteriora ; opprobrium sempiternum dedit illis.\"},{\"verse\":67,\"text\":\"Et repulit tabernaculum Joseph, et tribum Ephraim non elegit :\"},{\"verse\":68,\"text\":\"sed elegit tribum Juda, montem Sion, quem dilexit.\"},{\"verse\":69,\"text\":\"Et ædificavit sicut unicornium sanctificium suum, in terra quam fundavit in sæcula.\"},{\"verse\":70,\"text\":\"Et elegit David, servum suum, et sustulit eum de gregibus ovium ; de post fœtantes accepit eum :\"},{\"verse\":71,\"text\":\"pascere Jacob servum suum, et Israël hæreditatem suam.\"},{\"verse\":72,\"text\":\"Et pavit eos in innocentia cordis sui, et in intellectibus manuum suarum deduxit eos.\"}],\"summary\":\"Attendite.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":76,\"label\":\"Psalms 76\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":78,\"label\":\"Psalms 78\"}}]]\n"])</script></body></html>
