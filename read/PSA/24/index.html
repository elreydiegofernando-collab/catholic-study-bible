button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a psalm for David. To thee, O Lord, have I lifted up my soul.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In thee, O my God, I put my trust; let me not be ashamed.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Neither let my enemies laugh at me: for none of them that wait on thee shall be confounded.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let all them be confounded that act unjust things without cause. Shew, O Lord, thy ways to me, and teach me thy paths.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Direct me in thy truth, and teach me; for thou art God my Saviour; and on thee have I waited all the day long.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Remember, O Lord, thy bowels of compassion; and thy mercies that are from the beginning of the world.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The sins of my youth and my ignorances do not remember. According to thy mercy remember thou me: for thy goodness’ sake, O Lord.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord is sweet and righteous: therefore he will give a law to sinners in the way.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He will guide the mild in judgment: he will teach the meek his ways.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>All the ways of the Lord are mercy and truth, to them that seek after his covenant and his testimonies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For thy name’s sake, O Lord, thou wilt pardon my sin: for it is great.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Who is the man that feareth the Lord? He hath appointed him a law in the way he hath chosen.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>His soul shall dwell in good things: and his seed shall inherit the land.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The Lord is a firmament to them that fear him: and his covenant shall be made manifest to them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My eyes are ever towards the Lord: for he shall pluck my feet out of the snare.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Look thou upon me, and have mercy on me; for I am alone and poor.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The troubles of my heart are multiplied: deliver me from my necessities.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>See my abjection and my labour; and forgive me all my sins.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Consider my enemies for they are multiplied, and have hated me with an unjust hatred.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Keep thou my soul, and deliver me: I shall not be ashamed, for I have hoped in thee.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The innocent and the upright have adhered to me: because I have waited on thee.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Deliver Israel, O God, from all his tribulations.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus David. Ad te, Domine, levavi animam meam :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deus meus, in te confido ; non erubescam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Neque irrideant me inimici mei : etenim universi qui sustinent te, non confundentur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Confundantur omnes iniqua agentes supervacue. Vias tuas, Domine, demonstra mihi, et semitas tuas edoce me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dirige me in veritate tua, et doce me, quia tu es Deus salvator meus, et te sustinui tota die.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Reminiscere miserationum tuarum, Domine, et misericordiarum tuarum quæ a sæculo sunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Delicta juventutis meæ, et ignorantias meas, ne memineris. Secundum misericordiam tuam memento mei tu, propter bonitatem tuam, Domine.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dulcis et rectus Dominus ; propter hoc legem dabit delinquentibus in via.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Diriget mansuetos in judicio ; docebit mites vias suas.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Universæ viæ Domini, misericordia et veritas, requirentibus testamentum ejus et testimonia ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Propter nomen tuum, Domine, propitiaberis peccato meo ; multum est enim.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quis est homo qui timet Dominum ? legem statuit ei in via quam elegit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Anima ejus in bonis demorabitur, et semen ejus hæreditabit terram.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Firmamentum est Dominus timentibus eum ; et testamentum ipsius ut manifestetur illis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Oculi mei semper ad Dominum, quoniam ipse evellet de laqueo pedes meos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Respice in me, et miserere mei, quia unicus et pauper sum ego.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tribulationes cordis mei multiplicatæ sunt : de necessitatibus meis erue me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vide humilitatem meam et laborem meum, et dimitte universa delicta mea.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Respice inimicos meos, quoniam multiplicati sunt, et odio iniquo oderunt me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Custodi animam meam, et erue me : non erubescam, quoniam speravi in te.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Innocentes et recti adhæserunt mihi, quia sustinui te.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Libera, Deus, Israël ex omnibus tribulationibus suis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/23/"><svg viewBox="0 0 rse\":1,\"text\":\"Unto the end, a psalm for David. To thee, O Lord, have I lifted up my soul.\"},{\"verse\":2,\"text\":\"In thee, O my God, I put my trust; let me not be ashamed.\"},{\"verse\":3,\"text\":\"Neither let my enemies laugh at me: for none of them that wait on thee shall be confounded.\"},{\"verse\":4,\"text\":\"Let all them be confounded that act unjust things without cause. Shew, O Lord, thy ways to me, and teach me thy paths.\"},{\"verse\":5,\"text\":\"Direct me in thy truth, and teach me; for thou art God my Saviour; and on thee have I waited all the day long.\"},{\"verse\":6,\"text\":\"Remember, O Lord, thy bowels of compassion; and thy mercies that are from the beginning of the world.\"},{\"verse\":7,\"text\":\"The sins of my youth and my ignorances do not remember. According to thy mercy remember thou me: for thy goodness’ sake, O Lord.\"},{\"verse\":8,\"text\":\"The Lord is sweet and righteous: therefore he will give a law to sinners in the way.\"},{\"verse\":9,\"text\":\"He will guide the mild in judgment: he will teach the meek his ways.\"},{\"verse\":10,\"text\":\"All the ways of the Lord are mercy and truth, to them that seek after his covenant and his testimonies.\"},{\"verse\":11,\"text\":\"For thy name’s sake, O Lord, thou wilt pardon my sin: for it is great.\"},{\"verse\":12,\"text\":\"Who is the man that feareth the Lord? He hath appointed him a law in the way he hath chosen.\"},{\"verse\":13,\"text\":\"His soul shall dwell in good things: and his seed shall inherit the land.\"},{\"verse\":14,\"text\":\"The Lord is a firmament to them that fear him: and his covenant shall be made manifest to them.\"},{\"verse\":15,\"text\":\"My eyes are ever towards the Lord: for he shall pluck my feet out of the snare.\"},{\"verse\":16,\"text\":\"Look thou upon me, and have mercy on me; for I am alone and poor.\"},{\"verse\":17,\"text\":\"The troubles of my heart are multiplied: deliver me from my necessities.\"},{\"verse\":18,\"text\":\"See my abjection and my labour; and forgive me all my sins.\"},{\"verse\":19,\"text\":\"Consider my enemies for they are multiplied, and have hated me with an unjust hatred.\"},{\"verse\":20,\"text\":\"Keep thou my soul, and deliver me: I shall not be ashamed, for I have hoped in thee.\"},{\"verse\":21,\"text\":\"The innocent and the upright have adhered to me: because I have waited on thee.\"},{\"verse\":22,\"text\":\"Deliver Israel, O God, from all his tribulations.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus David. Ad te, Domine, levavi animam meam :\"},{\"verse\":2,\"text\":\"Deus meus, in te confido ; non erubescam.\"},{\"verse\":3,\"text\":\"Neque irrideant me inimici mei : etenim universi qui sustinent te, non confundentur.\"},{\"verse\":4,\"text\":\"Confundantur omnes iniqua agentes supervacue. Vias tuas, Domine, demonstra mihi, et semitas tuas edoce me.\"},{\"verse\":5,\"text\":\"Dirige me in veritate tua, et doce me, quia tu es Deus salvator meus, et te sustinui tota die.\"},{\"verse\":6,\"text\":\"Reminiscere miserationum tuarum, Domine, et misericordiarum tuarum quæ a sæculo sunt.\"},{\"verse\":7,\"text\":\"Delicta juventutis meæ, et ignorantias meas, ne memineris. Secundum misericordiam tuam memento mei tu, propter bonitatem tuam, Domine.\"},{\"verse\":8,\"text\":\"Dulcis et rectus Dominus ; propter hoc legem dabit delinquentibus in via.\"},{\"verse\":9,\"text\":\"Diriget mansuetos in judicio ; docebit mites vias suas.\"},{\"verse\":10,\"text\":\"Universæ viæ Domini, misericordia et veritas, requirentibus testamentum ejus et testimonia ejus.\"},{\"verse\":11,\"text\":\"Propter nomen tuum, Domine, propitiaberis peccato meo ; multum est enim.\"},{\"verse\":12,\"text\":\"Quis est homo qui timet Dominum ? legem statuit ei in via quam elegit.\"},{\"verse\":13,\"text\":\"Anima ejus in bonis demorabitur, et semen ejus hæreditabit terram.\"},{\"verse\":14,\"text\":\"Firmamentum est Dominus timentibus eum ; et testamentum ipsius ut manifestetur illis.\"},{\"verse\":15,\"text\":\"Oculi mei semper ad Dominum, quoniam ipse evellet de laqueo pedes meos.\"},{\"verse\":16,\"text\":\"Respice in me, et miserere mei, quia unicus et pauper sum ego.\"},{\"verse\":17,\"text\":\"Tribulationes cordis mei multiplicatæ sunt : de necessitatibus meis erue me.\"},{\"verse\":18,\"text\":\"Vide humilitatem meam et laborem meum, et dimitte universa delicta mea.\"},{\"verse\":19,\"text\":\"Respice inimicos meos, quoniam multiplicati sunt, et odio iniquo oderunt me.\"},{\"verse\":20,\"text\":\"Custodi animam meam, et erue me : non erubescam, quoniam speravi in te.\"},{\"verse\":21,\"text\":\"Innocentes et recti adhæserunt mihi, quia sustinui te.\"},{\"verse\":22,\"text\":\"Libera, Deus, Israël ex omnibus tribulationibus suis.\"}],\"summary\":\"Ad te, Domine, levavi.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":23,\"label\":\"Psalms 23\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":25,\"label\":\"Psalms 25\"}}]]\n"])</script></body></html>
