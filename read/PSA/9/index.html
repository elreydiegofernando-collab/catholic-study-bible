1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Confitebor tibi, Domine. The church praiseth God for his protection against her enemies.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for the hidden things of the Son. A psalm for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will give praise to thee, O Lord, with my whole heart: I will relate all thy wonders.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I will be glad, and rejoice in thee: I will sing to thy name, O thou most high.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>When my enemy shall be turned back: they shall be weakened, and perish before thy face.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For thou hast maintained my judgment and my cause: thou hast sat on the throne, who judgest justice.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thou hast rebuked the Gentiles, and the wicked one hath perished; thou hast blotted out their name for ever and ever.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The swords of the enemy have failed unto the end: and their cities thou hast destroyed. Their memory hath perished with a noise:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the Lord remaineth for ever. He hath prepared his throne in judgment:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he shall judge the world in equity, he shall judge the people in justice.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the Lord is become a refuge for the poor: a helper in due time in tribulation.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And let them trust in thee who know thy name: for thou hast not forsaken them that seek thee, O Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sing ye to the Lord, who dwelleth in Sion: declare his ways among the Gentiles:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For requiring their blood, he hath remembered them: he hath not forgotten the cry of the poor.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Have mercy on me, O Lord: see my humiliation which I suffer from my enemies.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou that liftest me up from the gates of death, that I may declare all thy praises in the gates of the daughter of Sion.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I will rejoice in thy salvation: the Gentiles have stuck fast in the destruction which they prepared. Their foot hath been taken in the very snare which they hid.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The Lord shall be known when he executeth judgments: the sinner hath been caught in the works of his own hands.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The wicked shall be turned into hell, all the nations that forget God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For the poor man shall not be forgotten to the end: the patience of the poor shall not perish for ever.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Arise, O Lord, let not man be strengthened: let the Gentiles be judged in thy sight.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Appoint, O Lord, a lawgiver over them: that the Gentiles may know themselves to be but men.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Why, O Lord, hast thou retired afar off? why dost thou slight us in our wants, in the time of trouble?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Whilst the wicked man is proud, the poor is set on fire: they are caught in the counsels which they devise.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For the sinner is praised in the desires of his soul: and the unjust man is blessed.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The sinner hath provoked the Lord, according to the multitude of his wrath, he will not seek him:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>God is not before his eyes: his ways are filthy at all times. Thy judgments are removed from his sight: he shall rule over all his enemies.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For he hath said in his heart: I shall not be moved from generation to generation, and shall be without evil.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>His mouth is full of cursing, and of bitterness, and of deceit: under his tongue are labour and sorrow.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He sitteth in ambush with the rich, in private places, that he may kill the innocent.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>His eyes are upon the poor man: he lieth in wait, in secret, like a lion in his den. He lieth in ambush, that he may catch the poor man: so catch the poor, whilst he draweth him to him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In his net he will bring him down, he will crouch and fall, when he shall have power over the poor.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For he hath said in his heart: God hath forgotten, he hath turned away his face, not to see to the end.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Arise, O Lord God, let thy hand be exalted: forget not the poor.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Wherefore hath the wicked provoked God? for he hath said in his heart: He will not require it.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Thou seest it, for thou considerest labour and sorrow: that thou mayst deliver them into thy hands. To thee is the poor man left: thou wilt be a helper to the orphan.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Break thou the arm of the sinner and of the malignant: his sin shall be sought, and shall not be found.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>The Lord shall reign to eternity, yea, for ever and ever: ye Gentiles shall perish from his land.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>The Lord hath heard the desire of the poor: thy ear hath heard the preparation of their heart.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>To judge for the fatherless and for the humble, that man may no more presume to magnify himself upon earth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, pro occultis filii. Psalmus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Confitebor tibi, Domine, in toto corde meo ; narrabo omnia mirabilia tua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lætabor et exsultabo in te ; psallam nomini tuo, Altissime.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In convertendo inimicum meum retrorsum ; infirmabuntur, et peribunt a facie tua.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam fecisti judicium meum et causam meam ; sedisti super thronum, qui judicas justitiam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Increpasti gentes, et periit impius : nomen eorum delesti in æternum, et in sæculum sæculi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Inimici defecerunt frameæ in finem, et civitates eorum destruxisti. Periit memoria eorum cum sonitu ;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et Dominus in æternum permanet. Paravit in judicio thronum suum,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et ipse judicabit orbem terræ in æquitate : judicabit populos in justitia.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et factus est Dominus refugium pauperi ; adjutor in opportunitatibus, in tribulatione.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et sperent in te qui noverunt nomen tuum, quoniam non dereliquisti quærentes te, Domine.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Psallite Domino qui habitat in Sion ; annuntiate inter gentes studia ejus :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>quoniam requirens sanguinem eorum recordatus est ; non est oblitus clamorem pauperum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Miserere mei, Domine : vide humilitatem meam de inimicis meis,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui exaltas me de portis mortis, ut annuntiem omnes laudationes tuas in portis filiæ Sion :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>exultabo in salutari tuo. Infixæ sunt gentes in interitu quem fecerunt ; in laqueo isto quem absconderunt comprehensus est pes eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cognoscetur Dominus judicia faciens ; in operibus manuum suarum comprehensus est peccator.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Convertantur peccatores in infernum, omnes gentes quæ obliviscuntur Deum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quoniam non in finem oblivio erit pauperis ; patientia pauperum non peribit in finem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Exsurge, Domine ; non confortetur homo : judicentur gentes in conspectu tuo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Constitue, Domine, legislatorem super eos, ut sciant gentes quoniam homines sunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ut quid, Domine, recessisti longe ; despicis in opportunitatibus, in tribulatione ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dum superbit impius, incenditur pauper : comprehenduntur in consiliis quibus cogitant.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quoniam laudatur peccator in desideriis animæ suæ, et iniquus benedicitur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Exacerbavit Dominum peccator : secundum multitudinem iræ suæ, non quæret.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non est Deus in conspectu ejus ; inquinatæ sunt viæ illius in omni tempore. Auferuntur judicia tua a facie ejus ; omnium inimicorum suorum dominabitur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dixit enim in corde suo : Non movebor a generatione in generationem, sine malo.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Cujus maledictione os plenum est, et amaritudine, et dolo ; sub lingua ejus labor et dolor.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Sedet in insidiis cum divitibus in occultis, ut interficiat innocentem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Oculi ejus in pauperem respiciunt ; insidiatur in abscondito, quasi leo in spelunca sua. Insidiatur ut rapiat pauperem ; rapere pauperem dum attrahit eum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In laqueo suo humiliabit eum ; inclinabit se, et cadet cum dominatus fuerit pauperum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Dixit enim in corde suo : Oblitus est Deus ; avertit faciem suam, ne videat in finem.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Exsurge, Domine Deus, exaltetur manus tua ; ne obliviscaris pauperum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Propter quid irritavit impius Deum ? dixit enim in corde suo : Non requiret.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Vides, quoniam tu laborem et dolorem consideras, ut tradas eos in manus tuas. Tibi derelictus est pauper ; orphano tu eris adjutor.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Contere brachium peccatoris et maligni ; quæretur peccatum illius, et non invenietur.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Dominus regnabit in æternum, et in sæculum sæculi ; peribitis, gentes, de terra illius.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Desiderium pauperum exaudivit Dominus ; præparationem cordis eorum audivit auris tua :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>judicare pupillo et humili, ut non apponat ultra magnificare se homo super terram.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6- throne in judgment:\"},{\"verse\":9,\"text\":\"And he shall judge the world in equity, he shall judge the people in justice.\"},{\"verse\":10,\"text\":\"And the Lord is become a refuge for the poor: a helper in due time in tribulation.\"},{\"verse\":11,\"text\":\"And let them trust in thee who know thy name: for thou hast not forsaken them that seek thee, O Lord.\"},{\"verse\":12,\"text\":\"Sing ye to the Lord, who dwelleth in Sion: declare his ways among the Gentiles:\"},{\"verse\":13,\"text\":\"For requiring their blood, he hath remembered them: he hath not forgotten the cry of the poor.\"},{\"verse\":14,\"text\":\"Have mercy on me, O Lord: see my humiliation which I suffer from my enemies.\"},{\"verse\":15,\"text\":\"Thou that liftest me up from the gates of death, that I may declare all thy praises in the gates of the daughter of Sion.\"},{\"verse\":16,\"text\":\"I will rejoice in thy salvation: the Gentiles have stuck fast in the destruction which they prepared. Their foot hath been taken in the very snare which they hid.\"},{\"verse\":17,\"text\":\"The Lord shall be known when he executeth judgments: the sinner hath been caught in the works of his own hands.\"},{\"verse\":18,\"text\":\"The wicked shall be turned into hell, all the nations that forget God.\"},{\"verse\":19,\"text\":\"For the poor man shall not be forgotten to the end: the patience of the poor shall not perish for ever.\"},{\"verse\":20,\"text\":\"Arise, O Lord, let not man be strengthened: let the Gentiles be judged in thy sight.\"},{\"verse\":21,\"text\":\"Appoint, O Lord, a lawgiver over them: that the Gentiles may know themselves to be but men.\"},{\"verse\":22,\"text\":\"Why, O Lord, hast thou retired afar off? why dost thou slight us in our wants, in the time of trouble?\"},{\"verse\":23,\"text\":\"Whilst the wicked man is proud, the poor is set on fire: they are caught in the counsels which they devise.\"},{\"verse\":24,\"text\":\"For the sinner is praised in the desires of his soul: and the unjust man is blessed.\"},{\"verse\":25,\"text\":\"The sinner hath provoked the Lord, according to the multitude of his wrath, he will not seek him:\"},{\"verse\":26,\"text\":\"God is not before his eyes: his ways are filthy at all times. Thy judgments are removed from his sight: he shall rule over all his enemies.\"},{\"verse\":27,\"text\":\"For he hath said in his heart: I shall not be moved from generation to generation, and shall be without evil.\"},{\"verse\":28,\"text\":\"His mouth is full of cursing, and of bitterness, and of deceit: under his tongue are labour and sorrow.\"},{\"verse\":29,\"text\":\"He sitteth in ambush with the rich, in private places, that he may kill the innocent.\"},{\"verse\":30,\"text\":\"His eyes are upon the poor man: he lieth in wait, in secret, like a lion in his den. He lieth in ambush, that he may catch the poor man: so catch the poor, whilst he draweth him to him.\"},{\"verse\":31,\"text\":\"In his net he will bring him down, he will crouch and fall, when he shall have power over the poor.\"},{\"verse\":32,\"text\":\"For he hath said in his heart: God hath forgotten, he hath turned away his face, not to see to the end.\"},{\"verse\":33,\"text\":\"Arise, O Lord God, let thy hand be exalted: forget not the poor.\"},{\"verse\":34,\"text\":\"Wherefore hath the wicked provoked God? for he hath said in his heart: He will not require it.\"},{\"verse\":35,\"text\":\"Thou seest it, for thou considerest labour and sorrow: that thou mayst deliver them into thy hands. To thee is the poor man left: thou wilt be a helper to the orphan.\"},{\"verse\":36,\"text\":\"Break thou the arm of the sinner and of the malignant: his sin shall be sought, and shall not be found.\"},{\"verse\":37,\"text\":\"The Lord shall reign to eternity, yea, for ever and ever: ye Gentiles shall perish from his land.\"},{\"verse\":38,\"text\":\"The Lord hath heard the desire of the poor: thy ear hath heard the preparation of their heart.\"},{\"verse\":39,\"text\":\"To judge for the fatherless and for the humble, that man may no more presume to magnify himself upon earth.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem, pro occultis filii. Psalmus David.\"},{\"verse\":2,\"text\":\"Confitebor tibi, Domine, in toto corde meo ; narrabo omnia mirabilia tua.\"},{\"verse\":3,\"text\":\"Lætabor et exsultabo in te ; psallam nomini tuo, Altissime.\"},{\"verse\":4,\"text\":\"In convertendo inimicum meum retrorsum ; infirmabuntur, et peribunt a facie tua.\"},{\"verse\":5,\"text\":\"Quoniam fecisti judicium meum et causam meam ; sedisti super thronum, qui judicas justitiam.\"},{\"verse\":6,\"text\":\"Increpasti gentes, et periit impius : nomen eorum delesti in æternum, et in sæculum sæculi.\"},{\"verse\":7,\"text\":\"Inimici defecerunt frameæ in finem, et civitates eorum destruxisti. Periit memoria eorum cum sonitu ;\"},{\"verse\":8,\"text\":\"et Dominus in æternum permanet. Paravit in judicio thronum suum,\"},{\"verse\":9,\"text\":\"et ipse judicabit orbem terræ in æquitate : judicabit populos in justitia.\"},{\"verse\":10,\"text\":\"Et factus est Dominus refugium pauperi ; adjutor in opportunitatibus, in tribulatione.\"},{\"verse\":11,\"text\":\"Et sperent in te qui noverunt nomen tuum, quoniam non dereliquisti quærentes te, Domine.\"},{\"verse\":12,\"text\":\"Psallite Domino qui habitat in Sion ; annuntiate inter gentes studia ejus :\"},{\"verse\":13,\"text\":\"quoniam requirens sanguinem eorum recordatus est ; non est oblitus clamorem pauperum.\"},{\"verse\":14,\"text\":\"Miserere mei, Domine : vide humilitatem meam de inimicis meis,\"},{\"verse\":15,\"text\":\"qui exaltas me de portis mortis, ut annuntiem omnes laudationes tuas in portis filiæ Sion :\"},{\"verse\":16,\"text\":\"exultabo in salutari tuo. Infixæ sunt gentes in interitu quem fecerunt ; in laqueo isto quem absconderunt comprehensus est pes eorum.\"},{\"verse\":17,\"text\":\"Cognoscetur Dominus judicia faciens ; in operibus manuum suarum comprehensus est peccator.\"},{\"verse\":18,\"text\":\"Convertantur peccatores in infernum, omnes gentes quæ obliviscuntur Deum.\"},{\"verse\":19,\"text\":\"Quoniam non in finem oblivio erit pauperis ; patientia pauperum non peribit in finem.\"},{\"verse\":20,\"text\":\"Exsurge, Domine ; non confortetur homo : judicentur gentes in conspectu tuo.\"},{\"verse\":21,\"text\":\"Constitue, Domine, legislatorem super eos, ut sciant gentes quoniam homines sunt.\"},{\"verse\":22,\"text\":\"Ut quid, Domine, recessisti longe ; despicis in opportunitatibus, in tribulatione ?\"},{\"verse\":23,\"text\":\"Dum superbit impius, incenditur pauper : comprehenduntur in consiliis quibus cogitant.\"},{\"verse\":24,\"text\":\"Quoniam laudatur peccator in desideriis animæ suæ, et iniquus benedicitur.\"},{\"verse\":25,\"text\":\"Exacerbavit Dominum peccator : secundum multitudinem iræ suæ, non quæret.\"},{\"verse\":26,\"text\":\"Non est Deus in conspectu ejus ; inquinatæ sunt viæ illius in omni tempore. Auferuntur judicia tua a facie ejus ; omnium inimicorum suorum dominabitur.\"},{\"verse\":27,\"text\":\"Dixit enim in corde suo : Non movebor a generatione in generationem, sine malo.\"},{\"verse\":28,\"text\":\"Cujus maledictione os plenum est, et amaritudine, et dolo ; sub lingua ejus labor et dolor.\"},{\"verse\":29,\"text\":\"Sedet in insidiis cum divitibus in occultis, ut interficiat innocentem.\"},{\"verse\":30,\"text\":\"Oculi ejus in pauperem respiciunt ; insidiatur in abscondito, quasi leo in spelunca sua. Insidiatur ut rapiat pauperem ; rapere pauperem dum attrahit eum.\"},{\"verse\":31,\"text\":\"In laqueo suo humiliabit eum ; inclinabit se, et cadet cum dominatus fuerit pauperum.\"},{\"verse\":32,\"text\":\"Dixit enim in corde suo : Oblitus est Deus ; avertit faciem suam, ne videat in finem.\"},{\"verse\":33,\"text\":\"Exsurge, Domine Deus, exaltetur manus tua ; ne obliviscaris pauperum.\"},{\"verse\":34,\"text\":\"Propter quid irritavit impius Deum ? dixit enim in corde suo : Non requiret.\"},{\"verse\":35,\"text\":\"Vides, quoniam tu laborem et dolorem consideras, ut tradas eos in manus tuas. Tibi derelictus est pauper ; orphano tu eris adjutor.\"},{\"verse\":36,\"text\":\"Contere brachium peccatoris et maligni ; quæretur peccatum illius, et non invenietur.\"},{\"verse\":37,\"text\":\"Dominus regnabit in æternum, et in sæculum sæculi ; peribitis, gentes, de terra illius.\"},{\"verse\":38,\"text\":\"Desiderium pauperum exaudivit Dominus ; præparationem cordis eorum audivit auris tua :\"},{\"verse\":39,\"text\":\"judicare pupillo et humili, ut non apponat ultra magnificare se homo super terram.\"}],\"summary\":\"Confitebor tibi, Domine. The church praiseth God for his protection against her enemies.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":8,\"label\":\"Psalms 8\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":10,\"label\":\"Psalms 10\"}}]]\n"])</script></body></html>
