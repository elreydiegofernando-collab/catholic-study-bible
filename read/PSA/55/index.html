ton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for a people that is removed at a distance form the sanctuary: for David, for an inscription of a title (or pillar) when the Philistines held him in Geth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Have mercy on me, O God, for man hath trodden me under foot; all the day long he hath afflicted me fighting against me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>My enemies have trodden on me all the day long; for they are many that make war against me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>From the height of the day I shall fear: but I will trust in thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In God I will praise my words, in God I have put my trust: I will not fear what flesh can do against me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>All the day long they detested my words: all their thoughts were against me unto evil.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They will dwell and hide themselves: they will watch my heel. As they have waited for my soul,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For nothing shalt thou save them: in thy anger thou shalt break the people in pieces. O God,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I have declared to thee my life: thou hast set my tears in thy sight, As also in thy promise.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Then shall my enemies be turned back. In what day soever I shall call upon thee, behold I know thou art my God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In God will I praise the word, in the Lord will I praise his speech. In God have I hoped, I will not fear what man can do to me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In me, O God, are vows to thee, which I will pay, praises to thee:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Because thou hast delivered my soul from death, my feet from falling: that I may please in the sight of God, in the light of the living.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem, pro populo qui a sanctis longe factus est. David in tituli inscriptionem, cum tenuerunt eum Allophyli in Geth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Miserere mei, Deus, quoniam conculcavit me homo ; tota die impugnans, tribulavit me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Conculcaverunt me inimici mei tota die, quoniam multi bellantes adversum me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ab altitudine diei timebo : ego vero in te sperabo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In Deo laudabo sermones meos ; in Deo speravi : non timebo quid faciat mihi caro.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tota die verba mea execrabantur ; adversum me omnes cogitationes eorum in malum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Inhabitabunt, et abscondent ; ipsi calcaneum meum observabunt. Sicut sustinuerunt animam meam,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>pro nihilo salvos facies illos ; in ira populos confringes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Deus, vitam meam annuntiavi tibi ; posuisti lacrimas meas in conspectu tuo, sicut et in promissione tua :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>tunc convertentur inimici mei retrorsum. In quacumque die invocavero te, ecce cognovi quoniam Deus meus es.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In Deo laudabo verbum ; in Domino laudabo sermonem. In Deo speravi : non timebo quid faciat mihi homo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In me sunt, Deus, vota tua, quæ reddam, laudationes tibi :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>quoniam eripuisti animam meam de morte, et pedes meos de lapsu, ut placeam coram Deo in lumine viventium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/54/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 54</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/56/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 56</span {\"verse\":10,\"text\":\"tunc convertentur inimici mei retrorsum. In quacumque die invocavero te, ecce cognovi quoniam Deus meus es.\"},{\"verse\":11,\"text\":\"In Deo laudabo verbum ; in Domino laudabo sermonem. In Deo speravi : non timebo quid faciat mihi homo.\"},{\"verse\":12,\"text\":\"In me sunt, Deus, vota tua, quæ reddam, laudationes tibi :\"},{\"verse\":13,\"text\":\"quoniam eripuisti animam meam de morte, et pedes meos de lapsu, ut placeam coram Deo in lumine viventium.\"}],\"summary\":\"Miserere mei, Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":54,\"label\":\"Psalms 54\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":56,\"label\":\"Psalms 56\"}}]]\n"])</script></body></html>
