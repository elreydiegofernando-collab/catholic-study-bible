20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">36</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Noli aemulari.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Be not emulous of evildoers; nor envy them that work iniquity.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For they shall shortly wither away as grass, and as the green herbs shall quickly fall.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Trust in the Lord, and do good, and dwell in the land, and thou shalt be fed with its riches.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Delight in the Lord, and he will give thee the requests of thy heart.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Commit thy way to the Lord, and trust in him, and he will do it.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he will bring forth thy justice as the light, and thy judgment as the noonday.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Be subject to the Lord and pray to him. Envy not the man who prospereth in his way; the man who doth unjust things.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cease from anger, and leave rage; have no emulation to do evil.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For evildoers shall be cut off: but they that wait upon the Lord, they shall inherit the land.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For yet a little while, and the wicked shall not be: and thou shalt seek his place, and shalt not find it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the meek shall inherit the land, and shall delight in abundance of peace.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The sinner shall watch the just man: and shall gnash upon him with his teeth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But the Lord shall laugh at him: for he foreseeth that his day shall come.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The wicked have drawn out the sword: they have bent their bow. To cast down the poor and needy, to kill the upright of heart.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Let their sword enter into their own hearts, and let their bow be broken.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Better is a little to the just, than the great riches of the wicked.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the arms of the wicked shall be broken in pieces; but the Lord strengtheneth the just.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Lord knoweth the days of the undefiled; and their inheritance shall be for ever.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They shall not be confounded in the evil time; and in the days of famine they shall be filled:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Because the wicked shall perish. And the enemies of the Lord, presently after they shall be honoured and exalted, shall come to nothing and vanish like smoke.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The sinner shall borrow, and not pay again; but the just sheweth mercy and shall give.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For such as bless him shall inherit the land: but such as curse him shall perish.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>With the Lord shall the steps of a man be directed, and he shall like well his way.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>When he shall fall he shall not be bruised, for the Lord putteth his hand under him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>I have been young and now am old; and I have not seen the just forsaken, nor his seed seeking bread.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He sheweth mercy, and lendeth all the day long; and his seed shall be in blessing.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Decline from evil and do good, and dwell for ever and ever.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For the Lord loveth judgment, and will not forsake his saints: they shall be preserved for ever. The unjust shall be punished, and the seed of the wicked shall perish.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But the just shall inherit the land, and shall dwell therein for evermore.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The mouth of the just shall meditate wisdom: and his tongue shall speak judgment.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The law of his God is in his heart, and his steps shall not be supplanted.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The wicked watcheth the just man, and seeketh to put him to death,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But the Lord will not leave him in his hands; nor condemn him when he shall be judged.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Expect the Lord and keep his way: and he will exalt thee to inherit the land: when the sinners shall perish thou shalt see.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>I have seen the wicked highly exalted, and lifted up like the cedars of Libanus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And I passed by, and lo, he was not: and I sought him and his place was not found.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Keep innocence, and behold justice: for there are remnants for the peaceable man.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But the unjust shall be destroyed together: the remnants of the wicked shall perish.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>But the salvation of the just is from the Lord, and he is their protector in the time of trouble.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And the Lord will help them and deliver them: and he will rescue them from the wicked, and save them because they have hoped in him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus ipsi David. Noli æmulari in malignantibus, neque zelaveris facientes iniquitatem :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>quoniam tamquam fœnum velociter arescent, et quemadmodum olera herbarum cito decident.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Spera in Domino, et fac bonitatem ; et inhabita terram, et pasceris in divitiis ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Delectare in Domino, et dabit tibi petitiones cordis tui.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Revela Domino viam tuam, et spera in eo, et ipse faciet.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et educet quasi lumen justitiam tuam, et judicium tuum tamquam meridiem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Subditus esto Domino, et ora eum. Noli æmulari in eo qui prosperatur in via sua ; in homine faciente injustitias.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Desine ab ira, et derelinque furorem ; noli æmulari ut maligneris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quoniam qui malignantur exterminabuntur ; sustinentes autem Dominum, ipsi hæreditabunt terram.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et adhuc pusillum, et non erit peccator ; et quæres locum ejus, et non invenies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mansueti autem hæreditabunt terram, et delectabuntur in multitudine pacis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Observabit peccator justum, et stridebit super eum dentibus suis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dominus autem irridebit eum, quoniam prospicit quod veniet dies ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Gladium evaginaverunt peccatores ; intenderunt arcum suum : ut dejiciant pauperem et inopem, ut trucident rectos corde.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gladius eorum intret in corda ipsorum, et arcus eorum confringatur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Melius est modicum justo, super divitias peccatorum multas :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>quoniam brachia peccatorum conterentur : confirmat autem justos Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Novit Dominus dies immaculatorum, et hæreditas eorum in æternum erit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non confundentur in tempore malo, et in diebus famis saturabuntur :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quia peccatores peribunt. Inimici vero Domini mox ut honorificati fuerint et exaltati, deficientes quemadmodum fumus deficient.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Mutuabitur peccator, et non solvet ; justus autem miseretur et tribuet :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>quia benedicentes ei hæreditabunt terram ; maledicentes autem ei disperibunt.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Apud Dominum gressus hominis dirigentur, et viam ejus volet.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Cum ceciderit, non collidetur, quia Dominus supponit manum suam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Junior fui, etenim senui ; et non vidi justum derelictum, nec semen ejus quærens panem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tota die miseretur et commodat ; et semen illius in benedictione erit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Declina a malo, et fac bonum, et inhabita in sæculum sæculi :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>quia Dominus amat judicium, et non derelinquet sanctos suos : in æternum conservabuntur. Injusti punientur, et semen impiorum peribit.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Justi autem hæreditabunt terram, et inhabitabunt in sæculum sæculi super eam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Os justi meditabitur sapientiam, et lingua ejus loquetur judicium.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Lex Dei ejus in corde ipsius, et non supplantabuntur gressus ejus.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Considerat peccator justum, et quærit mortificare eum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dominus autem non derelinquet eum in manibus ejus, nec damnabit eum cum judicabitur illi.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Exspecta Dominum, et custodi viam ejus, et exaltabit te ut hæreditate capias terram : cum perierint peccatores, videbis.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Vidi impium superexaltatum, et elevatum sicut cedros Libani :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>et transivi, et ecce non erat ; et quæsivi eum, et non est inventus locus ejus.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Custodi innocentiam, et vide æquitatem, quoniam sunt reliquiæ homini pacifico.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Injusti autem disperibunt simul ; reliquiæ impiorum interibunt.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Salus autem justorum a Domino ; et protector eorum in tempore tribulationis.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et adjuvabit eos Dominus, et liberabit eos ; et eruet eos a peccatoribus, et salvabit eos, quia speraverunt in eo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/35/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 35</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/37/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 37</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->36<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Psalms 35" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/35/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" str \",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":36,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"Be not emulous of evildoers; nor envy them that work iniquity.\"},{\"verse\":2,\"text\":\"For they shall shortly wither away as grass, and as the green herbs shall quickly fall.\"},{\"verse\":3,\"text\":\"Trust in the Lord, and do good, and dwell in the land, and thou shalt be fed with its riches.\"},{\"verse\":4,\"text\":\"Delight in the Lord, and he will give thee the requests of thy heart.\"},{\"verse\":5,\"text\":\"Commit thy way to the Lord, and trust in him, and he will do it.\"},{\"verse\":6,\"text\":\"And he will bring forth thy justice as the light, and thy judgment as the noonday.\"},{\"verse\":7,\"text\":\"Be subject to the Lord and pray to him. Envy not the man who prospereth in his way; the man who doth unjust things.\"},{\"verse\":8,\"text\":\"Cease from anger, and leave rage; have no emulation to do evil.\"},{\"verse\":9,\"text\":\"For evildoers shall be cut off: but they that wait upon the Lord, they shall inherit the land.\"},{\"verse\":10,\"text\":\"For yet a little while, and the wicked shall not be: and thou shalt seek his place, and shalt not find it.\"},{\"verse\":11,\"text\":\"But the meek shall inherit the land, and shall delight in abundance of peace.\"},{\"verse\":12,\"text\":\"The sinner shall watch the just man: and shall gnash upon him with his teeth.\"},{\"verse\":13,\"text\":\"But the Lord shall laugh at him: for he foreseeth that his day shall come.\"},{\"verse\":14,\"text\":\"The wicked have drawn out the sword: they have bent their bow. To cast down the poor and needy, to kill the upright of heart.\"},{\"verse\":15,\"text\":\"Let their sword enter into their own hearts, and let their bow be broken.\"},{\"verse\":16,\"text\":\"Better is a little to the just, than the great riches of the wicked.\"},{\"verse\":17,\"text\":\"For the arms of the wicked shall be broken in pieces; but the Lord strengtheneth the just.\"},{\"verse\":18,\"text\":\"The Lord knoweth the days of the undefiled; and their inheritance shall be for ever.\"},{\"verse\":19,\"text\":\"They shall not be confounded in the evil time; and in the days of famine they shall be filled:\"},{\"verse\":20,\"text\":\"Because the wicked shall perish. And the enemies of the Lord, presently after they shall be honoured and exalted, shall come to nothing and vanish like smoke.\"},{\"verse\":21,\"text\":\"The sinner shall borrow, and not pay again; but the just sheweth mercy and shall give.\"},{\"verse\":22,\"text\":\"For such as bless him shall inherit the land: but such as curse him shall perish.\"},{\"verse\":23,\"text\":\"With the Lord shall the steps of a man be directed, and he shall like well his way.\"},{\"verse\":24,\"text\":\"When he shall fall he shall not be bruised, for the Lord putteth his hand under him.\"},{\"verse\":25,\"text\":\"I have been young and now am old; and I have not seen the just forsaken, nor his seed seeking bread.\"},{\"verse\":26,\"text\":\"He sheweth mercy, and lendeth all the day long; and his seed shall be in blessing.\"},{\"verse\":27,\"text\":\"Decline from evil and do good, and dwell for ever and ever.\"},{\"verse\":28,\"text\":\"For the Lord loveth judgment, and will not forsake his saints: they shall be preserved for ever. The unjust shall be punished, and the seed of the wicked shall perish.\"},{\"verse\":29,\"text\":\"But the just shall inherit the land, and shall dwell therein for evermore.\"},{\"verse\":30,\"text\":\"The mouth of the just shall meditate wisdom: and his tongue shall speak judgment.\"},{\"verse\":31,\"text\":\"The law of his God is in his heart, and his steps shall not be supplanted.\"},{\"verse\":32,\"text\":\"The wicked watcheth the just man, and seeketh to put him to death,\"},{\"verse\":33,\"text\":\"But the Lord will not leave him in his hands; nor condemn him when he shall be judged.\"},{\"verse\":34,\"text\":\"Expect the Lord and keep his way: and he will exalt thee to inherit the land: when the sinners shall perish thou shalt see.\"},{\"verse\":35,\"text\":\"I have seen the wicked highly exalted, and lifted up like the cedars of Libanus.\"},{\"verse\":36,\"text\":\"And I passed by, and lo, he was not: and I sought him and his place was not found.\"},{\"verse\":37,\"text\":\"Keep innocence, and behold justice: for there are remnants for the peaceable man.\"},{\"verse\":38,\"text\":\"But the unjust shall be destroyed together: the remnants of the wicked shall perish.\"},{\"verse\":39,\"text\":\"But the salvation of the just is from the Lord, and he is their protector in the time of trouble.\"},{\"verse\":40,\"text\":\"And the Lord will help them and deliver them: and he will rescue them from the wicked, and save them because they have hoped in him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus ipsi David. Noli æmulari in malignantibus, neque zelaveris facientes iniquitatem :\"},{\"verse\":2,\"text\":\"quoniam tamquam fœnum velociter arescent, et quemadmodum olera herbarum cito decident.\"},{\"verse\":3,\"text\":\"Spera in Domino, et fac bonitatem ; et inhabita terram, et pasceris in divitiis ejus.\"},{\"verse\":4,\"text\":\"Delectare in Domino, et dabit tibi petitiones cordis tui.\"},{\"verse\":5,\"text\":\"Revela Domino viam tuam, et spera in eo, et ipse faciet.\"},{\"verse\":6,\"text\":\"Et educet quasi lumen justitiam tuam, et judicium tuum tamquam meridiem.\"},{\"verse\":7,\"text\":\"Subditus esto Domino, et ora eum. Noli æmulari in eo qui prosperatur in via sua ; in homine faciente injustitias.\"},{\"verse\":8,\"text\":\"Desine ab ira, et derelinque furorem ; noli æmulari ut maligneris.\"},{\"verse\":9,\"text\":\"Quoniam qui malignantur exterminabuntur ; sustinentes autem Dominum, ipsi hæreditabunt terram.\"},{\"verse\":10,\"text\":\"Et adhuc pusillum, et non erit peccator ; et quæres locum ejus, et non invenies.\"},{\"verse\":11,\"text\":\"Mansueti autem hæreditabunt terram, et delectabuntur in multitudine pacis.\"},{\"verse\":12,\"text\":\"Observabit peccator justum, et stridebit super eum dentibus suis.\"},{\"verse\":13,\"text\":\"Dominus autem irridebit eum, quoniam prospicit quod veniet dies ejus.\"},{\"verse\":14,\"text\":\"Gladium evaginaverunt peccatores ; intenderunt arcum suum : ut dejiciant pauperem et inopem, ut trucident rectos corde.\"},{\"verse\":15,\"text\":\"Gladius eorum intret in corda ipsorum, et arcus eorum confringatur.\"},{\"verse\":16,\"text\":\"Melius est modicum justo, super divitias peccatorum multas :\"},{\"verse\":17,\"text\":\"quoniam brachia peccatorum conterentur : confirmat autem justos Dominus.\"},{\"verse\":18,\"text\":\"Novit Dominus dies immaculatorum, et hæreditas eorum in æternum erit.\"},{\"verse\":19,\"text\":\"Non confundentur in tempore malo, et in diebus famis saturabuntur :\"},{\"verse\":20,\"text\":\"quia peccatores peribunt. Inimici vero Domini mox ut honorificati fuerint et exaltati, deficientes quemadmodum fumus deficient.\"},{\"verse\":21,\"text\":\"Mutuabitur peccator, et non solvet ; justus autem miseretur et tribuet :\"},{\"verse\":22,\"text\":\"quia benedicentes ei hæreditabunt terram ; maledicentes autem ei disperibunt.\"},{\"verse\":23,\"text\":\"Apud Dominum gressus hominis dirigentur, et viam ejus volet.\"},{\"verse\":24,\"text\":\"Cum ceciderit, non collidetur, quia Dominus supponit manum suam.\"},{\"verse\":25,\"text\":\"Junior fui, etenim senui ; et non vidi justum derelictum, nec semen ejus quærens panem.\"},{\"verse\":26,\"text\":\"Tota die miseretur et commodat ; et semen illius in benedictione erit.\"},{\"verse\":27,\"text\":\"Declina a malo, et fac bonum, et inhabita in sæculum sæculi :\"},{\"verse\":28,\"text\":\"quia Dominus amat judicium, et non derelinquet sanctos suos : in æternum conservabuntur. Injusti punientur, et semen impiorum peribit.\"},{\"verse\":29,\"text\":\"Justi autem hæreditabunt terram, et inhabitabunt in sæculum sæculi super eam.\"},{\"verse\":30,\"text\":\"Os justi meditabitur sapientiam, et lingua ejus loquetur judicium.\"},{\"verse\":31,\"text\":\"Lex Dei ejus in corde ipsius, et non supplantabuntur gressus ejus.\"},{\"verse\":32,\"text\":\"Considerat peccator justum, et quærit mortificare eum.\"},{\"verse\":33,\"text\":\"Dominus autem non derelinquet eum in manibus ejus, nec damnabit eum cum judicabitur illi.\"},{\"verse\":34,\"text\":\"Exspecta Dominum, et custodi viam ejus, et exaltabit te ut hæreditate capias terram : cum perierint peccatores, videbis.\"},{\"verse\":35,\"text\":\"Vidi impium superexaltatum, et elevatum sicut cedros Libani :\"},{\"verse\":36,\"text\":\"et transivi, et ecce non erat ; et quæsivi eum, et non est inventus locus ejus.\"},{\"verse\":37,\"text\":\"Custodi innocentiam, et vide æquitatem, quoniam sunt reliquiæ homini pacifico.\"},{\"verse\":38,\"text\":\"Injusti autem disperibunt simul ; reliquiæ impiorum interibunt.\"},{\"verse\":39,\"text\":\"Salus autem justorum a Domino ; et protector eorum in tempore tribulationis.\"},{\"verse\":40,\"text\":\"Et adjuvabit eos Dominus, et liberabit eos ; et eruet eos a peccatoribus, et salvabit eos, quia speraverunt in eo.\"}],\"summary\":\"Noli aemulari.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":35,\"label\":\"Psalms 35\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":37,\"label\":\"Psalms 37\"}}]]\n"])</script></body></html>
