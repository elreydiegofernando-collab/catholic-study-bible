tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">104</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Confitemini Domino.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Give glory to the Lord, and call upon his name: declare his deeds among the Gentiles.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sing to him, yea sing praises to him: relate all his wondrous works.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Glory ye in his holy name: let the heart of them rejoice that seek the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Seek ye the lord, and be strengthened: seek his face evermore.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Remember his marvellous works which he hath done; his wonders, and the judgments of his mouth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>O ye seed of Abraham his servant; ye sons of Jacob his chosen.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He is the Lord our God: his judgments are in all the earth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He hath remembered his covenant for ever: the word which he commanded to a thousand generations.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Which he made to Abraham; and his oath to Isaac:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he appointed the same to Jacob for a law, and to Israel for an everlasting testament:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Saying: To thee will I give the land of Chanaan, the lot of your inheritance.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>When they were but a small number: yea very few, and sojourners therein:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they passed from nation to nation, and from one kingdom to another people.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He suffered no man to hurt them: and he reproved kings for their sakes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Touch ye not my anointed: and do no evil to my prophets.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he called a famine upon the land: and he broke in pieces all the support of bread.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He sent a man before them: Joseph, who was sold for a slave.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They humbled his feet in fetters: the iron pierced his soul,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Until his word came. The word of the Lord inflamed him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The king sent, and he released him: the ruler of the people, and he set him at liberty.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He made him master of his house, and ruler of all his possession.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>That he might instruct his princes as himself, and teach his ancients wisdom.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Israel went into Egypt: and Jacob was a sojourner in the land of Cham.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he increased his people exceedingly: and strengthened them over their enemies.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He turned their heart to hate his people: and to deal deceitfully with his servants.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He sent Moses his servant: Aaron the man whom he had chosen.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He gave them power to shew them signs, and his wonders in the land of Cham.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He sent darkness, and made it obscure: and grieved not his words.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He turned their waters into blood, and destroyed their fish.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Their land brought forth frogs, in the inner chambers of their kings.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>He spoke, and there came divers sorts of flies and sciniphs in all their coasts.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>He gave them hail for rain, a burning fire in the land.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he destroyed their vineyards and their fig trees: and he broke in pieces the trees of their coasts.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>He spoke, and the locust came, and the bruchus, of which there was no number.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And they devoured all the grass in their land, and consumed all the fruit of their ground.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he slew all the firstborn in their land: the firstfruits of all their labour.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And he brought them out with silver and gold: and there was not among their tribes one that was feeble.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Egypt was glad when they departed: for the fear of them lay upon them.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>He spread a cloud for their protection, and fire to give them light in the night.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>They asked, and the quail came: and he filled them with the bread of heaven.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>He opened the rock, and waters flowed: rivers ran down in the dry land.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Because he remembered his holy word, which he had spoken to his servant Abraham.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And he brought forth his people with joy, and his chosen with gladness.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he gave them the lands of the Gentiles: and they possessed the labours of the people:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>That they might observe his justifications, and seek after his law.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. Confitemini Domino, et invocate nomen ejus ; annuntiate inter gentes opera ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cantate ei, et psallite ei ; narrate omnia mirabilia ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Laudamini in nomine sancto ejus ; lætetur cor quærentium Dominum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quærite Dominum, et confirmamini ; quærite faciem ejus semper.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Mementote mirabilium ejus quæ fecit ; prodigia ejus, et judicia oris ejus :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>semen Abraham servi ejus ; filii Jacob electi ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ipse Dominus Deus noster ; in universa terra judicia ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Memor fuit in sæculum testamenti sui ; verbi quod mandavit in mille generationes :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>quod disposuit ad Abraham, et juramenti sui ad Isaac :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et statuit illud Jacob in præceptum, et Israël in testamentum æternum,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>dicens : Tibi dabo terram Chanaan, funiculum hæreditatis vestræ :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>cum essent numero brevi, paucissimi, et incolæ ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et pertransierunt de gente in gentem, et de regno ad populum alterum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non reliquit hominem nocere eis : et corripuit pro eis reges.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nolite tangere christos meos, et in prophetis meis nolite malignari.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et vocavit famem super terram, et omne firmamentum panis contrivit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Misit ante eos virum : in servum venumdatus est, Joseph.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Humiliaverunt in compedibus pedes ejus ; ferrum pertransiit animam ejus :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>donec veniret verbum ejus. Eloquium Domini inflammavit eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Misit rex, et solvit eum ; princeps populorum, et dimisit eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Constituit eum dominum domus suæ, et principem omnis possessionis suæ :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>ut erudiret principes ejus sicut semetipsum, et senes ejus prudentiam doceret.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et intravit Israël in Ægyptum, et Jacob accola fuit in terra Cham.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et auxit populum suum vehementer, et firmavit eum super inimicos ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Convertit cor eorum, ut odirent populum ejus, et dolum facerent in servos ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Misit Moysen servum suum ; Aaron quem elegit ipsum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Posuit in eis verba signorum suorum, et prodigiorum in terra Cham.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Misit tenebras, et obscuravit ; et non exacerbavit sermones suos.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Convertit aquas eorum in sanguinem, et occidit pisces eorum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Edidit terra eorum ranas in penetralibus regum ipsorum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Dixit, et venit cœnomyia et ciniphes in omnibus finibus eorum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Posuit pluvias eorum grandinem : ignem comburentem in terra ipsorum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et percussit vineas eorum, et ficulneas eorum, et contrivit lignum finium eorum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Dixit, et venit locusta, et bruchus cujus non erat numerus :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et comedit omne fœnum in terra eorum, et comedit omnem fructum terræ eorum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et percussit omne primogenitum in terra eorum, primitias omnis laboris eorum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et eduxit eos cum argento et auro, et non erat in tribubus eorum infirmus.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Lætata est Ægyptus in profectione eorum, quia incubuit timor eorum super eos.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Expandit nubem in protectionem eorum, et ignem ut luceret eis per noctem.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Petierunt, et venit coturnix, et pane cæli saturavit eos.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Dirupit petram, et fluxerunt aquæ : abierunt in sicco flumina.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Quoniam memor fuit verbi sancti sui, quod habuit ad Abraham puerum suum.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et eduxit populum suum in exsultatione, et electos suos in lætitia.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et dedit illis regiones gentium, et labores populorum possederunt :</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>ut custodiant justificationes ejus, et legem ejus requirant.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/103/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 103</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/105/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 105</span></span><svg viewBox="0 0 24 24" fill="none" stroke="cu which he commanded to a thousand generations.\"},{\"verse\":9,\"text\":\"Which he made to Abraham; and his oath to Isaac:\"},{\"verse\":10,\"text\":\"And he appointed the same to Jacob for a law, and to Israel for an everlasting testament:\"},{\"verse\":11,\"text\":\"Saying: To thee will I give the land of Chanaan, the lot of your inheritance.\"},{\"verse\":12,\"text\":\"When they were but a small number: yea very few, and sojourners therein:\"},{\"verse\":13,\"text\":\"And they passed from nation to nation, and from one kingdom to another people.\"},{\"verse\":14,\"text\":\"He suffered no man to hurt them: and he reproved kings for their sakes.\"},{\"verse\":15,\"text\":\"Touch ye not my anointed: and do no evil to my prophets.\"},{\"verse\":16,\"text\":\"And he called a famine upon the land: and he broke in pieces all the support of bread.\"},{\"verse\":17,\"text\":\"He sent a man before them: Joseph, who was sold for a slave.\"},{\"verse\":18,\"text\":\"They humbled his feet in fetters: the iron pierced his soul,\"},{\"verse\":19,\"text\":\"Until his word came. The word of the Lord inflamed him.\"},{\"verse\":20,\"text\":\"The king sent, and he released him: the ruler of the people, and he set him at liberty.\"},{\"verse\":21,\"text\":\"He made him master of his house, and ruler of all his possession.\"},{\"verse\":22,\"text\":\"That he might instruct his princes as himself, and teach his ancients wisdom.\"},{\"verse\":23,\"text\":\"And Israel went into Egypt: and Jacob was a sojourner in the land of Cham.\"},{\"verse\":24,\"text\":\"And he increased his people exceedingly: and strengthened them over their enemies.\"},{\"verse\":25,\"text\":\"He turned their heart to hate his people: and to deal deceitfully with his servants.\"},{\"verse\":26,\"text\":\"He sent Moses his servant: Aaron the man whom he had chosen.\"},{\"verse\":27,\"text\":\"He gave them power to shew them signs, and his wonders in the land of Cham.\"},{\"verse\":28,\"text\":\"He sent darkness, and made it obscure: and grieved not his words.\"},{\"verse\":29,\"text\":\"He turned their waters into blood, and destroyed their fish.\"},{\"verse\":30,\"text\":\"Their land brought forth frogs, in the inner chambers of their kings.\"},{\"verse\":31,\"text\":\"He spoke, and there came divers sorts of flies and sciniphs in all their coasts.\"},{\"verse\":32,\"text\":\"He gave them hail for rain, a burning fire in the land.\"},{\"verse\":33,\"text\":\"And he destroyed their vineyards and their fig trees: and he broke in pieces the trees of their coasts.\"},{\"verse\":34,\"text\":\"He spoke, and the locust came, and the bruchus, of which there was no number.\"},{\"verse\":35,\"text\":\"And they devoured all the grass in their land, and consumed all the fruit of their ground.\"},{\"verse\":36,\"text\":\"And he slew all the firstborn in their land: the firstfruits of all their labour.\"},{\"verse\":37,\"text\":\"And he brought them out with silver and gold: and there was not among their tribes one that was feeble.\"},{\"verse\":38,\"text\":\"Egypt was glad when they departed: for the fear of them lay upon them.\"},{\"verse\":39,\"text\":\"He spread a cloud for their protection, and fire to give them light in the night.\"},{\"verse\":40,\"text\":\"They asked, and the quail came: and he filled them with the bread of heaven.\"},{\"verse\":41,\"text\":\"He opened the rock, and waters flowed: rivers ran down in the dry land.\"},{\"verse\":42,\"text\":\"Because he remembered his holy word, which he had spoken to his servant Abraham.\"},{\"verse\":43,\"text\":\"And he brought forth his people with joy, and his chosen with gladness.\"},{\"verse\":44,\"text\":\"And he gave them the lands of the Gentiles: and they possessed the labours of the people:\"},{\"verse\":45,\"text\":\"That they might observe his justifications, and seek after his law.\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. Confitemini Domino, et invocate nomen ejus ; annuntiate inter gentes opera ejus.\"},{\"verse\":2,\"text\":\"Cantate ei, et psallite ei ; narrate omnia mirabilia ejus.\"},{\"verse\":3,\"text\":\"Laudamini in nomine sancto ejus ; lætetur cor quærentium Dominum.\"},{\"verse\":4,\"text\":\"Quærite Dominum, et confirmamini ; quærite faciem ejus semper.\"},{\"verse\":5,\"text\":\"Mementote mirabilium ejus quæ fecit ; prodigia ejus, et judicia oris ejus :\"},{\"verse\":6,\"text\":\"semen Abraham servi ejus ; filii Jacob electi ejus.\"},{\"verse\":7,\"text\":\"Ipse Dominus Deus noster ; in universa terra judicia ejus.\"},{\"verse\":8,\"text\":\"Memor fuit in sæculum testamenti sui ; verbi quod mandavit in mille generationes :\"},{\"verse\":9,\"text\":\"quod disposuit ad Abraham, et juramenti sui ad Isaac :\"},{\"verse\":10,\"text\":\"et statuit illud Jacob in præceptum, et Israël in testamentum æternum,\"},{\"verse\":11,\"text\":\"dicens : Tibi dabo terram Chanaan, funiculum hæreditatis vestræ :\"},{\"verse\":12,\"text\":\"cum essent numero brevi, paucissimi, et incolæ ejus.\"},{\"verse\":13,\"text\":\"Et pertransierunt de gente in gentem, et de regno ad populum alterum.\"},{\"verse\":14,\"text\":\"Non reliquit hominem nocere eis : et corripuit pro eis reges.\"},{\"verse\":15,\"text\":\"Nolite tangere christos meos, et in prophetis meis nolite malignari.\"},{\"verse\":16,\"text\":\"Et vocavit famem super terram, et omne firmamentum panis contrivit.\"},{\"verse\":17,\"text\":\"Misit ante eos virum : in servum venumdatus est, Joseph.\"},{\"verse\":18,\"text\":\"Humiliaverunt in compedibus pedes ejus ; ferrum pertransiit animam ejus :\"},{\"verse\":19,\"text\":\"donec veniret verbum ejus. Eloquium Domini inflammavit eum.\"},{\"verse\":20,\"text\":\"Misit rex, et solvit eum ; princeps populorum, et dimisit eum.\"},{\"verse\":21,\"text\":\"Constituit eum dominum domus suæ, et principem omnis possessionis suæ :\"},{\"verse\":22,\"text\":\"ut erudiret principes ejus sicut semetipsum, et senes ejus prudentiam doceret.\"},{\"verse\":23,\"text\":\"Et intravit Israël in Ægyptum, et Jacob accola fuit in terra Cham.\"},{\"verse\":24,\"text\":\"Et auxit populum suum vehementer, et firmavit eum super inimicos ejus.\"},{\"verse\":25,\"text\":\"Convertit cor eorum, ut odirent populum ejus, et dolum facerent in servos ejus.\"},{\"verse\":26,\"text\":\"Misit Moysen servum suum ; Aaron quem elegit ipsum.\"},{\"verse\":27,\"text\":\"Posuit in eis verba signorum suorum, et prodigiorum in terra Cham.\"},{\"verse\":28,\"text\":\"Misit tenebras, et obscuravit ; et non exacerbavit sermones suos.\"},{\"verse\":29,\"text\":\"Convertit aquas eorum in sanguinem, et occidit pisces eorum.\"},{\"verse\":30,\"text\":\"Edidit terra eorum ranas in penetralibus regum ipsorum.\"},{\"verse\":31,\"text\":\"Dixit, et venit cœnomyia et ciniphes in omnibus finibus eorum.\"},{\"verse\":32,\"text\":\"Posuit pluvias eorum grandinem : ignem comburentem in terra ipsorum.\"},{\"verse\":33,\"text\":\"Et percussit vineas eorum, et ficulneas eorum, et contrivit lignum finium eorum.\"},{\"verse\":34,\"text\":\"Dixit, et venit locusta, et bruchus cujus non erat numerus :\"},{\"verse\":35,\"text\":\"et comedit omne fœnum in terra eorum, et comedit omnem fructum terræ eorum.\"},{\"verse\":36,\"text\":\"Et percussit omne primogenitum in terra eorum, primitias omnis laboris eorum.\"},{\"verse\":37,\"text\":\"Et eduxit eos cum argento et auro, et non erat in tribubus eorum infirmus.\"},{\"verse\":38,\"text\":\"Lætata est Ægyptus in profectione eorum, quia incubuit timor eorum super eos.\"},{\"verse\":39,\"text\":\"Expandit nubem in protectionem eorum, et ignem ut luceret eis per noctem.\"},{\"verse\":40,\"text\":\"Petierunt, et venit coturnix, et pane cæli saturavit eos.\"},{\"verse\":41,\"text\":\"Dirupit petram, et fluxerunt aquæ : abierunt in sicco flumina.\"},{\"verse\":42,\"text\":\"Quoniam memor fuit verbi sancti sui, quod habuit ad Abraham puerum suum.\"},{\"verse\":43,\"text\":\"Et eduxit populum suum in exsultatione, et electos suos in lætitia.\"},{\"verse\":44,\"text\":\"Et dedit illis regiones gentium, et labores populorum possederunt :\"},{\"verse\":45,\"text\":\"ut custodiant justificationes ejus, et legem ejus requirant.\"}],\"summary\":\"Confitemini Domino.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":103,\"label\":\"Psalms 103\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":105,\"label\":\"Psalms 105\"}}]]\n"])</script></body></html>
