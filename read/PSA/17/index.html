<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Psalms 17 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">17</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PSA/">About <!-- -->Psalms</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Diligam te, Domine.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, for David, the servant of the Lord, who spoke to the Lord the words of this canticle, in the day that the Lord delivered him from the hand of all his enemies, and from the hand of Saul: and he said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will love thee, O Lord, my strength:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The Lord is my firmament, my refuge, and my deliverer. My God is my helper, and in him will I put my trust. My protector, and the horn of my salvation, and my support.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Praising, I will call upon the Lord: and I shall be saved from my enemies.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The sorrows of death surrounded me: and the torrents of iniquity troubled me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The sorrows of hell encompassed me: and the snares of death prevented me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In my affliction I called upon the Lord, and I cried to my God: And he heard my voice from his holy temple: and my cry before him came into his ears.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The earth shook and trembled: the foundations of the mountains were troubled and were moved, because he was angry with them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>There went up a smoke in his wrath: and a fire flamed from his face: coals were kindled by it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He bowed the heavens, and came down, and darkness was under his feet.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he ascended upon the cherubim, and he flew; he flew upon the wings of the winds.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he made darkness his covert, his pavilion round about him: dark waters in the clouds of the air.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At the brightness that was before him the clouds passed, hail and coals of fire.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the Lord thundered from heaven, and the Highest gave his voice: hail and coals of fire.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he sent forth his arrows, and he scattered them: he multiplied lightnings, and troubled them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then the fountains of waters appeared, and the foundations of the world were discovered: At thy rebuke, O Lord, at the blast of the spirit of thy wrath.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He sent from on high, and took me: and received me out of many waters.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He delivered me from my strongest enemies, and from them that hated me: for they were too strong for me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They prevented me in the day of my affliction: and the Lord became my protector.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he brought me forth into a large place: he saved me, because he was well pleased with me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Lord will reward me according to my justice; and will repay me according to the cleanness of my hands:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Because I have kept the ways of the Lord; and have not done wickedly against my God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For all his judgments are in my sight: and his justices I have not put away from me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And I shall be spotless with him: and shall keep myself from my iniquity.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the Lord will reward me according to my justice: and according to the cleanness of my hands before his eyes.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>With the holy thou wilt be holy; and with the innocent man thou wilt be innocent:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And with the elect thou wilt be elect: and with the perverse thou wilt be perverted.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For thou wilt save the humble people; but wilt bring down the eyes of the proud.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For thou lightest my lamp, O Lord: O my God, enlighten my darkness.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>For by thee I shall be delivered from temptation; and through my God I shall go over a wall.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>As for my God, his way is undefiled: the words of the Lord are fire-tried: he is the protector of all that trust in him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For who is God but the Lord? or who is God but our God?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>God, who hath girt me with strength; and made my way blameless.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Who hath made my feet like the feet of harts: and who setteth me upon high places.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Who teacheth my hands to war: and thou hast made my arms like a brazen bow.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And thou hast given me the protection of thy salvation: and thy right hand hath held me up: And thy discipline hath corrected me unto the end: and thy discipline, the same shall teach me.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Thou hast enlarged my steps under me; and my feet are not weakened.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>I will pursue after my enemies, and overtake them: and I will not turn again till they are consumed.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>I will break them, and they shall not be able to stand: they shall fall under my feet.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And thou hast girded me with strength unto battle; and hast subdued under me them that rose up against me.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And thou hast made my enemies turn their back upon me, and hast destroyed them that hated me.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>They cried, but there was none to save them, to the Lord: but he heard them not.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And I shall beat them as small as the dust before the wind; I shall bring them to nought, like the dirt in the streets.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Thou wilt deliver me from the contradictions of the people; thou wilt make me head of the Gentiles.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>A people which I knew not, hath served me: at the hearing of the ear they have obeyed me.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>The children that are strangers have lied to me, strange children have faded away, and have halted from their paths.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>The Lord liveth, and blessed be my God, and let the God of my salvation be exalted.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>O God, who avengest me, and subduest the people under me, my deliverer from my enraged enemies.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And thou wilt lift me up above them that rise up against me: from the unjust man thou wilt deliver me.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Therefore will I give glory to thee, O Lord, among the nations, and I will sing a psalm to thy name.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Giving great deliverance to his king, and shewing mercy to David, his anointed: and to his seed for ever.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Puero Domini David, qui locutus est Domino verba cantici hujus, in die qua eripuit eum Dominus de manu omnium inimicorum ejus, et de manu Saul, et dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Diligam te, Domine, fortitudo mea.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dominus firmamentum meum, et refugium meum, et liberator meus. Deus meus adjutor meus, et sperabo in eum ; protector meus, et cornu salutis meæ, et susceptor meus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Laudans invocabo Dominum, et ab inimicis meis salvus ero.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Circumdederunt me dolores mortis, et torrentes iniquitatis conturbaverunt me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dolores inferni circumdederunt me ; præoccupaverunt me laquei mortis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In tribulatione mea invocavi Dominum, et ad Deum meum clamavi : et exaudivit de templo sancto suo vocem meam ; et clamor meus in conspectu ejus introivit in aures ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Commota est, et contremuit terra ; fundamenta montium conturbata sunt, et commota sunt : quoniam iratus est eis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ascendit fumus in ira ejus, et ignis a facie ejus exarsit ; carbones succensi sunt ab eo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Inclinavit cælos, et descendit, et caligo sub pedibus ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et ascendit super cherubim, et volavit ; volavit super pennas ventorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et posuit tenebras latibulum suum ; in circuitu ejus tabernaculum ejus, tenebrosa aqua in nubibus aëris.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Præ fulgore in conspectu ejus nubes transierunt ; grando et carbones ignis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et intonuit de cælo Dominus, et Altissimus dedit vocem suam : grando et carbones ignis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et misit sagittas suas, et dissipavit eos ; fulgura multiplicavit, et conturbavit eos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et apparuerunt fontes aquarum, et revelata sunt fundamenta orbis terrarum, ab increpatione tua, Domine, ab inspiratione spiritus iræ tuæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Misit de summo, et accepit me ; et assumpsit me de aquis multis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Eripuit me de inimicis meis fortissimis, et ab his qui oderunt me. Quoniam confortati sunt super me ;</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>prævenerunt me in die afflictionis meæ : et factus est Dominus protector meus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et eduxit me in latitudinem ; salvum me fecit, quoniam voluit me,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et retribuet mihi Dominus secundum justitiam meam, et secundum puritatem manuum mearum retribuet mihi :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>quia custodivi vias Domini, nec impie gessi a Deo meo ;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quoniam omnia judicia ejus in conspectu meo, et justitias ejus non repuli a me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et ero immaculatus cum eo ; et observabo me ab iniquitate mea.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et retribuet mihi Dominus secundum justitiam meam, et secundum puritatem manuum mearum in conspectu oculorum ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cum sancto sanctus eris, et cum viro innocente innocens eris,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et cum electo electus eris, et cum perverso perverteris.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quoniam tu populum humilem salvum facies, et oculos superborum humiliabis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quoniam tu illuminas lucernam meam, Domine ; Deus meus, illumina tenebras meas.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quoniam in te eripiar a tentatione ; et in Deo meo transgrediar murum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Deus meus, impolluta via ejus ; eloquia Domini igne examinata : protector est omnium sperantium in se.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quoniam quis deus præter Dominum ? aut quis deus præter Deum nostrum ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Deus qui præcinxit me virtute, et posuit immaculatam viam meam ;</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>qui perfecit pedes meos tamquam cervorum, et super excelsa statuens me ;</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>qui docet manus meas ad prælium. Et posuisti, ut arcum æreum, brachia mea,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>et dedisti mihi protectionem salutis tuæ : et dextera tua suscepit me, et disciplina tua correxit me in finem, et disciplina tua ipsa me docebit.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Dilatasti gressus meos subtus me, et non sunt infirmata vestigia mea.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Persequar inimicos meos, et comprehendam illos ; et non convertar donec deficiant.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Confringam illos, nec poterunt stare ; cadent subtus pedes meos.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et præcinxisti me virtute ad bellum, et supplantasti insurgentes in me subtus me.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et inimicos meos dedisti mihi dorsum, et odientes me disperdidisti.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Clamaverunt, nec erat qui salvos faceret ; ad Dominum, nec exaudivit eos.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et comminuam eos ut pulverem ante faciem venti ; ut lutum platearum delebo eos.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Eripies me de contradictionibus populi ; constitues me in caput gentium.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Populus quem non cognovi servivit mihi ; in auditu auris obedivit mihi.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Filii alieni mentiti sunt mihi, filii alieni inveterati sunt, et claudicaverunt a semitis suis.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Vivit Dominus, et benedictus Deus meus, et exaltetur Deus salutis meæ.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Deus qui das vindictas mihi, et subdis populos sub me ; liberator meus de inimicis meis iracundis.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Et ab insurgentibus in me exaltabis me ; a viro iniquo eripies me.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Propterea confitebor tibi in nationibus, Domine, et nomini tuo psalmum dicam ;</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>magnificans salutes regis ejus, et faciens misericordiam christo suo David, et semini ejus usque in sæculum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 18</span></span><svg viewBox="0 0 sed me: and the snares of death prevented me.\"},{\"verse\":7,\"text\":\"In my affliction I called upon the Lord, and I cried to my God: And he heard my voice from his holy temple: and my cry before him came into his ears.\"},{\"verse\":8,\"text\":\"The earth shook and trembled: the foundations of the mountains were troubled and were moved, because he was angry with them.\"},{\"verse\":9,\"text\":\"There went up a smoke in his wrath: and a fire flamed from his face: coals were kindled by it.\"},{\"verse\":10,\"text\":\"He bowed the heavens, and came down, and darkness was under his feet.\"},{\"verse\":11,\"text\":\"And he ascended upon the cherubim, and he flew; he flew upon the wings of the winds.\"},{\"verse\":12,\"text\":\"And he made darkness his covert, his pavilion round about him: dark waters in the clouds of the air.\"},{\"verse\":13,\"text\":\"At the brightness that was before him the clouds passed, hail and coals of fire.\"},{\"verse\":14,\"text\":\"And the Lord thundered from heaven, and the Highest gave his voice: hail and coals of fire.\"},{\"verse\":15,\"text\":\"And he sent forth his arrows, and he scattered them: he multiplied lightnings, and troubled them.\"},{\"verse\":16,\"text\":\"Then the fountains of waters appeared, and the foundations of the world were discovered: At thy rebuke, O Lord, at the blast of the spirit of thy wrath.\"},{\"verse\":17,\"text\":\"He sent from on high, and took me: and received me out of many waters.\"},{\"verse\":18,\"text\":\"He delivered me from my strongest enemies, and from them that hated me: for they were too strong for me.\"},{\"verse\":19,\"text\":\"They prevented me in the day of my affliction: and the Lord became my protector.\"},{\"verse\":20,\"text\":\"And he brought me forth into a large place: he saved me, because he was well pleased with me.\"},{\"verse\":21,\"text\":\"And the Lord will reward me according to my justice; and will repay me according to the cleanness of my hands:\"},{\"verse\":22,\"text\":\"Because I have kept the ways of the Lord; and have not done wickedly against my God.\"},{\"verse\":23,\"text\":\"For all his judgments are in my sight: and his justices I have not put away from me.\"},{\"verse\":24,\"text\":\"And I shall be spotless with him: and shall keep myself from my iniquity.\"},{\"verse\":25,\"text\":\"And the Lord will reward me according to my justice: and according to the cleanness of my hands before his eyes.\"},{\"verse\":26,\"text\":\"With the holy thou wilt be holy; and with the innocent man thou wilt be innocent:\"},{\"verse\":27,\"text\":\"And with the elect thou wilt be elect: and with the perverse thou wilt be perverted.\"},{\"verse\":28,\"text\":\"For thou wilt save the humble people; but wilt bring down the eyes of the proud.\"},{\"verse\":29,\"text\":\"For thou lightest my lamp, O Lord: O my God, enlighten my darkness.\"},{\"verse\":30,\"text\":\"For by thee I shall be delivered from temptation; and through my God I shall go over a wall.\"},{\"verse\":31,\"text\":\"As for my God, his way is undefiled: the words of the Lord are fire-tried: he is the protector of all that trust in him.\"},{\"verse\":32,\"text\":\"For who is God but the Lord? or who is God but our God?\"},{\"verse\":33,\"text\":\"God, who hath girt me with strength; and made my way blameless.\"},{\"verse\":34,\"text\":\"Who hath made my feet like the feet of harts: and who setteth me upon high places.\"},{\"verse\":35,\"text\":\"Who teacheth my hands to war: and thou hast made my arms like a brazen bow.\"},{\"verse\":36,\"text\":\"And thou hast given me the protection of thy salvation: and thy right hand hath held me up: And thy discipline hath corrected me unto the end: and thy discipline, the same shall teach me.\"},{\"verse\":37,\"text\":\"Thou hast enlarged my steps under me; and my feet are not weakened.\"},{\"verse\":38,\"text\":\"I will pursue after my enemies, and overtake them: and I will not turn again till they are consumed.\"},{\"verse\":39,\"text\":\"I will break them, and they shall not be able to stand: they shall fall under my feet.\"},{\"verse\":40,\"text\":\"And thou hast girded me with strength unto battle; and hast subdued under me them that rose up against me.\"},{\"verse\":41,\"text\":\"And thou hast made my enemies turn their back upon me, and hast destroyed them that hated me.\"},{\"verse\":42,\"text\":\"They cried, but there was none to save them, to the Lord: but he heard them not.\"},{\"verse\":43,\"text\":\"And I shall beat them as small as the dust before the wind; I shall bring them to nought, like the dirt in the streets.\"},{\"verse\":44,\"text\":\"Thou wilt deliver me from the contradictions of the people; thou wilt make me head of the Gentiles.\"},{\"verse\":45,\"text\":\"A people which I knew not, hath served me: at the hearing of the ear they have obeyed me.\"},{\"verse\":46,\"text\":\"The children that are strangers have lied to me, strange children have faded away, and have halted from their paths.\"},{\"verse\":47,\"text\":\"The Lord liveth, and blessed be my God, and let the God of my salvation be exalted.\"},{\"verse\":48,\"text\":\"O God, who avengest me, and subduest the people under me, my deliverer from my enraged enemies.\"},{\"verse\":49,\"text\":\"And thou wilt lift me up above them that rise up against me: from the unjust man thou wilt deliver me.\"},{\"verse\":50,\"text\":\"Therefore will I give glory to thee, O Lord, among the nations, and I will sing a psalm to thy name.\"},{\"verse\":51,\"text\":\"Giving great deliverance to his king, and shewing mercy to David, his anointed: and to his seed for ever.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Puero Domini David, qui locutus est Domino verba cantici hujus, in die qua eripuit eum Dominus de manu omnium inimicorum ejus, et de manu Saul, et dixit :\"},{\"verse\":2,\"text\":\"Diligam te, Domine, fortitudo mea.\"},{\"verse\":3,\"text\":\"Dominus firmamentum meum, et refugium meum, et liberator meus. Deus meus adjutor meus, et sperabo in eum ; protector meus, et cornu salutis meæ, et susceptor meus.\"},{\"verse\":4,\"text\":\"Laudans invocabo Dominum, et ab inimicis meis salvus ero.\"},{\"verse\":5,\"text\":\"Circumdederunt me dolores mortis, et torrentes iniquitatis conturbaverunt me.\"},{\"verse\":6,\"text\":\"Dolores inferni circumdederunt me ; præoccupaverunt me laquei mortis.\"},{\"verse\":7,\"text\":\"In tribulatione mea invocavi Dominum, et ad Deum meum clamavi : et exaudivit de templo sancto suo vocem meam ; et clamor meus in conspectu ejus introivit in aures ejus.\"},{\"verse\":8,\"text\":\"Commota est, et contremuit terra ; fundamenta montium conturbata sunt, et commota sunt : quoniam iratus est eis.\"},{\"verse\":9,\"text\":\"Ascendit fumus in ira ejus, et ignis a facie ejus exarsit ; carbones succensi sunt ab eo.\"},{\"verse\":10,\"text\":\"Inclinavit cælos, et descendit, et caligo sub pedibus ejus.\"},{\"verse\":11,\"text\":\"Et ascendit super cherubim, et volavit ; volavit super pennas ventorum.\"},{\"verse\":12,\"text\":\"Et posuit tenebras latibulum suum ; in circuitu ejus tabernaculum ejus, tenebrosa aqua in nubibus aëris.\"},{\"verse\":13,\"text\":\"Præ fulgore in conspectu ejus nubes transierunt ; grando et carbones ignis.\"},{\"verse\":14,\"text\":\"Et intonuit de cælo Dominus, et Altissimus dedit vocem suam : grando et carbones ignis.\"},{\"verse\":15,\"text\":\"Et misit sagittas suas, et dissipavit eos ; fulgura multiplicavit, et conturbavit eos.\"},{\"verse\":16,\"text\":\"Et apparuerunt fontes aquarum, et revelata sunt fundamenta orbis terrarum, ab increpatione tua, Domine, ab inspiratione spiritus iræ tuæ.\"},{\"verse\":17,\"text\":\"Misit de summo, et accepit me ; et assumpsit me de aquis multis.\"},{\"verse\":18,\"text\":\"Eripuit me de inimicis meis fortissimis, et ab his qui oderunt me. Quoniam confortati sunt super me ;\"},{\"verse\":19,\"text\":\"prævenerunt me in die afflictionis meæ : et factus est Dominus protector meus.\"},{\"verse\":20,\"text\":\"Et eduxit me in latitudinem ; salvum me fecit, quoniam voluit me,\"},{\"verse\":21,\"text\":\"et retribuet mihi Dominus secundum justitiam meam, et secundum puritatem manuum mearum retribuet mihi :\"},{\"verse\":22,\"text\":\"quia custodivi vias Domini, nec impie gessi a Deo meo ;\"},{\"verse\":23,\"text\":\"quoniam omnia judicia ejus in conspectu meo, et justitias ejus non repuli a me.\"},{\"verse\":24,\"text\":\"Et ero immaculatus cum eo ; et observabo me ab iniquitate mea.\"},{\"verse\":25,\"text\":\"Et retribuet mihi Dominus secundum justitiam meam, et secundum puritatem manuum mearum in conspectu oculorum ejus.\"},{\"verse\":26,\"text\":\"Cum sancto sanctus eris, et cum viro innocente innocens eris,\"},{\"verse\":27,\"text\":\"et cum electo electus eris, et cum perverso perverteris.\"},{\"verse\":28,\"text\":\"Quoniam tu populum humilem salvum facies, et oculos superborum humiliabis.\"},{\"verse\":29,\"text\":\"Quoniam tu illuminas lucernam meam, Domine ; Deus meus, illumina tenebras meas.\"},{\"verse\":30,\"text\":\"Quoniam in te eripiar a tentatione ; et in Deo meo transgrediar murum.\"},{\"verse\":31,\"text\":\"Deus meus, impolluta via ejus ; eloquia Domini igne examinata : protector est omnium sperantium in se.\"},{\"verse\":32,\"text\":\"Quoniam quis deus præter Dominum ? aut quis deus præter Deum nostrum ?\"},{\"verse\":33,\"text\":\"Deus qui præcinxit me virtute, et posuit immaculatam viam meam ;\"},{\"verse\":34,\"text\":\"qui perfecit pedes meos tamquam cervorum, et super excelsa statuens me ;\"},{\"verse\":35,\"text\":\"qui docet manus meas ad prælium. Et posuisti, ut arcum æreum, brachia mea,\"},{\"verse\":36,\"text\":\"et dedisti mihi protectionem salutis tuæ : et dextera tua suscepit me, et disciplina tua correxit me in finem, et disciplina tua ipsa me docebit.\"},{\"verse\":37,\"text\":\"Dilatasti gressus meos subtus me, et non sunt infirmata vestigia mea.\"},{\"verse\":38,\"text\":\"Persequar inimicos meos, et comprehendam illos ; et non convertar donec deficiant.\"},{\"verse\":39,\"text\":\"Confringam illos, nec poterunt stare ; cadent subtus pedes meos.\"},{\"verse\":40,\"text\":\"Et præcinxisti me virtute ad bellum, et supplantasti insurgentes in me subtus me.\"},{\"verse\":41,\"text\":\"Et inimicos meos dedisti mihi dorsum, et odientes me disperdidisti.\"},{\"verse\":42,\"text\":\"Clamaverunt, nec erat qui salvos faceret ; ad Dominum, nec exaudivit eos.\"},{\"verse\":43,\"text\":\"Et comminuam eos ut pulverem ante faciem venti ; ut lutum platearum delebo eos.\"},{\"verse\":44,\"text\":\"Eripies me de contradictionibus populi ; constitues me in caput gentium.\"},{\"verse\":45,\"text\":\"Populus quem non cognovi servivit mihi ; in auditu auris obedivit mihi.\"},{\"verse\":46,\"text\":\"Filii alieni mentiti sunt mihi, filii alieni inveterati sunt, et claudicaverunt a semitis suis.\"},{\"verse\":47,\"text\":\"Vivit Dominus, et benedictus Deus meus, et exaltetur Deus salutis meæ.\"},{\"verse\":48,\"text\":\"Deus qui das vindictas mihi, et subdis populos sub me ; liberator meus de inimicis meis iracundis.\"},{\"verse\":49,\"text\":\"Et ab insurgentibus in me exaltabis me ; a viro iniquo eripies me.\"},{\"verse\":50,\"text\":\"Propterea confitebor tibi in nationibus, Domine, et nomini tuo psalmum dicam ;\"},{\"verse\":51,\"text\":\"magnificans salutes regis ejus, et faciens misericordiam christo suo David, et semini ejus usque in sæculum.\"}],\"summary\":\"Diligam te, Domine.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":16,\"label\":\"Psalms 16\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":18,\"label\":\"Psalms 18\"}}]]\n"])</script></body></html>
