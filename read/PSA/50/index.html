 aria-pressed="false" class="verse"><sup>3</sup>Have mercy on me, O God, according to thy great mercy. And according to the multitude of thy tender mercies blot out my iniquity.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Wash me yet more from my iniquity, and cleanse me from my sin.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For I know my iniquity, and my sin is always before me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>To thee only have I sinned, and have done evil before thee: that thou mayst be justified in thy words, and mayst overcome when thou art judged.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For behold I was conceived in iniquities; and in sins did my mother conceive me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For behold thou hast loved truth: the uncertain and hidden things of thy wisdom thou hast made manifest to me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou shalt sprinkle me with hyssop, and I shall be cleansed: thou shalt wash me, and I shall be made whiter than snow.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>To my hearing thou shalt give joy and gladness: and the bones that have been humbled shall rejoice.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Turn away thy face from my sins, and blot out all my iniquities.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Create a clean heart in me, O God: and renew a right spirit within my bowels.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cast me not away from thy face; and take not thy holy spirit from me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Restore unto me the joy of thy salvation, and strengthen me with a perfect spirit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I will teach the unjust thy ways: and the wicked shall be converted to thee.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Deliver me from blood, O God, thou God of my salvation: and my tongue shall extol thy justice.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>O Lord, thou wilt open my lips: and my mouth shall declare thy praise.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For if thou hadst desired sacrifice, I would indeed have given it: with burnt offerings thou wilt not be delighted.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A sacrifice to God is an afflicted spirit: a contrite and humbled heart, O God, thou wilt not despise.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Deal favourably, O Lord, in thy good will with Sion; that the walls of Jerusalem may be built up.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then shalt thou accept the sacrifice of justice, oblations and whole burnt offerings: then shall they lay calves upon thy altar.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus David,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>cum venit ad eum Nathan propheta, quando intravit ad Bethsabee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Miserere mei, Deus, secundum magnam misericordiam tuam ; et secundum multitudinem miserationum tuarum, dele iniquitatem meam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Amplius lava me ab iniquitate mea, et a peccato meo munda me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam iniquitatem meam ego cognosco, et peccatum meum contra me est semper.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tibi soli peccavi, et malum coram te feci ; ut justificeris in sermonibus tuis, et vincas cum judicaris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ecce enim in iniquitatibus conceptus sum, et in peccatis concepit me mater mea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ecce enim veritatem dilexisti ; incerta et occulta sapientiæ tuæ manifestasti mihi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Asperges me hyssopo, et mundabor ; lavabis me, et super nivem dealbabor.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Auditui meo dabis gaudium et lætitiam, et exsultabunt ossa humiliata.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cor mundum crea in me, Deus, et spiritum rectum innova in visceribus meis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ne projicias me a facie tua, et spiritum sanctum tuum ne auferas a me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Redde mihi lætitiam salutaris tui, et spiritu principali confirma me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Docebo iniquos vias tuas, et impii ad te convertentur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Libera me de sanguinibus, Deus, Deus salutis meæ, et exsultabit lingua mea justitiam tuam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Domine, labia mea aperies, et os meum annuntiabit laudem tuam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quoniam si voluisses sacrificium, dedissem utique ; holocaustis non delectaberis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sacrificium Deo spiritus contribulatus ; cor contritum et humiliatum, Deus, non despicies.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Benigne fac, Domine, in bona voluntate tua Sion, ut ædificentur muri Jerusalem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tunc acceptabis sacrificium justitiæ, oblationes et holocausta ; tunc imponent super altare tuum vitulos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/49/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 49</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100 ins did my mother conceive me.\"},{\"verse\":8,\"text\":\"For behold thou hast loved truth: the uncertain and hidden things of thy wisdom thou hast made manifest to me.\"},{\"verse\":9,\"text\":\"Thou shalt sprinkle me with hyssop, and I shall be cleansed: thou shalt wash me, and I shall be made whiter than snow.\"},{\"verse\":10,\"text\":\"To my hearing thou shalt give joy and gladness: and the bones that have been humbled shall rejoice.\"},{\"verse\":11,\"text\":\"Turn away thy face from my sins, and blot out all my iniquities.\"},{\"verse\":12,\"text\":\"Create a clean heart in me, O God: and renew a right spirit within my bowels.\"},{\"verse\":13,\"text\":\"Cast me not away from thy face; and take not thy holy spirit from me.\"},{\"verse\":14,\"text\":\"Restore unto me the joy of thy salvation, and strengthen me with a perfect spirit.\"},{\"verse\":15,\"text\":\"I will teach the unjust thy ways: and the wicked shall be converted to thee.\"},{\"verse\":16,\"text\":\"Deliver me from blood, O God, thou God of my salvation: and my tongue shall extol thy justice.\"},{\"verse\":17,\"text\":\"O Lord, thou wilt open my lips: and my mouth shall declare thy praise.\"},{\"verse\":18,\"text\":\"For if thou hadst desired sacrifice, I would indeed have given it: with burnt offerings thou wilt not be delighted.\"},{\"verse\":19,\"text\":\"A sacrifice to God is an afflicted spirit: a contrite and humbled heart, O God, thou wilt not despise.\"},{\"verse\":20,\"text\":\"Deal favourably, O Lord, in thy good will with Sion; that the walls of Jerusalem may be built up.\"},{\"verse\":21,\"text\":\"Then shalt thou accept the sacrifice of justice, oblations and whole burnt offerings: then shall they lay calves upon thy altar.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus David,\"},{\"verse\":2,\"text\":\"cum venit ad eum Nathan propheta, quando intravit ad Bethsabee.\"},{\"verse\":3,\"text\":\"Miserere mei, Deus, secundum magnam misericordiam tuam ; et secundum multitudinem miserationum tuarum, dele iniquitatem meam.\"},{\"verse\":4,\"text\":\"Amplius lava me ab iniquitate mea, et a peccato meo munda me.\"},{\"verse\":5,\"text\":\"Quoniam iniquitatem meam ego cognosco, et peccatum meum contra me est semper.\"},{\"verse\":6,\"text\":\"Tibi soli peccavi, et malum coram te feci ; ut justificeris in sermonibus tuis, et vincas cum judicaris.\"},{\"verse\":7,\"text\":\"Ecce enim in iniquitatibus conceptus sum, et in peccatis concepit me mater mea.\"},{\"verse\":8,\"text\":\"Ecce enim veritatem dilexisti ; incerta et occulta sapientiæ tuæ manifestasti mihi.\"},{\"verse\":9,\"text\":\"Asperges me hyssopo, et mundabor ; lavabis me, et super nivem dealbabor.\"},{\"verse\":10,\"text\":\"Auditui meo dabis gaudium et lætitiam, et exsultabunt ossa humiliata.\"},{\"verse\":11,\"text\":\"Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele.\"},{\"verse\":12,\"text\":\"Cor mundum crea in me, Deus, et spiritum rectum innova in visceribus meis.\"},{\"verse\":13,\"text\":\"Ne projicias me a facie tua, et spiritum sanctum tuum ne auferas a me.\"},{\"verse\":14,\"text\":\"Redde mihi lætitiam salutaris tui, et spiritu principali confirma me.\"},{\"verse\":15,\"text\":\"Docebo iniquos vias tuas, et impii ad te convertentur.\"},{\"verse\":16,\"text\":\"Libera me de sanguinibus, Deus, Deus salutis meæ, et exsultabit lingua mea justitiam tuam.\"},{\"verse\":17,\"text\":\"Domine, labia mea aperies, et os meum annuntiabit laudem tuam.\"},{\"verse\":18,\"text\":\"Quoniam si voluisses sacrificium, dedissem utique ; holocaustis non delectaberis.\"},{\"verse\":19,\"text\":\"Sacrificium Deo spiritus contribulatus ; cor contritum et humiliatum, Deus, non despicies.\"},{\"verse\":20,\"text\":\"Benigne fac, Domine, in bona voluntate tua Sion, ut ædificentur muri Jerusalem.\"},{\"verse\":21,\"text\":\"Tunc acceptabis sacrificium justitiæ, oblationes et holocausta ; tunc imponent super altare tuum vitulos.\"}],\"summary\":\"Miserere.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":49,\"label\":\"Psalms 49\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":51,\"label\":\"Psalms 51\"}}]]\n"])</script></body></html>
