utton" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A canticle of a psalm for the sons of Core: unto the end, for Maheleth, to answer understanding of Eman the Ezrahite.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>O Lord, the God of my salvation: I have cried in the day, and in the night before thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let my prayer come in before thee: incline thy ear to my petition.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For my soul is filled with evils: and my life hath drawn nigh to hell.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I am counted among them that go down to the pit: I am become as a man without help,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Free among the dead. Like the slain sleeping in the sepulchres, whom thou rememberest no more: and they are cut off from thy hand.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They have laid me in the lower pit: in the dark places, and in the shadow of death.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thy wrath is strong over me: and all thy waves thou hast brought in upon me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou hast put away my acquaintance far from me: they have set me an abomination to themselves. I was delivered up, and came not forth:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>My eyes languished through poverty. All the day I cried to thee, O Lord: I stretched out my hands to thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Wilt thou shew wonders to the dead? or shall physicians raise to life, and give praise to thee?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Shall any one in the sepulchre declare thy mercy: and thy truth in destruction?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Shall thy wonders be known in the dark; and thy justice in the land of forgetfulness?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I, O Lord, have cried to thee: and in the morning my prayer shall prevent thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Lord, why castest thou off my prayer: why turnest thou away thy face from me?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I am poor, and in labours from my youth: and being exalted have been humbled and troubled.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thy wrath hath come upon me: and thy terrors have troubled me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They have come round about me like water all the day: they have compassed me about together.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Friend and neighbour thou hast put far from me: and my acquaintance, because of misery.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Canticum Psalmi, filiis Core, in finem, pro Maheleth ad respondendum. Intellectus Eman Ezrahitæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine, Deus salutis meæ, in die clamavi et nocte coram te.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Intret in conspectu tuo oratio mea, inclina aurem tuam ad precem meam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia repleta est malis anima mea, et vita mea inferno appropinquavit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Æstimatus sum cum descendentibus in lacum, factus sum sicut homo sine adjutorio,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>inter mortuos liber ; sicut vulnerati dormientes in sepulchris, quorum non es memor amplius, et ipsi de manu tua repulsi sunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Posuerunt me in lacu inferiori, in tenebrosis, et in umbra mortis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Super me confirmatus est furor tuus, et omnes fluctus tuos induxisti super me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Longe fecisti notos meos a me ; posuerunt me abominationem sibi. Traditus sum, et non egrediebar ;</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>oculi mei languerunt præ inopia. Clamavi ad te, Domine, tota die ; expandi ad te manus meas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Numquid mortuis facies mirabilia ? aut medici suscitabunt, et confitebuntur tibi ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Numquid narrabit aliquis in sepulchro misericordiam tuam, et veritatem tuam in perditione ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Numquid cognoscentur in tenebris mirabilia tua ? et justitia tua in terra oblivionis ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ego ad te, Domine, clamavi, et mane oratio mea præveniet te.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ut quid, Domine, repellis orationem meam ; avertis faciem tuam a me ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Pauper sum ego, et in laboribus a juventute mea ; exaltatus autem, humiliatus sum et conturbatus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In me transierunt iræ tuæ, et terrores tui conturbaverunt me :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>circumdederunt me sicut aqua tota die ; circumdederunt me simul.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Elongasti a me amicum et proximum, et notos meos a miseria.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/86/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 86</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/88/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 88</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="r me\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PSA.87\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":87,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"A canticle of a psalm for the sons of Core: unto the end, for Maheleth, to answer understanding of Eman the Ezrahite.\"},{\"verse\":2,\"text\":\"O Lord, the God of my salvation: I have cried in the day, and in the night before thee.\"},{\"verse\":3,\"text\":\"Let my prayer come in before thee: incline thy ear to my petition.\"},{\"verse\":4,\"text\":\"For my soul is filled with evils: and my life hath drawn nigh to hell.\"},{\"verse\":5,\"text\":\"I am counted among them that go down to the pit: I am become as a man without help,\"},{\"verse\":6,\"text\":\"Free among the dead. Like the slain sleeping in the sepulchres, whom thou rememberest no more: and they are cut off from thy hand.\"},{\"verse\":7,\"text\":\"They have laid me in the lower pit: in the dark places, and in the shadow of death.\"},{\"verse\":8,\"text\":\"Thy wrath is strong over me: and all thy waves thou hast brought in upon me.\"},{\"verse\":9,\"text\":\"Thou hast put away my acquaintance far from me: they have set me an abomination to themselves. I was delivered up, and came not forth:\"},{\"verse\":10,\"text\":\"My eyes languished through poverty. All the day I cried to thee, O Lord: I stretched out my hands to thee.\"},{\"verse\":11,\"text\":\"Wilt thou shew wonders to the dead? or shall physicians raise to life, and give praise to thee?\"},{\"verse\":12,\"text\":\"Shall any one in the sepulchre declare thy mercy: and thy truth in destruction?\"},{\"verse\":13,\"text\":\"Shall thy wonders be known in the dark; and thy justice in the land of forgetfulness?\"},{\"verse\":14,\"text\":\"But I, O Lord, have cried to thee: and in the morning my prayer shall prevent thee.\"},{\"verse\":15,\"text\":\"Lord, why castest thou off my prayer: why turnest thou away thy face from me?\"},{\"verse\":16,\"text\":\"I am poor, and in labours from my youth: and being exalted have been humbled and troubled.\"},{\"verse\":17,\"text\":\"Thy wrath hath come upon me: and thy terrors have troubled me.\"},{\"verse\":18,\"text\":\"They have come round about me like water all the day: they have compassed me about together.\"},{\"verse\":19,\"text\":\"Friend and neighbour thou hast put far from me: and my acquaintance, because of misery.\"}],\"vul\":[{\"verse\":1,\"text\":\"Canticum Psalmi, filiis Core, in finem, pro Maheleth ad respondendum. Intellectus Eman Ezrahitæ.\"},{\"verse\":2,\"text\":\"Domine, Deus salutis meæ, in die clamavi et nocte coram te.\"},{\"verse\":3,\"text\":\"Intret in conspectu tuo oratio mea, inclina aurem tuam ad precem meam.\"},{\"verse\":4,\"text\":\"Quia repleta est malis anima mea, et vita mea inferno appropinquavit.\"},{\"verse\":5,\"text\":\"Æstimatus sum cum descendentibus in lacum, factus sum sicut homo sine adjutorio,\"},{\"verse\":6,\"text\":\"inter mortuos liber ; sicut vulnerati dormientes in sepulchris, quorum non es memor amplius, et ipsi de manu tua repulsi sunt.\"},{\"verse\":7,\"text\":\"Posuerunt me in lacu inferiori, in tenebrosis, et in umbra mortis.\"},{\"verse\":8,\"text\":\"Super me confirmatus est furor tuus, et omnes fluctus tuos induxisti super me.\"},{\"verse\":9,\"text\":\"Longe fecisti notos meos a me ; posuerunt me abominationem sibi. Traditus sum, et non egrediebar ;\"},{\"verse\":10,\"text\":\"oculi mei languerunt præ inopia. Clamavi ad te, Domine, tota die ; expandi ad te manus meas.\"},{\"verse\":11,\"text\":\"Numquid mortuis facies mirabilia ? aut medici suscitabunt, et confitebuntur tibi ?\"},{\"verse\":12,\"text\":\"Numquid narrabit aliquis in sepulchro misericordiam tuam, et veritatem tuam in perditione ?\"},{\"verse\":13,\"text\":\"Numquid cognoscentur in tenebris mirabilia tua ? et justitia tua in terra oblivionis ?\"},{\"verse\":14,\"text\":\"Et ego ad te, Domine, clamavi, et mane oratio mea præveniet te.\"},{\"verse\":15,\"text\":\"Ut quid, Domine, repellis orationem meam ; avertis faciem tuam a me ?\"},{\"verse\":16,\"text\":\"Pauper sum ego, et in laboribus a juventute mea ; exaltatus autem, humiliatus sum et conturbatus.\"},{\"verse\":17,\"text\":\"In me transierunt iræ tuæ, et terrores tui conturbaverunt me :\"},{\"verse\":18,\"text\":\"circumdederunt me sicut aqua tota die ; circumdederunt me simul.\"},{\"verse\":19,\"text\":\"Elongasti a me amicum et proximum, et notos meos a miseria.\"}],\"summary\":\"Domine, Deus salutis.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":86,\"label\":\"Psalms 86\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":88,\"label\":\"Psalms 88\"}}]]\n"])</script></body></html>
