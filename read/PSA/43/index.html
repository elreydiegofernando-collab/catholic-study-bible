ught in their days, and in the days of old.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thy hand destroyed the Gentiles, and thou plantedst them: thou didst afflict the people and cast them out.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For they got not the possession of the land by their own sword: neither did their own arm save them. But thy right hand and thy arm, and the light of thy countenance: because thou wast pleased with them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thou art thyself my king and my God, who commandest the saving of Jacob.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Through thee we will push down our enemies with the horn: and through thy name we will despise them that rise up against us.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For I will not trust in my bow: neither shall my sword save me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But thou hast saved us from them that afflict us: and hast put them to shame that hate us.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In God shall we glory all the day long: and in thy name we will give praise for ever.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But now thou hast cast us off, and put us to shame: and thou, O God, wilt not go out with our armies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou hast made us turn our back to our enemies: and they that hated us plundered for themselves.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou hast given us up like sheep to be eaten: thou hast scattered us among the nations.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou hast sold thy people for no price: and there was no reckoning in the exchange of them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou hast made us a reproach to our neighbours, a scoff and derision to them that are round about us.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou hast made us a byword among the Gentiles: a shaking of the head among the people.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>All the day long my shame is before me: and the confusion of my face hath covered me,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>At the voice of him that reproacheth and detracteth me: at the face of the enemy and persecutor.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>All these things have come upon us, yet we have not forgotten thee: and we have not done wickedly in thy covenant.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And our heart hath not turned back: neither hast thou turned aside our steps from thy way.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For thou hast humbled us in the place of affliction: and the shadow of death hath covered us.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>If we have forgotten the name of our God, and if we have spread forth our hands to a strange god:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Shall not God search out these things: for he knoweth the secrets of the heart. Because for thy sake we are killed all the day long: we are counted as sheep for the slaughter.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Arise, why sleepest thou, O Lord? arise, and cast us not off to the end.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Why turnest thou thy face away? and forgettest our want and our trouble?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For our soul is humbled down to the dust: our belly cleaveth to the earth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Arise, O Lord, help us and redeem us for thy name’s sake.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Filiis Core ad intellectum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Deus, auribus nostris audivimus, patres nostri annuntiaverunt nobis, opus quod operatus es in diebus eorum, et in diebus antiquis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Manus tua gentes disperdidit, et plantasti eos ; afflixisti populos, et expulisti eos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nec enim in gladio suo possederunt terram, et brachium eorum non salvavit eos : sed dextera tua et brachium tuum, et illuminatio vultus tui, quoniam complacuisti in eis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tu es ipse rex meus et Deus meus, qui mandas salutes Jacob.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In te inimicos nostros ventilabimus cornu, et in nomine tuo spernemus insurgentes in nobis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non enim in arcu meo sperabo, et gladius meus non salvabit me :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>salvasti enim nos de affligentibus nos, et odientes nos confudisti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In Deo laudabimur tota die, et in nomine tuo confitebimur in sæculum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nunc autem repulisti et confudisti nos, et non egredieris, Deus, in virtutibus nostris.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Avertisti nos retrorsum post inimicos nostros, et qui oderunt nos diripiebant sibi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dedisti nos tamquam oves escarum, et in gentibus dispersisti nos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vendidisti populum tuum sine pretio, et non fuit multitudo in commutationibus eorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Posuisti nos opprobrium vicinis nostris ; subsannationem et derisum his qui sunt in circuitu nostro.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Posuisti nos in similitudinem gentibus ; commotionem capitis in populis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tota die verecundia mea contra me est, et confusio faciei meæ cooperuit me :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>a voce exprobrantis et obloquentis, a facie inimici et persequentis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hæc omnia venerunt super nos ; nec obliti sumus te, et inique non egimus in testamento tuo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et non recessit retro cor nostrum ; et declinasti semitas nostras a via tua :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quoniam humiliasti nos in loco afflictionis, et cooperuit nos umbra mortis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Si obliti sumus nomen Dei nostri, et si expandimus manus nostras ad deum alienum,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>nonne Deus requiret ista ? ipse enim novit abscondita cordis. Quoniam propter te mortificamur tota die ; æstimati sumus sicut oves occisionis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Exsurge ; quare obdormis, Domine ? exsurge, et ne repellas in finem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quare faciem tuam avertis ? oblivisceris inopiæ nostræ et tribulationis nostræ ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quoniam humiliata est in pulvere anima nostra ; conglutinatus est in terra venter noster.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Exsurge, Domine, adjuva nos, et redime nos propter nomen tuum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/42/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 42</s ause thou wast pleased with them.\"},{\"verse\":5,\"text\":\"Thou art thyself my king and my God, who commandest the saving of Jacob.\"},{\"verse\":6,\"text\":\"Through thee we will push down our enemies with the horn: and through thy name we will despise them that rise up against us.\"},{\"verse\":7,\"text\":\"For I will not trust in my bow: neither shall my sword save me.\"},{\"verse\":8,\"text\":\"But thou hast saved us from them that afflict us: and hast put them to shame that hate us.\"},{\"verse\":9,\"text\":\"In God shall we glory all the day long: and in thy name we will give praise for ever.\"},{\"verse\":10,\"text\":\"But now thou hast cast us off, and put us to shame: and thou, O God, wilt not go out with our armies.\"},{\"verse\":11,\"text\":\"Thou hast made us turn our back to our enemies: and they that hated us plundered for themselves.\"},{\"verse\":12,\"text\":\"Thou hast given us up like sheep to be eaten: thou hast scattered us among the nations.\"},{\"verse\":13,\"text\":\"Thou hast sold thy people for no price: and there was no reckoning in the exchange of them.\"},{\"verse\":14,\"text\":\"Thou hast made us a reproach to our neighbours, a scoff and derision to them that are round about us.\"},{\"verse\":15,\"text\":\"Thou hast made us a byword among the Gentiles: a shaking of the head among the people.\"},{\"verse\":16,\"text\":\"All the day long my shame is before me: and the confusion of my face hath covered me,\"},{\"verse\":17,\"text\":\"At the voice of him that reproacheth and detracteth me: at the face of the enemy and persecutor.\"},{\"verse\":18,\"text\":\"All these things have come upon us, yet we have not forgotten thee: and we have not done wickedly in thy covenant.\"},{\"verse\":19,\"text\":\"And our heart hath not turned back: neither hast thou turned aside our steps from thy way.\"},{\"verse\":20,\"text\":\"For thou hast humbled us in the place of affliction: and the shadow of death hath covered us.\"},{\"verse\":21,\"text\":\"If we have forgotten the name of our God, and if we have spread forth our hands to a strange god:\"},{\"verse\":22,\"text\":\"Shall not God search out these things: for he knoweth the secrets of the heart. Because for thy sake we are killed all the day long: we are counted as sheep for the slaughter.\"},{\"verse\":23,\"text\":\"Arise, why sleepest thou, O Lord? arise, and cast us not off to the end.\"},{\"verse\":24,\"text\":\"Why turnest thou thy face away? and forgettest our want and our trouble?\"},{\"verse\":25,\"text\":\"For our soul is humbled down to the dust: our belly cleaveth to the earth.\"},{\"verse\":26,\"text\":\"Arise, O Lord, help us and redeem us for thy name’s sake.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Filiis Core ad intellectum.\"},{\"verse\":2,\"text\":\"Deus, auribus nostris audivimus, patres nostri annuntiaverunt nobis, opus quod operatus es in diebus eorum, et in diebus antiquis.\"},{\"verse\":3,\"text\":\"Manus tua gentes disperdidit, et plantasti eos ; afflixisti populos, et expulisti eos.\"},{\"verse\":4,\"text\":\"Nec enim in gladio suo possederunt terram, et brachium eorum non salvavit eos : sed dextera tua et brachium tuum, et illuminatio vultus tui, quoniam complacuisti in eis.\"},{\"verse\":5,\"text\":\"Tu es ipse rex meus et Deus meus, qui mandas salutes Jacob.\"},{\"verse\":6,\"text\":\"In te inimicos nostros ventilabimus cornu, et in nomine tuo spernemus insurgentes in nobis.\"},{\"verse\":7,\"text\":\"Non enim in arcu meo sperabo, et gladius meus non salvabit me :\"},{\"verse\":8,\"text\":\"salvasti enim nos de affligentibus nos, et odientes nos confudisti.\"},{\"verse\":9,\"text\":\"In Deo laudabimur tota die, et in nomine tuo confitebimur in sæculum.\"},{\"verse\":10,\"text\":\"Nunc autem repulisti et confudisti nos, et non egredieris, Deus, in virtutibus nostris.\"},{\"verse\":11,\"text\":\"Avertisti nos retrorsum post inimicos nostros, et qui oderunt nos diripiebant sibi.\"},{\"verse\":12,\"text\":\"Dedisti nos tamquam oves escarum, et in gentibus dispersisti nos.\"},{\"verse\":13,\"text\":\"Vendidisti populum tuum sine pretio, et non fuit multitudo in commutationibus eorum.\"},{\"verse\":14,\"text\":\"Posuisti nos opprobrium vicinis nostris ; subsannationem et derisum his qui sunt in circuitu nostro.\"},{\"verse\":15,\"text\":\"Posuisti nos in similitudinem gentibus ; commotionem capitis in populis.\"},{\"verse\":16,\"text\":\"Tota die verecundia mea contra me est, et confusio faciei meæ cooperuit me :\"},{\"verse\":17,\"text\":\"a voce exprobrantis et obloquentis, a facie inimici et persequentis.\"},{\"verse\":18,\"text\":\"Hæc omnia venerunt super nos ; nec obliti sumus te, et inique non egimus in testamento tuo.\"},{\"verse\":19,\"text\":\"Et non recessit retro cor nostrum ; et declinasti semitas nostras a via tua :\"},{\"verse\":20,\"text\":\"quoniam humiliasti nos in loco afflictionis, et cooperuit nos umbra mortis.\"},{\"verse\":21,\"text\":\"Si obliti sumus nomen Dei nostri, et si expandimus manus nostras ad deum alienum,\"},{\"verse\":22,\"text\":\"nonne Deus requiret ista ? ipse enim novit abscondita cordis. Quoniam propter te mortificamur tota die ; æstimati sumus sicut oves occisionis.\"},{\"verse\":23,\"text\":\"Exsurge ; quare obdormis, Domine ? exsurge, et ne repellas in finem.\"},{\"verse\":24,\"text\":\"Quare faciem tuam avertis ? oblivisceris inopiæ nostræ et tribulationis nostræ ?\"},{\"verse\":25,\"text\":\"Quoniam humiliata est in pulvere anima nostra ; conglutinatus est in terra venter noster.\"},{\"verse\":26,\"text\":\"Exsurge, Domine, adjuva nos, et redime nos propter nomen tuum.\"}],\"summary\":\"Deus auribus nostris.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":42,\"label\":\"Psalms 42\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":44,\"label\":\"Psalms 44\"}}]]\n"])</script></body></html>
