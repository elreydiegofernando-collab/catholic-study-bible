ata-verse="1" aria-pressed="false" class="verse"><sup>1</sup>To David himself, understanding. Blessed are they whose iniquities are forgiven, and whose sins are covered.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Blessed is the man to whom the Lord hath not imputed sin, and in whose spirit there is no guile.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Because I was silent my bones grew old; whilst I cried out all the day long.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For day and night thy hand was heavy upon me: I am turned in my anguish, whilst the thorn is fastened.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I have acknowledged my sin to thee, and my injustice I have not concealed. I said I will confess against my self my injustice to the Lord: and thou hast forgiven the wickedness of my sin.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For this shall every one that is holy pray to thee in a seasonable time. And yet in a flood of many waters, they shall not come nigh unto him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou art my refuge from the trouble which hath encompassed me: my joy, deliver me from them that surround me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I will give thee understanding, and I will instruct thee in this way, in which thou shalt go: I will fix my eyes upon thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Do not become like the horse and the mule, who have no understanding. With bit and bridle bind fast their jaws, who come not near unto thee.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Many are the scourges of the sinner, but mercy shall encompass him that hopeth in the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Be glad in the Lord, and rejoice, ye just, and glory, all ye right of heart.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ipsi David intellectus. Beati quorum remissæ sunt iniquitates, et quorum tecta sunt peccata.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beatus vir cui non imputavit Dominus peccatum, nec est in spiritu ejus dolus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quoniam tacui, inveteraverunt ossa mea, dum clamarem tota die.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quoniam die ac nocte gravata est super me manus tua, conversus sum in ærumna mea, dum configitur spina.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Delictum meum cognitum tibi feci, et injustitiam meam non abscondi. Dixi : Confitebor adversum me injustitiam meam Domino ; et tu remisisti impietatem peccati mei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Pro hac orabit ad te omnis sanctus in tempore opportuno. Verumtamen in diluvio aquarum multarum, ad eum non approximabunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tu es refugium meum a tribulatione quæ circumdedit me ; exsultatio mea, erue me a circumdantibus me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Intellectum tibi dabo, et instruam te in via hac qua gradieris ; firmabo super te oculos meos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nolite fieri sicut equus et mulus, quibus non est intellectus. In camo et freno maxillas eorum constringe, qui non approximant ad te.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Multa flagella peccatoris ; sperantem autem in Domino misericordia circumdabit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Lætamini in Domino, et exsultate, justi ; et gloriamini, omnes recti corde.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/30/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 30</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/32/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 32</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->31<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bo
