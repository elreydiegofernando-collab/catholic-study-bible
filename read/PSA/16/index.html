pe="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The prayer of David. Hear, O Lord, my justice: attend to my supplication. Give ear unto my prayer, which proceedeth not from deceitful lips.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let my judgment come forth from thy countenance: let thy eyes behold the things that are equitable.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou hast proved my heart, and visited it by night, thou hast tried me by fire: and iniquity hath not been found in me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>That my mouth may not speak the works of men: for the sake of the words of thy lips, I have kept hard ways.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Perfect thou my goings in thy paths: that my footsteps be not moved.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I have cried to thee, for thou, O God, hast heard me: O incline thy ear unto me, and hear my words.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Shew forth thy wonderful mercies; thou who savest them that trust in thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>From them that resist thy right hand keep me, as the apple of thy eye. Protect me under the shadow of thy wings.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>From the face of the wicked who have afflicted me. My enemies have surrounded my soul:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They have shut up their fat: their mouth hath spoken proudly.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>They have cast me forth, and now they have surrounded me: they have set their eyes bowing down to the earth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They have taken me, as a lion prepared for the prey; and as a young lion dwelling in secret places.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Arise, O Lord, disappoint him and supplant him; deliver my soul from the wicked one; thy sword</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>From the enemies of thy hand. O Lord, divide them from the few of the earth in their life: their belly is filled from thy hidden stores. They are full of children: and they have left to their little ones the rest of their substance.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But as for me, I will appear before thy sight in justice: I shall be satisfied when thy glory shall appear.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Oratio David. Exaudi, Domine, justitiam meam ; intende deprecationem meam. Auribus percipe orationem meam, non in labiis dolosis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>De vultu tuo judicium meum prodeat ; oculi tui videant æquitates.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Probasti cor meum, et visitasti nocte ; igne me examinasti, et non est inventa in me iniquitas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ut non loquatur os meum opera hominum : propter verba labiorum tuorum, ego custodivi vias duras.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Perfice gressus meos in semitis tuis, ut non moveantur vestigia mea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ego clamavi, quoniam exaudisti me, Deus ; inclina aurem tuam mihi, et exaudi verba mea.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Mirifica misericordias tuas, qui salvos facis sperantes in te.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>A resistentibus dexteræ tuæ custodi me ut pupillam oculi. Sub umbra alarum tuarum protege me</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>a facie impiorum qui me afflixerunt. Inimici mei animam meam circumdederunt ;</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>adipem suum concluserunt : os eorum locutum est superbiam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Projicientes me nunc circumdederunt me ; oculos suos statuerunt declinare in terram.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Susceperunt me sicut leo paratus ad prædam, et sicut catulus leonis habitans in abditis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Exsurge, Domine : præveni eum, et supplanta eum : eripe animam meam ab impio ; frameam tuam</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ab inimicis manus tuæ. Domine, a paucis de terra divide eos in vita eorum ; de absconditis tuis adimpletus est venter eorum. Saturati sunt filiis, et dimiserunt reliquias suas parvulis suis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ego autem in justitia apparebo conspectui tuo ; satiabor cum apparuerit gloria tua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 \",\"$L18\",\"PSA.16\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":16,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"The prayer of David. Hear, O Lord, my justice: attend to my supplication. Give ear unto my prayer, which proceedeth not from deceitful lips.\"},{\"verse\":2,\"text\":\"Let my judgment come forth from thy countenance: let thy eyes behold the things that are equitable.\"},{\"verse\":3,\"text\":\"Thou hast proved my heart, and visited it by night, thou hast tried me by fire: and iniquity hath not been found in me.\"},{\"verse\":4,\"text\":\"That my mouth may not speak the works of men: for the sake of the words of thy lips, I have kept hard ways.\"},{\"verse\":5,\"text\":\"Perfect thou my goings in thy paths: that my footsteps be not moved.\"},{\"verse\":6,\"text\":\"I have cried to thee, for thou, O God, hast heard me: O incline thy ear unto me, and hear my words.\"},{\"verse\":7,\"text\":\"Shew forth thy wonderful mercies; thou who savest them that trust in thee.\"},{\"verse\":8,\"text\":\"From them that resist thy right hand keep me, as the apple of thy eye. Protect me under the shadow of thy wings.\"},{\"verse\":9,\"text\":\"From the face of the wicked who have afflicted me. My enemies have surrounded my soul:\"},{\"verse\":10,\"text\":\"They have shut up their fat: their mouth hath spoken proudly.\"},{\"verse\":11,\"text\":\"They have cast me forth, and now they have surrounded me: they have set their eyes bowing down to the earth.\"},{\"verse\":12,\"text\":\"They have taken me, as a lion prepared for the prey; and as a young lion dwelling in secret places.\"},{\"verse\":13,\"text\":\"Arise, O Lord, disappoint him and supplant him; deliver my soul from the wicked one; thy sword\"},{\"verse\":14,\"text\":\"From the enemies of thy hand. O Lord, divide them from the few of the earth in their life: their belly is filled from thy hidden stores. They are full of children: and they have left to their little ones the rest of their substance.\"},{\"verse\":15,\"text\":\"But as for me, I will appear before thy sight in justice: I shall be satisfied when thy glory shall appear.\"}],\"vul\":[{\"verse\":1,\"text\":\"Oratio David. Exaudi, Domine, justitiam meam ; intende deprecationem meam. Auribus percipe orationem meam, non in labiis dolosis.\"},{\"verse\":2,\"text\":\"De vultu tuo judicium meum prodeat ; oculi tui videant æquitates.\"},{\"verse\":3,\"text\":\"Probasti cor meum, et visitasti nocte ; igne me examinasti, et non est inventa in me iniquitas.\"},{\"verse\":4,\"text\":\"Ut non loquatur os meum opera hominum : propter verba labiorum tuorum, ego custodivi vias duras.\"},{\"verse\":5,\"text\":\"Perfice gressus meos in semitis tuis, ut non moveantur vestigia mea.\"},{\"verse\":6,\"text\":\"Ego clamavi, quoniam exaudisti me, Deus ; inclina aurem tuam mihi, et exaudi verba mea.\"},{\"verse\":7,\"text\":\"Mirifica misericordias tuas, qui salvos facis sperantes in te.\"},{\"verse\":8,\"text\":\"A resistentibus dexteræ tuæ custodi me ut pupillam oculi. Sub umbra alarum tuarum protege me\"},{\"verse\":9,\"text\":\"a facie impiorum qui me afflixerunt. Inimici mei animam meam circumdederunt ;\"},{\"verse\":10,\"text\":\"adipem suum concluserunt : os eorum locutum est superbiam.\"},{\"verse\":11,\"text\":\"Projicientes me nunc circumdederunt me ; oculos suos statuerunt declinare in terram.\"},{\"verse\":12,\"text\":\"Susceperunt me sicut leo paratus ad prædam, et sicut catulus leonis habitans in abditis.\"},{\"verse\":13,\"text\":\"Exsurge, Domine : præveni eum, et supplanta eum : eripe animam meam ab impio ; frameam tuam\"},{\"verse\":14,\"text\":\"ab inimicis manus tuæ. Domine, a paucis de terra divide eos in vita eorum ; de absconditis tuis adimpletus est venter eorum. Saturati sunt filiis, et dimiserunt reliquias suas parvulis suis.\"},{\"verse\":15,\"text\":\"Ego autem in justitia apparebo conspectui tuo ; satiabor cum apparuerit gloria tua.\"}],\"summary\":\"Exaudi, Domine, justitiam.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":15,\"label\":\"Psalms 15\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":17,\"label\":\"Psalms 17\"}}]]\n"])</script></body></html>
