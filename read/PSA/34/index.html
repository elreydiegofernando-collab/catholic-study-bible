20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">34</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Judica, Domine, nocentes me.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For David himself. Judge thou, O Lord, them that wrong me: overthrow them that fight against me.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Take hold of arms and shield: and rise up to help me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Bring out the sword, and shut up the way against them that persecute me: say to my soul: I am thy salvation.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let them be confounded and ashamed that seek after my soul. Let them be turned back and be confounded that devise evil against me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Let them become as dust before the wind: and let the angel of the Lord straiten them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let their way become dark and slippery; and let the angel of the Lord pursue them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For without cause they have hidden their net for me unto destruction: without cause they have upbraided my soul.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let the snare which he knoweth not come upon him: and let the net which he hath hidden catch him: and into that very snare let them fall.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But my soul shall rejoice in the Lord; and shall be delighted in his salvation.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>All my bones shall say: Lord, who is like to thee? Who deliverest the poor from the hand of them that are stronger than he; the needy and the poor from them that strip him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Unjust witnesses rising up have asked me things I knew not.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They repaid me evil for good: to the depriving me of my soul.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But as for me, when they were troublesome to me, I was clothed with haircloth. I humbled my soul with fasting; and my prayer shall be turned into my bosom.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>As a neighbour and as an own brother, so did I please: as one mourning and sorrowful so was I humbled.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But they rejoiced against me, and came together: scourges were gathered together upon me, and I knew not.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>They were separated, and repented not: they tempted me, they scoffed at me with scorn: they gnashed upon me with their teeth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Lord, when wilt thou look upon me? rescue thou my soul from their malice: my only one from the lions.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will give thanks to thee in a great church; I will praise thee in a strong people.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let not them that are my enemies wrongfully rejoice over me: who have hated me without cause, and wink with the eyes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For they spoke indeed peaceably to me; and speaking in the anger of the earth they devised guile.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they opened their mouth wide against me; they said: Well done, well done, our eyes have seen it.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thou hast seen, O Lord, be not thou silent: O Lord, depart not from me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Arise, and be attentive to my judgment: to my cause, my God, and my Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Judge me, O Lord my God according to thy justice, and let them not rejoice over me.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let them not say in their hearts: It is well, it is well, to our mind: neither let them say: We have swallowed him up.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Let them blush: and be ashamed together, who rejoice at my evils. Let them be clothed with confusion and shame, who speak great things against me.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Let them rejoice and be glad, who are well pleased with my justice, and let them say always: The Lord be magnified, who delights in the peace of his servant.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And my tongue shall meditate thy justice, thy praise all the day long.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ipsi David. Judica, Domine, nocentes me ; expugna impugnantes me.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Apprehende arma et scutum, et exsurge in adjutorium mihi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Effunde frameam, et conclude adversus eos qui persequuntur me ; dic animæ meæ : Salus tua ego sum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Confundantur et revereantur quærentes animam meam ; avertantur retrorsum et confundantur cogitantes mihi mala.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Fiant tamquam pulvis ante faciem venti, et angelus Domini coarctans eos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Fiat via illorum tenebræ et lubricum, et angelus Domini persequens eos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quoniam gratis absconderunt mihi interitum laquei sui ; supervacue exprobraverunt animam meam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Veniat illi laqueus quem ignorat, et captio quam abscondit apprehendat eum, et in laqueum cadat in ipsum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Anima autem mea exsultabit in Domino, et delectabitur super salutari suo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnia ossa mea dicent : Domine, quis similis tibi ? eripiens inopem de manu fortiorum ejus ; egenum et pauperem a diripientibus eum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Surgentes testes iniqui, quæ ignorabam interrogabant me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Retribuebant mihi mala pro bonis, sterilitatem animæ meæ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ego autem, cum mihi molesti essent, induebar cilicio ; humiliabam in jejunio animam meam, et oratio mea in sinu meo convertetur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quasi proximum et quasi fratrem nostrum sic complacebam ; quasi lugens et contristatus sic humiliabar.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et adversum me lætati sunt, et convenerunt ; congregata sunt super me flagella, et ignoravi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dissipati sunt, nec compuncti ; tentaverunt me, subsannaverunt me subsannatione ; frenduerunt super me dentibus suis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Domine, quando respicies ? Restitue animam meam a malignitate eorum ; a leonibus unicam meam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Confitebor tibi in ecclesia magna ; in populo gravi laudabo te.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non supergaudeant mihi qui adversantur mihi inique, qui oderunt me gratis, et annuunt oculis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quoniam mihi quidem pacifice loquebantur ; et in iracundia terræ loquentes, dolos cogitabant.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et dilataverunt super me os suum ; dixerunt : Euge, euge ! viderunt oculi nostri.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vidisti, Domine : ne sileas ; Domine, ne discedas a me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Exsurge et intende judicio meo, Deus meus ; et Dominus meus, in causam meam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Judica me secundum justitiam tuam, Domine Deus meus, et non supergaudeant mihi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Non dicant in cordibus suis : Euge, euge, animæ nostræ ; nec dicant : Devoravimus eum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Erubescant et revereantur simul qui gratulantur malis meis ; induantur confusione et reverentia qui magna loquuntur super me.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Exsultent et lætentur qui volunt justitiam meam ; et dicant semper : Magnificetur Dominus, qui volunt pacem servi ejus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et lingua mea meditabitur justitiam tuam ; tota die laudem tuam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 33</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/35/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 35</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->34<!-- --> of <!-- -->150<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"PSA.34\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":34,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"For David himself. Judge thou, O Lord, them that wrong me: overthrow them that fight against me.\"},{\"verse\":2,\"text\":\"Take hold of arms and shield: and rise up to help me.\"},{\"verse\":3,\"text\":\"Bring out the sword, and shut up the way against them that persecute me: say to my soul: I am thy salvation.\"},{\"verse\":4,\"text\":\"Let them be confounded and ashamed that seek after my soul. Let them be turned back and be confounded that devise evil against me.\"},{\"verse\":5,\"text\":\"Let them become as dust before the wind: and let the angel of the Lord straiten them.\"},{\"verse\":6,\"text\":\"Let their way become dark and slippery; and let the angel of the Lord pursue them.\"},{\"verse\":7,\"text\":\"For without cause they have hidden their net for me unto destruction: without cause they have upbraided my soul.\"},{\"verse\":8,\"text\":\"Let the snare which he knoweth not come upon him: and let the net which he hath hidden catch him: and into that very snare let them fall.\"},{\"verse\":9,\"text\":\"But my soul shall rejoice in the Lord; and shall be delighted in his salvation.\"},{\"verse\":10,\"text\":\"All my bones shall say: Lord, who is like to thee? Who deliverest the poor from the hand of them that are stronger than he; the needy and the poor from them that strip him.\"},{\"verse\":11,\"text\":\"Unjust witnesses rising up have asked me things I knew not.\"},{\"verse\":12,\"text\":\"They repaid me evil for good: to the depriving me of my soul.\"},{\"verse\":13,\"text\":\"But as for me, when they were troublesome to me, I was clothed with haircloth. I humbled my soul with fasting; and my prayer shall be turned into my bosom.\"},{\"verse\":14,\"text\":\"As a neighbour and as an own brother, so did I please: as one mourning and sorrowful so was I humbled.\"},{\"verse\":15,\"text\":\"But they rejoiced against me, and came together: scourges were gathered together upon me, and I knew not.\"},{\"verse\":16,\"text\":\"They were separated, and repented not: they tempted me, they scoffed at me with scorn: they gnashed upon me with their teeth.\"},{\"verse\":17,\"text\":\"Lord, when wilt thou look upon me? rescue thou my soul from their malice: my only one from the lions.\"},{\"verse\":18,\"text\":\"I will give thanks to thee in a great church; I will praise thee in a strong people.\"},{\"verse\":19,\"text\":\"Let not them that are my enemies wrongfully rejoice over me: who have hated me without cause, and wink with the eyes.\"},{\"verse\":20,\"text\":\"For they spoke indeed peaceably to me; and speaking in the anger of the earth they devised guile.\"},{\"verse\":21,\"text\":\"And they opened their mouth wide against me; they said: Well done, well done, our eyes have seen it.\"},{\"verse\":22,\"text\":\"Thou hast seen, O Lord, be not thou silent: O Lord, depart not from me.\"},{\"verse\":23,\"text\":\"Arise, and be attentive to my judgment: to my cause, my God, and my Lord.\"},{\"verse\":24,\"text\":\"Judge me, O Lord my God according to thy justice, and let them not rejoice over me.\"},{\"verse\":25,\"text\":\"Let them not say in their hearts: It is well, it is well, to our mind: neither let them say: We have swallowed him up.\"},{\"verse\":26,\"text\":\"Let them blush: and be ashamed together, who rejoice at my evils. Let them be clothed with confusion and shame, who speak great things against me.\"},{\"verse\":27,\"text\":\"Let them rejoice and be glad, who are well pleased with my justice, and let them say always: The Lord be magnified, who delights in the peace of his servant.\"},{\"verse\":28,\"text\":\"And my tongue shall meditate thy justice, thy praise all the day long.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ipsi David. Judica, Domine, nocentes me ; expugna impugnantes me.\"},{\"verse\":2,\"text\":\"Apprehende arma et scutum, et exsurge in adjutorium mihi.\"},{\"verse\":3,\"text\":\"Effunde frameam, et conclude adversus eos qui persequuntur me ; dic animæ meæ : Salus tua ego sum.\"},{\"verse\":4,\"text\":\"Confundantur et revereantur quærentes animam meam ; avertantur retrorsum et confundantur cogitantes mihi mala.\"},{\"verse\":5,\"text\":\"Fiant tamquam pulvis ante faciem venti, et angelus Domini coarctans eos.\"},{\"verse\":6,\"text\":\"Fiat via illorum tenebræ et lubricum, et angelus Domini persequens eos.\"},{\"verse\":7,\"text\":\"Quoniam gratis absconderunt mihi interitum laquei sui ; supervacue exprobraverunt animam meam.\"},{\"verse\":8,\"text\":\"Veniat illi laqueus quem ignorat, et captio quam abscondit apprehendat eum, et in laqueum cadat in ipsum.\"},{\"verse\":9,\"text\":\"Anima autem mea exsultabit in Domino, et delectabitur super salutari suo.\"},{\"verse\":10,\"text\":\"Omnia ossa mea dicent : Domine, quis similis tibi ? eripiens inopem de manu fortiorum ejus ; egenum et pauperem a diripientibus eum.\"},{\"verse\":11,\"text\":\"Surgentes testes iniqui, quæ ignorabam interrogabant me.\"},{\"verse\":12,\"text\":\"Retribuebant mihi mala pro bonis, sterilitatem animæ meæ.\"},{\"verse\":13,\"text\":\"Ego autem, cum mihi molesti essent, induebar cilicio ; humiliabam in jejunio animam meam, et oratio mea in sinu meo convertetur.\"},{\"verse\":14,\"text\":\"Quasi proximum et quasi fratrem nostrum sic complacebam ; quasi lugens et contristatus sic humiliabar.\"},{\"verse\":15,\"text\":\"Et adversum me lætati sunt, et convenerunt ; congregata sunt super me flagella, et ignoravi.\"},{\"verse\":16,\"text\":\"Dissipati sunt, nec compuncti ; tentaverunt me, subsannaverunt me subsannatione ; frenduerunt super me dentibus suis.\"},{\"verse\":17,\"text\":\"Domine, quando respicies ? Restitue animam meam a malignitate eorum ; a leonibus unicam meam.\"},{\"verse\":18,\"text\":\"Confitebor tibi in ecclesia magna ; in populo gravi laudabo te.\"},{\"verse\":19,\"text\":\"Non supergaudeant mihi qui adversantur mihi inique, qui oderunt me gratis, et annuunt oculis.\"},{\"verse\":20,\"text\":\"Quoniam mihi quidem pacifice loquebantur ; et in iracundia terræ loquentes, dolos cogitabant.\"},{\"verse\":21,\"text\":\"Et dilataverunt super me os suum ; dixerunt : Euge, euge ! viderunt oculi nostri.\"},{\"verse\":22,\"text\":\"Vidisti, Domine : ne sileas ; Domine, ne discedas a me.\"},{\"verse\":23,\"text\":\"Exsurge et intende judicio meo, Deus meus ; et Dominus meus, in causam meam.\"},{\"verse\":24,\"text\":\"Judica me secundum justitiam tuam, Domine Deus meus, et non supergaudeant mihi.\"},{\"verse\":25,\"text\":\"Non dicant in cordibus suis : Euge, euge, animæ nostræ ; nec dicant : Devoravimus eum.\"},{\"verse\":26,\"text\":\"Erubescant et revereantur simul qui gratulantur malis meis ; induantur confusione et reverentia qui magna loquuntur super me.\"},{\"verse\":27,\"text\":\"Exsultent et lætentur qui volunt justitiam meam ; et dicant semper : Magnificetur Dominus, qui volunt pacem servi ejus.\"},{\"verse\":28,\"text\":\"Et lingua mea meditabitur justitiam tuam ; tota die laudem tuam.\"}],\"summary\":\"Judica, Domine, nocentes me.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":33,\"label\":\"Psalms 33\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":35,\"label\":\"Psalms 35\"}}]]\n"])</script></body></html>
