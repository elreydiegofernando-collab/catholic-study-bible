"button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A psalm for Asaph. How good is God to Israel, to them that are of a right heart!</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But my feet were almost moved; my steps had well nigh slipped.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Because I had a zeal on occasion of the wicked, seeing the prosperity of sinners.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For there is no regard to their death, nor is there strength in their stripes.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They are not in the labour of men: neither shall they be scourged like other men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Therefore pride hath held them fast: they are covered with their iniquity and their wickedness.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Their iniquity hath come forth, as it were from fatness: they have passed into the affection of the heart.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>They have thought and spoken wickedness: they have spoken iniquity on high.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They have set their mouth against heaven: and their tongue hath passed through the earth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore will my people return here and full days shall be found in them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they said: How doth God know? and is there knowledge in the most High?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Behold these are sinners; and yet, abounding in the world they have obtained riches.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I said: Then have I in vain justified my heart, and washed my hands among the innocent.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And I have been scourged all the day; and my chastisement hath been in the mornings.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>If I said: I will speak thus; behold I should condemn the generation of thy children.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I studied that I might know this thing, it is a labour in my sight:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Until I go into the sanctuary of God, and understand concerning their last ends.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But indeed for deceits thou hast put it to them: when they were lifted up thou hast cast them down.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>How are they brought to desolation? they have suddenly ceased to be: they have perished by reason of their iniquity.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>As the dream of them that awake, O Lord; so in thy city thou shalt bring their image to nothing.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For my heart hath been inflamed, and my reins have been changed:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And I am brought to nothing, and I knew not.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I am become as a beast before thee: and I am always with thee.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Thou hast held me by my right hand; and by thy will thou hast conducted me, and with thy glory thou hast received me.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For what have I in heaven? and besides thee what do I desire upon earth?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For thee my flesh and my heart hath fainted away: thou art the God of my heart, and the God that is my portion for ever.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For behold they that go far from thee shall perish: thou hast destroyed all them that are disloyal to thee.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But it is good for me to adhere to my God, to put my hope in the Lord God: That I may declare all thy praises, in the gates of the daughter of Sion.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus Asaph. Quam bonus Israël Deus, his qui recto sunt corde !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Mei autem pene moti sunt pedes, pene effusi sunt gressus mei :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>quia zelavi super iniquos, pacem peccatorum videns.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia non est respectus morti eorum, et firmamentum in plaga eorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In labore hominum non sunt, et cum hominibus non flagellabuntur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ideo tenuit eos superbia ; operti sunt iniquitate et impietate sua.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Prodiit quasi ex adipe iniquitas eorum ; transierunt in affectum cordis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cogitaverunt et locuti sunt nequitiam ; iniquitatem in excelso locuti sunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Posuerunt in cælum os suum, et lingua eorum transivit in terra.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ideo convertetur populus meus hic, et dies pleni invenientur in eis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et dixerunt : Quomodo scit Deus, et si est scientia in excelso ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ecce ipsi peccatores, et abundantes in sæculo obtinuerunt divitias.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et dixi : Ergo sine causa justificavi cor meum, et lavi inter innocentes manus meas,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et fui flagellatus tota die, et castigatio mea in matutinis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si dicebam : Narrabo sic ; ecce nationem filiorum tuorum reprobavi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Existimabam ut cognoscerem hoc ; labor est ante me :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>donec intrem in sanctuarium Dei, et intelligam in novissimis eorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Verumtamen propter dolos posuisti eis ; dejecisti eos dum allevarentur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quomodo facti sunt in desolationem ? subito defecerunt : perierunt propter iniquitatem suam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Velut somnium surgentium, Domine, in civitate tua imaginem ipsorum ad nihilum rediges.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quia inflammatum est cor meum, et renes mei commutati sunt ;</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et ego ad nihilum redactus sum, et nescivi :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>ut jumentum factus sum apud te, et ego semper tecum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Tenuisti manum dexteram meam, et in voluntate tua deduxisti me, et cum gloria suscepisti me.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quid enim mihi est in cælo ? et a te quid volui super terram ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Defecit caro mea et cor meum ; Deus cordis mei, et pars mea, Deus in æternum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quia ecce qui elongant se a te peribunt ; perdidisti omnes qui fornicantur abs te.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mihi autem adhærere Deo bonum est ; ponere in Domino Deo spem meam : ut annuntiem omnes prædicationes tuas in portis filiæ Sion.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-stud :72,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"A psalm for Asaph. How good is God to Israel, to them that are of a right heart!\"},{\"verse\":2,\"text\":\"But my feet were almost moved; my steps had well nigh slipped.\"},{\"verse\":3,\"text\":\"Because I had a zeal on occasion of the wicked, seeing the prosperity of sinners.\"},{\"verse\":4,\"text\":\"For there is no regard to their death, nor is there strength in their stripes.\"},{\"verse\":5,\"text\":\"They are not in the labour of men: neither shall they be scourged like other men.\"},{\"verse\":6,\"text\":\"Therefore pride hath held them fast: they are covered with their iniquity and their wickedness.\"},{\"verse\":7,\"text\":\"Their iniquity hath come forth, as it were from fatness: they have passed into the affection of the heart.\"},{\"verse\":8,\"text\":\"They have thought and spoken wickedness: they have spoken iniquity on high.\"},{\"verse\":9,\"text\":\"They have set their mouth against heaven: and their tongue hath passed through the earth.\"},{\"verse\":10,\"text\":\"Therefore will my people return here and full days shall be found in them.\"},{\"verse\":11,\"text\":\"And they said: How doth God know? and is there knowledge in the most High?\"},{\"verse\":12,\"text\":\"Behold these are sinners; and yet, abounding in the world they have obtained riches.\"},{\"verse\":13,\"text\":\"And I said: Then have I in vain justified my heart, and washed my hands among the innocent.\"},{\"verse\":14,\"text\":\"And I have been scourged all the day; and my chastisement hath been in the mornings.\"},{\"verse\":15,\"text\":\"If I said: I will speak thus; behold I should condemn the generation of thy children.\"},{\"verse\":16,\"text\":\"I studied that I might know this thing, it is a labour in my sight:\"},{\"verse\":17,\"text\":\"Until I go into the sanctuary of God, and understand concerning their last ends.\"},{\"verse\":18,\"text\":\"But indeed for deceits thou hast put it to them: when they were lifted up thou hast cast them down.\"},{\"verse\":19,\"text\":\"How are they brought to desolation? they have suddenly ceased to be: they have perished by reason of their iniquity.\"},{\"verse\":20,\"text\":\"As the dream of them that awake, O Lord; so in thy city thou shalt bring their image to nothing.\"},{\"verse\":21,\"text\":\"For my heart hath been inflamed, and my reins have been changed:\"},{\"verse\":22,\"text\":\"And I am brought to nothing, and I knew not.\"},{\"verse\":23,\"text\":\"I am become as a beast before thee: and I am always with thee.\"},{\"verse\":24,\"text\":\"Thou hast held me by my right hand; and by thy will thou hast conducted me, and with thy glory thou hast received me.\"},{\"verse\":25,\"text\":\"For what have I in heaven? and besides thee what do I desire upon earth?\"},{\"verse\":26,\"text\":\"For thee my flesh and my heart hath fainted away: thou art the God of my heart, and the God that is my portion for ever.\"},{\"verse\":27,\"text\":\"For behold they that go far from thee shall perish: thou hast destroyed all them that are disloyal to thee.\"},{\"verse\":28,\"text\":\"But it is good for me to adhere to my God, to put my hope in the Lord God: That I may declare all thy praises, in the gates of the daughter of Sion.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus Asaph. Quam bonus Israël Deus, his qui recto sunt corde !\"},{\"verse\":2,\"text\":\"Mei autem pene moti sunt pedes, pene effusi sunt gressus mei :\"},{\"verse\":3,\"text\":\"quia zelavi super iniquos, pacem peccatorum videns.\"},{\"verse\":4,\"text\":\"Quia non est respectus morti eorum, et firmamentum in plaga eorum.\"},{\"verse\":5,\"text\":\"In labore hominum non sunt, et cum hominibus non flagellabuntur.\"},{\"verse\":6,\"text\":\"Ideo tenuit eos superbia ; operti sunt iniquitate et impietate sua.\"},{\"verse\":7,\"text\":\"Prodiit quasi ex adipe iniquitas eorum ; transierunt in affectum cordis.\"},{\"verse\":8,\"text\":\"Cogitaverunt et locuti sunt nequitiam ; iniquitatem in excelso locuti sunt.\"},{\"verse\":9,\"text\":\"Posuerunt in cælum os suum, et lingua eorum transivit in terra.\"},{\"verse\":10,\"text\":\"Ideo convertetur populus meus hic, et dies pleni invenientur in eis.\"},{\"verse\":11,\"text\":\"Et dixerunt : Quomodo scit Deus, et si est scientia in excelso ?\"},{\"verse\":12,\"text\":\"Ecce ipsi peccatores, et abundantes in sæculo obtinuerunt divitias.\"},{\"verse\":13,\"text\":\"Et dixi : Ergo sine causa justificavi cor meum, et lavi inter innocentes manus meas,\"},{\"verse\":14,\"text\":\"et fui flagellatus tota die, et castigatio mea in matutinis.\"},{\"verse\":15,\"text\":\"Si dicebam : Narrabo sic ; ecce nationem filiorum tuorum reprobavi.\"},{\"verse\":16,\"text\":\"Existimabam ut cognoscerem hoc ; labor est ante me :\"},{\"verse\":17,\"text\":\"donec intrem in sanctuarium Dei, et intelligam in novissimis eorum.\"},{\"verse\":18,\"text\":\"Verumtamen propter dolos posuisti eis ; dejecisti eos dum allevarentur.\"},{\"verse\":19,\"text\":\"Quomodo facti sunt in desolationem ? subito defecerunt : perierunt propter iniquitatem suam.\"},{\"verse\":20,\"text\":\"Velut somnium surgentium, Domine, in civitate tua imaginem ipsorum ad nihilum rediges.\"},{\"verse\":21,\"text\":\"Quia inflammatum est cor meum, et renes mei commutati sunt ;\"},{\"verse\":22,\"text\":\"et ego ad nihilum redactus sum, et nescivi :\"},{\"verse\":23,\"text\":\"ut jumentum factus sum apud te, et ego semper tecum.\"},{\"verse\":24,\"text\":\"Tenuisti manum dexteram meam, et in voluntate tua deduxisti me, et cum gloria suscepisti me.\"},{\"verse\":25,\"text\":\"Quid enim mihi est in cælo ? et a te quid volui super terram ?\"},{\"verse\":26,\"text\":\"Defecit caro mea et cor meum ; Deus cordis mei, et pars mea, Deus in æternum.\"},{\"verse\":27,\"text\":\"Quia ecce qui elongant se a te peribunt ; perdidisti omnes qui fornicantur abs te.\"},{\"verse\":28,\"text\":\"Mihi autem adhærere Deo bonum est ; ponere in Domino Deo spem meam : ut annuntiem omnes prædicationes tuas in portis filiæ Sion.\"}],\"summary\":\"Quam bonus Israel Deus.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":71,\"label\":\"Psalms 71\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":73,\"label\":\"Psalms 73\"}}]]\n"])</script></body></html>
