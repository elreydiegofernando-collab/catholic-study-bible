n" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For David himself. Bless the Lord, O my soul: and let all that is within me bless his holy name.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Bless the Lord, O my soul, and never forget all he hath done for thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Who forgiveth all thy iniquities: who healeth all thy diseases.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who redeemeth thy life from destruction: who crowneth thee with mercy and compassion.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who satisfieth thy desire with good things: thy youth shall be renewed like the eagle’s.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The Lord doth mercies, and judgment for all that suffer wrong.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He hath made his ways known to Moses: his wills to the children of Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord is compassionate and merciful: longsuffering and plenteous in mercy.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He will not always be angry: nor will he threaten for ever.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He hath not dealt with us according to our sins: nor rewarded us according to our iniquities.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For according to the height of the heaven above the earth: he hath strengthened his mercy towards them that fear him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>As far as the east is from the west, so far hath he removed our iniquities from us.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>As a father hath compassion on his children, so hath the Lord compassion on them that fear him:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For he knoweth our frame. He remembereth that we are dust:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Man’s days are as grass, as the flower of the field so shall he flourish.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For the spirit shall pass in him, and he shall not be: and he shall know his place no more.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But the mercy of the Lord is from eternity and unto eternity upon them that fear him: And his justice unto children’s children,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>To such as keep his covenant, And are mindful of his commandments to do them.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The lord hath prepared his throne in heaven: and his kingdom shall rule over all.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Bless the Lord, all ye his angels: you that are mighty in strength, and execute his word, hearkening to the voice of his orders.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Bless the Lord, all ye his hosts: you ministers of his that do his will.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Bless the Lord, all his works: in every place of his dominion, O my soul, bless thou the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ipsi David. Benedic, anima mea, Domino, et omnia quæ intra me sunt nomini sancto ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Benedic, anima mea, Domino, et noli oblivisci omnes retributiones ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Qui propitiatur omnibus iniquitatibus tuis ; qui sanat omnes infirmitates tuas :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>qui redimit de interitu vitam tuam ; qui coronat te in misericordia et miserationibus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui replet in bonis desiderium tuum ; renovabitur ut aquilæ juventus tua :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>faciens misericordias Dominus, et judicium omnibus injuriam patientibus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Notas fecit vias suas Moysi ; filiis Israël voluntates suas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Miserator et misericors Dominus : longanimis, et multum misericors.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non in perpetuum irascetur, neque in æternum comminabitur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non secundum peccata nostra fecit nobis, neque secundum iniquitates nostras retribuit nobis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quoniam secundum altitudinem cæli a terra, corroboravit misericordiam suam super timentes se ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quantum distat ortus ab occidente, longe fecit a nobis iniquitates nostras.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quomodo miseretur pater filiorum, misertus est Dominus timentibus se.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quoniam ipse cognovit figmentum nostrum ; recordatus est quoniam pulvis sumus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Homo, sicut fœnum dies ejus ; tamquam flos agri, sic efflorebit :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>quoniam spiritus pertransibit in illo, et non subsistet, et non cognoscet amplius locum suum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Misericordia autem Domini ab æterno, et usque in æternum super timentes eum. Et justitia illius in filios filiorum,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>his qui servant testamentum ejus, et memores sunt mandatorum ipsius ad faciendum ea.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dominus in cælo paravit sedem suam, et regnum ipsius omnibus dominabitur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Benedicite Domino, omnes angeli ejus : potentes virtute, facientes verbum illius, ad audiendam vocem sermonum ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Benedicite Domino, omnes virtutes ejus ; ministri ejus, qui facitis voluntatem ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Benedicite Domino, omnia opera ejus : in omni loco dominationis ejus, benedic, anima mea, Domino.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap eader\"]\na:[[\"$\",\"$L18\",\"PSA.102\",{\"bookId\":21,\"usfm\":\"PSA\",\"bookName\":\"Psalms\",\"drName\":\"Psalms\",\"chapter\":102,\"totalChapters\":150,\"dra\":[{\"verse\":1,\"text\":\"For David himself. Bless the Lord, O my soul: and let all that is within me bless his holy name.\"},{\"verse\":2,\"text\":\"Bless the Lord, O my soul, and never forget all he hath done for thee.\"},{\"verse\":3,\"text\":\"Who forgiveth all thy iniquities: who healeth all thy diseases.\"},{\"verse\":4,\"text\":\"Who redeemeth thy life from destruction: who crowneth thee with mercy and compassion.\"},{\"verse\":5,\"text\":\"Who satisfieth thy desire with good things: thy youth shall be renewed like the eagle’s.\"},{\"verse\":6,\"text\":\"The Lord doth mercies, and judgment for all that suffer wrong.\"},{\"verse\":7,\"text\":\"He hath made his ways known to Moses: his wills to the children of Israel.\"},{\"verse\":8,\"text\":\"The Lord is compassionate and merciful: longsuffering and plenteous in mercy.\"},{\"verse\":9,\"text\":\"He will not always be angry: nor will he threaten for ever.\"},{\"verse\":10,\"text\":\"He hath not dealt with us according to our sins: nor rewarded us according to our iniquities.\"},{\"verse\":11,\"text\":\"For according to the height of the heaven above the earth: he hath strengthened his mercy towards them that fear him.\"},{\"verse\":12,\"text\":\"As far as the east is from the west, so far hath he removed our iniquities from us.\"},{\"verse\":13,\"text\":\"As a father hath compassion on his children, so hath the Lord compassion on them that fear him:\"},{\"verse\":14,\"text\":\"For he knoweth our frame. He remembereth that we are dust:\"},{\"verse\":15,\"text\":\"Man’s days are as grass, as the flower of the field so shall he flourish.\"},{\"verse\":16,\"text\":\"For the spirit shall pass in him, and he shall not be: and he shall know his place no more.\"},{\"verse\":17,\"text\":\"But the mercy of the Lord is from eternity and unto eternity upon them that fear him: And his justice unto children’s children,\"},{\"verse\":18,\"text\":\"To such as keep his covenant, And are mindful of his commandments to do them.\"},{\"verse\":19,\"text\":\"The lord hath prepared his throne in heaven: and his kingdom shall rule over all.\"},{\"verse\":20,\"text\":\"Bless the Lord, all ye his angels: you that are mighty in strength, and execute his word, hearkening to the voice of his orders.\"},{\"verse\":21,\"text\":\"Bless the Lord, all ye his hosts: you ministers of his that do his will.\"},{\"verse\":22,\"text\":\"Bless the Lord, all his works: in every place of his dominion, O my soul, bless thou the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ipsi David. Benedic, anima mea, Domino, et omnia quæ intra me sunt nomini sancto ejus.\"},{\"verse\":2,\"text\":\"Benedic, anima mea, Domino, et noli oblivisci omnes retributiones ejus.\"},{\"verse\":3,\"text\":\"Qui propitiatur omnibus iniquitatibus tuis ; qui sanat omnes infirmitates tuas :\"},{\"verse\":4,\"text\":\"qui redimit de interitu vitam tuam ; qui coronat te in misericordia et miserationibus :\"},{\"verse\":5,\"text\":\"qui replet in bonis desiderium tuum ; renovabitur ut aquilæ juventus tua :\"},{\"verse\":6,\"text\":\"faciens misericordias Dominus, et judicium omnibus injuriam patientibus.\"},{\"verse\":7,\"text\":\"Notas fecit vias suas Moysi ; filiis Israël voluntates suas.\"},{\"verse\":8,\"text\":\"Miserator et misericors Dominus : longanimis, et multum misericors.\"},{\"verse\":9,\"text\":\"Non in perpetuum irascetur, neque in æternum comminabitur.\"},{\"verse\":10,\"text\":\"Non secundum peccata nostra fecit nobis, neque secundum iniquitates nostras retribuit nobis.\"},{\"verse\":11,\"text\":\"Quoniam secundum altitudinem cæli a terra, corroboravit misericordiam suam super timentes se ;\"},{\"verse\":12,\"text\":\"quantum distat ortus ab occidente, longe fecit a nobis iniquitates nostras.\"},{\"verse\":13,\"text\":\"Quomodo miseretur pater filiorum, misertus est Dominus timentibus se.\"},{\"verse\":14,\"text\":\"Quoniam ipse cognovit figmentum nostrum ; recordatus est quoniam pulvis sumus.\"},{\"verse\":15,\"text\":\"Homo, sicut fœnum dies ejus ; tamquam flos agri, sic efflorebit :\"},{\"verse\":16,\"text\":\"quoniam spiritus pertransibit in illo, et non subsistet, et non cognoscet amplius locum suum.\"},{\"verse\":17,\"text\":\"Misericordia autem Domini ab æterno, et usque in æternum super timentes eum. Et justitia illius in filios filiorum,\"},{\"verse\":18,\"text\":\"his qui servant testamentum ejus, et memores sunt mandatorum ipsius ad faciendum ea.\"},{\"verse\":19,\"text\":\"Dominus in cælo paravit sedem suam, et regnum ipsius omnibus dominabitur.\"},{\"verse\":20,\"text\":\"Benedicite Domino, omnes angeli ejus : potentes virtute, facientes verbum illius, ad audiendam vocem sermonum ejus.\"},{\"verse\":21,\"text\":\"Benedicite Domino, omnes virtutes ejus ; ministri ejus, qui facitis voluntatem ejus.\"},{\"verse\":22,\"text\":\"Benedicite Domino, omnia opera ejus : in omni loco dominationis ejus, benedic, anima mea, Domino.\"}],\"summary\":\"Benedic, anima.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":101,\"label\":\"Psalms 101\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":103,\"label\":\"Psalms 103\"}}]]\n"])</script></body></html>
