/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Psalms<!-- --> <span class="text-stone-500">105</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Confitemini Domino.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Give glory to the Lord, for he is good: for his mercy endureth for ever.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who shall declare the powers of the Lord? who shall set forth all his praises?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Blessed are they that keep judgment, and do justice at all times.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Remember us, O Lord, in the favour of thy people: visit us with thy salvation.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>That we may see the good of thy chosen, that we may rejoice in the joy of thy nation: that thou mayst be praised with thy inheritance.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>We have sinned with our fathers: we have acted unjustly, we have wrought iniquity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Our fathers understood not thy wonders in Egypt: they remembered not the multitude of thy mercies: And they provoked to wrath going up to the sea, even the Red Sea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he saved them for his own name’s sake: that he might make his power known.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he rebuked the Red Sea and it was dried up: and he led them through the depths, as in a wilderness.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he saved them from the hand of them that hated them: and he redeemed them from the hand of the enemy.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the water covered them that afflicted them: there was not one of them left.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they believed his words: and they sang his praises.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They had quickly done, they forgot his works: and they waited not for his counsel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they coveted their desire in the desert: and they tempted God in the place without water.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he gave them their request: and sent fulness into their souls.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they provoked Moses in the camp, Aaron the holy one of the Lord.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The earth opened and swallowed up Dathan: and covered the congregation of Abiron.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And a fire was kindled in their congregation: the flame burned the wicked.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They made also a calf in Horeb: and they adored the graven thing.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they changed their glory into the likeness of a calf that eateth grass.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>They forgot God, who saved them, who had done great things in Egypt,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Wondrous works in the land of Cham: terrible things in the Red Sea.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he said that he would destroy them: had not Moses his chosen stood before him in the breach: To turn away his wrath, lest he should destroy them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they set at nought the desirable land. They believed not his word,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they murmured in their tents: they hearkened not to the voice of the Lord.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he lifted up his hand over them: to overthrow them in the desert;</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And to cast down their seed among the nations, and to scatter them in the countries.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They also were initiated to Beelphegor: and ate the sacrifices of the dead.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they provoked him with their inventions: and destruction was multiplied among them.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Then Phinees stood up, and pacified him: and the slaughter ceased.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And it was reputed to him unto justice, to generation and generation for evermore.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>They provoked him also at the waters of contradiction: and Moses was afflicted for their sakes:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Because they exasperated his spirit. And he distinguished with his lips.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>They did not destroy the nations of which the Lord spoke unto them.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And they were mingled among the heathens, and learned their works:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And served their idols, and it became a stumblingblock to them.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And they sacrificed their sons, and their daughters to devils.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And they shed innocent blood: the blood of their sons and of their daughters which they sacrificed to the idols of Chanaan. And the land was polluted with blood,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And was defiled with their works: and they went aside after their own inventions.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And the Lord was exceedingly angry with his people: and he abhorred his inheritance.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And he delivered them into the hands of the nations: and they that hated them had dominion over them.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And their enemies afflicted them: and they were humbled under their hands:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Many times did he deliver them. But they provoked him with their counsel: and they were brought low by their iniquities.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he saw when they were in tribulation: and he heard their prayer.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And he was mindful of his covenant: and repented according to the multitude of his mercies.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he gave them unto mercies, in the sight of all those that had made them captives.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Save us, O Lord, our God: and gather us from among the nations: That we may give thanks to thy holy name, and may glory in thy praise.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Blessed be the Lord the God of Israel, from everlasting to everlasting: and let all the people say: So be it, so be it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quis loquetur potentias Domini ; auditas faciet omnes laudes ejus ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Beati qui custodiunt judicium, et faciunt justitiam in omni tempore.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Memento nostri, Domine, in beneplacito populi tui ; visita nos in salutari tuo :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ad videndum in bonitate electorum tuorum ; ad lætandum in lætitia gentis tuæ : ut lauderis cum hæreditate tua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Peccavimus cum patribus nostris : injuste egimus ; iniquitatem fecimus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Patres nostri in Ægypto non intellexerunt mirabilia tua ; non fuerunt memores multitudinis misericordiæ tuæ. Et irritaverunt ascendentes in mare, mare Rubrum ;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et salvavit eos propter nomen suum, ut notam faceret potentiam suam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et increpuit mare Rubrum et exsiccatum est, et deduxit eos in abyssis sicut in deserto.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et salvavit eos de manu odientium, et redemit eos de manu inimici.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et operuit aqua tribulantes eos ; unus ex eis non remansit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et crediderunt verbis ejus, et laudaverunt laudem ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cito fecerunt ; obliti sunt operum ejus : et non sustinuerunt consilium ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et concupierunt concupiscentiam in deserto, et tentaverunt Deum in inaquoso.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et dedit eis petitionem ipsorum, et misit saturitatem in animas eorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et irritaverunt Moysen in castris ; Aaron, sanctum Domini.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Aperta est terra, et deglutivit Dathan, et operuit super congregationem Abiron.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et exarsit ignis in synagoga eorum : flamma combussit peccatores.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et fecerunt vitulum in Horeb, et adoraverunt sculptile.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et mutaverunt gloriam suam in similitudinem vituli comedentis fœnum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Obliti sunt Deum qui salvavit eos ; qui fecit magnalia in Ægypto,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>mirabilia in terra Cham, terribilia in mari Rubro.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et dixit ut disperderet eos, si non Moyses, electus ejus, stetisset in confractione in conspectu ejus, ut averteret iram ejus, ne disperderet eos.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et pro nihilo habuerunt terram desiderabilem ; non crediderunt verbo ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et murmuraverunt in tabernaculis suis ; non exaudierunt vocem Domini.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et elevavit manum suam super eos ut prosterneret eos in deserto :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et ut dejiceret semen eorum in nationibus, et dispergeret eos in regionibus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et initiati sunt Beelphegor, et comederunt sacrificia mortuorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et irritaverunt eum in adinventionibus suis, et multiplicata est in eis ruina.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et stetit Phinees, et placavit, et cessavit quassatio.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et reputatum est ei in justitiam, in generationem et generationem usque in sempiternum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et irritaverunt eum ad aquas contradictionis, et vexatus est Moyses propter eos :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>quia exacerbaverunt spiritum ejus, et distinxit in labiis suis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Non disperdiderunt gentes quas dixit Dominus illis :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et commisti sunt inter gentes, et didicerunt opera eorum ;</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>et servierunt sculptilibus eorum, et factum est illis in scandalum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et immolaverunt filios suos et filias suas dæmoniis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et effuderunt sanguinem innocentem, sanguinem filiorum suorum et filiarum suarum, quas sacrificaverunt sculptilibus Chanaan. Et infecta est terra in sanguinibus,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>et contaminata est in operibus eorum : et fornicati sunt in adinventionibus suis.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et iratus est furore Dominus in populum suum, et abominatus est hæreditatem suam.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et tradidit eos in manus gentium ; et dominati sunt eorum qui oderunt eos.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et tribulaverunt eos inimici eorum, et humiliati sunt sub manibus eorum ;</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>sæpe liberavit eos. Ipsi autem exacerbaverunt eum in consilio suo, et humiliati sunt in iniquitatibus suis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et vidit cum tribularentur, et audivit orationem eorum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et memor fuit testamenti sui, et pœnituit eum secundum multitudinem misericordiæ suæ :</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>et dedit eos in misericordias, in conspectu omnium qui ceperant eos.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Salvos nos fac, Domine Deus noster, et congrega nos de nationibus : ut confiteamur nomini sancto tuo, et gloriemur in laude tua.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Benedictus Dominus Deus Israël, a sæculo et usque in sæculum ; et dicet omnis populus : Fiat, fiat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/104/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 104</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/106/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Psalms 106</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-s em from the hand of the enemy.\"},{\"verse\":11,\"text\":\"And the water covered them that afflicted them: there was not one of them left.\"},{\"verse\":12,\"text\":\"And they believed his words: and they sang his praises.\"},{\"verse\":13,\"text\":\"They had quickly done, they forgot his works: and they waited not for his counsel.\"},{\"verse\":14,\"text\":\"And they coveted their desire in the desert: and they tempted God in the place without water.\"},{\"verse\":15,\"text\":\"And he gave them their request: and sent fulness into their souls.\"},{\"verse\":16,\"text\":\"And they provoked Moses in the camp, Aaron the holy one of the Lord.\"},{\"verse\":17,\"text\":\"The earth opened and swallowed up Dathan: and covered the congregation of Abiron.\"},{\"verse\":18,\"text\":\"And a fire was kindled in their congregation: the flame burned the wicked.\"},{\"verse\":19,\"text\":\"They made also a calf in Horeb: and they adored the graven thing.\"},{\"verse\":20,\"text\":\"And they changed their glory into the likeness of a calf that eateth grass.\"},{\"verse\":21,\"text\":\"They forgot God, who saved them, who had done great things in Egypt,\"},{\"verse\":22,\"text\":\"Wondrous works in the land of Cham: terrible things in the Red Sea.\"},{\"verse\":23,\"text\":\"And he said that he would destroy them: had not Moses his chosen stood before him in the breach: To turn away his wrath, lest he should destroy them.\"},{\"verse\":24,\"text\":\"And they set at nought the desirable land. They believed not his word,\"},{\"verse\":25,\"text\":\"And they murmured in their tents: they hearkened not to the voice of the Lord.\"},{\"verse\":26,\"text\":\"And he lifted up his hand over them: to overthrow them in the desert;\"},{\"verse\":27,\"text\":\"And to cast down their seed among the nations, and to scatter them in the countries.\"},{\"verse\":28,\"text\":\"They also were initiated to Beelphegor: and ate the sacrifices of the dead.\"},{\"verse\":29,\"text\":\"And they provoked him with their inventions: and destruction was multiplied among them.\"},{\"verse\":30,\"text\":\"Then Phinees stood up, and pacified him: and the slaughter ceased.\"},{\"verse\":31,\"text\":\"And it was reputed to him unto justice, to generation and generation for evermore.\"},{\"verse\":32,\"text\":\"They provoked him also at the waters of contradiction: and Moses was afflicted for their sakes:\"},{\"verse\":33,\"text\":\"Because they exasperated his spirit. And he distinguished with his lips.\"},{\"verse\":34,\"text\":\"They did not destroy the nations of which the Lord spoke unto them.\"},{\"verse\":35,\"text\":\"And they were mingled among the heathens, and learned their works:\"},{\"verse\":36,\"text\":\"And served their idols, and it became a stumblingblock to them.\"},{\"verse\":37,\"text\":\"And they sacrificed their sons, and their daughters to devils.\"},{\"verse\":38,\"text\":\"And they shed innocent blood: the blood of their sons and of their daughters which they sacrificed to the idols of Chanaan. And the land was polluted with blood,\"},{\"verse\":39,\"text\":\"And was defiled with their works: and they went aside after their own inventions.\"},{\"verse\":40,\"text\":\"And the Lord was exceedingly angry with his people: and he abhorred his inheritance.\"},{\"verse\":41,\"text\":\"And he delivered them into the hands of the nations: and they that hated them had dominion over them.\"},{\"verse\":42,\"text\":\"And their enemies afflicted them: and they were humbled under their hands:\"},{\"verse\":43,\"text\":\"Many times did he deliver them. But they provoked him with their counsel: and they were brought low by their iniquities.\"},{\"verse\":44,\"text\":\"And he saw when they were in tribulation: and he heard their prayer.\"},{\"verse\":45,\"text\":\"And he was mindful of his covenant: and repented according to the multitude of his mercies.\"},{\"verse\":46,\"text\":\"And he gave them unto mercies, in the sight of all those that had made them captives.\"},{\"verse\":47,\"text\":\"Save us, O Lord, our God: and gather us from among the nations: That we may give thanks to thy holy name, and may glory in thy praise.\"},{\"verse\":48,\"text\":\"Blessed be the Lord the God of Israel, from everlasting to everlasting: and let all the people say: So be it, so be it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Alleluja. Confitemini Domino, quoniam bonus, quoniam in sæculum misericordia ejus.\"},{\"verse\":2,\"text\":\"Quis loquetur potentias Domini ; auditas faciet omnes laudes ejus ?\"},{\"verse\":3,\"text\":\"Beati qui custodiunt judicium, et faciunt justitiam in omni tempore.\"},{\"verse\":4,\"text\":\"Memento nostri, Domine, in beneplacito populi tui ; visita nos in salutari tuo :\"},{\"verse\":5,\"text\":\"ad videndum in bonitate electorum tuorum ; ad lætandum in lætitia gentis tuæ : ut lauderis cum hæreditate tua.\"},{\"verse\":6,\"text\":\"Peccavimus cum patribus nostris : injuste egimus ; iniquitatem fecimus.\"},{\"verse\":7,\"text\":\"Patres nostri in Ægypto non intellexerunt mirabilia tua ; non fuerunt memores multitudinis misericordiæ tuæ. Et irritaverunt ascendentes in mare, mare Rubrum ;\"},{\"verse\":8,\"text\":\"et salvavit eos propter nomen suum, ut notam faceret potentiam suam.\"},{\"verse\":9,\"text\":\"Et increpuit mare Rubrum et exsiccatum est, et deduxit eos in abyssis sicut in deserto.\"},{\"verse\":10,\"text\":\"Et salvavit eos de manu odientium, et redemit eos de manu inimici.\"},{\"verse\":11,\"text\":\"Et operuit aqua tribulantes eos ; unus ex eis non remansit.\"},{\"verse\":12,\"text\":\"Et crediderunt verbis ejus, et laudaverunt laudem ejus.\"},{\"verse\":13,\"text\":\"Cito fecerunt ; obliti sunt operum ejus : et non sustinuerunt consilium ejus.\"},{\"verse\":14,\"text\":\"Et concupierunt concupiscentiam in deserto, et tentaverunt Deum in inaquoso.\"},{\"verse\":15,\"text\":\"Et dedit eis petitionem ipsorum, et misit saturitatem in animas eorum.\"},{\"verse\":16,\"text\":\"Et irritaverunt Moysen in castris ; Aaron, sanctum Domini.\"},{\"verse\":17,\"text\":\"Aperta est terra, et deglutivit Dathan, et operuit super congregationem Abiron.\"},{\"verse\":18,\"text\":\"Et exarsit ignis in synagoga eorum : flamma combussit peccatores.\"},{\"verse\":19,\"text\":\"Et fecerunt vitulum in Horeb, et adoraverunt sculptile.\"},{\"verse\":20,\"text\":\"Et mutaverunt gloriam suam in similitudinem vituli comedentis fœnum.\"},{\"verse\":21,\"text\":\"Obliti sunt Deum qui salvavit eos ; qui fecit magnalia in Ægypto,\"},{\"verse\":22,\"text\":\"mirabilia in terra Cham, terribilia in mari Rubro.\"},{\"verse\":23,\"text\":\"Et dixit ut disperderet eos, si non Moyses, electus ejus, stetisset in confractione in conspectu ejus, ut averteret iram ejus, ne disperderet eos.\"},{\"verse\":24,\"text\":\"Et pro nihilo habuerunt terram desiderabilem ; non crediderunt verbo ejus.\"},{\"verse\":25,\"text\":\"Et murmuraverunt in tabernaculis suis ; non exaudierunt vocem Domini.\"},{\"verse\":26,\"text\":\"Et elevavit manum suam super eos ut prosterneret eos in deserto :\"},{\"verse\":27,\"text\":\"et ut dejiceret semen eorum in nationibus, et dispergeret eos in regionibus.\"},{\"verse\":28,\"text\":\"Et initiati sunt Beelphegor, et comederunt sacrificia mortuorum.\"},{\"verse\":29,\"text\":\"Et irritaverunt eum in adinventionibus suis, et multiplicata est in eis ruina.\"},{\"verse\":30,\"text\":\"Et stetit Phinees, et placavit, et cessavit quassatio.\"},{\"verse\":31,\"text\":\"Et reputatum est ei in justitiam, in generationem et generationem usque in sempiternum.\"},{\"verse\":32,\"text\":\"Et irritaverunt eum ad aquas contradictionis, et vexatus est Moyses propter eos :\"},{\"verse\":33,\"text\":\"quia exacerbaverunt spiritum ejus, et distinxit in labiis suis.\"},{\"verse\":34,\"text\":\"Non disperdiderunt gentes quas dixit Dominus illis :\"},{\"verse\":35,\"text\":\"et commisti sunt inter gentes, et didicerunt opera eorum ;\"},{\"verse\":36,\"text\":\"et servierunt sculptilibus eorum, et factum est illis in scandalum.\"},{\"verse\":37,\"text\":\"Et immolaverunt filios suos et filias suas dæmoniis.\"},{\"verse\":38,\"text\":\"Et effuderunt sanguinem innocentem, sanguinem filiorum suorum et filiarum suarum, quas sacrificaverunt sculptilibus Chanaan. Et infecta est terra in sanguinibus,\"},{\"verse\":39,\"text\":\"et contaminata est in operibus eorum : et fornicati sunt in adinventionibus suis.\"},{\"verse\":40,\"text\":\"Et iratus est furore Dominus in populum suum, et abominatus est hæreditatem suam.\"},{\"verse\":41,\"text\":\"Et tradidit eos in manus gentium ; et dominati sunt eorum qui oderunt eos.\"},{\"verse\":42,\"text\":\"Et tribulaverunt eos inimici eorum, et humiliati sunt sub manibus eorum ;\"},{\"verse\":43,\"text\":\"sæpe liberavit eos. Ipsi autem exacerbaverunt eum in consilio suo, et humiliati sunt in iniquitatibus suis.\"},{\"verse\":44,\"text\":\"Et vidit cum tribularentur, et audivit orationem eorum.\"},{\"verse\":45,\"text\":\"Et memor fuit testamenti sui, et pœnituit eum secundum multitudinem misericordiæ suæ :\"},{\"verse\":46,\"text\":\"et dedit eos in misericordias, in conspectu omnium qui ceperant eos.\"},{\"verse\":47,\"text\":\"Salvos nos fac, Domine Deus noster, et congrega nos de nationibus : ut confiteamur nomini sancto tuo, et gloriemur in laude tua.\"},{\"verse\":48,\"text\":\"Benedictus Dominus Deus Israël, a sæculo et usque in sæculum ; et dicet omnis populus : Fiat, fiat.\"}],\"summary\":\"Confitemini Domino.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":104,\"label\":\"Psalms 104\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":106,\"label\":\"Psalms 106\"}}]]\n"])</script></body></html>
