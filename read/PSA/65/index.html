ata-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end, a canticle of a psalm of the resurrection. Shout with joy to God, all the earth,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sing ye a psalm to his name; give glory to his praise.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Say unto God, How terrible are thy works, O Lord! in the multitude of thy strength thy enemies shall lie to thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let all the earth adore thee, and sing to thee: let it sing a psalm to thy name.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Come and see the works of God; who is terrible in his counsels over the sons of men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who turneth the sea into dry land, in the river they shall pass on foot: there shall we rejoice in him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Who by his power ruleth for ever: his eyes behold the nations; let not them that provoke him be exalted in themselves.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>O bless our God, ye Gentiles: and make the voice of his praise to be heard.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who hath set my soul to live: and hath not suffered my feet to be moved:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For thou, O God, hast proved us: thou hast tried us by fire, as silver is tried.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou hast brought us into a net, thou hast laid afflictions on our back:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou hast set men over our heads. We have passed through fire and water, and thou hast brought us out into a refreshment.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I will go into thy house with burnt offerings: I will pay thee my vows,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Which my lips have uttered, And my mouth hath spoken, when I was in trouble.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I will offer up to thee holocausts full of marrow, with burnt offerings of rams: I will offer to thee bullocks with goats.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Come and hear, all ye that fear God, and I will tell you what great things he hath done for my soul.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I cried to him with my mouth: and I extolled him with my tongue.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If I have looked at iniquity in my heart, the Lord will not hear me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Therefore hath God heard me, and hath attended to the voice of my supplication.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Blessed be God, who hath not turned away my prayer, nor his mercy from me.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Canticum psalmi resurrectionis. Jubilate Deo, omnis terra ;</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>psalmum dicite nomini ejus ; date gloriam laudi ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dicite Deo : Quam terribilia sunt opera tua, Domine ! in multitudine virtutis tuæ mentientur tibi inimici tui.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Omnis terra adoret te, et psallat tibi ; psalmum dicat nomini tuo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Venite, et videte opera Dei : terribilis in consiliis super filios hominum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui convertit mare in aridam ; in flumine pertransibunt pede : ibi lætabimur in ipso.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui dominatur in virtute sua in æternum ; oculi ejus super gentes respiciunt : qui exasperant non exaltentur in semetipsis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Benedicite, gentes, Deum nostrum, et auditam facite vocem laudis ejus :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>qui posuit animam meam ad vitam, et non dedit in commotionem pedes meos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quoniam probasti nos, Deus ; igne nos examinasti, sicut examinatur argentum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Induxisti nos in laqueum ; posuisti tribulationes in dorso nostro ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>imposuisti homines super capita nostra. Transivimus per ignem et aquam, et eduxisti nos in refrigerium.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Introibo in domum tuam in holocaustis ; reddam tibi vota mea</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quæ distinxerunt labia mea : et locutum est os meum in tribulatione mea.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Holocausta medullata offeram tibi, cum incenso arietum ; offeram tibi boves cum hircis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Venite, audite, et narrabo, omnes qui timetis Deum, quanta fecit animæ meæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ad ipsum ore meo clamavi, et exaltavi sub lingua mea.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Iniquitatem si aspexi in corde meo, non exaudiet Dominus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Propterea exaudivit Deus, et attendit voci deprecationis meæ.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Benedictus Deus, qui non amovit orationem meam, et misericordiam suam a me.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/64/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Psalms 64</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/66/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-5 foot: there shall we rejoice in him.\"},{\"verse\":7,\"text\":\"Who by his power ruleth for ever: his eyes behold the nations; let not them that provoke him be exalted in themselves.\"},{\"verse\":8,\"text\":\"O bless our God, ye Gentiles: and make the voice of his praise to be heard.\"},{\"verse\":9,\"text\":\"Who hath set my soul to live: and hath not suffered my feet to be moved:\"},{\"verse\":10,\"text\":\"For thou, O God, hast proved us: thou hast tried us by fire, as silver is tried.\"},{\"verse\":11,\"text\":\"Thou hast brought us into a net, thou hast laid afflictions on our back:\"},{\"verse\":12,\"text\":\"Thou hast set men over our heads. We have passed through fire and water, and thou hast brought us out into a refreshment.\"},{\"verse\":13,\"text\":\"I will go into thy house with burnt offerings: I will pay thee my vows,\"},{\"verse\":14,\"text\":\"Which my lips have uttered, And my mouth hath spoken, when I was in trouble.\"},{\"verse\":15,\"text\":\"I will offer up to thee holocausts full of marrow, with burnt offerings of rams: I will offer to thee bullocks with goats.\"},{\"verse\":16,\"text\":\"Come and hear, all ye that fear God, and I will tell you what great things he hath done for my soul.\"},{\"verse\":17,\"text\":\"I cried to him with my mouth: and I extolled him with my tongue.\"},{\"verse\":18,\"text\":\"If I have looked at iniquity in my heart, the Lord will not hear me.\"},{\"verse\":19,\"text\":\"Therefore hath God heard me, and hath attended to the voice of my supplication.\"},{\"verse\":20,\"text\":\"Blessed be God, who hath not turned away my prayer, nor his mercy from me.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Canticum psalmi resurrectionis. Jubilate Deo, omnis terra ;\"},{\"verse\":2,\"text\":\"psalmum dicite nomini ejus ; date gloriam laudi ejus.\"},{\"verse\":3,\"text\":\"Dicite Deo : Quam terribilia sunt opera tua, Domine ! in multitudine virtutis tuæ mentientur tibi inimici tui.\"},{\"verse\":4,\"text\":\"Omnis terra adoret te, et psallat tibi ; psalmum dicat nomini tuo.\"},{\"verse\":5,\"text\":\"Venite, et videte opera Dei : terribilis in consiliis super filios hominum.\"},{\"verse\":6,\"text\":\"Qui convertit mare in aridam ; in flumine pertransibunt pede : ibi lætabimur in ipso.\"},{\"verse\":7,\"text\":\"Qui dominatur in virtute sua in æternum ; oculi ejus super gentes respiciunt : qui exasperant non exaltentur in semetipsis.\"},{\"verse\":8,\"text\":\"Benedicite, gentes, Deum nostrum, et auditam facite vocem laudis ejus :\"},{\"verse\":9,\"text\":\"qui posuit animam meam ad vitam, et non dedit in commotionem pedes meos.\"},{\"verse\":10,\"text\":\"Quoniam probasti nos, Deus ; igne nos examinasti, sicut examinatur argentum.\"},{\"verse\":11,\"text\":\"Induxisti nos in laqueum ; posuisti tribulationes in dorso nostro ;\"},{\"verse\":12,\"text\":\"imposuisti homines super capita nostra. Transivimus per ignem et aquam, et eduxisti nos in refrigerium.\"},{\"verse\":13,\"text\":\"Introibo in domum tuam in holocaustis ; reddam tibi vota mea\"},{\"verse\":14,\"text\":\"quæ distinxerunt labia mea : et locutum est os meum in tribulatione mea.\"},{\"verse\":15,\"text\":\"Holocausta medullata offeram tibi, cum incenso arietum ; offeram tibi boves cum hircis.\"},{\"verse\":16,\"text\":\"Venite, audite, et narrabo, omnes qui timetis Deum, quanta fecit animæ meæ.\"},{\"verse\":17,\"text\":\"Ad ipsum ore meo clamavi, et exaltavi sub lingua mea.\"},{\"verse\":18,\"text\":\"Iniquitatem si aspexi in corde meo, non exaudiet Dominus.\"},{\"verse\":19,\"text\":\"Propterea exaudivit Deus, et attendit voci deprecationis meæ.\"},{\"verse\":20,\"text\":\"Benedictus Deus, qui non amovit orationem meam, et misericordiam suam a me.\"}],\"summary\":\"Jubilate Deo.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":64,\"label\":\"Psalms 64\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":66,\"label\":\"Psalms 66\"}}]]\n"])</script></body></html>
