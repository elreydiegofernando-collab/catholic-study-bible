 data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Unto the end. A Psalm for David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The heavens shew forth the glory of God, and the firmament declareth the work of his hands.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Day to day uttereth speech, and night to night sheweth knowledge.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>There are no speeches nor languages, where their voices are not heard.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Their sound hath gone forth into all the earth: and their words unto the ends of the world.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He hath set his tabernacle in the sun: and he as a bridegroom coming out of his bridechamber, Hath rejoiced as a giant to run the way:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>His going out is from the end of heaven, And his circuit even to the end thereof: and there is no one that can hide himself from his heat.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The law of the Lord is unspotted, converting souls: the testimony of the Lord is faithful, giving wisdom to little ones.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The justices of the Lord are right, rejoicing hearts: the commandment of the Lord is lightsome, enlightening the eyes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The fear of the Lord is holy, enduring for ever and ever: the judgments of the Lord are true, justified in themselves.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>More to be desired than gold and many precious stones: and sweeter than honey and the honeycomb.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For thy servant keepeth them, and in keeping them there is a great reward.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who can understand sins? from my secret ones cleanse me, O Lord:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And from those of others spare thy servant. If they shall have no dominion over me, then shall I be without spot: and I shall be cleansed from the greatest sin.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the words of my mouth shall be such as may please: and the meditation of my heart always in thy sight. O Lord, my helper and my Redeemer.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In finem. Psalmus David.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cæli enarrant gloriam Dei, et opera manuum ejus annuntiat firmamentum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dies diei eructat verbum, et nox nocti indicat scientiam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non sunt loquelæ, neque sermones, quorum non audiantur voces eorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In omnem terram exivit sonus eorum, et in fines orbis terræ verba eorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In sole posuit tabernaculum suum ; et ipse tamquam sponsus procedens de thalamo suo. Exsultavit ut gigas ad currendam viam ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>a summo cælo egressio ejus. Et occursus ejus usque ad summum ejus ; nec est qui se abscondat a calore ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Lex Domini immaculata, convertens animas ; testimonium Domini fidele, sapientiam præstans parvulis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Justitiæ Domini rectæ, lætificantes corda ; præceptum Domini lucidum, illuminans oculos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Timor Domini sanctus, permanens in sæculum sæculi ; judicia Domini vera, justificata in semetipsa,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>desiderabilia super aurum et lapidem pretiosum multum, et dulciora super mel et favum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Etenim servus tuus custodit ea ; in custodiendis illis retributio multa.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Delicta quis intelligit ? ab occultis meis munda me ;</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et ab alienis parce servo tuo. Si mei non fuerint dominati, tunc immaculatus ero, et emundabor a delicto maximo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et erunt ut complaceant eloquia oris mei, et meditatio cordis mei in conspectu tuo semper. Domine, adjutor meus, et redemptor meus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" "verse\":2,\"text\":\"The heavens shew forth the glory of God, and the firmament declareth the work of his hands.\"},{\"verse\":3,\"text\":\"Day to day uttereth speech, and night to night sheweth knowledge.\"},{\"verse\":4,\"text\":\"There are no speeches nor languages, where their voices are not heard.\"},{\"verse\":5,\"text\":\"Their sound hath gone forth into all the earth: and their words unto the ends of the world.\"},{\"verse\":6,\"text\":\"He hath set his tabernacle in the sun: and he as a bridegroom coming out of his bridechamber, Hath rejoiced as a giant to run the way:\"},{\"verse\":7,\"text\":\"His going out is from the end of heaven, And his circuit even to the end thereof: and there is no one that can hide himself from his heat.\"},{\"verse\":8,\"text\":\"The law of the Lord is unspotted, converting souls: the testimony of the Lord is faithful, giving wisdom to little ones.\"},{\"verse\":9,\"text\":\"The justices of the Lord are right, rejoicing hearts: the commandment of the Lord is lightsome, enlightening the eyes.\"},{\"verse\":10,\"text\":\"The fear of the Lord is holy, enduring for ever and ever: the judgments of the Lord are true, justified in themselves.\"},{\"verse\":11,\"text\":\"More to be desired than gold and many precious stones: and sweeter than honey and the honeycomb.\"},{\"verse\":12,\"text\":\"For thy servant keepeth them, and in keeping them there is a great reward.\"},{\"verse\":13,\"text\":\"Who can understand sins? from my secret ones cleanse me, O Lord:\"},{\"verse\":14,\"text\":\"And from those of others spare thy servant. If they shall have no dominion over me, then shall I be without spot: and I shall be cleansed from the greatest sin.\"},{\"verse\":15,\"text\":\"And the words of my mouth shall be such as may please: and the meditation of my heart always in thy sight. O Lord, my helper and my Redeemer.\"}],\"vul\":[{\"verse\":1,\"text\":\"In finem. Psalmus David.\"},{\"verse\":2,\"text\":\"Cæli enarrant gloriam Dei, et opera manuum ejus annuntiat firmamentum.\"},{\"verse\":3,\"text\":\"Dies diei eructat verbum, et nox nocti indicat scientiam.\"},{\"verse\":4,\"text\":\"Non sunt loquelæ, neque sermones, quorum non audiantur voces eorum.\"},{\"verse\":5,\"text\":\"In omnem terram exivit sonus eorum, et in fines orbis terræ verba eorum.\"},{\"verse\":6,\"text\":\"In sole posuit tabernaculum suum ; et ipse tamquam sponsus procedens de thalamo suo. Exsultavit ut gigas ad currendam viam ;\"},{\"verse\":7,\"text\":\"a summo cælo egressio ejus. Et occursus ejus usque ad summum ejus ; nec est qui se abscondat a calore ejus.\"},{\"verse\":8,\"text\":\"Lex Domini immaculata, convertens animas ; testimonium Domini fidele, sapientiam præstans parvulis.\"},{\"verse\":9,\"text\":\"Justitiæ Domini rectæ, lætificantes corda ; præceptum Domini lucidum, illuminans oculos.\"},{\"verse\":10,\"text\":\"Timor Domini sanctus, permanens in sæculum sæculi ; judicia Domini vera, justificata in semetipsa,\"},{\"verse\":11,\"text\":\"desiderabilia super aurum et lapidem pretiosum multum, et dulciora super mel et favum.\"},{\"verse\":12,\"text\":\"Etenim servus tuus custodit ea ; in custodiendis illis retributio multa.\"},{\"verse\":13,\"text\":\"Delicta quis intelligit ? ab occultis meis munda me ;\"},{\"verse\":14,\"text\":\"et ab alienis parce servo tuo. Si mei non fuerint dominati, tunc immaculatus ero, et emundabor a delicto maximo.\"},{\"verse\":15,\"text\":\"Et erunt ut complaceant eloquia oris mei, et meditatio cordis mei in conspectu tuo semper. Domine, adjutor meus, et redemptor meus.\"}],\"summary\":\"Coeli enarrant.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":17,\"label\":\"Psalms 17\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":19,\"label\":\"Psalms 19\"}}]]\n"])</script></body></html>
