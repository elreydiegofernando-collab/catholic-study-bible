" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A psalm for David. Rejoice in the Lord, O ye just: praise becometh the upright.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Give praise to the Lord on the harp; sing to him with the psaltery, the instrument of ten strings.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sing to him a new canticle, sing well unto him with a loud noise.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For the word of the Lord is right, and all his works are done with faithfulness.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He loveth mercy and judgment; the earth is full of the mercy of the Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>By the word of the Lord the heavens were established; and all the power of them by the spirit of his mouth:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Gathering together the waters of the sea, as in a vessel; laying up the depths in storehouses.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let all the earth fear the Lord, and let all the inhabitants of the world be in awe of him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For he spoke and they were made: he commanded and they were created.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The Lord bringeth to nought the counsels of nations; and he rejecteth the devices of people, and casteth away the counsels of princes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the counsel of the Lord standeth for ever: the thoughts of his heart to all generations.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Blessed is the nation whose God is the Lord: the people whom he hath chosen for his inheritance.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The Lord hath looked from heaven: he hath beheld all the sons of men.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>From his habitation which he hath prepared, he hath looked upon all that dwell on the earth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He who hath made the hearts of every one of them: who understandeth all their works.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The king is not saved by a great army: nor shall the giant be saved by his own great strength.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vain is the horse for safety: neither shall he be saved by the abundance of his strength.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Behold the eyes of the Lord are on them that fear him: and on them that hope in his mercy.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To deliver their souls from death; and feed them in famine.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Our soul waiteth for the Lord: for he is our helper and protector.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For in him our heart shall rejoice: and in his holy name we have trusted.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Let thy mercy, O Lord, be upon us, as we have hoped in thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Psalmus David. Exsultate, justi, in Domino ; rectos decet collaudatio.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Confitemini Domino in cithara ; in psalterio decem chordarum psallite illi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cantate ei canticum novum ; bene psallite ei in vociferatione.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia rectum est verbum Domini, et omnia opera ejus in fide.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Diligit misericordiam et judicium ; misericordia Domini plena est terra.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Verbo Domini cæli firmati sunt, et spiritu oris ejus omnis virtus eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Congregans sicut in utre aquas maris ; ponens in thesauris abyssos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Timeat Dominum omnis terra ; ab eo autem commoveantur omnes inhabitantes orbem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quoniam ipse dixit, et facta sunt ; ipse mandavit et creata sunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dominus dissipat consilia gentium ; reprobat autem cogitationes populorum, et reprobat consilia principum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Consilium autem Domini in æternum manet ; cogitationes cordis ejus in generatione et generationem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Beata gens cujus est Dominus Deus ejus ; populus quem elegit in hæreditatem sibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>De cælo respexit Dominus ; vidit omnes filios hominum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>De præparato habitaculo suo respexit super omnes qui habitant terram :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui finxit sigillatim corda eorum ; qui intelligit omnia opera eorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non salvatur rex per multam virtutem, et gigas non salvabitur in multitudine virtutis suæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fallax equus ad salutem ; in abundantia autem virtutis suæ non salvabitur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ecce oculi Domini super metuentes eum, et in eis qui sperant super misericordia ejus :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>ut eruat a morte animas eorum, et alat eos in fame.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Anima nostra sustinet Dominum, quoniam adjutor et protector noster est.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quia in eo lætabitur cor nostrum, et in nomine sancto ejus speravimus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fiat misericordia tua, Domine, super nos, quemadmodum speravimus in te.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PSA/31/"><svg viewBox="0 0 24 24" fill="none" stroke="curren vid. Rejoice in the Lord, O ye just: praise becometh the upright.\"},{\"verse\":2,\"text\":\"Give praise to the Lord on the harp; sing to him with the psaltery, the instrument of ten strings.\"},{\"verse\":3,\"text\":\"Sing to him a new canticle, sing well unto him with a loud noise.\"},{\"verse\":4,\"text\":\"For the word of the Lord is right, and all his works are done with faithfulness.\"},{\"verse\":5,\"text\":\"He loveth mercy and judgment; the earth is full of the mercy of the Lord.\"},{\"verse\":6,\"text\":\"By the word of the Lord the heavens were established; and all the power of them by the spirit of his mouth:\"},{\"verse\":7,\"text\":\"Gathering together the waters of the sea, as in a vessel; laying up the depths in storehouses.\"},{\"verse\":8,\"text\":\"Let all the earth fear the Lord, and let all the inhabitants of the world be in awe of him.\"},{\"verse\":9,\"text\":\"For he spoke and they were made: he commanded and they were created.\"},{\"verse\":10,\"text\":\"The Lord bringeth to nought the counsels of nations; and he rejecteth the devices of people, and casteth away the counsels of princes.\"},{\"verse\":11,\"text\":\"But the counsel of the Lord standeth for ever: the thoughts of his heart to all generations.\"},{\"verse\":12,\"text\":\"Blessed is the nation whose God is the Lord: the people whom he hath chosen for his inheritance.\"},{\"verse\":13,\"text\":\"The Lord hath looked from heaven: he hath beheld all the sons of men.\"},{\"verse\":14,\"text\":\"From his habitation which he hath prepared, he hath looked upon all that dwell on the earth.\"},{\"verse\":15,\"text\":\"He who hath made the hearts of every one of them: who understandeth all their works.\"},{\"verse\":16,\"text\":\"The king is not saved by a great army: nor shall the giant be saved by his own great strength.\"},{\"verse\":17,\"text\":\"Vain is the horse for safety: neither shall he be saved by the abundance of his strength.\"},{\"verse\":18,\"text\":\"Behold the eyes of the Lord are on them that fear him: and on them that hope in his mercy.\"},{\"verse\":19,\"text\":\"To deliver their souls from death; and feed them in famine.\"},{\"verse\":20,\"text\":\"Our soul waiteth for the Lord: for he is our helper and protector.\"},{\"verse\":21,\"text\":\"For in him our heart shall rejoice: and in his holy name we have trusted.\"},{\"verse\":22,\"text\":\"Let thy mercy, O Lord, be upon us, as we have hoped in thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Psalmus David. Exsultate, justi, in Domino ; rectos decet collaudatio.\"},{\"verse\":2,\"text\":\"Confitemini Domino in cithara ; in psalterio decem chordarum psallite illi.\"},{\"verse\":3,\"text\":\"Cantate ei canticum novum ; bene psallite ei in vociferatione.\"},{\"verse\":4,\"text\":\"Quia rectum est verbum Domini, et omnia opera ejus in fide.\"},{\"verse\":5,\"text\":\"Diligit misericordiam et judicium ; misericordia Domini plena est terra.\"},{\"verse\":6,\"text\":\"Verbo Domini cæli firmati sunt, et spiritu oris ejus omnis virtus eorum.\"},{\"verse\":7,\"text\":\"Congregans sicut in utre aquas maris ; ponens in thesauris abyssos.\"},{\"verse\":8,\"text\":\"Timeat Dominum omnis terra ; ab eo autem commoveantur omnes inhabitantes orbem.\"},{\"verse\":9,\"text\":\"Quoniam ipse dixit, et facta sunt ; ipse mandavit et creata sunt.\"},{\"verse\":10,\"text\":\"Dominus dissipat consilia gentium ; reprobat autem cogitationes populorum, et reprobat consilia principum.\"},{\"verse\":11,\"text\":\"Consilium autem Domini in æternum manet ; cogitationes cordis ejus in generatione et generationem.\"},{\"verse\":12,\"text\":\"Beata gens cujus est Dominus Deus ejus ; populus quem elegit in hæreditatem sibi.\"},{\"verse\":13,\"text\":\"De cælo respexit Dominus ; vidit omnes filios hominum.\"},{\"verse\":14,\"text\":\"De præparato habitaculo suo respexit super omnes qui habitant terram :\"},{\"verse\":15,\"text\":\"qui finxit sigillatim corda eorum ; qui intelligit omnia opera eorum.\"},{\"verse\":16,\"text\":\"Non salvatur rex per multam virtutem, et gigas non salvabitur in multitudine virtutis suæ.\"},{\"verse\":17,\"text\":\"Fallax equus ad salutem ; in abundantia autem virtutis suæ non salvabitur.\"},{\"verse\":18,\"text\":\"Ecce oculi Domini super metuentes eum, et in eis qui sperant super misericordia ejus :\"},{\"verse\":19,\"text\":\"ut eruat a morte animas eorum, et alat eos in fame.\"},{\"verse\":20,\"text\":\"Anima nostra sustinet Dominum, quoniam adjutor et protector noster est.\"},{\"verse\":21,\"text\":\"Quia in eo lætabitur cor nostrum, et in nomine sancto ejus speravimus.\"},{\"verse\":22,\"text\":\"Fiat misericordia tua, Domine, super nos, quemadmodum speravimus in te.\"}],\"summary\":\"Exultate, justi.\",\"intro\":null,\"prev\":{\"usfm\":\"PSA\",\"chapter\":31,\"label\":\"Psalms 31\"},\"next\":{\"usfm\":\"PSA\",\"chapter\":33,\"label\":\"Psalms 33\"}}]]\n"])</script></body></html>
