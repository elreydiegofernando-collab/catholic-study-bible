jaws.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>My words are from my upright heart, and my lips shall speak a pure sentence.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The spirit of God made me, and the breath of the Almighty gave me life.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If thou canst, answer me, and stand up against my face.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Behold God hath made me as well as thee, and of the same clay I also was formed.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But yet let not my wonder terrify thee, and let not my eloquence be burdensome to thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Now thou hast said in my hearing, and I have heard the voice of thy words:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I am clean, and without sin: I am unspotted, and there is no iniquity in me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Because he hath found complaints against me, therefore he hath counted me for his enemy.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He hath put my feet in the stocks, he hath observed all my paths.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now this is the thing in which thou art not justified: I will answer thee, that God is greater than man.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dost thou strive against him, because he hath not answered thee to all words?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>God speaketh once, and repeateth not the selfsame thing the second time.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>By a dream in a vision by night, when deep sleep falleth upon men, and they are sleeping in their beds:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then he openeth the ears of men, and teaching instructeth them in what they are to learn.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>That he may withdraw a man from the things he is doing, and may deliver him from pride.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Rescuing his soul from corruption: and his life from passing to the sword.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He rebuketh also by sorrow in the bed, and he maketh all his bones to wither.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Bread becometh abominable to him in his life, and to his soul the meat which before he desired.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>His flesh shall be consumed away, and his bones that were covered shall be made bare.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>His soul hath drawn near to corruption, and his life to the destroyers.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If there shall be an angel speaking for him, one among thousands, to declare man’s uprightness,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He shall have mercy on him, and shall say: Deliver him, that he may not go down to corruption: I have found wherein I may be merciful to him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>His flesh is consumed with punishments, let him return to the days of his youth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He shall pray to God, and he will be gracious to him: and he shall see his face with joy, and he will render to man his justice.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He shall look upon men, and shall say: I have sinned, and indeed I have offended, and I have not received what I have deserved.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He hath delivered his soul from going into destruction, that it may live and see the light.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Behold, all these things God worketh three times within every one.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>That he may withdraw their souls from corruption, and enlighten them with the light of the living.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Attend, Job, and hearken to me, and hold thy peace, whilst I speak.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But if thou hast any thing to say, answer me, speak: for I would have thee to appear just.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And if thou have not, hear me: hold thy peace, and I will teach thee wisdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audi igitur, Job, eloquia mea, et omnes sermones meos ausculta.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ecce aperui os meum : loquatur lingua mea in faucibus meis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Simplici corde meo sermones mei, et sententiam puram labia mea loquentur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Spiritus Dei fecit me, et spiraculum Omnipotentis vivificavit me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si potes, responde mihi, et adversus faciem meam consiste.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ecce, et me sicut et te fecit Deus, et de eodem luto ego quoque formatus sum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Verumtamen miraculum meum non te terreat, et eloquentia mea non sit tibi gravis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixisti ergo in auribus meis, et vocem verborum tuorum audivi :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Mundus sum ego, et absque delicto : immaculatus, et non est iniquitas in me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quia querelas in me reperit, ideo arbitratus est me inimicum sibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Posuit in nervo pedes meos ; custodivit omnes semitas meas.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hoc est ergo in quo non es justificatus : respondebo tibi, quia major sit Deus homine.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Adversus eum contendis, quod non ad omnia verba responderit tibi ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Semel loquitur Deus, et secundo idipsum non repetit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Per somnium, in visione nocturna, quando irruit sopor super homines, et dormiunt in lectulo,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>tunc aperit aures virorum, et erudiens eos instruit disciplina,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>ut avertat hominem ab his quæ facit, et liberet eum de superbia,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>eruens animam ejus a corruptione, et vitam illius ut non transeat in gladium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Increpat quoque per dolorem in lectulo, et omnia ossa ejus marcescere facit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Abominabilis ei fit in vita sua panis, et animæ illius cibus ante desiderabilis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tabescet caro ejus, et ossa, quæ tecta fuerant, nudabuntur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Appropinquavit corruptioni anima ejus, et vita illius mortiferis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si fuerit pro eo angelus loquens, unus de millibus, ut annuntiet hominis æquitatem,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>miserebitur ejus, et dicet : Libera eum, ut non descendat in corruptionem : inveni in quo ei propitier.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Consumpta est caro ejus a suppliciis : revertatur ad dies adolescentiæ suæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Deprecabitur Deum, et placabilis ei erit : et videbit faciem ejus in jubilo, et reddet homini justitiam suam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Respiciet homines, et dicet : Peccavi, et vere deliqui, et ut eram dignus, non recepi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Liberavit animam suam, ne pergeret in interitum, sed vivens lucem videret.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ecce hæc omnia operatur Deus tribus vicibus per singulos,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>ut revocet animas eorum a corruptione, et illuminet luce viventium.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Attende, Job, et audi me : et tace, dum ego loquor.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Si autem habes quod loquaris, responde mihi : loquere, volo enim te apparere justum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quod si non habes, audi me : tace, et docebo te sapientiam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/32/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 32</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/  of thy words:\"},{\"verse\":9,\"text\":\"I am clean, and without sin: I am unspotted, and there is no iniquity in me.\"},{\"verse\":10,\"text\":\"Because he hath found complaints against me, therefore he hath counted me for his enemy.\"},{\"verse\":11,\"text\":\"He hath put my feet in the stocks, he hath observed all my paths.\"},{\"verse\":12,\"text\":\"Now this is the thing in which thou art not justified: I will answer thee, that God is greater than man.\"},{\"verse\":13,\"text\":\"Dost thou strive against him, because he hath not answered thee to all words?\"},{\"verse\":14,\"text\":\"God speaketh once, and repeateth not the selfsame thing the second time.\"},{\"verse\":15,\"text\":\"By a dream in a vision by night, when deep sleep falleth upon men, and they are sleeping in their beds:\"},{\"verse\":16,\"text\":\"Then he openeth the ears of men, and teaching instructeth them in what they are to learn.\"},{\"verse\":17,\"text\":\"That he may withdraw a man from the things he is doing, and may deliver him from pride.\"},{\"verse\":18,\"text\":\"Rescuing his soul from corruption: and his life from passing to the sword.\"},{\"verse\":19,\"text\":\"He rebuketh also by sorrow in the bed, and he maketh all his bones to wither.\"},{\"verse\":20,\"text\":\"Bread becometh abominable to him in his life, and to his soul the meat which before he desired.\"},{\"verse\":21,\"text\":\"His flesh shall be consumed away, and his bones that were covered shall be made bare.\"},{\"verse\":22,\"text\":\"His soul hath drawn near to corruption, and his life to the destroyers.\"},{\"verse\":23,\"text\":\"If there shall be an angel speaking for him, one among thousands, to declare man’s uprightness,\"},{\"verse\":24,\"text\":\"He shall have mercy on him, and shall say: Deliver him, that he may not go down to corruption: I have found wherein I may be merciful to him.\"},{\"verse\":25,\"text\":\"His flesh is consumed with punishments, let him return to the days of his youth.\"},{\"verse\":26,\"text\":\"He shall pray to God, and he will be gracious to him: and he shall see his face with joy, and he will render to man his justice.\"},{\"verse\":27,\"text\":\"He shall look upon men, and shall say: I have sinned, and indeed I have offended, and I have not received what I have deserved.\"},{\"verse\":28,\"text\":\"He hath delivered his soul from going into destruction, that it may live and see the light.\"},{\"verse\":29,\"text\":\"Behold, all these things God worketh three times within every one.\"},{\"verse\":30,\"text\":\"That he may withdraw their souls from corruption, and enlighten them with the light of the living.\"},{\"verse\":31,\"text\":\"Attend, Job, and hearken to me, and hold thy peace, whilst I speak.\"},{\"verse\":32,\"text\":\"But if thou hast any thing to say, answer me, speak: for I would have thee to appear just.\"},{\"verse\":33,\"text\":\"And if thou have not, hear me: hold thy peace, and I will teach thee wisdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audi igitur, Job, eloquia mea, et omnes sermones meos ausculta.\"},{\"verse\":2,\"text\":\"Ecce aperui os meum : loquatur lingua mea in faucibus meis.\"},{\"verse\":3,\"text\":\"Simplici corde meo sermones mei, et sententiam puram labia mea loquentur.\"},{\"verse\":4,\"text\":\"Spiritus Dei fecit me, et spiraculum Omnipotentis vivificavit me.\"},{\"verse\":5,\"text\":\"Si potes, responde mihi, et adversus faciem meam consiste.\"},{\"verse\":6,\"text\":\"Ecce, et me sicut et te fecit Deus, et de eodem luto ego quoque formatus sum.\"},{\"verse\":7,\"text\":\"Verumtamen miraculum meum non te terreat, et eloquentia mea non sit tibi gravis.\"},{\"verse\":8,\"text\":\"Dixisti ergo in auribus meis, et vocem verborum tuorum audivi :\"},{\"verse\":9,\"text\":\"Mundus sum ego, et absque delicto : immaculatus, et non est iniquitas in me.\"},{\"verse\":10,\"text\":\"Quia querelas in me reperit, ideo arbitratus est me inimicum sibi.\"},{\"verse\":11,\"text\":\"Posuit in nervo pedes meos ; custodivit omnes semitas meas.\"},{\"verse\":12,\"text\":\"Hoc est ergo in quo non es justificatus : respondebo tibi, quia major sit Deus homine.\"},{\"verse\":13,\"text\":\"Adversus eum contendis, quod non ad omnia verba responderit tibi ?\"},{\"verse\":14,\"text\":\"Semel loquitur Deus, et secundo idipsum non repetit.\"},{\"verse\":15,\"text\":\"Per somnium, in visione nocturna, quando irruit sopor super homines, et dormiunt in lectulo,\"},{\"verse\":16,\"text\":\"tunc aperit aures virorum, et erudiens eos instruit disciplina,\"},{\"verse\":17,\"text\":\"ut avertat hominem ab his quæ facit, et liberet eum de superbia,\"},{\"verse\":18,\"text\":\"eruens animam ejus a corruptione, et vitam illius ut non transeat in gladium.\"},{\"verse\":19,\"text\":\"Increpat quoque per dolorem in lectulo, et omnia ossa ejus marcescere facit.\"},{\"verse\":20,\"text\":\"Abominabilis ei fit in vita sua panis, et animæ illius cibus ante desiderabilis.\"},{\"verse\":21,\"text\":\"Tabescet caro ejus, et ossa, quæ tecta fuerant, nudabuntur.\"},{\"verse\":22,\"text\":\"Appropinquavit corruptioni anima ejus, et vita illius mortiferis.\"},{\"verse\":23,\"text\":\"Si fuerit pro eo angelus loquens, unus de millibus, ut annuntiet hominis æquitatem,\"},{\"verse\":24,\"text\":\"miserebitur ejus, et dicet : Libera eum, ut non descendat in corruptionem : inveni in quo ei propitier.\"},{\"verse\":25,\"text\":\"Consumpta est caro ejus a suppliciis : revertatur ad dies adolescentiæ suæ.\"},{\"verse\":26,\"text\":\"Deprecabitur Deum, et placabilis ei erit : et videbit faciem ejus in jubilo, et reddet homini justitiam suam.\"},{\"verse\":27,\"text\":\"Respiciet homines, et dicet : Peccavi, et vere deliqui, et ut eram dignus, non recepi.\"},{\"verse\":28,\"text\":\"Liberavit animam suam, ne pergeret in interitum, sed vivens lucem videret.\"},{\"verse\":29,\"text\":\"Ecce hæc omnia operatur Deus tribus vicibus per singulos,\"},{\"verse\":30,\"text\":\"ut revocet animas eorum a corruptione, et illuminet luce viventium.\"},{\"verse\":31,\"text\":\"Attende, Job, et audi me : et tace, dum ego loquor.\"},{\"verse\":32,\"text\":\"Si autem habes quod loquaris, responde mihi : loquere, volo enim te apparere justum.\"},{\"verse\":33,\"text\":\"Quod si non habes, audi me : tace, et docebo te sapientiam.\"}],\"summary\":\"Eliu blames Job for asserting his own innocence.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":32,\"label\":\"Job 32\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":34,\"label\":\"Job 34\"}}]]\n"])</script></body></html>
