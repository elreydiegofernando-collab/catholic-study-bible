t-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Sophar the Naamathite answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Shall not he that speaketh much, hear also? or shall a man full of talk be justified?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Shall men hold their peace to thee only? and when thou hast mocked others, shall no man confute thee?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thou hast said: My word is pure, and I am clean in thy sight.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I wish that God would speak with thee, and would open his lips to thee,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>That he might shew thee the secrets of wisdom, and that his law is manifold, and thou mightest understand that he exacteth much less of thee, than thy iniquity deserveth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Peradventure thou wilt comprehend the steps of God, and wilt find out the Almighty perfectly?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He is higher than heaven, and what wilt thou do? he is deeper than hell, and how wilt thou know?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The measure of him is longer than the earth, and broader than the sea.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If he shall overturn all things, or shall press them together, who shall contradict him?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For he knoweth the vanity of men, and when he seeth iniquity, doth he not consider it?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A vain man is lifted up into pride, and thinketh himself born free like a wild ass’s colt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But thou hast hardened thy heart, and hast spread thy hands to him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If thou wilt put away from thee the iniquity that is in thy hand, and let not injustice remain in thy tabernacle:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then mayst thou lift up thy face without spot, and thou shalt be steadfast, and shalt not fear.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou shalt also forget misery, and remember it only as waters that are passed away.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And brightness like that of the noonday, shall arise to thee at evening: and when thou shalt think thyself consumed, thou shalt rise as the day star.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And thou shalt have confidence, hope being set before thee, and being buried thou shalt sleep secure.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thou shalt rest, and there shall be none to make thee afraid: and many shall entreat thy face.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But the eyes of the wicked shall decay, and the way to escape shall fail them, and their hope the abomination of the soul.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Sophar Naamathites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Numquid qui multa loquitur, non et audiet ? aut vir verbosus justificabitur ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tibi soli tacebunt homines ? et cum ceteros irriseris, a nullo confutaberis ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixisti enim : Purus est sermo meus, et mundus sum in conspectu tuo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Atque utinam Deus loqueretur tecum, et aperiret labia sua tibi,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>ut ostenderet tibi secreta sapientiæ, et quod multiplex esset lex ejus : et intelligeres quod multo minora exigaris ab eo quam meretur iniquitas tua !</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Forsitan vestigia Dei comprehendes, et usque ad perfectum Omnipotentem reperies ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Excelsior cælo est, et quid facies ? profundior inferno, et unde cognosces ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Longior terra mensura ejus, et latior mari.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si subverterit omnia, vel in unum coarctaverit, quis contradicet ei ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ipse enim novit hominum vanitatem ; et videns iniquitatem, nonne considerat ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vir vanus in superbiam erigitur, et tamquam pullum onagri se liberum natum putat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tu autem firmasti cor tuum, et expandisti ad eum manus tuas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si iniquitatem quæ est in manu tua abstuleris a te, et non manserit in tabernaculo tuo injustitia,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>tunc levare poteris faciem tuam absque macula ; et eris stabilis, et non timebis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Miseriæ quoque oblivisceris, et quasi aquarum quæ præterierunt recordaberis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et quasi meridianus fulgor consurget tibi ad vesperam ; et cum te consumptum putaveris, orieris ut lucifer.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et habebis fiduciam, proposita tibi spe : et defossus securus dormies.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Requiesces, et non erit qui te exterreat ; et deprecabuntur faciem tuam plurimi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Oculi autem impiorum deficient, et effugium peribit ab eis : et spes illorum abominatio animæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 10</span></span></a><a c ght.\"},{\"verse\":5,\"text\":\"And I wish that God would speak with thee, and would open his lips to thee,\"},{\"verse\":6,\"text\":\"That he might shew thee the secrets of wisdom, and that his law is manifold, and thou mightest understand that he exacteth much less of thee, than thy iniquity deserveth.\"},{\"verse\":7,\"text\":\"Peradventure thou wilt comprehend the steps of God, and wilt find out the Almighty perfectly?\"},{\"verse\":8,\"text\":\"He is higher than heaven, and what wilt thou do? he is deeper than hell, and how wilt thou know?\"},{\"verse\":9,\"text\":\"The measure of him is longer than the earth, and broader than the sea.\"},{\"verse\":10,\"text\":\"If he shall overturn all things, or shall press them together, who shall contradict him?\"},{\"verse\":11,\"text\":\"For he knoweth the vanity of men, and when he seeth iniquity, doth he not consider it?\"},{\"verse\":12,\"text\":\"A vain man is lifted up into pride, and thinketh himself born free like a wild ass’s colt.\"},{\"verse\":13,\"text\":\"But thou hast hardened thy heart, and hast spread thy hands to him.\"},{\"verse\":14,\"text\":\"If thou wilt put away from thee the iniquity that is in thy hand, and let not injustice remain in thy tabernacle:\"},{\"verse\":15,\"text\":\"Then mayst thou lift up thy face without spot, and thou shalt be steadfast, and shalt not fear.\"},{\"verse\":16,\"text\":\"Thou shalt also forget misery, and remember it only as waters that are passed away.\"},{\"verse\":17,\"text\":\"And brightness like that of the noonday, shall arise to thee at evening: and when thou shalt think thyself consumed, thou shalt rise as the day star.\"},{\"verse\":18,\"text\":\"And thou shalt have confidence, hope being set before thee, and being buried thou shalt sleep secure.\"},{\"verse\":19,\"text\":\"Thou shalt rest, and there shall be none to make thee afraid: and many shall entreat thy face.\"},{\"verse\":20,\"text\":\"But the eyes of the wicked shall decay, and the way to escape shall fail them, and their hope the abomination of the soul.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Sophar Naamathites, dixit :\"},{\"verse\":2,\"text\":\"Numquid qui multa loquitur, non et audiet ? aut vir verbosus justificabitur ?\"},{\"verse\":3,\"text\":\"Tibi soli tacebunt homines ? et cum ceteros irriseris, a nullo confutaberis ?\"},{\"verse\":4,\"text\":\"Dixisti enim : Purus est sermo meus, et mundus sum in conspectu tuo.\"},{\"verse\":5,\"text\":\"Atque utinam Deus loqueretur tecum, et aperiret labia sua tibi,\"},{\"verse\":6,\"text\":\"ut ostenderet tibi secreta sapientiæ, et quod multiplex esset lex ejus : et intelligeres quod multo minora exigaris ab eo quam meretur iniquitas tua !\"},{\"verse\":7,\"text\":\"Forsitan vestigia Dei comprehendes, et usque ad perfectum Omnipotentem reperies ?\"},{\"verse\":8,\"text\":\"Excelsior cælo est, et quid facies ? profundior inferno, et unde cognosces ?\"},{\"verse\":9,\"text\":\"Longior terra mensura ejus, et latior mari.\"},{\"verse\":10,\"text\":\"Si subverterit omnia, vel in unum coarctaverit, quis contradicet ei ?\"},{\"verse\":11,\"text\":\"Ipse enim novit hominum vanitatem ; et videns iniquitatem, nonne considerat ?\"},{\"verse\":12,\"text\":\"Vir vanus in superbiam erigitur, et tamquam pullum onagri se liberum natum putat.\"},{\"verse\":13,\"text\":\"Tu autem firmasti cor tuum, et expandisti ad eum manus tuas.\"},{\"verse\":14,\"text\":\"Si iniquitatem quæ est in manu tua abstuleris a te, et non manserit in tabernaculo tuo injustitia,\"},{\"verse\":15,\"text\":\"tunc levare poteris faciem tuam absque macula ; et eris stabilis, et non timebis.\"},{\"verse\":16,\"text\":\"Miseriæ quoque oblivisceris, et quasi aquarum quæ præterierunt recordaberis.\"},{\"verse\":17,\"text\":\"Et quasi meridianus fulgor consurget tibi ad vesperam ; et cum te consumptum putaveris, orieris ut lucifer.\"},{\"verse\":18,\"text\":\"Et habebis fiduciam, proposita tibi spe : et defossus securus dormies.\"},{\"verse\":19,\"text\":\"Requiesces, et non erit qui te exterreat ; et deprecabuntur faciem tuam plurimi.\"},{\"verse\":20,\"text\":\"Oculi autem impiorum deficient, et effugium peribit ab eis : et spes illorum abominatio animæ.\"}],\"summary\":\"Sophar reproves Job, for justifying himself, and invites him to repentance.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":10,\"label\":\"Job 10\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":12,\"label\":\"Job 12\"}}]]\n"])</script></body></html>
