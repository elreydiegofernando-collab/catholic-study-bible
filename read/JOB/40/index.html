-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord answering Job out of the whirlwind, said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Gird up thy loins like a man: I will ask thee, and do thou tell me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Wilt thou make void my judgment: and condemn me, that thou mayst be justified?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And hast thou an arm like God, and canst thou thunder with a voice like him?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Clothe thyself with beauty, and set thyself up on high, and be glorious, and put on goodly garments.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Scatter the proud in thy indignation, and behold every arrogant man, and humble him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Look on all that are proud, and confound them, and crush the wicked in their place,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Hide them in the dust together, and plunge their faces into the pit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then I will confess that thy right hand is able to save thee.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Behold behemoth whom I made with thee, he eateth grass like an ox.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>His strength is in his loins, and his force in the navel of his belly.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He setteth up his tail like a cedar, the sinews of his testicles are wrapped together.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>His bones are like pipes of brass, his gristle like plates of iron.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He is the beginning of the ways of God, who made him, he will apply his sword.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>To him the mountains bring forth grass: there all the beasts of the field shall play.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He sleepeth under the shadow, in the covert of the reed, and in moist places.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The shades cover his shadow, the willows of the brook shall compass him about.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Behold, he will drink up a river, and not wonder: and he trusteth that the Jordan may run into his mouth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In his eyes as with a hook he shall take him, and bore through his nostrils with stakes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Canst thou draw out the leviathan with a hook, or canst thou tie his tongue with a cord?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Canst thou put a ring in his nose, or bore through his jaw with a buckle?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Will he make many supplications to thee, or speak soft words to thee?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Will he make a covenant with thee, and wilt thou take him to be a servant for ever,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Shalt thou play with him as with a bird, or tie him up for thy handmaids?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Shall friends cut him in pieces, shall merchants divide him?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Wilt thou fill nets with his skin, and the cabins of fishes with his head?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Lay thy hand upon him: remember the battle, and speak no more.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Behold his hope shall fail him, and in the sight of all he shall be cast down.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Dominus Job de turbine, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Accinge sicut vir lumbos tuos : interrogabo te, et indica mihi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Numquid irritum facies judicium meum, et condemnabis me, ut tu justificeris ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et si habes brachium sicut Deus ? et si voce simili tonas ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Circumda tibi decorem, et in sublime erigere, et esto gloriosus, et speciosis induere vestibus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Disperge superbos in furore tuo, et respiciens omnem arrogantem humilia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Respice cunctos superbos, et confunde eos, et contere impios in loco suo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Absconde eos in pulvere simul, et facies eorum demerge in foveam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ego confitebor quod salvare te possit dextera tua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ecce behemoth quem feci tecum, fœnum quasi bos comedet.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fortitudo ejus in lumbis ejus, et virtus illius in umbilico ventris ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Stringit caudam suam quasi cedrum ; nervi testiculorum ejus perplexi sunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ossa ejus velut fistulæ æris ; cartilago illius quasi laminæ ferreæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ipse est principium viarum Dei : qui fecit eum applicabit gladium ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Huic montes herbas ferunt : omnes bestiæ agri ludent ibi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sub umbra dormit in secreto calami, et in locis humentibus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Protegunt umbræ umbram ejus : circumdabunt eum salices torrentis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ecce absorbebit fluvium, et non mirabitur, et habet fiduciam quod influat Jordanis in os ejus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In oculis ejus quasi hamo capiet eum, et in sudibus perforabit nares ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>An extrahere poteris Leviathan hamo, et fune ligabis linguam ejus ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Numquid pones circulum in naribus ejus, aut armilla perforabis maxillam ejus ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Numquid multiplicabit ad te preces, aut loquetur tibi mollia ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Numquid feriet tecum pactum, et accipies eum servum sempiternum ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Numquid illudes ei quasi avi, aut ligabis eum ancillis tuis ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Concident eum amici ? divident illum negotiatores ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Numquid implebis sagenas pelle ejus, et gurgustium piscium capite illius ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Pone super eum manum tuam : memento belli, nec ultra addas loqui.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ecce spes ejus frustrabitur eum, et videntibus cunctis præcipitabitur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/39/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block nst thou thunder with a voice like him?\"},{\"verse\":5,\"text\":\"Clothe thyself with beauty, and set thyself up on high, and be glorious, and put on goodly garments.\"},{\"verse\":6,\"text\":\"Scatter the proud in thy indignation, and behold every arrogant man, and humble him.\"},{\"verse\":7,\"text\":\"Look on all that are proud, and confound them, and crush the wicked in their place,\"},{\"verse\":8,\"text\":\"Hide them in the dust together, and plunge their faces into the pit.\"},{\"verse\":9,\"text\":\"Then I will confess that thy right hand is able to save thee.\"},{\"verse\":10,\"text\":\"Behold behemoth whom I made with thee, he eateth grass like an ox.\"},{\"verse\":11,\"text\":\"His strength is in his loins, and his force in the navel of his belly.\"},{\"verse\":12,\"text\":\"He setteth up his tail like a cedar, the sinews of his testicles are wrapped together.\"},{\"verse\":13,\"text\":\"His bones are like pipes of brass, his gristle like plates of iron.\"},{\"verse\":14,\"text\":\"He is the beginning of the ways of God, who made him, he will apply his sword.\"},{\"verse\":15,\"text\":\"To him the mountains bring forth grass: there all the beasts of the field shall play.\"},{\"verse\":16,\"text\":\"He sleepeth under the shadow, in the covert of the reed, and in moist places.\"},{\"verse\":17,\"text\":\"The shades cover his shadow, the willows of the brook shall compass him about.\"},{\"verse\":18,\"text\":\"Behold, he will drink up a river, and not wonder: and he trusteth that the Jordan may run into his mouth.\"},{\"verse\":19,\"text\":\"In his eyes as with a hook he shall take him, and bore through his nostrils with stakes.\"},{\"verse\":20,\"text\":\"Canst thou draw out the leviathan with a hook, or canst thou tie his tongue with a cord?\"},{\"verse\":21,\"text\":\"Canst thou put a ring in his nose, or bore through his jaw with a buckle?\"},{\"verse\":22,\"text\":\"Will he make many supplications to thee, or speak soft words to thee?\"},{\"verse\":23,\"text\":\"Will he make a covenant with thee, and wilt thou take him to be a servant for ever,\"},{\"verse\":24,\"text\":\"Shalt thou play with him as with a bird, or tie him up for thy handmaids?\"},{\"verse\":25,\"text\":\"Shall friends cut him in pieces, shall merchants divide him?\"},{\"verse\":26,\"text\":\"Wilt thou fill nets with his skin, and the cabins of fishes with his head?\"},{\"verse\":27,\"text\":\"Lay thy hand upon him: remember the battle, and speak no more.\"},{\"verse\":28,\"text\":\"Behold his hope shall fail him, and in the sight of all he shall be cast down.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Dominus Job de turbine, dixit :\"},{\"verse\":2,\"text\":\"Accinge sicut vir lumbos tuos : interrogabo te, et indica mihi.\"},{\"verse\":3,\"text\":\"Numquid irritum facies judicium meum, et condemnabis me, ut tu justificeris ?\"},{\"verse\":4,\"text\":\"Et si habes brachium sicut Deus ? et si voce simili tonas ?\"},{\"verse\":5,\"text\":\"Circumda tibi decorem, et in sublime erigere, et esto gloriosus, et speciosis induere vestibus.\"},{\"verse\":6,\"text\":\"Disperge superbos in furore tuo, et respiciens omnem arrogantem humilia.\"},{\"verse\":7,\"text\":\"Respice cunctos superbos, et confunde eos, et contere impios in loco suo.\"},{\"verse\":8,\"text\":\"Absconde eos in pulvere simul, et facies eorum demerge in foveam.\"},{\"verse\":9,\"text\":\"Et ego confitebor quod salvare te possit dextera tua.\"},{\"verse\":10,\"text\":\"Ecce behemoth quem feci tecum, fœnum quasi bos comedet.\"},{\"verse\":11,\"text\":\"Fortitudo ejus in lumbis ejus, et virtus illius in umbilico ventris ejus.\"},{\"verse\":12,\"text\":\"Stringit caudam suam quasi cedrum ; nervi testiculorum ejus perplexi sunt.\"},{\"verse\":13,\"text\":\"Ossa ejus velut fistulæ æris ; cartilago illius quasi laminæ ferreæ.\"},{\"verse\":14,\"text\":\"Ipse est principium viarum Dei : qui fecit eum applicabit gladium ejus.\"},{\"verse\":15,\"text\":\"Huic montes herbas ferunt : omnes bestiæ agri ludent ibi.\"},{\"verse\":16,\"text\":\"Sub umbra dormit in secreto calami, et in locis humentibus.\"},{\"verse\":17,\"text\":\"Protegunt umbræ umbram ejus : circumdabunt eum salices torrentis.\"},{\"verse\":18,\"text\":\"Ecce absorbebit fluvium, et non mirabitur, et habet fiduciam quod influat Jordanis in os ejus.\"},{\"verse\":19,\"text\":\"In oculis ejus quasi hamo capiet eum, et in sudibus perforabit nares ejus.\"},{\"verse\":20,\"text\":\"An extrahere poteris Leviathan hamo, et fune ligabis linguam ejus ?\"},{\"verse\":21,\"text\":\"Numquid pones circulum in naribus ejus, aut armilla perforabis maxillam ejus ?\"},{\"verse\":22,\"text\":\"Numquid multiplicabit ad te preces, aut loquetur tibi mollia ?\"},{\"verse\":23,\"text\":\"Numquid feriet tecum pactum, et accipies eum servum sempiternum ?\"},{\"verse\":24,\"text\":\"Numquid illudes ei quasi avi, aut ligabis eum ancillis tuis ?\"},{\"verse\":25,\"text\":\"Concident eum amici ? divident illum negotiatores ?\"},{\"verse\":26,\"text\":\"Numquid implebis sagenas pelle ejus, et gurgustium piscium capite illius ?\"},{\"verse\":27,\"text\":\"Pone super eum manum tuam : memento belli, nec ultra addas loqui.\"},{\"verse\":28,\"text\":\"Ecce spes ejus frustrabitur eum, et videntibus cunctis præcipitabitur.\"}],\"summary\":\"Of the power of God in the behemoth and the leviathan.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":39,\"label\":\"Job 39\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":41,\"label\":\"Job 41\"}}]]\n"])</script></body></html>
