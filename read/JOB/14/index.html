35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOB/">About <!-- -->Job</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Job declares the shortness of man’s days: and professes his belief of a resurrection.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Man born of a woman, living for a short time, is filled with many miseries.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who cometh forth like a flower, and is destroyed, and fleeth as a shadow, and never continueth in the same state.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And dost thou think it meet to open thy eyes upon such an one, and to bring him into judgment with thee?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who can make him clean that is conceived of unclean seed? is it not thou who only art?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The days of man are short, and the number of his months is with thee: thou hast appointed his bounds which cannot be passed.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Depart a little from him, that he may rest until his wished for day come, as that of the hireling.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>A tree hath hope: if it be cut, it groweth green again, and the boughs thereof sprout.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If its roots be old in the earth, and its stock be dead in the dust:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>At the scent of water, it shall spring, and bring forth leaves, as when it was first planted.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But man when he shall be dead, and stripped and consumed, I pray you where is he?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As if the waters should depart out of the sea, and an emptied river should be dried up;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>So man when he is fallen asleep shall not rise again; till the heavens be broken, he shall not awake, nor rise up out of his sleep.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who will grant me this, that thou mayst protect me in hell, and hide me till thy wrath pass, and appoint me a time when thou wilt remember me?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Shall man that is dead, thinkest thou, live again? all the days in which I am now in warfare, I expect until my change come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou shalt call me, and I will answer thee: to the work of thy hands thou shalt reach out thy right hand.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou indeed hast numbered my steps, but spare my sins.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou hast sealed up my offences as it were in a bag, but hast cured my iniquity.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A mountain falling cometh to nought, and a rock is removed out of its place.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Waters wear away the stones, and with inundation the ground by little and little is washed away: so in like manner thou shalt destroy man.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thou hast strengthened him for a little while, that he may pass away for ever: thou shalt change his face, and shalt send him away.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Whether his children come to honour or dishonour, he shall not understand.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But yet his flesh, while he shall live, shall have pain, and his soul shall mourn over him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Homo natus de muliere, brevi vivens tempore, repletur multis miseriis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui quasi flos egreditur et conteritur, et fugit velut umbra, et numquam in eodem statu permanet.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dignum ducis super hujuscemodi aperire oculos tuos, et adducere eum tecum in judicium ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quis potest facere mundum de immundo conceptum semine ? nonne tu qui solus es ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Breves dies hominis sunt : numerus mensium ejus apud te est : constituisti terminos ejus, qui præteriri non poterunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Recede paululum ab eo, ut quiescat, donec optata veniat, sicut mercenarii, dies ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Lignum habet spem : si præcisum fuerit, rursum virescit, et rami ejus pullulant.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si senuerit in terra radix ejus, et in pulvere emortuus fuerit truncus illius,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>ad odorem aquæ germinabit, et faciet comam, quasi cum primum plantatum est.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Homo vero cum mortuus fuerit, et nudatus, atque consumptus, ubi, quæso, est ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quomodo si recedant aquæ de mari, et fluvius vacuefactus arescat :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>sic homo, cum dormierit, non resurget : donec atteratur cælum, non evigilabit, nec consurget de somno suo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quis mihi hoc tribuat, ut in inferno protegas me, et abscondas me donec pertranseat furor tuus, et constituas mihi tempus in quo recorderis mei ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Putasne mortuus homo rursum vivat ? cunctis diebus quibus nunc milito, expecto donec veniat immutatio mea.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vocabis me, et ego respondebo tibi : operi manuum tuarum porriges dexteram.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tu quidem gressus meos dinumerasti : sed parce peccatis meis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Signasti quasi in sacculo delicta mea, sed curasti iniquitatem meam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Mons cadens defluit, et saxum transfertur de loco suo :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>lapides excavant aquæ, et alluvione paulatim terra consumitur : et hominem ergo similiter perdes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Roborasti eum paululum, ut in perpetuum transiret : immutabis faciem ejus, et emittes eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sive nobiles fuerint filii ejus, sive ignobiles, non intelliget.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Attamen caro ejus, dum vivet, dolebit, et anima illius super semetipso lugebit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->14<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Job 13" class="inline-flex h-12 w-14 shrink-0 items-center justify-cent  nor rise up out of his sleep.\"},{\"verse\":13,\"text\":\"Who will grant me this, that thou mayst protect me in hell, and hide me till thy wrath pass, and appoint me a time when thou wilt remember me?\"},{\"verse\":14,\"text\":\"Shall man that is dead, thinkest thou, live again? all the days in which I am now in warfare, I expect until my change come.\"},{\"verse\":15,\"text\":\"Thou shalt call me, and I will answer thee: to the work of thy hands thou shalt reach out thy right hand.\"},{\"verse\":16,\"text\":\"Thou indeed hast numbered my steps, but spare my sins.\"},{\"verse\":17,\"text\":\"Thou hast sealed up my offences as it were in a bag, but hast cured my iniquity.\"},{\"verse\":18,\"text\":\"A mountain falling cometh to nought, and a rock is removed out of its place.\"},{\"verse\":19,\"text\":\"Waters wear away the stones, and with inundation the ground by little and little is washed away: so in like manner thou shalt destroy man.\"},{\"verse\":20,\"text\":\"Thou hast strengthened him for a little while, that he may pass away for ever: thou shalt change his face, and shalt send him away.\"},{\"verse\":21,\"text\":\"Whether his children come to honour or dishonour, he shall not understand.\"},{\"verse\":22,\"text\":\"But yet his flesh, while he shall live, shall have pain, and his soul shall mourn over him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Homo natus de muliere, brevi vivens tempore, repletur multis miseriis.\"},{\"verse\":2,\"text\":\"Qui quasi flos egreditur et conteritur, et fugit velut umbra, et numquam in eodem statu permanet.\"},{\"verse\":3,\"text\":\"Et dignum ducis super hujuscemodi aperire oculos tuos, et adducere eum tecum in judicium ?\"},{\"verse\":4,\"text\":\"Quis potest facere mundum de immundo conceptum semine ? nonne tu qui solus es ?\"},{\"verse\":5,\"text\":\"Breves dies hominis sunt : numerus mensium ejus apud te est : constituisti terminos ejus, qui præteriri non poterunt.\"},{\"verse\":6,\"text\":\"Recede paululum ab eo, ut quiescat, donec optata veniat, sicut mercenarii, dies ejus.\"},{\"verse\":7,\"text\":\"Lignum habet spem : si præcisum fuerit, rursum virescit, et rami ejus pullulant.\"},{\"verse\":8,\"text\":\"Si senuerit in terra radix ejus, et in pulvere emortuus fuerit truncus illius,\"},{\"verse\":9,\"text\":\"ad odorem aquæ germinabit, et faciet comam, quasi cum primum plantatum est.\"},{\"verse\":10,\"text\":\"Homo vero cum mortuus fuerit, et nudatus, atque consumptus, ubi, quæso, est ?\"},{\"verse\":11,\"text\":\"Quomodo si recedant aquæ de mari, et fluvius vacuefactus arescat :\"},{\"verse\":12,\"text\":\"sic homo, cum dormierit, non resurget : donec atteratur cælum, non evigilabit, nec consurget de somno suo.\"},{\"verse\":13,\"text\":\"Quis mihi hoc tribuat, ut in inferno protegas me, et abscondas me donec pertranseat furor tuus, et constituas mihi tempus in quo recorderis mei ?\"},{\"verse\":14,\"text\":\"Putasne mortuus homo rursum vivat ? cunctis diebus quibus nunc milito, expecto donec veniat immutatio mea.\"},{\"verse\":15,\"text\":\"Vocabis me, et ego respondebo tibi : operi manuum tuarum porriges dexteram.\"},{\"verse\":16,\"text\":\"Tu quidem gressus meos dinumerasti : sed parce peccatis meis.\"},{\"verse\":17,\"text\":\"Signasti quasi in sacculo delicta mea, sed curasti iniquitatem meam.\"},{\"verse\":18,\"text\":\"Mons cadens defluit, et saxum transfertur de loco suo :\"},{\"verse\":19,\"text\":\"lapides excavant aquæ, et alluvione paulatim terra consumitur : et hominem ergo similiter perdes.\"},{\"verse\":20,\"text\":\"Roborasti eum paululum, ut in perpetuum transiret : immutabis faciem ejus, et emittes eum.\"},{\"verse\":21,\"text\":\"Sive nobiles fuerint filii ejus, sive ignobiles, non intelliget.\"},{\"verse\":22,\"text\":\"Attamen caro ejus, dum vivet, dolebit, et anima illius super semetipso lugebit.\"}],\"summary\":\"Job declares the shortness of man’s days: and professes his belief of a resurrection.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":13,\"label\":\"Job 13\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":15,\"label\":\"Job 15\"}}]]\n"])</script></body></html>
