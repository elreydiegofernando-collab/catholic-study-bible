 the bitterness of my soul.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will say to God: Do not condemn me: tell me why thou judgest me so?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Doth it seem good to thee that thou shouldst calumniate me, and oppress me, the work of thy own hands, and help the counsel of the wicked?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hast thou eyes of flesh: or, shalt thou see as man seeth?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Are thy days as the days of man, and are thy years as the times of men:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>That thou shouldst inquire after my iniquity, and search after my sin?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And shouldst know that I have done no wicked thing, whereas there is no man that can deliver out of thy hand?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thy hands have made me, and fashioned me wholly round about, and dost thou thus cast me down headlong on a sudden?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Remember, I beseech thee, that thou hast made me as the clay, and thou wilt bring me into dust.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hast thou not milked me as milk, and curdled me like cheese?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou hast clothed me with skin and flesh: thou hast put me together with bones and sinews:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou hast granted me life and mercy, and thy visitation hath preserved my spirit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Although thou conceal these things in thy heart, yet I know that thou rememberest all things.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If I have sinned, and thou hast spared me for an hour: why dost thou not suffer me to be clean from my iniquity?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And if I be wicked, woe unto me: and if just, I shall not lift up my head, being filled with affliction and misery.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And for pride thou wilt take me as a lioness, and returning, thou tormentest me wonderfully.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou renewest thy witnesses against me, and multipliest thy wrath upon me, and pains war against me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Why didst thou bring me forth out of the womb? O that I had been consumed, that eye might not see me!</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I should have been as if I had not been, carried from the womb to the grave.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Shall not the fewness of my days be ended shortly? Suffer me, therefore, that I may lament my sorrow a little:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Before I go and return no more, to a land that is dark and covered with the mist of death:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A land of misery and darkness, where the shadow of death, and no order, but everlasting horror dwelleth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tædet animam meam vitæ meæ ; dimittam adversum me eloquium meum : loquar in amaritudine animæ meæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dicam Deo : Noli me condemnare ; indica mihi cur me ita judices.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Numquid bonum tibi videtur, si calumnieris me, et opprimas me opus manuum tuarum, et consilium impiorum adjuves ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Numquid oculi carnei tibi sunt ? aut sicut videt homo, et tu videbis ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Numquid sicut dies hominis dies tui, et anni tui sicut humana sunt tempora,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>ut quæras iniquitatem meam, et peccatum meum scruteris,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et scias quia nihil impium fecerim, cum sit nemo qui de manu tua possit eruere ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Manus tuæ fecerunt me, et plasmaverunt me totum in circuitu : et sic repente præcipitas me ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Memento, quæso, quod sicut lutum feceris me, et in pulverem reduces me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nonne sicut lac mulsisti me, et sicut caseum me coagulasti ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pelle et carnibus vestisti me ; ossibus et nervis compegisti me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vitam et misericordiam tribuisti mihi, et visitatio tua custodivit spiritum meum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Licet hæc celes in corde tuo, tamen scio quia universorum memineris.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si peccavi, et ad horam pepercisti mihi, cur ab iniquitate mea mundum me esse non pateris ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et si impius fuero, væ mihi est ; et si justus, non levabo caput, saturatus afflictione et miseria.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et propter superbiam quasi leænam capies me, reversusque mirabiliter me crucias.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Instauras testes tuos contra me, et multiplicas iram tuam adversum me, et pœnæ militant in me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quare de vulva eduxisti me ? qui utinam consumptus essem, ne oculus me videret.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fuissem quasi non essem, de utero translatus ad tumulum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Numquid non paucitas dierum meorum finietur brevi ? dimitte ergo me, ut plangam paululum dolorem meum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>antequam vadam, et non revertar, ad terram tenebrosam, et opertam mortis caligine :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>terram miseriæ et tenebrarum, ubi umbra mortis et nullus ordo, sed sempiternus horror inhabitat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="fl [[\"$\",\"$L18\",\"JOB.10\",{\"bookId\":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":10,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"My soul is weary of my life, I will let go my speech against myself, I will speak in the bitterness of my soul.\"},{\"verse\":2,\"text\":\"I will say to God: Do not condemn me: tell me why thou judgest me so?\"},{\"verse\":3,\"text\":\"Doth it seem good to thee that thou shouldst calumniate me, and oppress me, the work of thy own hands, and help the counsel of the wicked?\"},{\"verse\":4,\"text\":\"Hast thou eyes of flesh: or, shalt thou see as man seeth?\"},{\"verse\":5,\"text\":\"Are thy days as the days of man, and are thy years as the times of men:\"},{\"verse\":6,\"text\":\"That thou shouldst inquire after my iniquity, and search after my sin?\"},{\"verse\":7,\"text\":\"And shouldst know that I have done no wicked thing, whereas there is no man that can deliver out of thy hand?\"},{\"verse\":8,\"text\":\"Thy hands have made me, and fashioned me wholly round about, and dost thou thus cast me down headlong on a sudden?\"},{\"verse\":9,\"text\":\"Remember, I beseech thee, that thou hast made me as the clay, and thou wilt bring me into dust.\"},{\"verse\":10,\"text\":\"Hast thou not milked me as milk, and curdled me like cheese?\"},{\"verse\":11,\"text\":\"Thou hast clothed me with skin and flesh: thou hast put me together with bones and sinews:\"},{\"verse\":12,\"text\":\"Thou hast granted me life and mercy, and thy visitation hath preserved my spirit.\"},{\"verse\":13,\"text\":\"Although thou conceal these things in thy heart, yet I know that thou rememberest all things.\"},{\"verse\":14,\"text\":\"If I have sinned, and thou hast spared me for an hour: why dost thou not suffer me to be clean from my iniquity?\"},{\"verse\":15,\"text\":\"And if I be wicked, woe unto me: and if just, I shall not lift up my head, being filled with affliction and misery.\"},{\"verse\":16,\"text\":\"And for pride thou wilt take me as a lioness, and returning, thou tormentest me wonderfully.\"},{\"verse\":17,\"text\":\"Thou renewest thy witnesses against me, and multipliest thy wrath upon me, and pains war against me.\"},{\"verse\":18,\"text\":\"Why didst thou bring me forth out of the womb? O that I had been consumed, that eye might not see me!\"},{\"verse\":19,\"text\":\"I should have been as if I had not been, carried from the womb to the grave.\"},{\"verse\":20,\"text\":\"Shall not the fewness of my days be ended shortly? Suffer me, therefore, that I may lament my sorrow a little:\"},{\"verse\":21,\"text\":\"Before I go and return no more, to a land that is dark and covered with the mist of death:\"},{\"verse\":22,\"text\":\"A land of misery and darkness, where the shadow of death, and no order, but everlasting horror dwelleth.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tædet animam meam vitæ meæ ; dimittam adversum me eloquium meum : loquar in amaritudine animæ meæ.\"},{\"verse\":2,\"text\":\"Dicam Deo : Noli me condemnare ; indica mihi cur me ita judices.\"},{\"verse\":3,\"text\":\"Numquid bonum tibi videtur, si calumnieris me, et opprimas me opus manuum tuarum, et consilium impiorum adjuves ?\"},{\"verse\":4,\"text\":\"Numquid oculi carnei tibi sunt ? aut sicut videt homo, et tu videbis ?\"},{\"verse\":5,\"text\":\"Numquid sicut dies hominis dies tui, et anni tui sicut humana sunt tempora,\"},{\"verse\":6,\"text\":\"ut quæras iniquitatem meam, et peccatum meum scruteris,\"},{\"verse\":7,\"text\":\"et scias quia nihil impium fecerim, cum sit nemo qui de manu tua possit eruere ?\"},{\"verse\":8,\"text\":\"Manus tuæ fecerunt me, et plasmaverunt me totum in circuitu : et sic repente præcipitas me ?\"},{\"verse\":9,\"text\":\"Memento, quæso, quod sicut lutum feceris me, et in pulverem reduces me.\"},{\"verse\":10,\"text\":\"Nonne sicut lac mulsisti me, et sicut caseum me coagulasti ?\"},{\"verse\":11,\"text\":\"Pelle et carnibus vestisti me ; ossibus et nervis compegisti me.\"},{\"verse\":12,\"text\":\"Vitam et misericordiam tribuisti mihi, et visitatio tua custodivit spiritum meum.\"},{\"verse\":13,\"text\":\"Licet hæc celes in corde tuo, tamen scio quia universorum memineris.\"},{\"verse\":14,\"text\":\"Si peccavi, et ad horam pepercisti mihi, cur ab iniquitate mea mundum me esse non pateris ?\"},{\"verse\":15,\"text\":\"Et si impius fuero, væ mihi est ; et si justus, non levabo caput, saturatus afflictione et miseria.\"},{\"verse\":16,\"text\":\"Et propter superbiam quasi leænam capies me, reversusque mirabiliter me crucias.\"},{\"verse\":17,\"text\":\"Instauras testes tuos contra me, et multiplicas iram tuam adversum me, et pœnæ militant in me.\"},{\"verse\":18,\"text\":\"Quare de vulva eduxisti me ? qui utinam consumptus essem, ne oculus me videret.\"},{\"verse\":19,\"text\":\"Fuissem quasi non essem, de utero translatus ad tumulum.\"},{\"verse\":20,\"text\":\"Numquid non paucitas dierum meorum finietur brevi ? dimitte ergo me, ut plangam paululum dolorem meum,\"},{\"verse\":21,\"text\":\"antequam vadam, et non revertar, ad terram tenebrosam, et opertam mortis caligine :\"},{\"verse\":22,\"text\":\"terram miseriæ et tenebrarum, ubi umbra mortis et nullus ordo, sed sempiternus horror inhabitat.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":9,\"label\":\"Job 9\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":11,\"label\":\"Job 11\"}}]]\n"])</script></body></html>
