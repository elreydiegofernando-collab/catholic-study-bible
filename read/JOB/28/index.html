ext-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Silver hath beginnings of its veins, and gold hath a place wherein it is melted.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Iron is taken out of the earth, and stone melted with heat is turned into brass.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He hath set a time for darkness, and the end of all things he considereth, the stone also that is in the dark and the shadow of death.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The flood divideth from the people that are on their journey, those whom the food of the needy man hath forgotten, and who cannot be come at.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The land, out of which bread grew in its place, hath been overturned with fire.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The stones of it are the place of sapphires, and the clods of it are gold.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The bird hath not known the path, neither hath the eye of the vulture beheld it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The children of the merchants have not trodden it, neither hath the lioness passed by it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He hath stretched forth his hand to the flint, he hath overturned mountains from the roots.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In the rocks he hath cut out rivers, and his eye hath seen every precious thing.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The depths also of rivers he hath searched, and hidden things he hath brought forth to light.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But where is wisdom to be found, and where is the place of understanding?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Man knoweth not the price thereof, neither is it found in the land of them that live in delights.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The depth saith: It is not in me: and the sea saith: It is not with me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The finest gold shall not purchase it, neither shall silver be weighed in exchange for it.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>It shall not be compared with the dyed colours of India, or with the most precious stone sardonyx, or the sapphire.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Gold or crystal cannot equal it, neither shall any vessels of gold be changed for it.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>High and eminent things shall not be mentioned in comparison of it: but wisdom is drawn out of secret places.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The topaz of Ethiopia shall not be equal to it, neither shall it be compared to the cleanest dyeing.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Whence then cometh wisdom? and where is the place of understanding?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>It is hid from the eyes of all living, and the fowls of the air know it not.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Destruction and death have said: With our ears we have heard the fame thereof.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>God understandeth the way of it, and he knoweth the place thereof.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For he beholdeth the ends of the world: and looketh on all things that are under heaven.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Who made a weight for the winds, and weighed the waters by measure.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>When he gave a law for the rain, and a way for the sounding storms.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Then he saw it, and declared, and prepared, and searched it.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said to man: Behold the fear of the Lord, that is wisdom: and to depart from evil, is understanding.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Habet argentum venarum suarum principia, et auro locus est in quo conflatur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ferrum de terra tollitur, et lapis solutus calore in æs vertitur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tempus posuit tenebris, et universorum finem ipse considerat : lapidem quoque caliginis et umbram mortis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dividit torrens a populo peregrinante eos quos oblitus est pes egentis hominis, et invios.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Terra de qua oriebatur panis, in loco suo igni subversa est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Locus sapphiri lapides ejus, et glebæ illius aurum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Semitam ignoravit avis, nec intuitus est eam oculus vulturis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non calcaverunt eam filii institorum, nec pertransivit per eam leæna.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ad silicem extendit manum suam : subvertit a radicibus montes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In petris rivos excidit, et omne pretiosum vidit oculus ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Profunda quoque fluviorum scrutatus est, et abscondita in lucem produxit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sapientia vero ubi invenitur ? et quis est locus intelligentiæ ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nescit homo pretium ejus, nec invenitur in terra suaviter viventium.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Abyssus dicit : Non est in me, et mare loquitur : Non est mecum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non dabitur aurum obrizum pro ea, nec appendetur argentum in commutatione ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non conferetur tinctis Indiæ coloribus, nec lapidi sardonycho pretiosissimo vel sapphiro.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non adæquabitur ei aurum vel vitrum, nec commutabuntur pro ea vasa auri.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Excelsa et eminentia non memorabuntur comparatione ejus : trahitur autem sapientia de occultis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non adæquabitur ei topazius de Æthiopia, nec tincturæ mundissimæ componetur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Unde ergo sapientia venit ? et quis est locus intelligentiæ ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Abscondita est ab oculis omnium viventium : volucres quoque cæli latet.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Perditio et mors dixerunt : Auribus nostris audivimus famam ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Deus intelligit viam ejus, et ipse novit locum illius.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ipse enim fines mundi intuetur, et omnia quæ sub cælo sunt respicit.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui fecit ventis pondus, et aquas appendit in mensura.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quando ponebat pluviis legem, et viam procellis sonantibus :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>tunc vidit illam et enarravit, et præparavit, et investigavit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et dixit homini : Ecce timor Domini, ipsa est sapientia ; et recedere a malo, intelligentia.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover: \"drName\":\"Job\",\"chapter\":28,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"Silver hath beginnings of its veins, and gold hath a place wherein it is melted.\"},{\"verse\":2,\"text\":\"Iron is taken out of the earth, and stone melted with heat is turned into brass.\"},{\"verse\":3,\"text\":\"He hath set a time for darkness, and the end of all things he considereth, the stone also that is in the dark and the shadow of death.\"},{\"verse\":4,\"text\":\"The flood divideth from the people that are on their journey, those whom the food of the needy man hath forgotten, and who cannot be come at.\"},{\"verse\":5,\"text\":\"The land, out of which bread grew in its place, hath been overturned with fire.\"},{\"verse\":6,\"text\":\"The stones of it are the place of sapphires, and the clods of it are gold.\"},{\"verse\":7,\"text\":\"The bird hath not known the path, neither hath the eye of the vulture beheld it.\"},{\"verse\":8,\"text\":\"The children of the merchants have not trodden it, neither hath the lioness passed by it.\"},{\"verse\":9,\"text\":\"He hath stretched forth his hand to the flint, he hath overturned mountains from the roots.\"},{\"verse\":10,\"text\":\"In the rocks he hath cut out rivers, and his eye hath seen every precious thing.\"},{\"verse\":11,\"text\":\"The depths also of rivers he hath searched, and hidden things he hath brought forth to light.\"},{\"verse\":12,\"text\":\"But where is wisdom to be found, and where is the place of understanding?\"},{\"verse\":13,\"text\":\"Man knoweth not the price thereof, neither is it found in the land of them that live in delights.\"},{\"verse\":14,\"text\":\"The depth saith: It is not in me: and the sea saith: It is not with me.\"},{\"verse\":15,\"text\":\"The finest gold shall not purchase it, neither shall silver be weighed in exchange for it.\"},{\"verse\":16,\"text\":\"It shall not be compared with the dyed colours of India, or with the most precious stone sardonyx, or the sapphire.\"},{\"verse\":17,\"text\":\"Gold or crystal cannot equal it, neither shall any vessels of gold be changed for it.\"},{\"verse\":18,\"text\":\"High and eminent things shall not be mentioned in comparison of it: but wisdom is drawn out of secret places.\"},{\"verse\":19,\"text\":\"The topaz of Ethiopia shall not be equal to it, neither shall it be compared to the cleanest dyeing.\"},{\"verse\":20,\"text\":\"Whence then cometh wisdom? and where is the place of understanding?\"},{\"verse\":21,\"text\":\"It is hid from the eyes of all living, and the fowls of the air know it not.\"},{\"verse\":22,\"text\":\"Destruction and death have said: With our ears we have heard the fame thereof.\"},{\"verse\":23,\"text\":\"God understandeth the way of it, and he knoweth the place thereof.\"},{\"verse\":24,\"text\":\"For he beholdeth the ends of the world: and looketh on all things that are under heaven.\"},{\"verse\":25,\"text\":\"Who made a weight for the winds, and weighed the waters by measure.\"},{\"verse\":26,\"text\":\"When he gave a law for the rain, and a way for the sounding storms.\"},{\"verse\":27,\"text\":\"Then he saw it, and declared, and prepared, and searched it.\"},{\"verse\":28,\"text\":\"And he said to man: Behold the fear of the Lord, that is wisdom: and to depart from evil, is understanding.\"}],\"vul\":[{\"verse\":1,\"text\":\"Habet argentum venarum suarum principia, et auro locus est in quo conflatur.\"},{\"verse\":2,\"text\":\"Ferrum de terra tollitur, et lapis solutus calore in æs vertitur.\"},{\"verse\":3,\"text\":\"Tempus posuit tenebris, et universorum finem ipse considerat : lapidem quoque caliginis et umbram mortis.\"},{\"verse\":4,\"text\":\"Dividit torrens a populo peregrinante eos quos oblitus est pes egentis hominis, et invios.\"},{\"verse\":5,\"text\":\"Terra de qua oriebatur panis, in loco suo igni subversa est.\"},{\"verse\":6,\"text\":\"Locus sapphiri lapides ejus, et glebæ illius aurum.\"},{\"verse\":7,\"text\":\"Semitam ignoravit avis, nec intuitus est eam oculus vulturis.\"},{\"verse\":8,\"text\":\"Non calcaverunt eam filii institorum, nec pertransivit per eam leæna.\"},{\"verse\":9,\"text\":\"Ad silicem extendit manum suam : subvertit a radicibus montes.\"},{\"verse\":10,\"text\":\"In petris rivos excidit, et omne pretiosum vidit oculus ejus.\"},{\"verse\":11,\"text\":\"Profunda quoque fluviorum scrutatus est, et abscondita in lucem produxit.\"},{\"verse\":12,\"text\":\"Sapientia vero ubi invenitur ? et quis est locus intelligentiæ ?\"},{\"verse\":13,\"text\":\"Nescit homo pretium ejus, nec invenitur in terra suaviter viventium.\"},{\"verse\":14,\"text\":\"Abyssus dicit : Non est in me, et mare loquitur : Non est mecum.\"},{\"verse\":15,\"text\":\"Non dabitur aurum obrizum pro ea, nec appendetur argentum in commutatione ejus.\"},{\"verse\":16,\"text\":\"Non conferetur tinctis Indiæ coloribus, nec lapidi sardonycho pretiosissimo vel sapphiro.\"},{\"verse\":17,\"text\":\"Non adæquabitur ei aurum vel vitrum, nec commutabuntur pro ea vasa auri.\"},{\"verse\":18,\"text\":\"Excelsa et eminentia non memorabuntur comparatione ejus : trahitur autem sapientia de occultis.\"},{\"verse\":19,\"text\":\"Non adæquabitur ei topazius de Æthiopia, nec tincturæ mundissimæ componetur.\"},{\"verse\":20,\"text\":\"Unde ergo sapientia venit ? et quis est locus intelligentiæ ?\"},{\"verse\":21,\"text\":\"Abscondita est ab oculis omnium viventium : volucres quoque cæli latet.\"},{\"verse\":22,\"text\":\"Perditio et mors dixerunt : Auribus nostris audivimus famam ejus.\"},{\"verse\":23,\"text\":\"Deus intelligit viam ejus, et ipse novit locum illius.\"},{\"verse\":24,\"text\":\"Ipse enim fines mundi intuetur, et omnia quæ sub cælo sunt respicit.\"},{\"verse\":25,\"text\":\"Qui fecit ventis pondus, et aquas appendit in mensura.\"},{\"verse\":26,\"text\":\"Quando ponebat pluviis legem, et viam procellis sonantibus :\"},{\"verse\":27,\"text\":\"tunc vidit illam et enarravit, et præparavit, et investigavit.\"},{\"verse\":28,\"text\":\"Et dixit homini : Ecce timor Domini, ipsa est sapientia ; et recedere a malo, intelligentia.\"}],\"summary\":\"Man’s industry searcheth out many things: true wisdom is taught by God alone.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":27,\"label\":\"Job 27\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":29,\"label\":\"Job 29\"}}]]\n"])</script></body></html>
