"2" aria-pressed="false" class="verse"><sup>2</sup>How long wilt thou speak these things, and how long shall the words of thy mouth be like a strong wind?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Doth God pervert judgment, or doth the Almighty overthrow that which is just?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Although thy children have sinned against him, and he hath left them in the hand of their iniquity:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Yet if thou wilt arise early to God, and wilt beseech the Almighty:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>If thou wilt walk clean and upright, he will presently awake unto thee, and will make the dwelling of thy justice peaceable:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In so much, that if thy former things were small thy latter things would be multiplied exceedingly.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For inquire of the former generation, and search diligently into the memory of the fathers:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>(For we are but of yesterday, and are ignorant that our days upon earth are but a shadow.)</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they shall teach thee: they shall speak to thee, and utter words out of their hearts.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Can the rush be green without moisture? or sedge bush grow without water?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>When it is yet in flower, and is not plucked up with the hand, it withereth before all herbs.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Even so are the ways of all that forget God, and the hope of the hypocrite shall perish:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>His folly shall not please him, and his trust shall be like the spider’s web.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He shall lean upon his house, and it shall not stand: he shall prop it up, and it shall not rise:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He seemeth to have moisture before the sun cometh; and at his rising, his blossom shall shoot forth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>His roots shall be thick upon a heap of stones; and among the stones he shall abide.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If one swallow him up out of his place, he shall deny him, and shall say: I know thee not.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For this is the joy of his way, that others may spring again out of the earth.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>God will not cast away the simple, nor reach out his hand to the evil doer:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Until thy mouth be filled with laughter, and thy lips with rejoicing.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>They that hate thee, shall be clothed with confusion: and the dwelling of the wicked shall not stand.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Baldad Suhites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Usquequo loqueris talia, et spiritus multiplex sermones oris tui ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Numquid Deus supplantat judicium ? aut Omnipotens subvertit quod justum est ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Etiam si filii tui peccaverunt ei, et dimisit eos in manu iniquitatis suæ :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>tu tamen si diluculo consurrexeris ad Deum, et Omnipotentem fueris deprecatus ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>si mundus et rectus incesseris : statim evigilabit ad te, et pacatum reddet habitaculum justitiæ tuæ,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>in tantum ut si priora tua fuerint parva, et novissima tua multiplicentur nimis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Interroga enim generationem pristinam, et diligenter investiga patrum memoriam</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>(hesterni quippe sumus, et ignoramus, quoniam sicut umbra dies nostri sunt super terram),</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et ipsi docebunt te, loquentur tibi, et de corde suo proferent eloquia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Numquid vivere potest scirpus absque humore ? aut crescere carectum sine aqua ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum adhuc sit in flore, nec carpatur manu, ante omnes herbas arescit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sic viæ omnium qui obliviscuntur Deum, et spes hypocritæ peribit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non ei placebit vecordia sua, et sicut tela aranearum fiducia ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Innitetur super domum suam, et non stabit ; fulciet eam, et non consurget.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Humectus videtur antequam veniat sol, et in ortu suo germen ejus egredietur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Super acervum petrarum radices ejus densabuntur, et inter lapides commorabitur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si absorbuerit eum de loco suo, negabit eum, et dicet : Non novi te.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hæc est enim lætitia viæ ejus, ut rursum de terra alii germinentur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Deus non projiciet simplicem, nec porriget manum malignis,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>donec impleatur risu os tuum, et labia tua jubilo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui oderunt te induentur confusione, et tabernaculum impiorum non subsistet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d= verse\":3,\"text\":\"Doth God pervert judgment, or doth the Almighty overthrow that which is just?\"},{\"verse\":4,\"text\":\"Although thy children have sinned against him, and he hath left them in the hand of their iniquity:\"},{\"verse\":5,\"text\":\"Yet if thou wilt arise early to God, and wilt beseech the Almighty:\"},{\"verse\":6,\"text\":\"If thou wilt walk clean and upright, he will presently awake unto thee, and will make the dwelling of thy justice peaceable:\"},{\"verse\":7,\"text\":\"In so much, that if thy former things were small thy latter things would be multiplied exceedingly.\"},{\"verse\":8,\"text\":\"For inquire of the former generation, and search diligently into the memory of the fathers:\"},{\"verse\":9,\"text\":\"(For we are but of yesterday, and are ignorant that our days upon earth are but a shadow.)\"},{\"verse\":10,\"text\":\"And they shall teach thee: they shall speak to thee, and utter words out of their hearts.\"},{\"verse\":11,\"text\":\"Can the rush be green without moisture? or sedge bush grow without water?\"},{\"verse\":12,\"text\":\"When it is yet in flower, and is not plucked up with the hand, it withereth before all herbs.\"},{\"verse\":13,\"text\":\"Even so are the ways of all that forget God, and the hope of the hypocrite shall perish:\"},{\"verse\":14,\"text\":\"His folly shall not please him, and his trust shall be like the spider’s web.\"},{\"verse\":15,\"text\":\"He shall lean upon his house, and it shall not stand: he shall prop it up, and it shall not rise:\"},{\"verse\":16,\"text\":\"He seemeth to have moisture before the sun cometh; and at his rising, his blossom shall shoot forth.\"},{\"verse\":17,\"text\":\"His roots shall be thick upon a heap of stones; and among the stones he shall abide.\"},{\"verse\":18,\"text\":\"If one swallow him up out of his place, he shall deny him, and shall say: I know thee not.\"},{\"verse\":19,\"text\":\"For this is the joy of his way, that others may spring again out of the earth.\"},{\"verse\":20,\"text\":\"God will not cast away the simple, nor reach out his hand to the evil doer:\"},{\"verse\":21,\"text\":\"Until thy mouth be filled with laughter, and thy lips with rejoicing.\"},{\"verse\":22,\"text\":\"They that hate thee, shall be clothed with confusion: and the dwelling of the wicked shall not stand.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Baldad Suhites, dixit :\"},{\"verse\":2,\"text\":\"Usquequo loqueris talia, et spiritus multiplex sermones oris tui ?\"},{\"verse\":3,\"text\":\"Numquid Deus supplantat judicium ? aut Omnipotens subvertit quod justum est ?\"},{\"verse\":4,\"text\":\"Etiam si filii tui peccaverunt ei, et dimisit eos in manu iniquitatis suæ :\"},{\"verse\":5,\"text\":\"tu tamen si diluculo consurrexeris ad Deum, et Omnipotentem fueris deprecatus ;\"},{\"verse\":6,\"text\":\"si mundus et rectus incesseris : statim evigilabit ad te, et pacatum reddet habitaculum justitiæ tuæ,\"},{\"verse\":7,\"text\":\"in tantum ut si priora tua fuerint parva, et novissima tua multiplicentur nimis.\"},{\"verse\":8,\"text\":\"Interroga enim generationem pristinam, et diligenter investiga patrum memoriam\"},{\"verse\":9,\"text\":\"(hesterni quippe sumus, et ignoramus, quoniam sicut umbra dies nostri sunt super terram),\"},{\"verse\":10,\"text\":\"et ipsi docebunt te, loquentur tibi, et de corde suo proferent eloquia.\"},{\"verse\":11,\"text\":\"Numquid vivere potest scirpus absque humore ? aut crescere carectum sine aqua ?\"},{\"verse\":12,\"text\":\"Cum adhuc sit in flore, nec carpatur manu, ante omnes herbas arescit.\"},{\"verse\":13,\"text\":\"Sic viæ omnium qui obliviscuntur Deum, et spes hypocritæ peribit.\"},{\"verse\":14,\"text\":\"Non ei placebit vecordia sua, et sicut tela aranearum fiducia ejus.\"},{\"verse\":15,\"text\":\"Innitetur super domum suam, et non stabit ; fulciet eam, et non consurget.\"},{\"verse\":16,\"text\":\"Humectus videtur antequam veniat sol, et in ortu suo germen ejus egredietur.\"},{\"verse\":17,\"text\":\"Super acervum petrarum radices ejus densabuntur, et inter lapides commorabitur.\"},{\"verse\":18,\"text\":\"Si absorbuerit eum de loco suo, negabit eum, et dicet : Non novi te.\"},{\"verse\":19,\"text\":\"Hæc est enim lætitia viæ ejus, ut rursum de terra alii germinentur.\"},{\"verse\":20,\"text\":\"Deus non projiciet simplicem, nec porriget manum malignis,\"},{\"verse\":21,\"text\":\"donec impleatur risu os tuum, et labia tua jubilo.\"},{\"verse\":22,\"text\":\"Qui oderunt te induentur confusione, et tabernaculum impiorum non subsistet.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":7,\"label\":\"Job 7\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":9,\"label\":\"Job 9\"}}]]\n"])</script></body></html>
