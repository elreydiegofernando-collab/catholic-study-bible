"false" class="verse"><sup>2</sup>Indeed I know it is so, and that man cannot be justified, compared with God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>If he will contend with him, he cannot answer him one for a thousand.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He is wise in heart, and mighty in strength: who hath resisted him, and hath had peace?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who hath removed mountains, and they whom he overthrew in his wrath, knew it not.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who shaketh the earth out of her place, and the pillars thereof tremble.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Who commandeth the sun, and it riseth not: and shutteth up the stars, as it were, under a seal:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who alone spreadeth out the heavens, and walketh upon the waves of the sea,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who maketh Arcturus, and Orion, and Hyades, and the inner parts of the south.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Who doth things great and incomprehensible, and wonderful, of which there is no number.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If he come to me, I shall not see him: if he depart, I shall not understand.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If he examine on a sudden, who shall answer him? or who can say: Why dost thou so?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>God, whose wrath no man can resist, and under whom they stoop that bear up the world.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>What am I then, that I should answer him, and have words with him?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I, who although I should have any just thing, would not answer, but would make supplication to my judge.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And if he should hear me when I call, I should not believe that he had heard my voice.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For he shall crush me in a whirlwind, and multiply my wounds even without cause.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He alloweth not my spirit to rest, and he filleth me with bitterness.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If strength be demanded, he is most strong: if equity of judgment, no man dare bear witness for me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If I would justify myself, my own mouth shall condemn me: if I would shew myself innocent, he shall prove me wicked.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Although I should be simple, even this my soul shall be ignorant of, and I shall be weary of my life.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>One thing there is that I have spoken, both the innocent and the wicked he consumeth.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If he scourge, let him kill at once, and not laugh at the pains of the innocent.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The earth is given into the hand of the wicked, he covereth the face of the judges thereof: and if it be not he, who is it then?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>My days have been swifter than a post: they have fled away and have not seen good.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>They have passed by as ships carrying fruits, as an eagle flying to the prey.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>If I say: I will not speak so: I change my face, and am tormented with sorrow.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>I feared all my works, knowing that thou didst not spare the offender.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But if so also I am wicked, why have I laboured in vain?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>If I be washed, as it were, with snow waters, and my hands shall shine ever so clean:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Yet thou shalt plunge me in filth, and my garments shall abhor me.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For I shall not answer a man that is like myself: nor one that may be heard with me equally in judgment.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>There is none that may be able to reprove both, and to put his hand between both.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Let him take his rod away from me, and let not his fear terrify me.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>I will speak, and will not fear him: for I cannot answer while I am in fear.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et respondens Job, ait :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vere scio quod ita sit, et quod non justificetur homo compositus Deo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Si voluerit contendere cum eo, non poterit ei respondere unum pro mille.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sapiens corde est, et fortis robore : quis restitit ei, et pacem habuit ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui transtulit montes, et nescierunt hi quos subvertit in furore suo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui commovet terram de loco suo, et columnæ ejus concutiuntur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui præcipit soli, et non oritur, et stellas claudit quasi sub signaculo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui extendit cælos solus, et graditur super fluctus maris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui facit Arcturum et Oriona, et Hyadas et interiora austri.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui facit magna, et incomprehensibilia, et mirabilia, quorum non est numerus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si venerit ad me, non videbo eum ; si abierit, non intelligam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si repente interroget, quis respondebit ei ? vel quis dicere potest : Cur ita facis ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Deus, cujus iræ nemo resistere potest, et sub quo curvantur qui portant orbem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quantus ergo sum ego, ut respondeam ei, et loquar verbis meis cum eo ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui etiam si habuero quippiam justum, non respondebo : sed meum judicem deprecabor.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et cum invocantem exaudierit me, non credo quod audierit vocem meam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In turbine enim conteret me, et multiplicabit vulnera mea, etiam sine causa.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non concedit requiescere spiritum meum, et implet me amaritudinibus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Si fortitudo quæritur, robustissimus est ; si æquitas judicii, nemo audet pro me testimonium dicere.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si justificare me voluero, os meum condemnabit me ; si innocentem ostendero, pravum me comprobabit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Etiam si simplex fuero, hoc ipsum ignorabit anima mea, et tædebit me vitæ meæ.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Unum est quod locutus sum : et innocentem et impium ipse consumit.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si flagellat, occidat semel, et non de pœnis innocentum rideat.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Terra data est in manus impii ; vultum judicum ejus operit. Quod si non ille est, quis ergo est ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dies mei velociores fuerunt cursore ; fugerunt, et non viderunt bonum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Pertransierunt quasi naves poma portantes ; sicut aquila volans ad escam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Cum dixero : Nequaquam ita loquar : commuto faciem meam, et dolore torqueor.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Verebar omnia opera mea, sciens quod non parceres delinquenti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Si autem et sic impius sum, quare frustra laboravi ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Si lotus fuero quasi aquis nivis, et fulserint velut mundissimæ manus meæ,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>tamen sordibus intinges me, et abominabuntur me vestimenta mea.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Neque enim viro qui similis mei est, respondebo ; nec qui mecum in judicio ex æquo possit audiri.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Non est qui utrumque valeat arguere, et ponere manum suam in ambobus.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Auferat a me virgam suam, et pavor ejus non me terreat.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Loquar, et non timebo eum ; neque enim possum metuens respondere.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 \":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":9,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"And Job answered, and said:\"},{\"verse\":2,\"text\":\"Indeed I know it is so, and that man cannot be justified, compared with God.\"},{\"verse\":3,\"text\":\"If he will contend with him, he cannot answer him one for a thousand.\"},{\"verse\":4,\"text\":\"He is wise in heart, and mighty in strength: who hath resisted him, and hath had peace?\"},{\"verse\":5,\"text\":\"Who hath removed mountains, and they whom he overthrew in his wrath, knew it not.\"},{\"verse\":6,\"text\":\"Who shaketh the earth out of her place, and the pillars thereof tremble.\"},{\"verse\":7,\"text\":\"Who commandeth the sun, and it riseth not: and shutteth up the stars, as it were, under a seal:\"},{\"verse\":8,\"text\":\"Who alone spreadeth out the heavens, and walketh upon the waves of the sea,\"},{\"verse\":9,\"text\":\"Who maketh Arcturus, and Orion, and Hyades, and the inner parts of the south.\"},{\"verse\":10,\"text\":\"Who doth things great and incomprehensible, and wonderful, of which there is no number.\"},{\"verse\":11,\"text\":\"If he come to me, I shall not see him: if he depart, I shall not understand.\"},{\"verse\":12,\"text\":\"If he examine on a sudden, who shall answer him? or who can say: Why dost thou so?\"},{\"verse\":13,\"text\":\"God, whose wrath no man can resist, and under whom they stoop that bear up the world.\"},{\"verse\":14,\"text\":\"What am I then, that I should answer him, and have words with him?\"},{\"verse\":15,\"text\":\"I, who although I should have any just thing, would not answer, but would make supplication to my judge.\"},{\"verse\":16,\"text\":\"And if he should hear me when I call, I should not believe that he had heard my voice.\"},{\"verse\":17,\"text\":\"For he shall crush me in a whirlwind, and multiply my wounds even without cause.\"},{\"verse\":18,\"text\":\"He alloweth not my spirit to rest, and he filleth me with bitterness.\"},{\"verse\":19,\"text\":\"If strength be demanded, he is most strong: if equity of judgment, no man dare bear witness for me.\"},{\"verse\":20,\"text\":\"If I would justify myself, my own mouth shall condemn me: if I would shew myself innocent, he shall prove me wicked.\"},{\"verse\":21,\"text\":\"Although I should be simple, even this my soul shall be ignorant of, and I shall be weary of my life.\"},{\"verse\":22,\"text\":\"One thing there is that I have spoken, both the innocent and the wicked he consumeth.\"},{\"verse\":23,\"text\":\"If he scourge, let him kill at once, and not laugh at the pains of the innocent.\"},{\"verse\":24,\"text\":\"The earth is given into the hand of the wicked, he covereth the face of the judges thereof: and if it be not he, who is it then?\"},{\"verse\":25,\"text\":\"My days have been swifter than a post: they have fled away and have not seen good.\"},{\"verse\":26,\"text\":\"They have passed by as ships carrying fruits, as an eagle flying to the prey.\"},{\"verse\":27,\"text\":\"If I say: I will not speak so: I change my face, and am tormented with sorrow.\"},{\"verse\":28,\"text\":\"I feared all my works, knowing that thou didst not spare the offender.\"},{\"verse\":29,\"text\":\"But if so also I am wicked, why have I laboured in vain?\"},{\"verse\":30,\"text\":\"If I be washed, as it were, with snow waters, and my hands shall shine ever so clean:\"},{\"verse\":31,\"text\":\"Yet thou shalt plunge me in filth, and my garments shall abhor me.\"},{\"verse\":32,\"text\":\"For I shall not answer a man that is like myself: nor one that may be heard with me equally in judgment.\"},{\"verse\":33,\"text\":\"There is none that may be able to reprove both, and to put his hand between both.\"},{\"verse\":34,\"text\":\"Let him take his rod away from me, and let not his fear terrify me.\"},{\"verse\":35,\"text\":\"I will speak, and will not fear him: for I cannot answer while I am in fear.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et respondens Job, ait :\"},{\"verse\":2,\"text\":\"Vere scio quod ita sit, et quod non justificetur homo compositus Deo.\"},{\"verse\":3,\"text\":\"Si voluerit contendere cum eo, non poterit ei respondere unum pro mille.\"},{\"verse\":4,\"text\":\"Sapiens corde est, et fortis robore : quis restitit ei, et pacem habuit ?\"},{\"verse\":5,\"text\":\"Qui transtulit montes, et nescierunt hi quos subvertit in furore suo.\"},{\"verse\":6,\"text\":\"Qui commovet terram de loco suo, et columnæ ejus concutiuntur.\"},{\"verse\":7,\"text\":\"Qui præcipit soli, et non oritur, et stellas claudit quasi sub signaculo.\"},{\"verse\":8,\"text\":\"Qui extendit cælos solus, et graditur super fluctus maris.\"},{\"verse\":9,\"text\":\"Qui facit Arcturum et Oriona, et Hyadas et interiora austri.\"},{\"verse\":10,\"text\":\"Qui facit magna, et incomprehensibilia, et mirabilia, quorum non est numerus.\"},{\"verse\":11,\"text\":\"Si venerit ad me, non videbo eum ; si abierit, non intelligam.\"},{\"verse\":12,\"text\":\"Si repente interroget, quis respondebit ei ? vel quis dicere potest : Cur ita facis ?\"},{\"verse\":13,\"text\":\"Deus, cujus iræ nemo resistere potest, et sub quo curvantur qui portant orbem.\"},{\"verse\":14,\"text\":\"Quantus ergo sum ego, ut respondeam ei, et loquar verbis meis cum eo ?\"},{\"verse\":15,\"text\":\"qui etiam si habuero quippiam justum, non respondebo : sed meum judicem deprecabor.\"},{\"verse\":16,\"text\":\"Et cum invocantem exaudierit me, non credo quod audierit vocem meam.\"},{\"verse\":17,\"text\":\"In turbine enim conteret me, et multiplicabit vulnera mea, etiam sine causa.\"},{\"verse\":18,\"text\":\"Non concedit requiescere spiritum meum, et implet me amaritudinibus.\"},{\"verse\":19,\"text\":\"Si fortitudo quæritur, robustissimus est ; si æquitas judicii, nemo audet pro me testimonium dicere.\"},{\"verse\":20,\"text\":\"Si justificare me voluero, os meum condemnabit me ; si innocentem ostendero, pravum me comprobabit.\"},{\"verse\":21,\"text\":\"Etiam si simplex fuero, hoc ipsum ignorabit anima mea, et tædebit me vitæ meæ.\"},{\"verse\":22,\"text\":\"Unum est quod locutus sum : et innocentem et impium ipse consumit.\"},{\"verse\":23,\"text\":\"Si flagellat, occidat semel, et non de pœnis innocentum rideat.\"},{\"verse\":24,\"text\":\"Terra data est in manus impii ; vultum judicum ejus operit. Quod si non ille est, quis ergo est ?\"},{\"verse\":25,\"text\":\"Dies mei velociores fuerunt cursore ; fugerunt, et non viderunt bonum.\"},{\"verse\":26,\"text\":\"Pertransierunt quasi naves poma portantes ; sicut aquila volans ad escam.\"},{\"verse\":27,\"text\":\"Cum dixero : Nequaquam ita loquar : commuto faciem meam, et dolore torqueor.\"},{\"verse\":28,\"text\":\"Verebar omnia opera mea, sciens quod non parceres delinquenti.\"},{\"verse\":29,\"text\":\"Si autem et sic impius sum, quare frustra laboravi ?\"},{\"verse\":30,\"text\":\"Si lotus fuero quasi aquis nivis, et fulserint velut mundissimæ manus meæ,\"},{\"verse\":31,\"text\":\"tamen sordibus intinges me, et abominabuntur me vestimenta mea.\"},{\"verse\":32,\"text\":\"Neque enim viro qui similis mei est, respondebo ; nec qui mecum in judicio ex æquo possit audiri.\"},{\"verse\":33,\"text\":\"Non est qui utrumque valeat arguere, et ponere manum suam in ambobus.\"},{\"verse\":34,\"text\":\"Auferat a me virgam suam, et pavor ejus non me terreat.\"},{\"verse\":35,\"text\":\"Loquar, et non timebo eum ; neque enim possum metuens respondere.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":8,\"label\":\"Job 8\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":10,\"label\":\"Job 10\"}}]]\n"])</script></body></html>
