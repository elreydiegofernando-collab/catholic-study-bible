35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">29</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOB/">About <!-- -->Job</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Job relates his former happiness, and the respect that all men shewed him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Job also added, taking up his parable, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who will grant me, that I might be according to the months past, according to the days in which God kept me?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>When his lamp shined over my head, and I walked by his light in darkness?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>As I was in the days of my youth, when God was secretly in my tabernacle?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>When the Almighty was with me: and my servants round about me?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>When I washed my feet with butter, and the rock poured me out rivers of oil?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>When I went out to the gate of the city, and in the street they prepared me a chair?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The young men saw me, and hid themselves: and the old men rose up and stood.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The princes ceased to speak, and laid the finger on their mouth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The rulers held their peace, and their tongue cleaved to their throat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The ear that heard me blessed me, and the eye that saw me gave witness to me:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Because I had delivered the poor man that cried out; and the fatherless, that had no helper.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The blessing of him that was ready to perish came upon me, and I comforted the heart of the widow.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I was clad with justice: and I clothed myself with my judgment, as with a robe and a diadem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I was an eye to the blind, and a foot to the lame.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I was the father of the poor: and the cause which I knew not, I searched out most diligently.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I broke the jaws of the wicked man, and out of his teeth I took away the prey.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And I said: I shall die in my nest, and as a palm tree shall multiply my days.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>My root is opened beside the waters, and dew shall continue in my harvest.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>My glory shall always be renewed, and my bow in my hand shall be repaired.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>They that heard me, waited for my sentence, and being attentive held their peace at my counsel.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>To my words they durst add nothing, and my speech dropped upon them.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>They waited for me as for rain, and they opened their mouth as for a latter shower.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>If at any time I laughed on them, they believed not, and the light of my countenance fell not on earth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>If I had a mind to go to them, I sat first, and when I sat as a king, with his army standing about him, yet I was a comforter of them that mourned.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Addidit quoque Job, assumens parabolam suam, et dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quis mihi tribuat ut sim juxta menses pristinos, secundum dies quibus Deus custodiebat me ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quando splendebat lucerna ejus super caput meum, et ad lumen ejus ambulabam in tenebris :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sicut fui in diebus adolescentiæ meæ, quando secreto Deus erat in tabernaculo meo :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quando erat Omnipotens mecum, et in circuitu meo pueri mei :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>quando lavabam pedes meos butyro, et petra fundebat mihi rivos olei :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quando procedebam ad portam civitatis, et in platea parabant cathedram mihi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Videbant me juvenes, et abscondebantur : et senes assurgentes stabant.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Principes cessabant loqui, et digitum superponebant ori suo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Vocem suam cohibebant duces, et lingua eorum gutturi suo adhærebat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Auris audiens beatificabat me, et oculus videns testimonium reddebat mihi :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>eo quod liberassem pauperem vociferantem, et pupillum cui non esset adjutor.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Benedictio perituri super me veniebat, et cor viduæ consolatus sum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Justitia indutus sum, et vestivi me, sicut vestimento et diademate, judicio meo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Oculus fui cæco, et pes claudo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Pater eram pauperum, et causam quam nesciebam diligentissime investigabam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Conterebam molas iniqui, et de dentibus illius auferebam prædam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dicebamque : In nidulo meo moriar, et sicut palma multiplicabo dies.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Radix mea aperta est secus aquas, et ros morabitur in messione mea.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Gloria mea semper innovabitur, et arcus meus in manu mea instaurabitur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui me audiebant, expectabant sententiam, et intenti tacebant ad consilium meum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Verbis meis addere nihil audebant, et super illos stillabat eloquium meum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Expectabant me sicut pluviam, et os suum aperiebant quasi ad imbrem serotinum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Siquando ridebam ad eos, non credebant : et lux vultus mei non cadebat in terram.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Si voluissem ire ad eos, sedebam primus : cumque sederem quasi rex, circumstante exercitu, eram tamen mœrentium consolator.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/28/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 28</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/30/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 30</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->29 that heard me blessed me, and the eye that saw me gave witness to me:\"},{\"verse\":12,\"text\":\"Because I had delivered the poor man that cried out; and the fatherless, that had no helper.\"},{\"verse\":13,\"text\":\"The blessing of him that was ready to perish came upon me, and I comforted the heart of the widow.\"},{\"verse\":14,\"text\":\"I was clad with justice: and I clothed myself with my judgment, as with a robe and a diadem.\"},{\"verse\":15,\"text\":\"I was an eye to the blind, and a foot to the lame.\"},{\"verse\":16,\"text\":\"I was the father of the poor: and the cause which I knew not, I searched out most diligently.\"},{\"verse\":17,\"text\":\"I broke the jaws of the wicked man, and out of his teeth I took away the prey.\"},{\"verse\":18,\"text\":\"And I said: I shall die in my nest, and as a palm tree shall multiply my days.\"},{\"verse\":19,\"text\":\"My root is opened beside the waters, and dew shall continue in my harvest.\"},{\"verse\":20,\"text\":\"My glory shall always be renewed, and my bow in my hand shall be repaired.\"},{\"verse\":21,\"text\":\"They that heard me, waited for my sentence, and being attentive held their peace at my counsel.\"},{\"verse\":22,\"text\":\"To my words they durst add nothing, and my speech dropped upon them.\"},{\"verse\":23,\"text\":\"They waited for me as for rain, and they opened their mouth as for a latter shower.\"},{\"verse\":24,\"text\":\"If at any time I laughed on them, they believed not, and the light of my countenance fell not on earth.\"},{\"verse\":25,\"text\":\"If I had a mind to go to them, I sat first, and when I sat as a king, with his army standing about him, yet I was a comforter of them that mourned.\"}],\"vul\":[{\"verse\":1,\"text\":\"Addidit quoque Job, assumens parabolam suam, et dixit :\"},{\"verse\":2,\"text\":\"Quis mihi tribuat ut sim juxta menses pristinos, secundum dies quibus Deus custodiebat me ?\"},{\"verse\":3,\"text\":\"Quando splendebat lucerna ejus super caput meum, et ad lumen ejus ambulabam in tenebris :\"},{\"verse\":4,\"text\":\"sicut fui in diebus adolescentiæ meæ, quando secreto Deus erat in tabernaculo meo :\"},{\"verse\":5,\"text\":\"quando erat Omnipotens mecum, et in circuitu meo pueri mei :\"},{\"verse\":6,\"text\":\"quando lavabam pedes meos butyro, et petra fundebat mihi rivos olei :\"},{\"verse\":7,\"text\":\"quando procedebam ad portam civitatis, et in platea parabant cathedram mihi.\"},{\"verse\":8,\"text\":\"Videbant me juvenes, et abscondebantur : et senes assurgentes stabant.\"},{\"verse\":9,\"text\":\"Principes cessabant loqui, et digitum superponebant ori suo.\"},{\"verse\":10,\"text\":\"Vocem suam cohibebant duces, et lingua eorum gutturi suo adhærebat.\"},{\"verse\":11,\"text\":\"Auris audiens beatificabat me, et oculus videns testimonium reddebat mihi :\"},{\"verse\":12,\"text\":\"eo quod liberassem pauperem vociferantem, et pupillum cui non esset adjutor.\"},{\"verse\":13,\"text\":\"Benedictio perituri super me veniebat, et cor viduæ consolatus sum.\"},{\"verse\":14,\"text\":\"Justitia indutus sum, et vestivi me, sicut vestimento et diademate, judicio meo.\"},{\"verse\":15,\"text\":\"Oculus fui cæco, et pes claudo.\"},{\"verse\":16,\"text\":\"Pater eram pauperum, et causam quam nesciebam diligentissime investigabam.\"},{\"verse\":17,\"text\":\"Conterebam molas iniqui, et de dentibus illius auferebam prædam.\"},{\"verse\":18,\"text\":\"Dicebamque : In nidulo meo moriar, et sicut palma multiplicabo dies.\"},{\"verse\":19,\"text\":\"Radix mea aperta est secus aquas, et ros morabitur in messione mea.\"},{\"verse\":20,\"text\":\"Gloria mea semper innovabitur, et arcus meus in manu mea instaurabitur.\"},{\"verse\":21,\"text\":\"Qui me audiebant, expectabant sententiam, et intenti tacebant ad consilium meum.\"},{\"verse\":22,\"text\":\"Verbis meis addere nihil audebant, et super illos stillabat eloquium meum.\"},{\"verse\":23,\"text\":\"Expectabant me sicut pluviam, et os suum aperiebant quasi ad imbrem serotinum.\"},{\"verse\":24,\"text\":\"Siquando ridebam ad eos, non credebant : et lux vultus mei non cadebat in terram.\"},{\"verse\":25,\"text\":\"Si voluissem ire ad eos, sedebam primus : cumque sederem quasi rex, circumstante exercitu, eram tamen mœrentium consolator.\"}],\"summary\":\"Job relates his former happiness, and the respect that all men shewed him.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":28,\"label\":\"Job 28\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":30,\"label\":\"Job 30\"}}]]\n"])</script></body></html>
