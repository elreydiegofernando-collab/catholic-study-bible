on><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Anger indeed killeth the foolish, and envy slayeth the little one.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I have seen a fool with a strong root, and I cursed his beauty immediately.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>His children shall be far from safety, and shall be destroyed in the gate, and there shall be none to deliver them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Whose harvest the hungry shall eat, and the armed man shall take him by violence, and the thirsty shall drink up his riches.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nothing upon earth is done without a cause, and sorrow doth not spring out of the ground.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Man is born to labour, and the bird to fly.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wherefore I will pray to the Lord, and address my speech to God:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who doth great things, and unsearchable and wonderful things without number:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Who giveth rain upon the face of the earth, and watereth all things with waters:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who setteth up the humble on high, and comforteth with health those that mourn.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Who bringeth to nought the designs of the malignant, so that their hands cannot accomplish what they had begun:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Who catcheth the wise in their craftiness, and disappointeth the counsel of the wicked:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They shall meet with darkness in the day, and grope at noonday as in the night.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But he shall save the needy from the sword of their mouth, and the poor from the hand of the violent.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And to the needy there shall be hope, but iniquity shall draw in her mouth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Blessed is the man whom God correcteth: refuse not, therefore, the chastising of the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For he woundeth, and cureth: he striketh, and his hands shall heal.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In six troubles he shall deliver thee, and in the seventh, evil shall not touch thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In famine he shall deliver thee from death; and in battle, from the hand of the sword.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou shalt be hidden from the scourge of the tongue: and thou shalt not fear calamity when it cometh.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In destruction and famine thou shalt laugh: and thou shalt not be afraid of the beasts of the earth.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But thou shalt have a covenant with the stones of the lands, and the beasts of the earth shall be at peace with thee.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And thou shalt know that thy tabernacle is in peace, and visiting thy beauty, thou shalt not sin.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Thou shalt know also that thy seed shall be multiplied, and thy offspring like the grass of the earth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt enter into the grave in abundance, as a heap of wheat is brought in its season.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Behold, this is even so, as we have searched out: which thou having heard, consider it thoroughly in thy mind.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Voca ergo, si est qui tibi respondeat, et ad aliquem sanctorum convertere.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vere stultum interficit iracundia, et parvulum occidit invidia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ego vidi stultum firma radice, et maledixi pulchritudini ejus statim.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Longe fient filii ejus a salute, et conterentur in porta, et non erit qui eruat.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cujus messem famelicus comedet, et ipsum rapiet armatus, et bibent sitientes divitias ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nihil in terra sine causa fit, et de humo non oritur dolor.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Homo nascitur ad laborem, et avis ad volatum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quam ob rem ego deprecabor Dominum, et ad Deum ponam eloquium meum :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>qui facit magna et inscrutabilia, et mirabilia absque numero ;</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>qui dat pluviam super faciem terræ, et irrigat aquis universa ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>qui ponit humiles in sublime, et mœrentes erigit sospitate ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>qui dissipat cogitationes malignorum, ne possint implere manus eorum quod cœperant ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>qui apprehendit sapientes in astutia eorum, et consilium pravorum dissipat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Per diem incurrent tenebras, et quasi in nocte, sic palpabunt in meridie.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Porro salvum faciet egenum a gladio oris eorum, et de manu violenti pauperem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et erit egeno spes ; iniquitas autem contrahet os suum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Beatus homo qui corripitur a Deo : increpationem ergo Domini ne reprobes :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quia ipse vulnerat, et medetur ; percutit, et manus ejus sanabunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In sex tribulationibus liberabit te, et in septima non tanget te malum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In fame eruet te de morte, et in bello de manu gladii.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A flagello linguæ absconderis, et non timebis calamitatem cum venerit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In vastitate et fame ridebis, et bestias terræ non formidabis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sed cum lapidibus regionum pactum tuum, et bestiæ terræ pacificæ erunt tibi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et scies quod pacem habeat tabernaculum tuum ; et visitans speciem tuam, non peccabis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Scies quoque quoniam multiplex erit semen tuum, et progenies tua quasi herba terræ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ingredieris in abundantia sepulchrum, sicut infertur acervus tritici in tempore suo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ecce hoc, ut investigavimus, ita est : quod auditum, mente pertracta.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 t\":\"Whose harvest the hungry shall eat, and the armed man shall take him by violence, and the thirsty shall drink up his riches.\"},{\"verse\":6,\"text\":\"Nothing upon earth is done without a cause, and sorrow doth not spring out of the ground.\"},{\"verse\":7,\"text\":\"Man is born to labour, and the bird to fly.\"},{\"verse\":8,\"text\":\"Wherefore I will pray to the Lord, and address my speech to God:\"},{\"verse\":9,\"text\":\"Who doth great things, and unsearchable and wonderful things without number:\"},{\"verse\":10,\"text\":\"Who giveth rain upon the face of the earth, and watereth all things with waters:\"},{\"verse\":11,\"text\":\"Who setteth up the humble on high, and comforteth with health those that mourn.\"},{\"verse\":12,\"text\":\"Who bringeth to nought the designs of the malignant, so that their hands cannot accomplish what they had begun:\"},{\"verse\":13,\"text\":\"Who catcheth the wise in their craftiness, and disappointeth the counsel of the wicked:\"},{\"verse\":14,\"text\":\"They shall meet with darkness in the day, and grope at noonday as in the night.\"},{\"verse\":15,\"text\":\"But he shall save the needy from the sword of their mouth, and the poor from the hand of the violent.\"},{\"verse\":16,\"text\":\"And to the needy there shall be hope, but iniquity shall draw in her mouth.\"},{\"verse\":17,\"text\":\"Blessed is the man whom God correcteth: refuse not, therefore, the chastising of the Lord.\"},{\"verse\":18,\"text\":\"For he woundeth, and cureth: he striketh, and his hands shall heal.\"},{\"verse\":19,\"text\":\"In six troubles he shall deliver thee, and in the seventh, evil shall not touch thee.\"},{\"verse\":20,\"text\":\"In famine he shall deliver thee from death; and in battle, from the hand of the sword.\"},{\"verse\":21,\"text\":\"Thou shalt be hidden from the scourge of the tongue: and thou shalt not fear calamity when it cometh.\"},{\"verse\":22,\"text\":\"In destruction and famine thou shalt laugh: and thou shalt not be afraid of the beasts of the earth.\"},{\"verse\":23,\"text\":\"But thou shalt have a covenant with the stones of the lands, and the beasts of the earth shall be at peace with thee.\"},{\"verse\":24,\"text\":\"And thou shalt know that thy tabernacle is in peace, and visiting thy beauty, thou shalt not sin.\"},{\"verse\":25,\"text\":\"Thou shalt know also that thy seed shall be multiplied, and thy offspring like the grass of the earth.\"},{\"verse\":26,\"text\":\"Thou shalt enter into the grave in abundance, as a heap of wheat is brought in its season.\"},{\"verse\":27,\"text\":\"Behold, this is even so, as we have searched out: which thou having heard, consider it thoroughly in thy mind.\"}],\"vul\":[{\"verse\":1,\"text\":\"Voca ergo, si est qui tibi respondeat, et ad aliquem sanctorum convertere.\"},{\"verse\":2,\"text\":\"Vere stultum interficit iracundia, et parvulum occidit invidia.\"},{\"verse\":3,\"text\":\"Ego vidi stultum firma radice, et maledixi pulchritudini ejus statim.\"},{\"verse\":4,\"text\":\"Longe fient filii ejus a salute, et conterentur in porta, et non erit qui eruat.\"},{\"verse\":5,\"text\":\"Cujus messem famelicus comedet, et ipsum rapiet armatus, et bibent sitientes divitias ejus.\"},{\"verse\":6,\"text\":\"Nihil in terra sine causa fit, et de humo non oritur dolor.\"},{\"verse\":7,\"text\":\"Homo nascitur ad laborem, et avis ad volatum.\"},{\"verse\":8,\"text\":\"Quam ob rem ego deprecabor Dominum, et ad Deum ponam eloquium meum :\"},{\"verse\":9,\"text\":\"qui facit magna et inscrutabilia, et mirabilia absque numero ;\"},{\"verse\":10,\"text\":\"qui dat pluviam super faciem terræ, et irrigat aquis universa ;\"},{\"verse\":11,\"text\":\"qui ponit humiles in sublime, et mœrentes erigit sospitate ;\"},{\"verse\":12,\"text\":\"qui dissipat cogitationes malignorum, ne possint implere manus eorum quod cœperant ;\"},{\"verse\":13,\"text\":\"qui apprehendit sapientes in astutia eorum, et consilium pravorum dissipat.\"},{\"verse\":14,\"text\":\"Per diem incurrent tenebras, et quasi in nocte, sic palpabunt in meridie.\"},{\"verse\":15,\"text\":\"Porro salvum faciet egenum a gladio oris eorum, et de manu violenti pauperem.\"},{\"verse\":16,\"text\":\"Et erit egeno spes ; iniquitas autem contrahet os suum.\"},{\"verse\":17,\"text\":\"Beatus homo qui corripitur a Deo : increpationem ergo Domini ne reprobes :\"},{\"verse\":18,\"text\":\"quia ipse vulnerat, et medetur ; percutit, et manus ejus sanabunt.\"},{\"verse\":19,\"text\":\"In sex tribulationibus liberabit te, et in septima non tanget te malum.\"},{\"verse\":20,\"text\":\"In fame eruet te de morte, et in bello de manu gladii.\"},{\"verse\":21,\"text\":\"A flagello linguæ absconderis, et non timebis calamitatem cum venerit.\"},{\"verse\":22,\"text\":\"In vastitate et fame ridebis, et bestias terræ non formidabis.\"},{\"verse\":23,\"text\":\"Sed cum lapidibus regionum pactum tuum, et bestiæ terræ pacificæ erunt tibi.\"},{\"verse\":24,\"text\":\"Et scies quod pacem habeat tabernaculum tuum ; et visitans speciem tuam, non peccabis.\"},{\"verse\":25,\"text\":\"Scies quoque quoniam multiplex erit semen tuum, et progenies tua quasi herba terræ.\"},{\"verse\":26,\"text\":\"Ingredieris in abundantia sepulchrum, sicut infertur acervus tritici in tempore suo.\"},{\"verse\":27,\"text\":\"Ecce hoc, ut investigavimus, ita est : quod auditum, mente pertracta.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":4,\"label\":\"Job 4\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":6,\"label\":\"Job 6\"}}]]\n"])</script></body></html>
