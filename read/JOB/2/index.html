0-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">2</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass, when on a certain day the sons of God came, and stood before the Lord, and Satan came amongst them, and stood in his sight,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>That the Lord said to Satan: Whence comest thou? And he answered, and said: I have gone round about the earth, and walked through it.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the Lord said to Satan: Hast thou considered my servant, Job, that there is none like him in the earth, a man simple and upright, and fearing God, and avoiding evil, and still keeping his innocence? But thou hast moved me against him, that I should afflict him without cause.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Satan answered, and said: Skin for skin; and all that a man hath, he will give for his life:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But put forth thy hand, and touch his bone and his flesh, and then thou shalt see that he will bless thee to thy face.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Lord said to Satan: Behold, he is in thy hand, but yet save his life.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>So Satan went forth from the presence of the Lord, and struck Job with a very grievous ulcer, from the sole of the foot even to the top of his head:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he took a potsherd and scraped the corrupt matter, sitting on a dunghill.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And his wife said to him: Dost thou still continue in thy simplicity? bless God and die.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he said to her: Thou hast spoken like one of the foolish women: If we have received good things at the hand of God, why should we not receive evil? In all these things Job did not sin with his lips.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now when Job’s three friends heard all the evil that had befallen him, they came every one from his own place, Eliphaz, the Themanite, and Baldad, the Suhite, and Sophar, the Naamathite. For they had made an appointment to come together and visit him, and comfort him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when they had lifted up their eyes afar off, they knew him not, and crying out, they wept, and rending their garments, they sprinkled dust upon their heads toward heaven.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they sat with him on the ground seven days and seven nights and no man spoke to him a word: for they saw that his grief was very great.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem, cum quadam die venissent filii Dei, et starent coram Domino, venisset quoque Satan inter eos, et staret in conspectu ejus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ut diceret Dominus ad Satan : Unde venis ? Qui respondens ait : Circuivi terram, et perambulavi eam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dixit Dominus ad Satan : Numquid considerasti servum meum Job, quod non sit ei similis in terra, vir simplex et rectus, ac timens Deum, et recedens a malo, et adhuc retinens innocentiam ? tu autem commovisti me adversus eum, ut affligerem eum frustra.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cui respondens Satan, ait : Pellem pro pelle, et cuncta quæ habet homo dabit pro anima sua ;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>alioquin mitte manum tuam, et tange os ejus et carnem, et tunc videbis quod in faciem benedicat tibi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixit ergo Dominus ad Satan : Ecce in manu tua est : verumtamen animam illius serva.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Egressus igitur Satan a facie Domini, percussit Job ulcere pessimo, a planta pedis usque ad verticem ejus ;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui testa saniem radebat, sedens in sterquilinio.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixit autem illi uxor sua : Adhuc tu permanes in simplicitate tua ? Benedic Deo, et morere.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui ait ad illam : Quasi una de stultis mulieribus locuta es : si bona suscepimus de manu Dei, mala quare non suscipiamus ? In omnibus his non peccavit Job labiis suis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Igitur audientes tres amici Job omne malum quod accidisset ei, venerunt singuli de loco suo, Eliphaz Themanites, et Baldad Suhites, et Sophar Naamathites. Condixerant enim ut pariter venientes visitarent eum, et consolarentur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cumque elevassent procul oculos suos, non cognoverunt eum, et exclamantes ploraverunt, scissisque vestibus sparserunt pulverem super caput suum in cælum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et sederunt cum eo in terra septem diebus et septem noctibus : et nemo loquebatur ei verbum : videbant enim dolorem esse vehementem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/1/"><svg viewBox="0 0 24 24" fill="none" stroke="c e earth, and walked through it.\"},{\"verse\":3,\"text\":\"And the Lord said to Satan: Hast thou considered my servant, Job, that there is none like him in the earth, a man simple and upright, and fearing God, and avoiding evil, and still keeping his innocence? But thou hast moved me against him, that I should afflict him without cause.\"},{\"verse\":4,\"text\":\"And Satan answered, and said: Skin for skin; and all that a man hath, he will give for his life:\"},{\"verse\":5,\"text\":\"But put forth thy hand, and touch his bone and his flesh, and then thou shalt see that he will bless thee to thy face.\"},{\"verse\":6,\"text\":\"And the Lord said to Satan: Behold, he is in thy hand, but yet save his life.\"},{\"verse\":7,\"text\":\"So Satan went forth from the presence of the Lord, and struck Job with a very grievous ulcer, from the sole of the foot even to the top of his head:\"},{\"verse\":8,\"text\":\"And he took a potsherd and scraped the corrupt matter, sitting on a dunghill.\"},{\"verse\":9,\"text\":\"And his wife said to him: Dost thou still continue in thy simplicity? bless God and die.\"},{\"verse\":10,\"text\":\"And he said to her: Thou hast spoken like one of the foolish women: If we have received good things at the hand of God, why should we not receive evil? In all these things Job did not sin with his lips.\"},{\"verse\":11,\"text\":\"Now when Job’s three friends heard all the evil that had befallen him, they came every one from his own place, Eliphaz, the Themanite, and Baldad, the Suhite, and Sophar, the Naamathite. For they had made an appointment to come together and visit him, and comfort him.\"},{\"verse\":12,\"text\":\"And when they had lifted up their eyes afar off, they knew him not, and crying out, they wept, and rending their garments, they sprinkled dust upon their heads toward heaven.\"},{\"verse\":13,\"text\":\"And they sat with him on the ground seven days and seven nights and no man spoke to him a word: for they saw that his grief was very great.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem, cum quadam die venissent filii Dei, et starent coram Domino, venisset quoque Satan inter eos, et staret in conspectu ejus,\"},{\"verse\":2,\"text\":\"ut diceret Dominus ad Satan : Unde venis ? Qui respondens ait : Circuivi terram, et perambulavi eam.\"},{\"verse\":3,\"text\":\"Et dixit Dominus ad Satan : Numquid considerasti servum meum Job, quod non sit ei similis in terra, vir simplex et rectus, ac timens Deum, et recedens a malo, et adhuc retinens innocentiam ? tu autem commovisti me adversus eum, ut affligerem eum frustra.\"},{\"verse\":4,\"text\":\"Cui respondens Satan, ait : Pellem pro pelle, et cuncta quæ habet homo dabit pro anima sua ;\"},{\"verse\":5,\"text\":\"alioquin mitte manum tuam, et tange os ejus et carnem, et tunc videbis quod in faciem benedicat tibi.\"},{\"verse\":6,\"text\":\"Dixit ergo Dominus ad Satan : Ecce in manu tua est : verumtamen animam illius serva.\"},{\"verse\":7,\"text\":\"Egressus igitur Satan a facie Domini, percussit Job ulcere pessimo, a planta pedis usque ad verticem ejus ;\"},{\"verse\":8,\"text\":\"qui testa saniem radebat, sedens in sterquilinio.\"},{\"verse\":9,\"text\":\"Dixit autem illi uxor sua : Adhuc tu permanes in simplicitate tua ? Benedic Deo, et morere.\"},{\"verse\":10,\"text\":\"Qui ait ad illam : Quasi una de stultis mulieribus locuta es : si bona suscepimus de manu Dei, mala quare non suscipiamus ? In omnibus his non peccavit Job labiis suis.\"},{\"verse\":11,\"text\":\"Igitur audientes tres amici Job omne malum quod accidisset ei, venerunt singuli de loco suo, Eliphaz Themanites, et Baldad Suhites, et Sophar Naamathites. Condixerant enim ut pariter venientes visitarent eum, et consolarentur.\"},{\"verse\":12,\"text\":\"Cumque elevassent procul oculos suos, non cognoverunt eum, et exclamantes ploraverunt, scissisque vestibus sparserunt pulverem super caput suum in cælum.\"},{\"verse\":13,\"text\":\"Et sederunt cum eo in terra septem diebus et septem noctibus : et nemo loquebatur ei verbum : videbant enim dolorem esse vehementem.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":1,\"label\":\"Job 1\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":3,\"label\":\"Job 3\"}}]]\n"])</script></body></html>
