font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Sophar the Naamathite answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Therefore various thoughts succeed one another in me, and my mind is hurried away to different things.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The doctrine with which thou reprovest me, I will hear, and the spirit of my understanding shall answer for me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>This I know from the beginning, since man was placed upon the earth,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>That the praise of the wicked is short, and the joy of the hypocrite but for a moment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>If his pride mount up even to heaven, and his head touch the clouds:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In the end he shall be destroyed like a dunghill, and they that had seen him, shall say: Where is he?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>As a dream that fleeth away he shall not be found, he shall pass as a vision of the night:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The eyes that had seen him, shall see him no more, neither shall his place any more behold him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>His children shall be oppressed with want, and his hands shall render to him his sorrow.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>His bones shall be filled with the vices of his youth, and they shall sleep with him in the dust.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For when evil shall be sweet in his mouth, he will hide it under his tongue.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He will spare it, and not leave it, and will hide it in his throat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>His bread in his belly shall be turned into the gall of asps within him,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The riches which he hath swallowed, he shall vomit up, and God shall draw them out of his belly.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He shall suck the head of asps, and the viper’s tongue shall kill him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let him not see the streams of the river, the brooks of honey and of butter.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He shall be punished for all that he did, and yet shall not be consumed: according to the multitude of his devices so also shall he suffer.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Because he broke in and stripped the poor: he hath violently taken away a house which he did not build.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And yet his belly was not filled: and when he hath the things he coveted, he shall not be able to possess them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>There was nothing left of his meat, and therefore nothing shall continue of his goods:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>When he shall be filled, he shall be straitened, he shall burn, and every sorrow shall fall upon him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>May his belly be filled, that God may send forth the wrath of his indignation upon him, and rain down his war upon him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He shall flee from weapons of iron, and shall fall upon a bow of brass.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The sword is drawn out, and cometh forth from its scabbard, and glittereth in his bitterness: the terrible ones shall go and come upon him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>All darkness is hid in his secret places: a fire that is not kindled shall devour him, he shall be afflicted when left in his tabernacle.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The heavens shall reveal his iniquity, and the earth shall rise up against him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The offspring of his house shall be exposed, he shall be pulled down in the day of God’s wrath.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>This is the portion of a wicked man from God, and the inheritance of his doings from the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Sophar Naamathites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Idcirco cogitationes meæ variæ succedunt sibi, et mens in diversa rapitur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Doctrinam qua me arguis audiam, et spiritus intelligentiæ meæ respondebit mihi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hoc scio a principio, ex quo positus est homo super terram,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quod laus impiorum brevis sit, et gaudium hypocritæ ad instar puncti.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si ascenderit usque ad cælum superbia ejus, et caput ejus nubes tetigerit,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quasi sterquilinium in fine perdetur, et qui eum viderant, dicent : Ubi est ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Velut somnium avolans non invenietur : transiet sicut visio nocturna.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Oculus qui eum viderat non videbit, neque ultra intuebitur eum locus suus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Filii ejus atterentur egestate, et manus illius reddent ei dolorem suum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ossa ejus implebuntur vitiis adolescentiæ ejus, et cum eo in pulvere dormient.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum enim dulce fuerit in ore ejus malum, abscondet illud sub lingua sua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Parcet illi, et non derelinquet illud, et celabit in gutture suo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Panis ejus in utero illius vertetur in fel aspidum intrinsecus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Divitias quas devoravit evomet, et de ventre illius extrahet eas Deus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Caput aspidum suget, et occidet eum lingua viperæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>(Non videat rivulos fluminis, torrentes mellis et butyri.)</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Luet quæ fecit omnia, nec tamen consumetur : juxta multitudinem adinventionum suarum, sic et sustinebit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quoniam confringens nudavit pauperes : domum rapuit, et non ædificavit eam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Nec est satiatus venter ejus : et cum habuerit quæ concupierat, possidere non poterit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non remansit de cibo ejus, et propterea nihil permanebit de bonis ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cum satiatus fuerit, arctabitur : æstuabit, et omnis dolor irruet super eum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Utinam impleatur venter ejus, ut emittat in eum iram furoris sui, et pluat super illum bellum suum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Fugiet arma ferrea, et irruet in arcum æreum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Eductus, et egrediens de vagina sua, et fulgurans in amaritudine sua : vadent et venient super eum horribiles.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Omnes tenebræ absconditæ sunt in occultis ejus ; devorabit eum ignis qui non succenditur : affligetur relictus in tabernaculo suo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Revelabunt cæli iniquitatem ejus, et terra consurget adversus eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Apertum erit germen domus illius : detrahetur in die furoris Dei.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Hæc est pars hominis impii a Deo, et hæreditas verborum ejus a Domino.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->20<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto f .0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JOB.20\",{\"bookId\":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":20,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"Then Sophar the Naamathite answered, and said:\"},{\"verse\":2,\"text\":\"Therefore various thoughts succeed one another in me, and my mind is hurried away to different things.\"},{\"verse\":3,\"text\":\"The doctrine with which thou reprovest me, I will hear, and the spirit of my understanding shall answer for me.\"},{\"verse\":4,\"text\":\"This I know from the beginning, since man was placed upon the earth,\"},{\"verse\":5,\"text\":\"That the praise of the wicked is short, and the joy of the hypocrite but for a moment.\"},{\"verse\":6,\"text\":\"If his pride mount up even to heaven, and his head touch the clouds:\"},{\"verse\":7,\"text\":\"In the end he shall be destroyed like a dunghill, and they that had seen him, shall say: Where is he?\"},{\"verse\":8,\"text\":\"As a dream that fleeth away he shall not be found, he shall pass as a vision of the night:\"},{\"verse\":9,\"text\":\"The eyes that had seen him, shall see him no more, neither shall his place any more behold him.\"},{\"verse\":10,\"text\":\"His children shall be oppressed with want, and his hands shall render to him his sorrow.\"},{\"verse\":11,\"text\":\"His bones shall be filled with the vices of his youth, and they shall sleep with him in the dust.\"},{\"verse\":12,\"text\":\"For when evil shall be sweet in his mouth, he will hide it under his tongue.\"},{\"verse\":13,\"text\":\"He will spare it, and not leave it, and will hide it in his throat.\"},{\"verse\":14,\"text\":\"His bread in his belly shall be turned into the gall of asps within him,\"},{\"verse\":15,\"text\":\"The riches which he hath swallowed, he shall vomit up, and God shall draw them out of his belly.\"},{\"verse\":16,\"text\":\"He shall suck the head of asps, and the viper’s tongue shall kill him.\"},{\"verse\":17,\"text\":\"Let him not see the streams of the river, the brooks of honey and of butter.\"},{\"verse\":18,\"text\":\"He shall be punished for all that he did, and yet shall not be consumed: according to the multitude of his devices so also shall he suffer.\"},{\"verse\":19,\"text\":\"Because he broke in and stripped the poor: he hath violently taken away a house which he did not build.\"},{\"verse\":20,\"text\":\"And yet his belly was not filled: and when he hath the things he coveted, he shall not be able to possess them.\"},{\"verse\":21,\"text\":\"There was nothing left of his meat, and therefore nothing shall continue of his goods:\"},{\"verse\":22,\"text\":\"When he shall be filled, he shall be straitened, he shall burn, and every sorrow shall fall upon him.\"},{\"verse\":23,\"text\":\"May his belly be filled, that God may send forth the wrath of his indignation upon him, and rain down his war upon him.\"},{\"verse\":24,\"text\":\"He shall flee from weapons of iron, and shall fall upon a bow of brass.\"},{\"verse\":25,\"text\":\"The sword is drawn out, and cometh forth from its scabbard, and glittereth in his bitterness: the terrible ones shall go and come upon him.\"},{\"verse\":26,\"text\":\"All darkness is hid in his secret places: a fire that is not kindled shall devour him, he shall be afflicted when left in his tabernacle.\"},{\"verse\":27,\"text\":\"The heavens shall reveal his iniquity, and the earth shall rise up against him.\"},{\"verse\":28,\"text\":\"The offspring of his house shall be exposed, he shall be pulled down in the day of God’s wrath.\"},{\"verse\":29,\"text\":\"This is the portion of a wicked man from God, and the inheritance of his doings from the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Sophar Naamathites, dixit :\"},{\"verse\":2,\"text\":\"Idcirco cogitationes meæ variæ succedunt sibi, et mens in diversa rapitur.\"},{\"verse\":3,\"text\":\"Doctrinam qua me arguis audiam, et spiritus intelligentiæ meæ respondebit mihi.\"},{\"verse\":4,\"text\":\"Hoc scio a principio, ex quo positus est homo super terram,\"},{\"verse\":5,\"text\":\"quod laus impiorum brevis sit, et gaudium hypocritæ ad instar puncti.\"},{\"verse\":6,\"text\":\"Si ascenderit usque ad cælum superbia ejus, et caput ejus nubes tetigerit,\"},{\"verse\":7,\"text\":\"quasi sterquilinium in fine perdetur, et qui eum viderant, dicent : Ubi est ?\"},{\"verse\":8,\"text\":\"Velut somnium avolans non invenietur : transiet sicut visio nocturna.\"},{\"verse\":9,\"text\":\"Oculus qui eum viderat non videbit, neque ultra intuebitur eum locus suus.\"},{\"verse\":10,\"text\":\"Filii ejus atterentur egestate, et manus illius reddent ei dolorem suum.\"},{\"verse\":11,\"text\":\"Ossa ejus implebuntur vitiis adolescentiæ ejus, et cum eo in pulvere dormient.\"},{\"verse\":12,\"text\":\"Cum enim dulce fuerit in ore ejus malum, abscondet illud sub lingua sua.\"},{\"verse\":13,\"text\":\"Parcet illi, et non derelinquet illud, et celabit in gutture suo.\"},{\"verse\":14,\"text\":\"Panis ejus in utero illius vertetur in fel aspidum intrinsecus.\"},{\"verse\":15,\"text\":\"Divitias quas devoravit evomet, et de ventre illius extrahet eas Deus.\"},{\"verse\":16,\"text\":\"Caput aspidum suget, et occidet eum lingua viperæ.\"},{\"verse\":17,\"text\":\"(Non videat rivulos fluminis, torrentes mellis et butyri.)\"},{\"verse\":18,\"text\":\"Luet quæ fecit omnia, nec tamen consumetur : juxta multitudinem adinventionum suarum, sic et sustinebit.\"},{\"verse\":19,\"text\":\"Quoniam confringens nudavit pauperes : domum rapuit, et non ædificavit eam.\"},{\"verse\":20,\"text\":\"Nec est satiatus venter ejus : et cum habuerit quæ concupierat, possidere non poterit.\"},{\"verse\":21,\"text\":\"Non remansit de cibo ejus, et propterea nihil permanebit de bonis ejus.\"},{\"verse\":22,\"text\":\"Cum satiatus fuerit, arctabitur : æstuabit, et omnis dolor irruet super eum.\"},{\"verse\":23,\"text\":\"Utinam impleatur venter ejus, ut emittat in eum iram furoris sui, et pluat super illum bellum suum.\"},{\"verse\":24,\"text\":\"Fugiet arma ferrea, et irruet in arcum æreum.\"},{\"verse\":25,\"text\":\"Eductus, et egrediens de vagina sua, et fulgurans in amaritudine sua : vadent et venient super eum horribiles.\"},{\"verse\":26,\"text\":\"Omnes tenebræ absconditæ sunt in occultis ejus ; devorabit eum ignis qui non succenditur : affligetur relictus in tabernaculo suo.\"},{\"verse\":27,\"text\":\"Revelabunt cæli iniquitatem ejus, et terra consurget adversus eum.\"},{\"verse\":28,\"text\":\"Apertum erit germen domus illius : detrahetur in die furoris Dei.\"},{\"verse\":29,\"text\":\"Hæc est pars hominis impii a Deo, et hæreditas verborum ejus a Domino.\"}],\"summary\":\"Sophar declares the shortness of the prosperity of the wicked: and their sudden downfall.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":19,\"label\":\"Job 19\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":21,\"label\":\"Job 21\"}}]]\n"])</script></body></html>
