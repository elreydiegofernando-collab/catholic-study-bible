rappeth up sentences in unskilful words?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Gird up thy loins like a man: I will ask thee, and answer thou me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Where wast thou when I laid the foundations of the earth? tell me if thou hast understanding.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who hath laid the measures thereof, if thou knowest or who hath stretched the line upon it?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Upon what are its bases grounded? or who laid the corner stone thereof,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>When the morning stars praised me together, and all the sons of God made a joyful melody?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who shut up the sea with doors, when it broke forth as issuing out of the womb:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>When I made a cloud the garment thereof, and wrapped it in a mist as in swaddling bands?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I set my bounds around it, and made it bars and doors:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I said: Hitherto thou shalt come, and shalt go no further, and here thou shalt break thy swelling waves.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Didst thou since thy birth command the morning, and shew the dawning of the day its place?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And didst thou hold the extremities of the earth shaking them, and hast thou shaken the ungodly out of it?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The seal shall be restored as clay, and shall stand as a garment.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>From the wicked their light shall be taken away, and the high arm shall be broken.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hast thou entered into the depths of the sea, and walked in the lowest parts of the deep?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Have the gates of death been opened to thee, and hast thou seen the darksome doors?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hast thou considered the breadth of the earth? tell me, if thou knowest all things?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Where is the way where light dwelleth, and where is the place of darkness?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>That thou mayst bring every thing to its own bounds, and understand the paths of the house thereof.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Didst thou know then that thou shouldst be born? and didst thou know the number of thy days?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hast thou entered into the storehouses of the snow, or hast thou beheld the treasures of the hail:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Which I have prepared for the time of the enemy, against the day of battle and war?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>By what way is the light spread, and heat divided upon the earth?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Who gave a course to violent showers, or a way for noisy thunder:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>That it should rain on the earth without man in the wilderness, where no mortal dwelleth:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>That it should fill the desert and desolate land, and should bring forth green grass?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who is the father of rain? or who begot the drops of dew?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Out of whose womb came the ice? and the frost from heaven who hath gendered it?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The waters are hardened like a stone, and the surface of the deep is congealed.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Shalt thou be able to join together the shining stars the Pleiades, or canst thou stop the turning about of Arcturus?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Canst thou bring forth the day star in its time, and make the evening star to rise upon the children of the earth?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dost thou know the order of heaven, and canst thou set down the reason thereof on the earth?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Canst thou lift up thy voice to the clouds, that an abundance of waters may cover thee?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Canst thou send lightnings, and will they go, and will they return and say to thee: Here we are?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Who hath put wisdom in the heart of man? or who gave the cock understanding?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Who can declare the order of the heavens, or who can make the harmony of heaven to sleep?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>When was the dust poured on the earth, and the clods fastened together?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Wilt thou take the prey for the lioness, and satisfy the appetite of her whelps,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>When they couch in the dens and lie in wait in holes?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Who provideth food for the raven, when her young ones cry to God, wandering about, because they have no meat?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Dominus Job de turbine, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quis est iste involvens sententias sermonibus imperitis ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Accinge sicut vir lumbos tuos : interrogabo te, et responde mihi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ubi eras quando ponebam fundamenta terræ ? indica mihi, si habes intelligentiam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quis posuit mensuras ejus, si nosti ? vel quis tetendit super eam lineam ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Super quo bases illius solidatæ sunt ? aut quis demisit lapidem angularem ejus,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>cum me laudarent simul astra matutina, et jubilarent omnes filii Dei ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quis conclusit ostiis mare, quando erumpebat quasi de vulva procedens ;</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>cum ponerem nubem vestimentum ejus, et caligine illud quasi pannis infantiæ obvolverem ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Circumdedi illud terminis meis, et posui vectem et ostia,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et dixi : Usque huc venies, et non procedes amplius, et hic confringes tumentes fluctus tuos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Numquid post ortum tuum præcepisti diluculo, et ostendisti auroræ locum suum ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et tenuisti concutiens extrema terræ, et excussisti impios ex ea ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Restituetur ut lutum signaculum, et stabit sicut vestimentum :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>auferetur ab impiis lux sua, et brachium excelsum confringetur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Numquid ingressus es profunda maris, et in novissimis abyssi deambulasti ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Numquid apertæ sunt tibi portæ mortis, et ostia tenebrosa vidisti ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Numquid considerasti latitudinem terræ ? indica mihi, si nosti, omnia :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>in qua via lux habitet, et tenebrarum quis locus sit :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ut ducas unumquodque ad terminos suos, et intelligas semitas domus ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sciebas tunc quod nasciturus esses, et numerum dierum tuorum noveras ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Numquid ingressus es thesauros nivis, aut thesauros grandinis aspexisti,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quæ præparavi in tempus hostis, in diem pugnæ et belli ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Per quam viam spargitur lux, dividitur æstus super terram ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quis dedit vehementissimo imbri cursum, et viam sonantis tonitrui,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>ut plueret super terram absque homine in deserto, ubi nullus mortalium commoratur ;</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>ut impleret inviam et desolatam, et produceret herbas virentes ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quis est pluviæ pater ? vel quis genuit stillas roris ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>De cujus utero egressa est glacies ? et gelu de cælo quis genuit ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>In similitudinem lapidis aquæ durantur, et superficies abyssi constringitur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Numquid conjungere valebis micantes stellas Pleiadas, aut gyrum Arcturi poteris dissipare ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Numquid producis luciferum in tempore suo, et vesperum super filios terræ consurgere facis ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Numquid nosti ordinem cæli, et pones rationem ejus in terra ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Numquid elevabis in nebula vocem tuam, et impetus aquarum operiet te ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Numquid mittes fulgura, et ibunt, et revertentia dicent tibi : Adsumus ?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quis posuit in visceribus hominis sapientiam ? vel quis dedit gallo intelligentiam ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Quis enarrabit cælorum rationem ? et concentum cæli quis dormire faciet ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Quando fundebatur pulvis in terra, et glebæ compingebantur ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Numquid capies leænæ prædam, et animam catulorum ejus implebis,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>quando cubant in antris, et in specubus insidiantur ?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Quis præparat corvo escam suam, quando pulli ejus clamant ad Deum, vagantes, eo quod non habeant cibos ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-cente 2,\"text\":\"Who is this that wrappeth up sentences in unskilful words?\"},{\"verse\":3,\"text\":\"Gird up thy loins like a man: I will ask thee, and answer thou me.\"},{\"verse\":4,\"text\":\"Where wast thou when I laid the foundations of the earth? tell me if thou hast understanding.\"},{\"verse\":5,\"text\":\"Who hath laid the measures thereof, if thou knowest or who hath stretched the line upon it?\"},{\"verse\":6,\"text\":\"Upon what are its bases grounded? or who laid the corner stone thereof,\"},{\"verse\":7,\"text\":\"When the morning stars praised me together, and all the sons of God made a joyful melody?\"},{\"verse\":8,\"text\":\"Who shut up the sea with doors, when it broke forth as issuing out of the womb:\"},{\"verse\":9,\"text\":\"When I made a cloud the garment thereof, and wrapped it in a mist as in swaddling bands?\"},{\"verse\":10,\"text\":\"I set my bounds around it, and made it bars and doors:\"},{\"verse\":11,\"text\":\"And I said: Hitherto thou shalt come, and shalt go no further, and here thou shalt break thy swelling waves.\"},{\"verse\":12,\"text\":\"Didst thou since thy birth command the morning, and shew the dawning of the day its place?\"},{\"verse\":13,\"text\":\"And didst thou hold the extremities of the earth shaking them, and hast thou shaken the ungodly out of it?\"},{\"verse\":14,\"text\":\"The seal shall be restored as clay, and shall stand as a garment.\"},{\"verse\":15,\"text\":\"From the wicked their light shall be taken away, and the high arm shall be broken.\"},{\"verse\":16,\"text\":\"Hast thou entered into the depths of the sea, and walked in the lowest parts of the deep?\"},{\"verse\":17,\"text\":\"Have the gates of death been opened to thee, and hast thou seen the darksome doors?\"},{\"verse\":18,\"text\":\"Hast thou considered the breadth of the earth? tell me, if thou knowest all things?\"},{\"verse\":19,\"text\":\"Where is the way where light dwelleth, and where is the place of darkness?\"},{\"verse\":20,\"text\":\"That thou mayst bring every thing to its own bounds, and understand the paths of the house thereof.\"},{\"verse\":21,\"text\":\"Didst thou know then that thou shouldst be born? and didst thou know the number of thy days?\"},{\"verse\":22,\"text\":\"Hast thou entered into the storehouses of the snow, or hast thou beheld the treasures of the hail:\"},{\"verse\":23,\"text\":\"Which I have prepared for the time of the enemy, against the day of battle and war?\"},{\"verse\":24,\"text\":\"By what way is the light spread, and heat divided upon the earth?\"},{\"verse\":25,\"text\":\"Who gave a course to violent showers, or a way for noisy thunder:\"},{\"verse\":26,\"text\":\"That it should rain on the earth without man in the wilderness, where no mortal dwelleth:\"},{\"verse\":27,\"text\":\"That it should fill the desert and desolate land, and should bring forth green grass?\"},{\"verse\":28,\"text\":\"Who is the father of rain? or who begot the drops of dew?\"},{\"verse\":29,\"text\":\"Out of whose womb came the ice? and the frost from heaven who hath gendered it?\"},{\"verse\":30,\"text\":\"The waters are hardened like a stone, and the surface of the deep is congealed.\"},{\"verse\":31,\"text\":\"Shalt thou be able to join together the shining stars the Pleiades, or canst thou stop the turning about of Arcturus?\"},{\"verse\":32,\"text\":\"Canst thou bring forth the day star in its time, and make the evening star to rise upon the children of the earth?\"},{\"verse\":33,\"text\":\"Dost thou know the order of heaven, and canst thou set down the reason thereof on the earth?\"},{\"verse\":34,\"text\":\"Canst thou lift up thy voice to the clouds, that an abundance of waters may cover thee?\"},{\"verse\":35,\"text\":\"Canst thou send lightnings, and will they go, and will they return and say to thee: Here we are?\"},{\"verse\":36,\"text\":\"Who hath put wisdom in the heart of man? or who gave the cock understanding?\"},{\"verse\":37,\"text\":\"Who can declare the order of the heavens, or who can make the harmony of heaven to sleep?\"},{\"verse\":38,\"text\":\"When was the dust poured on the earth, and the clods fastened together?\"},{\"verse\":39,\"text\":\"Wilt thou take the prey for the lioness, and satisfy the appetite of her whelps,\"},{\"verse\":40,\"text\":\"When they couch in the dens and lie in wait in holes?\"},{\"verse\":41,\"text\":\"Who provideth food for the raven, when her young ones cry to God, wandering about, because they have no meat?\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Dominus Job de turbine, dixit :\"},{\"verse\":2,\"text\":\"Quis est iste involvens sententias sermonibus imperitis ?\"},{\"verse\":3,\"text\":\"Accinge sicut vir lumbos tuos : interrogabo te, et responde mihi.\"},{\"verse\":4,\"text\":\"Ubi eras quando ponebam fundamenta terræ ? indica mihi, si habes intelligentiam.\"},{\"verse\":5,\"text\":\"Quis posuit mensuras ejus, si nosti ? vel quis tetendit super eam lineam ?\"},{\"verse\":6,\"text\":\"Super quo bases illius solidatæ sunt ? aut quis demisit lapidem angularem ejus,\"},{\"verse\":7,\"text\":\"cum me laudarent simul astra matutina, et jubilarent omnes filii Dei ?\"},{\"verse\":8,\"text\":\"Quis conclusit ostiis mare, quando erumpebat quasi de vulva procedens ;\"},{\"verse\":9,\"text\":\"cum ponerem nubem vestimentum ejus, et caligine illud quasi pannis infantiæ obvolverem ?\"},{\"verse\":10,\"text\":\"Circumdedi illud terminis meis, et posui vectem et ostia,\"},{\"verse\":11,\"text\":\"et dixi : Usque huc venies, et non procedes amplius, et hic confringes tumentes fluctus tuos.\"},{\"verse\":12,\"text\":\"Numquid post ortum tuum præcepisti diluculo, et ostendisti auroræ locum suum ?\"},{\"verse\":13,\"text\":\"Et tenuisti concutiens extrema terræ, et excussisti impios ex ea ?\"},{\"verse\":14,\"text\":\"Restituetur ut lutum signaculum, et stabit sicut vestimentum :\"},{\"verse\":15,\"text\":\"auferetur ab impiis lux sua, et brachium excelsum confringetur.\"},{\"verse\":16,\"text\":\"Numquid ingressus es profunda maris, et in novissimis abyssi deambulasti ?\"},{\"verse\":17,\"text\":\"Numquid apertæ sunt tibi portæ mortis, et ostia tenebrosa vidisti ?\"},{\"verse\":18,\"text\":\"Numquid considerasti latitudinem terræ ? indica mihi, si nosti, omnia :\"},{\"verse\":19,\"text\":\"in qua via lux habitet, et tenebrarum quis locus sit :\"},{\"verse\":20,\"text\":\"ut ducas unumquodque ad terminos suos, et intelligas semitas domus ejus.\"},{\"verse\":21,\"text\":\"Sciebas tunc quod nasciturus esses, et numerum dierum tuorum noveras ?\"},{\"verse\":22,\"text\":\"Numquid ingressus es thesauros nivis, aut thesauros grandinis aspexisti,\"},{\"verse\":23,\"text\":\"quæ præparavi in tempus hostis, in diem pugnæ et belli ?\"},{\"verse\":24,\"text\":\"Per quam viam spargitur lux, dividitur æstus super terram ?\"},{\"verse\":25,\"text\":\"Quis dedit vehementissimo imbri cursum, et viam sonantis tonitrui,\"},{\"verse\":26,\"text\":\"ut plueret super terram absque homine in deserto, ubi nullus mortalium commoratur ;\"},{\"verse\":27,\"text\":\"ut impleret inviam et desolatam, et produceret herbas virentes ?\"},{\"verse\":28,\"text\":\"Quis est pluviæ pater ? vel quis genuit stillas roris ?\"},{\"verse\":29,\"text\":\"De cujus utero egressa est glacies ? et gelu de cælo quis genuit ?\"},{\"verse\":30,\"text\":\"In similitudinem lapidis aquæ durantur, et superficies abyssi constringitur.\"},{\"verse\":31,\"text\":\"Numquid conjungere valebis micantes stellas Pleiadas, aut gyrum Arcturi poteris dissipare ?\"},{\"verse\":32,\"text\":\"Numquid producis luciferum in tempore suo, et vesperum super filios terræ consurgere facis ?\"},{\"verse\":33,\"text\":\"Numquid nosti ordinem cæli, et pones rationem ejus in terra ?\"},{\"verse\":34,\"text\":\"Numquid elevabis in nebula vocem tuam, et impetus aquarum operiet te ?\"},{\"verse\":35,\"text\":\"Numquid mittes fulgura, et ibunt, et revertentia dicent tibi : Adsumus ?\"},{\"verse\":36,\"text\":\"Quis posuit in visceribus hominis sapientiam ? vel quis dedit gallo intelligentiam ?\"},{\"verse\":37,\"text\":\"Quis enarrabit cælorum rationem ? et concentum cæli quis dormire faciet ?\"},{\"verse\":38,\"text\":\"Quando fundebatur pulvis in terra, et glebæ compingebantur ?\"},{\"verse\":39,\"text\":\"Numquid capies leænæ prædam, et animam catulorum ejus implebis,\"},{\"verse\":40,\"text\":\"quando cubant in antris, et in specubus insidiantur ?\"},{\"verse\":41,\"text\":\"Quis præparat corvo escam suam, quando pulli ejus clamant ad Deum, vagantes, eo quod non habeant cibos ?\"}],\"summary\":\"God interposes and shews from the things he hath made, that man cannot comprehend his power and wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":37,\"label\":\"Job 37\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":39,\"label\":\"Job 39\"}}]]\n"])</script></body></html>
