5rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Baldad the Suhite answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>How long will you throw out words? understand first, and so let us speak.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Why are we reputed as beasts, and counted vile before you?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou that destroyest thy soul in thy fury, shall the earth be forsaken for thee, and shall rocks be removed out of their place?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Shall not the light of the wicked be extinguished, and the flame of his fire not shine?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The light shall be dark in his tabernacle, and the lamp that is over him, shall be put out.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The step of his strength shall be straitened, and his own counsel shall cast him down headlong.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For he hath thrust his feet into a net, and walketh in its meshes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The sole of his foot shall be held in a snare, and thirst shall burn against him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>A gin is hidden for him in the earth, and his trap upon the path.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fears shall terrify him on every side, and shall entangle his feet.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Let his strength be wasted with famine, and let hunger invade his ribs.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let it devour the beauty of his skin, let the firstborn death consume his arms.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Let his confidence be rooted out of his tabernacle, and let destruction tread upon him like a king.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Let the companions of him that is not, dwell in his tabernacle, let brimstone be sprinkled in his tent.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let his roots be dried up beneath, and his harvest destroyed above.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let the memory of him perish from the earth, and let not his name be renowned in the streets.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He shall drive him out of light into darkness, and shall remove him out of the world.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>His seed shall not subsist, nor his offspring among his people, nor any remnants in his country.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>They that come after him shall be astonished at his day, and horror shall fall upon them that went before.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>These then are the tabernacles of the wicked, and this the place of him that knoweth not God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Baldad Suhites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Usque ad quem finem verba jactabitis ? intelligite prius, et sic loquamur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quare reputati sumus ut jumenta, et sorduimus coram vobis ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui perdis animam tuam in furore tuo, numquid propter te derelinquetur terra, et transferentur rupes de loco suo ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nonne lux impii extinguetur, nec splendebit flamma ignis ejus ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Lux obtenebrescet in tabernaculo illius, et lucerna quæ super eum est extinguetur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Arctabuntur gressus virtutis ejus, et præcipitabit eum consilium suum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Immisit enim in rete pedes suos, et in maculis ejus ambulat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tenebitur planta illius laqueo, et exardescet contra eum sitis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Abscondita est in terra pedica ejus, et decipula illius super semitam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Undique terrebunt eum formidines, et involvent pedes ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Attenuetur fame robur ejus, et inedia invadat costas illius.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Devoret pulchritudinem cutis ejus ; consumat brachia illius primogenita mors.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Avellatur de tabernaculo suo fiducia ejus, et calcet super eum, quasi rex, interitus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Habitent in tabernaculo illius socii ejus qui non est ; aspergatur in tabernaculo ejus sulphur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Deorsum radices ejus siccentur : sursum autem atteratur messis ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Memoria illius pereat de terra, et non celebretur nomen ejus in plateis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Expellet eum de luce in tenebras, et de orbe transferet eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non erit semen ejus, neque progenies in populo suo, nec ullæ reliquiæ in regionibus ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In die ejus stupebunt novissimi, et primos invadet horror.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hæc sunt ergo tabernacula iniqui, et iste locus ejus qui ignorat Deum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 17</span></span></a><a class="flex min-h-14 items-center justify-end gap  light of the wicked be extinguished, and the flame of his fire not shine?\"},{\"verse\":6,\"text\":\"The light shall be dark in his tabernacle, and the lamp that is over him, shall be put out.\"},{\"verse\":7,\"text\":\"The step of his strength shall be straitened, and his own counsel shall cast him down headlong.\"},{\"verse\":8,\"text\":\"For he hath thrust his feet into a net, and walketh in its meshes.\"},{\"verse\":9,\"text\":\"The sole of his foot shall be held in a snare, and thirst shall burn against him.\"},{\"verse\":10,\"text\":\"A gin is hidden for him in the earth, and his trap upon the path.\"},{\"verse\":11,\"text\":\"Fears shall terrify him on every side, and shall entangle his feet.\"},{\"verse\":12,\"text\":\"Let his strength be wasted with famine, and let hunger invade his ribs.\"},{\"verse\":13,\"text\":\"Let it devour the beauty of his skin, let the firstborn death consume his arms.\"},{\"verse\":14,\"text\":\"Let his confidence be rooted out of his tabernacle, and let destruction tread upon him like a king.\"},{\"verse\":15,\"text\":\"Let the companions of him that is not, dwell in his tabernacle, let brimstone be sprinkled in his tent.\"},{\"verse\":16,\"text\":\"Let his roots be dried up beneath, and his harvest destroyed above.\"},{\"verse\":17,\"text\":\"Let the memory of him perish from the earth, and let not his name be renowned in the streets.\"},{\"verse\":18,\"text\":\"He shall drive him out of light into darkness, and shall remove him out of the world.\"},{\"verse\":19,\"text\":\"His seed shall not subsist, nor his offspring among his people, nor any remnants in his country.\"},{\"verse\":20,\"text\":\"They that come after him shall be astonished at his day, and horror shall fall upon them that went before.\"},{\"verse\":21,\"text\":\"These then are the tabernacles of the wicked, and this the place of him that knoweth not God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Baldad Suhites, dixit :\"},{\"verse\":2,\"text\":\"Usque ad quem finem verba jactabitis ? intelligite prius, et sic loquamur.\"},{\"verse\":3,\"text\":\"Quare reputati sumus ut jumenta, et sorduimus coram vobis ?\"},{\"verse\":4,\"text\":\"Qui perdis animam tuam in furore tuo, numquid propter te derelinquetur terra, et transferentur rupes de loco suo ?\"},{\"verse\":5,\"text\":\"Nonne lux impii extinguetur, nec splendebit flamma ignis ejus ?\"},{\"verse\":6,\"text\":\"Lux obtenebrescet in tabernaculo illius, et lucerna quæ super eum est extinguetur.\"},{\"verse\":7,\"text\":\"Arctabuntur gressus virtutis ejus, et præcipitabit eum consilium suum.\"},{\"verse\":8,\"text\":\"Immisit enim in rete pedes suos, et in maculis ejus ambulat.\"},{\"verse\":9,\"text\":\"Tenebitur planta illius laqueo, et exardescet contra eum sitis.\"},{\"verse\":10,\"text\":\"Abscondita est in terra pedica ejus, et decipula illius super semitam.\"},{\"verse\":11,\"text\":\"Undique terrebunt eum formidines, et involvent pedes ejus.\"},{\"verse\":12,\"text\":\"Attenuetur fame robur ejus, et inedia invadat costas illius.\"},{\"verse\":13,\"text\":\"Devoret pulchritudinem cutis ejus ; consumat brachia illius primogenita mors.\"},{\"verse\":14,\"text\":\"Avellatur de tabernaculo suo fiducia ejus, et calcet super eum, quasi rex, interitus.\"},{\"verse\":15,\"text\":\"Habitent in tabernaculo illius socii ejus qui non est ; aspergatur in tabernaculo ejus sulphur.\"},{\"verse\":16,\"text\":\"Deorsum radices ejus siccentur : sursum autem atteratur messis ejus.\"},{\"verse\":17,\"text\":\"Memoria illius pereat de terra, et non celebretur nomen ejus in plateis.\"},{\"verse\":18,\"text\":\"Expellet eum de luce in tenebras, et de orbe transferet eum.\"},{\"verse\":19,\"text\":\"Non erit semen ejus, neque progenies in populo suo, nec ullæ reliquiæ in regionibus ejus.\"},{\"verse\":20,\"text\":\"In die ejus stupebunt novissimi, et primos invadet horror.\"},{\"verse\":21,\"text\":\"Hæc sunt ergo tabernacula iniqui, et iste locus ejus qui ignorat Deum.\"}],\"summary\":\"Baldad again reproves Job and describes the miseries of the wicked.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":17,\"label\":\"Job 17\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":19,\"label\":\"Job 19\"}}]]\n"])</script></body></html>
