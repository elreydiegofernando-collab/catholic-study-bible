leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>So these three men ceased to answer Job, because he seemed just to himself.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Eliu the son of Barachel the Buzite of the kindred of Ram, was angry and was moved to indignation: now he was angry against Job, because he said he was just before God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he was angry with his friends, because they had not found a reasonable answer, but only had condemned Job.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>So Eliu waited while Job was speaking because they were his elders that were speaking.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But when he saw that the three were not able to answer, he was exceedingly angry.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then Eliu the son of Barachel the Buzite answered, and said: I am younger in days, and you are more ancient, therefore hanging down my head, I was afraid to shew you my opinion.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For I hoped that greater age would speak, and that a multitude of years would teach wisdom.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But, as I see, there is a spirit in men, and the inspiration of the Almighty giveth understanding.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They that are aged are not the wise men, neither do the ancients understand judgment.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore I will speak: Hearken to me, I also will shew you my wisdom.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For I have waited for your words, I have given ear to your wisdom, as long as you were disputing in words.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And as long as I thought you said some thing, I considered: but, as I see, there is none of you that can convince Job, and answer his words.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Lest you should say: We have found wisdom, God hath cast him down, not man.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He hath spoken nothing to me, and I will not answer him according to your words.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They were afraid, and answered no more, and they left off speaking.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Therefore because I have waited, and they have not spoken: they stood, and answered no more:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I also will answer my part, and will shew my knowledge.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For I am full of matter to speak of, and the spirit of my bowels straiteneth me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Behold, my belly is as new wine which wanteth vent, which bursteth the new vessels.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>I will speak and take breath a little: I will open my lips, and will answer.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I will not accept the person of man, and I will not level God with man.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For I know not how long I shall continue, and whether after a while my Maker may take me away.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Omiserunt autem tres viri isti respondere Job, eo quod justus sibi videretur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et iratus indignatusque est Eliu filius Barachel Buzites, de cognatione Ram : iratus est autem adversum Job, eo quod justum se esse diceret coram Deo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Porro adversum amicos ejus indignatus est, eo quod non invenissent responsionem rationabilem, sed tantummodo condemnassent Job.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Igitur Eliu expectavit Job loquentem, eo quod seniores essent qui loquebantur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cum autem vidisset quod tres respondere non potuissent, iratus est vehementer.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Respondensque Eliu filius Barachel Buzites, dixit : Junior sum tempore, vos autem antiquiores : idcirco, demisso capite, veritus sum vobis indicare meam sententiam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sperabam enim quod ætas prolixior loqueretur, et annorum multitudo doceret sapientiam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sed, ut video, spiritus est in hominibus, et inspiratio Omnipotentis dat intelligentiam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non sunt longævi sapientes, nec senes intelligunt judicium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ideo dicam : Audite me : ostendam vobis etiam ego meam sapientiam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Expectavi enim sermones vestros ; audivi prudentiam vestram, donec disceptaremini sermonibus ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et donec putabam vos aliquid dicere, considerabam : sed, ut video, non est qui possit arguere Job, et respondere ex vobis sermonibus ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ne forte dicatis : Invenimus sapientiam : Deus projecit eum, non homo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nihil locutus est mihi : et ego non secundum sermones vestros respondebo illi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Extimuerunt, nec responderunt ultra, abstuleruntque a se eloquia.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quoniam igitur expectavi, et non sunt locuti : steterunt, nec ultra responderunt :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>respondebo et ego partem meam, et ostendam scientiam meam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Plenus sum enim sermonibus, et coarctat me spiritus uteri mei.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>En venter meus quasi mustum absque spiraculo, quod lagunculas novas disrumpit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Loquar, et respirabo paululum : aperiam labia mea, et respondebo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non accipiam personam viri, et Deum homini non æquabo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nescio enim quamdiu subsistam, et si post modicum tollat me factor meus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/31/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 31</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/33/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 33</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->32<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Job 31" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 activ \"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JOB.32\",{\"bookId\":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":32,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"So these three men ceased to answer Job, because he seemed just to himself.\"},{\"verse\":2,\"text\":\"And Eliu the son of Barachel the Buzite of the kindred of Ram, was angry and was moved to indignation: now he was angry against Job, because he said he was just before God.\"},{\"verse\":3,\"text\":\"And he was angry with his friends, because they had not found a reasonable answer, but only had condemned Job.\"},{\"verse\":4,\"text\":\"So Eliu waited while Job was speaking because they were his elders that were speaking.\"},{\"verse\":5,\"text\":\"But when he saw that the three were not able to answer, he was exceedingly angry.\"},{\"verse\":6,\"text\":\"Then Eliu the son of Barachel the Buzite answered, and said: I am younger in days, and you are more ancient, therefore hanging down my head, I was afraid to shew you my opinion.\"},{\"verse\":7,\"text\":\"For I hoped that greater age would speak, and that a multitude of years would teach wisdom.\"},{\"verse\":8,\"text\":\"But, as I see, there is a spirit in men, and the inspiration of the Almighty giveth understanding.\"},{\"verse\":9,\"text\":\"They that are aged are not the wise men, neither do the ancients understand judgment.\"},{\"verse\":10,\"text\":\"Therefore I will speak: Hearken to me, I also will shew you my wisdom.\"},{\"verse\":11,\"text\":\"For I have waited for your words, I have given ear to your wisdom, as long as you were disputing in words.\"},{\"verse\":12,\"text\":\"And as long as I thought you said some thing, I considered: but, as I see, there is none of you that can convince Job, and answer his words.\"},{\"verse\":13,\"text\":\"Lest you should say: We have found wisdom, God hath cast him down, not man.\"},{\"verse\":14,\"text\":\"He hath spoken nothing to me, and I will not answer him according to your words.\"},{\"verse\":15,\"text\":\"They were afraid, and answered no more, and they left off speaking.\"},{\"verse\":16,\"text\":\"Therefore because I have waited, and they have not spoken: they stood, and answered no more:\"},{\"verse\":17,\"text\":\"I also will answer my part, and will shew my knowledge.\"},{\"verse\":18,\"text\":\"For I am full of matter to speak of, and the spirit of my bowels straiteneth me.\"},{\"verse\":19,\"text\":\"Behold, my belly is as new wine which wanteth vent, which bursteth the new vessels.\"},{\"verse\":20,\"text\":\"I will speak and take breath a little: I will open my lips, and will answer.\"},{\"verse\":21,\"text\":\"I will not accept the person of man, and I will not level God with man.\"},{\"verse\":22,\"text\":\"For I know not how long I shall continue, and whether after a while my Maker may take me away.\"}],\"vul\":[{\"verse\":1,\"text\":\"Omiserunt autem tres viri isti respondere Job, eo quod justus sibi videretur.\"},{\"verse\":2,\"text\":\"Et iratus indignatusque est Eliu filius Barachel Buzites, de cognatione Ram : iratus est autem adversum Job, eo quod justum se esse diceret coram Deo.\"},{\"verse\":3,\"text\":\"Porro adversum amicos ejus indignatus est, eo quod non invenissent responsionem rationabilem, sed tantummodo condemnassent Job.\"},{\"verse\":4,\"text\":\"Igitur Eliu expectavit Job loquentem, eo quod seniores essent qui loquebantur.\"},{\"verse\":5,\"text\":\"Cum autem vidisset quod tres respondere non potuissent, iratus est vehementer.\"},{\"verse\":6,\"text\":\"Respondensque Eliu filius Barachel Buzites, dixit : Junior sum tempore, vos autem antiquiores : idcirco, demisso capite, veritus sum vobis indicare meam sententiam.\"},{\"verse\":7,\"text\":\"Sperabam enim quod ætas prolixior loqueretur, et annorum multitudo doceret sapientiam.\"},{\"verse\":8,\"text\":\"Sed, ut video, spiritus est in hominibus, et inspiratio Omnipotentis dat intelligentiam.\"},{\"verse\":9,\"text\":\"Non sunt longævi sapientes, nec senes intelligunt judicium.\"},{\"verse\":10,\"text\":\"Ideo dicam : Audite me : ostendam vobis etiam ego meam sapientiam.\"},{\"verse\":11,\"text\":\"Expectavi enim sermones vestros ; audivi prudentiam vestram, donec disceptaremini sermonibus ;\"},{\"verse\":12,\"text\":\"et donec putabam vos aliquid dicere, considerabam : sed, ut video, non est qui possit arguere Job, et respondere ex vobis sermonibus ejus.\"},{\"verse\":13,\"text\":\"Ne forte dicatis : Invenimus sapientiam : Deus projecit eum, non homo.\"},{\"verse\":14,\"text\":\"Nihil locutus est mihi : et ego non secundum sermones vestros respondebo illi.\"},{\"verse\":15,\"text\":\"Extimuerunt, nec responderunt ultra, abstuleruntque a se eloquia.\"},{\"verse\":16,\"text\":\"Quoniam igitur expectavi, et non sunt locuti : steterunt, nec ultra responderunt :\"},{\"verse\":17,\"text\":\"respondebo et ego partem meam, et ostendam scientiam meam.\"},{\"verse\":18,\"text\":\"Plenus sum enim sermonibus, et coarctat me spiritus uteri mei.\"},{\"verse\":19,\"text\":\"En venter meus quasi mustum absque spiraculo, quod lagunculas novas disrumpit.\"},{\"verse\":20,\"text\":\"Loquar, et respirabo paululum : aperiam labia mea, et respondebo.\"},{\"verse\":21,\"text\":\"Non accipiam personam viri, et Deum homini non æquabo.\"},{\"verse\":22,\"text\":\"Nescio enim quamdiu subsistam, et si post modicum tollat me factor meus.\"}],\"summary\":\"Eliu is angry with Job and his friends. He boasts of himself.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":31,\"label\":\"Job 31\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":33,\"label\":\"Job 33\"}}]]\n"])</script></body></html>
