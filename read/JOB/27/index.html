dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Job also added, taking up his parable, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>As God liveth, who hath taken away my judgment, and the Almighty, who hath brought my soul to bitterness,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>As long as breath remaineth in me, and the spirit of God in my nostrils,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>My lips shall not speak iniquity, neither shall my tongue contrive lying.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>God forbid that I should judge you to be just: till I die I will not depart from my innocence.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>My justification, which I have begun to hold, I will not forsake: for my heart doth not reprehend me in all my life.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Let my enemy be as the ungodly, and my adversary as the wicked one.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For what is the hope of the hypocrite if through covetousness he take by violence, and God deliver not his soul?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Will God hear his cry, when distress shall come upon him?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Or can he delight himself in the Almighty, and call upon God at all times?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I will teach you by the hand of God, what the Almighty hath, and I will not conceal it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Behold you all know it, and why do you speak vain things without cause?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>This is the portion of a wicked man with God, and the inheritance of the violent, which they shall receive of the Almighty.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If his sons be multiplied, they shall be for the sword, and his grandsons shall not be filled with bread.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They that shall remain of him, shall be buried in death, and his widows shall not weep.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If he shall heap together silver as earth, and prepare raiment as clay,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He shall prepare indeed, but the just man shall be clothed with it: and the innocent shall divide the silver.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He hath built his house as a moth, and as a keeper he hath made a booth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The rich man when he shall sleep shall take away nothing with him: he shall open his eyes and find nothing.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Poverty like water shall take hold on him, a tempest shall oppress him in the night:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A burning wind shall take him up, and carry him away, and as a whirlwind shall snatch him from his place.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he shall cast upon him, and shall not spare: out of his hand he would willingly flee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He shall clasp his hands upon him, and shall hiss at him, beholding his place.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Addidit quoque Job, assumens parabolam suam, et dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vivit Deus, qui abstulit judicium meum, et Omnipotens, qui ad amaritudinem adduxit animam meam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quia donec superest halitus in me, et spiritus Dei in naribus meis,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>non loquentur labia mea iniquitatem, nec lingua mea meditabitur mendacium.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Absit a me ut justos vos esse judicem : donec deficiam, non recedam ab innocentia mea.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Justificationem meam, quam cœpi tenere, non deseram : neque enim reprehendit me cor meum in omni vita mea.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sit ut impius, inimicus meus, et adversarius meus quasi iniquus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quæ est enim spes hypocritæ, si avare rapiat, et non liberet Deus animam ejus ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Numquid Deus audiet clamorem ejus, cum venerit super eum angustia ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>aut poterit in Omnipotente delectari, et invocare Deum omni tempore ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Docebo vos per manum Dei quæ Omnipotens habeat, nec abscondam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ecce vos omnes nostis : et quid sine causa vana loquimini ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hæc est pars hominis impii apud Deum, et hæreditas violentorum, quam ob Omnipotente suscipient.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si multiplicati fuerint filii ejus, in gladio erunt, et nepotes ejus non saturabuntur pane :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui reliqui fuerint ex eo sepelientur in interitu, et viduæ illius non plorabunt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si comportaverit quasi terram argentum, et sicut lutum præparaverit vestimenta :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>præparabit quidem, sed justus vestietur illis, et argentum innocens dividet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ædificavit sicut tinea domum suam, et sicut custos fecit umbraculum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dives, cum dormierit, nihil secum auferet : aperiet oculos suos, et nihil inveniet.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Apprehendet eum quasi aqua inopia : nocte opprimet eum tempestas.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tollet eum ventus urens, et auferet, et velut turbo rapiet eum de loco suo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et mittet super eum, et non parcet : de manu ejus fugiens fugiet.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Stringet super eum manus suas, et sibilabit super illum, intuens locum ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/28/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 28</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->27<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Job 26" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-s 80\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JOB.27\",{\"bookId\":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":27,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"Job also added, taking up his parable, and said:\"},{\"verse\":2,\"text\":\"As God liveth, who hath taken away my judgment, and the Almighty, who hath brought my soul to bitterness,\"},{\"verse\":3,\"text\":\"As long as breath remaineth in me, and the spirit of God in my nostrils,\"},{\"verse\":4,\"text\":\"My lips shall not speak iniquity, neither shall my tongue contrive lying.\"},{\"verse\":5,\"text\":\"God forbid that I should judge you to be just: till I die I will not depart from my innocence.\"},{\"verse\":6,\"text\":\"My justification, which I have begun to hold, I will not forsake: for my heart doth not reprehend me in all my life.\"},{\"verse\":7,\"text\":\"Let my enemy be as the ungodly, and my adversary as the wicked one.\"},{\"verse\":8,\"text\":\"For what is the hope of the hypocrite if through covetousness he take by violence, and God deliver not his soul?\"},{\"verse\":9,\"text\":\"Will God hear his cry, when distress shall come upon him?\"},{\"verse\":10,\"text\":\"Or can he delight himself in the Almighty, and call upon God at all times?\"},{\"verse\":11,\"text\":\"I will teach you by the hand of God, what the Almighty hath, and I will not conceal it.\"},{\"verse\":12,\"text\":\"Behold you all know it, and why do you speak vain things without cause?\"},{\"verse\":13,\"text\":\"This is the portion of a wicked man with God, and the inheritance of the violent, which they shall receive of the Almighty.\"},{\"verse\":14,\"text\":\"If his sons be multiplied, they shall be for the sword, and his grandsons shall not be filled with bread.\"},{\"verse\":15,\"text\":\"They that shall remain of him, shall be buried in death, and his widows shall not weep.\"},{\"verse\":16,\"text\":\"If he shall heap together silver as earth, and prepare raiment as clay,\"},{\"verse\":17,\"text\":\"He shall prepare indeed, but the just man shall be clothed with it: and the innocent shall divide the silver.\"},{\"verse\":18,\"text\":\"He hath built his house as a moth, and as a keeper he hath made a booth.\"},{\"verse\":19,\"text\":\"The rich man when he shall sleep shall take away nothing with him: he shall open his eyes and find nothing.\"},{\"verse\":20,\"text\":\"Poverty like water shall take hold on him, a tempest shall oppress him in the night:\"},{\"verse\":21,\"text\":\"A burning wind shall take him up, and carry him away, and as a whirlwind shall snatch him from his place.\"},{\"verse\":22,\"text\":\"And he shall cast upon him, and shall not spare: out of his hand he would willingly flee.\"},{\"verse\":23,\"text\":\"He shall clasp his hands upon him, and shall hiss at him, beholding his place.\"}],\"vul\":[{\"verse\":1,\"text\":\"Addidit quoque Job, assumens parabolam suam, et dixit :\"},{\"verse\":2,\"text\":\"Vivit Deus, qui abstulit judicium meum, et Omnipotens, qui ad amaritudinem adduxit animam meam.\"},{\"verse\":3,\"text\":\"Quia donec superest halitus in me, et spiritus Dei in naribus meis,\"},{\"verse\":4,\"text\":\"non loquentur labia mea iniquitatem, nec lingua mea meditabitur mendacium.\"},{\"verse\":5,\"text\":\"Absit a me ut justos vos esse judicem : donec deficiam, non recedam ab innocentia mea.\"},{\"verse\":6,\"text\":\"Justificationem meam, quam cœpi tenere, non deseram : neque enim reprehendit me cor meum in omni vita mea.\"},{\"verse\":7,\"text\":\"Sit ut impius, inimicus meus, et adversarius meus quasi iniquus.\"},{\"verse\":8,\"text\":\"Quæ est enim spes hypocritæ, si avare rapiat, et non liberet Deus animam ejus ?\"},{\"verse\":9,\"text\":\"Numquid Deus audiet clamorem ejus, cum venerit super eum angustia ?\"},{\"verse\":10,\"text\":\"aut poterit in Omnipotente delectari, et invocare Deum omni tempore ?\"},{\"verse\":11,\"text\":\"Docebo vos per manum Dei quæ Omnipotens habeat, nec abscondam.\"},{\"verse\":12,\"text\":\"Ecce vos omnes nostis : et quid sine causa vana loquimini ?\"},{\"verse\":13,\"text\":\"Hæc est pars hominis impii apud Deum, et hæreditas violentorum, quam ob Omnipotente suscipient.\"},{\"verse\":14,\"text\":\"Si multiplicati fuerint filii ejus, in gladio erunt, et nepotes ejus non saturabuntur pane :\"},{\"verse\":15,\"text\":\"qui reliqui fuerint ex eo sepelientur in interitu, et viduæ illius non plorabunt.\"},{\"verse\":16,\"text\":\"Si comportaverit quasi terram argentum, et sicut lutum præparaverit vestimenta :\"},{\"verse\":17,\"text\":\"præparabit quidem, sed justus vestietur illis, et argentum innocens dividet.\"},{\"verse\":18,\"text\":\"Ædificavit sicut tinea domum suam, et sicut custos fecit umbraculum.\"},{\"verse\":19,\"text\":\"Dives, cum dormierit, nihil secum auferet : aperiet oculos suos, et nihil inveniet.\"},{\"verse\":20,\"text\":\"Apprehendet eum quasi aqua inopia : nocte opprimet eum tempestas.\"},{\"verse\":21,\"text\":\"Tollet eum ventus urens, et auferet, et velut turbo rapiet eum de loco suo.\"},{\"verse\":22,\"text\":\"Et mittet super eum, et non parcet : de manu ejus fugiens fugiet.\"},{\"verse\":23,\"text\":\"Stringet super eum manus suas, et sibilabit super illum, intuens locum ejus.\"}],\"summary\":\"Job persists in asserting his own innocence, and that hypocrites will be punished in the end.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":26,\"label\":\"Job 26\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":28,\"label\":\"Job 28\"}}]]\n"])</script></body></html>
