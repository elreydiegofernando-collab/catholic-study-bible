ng-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Job answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Are you then men alone, and shall wisdom die with you?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I also have a heart as well as you: for who is ignorant of these things, which you know?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He that is mocked by his friends as I, shall call upon God and he will hear him: for the simplicity of the just man is laughed to scorn.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The lamp despised in the thoughts of the rich, is ready for the time appointed.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The tabernacles of robbers abound, and they provoke God boldly; whereas it is he that hath given all into their hands:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But ask now the beasts, and they shall teach thee: and the birds of the air, and they shall tell thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Speak to the earth, and it shall answer thee: and the fishes of the sea shall tell.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who is ignorant that the hand of the Lord hath made all these things?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In whose hand is the soul of every living thing, and the spirit of all flesh of man.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Doth not the ear discern words, and the palate of him that eateth, the taste?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In the ancient is wisdom, and in length of days prudence.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>With him is wisdom and strength, he hath counsel and understanding.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If he pull down, there is no man that can build up: if he shut up a man, there is none that can open.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>If he withhold the waters, all things shall be dried up: and if he send them out, they shall overturn the earth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>With him is strength and wisdom: he knoweth both the deceivers, and him that is deceived.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He bringeth counsellors to a foolish end, and judges to insensibility.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He looseth the belt of kings, and girdeth their loins with a cord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He leadeth away priests without glory, and overthroweth nobles.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He changeth the speech of the true speakers, and taketh away the doctrine of the aged.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He poureth contempt upon princes, and relieveth them that were oppressed.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He discovereth deep things out of darkness, and bringeth up to light the shadow of death.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He multiplieth nations, and destroyeth them, and restoreth them again after they were overthrown.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He changeth the heart of the princes of the people of the earth, and deceiveth them that they walk in vain where there is no way.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>They shall grope as in the dark, and not in the light, and he shall make them stagger like men that are drunk.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Job, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ergo vos estis soli homines, et vobiscum morietur sapientia ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et mihi est cor sicut et vobis, nec inferior vestri sum ; quis enim hæc quæ nostis ignorat ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui deridetur ab amico suo, sicut ego, invocabit Deum, et exaudiet eum : deridetur enim justi simplicitas.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Lampas contempta apud cogitationes divitum parata ad tempus statutum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Abundant tabernacula prædonum, et audacter provocant Deum, cum ipse dederit omnia in manus eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nimirum interroga jumenta, et docebunt te ; et volatilia cæli, et indicabunt tibi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Loquere terræ, et respondebit tibi, et narrabunt pisces maris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quis ignorat quod omnia hæc manus Domini fecerit ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In cujus manu anima omnis viventis, et spiritus universæ carnis hominis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nonne auris verba dijudicat ? et fauces comedentis, saporem ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In antiquis est sapientia, et in multo tempore prudentia.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Apud ipsum est sapientia et fortitudo ; ipse habet consilium et intelligentiam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si destruxerit, nemo est qui ædificet ; si incluserit hominem, nullus est qui aperiat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si continuerit aquas, omnia siccabuntur ; et si emiserit eas, subvertent terram.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Apud ipsum est fortitudo et sapientia ; ipse novit et decipientem, et eum qui decipitur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Adducit consiliarios in stultum finem, et judices in stuporem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Balteum regum dissolvit, et præcingit fune renes eorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ducit sacerdotes inglorios, et optimates supplantat :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>commutans labium veracium, et doctrinam senum auferens.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Effundit despectionem super principes, eos qui oppressi fuerant relevans.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui revelat profunda de tenebris, et producit in lucem umbram mortis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui multiplicat gentes, et perdit eas, et subversas in integrum restituit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui immutat cor principum populi terræ, et decipit eos ut frustra incedant per invium :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>palpabunt quasi in tenebris, et non in luce, et errare eos faciet quasi ebrios.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 11</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/13/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 13</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-5 ext\":\"In whose hand is the soul of every living thing, and the spirit of all flesh of man.\"},{\"verse\":11,\"text\":\"Doth not the ear discern words, and the palate of him that eateth, the taste?\"},{\"verse\":12,\"text\":\"In the ancient is wisdom, and in length of days prudence.\"},{\"verse\":13,\"text\":\"With him is wisdom and strength, he hath counsel and understanding.\"},{\"verse\":14,\"text\":\"If he pull down, there is no man that can build up: if he shut up a man, there is none that can open.\"},{\"verse\":15,\"text\":\"If he withhold the waters, all things shall be dried up: and if he send them out, they shall overturn the earth.\"},{\"verse\":16,\"text\":\"With him is strength and wisdom: he knoweth both the deceivers, and him that is deceived.\"},{\"verse\":17,\"text\":\"He bringeth counsellors to a foolish end, and judges to insensibility.\"},{\"verse\":18,\"text\":\"He looseth the belt of kings, and girdeth their loins with a cord.\"},{\"verse\":19,\"text\":\"He leadeth away priests without glory, and overthroweth nobles.\"},{\"verse\":20,\"text\":\"He changeth the speech of the true speakers, and taketh away the doctrine of the aged.\"},{\"verse\":21,\"text\":\"He poureth contempt upon princes, and relieveth them that were oppressed.\"},{\"verse\":22,\"text\":\"He discovereth deep things out of darkness, and bringeth up to light the shadow of death.\"},{\"verse\":23,\"text\":\"He multiplieth nations, and destroyeth them, and restoreth them again after they were overthrown.\"},{\"verse\":24,\"text\":\"He changeth the heart of the princes of the people of the earth, and deceiveth them that they walk in vain where there is no way.\"},{\"verse\":25,\"text\":\"They shall grope as in the dark, and not in the light, and he shall make them stagger like men that are drunk.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Job, dixit :\"},{\"verse\":2,\"text\":\"Ergo vos estis soli homines, et vobiscum morietur sapientia ?\"},{\"verse\":3,\"text\":\"Et mihi est cor sicut et vobis, nec inferior vestri sum ; quis enim hæc quæ nostis ignorat ?\"},{\"verse\":4,\"text\":\"Qui deridetur ab amico suo, sicut ego, invocabit Deum, et exaudiet eum : deridetur enim justi simplicitas.\"},{\"verse\":5,\"text\":\"Lampas contempta apud cogitationes divitum parata ad tempus statutum.\"},{\"verse\":6,\"text\":\"Abundant tabernacula prædonum, et audacter provocant Deum, cum ipse dederit omnia in manus eorum.\"},{\"verse\":7,\"text\":\"Nimirum interroga jumenta, et docebunt te ; et volatilia cæli, et indicabunt tibi.\"},{\"verse\":8,\"text\":\"Loquere terræ, et respondebit tibi, et narrabunt pisces maris.\"},{\"verse\":9,\"text\":\"Quis ignorat quod omnia hæc manus Domini fecerit ?\"},{\"verse\":10,\"text\":\"In cujus manu anima omnis viventis, et spiritus universæ carnis hominis.\"},{\"verse\":11,\"text\":\"Nonne auris verba dijudicat ? et fauces comedentis, saporem ?\"},{\"verse\":12,\"text\":\"In antiquis est sapientia, et in multo tempore prudentia.\"},{\"verse\":13,\"text\":\"Apud ipsum est sapientia et fortitudo ; ipse habet consilium et intelligentiam.\"},{\"verse\":14,\"text\":\"Si destruxerit, nemo est qui ædificet ; si incluserit hominem, nullus est qui aperiat.\"},{\"verse\":15,\"text\":\"Si continuerit aquas, omnia siccabuntur ; et si emiserit eas, subvertent terram.\"},{\"verse\":16,\"text\":\"Apud ipsum est fortitudo et sapientia ; ipse novit et decipientem, et eum qui decipitur.\"},{\"verse\":17,\"text\":\"Adducit consiliarios in stultum finem, et judices in stuporem.\"},{\"verse\":18,\"text\":\"Balteum regum dissolvit, et præcingit fune renes eorum.\"},{\"verse\":19,\"text\":\"Ducit sacerdotes inglorios, et optimates supplantat :\"},{\"verse\":20,\"text\":\"commutans labium veracium, et doctrinam senum auferens.\"},{\"verse\":21,\"text\":\"Effundit despectionem super principes, eos qui oppressi fuerant relevans.\"},{\"verse\":22,\"text\":\"Qui revelat profunda de tenebris, et producit in lucem umbram mortis.\"},{\"verse\":23,\"text\":\"Qui multiplicat gentes, et perdit eas, et subversas in integrum restituit.\"},{\"verse\":24,\"text\":\"Qui immutat cor principum populi terræ, et decipit eos ut frustra incedant per invium :\"},{\"verse\":25,\"text\":\"palpabunt quasi in tenebris, et non in luce, et errare eos faciet quasi ebrios.\"}],\"summary\":\"Job’s reply to Sophar. He extols God’s power and wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":11,\"label\":\"Job 11\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":13,\"label\":\"Job 13\"}}]]\n"])</script></body></html>
