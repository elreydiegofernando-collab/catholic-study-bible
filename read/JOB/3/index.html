5rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOB/">About <!-- -->Job</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After this, Job opened his mouth, and cursed his day,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he said:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let the day perish wherein I was born, and the night in which it was said: A man child is conceived.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let that day be turned into darkness, let not God regard it from above, and let not the light shine upon it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Let darkness, and the shadow of death, cover it, let a mist overspread it, and let it be wrapped up in bitterness.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let a darksome whirlwind seize upon that night, let it not be counted in the days of the year, nor numbered in the months.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Let that night be solitary, and not worthy of praise.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let them curse it who curse the day, who are ready to raise up a leviathan:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Let the stars be darkened with the mist thereof: let it expect light, and not see it, nor the rising of the dawning of the day:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Because it shut not up the doors of the womb that bore me, nor took away evils from my eyes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Why did I not die in the womb? why did I not perish when I came out of the belly?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Why received upon the knees? why suckled at the breasts?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For now I should have been asleep and still, and should have rest in my sleep:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>With kings and consuls of the earth, who build themselves solitudes:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Or with princes, that possess gold, and fill their houses with silver:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Or as a hidden untimely birth, I should not be; or as they that, being conceived, have not seen the light.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>There the wicked cease from tumult, and there the wearied in strength are at rest.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they sometime bound together without disquiet, have not heard the voice of the oppressor.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The small and great are there, and the servant is free from his master.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Why is light given to him that is in misery, and life to them that are in bitterness of soul?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That look for death, and it cometh not, as they that dig for a treasure:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they rejoice exceedingly when they have found the grave?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>To a man whose way is hidden, and God hath surrounded him with darkness?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Before I eat I sigh: and as overflowing waters, so is my roaring:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For the fear which I feared, hath come upon me: and that which I was afraid of, hath befallen me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Have I not dissembled? have I not kept silence? have I not been quiet? and indignation is come upon me.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post hæc aperuit Job os suum, et maledixit diei suo,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et locutus est :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pereat dies in qua natus sum, et nox in qua dictum est : Conceptus est homo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dies ille vertatur in tenebras : non requirat eum Deus desuper, et non illustretur lumine.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Obscurent eum tenebræ et umbra mortis ; occupet eum caligo, et involvatur amaritudine.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Noctem illam tenebrosus turbo possideat ; non computetur in diebus anni, nec numeretur in mensibus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sit nox illa solitaria, nec laude digna.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Maledicant ei qui maledicunt diei, qui parati sunt suscitare Leviathan.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Obtenebrentur stellæ caligine ejus ; expectet lucem, et non videat, nec ortum surgentis auroræ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quia non conclusit ostia ventris qui portavit me, nec abstulit mala ab oculis meis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quare non in vulva mortuus sum ? egressus ex utero non statim perii ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quare exceptus genibus ? cur lactatus uberibus ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc enim dormiens silerem, et somno meo requiescerem</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>cum regibus et consulibus terræ, qui ædificant sibi solitudines ;</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>aut cum principibus qui possident aurum, et replent domos suas argento ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>aut sicut abortivum absconditum non subsisterem, vel qui concepti non viderunt lucem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ibi impii cessaverunt a tumultu, et ibi requieverunt fessi robore.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et quondam vincti pariter sine molestia, non audierunt vocem exactoris.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Parvus et magnus ibi sunt, et servus liber a domino suo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quare misero data est lux, et vita his qui in amaritudine animæ sunt :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>qui expectant mortem, et non venit, quasi effodientes thesaurum ;</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>gaudentque vehementer cum invenerint sepulchrum ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>viro cujus abscondita est via et circumdedit eum Deus tenebris ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Antequam comedam, suspiro ; et tamquam inundantes aquæ, sic rugitus meus :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>quia timor quem timebam evenit mihi, et quod verebar accidit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Nonne dissimulavi ? nonne silui ? nonne quievi ? et venit super me indignatio.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<! up the doors of the womb that bore me, nor took away evils from my eyes.\"},{\"verse\":11,\"text\":\"Why did I not die in the womb? why did I not perish when I came out of the belly?\"},{\"verse\":12,\"text\":\"Why received upon the knees? why suckled at the breasts?\"},{\"verse\":13,\"text\":\"For now I should have been asleep and still, and should have rest in my sleep:\"},{\"verse\":14,\"text\":\"With kings and consuls of the earth, who build themselves solitudes:\"},{\"verse\":15,\"text\":\"Or with princes, that possess gold, and fill their houses with silver:\"},{\"verse\":16,\"text\":\"Or as a hidden untimely birth, I should not be; or as they that, being conceived, have not seen the light.\"},{\"verse\":17,\"text\":\"There the wicked cease from tumult, and there the wearied in strength are at rest.\"},{\"verse\":18,\"text\":\"And they sometime bound together without disquiet, have not heard the voice of the oppressor.\"},{\"verse\":19,\"text\":\"The small and great are there, and the servant is free from his master.\"},{\"verse\":20,\"text\":\"Why is light given to him that is in misery, and life to them that are in bitterness of soul?\"},{\"verse\":21,\"text\":\"That look for death, and it cometh not, as they that dig for a treasure:\"},{\"verse\":22,\"text\":\"And they rejoice exceedingly when they have found the grave?\"},{\"verse\":23,\"text\":\"To a man whose way is hidden, and God hath surrounded him with darkness?\"},{\"verse\":24,\"text\":\"Before I eat I sigh: and as overflowing waters, so is my roaring:\"},{\"verse\":25,\"text\":\"For the fear which I feared, hath come upon me: and that which I was afraid of, hath befallen me.\"},{\"verse\":26,\"text\":\"Have I not dissembled? have I not kept silence? have I not been quiet? and indignation is come upon me.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post hæc aperuit Job os suum, et maledixit diei suo,\"},{\"verse\":2,\"text\":\"et locutus est :\"},{\"verse\":3,\"text\":\"Pereat dies in qua natus sum, et nox in qua dictum est : Conceptus est homo.\"},{\"verse\":4,\"text\":\"Dies ille vertatur in tenebras : non requirat eum Deus desuper, et non illustretur lumine.\"},{\"verse\":5,\"text\":\"Obscurent eum tenebræ et umbra mortis ; occupet eum caligo, et involvatur amaritudine.\"},{\"verse\":6,\"text\":\"Noctem illam tenebrosus turbo possideat ; non computetur in diebus anni, nec numeretur in mensibus.\"},{\"verse\":7,\"text\":\"Sit nox illa solitaria, nec laude digna.\"},{\"verse\":8,\"text\":\"Maledicant ei qui maledicunt diei, qui parati sunt suscitare Leviathan.\"},{\"verse\":9,\"text\":\"Obtenebrentur stellæ caligine ejus ; expectet lucem, et non videat, nec ortum surgentis auroræ.\"},{\"verse\":10,\"text\":\"Quia non conclusit ostia ventris qui portavit me, nec abstulit mala ab oculis meis.\"},{\"verse\":11,\"text\":\"Quare non in vulva mortuus sum ? egressus ex utero non statim perii ?\"},{\"verse\":12,\"text\":\"Quare exceptus genibus ? cur lactatus uberibus ?\"},{\"verse\":13,\"text\":\"Nunc enim dormiens silerem, et somno meo requiescerem\"},{\"verse\":14,\"text\":\"cum regibus et consulibus terræ, qui ædificant sibi solitudines ;\"},{\"verse\":15,\"text\":\"aut cum principibus qui possident aurum, et replent domos suas argento ;\"},{\"verse\":16,\"text\":\"aut sicut abortivum absconditum non subsisterem, vel qui concepti non viderunt lucem.\"},{\"verse\":17,\"text\":\"Ibi impii cessaverunt a tumultu, et ibi requieverunt fessi robore.\"},{\"verse\":18,\"text\":\"Et quondam vincti pariter sine molestia, non audierunt vocem exactoris.\"},{\"verse\":19,\"text\":\"Parvus et magnus ibi sunt, et servus liber a domino suo.\"},{\"verse\":20,\"text\":\"Quare misero data est lux, et vita his qui in amaritudine animæ sunt :\"},{\"verse\":21,\"text\":\"qui expectant mortem, et non venit, quasi effodientes thesaurum ;\"},{\"verse\":22,\"text\":\"gaudentque vehementer cum invenerint sepulchrum ?\"},{\"verse\":23,\"text\":\"viro cujus abscondita est via et circumdedit eum Deus tenebris ?\"},{\"verse\":24,\"text\":\"Antequam comedam, suspiro ; et tamquam inundantes aquæ, sic rugitus meus :\"},{\"verse\":25,\"text\":\"quia timor quem timebam evenit mihi, et quod verebar accidit.\"},{\"verse\":26,\"text\":\"Nonne dissimulavi ? nonne silui ? nonne quievi ? et venit super me indignatio.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":2,\"label\":\"Job 2\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":4,\"label\":\"Job 4\"}}]]\n"])</script></body></html>
