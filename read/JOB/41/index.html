n type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I will not stir him up, like one that is cruel, for who can resist my countenance?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who hath given me before that I should repay him? All things that are under heaven are mine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I will not spare him, nor his mighty words, and framed to make supplication.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who can discover the face of his garment? or who can go into the midst of his mouth?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who can open the doors of his face? his teeth are terrible round about.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>His body is like molten shields, shut close up with scales pressing upon one another.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>One is joined to another, and not so much as any air can come between them:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>They stick one to another and they hold one another fast, and shall not be separated.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>His sneezing is like the shining of fire, and his eyes like the eyelids of the morning.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Out of his mouth go forth lamps, like torches of lighted fire.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Out of his nostrils goeth smoke, like that of a pot heated and boiling.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>His breath kindleth coals, and a flame cometh forth out of his mouth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In his neck strength shall dwell, and want goeth before his face.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The members of his flesh cleave one to another: he shall send lightnings against him, and they shall not be carried to another place.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>His heart shall be as hard as a stone, and as firm as a smith’s anvil,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>When he shall raise him up, the angels shall fear, and being affrighted shall purify themselves.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>When a sword shall lay at him, it shall not be able to hold, nor a spear, nor a breastplate.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For he shall esteem iron as straw, and brass as rotten wood.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The archer shall not put him to flight, the stones of the sling are to him like stubble.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>As stubble will he esteem the hammer, and he will laugh him to scorn who shaketh the spear.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The beams of the sun shall be under him, and he shall strew gold under him like mire.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He shall make the deep sea to boil like a pot, and shall make it as when ointments boil.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>A path shall shine after him, he shall esteem the deep as growing old.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>There is no power upon earth that can be compared with him who was made to fear no one,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He beholdeth every high thing, he is king over all the children of pride.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Non quasi crudelis suscitabo eum : quis enim resistere potest vultui meo ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quis ante dedit mihi, ut reddam ei ? omnia quæ sub cælo sunt, mea sunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non parcam ei, et verbis potentibus, et ad deprecandum compositis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quis revelabit faciem indumenti ejus ? et in medium oris ejus quis intrabit ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Portas vultus ejus quis aperiet ? per gyrum dentium ejus formido.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Corpus illius quasi scuta fusilia, compactum squamis se prementibus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Una uni conjungitur, et ne spiraculum quidem incedit per eas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Una alteri adhærebit, et tenentes se nequaquam separabuntur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sternutatio ejus splendor ignis, et oculi ejus ut palpebræ diluculi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>De ore ejus lampades procedunt, sicut tædæ ignis accensæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>De naribus ejus procedit fumus, sicut ollæ succensæ atque ferventis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Halitus ejus prunas ardere facit, et flamma de ore ejus egreditur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In collo ejus morabitur fortitudo, et faciem ejus præcedit egestas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Membra carnium ejus cohærentia sibi : mittet contra eum fulmina, et ad locum alium non ferentur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cor ejus indurabitur tamquam lapis, et stringetur quasi malleatoris incus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cum sublatus fuerit, timebunt angeli, et territi purgabuntur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cum apprehenderit eum gladius, subsistere non poterit, neque hasta, neque thorax :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>reputabit enim quasi paleas ferrum, et quasi lignum putridum æs.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non fugabit eum vir sagittarius : in stipulam versi sunt ei lapides fundæ.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quasi stipulam æstimabit malleum, et deridebit vibrantem hastam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sub ipso erunt radii solis, et sternet sibi aurum quasi lutum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fervescere faciet quasi ollam profundum mare, et ponet quasi cum unguenta bulliunt.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Post eum lucebit semita : æstimabit abyssum quasi senescentem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Non est super terram potestas quæ comparetur ei, qui factus est ut nullum timeret.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Omne sublime videt : ipse est rex super universos filios superbiæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/40/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 40</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/42/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 42</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->41<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fi ng.\"},{\"verse\":12,\"text\":\"His breath kindleth coals, and a flame cometh forth out of his mouth.\"},{\"verse\":13,\"text\":\"In his neck strength shall dwell, and want goeth before his face.\"},{\"verse\":14,\"text\":\"The members of his flesh cleave one to another: he shall send lightnings against him, and they shall not be carried to another place.\"},{\"verse\":15,\"text\":\"His heart shall be as hard as a stone, and as firm as a smith’s anvil,\"},{\"verse\":16,\"text\":\"When he shall raise him up, the angels shall fear, and being affrighted shall purify themselves.\"},{\"verse\":17,\"text\":\"When a sword shall lay at him, it shall not be able to hold, nor a spear, nor a breastplate.\"},{\"verse\":18,\"text\":\"For he shall esteem iron as straw, and brass as rotten wood.\"},{\"verse\":19,\"text\":\"The archer shall not put him to flight, the stones of the sling are to him like stubble.\"},{\"verse\":20,\"text\":\"As stubble will he esteem the hammer, and he will laugh him to scorn who shaketh the spear.\"},{\"verse\":21,\"text\":\"The beams of the sun shall be under him, and he shall strew gold under him like mire.\"},{\"verse\":22,\"text\":\"He shall make the deep sea to boil like a pot, and shall make it as when ointments boil.\"},{\"verse\":23,\"text\":\"A path shall shine after him, he shall esteem the deep as growing old.\"},{\"verse\":24,\"text\":\"There is no power upon earth that can be compared with him who was made to fear no one,\"},{\"verse\":25,\"text\":\"He beholdeth every high thing, he is king over all the children of pride.\"}],\"vul\":[{\"verse\":1,\"text\":\"Non quasi crudelis suscitabo eum : quis enim resistere potest vultui meo ?\"},{\"verse\":2,\"text\":\"Quis ante dedit mihi, ut reddam ei ? omnia quæ sub cælo sunt, mea sunt.\"},{\"verse\":3,\"text\":\"Non parcam ei, et verbis potentibus, et ad deprecandum compositis.\"},{\"verse\":4,\"text\":\"Quis revelabit faciem indumenti ejus ? et in medium oris ejus quis intrabit ?\"},{\"verse\":5,\"text\":\"Portas vultus ejus quis aperiet ? per gyrum dentium ejus formido.\"},{\"verse\":6,\"text\":\"Corpus illius quasi scuta fusilia, compactum squamis se prementibus.\"},{\"verse\":7,\"text\":\"Una uni conjungitur, et ne spiraculum quidem incedit per eas.\"},{\"verse\":8,\"text\":\"Una alteri adhærebit, et tenentes se nequaquam separabuntur.\"},{\"verse\":9,\"text\":\"Sternutatio ejus splendor ignis, et oculi ejus ut palpebræ diluculi.\"},{\"verse\":10,\"text\":\"De ore ejus lampades procedunt, sicut tædæ ignis accensæ.\"},{\"verse\":11,\"text\":\"De naribus ejus procedit fumus, sicut ollæ succensæ atque ferventis.\"},{\"verse\":12,\"text\":\"Halitus ejus prunas ardere facit, et flamma de ore ejus egreditur.\"},{\"verse\":13,\"text\":\"In collo ejus morabitur fortitudo, et faciem ejus præcedit egestas.\"},{\"verse\":14,\"text\":\"Membra carnium ejus cohærentia sibi : mittet contra eum fulmina, et ad locum alium non ferentur.\"},{\"verse\":15,\"text\":\"Cor ejus indurabitur tamquam lapis, et stringetur quasi malleatoris incus.\"},{\"verse\":16,\"text\":\"Cum sublatus fuerit, timebunt angeli, et territi purgabuntur.\"},{\"verse\":17,\"text\":\"Cum apprehenderit eum gladius, subsistere non poterit, neque hasta, neque thorax :\"},{\"verse\":18,\"text\":\"reputabit enim quasi paleas ferrum, et quasi lignum putridum æs.\"},{\"verse\":19,\"text\":\"Non fugabit eum vir sagittarius : in stipulam versi sunt ei lapides fundæ.\"},{\"verse\":20,\"text\":\"Quasi stipulam æstimabit malleum, et deridebit vibrantem hastam.\"},{\"verse\":21,\"text\":\"Sub ipso erunt radii solis, et sternet sibi aurum quasi lutum.\"},{\"verse\":22,\"text\":\"Fervescere faciet quasi ollam profundum mare, et ponet quasi cum unguenta bulliunt.\"},{\"verse\":23,\"text\":\"Post eum lucebit semita : æstimabit abyssum quasi senescentem.\"},{\"verse\":24,\"text\":\"Non est super terram potestas quæ comparetur ei, qui factus est ut nullum timeret.\"},{\"verse\":25,\"text\":\"Omne sublime videt : ipse
