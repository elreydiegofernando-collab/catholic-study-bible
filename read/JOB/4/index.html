5rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOB/">About <!-- -->Job</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Eliphaz, the Themanite, answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>If we begin to speak to thee, perhaps thou wilt take it ill; but who can withhold the words he hath conceived?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Behold thou hast taught many, and thou hast strengthened the weary hands:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thy words have confirmed them that were staggering, and thou hast strengthened the trembling knees:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But now the scourge is come upon thee, and thou faintest: It hath touched thee, and thou art troubled.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Where is thy fear, thy fortitude, thy patience, and the perfection of thy ways?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Remember, I pray thee, who ever perished being innocent? or when were the just destroyed?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>On the contrary, I have seen those who work iniquity, and sow sorrows, and reap them,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Perishing by the blast of God, and consumed by the spirit of his wrath.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The roaring of the lion, and the voice of the lioness, and the teeth of the whelps of lions, are broken:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The tiger hath perished for want of prey, and the young lions are scattered abroad.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now there was a word spoken to me in private, and my ears by stealth, as it were, received the veins of its whisper.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In the horror of a vision by night, when deep sleep is wont to hold men,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fear seized upon me, and trembling, and all my bones were affrighted:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when a spirit passed before me, the hair of my flesh stood up.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>There stood one whose countenance I knew not, an image before my eyes, and I heard the voice, as it were, of a gentle wind.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Shall man be justified in comparison of God, or shall a man be more pure than his maker?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Behold, they that serve him are not steadfast, and in his angels he found wickedness:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>How much more shall they that dwell in houses of clay, who have an earthly foundation, be consumed as with the moth?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>From morning till evening they shall be cut down: and because no one understandeth, they shall perish for ever.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they that shall be left, shall be taken away from them: they shall die, and not in wisdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Eliphaz Themanites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Si cœperimus loqui tibi, forsitan moleste accipies ; sed conceptum sermonem tenere quis poterit ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ecce docuisti multos, et manus lassas roborasti ;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>vacillantes confirmaverunt sermones tui, et genua trementia confortasti.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nunc autem venit super te plaga, et defecisti ; tetigit te, et conturbatus es.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ubi est timor tuus, fortitudo tua, patientia tua, et perfectio viarum tuarum ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Recordare, obsecro te, quis umquam innocens periit ? aut quando recti deleti sunt ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quin potius vidi eos qui operantur iniquitatem, et seminant dolores, et metunt eos,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>flante Deo perisse, et spiritu iræ ejus esse consumptos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Rugitus leonis, et vox leænæ, et dentes catulorum leonum contriti sunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Tigris periit, eo quod non haberet prædam, et catuli leonis dissipati sunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Porro ad me dictum est verbum absconditum, et quasi furtive suscepit auris mea venas susurri ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In horrore visionis nocturnæ, quando solet sopor occupare homines,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>pavor tenuit me, et tremor, et omnia ossa mea perterrita sunt ;</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et cum spiritus, me præsente, transiret, inhorruerunt pili carnis meæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Stetit quidam, cujus non agnoscebam vultum, imago coram oculis meis, et vocem quasi auræ lenis audivi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Numquid homo, Dei comparatione, justificabitur ? aut factore suo purior erit vir ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ecce qui serviunt ei, non sunt stabiles, et in angelis suis reperit pravitatem ;</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>quanto magis hi qui habitant domos luteas, qui terrenum habent fundamentum, consumentur velut a tinea ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De mane usque ad vesperam succidentur ; et quia nullus intelligit, in æternum peribunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui autem reliqui fuerint, auferentur ex eis ; morientur, et non in sapientia.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Jo  and thou hast strengthened the trembling knees:\"},{\"verse\":5,\"text\":\"But now the scourge is come upon thee, and thou faintest: It hath touched thee, and thou art troubled.\"},{\"verse\":6,\"text\":\"Where is thy fear, thy fortitude, thy patience, and the perfection of thy ways?\"},{\"verse\":7,\"text\":\"Remember, I pray thee, who ever perished being innocent? or when were the just destroyed?\"},{\"verse\":8,\"text\":\"On the contrary, I have seen those who work iniquity, and sow sorrows, and reap them,\"},{\"verse\":9,\"text\":\"Perishing by the blast of God, and consumed by the spirit of his wrath.\"},{\"verse\":10,\"text\":\"The roaring of the lion, and the voice of the lioness, and the teeth of the whelps of lions, are broken:\"},{\"verse\":11,\"text\":\"The tiger hath perished for want of prey, and the young lions are scattered abroad.\"},{\"verse\":12,\"text\":\"Now there was a word spoken to me in private, and my ears by stealth, as it were, received the veins of its whisper.\"},{\"verse\":13,\"text\":\"In the horror of a vision by night, when deep sleep is wont to hold men,\"},{\"verse\":14,\"text\":\"Fear seized upon me, and trembling, and all my bones were affrighted:\"},{\"verse\":15,\"text\":\"And when a spirit passed before me, the hair of my flesh stood up.\"},{\"verse\":16,\"text\":\"There stood one whose countenance I knew not, an image before my eyes, and I heard the voice, as it were, of a gentle wind.\"},{\"verse\":17,\"text\":\"Shall man be justified in comparison of God, or shall a man be more pure than his maker?\"},{\"verse\":18,\"text\":\"Behold, they that serve him are not steadfast, and in his angels he found wickedness:\"},{\"verse\":19,\"text\":\"How much more shall they that dwell in houses of clay, who have an earthly foundation, be consumed as with the moth?\"},{\"verse\":20,\"text\":\"From morning till evening they shall be cut down: and because no one understandeth, they shall perish for ever.\"},{\"verse\":21,\"text\":\"And they that shall be left, shall be taken away from them: they shall die, and not in wisdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Eliphaz Themanites, dixit :\"},{\"verse\":2,\"text\":\"Si cœperimus loqui tibi, forsitan moleste accipies ; sed conceptum sermonem tenere quis poterit ?\"},{\"verse\":3,\"text\":\"Ecce docuisti multos, et manus lassas roborasti ;\"},{\"verse\":4,\"text\":\"vacillantes confirmaverunt sermones tui, et genua trementia confortasti.\"},{\"verse\":5,\"text\":\"Nunc autem venit super te plaga, et defecisti ; tetigit te, et conturbatus es.\"},{\"verse\":6,\"text\":\"Ubi est timor tuus, fortitudo tua, patientia tua, et perfectio viarum tuarum ?\"},{\"verse\":7,\"text\":\"Recordare, obsecro te, quis umquam innocens periit ? aut quando recti deleti sunt ?\"},{\"verse\":8,\"text\":\"Quin potius vidi eos qui operantur iniquitatem, et seminant dolores, et metunt eos,\"},{\"verse\":9,\"text\":\"flante Deo perisse, et spiritu iræ ejus esse consumptos.\"},{\"verse\":10,\"text\":\"Rugitus leonis, et vox leænæ, et dentes catulorum leonum contriti sunt.\"},{\"verse\":11,\"text\":\"Tigris periit, eo quod non haberet prædam, et catuli leonis dissipati sunt.\"},{\"verse\":12,\"text\":\"Porro ad me dictum est verbum absconditum, et quasi furtive suscepit auris mea venas susurri ejus.\"},{\"verse\":13,\"text\":\"In horrore visionis nocturnæ, quando solet sopor occupare homines,\"},{\"verse\":14,\"text\":\"pavor tenuit me, et tremor, et omnia ossa mea perterrita sunt ;\"},{\"verse\":15,\"text\":\"et cum spiritus, me præsente, transiret, inhorruerunt pili carnis meæ.\"},{\"verse\":16,\"text\":\"Stetit quidam, cujus non agnoscebam vultum, imago coram oculis meis, et vocem quasi auræ lenis audivi.\"},{\"verse\":17,\"text\":\"Numquid homo, Dei comparatione, justificabitur ? aut factore suo purior erit vir ?\"},{\"verse\":18,\"text\":\"Ecce qui serviunt ei, non sunt stabiles, et in angelis suis reperit pravitatem ;\"},{\"verse\":19,\"text\":\"quanto magis hi qui habitant domos luteas, qui terrenum habent fundamentum, consumentur velut a tinea ?\"},{\"verse\":20,\"text\":\"De mane usque ad vesperam succidentur ; et quia nullus intelligit, in æternum peribunt.\"},{\"verse\":21,\"text\":\"Qui autem reliqui fuerint, auferentur ex eis ; morientur, et non in sapientia.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":3,\"label\":\"Job 3\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":5,\"label\":\"Job 5\"}}]]\n"])</script></body></html>
