1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Job answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I have often heard such things as these: you are all troublesome comforters.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Shall windy words have no end? or is it any trouble to thee to speak?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I also could speak like you: and would God your soul were for my soul.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I would comfort you also with words, and would wag my head over you.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I would strengthen you with my mouth, and would move my lips, as sparing you.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But what shall I do? If I speak, my pain will not rest: and if I hold my peace, it will not depart from me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But now my sorrow hath oppressed me, and all my limbs are brought to nothing.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>My wrinkles bear witness against me, and a false speaker riseth up against my face, contradicting me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He hath gathered together his fury against me, and threatening me he hath gnashed with his teeth upon me: my enemy hath beheld me with terrible eyes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>They have opened their mouths upon me, and reproaching me they have struck me on the cheek, they are filled with my pains.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>God hath shut me up with the unjust man, and hath delivered me into the hands of the wicked.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I that was formerly so wealthy, am all on a sudden broken to pieces: he hath taken me by my neck, he hath broken me, and hath set me up to be his mark.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He hath compassed me round about with his lances, he hath wounded my loins, he hath not spared, and hath poured out my bowels on the earth,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He hath torn me with wound upon wound, he hath rushed in upon me like a giant.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I have sowed sackcloth upon my skin, and have covered my flesh with ashes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>My face is swollen with weeping, and my eyelids are dim.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>These things have I suffered without the iniquity of my hand, when I offered pure prayers to God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>O earth, cover not thou my blood, neither let my cry find a hiding place in thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For behold my witness is in heaven, and he that knoweth my conscience is on high.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>My friends are full of words: my eye poureth out tears to God.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And O that a man might so be judged with God, as the son of man is judged with his companion!</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For behold short years pass away, and I am walking in a path by which I shall not return.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Job, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Audivi frequenter talia : consolatores onerosi omnes vos estis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Numquid habebunt finem verba ventosa ? aut aliquid tibi molestum est, si loquaris ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Poteram et ego similia vestri loqui, atque utinam esset anima vestra pro anima mea :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>consolarer et ego vos sermonibus, et moverem caput meum super vos ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>roborarem vos ore meo, et moverem labia mea, quasi parcens vobis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sed quid agam ? Si locutus fuero, non quiescet dolor meus, et si tacuero, non recedet a me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nunc autem oppressit me dolor meus, et in nihilum redacti sunt omnes artus mei.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Rugæ meæ testimonium dicunt contra me, et suscitatur falsiloquus adversus faciem meam, contradicens mihi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Collegit furorem suum in me, et comminans mihi, infremuit contra me dentibus suis : hostis meus terribilibus oculis me intuitus est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Aperuerunt super me ora sua, et exprobrantes percusserunt maxillam meam : satiati sunt pœnis meis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Conclusit me Deus apud iniquum, et manibus impiorum me tradidit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ego ille quondam opulentus, repente contritus sum : tenuit cervicem meam, confregit me, et posuit me sibi quasi in signum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Circumdedit me lanceis suis ; convulneravit lumbos meos : non pepercit, et effudit in terra viscera mea.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Concidit me vulnere super vulnus : irruit in me quasi gigas.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Saccum consui super cutem meam, et operui cinere carnem meam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Facies mea intumuit a fletu, et palpebræ meæ caligaverunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hæc passus sum absque iniquitate manus meæ, cum haberem mundas ad Deum preces.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Terra, ne operias sanguinem meum, neque inveniat in te locum latendi clamor meus :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ecce enim in cælo testis meus, et conscius meus in excelsis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Verbosi amici mei : ad Deum stillat oculus meus :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>atque utinam sic judicaretur vir cum Deo, quomodo judicatur filius hominis cum collega suo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ecce enim breves anni transeunt, et semitam per quam non revertar ambulo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 17</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->16<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Job 15" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded- ble/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JOB.16\",{\"bookId\":20,\"usfm\":\"JOB\",\"bookName\":\"Job\",\"drName\":\"Job\",\"chapter\":16,\"totalChapters\":42,\"dra\":[{\"verse\":1,\"text\":\"Then Job answered, and said:\"},{\"verse\":2,\"text\":\"I have often heard such things as these: you are all troublesome comforters.\"},{\"verse\":3,\"text\":\"Shall windy words have no end? or is it any trouble to thee to speak?\"},{\"verse\":4,\"text\":\"I also could speak like you: and would God your soul were for my soul.\"},{\"verse\":5,\"text\":\"I would comfort you also with words, and would wag my head over you.\"},{\"verse\":6,\"text\":\"I would strengthen you with my mouth, and would move my lips, as sparing you.\"},{\"verse\":7,\"text\":\"But what shall I do? If I speak, my pain will not rest: and if I hold my peace, it will not depart from me.\"},{\"verse\":8,\"text\":\"But now my sorrow hath oppressed me, and all my limbs are brought to nothing.\"},{\"verse\":9,\"text\":\"My wrinkles bear witness against me, and a false speaker riseth up against my face, contradicting me.\"},{\"verse\":10,\"text\":\"He hath gathered together his fury against me, and threatening me he hath gnashed with his teeth upon me: my enemy hath beheld me with terrible eyes.\"},{\"verse\":11,\"text\":\"They have opened their mouths upon me, and reproaching me they have struck me on the cheek, they are filled with my pains.\"},{\"verse\":12,\"text\":\"God hath shut me up with the unjust man, and hath delivered me into the hands of the wicked.\"},{\"verse\":13,\"text\":\"I that was formerly so wealthy, am all on a sudden broken to pieces: he hath taken me by my neck, he hath broken me, and hath set me up to be his mark.\"},{\"verse\":14,\"text\":\"He hath compassed me round about with his lances, he hath wounded my loins, he hath not spared, and hath poured out my bowels on the earth,\"},{\"verse\":15,\"text\":\"He hath torn me with wound upon wound, he hath rushed in upon me like a giant.\"},{\"verse\":16,\"text\":\"I have sowed sackcloth upon my skin, and have covered my flesh with ashes.\"},{\"verse\":17,\"text\":\"My face is swollen with weeping, and my eyelids are dim.\"},{\"verse\":18,\"text\":\"These things have I suffered without the iniquity of my hand, when I offered pure prayers to God.\"},{\"verse\":19,\"text\":\"O earth, cover not thou my blood, neither let my cry find a hiding place in thee.\"},{\"verse\":20,\"text\":\"For behold my witness is in heaven, and he that knoweth my conscience is on high.\"},{\"verse\":21,\"text\":\"My friends are full of words: my eye poureth out tears to God.\"},{\"verse\":22,\"text\":\"And O that a man might so be judged with God, as the son of man is judged with his companion!\"},{\"verse\":23,\"text\":\"For behold short years pass away, and I am walking in a path by which I shall not return.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Job, dixit :\"},{\"verse\":2,\"text\":\"Audivi frequenter talia : consolatores onerosi omnes vos estis.\"},{\"verse\":3,\"text\":\"Numquid habebunt finem verba ventosa ? aut aliquid tibi molestum est, si loquaris ?\"},{\"verse\":4,\"text\":\"Poteram et ego similia vestri loqui, atque utinam esset anima vestra pro anima mea :\"},{\"verse\":5,\"text\":\"consolarer et ego vos sermonibus, et moverem caput meum super vos ;\"},{\"verse\":6,\"text\":\"roborarem vos ore meo, et moverem labia mea, quasi parcens vobis.\"},{\"verse\":7,\"text\":\"Sed quid agam ? Si locutus fuero, non quiescet dolor meus, et si tacuero, non recedet a me.\"},{\"verse\":8,\"text\":\"Nunc autem oppressit me dolor meus, et in nihilum redacti sunt omnes artus mei.\"},{\"verse\":9,\"text\":\"Rugæ meæ testimonium dicunt contra me, et suscitatur falsiloquus adversus faciem meam, contradicens mihi.\"},{\"verse\":10,\"text\":\"Collegit furorem suum in me, et comminans mihi, infremuit contra me dentibus suis : hostis meus terribilibus oculis me intuitus est.\"},{\"verse\":11,\"text\":\"Aperuerunt super me ora sua, et exprobrantes percusserunt maxillam meam : satiati sunt pœnis meis.\"},{\"verse\":12,\"text\":\"Conclusit me Deus apud iniquum, et manibus impiorum me tradidit.\"},{\"verse\":13,\"text\":\"Ego ille quondam opulentus, repente contritus sum : tenuit cervicem meam, confregit me, et posuit me sibi quasi in signum.\"},{\"verse\":14,\"text\":\"Circumdedit me lanceis suis ; convulneravit lumbos meos : non pepercit, et effudit in terra viscera mea.\"},{\"verse\":15,\"text\":\"Concidit me vulnere super vulnus : irruit in me quasi gigas.\"},{\"verse\":16,\"text\":\"Saccum consui super cutem meam, et operui cinere carnem meam.\"},{\"verse\":17,\"text\":\"Facies mea intumuit a fletu, et palpebræ meæ caligaverunt.\"},{\"verse\":18,\"text\":\"Hæc passus sum absque iniquitate manus meæ, cum haberem mundas ad Deum preces.\"},{\"verse\":19,\"text\":\"Terra, ne operias sanguinem meum, neque inveniat in te locum latendi clamor meus :\"},{\"verse\":20,\"text\":\"ecce enim in cælo testis meus, et conscius meus in excelsis.\"},{\"verse\":21,\"text\":\"Verbosi amici mei : ad Deum stillat oculus meus :\"},{\"verse\":22,\"text\":\"atque utinam sic judicaretur vir cum Deo, quomodo judicatur filius hominis cum collega suo.\"},{\"verse\":23,\"text\":\"Ecce enim breves anni transeunt, et semitam per quam non revertar ambulo.\"}],\"summary\":\"Job expostulates with his friends: and appeals to the judgment of God.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":15,\"label\":\"Job 15\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":17,\"label\":\"Job 17\"}}]]\n"])</script></body></html>
