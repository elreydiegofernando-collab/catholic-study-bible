75rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Behold my eye hath seen all these things, and my ear hath heard them, and I have understood them all.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>According to your knowledge I also know: neither am I inferior to you.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But yet I will speak to the Almighty, and I desire to reason with God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Having first shewn that you are forgers of lies, and maintainers of perverse opinions.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I wish you would hold your peace, that you might be thought to be wise men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hear ye therefore my reproof, and attend to the judgment of my lips.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hath God any need of your lie, that you should speak deceitfully for him?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Do you accept this person, and do you endeavour to judge for God?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Or shall it please him, from whom nothing can be concealed? or shall he be deceived as a man, with your deceitful dealings?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He shall reprove you, because in secret you accept his person.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As soon as he shall move himself, he shall trouble you: and his dread shall fall upon you.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Your remembrance shall be compared to ashes, and your necks shall be brought to clay.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hold your peace a little while, that I may speak whatsoever my mind shall suggest to me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Why do I tear my flesh with my teeth, and carry my soul in my hands?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Although he should kill me, I will trust in him: but yet I will reprove my ways in his sight.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he shall be my saviour: for no hypocrite shall come before his presence.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hear ye my speech, and receive with your ears hidden truths.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If I shall be judged, I know that I shall be found just.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Who is he that will plead against me? let him come: why am I consumed holding my peace?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Two things only do not to me, and then from thy face I shall not be hid:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Withdraw thy hand far from me, and let not thy dread terrify me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Call me, and I will answer thee: or else I will speak, and do thou answer me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>How many are my iniquities and sins? make me know my crimes and offenses.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Why hidest thou thy face, and thinkest me thy enemy?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Against a leaf, that is carried away with the wind, thou shewest thy power, and thou pursuest a dry straw.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For thou writest bitter things against me, and wilt consume me for the sins of my youth.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Thou hast put my feet in the stocks, and hast observed all my paths, and hast considered the steps of my feet:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who am to be consumed as rottenness, and as a garment that is motheaten.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ecce omnia hæc vidit oculus meus, et audivit auris mea, et intellexi singula.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Secundum scientiam vestram et ego novi : nec inferior vestri sum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sed tamen ad Omnipotentem loquar, et disputare cum Deo cupio :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>prius vos ostendens fabricatores mendacii, et cultores perversorum dogmatum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Atque utinam taceretis, ut putaremini esse sapientes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Audite ergo correptionem meam, et judicium labiorum meorum attendite.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Numquid Deus indiget vestro mendacio, ut pro illo loquamini dolos ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>numquid faciem ejus accipitis, et pro Deo judicare nitimini ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>aut placebit ei quem celare nihil potest ? aut decipietur, ut homo, vestris fraudulentiis ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ipse vos arguet, quoniam in abscondito faciem ejus accipitis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Statim ut se commoverit, turbabit vos, et terror ejus irruet super vos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Memoria vestra comparabitur cineri, et redigentur in lutum cervices vestræ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tacete paulisper, ut loquar quodcumque mihi mens suggesserit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quare lacero carnes meas dentibus meis, et animam meam porto in manibus meis ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Etiam si occiderit me, in ipso sperabo : verumtamen vias meas in conspectu ejus arguam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et ipse erit salvator meus : non enim veniet in conspectu ejus omnis hypocrita.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Audite sermonem meum, et ænigmata percipite auribus vestris.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si fuero judicatus, scio quod justus inveniar.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quis est qui judicetur mecum ? veniat : quare tacens consumor ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Duo tantum ne facias mihi, et tunc a facie tua non abscondar :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>manum tuam longe fac a me, et formido tua non me terreat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Voca me, et ego respondebo tibi : aut certe loquar, et tu responde mihi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quantas habeo iniquitates et peccata ? scelera mea et delicta ostende mihi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Cur faciem tuam abscondis, et arbitraris me inimicum tuum ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Contra folium, quod vento rapitur, ostendis potentiam tuam, et stipulam siccam persequeris :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>scribis enim contra me amaritudines, et consumere me vis peccatis adolescentiæ meæ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Posuisti in nervo pedem meum, et observasti omnes semitas meas, et vestigia pedum meorum considerasti :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui quasi putredo consumendus sum, et quasi vestimentum quod comeditur a tinea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w \"According to your knowledge I also know: neither am I inferior to you.\"},{\"verse\":3,\"text\":\"But yet I will speak to the Almighty, and I desire to reason with God.\"},{\"verse\":4,\"text\":\"Having first shewn that you are forgers of lies, and maintainers of perverse opinions.\"},{\"verse\":5,\"text\":\"And I wish you would hold your peace, that you might be thought to be wise men.\"},{\"verse\":6,\"text\":\"Hear ye therefore my reproof, and attend to the judgment of my lips.\"},{\"verse\":7,\"text\":\"Hath God any need of your lie, that you should speak deceitfully for him?\"},{\"verse\":8,\"text\":\"Do you accept this person, and do you endeavour to judge for God?\"},{\"verse\":9,\"text\":\"Or shall it please him, from whom nothing can be concealed? or shall he be deceived as a man, with your deceitful dealings?\"},{\"verse\":10,\"text\":\"He shall reprove you, because in secret you accept his person.\"},{\"verse\":11,\"text\":\"As soon as he shall move himself, he shall trouble you: and his dread shall fall upon you.\"},{\"verse\":12,\"text\":\"Your remembrance shall be compared to ashes, and your necks shall be brought to clay.\"},{\"verse\":13,\"text\":\"Hold your peace a little while, that I may speak whatsoever my mind shall suggest to me.\"},{\"verse\":14,\"text\":\"Why do I tear my flesh with my teeth, and carry my soul in my hands?\"},{\"verse\":15,\"text\":\"Although he should kill me, I will trust in him: but yet I will reprove my ways in his sight.\"},{\"verse\":16,\"text\":\"And he shall be my saviour: for no hypocrite shall come before his presence.\"},{\"verse\":17,\"text\":\"Hear ye my speech, and receive with your ears hidden truths.\"},{\"verse\":18,\"text\":\"If I shall be judged, I know that I shall be found just.\"},{\"verse\":19,\"text\":\"Who is he that will plead against me? let him come: why am I consumed holding my peace?\"},{\"verse\":20,\"text\":\"Two things only do not to me, and then from thy face I shall not be hid:\"},{\"verse\":21,\"text\":\"Withdraw thy hand far from me, and let not thy dread terrify me.\"},{\"verse\":22,\"text\":\"Call me, and I will answer thee: or else I will speak, and do thou answer me.\"},{\"verse\":23,\"text\":\"How many are my iniquities and sins? make me know my crimes and offenses.\"},{\"verse\":24,\"text\":\"Why hidest thou thy face, and thinkest me thy enemy?\"},{\"verse\":25,\"text\":\"Against a leaf, that is carried away with the wind, thou shewest thy power, and thou pursuest a dry straw.\"},{\"verse\":26,\"text\":\"For thou writest bitter things against me, and wilt consume me for the sins of my youth.\"},{\"verse\":27,\"text\":\"Thou hast put my feet in the stocks, and hast observed all my paths, and hast considered the steps of my feet:\"},{\"verse\":28,\"text\":\"Who am to be consumed as rottenness, and as a garment that is motheaten.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ecce omnia hæc vidit oculus meus, et audivit auris mea, et intellexi singula.\"},{\"verse\":2,\"text\":\"Secundum scientiam vestram et ego novi : nec inferior vestri sum.\"},{\"verse\":3,\"text\":\"Sed tamen ad Omnipotentem loquar, et disputare cum Deo cupio :\"},{\"verse\":4,\"text\":\"prius vos ostendens fabricatores mendacii, et cultores perversorum dogmatum.\"},{\"verse\":5,\"text\":\"Atque utinam taceretis, ut putaremini esse sapientes.\"},{\"verse\":6,\"text\":\"Audite ergo correptionem meam, et judicium labiorum meorum attendite.\"},{\"verse\":7,\"text\":\"Numquid Deus indiget vestro mendacio, ut pro illo loquamini dolos ?\"},{\"verse\":8,\"text\":\"numquid faciem ejus accipitis, et pro Deo judicare nitimini ?\"},{\"verse\":9,\"text\":\"aut placebit ei quem celare nihil potest ? aut decipietur, ut homo, vestris fraudulentiis ?\"},{\"verse\":10,\"text\":\"Ipse vos arguet, quoniam in abscondito faciem ejus accipitis.\"},{\"verse\":11,\"text\":\"Statim ut se commoverit, turbabit vos, et terror ejus irruet super vos.\"},{\"verse\":12,\"text\":\"Memoria vestra comparabitur cineri, et redigentur in lutum cervices vestræ.\"},{\"verse\":13,\"text\":\"Tacete paulisper, ut loquar quodcumque mihi mens suggesserit.\"},{\"verse\":14,\"text\":\"Quare lacero carnes meas dentibus meis, et animam meam porto in manibus meis ?\"},{\"verse\":15,\"text\":\"Etiam si occiderit me, in ipso sperabo : verumtamen vias meas in conspectu ejus arguam.\"},{\"verse\":16,\"text\":\"Et ipse erit salvator meus : non enim veniet in conspectu ejus omnis hypocrita.\"},{\"verse\":17,\"text\":\"Audite sermonem meum, et ænigmata percipite auribus vestris.\"},{\"verse\":18,\"text\":\"Si fuero judicatus, scio quod justus inveniar.\"},{\"verse\":19,\"text\":\"Quis est qui judicetur mecum ? veniat : quare tacens consumor ?\"},{\"verse\":20,\"text\":\"Duo tantum ne facias mihi, et tunc a facie tua non abscondar :\"},{\"verse\":21,\"text\":\"manum tuam longe fac a me, et formido tua non me terreat.\"},{\"verse\":22,\"text\":\"Voca me, et ego respondebo tibi : aut certe loquar, et tu responde mihi.\"},{\"verse\":23,\"text\":\"Quantas habeo iniquitates et peccata ? scelera mea et delicta ostende mihi.\"},{\"verse\":24,\"text\":\"Cur faciem tuam abscondis, et arbitraris me inimicum tuum ?\"},{\"verse\":25,\"text\":\"Contra folium, quod vento rapitur, ostendis potentiam tuam, et stipulam siccam persequeris :\"},{\"verse\":26,\"text\":\"scribis enim contra me amaritudines, et consumere me vis peccatis adolescentiæ meæ.\"},{\"verse\":27,\"text\":\"Posuisti in nervo pedem meum, et observasti omnes semitas meas, et vestigia pedum meorum considerasti :\"},{\"verse\":28,\"text\":\"qui quasi putredo consumendus sum, et quasi vestimentum quod comeditur a tinea.\"}],\"summary\":\"Job persists in maintaining his innocence: and reproves his friends.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":12,\"label\":\"Job 12\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":14,\"label\":\"Job 14\"}}]]\n"])</script></body></html>
