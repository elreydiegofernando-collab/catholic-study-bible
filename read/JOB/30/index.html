t-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But now the younger in time scorn me, whose fathers I would not have set with the dogs of my flock:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The strength of whose hands was to me as nothing, and they were thought unworthy of life itself.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Barren with want and hunger, who gnawed in the wilderness, disfigured with calamity and misery.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they ate grass, and barks of trees, and the root of junipers was their food.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who snatched up these things out of the valleys, and when they had found any of them, they ran to them with a cry.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They dwelt in the desert places of torrents, and in caves of earth, or upon the gravel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They pleased themselves among these kind of things, and counted it delightful to be under the briers.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The children of foolish and base men, and not appearing at all upon the earth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now I am turned into their song, and am become their byword.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They abhor me, and flee far from me, and are not afraid to spit in my face.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For he hath opened his quiver, and hath afflicted me, and hath put a bridle into my mouth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>At the right hand of my rising, my calamities forthwith arose: they have overthrown my feet, and have overwhelmed me with their paths as with waves.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They have destroyed my ways, they have lain in wait against me, and they have prevailed, and there was none to help.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They have rushed in upon me, as when a wall is broken, and a gate opened, and have rolled themselves down to my miseries.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I am brought to nothing: as a wind thou hast taken away my desire: and my prosperity hath passed away like a cloud.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And now my soul fadeth within myself, and the days of affliction possess me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In the night my bone is pierced with sorrows: and they that feed upon me, do not sleep.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>With the multitude of them my garment is consumed, and they have girded me about, as with the collar of my coat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I am compared to dirt, and am likened to embers and ashes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>I cry to thee, and thou hearest me not: I stand up, and thou dost not regard me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou art changed to be cruel toward me, and in the hardness of thy hand thou art against me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thou hast lifted me up, and set me as it were upon the wind, and thou hast mightily dashed me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I know that thou wilt deliver me to death, where a house is appointed for every one that liveth.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But yet thou stretchest not forth thy hand to their consumption: and if they shall fall down thou wilt save.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>I wept heretofore for him that was afflicted, and my soul had compassion on the poor.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>I expected good things, and evils are come upon me: I waited for light, and darkness broke out.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>My inner parts have boiled without any rest, the days of affliction have prevented me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>I went mourning without indignation; I rose up, and cried in the crowd.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>I was the brother of dragons, and companion of ostriches.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>My skin is become black upon me, and my bones are dried up with heat.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>My harp is turned to mourning, and my organ into the voice of those that weep.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nunc autem derident me juniores tempore, quorum non dignabar patres ponere cum canibus gregis mei :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>quorum virtus manuum mihi erat pro nihilo, et vita ipsa putabantur indigni :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>egestate et fame steriles, qui rodebant in solitudine, squallentes calamitate et miseria.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et mandebant herbas, et arborum cortices, et radix juniperorum erat cibus eorum :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui de convallibus ista rapientes, cum singula reperissent, ad ea cum clamore currebant.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In desertis habitabant torrentium, et in cavernis terræ, vel super glaream :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>qui inter hujuscemodi lætabantur, et esse sub sentibus delicias computabant :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>filii stultorum et ignobilium, et in terra penitus non parentes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nunc in eorum canticum versus sum, et factus sum eis in proverbium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Abominantur me, et longe fugiunt a me, et faciem meam conspuere non verentur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pharetram enim suam aperuit, et afflixit me, et frenum posuit in os meum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ad dexteram orientis calamitates meæ illico surrexerunt : pedes meos subverterunt, et oppresserunt quasi fluctibus semitis suis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dissipaverunt itinera mea ; insidiati sunt mihi, et prævaluerunt : et non fuit qui ferret auxilium.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quasi rupto muro, et aperta janua, irruerunt super me, et ad meas miserias devoluti sunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Redactus sum in nihilum : abstulisti quasi ventus desiderium meum, et velut nubes pertransiit salus mea.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nunc autem in memetipso marcescit anima mea, et possident me dies afflictionis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nocte os meum perforatur doloribus, et qui me comedunt, non dormiunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In multitudine eorum consumitur vestimentum meum, et quasi capitio tunicæ succinxerunt me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Comparatus sum luto, et assimilatus sum favillæ et cineri.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Clamo ad te, et non exaudis me : sto, et non respicis me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Mutatus es mihi in crudelem, et in duritia manus tuæ adversaris mihi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Elevasti me, et quasi super ventum ponens ; elisisti me valide.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Scio quia morti trades me, ubi constituta est domus omni viventi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Verumtamen non ad consumptionem eorum emittis manum tuam : et si corruerint, ipse salvabis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Flebam quondam super eo qui afflictus erat, et compatiebatur anima mea pauperi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Expectabam bona, et venerunt mihi mala : præstolabar lucem, et eruperunt tenebræ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Interiora mea efferbuerunt absque ulla requie : prævenerunt me dies afflictionis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mœrens incedebam sine furore ; consurgens, in turba clamabam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Frater fui draconum, et socius struthionum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Cutis mea denigrata est super me, et ossa mea aruerunt præ caumate.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Versa est in luctum cithara mea, et organum meum in vocem flentium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/29/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 29</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 a out of the valleys, and when they had found any of them, they ran to them with a cry.\"},{\"verse\":6,\"text\":\"They dwelt in the desert places of torrents, and in caves of earth, or upon the gravel.\"},{\"verse\":7,\"text\":\"They pleased themselves among these kind of things, and counted it delightful to be under the briers.\"},{\"verse\":8,\"text\":\"The children of foolish and base men, and not appearing at all upon the earth.\"},{\"verse\":9,\"text\":\"Now I am turned into their song, and am become their byword.\"},{\"verse\":10,\"text\":\"They abhor me, and flee far from me, and are not afraid to spit in my face.\"},{\"verse\":11,\"text\":\"For he hath opened his quiver, and hath afflicted me, and hath put a bridle into my mouth.\"},{\"verse\":12,\"text\":\"At the right hand of my rising, my calamities forthwith arose: they have overthrown my feet, and have overwhelmed me with their paths as with waves.\"},{\"verse\":13,\"text\":\"They have destroyed my ways, they have lain in wait against me, and they have prevailed, and there was none to help.\"},{\"verse\":14,\"text\":\"They have rushed in upon me, as when a wall is broken, and a gate opened, and have rolled themselves down to my miseries.\"},{\"verse\":15,\"text\":\"I am brought to nothing: as a wind thou hast taken away my desire: and my prosperity hath passed away like a cloud.\"},{\"verse\":16,\"text\":\"And now my soul fadeth within myself, and the days of affliction possess me.\"},{\"verse\":17,\"text\":\"In the night my bone is pierced with sorrows: and they that feed upon me, do not sleep.\"},{\"verse\":18,\"text\":\"With the multitude of them my garment is consumed, and they have girded me about, as with the collar of my coat.\"},{\"verse\":19,\"text\":\"I am compared to dirt, and am likened to embers and ashes.\"},{\"verse\":20,\"text\":\"I cry to thee, and thou hearest me not: I stand up, and thou dost not regard me.\"},{\"verse\":21,\"text\":\"Thou art changed to be cruel toward me, and in the hardness of thy hand thou art against me.\"},{\"verse\":22,\"text\":\"Thou hast lifted me up, and set me as it were upon the wind, and thou hast mightily dashed me.\"},{\"verse\":23,\"text\":\"I know that thou wilt deliver me to death, where a house is appointed for every one that liveth.\"},{\"verse\":24,\"text\":\"But yet thou stretchest not forth thy hand to their consumption: and if they shall fall down thou wilt save.\"},{\"verse\":25,\"text\":\"I wept heretofore for him that was afflicted, and my soul had compassion on the poor.\"},{\"verse\":26,\"text\":\"I expected good things, and evils are come upon me: I waited for light, and darkness broke out.\"},{\"verse\":27,\"text\":\"My inner parts have boiled without any rest, the days of affliction have prevented me.\"},{\"verse\":28,\"text\":\"I went mourning without indignation; I rose up, and cried in the crowd.\"},{\"verse\":29,\"text\":\"I was the brother of dragons, and companion of ostriches.\"},{\"verse\":30,\"text\":\"My skin is become black upon me, and my bones are dried up with heat.\"},{\"verse\":31,\"text\":\"My harp is turned to mourning, and my organ into the voice of those that weep.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nunc autem derident me juniores tempore, quorum non dignabar patres ponere cum canibus gregis mei :\"},{\"verse\":2,\"text\":\"quorum virtus manuum mihi erat pro nihilo, et vita ipsa putabantur indigni :\"},{\"verse\":3,\"text\":\"egestate et fame steriles, qui rodebant in solitudine, squallentes calamitate et miseria.\"},{\"verse\":4,\"text\":\"Et mandebant herbas, et arborum cortices, et radix juniperorum erat cibus eorum :\"},{\"verse\":5,\"text\":\"qui de convallibus ista rapientes, cum singula reperissent, ad ea cum clamore currebant.\"},{\"verse\":6,\"text\":\"In desertis habitabant torrentium, et in cavernis terræ, vel super glaream :\"},{\"verse\":7,\"text\":\"qui inter hujuscemodi lætabantur, et esse sub sentibus delicias computabant :\"},{\"verse\":8,\"text\":\"filii stultorum et ignobilium, et in terra penitus non parentes.\"},{\"verse\":9,\"text\":\"Nunc in eorum canticum versus sum, et factus sum eis in proverbium.\"},{\"verse\":10,\"text\":\"Abominantur me, et longe fugiunt a me, et faciem meam conspuere non verentur.\"},{\"verse\":11,\"text\":\"Pharetram enim suam aperuit, et afflixit me, et frenum posuit in os meum.\"},{\"verse\":12,\"text\":\"Ad dexteram orientis calamitates meæ illico surrexerunt : pedes meos subverterunt, et oppresserunt quasi fluctibus semitis suis.\"},{\"verse\":13,\"text\":\"Dissipaverunt itinera mea ; insidiati sunt mihi, et prævaluerunt : et non fuit qui ferret auxilium.\"},{\"verse\":14,\"text\":\"Quasi rupto muro, et aperta janua, irruerunt super me, et ad meas miserias devoluti sunt.\"},{\"verse\":15,\"text\":\"Redactus sum in nihilum : abstulisti quasi ventus desiderium meum, et velut nubes pertransiit salus mea.\"},{\"verse\":16,\"text\":\"Nunc autem in memetipso marcescit anima mea, et possident me dies afflictionis.\"},{\"verse\":17,\"text\":\"Nocte os meum perforatur doloribus, et qui me comedunt, non dormiunt.\"},{\"verse\":18,\"text\":\"In multitudine eorum consumitur vestimentum meum, et quasi capitio tunicæ succinxerunt me.\"},{\"verse\":19,\"text\":\"Comparatus sum luto, et assimilatus sum favillæ et cineri.\"},{\"verse\":20,\"text\":\"Clamo ad te, et non exaudis me : sto, et non respicis me.\"},{\"verse\":21,\"text\":\"Mutatus es mihi in crudelem, et in duritia manus tuæ adversaris mihi.\"},{\"verse\":22,\"text\":\"Elevasti me, et quasi super ventum ponens ; elisisti me valide.\"},{\"verse\":23,\"text\":\"Scio quia morti trades me, ubi constituta est domus omni viventi.\"},{\"verse\":24,\"text\":\"Verumtamen non ad consumptionem eorum emittis manum tuam : et si corruerint, ipse salvabis.\"},{\"verse\":25,\"text\":\"Flebam quondam super eo qui afflictus erat, et compatiebatur anima mea pauperi.\"},{\"verse\":26,\"text\":\"Expectabam bona, et venerunt mihi mala : præstolabar lucem, et eruperunt tenebræ.\"},{\"verse\":27,\"text\":\"Interiora mea efferbuerunt absque ulla requie : prævenerunt me dies afflictionis.\"},{\"verse\":28,\"text\":\"Mœrens incedebam sine furore ; consurgens, in turba clamabam.\"},{\"verse\":29,\"text\":\"Frater fui draconum, et socius struthionum.\"},{\"verse\":30,\"text\":\"Cutis mea denigrata est super me, et ossa mea aruerunt præ caumate.\"},{\"verse\":31,\"text\":\"Versa est in luctum cithara mea, et organum meum in vocem flentium.\"}],\"summary\":\"Job shews the wonderful change of his temporal estate, from welfare to great calamity.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":29,\"label\":\"Job 29\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":31,\"label\":\"Job 31\"}}]]\n"])</script></body></html>
