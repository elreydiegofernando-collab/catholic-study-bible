t-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>At this my heart trembleth, and is moved out of its place.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hear ye attentively the terror of his voice, and the sound that cometh out of his mouth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He beholdeth under all the heavens, and his light is upon the ends of the earth.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>After it a noise shall roar, he shall thunder with the voice of his majesty, and shall not be found out, when his voice shall be heard.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>God shall thunder wonderfully with his voice, he that doth great and unsearchable things.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He commandeth the snow to go down upon the earth, and the winter rain, and the shower of his strength.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He sealeth up the hand of all men, that every one may know his works.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Then the beast shall go into his covert, and shall abide in his den.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Out of the inner parts shall a tempest come, and cold out of the north.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>When God bloweth there cometh frost, and again the waters are poured out abundantly.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Corn desireth clouds, and the clouds spread their light:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Which go round about, whithersoever the will of him that governeth them shall lead them, to whatsoever he shall command them upon the face of the whole earth:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Whether in one tribe, or in his own land, or in what place soever of his mercy he shall command them to be found.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hearken to these things, Job: Stand, and consider the wondrous works of God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dost thou know when God commanded the rains, to shew his light of his clouds?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Knowest thou the great paths of the clouds, and the perfect knowledges?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Are not thy garments hot, when the south wind blows upon the earth?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thou perhaps hast made the heavens with him, which are most strong, as if they were of molten brass.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Shew us what we may say to him: for we are wrapped up in darkness.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Who shall tell him the things I speak? even if a man shall speak, he shall be swallowed up.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But now they see not the light: the air on a sudden shall be thickened into clouds, and the wind shall pass and drive them away.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cold cometh out of the north, and to God praise with fear.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>We cannot find him worthily: he is great in strength, and in judgment, and in justice, and he is ineffable.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Therefore men shall fear him, and all that seem to themselves to be wise, shall not dare to behold him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Super hoc expavit cor meum, et emotum est de loco suo.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Audite auditionem in terrore vocis ejus, et sonum de ore illius procedentem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Subter omnes cælos ipse considerat, et lumen illius super terminos terræ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Post eum rugiet sonitus ; tonabit voce magnitudinis suæ : et non investigabitur, cum audita fuerit vox ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tonabit Deus in voce sua mirabiliter, qui facit magna et inscrutabilia ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>qui præcipit nivi ut descendat in terram, et hiemis pluviis, et imbri fortitudinis suæ ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>qui in manu omnium hominum signat, ut noverint singuli opera sua.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ingredietur bestia latibulum, et in antro suo morabitur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ab interioribus egredietur tempestas, et ab Arcturo frigus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Flante Deo, concrescit gelu, et rursum latissimæ funduntur aquæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Frumentum desiderat nubes, et nubes spargunt lumen suum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quæ lustrant per circuitum, quocumque eas voluntas gubernantis duxerit, ad omne quod præceperit illis super faciem orbis terrarum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>sive in una tribu, sive in terra sua, sive in quocumque loco misericordiæ suæ eas jusserit inveniri.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ausculta hæc, Job : sta, et considera mirabilia Dei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Numquid scis quando præceperit Deus pluviis, ut ostenderent lucem nubium ejus ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Numquid nosti semitas nubium magnas, et perfectas scientias ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nonne vestimenta tua calida sunt, cum perflata fuerit terra austro ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tu forsitan cum eo fabricatus es cælos, qui solidissimi quasi ære fusi sunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ostende nobis quid dicamus illi : nos quippe involvimur tenebris.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quis narrabit ei quæ loquor ? etiam si locutus fuerit homo, devorabitur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At nunc non vident lucem : subito aër cogetur in nubes, et ventus transiens fugabit eas.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ab aquilone aurum venit, et ad Deum formidolosa laudatio.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Digne eum invenire non possumus : magnus fortitudine, et judicio, et justitia : et enarrari non potest.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ideo timebunt eum viri, et non audebunt contemplari omnes qui sibi videntur esse sapientes.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/36/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 36</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/38/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 38</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->37<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters h clouds, and the clouds spread their light:\"},{\"verse\":12,\"text\":\"Which go round about, whithersoever the will of him that governeth them shall lead them, to whatsoever he shall command them upon the face of the whole earth:\"},{\"verse\":13,\"text\":\"Whether in one tribe, or in his own land, or in what place soever of his mercy he shall command them to be found.\"},{\"verse\":14,\"text\":\"Hearken to these things, Job: Stand, and consider the wondrous works of God.\"},{\"verse\":15,\"text\":\"Dost thou know when God commanded the rains, to shew his light of his clouds?\"},{\"verse\":16,\"text\":\"Knowest thou the great paths of the clouds, and the perfect knowledges?\"},{\"verse\":17,\"text\":\"Are not thy garments hot, when the south wind blows upon the earth?\"},{\"verse\":18,\"text\":\"Thou perhaps hast made the heavens with him, which are most strong, as if they were of molten brass.\"},{\"verse\":19,\"text\":\"Shew us what we may say to him: for we are wrapped up in darkness.\"},{\"verse\":20,\"text\":\"Who shall tell him the things I speak? even if a man shall speak, he shall be swallowed up.\"},{\"verse\":21,\"text\":\"But now they see not the light: the air on a sudden shall be thickened into clouds, and the wind shall pass and drive them away.\"},{\"verse\":22,\"text\":\"Cold cometh out of the north, and to God praise with fear.\"},{\"verse\":23,\"text\":\"We cannot find him worthily: he is great in strength, and in judgment, and in justice, and he is ineffable.\"},{\"verse\":24,\"text\":\"Therefore men shall fear him, and all that seem to themselves to be wise, shall not dare to behold him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Super hoc expavit cor meum, et emotum est de loco suo.\"},{\"verse\":2,\"text\":\"Audite auditionem in terrore vocis ejus, et sonum de ore illius procedentem.\"},{\"verse\":3,\"text\":\"Subter omnes cælos ipse considerat, et lumen illius super terminos terræ.\"},{\"verse\":4,\"text\":\"Post eum rugiet sonitus ; tonabit voce magnitudinis suæ : et non investigabitur, cum audita fuerit vox ejus.\"},{\"verse\":5,\"text\":\"Tonabit Deus in voce sua mirabiliter, qui facit magna et inscrutabilia ;\"},{\"verse\":6,\"text\":\"qui præcipit nivi ut descendat in terram, et hiemis pluviis, et imbri fortitudinis suæ ;\"},{\"verse\":7,\"text\":\"qui in manu omnium hominum signat, ut noverint singuli opera sua.\"},{\"verse\":8,\"text\":\"Ingredietur bestia latibulum, et in antro suo morabitur.\"},{\"verse\":9,\"text\":\"Ab interioribus egredietur tempestas, et ab Arcturo frigus.\"},{\"verse\":10,\"text\":\"Flante Deo, concrescit gelu, et rursum latissimæ funduntur aquæ.\"},{\"verse\":11,\"text\":\"Frumentum desiderat nubes, et nubes spargunt lumen suum.\"},{\"verse\":12,\"text\":\"Quæ lustrant per circuitum, quocumque eas voluntas gubernantis duxerit, ad omne quod præceperit illis super faciem orbis terrarum :\"},{\"verse\":13,\"text\":\"sive in una tribu, sive in terra sua, sive in quocumque loco misericordiæ suæ eas jusserit inveniri.\"},{\"verse\":14,\"text\":\"Ausculta hæc, Job : sta, et considera mirabilia Dei.\"},{\"verse\":15,\"text\":\"Numquid scis quando præceperit Deus pluviis, ut ostenderent lucem nubium ejus ?\"},{\"verse\":16,\"text\":\"Numquid nosti semitas nubium magnas, et perfectas scientias ?\"},{\"verse\":17,\"text\":\"Nonne vestimenta tua calida sunt, cum perflata fuerit terra austro ?\"},{\"verse\":18,\"text\":\"Tu forsitan cum eo fabricatus es cælos, qui solidissimi quasi ære fusi sunt.\"},{\"verse\":19,\"text\":\"Ostende nobis quid dicamus illi : nos quippe involvimur tenebris.\"},{\"verse\":20,\"text\":\"Quis narrabit ei quæ loquor ? etiam si locutus fuerit homo, devorabitur.\"},{\"verse\":21,\"text\":\"At nunc non vident lucem : subito aër cogetur in nubes, et ventus transiens fugabit eas.\"},{\"verse\":22,\"text\":\"Ab aquilone aurum venit, et ad Deum formidolosa laudatio.\"},{\"verse\":23,\"text\":\"Digne eum invenire non possumus : magnus fortitudine, et judicio, et justitia : et enarrari non potest.\"},{\"verse\":24,\"text\":\"Ideo timebunt eum viri, et non audebunt contemplari omnes qui sibi videntur esse sapientes.\"}],\"summary\":\"Eliu goes on in his discourse, shewing God’s wisdom and power, by his wonderful works.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":36,\"label\":\"Job 36\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":38,\"label\":\"Job 38\"}}]]\n"])</script></body></html>
