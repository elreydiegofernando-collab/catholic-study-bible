eading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Eliu also proceeded, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Suffer me a little, and I will shew thee: for I have yet somewhat to speak in God’s behalf.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>I will repeat my knowledge from the beginning, and I will prove my Maker just.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For indeed my words are without a lie, and perfect knowledge shall be proved to thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>God doth not cast away the mighty, whereas he himself also is mighty.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But he saveth not the wicked, and he giveth judgment to the poor.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He will not take away his eyes from the just, and he placeth kings on the throne for ever, and they are exalted.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And if they shall be in chains, and be bound with the cords of poverty:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He shall shew them their works, and their wicked deeds, because they have been violent.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He also shall open their ear, to correct them: and shall speak, that they may return from iniquity.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If they shall hear and observe, they shall accomplish their days in good, and their years in glory.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But if they hear not, they shall pass by the sword, and shall be consumed in folly.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dissemblers and crafty men prove the wrath of God, neither shall they cry when they are bound.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Their soul shall die in a storm, and their life among the effeminate.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He shall deliver the poor out of his distress, and shall open his ear in affliction.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Therefore he shall set thee at large out of the narrow mouth, and which hath no foundation under it: and the rest of thy table shall be full of fatness.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thy cause hath been judged as that of the wicked, cause and judgment thou shalt recover.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Therefore let not anger overcome thee to oppress any man: neither let multitude of gifts turn thee aside.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Lay down thy greatness without tribulation, and all the mighty of strength.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Prolong not the night that people may come up for them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Beware thou turn not aside to iniquity: for this thou hast begun to follow after misery.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Behold, God is high in his strength, and none is like him among the lawgivers.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Who can search out his ways? or who can say to him: Thou hast wrought iniquity?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Remember that thou knowest not his work, concerning which men have sung.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>All men see him, every one beholdeth afar off.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Behold, God is great, exceeding our knowledge: the number of his years is inestimable.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He lifteth up the drops of rain, and poureth out showers like floods:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Which flow from the clouds that cover all above.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>If he will spread out clouds as his tent,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And lighten with his light from above, he shall cover also the ends of the sea.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For by these he judgeth people, and giveth food to many mortals.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In his hands he hideth the light, and commandeth it to come again.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He sheweth his friend concerning it, that it is his possession, and that he may come up to it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Addens quoque Eliu, hæc locutus est :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sustine me paululum, et indicabo tibi : adhuc enim habeo quod pro Deo loquar.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Repetam scientiam meam a principio, et operatorem meum probabo justum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Vere enim absque mendacio sermones mei, et perfecta scientia probabitur tibi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Deus potentes non abjicit, cum et ipse sit potens :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>sed non salvat impios, et judicium pauperibus tribuit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non auferet a justo oculos suos : et reges in solio collocat in perpetuum, et illi eriguntur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et si fuerint in catenis, et vinciantur funibus paupertatis,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>indicabit eis opera eorum, et scelera eorum, quia violenti fuerunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Revelabit quoque aurem eorum, ut corripiat : et loquetur, ut revertantur ab iniquitate.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si audierint et observaverint, complebunt dies suos in bono, et annos suos in gloria :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>si autem non audierint, transibunt per gladium, et consumentur in stultitia.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Simulatores et callidi provocant iram Dei, neque clamabunt cum vincti fuerint.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Morietur in tempestate anima eorum, et vita eorum inter effeminatos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Eripiet de angustia sua pauperem, et revelabit in tribulatione aurem ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Igitur salvabit te de ore angusto latissime, et non habente fundamentum subter se : requies autem mensæ tuæ erit plena pinguedine.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Causa tua quasi impii judicata est : causam judiciumque recipies.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non te ergo superet ira ut aliquem opprimas : nec multitudo donorum inclinet te.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Depone magnitudinem tuam absque tribulatione, et omnes robustos fortitudine.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ne protrahas noctem, ut ascendant populi pro eis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Cave ne declines ad iniquitatem : hanc enim cœpisti sequi post miseriam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ecce Deus excelsus in fortitudine sua, et nullus ei similis in legislatoribus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quis poterit scrutari vias ejus ? aut quis potest ei dicere : Operatus es iniquitatem ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Memento quod ignores opus ejus, de quo cecinerunt viri.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Omnes homines vident eum : unusquisque intuetur procul.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ecce Deus magnus vincens scientiam nostram : numerus annorum ejus inæstimabilis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui aufert stillas pluviæ, et effundit imbres ad instar gurgitum,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui de nubibus fluunt quæ prætexunt cuncta desuper.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Si voluerit extendere nubes quasi tentorium suum,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et fulgurare lumine suo desuper, cardines quoque maris operiet.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Per hæc enim judicat populos, et dat escas multis mortalibus.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In manibus abscondit lucem, et præcepit ei ut rursus adveniat.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Annuntiat de ea amico suo, quod possessio ejus sit, et ad eam possit ascendere.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/35/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 35</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card \"verse\":6,\"text\":\"But he saveth not the wicked, and he giveth judgment to the poor.\"},{\"verse\":7,\"text\":\"He will not take away his eyes from the just, and he placeth kings on the throne for ever, and they are exalted.\"},{\"verse\":8,\"text\":\"And if they shall be in chains, and be bound with the cords of poverty:\"},{\"verse\":9,\"text\":\"He shall shew them their works, and their wicked deeds, because they have been violent.\"},{\"verse\":10,\"text\":\"He also shall open their ear, to correct them: and shall speak, that they may return from iniquity.\"},{\"verse\":11,\"text\":\"If they shall hear and observe, they shall accomplish their days in good, and their years in glory.\"},{\"verse\":12,\"text\":\"But if they hear not, they shall pass by the sword, and shall be consumed in folly.\"},{\"verse\":13,\"text\":\"Dissemblers and crafty men prove the wrath of God, neither shall they cry when they are bound.\"},{\"verse\":14,\"text\":\"Their soul shall die in a storm, and their life among the effeminate.\"},{\"verse\":15,\"text\":\"He shall deliver the poor out of his distress, and shall open his ear in affliction.\"},{\"verse\":16,\"text\":\"Therefore he shall set thee at large out of the narrow mouth, and which hath no foundation under it: and the rest of thy table shall be full of fatness.\"},{\"verse\":17,\"text\":\"Thy cause hath been judged as that of the wicked, cause and judgment thou shalt recover.\"},{\"verse\":18,\"text\":\"Therefore let not anger overcome thee to oppress any man: neither let multitude of gifts turn thee aside.\"},{\"verse\":19,\"text\":\"Lay down thy greatness without tribulation, and all the mighty of strength.\"},{\"verse\":20,\"text\":\"Prolong not the night that people may come up for them.\"},{\"verse\":21,\"text\":\"Beware thou turn not aside to iniquity: for this thou hast begun to follow after misery.\"},{\"verse\":22,\"text\":\"Behold, God is high in his strength, and none is like him among the lawgivers.\"},{\"verse\":23,\"text\":\"Who can search out his ways? or who can say to him: Thou hast wrought iniquity?\"},{\"verse\":24,\"text\":\"Remember that thou knowest not his work, concerning which men have sung.\"},{\"verse\":25,\"text\":\"All men see him, every one beholdeth afar off.\"},{\"verse\":26,\"text\":\"Behold, God is great, exceeding our knowledge: the number of his years is inestimable.\"},{\"verse\":27,\"text\":\"He lifteth up the drops of rain, and poureth out showers like floods:\"},{\"verse\":28,\"text\":\"Which flow from the clouds that cover all above.\"},{\"verse\":29,\"text\":\"If he will spread out clouds as his tent,\"},{\"verse\":30,\"text\":\"And lighten with his light from above, he shall cover also the ends of the sea.\"},{\"verse\":31,\"text\":\"For by these he judgeth people, and giveth food to many mortals.\"},{\"verse\":32,\"text\":\"In his hands he hideth the light, and commandeth it to come again.\"},{\"verse\":33,\"text\":\"He sheweth his friend concerning it, that it is his possession, and that he may come up to it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Addens quoque Eliu, hæc locutus est :\"},{\"verse\":2,\"text\":\"Sustine me paululum, et indicabo tibi : adhuc enim habeo quod pro Deo loquar.\"},{\"verse\":3,\"text\":\"Repetam scientiam meam a principio, et operatorem meum probabo justum.\"},{\"verse\":4,\"text\":\"Vere enim absque mendacio sermones mei, et perfecta scientia probabitur tibi.\"},{\"verse\":5,\"text\":\"Deus potentes non abjicit, cum et ipse sit potens :\"},{\"verse\":6,\"text\":\"sed non salvat impios, et judicium pauperibus tribuit.\"},{\"verse\":7,\"text\":\"Non auferet a justo oculos suos : et reges in solio collocat in perpetuum, et illi eriguntur.\"},{\"verse\":8,\"text\":\"Et si fuerint in catenis, et vinciantur funibus paupertatis,\"},{\"verse\":9,\"text\":\"indicabit eis opera eorum, et scelera eorum, quia violenti fuerunt.\"},{\"verse\":10,\"text\":\"Revelabit quoque aurem eorum, ut corripiat : et loquetur, ut revertantur ab iniquitate.\"},{\"verse\":11,\"text\":\"Si audierint et observaverint, complebunt dies suos in bono, et annos suos in gloria :\"},{\"verse\":12,\"text\":\"si autem non audierint, transibunt per gladium, et consumentur in stultitia.\"},{\"verse\":13,\"text\":\"Simulatores et callidi provocant iram Dei, neque clamabunt cum vincti fuerint.\"},{\"verse\":14,\"text\":\"Morietur in tempestate anima eorum, et vita eorum inter effeminatos.\"},{\"verse\":15,\"text\":\"Eripiet de angustia sua pauperem, et revelabit in tribulatione aurem ejus.\"},{\"verse\":16,\"text\":\"Igitur salvabit te de ore angusto latissime, et non habente fundamentum subter se : requies autem mensæ tuæ erit plena pinguedine.\"},{\"verse\":17,\"text\":\"Causa tua quasi impii judicata est : causam judiciumque recipies.\"},{\"verse\":18,\"text\":\"Non te ergo superet ira ut aliquem opprimas : nec multitudo donorum inclinet te.\"},{\"verse\":19,\"text\":\"Depone magnitudinem tuam absque tribulatione, et omnes robustos fortitudine.\"},{\"verse\":20,\"text\":\"Ne protrahas noctem, ut ascendant populi pro eis.\"},{\"verse\":21,\"text\":\"Cave ne declines ad iniquitatem : hanc enim cœpisti sequi post miseriam.\"},{\"verse\":22,\"text\":\"Ecce Deus excelsus in fortitudine sua, et nullus ei similis in legislatoribus.\"},{\"verse\":23,\"text\":\"Quis poterit scrutari vias ejus ? aut quis potest ei dicere : Operatus es iniquitatem ?\"},{\"verse\":24,\"text\":\"Memento quod ignores opus ejus, de quo cecinerunt viri.\"},{\"verse\":25,\"text\":\"Omnes homines vident eum : unusquisque intuetur procul.\"},{\"verse\":26,\"text\":\"Ecce Deus magnus vincens scientiam nostram : numerus annorum ejus inæstimabilis.\"},{\"verse\":27,\"text\":\"Qui aufert stillas pluviæ, et effundit imbres ad instar gurgitum,\"},{\"verse\":28,\"text\":\"qui de nubibus fluunt quæ prætexunt cuncta desuper.\"},{\"verse\":29,\"text\":\"Si voluerit extendere nubes quasi tentorium suum,\"},{\"verse\":30,\"text\":\"et fulgurare lumine suo desuper, cardines quoque maris operiet.\"},{\"verse\":31,\"text\":\"Per hæc enim judicat populos, et dat escas multis mortalibus.\"},{\"verse\":32,\"text\":\"In manibus abscondit lucem, et præcepit ei ut rursus adveniat.\"},{\"verse\":33,\"text\":\"Annuntiat de ea amico suo, quod possessio ejus sit, et ad eam possit ascendere.\"}],\"summary\":\"Eliu proceeds in setting forth the justice and power of God.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":35,\"label\":\"Job 35\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":37,\"label\":\"Job 37\"}}]]\n"])</script></body></html>
