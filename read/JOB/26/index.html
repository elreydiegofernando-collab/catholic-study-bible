t has no strength?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To whom hast thou given counsel? perhaps to him that hath no wisdom, and thou hast shewn thy very great prudence.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Whom hast thou desired to teach? was it not him that made life?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Behold the giants groan under the waters, and they that dwell with them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hell is naked before him, and there is no covering for destruction.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He stretched out the north over the empty space, and hangeth the earth upon nothing.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He bindeth up the waters in his clouds, so that they break not out and fall down together.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He withholdeth the face of his throne, and spreadeth his cloud over it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He hath set bounds about the waters, till light and darkness come to an end.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The pillars of heaven tremble, and dread at his beck.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>By his power the seas are suddenly gathered together, and his wisdom has struck the proud one.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>His spirit hath adorned the heavens, and his obstetric hand brought forth the winding serpent.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Lo, these things are said in part of his ways: and seeing we have heard scarce a little drop of his word, who shall be able to behold the thunder of his greatness?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Job dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cujus adjutor es ? numquid imbecillis ? et sustentas brachium ejus qui non est fortis ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cui dedisti consilium ? forsitan illi qui non habet sapientiam : et prudentiam tuam ostendisti plurimam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quem docere voluisti ? nonne eum qui fecit spiramentum ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ecce gigantes gemunt sub aquis, et qui habitant cum eis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nudus est infernus coram illo, et nullum est operimentum perditioni.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui extendit aquilonem super vacuum, et appendit terram super nihilum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui ligat aquas in nubibus suis, ut non erumpant pariter deorsum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui tenet vultum solii sui, et expandit super illud nebulam suam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Terminum circumdedit aquis, usque dum finiantur lux et tenebræ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Columnæ cæli contremiscunt, et pavent ad nutum ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In fortitudine illius repente maria congregata sunt, et prudentia ejus percussit superbum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Spiritus ejus ornavit cælos, et obstetricante manu ejus, eductus est coluber tortuosus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ecce hæc ex parte dicta sunt viarum ejus : et cum vix parvam stillam sermonis ejus audierimus, quis poterit tonitruum magnitudinis illius intueri ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 25</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/27/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 27</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->26<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the ric hand brought forth the winding serpent.\"},{\"verse\":14,\"text\":\"Lo, these things are said in part of his ways: and seeing we have heard scarce a little drop of his word, who shall be able to behold the thunder of his greatness?\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Job dixit :\"},{\"verse\":2,\"text\":\"Cujus adjutor es ? numquid imbecillis ? et sustentas brachium ejus qui non est fortis ?\"},{\"verse\":3,\"text\":\"Cui dedisti consilium ? forsitan illi qui non habet sapientiam : et prudentiam tuam ostendisti plurimam.\"},{\"verse\":4,\"text\":\"Quem docere voluisti ? nonne eum qui fecit spiramentum ?\"},{\"verse\":5,\"text\":\"Ecce gigantes gemunt sub aquis, et qui habitant cum eis.\"},{\"verse\":6,\"text\":\"Nudus est infernus coram illo, et nullum est operimentum perditioni.\"},{\"verse\":7,\"text\":\"Qui extendit aquilonem super vacuum, et appendit terram super nihilum.\"},{\"verse\":8,\"text\":\"Qui ligat aquas in nubibus suis, ut non erumpant pariter deorsum.\"},{\"verse\":9,\"text\":\"Qui tenet vultum solii sui, et expandit super illud nebulam suam.\"},{\"verse\":10,\"text\":\"Terminum circumdedit aquis, usque dum finiantur lux et tenebræ.\"},{\"verse\":11,\"text\":\"Columnæ cæli contremiscunt, et pavent ad nutum ejus.\"},{\"verse\":12,\"text\":\"In fortitudine illius repente maria congregata sunt, et prudentia ejus percussit superbum.\"},{\"verse\":13,\"text\":\"Spiritus ejus ornavit cælos, et obstetricante manu ejus, eductus est coluber tortuosus.\"},{\"verse\":14,\"text\":\"Ecce hæc ex parte dicta sunt viarum ejus : et cum vix parvam stillam sermonis ejus audierimus, quis poterit tonitruum magnitudinis illius intueri ?\"}],\"summary\":\"Job declares his sentiments of the wisdom and power of God.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":25,\"label\":\"Job 25\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":27,\"label\":\"Job 27\"}}]]\n"])</script></body></html>
