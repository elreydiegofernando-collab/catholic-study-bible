 font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Eliphaz the Themanite answered, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Can man be compared with God, even though he were of perfect knowledge?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>What doth it profit God if thou be just? or what dost thou give him if thy way be unspotted?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Shall he reprove thee for fear, and come with thee into judgment:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And not for thy manifold wickedness and thy infinite iniquities?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For thou hast taken away the pledge of thy brethren without cause, and stripped the naked of their clothing.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou hast not given water to the weary, thou hast withdrawn bread from the hungry.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In the strength of thy arm thou didst possess the land, and being the most mighty thou holdest it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou hast sent widows away empty, and the arms of the fatherless thou hast broken in pieces.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore art thou surrounded with snares, and sudden fear troubleth thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And didst thou think that thou shouldst not see darkness, and that thou shouldst not be covered with the violence of overflowing waters?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dost not thou think that God is higher than heaven, and is elevated above the height of the stars?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And thou sayst: What doth God know? and he judgeth as it were through a mist.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The clouds are his covert, and he doth not consider our things, and he walketh about the poles of heaven.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dost thou desire to keep the path of ages, which wicked men have trodden?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Who were taken away before their time, and a flood hath overthrown their foundation.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Who said to God: Depart from us: and looked upon the Almighty as if he could do nothing:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Whereas he had filled their houses with good things: whose way of thinking be far from me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The just shall see, and shall rejoice, and the innocent shall laugh them to scorn.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Is not their exaltation cut down, and hath not fire devoured the remnants of them?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Submit thyself then to him, and be at peace: and thereby thou shalt have the best fruits.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Receive the law of his mouth, and lay up his words in thy heart.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If thou wilt return to the Almighty, thou shalt be built up, and shalt put away iniquity far from thy tabernacle.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He shall give for earth flint, and for flint torrents of gold.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the Almighty shall be against thy enemies, and silver shall be heaped together for thee.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then shalt thou abound in delights in the Almighty, and shalt lift up thy face to God.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Thou shalt pray to him, and he will hear thee, and thou shalt pay vows.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thou shalt decree a thing, and it shall come to thee, and light shall shine in thy ways.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For he that hath been humbled, shall be in glory: and he that shall bow down his eyes, he shall be saved.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The innocent shall be saved, and he shall be saved by the cleanness of his hands.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Respondens autem Eliphaz Themanites, dixit :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Numquid Deo potest comparari homo, etiam cum perfectæ fuerit scientiæ ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quid prodest Deo, si justus fueris ? aut quid ei confers, si immaculata fuerit via tua ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Numquid timens arguet te, et veniet tecum in judicium,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et non propter malitiam tuam plurimam, et infinitas iniquitates tuas ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Abstulisti enim pignus fratrum tuorum sine causa, et nudos spoliasti vestibus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Aquam lasso non dedisti, et esurienti subtraxisti panem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In fortitudine brachii tui possidebas terram, et potentissimus obtinebas eam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Viduas dimisisti vacuas, et lacertos pupillorum comminuisti.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Propterea circumdatus es laqueis, et conturbat te formido subita.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et putabas te tenebras non visurum, et impetu aquarum inundantium non oppressum iri ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>an non cogitas quod Deus excelsior cælo sit, et super stellarum verticem sublimetur ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et dicis : Quid enim novit Deus ? et quasi per caliginem judicat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nubes latibulum ejus, nec nostra considerat, et circa cardines cæli perambulat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Numquid semitam sæculorum custodire cupis, quam calcaverunt viri iniqui,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>qui sublati sunt ante tempus suum, et fluvius subvertit fundamentum eorum ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui dicebant Deo : Recede a nobis : et quasi nihil posset facere Omnipotens, æstimabant eum,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>cum ille implesset domos eorum bonis : quorum sententia procul sit a me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Videbunt justi, et lætabuntur, et innocens subsannabit eos :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>nonne succisa est erectio eorum ? et reliquias eorum devoravit ignis ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Acquiesce igitur ei, et habeto pacem, et per hæc habebis fructus optimos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Suscipe ex ore illius legem, et pone sermones ejus in corde tuo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si reversus fueris ad Omnipotentem, ædificaberis, et longe facies iniquitatem a tabernaculo tuo.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dabit pro terra silicem, et pro silice torrentes aureos.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Eritque Omnipotens contra hostes tuos, et argentum coacervabitur tibi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tunc super Omnipotentem deliciis afflues, et elevabis ad Deum faciem tuam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Rogabis eum, et exaudiet te, et vota tua reddes.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Decernes rem, et veniet tibi, et in viis tuis splendebit lumen.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Qui enim humiliatus fuerit, erit in gloria, et qui inclinaverit oculos, ipse salvabitur.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Salvabitur innocens : salvabitur autem in munditia manuum suarum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 21</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/23/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Job 23</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->22<!-- --> of <!-- -->42<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] ou think that God is higher than heaven, and is elevated above the height of the stars?\"},{\"verse\":13,\"text\":\"And thou sayst: What doth God know? and he judgeth as it were through a mist.\"},{\"verse\":14,\"text\":\"The clouds are his covert, and he doth not consider our things, and he walketh about the poles of heaven.\"},{\"verse\":15,\"text\":\"Dost thou desire to keep the path of ages, which wicked men have trodden?\"},{\"verse\":16,\"text\":\"Who were taken away before their time, and a flood hath overthrown their foundation.\"},{\"verse\":17,\"text\":\"Who said to God: Depart from us: and looked upon the Almighty as if he could do nothing:\"},{\"verse\":18,\"text\":\"Whereas he had filled their houses with good things: whose way of thinking be far from me.\"},{\"verse\":19,\"text\":\"The just shall see, and shall rejoice, and the innocent shall laugh them to scorn.\"},{\"verse\":20,\"text\":\"Is not their exaltation cut down, and hath not fire devoured the remnants of them?\"},{\"verse\":21,\"text\":\"Submit thyself then to him, and be at peace: and thereby thou shalt have the best fruits.\"},{\"verse\":22,\"text\":\"Receive the law of his mouth, and lay up his words in thy heart.\"},{\"verse\":23,\"text\":\"If thou wilt return to the Almighty, thou shalt be built up, and shalt put away iniquity far from thy tabernacle.\"},{\"verse\":24,\"text\":\"He shall give for earth flint, and for flint torrents of gold.\"},{\"verse\":25,\"text\":\"And the Almighty shall be against thy enemies, and silver shall be heaped together for thee.\"},{\"verse\":26,\"text\":\"Then shalt thou abound in delights in the Almighty, and shalt lift up thy face to God.\"},{\"verse\":27,\"text\":\"Thou shalt pray to him, and he will hear thee, and thou shalt pay vows.\"},{\"verse\":28,\"text\":\"Thou shalt decree a thing, and it shall come to thee, and light shall shine in thy ways.\"},{\"verse\":29,\"text\":\"For he that hath been humbled, shall be in glory: and he that shall bow down his eyes, he shall be saved.\"},{\"verse\":30,\"text\":\"The innocent shall be saved, and he shall be saved by the cleanness of his hands.\"}],\"vul\":[{\"verse\":1,\"text\":\"Respondens autem Eliphaz Themanites, dixit :\"},{\"verse\":2,\"text\":\"Numquid Deo potest comparari homo, etiam cum perfectæ fuerit scientiæ ?\"},{\"verse\":3,\"text\":\"Quid prodest Deo, si justus fueris ? aut quid ei confers, si immaculata fuerit via tua ?\"},{\"verse\":4,\"text\":\"Numquid timens arguet te, et veniet tecum in judicium,\"},{\"verse\":5,\"text\":\"et non propter malitiam tuam plurimam, et infinitas iniquitates tuas ?\"},{\"verse\":6,\"text\":\"Abstulisti enim pignus fratrum tuorum sine causa, et nudos spoliasti vestibus.\"},{\"verse\":7,\"text\":\"Aquam lasso non dedisti, et esurienti subtraxisti panem.\"},{\"verse\":8,\"text\":\"In fortitudine brachii tui possidebas terram, et potentissimus obtinebas eam.\"},{\"verse\":9,\"text\":\"Viduas dimisisti vacuas, et lacertos pupillorum comminuisti.\"},{\"verse\":10,\"text\":\"Propterea circumdatus es laqueis, et conturbat te formido subita.\"},{\"verse\":11,\"text\":\"Et putabas te tenebras non visurum, et impetu aquarum inundantium non oppressum iri ?\"},{\"verse\":12,\"text\":\"an non cogitas quod Deus excelsior cælo sit, et super stellarum verticem sublimetur ?\"},{\"verse\":13,\"text\":\"Et dicis : Quid enim novit Deus ? et quasi per caliginem judicat.\"},{\"verse\":14,\"text\":\"Nubes latibulum ejus, nec nostra considerat, et circa cardines cæli perambulat.\"},{\"verse\":15,\"text\":\"Numquid semitam sæculorum custodire cupis, quam calcaverunt viri iniqui,\"},{\"verse\":16,\"text\":\"qui sublati sunt ante tempus suum, et fluvius subvertit fundamentum eorum ?\"},{\"verse\":17,\"text\":\"Qui dicebant Deo : Recede a nobis : et quasi nihil posset facere Omnipotens, æstimabant eum,\"},{\"verse\":18,\"text\":\"cum ille implesset domos eorum bonis : quorum sententia procul sit a me.\"},{\"verse\":19,\"text\":\"Videbunt justi, et lætabuntur, et innocens subsannabit eos :\"},{\"verse\":20,\"text\":\"nonne succisa est erectio eorum ? et reliquias eorum devoravit ignis ?\"},{\"verse\":21,\"text\":\"Acquiesce igitur ei, et habeto pacem, et per hæc habebis fructus optimos.\"},{\"verse\":22,\"text\":\"Suscipe ex ore illius legem, et pone sermones ejus in corde tuo.\"},{\"verse\":23,\"text\":\"Si reversus fueris ad Omnipotentem, ædificaberis, et longe facies iniquitatem a tabernaculo tuo.\"},{\"verse\":24,\"text\":\"Dabit pro terra silicem, et pro silice torrentes aureos.\"},{\"verse\":25,\"text\":\"Eritque Omnipotens contra hostes tuos, et argentum coacervabitur tibi.\"},{\"verse\":26,\"text\":\"Tunc super Omnipotentem deliciis afflues, et elevabis ad Deum faciem tuam.\"},{\"verse\":27,\"text\":\"Rogabis eum, et exaudiet te, et vota tua reddes.\"},{\"verse\":28,\"text\":\"Decernes rem, et veniet tibi, et in viis tuis splendebit lumen.\"},{\"verse\":29,\"text\":\"Qui enim humiliatus fuerit, erit in gloria, et qui inclinaverit oculos, ipse salvabitur.\"},{\"verse\":30,\"text\":\"Salvabitur innocens : salvabitur autem in munditia manuum suarum.\"}],\"summary\":\"Eliphaz falsely imputes many crimes to Job, but promises him prosperity if he will repent.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":21,\"label\":\"Job 21\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":23,\"label\":\"Job 23\"}}]]\n"])</script></body></html>
