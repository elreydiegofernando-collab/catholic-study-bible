35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Job<!-- --> <span class="text-stone-500">34</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JOB/">About <!-- -->Job</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Eliu charges Job with blasphemy: and sets forth the power and justice of God.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Eliu continued his discourse, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hear ye, wise men, my words, and ye learned, hearken to me:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For the ear trieth words, and the mouth discerneth meats by the taste.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Let us choose to us judgment, and let us see among ourselves what is the best.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For Job hath said: I am just, and God hath overthrown my judgment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For in judging me there is a lie: my arrow is violent without any sin.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>What man is there like Job, who drinketh up scorning like water?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who goeth in company with them that work iniquity, and walketh with wicked men?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For he hath said: Man shall not please God, although he run with him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore, ye men of understanding, hear me: far from God be wickedness, and iniquity from the Almighty.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For he will render to a man his work, and according to the ways of every one he will reward them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For in very deed God will not condemn without cause, neither will the Almighty pervert judgment.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>What other hath he appointed over the earth? or whom hath he set over the world which he made?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If he turn his heart to him, he shall draw his spirit and breath unto himself.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>All flesh shall perish together, and man shall return into ashes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If then thou hast understanding, hear what is said, and hearken to the voice of my words.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Can he be healed that loveth not judgment? and how dost thou so far condemn him that is just?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Who saith to the king: Thou art an apostate: who calleth rulers ungodly:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Who accepteth not the persons of princes: nor hath regarded the tyrant, when he contended against the poor man: for all are the work of his hands.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>They shall suddenly die, and the people shall be troubled at midnight, and they shall pass, and take away the violent without hand.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For his eyes are upon the ways of men, and he considereth all their steps.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>There is no darkness, and there is no shadow of death, where they may be hid who work iniquity.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For it is no longer in the power of man to enter into judgment with God.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He shall break in pieces many and innumerable, and shall make others to stand in their stead.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For he knoweth their works: and therefore he shall bring night on them, and they shall be destroyed.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He hath struck them, as being wicked, in open sight.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Who as it were on purpose have revolted from him, and would not understand all his ways:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>So that they caused the cry of the needy to come to him, and he heard the voice of the poor.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For when he granteth peace, who is there that can condemn? When he hideth his countenance, who is there that can behold him, whether it regard nations, or all men?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Who maketh a man that is a hypocrite to reign for the sins of the people?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Seeing then I have spoken of God, I will not hinder thee in thy turn.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>If I have erred, teach thou me: if I have spoken iniquity, I will add no more.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Doth God require it of thee, because it hath displeased thee? for thou begannest to speak, and not I: but if thou know any thing better, speak.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Let men of understanding speak to me, and let a wise man hearken to me.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But Job hath spoken foolishly, and his words sound not discipline.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>My father, let Job be tried even to the end: cease not from the man of iniquity.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Because he addeth blasphemy upon his sins, let him be tied fast in the mean time amongst us: and then let him provoke God to judgment with his speeches.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Pronuntians itaque Eliu, etiam hæc locutus est :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Audite, sapientes, verba mea : et eruditi, auscultate me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Auris enim verba probat, et guttur escas gustu dijudicat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Judicium eligamus nobis, et inter nos videamus quid sit melius.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quia dixit Job : Justus sum, et Deus subvertit judicium meum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In judicando enim me mendacium est : violenta sagitta mea absque ullo peccato.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quis est vir ut est Job, qui bibit subsannationem quasi aquam :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui graditur cum operantibus iniquitatem, et ambulat cum viris impiis ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixit enim : Non placebit vir Deo, etiam si cucurrerit cum eo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ideo, viri cordati, audite me : absit a Deo impietas, et ab Omnipotente iniquitas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Opus enim hominis reddet ei, et juxta vias singulorum restituet eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vere enim Deus non condemnabit frustra, nec Omnipotens subvertet judicium.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quem constituit alium super terram ? aut quem posuit super orbem quem fabricatus est ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si direxerit ad eum cor suum, spiritum illius et flatum ad se trahet.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Deficiet omnis caro simul, et homo in cinerem revertetur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si habes ergo intellectum, audi quod dicitur, et ausculta vocem eloquii mei :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>numquid qui non amat judicium sanari potest ? et quomodo tu eum qui justus est in tantum condemnas ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui dicit regi : Apostata ; qui vocat duces impios ;</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>qui non accipit personas principum, nec cognovit tyrannum cum disceptaret contra pauperem : opus enim manuum ejus sunt universi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Subito morientur, et in media nocte turbabuntur populi : et pertransibunt, et auferent violentum absque manu.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Oculi enim ejus super vias hominum, et omnes gressus eorum considerat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non sunt tenebræ, et non est umbra mortis, ut abscondantur ibi qui operantur iniquitatem,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>neque enim ultra in hominis potestate est, ut veniat ad Deum in judicium.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Conteret multos, et innumerabiles, et stare faciet alios pro eis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Novit enim opera eorum, et idcirco inducet noctem, et conterentur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quasi impios percussit eos in loco videntium :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>qui quasi de industria recesserunt ab eo, et omnes vias ejus intelligere noluerunt :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>ut pervenire facerent ad eum clamorem egeni, et audiret vocem pauperum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ipso enim concedente pacem, quis est qui condemnet ? ex quo absconderit vultum, quis est qui contempletur eum, et super gentes, et super omnes homines ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Qui regnare facit hominem hypocritam propter peccata populi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Quia ergo ego locutus sum ad Deum, te quoque non prohibebo.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Si erravi, tu doce me ; si iniquitatem locutus sum, ultra non addam.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Numquid a te Deus expetit eam, quia displicuit tibi ? tu enim cœpisti loqui, et non ego : quod si quid nosti melius, loquere.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Viri intelligentes loquantur mihi, et vir sapiens audiat me.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Job autem stulte locutus est, et verba illius non sonant disciplinam.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Pater mi, probetur Job usque ad finem : ne desinas ab homine iniquitatis :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>quia addit super peccata sua blasphemiam, inter nos interim constringatur : et tunc ad judicium provocet sermonibus suis Deum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JOB/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Job 33</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read is there like Job, who drinketh up scorning like water?\"},{\"verse\":8,\"text\":\"Who goeth in company with them that work iniquity, and walketh with wicked men?\"},{\"verse\":9,\"text\":\"For he hath said: Man shall not please God, although he run with him.\"},{\"verse\":10,\"text\":\"Therefore, ye men of understanding, hear me: far from God be wickedness, and iniquity from the Almighty.\"},{\"verse\":11,\"text\":\"For he will render to a man his work, and according to the ways of every one he will reward them.\"},{\"verse\":12,\"text\":\"For in very deed God will not condemn without cause, neither will the Almighty pervert judgment.\"},{\"verse\":13,\"text\":\"What other hath he appointed over the earth? or whom hath he set over the world which he made?\"},{\"verse\":14,\"text\":\"If he turn his heart to him, he shall draw his spirit and breath unto himself.\"},{\"verse\":15,\"text\":\"All flesh shall perish together, and man shall return into ashes.\"},{\"verse\":16,\"text\":\"If then thou hast understanding, hear what is said, and hearken to the voice of my words.\"},{\"verse\":17,\"text\":\"Can he be healed that loveth not judgment? and how dost thou so far condemn him that is just?\"},{\"verse\":18,\"text\":\"Who saith to the king: Thou art an apostate: who calleth rulers ungodly:\"},{\"verse\":19,\"text\":\"Who accepteth not the persons of princes: nor hath regarded the tyrant, when he contended against the poor man: for all are the work of his hands.\"},{\"verse\":20,\"text\":\"They shall suddenly die, and the people shall be troubled at midnight, and they shall pass, and take away the violent without hand.\"},{\"verse\":21,\"text\":\"For his eyes are upon the ways of men, and he considereth all their steps.\"},{\"verse\":22,\"text\":\"There is no darkness, and there is no shadow of death, where they may be hid who work iniquity.\"},{\"verse\":23,\"text\":\"For it is no longer in the power of man to enter into judgment with God.\"},{\"verse\":24,\"text\":\"He shall break in pieces many and innumerable, and shall make others to stand in their stead.\"},{\"verse\":25,\"text\":\"For he knoweth their works: and therefore he shall bring night on them, and they shall be destroyed.\"},{\"verse\":26,\"text\":\"He hath struck them, as being wicked, in open sight.\"},{\"verse\":27,\"text\":\"Who as it were on purpose have revolted from him, and would not understand all his ways:\"},{\"verse\":28,\"text\":\"So that they caused the cry of the needy to come to him, and he heard the voice of the poor.\"},{\"verse\":29,\"text\":\"For when he granteth peace, who is there that can condemn? When he hideth his countenance, who is there that can behold him, whether it regard nations, or all men?\"},{\"verse\":30,\"text\":\"Who maketh a man that is a hypocrite to reign for the sins of the people?\"},{\"verse\":31,\"text\":\"Seeing then I have spoken of God, I will not hinder thee in thy turn.\"},{\"verse\":32,\"text\":\"If I have erred, teach thou me: if I have spoken iniquity, I will add no more.\"},{\"verse\":33,\"text\":\"Doth God require it of thee, because it hath displeased thee? for thou begannest to speak, and not I: but if thou know any thing better, speak.\"},{\"verse\":34,\"text\":\"Let men of understanding speak to me, and let a wise man hearken to me.\"},{\"verse\":35,\"text\":\"But Job hath spoken foolishly, and his words sound not discipline.\"},{\"verse\":36,\"text\":\"My father, let Job be tried even to the end: cease not from the man of iniquity.\"},{\"verse\":37,\"text\":\"Because he addeth blasphemy upon his sins, let him be tied fast in the mean time amongst us: and then let him provoke God to judgment with his speeches.\"}],\"vul\":[{\"verse\":1,\"text\":\"Pronuntians itaque Eliu, etiam hæc locutus est :\"},{\"verse\":2,\"text\":\"Audite, sapientes, verba mea : et eruditi, auscultate me.\"},{\"verse\":3,\"text\":\"Auris enim verba probat, et guttur escas gustu dijudicat.\"},{\"verse\":4,\"text\":\"Judicium eligamus nobis, et inter nos videamus quid sit melius.\"},{\"verse\":5,\"text\":\"Quia dixit Job : Justus sum, et Deus subvertit judicium meum.\"},{\"verse\":6,\"text\":\"In judicando enim me mendacium est : violenta sagitta mea absque ullo peccato.\"},{\"verse\":7,\"text\":\"Quis est vir ut est Job, qui bibit subsannationem quasi aquam :\"},{\"verse\":8,\"text\":\"qui graditur cum operantibus iniquitatem, et ambulat cum viris impiis ?\"},{\"verse\":9,\"text\":\"Dixit enim : Non placebit vir Deo, etiam si cucurrerit cum eo.\"},{\"verse\":10,\"text\":\"Ideo, viri cordati, audite me : absit a Deo impietas, et ab Omnipotente iniquitas.\"},{\"verse\":11,\"text\":\"Opus enim hominis reddet ei, et juxta vias singulorum restituet eis.\"},{\"verse\":12,\"text\":\"Vere enim Deus non condemnabit frustra, nec Omnipotens subvertet judicium.\"},{\"verse\":13,\"text\":\"Quem constituit alium super terram ? aut quem posuit super orbem quem fabricatus est ?\"},{\"verse\":14,\"text\":\"Si direxerit ad eum cor suum, spiritum illius et flatum ad se trahet.\"},{\"verse\":15,\"text\":\"Deficiet omnis caro simul, et homo in cinerem revertetur.\"},{\"verse\":16,\"text\":\"Si habes ergo intellectum, audi quod dicitur, et ausculta vocem eloquii mei :\"},{\"verse\":17,\"text\":\"numquid qui non amat judicium sanari potest ? et quomodo tu eum qui justus est in tantum condemnas ?\"},{\"verse\":18,\"text\":\"Qui dicit regi : Apostata ; qui vocat duces impios ;\"},{\"verse\":19,\"text\":\"qui non accipit personas principum, nec cognovit tyrannum cum disceptaret contra pauperem : opus enim manuum ejus sunt universi.\"},{\"verse\":20,\"text\":\"Subito morientur, et in media nocte turbabuntur populi : et pertransibunt, et auferent violentum absque manu.\"},{\"verse\":21,\"text\":\"Oculi enim ejus super vias hominum, et omnes gressus eorum considerat.\"},{\"verse\":22,\"text\":\"Non sunt tenebræ, et non est umbra mortis, ut abscondantur ibi qui operantur iniquitatem,\"},{\"verse\":23,\"text\":\"neque enim ultra in hominis potestate est, ut veniat ad Deum in judicium.\"},{\"verse\":24,\"text\":\"Conteret multos, et innumerabiles, et stare faciet alios pro eis.\"},{\"verse\":25,\"text\":\"Novit enim opera eorum, et idcirco inducet noctem, et conterentur.\"},{\"verse\":26,\"text\":\"Quasi impios percussit eos in loco videntium :\"},{\"verse\":27,\"text\":\"qui quasi de industria recesserunt ab eo, et omnes vias ejus intelligere noluerunt :\"},{\"verse\":28,\"text\":\"ut pervenire facerent ad eum clamorem egeni, et audiret vocem pauperum.\"},{\"verse\":29,\"text\":\"Ipso enim concedente pacem, quis est qui condemnet ? ex quo absconderit vultum, quis est qui contempletur eum, et super gentes, et super omnes homines ?\"},{\"verse\":30,\"text\":\"Qui regnare facit hominem hypocritam propter peccata populi.\"},{\"verse\":31,\"text\":\"Quia ergo ego locutus sum ad Deum, te quoque non prohibebo.\"},{\"verse\":32,\"text\":\"Si erravi, tu doce me ; si iniquitatem locutus sum, ultra non addam.\"},{\"verse\":33,\"text\":\"Numquid a te Deus expetit eam, quia displicuit tibi ? tu enim cœpisti loqui, et non ego : quod si quid nosti melius, loquere.\"},{\"verse\":34,\"text\":\"Viri intelligentes loquantur mihi, et vir sapiens audiat me.\"},{\"verse\":35,\"text\":\"Job autem stulte locutus est, et verba illius non sonant disciplinam.\"},{\"verse\":36,\"text\":\"Pater mi, probetur Job usque ad finem : ne desinas ab homine iniquitatis :\"},{\"verse\":37,\"text\":\"quia addit super peccata sua blasphemiam, inter nos interim constringatur : et tunc ad judicium provocet sermonibus suis Deum.\"}],\"summary\":\"Eliu charges Job with blasphemy: and sets forth the power and justice of God.\",\"intro\":null,\"prev\":{\"usfm\":\"JOB\",\"chapter\":33,\"label\":\"Job 33\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":35,\"label\":\"Job 35\"}}]]\n"])</script></body></html>
