h d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Corinthians<!-- --> <span class="text-stone-500">9</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A further exhortation to almsgiving. The fruits of it.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For concerning the ministry that is done towards the saints, it is superfluous for me to write unto you.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For I know your forward mind: for which I boast of you to the Macedonians, that Achaia also is ready from the year past. And your emulation hath provoked very many.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Now I have sent the brethren, that the thing which we boast of concerning you be not made void in this behalf, that (as I have said) you may be ready:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Lest, when the Macedonians shall come with me and find you unprepared, we (not to say ye) should be ashamed in this matter.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Therefore I thought it necessary to desire the brethren that they would go to you before and prepare this blessing before promised, to be ready, so as a blessing, not as covetousness.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now this I say: He who soweth sparingly shall also reap sparingly: and he who soweth in blessings shall also reap blessings.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Every one as he hath determined in his heart, not with sadness or of necessity: for God loveth a cheerful giver.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And God is able to make all grace abound in you: that ye always, having all sufficiency in all things, may abound to every good work,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>As it is written: He hath dispersed abroad, he hath given to the poor: his justice remaineth for ever.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he that ministereth seed to the sower will both give you bread to eat and will multiply your seed and increase the growth of the fruits of your justice:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That being enriched in all things, you may abound unto all simplicity which worketh through us thanksgiving to God.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Because the administration of this office doth not only supply the want of the saints, but aboundeth also by many thanksgivings in the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>By the proof of this ministry, glorifying God for the obedience of your confession unto the gospel of Christ and for the simplicity of your communicating unto them and unto all.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And in their praying for you, being desirous of you, because of the excellent grace of God in you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thanks be to God for his unspeakable gift.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nam de ministerio, quod fit in sanctos ex abundanti est mihi scribere vobis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Scio enim promptum animum vestrum : pro quo de vobis glorior apud Macedones. Quoniam et Achaia parata est ab anno præterito, et vestra æmulatio provocavit plurimos.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Misi autem fratres : ut ne quod gloriamur de vobis, evacuetur in hac parte, ut (quemadmodum dixi) parati sitis :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ne cum venerint Macedones mecum, et invenerint vos imparatos, erubescamus nos (ut non dicamus vos) in hac substantia.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Necessarium ergo existimavi rogare fratres, ut præveniant ad vos, et præparent repromissam benedictionem hanc paratam esse sic, quasi benedictionem, non tamquam avaritiam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hoc autem dico : qui parce seminat, parce et metet : et qui seminat in benedictionibus, de benedictionibus et metet.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Unusquisque, prout destinavit in corde suo, non ex tristitia, aut ex necessitate : hilarem enim datorem diligit Deus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Potens est autem Deus omnem gratiam abundare facere in vobis : ut in omnibus semper omnem sufficientiam habentes, abundetis in omne opus bonum,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>sicut scriptum est : Dispersit, dedit pauperibus : justitia ejus manet in sæculum sæculi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui autem administrat semen seminanti : et panem ad manducandum præstabit, et multiplicabit semen vestrum, et augebit incrementa frugum justitiæ vestræ :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ut in omnibus locupletati abundetis in omnem simplicitatem, quæ operatur per nos gratiarum actionem Deo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quoniam ministerium hujus officii non solum supplet ea quæ desunt sanctis, sed etiam abundat per multas gratiarum actiones in Domino,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>per probationem ministerii hujus, glorificantes Deum in obedientia confessionis vestræ, in Evangelium Christi, et simplicitate communicationis in illos, et in omnes,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et in ipsorum obsecratione pro vobis, desiderantium vos propter eminentem gratiam Dei in vobis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gratias Deo super inenarrabili dono ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Corinthians 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Corinthians 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 2 Corint 9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"2CO.9\",{\"bookId\":54,\"usfm\":\"2CO\",\"bookName\":\"2 Corinthians\",\"drName\":\"2 Corinthians\",\"chapter\":9,\"totalChapters\":13,\"dra\":[{\"verse\":1,\"text\":\"For concerning the ministry that is done towards the saints, it is superfluous for me to write unto you.\"},{\"verse\":2,\"text\":\"For I know your forward mind: for which I boast of you to the Macedonians, that Achaia also is ready from the year past. And your emulation hath provoked very many.\"},{\"verse\":3,\"text\":\"Now I have sent the brethren, that the thing which we boast of concerning you be not made void in this behalf, that (as I have said) you may be ready:\"},{\"verse\":4,\"text\":\"Lest, when the Macedonians shall come with me and find you unprepared, we (not to say ye) should be ashamed in this matter.\"},{\"verse\":5,\"text\":\"Therefore I thought it necessary to desire the brethren that they would go to you before and prepare this blessing before promised, to be ready, so as a blessing, not as covetousness.\"},{\"verse\":6,\"text\":\"Now this I say: He who soweth sparingly shall also reap sparingly: and he who soweth in blessings shall also reap blessings.\"},{\"verse\":7,\"text\":\"Every one as he hath determined in his heart, not with sadness or of necessity: for God loveth a cheerful giver.\"},{\"verse\":8,\"text\":\"And God is able to make all grace abound in you: that ye always, having all sufficiency in all things, may abound to every good work,\"},{\"verse\":9,\"text\":\"As it is written: He hath dispersed abroad, he hath given to the poor: his justice remaineth for ever.\"},{\"verse\":10,\"text\":\"And he that ministereth seed to the sower will both give you bread to eat and will multiply your seed and increase the growth of the fruits of your justice:\"},{\"verse\":11,\"text\":\"That being enriched in all things, you may abound unto all simplicity which worketh through us thanksgiving to God.\"},{\"verse\":12,\"text\":\"Because the administration of this office doth not only supply the want of the saints, but aboundeth also by many thanksgivings in the Lord.\"},{\"verse\":13,\"text\":\"By the proof of this ministry, glorifying God for the obedience of your confession unto the gospel of Christ and for the simplicity of your communicating unto them and unto all.\"},{\"verse\":14,\"text\":\"And in their praying for you, being desirous of you, because of the excellent grace of God in you.\"},{\"verse\":15,\"text\":\"Thanks be to God for his unspeakable gift.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nam de ministerio, quod fit in sanctos ex abundanti est mihi scribere vobis.\"},{\"verse\":2,\"text\":\"Scio enim promptum animum vestrum : pro quo de vobis glorior apud Macedones. Quoniam et Achaia parata est ab anno præterito, et vestra æmulatio provocavit plurimos.\"},{\"verse\":3,\"text\":\"Misi autem fratres : ut ne quod gloriamur de vobis, evacuetur in hac parte, ut (quemadmodum dixi) parati sitis :\"},{\"verse\":4,\"text\":\"ne cum venerint Macedones mecum, et invenerint vos imparatos, erubescamus nos (ut non dicamus vos) in hac substantia.\"},{\"verse\":5,\"text\":\"Necessarium ergo existimavi rogare fratres, ut præveniant ad vos, et præparent repromissam benedictionem hanc paratam esse sic, quasi benedictionem, non tamquam avaritiam.\"},{\"verse\":6,\"text\":\"Hoc autem dico : qui parce seminat, parce et metet : et qui seminat in benedictionibus, de benedictionibus et metet.\"},{\"verse\":7,\"text\":\"Unusquisque, prout destinavit in corde suo, non ex tristitia, aut ex necessitate : hilarem enim datorem diligit Deus.\"},{\"verse\":8,\"text\":\"Potens est autem Deus omnem gratiam abundare facere in vobis : ut in omnibus semper omnem sufficientiam habentes, abundetis in omne opus bonum,\"},{\"verse\":9,\"text\":\"sicut scriptum est : Dispersit, dedit pauperibus : justitia ejus manet in sæculum sæculi.\"},{\"verse\":10,\"text\":\"Qui autem administrat semen seminanti : et panem ad manducandum præstabit, et multiplicabit semen vestrum, et augebit incrementa frugum justitiæ vestræ :\"},{\"verse\":11,\"text\":\"ut in omnibus locupletati abundetis in omnem simplicitatem, quæ operatur per nos gratiarum actionem Deo.\"},{\"verse\":12,\"text\":\"Quoniam ministerium hujus officii non solum supplet ea quæ desunt sanctis, sed etiam abundat per multas gratiarum actiones in Domino,\"},{\"verse\":13,\"text\":\"per probationem ministerii hujus, glorificantes Deum in obedientia confessionis vestræ, in Evangelium Christi, et simplicitate communicationis in illos, et in omnes,\"},{\"verse\":14,\"text\":\"et in ipsorum obsecratione pro vobis, desiderantium vos propter eminentem gratiam Dei in vobis.\"},{\"verse\":15,\"text\":\"Gratias Deo super inenarrabili dono ejus.\"}],\"summary\":\"A further exhortation to almsgiving. The fruits of it.\",\"intro\":null,\"prev\":{\"usfm\":\"2CO\",\"chapter\":8,\"label\":\"2 Corinthians 8\"},\"next\":{\"usfm\":\"2CO\",\"chapter\":10,\"label\":\"2 Corinthians 10\"}}]]\n"])</script></body></html>
