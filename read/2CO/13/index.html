th d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Corinthians<!-- --> <span class="text-stone-500">13</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">He threatens the impenitent, to provoke them to penance.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Behold, this is the third time I am coming to you: In the mouth of two or three witnesses shall every word stand.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I have told before and foretell, as present and now absent, to them that sinned before and to all the rest, that if I come again, I will not spare.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Do you seek a proof of Christ that speaketh in me, who towards you is not weak, but is mighty in you?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For although he was crucified through weakness, yet he liveth by the power of God. For we also are weak in him: but we shall live with him by the power of God towards you.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Try your own selves if you be in the faith: prove ye yourselves. Know you not your own selves, that Christ Jesus is in you, unless perhaps you be reprobates?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But I trust that you shall know that we are not reprobates.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now we pray God that you may do no evil, not that we may appear approved, but that you may do that which is good and that we may be as reprobates.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For we can do nothing against the truth: but for the truth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For we rejoice that we are weak and you are strong. This also we pray for, your perfection.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore I write these things, being absent, that, being present, I may not deal more severely, according to the power which the Lord hath given me unto edification and not unto destruction.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For the rest, brethren, rejoice, be perfect, take exhortation, be of one mind, have peace. And the God of peace and of love shall be with you.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Salute one another with a holy kiss. All the saints salute you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The grace of our Lord Jesus Christ and the charity of God and the communication of the Holy Ghost be with you all. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ecce tertio hoc venio ad vos : in ore duorum vel trium testium stabit omne verbum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Prædixi, et prædico, ut præsens, et nunc absens iis qui ante peccaverunt, et ceteris omnibus, quoniam si venero iterum, non parcam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>An experimentum quæritis ejus, qui in me loquitur Christus, qui in vobis non infirmatur, sed potens est in vobis ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nam etsi crucifixus est ex infirmitate : sed vivit ex virtute Dei. Nam et nos infirmi sumus in illo : sed vivemus cum eo ex virtute Dei in vobis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Vosmetipsos tentate si estis in fide : ipsi vos probate. An non cognoscitis vosmetipsos quia Christus Jesus in vobis est ? nisi forte reprobi estis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Spero autem quod cognoscetis, quia nos non sumus reprobi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Oramus autem Deum ut nihil mali faciatis, non ut nos probati appareamus, sed ut vos quod bonum est faciatis : nos autem ut reprobi simus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non enim possumus aliquid adversus veritatem, sed pro veritate.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Gaudemus enim, quoniam nos infirmi sumus, vos autem potentes estis. Hoc et oramus, vestram consummationem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ideo hæc absens scribo, ut non præsens durius agam secundum potestatem, quam Dominus dedit mihi in ædificationem, et non in destructionem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>De cetero, fratres, gaudete, perfecti estote, exhortamini, idem sapite, pacem habete, et Deus pacis et dilectionis erit vobiscum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Salutate invicem in osculo sancto. Salutant vos omnes sancti.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Gratia Domini nostri Jesu Christi, et caritas Dei, et communicatio Sancti Spiritus sit cum omnibus vobis. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Corinthians 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-rig xt\":\"Try your own selves if you be in the faith: prove ye yourselves. Know you not your own selves, that Christ Jesus is in you, unless perhaps you be reprobates?\"},{\"verse\":6,\"text\":\"But I trust that you shall know that we are not reprobates.\"},{\"verse\":7,\"text\":\"Now we pray God that you may do no evil, not that we may appear approved, but that you may do that which is good and that we may be as reprobates.\"},{\"verse\":8,\"text\":\"For we can do nothing against the truth: but for the truth.\"},{\"verse\":9,\"text\":\"For we rejoice that we are weak and you are strong. This also we pray for, your perfection.\"},{\"verse\":10,\"text\":\"Therefore I write these things, being absent, that, being present, I may not deal more severely, according to the power which the Lord hath given me unto edification and not unto destruction.\"},{\"verse\":11,\"text\":\"For the rest, brethren, rejoice, be perfect, take exhortation, be of one mind, have peace. And the God of peace and of love shall be with you.\"},{\"verse\":12,\"text\":\"Salute one another with a holy kiss. All the saints salute you.\"},{\"verse\":13,\"text\":\"The grace of our Lord Jesus Christ and the charity of God and the communication of the Holy Ghost be with you all. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ecce tertio hoc venio ad vos : in ore duorum vel trium testium stabit omne verbum.\"},{\"verse\":2,\"text\":\"Prædixi, et prædico, ut præsens, et nunc absens iis qui ante peccaverunt, et ceteris omnibus, quoniam si venero iterum, non parcam.\"},{\"verse\":3,\"text\":\"An experimentum quæritis ejus, qui in me loquitur Christus, qui in vobis non infirmatur, sed potens est in vobis ?\"},{\"verse\":4,\"text\":\"Nam etsi crucifixus est ex infirmitate : sed vivit ex virtute Dei. Nam et nos infirmi sumus in illo : sed vivemus cum eo ex virtute Dei in vobis.\"},{\"verse\":5,\"text\":\"Vosmetipsos tentate si estis in fide : ipsi vos probate. An non cognoscitis vosmetipsos quia Christus Jesus in vobis est ? nisi forte reprobi estis.\"},{\"verse\":6,\"text\":\"Spero autem quod cognoscetis, quia nos non sumus reprobi.\"},{\"verse\":7,\"text\":\"Oramus autem Deum ut nihil mali faciatis, non ut nos probati appareamus, sed ut vos quod bonum est faciatis : nos autem ut reprobi simus.\"},{\"verse\":8,\"text\":\"Non enim possumus aliquid adversus veritatem, sed pro veritate.\"},{\"verse\":9,\"text\":\"Gaudemus enim, quoniam nos infirmi sumus, vos autem potentes estis. Hoc et oramus, vestram consummationem.\"},{\"verse\":10,\"text\":\"Ideo hæc absens scribo, ut non præsens durius agam secundum potestatem, quam Dominus dedit mihi in ædificationem, et non in destructionem.\"},{\"verse\":11,\"text\":\"De cetero, fratres, gaudete, perfecti estote, exhortamini, idem sapite, pacem habete, et Deus pacis et dilectionis erit vobiscum.\"},{\"verse\":12,\"text\":\"Salutate invicem in osculo sancto. Salutant vos omnes sancti.\"},{\"verse\":13,\"text\":\"Gratia Domini nostri Jesu Christi, et caritas Dei, et communicatio Sancti Spiritus sit cum omnibus vobis. Amen.\"}],\"summary\":\"He threatens the impenitent, to provoke them to penance.\",\"intro\":null,\"prev\":{\"usfm\":\"2CO\",\"chapter\":12,\"label\":\"2 Corinthians 12\"},\"next\":{\"usfm\":\"GAL\",\"chapter\":1,\"label\":\"Galatians 1\"}}]]\n"])</script></body></html>
