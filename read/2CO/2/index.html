ss="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Corinthians<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2CO/">About <!-- -->2 Corinthians</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">He grants a pardon to the incestuous man upon his doing penance.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But I determined this with myself, not to come to you again in sorrow.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For if I make you sorrowful, who is he then that can make me glad, but the same who is made sorrowful by me?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I wrote this same to you: that I may not, when I come, have sorrow upon sorrow from them of whom I ought to rejoice: having confidence in you all, that my joy is the joy of you all.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For out of much affliction and anguish of heart, I wrote to you with many tears: not that you should be made sorrowful: but that you might know the charity I have more abundantly towards you.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And if any one have caused grief, he hath not grieved me: but in part, that I may not burden you all.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>To him who is such a one, this rebuke is sufficient, which is given by many.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>So that on the contrary, you should rather forgive him and comfort him, lest perhaps such a one be swallowed up with overmuch sorrow.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wherefore, I beseech you that you would confirm your charity towards him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For to this end also did I write, that I may know the experiment of you, whether you be obedient in all things.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And to whom you have pardoned any thing, I also. For, what I have pardoned, if I have pardoned any thing, for your sakes have I done it in the person of Christ:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That we be not overreached by Satan. For we are not ignorant of his devices.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when I was come to Troas for the gospel of Christ and a door was opened unto me in the Lord,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I had no rest in my spirit, because I found not Titus my brother: but bidding them farewell, I went into Macedonia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now thanks be to God, who always maketh us to triumph in Christ Jesus and manifesteth the odour of his knowledge by us in every place.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For we are the good odour of Christ unto God, in them that are saved and in them that perish.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>To the one indeed the odour of death unto death: but to the others the odour of life unto life. And for these things who is so sufficient?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For we are not as many, adulterating the word of God: but with sincerity: but as from God, before God, in Christ we speak.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Statui autem hoc ipsum apud me, ne iterum in tristitia venirem ad vos.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Si enim ego contristo vos : et quis est, qui me lætificet, nisi qui contristatur ex me ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et hoc ipsum scripsi vobis, ut non cum venero, tristitiam super tristitiam habeam, de quibus oportuerat me gaudere : confidens in omnibus vobis, quia meum gaudium, omnium vestrum est.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nam ex multa tribulatione et angustia cordis scripsi vobis per multas lacrimas : non ut contristemini, sed ut sciatis, quam caritatem habeam abundantius in vobis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si quis autem contristavit, non me contristavit : sed ex parte, ut non onerem omnes vos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sufficit illi, qui ejusmodi est, objurgatio hæc, quæ fit a pluribus :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ita ut e contrario magis donetis, et consolemini, ne forte abundantiori tristitia absorbeatur qui ejusmodi est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Propter quod obsecro vos, ut confirmetis in illum caritatem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ideo enim et scripsi, ut cognoscam experimentum vestrum, an in omnibus obedientes sitis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cui autem aliquid donastis, et ego : nam et ego quod donavi, si quid donavi, propter vos in persona Christi,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ut non circumveniamur a Satana : non enim ignoramus cogitationes ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum venissem autem Troadem propter Evangelium Christi, et ostium mihi apertum esset in Domino,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>non habui requiem spiritui meo, eo quod non invenerim Titum fratrem meum, sed valefaciens eis, profectus sum in Macedoniam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Deo autem gratias, qui semper triumphat nos in Christo Jesu, et odorem notitiæ suæ manifestat per nos in omni loco :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>quia Christi bonus odor sumus Deo in iis qui salvi fiunt, et in iis qui pereunt :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>aliis quidem odor mortis in mortem : aliis autem odor vitæ in vitam. Et ad hæc quis tam idoneus ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>non enim sumus sicut plurimi, adulterantes verbum Dei, sed ex sinceritate, sed sicut ex Deo, coram Deo, in Christo loquimur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Corinthians 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</sp t quis est, qui me lætificet, nisi qui contristatur ex me ?\"},{\"verse\":3,\"text\":\"Et hoc ipsum scripsi vobis, ut non cum venero, tristitiam super tristitiam habeam, de quibus oportuerat me gaudere : confidens in omnibus vobis, quia meum gaudium, omnium vestrum est.\"},{\"verse\":4,\"text\":\"Nam ex multa tribulatione et angustia cordis scripsi vobis per multas lacrimas : non ut contristemini, sed ut sciatis, quam caritatem habeam abundantius in vobis.\"},{\"verse\":5,\"text\":\"Si quis autem contristavit, non me contristavit : sed ex parte, ut non onerem omnes vos.\"},{\"verse\":6,\"text\":\"Sufficit illi, qui ejusmodi est, objurgatio hæc, quæ fit a pluribus :\"},{\"verse\":7,\"text\":\"ita ut e contrario magis donetis, et consolemini, ne forte abundantiori tristitia absorbeatur qui ejusmodi est.\"},{\"verse\":8,\"text\":\"Propter quod obsecro vos, ut confirmetis in illum caritatem.\"},{\"verse\":9,\"text\":\"Ideo enim et scripsi, ut cognoscam experimentum vestrum, an in omnibus obedientes sitis.\"},{\"verse\":10,\"text\":\"Cui autem aliquid donastis, et ego : nam et ego quod donavi, si quid donavi, propter vos in persona Christi,\"},{\"verse\":11,\"text\":\"ut non circumveniamur a Satana : non enim ignoramus cogitationes ejus.\"},{\"verse\":12,\"text\":\"Cum venissem autem Troadem propter Evangelium Christi, et ostium mihi apertum esset in Domino,\"},{\"verse\":13,\"text\":\"non habui requiem spiritui meo, eo quod non invenerim Titum fratrem meum, sed valefaciens eis, profectus sum in Macedoniam.\"},{\"verse\":14,\"text\":\"Deo autem gratias, qui semper triumphat nos in Christo Jesu, et odorem notitiæ suæ manifestat per nos in omni loco :\"},{\"verse\":15,\"text\":\"quia Christi bonus odor sumus Deo in iis qui salvi fiunt, et in iis qui pereunt :\"},{\"verse\":16,\"text\":\"aliis quidem odor mortis in mortem : aliis autem odor vitæ in vitam. Et ad hæc quis tam idoneus ?\"},{\"verse\":17,\"text\":\"non enim sumus sicut plurimi, adulterantes verbum Dei, sed ex sinceritate, sed sicut ex Deo, coram Deo, in Christo loquimur.\"}],\"summary\":\"He grants a pardon to the incestuous man upon his doing penance.\",\"intro\":null,\"prev\":{\"usfm\":\"2CO\",\"chapter\":1,\"label\":\"2 Corinthians 1\"},\"next\":{\"usfm\":\"2CO\",\"chapter\":3,\"label\":\"2 Corinthians 3\"}}]]\n"])</script></body></html>
