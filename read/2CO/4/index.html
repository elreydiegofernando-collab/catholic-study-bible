ss="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Corinthians<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2CO/">About <!-- -->2 Corinthians</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The sincerity of his preaching. His comfort in his afflictions.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Therefore seeing we have this ministration, according as we have obtained mercy, we faint not.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But we renounce the hidden things of dishonesty, not walking in craftiness nor adulterating the word of God: but by manifestation of the truth commending ourselves to every man’s conscience, in the sight of God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And if our gospel be also hid, it is hid to them that are lost,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In whom the god of this world hath blinded the minds of unbelievers, that the light of the gospel of the glory of Christ, who is the image of God, should not shine unto them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For we preach not ourselves, but Jesus Christ our Lord: and ourselves your servants through Jesus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God, in the face of Christ Jesus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But we have this treasure in earthen vessels, that the excellency may be of the power of God and not of us.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In all things we suffer tribulation: but are not distressed. We are straitened: but are not destitute.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>We suffer persecution: but are not forsaken. We are cast down: but we perish not.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Always bearing about in our body the mortification of Jesus, that the life also of Jesus may be made manifest in our bodies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For we who live are always delivered unto death for Jesus’ sake: that the life also of Jesus may be made manifest in our mortal flesh.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>So then death worketh in us: but life in you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But having the same spirit of faith, as it is written: I believed, for which cause I have spoken; we also believe. For which cause we speak also:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Knowing that he who raised up Jesus will raise us up also with Jesus and place us with you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For all things are for your sakes: that the grace, abounding through many, may abound in thanksgiving unto the glory of God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For which cause we faint not: but though our outward man is corrupted, yet the inward man is renewed day by day.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For that which is at present momentary and light of our tribulation worketh for us above measure, exceedingly an eternal weight of glory.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>While we look not at the things which are seen, but at the things which are not seen. For the things which are seen are temporal: but the things which are not seen, are eternal.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ideo habentes administrationem, juxta quod misericordiam consecuti sumus, non deficimus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sed abdicamus occulta dedecoris, non ambulantes in astutia, neque adulterantes verbum Dei, sed in manifestatione veritatis commendantes nosmetipsos ad omnem conscientiam hominum coram Deo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quod si etiam opertum est Evangelium nostrum, in iis, qui pereunt, est opertum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>in quibus Deus hujus sæculi excæcavit mentes infidelium, ut non fulgeat illis illuminatio Evangelii gloriæ Christi, qui est imago Dei.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non enim nosmetipsos prædicamus, sed Jesum Christum Dominum nostrum : nos autem servos vestros per Jesum :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>quoniam Deus, qui dixit de tenebris lucem splendescere, ipse illuxit in cordibus nostris ad illuminationem scientiæ claritatis Dei, in facie Christi Jesu.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Habemus autem thesaurum istum in vasis fictilibus : ut sublimitas sit virtutis Dei, et non ex nobis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In omnibus tribulationem patimur, sed non angustiamur : aporiamur, sed non destituimur :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>persecutionem patimur, sed non derelinquimur : dejicimur, sed non perimus :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>semper mortificationem Jesu in corpore nostro circumferentes, ut et vita Jesu manifestetur in corporibus nostris.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Semper enim nos, qui vivimus, in mortem tradimur propter Jesum : ut et vita Jesu manifestetur in carne nostra mortali.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ergo mors in nobis operatur, vita autem in vobis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Habentes autem eumdem spiritum fidei, sicut scriptum est : Credidi, propter quod locutus sum : et nos credimus, propter quod et loquimur :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>scientes quoniam qui suscitavit Jesum, et nos cum Jesu suscitabit, et constituet vobiscum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnia enim propter vos : ut gratia abundans, per multos in gratiarum actione, abundet in gloriam Dei.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Propter quod non deficimus : sed licet is, qui foris est, noster homo corrumpatur, tamen is, qui intus est, renovatur de die in diem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Id enim, quod in præsenti est momentaneum et leve tribulationis nostræ, supra modum in sublimitate æternum gloriæ pondus operatur in nobis,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>non contemplantibus nobis quæ videntur, sed quæ non videntur. Quæ enim videntur, temporalia sunt : quæ autem non videntur, æterna sunt.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2 e\":\"2 Corinthians\",\"chapter\":4,\"totalChapters\":13,\"dra\":[{\"verse\":1,\"text\":\"Therefore seeing we have this ministration, according as we have obtained mercy, we faint not.\"},{\"verse\":2,\"text\":\"But we renounce the hidden things of dishonesty, not walking in craftiness nor adulterating the word of God: but by manifestation of the truth commending ourselves to every man’s conscience, in the sight of God.\"},{\"verse\":3,\"text\":\"And if our gospel be also hid, it is hid to them that are lost,\"},{\"verse\":4,\"text\":\"In whom the god of this world hath blinded the minds of unbelievers, that the light of the gospel of the glory of Christ, who is the image of God, should not shine unto them.\"},{\"verse\":5,\"text\":\"For we preach not ourselves, but Jesus Christ our Lord: and ourselves your servants through Jesus.\"},{\"verse\":6,\"text\":\"For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God, in the face of Christ Jesus.\"},{\"verse\":7,\"text\":\"But we have this treasure in earthen vessels, that the excellency may be of the power of God and not of us.\"},{\"verse\":8,\"text\":\"In all things we suffer tribulation: but are not distressed. We are straitened: but are not destitute.\"},{\"verse\":9,\"text\":\"We suffer persecution: but are not forsaken. We are cast down: but we perish not.\"},{\"verse\":10,\"text\":\"Always bearing about in our body the mortification of Jesus, that the life also of Jesus may be made manifest in our bodies.\"},{\"verse\":11,\"text\":\"For we who live are always delivered unto death for Jesus’ sake: that the life also of Jesus may be made manifest in our mortal flesh.\"},{\"verse\":12,\"text\":\"So then death worketh in us: but life in you.\"},{\"verse\":13,\"text\":\"But having the same spirit of faith, as it is written: I believed, for which cause I have spoken; we also believe. For which cause we speak also:\"},{\"verse\":14,\"text\":\"Knowing that he who raised up Jesus will raise us up also with Jesus and place us with you.\"},{\"verse\":15,\"text\":\"For all things are for your sakes: that the grace, abounding through many, may abound in thanksgiving unto the glory of God.\"},{\"verse\":16,\"text\":\"For which cause we faint not: but though our outward man is corrupted, yet the inward man is renewed day by day.\"},{\"verse\":17,\"text\":\"For that which is at present momentary and light of our tribulation worketh for us above measure, exceedingly an eternal weight of glory.\"},{\"verse\":18,\"text\":\"While we look not at the things which are seen, but at the things which are not seen. For the things which are seen are temporal: but the things which are not seen, are eternal.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ideo habentes administrationem, juxta quod misericordiam consecuti sumus, non deficimus,\"},{\"verse\":2,\"text\":\"sed abdicamus occulta dedecoris, non ambulantes in astutia, neque adulterantes verbum Dei, sed in manifestatione veritatis commendantes nosmetipsos ad omnem conscientiam hominum coram Deo.\"},{\"verse\":3,\"text\":\"Quod si etiam opertum est Evangelium nostrum, in iis, qui pereunt, est opertum :\"},{\"verse\":4,\"text\":\"in quibus Deus hujus sæculi excæcavit mentes infidelium, ut non fulgeat illis illuminatio Evangelii gloriæ Christi, qui est imago Dei.\"},{\"verse\":5,\"text\":\"Non enim nosmetipsos prædicamus, sed Jesum Christum Dominum nostrum : nos autem servos vestros per Jesum :\"},{\"verse\":6,\"text\":\"quoniam Deus, qui dixit de tenebris lucem splendescere, ipse illuxit in cordibus nostris ad illuminationem scientiæ claritatis Dei, in facie Christi Jesu.\"},{\"verse\":7,\"text\":\"Habemus autem thesaurum istum in vasis fictilibus : ut sublimitas sit virtutis Dei, et non ex nobis.\"},{\"verse\":8,\"text\":\"In omnibus tribulationem patimur, sed non angustiamur : aporiamur, sed non destituimur :\"},{\"verse\":9,\"text\":\"persecutionem patimur, sed non derelinquimur : dejicimur, sed non perimus :\"},{\"verse\":10,\"text\":\"semper mortificationem Jesu in corpore nostro circumferentes, ut et vita Jesu manifestetur in corporibus nostris.\"},{\"verse\":11,\"text\":\"Semper enim nos, qui vivimus, in mortem tradimur propter Jesum : ut et vita Jesu manifestetur in carne nostra mortali.\"},{\"verse\":12,\"text\":\"Ergo mors in nobis operatur, vita autem in vobis.\"},{\"verse\":13,\"text\":\"Habentes autem eumdem spiritum fidei, sicut scriptum est : Credidi, propter quod locutus sum : et nos credimus, propter quod et loquimur :\"},{\"verse\":14,\"text\":\"scientes quoniam qui suscitavit Jesum, et nos cum Jesu suscitabit, et constituet vobiscum.\"},{\"verse\":15,\"text\":\"Omnia enim propter vos : ut gratia abundans, per multos in gratiarum actione, abundet in gloriam Dei.\"},{\"verse\":16,\"text\":\"Propter quod non deficimus : sed licet is, qui foris est, noster homo corrumpatur, tamen is, qui intus est, renovatur de die in diem.\"},{\"verse\":17,\"text\":\"Id enim, quod in præsenti est momentaneum et leve tribulationis nostræ, supra modum in sublimitate æternum gloriæ pondus operatur in nobis,\"},{\"verse\":18,\"text\":\"non contemplantibus nobis quæ videntur, sed quæ non videntur. Quæ enim videntur, temporalia sunt : quæ autem non videntur, æterna sunt.\"}],\"summary\":\"The sincerity of his preaching. His comfort in his afflictions.\",\"intro\":null,\"prev\":{\"usfm\":\"2CO\",\"chapter\":3,\"label\":\"2 Corinthians 3\"},\"next\":{\"usfm\":\"2CO\",\"chapter\":5,\"label\":\"2 Corinthians 5\"}}]]\n"])</script></body></html>
