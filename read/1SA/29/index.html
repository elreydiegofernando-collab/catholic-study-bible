h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Samuel<!-- --> <span class="text-stone-500">29</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->1 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1SA/">About <!-- -->1 Samuel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">David going with the Philistines is sent back by their princes.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now all the troops of the Philistines were gathered together to Aphec: and Israel also encamped by the fountain, which is in Jezrahel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the lords of the Philistines marched with their hundreds and their thousands: but David and his men were in the rear with Achis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the princes of the Philistines said to Achis: What mean these Hebrews? And Achis said to the princes of the Philistines: Do you not know David who was the servant of Saul, the king of Israel, and hath been with me many days, or years, and I have found no fault in him, since the day that he fled over to me until this day?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But the princes of the Philistines were angry with him, and they said to him: Let this man return, and abide in his place, which thou hast appointed him, and let him not go down with us to battle, lest he be an adversary to us, when we shall begin to fight: for how can he otherwise appease his master, but with our heads?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Is not this David, to whom they sung in their dances, saying: Saul slew his thousands, and David his ten thousands?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then Achis called David, and said to him: As the Lord liveth, thou art upright and good in my sight: and so is thy going out, and thy coming in with me in the army: and I have not found any evil in thee, since the day that thou camest to me unto this day: but thou pleasest not the lords.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Return therefore, and go in peace, and offend not the eyes of the princes of the Philistines.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And David said to Achis: But what have I done, or what hast thou found in me thy servant, from the day that I have been in thy sight until this day, that I may not go and fight against the enemies of my lord the king?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Achis answering, said to David: I know that thou art good in my sight, as an angel of God: But the princes of the Philistines have said: He shall not go up with us to the battle.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore arise in the morning, thou, and the servants of thy lord, who came with thee: and when you are up before day, and it shall begin to be light, go on your way.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>So David and his men arose in the night, that they might set forward in the morning, and returned to the land of the Philistines: and the Philistines went up to Jezrahel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Congregata sunt ergo Philisthiim universa agmina in Aphec : sed et Israël castrametatus est super fontem qui erat in Jezrahel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et satrapæ quidem Philisthiim incedebant in centuriis et millibus : David autem et viri ejus erant in novissimo agmine cum Achis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixeruntque principes Philisthiim ad Achis : Quid sibi volunt Hebræi isti ? Et ait Achis ad principes Philisthiim : Num ignoratis David, qui fuit servus Saul regis Israël, et est apud me multis diebus, vel annis, et non inveni in eo quidquam ex die qua transfugit ad me usque ad diem hanc ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Irati sunt autem adversus eum principes Philisthiim, et dixerunt ei : Revertatur vir iste, et sedeat in loco suo in quo constituisti eum, et non descendat nobiscum in prælium, ne fiat nobis adversarius, cum præliari cœperimus : quomodo enim aliter poterit placare dominum suum, nisi in capitibus nostris ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nonne iste est David, cui cantabant in choris, dicentes : Percussit Saul in millibus suis, et David in decem millibus suis ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vocavit ergo Achis David, et ait ei : Vivit Dominus, quia rectus es tu, et bonus in conspectu meo : et exitus tuus, et introitus tuus mecum est in castris : et non inveni in te quidquam mali ex die qua venisti ad me usque in diem hanc : sed satrapis non places.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Revertere ergo, et vade in pace, et non offendas oculos satraparum Philisthiim.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixitque David ad Achis : Quid enim feci, et quid invenisti in me servo tuo, a die qua fui in conspectu tuo usque in diem hanc, ut non veniam et pugnem contra inimicos domini mei regis ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Respondens autem Achis, locutus est ad David : Scio quia bonus es tu in oculis meis, sicut angelus Dei : sed principes Philisthinorum dixerunt : Non ascendet nobiscum in prælium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Igitur consurge mane tu, et servi domini tui qui venerunt tecum : et cum de nocte surrexeritis, et cœperit dilucescere, pergite.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Surrexit itaque de nocte David, ipse et viri ejus, ut proficiscerentur mane, et reverterentur ad terram Philisthiim : Philisthiim autem ascenderunt in Jezrahel.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/28/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Samuel 28</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/30/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 Samuel 30</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->29<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 1 Samuel 28" class="inline-flex \"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"1SA.29\",{\"bookId\":9,\"usfm\":\"1SA\",\"bookName\":\"1 Samuel\",\"drName\":\"1 Kings\",\"chapter\":29,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Now all the troops of the Philistines were gathered together to Aphec: and Israel also encamped by the fountain, which is in Jezrahel.\"},{\"verse\":2,\"text\":\"And the lords of the Philistines marched with their hundreds and their thousands: but David and his men were in the rear with Achis.\"},{\"verse\":3,\"text\":\"And the princes of the Philistines said to Achis: What mean these Hebrews? And Achis said to the princes of the Philistines: Do you not know David who was the servant of Saul, the king of Israel, and hath been with me many days, or years, and I have found no fault in him, since the day that he fled over to me until this day?\"},{\"verse\":4,\"text\":\"But the princes of the Philistines were angry with him, and they said to him: Let this man return, and abide in his place, which thou hast appointed him, and let him not go down with us to battle, lest he be an adversary to us, when we shall begin to fight: for how can he otherwise appease his master, but with our heads?\"},{\"verse\":5,\"text\":\"Is not this David, to whom they sung in their dances, saying: Saul slew his thousands, and David his ten thousands?\"},{\"verse\":6,\"text\":\"Then Achis called David, and said to him: As the Lord liveth, thou art upright and good in my sight: and so is thy going out, and thy coming in with me in the army: and I have not found any evil in thee, since the day that thou camest to me unto this day: but thou pleasest not the lords.\"},{\"verse\":7,\"text\":\"Return therefore, and go in peace, and offend not the eyes of the princes of the Philistines.\"},{\"verse\":8,\"text\":\"And David said to Achis: But what have I done, or what hast thou found in me thy servant, from the day that I have been in thy sight until this day, that I may not go and fight against the enemies of my lord the king?\"},{\"verse\":9,\"text\":\"And Achis answering, said to David: I know that thou art good in my sight, as an angel of God: But the princes of the Philistines have said: He shall not go up with us to the battle.\"},{\"verse\":10,\"text\":\"Therefore arise in the morning, thou, and the servants of thy lord, who came with thee: and when you are up before day, and it shall begin to be light, go on your way.\"},{\"verse\":11,\"text\":\"So David and his men arose in the night, that they might set forward in the morning, and returned to the land of the Philistines: and the Philistines went up to Jezrahel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Congregata sunt ergo Philisthiim universa agmina in Aphec : sed et Israël castrametatus est super fontem qui erat in Jezrahel.\"},{\"verse\":2,\"text\":\"Et satrapæ quidem Philisthiim incedebant in centuriis et millibus : David autem et viri ejus erant in novissimo agmine cum Achis.\"},{\"verse\":3,\"text\":\"Dixeruntque principes Philisthiim ad Achis : Quid sibi volunt Hebræi isti ? Et ait Achis ad principes Philisthiim : Num ignoratis David, qui fuit servus Saul regis Israël, et est apud me multis diebus, vel annis, et non inveni in eo quidquam ex die qua transfugit ad me usque ad diem hanc ?\"},{\"verse\":4,\"text\":\"Irati sunt autem adversus eum principes Philisthiim, et dixerunt ei : Revertatur vir iste, et sedeat in loco suo in quo constituisti eum, et non descendat nobiscum in prælium, ne fiat nobis adversarius, cum præliari cœperimus : quomodo enim aliter poterit placare dominum suum, nisi in capitibus nostris ?\"},{\"verse\":5,\"text\":\"Nonne iste est David, cui cantabant in choris, dicentes : Percussit Saul in millibus suis, et David in decem millibus suis ?\"},{\"verse\":6,\"text\":\"Vocavit ergo Achis David, et ait ei : Vivit Dominus, quia rectus es tu, et bonus in conspectu meo : et exitus tuus, et introitus tuus mecum est in castris : et non inveni in te quidquam mali ex die qua venisti ad me usque in diem hanc : sed satrapis non places.\"},{\"verse\":7,\"text\":\"Revertere ergo, et vade in pace, et non offendas oculos satraparum Philisthiim.\"},{\"verse\":8,\"text\":\"Dixitque David ad Achis : Quid enim feci, et quid invenisti in me servo tuo, a die qua fui in conspectu tuo usque in diem hanc, ut non veniam et pugnem contra inimicos domini mei regis ?\"},{\"verse\":9,\"text\":\"Respondens autem Achis, locutus est ad David : Scio quia bonus es tu in oculis meis, sicut angelus Dei : sed principes Philisthinorum dixerunt : Non ascendet nobiscum in prælium.\"},{\"verse\":10,\"text\":\"Igitur consurge mane tu, et servi domini tui qui venerunt tecum : et cum de nocte surrexeritis, et cœperit dilucescere, pergite.\"},{\"verse\":11,\"text\":\"Surrexit itaque de nocte David, ipse et viri ejus, ut proficiscerentur mane, et reverterentur ad terram Philisthiim : Philisthiim autem ascenderunt in Jezrahel.\"}],\"summary\":\"David going with the Philistines is sent back by their princes.\",\"intro\":null,\"prev\":{\"usfm\":\"1SA\",\"chapter\":28,\"label\":\"1 Samuel 28\"},\"next\":{\"usfm\":\"1SA\",\"chapter\":30,\"label\":\"1 Samuel 30\"}}]]\n"])</script></body></html>
