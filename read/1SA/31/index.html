"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Samuel<!-- --> <span class="text-stone-500">31</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->1 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Israel is defeated by the Philistines: Saul and his sons are slain.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Philistines fought against Israel, and the men of Israel fled from before the Philistines, and fell down slain in mount Gelboe.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Philistines fell upon Saul, and upon his sons, and they slew Jonathan, and Abinadab, and Melchisua, the sons of Saul.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the whole weight of the battle was turned upon Saul: and the archers overtook him, and he was grievously wounded by the archers.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then Saul said to his armourbearer: Draw thy sword, and kill me: lest these uncircumcised come, and slay me, and mock at me. And his armourbearer would not: for he was struck with exceeding great fear. Then Saul took his sword, and fell upon it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when his armourbearer saw this, to wit, that Saul was dead, he also fell upon his sword and died with him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>So Saul died, and his three sons, and his armourbearer, and all his men that same day together.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the men of Israel, that were beyond the valley, and beyond the Jordan, seeing that the Israelites were fled, and that Saul was dead, and his sons, forsook their cities, and fled: and the Philistines came and dwelt there.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And on the morrow the Philistines came to strip the slain, and they found Saul and his three sons lying in mount Gelboe.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they cut off Saul’s head, and stripped him of his armour, and sent into the land of the Philistines round about, to publish it in the temples of their idols and among their people.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they put his armour in the temple of Astaroth, but his body they hung on the wall of Bethsan.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now when the inhabitants of Jabes Galaad had heard all that the Philistines had done to Saul,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All the most valiant men arose, and walked all the night, and took the body of Saul, and the bodies of his sons, from the wall of Bethsan: and they came to Jabes Galaad, and burnt them there.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they took their bones, and buried them in the wood of Jabes: and fasted seven days.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Philisthiim autem pugnabant adversum Israël : et fugerunt viri Israël ante faciem Philisthiim, et ceciderunt interfecti in monte Gelboë.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Irrueruntque Philisthiim in Saul et in filios ejus, et percusserunt Jonathan, et Abinadab, et Melchisua filios Saul :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>totumque pondus prælii versum est in Saul, et consecuti sunt eum viri sagittarii, et vulneratus est vehementer a sagittariis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixitque Saul ad armigerum suum : Evagina gladium tuum, et percute me : ne forte veniant incircumcisi isti, et interficiant me, illudentes mihi. Et noluit armiger ejus : fuerat enim nimio terrore perterritus. Arripuit itaque Saul gladium, et irruit super eum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quod cum vidisset armiger ejus, videlicet quod mortuus esset Saul, irruit etiam ipse super gladium suum, et mortuus est cum eo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Mortuus est ergo Saul, et tres filii ejus, et armiger illius, et universi viri ejus in die illa pariter.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Videntes autem viri Israël qui erant trans vallem et trans Jordanem, quod fugissent viri Israëlitæ, et quod mortuus esset Saul et filii ejus, reliquerunt civitates suas, et fugerunt : veneruntque Philisthiim, et habitaverunt ibi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Facta autem die altera, venerunt Philisthiim ut spoliarent interfectos, et invenerunt Saul et tres filios ejus jacentes in monte Gelboë.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et præciderunt caput Saul, et spoliaverunt eum armis : et miserunt in terram Philisthinorum per circuitum, ut annuntiaretur in templo idolorum, et in populis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et posuerunt arma ejus in templo Astaroth, corpus vero ejus suspenderunt in muro Bethsan.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quod cum audissent habitatores Jabes Galaad, quæcumque fecerant Philisthiim Saul,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>surrexerunt omnes viri fortissimi, et ambulaverunt tota nocte, et tulerunt cadaver Saul, et cadavera filiorum ejus, de muro Bethsan : veneruntque Jabes Galaad, et combusserunt ea ibi :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et tulerunt ossa eorum, et sepelierunt in nemore Jabes, et jejunaverunt septem diebus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/30/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Samuel 30</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2SA/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Samuel 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->31<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 1 Samuel 30" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/30/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" a Name\":\"1 Kings\",\"chapter\":31,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"And the Philistines fought against Israel, and the men of Israel fled from before the Philistines, and fell down slain in mount Gelboe.\"},{\"verse\":2,\"text\":\"And the Philistines fell upon Saul, and upon his sons, and they slew Jonathan, and Abinadab, and Melchisua, the sons of Saul.\"},{\"verse\":3,\"text\":\"And the whole weight of the battle was turned upon Saul: and the archers overtook him, and he was grievously wounded by the archers.\"},{\"verse\":4,\"text\":\"Then Saul said to his armourbearer: Draw thy sword, and kill me: lest these uncircumcised come, and slay me, and mock at me. And his armourbearer would not: for he was struck with exceeding great fear. Then Saul took his sword, and fell upon it.\"},{\"verse\":5,\"text\":\"And when his armourbearer saw this, to wit, that Saul was dead, he also fell upon his sword and died with him.\"},{\"verse\":6,\"text\":\"So Saul died, and his three sons, and his armourbearer, and all his men that same day together.\"},{\"verse\":7,\"text\":\"And the men of Israel, that were beyond the valley, and beyond the Jordan, seeing that the Israelites were fled, and that Saul was dead, and his sons, forsook their cities, and fled: and the Philistines came and dwelt there.\"},{\"verse\":8,\"text\":\"And on the morrow the Philistines came to strip the slain, and they found Saul and his three sons lying in mount Gelboe.\"},{\"verse\":9,\"text\":\"And they cut off Saul’s head, and stripped him of his armour, and sent into the land of the Philistines round about, to publish it in the temples of their idols and among their people.\"},{\"verse\":10,\"text\":\"And they put his armour in the temple of Astaroth, but his body they hung on the wall of Bethsan.\"},{\"verse\":11,\"text\":\"Now when the inhabitants of Jabes Galaad had heard all that the Philistines had done to Saul,\"},{\"verse\":12,\"text\":\"All the most valiant men arose, and walked all the night, and took the body of Saul, and the bodies of his sons, from the wall of Bethsan: and they came to Jabes Galaad, and burnt them there.\"},{\"verse\":13,\"text\":\"And they took their bones, and buried them in the wood of Jabes: and fasted seven days.\"}],\"vul\":[{\"verse\":1,\"text\":\"Philisthiim autem pugnabant adversum Israël : et fugerunt viri Israël ante faciem Philisthiim, et ceciderunt interfecti in monte Gelboë.\"},{\"verse\":2,\"text\":\"Irrueruntque Philisthiim in Saul et in filios ejus, et percusserunt Jonathan, et Abinadab, et Melchisua filios Saul :\"},{\"verse\":3,\"text\":\"totumque pondus prælii versum est in Saul, et consecuti sunt eum viri sagittarii, et vulneratus est vehementer a sagittariis.\"},{\"verse\":4,\"text\":\"Dixitque Saul ad armigerum suum : Evagina gladium tuum, et percute me : ne forte veniant incircumcisi isti, et interficiant me, illudentes mihi. Et noluit armiger ejus : fuerat enim nimio terrore perterritus. Arripuit itaque Saul gladium, et irruit super eum.\"},{\"verse\":5,\"text\":\"Quod cum vidisset armiger ejus, videlicet quod mortuus esset Saul, irruit etiam ipse super gladium suum, et mortuus est cum eo.\"},{\"verse\":6,\"text\":\"Mortuus est ergo Saul, et tres filii ejus, et armiger illius, et universi viri ejus in die illa pariter.\"},{\"verse\":7,\"text\":\"Videntes autem viri Israël qui erant trans vallem et trans Jordanem, quod fugissent viri Israëlitæ, et quod mortuus esset Saul et filii ejus, reliquerunt civitates suas, et fugerunt : veneruntque Philisthiim, et habitaverunt ibi.\"},{\"verse\":8,\"text\":\"Facta autem die altera, venerunt Philisthiim ut spoliarent interfectos, et invenerunt Saul et tres filios ejus jacentes in monte Gelboë.\"},{\"verse\":9,\"text\":\"Et præciderunt caput Saul, et spoliaverunt eum armis : et miserunt in terram Philisthinorum per circuitum, ut annuntiaretur in templo idolorum, et in populis.\"},{\"verse\":10,\"text\":\"Et posuerunt arma ejus in templo Astaroth, corpus vero ejus suspenderunt in muro Bethsan.\"},{\"verse\":11,\"text\":\"Quod cum audissent habitatores Jabes Galaad, quæcumque fecerant Philisthiim Saul,\"},{\"verse\":12,\"text\":\"surrexerunt omnes viri fortissimi, et ambulaverunt tota nocte, et tulerunt cadaver Saul, et cadavera filiorum ejus, de muro Bethsan : veneruntque Jabes Galaad, et combusserunt ea ibi :\"},{\"verse\":13,\"text\":\"et tulerunt ossa eorum, et sepelierunt in nemore Jabes, et jejunaverunt septem diebus.\"}],\"summary\":\"Israel is defeated by the Philistines: Saul and his sons are slain.\",\"intro\":null,\"prev\":{\"usfm\":\"1SA\",\"chapter\":30,\"label\":\"1 Samuel 30\"},\"next\":{\"usfm\":\"2SA\",\"chapter\":1,\"label\":\"2 Samuel 1\"}}]]\n"])</script></body></html>
