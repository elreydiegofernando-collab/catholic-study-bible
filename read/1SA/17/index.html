<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>1 Samuel 17 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Samuel<!-- --> <span class="text-stone-500">17</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->1 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">War with the Philistines. Goliath challengeth Israel. He is slain by David.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the Philistines gathering together their troops to battle, assembled at Socho of Juda: and camped between Socho and Azeca, in the borders of Dommim.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Saul and the children of Israel being gathered together, came to the valley of Terebinth, and they set the army in array to fight against the Philistines.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And there went out a man baseborn from the camp of the Philistines, named Goliath, of Geth, whose height was six cubits and a span:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he had a helmet of brass upon his head, and he was clothed with a coat of mail with scales, and the weight of his coat of mail was five thousand sicles of brass:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he had greaves of brass on his legs, and a buckler of brass covered his shoulders.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the staff of his spear was like a weaver’s beam, and the head of his spear weighed six hundred sicles of iron: and his armourbearer went before him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And standing, he cried out to the bands of Israel, and said to them: Why are you come out prepared to fight? am not I a Philistine, and you the servants of Saul? Choose out a man of you, and let him come down and fight hand to hand.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If he be able to fight with me, and kill me, we will be servants to you: but if I prevail against him, and kill him, you shall be servants, and shall serve us.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the Philistine said: I have defied the bands of Israel this day: give me a man, and let him fight with me hand to hand.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Saul and all the Israelites hearing these words of the Philistine, were dismayed, and greatly afraid.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now David was the son of that Ephrathite, of Bethlehem Juda, before mentioned, whose name was Isai, who had eight sons, and was an old man in the days of Saul, and of great age among men.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And his three eldest sons followed Saul to the battle: and the names of his three sons that went to the battle, were Eliab, the firstborn, and the second, Abinadab, and the third Samma:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But David was the youngest. So the three eldest having followed Saul,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>David went, and returned from Saul, to feed his father’s flock at Bethlehem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Now the Philistine came out morning and evening, and presented himself forty days.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Isai said to David, his son: Take for thy brethren an ephi of frumenty, and these ten loaves, and run to the camp to thy brethren,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And carry these ten little cheeses to the tribune: and go see thy brethren, if they are well: and learn with whom they are placed.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But Saul, and they, and all the children of Israel, were in the valley of Terebinth, fighting against the Philistines.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>David, therefore, arose in the morning, and gave the charge of the flock to the keeper: and went away loaded, as Isai had commanded him. And he came to the place of Magala, and to the army, which was going out to fight, and shouted for the battle.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For Israel had put themselves in array, and the Philistines who stood against them were prepared.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And David leaving the vessels which he had brought, under the care of the keeper of the baggage, ran to the place of the battle, and asked if all things went well with his brethren.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And as he talked with them, that baseborn man, whose name was Goliath, the Philistine, of Geth, shewed himself coming up from the camp of the Philistines: and he spoke according to the same words, and David heard them,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And all the Israelites, when they saw the man, fled from his face, fearing him exceedingly.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And some one of Israel said: Have you seen this man that is come up, for he is come up to defy Israel. And the man that shall slay him, the king will enrich with great riches, and will give him his daughter, and will make his father’s house free from tribute in Israel.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And David spoke to the men that stood by him, saying: What shall be given to the man that shall kill this Philistine, and shall take away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the people answered him the same words, saying: These things shall be given to the man that shall slay him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Now when Eliab his eldest brother heard this, when he was speaking with others, he was angry with David, and said: Why camest thou hither? and why didst thou leave those few sheep in the desert? I know thy pride, and the wickedness of thy heart: that thou art come down to see the battle.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And David said: What have I done? is there not cause to speak?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he turned a little aside from him to another: and said the same word. And the people answered him as before.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the words which David spoke were heard, and were rehearsed before Saul.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when he was brought to Saul, he said to him. Let not any man’s heart be dismayed in him: I thy servant will go, and will fight against the Philistine.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And Saul said to David: Thou art not able to withstand this Philistine, nor to fight against him: for thou art but a boy, but he is a warrior from his youth.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And David said to Saul: Thy servant kept his father’s sheep, and there came a lion, or a bear, and took a ram out of the midst of the flock:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And I pursued after them, and struck them, and delivered it out of their mouth: and they rose up against me, and I caught them by the throat, and I strangled, and killed them.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For I thy servant have killed both a lion and a bear: and this uncircumcised Philistine shall be also as one of them. I will go now, and take away the reproach of the people: for who is this uncircumcised Philistine, who hath dared to curse the army of the living God?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And David said: The Lord who delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said to David: Go, and the Lord be with thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Saul clothed David with his garments, and put a helmet of brass upon his head, and armed him with a coat of mail.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And David having girded his sword upon his armour, began to try if he could walk in armour: for he was not accustomed to it. And David said to Saul: I cannot go thus, for I am not used to it. And he laid them off,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And he took his staff, which he had always in his hands: and chose him five smooth stones out of the brook, and put them into the shepherd’s scrip, which he had with him, and he took a sling in his hand, and went forth against the Philistine.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And the Philistine came on, and drew nigh against David, and his armourbearer went before him.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And when the Philistine looked, and beheld David, he despised him. For he was a young man, ruddy, and of a comely countenance.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And the Philistine said to David: Am I a dog, that thou comest to me with a staff? And the Philistine cursed David by his gods.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he said to David: Come to me, and I will give thy flesh to the birds of the air, and to the beasts of the earth.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And David said to the Philistine: Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the Lord of hosts, the God of the armies of Israel, which thou hast defied.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>This day, and the Lord will deliver thee into my hand, and I will slay thee, and take away thy head from thee: and I will give the carcasses of the army of the Philistines this day to the birds of the air, and to the beasts of the earth: that all the earth may know that there is a God in Israel.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And all this assembly shall know that the Lord saveth not with sword and spear: for it is his battle, and he will deliver you into our hands.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And when the Philistine arose, and was coming, and drew nigh to meet David, David made haste, and ran to the fight to meet the Philistine.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And he put his hand into his scrip, and took a stone, and cast it with the sling, and fetching it about, struck the Philistine in the forehead: and the stone was fixed in his forehead, and he fell on his face upon the earth.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And David prevailed over the Philistine, with a sling and a stone, and he struck, and slew the Philistine. And as David had no sword in his hand,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>He ran, and stood over the Philistine, and took his sword, and drew it out of the sheath, and slew him, and cut off his head. And the Philistines seeing that their champion was dead, fled away.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And the men of Israel and Juda rising up shouted, and pursued after the Philistines till they came to the valley and to the gates of Accaron, and there fell many wounded of the Philistines in the way of Saraim, and as far as Geth, and as far as Accaron.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And the children of Israel returning, after they had pursued the Philistines, fell upon their camp.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And David taking the head of the Philistine, brought it to Jerusalem: but his armour he put in his tent.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Now at the time that Saul saw David going out against the Philistines, he said to Abner, the captain of the army: Of what family is this young man descended, Abner? And Abner said: As thy soul liveth, O king, I know not.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And the king said: Inquire thou, whose son this young man is.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And when David was returned, after the Philistine was slain, Abner took him, and brought him in before Saul, with the head of the Philistine in his hand.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>And Saul said to him: Young man, of what family art thou? And David said: I am the son of thy servant Isai the Bethlehemite.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Congregantes autem Philisthiim agmina sua in prælium, convenerunt in Socho Judæ : et castrametati sunt inter Socho et Azeca in finibus Dommim.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Porro Saul et filii Israël congregati venerunt in Vallem terebinthi, et direxerunt aciem ad pugnandum contra Philisthiim.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et Philisthiim stabant super montem ex parte hac, et Israël stabat supra montem ex altera parte : vallisque erat inter eos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et egressus est vir spurius de castris Philisthinorum nomine Goliath, de Geth, altitudinis sex cubitorum et palmi :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et cassis ærea super caput ejus, et lorica squamata induebatur. Porro pondus loricæ ejus, quinque millia siclorum æris erat :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et ocreas æreas habebat in cruribus, et clypeus æreus tegebat humeros ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hastile autem hastæ ejus erat quasi liciatorium texentium : ipsum autem ferrum hastæ ejus sexcentos siclos habebat ferri : et armiger ejus antecedebat eum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Stansque clamabat adversum phalangas Israël, et dicebat eis : Quare venistis parati ad prælium ? numquid ego non sum Philisthæus, et vos servi Saul ? eligite ex vobis virum, et descendat ad singulare certamen.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si quiverit pugnare mecum, et percusserit me, erimus vobis servi : si autem ego prævaluero, et percussero eum, vos servi eritis, et servietis nobis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et aiebat Philisthæus : Ego exprobravi agminibus Israël hodie : date mihi virum, et ineat mecum singulare certamen.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Audiens autem Saul et omnes Israëlitæ sermones Philisthæi hujuscemodi, stupebant, et metuebant nimis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>David autem erat filius viri Ephrathæi, de quo supra dictum est, de Bethlehem Juda, cui nomen erat Isai, qui habebat octo filios, et erat vir in diebus Saul senex, et grandævus inter viros.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Abierunt autem tres filii ejus majores post Saul in prælium : et nomina trium filiorum ejus qui perrexerunt ad bellum, Eliab primogenitus, et secundus Abinadab, tertiusque Samma.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>David autem erat minimus. Tribus ergo majoribus secutis Saulem,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>abiit David, et reversus est a Saul ut pasceret gregem patris sui in Bethlehem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Procedebat vero Philisthæus mane et vespere, et stabat quadraginta diebus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixit autem Isai ad David filium suum : Accipe fratribus tuis ephi polentæ, et decem panes istos, et curre in castra ad fratres tuos,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et decem formellas casei has deferes ad tribunum : et fratres tuos visitabis, si recte agant : et cum quibus ordinati sunt, disce.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Saul autem, et illi, et omnes filii Israël, in Valle terebinthi pugnabant adversum Philisthiim.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Surrexit itaque David mane, et commendavit gregem custodi : et onustus abiit, sicut præceperat ei Isai. Et venit ad locum Magala, et ad exercitum, qui egressus ad pugnam vociferatus erat in certamine.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Direxerat enim aciem Israël, sed et Philisthiim ex adverso fuerant præparati.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Derelinquens ergo David vasa quæ attulerat sub manu custodis ad sarcinas, cucurrit ad locum certaminis, et interrogabat si omnia recte agerentur erga fratres suos.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cumque adhuc ille loqueretur eis, apparuit vir ille spurius ascendens, Goliath nomine, Philisthæus de Geth, de castris Philisthinorum : et loquente eo hæc eadem verba audivit David.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omnes autem Israëlitæ, cum vidissent virum, fugerunt a facie ejus, timentes eum valde.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et dixit unus quispiam de Israël : Num vidistis virum hunc, qui ascendit ? ad exprobrandum enim Israëli ascendit. Virum ergo qui percusserit eum, ditabit rex divitiis magnis, et filiam suam dabit ei, et domum patris ejus faciet absque tributo in Israël.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et ait David ad viros qui stabant secum, dicens : Quid dabitur viro qui percusserit Philisthæum hunc, et tulerit opprobrium de Israël ? quis enim est hic Philisthæus incircumcisus, qui exprobravit acies Dei viventis ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Referebat autem ei populus eumdem sermonem, dicens : Hæc dabuntur viro qui percusserit eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quod cum audisset Eliab frater ejus major, loquente eo cum aliis, iratus est contra David, et ait : Quare venisti, et quare dereliquisti pauculas oves illas in deserto ? Ego novi superbiam tuam, et nequitiam cordis tui : quia ut videres prælium, descendisti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et dixit David : Quid feci ? numquid non verbum est ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et declinavit paululum ab eo ad alium : dixitque eumdem sermonem. Et respondit ei populus verbum sicut prius.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Audita sunt autem verba quæ locutus est David, et annuntiata in conspectu Saul.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ad quem cum fuisset adductus, locutus est ei : Non concidat cor cujusquam in eo : ego servus tuus vadam, et pugnabo adversus Philisthæum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et ait Saul ad David : Non vales resistere Philisthæo isti, nec pugnare adversus eum, quia puer es : hic autem vir bellator est ab adolescentia sua.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Dixitque David ad Saul : Pascebat servus tuus patris sui gregem, et veniebat leo vel ursus, et tollebat arietem de medio gregis :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et persequebar eos, et percutiebam, eruebamque de ore eorum : et illi consurgebant adversum me, et apprehendebam mentum eorum, et suffocabam, interficiebamque eos.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Nam et leonem et ursum interfeci ego servus tuus : erit igitur et Philisthæus hic incircumcisus quasi unus ex eis. Nunc vadam, et auferam opprobrium populi : quoniam quis est iste Philisthæus incircumcisus, qui ausus est maledicere exercitui Dei viventis ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et ait David : Dominus qui eripuit me de manu leonis, et de manu ursi, ipse me liberabit de manu Philisthæi hujus. Dixit autem Saul ad David : Vade, et Dominus tecum sit.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et induit Saul David vestimentis suis, et imposuit galeam æream super caput ejus, et vestivit eum lorica.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Accinctus ergo David gladio ejus super vestem suam, cœpit tentare si armatus posset incedere : non enim habebat consuetudinem. Dixitque David ad Saul : Non possum sic incedere, quia non usum habeo. Et deposuit ea,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et tulit baculum suum, quem semper habebat in manibus : et elegit sibi quinque limpidissimos lapides de torrente, et misit eos in peram pastoralem quam habebat secum, et fundam manu tulit : et processit adversum Philisthæum.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Ibat autem Philisthæus incedens, et appropinquans adversum David, et armiger ejus ante eum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Cumque inspexisset Philisthæus, et vidisset David, despexit eum. Erat enim adolescens, rufus, et pulcher aspectu.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et dixit Philisthæus ad David : Numquid ego canis sum, quod tu venis ad me cum baculo ? Et maledixit Philisthæus David in diis suis :</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>dixitque ad David : Veni ad me, et dabo carnes tuas volatilibus cæli et bestiis terræ.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Dixit autem David ad Philisthæum : Tu venis ad me cum gladio, et hasta, et clypeo : ego autem venio ad te in nomine Domini exercituum, Dei agminum Israël quibus exprobrasti</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>hodie, et dabit te Dominus in manu mea, et percutiam te, et auferam caput tuum a te : et dabo cadavera castrorum Philisthiim hodie volatilibus cæli, et bestiis terræ, ut sciat omnis terra quia est Deus in Israël,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>et noverit universa ecclesia hæc, quia non in gladio nec in hasta salvat Dominus : ipsius enim est bellum, et tradet vos in manus nostras.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Cum ergo surrexisset Philisthæus, et veniret, et appropinquaret contra David, festinavit David et cucurrit ad pugnam ex adverso Philisthæi.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Et misit manum suam in peram, tulitque unum lapidem, et funda jecit, et circumducens percussit Philisthæum in fronte : et infixus est lapis in fronte ejus, et cecidit in faciem suam super terram.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Prævaluitque David adversum Philisthæum in funda et lapide, percussumque Philisthæum interfecit. Cumque gladium non haberet in manu David,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>cucurrit, et stetit super Philisthæum, et tulit gladium ejus, et eduxit eum de vagina sua : et interfecit eum, præciditque caput ejus. Videntes autem Philisthiim quod mortuus esset fortissimus eorum, fugerunt.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Et consurgentes viri Israël et Juda vociferati sunt, et persecuti sunt Philisthæos usque dum venirent in vallem, et usque ad portas Accaron : cecideruntque vulnerati de Philisthiim in via Saraim, et usque ad Geth, et usque ad Accaron.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et revertentes filii Israël postquam persecuti fuerant Philisthæos, invaserunt castra eorum.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Assumens autem David caput Philisthæi, attulit illud in Jerusalem : arma vero ejus posuit in tabernaculo suo.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Eo autem tempore quo viderat Saul David egredientem contra Philisthæum, ait ad Abner principem militiæ : De qua stirpe descendit hic adolescens, Abner ? Dixitque Abner : Vivit anima tua, rex, si novi.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Et ait rex : Interroga tu, cujus filius sit iste puer.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Cumque regressus esset David, percusso Philisthæo, tulit eum Abner, et introduxit coram Saule, caput Philisthæi habentem in manu.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Et ait ad eum Saul : De qua progenie es, o adolescens ? Dixitque David : Filius servi tui Isai Bethlehemitæ ego sum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Samuel 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 Samuel 18</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->17<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 1 Samuel 16" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-8 /_next/static/chunks/1yzuijehvoiav.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\nc:C\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7f4ee\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n16:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n11:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"1 Samuel 17 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1SA.17\",{\"bookId\":9,\"usfm\":\"1SA\",\"bookName\":\"1 Samuel\",\"drName\":\"1 Kings\",\"chapter\":17,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Now the Philistines gathering together their troops to battle, assembled at Socho of Juda: and camped between Socho and Azeca, in the borders of Dommim.\"},{\"verse\":2,\"text\":\"And Saul and the children of Israel being gathered together, came to the valley of Terebinth, and they set the army in array to fight against the Philistines.\"},{\"verse\":3,\"text\":\"And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them.\"},{\"verse\":4,\"text\":\"And there went out a man baseborn from the camp of the Philistines, named Goliath, of Geth, whose height was six cubits and a span:\"},{\"verse\":5,\"text\":\"And he had a helmet of brass upon his head, and he was clothed with a coat of mail with scales, and the weight of his coat of mail was five thousand sicles of brass:\"},{\"verse\":6,\"text\":\"And he had greaves of brass on his legs, and a buckler of brass covered his shoulders.\"},{\"verse\":7,\"text\":\"And the staff of his spear was like a weaver’s beam, and the head of his spear weighed six hundred sicles of iron: and his armourbearer went before him.\"},{\"verse\":8,\"text\":\"And standing, he cried out to the bands of Israel, and said to them: Why are you come out prepared to fight? am not I a Philistine, and you the servants of Saul? Choose out a man of you, and let him come down and fight hand to hand.\"},{\"verse\":9,\"text\":\"If he be able to fight with me, and kill me, we will be servants to you: but if I prevail against him, and kill him, you shall be servants, and shall serve us.\"},{\"verse\":10,\"text\":\"And the Philistine said: I have defied the bands of Israel this day: give me a man, and let him fight with me hand to hand.\"},{\"verse\":11,\"text\":\"And Saul and all the Israelites hearing these words of the Philistine, were dismayed, and greatly afraid.\"},{\"verse\":12,\"text\":\"Now David was the son of that Ephrathite, of Bethlehem Juda, before mentioned, whose name was Isai, who had eight sons, and was an old man in the days of Saul, and of great age among men.\"},{\"verse\":13,\"text\":\"And his three eldest sons followed Saul to the battle: and the names of his three sons that went to the battle, were Eliab, the firstborn, and the second, Abinadab, and the third Samma:\"},{\"verse\":14,\"text\":\"But David was the youngest. So the three eldest having followed Saul,\"},{\"verse\":15,\"text\":\"David went, and returned from Saul, to feed his father’s flock at Bethlehem.\"},{\"verse\":16,\"text\":\"Now the Philistine came out morning and evening, and presented himself forty days.\"},{\"verse\":17,\"text\":\"And Isai said to David, his son: Take for thy brethren an ephi of frumenty, and these ten loaves, and run to the camp to thy brethren,\"},{\"verse\":18,\"text\":\"And carry these ten little cheeses to the tribune: and go see thy brethren, if they are well: and learn with whom they are placed.\"},{\"verse\":19,\"text\":\"But Saul, and they, and all the children of Israel, were in the valley of Terebinth, fighting against the Philistines.\"},{\"verse\":20,\"text\":\"David, therefore, arose in the morning, and gave the charge of the flock to the keeper: and went away loaded, as Isai had commanded him. And he came to the place of Magala, and to the army, which was going out to fight, and shouted for the battle.\"},{\"verse\":21,\"text\":\"For Israel had put themselves in array, and the Philistines who stood against them were prepared.\"},{\"verse\":22,\"text\":\"And David leaving the vessels which he had brought, under the care of the keeper of the baggage, ran to the place of the battle, and asked if all things went well with his brethren.\"},{\"verse\":23,\"text\":\"And as he talked with them, that baseborn man, whose name was Goliath, the Philistine, of Geth, shewed himself coming up from the camp of the Philistines: and he spoke according to the same words, and David heard them,\"},{\"verse\":24,\"text\":\"And all the Israelites, when they saw the man, fled from his face, fearing him exceedingly.\"},{\"verse\":25,\"text\":\"And some one of Israel said: Have you seen this man that is come up, for he is come up to defy Israel. And the man that shall slay him, the king will enrich with great riches, and will give him his daughter, and will make his father’s house free from tribute in Israel.\"},{\"verse\":26,\"text\":\"And David spoke to the men that stood by him, saying: What shall be given to the man that shall kill this Philistine, and shall take away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?\"},{\"verse\":27,\"text\":\"And the people answered him the same words, saying: These things shall be given to the man that shall slay him.\"},{\"verse\":28,\"text\":\"Now when Eliab his eldest brother heard this, when he was speaking with others, he was angry with David, and said: Why camest thou hither? and why didst thou leave those few sheep in the desert? I know thy pride, and the wickedness of thy heart: that thou art come down to see the battle.\"},{\"verse\":29,\"text\":\"And David said: What have I done? is there not cause to speak?\"},{\"verse\":30,\"text\":\"And he turned a little aside from him to another: and said the same word. And the people answered him as before.\"},{\"verse\":31,\"text\":\"And the words which David spoke were heard, and were rehearsed before Saul.\"},{\"verse\":32,\"text\":\"And when he was brought to Saul, he said to him. Let not any man’s heart be dismayed in him: I thy servant will go, and will fight against the Philistine.\"},{\"verse\":33,\"text\":\"And Saul said to David: Thou art not able to withstand this Philistine, nor to fight against him: for thou art but a boy, but he is a warrior from his youth.\"},{\"verse\":34,\"text\":\"And David said to Saul: Thy servant kept his father’s sheep, and there came a lion, or a bear, and took a ram out of the midst of the flock:\"},{\"verse\":35,\"text\":\"And I pursued after them, and struck them, and delivered it out of their mouth: and they rose up against me, and I caught them by the throat, and I strangled, and killed them.\"},{\"verse\":36,\"text\":\"For I thy servant have killed both a lion and a bear: and this uncircumcised Philistine shall be also as one of them. I will go now, and take away the reproach of the people: for who is this uncircumcised Philistine, who hath dared to curse the army of the living God?\"},{\"verse\":37,\"text\":\"And David said: The Lord who delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said to David: Go, and the Lord be with thee.\"},{\"verse\":38,\"text\":\"And Saul clothed David with his garments, and put a helmet of brass upon his head, and armed him with a coat of mail.\"},{\"verse\":39,\"text\":\"And David having girded his sword upon his armour, began to try if he could walk in armour: for he was not accustomed to it. And David said to Saul: I cannot go thus, for I am not used to it. And he laid them off,\"},{\"verse\":40,\"text\":\"And he took his staff, which he had always in his hands: and chose him five smooth stones out of the brook, and put them into the shepherd’s scrip, which he had with him, and he took a sling in his hand, and went forth against the Philistine.\"},{\"verse\":41,\"text\":\"And the Philistine came on, and drew nigh against David, and his armourbearer went before him.\"},{\"verse\":42,\"text\":\"And when the Philistine looked, and beheld David, he despised him. For he was a young man, ruddy, and of a comely countenance.\"},{\"verse\":43,\"text\":\"And the Philistine said to David: Am I a dog, that thou comest to me with a staff? And the Philistine cursed David by his gods.\"},{\"verse\":44,\"text\":\"And he said to David: Come to me, and I will give thy flesh to the birds of the air, and to the beasts of the earth.\"},{\"verse\":45,\"text\":\"And David said to the Philistine: Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the Lord of hosts, the God of the armies of Israel, which thou hast defied.\"},{\"verse\":46,\"text\":\"This day, and the Lord will deliver thee into my hand, and I will slay thee, and take away thy head from thee: and I will give the carcasses of the army of the Philistines this day to the birds of the air, and to the beasts of the earth: that all the earth may know that there is a God in Israel.\"},{\"verse\":47,\"text\":\"And all this assembly shall know that the Lord saveth not with sword and spear: for it is his battle, and he will deliver you into our hands.\"},{\"verse\":48,\"text\":\"And when the Philistine arose, and was coming, and drew nigh to meet David, David made haste, and ran to the fight to meet the Philistine.\"},{\"verse\":49,\"text\":\"And he put his hand into his scrip, and took a stone, and cast it with the sling, and fetching it about, struck the Philistine in the forehead: and the stone was fixed in his forehead, and he fell on his face upon the earth.\"},{\"verse\":50,\"text\":\"And David prevailed over the Philistine, with a sling and a stone, and he struck, and slew the Philistine. And as David had no sword in his hand,\"},{\"verse\":51,\"text\":\"He ran, and stood over the Philistine, and took his sword, and drew it out of the sheath, and slew him, and cut off his head. And the Philistines seeing that their champion was dead, fled away.\"},{\"verse\":52,\"text\":\"And the men of Israel and Juda rising up shouted, and pursued after the Philistines till they came to the valley and to the gates of Accaron, and there fell many wounded of the Philistines in the way of Saraim, and as far as Geth, and as far as Accaron.\"},{\"verse\":53,\"text\":\"And the children of Israel returning, after they had pursued the Philistines, fell upon their camp.\"},{\"verse\":54,\"text\":\"And David taking the head of the Philistine, brought it to Jerusalem: but his armour he put in his tent.\"},{\"verse\":55,\"text\":\"Now at the time that Saul saw David going out against the Philistines, he said to Abner, the captain of the army: Of what family is this young man descended, Abner? And Abner said: As thy soul liveth, O king, I know not.\"},{\"verse\":56,\"text\":\"And the king said: Inquire thou, whose son this young man is.\"},{\"verse\":57,\"text\":\"And when David was returned, after the Philistine was slain, Abner took him, and brought him in before Saul, with the head of the Philistine in his hand.\"},{\"verse\":58,\"text\":\"And Saul said to him: Young man, of what family art thou? And David said: I am the son of thy servant Isai the Bethlehemite.\"}],\"vul\":[{\"verse\":1,\"text\":\"Congregantes autem Philisthiim agmina sua in prælium, convenerunt in Socho Judæ : et castrametati sunt inter Socho et Azeca in finibus Dommim.\"},{\"verse\":2,\"text\":\"Porro Saul et filii Israël congregati venerunt in Vallem terebinthi, et direxerunt aciem ad pugnandum contra Philisthiim.\"},{\"verse\":3,\"text\":\"Et Philisthiim stabant super montem ex parte hac, et Israël stabat supra montem ex altera parte : vallisque erat inter eos.\"},{\"verse\":4,\"text\":\"Et egressus est vir spurius de castris Philisthinorum nomine Goliath, de Geth, altitudinis sex cubitorum et palmi :\"},{\"verse\":5,\"text\":\"et cassis ærea super caput ejus, et lorica squamata induebatur. Porro pondus loricæ ejus, quinque millia siclorum æris erat :\"},{\"verse\":6,\"text\":\"et ocreas æreas habebat in cruribus, et clypeus æreus tegebat humeros ejus.\"},{\"verse\":7,\"text\":\"Hastile autem hastæ ejus erat quasi liciatorium texentium : ipsum autem ferrum hastæ ejus sexcentos siclos habebat ferri : et armiger ejus antecedebat eum.\"},{\"verse\":8,\"text\":\"Stansque clamabat adversum phalangas Israël, et dicebat eis : Quare venistis parati ad prælium ? numquid ego non sum Philisthæus, et vos servi Saul ? eligite ex vobis virum, et descendat ad singulare certamen.\"},{\"verse\":9,\"text\":\"Si quiverit pugnare mecum, et percusserit me, erimus vobis servi : si autem ego prævaluero, et percussero eum, vos servi eritis, et servietis nobis.\"},{\"verse\":10,\"text\":\"Et aiebat Philisthæus : Ego exprobravi agminibus Israël hodie : date mihi virum, et ineat mecum singulare certamen.\"},{\"verse\":11,\"text\":\"Audiens autem Saul et omnes Israëlitæ sermones Philisthæi hujuscemodi, stupebant, et metuebant nimis.\"},{\"verse\":12,\"text\":\"David autem erat filius viri Ephrathæi, de quo supra dictum est, de Bethlehem Juda, cui nomen erat Isai, qui habebat octo filios, et erat vir in diebus Saul senex, et grandævus inter viros.\"},{\"verse\":13,\"text\":\"Abierunt autem tres filii ejus majores post Saul in prælium : et nomina trium filiorum ejus qui perrexerunt ad bellum, Eliab primogenitus, et secundus Abinadab, tertiusque Samma.\"},{\"verse\":14,\"text\":\"David autem erat minimus. Tribus ergo majoribus secutis Saulem,\"},{\"verse\":15,\"text\":\"abiit David, et reversus est a Saul ut pasceret gregem patris sui in Bethlehem.\"},{\"verse\":16,\"text\":\"Procedebat vero Philisthæus mane et vespere, et stabat quadraginta diebus.\"},{\"verse\":17,\"text\":\"Dixit autem Isai ad David filium suum : Accipe fratribus tuis ephi polentæ, et decem panes istos, et curre in castra ad fratres tuos,\"},{\"verse\":18,\"text\":\"et decem formellas casei has deferes ad tribunum : et fratres tuos visitabis, si recte agant : et cum quibus ordinati sunt, disce.\"},{\"verse\":19,\"text\":\"Saul autem, et illi, et omnes filii Israël, in Valle terebinthi pugnabant adversum Philisthiim.\"},{\"verse\":20,\"text\":\"Surrexit itaque David mane, et commendavit gregem custodi : et onustus abiit, sicut præceperat ei Isai. Et venit ad locum Magala, et ad exercitum, qui egressus ad pugnam vociferatus erat in certamine.\"},{\"verse\":21,\"text\":\"Direxerat enim aciem Israël, sed et Philisthiim ex adverso fuerant præparati.\"},{\"verse\":22,\"text\":\"Derelinquens ergo David vasa quæ attulerat sub manu custodis ad sarcinas, cucurrit ad locum certaminis, et interrogabat si omnia recte agerentur erga fratres suos.\"},{\"verse\":23,\"text\":\"Cumque adhuc ille loqueretur eis, apparuit vir ille spurius ascendens, Goliath nomine, Philisthæus de Geth, de castris Philisthinorum : et loquente eo hæc eadem verba audivit David.\"},{\"verse\":24,\"text\":\"Omnes autem Israëlitæ, cum vidissent virum, fugerunt a facie ejus, timentes eum valde.\"},{\"verse\":25,\"text\":\"Et dixit unus quispiam de Israël : Num vidistis virum hunc, qui ascendit ? ad exprobrandum enim Israëli ascendit. Virum ergo qui percusserit eum, ditabit rex divitiis magnis, et filiam suam dabit ei, et domum patris ejus faciet absque tributo in Israël.\"},{\"verse\":26,\"text\":\"Et ait David ad viros qui stabant secum, dicens : Quid dabitur viro qui percusserit Philisthæum hunc, et tulerit opprobrium de Israël ? quis enim est hic Philisthæus incircumcisus, qui exprobravit acies Dei viventis ?\"},{\"verse\":27,\"text\":\"Referebat autem ei populus eumdem sermonem, dicens : Hæc dabuntur viro qui percusserit eum.\"},{\"verse\":28,\"text\":\"Quod cum audisset Eliab frater ejus major, loquente eo cum aliis, iratus est contra David, et ait : Quare venisti, et quare dereliquisti pauculas oves illas in deserto ? Ego novi superbiam tuam, et nequitiam cordis tui : quia ut videres prælium, descendisti.\"},{\"verse\":29,\"text\":\"Et dixit David : Quid feci ? numquid non verbum est ?\"},{\"verse\":30,\"text\":\"Et declinavit paululum ab eo ad alium : dixitque eumdem sermonem. Et respondit ei populus verbum sicut prius.\"},{\"verse\":31,\"text\":\"Audita sunt autem verba quæ locutus est David, et annuntiata in conspectu Saul.\"},{\"verse\":32,\"text\":\"Ad quem cum fuisset adductus, locutus est ei : Non concidat cor cujusquam in eo : ego servus tuus vadam, et pugnabo adversus Philisthæum.\"},{\"verse\":33,\"text\":\"Et ait Saul ad David : Non vales resistere Philisthæo isti, nec pugnare adversus eum, quia puer es : hic autem vir bellator est ab adolescentia sua.\"},{\"verse\":34,\"text\":\"Dixitque David ad Saul : Pascebat servus tuus patris sui gregem, et veniebat leo vel ursus, et tollebat arietem de medio gregis :\"},{\"verse\":35,\"text\":\"et persequebar eos, et percutiebam, eruebamque de ore eorum : et illi consurgebant adversum me, et apprehendebam mentum eorum, et suffocabam, interficiebamque eos.\"},{\"verse\":36,\"text\":\"Nam et leonem et ursum interfeci ego servus tuus : erit igitur et Philisthæus hic incircumcisus quasi unus ex eis. Nunc vadam, et auferam opprobrium populi : quoniam quis est iste Philisthæus incircumcisus, qui ausus est maledicere exercitui Dei viventis ?\"},{\"verse\":37,\"text\":\"Et ait David : Dominus qui eripuit me de manu leonis, et de manu ursi, ipse me liberabit de manu Philisthæi hujus. Dixit autem Saul ad David : Vade, et Dominus tecum sit.\"},{\"verse\":38,\"text\":\"Et induit Saul David vestimentis suis, et imposuit galeam æream super caput ejus, et vestivit eum lorica.\"},{\"verse\":39,\"text\":\"Accinctus ergo David gladio ejus super vestem suam, cœpit tentare si armatus posset incedere : non enim habebat consuetudinem. Dixitque David ad Saul : Non possum sic incedere, quia non usum habeo. Et deposuit ea,\"},{\"verse\":40,\"text\":\"et tulit baculum suum, quem semper habebat in manibus : et elegit sibi quinque limpidissimos lapides de torrente, et misit eos in peram pastoralem quam habebat secum, et fundam manu tulit : et processit adversum Philisthæum.\"},{\"verse\":41,\"text\":\"Ibat autem Philisthæus incedens, et appropinquans adversum David, et armiger ejus ante eum.\"},{\"verse\":42,\"text\":\"Cumque inspexisset Philisthæus, et vidisset David, despexit eum. Erat enim adolescens, rufus, et pulcher aspectu.\"},{\"verse\":43,\"text\":\"Et dixit Philisthæus ad David : Numquid ego canis sum, quod tu venis ad me cum baculo ? Et maledixit Philisthæus David in diis suis :\"},{\"verse\":44,\"text\":\"dixitque ad David : Veni ad me, et dabo carnes tuas volatilibus cæli et bestiis terræ.\"},{\"verse\":45,\"text\":\"Dixit autem David ad Philisthæum : Tu venis ad me cum gladio, et hasta, et clypeo : ego autem venio ad te in nomine Domini exercituum, Dei agminum Israël quibus exprobrasti\"},{\"verse\":46,\"text\":\"hodie, et dabit te Dominus in manu mea, et percutiam te, et auferam caput tuum a te : et dabo cadavera castrorum Philisthiim hodie volatilibus cæli, et bestiis terræ, ut sciat omnis terra quia est Deus in Israël,\"},{\"verse\":47,\"text\":\"et noverit universa ecclesia hæc, quia non in gladio nec in hasta salvat Dominus : ipsius enim est bellum, et tradet vos in manus nostras.\"},{\"verse\":48,\"text\":\"Cum ergo surrexisset Philisthæus, et veniret, et appropinquaret contra David, festinavit David et cucurrit ad pugnam ex adverso Philisthæi.\"},{\"verse\":49,\"text\":\"Et misit manum suam in peram, tulitque unum lapidem, et funda jecit, et circumducens percussit Philisthæum in fronte : et infixus est lapis in fronte ejus, et cecidit in faciem suam super terram.\"},{\"verse\":50,\"text\":\"Prævaluitque David adversum Philisthæum in funda et lapide, percussumque Philisthæum interfecit. Cumque gladium non haberet in manu David,\"},{\"verse\":51,\"text\":\"cucurrit, et stetit super Philisthæum, et tulit gladium ejus, et eduxit eum de vagina sua : et interfecit eum, præciditque caput ejus. Videntes autem Philisthiim quod mortuus esset fortissimus eorum, fugerunt.\"},{\"verse\":52,\"text\":\"Et consurgentes viri Israël et Juda vociferati sunt, et persecuti sunt Philisthæos usque dum venirent in vallem, et usque ad portas Accaron : cecideruntque vulnerati de Philisthiim in via Saraim, et usque ad Geth, et usque ad Accaron.\"},{\"verse\":53,\"text\":\"Et revertentes filii Israël postquam persecuti fuerant Philisthæos, invaserunt castra eorum.\"},{\"verse\":54,\"text\":\"Assumens autem David caput Philisthæi, attulit illud in Jerusalem : arma vero ejus posuit in tabernaculo suo.\"},{\"verse\":55,\"text\":\"Eo autem tempore quo viderat Saul David egredientem contra Philisthæum, ait ad Abner principem militiæ : De qua stirpe descendit hic adolescens, Abner ? Dixitque Abner : Vivit anima tua, rex, si novi.\"},{\"verse\":56,\"text\":\"Et ait rex : Interroga tu, cujus filius sit iste puer.\"},{\"verse\":57,\"text\":\"Cumque regressus esset David, percusso Philisthæo, tulit eum Abner, et introduxit coram Saule, caput Philisthæi habentem in manu.\"},{\"verse\":58,\"text\":\"Et ait ad eum Saul : De qua progenie es, o adolescens ? Dixitque David : Filius servi tui Isai Bethlehemitæ ego sum.\"}],\"summary\":\"War with the Philistines. Goliath challengeth Israel. He is slain by David.\",\"intro\":null,\"prev\":{\"usfm\":\"1SA\",\"chapter\":16,\"label\":\"1 Samuel 16\"},\"next\":{\"usfm\":\"1SA\",\"chapter\":18,\"label\":\"1 Samuel 18\"}}]]\n"])</script></body></html>
