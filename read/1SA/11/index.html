"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Samuel<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->1 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Saul defeateth the Ammonites, and delivereth Jabes Galaad.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass about a month after this, that Naas, the Ammonite, came up, and began to fight against Jabes Galaad. And all the men of Jabes said to Naas: Make a covenant with us, and we will serve thee.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Naas, the Ammonite, answered them: On this condition will I make a covenant with you, that I may pluck out all your right eyes, and make you a reproach in all Israel.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the ancients of Jabes said to him: Allow us seven days, that we may send messengers to all the coasts of Israel: and if there be no one to defend us, we will come out to thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The messengers therefore came to Gabaa of Saul: and they spoke these words in the hearing of the people: and all the people lifted up their voices, and wept.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And behold Saul came, following oxen out of the field, and he said: What aileth the people that they weep? And they told him the words of the men of Jabes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Spirit of the Lord came upon Saul, when he had heard these words, and his anger was exceedingly kindled.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And taking both the oxen, he cut them in pieces, and sent them into all the coasts of Israel, by messengers, saying: Whosoever shall not come forth, and follow Saul and Samuel, so shall it be done to his oxen. And the fear of the Lord fell upon the people, and they went out as one man.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he numbered them in Bezec: and there were of the children of Israel three hundred thousand: and of the men of Juda thirty thousand.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they said to the messengers that came: Thus shall you say to the men of Jabes Galaad: To morrow, when the sun shall be hot, you shall have relief. The messengers therefore came, and told the men of Jabes, and they were glad.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they said: In the morning we will come out to you: and you shall do what you please with us.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And it came to pass, when the morrow was come, that Saul put the people in three companies: and he came into the midst of the camp in the morning watch, and he slew the Ammonites until the day grew hot, and the rest were scattered, so that two of them were not left together.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the people said to Samuel: Who is he that said: Shall Saul reign over us? Bring the men, and we will kill them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Saul said: No man shall be killed this day: because the Lord this day hath wrought salvation in Israel:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Samuel said to the people: Come, and let us go to Galgal, and let us renew the kingdom there.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all the people went to Galgal, and there they made Saul king, before the Lord in Galgal, and they sacrificed there victims of peace before the Lord. And there Saul and all the men of Israel rejoiced exceedingly.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est quasi post mensem, ascendit Naas Ammonites, et pugnare cœpit adversum Jabes Galaad. Dixeruntque omnes viri Jabes ad Naas : Habeto nos fœderatos, et serviemus tibi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et respondit ad eos Naas Ammonites : In hoc feriam vobiscum fœdus, ut eruam omnium vestrum oculos dextros, ponamque vos opprobrium in universo Israël.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dixerunt ad eum seniores Jabes : Concede nobis septem dies, ut mittamus nuntios ad universos terminos Israël, et si non fuerit qui defendat nos, egrediemur ad te.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Venerunt ergo nuntii in Gabaa Saulis : et locuti sunt verba hæc, audiente populo : et levavit omnis populus vocem suam, et flevit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ecce Saul veniebat, sequens boves de agro, et ait : Quid habet populus quod plorat ? Et narraverunt ei verba virorum Jabes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et insilivit spiritus Domini in Saul cum audisset verba hæc, et iratus est furor ejus nimis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et assumens utrumque bovem, concidit in frustra, misitque in omnes terminos Israël per manum nuntiorum, dicens : Quicumque non exierit, et secutus fuerit Saul et Samuel, sic fiet bobus ejus. Invasit ergo timor Domini populum, et egressi sunt quasi vir unus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et recensuit eos in Bezech : fueruntque filiorum Israël trecenta millia, virorum autem Juda triginta millia.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et dixerunt nuntiis qui venerant : Sic dicetis viris qui sunt in Jabes Galaad : Cras erit vobis salus, cum incaluerit sol. Venerunt ergo nuntii, et annuntiaverunt viris Jabes : qui lætati sunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et dixerunt : Mane exibimus ad vos : et facietis nobis omne quod placuerit vobis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et factum est, cum dies crastinus venisset, constituit Saul populum in tres partes : et ingressus est media castra in vigilia matutina, et percussit Ammon usque dum incalesceret dies : reliqui autem dispersi sunt, ita ut non relinquerentur in eis duo pariter.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et ait populus ad Samuelem : Quis est iste qui dixit : Saul num regnabit super nos ? Date viros, et interficiemus eos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et ait Saul : Non occidetur quisquam in die hac, quia hodie fecit Dominus salutem in Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dixit autem Samuel ad populum : Venite, et eamus in Galgala, et innovemus ibi regnum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et perrexit omnis populus in Galgala, et fecerunt ibi regem Saul coram Domino in Galgala, et immolaverunt ibi victimas pacificas coram Domino. Et lætatus est ibi Saul, et cuncti viri Israël nimis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1SA/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking on\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1SA.11\",{\"bookId\":9,\"usfm\":\"1SA\",\"bookName\":\"1 Samuel\",\"drName\":\"1 Kings\",\"chapter\":11,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass about a month after this, that Naas, the Ammonite, came up, and began to fight against Jabes Galaad. And all the men of Jabes said to Naas: Make a covenant with us, and we will serve thee.\"},{\"verse\":2,\"text\":\"And Naas, the Ammonite, answered them: On this condition will I make a covenant with you, that I may pluck out all your right eyes, and make you a reproach in all Israel.\"},{\"verse\":3,\"text\":\"And the ancients of Jabes said to him: Allow us seven days, that we may send messengers to all the coasts of Israel: and if there be no one to defend us, we will come out to thee.\"},{\"verse\":4,\"text\":\"The messengers therefore came to Gabaa of Saul: and they spoke these words in the hearing of the people: and all the people lifted up their voices, and wept.\"},{\"verse\":5,\"text\":\"And behold Saul came, following oxen out of the field, and he said: What aileth the people that they weep? And they told him the words of the men of Jabes.\"},{\"verse\":6,\"text\":\"And the Spirit of the Lord came upon Saul, when he had heard these words, and his anger was exceedingly kindled.\"},{\"verse\":7,\"text\":\"And taking both the oxen, he cut them in pieces, and sent them into all the coasts of Israel, by messengers, saying: Whosoever shall not come forth, and follow Saul and Samuel, so shall it be done to his oxen. And the fear of the Lord fell upon the people, and they went out as one man.\"},{\"verse\":8,\"text\":\"And he numbered them in Bezec: and there were of the children of Israel three hundred thousand: and of the men of Juda thirty thousand.\"},{\"verse\":9,\"text\":\"And they said to the messengers that came: Thus shall you say to the men of Jabes Galaad: To morrow, when the sun shall be hot, you shall have relief. The messengers therefore came, and told the men of Jabes, and they were glad.\"},{\"verse\":10,\"text\":\"And they said: In the morning we will come out to you: and you shall do what you please with us.\"},{\"verse\":11,\"text\":\"And it came to pass, when the morrow was come, that Saul put the people in three companies: and he came into the midst of the camp in the morning watch, and he slew the Ammonites until the day grew hot, and the rest were scattered, so that two of them were not left together.\"},{\"verse\":12,\"text\":\"And the people said to Samuel: Who is he that said: Shall Saul reign over us? Bring the men, and we will kill them.\"},{\"verse\":13,\"text\":\"And Saul said: No man shall be killed this day: because the Lord this day hath wrought salvation in Israel:\"},{\"verse\":14,\"text\":\"And Samuel said to the people: Come, and let us go to Galgal, and let us renew the kingdom there.\"},{\"verse\":15,\"text\":\"And all the people went to Galgal, and there they made Saul king, before the Lord in Galgal, and they sacrificed there victims of peace before the Lord. And there Saul and all the men of Israel rejoiced exceedingly.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est quasi post mensem, ascendit Naas Ammonites, et pugnare cœpit adversum Jabes Galaad. Dixeruntque omnes viri Jabes ad Naas : Habeto nos fœderatos, et serviemus tibi.\"},{\"verse\":2,\"text\":\"Et respondit ad eos Naas Ammonites : In hoc feriam vobiscum fœdus, ut eruam omnium vestrum oculos dextros, ponamque vos opprobrium in universo Israël.\"},{\"verse\":3,\"text\":\"Et dixerunt ad eum seniores Jabes : Concede nobis septem dies, ut mittamus nuntios ad universos terminos Israël, et si non fuerit qui defendat nos, egrediemur ad te.\"},{\"verse\":4,\"text\":\"Venerunt ergo nuntii in Gabaa Saulis : et locuti sunt verba hæc, audiente populo : et levavit omnis populus vocem suam, et flevit.\"},{\"verse\":5,\"text\":\"Et ecce Saul veniebat, sequens boves de agro, et ait : Quid habet populus quod plorat ? Et narraverunt ei verba virorum Jabes.\"},{\"verse\":6,\"text\":\"Et insilivit spiritus Domini in Saul cum audisset verba hæc, et iratus est furor ejus nimis.\"},{\"verse\":7,\"text\":\"Et assumens utrumque bovem, concidit in frustra, misitque in omnes terminos Israël per manum nuntiorum, dicens : Quicumque non exierit, et secutus fuerit Saul et Samuel, sic fiet bobus ejus. Invasit ergo timor Domini populum, et egressi sunt quasi vir unus.\"},{\"verse\":8,\"text\":\"Et recensuit eos in Bezech : fueruntque filiorum Israël trecenta millia, virorum autem Juda triginta millia.\"},{\"verse\":9,\"text\":\"Et dixerunt nuntiis qui venerant : Sic dicetis viris qui sunt in Jabes Galaad : Cras erit vobis salus, cum incaluerit sol. Venerunt ergo nuntii, et annuntiaverunt viris Jabes : qui lætati sunt.\"},{\"verse\":10,\"text\":\"Et dixerunt : Mane exibimus ad vos : et facietis nobis omne quod placuerit vobis.\"},{\"verse\":11,\"text\":\"Et factum est, cum dies crastinus venisset, constituit Saul populum in tres partes : et ingressus est media castra in vigilia matutina, et percussit Ammon usque dum incalesceret dies : reliqui autem dispersi sunt, ita ut non relinquerentur in eis duo pariter.\"},{\"verse\":12,\"text\":\"Et ait populus ad Samuelem : Quis est iste qui dixit : Saul num regnabit super nos ? Date viros, et interficiemus eos.\"},{\"verse\":13,\"text\":\"Et ait Saul : Non occidetur quisquam in die hac, quia hodie fecit Dominus salutem in Israël.\"},{\"verse\":14,\"text\":\"Dixit autem Samuel ad populum : Venite, et eamus in Galgala, et innovemus ibi regnum.\"},{\"verse\":15,\"text\":\"Et perrexit omnis populus in Galgala, et fecerunt ibi regem Saul coram Domino in Galgala, et immolaverunt ibi victimas pacificas coram Domino. Et lætatus est ibi Saul, et cuncti viri Israël nimis.\"}],\"summary\":\"Saul defeateth the Ammonites, and delivereth Jabes Galaad.\",\"intro\":null,\"prev\":{\"usfm\":\"1SA\",\"chapter\":10,\"label\":\"1 Samuel 10\"},\"next\":{\"usfm\":\"1SA\",\"chapter\":12,\"label\":\"1 Samuel 12\"}}]]\n"])</script></body></html>
