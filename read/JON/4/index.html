ry:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he prayed to the Lord, and said: I beseech thee, O Lord, is not this what I said, when I was yet in my own country? therefore I went before to flee into Tharsis: for I know that thou art a gracious and merciful God, patient, and of much compassion, and easy to forgive evil.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And now, O Lord, I beseech thee take my life from me: for it is better for me to die than to live.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the Lord said: Dost thou think thou hast reason to be angry?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Then Jonas went out of the city, and sat toward the east side of the city: and he made himself a booth there, and he sat under it in the shadow, till he might see what would befall the city.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Lord God prepared an ivy, and it came up over the head of Jonas, to be a shadow over his head, and to cover him (for he was fatigued): and Jonas was exceeding glad of the ivy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But God prepared a worm, when the morning arose on the following day: and it struck the ivy and it withered.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the sun was risen, the Lord commanded a hot and burning wind: and the sun beat upon the head of Jonas, and he broiled with the heat: and he desired for his soul that he might die, and said: It is better for me to die than to live.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord said to Jonas: Dost thou think thou hast reason to be angry, for the ivy? And he said: I am angry with reason even unto death.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the Lord said: Thou art grieved for the ivy, for which thou hast not laboured, nor made it to grow, which in one night came up, and in one night perished.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And shall I not spare Ninive, that great city, in which there are more than a hundred and twenty thousand persons, that know not how to distinguish between their right hand and their left, and many beasts?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et afflictus est Jonas afflictione magna, et iratus est :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et oravit ad Dominum, et dixit : Obsecro, Domine, numquid non hoc est verbum meum cum adhuc essem in terra mea ? propter hoc præoccupavi ut fugerem in Tharsis : scio enim quia tu Deus clemens et misericors es, patiens et multæ miserationis, et ignoscens super malitia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et nunc, Domine, tolle, quæso, animam meam a me, quia melior est mihi mors quam vita.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dixit Dominus : Putasne bene irasceris tu ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et egressus est Jonas de civitate, et sedit contra orientem civitatis : et fecit sibimet umbraculum ibi, et sedebat subter illud in umbra, donec videret quid accideret civitati.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et præparavit Dominus Deus hederam, et ascendit super caput Jonæ, ut esset umbra super caput ejus, et protegeret eum (laboraverat enim) : et lætatus est Jonas super hedera lætitia magna.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et paravit Deus vermen ascensu diluculi in crastinum : et percussit hederam, et exaruit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et cum ortus fuisset sol, præcepit Dominus vento calido et urenti : et percussit sol super caput Jonæ, et æstuabat : et petivit animæ suæ ut moreretur, et dixit : Melius est mihi mori quam vivere.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et dixit Dominus ad Jonam : Putasne bene irasceris tu super hedera ? Et dixit : Bene irascor ego usque ad mortem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et dixit Dominus : Tu doles super hederam in qua non laborasti, neque fecisti ut cresceret ; quæ sub una nocte nata est, et sub una nocte periit :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et ego non parcam Ninive, civitati magnæ, in qua sunt plus quam centum viginti millia hominum qui nesciunt quid sit inter dexteram et sinistram suam, et jumenta multa ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JON/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Jonah 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-c e than to live.\"},{\"verse\":4,\"text\":\"And the Lord said: Dost thou think thou hast reason to be angry?\"},{\"verse\":5,\"text\":\"Then Jonas went out of the city, and sat toward the east side of the city: and he made himself a booth there, and he sat under it in the shadow, till he might see what would befall the city.\"},{\"verse\":6,\"text\":\"And the Lord God prepared an ivy, and it came up over the head of Jonas, to be a shadow over his head, and to cover him (for he was fatigued): and Jonas was exceeding glad of the ivy.\"},{\"verse\":7,\"text\":\"But God prepared a worm, when the morning arose on the following day: and it struck the ivy and it withered.\"},{\"verse\":8,\"text\":\"And when the sun was risen, the Lord commanded a hot and burning wind: and the sun beat upon the head of Jonas, and he broiled with the heat: and he desired for his soul that he might die, and said: It is better for me to die than to live.\"},{\"verse\":9,\"text\":\"And the Lord said to Jonas: Dost thou think thou hast reason to be angry, for the ivy? And he said: I am angry with reason even unto death.\"},{\"verse\":10,\"text\":\"And the Lord said: Thou art grieved for the ivy, for which thou hast not laboured, nor made it to grow, which in one night came up, and in one night perished.\"},{\"verse\":11,\"text\":\"And shall I not spare Ninive, that great city, in which there are more than a hundred and twenty thousand persons, that know not how to distinguish between their right hand and their left, and many beasts?\"}],\"vul\":[{\"verse\":1,\"text\":\"Et afflictus est Jonas afflictione magna, et iratus est :\"},{\"verse\":2,\"text\":\"et oravit ad Dominum, et dixit : Obsecro, Domine, numquid non hoc est verbum meum cum adhuc essem in terra mea ? propter hoc præoccupavi ut fugerem in Tharsis : scio enim quia tu Deus clemens et misericors es, patiens et multæ miserationis, et ignoscens super malitia.\"},{\"verse\":3,\"text\":\"Et nunc, Domine, tolle, quæso, animam meam a me, quia melior est mihi mors quam vita.\"},{\"verse\":4,\"text\":\"Et dixit Dominus : Putasne bene irasceris tu ?\"},{\"verse\":5,\"text\":\"Et egressus est Jonas de civitate, et sedit contra orientem civitatis : et fecit sibimet umbraculum ibi, et sedebat subter illud in umbra, donec videret quid accideret civitati.\"},{\"verse\":6,\"text\":\"Et præparavit Dominus Deus hederam, et ascendit super caput Jonæ, ut esset umbra super caput ejus, et protegeret eum (laboraverat enim) : et lætatus est Jonas super hedera lætitia magna.\"},{\"verse\":7,\"text\":\"Et paravit Deus vermen ascensu diluculi in crastinum : et percussit hederam, et exaruit.\"},{\"verse\":8,\"text\":\"Et cum ortus fuisset sol, præcepit Dominus vento calido et urenti : et percussit sol super caput Jonæ, et æstuabat : et petivit animæ suæ ut moreretur, et dixit : Melius est mihi mori quam vivere.\"},{\"verse\":9,\"text\":\"Et dixit Dominus ad Jonam : Putasne bene irasceris tu super hedera ? Et dixit : Bene irascor ego usque ad mortem.\"},{\"verse\":10,\"text\":\"Et dixit Dominus : Tu doles super hederam in qua non laborasti, neque fecisti ut cresceret ; quæ sub una nocte nata est, et sub una nocte periit :\"},{\"verse\":11,\"text\":\"et ego non parcam Ninive, civitati magnæ, in qua sunt plus quam centum viginti millia hominum qui nesciunt quid sit inter dexteram et sinistram suam, et jumenta multa ?\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"JON\",\"chapter\":3,\"label\":\"Jonah 3\"},\"next\":{\"usfm\":\"MIC\",\"chapter\":1,\"label\":\"Micah 1\"}}]]\n"])</script></body></html>
