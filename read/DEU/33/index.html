 d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Deuteronomy<!-- --> <span class="text-stone-500">33</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Moses before his death blesseth the tribes of Israel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>This is the blessing, wherewith the man of God, Moses, blessed the children of Israel, before his death.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he said: The Lord came from Sinai, and from Seir he rose up to us: he hath appeared from mount Pharan, and with him thousands of saints. In his right hand a fiery law.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He hath loved the people, all the saints are in his hand: and they that approach to his feet, shall receive of his doctrine.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Moses commanded us a law, the inheritance of the multitude of Jacob.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He shall be king with the most right, the princes of the people, being assembled with the tribes of Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let Ruben live, and not die, and be he small in number.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>This is the blessing of Juda. Hear, O Lord, the voice of Juda, and bring him in unto his people: his hands shall fight for him, and he shall be his helper against his enemies.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>To Levi also he said: Thy perfection, and thy doctrine be to thy holy man, whom thou hast proved in the temptation, and judged at the waters of contradiction:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who hath said to his father, and to his mother: I do not know you; and to his brethren: I know you not: and their own children they have not known. These have kept thy word, and observed thy covenant,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thy judgments, O Jacob, and thy law, O Israel: they shall put incense in thy wrath and holocaust upon thy altar.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Bless, O Lord, his strength, and receive the works of his hands. Strike the backs of his enemies, and let not them that hate him rise.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And to Benjamin he said: The best beloved of the Lord shall dwell confidently in him: as in a bride chamber shall he abide all the day long, and between his shoulders shall be rest.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>To Joseph also he said: Of the blessing of the Lord be his land, of the fruits of heaven, and of the dew, and of the deep that lieth beneath.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Of the fruits brought forth by the sun and by the moon.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Of the tops of the ancient mountains, of the fruits of the everlasting hills:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And of the fruits of the earth, and of the fulness thereof. The blessing of him that appeared in the bush, come upon the head of Joseph, and upon the crown of the Nazarite among his brethren.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>His beauty as of the firstling of a bullock, his horns as the horns of a rhinoceros: with them shall he push the nations even to the ends of the earth. These are the multitudes of Ephraim and these the thousands of Manasses.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And to Zabulon he said: Rejoice, O Zabulon, in thy going out; and Issachar in thy tabernacles.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They shall call the people to the mountain: there shall they sacrifice the victims of justice. Who shall suck as milk the abundance of the sea, and the hidden treasures of the sands.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And to Gad he said: Blessed be Gad in his breadth: he hath rested as a lion, and hath seized upon the arm and the top of the head.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he saw his pre-eminence, that in his portion the teacher was laid up: who was with the princes of the people, and did the justices of the Lord, and his judgment with Israel.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>To Dan also he said: Dan is a young lion, he shall flow plentifully from Basan.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And To Nephtali he said: Nephtali shall enjoy abundance, and shall be full of the blessings of the Lord: he shall possess the sea and the south.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>To Aser also he said: Let Aser be blessed with children, let him be acceptable to his brethren, and let him dip his foot in oil.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>His shoe shall be iron and brass. As the days of thy youth, so also shall thy old age be.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>There is no other god like the God of the rightest: he that is mounted upon the heaven is thy helper. By his magnificence the clouds run hither and thither.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>His dwelling is above, and underneath are the everlasting arms: he shall cast out the enemy from before thee, and shall say: Be thou brought to nought.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Israel shall dwell in safety, and alone. The eye of Jacob in a land of corn and wine, and the heavens shall be misty with dew.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Blessed art thou, Israel: who is like to thee, O people, that art saved by the Lord? the shield of thy help, and the sword of thy glory: thy enemies shall deny thee, and thou shalt tread upon their necks.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc est benedictio, qua benedixit Moyses, homo Dei, filiis Israël ante mortem suam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ait : Dominus de Sinai venit, et de Seir ortus est nobis : apparuit de monte Pharan, et cum eo sanctorum millia. In dextera ejus ignea lex.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dilexit populos, omnes sancti in manu illius sunt : et qui appropinquant pedibus ejus, accipient de doctrina illius.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Legem præcepit nobis Moyses, hæreditatem multitudinis Jacob.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Erit apud rectissimum rex, congregatis principibus populi cum tribubus Israël.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vivat Ruben, et non moriatur, et sit parvus in numero.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hæc est Judæ benedictio : Audi, Domine, vocem Judæ, et ad populum suum introduc eum : manus ejus pugnabunt pro eo, et adjutor illius contra adversarios ejus erit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Levi quoque ait : Perfectio tua, et doctrina tua viro sancto tuo, quem probasti in tentatione, et judicasti ad aquas contradictionis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui dixit patri suo et matri suæ : Nescio vos : et fratribus suis : Ignoro vos : et nescierunt filios suos. Hi custodierunt eloquium tuum, et pactum tuum servaverunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Judicia tua, o Jacob, et legem tuam, o Israël : ponent thymiama in furore tuo, et holocaustum super altare tuum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Benedic, Domine, fortitudini ejus : et opera manuum illius suscipe. Percute dorsa inimicorum ejus : et qui oderunt eum, non consurgant.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et Benjamin ait : Amantissimus Domini habitabit confidenter in eo : quasi in thalamo tota die morabitur, et inter humeros illius requiescet.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Joseph quoque ait : De benedictione Domini terra ejus, de pomis cæli, et rore, atque abysso subjacente.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>De pomis fructuum solis ac lunæ,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>de vertice antiquorum montium, de pomis collium æternorum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et de frugibus terræ, et de plenitudine ejus. Benedictio illius qui apparuit in rubo, veniat super caput Joseph, et super verticem nazaræi inter fratres suos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quasi primogeniti tauri pulchritudo ejus, cornua rhinocerotis cornua illius : in ipsis ventilabit gentes usque ad terminos terræ. Hæ sunt multitudines Ephraim : et hæc millia Manasse.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et Zabulon ait : Lætare, Zabulon, in exitu tuo, et Issachar in tabernaculis tuis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Populos vocabunt ad montem : ibi immolabunt victimas justitiæ. Qui inundationem maris quasi lac sugent, et thesauros absconditos arenarum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et Gad ait : Benedictus in latitudine Gad : quasi leo requievit, cepitque brachium et verticem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et vidit principatum suum, quod in parte sua doctor esset repositus : qui fuit cum principibus populi, et fecit justitias Domini, et judicium suum cum Israël.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dan quoque ait : Dan catulus leonis, fluet largiter de Basan.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et Nephthali dixit : Nephthali abundantia perfruetur, et plenus erit benedictionibus Domini : mare et meridiem possidebit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Aser quoque ait : Benedictus in filiis Aser, sit placens fratribus suis, et tingat in oleo pedem suum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ferrum et æs calceamentum ejus. Sicut dies juventutis tuæ, ita et senectus tua.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non est deus alius ut Deus rectissimi, ascensor cæli, auxiliator tuus. Magnificentia ejus discurrunt nubes,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>habitaculum ejus sursum, et subter brachia sempiterna ejiciet a facie tua inimicum, dicetque : Conterere.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Habitabit Israël confidenter, et solus. Oculus Jacob in terra frumenti et vini, cælique caligabunt rore.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Beatus es tu, Israël : quis similis tui, popule, qui salvaris in Domino ? Scutum auxilii tui, et gladius gloriæ tuæ : negabunt te inimici tui, et tu eorum colla calcabis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/32/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Deuteronomy 32</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/34/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Deuteronomy 34</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->33<!-- --> of <!-- -->34<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] \",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"DEU.33\",{\"bookId\":5,\"usfm\":\"DEU\",\"bookName\":\"Deuteronomy\",\"drName\":\"Deuteronomy\",\"chapter\":33,\"totalChapters\":34,\"dra\":[{\"verse\":1,\"text\":\"This is the blessing, wherewith the man of God, Moses, blessed the children of Israel, before his death.\"},{\"verse\":2,\"text\":\"And he said: The Lord came from Sinai, and from Seir he rose up to us: he hath appeared from mount Pharan, and with him thousands of saints. In his right hand a fiery law.\"},{\"verse\":3,\"text\":\"He hath loved the people, all the saints are in his hand: and they that approach to his feet, shall receive of his doctrine.\"},{\"verse\":4,\"text\":\"Moses commanded us a law, the inheritance of the multitude of Jacob.\"},{\"verse\":5,\"text\":\"He shall be king with the most right, the princes of the people, being assembled with the tribes of Israel.\"},{\"verse\":6,\"text\":\"Let Ruben live, and not die, and be he small in number.\"},{\"verse\":7,\"text\":\"This is the blessing of Juda. Hear, O Lord, the voice of Juda, and bring him in unto his people: his hands shall fight for him, and he shall be his helper against his enemies.\"},{\"verse\":8,\"text\":\"To Levi also he said: Thy perfection, and thy doctrine be to thy holy man, whom thou hast proved in the temptation, and judged at the waters of contradiction:\"},{\"verse\":9,\"text\":\"Who hath said to his father, and to his mother: I do not know you; and to his brethren: I know you not: and their own children they have not known. These have kept thy word, and observed thy covenant,\"},{\"verse\":10,\"text\":\"Thy judgments, O Jacob, and thy law, O Israel: they shall put incense in thy wrath and holocaust upon thy altar.\"},{\"verse\":11,\"text\":\"Bless, O Lord, his strength, and receive the works of his hands. Strike the backs of his enemies, and let not them that hate him rise.\"},{\"verse\":12,\"text\":\"And to Benjamin he said: The best beloved of the Lord shall dwell confidently in him: as in a bride chamber shall he abide all the day long, and between his shoulders shall be rest.\"},{\"verse\":13,\"text\":\"To Joseph also he said: Of the blessing of the Lord be his land, of the fruits of heaven, and of the dew, and of the deep that lieth beneath.\"},{\"verse\":14,\"text\":\"Of the fruits brought forth by the sun and by the moon.\"},{\"verse\":15,\"text\":\"Of the tops of the ancient mountains, of the fruits of the everlasting hills:\"},{\"verse\":16,\"text\":\"And of the fruits of the earth, and of the fulness thereof. The blessing of him that appeared in the bush, come upon the head of Joseph, and upon the crown of the Nazarite among his brethren.\"},{\"verse\":17,\"text\":\"His beauty as of the firstling of a bullock, his horns as the horns of a rhinoceros: with them shall he push the nations even to the ends of the earth. These are the multitudes of Ephraim and these the thousands of Manasses.\"},{\"verse\":18,\"text\":\"And to Zabulon he said: Rejoice, O Zabulon, in thy going out; and Issachar in thy tabernacles.\"},{\"verse\":19,\"text\":\"They shall call the people to the mountain: there shall they sacrifice the victims of justice. Who shall suck as milk the abundance of the sea, and the hidden treasures of the sands.\"},{\"verse\":20,\"text\":\"And to Gad he said: Blessed be Gad in his breadth: he hath rested as a lion, and hath seized upon the arm and the top of the head.\"},{\"verse\":21,\"text\":\"And he saw his pre-eminence, that in his portion the teacher was laid up: who was with the princes of the people, and did the justices of the Lord, and his judgment with Israel.\"},{\"verse\":22,\"text\":\"To Dan also he said: Dan is a young lion, he shall flow plentifully from Basan.\"},{\"verse\":23,\"text\":\"And To Nephtali he said: Nephtali shall enjoy abundance, and shall be full of the blessings of the Lord: he shall possess the sea and the south.\"},{\"verse\":24,\"text\":\"To Aser also he said: Let Aser be blessed with children, let him be acceptable to his brethren, and let him dip his foot in oil.\"},{\"verse\":25,\"text\":\"His shoe shall be iron and brass. As the days of thy youth, so also shall thy old age be.\"},{\"verse\":26,\"text\":\"There is no other god like the God of the rightest: he that is mounted upon the heaven is thy helper. By his magnificence the clouds run hither and thither.\"},{\"verse\":27,\"text\":\"His dwelling is above, and underneath are the everlasting arms: he shall cast out the enemy from before thee, and shall say: Be thou brought to nought.\"},{\"verse\":28,\"text\":\"Israel shall dwell in safety, and alone. The eye of Jacob in a land of corn and wine, and the heavens shall be misty with dew.\"},{\"verse\":29,\"text\":\"Blessed art thou, Israel: who is like to thee, O people, that art saved by the Lord? the shield of thy help, and the sword of thy glory: thy enemies shall deny thee, and thou shalt tread upon their necks.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc est benedictio, qua benedixit Moyses, homo Dei, filiis Israël ante mortem suam.\"},{\"verse\":2,\"text\":\"Et ait : Dominus de Sinai venit, et de Seir ortus est nobis : apparuit de monte Pharan, et cum eo sanctorum millia. In dextera ejus ignea lex.\"},{\"verse\":3,\"text\":\"Dilexit populos, omnes sancti in manu illius sunt : et qui appropinquant pedibus ejus, accipient de doctrina illius.\"},{\"verse\":4,\"text\":\"Legem præcepit nobis Moyses, hæreditatem multitudinis Jacob.\"},{\"verse\":5,\"text\":\"Erit apud rectissimum rex, congregatis principibus populi cum tribubus Israël.\"},{\"verse\":6,\"text\":\"Vivat Ruben, et non moriatur, et sit parvus in numero.\"},{\"verse\":7,\"text\":\"Hæc est Judæ benedictio : Audi, Domine, vocem Judæ, et ad populum suum introduc eum : manus ejus pugnabunt pro eo, et adjutor illius contra adversarios ejus erit.\"},{\"verse\":8,\"text\":\"Levi quoque ait : Perfectio tua, et doctrina tua viro sancto tuo, quem probasti in tentatione, et judicasti ad aquas contradictionis.\"},{\"verse\":9,\"text\":\"Qui dixit patri suo et matri suæ : Nescio vos : et fratribus suis : Ignoro vos : et nescierunt filios suos. Hi custodierunt eloquium tuum, et pactum tuum servaverunt.\"},{\"verse\":10,\"text\":\"Judicia tua, o Jacob, et legem tuam, o Israël : ponent thymiama in furore tuo, et holocaustum super altare tuum.\"},{\"verse\":11,\"text\":\"Benedic, Domine, fortitudini ejus : et opera manuum illius suscipe. Percute dorsa inimicorum ejus : et qui oderunt eum, non consurgant.\"},{\"verse\":12,\"text\":\"Et Benjamin ait : Amantissimus Domini habitabit confidenter in eo : quasi in thalamo tota die morabitur, et inter humeros illius requiescet.\"},{\"verse\":13,\"text\":\"Joseph quoque ait : De benedictione Domini terra ejus, de pomis cæli, et rore, atque abysso subjacente.\"},{\"verse\":14,\"text\":\"De pomis fructuum solis ac lunæ,\"},{\"verse\":15,\"text\":\"de vertice antiquorum montium, de pomis collium æternorum :\"},{\"verse\":16,\"text\":\"et de frugibus terræ, et de plenitudine ejus. Benedictio illius qui apparuit in rubo, veniat super caput Joseph, et super verticem nazaræi inter fratres suos.\"},{\"verse\":17,\"text\":\"Quasi primogeniti tauri pulchritudo ejus, cornua rhinocerotis cornua illius : in ipsis ventilabit gentes usque ad terminos terræ. Hæ sunt multitudines Ephraim : et hæc millia Manasse.\"},{\"verse\":18,\"text\":\"Et Zabulon ait : Lætare, Zabulon, in exitu tuo, et Issachar in tabernaculis tuis.\"},{\"verse\":19,\"text\":\"Populos vocabunt ad montem : ibi immolabunt victimas justitiæ. Qui inundationem maris quasi lac sugent, et thesauros absconditos arenarum.\"},{\"verse\":20,\"text\":\"Et Gad ait : Benedictus in latitudine Gad : quasi leo requievit, cepitque brachium et verticem.\"},{\"verse\":21,\"text\":\"Et vidit principatum suum, quod in parte sua doctor esset repositus : qui fuit cum principibus populi, et fecit justitias Domini, et judicium suum cum Israël.\"},{\"verse\":22,\"text\":\"Dan quoque ait : Dan catulus leonis, fluet largiter de Basan.\"},{\"verse\":23,\"text\":\"Et Nephthali dixit : Nephthali abundantia perfruetur, et plenus erit benedictionibus Domini : mare et meridiem possidebit.\"},{\"verse\":24,\"text\":\"Aser quoque ait : Benedictus in filiis Aser, sit placens fratribus suis, et tingat in oleo pedem suum :\"},{\"verse\":25,\"text\":\"ferrum et æs calceamentum ejus. Sicut dies juventutis tuæ, ita et senectus tua.\"},{\"verse\":26,\"text\":\"Non est deus alius ut Deus rectissimi, ascensor cæli, auxiliator tuus. Magnificentia ejus discurrunt nubes,\"},{\"verse\":27,\"text\":\"habitaculum ejus sursum, et subter brachia sempiterna ejiciet a facie tua inimicum, dicetque : Conterere.\"},{\"verse\":28,\"text\":\"Habitabit Israël confidenter, et solus. Oculus Jacob in terra frumenti et vini, cælique caligabunt rore.\"},{\"verse\":29,\"text\":\"Beatus es tu, Israël : quis similis tui, popule, qui salvaris in Domino ? Scutum auxilii tui, et gladius gloriæ tuæ : negabunt te inimici tui, et tu eorum colla calcabis.\"}],\"summary\":\"Moses before his death blesseth the tribes of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"DEU\",\"chapter\":32,\"label\":\"Deuteronomy 32\"},\"next\":{\"usfm\":\"DEU\",\"chapter\":34,\"label\":\"Deuteronomy 34\"}}]]\n"])</script></body></html>
