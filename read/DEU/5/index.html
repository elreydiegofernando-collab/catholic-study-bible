d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Deuteronomy<!-- --> <span class="text-stone-500">5</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The ten commandments are repeated and explained.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Moses called all Israel, and said to them: Hear, O Israel, the ceremonies and judgments, which I speak in your ears this day: learn them, and fulfil them in work.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The Lord our God made a covenant with us in Horeb.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He made not the covenant with our fathers, but with us, who are now present and living.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He spoke to us face to face in the mount out of the midst of fire.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I was the mediator and stood between the Lord and you at that time, to shew you his words, for you feared the fire, and went not up into the mountain, and he said:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou shalt not have strange gods in my sight.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thou shalt not make to thy self a graven thing, nor the likeness of any things, that are in heaven above, or that are in the earth beneath, or that abide in the waters under the earth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou shalt not adore them, and thou shalt not serve them. For I am the Lord thy God, a jealous God, visiting the iniquity of the fathers upon their children unto the third and fourth generation, to them that hate me,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And shewing mercy unto many thousands, to them that love me, and keep my commandments.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou shalt not take the name of the Lord thy God in vain: for he shall not be unpunished that taketh his name upon a vain thing.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Observe the day of the sabbath, to sanctify it, as the Lord thy God hath commanded thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Six days shalt thou labour, and shalt do all thy works.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The seventh is the day of the sabbath, that is, the rest of the Lord thy God. Thou shalt not do any work therein, thou nor thy son nor thy daughter, nor thy manservant nor thy maidservant, nor thy ox, nor thy ass, nor any of thy beasts, nor the stranger that is within thy gates: that thy manservant and thy maidservant may rest, even as thyself.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Remember that thou also didst serve in Egypt, and the Lord thy God brought thee out from thence with a strong hand, and a stretched out arm. Therefore hath he commanded thee that thou shouldst observe the sabbath day.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Honour thy father and mother, as the Lord thy God hath commanded thee, that thou mayst live a long time, and it may be well with thee in the land, which the Lord thy God will give thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou shalt not kill.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Neither shalt thou commit adultery.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And thou shalt not steal.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Neither shalt thou bear false witness against thy neighbour.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou shalt not covet thy neighbour’s wife: nor his house, nor his field, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is his.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>These words the Lord spoke to all the multitude of you in the mountain, out of the midst of the fire and the cloud, and the darkness, with a loud voice, adding nothing more: and he wrote them in two tables of stone, which he delivered unto me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But you, after you heard the voice out of the midst of the darkness, and saw the mountain burn, came to me, all the princes of the tribes and the elders, and you said:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Behold the Lord our God hath shewn us his majesty and his greatness, we have heard his voice out of the midst of the fire, and have proved this day that God speaking with man, man hath lived.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Why shall we die therefore, and why shall this exceeding great fire comsume us: for if we hear the voice of the Lord our God any more, we shall die.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>What is all flesh, that it should hear the voice of the living God, who speaketh out of the midst of the fire, as we have heard, and be able to live?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Approach thou rather: and hear all things that the Lord our God shall say to thee, and thou shalt speak to us, and we will hear and will do them.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And when the Lord had heard this, he said to me: I have heard the voice of the words of this people, which they spoke to thee: they have spoken all things well.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Who shall give them to have such a mind, to fear me, and to keep all my commandments at all times, that it may be well with them and with their children for ever?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Go and say to them: Return into your tents.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But stand thou here with me, and I will speak to thee all my commandments, and ceremonies and judgments: which thou shalt teach them, that they may do them in the land, which I will give them for a possession.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Keep therefore and do the things which the Lord God hath commanded you: you shall not go aside neither to the right hand, nor to the left.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But you shall walk in the way that the Lord your God hath commanded, that you may live, and it may be well with you, and your days may be long in the land of your possession.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vocavitque Moyses omnem Israëlem, et dixit ad eum : Audi, Israël, cæremonias atque judicia, quæ ego loquor in auribus vestris hodie : discite ea, et opere complete.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dominus Deus noster pepigit nobiscum fœdus in Horeb.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non cum patribus nostris iniit pactum, sed nobiscum qui in præsentiarum sumus, et vivimus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Facie ad faciem locutus est nobis in monte de medio ignis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ego sequester et medius fui inter Dominum et vos in tempore illo, ut annuntiarem vobis verba ejus : timuistis enim ignem, et non ascendistis in montem. Et ait :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ego Dominus Deus tuus, qui eduxi te de terra Ægypti, de domo servitutis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non habebis deos alienos in conspectu meo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non facies tibi sculptile, nec similitudinem omnium, quæ in cælo sunt desuper, et quæ in terra deorsum, et quæ versantur in aquis sub terra.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non adorabis ea, et non coles. Ego enim sum Dominus Deus tuus : Deus æmulator, reddens iniquitatem patrum super filios in tertiam et quartam generationem his qui oderunt me :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et faciens misericordiam in multa millia diligentibus me, et custodientibus præcepta mea.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non usurpabis nomen Domini Dei tui frustra : quia non erit impunitus qui super re vana nomen ejus assumpserit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Observa diem sabbati, ut sanctifices eum, sicut præcepit tibi Dominus Deus tuus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sex diebus operaberis, et facies omnia opera tua.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Septimus dies sabbati est, id est, requies Domini Dei tui. Non facies in eo quidquam operis tu, et filius tuus, et filia, servus et ancilla, et bos, et asinus, et omne jumentum tuum, et peregrinus qui est intra portas tuas : ut requiescat servus tuus, et ancilla tua, sicut et tu.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Memento quod et ipse servieris in Ægypto, et eduxerit te inde Dominus Deus tuus in manu forti, et brachio extento. Idcirco præcepit tibi ut observares diem sabbati.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Honora patrem tuum et matrem, sicut præcepit tibi Dominus Deus tuus, ut longo vivas tempore, et bene sit tibi in terra, quam Dominus Deus tuus daturus est tibi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non occides,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>neque mœchaberis,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>furtumque non facies :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>nec loqueris contra proximum tuum falsum testimonium.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non concupisces uxorem proximi tui : non domum, non agrum, non servum, non ancillam, non bovem, non asinum, et universa quæ illius sunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hæc verba locutus est Dominus ad omnem multitudinem vestram in monte de medio ignis et nubis, et caliginis, voce magna, nihil addens amplius : et scripsit ea in duabus tabulis lapideis, quas tradidit mihi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Vos autem postquam audistis vocem de medio tenebrarum, et montem ardere vidistis, accessistis ad me omnes principes tribuum et majores natu, atque dixistis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ecce ostendit nobis Dominus Deus noster majestatem et magnitudinem suam : vocem ejus audivimus de medio ignis, et probavimus hodie, quod loquente Deo cum homine, vixerit homo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Cur ergo moriemur, et devorabit nos ignis hic maximus ? si enim audierimus ultra vocem Domini Dei nostri, moriemur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quid est omnis caro, ut audiat vocem Dei viventis, qui de medio ignis loquitur sicut nos audivimus, et possit vivere ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Tu magis accede : et audi cuncta quæ dixerit Dominus Deus noster tibi : loquerisque ad nos, et nos audientes faciemus ea.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quod cum audisset Dominus, ait ad me : Audivi vocem verborum populi hujus quæ locuti sunt tibi : bene omnia sunt locuti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quis det talem eos habere mentem, ut timeant me, et custodiant universa mandata mea in omni tempore, ut bene sit eis et filiis eorum in sempiternum ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Vade et dic eis : Revertimini in tentoria vestra.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Tu vero hic sta mecum, et loquar tibi omnia mandata mea, et cæremonias atque judicia : quæ docebis eos, ut faciant ea in terra, quam dabo illis in possessionem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Custodite igitur et facite quæ præcepit Dominus Deus vobis : non declinabitis neque ad dexteram, neque ad sinistram :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>sed per viam, quam præcepit Dominus Deus vester, ambulabitis, ut vivatis, et bene sit vobis, et protelentur dies in terra possessionis vestræ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Deuteronomy 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Deuteronomy 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->34<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Deuteronomy 4" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone- next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"DEU.5\",{\"bookId\":5,\"usfm\":\"DEU\",\"bookName\":\"Deuteronomy\",\"drName\":\"Deuteronomy\",\"chapter\":5,\"totalChapters\":34,\"dra\":[{\"verse\":1,\"text\":\"And Moses called all Israel, and said to them: Hear, O Israel, the ceremonies and judgments, which I speak in your ears this day: learn them, and fulfil them in work.\"},{\"verse\":2,\"text\":\"The Lord our God made a covenant with us in Horeb.\"},{\"verse\":3,\"text\":\"He made not the covenant with our fathers, but with us, who are now present and living.\"},{\"verse\":4,\"text\":\"He spoke to us face to face in the mount out of the midst of fire.\"},{\"verse\":5,\"text\":\"I was the mediator and stood between the Lord and you at that time, to shew you his words, for you feared the fire, and went not up into the mountain, and he said:\"},{\"verse\":6,\"text\":\"I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage.\"},{\"verse\":7,\"text\":\"Thou shalt not have strange gods in my sight.\"},{\"verse\":8,\"text\":\"Thou shalt not make to thy self a graven thing, nor the likeness of any things, that are in heaven above, or that are in the earth beneath, or that abide in the waters under the earth.\"},{\"verse\":9,\"text\":\"Thou shalt not adore them, and thou shalt not serve them. For I am the Lord thy God, a jealous God, visiting the iniquity of the fathers upon their children unto the third and fourth generation, to them that hate me,\"},{\"verse\":10,\"text\":\"And shewing mercy unto many thousands, to them that love me, and keep my commandments.\"},{\"verse\":11,\"text\":\"Thou shalt not take the name of the Lord thy God in vain: for he shall not be unpunished that taketh his name upon a vain thing.\"},{\"verse\":12,\"text\":\"Observe the day of the sabbath, to sanctify it, as the Lord thy God hath commanded thee.\"},{\"verse\":13,\"text\":\"Six days shalt thou labour, and shalt do all thy works.\"},{\"verse\":14,\"text\":\"The seventh is the day of the sabbath, that is, the rest of the Lord thy God. Thou shalt not do any work therein, thou nor thy son nor thy daughter, nor thy manservant nor thy maidservant, nor thy ox, nor thy ass, nor any of thy beasts, nor the stranger that is within thy gates: that thy manservant and thy maidservant may rest, even as thyself.\"},{\"verse\":15,\"text\":\"Remember that thou also didst serve in Egypt, and the Lord thy God brought thee out from thence with a strong hand, and a stretched out arm. Therefore hath he commanded thee that thou shouldst observe the sabbath day.\"},{\"verse\":16,\"text\":\"Honour thy father and mother, as the Lord thy God hath commanded thee, that thou mayst live a long time, and it may be well with thee in the land, which the Lord thy God will give thee.\"},{\"verse\":17,\"text\":\"Thou shalt not kill.\"},{\"verse\":18,\"text\":\"Neither shalt thou commit adultery.\"},{\"verse\":19,\"text\":\"And thou shalt not steal.\"},{\"verse\":20,\"text\":\"Neither shalt thou bear false witness against thy neighbour.\"},{\"verse\":21,\"text\":\"Thou shalt not covet thy neighbour’s wife: nor his house, nor his field, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is his.\"},{\"verse\":22,\"text\":\"These words the Lord spoke to all the multitude of you in the mountain, out of the midst of the fire and the cloud, and the darkness, with a loud voice, adding nothing more: and he wrote them in two tables of stone, which he delivered unto me.\"},{\"verse\":23,\"text\":\"But you, after you heard the voice out of the midst of the darkness, and saw the mountain burn, came to me, all the princes of the tribes and the elders, and you said:\"},{\"verse\":24,\"text\":\"Behold the Lord our God hath shewn us his majesty and his greatness, we have heard his voice out of the midst of the fire, and have proved this day that God speaking with man, man hath lived.\"},{\"verse\":25,\"text\":\"Why shall we die therefore, and why shall this exceeding great fire comsume us: for if we hear the voice of the Lord our God any more, we shall die.\"},{\"verse\":26,\"text\":\"What is all flesh, that it should hear the voice of the living God, who speaketh out of the midst of the fire, as we have heard, and be able to live?\"},{\"verse\":27,\"text\":\"Approach thou rather: and hear all things that the Lord our God shall say to thee, and thou shalt speak to us, and we will hear and will do them.\"},{\"verse\":28,\"text\":\"And when the Lord had heard this, he said to me: I have heard the voice of the words of this people, which they spoke to thee: they have spoken all things well.\"},{\"verse\":29,\"text\":\"Who shall give them to have such a mind, to fear me, and to keep all my commandments at all times, that it may be well with them and with their children for ever?\"},{\"verse\":30,\"text\":\"Go and say to them: Return into your tents.\"},{\"verse\":31,\"text\":\"But stand thou here with me, and I will speak to thee all my commandments, and ceremonies and judgments: which thou shalt teach them, that they may do them in the land, which I will give them for a possession.\"},{\"verse\":32,\"text\":\"Keep therefore and do the things which the Lord God hath commanded you: you shall not go aside neither to the right hand, nor to the left.\"},{\"verse\":33,\"text\":\"But you shall walk in the way that the Lord your God hath commanded, that you may live, and it may be well with you, and your days may be long in the land of your possession.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vocavitque Moyses omnem Israëlem, et dixit ad eum : Audi, Israël, cæremonias atque judicia, quæ ego loquor in auribus vestris hodie : discite ea, et opere complete.\"},{\"verse\":2,\"text\":\"Dominus Deus noster pepigit nobiscum fœdus in Horeb.\"},{\"verse\":3,\"text\":\"Non cum patribus nostris iniit pactum, sed nobiscum qui in præsentiarum sumus, et vivimus.\"},{\"verse\":4,\"text\":\"Facie ad faciem locutus est nobis in monte de medio ignis.\"},{\"verse\":5,\"text\":\"Ego sequester et medius fui inter Dominum et vos in tempore illo, ut annuntiarem vobis verba ejus : timuistis enim ignem, et non ascendistis in montem. Et ait :\"},{\"verse\":6,\"text\":\"Ego Dominus Deus tuus, qui eduxi te de terra Ægypti, de domo servitutis.\"},{\"verse\":7,\"text\":\"Non habebis deos alienos in conspectu meo.\"},{\"verse\":8,\"text\":\"Non facies tibi sculptile, nec similitudinem omnium, quæ in cælo sunt desuper, et quæ in terra deorsum, et quæ versantur in aquis sub terra.\"},{\"verse\":9,\"text\":\"Non adorabis ea, et non coles. Ego enim sum Dominus Deus tuus : Deus æmulator, reddens iniquitatem patrum super filios in tertiam et quartam generationem his qui oderunt me :\"},{\"verse\":10,\"text\":\"et faciens misericordiam in multa millia diligentibus me, et custodientibus præcepta mea.\"},{\"verse\":11,\"text\":\"Non usurpabis nomen Domini Dei tui frustra : quia non erit impunitus qui super re vana nomen ejus assumpserit.\"},{\"verse\":12,\"text\":\"Observa diem sabbati, ut sanctifices eum, sicut præcepit tibi Dominus Deus tuus.\"},{\"verse\":13,\"text\":\"Sex diebus operaberis, et facies omnia opera tua.\"},{\"verse\":14,\"text\":\"Septimus dies sabbati est, id est, requies Domini Dei tui. Non facies in eo quidquam operis tu, et filius tuus, et filia, servus et ancilla, et bos, et asinus, et omne jumentum tuum, et peregrinus qui est intra portas tuas : ut requiescat servus tuus, et ancilla tua, sicut et tu.\"},{\"verse\":15,\"text\":\"Memento quod et ipse servieris in Ægypto, et eduxerit te inde Dominus Deus tuus in manu forti, et brachio extento. Idcirco præcepit tibi ut observares diem sabbati.\"},{\"verse\":16,\"text\":\"Honora patrem tuum et matrem, sicut præcepit tibi Dominus Deus tuus, ut longo vivas tempore, et bene sit tibi in terra, quam Dominus Deus tuus daturus est tibi.\"},{\"verse\":17,\"text\":\"Non occides,\"},{\"verse\":18,\"text\":\"neque mœchaberis,\"},{\"verse\":19,\"text\":\"furtumque non facies :\"},{\"verse\":20,\"text\":\"nec loqueris contra proximum tuum falsum testimonium.\"},{\"verse\":21,\"text\":\"Non concupisces uxorem proximi tui : non domum, non agrum, non servum, non ancillam, non bovem, non asinum, et universa quæ illius sunt.\"},{\"verse\":22,\"text\":\"Hæc verba locutus est Dominus ad omnem multitudinem vestram in monte de medio ignis et nubis, et caliginis, voce magna, nihil addens amplius : et scripsit ea in duabus tabulis lapideis, quas tradidit mihi.\"},{\"verse\":23,\"text\":\"Vos autem postquam audistis vocem de medio tenebrarum, et montem ardere vidistis, accessistis ad me omnes principes tribuum et majores natu, atque dixistis :\"},{\"verse\":24,\"text\":\"Ecce ostendit nobis Dominus Deus noster majestatem et magnitudinem suam : vocem ejus audivimus de medio ignis, et probavimus hodie, quod loquente Deo cum homine, vixerit homo.\"},{\"verse\":25,\"text\":\"Cur ergo moriemur, et devorabit nos ignis hic maximus ? si enim audierimus ultra vocem Domini Dei nostri, moriemur.\"},{\"verse\":26,\"text\":\"Quid est omnis caro, ut audiat vocem Dei viventis, qui de medio ignis loquitur sicut nos audivimus, et possit vivere ?\"},{\"verse\":27,\"text\":\"Tu magis accede : et audi cuncta quæ dixerit Dominus Deus noster tibi : loquerisque ad nos, et nos audientes faciemus ea.\"},{\"verse\":28,\"text\":\"Quod cum audisset Dominus, ait ad me : Audivi vocem verborum populi hujus quæ locuti sunt tibi : bene omnia sunt locuti.\"},{\"verse\":29,\"text\":\"Quis det talem eos habere mentem, ut timeant me, et custodiant universa mandata mea in omni tempore, ut bene sit eis et filiis eorum in sempiternum ?\"},{\"verse\":30,\"text\":\"Vade et dic eis : Revertimini in tentoria vestra.\"},{\"verse\":31,\"text\":\"Tu vero hic sta mecum, et loquar tibi omnia mandata mea, et cæremonias atque judicia : quæ docebis eos, ut faciant ea in terra, quam dabo illis in possessionem.\"},{\"verse\":32,\"text\":\"Custodite igitur et facite quæ præcepit Dominus Deus vobis : non declinabitis neque ad dexteram, neque ad sinistram :\"},{\"verse\":33,\"text\":\"sed per viam, quam præcepit Dominus Deus vester, ambulabitis, ut vivatis, et bene sit vobis, et protelentur dies in terra possessionis vestræ.\"}],\"summary\":\"The ten commandments are repeated and explained.\",\"intro\":null,\"prev\":{\"usfm\":\"DEU\",\"chapter\":4,\"label\":\"Deuteronomy 4\"},\"next\":{\"usfm\":\"DEU\",\"chapter\":6,\"label\":\"Deuteronomy 6\"}}]]\n"])</script></body></html>
