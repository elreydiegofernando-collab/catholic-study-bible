<button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>If thou go out to war against thy enemies, and see horsemen and chariots, and the numbers of the enemy’s army greater than thine, thou shalt not fear them: because the Lord thy God is with thee, who brought thee out of the land of Egypt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when the battle is now at hand, the priest shall stand before the army, and shall speak to the people in this manner:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hear, O Israel, you join battle this day against your enemies, let not your heart be dismayed, be not afraid, do not give back, fear ye them not:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Because the Lord your God is in the midst of you, and will fight for you against your enemies, to deliver you from danger.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the captains shall proclaim through every band in the hearing of the army: What man is there, that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate it.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>What man is there, that hath planted a vineyard, and hath not as yet made it to be common, whereof all men may eat? let him go, and return to his house, lest he die in the battle, and another man execute his office.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>What man is there, that hath espoused a wife, and not taken her? let him go, and return to his house, lest he die in the war, and another man take her.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>After these things are declared they shall add the rest, and shall speak to the people: What man is there that is fearful, and faint hearted? let him go, and return to his house, lest he make the hearts of his brethren to fear, as he himself is possessed with fear.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when the captains of the army shall hold their peace, and have made an end of speaking, every man shall prepare their bands to fight.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If at any time thou come to fight against a city, thou shalt first offer it peace.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If they receive it, and open the gates to thee, all the people that are therein, shall be saved, and shall serve thee paying tribute.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But if they will not make peace, and shall begin war against thee, thou shalt besiege it.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when the Lord thy God shall deliver it into thy hands, thou shalt slay all that are therein of the male sex, with the edge of the sword,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Excepting women and children, cattle and other things, that are in the city. And thou shalt divide all the prey to the army, and thou shalt eat the spoils of thy enemies, which the Lord thy God shall give thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So shalt thou do to all cities that are at a great distance from thee, and are not of these cities which thou shalt receive in possession.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But of those cities that shall be given thee, thou shalt suffer none at all to live:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But shalt kill them with the edge of the sword, to wit, the Hethite, and the Amorrhite, and the Chanaanite, the Pherezite, and the Hevite, and the Jebusite, as the Lord thy God hath commanded thee:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Lest they teach you to do all the abominations which they have done to their gods: and you should sin against the Lord your God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>When thou hast besieged a city a long time, and hath compassed it with bulwarks, to take it, thou shalt not cut down the trees that may be eaten of, neither shalt thou spoil the country round about with axes: for it is a tree, and not a man, neither can it increase the number of them that fight against thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But if there be any trees that are not fruitful, but wild, and fit for other uses, cut them down, and make engines, until thou take the city, which fighteth against thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Si exieris ad bellum contra hostes tuos, et videris equitatus et currus, et majorem quam tu habeas adversarii exercitus multitudinem, non timebis eos : quia Dominus Deus tuus tecum est, qui eduxit te de terra Ægypti.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Appropinquante autem jam prælio, stabit sacerdos ante aciem, et sic loquetur ad populum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Audi, Israël : vos hodie contra inimicos vestros pugnam committitis : non pertimescat cor vestrum, nolite metuere, nolite cedere, nec formidetis eos :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quia Dominus Deus vester in medio vestri est, et pro vobis contra adversarios dimicabit, ut eruat vos de periculo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Duces quoque per singulas turmas audiente exercitu proclamabunt : Quis est homo qui ædificavit domum novam, et non dedicavit eam ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius dedicet eam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quis est homo qui plantavit vineam, et necdum fecit eam esse communem, de qua vesci omnibus liceat ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius homo ejus fungatur officio.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quis est homo, qui despondit uxorem, et non accepit eam ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius homo accipiat eam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>His dictis addent reliqua, et loquentur ad populum : Quis est homo formidolosus, et corde pavido ? vadat, et revertatur in domum suam, ne pavere faciat corda fratrum suorum, sicut ipse timore perterritus est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cumque siluerint duces exercitus, et finem loquendi fecerint, unusquisque suos ad bellandum cuneos præparabit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Siquando accesseris ad expugnandam civitatem, offeres ei primum pacem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si receperit, et aperuerit tibi portas, cunctus populus, qui in ea est, salvabitur, et serviet tibi sub tributo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sin autem fœdus inire noluerit, et cœperit contra te bellum, oppugnabis eam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cumque tradiderit Dominus Deus tuus illam in manu tua, percuties omne quod in ea generis masculini est, in ore gladii,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>absque mulieribus et infantibus, jumentis et ceteris quæ in civitate sunt. Omnem prædam exercitui divides, et comedes de spoliis hostium tuorum, quæ Dominus Deus tuus dederit tibi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sic facies cunctis civitatibus, quæ a te procul valde sunt, et non sunt de his urbibus, quas in possessionem accepturus es.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>De his autem civitatibus, quæ dabuntur tibi, nullum omnino permittes vivere :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>sed interficies in ore gladii, Hethæum videlicet, et Amorrhæum, et Chananæum, Pherezæum, et Hevæum, et Jebusæum, sicut præcepit tibi Dominus Deus tuus :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ne forte doceant vos facere cunctas abominationes, quas ipsi operati sunt diis suis, et peccetis in Dominum Deum vestrum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quando obsederis civitatem multo tempore, et munitionibus circumdederis ut expugnes eam, non succides arbores, de quibus vesci potest, nec securibus per circuitum debes vastare regionem : quoniam lignum est, et non homo, nec potest bellantium contra te augere numerum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si qua autem ligna non sunt pomifera, sed agrestia, et in ceteros apta usus, succide, et instrue machinas, donec capias civitatem, quæ contra te dimicat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Deuteronomy 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Deuteronomy 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->20<!-- --> of <!-- -->34<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Deuteronomy 19" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/19/"><svg viewBox="0 0 24 24" fill="none" stroke="c next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"DEU.20\",{\"bookId\":5,\"usfm\":\"DEU\",\"bookName\":\"Deuteronomy\",\"drName\":\"Deuteronomy\",\"chapter\":20,\"totalChapters\":34,\"dra\":[{\"verse\":1,\"text\":\"If thou go out to war against thy enemies, and see horsemen and chariots, and the numbers of the enemy’s army greater than thine, thou shalt not fear them: because the Lord thy God is with thee, who brought thee out of the land of Egypt.\"},{\"verse\":2,\"text\":\"And when the battle is now at hand, the priest shall stand before the army, and shall speak to the people in this manner:\"},{\"verse\":3,\"text\":\"Hear, O Israel, you join battle this day against your enemies, let not your heart be dismayed, be not afraid, do not give back, fear ye them not:\"},{\"verse\":4,\"text\":\"Because the Lord your God is in the midst of you, and will fight for you against your enemies, to deliver you from danger.\"},{\"verse\":5,\"text\":\"And the captains shall proclaim through every band in the hearing of the army: What man is there, that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate it.\"},{\"verse\":6,\"text\":\"What man is there, that hath planted a vineyard, and hath not as yet made it to be common, whereof all men may eat? let him go, and return to his house, lest he die in the battle, and another man execute his office.\"},{\"verse\":7,\"text\":\"What man is there, that hath espoused a wife, and not taken her? let him go, and return to his house, lest he die in the war, and another man take her.\"},{\"verse\":8,\"text\":\"After these things are declared they shall add the rest, and shall speak to the people: What man is there that is fearful, and faint hearted? let him go, and return to his house, lest he make the hearts of his brethren to fear, as he himself is possessed with fear.\"},{\"verse\":9,\"text\":\"And when the captains of the army shall hold their peace, and have made an end of speaking, every man shall prepare their bands to fight.\"},{\"verse\":10,\"text\":\"If at any time thou come to fight against a city, thou shalt first offer it peace.\"},{\"verse\":11,\"text\":\"If they receive it, and open the gates to thee, all the people that are therein, shall be saved, and shall serve thee paying tribute.\"},{\"verse\":12,\"text\":\"But if they will not make peace, and shall begin war against thee, thou shalt besiege it.\"},{\"verse\":13,\"text\":\"And when the Lord thy God shall deliver it into thy hands, thou shalt slay all that are therein of the male sex, with the edge of the sword,\"},{\"verse\":14,\"text\":\"Excepting women and children, cattle and other things, that are in the city. And thou shalt divide all the prey to the army, and thou shalt eat the spoils of thy enemies, which the Lord thy God shall give thee.\"},{\"verse\":15,\"text\":\"So shalt thou do to all cities that are at a great distance from thee, and are not of these cities which thou shalt receive in possession.\"},{\"verse\":16,\"text\":\"But of those cities that shall be given thee, thou shalt suffer none at all to live:\"},{\"verse\":17,\"text\":\"But shalt kill them with the edge of the sword, to wit, the Hethite, and the Amorrhite, and the Chanaanite, the Pherezite, and the Hevite, and the Jebusite, as the Lord thy God hath commanded thee:\"},{\"verse\":18,\"text\":\"Lest they teach you to do all the abominations which they have done to their gods: and you should sin against the Lord your God.\"},{\"verse\":19,\"text\":\"When thou hast besieged a city a long time, and hath compassed it with bulwarks, to take it, thou shalt not cut down the trees that may be eaten of, neither shalt thou spoil the country round about with axes: for it is a tree, and not a man, neither can it increase the number of them that fight against thee.\"},{\"verse\":20,\"text\":\"But if there be any trees that are not fruitful, but wild, and fit for other uses, cut them down, and make engines, until thou take the city, which fighteth against thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Si exieris ad bellum contra hostes tuos, et videris equitatus et currus, et majorem quam tu habeas adversarii exercitus multitudinem, non timebis eos : quia Dominus Deus tuus tecum est, qui eduxit te de terra Ægypti.\"},{\"verse\":2,\"text\":\"Appropinquante autem jam prælio, stabit sacerdos ante aciem, et sic loquetur ad populum :\"},{\"verse\":3,\"text\":\"Audi, Israël : vos hodie contra inimicos vestros pugnam committitis : non pertimescat cor vestrum, nolite metuere, nolite cedere, nec formidetis eos :\"},{\"verse\":4,\"text\":\"quia Dominus Deus vester in medio vestri est, et pro vobis contra adversarios dimicabit, ut eruat vos de periculo.\"},{\"verse\":5,\"text\":\"Duces quoque per singulas turmas audiente exercitu proclamabunt : Quis est homo qui ædificavit domum novam, et non dedicavit eam ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius dedicet eam.\"},{\"verse\":6,\"text\":\"Quis est homo qui plantavit vineam, et necdum fecit eam esse communem, de qua vesci omnibus liceat ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius homo ejus fungatur officio.\"},{\"verse\":7,\"text\":\"Quis est homo, qui despondit uxorem, et non accepit eam ? vadat, et revertatur in domum suam, ne forte moriatur in bello, et alius homo accipiat eam.\"},{\"verse\":8,\"text\":\"His dictis addent reliqua, et loquentur ad populum : Quis est homo formidolosus, et corde pavido ? vadat, et revertatur in domum suam, ne pavere faciat corda fratrum suorum, sicut ipse timore perterritus est.\"},{\"verse\":9,\"text\":\"Cumque siluerint duces exercitus, et finem loquendi fecerint, unusquisque suos ad bellandum cuneos præparabit.\"},{\"verse\":10,\"text\":\"Siquando accesseris ad expugnandam civitatem, offeres ei primum pacem.\"},{\"verse\":11,\"text\":\"Si receperit, et aperuerit tibi portas, cunctus populus, qui in ea est, salvabitur, et serviet tibi sub tributo.\"},{\"verse\":12,\"text\":\"Sin autem fœdus inire noluerit, et cœperit contra te bellum, oppugnabis eam.\"},{\"verse\":13,\"text\":\"Cumque tradiderit Dominus Deus tuus illam in manu tua, percuties omne quod in ea generis masculini est, in ore gladii,\"},{\"verse\":14,\"text\":\"absque mulieribus et infantibus, jumentis et ceteris quæ in civitate sunt. Omnem prædam exercitui divides, et comedes de spoliis hostium tuorum, quæ Dominus Deus tuus dederit tibi.\"},{\"verse\":15,\"text\":\"Sic facies cunctis civitatibus, quæ a te procul valde sunt, et non sunt de his urbibus, quas in possessionem accepturus es.\"},{\"verse\":16,\"text\":\"De his autem civitatibus, quæ dabuntur tibi, nullum omnino permittes vivere :\"},{\"verse\":17,\"text\":\"sed interficies in ore gladii, Hethæum videlicet, et Amorrhæum, et Chananæum, Pherezæum, et Hevæum, et Jebusæum, sicut præcepit tibi Dominus Deus tuus :\"},{\"verse\":18,\"text\":\"ne forte doceant vos facere cunctas abominationes, quas ipsi operati sunt diis suis, et peccetis in Dominum Deum vestrum.\"},{\"verse\":19,\"text\":\"Quando obsederis civitatem multo tempore, et munitionibus circumdederis ut expugnes eam, non succides arbores, de quibus vesci potest, nec securibus per circuitum debes vastare regionem : quoniam lignum est, et non homo, nec potest bellantium contra te augere numerum.\"},{\"verse\":20,\"text\":\"Si qua autem ligna non sunt pomifera, sed agrestia, et in ceteros apta usus, succide, et instrue machinas, donec capias civitatem, quæ contra te dimicat.\"}],\"summary\":\"Laws relating to war.\",\"intro\":null,\"prev\":{\"usfm\":\"DEU\",\"chapter\":19,\"label\":\"Deuteronomy 19\"},\"next\":{\"usfm\":\"DEU\",\"chapter\":21,\"label\":\"Deuteronomy 21\"}}]]\n"])</script></body></html>
