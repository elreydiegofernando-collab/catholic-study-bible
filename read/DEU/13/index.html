t-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>If there rise in the midst of thee a prophet or one that saith he hath dreamed a dream, and he foretell a sign and a wonder,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And that come to pass which he spoke, and he say to thee: Let us go and follow strange gods, which thou knowest not, and let us serve them:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou shalt not hear the words of that prophet or dreamer: for the Lord your God trieth you, that it may appear whether you love him with all your heart, and with all your soul, or not.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Follow the Lord your God, and fear him, and keep his commandments, and hear his voice: him you shall serve, and to him you shall cleave.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And that prophet or forger of dreams shall be slain: because he spoke to draw you away from the Lord your God, who brought you out of the land of Egypt, and redeemed you from the house of bondage: to make thee go out of the way, which the Lord thy God commanded thee: and thou shalt take away the evil out of the midst of thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>If thy brother the son of thy mother, or thy son, or daughter, or thy wife that is in thy bosom, or thy friend, whom thou lovest as thy own soul, would persuade thee secretly, saying: Let us go, and serve strange gods, which thou knowest not, nor thy fathers,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Of all the nations round about, that are near or afar off, from one end of the earth to the other,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Consent not to him, hear him not, neither let thy eye spare him to pity and conceal him,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But thou shalt presently put him to death. Let thy hand be first upon him, and afterwards the hands of all the people.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>With stones shall he be stoned to death: because he would have withdrawn thee from the Lord thy God, who brought thee out of the land of Egypt, from the house of bondage:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>That all Israel hearing may fear, and may do no more any thing like this.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If in one of thy cities, which the Lord thy God shall give thee to dwell in, thou hear some say:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Children of Belial are gone out of the midst of thee, and have withdrawn the inhabitants of their city, and have said: Let us go, and serve strange gods which you know not:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Inquire carefully and diligently, the truth of the thing by looking well into it, and if thou find that which is said to be certain, and that this abomination hath been really committed,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou shalt forthwith kill the inhabitants of that city with the edge of the sword, and shalt destroy it and all things that are in it, even the cattle.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And all the household goods that are there, thou shalt gather together in the midst of the streets thereof, and shall burn them with the city itself, so as to comsume all for the Lord thy God, and that it be a heap for ever: it shall be built no more.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And there shall nothing of that anathema stick to thy hand: that the Lord may turn from the wrath of his fury, and may have mercy on thee, and multiply thee as he swore to thy fathers,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When thou shalt hear the voice of the Lord thy God, keeping all his precepts, which I command thee this day, that thou mayst do what is pleasing in the sight of the Lord thy God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Si surrexerit in medio tui prophetes, aut qui somnium vidisse se dicat, et prædixerit signum atque portentum,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et evenerit quod locutus est, et dixerit tibi : Eamus, et sequamur deos alienos quos ignoras, et serviamus eis :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>non audies verba prophetæ illius aut somniatoris : quia tentat vos Dominus Deus vester, ut palam fiat utrum diligatis eum an non, in toto corde, et in tota anima vestra.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dominum Deum vestrum sequimini, et ipsum timete, et mandata illius custodite, et audite vocem ejus : ipsi servietis, et ipsi adhærebitis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Propheta autem ille aut fictor somniorum interficietur : quia locutus est ut vos averteret a Domino Deo vestro, qui eduxit vos de terra Ægypti, et redemit vos de domo servitutis : ut errare te faceret de via, quam tibi præcepit Dominus Deus tuus : et auferes malum de medio tui.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si tibi voluerit persuadere frater tuus filius matris tuæ, aut filius tuus vel filia, sive uxor quæ est in sinu tuo, aut amicus, quem diligis ut animam tuam, clam dicens : Eamus, et serviamus diis alienis, quos ignoras tu, et patres tui,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>cunctarum in circuitu gentium, quæ juxta vel procul sunt, ab initio usque ad finem terræ,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>non acquiescas ei, nec audias, neque parcat ei oculus tuus ut miserearis et occultes eum,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>sed statim interficies : sit primum manus tua super eum, et postea omnis populus mittat manum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lapidibus obrutus necabitur : quia voluit te abstrahere a Domino Deo tuo, qui eduxit te de terra Ægypti, de domo servitutis :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ut omnis Israël audiens timeat, et nequaquam ultra faciat quippiam hujus rei simile.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si audieris in una urbium tuarum, quas Dominus Deus tuus dabit tibi ad habitandum, dicentes aliquos :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Egressi sunt filii Belial de medio tui, et averterunt habitatores urbis suæ, atque dixerunt : Eamus, et serviamus diis alienis quos ignoratis :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quære sollicite et diligenter, rei veritate perspecta, si inveneris certum esse quod dicitur, et abominationem hanc opere perpetratam,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>statim percuties habitatores urbis illius in ore gladii, et delebis eam ac omnia quæ in illa sunt, usque ad pecora.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quidquid etiam supellectilis fuerit, congregabis in medio platearum ejus, et cum ipsa civitate succendes, ita ut universa consumas Domino Deo tuo, et sit tumulus sempiternus. Non ædificabitur amplius,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et non adhærebit de illo anathemate quidquam in manu tua : ut avertatur Dominus ab ira furoris sui, et misereatur tui, multiplicetque te sicut juravit patribus tuis,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quando audieris vocem Domini Dei tui custodiens omnia præcepta ejus, quæ ego præcipio tibi hodie, ut facias quod placitum est in conspectu Domini Dei tui.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Deuteronomy 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DEU/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Deuterono \"},{\"verse\":5,\"text\":\"And that prophet or forger of dreams shall be slain: because he spoke to draw you away from the Lord your God, who brought you out of the land of Egypt, and redeemed you from the house of bondage: to make thee go out of the way, which the Lord thy God commanded thee: and thou shalt take away the evil out of the midst of thee.\"},{\"verse\":6,\"text\":\"If thy brother the son of thy mother, or thy son, or daughter, or thy wife that is in thy bosom, or thy friend, whom thou lovest as thy own soul, would persuade thee secretly, saying: Let us go, and serve strange gods, which thou knowest not, nor thy fathers,\"},{\"verse\":7,\"text\":\"Of all the nations round about, that are near or afar off, from one end of the earth to the other,\"},{\"verse\":8,\"text\":\"Consent not to him, hear him not, neither let thy eye spare him to pity and conceal him,\"},{\"verse\":9,\"text\":\"But thou shalt presently put him to death. Let thy hand be first upon him, and afterwards the hands of all the people.\"},{\"verse\":10,\"text\":\"With stones shall he be stoned to death: because he would have withdrawn thee from the Lord thy God, who brought thee out of the land of Egypt, from the house of bondage:\"},{\"verse\":11,\"text\":\"That all Israel hearing may fear, and may do no more any thing like this.\"},{\"verse\":12,\"text\":\"If in one of thy cities, which the Lord thy God shall give thee to dwell in, thou hear some say:\"},{\"verse\":13,\"text\":\"Children of Belial are gone out of the midst of thee, and have withdrawn the inhabitants of their city, and have said: Let us go, and serve strange gods which you know not:\"},{\"verse\":14,\"text\":\"Inquire carefully and diligently, the truth of the thing by looking well into it, and if thou find that which is said to be certain, and that this abomination hath been really committed,\"},{\"verse\":15,\"text\":\"Thou shalt forthwith kill the inhabitants of that city with the edge of the sword, and shalt destroy it and all things that are in it, even the cattle.\"},{\"verse\":16,\"text\":\"And all the household goods that are there, thou shalt gather together in the midst of the streets thereof, and shall burn them with the city itself, so as to comsume all for the Lord thy God, and that it be a heap for ever: it shall be built no more.\"},{\"verse\":17,\"text\":\"And there shall nothing of that anathema stick to thy hand: that the Lord may turn from the wrath of his fury, and may have mercy on thee, and multiply thee as he swore to thy fathers,\"},{\"verse\":18,\"text\":\"When thou shalt hear the voice of the Lord thy God, keeping all his precepts, which I command thee this day, that thou mayst do what is pleasing in the sight of the Lord thy God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Si surrexerit in medio tui prophetes, aut qui somnium vidisse se dicat, et prædixerit signum atque portentum,\"},{\"verse\":2,\"text\":\"et evenerit quod locutus est, et dixerit tibi : Eamus, et sequamur deos alienos quos ignoras, et serviamus eis :\"},{\"verse\":3,\"text\":\"non audies verba prophetæ illius aut somniatoris : quia tentat vos Dominus Deus vester, ut palam fiat utrum diligatis eum an non, in toto corde, et in tota anima vestra.\"},{\"verse\":4,\"text\":\"Dominum Deum vestrum sequimini, et ipsum timete, et mandata illius custodite, et audite vocem ejus : ipsi servietis, et ipsi adhærebitis.\"},{\"verse\":5,\"text\":\"Propheta autem ille aut fictor somniorum interficietur : quia locutus est ut vos averteret a Domino Deo vestro, qui eduxit vos de terra Ægypti, et redemit vos de domo servitutis : ut errare te faceret de via, quam tibi præcepit Dominus Deus tuus : et auferes malum de medio tui.\"},{\"verse\":6,\"text\":\"Si tibi voluerit persuadere frater tuus filius matris tuæ, aut filius tuus vel filia, sive uxor quæ est in sinu tuo, aut amicus, quem diligis ut animam tuam, clam dicens : Eamus, et serviamus diis alienis, quos ignoras tu, et patres tui,\"},{\"verse\":7,\"text\":\"cunctarum in circuitu gentium, quæ juxta vel procul sunt, ab initio usque ad finem terræ,\"},{\"verse\":8,\"text\":\"non acquiescas ei, nec audias, neque parcat ei oculus tuus ut miserearis et occultes eum,\"},{\"verse\":9,\"text\":\"sed statim interficies : sit primum manus tua super eum, et postea omnis populus mittat manum.\"},{\"verse\":10,\"text\":\"Lapidibus obrutus necabitur : quia voluit te abstrahere a Domino Deo tuo, qui eduxit te de terra Ægypti, de domo servitutis :\"},{\"verse\":11,\"text\":\"ut omnis Israël audiens timeat, et nequaquam ultra faciat quippiam hujus rei simile.\"},{\"verse\":12,\"text\":\"Si audieris in una urbium tuarum, quas Dominus Deus tuus dabit tibi ad habitandum, dicentes aliquos :\"},{\"verse\":13,\"text\":\"Egressi sunt filii Belial de medio tui, et averterunt habitatores urbis suæ, atque dixerunt : Eamus, et serviamus diis alienis quos ignoratis :\"},{\"verse\":14,\"text\":\"quære sollicite et diligenter, rei veritate perspecta, si inveneris certum esse quod dicitur, et abominationem hanc opere perpetratam,\"},{\"verse\":15,\"text\":\"statim percuties habitatores urbis illius in ore gladii, et delebis eam ac omnia quæ in illa sunt, usque ad pecora.\"},{\"verse\":16,\"text\":\"Quidquid etiam supellectilis fuerit, congregabis in medio platearum ejus, et cum ipsa civitate succendes, ita ut universa consumas Domino Deo tuo, et sit tumulus sempiternus. Non ædificabitur amplius,\"},{\"verse\":17,\"text\":\"et non adhærebit de illo anathemate quidquam in manu tua : ut avertatur Dominus ab ira furoris sui, et misereatur tui, multiplicetque te sicut juravit patribus tuis,\"},{\"verse\":18,\"text\":\"quando audieris vocem Domini Dei tui custodiens omnia præcepta ejus, quæ ego præcipio tibi hodie, ut facias quod placitum est in conspectu Domini Dei tui.\"}],\"summary\":\"False prophets must be slain, and idolatrous cities destroyed.\",\"intro\":null,\"prev\":{\"usfm\":\"DEU\",\"chapter\":12,\"label\":\"Deuteronomy 12\"},\"next\":{\"usfm\":\"DEU\",\"chapter\":14,\"label\":\"Deuteronomy 14\"}}]]\n"])</script></body></html>
