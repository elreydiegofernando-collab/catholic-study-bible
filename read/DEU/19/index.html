 d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Deuteronomy<!-- --> <span class="text-stone-500">19</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The cities of refuge. Wilful murder, and false witnesses must be punished.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>When the Lord thy God hath destroyed the nations, whose land he will deliver to thee, and thou shalt possess it, and shalt dwell in the cities and houses thereof:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thou shalt separate to thee three cities in the midst of the land, which the Lord will give thee in possession,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Paving diligently the way: and thou shalt divide the whole province of thy land equally into three parts: that he who is forced to flee for manslaughter, may have near at hand whither to escape.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>This shall be the law of the slayer that fleeth, whose life is to be saved: He that killeth his neighbor ignorantly, and who is proved to have had no hatred against him yesterday and the day before:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But to have gone with him to the wood to hew wood, and in cutting down the tree the axe slipped out of his hand, and the iron slipping from the handle struck his friend, and killed him: he shall flee to one of the cities aforesaid, and live:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Lest perhaps the next kinsman of him whose blood was shed, pushed on by his grief should pursue, and apprehend him, if the way be too long, and take away the life of him who is not guilty of death, because he is proved to have had no hatred before against him that was slain.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Therefore I command thee, that thou separate three cities at equal distance one from another.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the Lord thy God shall have enlarged thy borders, as he swore to thy fathers, and shall give thee all the land that he promised them,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>(Yet so, if thou keep his commandments, and do the things which I command thee this day, that thou love the Lord thy God, and walk in his ways at all times) thou shalt add to thee other three cities, and shalt double the number of the three cities aforesaid:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>That innocent blood may not be shed in the midst of the land which the Lord thy God will give thee to possess, lest thou be guilty of blood.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But if any man hating his neighbour, lie in wait for his life, and rise and strike him, and he die, and he flee to one of the cities aforesaid,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The ancients of his city shall send, and take him out of the place of refuge, and shall deliver him into the hand of the kinsman of him whose blood was shed, and he shall die.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt not pity him, and thou shalt take away the guilt of innocent blood out of Israel, that it may be well with thee.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt not take nor remove thy neighbour’s landmark, which thy predecessors have set in thy possession, which the Lord thy God will give thee in the land that thou shalt receive to possess.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>One witness shall not rise up against any man, whatsoever the sin or wickedness be: but in the mouth of two or three witnesses every word shall stand.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>If a lying witness stand against a man, accusing him of transgression,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Both of them, between whom the controversy is, shall stand before the Lord in the sight of the priests and the judges that shall be in those days.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when after most diligent inquisition, they shall find that the false witness hath told a lie against his brother:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>They shall render to him as he meant to do to his brother, and thou shalt take away the evil out of the midst of thee:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>That others hearing may fear, and may not dare to do such things.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou shalt not pity him, but shalt require life for life, eye for eye, tooth for tooth, hand for hand, foot for foot.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cum disperdiderit Dominus Deus tuus gentes, quarum tibi traditurus est terram, et possederis eam, habitaverisque in urbibus ejus et in ædibus :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>tres civitates separabis tibi in medio terræ, quam Dominus Deus tuus dabit tibi in possessionem,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>sternens diligenter viam : et in tres æqualiter partes totam terræ tuæ provinciam divides : ut habeat e vicino qui propter homicidium profugus est, quo possit evadere.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæc erit lex homicidæ fugientis, cujus vita servanda est : qui percusserit proximum suum nesciens, et qui heri et nudiustertius nullum contra eum odium habuisse comprobatur :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>sed abiisse cum eo simpliciter in silvam ad ligna cædenda, et in succisione lignorum securis fugerit manu, ferrumque lapsum de manubrio amicum ejus percusserit, et occiderit : hic ad unam supradictarum urbium confugiet, et vivet :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>ne forsitan proximus ejus, cujus effusus est sanguis, dolore stimulatus, persequatur, et apprehendat eum si longior via fuerit, et percutiat animam ejus, qui non est reus mortis : quia nullum contra eum, qui occisus est, odium prius habuisse monstratur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Idcirco præcipio tibi, ut tres civitates æqualis inter se spatii dividas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cum autem dilataverit Dominus Deus tuus terminos tuos, sicut juravit patribus tuis, et dederit tibi cunctam terram, quam eis pollicitus est</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>(si tamen custodieris mandata ejus, et feceris, quæ hodie præcipio tibi, ut diligas Dominum Deum tuum, et ambules in viis ejus omni tempore), addes tibi tres alias civitates, et supradictarum trium urbium numerum duplicabis :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ut non effundatur sanguis innoxius in medio terræ, quam Dominus Deus tuus dabit tibi possidendam, ne sis sanguinis reus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si quis autem, odio habens proximum suum, insidiatus fuerit vitæ ejus, surgensque percusserit illum, et mortuus fuerit, fugeritque ad unam de supradictis urbibus,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>mittent seniores civitatis illius, et arripient eum de loco effugii, tradentque in manu proximi, cujus sanguis effusus est, et morietur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non miseraberis ejus, et auferes innoxium sanguinem de Israël, ut bene sit tibi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non assumes, et transferes terminos proximi tui, quos fixerunt priores in possessione tua, quam Dominus Deus tuus dabit tibi in terra quam acceperis possidendam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non stabit testis unus contra aliquem, quidquid illud peccati, et facinoris fuerit : sed in ore duorum aut trium testium stabit omne verbum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si steterit testis mendax contra hominem, accusans eum prævaricationis,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>stabunt ambo, quorum causa est, ante Dominum in conspectu sacerdotum et judicum qui fuerint in diebus illis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cumque diligentissime perscrutantes, invenerint falsum testem dixisse contra fratrem suum mendacium,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>reddent ei sicut fratri suo facere cogitavit, et auferes malum de medio tui :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ut audientes ceteri timorem habeant, et nequaquam talia audeant facere.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non misereberis ejus, sed animam pro anima, oculum pro oculo, dentem pro dente, manum pro manu, pedem pro pede exiges.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-x  God hath destroyed the nations, whose land he will deliver to thee, and thou shalt possess it, and shalt dwell in the cities and houses thereof:\"},{\"verse\":2,\"text\":\"Thou shalt separate to thee three cities in the midst of the land, which the Lord will give thee in possession,\"},{\"verse\":3,\"text\":\"Paving diligently the way: and thou shalt divide the whole province of thy land equally into three parts: that he who is forced to flee for manslaughter, may have near at hand whither to escape.\"},{\"verse\":4,\"text\":\"This shall be the law of the slayer that fleeth, whose life is to be saved: He that killeth his neighbor ignorantly, and who is proved to have had no hatred against him yesterday and the day before:\"},{\"verse\":5,\"text\":\"But to have gone with him to the wood to hew wood, and in cutting down the tree the axe slipped out of his hand, and the iron slipping from the handle struck his friend, and killed him: he shall flee to one of the cities aforesaid, and live:\"},{\"verse\":6,\"text\":\"Lest perhaps the next kinsman of him whose blood was shed, pushed on by his grief should pursue, and apprehend him, if the way be too long, and take away the life of him who is not guilty of death, because he is proved to have had no hatred before against him that was slain.\"},{\"verse\":7,\"text\":\"Therefore I command thee, that thou separate three cities at equal distance one from another.\"},{\"verse\":8,\"text\":\"And when the Lord thy God shall have enlarged thy borders, as he swore to thy fathers, and shall give thee all the land that he promised them,\"},{\"verse\":9,\"text\":\"(Yet so, if thou keep his commandments, and do the things which I command thee this day, that thou love the Lord thy God, and walk in his ways at all times) thou shalt add to thee other three cities, and shalt double the number of the three cities aforesaid:\"},{\"verse\":10,\"text\":\"That innocent blood may not be shed in the midst of the land which the Lord thy God will give thee to possess, lest thou be guilty of blood.\"},{\"verse\":11,\"text\":\"But if any man hating his neighbour, lie in wait for his life, and rise and strike him, and he die, and he flee to one of the cities aforesaid,\"},{\"verse\":12,\"text\":\"The ancients of his city shall send, and take him out of the place of refuge, and shall deliver him into the hand of the kinsman of him whose blood was shed, and he shall die.\"},{\"verse\":13,\"text\":\"Thou shalt not pity him, and thou shalt take away the guilt of innocent blood out of Israel, that it may be well with thee.\"},{\"verse\":14,\"text\":\"Thou shalt not take nor remove thy neighbour’s landmark, which thy predecessors have set in thy possession, which the Lord thy God will give thee in the land that thou shalt receive to possess.\"},{\"verse\":15,\"text\":\"One witness shall not rise up against any man, whatsoever the sin or wickedness be: but in the mouth of two or three witnesses every word shall stand.\"},{\"verse\":16,\"text\":\"If a lying witness stand against a man, accusing him of transgression,\"},{\"verse\":17,\"text\":\"Both of them, between whom the controversy is, shall stand before the Lord in the sight of the priests and the judges that shall be in those days.\"},{\"verse\":18,\"text\":\"And when after most diligent inquisition, they shall find that the false witness hath told a lie against his brother:\"},{\"verse\":19,\"text\":\"They shall render to him as he meant to do to his brother, and thou shalt take away the evil out of the midst of thee:\"},{\"verse\":20,\"text\":\"That others hearing may fear, and may not dare to do such things.\"},{\"verse\":21,\"text\":\"Thou shalt not pity him, but shalt require life for life, eye for eye, tooth for tooth, hand for hand, foot for foot.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cum disperdiderit Dominus Deus tuus gentes, quarum tibi traditurus est terram, et possederis eam, habitaverisque in urbibus ejus et in ædibus :\"},{\"verse\":2,\"text\":\"tres civitates separabis tibi in medio terræ, quam Dominus Deus tuus dabit tibi in possessionem,\"},{\"verse\":3,\"text\":\"sternens diligenter viam : et in tres æqualiter partes totam terræ tuæ provinciam divides : ut habeat e vicino qui propter homicidium profugus est, quo possit evadere.\"},{\"verse\":4,\"text\":\"Hæc erit lex homicidæ fugientis, cujus vita servanda est : qui percusserit proximum suum nesciens, et qui heri et nudiustertius nullum contra eum odium habuisse comprobatur :\"},{\"verse\":5,\"text\":\"sed abiisse cum eo simpliciter in silvam ad ligna cædenda, et in succisione lignorum securis fugerit manu, ferrumque lapsum de manubrio amicum ejus percusserit, et occiderit : hic ad unam supradictarum urbium confugiet, et vivet :\"},{\"verse\":6,\"text\":\"ne forsitan proximus ejus, cujus effusus est sanguis, dolore stimulatus, persequatur, et apprehendat eum si longior via fuerit, et percutiat animam ejus, qui non est reus mortis : quia nullum contra eum, qui occisus est, odium prius habuisse monstratur.\"},{\"verse\":7,\"text\":\"Idcirco præcipio tibi, ut tres civitates æqualis inter se spatii dividas.\"},{\"verse\":8,\"text\":\"Cum autem dilataverit Dominus Deus tuus terminos tuos, sicut juravit patribus tuis, et dederit tibi cunctam terram, quam eis pollicitus est\"},{\"verse\":9,\"text\":\"(si tamen custodieris mandata ejus, et feceris, quæ hodie præcipio tibi, ut diligas Dominum Deum tuum, et ambules in viis ejus omni tempore), addes tibi tres alias civitates, et supradictarum trium urbium numerum duplicabis :\"},{\"verse\":10,\"text\":\"ut non effundatur sanguis innoxius in medio terræ, quam Dominus Deus tuus dabit tibi possidendam, ne sis sanguinis reus.\"},{\"verse\":11,\"text\":\"Si quis autem, odio habens proximum suum, insidiatus fuerit vitæ ejus, surgensque percusserit illum, et mortuus fuerit, fugeritque ad unam de supradictis urbibus,\"},{\"verse\":12,\"text\":\"mittent seniores civitatis illius, et arripient eum de loco effugii, tradentque in manu proximi, cujus sanguis effusus est, et morietur.\"},{\"verse\":13,\"text\":\"Non miseraberis ejus, et auferes innoxium sanguinem de Israël, ut bene sit tibi.\"},{\"verse\":14,\"text\":\"Non assumes, et transferes terminos proximi tui, quos fixerunt priores in possessione tua, quam Dominus Deus tuus dabit tibi in terra quam acceperis possidendam.\"},{\"verse\":15,\"text\":\"Non stabit testis unus contra aliquem, quidquid illud peccati, et facinoris fuerit : sed in ore duorum aut trium testium stabit omne verbum.\"},{\"verse\":16,\"text\":\"Si steterit testis mendax contra hominem, accusans eum prævaricationis,\"},{\"verse\":17,\"text\":\"stabunt ambo, quorum causa est, ante Dominum in conspectu sacerdotum et judicum qui fuerint in diebus illis.\"},{\"verse\":18,\"text\":\"Cumque diligentissime perscrutantes, invenerint falsum testem dixisse contra fratrem suum mendacium,\"},{\"verse\":19,\"text\":\"reddent ei sicut fratri suo facere cogitavit, et auferes malum de medio tui :\"},{\"verse\":20,\"text\":\"ut audientes ceteri timorem habeant, et nequaquam talia audeant facere.\"},{\"verse\":21,\"text\":\"Non misereberis ejus, sed animam pro anima, oculum pro oculo, dentem pro dente, manum pro manu, pedem pro pede exiges.\"}],\"summary\":\"The cities of refuge. Wilful murder, and false witnesses must be punished.\",\"intro\":null,\"prev\":{\"usfm\":\"DEU\",\"chapter\":18,\"label\":\"Deuteronomy 18\"},\"next\":{\"usfm\":\"DEU\",\"chapter\":20,\"label\":\"Deuteronomy 20\"}}]]\n"])</script></body></html>
