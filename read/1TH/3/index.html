nt-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For which cause, forbearing no longer, we thought it good to remain at Athens alone.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And we sent Timothy, our brother and the minister of God in the gospel of Christ, to confirm you and exhort you concerning your faith:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>That no man should be moved in these tribulations: for yourselves know that we are appointed thereunto.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For even when we were with you, we foretold you that we should suffer tribulations: as also it is come to pass, and you know.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For this cause also, I, forbearing no longer, sent to know your faith: lest perhaps he that tempteth should have tempted you: and our labour should be made vain.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But now when Timothy came to us from you and related to us your faith and charity, and that you have a good remembrance of us always, desiring to see us as we also to see you:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Therefore we were comforted, brethren, in you, in all our necessity and tribulation, by your faith.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Because now we live, if you stand in the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For what thanks can we return to God for you, in all the joy wherewith we rejoice for you before our God,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Night and day more abundantly praying that we may see your face and may accomplish those things that are wanting to your faith?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now God himself and our Father and our Lord Jesus Christ, direct our way unto you.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And may the Lord multiply you and make you abound in charity towards one another and towards all men: as we do also towards you,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>To confirm your hearts without blame, in holiness, before God and our Father, at the coming of our Lord Jesus Christ, with all his saints. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Propter quod non sustinentes amplius, placuit nobis remanere Athenis, solis :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et misimus Timotheum fratrem nostrum, et ministrum Dei in Evangelio Christi, ad confirmandos vos, et exhortandos pro fide vestra :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>ut nemo moveatur in tribulationibus istis : ipsi enim scitis quod in hoc positi sumus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nam et cum apud vos essemus, prædicebamus vobis passuros nos tribulationes, sicut et factum est, et scitis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Propterea et ego amplius non sustinens, misi ad cognoscendam fidem vestram : ne forte tentaverit vos is qui tentat, et inanis fiat labor noster.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nunc autem veniente Timotheo ad nos a vobis, et annuntiante nobis fidem et caritatem vestram, et quia memoriam nostri habetis bonam semper, desiderantes nos videre, sicut et nos quoque vos :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ideo consolati sumus, fratres, in vobis in omni necessitate et tribulatione nostra, per fidem vestram,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>quoniam nunc vivimus, si vos statis in Domino.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quam enim gratiarum actionem possumus Deo retribuere pro vobis in omni gaudio, quo gaudemus propter vos ante Deum nostrum,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>nocte ac die abundantius orantes, ut videamus faciem vestram, et compleamus ea quæ desunt fidei vestræ ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ipse autem Deus, et Pater noster, et Dominus noster Jesus Christus, dirigat viam nostram ad vos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vos autem Dominus multiplicet, et abundare faciat caritatem vestram in invicem, et in omnes, quemadmodum et nos in vobis :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ad confirmanda corda vestra sine querela in sanctitate, ante Deum et Patrem nostrum, in adventu Domini nostri Jesu Christi cum omnibus sanctis ejus. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1TH/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path hens alone.\"},{\"verse\":2,\"text\":\"And we sent Timothy, our brother and the minister of God in the gospel of Christ, to confirm you and exhort you concerning your faith:\"},{\"verse\":3,\"text\":\"That no man should be moved in these tribulations: for yourselves know that we are appointed thereunto.\"},{\"verse\":4,\"text\":\"For even when we were with you, we foretold you that we should suffer tribulations: as also it is come to pass, and you know.\"},{\"verse\":5,\"text\":\"For this cause also, I, forbearing no longer, sent to know your faith: lest perhaps he that tempteth should have tempted you: and our labour should be made vain.\"},{\"verse\":6,\"text\":\"But now when Timothy came to us from you and related to us your faith and charity, and that you have a good remembrance of us always, desiring to see us as we also to see you:\"},{\"verse\":7,\"text\":\"Therefore we were comforted, brethren, in you, in all our necessity and tribulation, by your faith.\"},{\"verse\":8,\"text\":\"Because now we live, if you stand in the Lord.\"},{\"verse\":9,\"text\":\"For what thanks can we return to God for you, in all the joy wherewith we rejoice for you before our God,\"},{\"verse\":10,\"text\":\"Night and day more abundantly praying that we may see your face and may accomplish those things that are wanting to your faith?\"},{\"verse\":11,\"text\":\"Now God himself and our Father and our Lord Jesus Christ, direct our way unto you.\"},{\"verse\":12,\"text\":\"And may the Lord multiply you and make you abound in charity towards one another and towards all men: as we do also towards you,\"},{\"verse\":13,\"text\":\"To confirm your hearts without blame, in holiness, before God and our Father, at the coming of our Lord Jesus Christ, with all his saints. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Propter quod non sustinentes amplius, placuit nobis remanere Athenis, solis :\"},{\"verse\":2,\"text\":\"et misimus Timotheum fratrem nostrum, et ministrum Dei in Evangelio Christi, ad confirmandos vos, et exhortandos pro fide vestra :\"},{\"verse\":3,\"text\":\"ut nemo moveatur in tribulationibus istis : ipsi enim scitis quod in hoc positi sumus.\"},{\"verse\":4,\"text\":\"Nam et cum apud vos essemus, prædicebamus vobis passuros nos tribulationes, sicut et factum est, et scitis.\"},{\"verse\":5,\"text\":\"Propterea et ego amplius non sustinens, misi ad cognoscendam fidem vestram : ne forte tentaverit vos is qui tentat, et inanis fiat labor noster.\"},{\"verse\":6,\"text\":\"Nunc autem veniente Timotheo ad nos a vobis, et annuntiante nobis fidem et caritatem vestram, et quia memoriam nostri habetis bonam semper, desiderantes nos videre, sicut et nos quoque vos :\"},{\"verse\":7,\"text\":\"ideo consolati sumus, fratres, in vobis in omni necessitate et tribulatione nostra, per fidem vestram,\"},{\"verse\":8,\"text\":\"quoniam nunc vivimus, si vos statis in Domino.\"},{\"verse\":9,\"text\":\"Quam enim gratiarum actionem possumus Deo retribuere pro vobis in omni gaudio, quo gaudemus propter vos ante Deum nostrum,\"},{\"verse\":10,\"text\":\"nocte ac die abundantius orantes, ut videamus faciem vestram, et compleamus ea quæ desunt fidei vestræ ?\"},{\"verse\":11,\"text\":\"Ipse autem Deus, et Pater noster, et Dominus noster Jesus Christus, dirigat viam nostram ad vos.\"},{\"verse\":12,\"text\":\"Vos autem Dominus multiplicet, et abundare faciat caritatem vestram in invicem, et in omnes, quemadmodum et nos in vobis :\"},{\"verse\":13,\"text\":\"ad confirmanda corda vestra sine querela in sanctitate, ante Deum et Patrem nostrum, in adventu Domini nostri Jesu Christi cum omnibus sanctis ejus. Amen.\"}],\"summary\":\"The apostle’s concern and love for the Thessalonians.\",\"intro\":null,\"prev\":{\"usfm\":\"1TH\",\"chapter\":2,\"label\":\"1 Thessalonians 2\"},\"next\":{\"usfm\":\"1TH\",\"chapter\":4,\"label\":\"1 Thessalonians 4\"}}]]\n"])</script></body></html>
