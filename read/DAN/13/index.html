<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Daniel 13 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Daniel<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/DAN/">About <!-- -->Daniel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The history of Susanna and the two elders.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now there was a man that dwelt in Babylon, and his name was Joakim:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he took a wife, whose name was Susanna, the daughter of Helcias, a very beautiful woman, and one that feared God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For her parents being just, had instructed their daughter according to the law of Moses.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Now Joakim was very rich, and had an orchard near his house: and the Jews resorted to him, because he was the most honourable of them all.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And there were two of the ancients of the people appointed judges that year, of whom the Lord said: That iniquity came out from Babylon, from the ancient judges, that seemed to govern the people.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>These men frequented the house of Joakim, and all that had any matters of judgment came to them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when the people departed away at noon, Susanna went in, and walked in her husband’s orchard.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the old men saw her going in every day, and walking: and they were inflamed with lust towards her:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they perverted their own mind, and turned away their eyes, that they might not look unto heaven, nor remember just judgments.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>So they were both wounded with the love of her, yet they did not make known their grief one to the other.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For they were ashamed to declare to one another their lust, being desirous to have to do with her:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they watched carefully every day to see her. And one said to the other:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let us now go home, for it is dinner time. So going out, they departed one from another.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And turning back again, they came both to the same place: and asking one another the cause, they acknowledged their lust: and then they agreed together upon a time, when they might find her alone.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it fell out, as they watched a fit day, she went in on a time, as yesterday and the day before, with two maids only, and was desirous to wash herself in the orchard: for it was hot weather.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And there was nobody there, but the two old men that had hid themselves, and were beholding her.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>So she said to the maids: Bring me oil, and washing balls, and shut the doors of the orchard, that I may wash me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they did as she bade them: and they shut the doors of the orchard, and went out by a back door to fetch what she had commanded them, and they knew not that the elders were hid within.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Now when the maids were gone forth, the two elders arose, and ran to her, and said:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Behold the doors of the orchard are shut, and nobody seeth us, and we are in love with thee: wherefore consent to us, and lie with us.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But if thou wilt not, we will bear witness against thee, that a young man was with thee, and therefore thou didst send away thy maids from thee.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Susanna sighed, and said: I am straitened on every side: for if I do this thing, it is death to me: and if I do it not, I shall not escape your hands.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But it is better for me to fall into your hands without doing it, than to sin in the sight of the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>With that Susanna cried out with a loud voice: and the elders also cried out against her.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And one of them ran to the door of the orchard, and opened it.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>So when the servants of the house heard the cry in the orchard, they rushed in by the back door, to see what was the matter.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But after the old men had spoken, the servants were greatly ashamed: for never had there been any such word said of Susanna. And on the next day,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>When the people were come to Joakim, her husband, the two elders also came full of wicked device against Susanna, to put her to death.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they said before the people: Send to Susanna, daughter of Helcias, the wife of Joakim. And presently they sent.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And she came with her parents, and children and all her kindred.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Now Susanna was exceeding delicate, and beautiful to behold.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But those wicked men commanded that her face should be uncovered, (for she was covered) that so at least they might be satisfied with her beauty.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Therefore her friends, and all her acquaintance wept.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But the two elders rising up in the midst of the people, laid their hands upon her head.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And she weeping, looked up to heaven, for her heart had confidence in the Lord.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And the elders said: As we walked in the orchard alone, this woman came in with two maids, and shut the doors of the orchard, and sent away the maids from her.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Then a young man that was there hid came to her, and lay with her.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But we that were in a corner of the orchard, seeing this wickedness, ran up to them, and we saw them lie together.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And him indeed we could not take, because he was stronger than us, and opening the doors, he leaped out:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But having taken this woman, we asked who the young man was, but she would not tell us: of this thing we are witnesses.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The multitude believed them, as being the elders, and the judges of the people, and they condemned her to death.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Then Susanna cried out with a loud voice, and said: O eternal God, who knowest hidden things, who knowest all things before they come to pass,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Thou knowest that they have borne false witness against me: and behold I must die, whereas I have done none of these things, which these men have maliciously forged against me.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the Lord heard her voice.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And when she was led to be put to death, the Lord raised up the holy spirit of a young boy, whose name was Daniel:</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he cried out with a loud voice: I am clear from the blood of this woman.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Then all the people turning themselves towards him, said: What meaneth this word that thou hast spoken?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>But he standing in the midst of them, said: Are ye so foolish, ye children of Israel, that without examination or knowledge of the truth, you have condemned a daughter of Israel?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Return to judgment, for they have borne false witness against her.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>So all the people turned again in haste, and the old men said to him: Come, and sit thou down among us, and shew it us: seeing God hath given thee the honour of old age.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And Daniel said to the people: Separate these two far from one another, and I will examine them.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>So when they were put asunder one from the other, he called one of them, and said to him: O thou that art grown old in evil days, now are thy sins come out, which thou hast committed before:</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>In judging unjust judgments, oppressing the innocent, and letting the guilty to go free, whereas the Lord saith: The innocent and the just thou shalt not kill.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Now then if thou sawest her, tell me under what tree thou sawest them conversing together: He said: Under a mastic tree.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And Daniel said: Well hast thou lied against thy own head: for behold the angel of God having received the sentence of him, shall cut thee in two.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And having put him aside, he commanded that the other should come, and he said to him: O thou seed of Chanaan, and not of Juda, beauty hath deceived thee, and lust hath perverted thy heart:</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Thus did you do to the daughters of Israel, and they for fear conversed with you: but a daughter of Juda would not abide your wickedness.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Now, therefore, tell me, under what tree didst thou take them conversing together. And he answered: Under a holm tree.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And Daniel said to him: Well hast thou also lied against thy own head: for the angel of the Lord waiteth with a sword to cut thee in two, and to destroy you.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>With that all the assembly cried out with a loud voice, and they blessed God, who saveth them that trust in him.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And they rose up against the two elders, (for Daniel had convicted them of false witness by their own mouth) and they did to them as they had maliciously dealt against their neighbour,</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>To fulfil the law of Moses: and they put them to death, and innocent blood was saved in that day.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>But Helcias, and his wife, praised God, for their daughter, Susanna, with Joakim, her husband, and all her kindred, because there was no dishonesty found in her.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>And Daniel became great in the sight of the people from that day, and thence forward.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And king Astyages was gathered to his fathers; and Cyrus, the Persian, received his kingdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et erat vir habitans in Babylone, et nomen ejus Joakim :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et accepit uxorem nomine Susannam, filiam Helciæ, pulchram nimis, et timentem Deum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>parentes enim illius, cum essent justi, erudierunt filiam suam secundum legem Moysi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erat autem Joakim dives valde, et erat ei pomarium vicinum domui suæ : et ad ipsum confluebant Judæi, eo quod esset honorabilior omnium.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et constituti sunt de populo duo senes judices in illo anno, de quibus locutus est Dominus : Quia egressa est iniquitas de Babylone a senioribus judicibus, qui videbantur regere populum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Isti frequentabant domum Joakim, et veniebant ad eos omnes qui habebant judicia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cum autem populus revertisset per meridiem, ingrediebatur Susanna, et deambulabat in pomario viri sui.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et videbant eam senes quotidie ingredientem et deambulantem, et exarserunt in concupiscentiam ejus :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et everterunt sensum suum, et declinaverunt oculos suos ut non viderent cælum, neque recordarentur judiciorum justorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Erant ergo ambo vulnerati amore ejus, nec indicaverunt sibi vicissim dolorem suum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>erubescebant enim indicare sibi concupiscentiam suam, volentes concumbere cum ea.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et observabant quotidie sollicitius videre eam. Dixitque alter ad alterum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Eamus domum, quia hora prandii est. Et egressi, recesserunt a se.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cumque revertissent, venerunt in unum : et sciscitantes ab invicem causam, confessi sunt concupiscentiam suam : et tunc in communi statuerunt tempus quando eam possent invenire solam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Factum est autem, cum observarent diem aptum, ingressa est aliquando sicut heri et nudiustertius, cum duabus solis puellis, voluitque lavari in pomario : æstus quippe erat :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et non erat ibi quisquam, præter duos senes absconditos, et contemplantes eam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixit ergo puellis : Afferte mihi oleum, et smigmata, et ostia pomarii claudite, ut laver.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et fecerunt sicut præceperat : clauseruntque ostia pomarii, et egressæ sunt per posticum ut afferrent quæ jusserat ; nesciebantque senes intus esse absconditos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cum autem egressæ essent puellæ, surrexerunt duo senes, et accurrerunt ad eam, et dixerunt :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ecce ostia pomarii clausa sunt, et nemo nos videt, et nos in concupiscentia tui sumus : quam ob rem assentire nobis, et commiscere nobiscum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quod si nolueris, dicemus contra te testimonium, quod fuerit tecum juvenis, et ob hanc causam emiseris puellas a te.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ingemuit Susanna, et ait : Angustiæ sunt mihi undique : si enim hoc egero, mors mihi est : si autem non egero, non effugiam manus vestras.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sed melius est mihi absque opere incidere in manus vestras, quam peccare in conspectu Domini.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et exclamavit voce magna Susanna : exclamaverunt autem et senes adversus eam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et cucurrit unus ad ostia pomarii, et aperuit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cum ergo audissent clamorem famuli domus in pomario, irruerunt per posticum ut viderent quidnam esset.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Postquam autem senes locuti sunt, erubuerunt servi vehementer, quia numquam dictus fuerat sermo hujuscemodi de Susanna. Et facta est dies crastina.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Cumque venisset populus ad Joakim virum ejus, venerunt et duo presbyteri, pleni iniqua cogitatione adversus Susannam ut interficerent eam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et dixerunt coram populo : Mittite ad Susannam filiam Helciæ uxorem Joakim. Et statim miserunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et venit cum parentibus, et filiis, et universis cognatis suis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Porro Susanna erat delicata nimis, et pulchra specie.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>At iniqui illi jusserunt ut discooperiretur (erat enim cooperta), ut vel sic satiarentur decore ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Flebant igitur sui, et omnes qui noverant eam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Consurgentes autem duo presbyteri in medio populi, posuerunt manus suas super caput ejus.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Quæ flens suspexit ad cælum : erat enim cor ejus fiduciam habens in Domino.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dixerunt presbyteri : Cum deambularemus in pomario soli, ingressa est hæc cum duabus puellis : et clausit ostia pomarii, et dimisit a se puellas.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Venitque ad eam adolescens, qui erat absconditus, et concubuit cum ea.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Porro nos cum essemus in angulo pomarii, videntes iniquitatem, cucurrimus ad eos, et vidimus eos pariter commisceri.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et illum quidem non quivimus comprehendere, quia fortior nobis erat, et apertis ostiis exilivit :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>hanc autem cum apprehendissemus, interrogavimus, quisnam esset adolescens, et noluit indicare nobis : hujus rei testes sumus.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Credidit eis multitudo quasi senibus et judicibus populi, et condemnaverunt eam ad mortem.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Exclamavit autem voce magna Susanna, et dixit : Deus æterne, qui absconditorum es cognitor, qui nosti omnia antequam fiant,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>tu scis quoniam falsum testimonium tulerunt contra me : et ecce morior, cum nihil horum fecerim, quæ isti malitiose composuerunt adversum me.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Exaudivit autem Dominus vocem ejus.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Cumque duceretur ad mortem, suscitavit Dominus spiritum sanctum pueri junioris, cujus nomen Daniel :</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>et exclamavit voce magna : Mundus ego sum a sanguine hujus.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Et conversus omnis populus ad eum, dixit : Quis est iste sermo, quem tu locutus es ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Qui cum staret in medio eorum, ait : Sic fatui filii Israël, non judicantes, neque quod verum est cognoscentes, condemnastis filiam Israël ?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>revertimini ad judicium, quia falsum testimonium locuti sunt adversus eam.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Reversus est ergo populus cum festinatione, et dixerunt ei senes : Veni, et sede in medio nostrum, et indica nobis : quia tibi Deus dedit honorem senectutis.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Et dixit ad eos Daniel : Separate illos ab invicem procul, et dijudicabo eos.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Cum ergo divisi essent alter ab altero, vocavit unum de eis, et dixit ad eum : Inveterate dierum malorum, nunc venerunt peccata tua, quæ operabaris prius :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>judicans judicia injusta, innocentes opprimens, et dimittens noxios, dicente Domino : Innocentem et justum non interficies.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Nunc ergo, si vidisti eam, dic sub qua arbore videris eos colloquentes sibi. Qui ait : Sub schino.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Dixit autem Daniel : Recte mentitus es in caput tuum : ecce enim angelus Dei, accepta sententia ab eo, scindet te medium.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Et, amoto eo, jussit venire alium, et dixit ei : Semen Chanaan, et non Juda, species decepit te, et concupiscentia subvertit cor tuum :</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>sic faciebatis filiabus Israël, et illæ timentes loquebantur vobis : sed filia Juda non sustinuit iniquitatem vestram.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Nunc ergo, dic mihi sub qua arbore comprehenderis eos loquentes sibi. Qui ait : Sub prino.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Dixit autem ei Daniel : Recte mentitus es et tu in caput tuum : manet enim angelus Domini, gladium habens, ut secet te medium, et interficiat vos.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Exclamavit itaque omnis cœtus voce magna, et benedixerunt Deum, qui salvat sperantes in se.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Et consurrexerunt adversus duos presbyteros (convicerat enim eos Daniel ex ore suo falsum dixisse testimonium), feceruntque eis sicut male egerant adversus proximum,</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>ut facerent secundum legem Moysi. Et interfecerunt eos, et salvatus est sanguis innoxius in die illa.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Helcias autem et uxor ejus laudaverunt Deum pro filia sua Susanna cum Joakim marito ejus, et cognatis omnibus, quia non esset inventa in ea res turpis.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Daniel autem factus est magnus in conspectu populi a die illa, et deinceps.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Et rex Astyages appositus est ad patres suos, et suscepit Cyrus Perses regnum ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DAN/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Daniel 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DAN/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Daniel 14</span></span><svg viewB \"],\"OutletBoundary\"]\n13:I[97367,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"ViewportBoundary\"]\n15:I[97367,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"MetadataBoundary\"]\nb:[\"$\",\"script\",\"script-1\",{\"src\":\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\",\"async\":true,\"nonce\":\"$undefined\"}]\nc:[\"$\",\"$L11\",null,{\"children\":[\"$\",\"$7\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@12\"}]}]\ne:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L15\",null,{\"children\":[\"$\",\"$7\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L16\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n10:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\nd:C\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7f4ee\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Daniel 13 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"DAN.13\",{\"bookId\":32,\"usfm\":\"DAN\",\"bookName\":\"Daniel\",\"drName\":\"Daniel\",\"chapter\":13,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"Now there was a man that dwelt in Babylon, and his name was Joakim:\"},{\"verse\":2,\"text\":\"And he took a wife, whose name was Susanna, the daughter of Helcias, a very beautiful woman, and one that feared God.\"},{\"verse\":3,\"text\":\"For her parents being just, had instructed their daughter according to the law of Moses.\"},{\"verse\":4,\"text\":\"Now Joakim was very rich, and had an orchard near his house: and the Jews resorted to him, because he was the most honourable of them all.\"},{\"verse\":5,\"text\":\"And there were two of the ancients of the people appointed judges that year, of whom the Lord said: That iniquity came out from Babylon, from the ancient judges, that seemed to govern the people.\"},{\"verse\":6,\"text\":\"These men frequented the house of Joakim, and all that had any matters of judgment came to them.\"},{\"verse\":7,\"text\":\"And when the people departed away at noon, Susanna went in, and walked in her husband’s orchard.\"},{\"verse\":8,\"text\":\"And the old men saw her going in every day, and walking: and they were inflamed with lust towards her:\"},{\"verse\":9,\"text\":\"And they perverted their own mind, and turned away their eyes, that they might not look unto heaven, nor remember just judgments.\"},{\"verse\":10,\"text\":\"So they were both wounded with the love of her, yet they did not make known their grief one to the other.\"},{\"verse\":11,\"text\":\"For they were ashamed to declare to one another their lust, being desirous to have to do with her:\"},{\"verse\":12,\"text\":\"And they watched carefully every day to see her. And one said to the other:\"},{\"verse\":13,\"text\":\"Let us now go home, for it is dinner time. So going out, they departed one from another.\"},{\"verse\":14,\"text\":\"And turning back again, they came both to the same place: and asking one another the cause, they acknowledged their lust: and then they agreed together upon a time, when they might find her alone.\"},{\"verse\":15,\"text\":\"And it fell out, as they watched a fit day, she went in on a time, as yesterday and the day before, with two maids only, and was desirous to wash herself in the orchard: for it was hot weather.\"},{\"verse\":16,\"text\":\"And there was nobody there, but the two old men that had hid themselves, and were beholding her.\"},{\"verse\":17,\"text\":\"So she said to the maids: Bring me oil, and washing balls, and shut the doors of the orchard, that I may wash me.\"},{\"verse\":18,\"text\":\"And they did as she bade them: and they shut the doors of the orchard, and went out by a back door to fetch what she had commanded them, and they knew not that the elders were hid within.\"},{\"verse\":19,\"text\":\"Now when the maids were gone forth, the two elders arose, and ran to her, and said:\"},{\"verse\":20,\"text\":\"Behold the doors of the orchard are shut, and nobody seeth us, and we are in love with thee: wherefore consent to us, and lie with us.\"},{\"verse\":21,\"text\":\"But if thou wilt not, we will bear witness against thee, that a young man was with thee, and therefore thou didst send away thy maids from thee.\"},{\"verse\":22,\"text\":\"Susanna sighed, and said: I am straitened on every side: for if I do this thing, it is death to me: and if I do it not, I shall not escape your hands.\"},{\"verse\":23,\"text\":\"But it is better for me to fall into your hands without doing it, than to sin in the sight of the Lord.\"},{\"verse\":24,\"text\":\"With that Susanna cried out with a loud voice: and the elders also cried out against her.\"},{\"verse\":25,\"text\":\"And one of them ran to the door of the orchard, and opened it.\"},{\"verse\":26,\"text\":\"So when the servants of the house heard the cry in the orchard, they rushed in by the back door, to see what was the matter.\"},{\"verse\":27,\"text\":\"But after the old men had spoken, the servants were greatly ashamed: for never had there been any such word said of Susanna. And on the next day,\"},{\"verse\":28,\"text\":\"When the people were come to Joakim, her husband, the two elders also came full of wicked device against Susanna, to put her to death.\"},{\"verse\":29,\"text\":\"And they said before the people: Send to Susanna, daughter of Helcias, the wife of Joakim. And presently they sent.\"},{\"verse\":30,\"text\":\"And she came with her parents, and children and all her kindred.\"},{\"verse\":31,\"text\":\"Now Susanna was exceeding delicate, and beautiful to behold.\"},{\"verse\":32,\"text\":\"But those wicked men commanded that her face should be uncovered, (for she was covered) that so at least they might be satisfied with her beauty.\"},{\"verse\":33,\"text\":\"Therefore her friends, and all her acquaintance wept.\"},{\"verse\":34,\"text\":\"But the two elders rising up in the midst of the people, laid their hands upon her head.\"},{\"verse\":35,\"text\":\"And she weeping, looked up to heaven, for her heart had confidence in the Lord.\"},{\"verse\":36,\"text\":\"And the elders said: As we walked in the orchard alone, this woman came in with two maids, and shut the doors of the orchard, and sent away the maids from her.\"},{\"verse\":37,\"text\":\"Then a young man that was there hid came to her, and lay with her.\"},{\"verse\":38,\"text\":\"But we that were in a corner of the orchard, seeing this wickedness, ran up to them, and we saw them lie together.\"},{\"verse\":39,\"text\":\"And him indeed we could not take, because he was stronger than us, and opening the doors, he leaped out:\"},{\"verse\":40,\"text\":\"But having taken this woman, we asked who the young man was, but she would not tell us: of this thing we are witnesses.\"},{\"verse\":41,\"text\":\"The multitude believed them, as being the elders, and the judges of the people, and they condemned her to death.\"},{\"verse\":42,\"text\":\"Then Susanna cried out with a loud voice, and said: O eternal God, who knowest hidden things, who knowest all things before they come to pass,\"},{\"verse\":43,\"text\":\"Thou knowest that they have borne false witness against me: and behold I must die, whereas I have done none of these things, which these men have maliciously forged against me.\"},{\"verse\":44,\"text\":\"And the Lord heard her voice.\"},{\"verse\":45,\"text\":\"And when she was led to be put to death, the Lord raised up the holy spirit of a young boy, whose name was Daniel:\"},{\"verse\":46,\"text\":\"And he cried out with a loud voice: I am clear from the blood of this woman.\"},{\"verse\":47,\"text\":\"Then all the people turning themselves towards him, said: What meaneth this word that thou hast spoken?\"},{\"verse\":48,\"text\":\"But he standing in the midst of them, said: Are ye so foolish, ye children of Israel, that without examination or knowledge of the truth, you have condemned a daughter of Israel?\"},{\"verse\":49,\"text\":\"Return to judgment, for they have borne false witness against her.\"},{\"verse\":50,\"text\":\"So all the people turned again in haste, and the old men said to him: Come, and sit thou down among us, and shew it us: seeing God hath given thee the honour of old age.\"},{\"verse\":51,\"text\":\"And Daniel said to the people: Separate these two far from one another, and I will examine them.\"},{\"verse\":52,\"text\":\"So when they were put asunder one from the other, he called one of them, and said to him: O thou that art grown old in evil days, now are thy sins come out, which thou hast committed before:\"},{\"verse\":53,\"text\":\"In judging unjust judgments, oppressing the innocent, and letting the guilty to go free, whereas the Lord saith: The innocent and the just thou shalt not kill.\"},{\"verse\":54,\"text\":\"Now then if thou sawest her, tell me under what tree thou sawest them conversing together: He said: Under a mastic tree.\"},{\"verse\":55,\"text\":\"And Daniel said: Well hast thou lied against thy own head: for behold the angel of God having received the sentence of him, shall cut thee in two.\"},{\"verse\":56,\"text\":\"And having put him aside, he commanded that the other should come, and he said to him: O thou seed of Chanaan, and not of Juda, beauty hath deceived thee, and lust hath perverted thy heart:\"},{\"verse\":57,\"text\":\"Thus did you do to the daughters of Israel, and they for fear conversed with you: but a daughter of Juda would not abide your wickedness.\"},{\"verse\":58,\"text\":\"Now, therefore, tell me, under what tree didst thou take them conversing together. And he answered: Under a holm tree.\"},{\"verse\":59,\"text\":\"And Daniel said to him: Well hast thou also lied against thy own head: for the angel of the Lord waiteth with a sword to cut thee in two, and to destroy you.\"},{\"verse\":60,\"text\":\"With that all the assembly cried out with a loud voice, and they blessed God, who saveth them that trust in him.\"},{\"verse\":61,\"text\":\"And they rose up against the two elders, (for Daniel had convicted them of false witness by their own mouth) and they did to them as they had maliciously dealt against their neighbour,\"},{\"verse\":62,\"text\":\"To fulfil the law of Moses: and they put them to death, and innocent blood was saved in that day.\"},{\"verse\":63,\"text\":\"But Helcias, and his wife, praised God, for their daughter, Susanna, with Joakim, her husband, and all her kindred, because there was no dishonesty found in her.\"},{\"verse\":64,\"text\":\"And Daniel became great in the sight of the people from that day, and thence forward.\"},{\"verse\":65,\"text\":\"And king Astyages was gathered to his fathers; and Cyrus, the Persian, received his kingdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et erat vir habitans in Babylone, et nomen ejus Joakim :\"},{\"verse\":2,\"text\":\"et accepit uxorem nomine Susannam, filiam Helciæ, pulchram nimis, et timentem Deum :\"},{\"verse\":3,\"text\":\"parentes enim illius, cum essent justi, erudierunt filiam suam secundum legem Moysi.\"},{\"verse\":4,\"text\":\"Erat autem Joakim dives valde, et erat ei pomarium vicinum domui suæ : et ad ipsum confluebant Judæi, eo quod esset honorabilior omnium.\"},{\"verse\":5,\"text\":\"Et constituti sunt de populo duo senes judices in illo anno, de quibus locutus est Dominus : Quia egressa est iniquitas de Babylone a senioribus judicibus, qui videbantur regere populum.\"},{\"verse\":6,\"text\":\"Isti frequentabant domum Joakim, et veniebant ad eos omnes qui habebant judicia.\"},{\"verse\":7,\"text\":\"Cum autem populus revertisset per meridiem, ingrediebatur Susanna, et deambulabat in pomario viri sui.\"},{\"verse\":8,\"text\":\"Et videbant eam senes quotidie ingredientem et deambulantem, et exarserunt in concupiscentiam ejus :\"},{\"verse\":9,\"text\":\"et everterunt sensum suum, et declinaverunt oculos suos ut non viderent cælum, neque recordarentur judiciorum justorum.\"},{\"verse\":10,\"text\":\"Erant ergo ambo vulnerati amore ejus, nec indicaverunt sibi vicissim dolorem suum :\"},{\"verse\":11,\"text\":\"erubescebant enim indicare sibi concupiscentiam suam, volentes concumbere cum ea.\"},{\"verse\":12,\"text\":\"Et observabant quotidie sollicitius videre eam. Dixitque alter ad alterum :\"},{\"verse\":13,\"text\":\"Eamus domum, quia hora prandii est. Et egressi, recesserunt a se.\"},{\"verse\":14,\"text\":\"Cumque revertissent, venerunt in unum : et sciscitantes ab invicem causam, confessi sunt concupiscentiam suam : et tunc in communi statuerunt tempus quando eam possent invenire solam.\"},{\"verse\":15,\"text\":\"Factum est autem, cum observarent diem aptum, ingressa est aliquando sicut heri et nudiustertius, cum duabus solis puellis, voluitque lavari in pomario : æstus quippe erat :\"},{\"verse\":16,\"text\":\"et non erat ibi quisquam, præter duos senes absconditos, et contemplantes eam.\"},{\"verse\":17,\"text\":\"Dixit ergo puellis : Afferte mihi oleum, et smigmata, et ostia pomarii claudite, ut laver.\"},{\"verse\":18,\"text\":\"Et fecerunt sicut præceperat : clauseruntque ostia pomarii, et egressæ sunt per posticum ut afferrent quæ jusserat ; nesciebantque senes intus esse absconditos.\"},{\"verse\":19,\"text\":\"Cum autem egressæ essent puellæ, surrexerunt duo senes, et accurrerunt ad eam, et dixerunt :\"},{\"verse\":20,\"text\":\"Ecce ostia pomarii clausa sunt, et nemo nos videt, et nos in concupiscentia tui sumus : quam ob rem assentire nobis, et commiscere nobiscum.\"},{\"verse\":21,\"text\":\"Quod si nolueris, dicemus contra te testimonium, quod fuerit tecum juvenis, et ob hanc causam emiseris puellas a te.\"},{\"verse\":22,\"text\":\"Ingemuit Susanna, et ait : Angustiæ sunt mihi undique : si enim hoc egero, mors mihi est : si autem non egero, non effugiam manus vestras.\"},{\"verse\":23,\"text\":\"Sed melius est mihi absque opere incidere in manus vestras, quam peccare in conspectu Domini.\"},{\"verse\":24,\"text\":\"Et exclamavit voce magna Susanna : exclamaverunt autem et senes adversus eam.\"},{\"verse\":25,\"text\":\"Et cucurrit unus ad ostia pomarii, et aperuit.\"},{\"verse\":26,\"text\":\"Cum ergo audissent clamorem famuli domus in pomario, irruerunt per posticum ut viderent quidnam esset.\"},{\"verse\":27,\"text\":\"Postquam autem senes locuti sunt, erubuerunt servi vehementer, quia numquam dictus fuerat sermo hujuscemodi de Susanna. Et facta est dies crastina.\"},{\"verse\":28,\"text\":\"Cumque venisset populus ad Joakim virum ejus, venerunt et duo presbyteri, pleni iniqua cogitatione adversus Susannam ut interficerent eam.\"},{\"verse\":29,\"text\":\"Et dixerunt coram populo : Mittite ad Susannam filiam Helciæ uxorem Joakim. Et statim miserunt.\"},{\"verse\":30,\"text\":\"Et venit cum parentibus, et filiis, et universis cognatis suis.\"},{\"verse\":31,\"text\":\"Porro Susanna erat delicata nimis, et pulchra specie.\"},{\"verse\":32,\"text\":\"At iniqui illi jusserunt ut discooperiretur (erat enim cooperta), ut vel sic satiarentur decore ejus.\"},{\"verse\":33,\"text\":\"Flebant igitur sui, et omnes qui noverant eam.\"},{\"verse\":34,\"text\":\"Consurgentes autem duo presbyteri in medio populi, posuerunt manus suas super caput ejus.\"},{\"verse\":35,\"text\":\"Quæ flens suspexit ad cælum : erat enim cor ejus fiduciam habens in Domino.\"},{\"verse\":36,\"text\":\"Et dixerunt presbyteri : Cum deambularemus in pomario soli, ingressa est hæc cum duabus puellis : et clausit ostia pomarii, et dimisit a se puellas.\"},{\"verse\":37,\"text\":\"Venitque ad eam adolescens, qui erat absconditus, et concubuit cum ea.\"},{\"verse\":38,\"text\":\"Porro nos cum essemus in angulo pomarii, videntes iniquitatem, cucurrimus ad eos, et vidimus eos pariter commisceri.\"},{\"verse\":39,\"text\":\"Et illum quidem non quivimus comprehendere, quia fortior nobis erat, et apertis ostiis exilivit :\"},{\"verse\":40,\"text\":\"hanc autem cum apprehendissemus, interrogavimus, quisnam esset adolescens, et noluit indicare nobis : hujus rei testes sumus.\"},{\"verse\":41,\"text\":\"Credidit eis multitudo quasi senibus et judicibus populi, et condemnaverunt eam ad mortem.\"},{\"verse\":42,\"text\":\"Exclamavit autem voce magna Susanna, et dixit : Deus æterne, qui absconditorum es cognitor, qui nosti omnia antequam fiant,\"},{\"verse\":43,\"text\":\"tu scis quoniam falsum testimonium tulerunt contra me : et ecce morior, cum nihil horum fecerim, quæ isti malitiose composuerunt adversum me.\"},{\"verse\":44,\"text\":\"Exaudivit autem Dominus vocem ejus.\"},{\"verse\":45,\"text\":\"Cumque duceretur ad mortem, suscitavit Dominus spiritum sanctum pueri junioris, cujus nomen Daniel :\"},{\"verse\":46,\"text\":\"et exclamavit voce magna : Mundus ego sum a sanguine hujus.\"},{\"verse\":47,\"text\":\"Et conversus omnis populus ad eum, dixit : Quis est iste sermo, quem tu locutus es ?\"},{\"verse\":48,\"text\":\"Qui cum staret in medio eorum, ait : Sic fatui filii Israël, non judicantes, neque quod verum est cognoscentes, condemnastis filiam Israël ?\"},{\"verse\":49,\"text\":\"revertimini ad judicium, quia falsum testimonium locuti sunt adversus eam.\"},{\"verse\":50,\"text\":\"Reversus est ergo populus cum festinatione, et dixerunt ei senes : Veni, et sede in medio nostrum, et indica nobis : quia tibi Deus dedit honorem senectutis.\"},{\"verse\":51,\"text\":\"Et dixit ad eos Daniel : Separate illos ab invicem procul, et dijudicabo eos.\"},{\"verse\":52,\"text\":\"Cum ergo divisi essent alter ab altero, vocavit unum de eis, et dixit ad eum : Inveterate dierum malorum, nunc venerunt peccata tua, quæ operabaris prius :\"},{\"verse\":53,\"text\":\"judicans judicia injusta, innocentes opprimens, et dimittens noxios, dicente Domino : Innocentem et justum non interficies.\"},{\"verse\":54,\"text\":\"Nunc ergo, si vidisti eam, dic sub qua arbore videris eos colloquentes sibi. Qui ait : Sub schino.\"},{\"verse\":55,\"text\":\"Dixit autem Daniel : Recte mentitus es in caput tuum : ecce enim angelus Dei, accepta sententia ab eo, scindet te medium.\"},{\"verse\":56,\"text\":\"Et, amoto eo, jussit venire alium, et dixit ei : Semen Chanaan, et non Juda, species decepit te, et concupiscentia subvertit cor tuum :\"},{\"verse\":57,\"text\":\"sic faciebatis filiabus Israël, et illæ timentes loquebantur vobis : sed filia Juda non sustinuit iniquitatem vestram.\"},{\"verse\":58,\"text\":\"Nunc ergo, dic mihi sub qua arbore comprehenderis eos loquentes sibi. Qui ait : Sub prino.\"},{\"verse\":59,\"text\":\"Dixit autem ei Daniel : Recte mentitus es et tu in caput tuum : manet enim angelus Domini, gladium habens, ut secet te medium, et interficiat vos.\"},{\"verse\":60,\"text\":\"Exclamavit itaque omnis cœtus voce magna, et benedixerunt Deum, qui salvat sperantes in se.\"},{\"verse\":61,\"text\":\"Et consurrexerunt adversus duos presbyteros (convicerat enim eos Daniel ex ore suo falsum dixisse testimonium), feceruntque eis sicut male egerant adversus proximum,\"},{\"verse\":62,\"text\":\"ut facerent secundum legem Moysi. Et interfecerunt eos, et salvatus est sanguis innoxius in die illa.\"},{\"verse\":63,\"text\":\"Helcias autem et uxor ejus laudaverunt Deum pro filia sua Susanna cum Joakim marito ejus, et cognatis omnibus, quia non esset inventa in ea res turpis.\"},{\"verse\":64,\"text\":\"Daniel autem factus est magnus in conspectu populi a die illa, et deinceps.\"},{\"verse\":65,\"text\":\"Et rex Astyages appositus est ad patres suos, et suscepit Cyrus Perses regnum ejus.\"}],\"summary\":\"The history of Susanna and the two elders.\",\"intro\":null,\"prev\":{\"usfm\":\"DAN\",\"chapter\":12,\"label\":\"Daniel 12\"},\"next\":{\"usfm\":\"DAN\",\"chapter\":14,\"label\":\"Daniel 14\"}}]]\n"])</script></body></html>
