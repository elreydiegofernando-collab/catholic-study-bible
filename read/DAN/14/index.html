<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Daniel 14 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Daniel<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/DAN/">About <!-- -->Daniel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The history of Bel, and of the great serpent worshipped by the Babylonians.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Daniel was the king’s guest, and was honoured above all his friends.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Now the Babylonians had an idol called Bel: and there was spent upon him every day twelve great measures of fine flour, and forty sheep, and six vessels of wine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The king also worshipped him, and went every day to adore him: but Daniel adored his God. And the king said to him: Why dost thou not adore Bel?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he answered, and said to him: Because I do not worship idols made with hands, but the living God, that created heaven and earth, and hath power over all flesh.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the king said to him: Doth not Bel seem to thee to be a living god? Seest thou not how much he eateth and drinketh every day?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then Daniel smiled, and said: O king, be not deceived: for this is but clay within, and brass without, neither hath he eaten at any time.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the king being angry, called for his priests, and said to them: If you tell me not who it is that eateth up these expenses, you shall die.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But if you can shew that Bel eateth these things, Daniel shall die, because he hath blasphemed against Bel. And Daniel said to the king: Be it done according to thy word.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now the priests of Bel were seventy, besides their wives, and little ones, and children. And the king went with Daniel into the temple of Bel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the priests of Bel said: Behold, we go out: and do thou, O king, set on the meats, and make ready the wine, and shut the door fast, and seal it with thy own ring:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when thou comest in the morning, if thou findest not that Bel hath eaten up all, we will suffer death, or else Daniel, that hath lied against us.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they little regarded it, because they had made under the table a secret entrance, and they always came in by it, and consumed those things.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>So it came to pass after they were gone out, the king set the meats before Bel: and Daniel commanded his servants, and they brought ashes, and he sifted them all over the temple before the king: and going forth, they shut the door, and having sealed it with the king’s ring, they departed.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But the priests went in by night, according to their custom, with their wives, and their children: and they ate and drank up all.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the king arose early in the morning, and Daniel with him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the king said: Are the seals whole, Daniel? And he answered: They are whole, O king.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And as soon as he had opened the door, the king looked upon the table, and cried out with a loud voice: Great art thou, O Bel, and there is not any deceit with thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Daniel laughed: and he held the king, that he should not go in: and he said: Behold the pavement, mark whose footsteps these are.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the king said: I see the footsteps of men, and women, and children. And the king was angry.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Then he took the priests, and their wives, and their children: and they shewed him the private doors by which they came in, and consumed the things that were on the table.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The king, therefore, put them to death, and delivered Bel into the power of Daniel: who destroyed him and his temple.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And there was a great dragon in that place, and the Babylonians worshipped him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the king said to Daniel: Behold, thou canst not say now, that this is not a living god: adore him, therefore.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Daniel said: I adore the Lord, my God: for he is the living God: but that is no living god.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But give me leave, O king, and I will kill this dragon without sword or club. And the king said, I give thee leave.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then Daniel took pitch, and fat, and hair, and boiled them together: and he made lumps, and put them into the dragon’s mouth, and the dragon burst asunder. And he said: Behold him whom you worship.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when the Babylonians had heard this, they took great indignation: and being gathered together against the king, they said: The king is become a Jew. He hath destroyed Bel, he hath killed the dragon, and he hath put the priests to death.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they came to the king, and said: Deliver us Daniel, or else we will destroy thee and thy house.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the king saw that they pressed upon him violently: and being constrained by necessity: he delivered Daniel to them.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And they cast him into the den of lions, and he was there six days.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And in the den there were seven lions, and they had given to them two carcasses every day, and two sheep: but then they were not given unto them, that they might devour Daniel.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Now there was in Judea a prophet called Habacuc, and he had boiled pottage, and had broken bread in a bowl: and was going into the field, to carry it to the reapers.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the angel of the Lord said to Habacuc: Carry the dinner which thou hast into Babylon, to Daniel, who is in the lions’ den.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And Habacuc said: Lord, I never saw Babylon, nor do I know the den.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the angel of the Lord took him by the top of his head, and carried him by the hair of his head, and set him in Babylon, over the den, in the force of his spirit.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And Habacuc cried, saying: O Daniel, thou servant of God, take the dinner that God hath sent thee.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Daniel said, Thou hast remembered me, O God, and thou hast not forsaken them that love thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Daniel arose, and ate. And the angel of the Lord presently set Habacuc again in his own place.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And upon the seventh day the king came to bewail Daniel: and he came to the den, and looked in, and behold Daniel was sitting in the midst of the lions.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And the king cried out with a loud voice, saying: Great art thou, O Lord, the God of Daniel. And he drew him out of the lions’ den.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>But those that had been the cause of his destruction, he cast into the den, and they were devoured in a moment before him.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Then the king said: Let all the inhabitants of the whole earth fear the God of Daniel: for he is the Saviour, working signs, and wonders in the earth: who hath delivered Daniel out of the lions’ den.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem Daniel conviva regis, et honoratus super omnes amicos ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Erat quoque idolum apud Babylonios nomine Bel : et impendebantur in eo per dies singulos similæ artabæ duodecim, et oves quadraginta, vinique amphoræ sex.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Rex quoque colebat eum, et ibat per singulos dies adorare eum : porro Daniel adorabat Deum suum. Dixitque ei rex : Quare non adoras Bel ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui respondens ait ei : Quia non colo idola manufacta, sed viventem Deum, qui creavit cælum, et terram, et habet potestatem omnis carnis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et dixit rex ad eum : Non videtur tibi esse Bel vivens deus ? an non vides quanta comedat et bibat quotidie ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et ait Daniel arridens : Ne erres, rex : iste enim intrinsecus luteus est, et forinsecus æreus, neque comedit aliquando.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et iratus rex vocavit sacerdotes ejus, et ait eis : Nisi dixeritis mihi quis est qui comedat impensas has, moriemini.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si autem ostenderitis quoniam Bel comedat hæc, morietur Daniel, quia blasphemavit in Bel. Et dixit Daniel regi : Fiat juxta verbum tuum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Erant autem sacerdotes Bel septuaginta, exceptis uxoribus, et parvulis, et filiis. Et venit rex cum Daniele in templum Bel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et dixerunt sacerdotes Bel : Ecce nos egredimur foras : et tu, rex, pone escas, et vinum misce, et claude ostium, et signa annulo tuo :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et cum ingressus fueris mane, nisi inveneris omnia comesta a Bel, morte moriemur, vel Daniel qui mentitus est adversum nos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Contemnebant autem, quia fecerant sub mensa absconditum introitum, et per illum ingrediebantur semper, et devorabant ea.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Factum est igitur postquam egressi sunt illi, rex posuit cibos ante Bel : præcepit Daniel pueris suis, et attulerunt cinerem, et cribravit per totum templum coram rege : et egressi clauserunt ostium, et signantes annulo regis abierunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sacerdotes autem ingressi sunt nocte juxta consuetudinem suam, et uxores et filii eorum, et comederunt omnia, et biberunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Surrexit autem rex primo diluculo, et Daniel cum eo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et ait rex : Salvane sunt signacula, Daniel ? Qui respondit : Salva, rex.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Statimque cum aperuisset ostium, intuitus rex mensam, exclamavit voce magna : Magnus es, Bel, et non est apud te dolus quisquam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et risit Daniel, et tenuit regem ne ingrederetur intro : et dixit : Ecce pavimentum : animadverte cujus vestigia sint hæc.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et dixit rex : Video vestigia virorum, et mulierum, et infantium. Et iratus est rex.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tunc apprehendit sacerdotes, et uxores, et filios eorum : et ostenderunt ei abscondita ostiola, per quæ ingrediebantur, et consumebant quæ erant super mensam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Occidit ergo illos rex, et tradidit Bel in potestatem Danielis : qui subvertit eum, et templum ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et erat draco magnus in loco illo, et colebant eum Babylonii.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et dixit rex Danieli : Ecce nunc non potes dicere quia iste non sit deus vivens : adora ergo eum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dixitque Daniel : Dominum Deum meum adoro, quia ipse est Deus vivens : iste autem non est deus vivens.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Tu autem, rex, da mihi potestatem, et interficiam draconem absque gladio et fuste. Et ait rex : Do tibi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tulit ergo Daniel picem, et adipem, et pilos, et coxit pariter : fecitque massas, et dedit in os draconis, et diruptus est draco. Et dixit : Ecce quem colebatis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quod cum audissent Babylonii, indignati sunt vehementer : et congregati adversum regem, dixerunt : Judæus factus est rex : Bel destruxit, draconem interfecit, et sacerdotes occidit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et dixerunt cum venissent ad regem : Trade nobis Danielem, alioquin interficiemus te, et domum tuam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vidit ergo rex quod irruerent in eum vehementer : et necessitate compulsus, tradidit eis Danielem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Qui miserunt eum in lacum leonum, et erat ibi diebus sex.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Porro in lacu erant leones septem, et dabantur eis duo corpora quotidie, et duæ oves : et tunc non data sunt eis, ut devorarent Danielem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Erat autem Habacuc propheta in Judæa, et ipse coxerat pulmentum, et intriverat panes in alveolo : et ibat in campum ut ferret messoribus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dixitque angelus Domini ad Habacuc : Fer prandium quod habes in Babylonem Danieli, qui est in lacu leonum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et dixit Habacuc : Domine, Babylonem non vidi, et lacum nescio.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et apprehendit eum angelus Domini in vertice ejus, et portavit eum capillo capitis sui, posuitque eum in Babylone supra lacum in impetu spiritus sui.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et clamavit Habacuc, dicens : Daniel serve Dei, tolle prandium quod misit tibi Deus.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et ait Daniel : Recordatus es mei, Deus, et non dereliquisti diligentes te.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Surgensque Daniel comedit. Porro angelus Domini restituit Habacuc confestim in loco suo.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Venit ergo rex die septimo ut lugeret Danielem : et venit ad lacum, et introspexit, et ecce Daniel sedens in medio leonum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et exclamavit voce magna rex, dicens : Magnus es, Domine Deus Danielis. Et extraxit eum de lacu leonum.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Porro illos, qui perditionis ejus causa fuerant, intromisit in lacum, et devorati sunt in momento coram eo.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Tunc rex ait : Paveant omnes habitantes in universa terra Deum Danielis : quia ipse est salvator, faciens signa et mirabilia in terra : qui liberavit Danielem de lacu leonum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DAN/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Daniel 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hosea 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->14<!-- --> of <!-- -->14<!-- --> · swipe left or right to turn the page</p></a le\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"DAN.14\",{\"bookId\":32,\"usfm\":\"DAN\",\"bookName\":\"Daniel\",\"drName\":\"Daniel\",\"chapter\":14,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"And Daniel was the king’s guest, and was honoured above all his friends.\"},{\"verse\":2,\"text\":\"Now the Babylonians had an idol called Bel: and there was spent upon him every day twelve great measures of fine flour, and forty sheep, and six vessels of wine.\"},{\"verse\":3,\"text\":\"The king also worshipped him, and went every day to adore him: but Daniel adored his God. And the king said to him: Why dost thou not adore Bel?\"},{\"verse\":4,\"text\":\"And he answered, and said to him: Because I do not worship idols made with hands, but the living God, that created heaven and earth, and hath power over all flesh.\"},{\"verse\":5,\"text\":\"And the king said to him: Doth not Bel seem to thee to be a living god? Seest thou not how much he eateth and drinketh every day?\"},{\"verse\":6,\"text\":\"Then Daniel smiled, and said: O king, be not deceived: for this is but clay within, and brass without, neither hath he eaten at any time.\"},{\"verse\":7,\"text\":\"And the king being angry, called for his priests, and said to them: If you tell me not who it is that eateth up these expenses, you shall die.\"},{\"verse\":8,\"text\":\"But if you can shew that Bel eateth these things, Daniel shall die, because he hath blasphemed against Bel. And Daniel said to the king: Be it done according to thy word.\"},{\"verse\":9,\"text\":\"Now the priests of Bel were seventy, besides their wives, and little ones, and children. And the king went with Daniel into the temple of Bel.\"},{\"verse\":10,\"text\":\"And the priests of Bel said: Behold, we go out: and do thou, O king, set on the meats, and make ready the wine, and shut the door fast, and seal it with thy own ring:\"},{\"verse\":11,\"text\":\"And when thou comest in the morning, if thou findest not that Bel hath eaten up all, we will suffer death, or else Daniel, that hath lied against us.\"},{\"verse\":12,\"text\":\"And they little regarded it, because they had made under the table a secret entrance, and they always came in by it, and consumed those things.\"},{\"verse\":13,\"text\":\"So it came to pass after they were gone out, the king set the meats before Bel: and Daniel commanded his servants, and they brought ashes, and he sifted them all over the temple before the king: and going forth, they shut the door, and having sealed it with the king’s ring, they departed.\"},{\"verse\":14,\"text\":\"But the priests went in by night, according to their custom, with their wives, and their children: and they ate and drank up all.\"},{\"verse\":15,\"text\":\"And the king arose early in the morning, and Daniel with him.\"},{\"verse\":16,\"text\":\"And the king said: Are the seals whole, Daniel? And he answered: They are whole, O king.\"},{\"verse\":17,\"text\":\"And as soon as he had opened the door, the king looked upon the table, and cried out with a loud voice: Great art thou, O Bel, and there is not any deceit with thee.\"},{\"verse\":18,\"text\":\"And Daniel laughed: and he held the king, that he should not go in: and he said: Behold the pavement, mark whose footsteps these are.\"},{\"verse\":19,\"text\":\"And the king said: I see the footsteps of men, and women, and children. And the king was angry.\"},{\"verse\":20,\"text\":\"Then he took the priests, and their wives, and their children: and they shewed him the private doors by which they came in, and consumed the things that were on the table.\"},{\"verse\":21,\"text\":\"The king, therefore, put them to death, and delivered Bel into the power of Daniel: who destroyed him and his temple.\"},{\"verse\":22,\"text\":\"And there was a great dragon in that place, and the Babylonians worshipped him.\"},{\"verse\":23,\"text\":\"And the king said to Daniel: Behold, thou canst not say now, that this is not a living god: adore him, therefore.\"},{\"verse\":24,\"text\":\"And Daniel said: I adore the Lord, my God: for he is the living God: but that is no living god.\"},{\"verse\":25,\"text\":\"But give me leave, O king, and I will kill this dragon without sword or club. And the king said, I give thee leave.\"},{\"verse\":26,\"text\":\"Then Daniel took pitch, and fat, and hair, and boiled them together: and he made lumps, and put them into the dragon’s mouth, and the dragon burst asunder. And he said: Behold him whom you worship.\"},{\"verse\":27,\"text\":\"And when the Babylonians had heard this, they took great indignation: and being gathered together against the king, they said: The king is become a Jew. He hath destroyed Bel, he hath killed the dragon, and he hath put the priests to death.\"},{\"verse\":28,\"text\":\"And they came to the king, and said: Deliver us Daniel, or else we will destroy thee and thy house.\"},{\"verse\":29,\"text\":\"And the king saw that they pressed upon him violently: and being constrained by necessity: he delivered Daniel to them.\"},{\"verse\":30,\"text\":\"And they cast him into the den of lions, and he was there six days.\"},{\"verse\":31,\"text\":\"And in the den there were seven lions, and they had given to them two carcasses every day, and two sheep: but then they were not given unto them, that they might devour Daniel.\"},{\"verse\":32,\"text\":\"Now there was in Judea a prophet called Habacuc, and he had boiled pottage, and had broken bread in a bowl: and was going into the field, to carry it to the reapers.\"},{\"verse\":33,\"text\":\"And the angel of the Lord said to Habacuc: Carry the dinner which thou hast into Babylon, to Daniel, who is in the lions’ den.\"},{\"verse\":34,\"text\":\"And Habacuc said: Lord, I never saw Babylon, nor do I know the den.\"},{\"verse\":35,\"text\":\"And the angel of the Lord took him by the top of his head, and carried him by the hair of his head, and set him in Babylon, over the den, in the force of his spirit.\"},{\"verse\":36,\"text\":\"And Habacuc cried, saying: O Daniel, thou servant of God, take the dinner that God hath sent thee.\"},{\"verse\":37,\"text\":\"And Daniel said, Thou hast remembered me, O God, and thou hast not forsaken them that love thee.\"},{\"verse\":38,\"text\":\"And Daniel arose, and ate. And the angel of the Lord presently set Habacuc again in his own place.\"},{\"verse\":39,\"text\":\"And upon the seventh day the king came to bewail Daniel: and he came to the den, and looked in, and behold Daniel was sitting in the midst of the lions.\"},{\"verse\":40,\"text\":\"And the king cried out with a loud voice, saying: Great art thou, O Lord, the God of Daniel. And he drew him out of the lions’ den.\"},{\"verse\":41,\"text\":\"But those that had been the cause of his destruction, he cast into the den, and they were devoured in a moment before him.\"},{\"verse\":42,\"text\":\"Then the king said: Let all the inhabitants of the whole earth fear the God of Daniel: for he is the Saviour, working signs, and wonders in the earth: who hath delivered Daniel out of the lions’ den.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem Daniel conviva regis, et honoratus super omnes amicos ejus.\"},{\"verse\":2,\"text\":\"Erat quoque idolum apud Babylonios nomine Bel : et impendebantur in eo per dies singulos similæ artabæ duodecim, et oves quadraginta, vinique amphoræ sex.\"},{\"verse\":3,\"text\":\"Rex quoque colebat eum, et ibat per singulos dies adorare eum : porro Daniel adorabat Deum suum. Dixitque ei rex : Quare non adoras Bel ?\"},{\"verse\":4,\"text\":\"Qui respondens ait ei : Quia non colo idola manufacta, sed viventem Deum, qui creavit cælum, et terram, et habet potestatem omnis carnis.\"},{\"verse\":5,\"text\":\"Et dixit rex ad eum : Non videtur tibi esse Bel vivens deus ? an non vides quanta comedat et bibat quotidie ?\"},{\"verse\":6,\"text\":\"Et ait Daniel arridens : Ne erres, rex : iste enim intrinsecus luteus est, et forinsecus æreus, neque comedit aliquando.\"},{\"verse\":7,\"text\":\"Et iratus rex vocavit sacerdotes ejus, et ait eis : Nisi dixeritis mihi quis est qui comedat impensas has, moriemini.\"},{\"verse\":8,\"text\":\"Si autem ostenderitis quoniam Bel comedat hæc, morietur Daniel, quia blasphemavit in Bel. Et dixit Daniel regi : Fiat juxta verbum tuum.\"},{\"verse\":9,\"text\":\"Erant autem sacerdotes Bel septuaginta, exceptis uxoribus, et parvulis, et filiis. Et venit rex cum Daniele in templum Bel.\"},{\"verse\":10,\"text\":\"Et dixerunt sacerdotes Bel : Ecce nos egredimur foras : et tu, rex, pone escas, et vinum misce, et claude ostium, et signa annulo tuo :\"},{\"verse\":11,\"text\":\"et cum ingressus fueris mane, nisi inveneris omnia comesta a Bel, morte moriemur, vel Daniel qui mentitus est adversum nos.\"},{\"verse\":12,\"text\":\"Contemnebant autem, quia fecerant sub mensa absconditum introitum, et per illum ingrediebantur semper, et devorabant ea.\"},{\"verse\":13,\"text\":\"Factum est igitur postquam egressi sunt illi, rex posuit cibos ante Bel : præcepit Daniel pueris suis, et attulerunt cinerem, et cribravit per totum templum coram rege : et egressi clauserunt ostium, et signantes annulo regis abierunt.\"},{\"verse\":14,\"text\":\"Sacerdotes autem ingressi sunt nocte juxta consuetudinem suam, et uxores et filii eorum, et comederunt omnia, et biberunt.\"},{\"verse\":15,\"text\":\"Surrexit autem rex primo diluculo, et Daniel cum eo.\"},{\"verse\":16,\"text\":\"Et ait rex : Salvane sunt signacula, Daniel ? Qui respondit : Salva, rex.\"},{\"verse\":17,\"text\":\"Statimque cum aperuisset ostium, intuitus rex mensam, exclamavit voce magna : Magnus es, Bel, et non est apud te dolus quisquam.\"},{\"verse\":18,\"text\":\"Et risit Daniel, et tenuit regem ne ingrederetur intro : et dixit : Ecce pavimentum : animadverte cujus vestigia sint hæc.\"},{\"verse\":19,\"text\":\"Et dixit rex : Video vestigia virorum, et mulierum, et infantium. Et iratus est rex.\"},{\"verse\":20,\"text\":\"Tunc apprehendit sacerdotes, et uxores, et filios eorum : et ostenderunt ei abscondita ostiola, per quæ ingrediebantur, et consumebant quæ erant super mensam.\"},{\"verse\":21,\"text\":\"Occidit ergo illos rex, et tradidit Bel in potestatem Danielis : qui subvertit eum, et templum ejus.\"},{\"verse\":22,\"text\":\"Et erat draco magnus in loco illo, et colebant eum Babylonii.\"},{\"verse\":23,\"text\":\"Et dixit rex Danieli : Ecce nunc non potes dicere quia iste non sit deus vivens : adora ergo eum.\"},{\"verse\":24,\"text\":\"Dixitque Daniel : Dominum Deum meum adoro, quia ipse est Deus vivens : iste autem non est deus vivens.\"},{\"verse\":25,\"text\":\"Tu autem, rex, da mihi potestatem, et interficiam draconem absque gladio et fuste. Et ait rex : Do tibi.\"},{\"verse\":26,\"text\":\"Tulit ergo Daniel picem, et adipem, et pilos, et coxit pariter : fecitque massas, et dedit in os draconis, et diruptus est draco. Et dixit : Ecce quem colebatis.\"},{\"verse\":27,\"text\":\"Quod cum audissent Babylonii, indignati sunt vehementer : et congregati adversum regem, dixerunt : Judæus factus est rex : Bel destruxit, draconem interfecit, et sacerdotes occidit.\"},{\"verse\":28,\"text\":\"Et dixerunt cum venissent ad regem : Trade nobis Danielem, alioquin interficiemus te, et domum tuam.\"},{\"verse\":29,\"text\":\"Vidit ergo rex quod irruerent in eum vehementer : et necessitate compulsus, tradidit eis Danielem.\"},{\"verse\":30,\"text\":\"Qui miserunt eum in lacum leonum, et erat ibi diebus sex.\"},{\"verse\":31,\"text\":\"Porro in lacu erant leones septem, et dabantur eis duo corpora quotidie, et duæ oves : et tunc non data sunt eis, ut devorarent Danielem.\"},{\"verse\":32,\"text\":\"Erat autem Habacuc propheta in Judæa, et ipse coxerat pulmentum, et intriverat panes in alveolo : et ibat in campum ut ferret messoribus.\"},{\"verse\":33,\"text\":\"Dixitque angelus Domini ad Habacuc : Fer prandium quod habes in Babylonem Danieli, qui est in lacu leonum.\"},{\"verse\":34,\"text\":\"Et dixit Habacuc : Domine, Babylonem non vidi, et lacum nescio.\"},{\"verse\":35,\"text\":\"Et apprehendit eum angelus Domini in vertice ejus, et portavit eum capillo capitis sui, posuitque eum in Babylone supra lacum in impetu spiritus sui.\"},{\"verse\":36,\"text\":\"Et clamavit Habacuc, dicens : Daniel serve Dei, tolle prandium quod misit tibi Deus.\"},{\"verse\":37,\"text\":\"Et ait Daniel : Recordatus es mei, Deus, et non dereliquisti diligentes te.\"},{\"verse\":38,\"text\":\"Surgensque Daniel comedit. Porro angelus Domini restituit Habacuc confestim in loco suo.\"},{\"verse\":39,\"text\":\"Venit ergo rex die septimo ut lugeret Danielem : et venit ad lacum, et introspexit, et ecce Daniel sedens in medio leonum.\"},{\"verse\":40,\"text\":\"Et exclamavit voce magna rex, dicens : Magnus es, Domine Deus Danielis. Et extraxit eum de lacu leonum.\"},{\"verse\":41,\"text\":\"Porro illos, qui perditionis ejus causa fuerant, intromisit in lacum, et devorati sunt in momento coram eo.\"},{\"verse\":42,\"text\":\"Tunc rex ait : Paveant omnes habitantes in universa terra Deum Danielis : quia ipse est salvator, faciens signa et mirabilia in terra : qui liberavit Danielem de lacu leonum.\"}],\"summary\":\"The history of Bel, and of the great serpent worshipped by the Babylonians.\",\"intro\":null,\"prev\":{\"usfm\":\"DAN\",\"chapter\":13,\"label\":\"Daniel 13\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":1,\"label\":\"Hosea 1\"}}]]\n"])</script></body></html>
