1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Daniel<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/DAN/">About <!-- -->Daniel</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Daniel’s vision of the ram and the he goat interpreted by the angel Gabriel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In the third year of the reign of king Baltasar, a vision appeared to me. I, Daniel, after what I had seen in the beginning,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Saw in my vision when I was in the castle of Susa, which is in the province of Elam: and I saw in the vision that I was over the gate of Ulai.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I lifted up my eyes, and saw: and behold a ram stood before the water, having two high horns, and one higher than the other, and growing up. Afterward</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I saw the ram pushing with his horns against the west, and against the north, and against the south: and no beasts could withstand him, nor be delivered out of his hand: and he did according to his own will, and became great.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I understood: and behold a he goat came from the west on the face of the whole earth, and he touched not the ground, and the he goat had a notable horn between his eyes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he went up to the ram that had the horns, which I had seen standing before the gate, and he ran towards him in the force of his strength.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when he was come near the ram, he was enraged against him, and struck the ram: and broke his two horns, and the ram could not withstand him: and when he had cast him down on the ground, he stamped upon him, and none could deliver the ram out of his hand.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the he goat became exceeding great: and when he was grown, the great horn was broken, and there came up four horns under it towards the four winds of heaven.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And out of one of them came forth a little horn: and it became great against the south, and against the east, and against the strength.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And it was magnified even unto the strength of heaven: and it threw down of the strength, and of the stars, and trod upon them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And it was magnified even to the prince of the strength: and it took away from him the continual sacrifice, and cast down the place of his sanctuary.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And strength was given him against the continual sacrifice, because of sins: and truth shall be cast down on the ground, and he shall do and shall prosper.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I heard one of the saints speaking, and one saint said to another I know not to whom, that was speaking: How long shall be the vision, concerning the continual sacrifice, and the sin of the desolation that is made: and the sanctuary, and the strength be trodden under foot?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he said to him: Unto evening and morning two thousand three hundred days: and the sanctuary shall be cleansed.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it came to pass when I, Daniel, saw the vision, and sought the meaning, that behold there stood before me as it were the appearance of a man.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And I heard the voice of a man between Ulai: and he called, and said: Gabriel, make this man to understand the vision.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he came, and stood near where I stood: and when he was come, I fell on my face, trembling, and he said to me: Understand, O son of man, for in the time of the end the vision shall be fulfilled.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when he spoke to me, I fell flat on the ground: and he touched me, and set me upright.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he said to me: I will shew thee what things are to come to pass in the end of the malediction: for the time hath its end.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The ram, which thou sawest with horns, is the king of the Medes and Persians.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the he goat, is the king of the Greeks, and the great horn that was between his eyes, the same is the first king.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But whereas when that was broken, there arose up four for it, four kings shall rise up of his nation, but not with his strength.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And after their reign, when iniquities shall be grown up, there shall arise a king of a shameless face, and understanding dark sentences.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And his power shall be strengthened, but not by his own force: and he shall lay all things waste, and shall prosper, and do more than can be believed. And he shall destroy the mighty, and the people of the saints,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>According to his will, and craft shall be successful in his hand: and his heart shall be puffed up, and in the abundance of all things he shall kill many: and he shall rise up against the prince of princes, and shall be broken without hand.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the vision of the evening and the morning, which was told, is true: thou, therefore, seal up the vision, because it shall come to pass after many days.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And I, Daniel, languished, and was sick for some days: and when I was risen up, I did the king’s business, and I was astonished at the vision, and there was none that could interpret it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Anno tertio regni Baltassar regis, visio apparuit mihi. Ego Daniel, post id quod videram in principio,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>vidi in visione mea, cum essem in Susis castro, quod est in Ælam regione : vidi autem in visione esse me super portam Ulai.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et levavi oculus meos, et vidi : et ecce aries unus stabat ante paludem, habens cornua excelsa, et unum excelsius altero atque succrescens. Postea</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>vidi arietem cornibus ventilantem contra occidentem, et contra aquilonem, et contra meridiem, et omnes bestiæ non poterant resistere ei, neque liberari de manu ejus : fecitque secundum voluntatem suam, et magnificatus est.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ego intelligebam : ecce autem hircus caprarum veniebat ab occidente super faciem totius terræ, et non tangebat terram : porro hircus habebat cornu insigne inter oculos suos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et venit usque ad arietem illum cornutum, quem videram stantem ante portam, et cucurrit ad eum in impetu fortitudinis suæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cumque appropinquasset prope arietem, efferatus est in eum, et percussit arietem : et comminuit duo cornua ejus, et non poterat aries resistere ei : cumque eum misisset in terram, conculcavit, et nemo quibat liberare arietem de manu ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Hircus autem caprarum magnus factus est nimis : cumque crevisset, fractum est cornu magnum, et orta sunt quatuor cornua subter illud per quatuor ventos cæli.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>De uno autem ex eis egressum est cornu unum modicum : et factum est grande contra meridiem, et contra orientem, et contra fortitudinem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et magnificatum est usque ad fortitudinem cæli : et dejecit de fortitudine, et de stellis, et conculcavit eas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et usque ad principem fortitudinis magnificatum est : et ab eo tulit juge sacrificium, et dejecit locum sanctificationis ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Robur autem datum est ei contra juge sacrificium propter peccata : et prosternetur veritas in terra, et faciet, et prosperabitur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et audivi unum de sanctis loquentem : et dixit unus sanctus alteri nescio cui loquenti : Usquequo visio, et juge sacrificium, et peccatum desolationis quæ facta est : et sanctuarium, et fortitudo conculcabitur ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et dixit ei : Usque ad vesperam et mane, dies duo millia trecenti : et mundabitur sanctuarium.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Factum est autem cum viderem ego Daniel visionem, et quærerem intelligentiam : ecce stetit in conspectu meo quasi species viri.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et audivi vocem viri inter Ulai : et clamavit, et ait : Gabriel, fac intelligere istam visionem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et venit, et stetit juxta ubi ego stabam : cumque venisset, pavens corrui in faciem meam : et ait ad me : Intellige, fili hominis, quoniam in tempore finis complebitur visio.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cumque loqueretur ad me, collapsus sum pronus in terram : et tetigit me, et statuit me in gradu meo,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>dixitque mihi : Ego ostendam tibi quæ futura sunt in novissimo maledictionis : quoniam habet tempus finem suum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Aries, quem vidisti habere cornua, rex Medorum est atque Persarum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Porro hircus caprarum, rex Græcorum est ; et cornu grande, quod erat inter oculos ejus, ipse est rex primus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod autem fracto illo surrexerunt quatuor pro eo : quatuor reges de gente ejus consurgent, sed non in fortitudine ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et post regnum eorum, cum creverint iniquitates, consurget rex impudens facie, et intelligens propositiones ;</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et roborabitur fortitudo ejus, sed non in viribus suis : et supra quam credi potest, universa vastabit, et prosperabitur, et faciet. Et interficiet robustos, et populum sanctorum</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>secundum voluntatem suam, et dirigetur dolus in manu ejus : et cor suum magnificabit, et in copia rerum omnium occidet plurimos : et contra principem principum consurget, et sine manu conteretur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et visio vespere et mane, quæ dicta est, vera est : tu ergo visionem signa, quia post multos dies erit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et ego Daniel langui, et ægrotavi per dies : cumque surrexissem, faciebam opera regis, et stupebam ad visionem, et non erat qui interpretaretur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/DAN/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Daniel 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 acti }],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"DAN.8\",{\"bookId\":32,\"usfm\":\"DAN\",\"bookName\":\"Daniel\",\"drName\":\"Daniel\",\"chapter\":8,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"In the third year of the reign of king Baltasar, a vision appeared to me. I, Daniel, after what I had seen in the beginning,\"},{\"verse\":2,\"text\":\"Saw in my vision when I was in the castle of Susa, which is in the province of Elam: and I saw in the vision that I was over the gate of Ulai.\"},{\"verse\":3,\"text\":\"And I lifted up my eyes, and saw: and behold a ram stood before the water, having two high horns, and one higher than the other, and growing up. Afterward\"},{\"verse\":4,\"text\":\"I saw the ram pushing with his horns against the west, and against the north, and against the south: and no beasts could withstand him, nor be delivered out of his hand: and he did according to his own will, and became great.\"},{\"verse\":5,\"text\":\"And I understood: and behold a he goat came from the west on the face of the whole earth, and he touched not the ground, and the he goat had a notable horn between his eyes.\"},{\"verse\":6,\"text\":\"And he went up to the ram that had the horns, which I had seen standing before the gate, and he ran towards him in the force of his strength.\"},{\"verse\":7,\"text\":\"And when he was come near the ram, he was enraged against him, and struck the ram: and broke his two horns, and the ram could not withstand him: and when he had cast him down on the ground, he stamped upon him, and none could deliver the ram out of his hand.\"},{\"verse\":8,\"text\":\"And the he goat became exceeding great: and when he was grown, the great horn was broken, and there came up four horns under it towards the four winds of heaven.\"},{\"verse\":9,\"text\":\"And out of one of them came forth a little horn: and it became great against the south, and against the east, and against the strength.\"},{\"verse\":10,\"text\":\"And it was magnified even unto the strength of heaven: and it threw down of the strength, and of the stars, and trod upon them.\"},{\"verse\":11,\"text\":\"And it was magnified even to the prince of the strength: and it took away from him the continual sacrifice, and cast down the place of his sanctuary.\"},{\"verse\":12,\"text\":\"And strength was given him against the continual sacrifice, because of sins: and truth shall be cast down on the ground, and he shall do and shall prosper.\"},{\"verse\":13,\"text\":\"And I heard one of the saints speaking, and one saint said to another I know not to whom, that was speaking: How long shall be the vision, concerning the continual sacrifice, and the sin of the desolation that is made: and the sanctuary, and the strength be trodden under foot?\"},{\"verse\":14,\"text\":\"And he said to him: Unto evening and morning two thousand three hundred days: and the sanctuary shall be cleansed.\"},{\"verse\":15,\"text\":\"And it came to pass when I, Daniel, saw the vision, and sought the meaning, that behold there stood before me as it were the appearance of a man.\"},{\"verse\":16,\"text\":\"And I heard the voice of a man between Ulai: and he called, and said: Gabriel, make this man to understand the vision.\"},{\"verse\":17,\"text\":\"And he came, and stood near where I stood: and when he was come, I fell on my face, trembling, and he said to me: Understand, O son of man, for in the time of the end the vision shall be fulfilled.\"},{\"verse\":18,\"text\":\"And when he spoke to me, I fell flat on the ground: and he touched me, and set me upright.\"},{\"verse\":19,\"text\":\"And he said to me: I will shew thee what things are to come to pass in the end of the malediction: for the time hath its end.\"},{\"verse\":20,\"text\":\"The ram, which thou sawest with horns, is the king of the Medes and Persians.\"},{\"verse\":21,\"text\":\"And the he goat, is the king of the Greeks, and the great horn that was between his eyes, the same is the first king.\"},{\"verse\":22,\"text\":\"But whereas when that was broken, there arose up four for it, four kings shall rise up of his nation, but not with his strength.\"},{\"verse\":23,\"text\":\"And after their reign, when iniquities shall be grown up, there shall arise a king of a shameless face, and understanding dark sentences.\"},{\"verse\":24,\"text\":\"And his power shall be strengthened, but not by his own force: and he shall lay all things waste, and shall prosper, and do more than can be believed. And he shall destroy the mighty, and the people of the saints,\"},{\"verse\":25,\"text\":\"According to his will, and craft shall be successful in his hand: and his heart shall be puffed up, and in the abundance of all things he shall kill many: and he shall rise up against the prince of princes, and shall be broken without hand.\"},{\"verse\":26,\"text\":\"And the vision of the evening and the morning, which was told, is true: thou, therefore, seal up the vision, because it shall come to pass after many days.\"},{\"verse\":27,\"text\":\"And I, Daniel, languished, and was sick for some days: and when I was risen up, I did the king’s business, and I was astonished at the vision, and there was none that could interpret it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Anno tertio regni Baltassar regis, visio apparuit mihi. Ego Daniel, post id quod videram in principio,\"},{\"verse\":2,\"text\":\"vidi in visione mea, cum essem in Susis castro, quod est in Ælam regione : vidi autem in visione esse me super portam Ulai.\"},{\"verse\":3,\"text\":\"Et levavi oculus meos, et vidi : et ecce aries unus stabat ante paludem, habens cornua excelsa, et unum excelsius altero atque succrescens. Postea\"},{\"verse\":4,\"text\":\"vidi arietem cornibus ventilantem contra occidentem, et contra aquilonem, et contra meridiem, et omnes bestiæ non poterant resistere ei, neque liberari de manu ejus : fecitque secundum voluntatem suam, et magnificatus est.\"},{\"verse\":5,\"text\":\"Et ego intelligebam : ecce autem hircus caprarum veniebat ab occidente super faciem totius terræ, et non tangebat terram : porro hircus habebat cornu insigne inter oculos suos.\"},{\"verse\":6,\"text\":\"Et venit usque ad arietem illum cornutum, quem videram stantem ante portam, et cucurrit ad eum in impetu fortitudinis suæ.\"},{\"verse\":7,\"text\":\"Cumque appropinquasset prope arietem, efferatus est in eum, et percussit arietem : et comminuit duo cornua ejus, et non poterat aries resistere ei : cumque eum misisset in terram, conculcavit, et nemo quibat liberare arietem de manu ejus.\"},{\"verse\":8,\"text\":\"Hircus autem caprarum magnus factus est nimis : cumque crevisset, fractum est cornu magnum, et orta sunt quatuor cornua subter illud per quatuor ventos cæli.\"},{\"verse\":9,\"text\":\"De uno autem ex eis egressum est cornu unum modicum : et factum est grande contra meridiem, et contra orientem, et contra fortitudinem.\"},{\"verse\":10,\"text\":\"Et magnificatum est usque ad fortitudinem cæli : et dejecit de fortitudine, et de stellis, et conculcavit eas.\"},{\"verse\":11,\"text\":\"Et usque ad principem fortitudinis magnificatum est : et ab eo tulit juge sacrificium, et dejecit locum sanctificationis ejus.\"},{\"verse\":12,\"text\":\"Robur autem datum est ei contra juge sacrificium propter peccata : et prosternetur veritas in terra, et faciet, et prosperabitur.\"},{\"verse\":13,\"text\":\"Et audivi unum de sanctis loquentem : et dixit unus sanctus alteri nescio cui loquenti : Usquequo visio, et juge sacrificium, et peccatum desolationis quæ facta est : et sanctuarium, et fortitudo conculcabitur ?\"},{\"verse\":14,\"text\":\"Et dixit ei : Usque ad vesperam et mane, dies duo millia trecenti : et mundabitur sanctuarium.\"},{\"verse\":15,\"text\":\"Factum est autem cum viderem ego Daniel visionem, et quærerem intelligentiam : ecce stetit in conspectu meo quasi species viri.\"},{\"verse\":16,\"text\":\"Et audivi vocem viri inter Ulai : et clamavit, et ait : Gabriel, fac intelligere istam visionem.\"},{\"verse\":17,\"text\":\"Et venit, et stetit juxta ubi ego stabam : cumque venisset, pavens corrui in faciem meam : et ait ad me : Intellige, fili hominis, quoniam in tempore finis complebitur visio.\"},{\"verse\":18,\"text\":\"Cumque loqueretur ad me, collapsus sum pronus in terram : et tetigit me, et statuit me in gradu meo,\"},{\"verse\":19,\"text\":\"dixitque mihi : Ego ostendam tibi quæ futura sunt in novissimo maledictionis : quoniam habet tempus finem suum.\"},{\"verse\":20,\"text\":\"Aries, quem vidisti habere cornua, rex Medorum est atque Persarum.\"},{\"verse\":21,\"text\":\"Porro hircus caprarum, rex Græcorum est ; et cornu grande, quod erat inter oculos ejus, ipse est rex primus.\"},{\"verse\":22,\"text\":\"Quod autem fracto illo surrexerunt quatuor pro eo : quatuor reges de gente ejus consurgent, sed non in fortitudine ejus.\"},{\"verse\":23,\"text\":\"Et post regnum eorum, cum creverint iniquitates, consurget rex impudens facie, et intelligens propositiones ;\"},{\"verse\":24,\"text\":\"et roborabitur fortitudo ejus, sed non in viribus suis : et supra quam credi potest, universa vastabit, et prosperabitur, et faciet. Et interficiet robustos, et populum sanctorum\"},{\"verse\":25,\"text\":\"secundum voluntatem suam, et dirigetur dolus in manu ejus : et cor suum magnificabit, et in copia rerum omnium occidet plurimos : et contra principem principum consurget, et sine manu conteretur.\"},{\"verse\":26,\"text\":\"Et visio vespere et mane, quæ dicta est, vera est : tu ergo visionem signa, quia post multos dies erit.\"},{\"verse\":27,\"text\":\"Et ego Daniel langui, et ægrotavi per dies : cumque surrexissem, faciebam opera regis, et stupebam ad visionem, et non erat qui interpretaretur.\"}],\"summary\":\"Daniel’s vision of the ram and the he goat interpreted by the angel Gabriel.\",\"intro\":null,\"prev\":{\"usfm\":\"DAN\",\"chapter\":7,\"label\":\"Daniel 7\"},\"next\":{\"usfm\":\"DAN\",\"chapter\":9,\"label\":\"Daniel 9\"}}]]\n"])</script></body></html>
