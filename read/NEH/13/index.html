"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Nehemiah<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Esdras</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Divers abuses are reformed.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And on that day they read in the book of Moses in the hearing of the people: and therein was found written, that the Ammonites and the Moabites should not come in to the church of God for ever:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Because they met not the children of Israel with bread and water: and they hired against them Balaam, to curse them, and our God turned the curse into blessing.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And it came to pass, when they had heard the law, that they separated every stranger from Israel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And over this thing was Eliasib the priest, who was set over the treasury of the house of our God, and was near akin to Tobias.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he made him a great storeroom, where before him they laid up gifts, and frankincense, and vessels, and the tithes of the corn, of the wine, and of the oil, the portions of the Levites, and of the singing men, and of the porters, and the firstfruits of the priests.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But in all this time I was not in Jerusalem, because in the two and thirtieth year of Artaxerxes king of Babylon, I went to the king, and after certain days I asked the king:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I came to Jerusalem, and I understood the evil that Eliasib had done for Tobias, to make him a storehouse in the courts of the house of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And it seemed to me exceeding evil. And I cast forth the vessels of the house of Tobias out of the storehouse.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And I commanded and they cleansed the storehouses: and I brought thither again the vessels of the house of God, the sacrifice, and the frankincense.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And I perceived that the portions of the Levites had not been given them: and that the Levites, and the singing men, and they that ministered were fled away every man to his own country:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I pleaded the matter against the magistrates, and said: Why have we forsaken the house of God? And I gathered them together, and I made them to stand in their places.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And all Juda brought the tithe of the corn, and the wine, and the oil into the storehouses.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And we set over the storehouses Selemias the priest, and Sadoc the scribe, and of the Levites Phadaia, and next to them Hanan the son of Zachur, the son of Mathania: for they were approved as faithful, and to them were committed the portions of their brethren.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Remember me, O my God, for this thing, and wipe not out my kindnesses, which I have done relating to the house of my God and his ceremonies.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In those days I saw in Juda some treading the presses on the sabbath, and carrying sheaves, and lading asses with wine, and grapes, and figs, and all manner of burthens, and bringing them into Jerusalem on the sabbath day. And I charged them that they should sell on a day on which it was lawful to sell.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Some Tyrians also dwelt there, who brought fish, and all manner of wares: and they sold them on the sabbaths to the children of Juda in Jerusalem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And I rebuked the chief men of Juda, and said to them: What is this evil thing that you are doing, profaning the sabbath day:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Did not our fathers do these things, and our God brought all this evil upon us, and upon this city? And you bring more wrath upon Israel by violating the sabbath.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And it came to pass, that when the gates of Jerusalem were at rest on the sabbath day, I spoke: and they shut the gates, and I commanded that they should not open them till after the sabbath: and I set some of my servants at the gates, that none should bring in burthens on the sabbath day.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>So the merchants, and they that sold all kinds of wares, stayed without Jerusalem, once or twice.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I charged them, and I said to them: Why stay you before the wall? if you do so another time, I will lay hands on you. And from that time they came no more on the sabbath.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>I spoke also to the Levites that they should be purified, and should come to keep the gates, and to sanctify the sabbath day: for this also remember me, O my God, and spare me according to the multitude of thy tender mercies.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>In those days also I saw Jews that married wives, women of Azotus, and of Ammon, and of Moab.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And their children spoke half in the speech of Azotus, and could not speak the Jews’ language, but they spoke according to the language of this and that people.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And I chid them, and laid my curse upon them. And I beat some of them, and shaved off their hair, and made them swear by God that they would not give their daughters to their sons, nor take their daughters for their sons, nor for themselves, saying:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Did not Solomon king of Israel sin in this kind of thing: and surely among many nations, there was not a king like him, and he was beloved of his God, and God made him king over all Israel: and yet women of other countries brought even him to sin.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And shall we also be disobedient and do all this great evil to transgress against our God, and marry strange women:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And one of the sons of Joiada the son of Eliasib the high priest, was son in law to Sanaballat the Horonite, and I drove him from me.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Remember them, O Lord my God, that defile the priesthood, and the law of priests and Levites.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>So I separated from them all strangers, and I appointed the courses of the priests and the Levites, every man in his ministry:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And for the offering of wood at times appointed, and for the firstfruits: remember me, O my God, unto good. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In die autem illo, lectum est in volumine Moysi, audiente populo : et inventum est scriptum in eo, quod non debeant introire Ammonites et Moabites in ecclesiam Dei usque in æternum :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>eo quod non occurrerint filiis Israël cum pane et aqua, et conduxerint adversum eos Balaam ad maledicendum eis : et convertit Deus noster maledictionem in benedictionem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Factum est autem, cum audissent legem, separaverunt omnem alienigenam ab Israël.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et super hoc erat Eliasib sacerdos, qui fuerat præpositus in gazophylacio domus Dei nostri, et proximus Tobiæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Fecit ergo sibi gazophylacium grande, et ibi erant ante eum reponentes munera, et thus, et vasa, et decimam frumenti, vini, et olei, partes Levitarum, et cantorum, et janitorum, et primitias sacerdotales.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In omnibus autem his non fui in Jerusalem, quia anno trigesimo secundo Artaxerxis regis Babylonis veni ad regem, et in fine dierum rogavi regem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et veni in Jerusalem, et intellexi malum quod fecerat Eliasib Tobiæ, ut faceret ei thesaurum in vestibulis domus Dei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et malum mihi visum est valde. Et projeci vasa domus Tobiæ foras de gazophylacio :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>præcepique et emundaverunt gazophylacia : et retuli ibi vasa domus Dei, sacrificium, et thus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et cognovi quod partes Levitarum non fuissent datæ, et fugisset unusquisque in regionem suam de Levitis, et cantoribus, et de his qui ministrabant :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et egi causam adversus magistratus, et dixi : Quare dereliquimus domum Dei ? et congregavi eos, et feci stare in stationibus suis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et omnis Juda apportabat decimam frumenti, vini, et olei, in horrea.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et constituimus super horrea Selemiam sacerdotem, et Sadoc scribam, et Phadaiam de Levitis, et juxta eos Hanan filium Zachur, filium Mathaniæ : quoniam fideles comprobati sunt, et ipsis creditæ sunt partes fratrum suorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Memento mei, Deus meus, pro hoc, et ne deleas miserationes meas quas feci in domo Dei mei, et in cæremoniis ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In diebus illis vidi in Juda calcantes torcularia in sabbato, portantes acervos, et onerantes super asinos vinum, et uvas, et ficus, et omne onus, et inferentes in Jerusalem, die sabbati. Et contestatus sum ut in die qua vendere liceret, venderent.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et Tyrii habitaverunt in ea, inferentes pisces, et omnia venalia : et vendebant in sabbatis filiis Juda in Jerusalem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et objurgavi optimates Juda, et dixi eis : Quæ est hæc res mala quam vos facitis, et profanatis diem sabbati ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>numquid non hæc fecerunt patres nostri, et adduxit Deus noster super nos omne malum hoc, et super civitatem hanc ? et vos additis iracundiam super Israël violando sabbatum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Factum est autem, cum quievissent portæ Jerusalem in die sabbati, dixi : et clauserunt januas, et præcepi ut non aperirent eas usque post sabbatum : et de pueris meis constitui super portas, ut nullus inferret onus in die sabbati.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et manserunt negotiatores, et vendentes universa venalia, foris Jerusalem semel et bis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et contestatus sum eos, et dixi eis : Quare manetis ex adverso muri ? si secundo hoc feceritis, manum mittam in vos. Itaque ex tempore illo non venerunt in sabbato.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dixi quoque Levitis ut mundarentur, et venirent ad custodiendas portas, et sanctificandam diem sabbati : et pro hoc ergo memento mei, Deus meus, et parce mihi secundum multitudinem miserationum tuarum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sed et in diebus illis vidi Judæos ducentes uxores Azotidas, Ammonitidas, et Moabitidas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et filii eorum ex media parte loquebantur azotice, et nesciebant loqui judaice, et loquebantur juxta linguam populi et populi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et objurgavi eos, et maledixi. Et cecidi ex eis viros, et decalvavi eos, et adjuravi in Deo ut non darent filias suas filiis eorum, et non acciperent de filiabus eorum filiis suis et sibimetipsis, dicens :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Numquid non in hujuscemodi re peccavit Salomon rex Israël ? et certe in gentibus multis non erat rex similis ei, et dilectus Deo suo erat, et posuit eum Deus regem super omnem Israël : et ipsum ergo duxerunt ad peccatum mulieres alienigenæ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Numquid et nos inobedientes faciemus omne malum grande hoc ut prævaricemur in Deo nostro, et ducamus uxores peregrinas ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>De filiis autem Jojada filii Eliasib sacerdotis magni, gener erat Sanaballat Horonites, quem fugavi a me.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Recordare, Domine Deus meus, adversum eos qui polluunt sacerdotium, jusque sacerdotale et Leviticum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Igitur mundavi eos ab omnibus alienigenis, et constitui ordines sacerdotum et Levitarum, unumquemque in ministerio suo :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et in oblatione lignorum in temporibus constitutis, et in primitivis : memento mei, Deus meus, in bonum. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NEH/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Nehemiah 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right ho text\":\"And he made him a great storeroom, where before him they laid up gifts, and frankincense, and vessels, and the tithes of the corn, of the wine, and of the oil, the portions of the Levites, and of the singing men, and of the porters, and the firstfruits of the priests.\"},{\"verse\":6,\"text\":\"But in all this time I was not in Jerusalem, because in the two and thirtieth year of Artaxerxes king of Babylon, I went to the king, and after certain days I asked the king:\"},{\"verse\":7,\"text\":\"And I came to Jerusalem, and I understood the evil that Eliasib had done for Tobias, to make him a storehouse in the courts of the house of God.\"},{\"verse\":8,\"text\":\"And it seemed to me exceeding evil. And I cast forth the vessels of the house of Tobias out of the storehouse.\"},{\"verse\":9,\"text\":\"And I commanded and they cleansed the storehouses: and I brought thither again the vessels of the house of God, the sacrifice, and the frankincense.\"},{\"verse\":10,\"text\":\"And I perceived that the portions of the Levites had not been given them: and that the Levites, and the singing men, and they that ministered were fled away every man to his own country:\"},{\"verse\":11,\"text\":\"And I pleaded the matter against the magistrates, and said: Why have we forsaken the house of God? And I gathered them together, and I made them to stand in their places.\"},{\"verse\":12,\"text\":\"And all Juda brought the tithe of the corn, and the wine, and the oil into the storehouses.\"},{\"verse\":13,\"text\":\"And we set over the storehouses Selemias the priest, and Sadoc the scribe, and of the Levites Phadaia, and next to them Hanan the son of Zachur, the son of Mathania: for they were approved as faithful, and to them were committed the portions of their brethren.\"},{\"verse\":14,\"text\":\"Remember me, O my God, for this thing, and wipe not out my kindnesses, which I have done relating to the house of my God and his ceremonies.\"},{\"verse\":15,\"text\":\"In those days I saw in Juda some treading the presses on the sabbath, and carrying sheaves, and lading asses with wine, and grapes, and figs, and all manner of burthens, and bringing them into Jerusalem on the sabbath day. And I charged them that they should sell on a day on which it was lawful to sell.\"},{\"verse\":16,\"text\":\"Some Tyrians also dwelt there, who brought fish, and all manner of wares: and they sold them on the sabbaths to the children of Juda in Jerusalem.\"},{\"verse\":17,\"text\":\"And I rebuked the chief men of Juda, and said to them: What is this evil thing that you are doing, profaning the sabbath day:\"},{\"verse\":18,\"text\":\"Did not our fathers do these things, and our God brought all this evil upon us, and upon this city? And you bring more wrath upon Israel by violating the sabbath.\"},{\"verse\":19,\"text\":\"And it came to pass, that when the gates of Jerusalem were at rest on the sabbath day, I spoke: and they shut the gates, and I commanded that they should not open them till after the sabbath: and I set some of my servants at the gates, that none should bring in burthens on the sabbath day.\"},{\"verse\":20,\"text\":\"So the merchants, and they that sold all kinds of wares, stayed without Jerusalem, once or twice.\"},{\"verse\":21,\"text\":\"And I charged them, and I said to them: Why stay you before the wall? if you do so another time, I will lay hands on you. And from that time they came no more on the sabbath.\"},{\"verse\":22,\"text\":\"I spoke also to the Levites that they should be purified, and should come to keep the gates, and to sanctify the sabbath day: for this also remember me, O my God, and spare me according to the multitude of thy tender mercies.\"},{\"verse\":23,\"text\":\"In those days also I saw Jews that married wives, women of Azotus, and of Ammon, and of Moab.\"},{\"verse\":24,\"text\":\"And their children spoke half in the speech of Azotus, and could not speak the Jews’ language, but they spoke according to the language of this and that people.\"},{\"verse\":25,\"text\":\"And I chid them, and laid my curse upon them. And I beat some of them, and shaved off their hair, and made them swear by God that they would not give their daughters to their sons, nor take their daughters for their sons, nor for themselves, saying:\"},{\"verse\":26,\"text\":\"Did not Solomon king of Israel sin in this kind of thing: and surely among many nations, there was not a king like him, and he was beloved of his God, and God made him king over all Israel: and yet women of other countries brought even him to sin.\"},{\"verse\":27,\"text\":\"And shall we also be disobedient and do all this great evil to transgress against our God, and marry strange women:\"},{\"verse\":28,\"text\":\"And one of the sons of Joiada the son of Eliasib the high priest, was son in law to Sanaballat the Horonite, and I drove him from me.\"},{\"verse\":29,\"text\":\"Remember them, O Lord my God, that defile the priesthood, and the law of priests and Levites.\"},{\"verse\":30,\"text\":\"So I separated from them all strangers, and I appointed the courses of the priests and the Levites, every man in his ministry:\"},{\"verse\":31,\"text\":\"And for the offering of wood at times appointed, and for the firstfruits: remember me, O my God, unto good. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"In die autem illo, lectum est in volumine Moysi, audiente populo : et inventum est scriptum in eo, quod non debeant introire Ammonites et Moabites in ecclesiam Dei usque in æternum :\"},{\"verse\":2,\"text\":\"eo quod non occurrerint filiis Israël cum pane et aqua, et conduxerint adversum eos Balaam ad maledicendum eis : et convertit Deus noster maledictionem in benedictionem.\"},{\"verse\":3,\"text\":\"Factum est autem, cum audissent legem, separaverunt omnem alienigenam ab Israël.\"},{\"verse\":4,\"text\":\"Et super hoc erat Eliasib sacerdos, qui fuerat præpositus in gazophylacio domus Dei nostri, et proximus Tobiæ.\"},{\"verse\":5,\"text\":\"Fecit ergo sibi gazophylacium grande, et ibi erant ante eum reponentes munera, et thus, et vasa, et decimam frumenti, vini, et olei, partes Levitarum, et cantorum, et janitorum, et primitias sacerdotales.\"},{\"verse\":6,\"text\":\"In omnibus autem his non fui in Jerusalem, quia anno trigesimo secundo Artaxerxis regis Babylonis veni ad regem, et in fine dierum rogavi regem.\"},{\"verse\":7,\"text\":\"Et veni in Jerusalem, et intellexi malum quod fecerat Eliasib Tobiæ, ut faceret ei thesaurum in vestibulis domus Dei.\"},{\"verse\":8,\"text\":\"Et malum mihi visum est valde. Et projeci vasa domus Tobiæ foras de gazophylacio :\"},{\"verse\":9,\"text\":\"præcepique et emundaverunt gazophylacia : et retuli ibi vasa domus Dei, sacrificium, et thus.\"},{\"verse\":10,\"text\":\"Et cognovi quod partes Levitarum non fuissent datæ, et fugisset unusquisque in regionem suam de Levitis, et cantoribus, et de his qui ministrabant :\"},{\"verse\":11,\"text\":\"et egi causam adversus magistratus, et dixi : Quare dereliquimus domum Dei ? et congregavi eos, et feci stare in stationibus suis.\"},{\"verse\":12,\"text\":\"Et omnis Juda apportabat decimam frumenti, vini, et olei, in horrea.\"},{\"verse\":13,\"text\":\"Et constituimus super horrea Selemiam sacerdotem, et Sadoc scribam, et Phadaiam de Levitis, et juxta eos Hanan filium Zachur, filium Mathaniæ : quoniam fideles comprobati sunt, et ipsis creditæ sunt partes fratrum suorum.\"},{\"verse\":14,\"text\":\"Memento mei, Deus meus, pro hoc, et ne deleas miserationes meas quas feci in domo Dei mei, et in cæremoniis ejus.\"},{\"verse\":15,\"text\":\"In diebus illis vidi in Juda calcantes torcularia in sabbato, portantes acervos, et onerantes super asinos vinum, et uvas, et ficus, et omne onus, et inferentes in Jerusalem, die sabbati. Et contestatus sum ut in die qua vendere liceret, venderent.\"},{\"verse\":16,\"text\":\"Et Tyrii habitaverunt in ea, inferentes pisces, et omnia venalia : et vendebant in sabbatis filiis Juda in Jerusalem.\"},{\"verse\":17,\"text\":\"Et objurgavi optimates Juda, et dixi eis : Quæ est hæc res mala quam vos facitis, et profanatis diem sabbati ?\"},{\"verse\":18,\"text\":\"numquid non hæc fecerunt patres nostri, et adduxit Deus noster super nos omne malum hoc, et super civitatem hanc ? et vos additis iracundiam super Israël violando sabbatum.\"},{\"verse\":19,\"text\":\"Factum est autem, cum quievissent portæ Jerusalem in die sabbati, dixi : et clauserunt januas, et præcepi ut non aperirent eas usque post sabbatum : et de pueris meis constitui super portas, ut nullus inferret onus in die sabbati.\"},{\"verse\":20,\"text\":\"Et manserunt negotiatores, et vendentes universa venalia, foris Jerusalem semel et bis.\"},{\"verse\":21,\"text\":\"Et contestatus sum eos, et dixi eis : Quare manetis ex adverso muri ? si secundo hoc feceritis, manum mittam in vos. Itaque ex tempore illo non venerunt in sabbato.\"},{\"verse\":22,\"text\":\"Dixi quoque Levitis ut mundarentur, et venirent ad custodiendas portas, et sanctificandam diem sabbati : et pro hoc ergo memento mei, Deus meus, et parce mihi secundum multitudinem miserationum tuarum.\"},{\"verse\":23,\"text\":\"Sed et in diebus illis vidi Judæos ducentes uxores Azotidas, Ammonitidas, et Moabitidas.\"},{\"verse\":24,\"text\":\"Et filii eorum ex media parte loquebantur azotice, et nesciebant loqui judaice, et loquebantur juxta linguam populi et populi.\"},{\"verse\":25,\"text\":\"Et objurgavi eos, et maledixi. Et cecidi ex eis viros, et decalvavi eos, et adjuravi in Deo ut non darent filias suas filiis eorum, et non acciperent de filiabus eorum filiis suis et sibimetipsis, dicens :\"},{\"verse\":26,\"text\":\"Numquid non in hujuscemodi re peccavit Salomon rex Israël ? et certe in gentibus multis non erat rex similis ei, et dilectus Deo suo erat, et posuit eum Deus regem super omnem Israël : et ipsum ergo duxerunt ad peccatum mulieres alienigenæ.\"},{\"verse\":27,\"text\":\"Numquid et nos inobedientes faciemus omne malum grande hoc ut prævaricemur in Deo nostro, et ducamus uxores peregrinas ?\"},{\"verse\":28,\"text\":\"De filiis autem Jojada filii Eliasib sacerdotis magni, gener erat Sanaballat Horonites, quem fugavi a me.\"},{\"verse\":29,\"text\":\"Recordare, Domine Deus meus, adversum eos qui polluunt sacerdotium, jusque sacerdotale et Leviticum.\"},{\"verse\":30,\"text\":\"Igitur mundavi eos ab omnibus alienigenis, et constitui ordines sacerdotum et Levitarum, unumquemque in ministerio suo :\"},{\"verse\":31,\"text\":\"et in oblatione lignorum in temporibus constitutis, et in primitivis : memento mei, Deus meus, in bonum. Amen.\"}],\"summary\":\"Divers abuses are reformed.\",\"intro\":null,\"prev\":{\"usfm\":\"NEH\",\"chapter\":12,\"label\":\"Nehemiah 12\"},\"next\":{\"usfm\":\"TOB\",\"chapter\":1,\"label\":\"Tobit 1\"}}]]\n"])</script></body></html>
