-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Nehemiah<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Esdras</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NEH/">About <!-- -->Nehemiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">They begin to build the walls: the names and order of the builders.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Eliasib the high priest arose, and his brethren the priests, and they built the flock gate: they sanctified it, and set up the doors thereof, even unto the tower of a hundred cubits they sanctified it unto the tower of Hananeel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And next to him the men of Jericho built: and next to them built Zachur the son of Amri.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But the fish gate the sons of Asnaa built: they covered it, and set up the doors thereof, and the locks, and the bars. And next to them built Marimuth the son of Urias the son of Accus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And next to him built Mosollam the son of Barachias, the son of Merezebel, and next to them built Sadoc the son of Baana.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And next to them the Thecuites built: but their great men did not put their necks to the work of their Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Joiada the son of Phasea, and Mosollam the son of Besodia built the old gate: they covered it and set up the doors thereof, and the locks, and the bars.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And next to them built Meltias the Gabaonite, and Jadon the Meronathite, the men of Gabaon and Maspha, for the governor that was in the country beyond the river.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And next to him built Eziel the son of Araia the goldsmith: and next to him built Ananias the son of the perfumer: and they left Jerusalem unto the wall of the broad street.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And next to him built Raphaia the son of Hur, lord of the street of Jerusalem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And next to him Jedaia the son of Haromaph over against his own house: and next to him built Hattus the son of Hasebonia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Melchias the son of Herem, and Hasub the son of Phahath Moab, built half the street, and the tower of the furnaces.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And next to him built Sellum the son of Alohes, lord of half the street of Jerusalem, he and his daughters.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the gate of the valley Hanun built, and the inhabitants of Zanoe: they built it, and set up the doors thereof, and the locks, and the bars, and a thousand cubits in the wall unto the gate of the dunghill.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the gate of the dunghill Melchias the son of Rechab built, lord of the street of Bethacharam: he built it, and set up the doors thereof, and the locks, and the bars.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the gate of the fountain, Sellum, the son of Cholhoza, built, lord of the street of Maspha: he built it, and covered it, and set up the doors thereof, and the locks, and the bars, and the walls of the pool of Siloe unto the king’s guard, and unto the steps that go down from the city of David.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>After him built Nehemias the son of Azboc, lord of half the street of Bethsur, as far as over against the sepulchre of David, and to the pool, that was built with great labour, and to the house of the mighty.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>After him built the Levites, Rehum the son of Benni. After him built Hasebias, lord of half the street of Ceila in his own street.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>After him built their brethren Bavai the son of Enadad, lord of half Ceila.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And next to him Aser the son of Josue, lord of Maspha, built another measure, over against the going up of the strong corner.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>After him in the mount Baruch the son of Zachai built another measure, from the corner to the door of the house of Eliasib the high priest.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>After him Merimuth the son of Urias the son of Haccus, built another measure, from the door of the house of Eliasib, to the end of the house of Eliasib.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And after him built the priests, the men of the plains of the Jordan.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>After him built Benjamin and Hasub, over against their own house: and after him built Azarias the son of Maasias the son of Ananias over against his house.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>After him built Bennui the son of Hanadad another measure, from the house of Azarias unto the bending, and unto the corner.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Phalel, the son of Ozi, over against the bending and the tower, which lieth out from the king’s high house, that is, in the court of the prison: after him Phadaia the son of Pharos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the Nathinites dwelt in Ophel, as far as over against the water gate toward the east, and the tower that stood out.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>After him the Thecuites built another measure over against, from the great tower that standeth out unto the wall of the temple.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And upward from the horse gate the priests built, every man over against his house.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>After them built Sadoc the son of Emmer over against his house. And after him built Semaia the son of Sechenias, keeper of the east gate.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>After him built Hanania the son of Selemia, and Hanun the sixth son of Seleph, another measure: after him built Mosollam the son of Barachias over against his treasury. After him Melcias the goldsmith’s son built unto the house of the Nathinites, and of the sellers of small wares, over against the judgment gate, and unto the chamber of the corner.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And within the chamber of the corner of the flock gate, the goldsmiths and the merchants built.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et surrexit Eliasib sacerdos magnus, et fratres ejus sacerdotes, et ædificaverunt portam gregis : ipsi sanctificaverunt eam, et statuerunt valvas ejus, et usque ad turrim centum cubitorum sanctificaverunt eam, usque ad turrim Hananeel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et juxta eum ædificaverunt viri Jericho : et juxta eum ædificavit Zachur filius Amri.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Portam autem piscium ædificaverunt filii Asnaa : ipsi texerunt eam, et statuerunt valvas ejus, et seras, et vectes. Et juxta eos ædificavit Marimuth filius Uriæ, filii Accus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et juxta eum ædificavit Mosollam filius Barachiæ, filii Mesezebel : et juxta eos ædificavit Sadoc filius Baana.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et juxta eos ædificaverunt Thecueni : optimates autem eorum non supposuerunt colla sua in opere Domini sui.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et portam veterem ædificaverunt Jojada filius Phasea, et Mosollam filius Besodia : ipsi texerunt eam, et statuerunt valvas ejus, et seras, et vectes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et juxta eos ædificaverunt Meltias Gabaonites, et Jadon Meronathites, viri de Gabaon et Maspha, pro duce qui erat in regione trans flumen.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et juxta eum ædificavit Eziel filius Araia aurifex : et juxta eum ædificavit Ananias filius pigmentarii : et dimiserunt Jerusalem usque ad murum plateæ latioris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et juxta eum ædificavit Raphaia filius Hur, princeps vici Jerusalem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et juxta eum ædificavit Jedaia filius Haromaph contra domum suam : et juxta eum ædificavit Hattus filius Haseboniæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mediam partem vici ædificavit Melchias filius Herem, et Hasub filius Phahath Moab, et turrim furnorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et juxta eum ædificavit Sellum filius Alohes, princeps mediæ partis vici Jerusalem, ipse et filiæ ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et portam vallis ædificavit Hanun, et habitatores Zanoë : ipsi ædificaverunt eam, et statuerunt valvas ejus, et seras, et vectes, et mille cubitos in muro usque ad portam sterquilinii.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et portam sterquilinii ædificavit Melchias filius Rechab, princeps vici Bethacharam : ipse ædificavit eam, et statuit valvas ejus, et seras, et vectes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et portam fontis ædificavit Sellum filius Cholhoza, princeps pagi Maspha : ipse ædificavit eam, et texit, et statuit valvas ejus, et seras, et vectes, et muros piscinæ Siloë in hortum regis, et usque ad gradus qui descendunt de civitate David.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Post eum ædificavit Nehemias filius Azboc, princeps dimidiæ partis vici Bethsur, usque contra sepulchrum David, et usque ad piscinam quæ grandi opere constructa est, et usque ad domum fortium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Post eum ædificaverunt Levitæ, Rehum filius Benni : post eum ædificavit Hasebias princeps dimidiæ partis vici Ceilæ in vico suo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Post eum ædificaverunt fratres eorum : Bavai filius Enadad, princeps dimidiæ partis Ceilæ :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et ædificavit juxta eum Azer filius Josue, princeps Maspha, mensuram secundam, contra ascensum firmissimi anguli.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Post eum in monte ædificavit Baruch filius Zachai mensuram secundam, ab angulo usque ad portam domus Eliasib sacerdotis magni.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Post eum ædificavit Merimuth filius Uriæ filii Haccus, mensuram secundam, a porta domus Eliasib, donec extenderetur domus Eliasib.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et post eum ædificaverunt sacerdotes, viri de campestribus Jordanis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Post eum ædificavit Benjamin et Hasub contra domum suam : et post eum ædificavit Azarias filius Maasiæ filii Ananiæ contra domum suam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Post eum ædificavit Bennui filius Henadad mensuram secundam, a domo Azariæ usque ad flexuram, et usque ad angulum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Phalel filius Ozi contra flexuram, et turrim quæ eminet de domo regis excelsa, id est, in atrio carceris : post eum Phadaia filius Pharos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Nathinæi autem habitabant in Ophel usque contra portam aquarum ad orientem, et turrim quæ prominebat.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Post eum ædificaverunt Thecueni mensuram secundam e regione, a turre magna et eminente usque ad murum templi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sursum autem a porta equorum ædificaverunt sacerdotes, unusquisque contra domum suam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Post eos ædificavit Sadoc filius Emmer contra domum suam. Et post eum ædificavit Semaia filius Secheniæ, custos portæ orientalis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Post eum ædificavit Hanania filius Selemiæ, et Hanun filius Seleph sextus, mensuram secundam : post eum ædificavit Mosollam filius Barachiæ, contra gazophylacium suum. Post eum ædificavit Melchias filius aurificis usque ad domum Nathinæorum, et scruta vendentium contra portam judicialem, et usque ad cœnaculum anguli.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et inter cœnaculum anguli in porta gregis, ædificaverunt aurifices et negotiatores.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NEH/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Nehemiah 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NEH/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Nehemiah 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6- nd Mosollam the son of Besodia built the old gate: they covered it and set up the doors thereof, and the locks, and the bars.\"},{\"verse\":7,\"text\":\"And next to them built Meltias the Gabaonite, and Jadon the Meronathite, the men of Gabaon and Maspha, for the governor that was in the country beyond the river.\"},{\"verse\":8,\"text\":\"And next to him built Eziel the son of Araia the goldsmith: and next to him built Ananias the son of the perfumer: and they left Jerusalem unto the wall of the broad street.\"},{\"verse\":9,\"text\":\"And next to him built Raphaia the son of Hur, lord of the street of Jerusalem.\"},{\"verse\":10,\"text\":\"And next to him Jedaia the son of Haromaph over against his own house: and next to him built Hattus the son of Hasebonia.\"},{\"verse\":11,\"text\":\"Melchias the son of Herem, and Hasub the son of Phahath Moab, built half the street, and the tower of the furnaces.\"},{\"verse\":12,\"text\":\"And next to him built Sellum the son of Alohes, lord of half the street of Jerusalem, he and his daughters.\"},{\"verse\":13,\"text\":\"And the gate of the valley Hanun built, and the inhabitants of Zanoe: they built it, and set up the doors thereof, and the locks, and the bars, and a thousand cubits in the wall unto the gate of the dunghill.\"},{\"verse\":14,\"text\":\"And the gate of the dunghill Melchias the son of Rechab built, lord of the street of Bethacharam: he built it, and set up the doors thereof, and the locks, and the bars.\"},{\"verse\":15,\"text\":\"And the gate of the fountain, Sellum, the son of Cholhoza, built, lord of the street of Maspha: he built it, and covered it, and set up the doors thereof, and the locks, and the bars, and the walls of the pool of Siloe unto the king’s guard, and unto the steps that go down from the city of David.\"},{\"verse\":16,\"text\":\"After him built Nehemias the son of Azboc, lord of half the street of Bethsur, as far as over against the sepulchre of David, and to the pool, that was built with great labour, and to the house of the mighty.\"},{\"verse\":17,\"text\":\"After him built the Levites, Rehum the son of Benni. After him built Hasebias, lord of half the street of Ceila in his own street.\"},{\"verse\":18,\"text\":\"After him built their brethren Bavai the son of Enadad, lord of half Ceila.\"},{\"verse\":19,\"text\":\"And next to him Aser the son of Josue, lord of Maspha, built another measure, over against the going up of the strong corner.\"},{\"verse\":20,\"text\":\"After him in the mount Baruch the son of Zachai built another measure, from the corner to the door of the house of Eliasib the high priest.\"},{\"verse\":21,\"text\":\"After him Merimuth the son of Urias the son of Haccus, built another measure, from the door of the house of Eliasib, to the end of the house of Eliasib.\"},{\"verse\":22,\"text\":\"And after him built the priests, the men of the plains of the Jordan.\"},{\"verse\":23,\"text\":\"After him built Benjamin and Hasub, over against their own house: and after him built Azarias the son of Maasias the son of Ananias over against his house.\"},{\"verse\":24,\"text\":\"After him built Bennui the son of Hanadad another measure, from the house of Azarias unto the bending, and unto the corner.\"},{\"verse\":25,\"text\":\"Phalel, the son of Ozi, over against the bending and the tower, which lieth out from the king’s high house, that is, in the court of the prison: after him Phadaia the son of Pharos.\"},{\"verse\":26,\"text\":\"And the Nathinites dwelt in Ophel, as far as over against the water gate toward the east, and the tower that stood out.\"},{\"verse\":27,\"text\":\"After him the Thecuites built another measure over against, from the great tower that standeth out unto the wall of the temple.\"},{\"verse\":28,\"text\":\"And upward from the horse gate the priests built, every man over against his house.\"},{\"verse\":29,\"text\":\"After them built Sadoc the son of Emmer over against his house. And after him built Semaia the son of Sechenias, keeper of the east gate.\"},{\"verse\":30,\"text\":\"After him built Hanania the son of Selemia, and Hanun the sixth son of Seleph, another measure: after him built Mosollam the son of Barachias over against his treasury. After him Melcias the goldsmith’s son built unto the house of the Nathinites, and of the sellers of small wares, over against the judgment gate, and unto the chamber of the corner.\"},{\"verse\":31,\"text\":\"And within the chamber of the corner of the flock gate, the goldsmiths and the merchants built.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et surrexit Eliasib sacerdos magnus, et fratres ejus sacerdotes, et ædificaverunt portam gregis : ipsi sanctificaverunt eam, et statuerunt valvas ejus, et usque ad turrim centum cubitorum sanctificaverunt eam, usque ad turrim Hananeel.\"},{\"verse\":2,\"text\":\"Et juxta eum ædificaverunt viri Jericho : et juxta eum ædificavit Zachur filius Amri.\"},{\"verse\":3,\"text\":\"Portam autem piscium ædificaverunt filii Asnaa : ipsi texerunt eam, et statuerunt valvas ejus, et seras, et vectes. Et juxta eos ædificavit Marimuth filius Uriæ, filii Accus.\"},{\"verse\":4,\"text\":\"Et juxta eum ædificavit Mosollam filius Barachiæ, filii Mesezebel : et juxta eos ædificavit Sadoc filius Baana.\"},{\"verse\":5,\"text\":\"Et juxta eos ædificaverunt Thecueni : optimates autem eorum non supposuerunt colla sua in opere Domini sui.\"},{\"verse\":6,\"text\":\"Et portam veterem ædificaverunt Jojada filius Phasea, et Mosollam filius Besodia : ipsi texerunt eam, et statuerunt valvas ejus, et seras, et vectes.\"},{\"verse\":7,\"text\":\"Et juxta eos ædificaverunt Meltias Gabaonites, et Jadon Meronathites, viri de Gabaon et Maspha, pro duce qui erat in regione trans flumen.\"},{\"verse\":8,\"text\":\"Et juxta eum ædificavit Eziel filius Araia aurifex : et juxta eum ædificavit Ananias filius pigmentarii : et dimiserunt Jerusalem usque ad murum plateæ latioris.\"},{\"verse\":9,\"text\":\"Et juxta eum ædificavit Raphaia filius Hur, princeps vici Jerusalem.\"},{\"verse\":10,\"text\":\"Et juxta eum ædificavit Jedaia filius Haromaph contra domum suam : et juxta eum ædificavit Hattus filius Haseboniæ.\"},{\"verse\":11,\"text\":\"Mediam partem vici ædificavit Melchias filius Herem, et Hasub filius Phahath Moab, et turrim furnorum.\"},{\"verse\":12,\"text\":\"Et juxta eum ædificavit Sellum filius Alohes, princeps mediæ partis vici Jerusalem, ipse et filiæ ejus.\"},{\"verse\":13,\"text\":\"Et portam vallis ædificavit Hanun, et habitatores Zanoë : ipsi ædificaverunt eam, et statuerunt valvas ejus, et seras, et vectes, et mille cubitos in muro usque ad portam sterquilinii.\"},{\"verse\":14,\"text\":\"Et portam sterquilinii ædificavit Melchias filius Rechab, princeps vici Bethacharam : ipse ædificavit eam, et statuit valvas ejus, et seras, et vectes.\"},{\"verse\":15,\"text\":\"Et portam fontis ædificavit Sellum filius Cholhoza, princeps pagi Maspha : ipse ædificavit eam, et texit, et statuit valvas ejus, et seras, et vectes, et muros piscinæ Siloë in hortum regis, et usque ad gradus qui descendunt de civitate David.\"},{\"verse\":16,\"text\":\"Post eum ædificavit Nehemias filius Azboc, princeps dimidiæ partis vici Bethsur, usque contra sepulchrum David, et usque ad piscinam quæ grandi opere constructa est, et usque ad domum fortium.\"},{\"verse\":17,\"text\":\"Post eum ædificaverunt Levitæ, Rehum filius Benni : post eum ædificavit Hasebias princeps dimidiæ partis vici Ceilæ in vico suo.\"},{\"verse\":18,\"text\":\"Post eum ædificaverunt fratres eorum : Bavai filius Enadad, princeps dimidiæ partis Ceilæ :\"},{\"verse\":19,\"text\":\"et ædificavit juxta eum Azer filius Josue, princeps Maspha, mensuram secundam, contra ascensum firmissimi anguli.\"},{\"verse\":20,\"text\":\"Post eum in monte ædificavit Baruch filius Zachai mensuram secundam, ab angulo usque ad portam domus Eliasib sacerdotis magni.\"},{\"verse\":21,\"text\":\"Post eum ædificavit Merimuth filius Uriæ filii Haccus, mensuram secundam, a porta domus Eliasib, donec extenderetur domus Eliasib.\"},{\"verse\":22,\"text\":\"Et post eum ædificaverunt sacerdotes, viri de campestribus Jordanis.\"},{\"verse\":23,\"text\":\"Post eum ædificavit Benjamin et Hasub contra domum suam : et post eum ædificavit Azarias filius Maasiæ filii Ananiæ contra domum suam.\"},{\"verse\":24,\"text\":\"Post eum ædificavit Bennui filius Henadad mensuram secundam, a domo Azariæ usque ad flexuram, et usque ad angulum.\"},{\"verse\":25,\"text\":\"Phalel filius Ozi contra flexuram, et turrim quæ eminet de domo regis excelsa, id est, in atrio carceris : post eum Phadaia filius Pharos.\"},{\"verse\":26,\"text\":\"Nathinæi autem habitabant in Ophel usque contra portam aquarum ad orientem, et turrim quæ prominebat.\"},{\"verse\":27,\"text\":\"Post eum ædificaverunt Thecueni mensuram secundam e regione, a turre magna et eminente usque ad murum templi.\"},{\"verse\":28,\"text\":\"Sursum autem a porta equorum ædificaverunt sacerdotes, unusquisque contra domum suam.\"},{\"verse\":29,\"text\":\"Post eos ædificavit Sadoc filius Emmer contra domum suam. Et post eum ædificavit Semaia filius Secheniæ, custos portæ orientalis.\"},{\"verse\":30,\"text\":\"Post eum ædificavit Hanania filius Selemiæ, et Hanun filius Seleph sextus, mensuram secundam : post eum ædificavit Mosollam filius Barachiæ, contra gazophylacium suum. Post eum ædificavit Melchias filius aurificis usque ad domum Nathinæorum, et scruta vendentium contra portam judicialem, et usque ad cœnaculum anguli.\"},{\"verse\":31,\"text\":\"Et inter cœnaculum anguli in porta gregis, ædificaverunt aurifices et negotiatores.\"}],\"summary\":\"They begin to build the walls: the names and order of the builders.\",\"intro\":null,\"prev\":{\"usfm\":\"NEH\",\"chapter\":2,\"label\":\"Nehemiah 2\"},\"next\":{\"usfm\":\"NEH\",\"chapter\":4,\"label\":\"Nehemiah 4\"}}]]\n"])</script></body></html>
