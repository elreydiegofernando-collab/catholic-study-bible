h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Nehemiah<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Esdras</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NEH/">About <!-- -->Nehemiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Who were the inhabitants of Jerusalem, and the other cities.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the princes of the people dwelt at Jerusalem: but the rest of the people cast lots, to take one part in ten to dwell in Jerusalem the holy city, and nine parts in the other cities.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the people blessed all the men that willingly offered themselves to dwell in Jerusalem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>These therefore are the chief men of the province, who dwelt in Jerusalem, and in the cities of Juda. And every one dwelt in his possession, in their cities: Israel, the priests, the Levites, the Nathinites, and the children of the servants of Solomon.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And in Jerusalem there dwelt some of the children of Juda, and some of the children of Benjamin: of the children of Juda, Athaias the son of Aziam, the son of Zacharias, the son of Amarias, the son of Saphatias, the son of Malaleel: of the sons of Phares,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Maasia the son of Baruch, the son of Cholhoza, the son of Hazia, the son of Adaia, the son of Joiarib, the son of Zacharias, the son of the Silonite:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>All these the sons of Phares, who dwelt in Jerusalem, were four hundred sixty-eight valiant men.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And these are the children of Benjamin: Sellum the son of Mosollam, the son of Joed, the son of Phadaia, the son of Colaia, the son of Masia, the son of Etheel, the son of Isaia.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And after him Gebbai, Sellai, nine hundred twenty-eight.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Joel the son of Zechri their ruler, and Judas the son of Senua was second over the city.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And of the priests Idaia the son of Joarib, Jachin,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Saraia the son of Helcias, the son of Mosollam, the son of Sadoc, the son of Meraioth, the son of Achitob the prince of the house of God,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And their brethren that do the works of the temple: eight hundred twenty-two. And Adaia the son of Jeroham, the son of Phelelia, the son of Amsi, the son of Zacharias, the son of Pheshur, the son of Melchias,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And his brethren the chiefs of the fathers: two hundred forty-two. And Amassai the son of Azreel, the son of Ahazi, the son of Mosollamoth, the son of Emmer,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And their brethren who were very mighty, a hundred twenty-eight: and their ruler Zabdiel son of the mighty.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And of the Levites Semeia the son of Hasub, the son of Azaricam, the son of Hasabia, the son of Boni,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Sabathai and Jozabed, who were over all the outward business of the house of God, of the princes of the Levites,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Mathania the son of Micha, the son of Zebedei, the son of Asaph, was the principal man to praise, and to give glory in prayer, and Becbecia, the second, one of his brethren, and Abda the son of Samua, the son of Galal, the son of Idithun.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>All the Levites in the holy city were two hundred eighty-four.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the porters, Accub, Telmon, and their brethren, who kept the doors: a hundred seventy-two.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the rest of Israel, the priests and the Levites were in all the cities of Juda, every man in his possession.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Nathinites, that dwelt in Ophel, and Siaha, and Gaspha of the Nathinites.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the overseer of the Levites in Jerusalem, was Azzi the son of Bani, the son of Hasabia, the son of Mathania, the son of Micha. Of the sons of Asaph, were the singing men in the ministry of the house of God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For the king’s commandment was concerning them, and an order among the singing men day by day.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Phathahia the son of Mesezebel of the children of Zara the son of Juda was at the hand of the king, in all matters concerning the people,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And in the houses through all their countries. Of the children of Juda some dwelt at Cariath-Arbe, and in the villages thereof: and at Dibon, and in the villages thereof: and at Cabseel, and in the villages thereof.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And at Jesue, and at Molada, and at Bethphaleth,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And at Hasersual, and at Bersabee, and in the villages thereof,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And at Siceleg, and at Mochona, and in the villages thereof,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And at Remmon, and at Saraa, and at Jerimuth,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Zanoa, Odollam, and in their villages, at Lachis and its dependencies, and at Azeca and the villages thereof. And they dwelt from Bersabee unto the valley of Ennom.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the children of Benjamin, from Geba, at Mechmas, and at Hai, and at Bethel, and in the villages thereof,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>At Anathoth, Nob, Anania,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Asor, Rama, Gethaim,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hadid, Seboim, and Neballat, Lod,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Ono the valley of craftsmen.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And of the Levites were portions of Juda and Benjamin.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Habitaverunt autem principes populi in Jerusalem : reliqua vero plebs misit sortem, ut tollerent unam partem de decem qui habitaturi essent in Jerusalem civitate sancta, novem vero partes in civitatibus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Benedixit autem populus omnibus viris qui se sponte obtulerant ut habitarent in Jerusalem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hi sunt itaque principes provinciæ qui habitaverunt in Jerusalem, et in civitatibus Juda. Habitavit autem unusquisque in possessione sua, in urbibus suis, Israël, sacerdotes, Levitæ, Nathinæi, et filii servorum Salomonis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et in Jerusalem habitaverunt de filiis Juda, et de filiis Benjamin : de filiis Juda, Athaias filius Aziam, filii Zachariæ, filii Amariæ, filii Saphatiæ, filii Melaleel : de filiis Phares,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Maasia filius Baruch, filius Cholhoza, filius Hazia, filius Adaia, filius Jojarib, filius Zachariæ, filius Silonitis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>omnes hi filii Phares, qui habitaverunt in Jerusalem, quadringenti sexaginta octo viri fortes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hi sunt autem filii Benjamin : Sellum filius Mosollam, filius Joëd, filius Phadaia, filius Colaia, filius Masia, filius Etheel, filius Isaia,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et post eum Gebbai, Sellai, nongenti viginti octo,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et Joël filius Zechri præpositus eorum, et Judas filius Senua super civitatem secundus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et de sacerdotibus, Idaia filius Joarib, Jachin,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Saraia filius Helciæ, filius Mosollam, filius Sadoc, filius Meraioth, filius Achitob princeps domus Dei,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et fratres eorum facientes opera templi : octingenti viginti duo. Et Adaia filius Jeroham, filius Phelelia, filius Amsi, filius Zachariæ, filius Pheshur, filius Melchiæ,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et fratres ejus principes patrum : ducenti quadraginta duo. Et Amassai filius Azreel, filius Ahazi, filius Mosollamoth, filius Emmer,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et fratres eorum potentes nimis : centum viginti octo, et præpositus eorum Zabdiel filius potentium.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et de Levitis, Semeia filius Hasub, filius Azaricam, filius Hasabia, filius Boni,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et Sabathai et Jozabed, super omnia opera quæ erant forinsecus in domo Dei, a principibus Levitarum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et Mathania filius Micha, filius Zebedei, filius Asaph, princeps ad laudandum et ad confitendum in oratione, et Becbecia secundus de fratribus ejus, et Abda filius Samua, filius Galal, filius Idithun :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>omnes Levitæ in civitate sancta ducenti octoginta quatuor.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et janitores, Accub, Telmon, et fratres eorum, qui custodiebant ostia : centum septuaginta duo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et reliqui ex Israël sacerdotes et Levitæ in universis civitatibus Juda, unusquisque in possessione sua.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et Nathinæi, qui habitabant in Ophel, et Siaha, et Gaspha de Nathinæis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et episcopus Levitarum in Jerusalem, Azzi filius Bani, filius Hasabiæ, filius Mathaniæ, filius Michæ. De filiis Asaph, cantores in ministerio domus Dei.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Præceptum quippe regis super eos erat, et ordo in cantoribus per dies singulos,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et Phathahia filius Mesezebel, de filiis Zara filii Juda in manu regis, juxta omne verbum populi,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et in domibus per omnes regiones eorum. De filiis Juda habitaverunt in Cariatharbe et in filiabus ejus : et in Dibon, et in filiabus ejus : et in Cabseel, et in viculis ejus :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et in Jesue, et in Molada, et in Bethphaleth,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et in Hasersual, et in Bersabee, et in filiabus ejus,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et in Siceleg, et in Mochona, et in filiabus ejus,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et in Remmon, et in Saraa, et in Jerimuth,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Zanoa, Odollam, et in villis earum, Lachis et regionibus ejus, et Azeca, et filiabus ejus. Et manserunt in Bersabee usque ad vallem Ennom.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Filii autem Benjamin, a Geba, Mechmas, et Hai, et Bethel, et filiabus ejus</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Anathoth, Nob, Anania,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Asor, Rama, Gethaim,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hadid, Seboim, et Neballat, Lod,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et Ono valle artificum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et de Levitis portiones Judæ et Benjamin.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NEH/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Nehemiah 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NEH/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Nehemiah 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav ari ons of Phares, who dwelt in Jerusalem, were four hundred sixty-eight valiant men.\"},{\"verse\":7,\"text\":\"And these are the children of Benjamin: Sellum the son of Mosollam, the son of Joed, the son of Phadaia, the son of Colaia, the son of Masia, the son of Etheel, the son of Isaia.\"},{\"verse\":8,\"text\":\"And after him Gebbai, Sellai, nine hundred twenty-eight.\"},{\"verse\":9,\"text\":\"And Joel the son of Zechri their ruler, and Judas the son of Senua was second over the city.\"},{\"verse\":10,\"text\":\"And of the priests Idaia the son of Joarib, Jachin,\"},{\"verse\":11,\"text\":\"Saraia the son of Helcias, the son of Mosollam, the son of Sadoc, the son of Meraioth, the son of Achitob the prince of the house of God,\"},{\"verse\":12,\"text\":\"And their brethren that do the works of the temple: eight hundred twenty-two. And Adaia the son of Jeroham, the son of Phelelia, the son of Amsi, the son of Zacharias, the son of Pheshur, the son of Melchias,\"},{\"verse\":13,\"text\":\"And his brethren the chiefs of the fathers: two hundred forty-two. And Amassai the son of Azreel, the son of Ahazi, the son of Mosollamoth, the son of Emmer,\"},{\"verse\":14,\"text\":\"And their brethren who were very mighty, a hundred twenty-eight: and their ruler Zabdiel son of the mighty.\"},{\"verse\":15,\"text\":\"And of the Levites Semeia the son of Hasub, the son of Azaricam, the son of Hasabia, the son of Boni,\"},{\"verse\":16,\"text\":\"And Sabathai and Jozabed, who were over all the outward business of the house of God, of the princes of the Levites,\"},{\"verse\":17,\"text\":\"And Mathania the son of Micha, the son of Zebedei, the son of Asaph, was the principal man to praise, and to give glory in prayer, and Becbecia, the second, one of his brethren, and Abda the son of Samua, the son of Galal, the son of Idithun.\"},{\"verse\":18,\"text\":\"All the Levites in the holy city were two hundred eighty-four.\"},{\"verse\":19,\"text\":\"And the porters, Accub, Telmon, and their brethren, who kept the doors: a hundred seventy-two.\"},{\"verse\":20,\"text\":\"And the rest of Israel, the priests and the Levites were in all the cities of Juda, every man in his possession.\"},{\"verse\":21,\"text\":\"And the Nathinites, that dwelt in Ophel, and Siaha, and Gaspha of the Nathinites.\"},{\"verse\":22,\"text\":\"And the overseer of the Levites in Jerusalem, was Azzi the son of Bani, the son of Hasabia, the son of Mathania, the son of Micha. Of the sons of Asaph, were the singing men in the ministry of the house of God.\"},{\"verse\":23,\"text\":\"For the king’s commandment was concerning them, and an order among the singing men day by day.\"},{\"verse\":24,\"text\":\"And Phathahia the son of Mesezebel of the children of Zara the son of Juda was at the hand of the king, in all matters concerning the people,\"},{\"verse\":25,\"text\":\"And in the houses through all their countries. Of the children of Juda some dwelt at Cariath-Arbe, and in the villages thereof: and at Dibon, and in the villages thereof: and at Cabseel, and in the villages thereof.\"},{\"verse\":26,\"text\":\"And at Jesue, and at Molada, and at Bethphaleth,\"},{\"verse\":27,\"text\":\"And at Hasersual, and at Bersabee, and in the villages thereof,\"},{\"verse\":28,\"text\":\"And at Siceleg, and at Mochona, and in the villages thereof,\"},{\"verse\":29,\"text\":\"And at Remmon, and at Saraa, and at Jerimuth,\"},{\"verse\":30,\"text\":\"Zanoa, Odollam, and in their villages, at Lachis and its dependencies, and at Azeca and the villages thereof. And they dwelt from Bersabee unto the valley of Ennom.\"},{\"verse\":31,\"text\":\"And the children of Benjamin, from Geba, at Mechmas, and at Hai, and at Bethel, and in the villages thereof,\"},{\"verse\":32,\"text\":\"At Anathoth, Nob, Anania,\"},{\"verse\":33,\"text\":\"Asor, Rama, Gethaim,\"},{\"verse\":34,\"text\":\"Hadid, Seboim, and Neballat, Lod,\"},{\"verse\":35,\"text\":\"And Ono the valley of craftsmen.\"},{\"verse\":36,\"text\":\"And of the Levites were portions of Juda and Benjamin.\"}],\"vul\":[{\"verse\":1,\"text\":\"Habitaverunt autem principes populi in Jerusalem : reliqua vero plebs misit sortem, ut tollerent unam partem de decem qui habitaturi essent in Jerusalem civitate sancta, novem vero partes in civitatibus.\"},{\"verse\":2,\"text\":\"Benedixit autem populus omnibus viris qui se sponte obtulerant ut habitarent in Jerusalem.\"},{\"verse\":3,\"text\":\"Hi sunt itaque principes provinciæ qui habitaverunt in Jerusalem, et in civitatibus Juda. Habitavit autem unusquisque in possessione sua, in urbibus suis, Israël, sacerdotes, Levitæ, Nathinæi, et filii servorum Salomonis.\"},{\"verse\":4,\"text\":\"Et in Jerusalem habitaverunt de filiis Juda, et de filiis Benjamin : de filiis Juda, Athaias filius Aziam, filii Zachariæ, filii Amariæ, filii Saphatiæ, filii Melaleel : de filiis Phares,\"},{\"verse\":5,\"text\":\"Maasia filius Baruch, filius Cholhoza, filius Hazia, filius Adaia, filius Jojarib, filius Zachariæ, filius Silonitis :\"},{\"verse\":6,\"text\":\"omnes hi filii Phares, qui habitaverunt in Jerusalem, quadringenti sexaginta octo viri fortes.\"},{\"verse\":7,\"text\":\"Hi sunt autem filii Benjamin : Sellum filius Mosollam, filius Joëd, filius Phadaia, filius Colaia, filius Masia, filius Etheel, filius Isaia,\"},{\"verse\":8,\"text\":\"et post eum Gebbai, Sellai, nongenti viginti octo,\"},{\"verse\":9,\"text\":\"et Joël filius Zechri præpositus eorum, et Judas filius Senua super civitatem secundus.\"},{\"verse\":10,\"text\":\"Et de sacerdotibus, Idaia filius Joarib, Jachin,\"},{\"verse\":11,\"text\":\"Saraia filius Helciæ, filius Mosollam, filius Sadoc, filius Meraioth, filius Achitob princeps domus Dei,\"},{\"verse\":12,\"text\":\"et fratres eorum facientes opera templi : octingenti viginti duo. Et Adaia filius Jeroham, filius Phelelia, filius Amsi, filius Zachariæ, filius Pheshur, filius Melchiæ,\"},{\"verse\":13,\"text\":\"et fratres ejus principes patrum : ducenti quadraginta duo. Et Amassai filius Azreel, filius Ahazi, filius Mosollamoth, filius Emmer,\"},{\"verse\":14,\"text\":\"et fratres eorum potentes nimis : centum viginti octo, et præpositus eorum Zabdiel filius potentium.\"},{\"verse\":15,\"text\":\"Et de Levitis, Semeia filius Hasub, filius Azaricam, filius Hasabia, filius Boni,\"},{\"verse\":16,\"text\":\"et Sabathai et Jozabed, super omnia opera quæ erant forinsecus in domo Dei, a principibus Levitarum.\"},{\"verse\":17,\"text\":\"Et Mathania filius Micha, filius Zebedei, filius Asaph, princeps ad laudandum et ad confitendum in oratione, et Becbecia secundus de fratribus ejus, et Abda filius Samua, filius Galal, filius Idithun :\"},{\"verse\":18,\"text\":\"omnes Levitæ in civitate sancta ducenti octoginta quatuor.\"},{\"verse\":19,\"text\":\"Et janitores, Accub, Telmon, et fratres eorum, qui custodiebant ostia : centum septuaginta duo.\"},{\"verse\":20,\"text\":\"Et reliqui ex Israël sacerdotes et Levitæ in universis civitatibus Juda, unusquisque in possessione sua.\"},{\"verse\":21,\"text\":\"Et Nathinæi, qui habitabant in Ophel, et Siaha, et Gaspha de Nathinæis.\"},{\"verse\":22,\"text\":\"Et episcopus Levitarum in Jerusalem, Azzi filius Bani, filius Hasabiæ, filius Mathaniæ, filius Michæ. De filiis Asaph, cantores in ministerio domus Dei.\"},{\"verse\":23,\"text\":\"Præceptum quippe regis super eos erat, et ordo in cantoribus per dies singulos,\"},{\"verse\":24,\"text\":\"et Phathahia filius Mesezebel, de filiis Zara filii Juda in manu regis, juxta omne verbum populi,\"},{\"verse\":25,\"text\":\"et in domibus per omnes regiones eorum. De filiis Juda habitaverunt in Cariatharbe et in filiabus ejus : et in Dibon, et in filiabus ejus : et in Cabseel, et in viculis ejus :\"},{\"verse\":26,\"text\":\"et in Jesue, et in Molada, et in Bethphaleth,\"},{\"verse\":27,\"text\":\"et in Hasersual, et in Bersabee, et in filiabus ejus,\"},{\"verse\":28,\"text\":\"et in Siceleg, et in Mochona, et in filiabus ejus,\"},{\"verse\":29,\"text\":\"et in Remmon, et in Saraa, et in Jerimuth,\"},{\"verse\":30,\"text\":\"Zanoa, Odollam, et in villis earum, Lachis et regionibus ejus, et Azeca, et filiabus ejus. Et manserunt in Bersabee usque ad vallem Ennom.\"},{\"verse\":31,\"text\":\"Filii autem Benjamin, a Geba, Mechmas, et Hai, et Bethel, et filiabus ejus\"},{\"verse\":32,\"text\":\"Anathoth, Nob, Anania,\"},{\"verse\":33,\"text\":\"Asor, Rama, Gethaim,\"},{\"verse\":34,\"text\":\"Hadid, Seboim, et Neballat, Lod,\"},{\"verse\":35,\"text\":\"et Ono valle artificum.\"},{\"verse\":36,\"text\":\"Et de Levitis portiones Judæ et Benjamin.\"}],\"summary\":\"Who were the inhabitants of Jerusalem, and the other cities.\",\"intro\":null,\"prev\":{\"usfm\":\"NEH\",\"chapter\":10,\"label\":\"Nehemiah 10\"},\"next\":{\"usfm\":\"NEH\",\"chapter\":12,\"label\":\"Nehemiah 12\"}}]]\n"])</script></body></html>
