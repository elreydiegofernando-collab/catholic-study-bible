35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Amos<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/AMO/">About <!-- -->Amos</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The desolation of Israel for their pride and luxury.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Woe to you that are wealthy in Sion, and to you that have confidence in the mountain of Samaria: ye great men, heads of the people, that go in with state into the house of Israel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Pass ye over to Chalane, and see, and go from thence into Emath the great: and go down into Geth of the Philistines, and to all the best kingdoms of these: if their border be larger than your border.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>You that are separated unto the evil day: and that approach to the throne of iniquity;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>You that sleep upon beds of ivory, and are wanton on your couches: that eat the lambs out of the flock, and the calves out of the midst of the herd;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>You that sing to the sound of the psaltery: they have thought themselves to have instruments of music like David;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>That drink wine in bowls, and anoint themselves with the best ointments: and they are not concerned for the affliction of Joseph.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Wherefore now they shall go captive at the head of them that go into captivity: and the faction of the luxurious ones shall be taken away.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord God hath sworn by his own soul, saith the Lord the God of hosts: I detest the pride of Jacob, and I hate his houses, and I will deliver up the city with the inhabitants thereof.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And if there remain ten men in one house, they also shall die.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And a man’s kinsman shall take him up, and shall burn him, that he may carry the bones out of the house; and he shall say to him that is in the inner rooms of the house: Is there yet any with thee?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he shall answer: There is an end. And he shall say to him: Hold thy peace, and mention not the name of the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For behold the Lord hath commanded, and he will strike the greater house with breaches, and the lesser house with clefts.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Can horses run upon the rocks, or can any one plough with buffles? for you have turned judgment into bitterness, and the fruit of justice into wormwood.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>You that rejoice in a thing of nought: you that say: Have we not taken unto us horns by our own strength?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But behold, I will raise up a nation against you, O house of Israel, saith the Lord the God of hosts; and they shall destroy you from the entrance of Emath, even to the torrent of the desert.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Væ qui opulenti estis in Sion, et confiditis in monte Samariæ : optimates capita populorum, ingredientes pompatice domum Israël !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Transite in Chalane, et videte, et ite inde in Emath magnam, et descendite in Geth Palæstinorum, et ad optima quæque regna horum : si latior terminus eorum termino vestro est.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Qui separati estis in diem malum, et appropinquatis solio iniquitatis ;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>qui dormitis in lectis eburneis, et lascivitis in stratis vestris ; qui comeditis agnum de grege, et vitulos de medio armenti ;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui canitis ad vocem psalterii, sicut David putaverunt se habere vasa cantici,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>bibentes vinum in phialis, et optimo unguento delibuti, et nihil patiebantur super contritione Joseph.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quapropter nunc migrabunt in capite transmigrantium, et auferetur factio lascivientium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Juravit Dominus Deus in anima sua, dicit Dominus Deus exercituum : Detestor ego superbiam Jacob, et domos ejus odi, et tradam civitatem cum habitatoribus suis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quod si reliqui fuerint decem viri in domo una, et ipsi morientur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et tollet eum propinquus suus, et comburet eum, ut efferat ossa de domo ; et dicet ei, qui in penetralibus domus est : Numquid adhuc est penes te ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et respondebit : Finis est. Et dicet ei : Tace, et non recorderis nominis Domini.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quia ecce Dominus mandabit, et percutiet domum majorem ruinis, et domum minorem scissionibus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Numquid currere queunt in petris equi, aut arari potest in bubalis ? quoniam convertistis in amaritudinem judicium, et fructum justitiæ in absinthium.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui lætamini in nihilo ; qui dicitis : Numquid non in fortitudine nostra assumpsimus nobis cornua ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ecce enim suscitabo super vos, domus Israël, dicit Dominus Deus exercituum, gentem, et conteret vos ab introitu Emath usque ad torrentem deserti.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Amos 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Amos 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center oseph.\"},{\"verse\":7,\"text\":\"Wherefore now they shall go captive at the head of them that go into captivity: and the faction of the luxurious ones shall be taken away.\"},{\"verse\":8,\"text\":\"The Lord God hath sworn by his own soul, saith the Lord the God of hosts: I detest the pride of Jacob, and I hate his houses, and I will deliver up the city with the inhabitants thereof.\"},{\"verse\":9,\"text\":\"And if there remain ten men in one house, they also shall die.\"},{\"verse\":10,\"text\":\"And a man’s kinsman shall take him up, and shall burn him, that he may carry the bones out of the house; and he shall say to him that is in the inner rooms of the house: Is there yet any with thee?\"},{\"verse\":11,\"text\":\"And he shall answer: There is an end. And he shall say to him: Hold thy peace, and mention not the name of the Lord.\"},{\"verse\":12,\"text\":\"For behold the Lord hath commanded, and he will strike the greater house with breaches, and the lesser house with clefts.\"},{\"verse\":13,\"text\":\"Can horses run upon the rocks, or can any one plough with buffles? for you have turned judgment into bitterness, and the fruit of justice into wormwood.\"},{\"verse\":14,\"text\":\"You that rejoice in a thing of nought: you that say: Have we not taken unto us horns by our own strength?\"},{\"verse\":15,\"text\":\"But behold, I will raise up a nation against you, O house of Israel, saith the Lord the God of hosts; and they shall destroy you from the entrance of Emath, even to the torrent of the desert.\"}],\"vul\":[{\"verse\":1,\"text\":\"Væ qui opulenti estis in Sion, et confiditis in monte Samariæ : optimates capita populorum, ingredientes pompatice domum Israël !\"},{\"verse\":2,\"text\":\"Transite in Chalane, et videte, et ite inde in Emath magnam, et descendite in Geth Palæstinorum, et ad optima quæque regna horum : si latior terminus eorum termino vestro est.\"},{\"verse\":3,\"text\":\"Qui separati estis in diem malum, et appropinquatis solio iniquitatis ;\"},{\"verse\":4,\"text\":\"qui dormitis in lectis eburneis, et lascivitis in stratis vestris ; qui comeditis agnum de grege, et vitulos de medio armenti ;\"},{\"verse\":5,\"text\":\"qui canitis ad vocem psalterii, sicut David putaverunt se habere vasa cantici,\"},{\"verse\":6,\"text\":\"bibentes vinum in phialis, et optimo unguento delibuti, et nihil patiebantur super contritione Joseph.\"},{\"verse\":7,\"text\":\"Quapropter nunc migrabunt in capite transmigrantium, et auferetur factio lascivientium.\"},{\"verse\":8,\"text\":\"Juravit Dominus Deus in anima sua, dicit Dominus Deus exercituum : Detestor ego superbiam Jacob, et domos ejus odi, et tradam civitatem cum habitatoribus suis.\"},{\"verse\":9,\"text\":\"Quod si reliqui fuerint decem viri in domo una, et ipsi morientur.\"},{\"verse\":10,\"text\":\"Et tollet eum propinquus suus, et comburet eum, ut efferat ossa de domo ; et dicet ei, qui in penetralibus domus est : Numquid adhuc est penes te ?\"},{\"verse\":11,\"text\":\"Et respondebit : Finis est. Et dicet ei : Tace, et non recorderis nominis Domini.\"},{\"verse\":12,\"text\":\"Quia ecce Dominus mandabit, et percutiet domum majorem ruinis, et domum minorem scissionibus.\"},{\"verse\":13,\"text\":\"Numquid currere queunt in petris equi, aut arari potest in bubalis ? quoniam convertistis in amaritudinem judicium, et fructum justitiæ in absinthium.\"},{\"verse\":14,\"text\":\"Qui lætamini in nihilo ; qui dicitis : Numquid non in fortitudine nostra assumpsimus nobis cornua ?\"},{\"verse\":15,\"text\":\"Ecce enim suscitabo super vos, domus Israël, dicit Dominus Deus exercituum, gentem, et conteret vos ab introitu Emath usque ad torrentem deserti.\"}],\"summary\":\"The desolation of Israel for their pride and luxury.\",\"intro\":null,\"prev\":{\"usfm\":\"AMO\",\"chapter\":5,\"label\":\"Amos 5\"},\"next\":{\"usfm\":\"AMO\",\"chapter\":7,\"label\":\"Amos 7\"}}]]\n"])</script></body></html>
