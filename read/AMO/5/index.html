2</sup>The virgin of Israel is cast down upon her land, there is none to raise her up.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For thus saith the Lord God: The city, out of which came forth a thousand, there shall be left in it a hundred: and out of which there came a hundred, there shall be left in it ten, in the house of Israel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thus saith the Lord to the house of Israel: Seek ye me, and you shall live.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But seek not Bethel, and go not into Galgal, neither shall you pass over to Bersabee: for Galgal shall go into captivity, and Bethel shall be unprofitable.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Seek ye the Lord, and live: lest the house of Joseph be burnt with fire, and it shall devour, and there shall be none to quench Bethel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>You that turn judgment into wormwood, and forsake justice in the land,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Seek him that maketh Arcturus, and Orion, and that turneth darkness into morning, and that changeth day into night: that calleth the waters of the sea, and poureth them out upon the face of the earth: The Lord is his name.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that with a smile bringeth destruction upon the strong, and waste upon the mighty.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They have hated him that rebuketh in the gate: and have abhorred him that speaketh perfectly.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore because you robbed the poor, and took the choice prey from him: you shall build houses with square stone, and shall not dwell in them: you shall plant most delightful vineyards, and shall not drink the wine of them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Because I know your manifold crimes, and your grievous sins: enemies of the just, taking bribes, and oppressing the poor in the gate.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Therefore the prudent shall keep silence at that time, for it is an evil time.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Seek ye good, and not evil, that you may live: and the Lord the God of hosts will be with you, as you have said.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hate evil, and love good, and establish judgment in the gate: it may be the Lord the God of hosts may have mercy on the remnant of Joseph.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Therefore thus saith the Lord the God of hosts the sovereign Lord: In every street there shall be wailing: and in all places that are without, they shall say: Alas, alas! and they shall call the husbandman to mourning, and such as are skilful in lamentation to lament.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And in all vineyards there shall be wailing: because I will pass through in the midst of thee, saith the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Woe to them that desire the day of the Lord: to what end is it for you? the day of the Lord is darkness, and not light.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>As if a man should flee from the face of a lion, and a bear should meet him: or enter into the house, and lean with his hand upon the wall, and a serpent should bite him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Shall not the day of the Lord be darkness, and not light: and obscurity, and no brightness in it?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I hate, and have rejected your festivities: and I will not receive the odour of your assemblies.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And if you offer me holocausts, and your gifts, I will not receive them: neither will I regard the vows of your fat beasts.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Take away from me the tumult of thy songs: and I will not hear the canticles of thy harp.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But judgment shall be revealed as water, and justice as a mighty torrent.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Did you offer victims and sacrifices to me in the desert for forty years, O house of Israel?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And I will cause you to go into captivity beyond Damascus, saith the Lord, the God of hosts is his name.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audite verbum istud, quod ego levo super vos planctum : domus Israël cecidit, et non adjiciet ut resurgat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Virgo Israël projecta est in terram suam, non est qui suscitet eam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quia hæc dicit Dominus Deus : Urbs de qua egrediebantur mille, relinquentur in ea centum ; et de qua egrediebantur centum, relinquentur in ea decem in domo Israël.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quia hæc dicit Dominus domui Israël : Quærite me, et vivetis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et nolite quærere Bethel, et in Galgalam nolite intrare, et in Bersabee non transibitis, quia Galgala captiva ducetur, et Bethel erit inutilis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quærite Dominum, et vivite (ne forte comburatur ut ignis domus Joseph, et devorabit, et non erit qui extinguat Bethel :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>qui convertitis in absinthium judicium, et justitiam in terra relinquitis) :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>facientem Arcturum et Orionem, et convertentem in mane tenebras, et diem in noctem mutantem ; qui vocat aquas maris, et effundit eas super faciem terræ ; Dominus nomen est ejus :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>qui subridet vastitatem super robustum, et depopulationem super potentem affert.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Odio habuerunt corripientem in porta, et loquentem perfecte abominati sunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Idcirco, pro eo quod diripiebatis pauperem, et prædam electam tollebatis ab eo, domos quadro lapide ædificabitis, et non habitabitis in eis ; vineas plantabis amantissimas, et non bibetis vinum earum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quia cognovi multa scelera vestra, et fortia peccata vestra : hostes justi, accipientes munus, et pauperes deprimentes in porta.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ideo prudens in tempore illo tacebit, quia tempus malum est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quærite bonum, et non malum, ut vivatis ; et erit Dominus Deus exercituum vobiscum, sicut dixistis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Odite malum et diligite bonum, et constituite in porta judicium : si forte misereatur Dominus Deus exercituum reliquiis Joseph.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Propterea hæc dicit Dominus Deus exercituum, dominator : In omnibus plateis planctus ; et in cunctis quæ foris sunt, dicetur : Væ, væ ! et vocabunt agricolam ad luctum, et ad planctum eos qui sciunt plangere.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et in omnibus vineis erit planctus, quia pertransibo in medio tui, dicit Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Væ desiderantibus diem Domini ! ad quid eam vobis ? Dies Domini ista, tenebræ, et non lux.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quomodo si fugiat vir a facie leonis, et occurrat ei ursus ; et ingrediatur domum, et innitatur manu sua super parietem, et mordeat eum coluber.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Numquid non tenebræ dies Domini, et non lux ; et caligo, et non splendor in ea ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Odi, et projeci festivitates vestras, et non capiam odorem cœtuum vestrorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod si obtuleritis mihi holocautomata, et munera vestra, non suscipiam ; et vota pinguium vestrorum non respiciam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Aufer a me tumultum carminum tuorum ; et cantica lyræ tuæ non audiam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et revelabitur quasi aqua judicium, et justitia quasi torrens fortis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Numquid hostias et sacrificium obtulistis mihi in deserto quadraginta annis, domus Israël ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et portastis tabernaculum Moloch vestro, et imaginem idolorum vestrorum, sidus dei vestri, quæ fecistis vobis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et migrare vos faciam trans Damascum, dicit Dominus : Deus exercituum nomen ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Amos 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Amos 6</span></span><svg viewBox="0 0 "$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"AMO.5\",{\"bookId\":35,\"usfm\":\"AMO\",\"bookName\":\"Amos\",\"drName\":\"Amos\",\"chapter\":5,\"totalChapters\":9,\"dra\":[{\"verse\":1,\"text\":\"Hear ye this word, which I take up concerning you for a lamentation. The house of Israel is fallen, and it shall rise no more.\"},{\"verse\":2,\"text\":\"The virgin of Israel is cast down upon her land, there is none to raise her up.\"},{\"verse\":3,\"text\":\"For thus saith the Lord God: The city, out of which came forth a thousand, there shall be left in it a hundred: and out of which there came a hundred, there shall be left in it ten, in the house of Israel.\"},{\"verse\":4,\"text\":\"For thus saith the Lord to the house of Israel: Seek ye me, and you shall live.\"},{\"verse\":5,\"text\":\"But seek not Bethel, and go not into Galgal, neither shall you pass over to Bersabee: for Galgal shall go into captivity, and Bethel shall be unprofitable.\"},{\"verse\":6,\"text\":\"Seek ye the Lord, and live: lest the house of Joseph be burnt with fire, and it shall devour, and there shall be none to quench Bethel.\"},{\"verse\":7,\"text\":\"You that turn judgment into wormwood, and forsake justice in the land,\"},{\"verse\":8,\"text\":\"Seek him that maketh Arcturus, and Orion, and that turneth darkness into morning, and that changeth day into night: that calleth the waters of the sea, and poureth them out upon the face of the earth: The Lord is his name.\"},{\"verse\":9,\"text\":\"He that with a smile bringeth destruction upon the strong, and waste upon the mighty.\"},{\"verse\":10,\"text\":\"They have hated him that rebuketh in the gate: and have abhorred him that speaketh perfectly.\"},{\"verse\":11,\"text\":\"Therefore because you robbed the poor, and took the choice prey from him: you shall build houses with square stone, and shall not dwell in them: you shall plant most delightful vineyards, and shall not drink the wine of them.\"},{\"verse\":12,\"text\":\"Because I know your manifold crimes, and your grievous sins: enemies of the just, taking bribes, and oppressing the poor in the gate.\"},{\"verse\":13,\"text\":\"Therefore the prudent shall keep silence at that time, for it is an evil time.\"},{\"verse\":14,\"text\":\"Seek ye good, and not evil, that you may live: and the Lord the God of hosts will be with you, as you have said.\"},{\"verse\":15,\"text\":\"Hate evil, and love good, and establish judgment in the gate: it may be the Lord the God of hosts may have mercy on the remnant of Joseph.\"},{\"verse\":16,\"text\":\"Therefore thus saith the Lord the God of hosts the sovereign Lord: In every street there shall be wailing: and in all places that are without, they shall say: Alas, alas! and they shall call the husbandman to mourning, and such as are skilful in lamentation to lament.\"},{\"verse\":17,\"text\":\"And in all vineyards there shall be wailing: because I will pass through in the midst of thee, saith the Lord.\"},{\"verse\":18,\"text\":\"Woe to them that desire the day of the Lord: to what end is it for you? the day of the Lord is darkness, and not light.\"},{\"verse\":19,\"text\":\"As if a man should flee from the face of a lion, and a bear should meet him: or enter into the house, and lean with his hand upon the wall, and a serpent should bite him.\"},{\"verse\":20,\"text\":\"Shall not the day of the Lord be darkness, and not light: and obscurity, and no brightness in it?\"},{\"verse\":21,\"text\":\"I hate, and have rejected your festivities: and I will not receive the odour of your assemblies.\"},{\"verse\":22,\"text\":\"And if you offer me holocausts, and your gifts, I will not receive them: neither will I regard the vows of your fat beasts.\"},{\"verse\":23,\"text\":\"Take away from me the tumult of thy songs: and I will not hear the canticles of thy harp.\"},{\"verse\":24,\"text\":\"But judgment shall be revealed as water, and justice as a mighty torrent.\"},{\"verse\":25,\"text\":\"Did you offer victims and sacrifices to me in the desert for forty years, O house of Israel?\"},{\"verse\":27,\"text\":\"And I will cause you to go into captivity beyond Damascus, saith the Lord, the God of hosts is his name.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audite verbum istud, quod ego levo super vos planctum : domus Israël cecidit, et non adjiciet ut resurgat.\"},{\"verse\":2,\"text\":\"Virgo Israël projecta est in terram suam, non est qui suscitet eam.\"},{\"verse\":3,\"text\":\"Quia hæc dicit Dominus Deus : Urbs de qua egrediebantur mille, relinquentur in ea centum ; et de qua egrediebantur centum, relinquentur in ea decem in domo Israël.\"},{\"verse\":4,\"text\":\"Quia hæc dicit Dominus domui Israël : Quærite me, et vivetis.\"},{\"verse\":5,\"text\":\"Et nolite quærere Bethel, et in Galgalam nolite intrare, et in Bersabee non transibitis, quia Galgala captiva ducetur, et Bethel erit inutilis.\"},{\"verse\":6,\"text\":\"Quærite Dominum, et vivite (ne forte comburatur ut ignis domus Joseph, et devorabit, et non erit qui extinguat Bethel :\"},{\"verse\":7,\"text\":\"qui convertitis in absinthium judicium, et justitiam in terra relinquitis) :\"},{\"verse\":8,\"text\":\"facientem Arcturum et Orionem, et convertentem in mane tenebras, et diem in noctem mutantem ; qui vocat aquas maris, et effundit eas super faciem terræ ; Dominus nomen est ejus :\"},{\"verse\":9,\"text\":\"qui subridet vastitatem super robustum, et depopulationem super potentem affert.\"},{\"verse\":10,\"text\":\"Odio habuerunt corripientem in porta, et loquentem perfecte abominati sunt.\"},{\"verse\":11,\"text\":\"Idcirco, pro eo quod diripiebatis pauperem, et prædam electam tollebatis ab eo, domos quadro lapide ædificabitis, et non habitabitis in eis ; vineas plantabis amantissimas, et non bibetis vinum earum.\"},{\"verse\":12,\"text\":\"Quia cognovi multa scelera vestra, et fortia peccata vestra : hostes justi, accipientes munus, et pauperes deprimentes in porta.\"},{\"verse\":13,\"text\":\"Ideo prudens in tempore illo tacebit, quia tempus malum est.\"},{\"verse\":14,\"text\":\"Quærite bonum, et non malum, ut vivatis ; et erit Dominus Deus exercituum vobiscum, sicut dixistis.\"},{\"verse\":15,\"text\":\"Odite malum et diligite bonum, et constituite in porta judicium : si forte misereatur Dominus Deus exercituum reliquiis Joseph.\"},{\"verse\":16,\"text\":\"Propterea hæc dicit Dominus Deus exercituum, dominator : In omnibus plateis planctus ; et in cunctis quæ foris sunt, dicetur : Væ, væ ! et vocabunt agricolam ad luctum, et ad planctum eos qui sciunt plangere.\"},{\"verse\":17,\"text\":\"Et in omnibus vineis erit planctus, quia pertransibo in medio tui, dicit Dominus.\"},{\"verse\":18,\"text\":\"Væ desiderantibus diem Domini ! ad quid eam vobis ? Dies Domini ista, tenebræ, et non lux.\"},{\"verse\":19,\"text\":\"Quomodo si fugiat vir a facie leonis, et occurrat ei ursus ; et ingrediatur domum, et innitatur manu sua super parietem, et mordeat eum coluber.\"},{\"verse\":20,\"text\":\"Numquid non tenebræ dies Domini, et non lux ; et caligo, et non splendor in ea ?\"},{\"verse\":21,\"text\":\"Odi, et projeci festivitates vestras, et non capiam odorem cœtuum vestrorum.\"},{\"verse\":22,\"text\":\"Quod si obtuleritis mihi holocautomata, et munera vestra, non suscipiam ; et vota pinguium vestrorum non respiciam.\"},{\"verse\":23,\"text\":\"Aufer a me tumultum carminum tuorum ; et cantica lyræ tuæ non audiam.\"},{\"verse\":24,\"text\":\"Et revelabitur quasi aqua judicium, et justitia quasi torrens fortis.\"},{\"verse\":25,\"text\":\"Numquid hostias et sacrificium obtulistis mihi in deserto quadraginta annis, domus Israël ?\"},{\"verse\":26,\"text\":\"et portastis tabernaculum Moloch vestro, et imaginem idolorum vestrorum, sidus dei vestri, quæ fecistis vobis.\"},{\"verse\":27,\"text\":\"Et migrare vos faciam trans Damascum, dicit Dominus : Deus exercituum nomen ejus.\"}],\"summary\":\"A lamentation for Israel: an exhortation to return to God.\",\"intro\":null,\"prev\":{\"usfm\":\"AMO\",\"chapter\":4,\"label\":\"Amos 4\"},\"next\":{\"usfm\":\"AMO\",\"chapter\":6,\"label\":\"Amos 6\"}}]]\n"])</script></body></html>
