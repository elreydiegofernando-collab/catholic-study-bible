35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Amos<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/AMO/">About <!-- -->Amos</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The judgments with which God threatens Moab, Juda, and Israel for their sins, and their ingratitude.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Thus saith the Lord: For three crimes of Moab, and for four I will not convert him: because he hath burnt the bones of the king of Edom even to ashes.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And I will send a fire into Moab, and it shall devour the houses of Carioth: and Moab shall die with a noise, with the sound of the trumpet:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I will cut off the judge from the midst thereof, and will slay all his princes with him, saith the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thus saith the Lord: For three crimes of Juda, and for four I will not convert him: because he hath cast away the law of the Lord, and hath not kept his commandments: for their idols have caused them to err, after which their fathers have walked.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I will send a fire into Juda, and it shall devour the houses of Jerusalem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thus saith the Lord: For three crimes of Israel, and for four I will not convert him: because he hath sold the just man for silver, and the poor man for a pair of shoes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They bruise the heads of the poor upon the dust of the earth, and turn aside the way of the humble: and the son and his father have gone to the same young woman, to profane my holy name.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they sat down upon garments laid to pledge by every altar: and drank the wine of the condemned in the house of their God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Yet I cast out the Amorrhite before their face: whose height was like the height of cedars, and who was strong as an oak: and I destroyed his fruit from above, and his roots beneath.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>It is I that brought you up out of the land of Egypt, and I led you forty years through the wilderness, that you might possess the land of the Amorrhite.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I raised up of your sons for prophets, and of your young men for Nazarites. Is it not so, O ye children of Israel, saith the Lord?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And you will present wine to the Nazarites: and command the prophets, saying: Prophesy not.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Behold, I will screak under you as a wain screaketh that is laden with hay.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And flight shall perish from the swift, and the valiant shall not possess his strength, neither shall the strong save his life.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he that holdeth the bow shall not stand, and the swift of foot shall not escape, neither shall the rider of the horse save his life.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the stout of heart among the valiant shall flee away naked in that day, saith the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc dicit Dominus : Super tribus sceleribus Moab, et super quatuor non convertam eum, eo quod incenderit ossa regis Idumææ usque ad cinerem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et mittam ignem in Moab, et devorabit ædes Carioth : et morietur in sonitu Moab, in clangore tubæ.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et disperdam judicem de medio ejus, et omnes principes ejus interficiam cum eo, dicit Dominus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæc dicit Dominus : Super tribus sceleribus Juda, et super quatuor non convertam eum, eo quod abjecerit legem Domini et mandata ejus non custodierit : deceperant enim eos idola sua, post quæ abierant patres eorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et mittam ignem in Juda, et devorabit ædes Jerusalem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hæc dicit Dominus : Super tribus sceleribus Israël, et super quatuor non convertam eum, pro eo quod vendiderit pro argento justum, et pauperem pro calceamentis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui conterunt super pulverem terræ capita pauperum, et viam humilium declinant : et filius ac pater ejus ierunt ad puellam, ut violarent nomen sanctum meum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et super vestimentis pignoratis accubuerunt juxta omne altare, et vinum damnatorum bibebant in domo Dei sui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ego autem exterminavi Amorrhæum a facie eorum, cujus altitudo, cedrorum altitudo ejus, et fortis ipse quasi quercus ; et contrivi fructum ejus desuper, et radices ejus subter.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ego sum qui ascendere vos feci de terra Ægypti, et duxi vos in deserto quadraginta annis, ut possideretis terram Amorrhæi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et suscitavi de filiis vestris in prophetas, et de juvenibus vestris nazaræos. Numquid non ita est, filii Israël ? dicit Dominus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et propinabitis nazaræis vinum, et prophetis mandabitis, dicentes : Ne prophetetis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ecce ego stridebo subter vos, sicut stridet plaustrum onustum fœno.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et peribit fuga a veloce, et fortis non obtinebit virtutem suam, et robustus non salvabit animam suam :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et tenens arcum non stabit, et velox pedibus suis non salvabitur, et ascensor equi non salvabit animam suam :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et robustus corde inter fortes nudus fugiet in illa die, dicit Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Amos 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-s }],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"AMO.2\",{\"bookId\":35,\"usfm\":\"AMO\",\"bookName\":\"Amos\",\"drName\":\"Amos\",\"chapter\":2,\"totalChapters\":9,\"dra\":[{\"verse\":1,\"text\":\"Thus saith the Lord: For three crimes of Moab, and for four I will not convert him: because he hath burnt the bones of the king of Edom even to ashes.\"},{\"verse\":2,\"text\":\"And I will send a fire into Moab, and it shall devour the houses of Carioth: and Moab shall die with a noise, with the sound of the trumpet:\"},{\"verse\":3,\"text\":\"And I will cut off the judge from the midst thereof, and will slay all his princes with him, saith the Lord.\"},{\"verse\":4,\"text\":\"Thus saith the Lord: For three crimes of Juda, and for four I will not convert him: because he hath cast away the law of the Lord, and hath not kept his commandments: for their idols have caused them to err, after which their fathers have walked.\"},{\"verse\":5,\"text\":\"And I will send a fire into Juda, and it shall devour the houses of Jerusalem.\"},{\"verse\":6,\"text\":\"Thus saith the Lord: For three crimes of Israel, and for four I will not convert him: because he hath sold the just man for silver, and the poor man for a pair of shoes.\"},{\"verse\":7,\"text\":\"They bruise the heads of the poor upon the dust of the earth, and turn aside the way of the humble: and the son and his father have gone to the same young woman, to profane my holy name.\"},{\"verse\":8,\"text\":\"And they sat down upon garments laid to pledge by every altar: and drank the wine of the condemned in the house of their God.\"},{\"verse\":9,\"text\":\"Yet I cast out the Amorrhite before their face: whose height was like the height of cedars, and who was strong as an oak: and I destroyed his fruit from above, and his roots beneath.\"},{\"verse\":10,\"text\":\"It is I that brought you up out of the land of Egypt, and I led you forty years through the wilderness, that you might possess the land of the Amorrhite.\"},{\"verse\":11,\"text\":\"And I raised up of your sons for prophets, and of your young men for Nazarites. Is it not so, O ye children of Israel, saith the Lord?\"},{\"verse\":12,\"text\":\"And you will present wine to the Nazarites: and command the prophets, saying: Prophesy not.\"},{\"verse\":13,\"text\":\"Behold, I will screak under you as a wain screaketh that is laden with hay.\"},{\"verse\":14,\"text\":\"And flight shall perish from the swift, and the valiant shall not possess his strength, neither shall the strong save his life.\"},{\"verse\":15,\"text\":\"And he that holdeth the bow shall not stand, and the swift of foot shall not escape, neither shall the rider of the horse save his life.\"},{\"verse\":16,\"text\":\"And the stout of heart among the valiant shall flee away naked in that day, saith the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc dicit Dominus : Super tribus sceleribus Moab, et super quatuor non convertam eum, eo quod incenderit ossa regis Idumææ usque ad cinerem.\"},{\"verse\":2,\"text\":\"Et mittam ignem in Moab, et devorabit ædes Carioth : et morietur in sonitu Moab, in clangore tubæ.\"},{\"verse\":3,\"text\":\"Et disperdam judicem de medio ejus, et omnes principes ejus interficiam cum eo, dicit Dominus.\"},{\"verse\":4,\"text\":\"Hæc dicit Dominus : Super tribus sceleribus Juda, et super quatuor non convertam eum, eo quod abjecerit legem Domini et mandata ejus non custodierit : deceperant enim eos idola sua, post quæ abierant patres eorum.\"},{\"verse\":5,\"text\":\"Et mittam ignem in Juda, et devorabit ædes Jerusalem.\"},{\"verse\":6,\"text\":\"Hæc dicit Dominus : Super tribus sceleribus Israël, et super quatuor non convertam eum, pro eo quod vendiderit pro argento justum, et pauperem pro calceamentis.\"},{\"verse\":7,\"text\":\"Qui conterunt super pulverem terræ capita pauperum, et viam humilium declinant : et filius ac pater ejus ierunt ad puellam, ut violarent nomen sanctum meum.\"},{\"verse\":8,\"text\":\"Et super vestimentis pignoratis accubuerunt juxta omne altare, et vinum damnatorum bibebant in domo Dei sui.\"},{\"verse\":9,\"text\":\"Ego autem exterminavi Amorrhæum a facie eorum, cujus altitudo, cedrorum altitudo ejus, et fortis ipse quasi quercus ; et contrivi fructum ejus desuper, et radices ejus subter.\"},{\"verse\":10,\"text\":\"Ego sum qui ascendere vos feci de terra Ægypti, et duxi vos in deserto quadraginta annis, ut possideretis terram Amorrhæi.\"},{\"verse\":11,\"text\":\"Et suscitavi de filiis vestris in prophetas, et de juvenibus vestris nazaræos. Numquid non ita est, filii Israël ? dicit Dominus.\"},{\"verse\":12,\"text\":\"Et propinabitis nazaræis vinum, et prophetis mandabitis, dicentes : Ne prophetetis.\"},{\"verse\":13,\"text\":\"Ecce ego stridebo subter vos, sicut stridet plaustrum onustum fœno.\"},{\"verse\":14,\"text\":\"Et peribit fuga a veloce, et fortis non obtinebit virtutem suam, et robustus non salvabit animam suam :\"},{\"verse\":15,\"text\":\"et tenens arcum non stabit, et velox pedibus suis non salvabitur, et ascensor equi non salvabit animam suam :\"},{\"verse\":16,\"text\":\"et robustus corde inter fortes nudus fugiet in illa die, dicit Dominus.\"}],\"summary\":\"The judgments with which God threatens Moab, Juda, and Israel for their sins, and their ingratitude.\",\"intro\":null,\"prev\":{\"usfm\":\"AMO\",\"chapter\":1,\"label\":\"Amos 1\"},\"next\":{\"usfm\":\"AMO\",\"chapter\":3,\"label\":\"Amos 3\"}}]]\n"])</script></body></html>
