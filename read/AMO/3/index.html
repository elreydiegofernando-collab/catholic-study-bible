35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Amos<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/AMO/">About <!-- -->Amos</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The evils that shall fall upon Israel for their sins.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hear the word that the Lord hath spoken concerning you, O ye children of Israel: concerning the whole family that I brought up out of the land of Egypt, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>You only have I known of all the families of the earth: therefore will I visit upon you all your iniquities.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Shall two walk together except they be agreed?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Will a lion roar in the forest, if he have no prey? will the lion’s whelp cry out of his den, if he have taken nothing?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Will the bird fall into the snare upon the earth, if there be no fowler? Shall the snare be taken up from the earth, before it hath taken somewhat?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Shall the trumpet sound in a city, and the people not be afraid? Shall there be evil in a city, which the Lord hath not done?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For the Lord God doth nothing without revealing his secret to his servants the prophets.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The lion shall roar, who will not fear? The Lord God hath spoken, who shall not prophesy?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Publish it in the houses of Azotus, and in the houses of the land of Egypt, and say: Assemble yourselves upon the mountains of Samaria, and behold the many follies in the midst thereof, and them that suffer oppression in the inner rooms thereof.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they have not known to do the right thing, saith the Lord, storing up iniquity, and robberies in their houses.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore thus saith the Lord God: The land shall be in tribulation, and shall be compassed about: and thy strength shall be taken away from thee, and thy houses shall be spoiled.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thus saith the Lord: As if a shepherd should get out of the lion’s mouth two legs, or the tip of the ear: so shall the children of Israel be taken out that dwell in Samaria, in a place of a bed, and in the couch of Damascus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hear ye, and testify in the house of Jacob, saith the Lord the God of hosts:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>That in the day when I shall begin to visit the transgressions of Israel, I will visit upon him, and upon the altars of Bethel: and the horns of the altars shall be cut off, and shall fall to the ground.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I will strike the winter house with the summer house: and the houses of ivory shall perish, and many houses shall be destroyed, saith the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audite verbum quod locutus est Dominus super vos, filii Israël, super omnem cognationem quam eduxi de terra Ægypti, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tantummodo vos cognovi ex omnibus cognationibus terræ ; idcirco visitabo super vos omnes iniquitates vestras.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Numquid ambulabunt duo pariter, nisi convenerit eis ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>numquid rugiet leo in saltu, nisi habuerit prædam ? numquid dabit catulus leonis vocem de cubili suo, nisi aliquid apprehenderit ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>numquid cadet avis in laqueum terræ absque aucupe ? numquid auferetur laqueus de terra antequam quid ceperit ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>si clanget tuba in civitate, et populus non expavescet ? si erit malum in civitate, quod Dominus non fecerit ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quia non facit Dominus Deus verbum, nisi revelaverit secretum suum ad servos suos prophetas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Leo rugiet, quis non timebit ? Dominus Deus locutus est, quis non prophetabit ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Auditum facite in ædibus Azoti, et in ædibus terræ Ægypti, et dicite : Congregamini super montes Samariæ, et videte insanias multas in medio ejus, et calumniam patientes in penetralibus ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et nescierunt facere rectum, dicit Dominus, thesaurizantes iniquitatem et rapinas in ædibus suis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Propterea hæc dicit Dominus Deus : Tribulabitur et circuietur terra : et detrahetur ex te fortitudo tua, et diripientur ædes tuæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hæc dicit Dominus : Quomodo si eruat pastor de ore leonis duo crura, aut extremum auriculæ, sic eruentur filii Israël, qui habitant in Samaria in plaga lectuli, et in Damasci grabato.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Audite, et contestamini in domo Jacob, dicit Dominus Deus exercituum ;</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quia in die cum visitare cœpero prævaricationes Israël, super eum visitabo, et super altaria Bethel ; et amputabuntur cornua altaris, et cadent in terram.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et percutiam domum hiemalem cum domo æstiva, et peribunt domus eburneæ, et dissipabuntur ædes multæ, dicit Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Amos 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/AMO/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Amos 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text- l roar, who will not fear? The Lord God hath spoken, who shall not prophesy?\"},{\"verse\":9,\"text\":\"Publish it in the houses of Azotus, and in the houses of the land of Egypt, and say: Assemble yourselves upon the mountains of Samaria, and behold the many follies in the midst thereof, and them that suffer oppression in the inner rooms thereof.\"},{\"verse\":10,\"text\":\"And they have not known to do the right thing, saith the Lord, storing up iniquity, and robberies in their houses.\"},{\"verse\":11,\"text\":\"Therefore thus saith the Lord God: The land shall be in tribulation, and shall be compassed about: and thy strength shall be taken away from thee, and thy houses shall be spoiled.\"},{\"verse\":12,\"text\":\"Thus saith the Lord: As if a shepherd should get out of the lion’s mouth two legs, or the tip of the ear: so shall the children of Israel be taken out that dwell in Samaria, in a place of a bed, and in the couch of Damascus.\"},{\"verse\":13,\"text\":\"Hear ye, and testify in the house of Jacob, saith the Lord the God of hosts:\"},{\"verse\":14,\"text\":\"That in the day when I shall begin to visit the transgressions of Israel, I will visit upon him, and upon the altars of Bethel: and the horns of the altars shall be cut off, and shall fall to the ground.\"},{\"verse\":15,\"text\":\"And I will strike the winter house with the summer house: and the houses of ivory shall perish, and many houses shall be destroyed, saith the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audite verbum quod locutus est Dominus super vos, filii Israël, super omnem cognationem quam eduxi de terra Ægypti, dicens :\"},{\"verse\":2,\"text\":\"Tantummodo vos cognovi ex omnibus cognationibus terræ ; idcirco visitabo super vos omnes iniquitates vestras.\"},{\"verse\":3,\"text\":\"Numquid ambulabunt duo pariter, nisi convenerit eis ?\"},{\"verse\":4,\"text\":\"numquid rugiet leo in saltu, nisi habuerit prædam ? numquid dabit catulus leonis vocem de cubili suo, nisi aliquid apprehenderit ?\"},{\"verse\":5,\"text\":\"numquid cadet avis in laqueum terræ absque aucupe ? numquid auferetur laqueus de terra antequam quid ceperit ?\"},{\"verse\":6,\"text\":\"si clanget tuba in civitate, et populus non expavescet ? si erit malum in civitate, quod Dominus non fecerit ?\"},{\"verse\":7,\"text\":\"Quia non facit Dominus Deus verbum, nisi revelaverit secretum suum ad servos suos prophetas.\"},{\"verse\":8,\"text\":\"Leo rugiet, quis non timebit ? Dominus Deus locutus est, quis non prophetabit ?\"},{\"verse\":9,\"text\":\"Auditum facite in ædibus Azoti, et in ædibus terræ Ægypti, et dicite : Congregamini super montes Samariæ, et videte insanias multas in medio ejus, et calumniam patientes in penetralibus ejus.\"},{\"verse\":10,\"text\":\"Et nescierunt facere rectum, dicit Dominus, thesaurizantes iniquitatem et rapinas in ædibus suis.\"},{\"verse\":11,\"text\":\"Propterea hæc dicit Dominus Deus : Tribulabitur et circuietur terra : et detrahetur ex te fortitudo tua, et diripientur ædes tuæ.\"},{\"verse\":12,\"text\":\"Hæc dicit Dominus : Quomodo si eruat pastor de ore leonis duo crura, aut extremum auriculæ, sic eruentur filii Israël, qui habitant in Samaria in plaga lectuli, et in Damasci grabato.\"},{\"verse\":13,\"text\":\"Audite, et contestamini in domo Jacob, dicit Dominus Deus exercituum ;\"},{\"verse\":14,\"text\":\"quia in die cum visitare cœpero prævaricationes Israël, super eum visitabo, et super altaria Bethel ; et amputabuntur cornua altaris, et cadent in terram.\"},{\"verse\":15,\"text\":\"Et percutiam domum hiemalem cum domo æstiva, et peribunt domus eburneæ, et dissipabuntur ædes multæ, dicit Dominus.\"}],\"summary\":\"The evils that shall fall upon Israel for their sins.\",\"intro\":null,\"prev\":{\"usfm\":\"AMO\",\"chapter\":2,\"label\":\"Amos 2\"},\"next\":{\"usfm\":\"AMO\",\"chapter\":4,\"label\":\"Amos 4\"}}]]\n"])</script></body></html>
