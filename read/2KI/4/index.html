<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>2 Kings 4 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Kings<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->4 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2KI/">About <!-- -->2 Kings</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Miracles of Eliseus. He raiseth a dead child to life.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now a certain woman of the wives of the prophets, cried to Eliseus, saying: Thy servant, my husband, is dead, and thou knowest that thy servant was one that feared God, and behold the creditor is come to take away my two sons to serve him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Eliseus said to her: What wilt thou have me do for thee? Tell me, what hast thou in thy house? And she answered: I, thy handmaid, have nothing in my house but a little oil, to anoint me.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said to her: Go, borrow of all thy neighbours empty vessels, not a few.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And go in, and shut thy door, when thou art within, and thy sons: and pour out thereof into all those vessels: and when they are full, take them away.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>So the woman went, and shut the door upon her, and upon her sons: they brought her the vessels, and she poured in.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when the vessels were full, she said to her son: Bring me yet a vessel. And he answered: I have no more. And the oil stood.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And she came, and told the man of God. And he said: Go, sell the oil, and pay thy creditor: and thou and thy sons live of the rest.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And there was a day when Eliseus passed by Sunam: now there was a great woman there, who detained him to eat bread: and as he passed often that way, he turned into her house to eat bread.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And she said to her husband: I perceive that this is a holy man of God, who often passeth by us.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Let us, therefore, make him a little chamber, and put a little bed in it for him, and a table, and a stool, and a candlestick, that when he cometh to us he may abide there.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now, there was a certain day, when he came, and turned into the chamber, and rested there.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he said to Giezi, his servant: Call this Sunamitess. And when he had called her, and she stood before him,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He said to his servant: Say to her: Behold, thou hast diligently served us in all things; what wilt thou have me to do for thee? Hast thou any business, and wilt thou, that I speak to the king, or to the general of the army? And she answered: I dwell in the midst of my own people.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he said: What will she then that I do for her? And Giezi said: Do not ask, for she hath no son, and her husband is old.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then he bid him call her. And when she was called, and stood before the door,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He said to her: At this time, and this same hour, if life be in company, thou shalt have a son in thy womb. But she answered: Do not, I beseech thee, my lord, thou man of God, do not lie to thy handmaid.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the woman conceived, and brought forth a son in the time, and at the same hour that Eliseus had said.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the child grew. And on a certain day, when he went out to his father to the reapers,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He said to his father: My head acheth, my head acheth. But he said to his servant. Take him, and carry him to his mother.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when he had taken him, and brought him to his mother, she sat him on her knees, until noon, and then he died.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And she went up, and laid him upon the bed of the man of God, and shut the door: and going out,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>She called her husband, and said: Send with me, I beseech thee, one of thy servants, and an ass, that I may run to the man of God, and come again.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he said to her: Why dost thou go to him? to day is neither new moon nor sabbath. She answered: I will go.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And she saddled an ass, and commanded her servant: Drive, and make haste, make no stay in going: And do that which I bid thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>So she went forward, and came to the man of God, to mount Carmel: and when the man of God saw her coming towards, he said to Giezi, his servant: Behold that Sunamitess.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Go, therefore, to meet her, and say to her: Is all well with thee, and with thy husband, and with thy son? And she answered: Well.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when she came to the man of God, to the mount, she caught hold on his feet: and Giezi came to remove her. And the man of God said: Let her alone for her soul is in anguish, and the Lord hath hid it from me, and hath not told me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And she said to him: Did I ask a son of my lord? did I not say to thee: Do not deceive me?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then he said to Giezi: Gird up thy loins, and take my staff in thy hand, and go. If any man meet thee, salute him not: and if any man salute thee, answer him not: and lay my staff upon the face of the child.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But the mother of the child said: As the Lord liveth, and as thy soul liveth, I will not leave thee. He arose, therefore, and followed her.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But Giezi was gone before them, and laid the staff upon the face of the child, and there was no voice nor sense: and he returned to meet him, and told him, saying: The child is not risen.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Eliseus, therefore, went into the house, and behold the child lay dead on his bed:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And going in, he shut the door upon him, and upon the child, and prayed to the Lord.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And he went up, and lay upon the child: and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he bowed himself upon him, and the child’s flesh grew warm.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Then he returned and walked in the house, once to and fro: and he went up, and lay upon him: and the child gaped seven times, and opened his eyes.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he called Giezi, and said to him: Call this Sunamitess. And she being called, went in to him: and he said: Take up thy son.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>She came and fell at his feet, and worshipped upon the ground: and took up her son, and went out.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Eliseus returned to Galgal, and there was a famine in the land, and the sons of the prophets dwelt before him: And he said to one of his servants: Set on the great pot, and boil pottage for the sons of the prophets.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And one went out into the field to gather wild herbs: and he found something like a wild vine, and gathered of it wild gourds of the field, and filled his mantle, and coming back, he shred them into the pot of pottage; for he knew not what it was.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And they poured it out for their companions to eat: and when they had tasted of the pottage, they cried out, saying: Death is in the pot, O man of God. And they could not eat thereof.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>But he said: Bring some meal. And when they had brought it, he cast it into the pot, and said: Pour out for the people, that they may eat. And there was now no bitterness in the pot.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And a certain man came from Baalsalisa, bringing to the man of God, bread of the firstfruits, twenty loaves of barley, and new corn in his scrip. And he said: Give to the people, that they may eat.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And his servant answered him: How much is this, that I should set it before a hundred men? He said again: Give to the people, that they may eat: for thus saith the Lord: They shall eat, and there shall be left.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>So he set it before them: and they ate, and there was left, according to the word of the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Mulier autem quædam de uxoribus prophetarum clamabat ad Eliseum, dicens : Servus tuus vir meus mortuus est, et tu nosti quia servus tuus fuit timens Dominum : et ecce creditor venit ut tollat duos filios meos ad serviendum sibi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cui dixit Eliseus : Quid vis ut faciam tibi ? dic mihi, quid habes in domo tua ? At illa respondit : Non habeo ancilla tua quidquam in domo mea, nisi parum olei quo ungar.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cui ait : Vade, pete mutuo ab omnibus vicinis tuis vasa vacua non pauca,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et ingredere, et claude ostium tuum cum intrinsecus fueris tu, et filii tui : et mitte inde in omnia vasa hæc, et cum plena fuerint, tolles.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ivit itaque mulier, et clausit ostium super se, et super filios suos : illi offerebant vasa, et illa infundebat.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cumque plena fuissent vasa, dixit ad filium suum : Affer mihi adhuc vas. Et ille respondit : Non habeo. Stetitque oleum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venit autem illa, et indicavit homini Dei. Et ille : Vade, inquit, vende oleum, et redde creditori tuo : tu autem, et filii tui vivite de reliquo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Facta est autem quædam dies, et transibat Eliseus per Sunam : erat autem ibi mulier magna, quæ tenuit eum ut comederet panem : cumque frequenter inde transiret, divertebat ad eam ut comederet panem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quæ dixit ad virum suum : Animadverto quod vir Dei sanctus est iste, qui transit per nos frequenter.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Faciamus ergo ei cœnaculum parvum, et ponamus ei in eo lectulum, et mensam, et sellam, et candelabrum, ut cum venerit ad nos, maneat ibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Facta est ergo dies quædam, et veniens divertit in cœnaculum, et requievit ibi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixitque ad Giezi puerum suum : Voca Sunamitidem istam. Qui cum vocasset eam, et illa stetisset coram eo,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>dixit ad puerum suum : Loquere ad eam : Ecce, sedule in omnibus ministrasti nobis : quid vis ut faciam tibi ? numquid habes negotium, et vis ut loquar regi, sive principi militiæ ? Quæ respondit : In medio populi mei habito.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ait : Quid ergo vult ut faciam ei ? Dixitque Giezi : Ne quæras : filium enim non habet, et vir ejus senex est.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Præcepit itaque ut vocaret eam : quæ cum vocata fuisset, et stetisset ante ostium,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>dixit ad eam : In tempore isto, et in hac eadem hora, si vita comes fuerit, habebis in utero filium. At illa respondit : Noli quæso, domine mi vir Dei, noli mentiri ancillæ tuæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et concepit mulier, et peperit filium in tempore, et in hora eadem, qua dixerat Eliseus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Crevit autem puer : et cum esset quædam dies, et egressus isset ad patrem suum, ad messores,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>ait patri suo : Caput meum doleo, caput meum doleo. At ille dixit puero : Tolle, et duc eum ad matrem suam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui cum tulisset, et duxisset eum ad matrem suam, posuit eum illa super genua sua usque ad meridiem, et mortuus est.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ascendit autem, et collocavit eum super lectulum hominis Dei, et clausit ostium : et egressa,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>vocavit virum suum, et ait : Mitte mecum, obsecro, unum de pueris, et asinam, ut excurram usque ad hominem Dei, et revertar.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui ait illi : Quam ob causam vadis ad eum ? hodie non sunt calendæ, neque sabbatum. Quæ respondit : Vadam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Stravitque asinam, et præcepit puero : Mina, et propera : ne mihi moram facias in eundo : et hoc age quod præcipio tibi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Profecta est igitur, et venit ad virum Dei in montem Carmeli : cumque vidisset eam vir Dei e contra, ait ad Giezi puerum suum : Ecce Sunamitis illa.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vade ergo in occursum ejus, et dic ei : Recte ne agitur circa te, et circa virum tuum, et circa filium tuum ? Quæ respondit : Recte.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Cumque venisset ad virum Dei in montem, apprehendit pedes ejus : et accessit Giezi ut amoveret eam. Et ait homo Dei : Dimitte illam : anima enim ejus in amaritudine est, et Dominus celavit a me, et non indicavit mihi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quæ dixit illi : Numquid petivi filium a domino meo ? numquid non dixi tibi : Ne illudas me ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et ille ait ad Giezi : Accinge lumbos tuos, et tolle baculum meum in manu tua, et vade. Si occurrerit tibi homo, non salutes eum : et si salutaverit te quispiam, non respondeas illi : et pones baculum meum super faciem pueri.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Porro mater pueri ait : Vivit Dominus, et vivit anima tua, non dimittam te. Surrexit ergo, et secutus est eam.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Giezi autem præcesserat ante eos, et posuerat baculum super faciem pueri, et non erat vox, neque sensus : reversusque est in occursum ejus, et nuntiavit ei, dicens : Non surrexit puer.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ingressus est ergo Eliseus domum, et ecce puer mortuus jacebat in lectulo ejus :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>ingressusque clausit ostium super se et super puerum, et oravit ad Dominum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et ascendit, et incubuit super puerum : posuitque os suum super os ejus, et oculos suos super oculos ejus, et manus suas super manus ejus : et incurvavit se super eum, et calefacta est caro pueri.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>At ille reversus, deambulavit in domo, semel huc atque illuc : et ascendit, et incubuit super eum : et oscitavit puer septies, aperuitque oculos.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>At ille vocavit Giezi, et dixit ei : Voca Sunamitidem hanc. Quæ vocata, ingressa est ad eum. Qui ait : Tolle filium tuum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Venit illa, et corruit ad pedes ejus, et adoravit super terram : tulitque filium suum, et egressa est.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et Eliseus reversus est in Galgala. Erat autem fames in terra, et filii prophetarum habitabant coram eo. Dixitque uni de pueris suis : Pone ollam grandem, et coque pulmentum filiis prophetarum.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et egressus est unus in agrum ut colligeret herbas agrestes : invenitque quasi vitem silvestrem, et collegit ex ea colocynthidas agri, et implevit pallium suum, et reversus concidit in ollam pulmenti : nesciebat enim quid esset.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Infuderunt ergo sociis ut comederent : cumque gustassent de coctione, clamaverunt, dicentes : Mors in olla, vir Dei. Et non potuerunt comedere.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>At ille : Afferte, inquit, farinam. Cumque tulissent, misit in ollam, et ait : Infunde turbæ, ut comedant. Et non fuit amplius quidquam amaritudinis in olla.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Vir autem quidam venit de Baalsalisa deferens viro Dei panes primitiarum, viginti panes hordeaceos, et frumentum novum in pera sua. At ille dixit : Da populo, ut comedat.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Responditque ei minister ejus : Quantum est hoc, ut apponam centum viris ? Rursum ille ait : Da populo, ut comedat : hæc enim dicit Dominus : Comedent, et supererit.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Posuit itaque coram eis : qui comederunt, et superfuit juxta verbum Domini.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2KI/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Kings 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2KI/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Kings 5</span></span><svg viewBox= "meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"2KI.4\",{\"bookId\":12,\"usfm\":\"2KI\",\"bookName\":\"2 Kings\",\"drName\":\"4 Kings\",\"chapter\":4,\"totalChapters\":25,\"dra\":[{\"verse\":1,\"text\":\"Now a certain woman of the wives of the prophets, cried to Eliseus, saying: Thy servant, my husband, is dead, and thou knowest that thy servant was one that feared God, and behold the creditor is come to take away my two sons to serve him.\"},{\"verse\":2,\"text\":\"And Eliseus said to her: What wilt thou have me do for thee? Tell me, what hast thou in thy house? And she answered: I, thy handmaid, have nothing in my house but a little oil, to anoint me.\"},{\"verse\":3,\"text\":\"And he said to her: Go, borrow of all thy neighbours empty vessels, not a few.\"},{\"verse\":4,\"text\":\"And go in, and shut thy door, when thou art within, and thy sons: and pour out thereof into all those vessels: and when they are full, take them away.\"},{\"verse\":5,\"text\":\"So the woman went, and shut the door upon her, and upon her sons: they brought her the vessels, and she poured in.\"},{\"verse\":6,\"text\":\"And when the vessels were full, she said to her son: Bring me yet a vessel. And he answered: I have no more. And the oil stood.\"},{\"verse\":7,\"text\":\"And she came, and told the man of God. And he said: Go, sell the oil, and pay thy creditor: and thou and thy sons live of the rest.\"},{\"verse\":8,\"text\":\"And there was a day when Eliseus passed by Sunam: now there was a great woman there, who detained him to eat bread: and as he passed often that way, he turned into her house to eat bread.\"},{\"verse\":9,\"text\":\"And she said to her husband: I perceive that this is a holy man of God, who often passeth by us.\"},{\"verse\":10,\"text\":\"Let us, therefore, make him a little chamber, and put a little bed in it for him, and a table, and a stool, and a candlestick, that when he cometh to us he may abide there.\"},{\"verse\":11,\"text\":\"Now, there was a certain day, when he came, and turned into the chamber, and rested there.\"},{\"verse\":12,\"text\":\"And he said to Giezi, his servant: Call this Sunamitess. And when he had called her, and she stood before him,\"},{\"verse\":13,\"text\":\"He said to his servant: Say to her: Behold, thou hast diligently served us in all things; what wilt thou have me to do for thee? Hast thou any business, and wilt thou, that I speak to the king, or to the general of the army? And she answered: I dwell in the midst of my own people.\"},{\"verse\":14,\"text\":\"And he said: What will she then that I do for her? And Giezi said: Do not ask, for she hath no son, and her husband is old.\"},{\"verse\":15,\"text\":\"Then he bid him call her. And when she was called, and stood before the door,\"},{\"verse\":16,\"text\":\"He said to her: At this time, and this same hour, if life be in company, thou shalt have a son in thy womb. But she answered: Do not, I beseech thee, my lord, thou man of God, do not lie to thy handmaid.\"},{\"verse\":17,\"text\":\"And the woman conceived, and brought forth a son in the time, and at the same hour that Eliseus had said.\"},{\"verse\":18,\"text\":\"And the child grew. And on a certain day, when he went out to his father to the reapers,\"},{\"verse\":19,\"text\":\"He said to his father: My head acheth, my head acheth. But he said to his servant. Take him, and carry him to his mother.\"},{\"verse\":20,\"text\":\"And when he had taken him, and brought him to his mother, she sat him on her knees, until noon, and then he died.\"},{\"verse\":21,\"text\":\"And she went up, and laid him upon the bed of the man of God, and shut the door: and going out,\"},{\"verse\":22,\"text\":\"She called her husband, and said: Send with me, I beseech thee, one of thy servants, and an ass, that I may run to the man of God, and come again.\"},{\"verse\":23,\"text\":\"And he said to her: Why dost thou go to him? to day is neither new moon nor sabbath. She answered: I will go.\"},{\"verse\":24,\"text\":\"And she saddled an ass, and commanded her servant: Drive, and make haste, make no stay in going: And do that which I bid thee.\"},{\"verse\":25,\"text\":\"So she went forward, and came to the man of God, to mount Carmel: and when the man of God saw her coming towards, he said to Giezi, his servant: Behold that Sunamitess.\"},{\"verse\":26,\"text\":\"Go, therefore, to meet her, and say to her: Is all well with thee, and with thy husband, and with thy son? And she answered: Well.\"},{\"verse\":27,\"text\":\"And when she came to the man of God, to the mount, she caught hold on his feet: and Giezi came to remove her. And the man of God said: Let her alone for her soul is in anguish, and the Lord hath hid it from me, and hath not told me.\"},{\"verse\":28,\"text\":\"And she said to him: Did I ask a son of my lord? did I not say to thee: Do not deceive me?\"},{\"verse\":29,\"text\":\"Then he said to Giezi: Gird up thy loins, and take my staff in thy hand, and go. If any man meet thee, salute him not: and if any man salute thee, answer him not: and lay my staff upon the face of the child.\"},{\"verse\":30,\"text\":\"But the mother of the child said: As the Lord liveth, and as thy soul liveth, I will not leave thee. He arose, therefore, and followed her.\"},{\"verse\":31,\"text\":\"But Giezi was gone before them, and laid the staff upon the face of the child, and there was no voice nor sense: and he returned to meet him, and told him, saying: The child is not risen.\"},{\"verse\":32,\"text\":\"Eliseus, therefore, went into the house, and behold the child lay dead on his bed:\"},{\"verse\":33,\"text\":\"And going in, he shut the door upon him, and upon the child, and prayed to the Lord.\"},{\"verse\":34,\"text\":\"And he went up, and lay upon the child: and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he bowed himself upon him, and the child’s flesh grew warm.\"},{\"verse\":35,\"text\":\"Then he returned and walked in the house, once to and fro: and he went up, and lay upon him: and the child gaped seven times, and opened his eyes.\"},{\"verse\":36,\"text\":\"And he called Giezi, and said to him: Call this Sunamitess. And she being called, went in to him: and he said: Take up thy son.\"},{\"verse\":37,\"text\":\"She came and fell at his feet, and worshipped upon the ground: and took up her son, and went out.\"},{\"verse\":38,\"text\":\"And Eliseus returned to Galgal, and there was a famine in the land, and the sons of the prophets dwelt before him: And he said to one of his servants: Set on the great pot, and boil pottage for the sons of the prophets.\"},{\"verse\":39,\"text\":\"And one went out into the field to gather wild herbs: and he found something like a wild vine, and gathered of it wild gourds of the field, and filled his mantle, and coming back, he shred them into the pot of pottage; for he knew not what it was.\"},{\"verse\":40,\"text\":\"And they poured it out for their companions to eat: and when they had tasted of the pottage, they cried out, saying: Death is in the pot, O man of God. And they could not eat thereof.\"},{\"verse\":41,\"text\":\"But he said: Bring some meal. And when they had brought it, he cast it into the pot, and said: Pour out for the people, that they may eat. And there was now no bitterness in the pot.\"},{\"verse\":42,\"text\":\"And a certain man came from Baalsalisa, bringing to the man of God, bread of the firstfruits, twenty loaves of barley, and new corn in his scrip. And he said: Give to the people, that they may eat.\"},{\"verse\":43,\"text\":\"And his servant answered him: How much is this, that I should set it before a hundred men? He said again: Give to the people, that they may eat: for thus saith the Lord: They shall eat, and there shall be left.\"},{\"verse\":44,\"text\":\"So he set it before them: and they ate, and there was left, according to the word of the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Mulier autem quædam de uxoribus prophetarum clamabat ad Eliseum, dicens : Servus tuus vir meus mortuus est, et tu nosti quia servus tuus fuit timens Dominum : et ecce creditor venit ut tollat duos filios meos ad serviendum sibi.\"},{\"verse\":2,\"text\":\"Cui dixit Eliseus : Quid vis ut faciam tibi ? dic mihi, quid habes in domo tua ? At illa respondit : Non habeo ancilla tua quidquam in domo mea, nisi parum olei quo ungar.\"},{\"verse\":3,\"text\":\"Cui ait : Vade, pete mutuo ab omnibus vicinis tuis vasa vacua non pauca,\"},{\"verse\":4,\"text\":\"et ingredere, et claude ostium tuum cum intrinsecus fueris tu, et filii tui : et mitte inde in omnia vasa hæc, et cum plena fuerint, tolles.\"},{\"verse\":5,\"text\":\"Ivit itaque mulier, et clausit ostium super se, et super filios suos : illi offerebant vasa, et illa infundebat.\"},{\"verse\":6,\"text\":\"Cumque plena fuissent vasa, dixit ad filium suum : Affer mihi adhuc vas. Et ille respondit : Non habeo. Stetitque oleum.\"},{\"verse\":7,\"text\":\"Venit autem illa, et indicavit homini Dei. Et ille : Vade, inquit, vende oleum, et redde creditori tuo : tu autem, et filii tui vivite de reliquo.\"},{\"verse\":8,\"text\":\"Facta est autem quædam dies, et transibat Eliseus per Sunam : erat autem ibi mulier magna, quæ tenuit eum ut comederet panem : cumque frequenter inde transiret, divertebat ad eam ut comederet panem.\"},{\"verse\":9,\"text\":\"Quæ dixit ad virum suum : Animadverto quod vir Dei sanctus est iste, qui transit per nos frequenter.\"},{\"verse\":10,\"text\":\"Faciamus ergo ei cœnaculum parvum, et ponamus ei in eo lectulum, et mensam, et sellam, et candelabrum, ut cum venerit ad nos, maneat ibi.\"},{\"verse\":11,\"text\":\"Facta est ergo dies quædam, et veniens divertit in cœnaculum, et requievit ibi.\"},{\"verse\":12,\"text\":\"Dixitque ad Giezi puerum suum : Voca Sunamitidem istam. Qui cum vocasset eam, et illa stetisset coram eo,\"},{\"verse\":13,\"text\":\"dixit ad puerum suum : Loquere ad eam : Ecce, sedule in omnibus ministrasti nobis : quid vis ut faciam tibi ? numquid habes negotium, et vis ut loquar regi, sive principi militiæ ? Quæ respondit : In medio populi mei habito.\"},{\"verse\":14,\"text\":\"Et ait : Quid ergo vult ut faciam ei ? Dixitque Giezi : Ne quæras : filium enim non habet, et vir ejus senex est.\"},{\"verse\":15,\"text\":\"Præcepit itaque ut vocaret eam : quæ cum vocata fuisset, et stetisset ante ostium,\"},{\"verse\":16,\"text\":\"dixit ad eam : In tempore isto, et in hac eadem hora, si vita comes fuerit, habebis in utero filium. At illa respondit : Noli quæso, domine mi vir Dei, noli mentiri ancillæ tuæ.\"},{\"verse\":17,\"text\":\"Et concepit mulier, et peperit filium in tempore, et in hora eadem, qua dixerat Eliseus.\"},{\"verse\":18,\"text\":\"Crevit autem puer : et cum esset quædam dies, et egressus isset ad patrem suum, ad messores,\"},{\"verse\":19,\"text\":\"ait patri suo : Caput meum doleo, caput meum doleo. At ille dixit puero : Tolle, et duc eum ad matrem suam.\"},{\"verse\":20,\"text\":\"Qui cum tulisset, et duxisset eum ad matrem suam, posuit eum illa super genua sua usque ad meridiem, et mortuus est.\"},{\"verse\":21,\"text\":\"Ascendit autem, et collocavit eum super lectulum hominis Dei, et clausit ostium : et egressa,\"},{\"verse\":22,\"text\":\"vocavit virum suum, et ait : Mitte mecum, obsecro, unum de pueris, et asinam, ut excurram usque ad hominem Dei, et revertar.\"},{\"verse\":23,\"text\":\"Qui ait illi : Quam ob causam vadis ad eum ? hodie non sunt calendæ, neque sabbatum. Quæ respondit : Vadam.\"},{\"verse\":24,\"text\":\"Stravitque asinam, et præcepit puero : Mina, et propera : ne mihi moram facias in eundo : et hoc age quod præcipio tibi.\"},{\"verse\":25,\"text\":\"Profecta est igitur, et venit ad virum Dei in montem Carmeli : cumque vidisset eam vir Dei e contra, ait ad Giezi puerum suum : Ecce Sunamitis illa.\"},{\"verse\":26,\"text\":\"Vade ergo in occursum ejus, et dic ei : Recte ne agitur circa te, et circa virum tuum, et circa filium tuum ? Quæ respondit : Recte.\"},{\"verse\":27,\"text\":\"Cumque venisset ad virum Dei in montem, apprehendit pedes ejus : et accessit Giezi ut amoveret eam. Et ait homo Dei : Dimitte illam : anima enim ejus in amaritudine est, et Dominus celavit a me, et non indicavit mihi.\"},{\"verse\":28,\"text\":\"Quæ dixit illi : Numquid petivi filium a domino meo ? numquid non dixi tibi : Ne illudas me ?\"},{\"verse\":29,\"text\":\"Et ille ait ad Giezi : Accinge lumbos tuos, et tolle baculum meum in manu tua, et vade. Si occurrerit tibi homo, non salutes eum : et si salutaverit te quispiam, non respondeas illi : et pones baculum meum super faciem pueri.\"},{\"verse\":30,\"text\":\"Porro mater pueri ait : Vivit Dominus, et vivit anima tua, non dimittam te. Surrexit ergo, et secutus est eam.\"},{\"verse\":31,\"text\":\"Giezi autem præcesserat ante eos, et posuerat baculum super faciem pueri, et non erat vox, neque sensus : reversusque est in occursum ejus, et nuntiavit ei, dicens : Non surrexit puer.\"},{\"verse\":32,\"text\":\"Ingressus est ergo Eliseus domum, et ecce puer mortuus jacebat in lectulo ejus :\"},{\"verse\":33,\"text\":\"ingressusque clausit ostium super se et super puerum, et oravit ad Dominum.\"},{\"verse\":34,\"text\":\"Et ascendit, et incubuit super puerum : posuitque os suum super os ejus, et oculos suos super oculos ejus, et manus suas super manus ejus : et incurvavit se super eum, et calefacta est caro pueri.\"},{\"verse\":35,\"text\":\"At ille reversus, deambulavit in domo, semel huc atque illuc : et ascendit, et incubuit super eum : et oscitavit puer septies, aperuitque oculos.\"},{\"verse\":36,\"text\":\"At ille vocavit Giezi, et dixit ei : Voca Sunamitidem hanc. Quæ vocata, ingressa est ad eum. Qui ait : Tolle filium tuum.\"},{\"verse\":37,\"text\":\"Venit illa, et corruit ad pedes ejus, et adoravit super terram : tulitque filium suum, et egressa est.\"},{\"verse\":38,\"text\":\"Et Eliseus reversus est in Galgala. Erat autem fames in terra, et filii prophetarum habitabant coram eo. Dixitque uni de pueris suis : Pone ollam grandem, et coque pulmentum filiis prophetarum.\"},{\"verse\":39,\"text\":\"Et egressus est unus in agrum ut colligeret herbas agrestes : invenitque quasi vitem silvestrem, et collegit ex ea colocynthidas agri, et implevit pallium suum, et reversus concidit in ollam pulmenti : nesciebat enim quid esset.\"},{\"verse\":40,\"text\":\"Infuderunt ergo sociis ut comederent : cumque gustassent de coctione, clamaverunt, dicentes : Mors in olla, vir Dei. Et non potuerunt comedere.\"},{\"verse\":41,\"text\":\"At ille : Afferte, inquit, farinam. Cumque tulissent, misit in ollam, et ait : Infunde turbæ, ut comedant. Et non fuit amplius quidquam amaritudinis in olla.\"},{\"verse\":42,\"text\":\"Vir autem quidam venit de Baalsalisa deferens viro Dei panes primitiarum, viginti panes hordeaceos, et frumentum novum in pera sua. At ille dixit : Da populo, ut comedat.\"},{\"verse\":43,\"text\":\"Responditque ei minister ejus : Quantum est hoc, ut apponam centum viris ? Rursum ille ait : Da populo, ut comedat : hæc enim dicit Dominus : Comedent, et supererit.\"},{\"verse\":44,\"text\":\"Posuit itaque coram eis : qui comederunt, et superfuit juxta verbum Domini.\"}],\"summary\":\"Miracles of Eliseus. He raiseth a dead child to life.\",\"intro\":null,\"prev\":{\"usfm\":\"2KI\",\"chapter\":3,\"label\":\"2 Kings 3\"},\"next\":{\"usfm\":\"2KI\",\"chapter\":5,\"label\":\"2 Kings 5\"}}]]\n"])</script></body></html>
