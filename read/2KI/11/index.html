-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now Athalia, the mother of Ochozias, seeing that her son was dead, arose and slew all the royal seed.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But Josaba the daughter of king Joram, sister of Ochozias, took Joas, the son of Ochozias, and stole him from among the king’s sons that were slain, out of the bedchamber with his nurse: and hid him from the face of Athalia; so that he was not slain.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he was with her six years, hid in the house of the Lord. And Athalia reigned over the land.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And in the seventh year Joiada sent, and taking the centurions and soldiers, brought them in to him into the temple of the Lord, and made a covenant with them: and taking an oath of them in the house of the Lord, shewed them the king’s son:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he commanded them, saying: This is the thing that you must do.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let a third part of you go in on the sabbath, and keep the watch of the king’s house. And let a third part be at the gate of Sur; and let a third part be at the gate behind the dwelling of the shieldbearers; and you shall keep the watch of the house of Messa.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But let two parts of you all that go forth on the sabbath, keep the watch of the house of the Lord about the king.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And you shall compass him round about, having weapons in your hands: and if any man shall enter the precinct of the temple, let him be slain: and you shall be with the king, coming in and going out.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the centurions did according to all things that Joiada the priest, had commanded them: and taking every one their men, that went in on the sabbath, with them that went out in the sabbath, came to Joiada, the priest.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he gave them the spears, and the arms of king David, which were in the house of the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they stood, having every one their weapons in their hands, from the right side of the temple, unto the left side of the altar, and of the temple, about the king.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he brought forth the king’s son, and put the diadem upon him, and the testimony: and they made him king, and anointed him: and clapping their hands, they said: God save the king.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Athalia heard the noise of the people running: and going in to the people into the temple of the Lord,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>She saw the king standing upon a tribunal, as the manner was, and the singers, and the trumpets near him, and all the people of the land rejoicing, and sounding the trumpets: and she rent her garments, and cried: A conspiracy, a conspiracy.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But Joiada commanded the centurions that were over the army, and said to them: Have her forth without the precinct of the temple, and whosoever shall follow her, let him be slain with the sword. For the priest had said: Let her not be slain in the temple of the Lord.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they laid hands on her: and thrust her out by the way by which the horses go in, by the palace, and she was slain there.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Joiada made a covenant between the Lord, and the king, and the people, that they should be the people of the Lord; and between the king and the people.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all the people of the land went into the temple of Baal, and broke down his altars, and his images they broke in pieces thoroughly: they slew also Mathan the priest of Baal before the altar. And the priest set guards in the house of the Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he took the centurions, and the bands of the Cerethi, and the Phelethi, and all the people of the land, and they brought the king from the house of the Lord: and they came by the way of the gate of the shieldbearers into the palace, and he sat on the throne of the kings.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And all the people of the land rejoiced, and the city was quiet: but Athalia was slain with the sword in the king’s house.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Now Joas was seven years old when he began to reign.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Athalia vero mater Ochoziæ, videns mortuum filium suum, surrexit, et interfecit omne semen regium.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tollens autem Josaba filia regis Joram, soror Ochoziæ, Joas filium Ochoziæ, furata est eum de medio filiorum regis qui interficiebantur, et nutricem ejus de triclinio : et abscondit eum a facie Athaliæ ut non interficeretur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Eratque cum ea sex annis clam in domo Domini : porro Athalia regnavit super terram.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Anno autem septimo misit Jojada, et assumens centuriones et milites, introduxit ad se in templum Domini, pepigitque cum eis fœdus : et adjurans eos in domo Domini, ostendit eis filium regis :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et præcepit illis, dicens : Iste est sermo, quem facere debetis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>tertia pars vestrum introëat sabbato, et observet excubias domus regis. Tertia autem pars sit ad portam Sur, et tertia pars sit ad portam quæ est post habitaculum scutariorum : et custodietis excubias domus Messa.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Duæ vero partes e vobis, omnes egredientes sabbato, custodiant excubias domus Domini circa regem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et vallabitis eum, habentes arma in manibus vestris : si quis autem ingressus fuerit septum templi, interficiatur : eritisque cum rege introëunte et egrediente.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et fecerunt centuriones juxta omnia quæ præceperat eis Jojada sacerdos : et assumentes singuli viros suos qui ingrediebantur sabbatum, cum his qui egrediebantur sabbato, venerunt ad Jojadam sacerdotem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui dedit eis hastas et arma regis David, quæ erant in domo Domini.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et steterunt singuli habentes arma in manu sua, a parte templi dextera usque ad partem sinistram altaris et ædis, circum regem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Produxitque filium regis, et posuit super eum diadema et testimonium : feceruntque eum regem, et unxerunt : et plaudentes manu, dixerunt : Vivat rex.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Audivit autem Athalia vocem populi currentis : et ingressa ad turbas in templum Domini,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>vidit regem stantem super tribunal juxta morem, et cantores, et tubas prope eum, omnemque populum terræ lætantem, et canentem tubis : et scidit vestimenta sua, clamavitque : Conjuratio, conjuratio.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Præcepit autem Jojada centurionibus qui erant super exercitum, et ait eis : Educite eam extra septa templi, et quicumque eam secutus fuerit, feriatur gladio. Dixerat enim sacerdos : Non occidatur in templo Domini.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Imposueruntque ei manus, et impegerunt eam per viam introitus equorum, juxta palatium, et interfecta est ibi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Pepigit ergo Jojada fœdus inter Dominum, et inter regem, et inter populum, ut esset populus Domini : et inter regem et populum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ingressusque est omnis populus terræ templum Baal, et destruxerunt aras ejus, et imagines contriverunt valide : Mathan quoque sacerdotem Baal occiderunt coram altari. Et posuit sacerdos custodias in domo Domini.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Tulitque centuriones, et Cerethi et Phelethi legiones, et omnem populum terræ, deduxeruntque regem de domo Domini : et venerunt per viam portæ scutariorum in palatium, et sedit super thronum regum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Lætatusque est omnis populus terræ, et civitas conquievit : Athalia autem occisa est gladio in domo regis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Septemque annorum erat Joas, cum regnare cœpisset.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2KI/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Kings 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2KI/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Kings 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->25<!-- --> ·  a third part be at the gate behind the dwelling of the shieldbearers; and you shall keep the watch of the house of Messa.\"},{\"verse\":7,\"text\":\"But let two parts of you all that go forth on the sabbath, keep the watch of the house of the Lord about the king.\"},{\"verse\":8,\"text\":\"And you shall compass him round about, having weapons in your hands: and if any man shall enter the precinct of the temple, let him be slain: and you shall be with the king, coming in and going out.\"},{\"verse\":9,\"text\":\"And the centurions did according to all things that Joiada the priest, had commanded them: and taking every one their men, that went in on the sabbath, with them that went out in the sabbath, came to Joiada, the priest.\"},{\"verse\":10,\"text\":\"And he gave them the spears, and the arms of king David, which were in the house of the Lord.\"},{\"verse\":11,\"text\":\"And they stood, having every one their weapons in their hands, from the right side of the temple, unto the left side of the altar, and of the temple, about the king.\"},{\"verse\":12,\"text\":\"And he brought forth the king’s son, and put the diadem upon him, and the testimony: and they made him king, and anointed him: and clapping their hands, they said: God save the king.\"},{\"verse\":13,\"text\":\"And Athalia heard the noise of the people running: and going in to the people into the temple of the Lord,\"},{\"verse\":14,\"text\":\"She saw the king standing upon a tribunal, as the manner was, and the singers, and the trumpets near him, and all the people of the land rejoicing, and sounding the trumpets: and she rent her garments, and cried: A conspiracy, a conspiracy.\"},{\"verse\":15,\"text\":\"But Joiada commanded the centurions that were over the army, and said to them: Have her forth without the precinct of the temple, and whosoever shall follow her, let him be slain with the sword. For the priest had said: Let her not be slain in the temple of the Lord.\"},{\"verse\":16,\"text\":\"And they laid hands on her: and thrust her out by the way by which the horses go in, by the palace, and she was slain there.\"},{\"verse\":17,\"text\":\"And Joiada made a covenant between the Lord, and the king, and the people, that they should be the people of the Lord; and between the king and the people.\"},{\"verse\":18,\"text\":\"And all the people of the land went into the temple of Baal, and broke down his altars, and his images they broke in pieces thoroughly: they slew also Mathan the priest of Baal before the altar. And the priest set guards in the house of the Lord.\"},{\"verse\":19,\"text\":\"And he took the centurions, and the bands of the Cerethi, and the Phelethi, and all the people of the land, and they brought the king from the house of the Lord: and they came by the way of the gate of the shieldbearers into the palace, and he sat on the throne of the kings.\"},{\"verse\":20,\"text\":\"And all the people of the land rejoiced, and the city was quiet: but Athalia was slain with the sword in the king’s house.\"},{\"verse\":21,\"text\":\"Now Joas was seven years old when he began to reign.\"}],\"vul\":[{\"verse\":1,\"text\":\"Athalia vero mater Ochoziæ, videns mortuum filium suum, surrexit, et interfecit omne semen regium.\"},{\"verse\":2,\"text\":\"Tollens autem Josaba filia regis Joram, soror Ochoziæ, Joas filium Ochoziæ, furata est eum de medio filiorum regis qui interficiebantur, et nutricem ejus de triclinio : et abscondit eum a facie Athaliæ ut non interficeretur.\"},{\"verse\":3,\"text\":\"Eratque cum ea sex annis clam in domo Domini : porro Athalia regnavit super terram.\"},{\"verse\":4,\"text\":\"Anno autem septimo misit Jojada, et assumens centuriones et milites, introduxit ad se in templum Domini, pepigitque cum eis fœdus : et adjurans eos in domo Domini, ostendit eis filium regis :\"},{\"verse\":5,\"text\":\"et præcepit illis, dicens : Iste est sermo, quem facere debetis :\"},{\"verse\":6,\"text\":\"tertia pars vestrum introëat sabbato, et observet excubias domus regis. Tertia autem pars sit ad portam Sur, et tertia pars sit ad portam quæ est post habitaculum scutariorum : et custodietis excubias domus Messa.\"},{\"verse\":7,\"text\":\"Duæ vero partes e vobis, omnes egredientes sabbato, custodiant excubias domus Domini circa regem.\"},{\"verse\":8,\"text\":\"Et vallabitis eum, habentes arma in manibus vestris : si quis autem ingressus fuerit septum templi, interficiatur : eritisque cum rege introëunte et egrediente.\"},{\"verse\":9,\"text\":\"Et fecerunt centuriones juxta omnia quæ præceperat eis Jojada sacerdos : et assumentes singuli viros suos qui ingrediebantur sabbatum, cum his qui egrediebantur sabbato, venerunt ad Jojadam sacerdotem.\"},{\"verse\":10,\"text\":\"Qui dedit eis hastas et arma regis David, quæ erant in domo Domini.\"},{\"verse\":11,\"text\":\"Et steterunt singuli habentes arma in manu sua, a parte templi dextera usque ad partem sinistram altaris et ædis, circum regem.\"},{\"verse\":12,\"text\":\"Produxitque filium regis, et posuit super eum diadema et testimonium : feceruntque eum regem, et unxerunt : et plaudentes manu, dixerunt : Vivat rex.\"},{\"verse\":13,\"text\":\"Audivit autem Athalia vocem populi currentis : et ingressa ad turbas in templum Domini,\"},{\"verse\":14,\"text\":\"vidit regem stantem super tribunal juxta morem, et cantores, et tubas prope eum, omnemque populum terræ lætantem, et canentem tubis : et scidit vestimenta sua, clamavitque : Conjuratio, conjuratio.\"},{\"verse\":15,\"text\":\"Præcepit autem Jojada centurionibus qui erant super exercitum, et ait eis : Educite eam extra septa templi, et quicumque eam secutus fuerit, feriatur gladio. Dixerat enim sacerdos : Non occidatur in templo Domini.\"},{\"verse\":16,\"text\":\"Imposueruntque ei manus, et impegerunt eam per viam introitus equorum, juxta palatium, et interfecta est ibi.\"},{\"verse\":17,\"text\":\"Pepigit ergo Jojada fœdus inter Dominum, et inter regem, et inter populum, ut esset populus Domini : et inter regem et populum.\"},{\"verse\":18,\"text\":\"Ingressusque est omnis populus terræ templum Baal, et destruxerunt aras ejus, et imagines contriverunt valide : Mathan quoque sacerdotem Baal occiderunt coram altari. Et posuit sacerdos custodias in domo Domini.\"},{\"verse\":19,\"text\":\"Tulitque centuriones, et Cerethi et Phelethi legiones, et omnem populum terræ, deduxeruntque regem de domo Domini : et venerunt per viam portæ scutariorum in palatium, et sedit super thronum regum.\"},{\"verse\":20,\"text\":\"Lætatusque est omnis populus terræ, et civitas conquievit : Athalia autem occisa est gladio in domo regis.\"},{\"verse\":21,\"text\":\"Septemque annorum erat Joas, cum regnare cœpisset.\"}],\"summary\":\"Athalia’s usurpation and tyranny. Joas is made king. Athalia is slain.\",\"intro\":null,\"prev\":{\"usfm\":\"2KI\",\"chapter\":10,\"label\":\"2 Kings 10\"},\"next\":{\"usfm\":\"2KI\",\"chapter\":12,\"label\":\"2 Kings 12\"}}]]\n"])</script></body></html>
