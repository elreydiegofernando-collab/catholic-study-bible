-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Kings<!-- --> <span class="text-stone-500">24</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->4 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2KI/">About <!-- -->2 Kings</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The reign of Joakim, Joachin, and Sedecias.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In his days Nabuchodonosor, king of Babylon came up, and Joakim became his servant three years: then again he rebelled against him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Lord sent against him the rovers of the Chaldees, and the rovers of Syria, and the rovers of Moab, and the rovers of the children of Ammon: and he sent them against Juda, to destroy it, according to the word of the Lord, which he had spoken by his servants, the prophets.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And this came by the word of the Lord against Juda, to remove them from before him for all the sins of Manasses which he did;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And for the innocent blood that he shed, filling Jerusalem with innocent blood: and therefore the Lord would not be appeased.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But the rest of the acts of Joakim, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And Joakim slept with his fathers:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Joachin, his son, reigned in his stead.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the king of Egypt came not again any more out of his own country: for the king of Babylon had taken all that had belonged to the king of Egypt, from the river of Egypt, unto the river Euphrates.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Joachin was eighteen years old when he began to reign, and he reigned three months in Jerusalem: the name of his mother was Nohesta, the daughter of Elnathan, of Jerusalem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he did evil before the Lord, according to all that his father had done.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>At that time the servants of Nabuchodonosor, king of Babylon, came up against Jerusalem, and the city was surrounded with their forts.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Nabuchodonosor, king of Babylon, came to the city, with his servants, to assault it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Joachin, king of Juda, went out to the king of Babylon, he, and his mother, and his servants, and his nobles, and his eunuchs: and the king of Babylon received him in the eighth year of his reign.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he brought out from thence all the treasures of the house of the Lord, and the treasures of the king’s house: and he cut in pieces all the vessels of gold which Solomon, king of Israel, had made in the temple of the Lord, according to the word of the Lord.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he carried away all Jerusalem, and all the princes, and all the valiant men of the army, to the number of ten thousand, into captivity: and every artificer and smith: and none were left, but the poor sort of the people of the land.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he carried away Joachin into Babylon, and the king’s mother, and the king’s wives, and his eunuchs: and the judges of the land he carried into captivity, from Jerusalem, into Babylon.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And all the strong men, seven thousand, and the artificers, and the smiths, a thousand, all that were valiant men, and fit for war: and the king of Babylon led them captives into Babylon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he appointed Matthanias, his uncle, in his stead: and called his name Sedecias.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sedecias was one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem: the name of his mother was Amital, the daughter of Jeremias, of Lobna.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he did evil before the Lord, according to all that Joakim had done.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For the Lord was angry against Jerusalem and against Juda, till he cast them out from his face: and Sedecias revolted from the king of Babylon.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In diebus ejus ascendit Nabuchodonosor rex Babylonis, et factus est ei Joakim servus tribus annis : et rursum rebellavit contra eum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Immisitque ei Dominus latrunculos Chaldæorum, et latrunculos Syriæ, et latrunculos Moab, et latrunculos filiorum Ammon : et immisit eos in Judam ut disperderent eum, juxta verbum Domini quod locutus fuerat per servos suos prophetas.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Factum est autem hoc per verbum Domini contra Judam, ut auferret eum coram se propter peccata Manasse universa quæ fecit,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et propter sanguinem innoxium quem effudit, et implevit Jerusalem cruore innocentium : et ob hanc rem noluit Dominus propitiari.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Reliqua autem sermonum Joakim, et universa quæ fecit, nonne hæc scripta sunt in libro sermonum dierum regum Juda ? Et dormivit Joakim cum patribus suis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et regnavit Joachin filius ejus pro eo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ultra non addidit rex Ægypti ut egrederetur de terra sua : tulerat enim rex Babylonis, a rivo Ægypti usque ad fluvium Euphraten, omnia quæ fuerant regis Ægypti.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Decem et octo annorum erat Joachin cum regnare cœpisset, et tribus mensibus regnavit in Jerusalem : nomen matris ejus Nohesta filia Elnathan de Jerusalem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et fecit malum coram Domino, juxta omnia quæ fecerat pater ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In tempore illo ascenderunt servi Nabuchodonosor regis Babylonis in Jerusalem, et circumdata est urbs munitionibus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Venitque Nabuchodonosor rex Babylonis ad civitatem cum servis suis ut oppugnarent eam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Egressusque est Joachin rex Juda ad regem Babylonis, ipse et mater ejus, et servi ejus, et principes ejus, et eunuchi ejus : et suscepit eum rex Babylonis anno octavo regni sui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et protulit inde omnes thesauros domus Domini, et thesauros domus regiæ : et concidit universa vasa aurea quæ fecerat Salomon rex Israël in templo Domini juxta verbum Domini.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et transtulit omnem Jerusalem, et universos principes, et omnes fortes exercitus, decem millia, in captivitatem, et omnem artificem et clusorem : nihilque relictum est, exceptis pauperibus populi terræ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Transtulit quoque Joachin in Babylonem, et matrem regis, et uxores regis, et eunuchos ejus : et judices terræ duxit in captivitatem de Jerusalem in Babylonem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et omnes viros robustos, septem millia, et artifices, et clusores mille, omnes viros fortes et bellatores : duxitque eos rex Babylonis captivos in Babylonem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et constituit Matthaniam patruum ejus pro eo : imposuitque nomen ei Sedeciam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vigesimum et primum annum ætatis habebat Sedecias cum regnare cœpisset, et undecim annis regnavit in Jerusalem : nomen matris ejus erat Amital filia Jeremiæ de Lobna.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et fecit malum coram Domino, juxta omnia quæ fecerat Joakim.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Irascebatur enim Dominus contra Jerusalem et contra Judam, donec projiceret eos a facie sua : recessitque Sedecias a rege Babylonis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2KI/23/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" s chodonosor, king of Babylon came up, and Joakim became his servant three years: then again he rebelled against him.\"},{\"verse\":2,\"text\":\"And the Lord sent against him the rovers of the Chaldees, and the rovers of Syria, and the rovers of Moab, and the rovers of the children of Ammon: and he sent them against Juda, to destroy it, according to the word of the Lord, which he had spoken by his servants, the prophets.\"},{\"verse\":3,\"text\":\"And this came by the word of the Lord against Juda, to remove them from before him for all the sins of Manasses which he did;\"},{\"verse\":4,\"text\":\"And for the innocent blood that he shed, filling Jerusalem with innocent blood: and therefore the Lord would not be appeased.\"},{\"verse\":5,\"text\":\"But the rest of the acts of Joakim, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And Joakim slept with his fathers:\"},{\"verse\":6,\"text\":\"And Joachin, his son, reigned in his stead.\"},{\"verse\":7,\"text\":\"And the king of Egypt came not again any more out of his own country: for the king of Babylon had taken all that had belonged to the king of Egypt, from the river of Egypt, unto the river Euphrates.\"},{\"verse\":8,\"text\":\"Joachin was eighteen years old when he began to reign, and he reigned three months in Jerusalem: the name of his mother was Nohesta, the daughter of Elnathan, of Jerusalem.\"},{\"verse\":9,\"text\":\"And he did evil before the Lord, according to all that his father had done.\"},{\"verse\":10,\"text\":\"At that time the servants of Nabuchodonosor, king of Babylon, came up against Jerusalem, and the city was surrounded with their forts.\"},{\"verse\":11,\"text\":\"And Nabuchodonosor, king of Babylon, came to the city, with his servants, to assault it.\"},{\"verse\":12,\"text\":\"And Joachin, king of Juda, went out to the king of Babylon, he, and his mother, and his servants, and his nobles, and his eunuchs: and the king of Babylon received him in the eighth year of his reign.\"},{\"verse\":13,\"text\":\"And he brought out from thence all the treasures of the house of the Lord, and the treasures of the king’s house: and he cut in pieces all the vessels of gold which Solomon, king of Israel, had made in the temple of the Lord, according to the word of the Lord.\"},{\"verse\":14,\"text\":\"And he carried away all Jerusalem, and all the princes, and all the valiant men of the army, to the number of ten thousand, into captivity: and every artificer and smith: and none were left, but the poor sort of the people of the land.\"},{\"verse\":15,\"text\":\"And he carried away Joachin into Babylon, and the king’s mother, and the king’s wives, and his eunuchs: and the judges of the land he carried into captivity, from Jerusalem, into Babylon.\"},{\"verse\":16,\"text\":\"And all the strong men, seven thousand, and the artificers, and the smiths, a thousand, all that were valiant men, and fit for war: and the king of Babylon led them captives into Babylon.\"},{\"verse\":17,\"text\":\"And he appointed Matthanias, his uncle, in his stead: and called his name Sedecias.\"},{\"verse\":18,\"text\":\"Sedecias was one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem: the name of his mother was Amital, the daughter of Jeremias, of Lobna.\"},{\"verse\":19,\"text\":\"And he did evil before the Lord, according to all that Joakim had done.\"},{\"verse\":20,\"text\":\"For the Lord was angry against Jerusalem and against Juda, till he cast them out from his face: and Sedecias revolted from the king of Babylon.\"}],\"vul\":[{\"verse\":1,\"text\":\"In diebus ejus ascendit Nabuchodonosor rex Babylonis, et factus est ei Joakim servus tribus annis : et rursum rebellavit contra eum.\"},{\"verse\":2,\"text\":\"Immisitque ei Dominus latrunculos Chaldæorum, et latrunculos Syriæ, et latrunculos Moab, et latrunculos filiorum Ammon : et immisit eos in Judam ut disperderent eum, juxta verbum Domini quod locutus fuerat per servos suos prophetas.\"},{\"verse\":3,\"text\":\"Factum est autem hoc per verbum Domini contra Judam, ut auferret eum coram se propter peccata Manasse universa quæ fecit,\"},{\"verse\":4,\"text\":\"et propter sanguinem innoxium quem effudit, et implevit Jerusalem cruore innocentium : et ob hanc rem noluit Dominus propitiari.\"},{\"verse\":5,\"text\":\"Reliqua autem sermonum Joakim, et universa quæ fecit, nonne hæc scripta sunt in libro sermonum dierum regum Juda ? Et dormivit Joakim cum patribus suis :\"},{\"verse\":6,\"text\":\"et regnavit Joachin filius ejus pro eo.\"},{\"verse\":7,\"text\":\"Et ultra non addidit rex Ægypti ut egrederetur de terra sua : tulerat enim rex Babylonis, a rivo Ægypti usque ad fluvium Euphraten, omnia quæ fuerant regis Ægypti.\"},{\"verse\":8,\"text\":\"Decem et octo annorum erat Joachin cum regnare cœpisset, et tribus mensibus regnavit in Jerusalem : nomen matris ejus Nohesta filia Elnathan de Jerusalem.\"},{\"verse\":9,\"text\":\"Et fecit malum coram Domino, juxta omnia quæ fecerat pater ejus.\"},{\"verse\":10,\"text\":\"In tempore illo ascenderunt servi Nabuchodonosor regis Babylonis in Jerusalem, et circumdata est urbs munitionibus.\"},{\"verse\":11,\"text\":\"Venitque Nabuchodonosor rex Babylonis ad civitatem cum servis suis ut oppugnarent eam.\"},{\"verse\":12,\"text\":\"Egressusque est Joachin rex Juda ad regem Babylonis, ipse et mater ejus, et servi ejus, et principes ejus, et eunuchi ejus : et suscepit eum rex Babylonis anno octavo regni sui.\"},{\"verse\":13,\"text\":\"Et protulit inde omnes thesauros domus Domini, et thesauros domus regiæ : et concidit universa vasa aurea quæ fecerat Salomon rex Israël in templo Domini juxta verbum Domini.\"},{\"verse\":14,\"text\":\"Et transtulit omnem Jerusalem, et universos principes, et omnes fortes exercitus, decem millia, in captivitatem, et omnem artificem et clusorem : nihilque relictum est, exceptis pauperibus populi terræ.\"},{\"verse\":15,\"text\":\"Transtulit quoque Joachin in Babylonem, et matrem regis, et uxores regis, et eunuchos ejus : et judices terræ duxit in captivitatem de Jerusalem in Babylonem.\"},{\"verse\":16,\"text\":\"Et omnes viros robustos, septem millia, et artifices, et clusores mille, omnes viros fortes et bellatores : duxitque eos rex Babylonis captivos in Babylonem.\"},{\"verse\":17,\"text\":\"Et constituit Matthaniam patruum ejus pro eo : imposuitque nomen ei Sedeciam.\"},{\"verse\":18,\"text\":\"Vigesimum et primum annum ætatis habebat Sedecias cum regnare cœpisset, et undecim annis regnavit in Jerusalem : nomen matris ejus erat Amital filia Jeremiæ de Lobna.\"},{\"verse\":19,\"text\":\"Et fecit malum coram Domino, juxta omnia quæ fecerat Joakim.\"},{\"verse\":20,\"text\":\"Irascebatur enim Dominus contra Jerusalem et contra Judam, donec projiceret eos a facie sua : recessitque Sedecias a rege Babylonis.\"}],\"summary\":\"The reign of Joakim, Joachin, and Sedecias.\",\"intro\":null,\"prev\":{\"usfm\":\"2KI\",\"chapter\":23,\"label\":\"2 Kings 23\"},\"next\":{\"usfm\":\"2KI\",\"chapter\":25,\"label\":\"2 Kings 25\"}}]]\n"])</script></body></html>
