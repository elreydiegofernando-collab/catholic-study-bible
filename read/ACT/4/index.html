ic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Peter and John are apprehended. Their constancy. The church is increased.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And as they were speaking to the people the priests and the officer of the temple and the Sadducees came upon them,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Being grieved that they taught the people and preached in Jesus the resurrection from the dead:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And they laid hands upon them and put them in hold till the next day: for it was now evening.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But many of them who had heard the word believed: and the number of the men was made five thousand.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And it came to pass on the morrow, that their princes and ancients and scribes were gathered together in Jerusalem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Annas the high priest and Caiphas and John and Alexander: and as many as were of the kindred of the high priest.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And setting them in the midst, they asked: By what power or by what name, have you done this?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Then Peter, filled with the Holy Ghost, said to them: Ye princes of the people and ancients, hear.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If we this day are examined concerning the good deed done to the infirm man, by what means he hath been made whole:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Be it known to you all and to all the people of Israel, that by the name of our Lord Jesus Christ of Nazareth, whom you crucified, whom God hath raised from the dead, even by him, this man standeth here before you, whole.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>This is the stone which was rejected by you the builders, which is become the head of the corner.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Neither is there salvation in any other. For there is no other name under heaven given to men, whereby we must be saved.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Now seeing the constancy of Peter and of John, understanding that they were illiterate and ignorant men, they wondered: and they knew them that they had been with Jesus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Seeing the man also who had been healed, standing with them, they could say nothing against it.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But they commanded them to go aside out of the council: and they conferred among themselves,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Saying: What shall we do to these men? For indeed a miracle hath been done by them, known to all the inhabitants of Jerusalem. It is manifest: and we cannot deny it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But that it may be no farther spread among the people, let us threaten them that they speak no more in this name to any man.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And calling them, they charged them not to speak at all, nor teach in the name of Jesus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But Peter and John answering, said to them: If it be just, in the sight of God, to hear you rather than God, judge ye.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For we cannot but speak the things which we have seen and heard.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But they, threatening, sent them away, not finding how they might punish them, because of the people: for all men glorified what had been done, in that which had come to pass.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For the man was above forty years old, in whom that miraculous cure had been wrought.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And being let go, they came to their own company and related all that the chief priests and ancients had said to them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Who having heard it, with one accord lifted up their voice to God and said: Lord, thou art he that didst make heaven and earth, the sea and all things that are in them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Who, by the Holy Ghost, by the mouth of our father David, thy servant, hast said: Why did the Gentiles rage: and the people meditate vain things?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The kings of the earth stood up: and the princes assembled together against the Lord and his Christ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For of a truth there assembled together in this city against thy holy child Jesus, whom thou hast anointed, Herod, and Pontius Pilate, with the Gentiles and the people of Israel,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>To do what thy hand and thy counsel decreed to be done.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And now, Lord, behold their threatenings: and grant unto thy servants that with all confidence they may speak thy word,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>By stretching forth thy hand to cures and signs and wonders, to be done by the name of thy holy Son, Jesus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And when they had prayed, the place was moved wherein they were assembled: and they were all filled with the Holy Ghost: and they spoke the word of God with confidence.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the multitude of believers had but one heart and one soul. Neither did any one say that aught of the things which he possessed was his own: but all things were common unto them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And with great power did the Apostles give testimony of the resurrection of Jesus Christ our Lord: and great grace was in them all.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>For neither was there any one needy among them. For as many as were owners of lands or houses sold them and brought the price of the things they sold,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And laid it down before the feet of the apostles. And distribution was made to every one, according as he had need.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And Joseph, who, by the apostles, was surnamed Barnabas (which is, by interpretation, The son of consolation), a Levite, a Cyprian born,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Having land, sold it and brought the price and laid it at the feet of the Apostles.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Loquentibus autem illis ad populum, supervenerunt sacerdotes, et magistratus templi, et sadducæi,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>dolentes quod docerent populum, et annuntiarent in Jesu resurrectionem ex mortuis :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et injecerunt in eos manus, et posuerunt eos in custodiam in crastinum : erat enim jam vespera.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Multi autem eorum qui audierant verbum, crediderunt : et factus est numerus virorum quinque millia.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Factum est autem in crastinum, ut congregarentur principes eorum, et seniores, et scribæ, in Jerusalem :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et Annas princeps sacerdotum, et Caiphas, et Joannes, et Alexander, et quotquot erant de genere sacerdotali.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et statuentes eos in medio, interrogabant : In qua virtute, aut in quo nomine fecistis hoc vos ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tunc repletus Spiritu Sancto Petrus, dixit ad eos : Principes populi, et seniores, audite :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>si nos hodie dijudicamur in benefacto hominis infirmi, in quo iste salvus factus est,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>notum sit omnibus vobis, et omni plebi Israël, quia in nomine Domini nostri Jesu Christi Nazareni, quem vos crucifixistis, quem Deus suscitavit a mortuis, in hoc iste astat coram vobis sanus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hic est lapis qui reprobatus est a vobis ædificantibus, qui factus est in caput anguli :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et non est in alio aliquo salus. Nec enim aliud nomen est sub cælo datum hominibus, in quo oporteat nos salvos fieri.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Videntes autem Petri constantiam, et Joannis, comperto quod homines essent sine litteris, et idiotæ, admirabantur, et cognoscebant eos quoniam cum Jesu fuerant :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>hominem quoque videntes stantem cum eis, qui curatus fuerat, nihil poterant contradicere.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Jusserunt autem eos foras extra concilium secedere : et conferebant ad invicem,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>dicentes : Quid faciemus hominibus istis ? quoniam quidem notum signum factum est per eos omnibus habitantibus Jerusalem : manifestum est, et non possumus negare.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sed ne amplius divulgetur in populum, comminemur eis ne ultra loquantur in nomine hoc ulli hominum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et vocantes eos, denuntiaverunt ne omnino loquerentur neque docerent in nomine Jesu.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Petrus vero et Joannes respondentes, dixerunt ad eos : Si justum est in conspectu Dei vos potius audire quam Deum, judicate.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Non enim possumus quæ vidimus et audivimus non loqui.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At illi comminantes dimiserunt eos, non invenientes quomodo punirent eos propter populum : quia omnes clarificabant id quod factum fuerat in eo quod acciderat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Annorum enim erat amplius quadraginta homo, in quo factum fuerat signum istud sanitatis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dimissi autem venerunt ad suos, et annuntiaverunt eis quanta ad eos principes sacerdotum et seniores dixissent.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui cum audissent, unanimiter levaverunt vocem ad Deum, et dixerunt : Domine, tu es qui fecisti cælum et terram, mare et omnia quæ in eis sunt :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>qui Spiritu Sancto per os patris nostri David pueri tui dixisti : Quare fremuerunt gentes, et populi meditati sunt inania ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Astiterunt reges terræ, et principes convenerunt in unum adversus Dominum, et adversus Christum ejus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Convenerunt enim vere in civitate ista adversus sanctum puerum tuum Jesum, quem unxisti, Herodes et Pontius Pilatus, cum gentibus et populis Israël,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>facere quæ manus tua et consilium tuum decreverunt fieri.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et nunc, Domine, respice in minas eorum, et da servis tuis cum omni fiducia loqui verbum tuum,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>in eo quod manum tuam extendas ad sanitates, et signa, et prodigia fieri per nomen sancti filii tui Jesu.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et cum orassent, motus est locus in quo erant congregati : et repleti sunt omnes Spiritu Sancto, et loquebantur verbum Dei cum fiducia.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Multitudinis autem credentium erat cor unum et anima una : nec quisquam eorum quæ possidebat, aliquid suum esse dicebat, sed erant illis omnia communia.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et virtute magna reddebant Apostoli testimonium resurrectionis Jesu Christi Domini nostri : et gratia magna erat in omnibus illis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Neque enim quisquam egens erat inter illos. Quotquot enim possessores agrorum aut domorum erant, vendentes afferebant pretia eorum quæ vendebant,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et ponebant ante pedes Apostolorum. Dividebatur autem singulis prout cuique opus erat.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Joseph autem, qui cognominatus est Barnabas ab Apostolis (quod est interpretatum, Filius consolationis), Levites, Cyprius genere,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>cum haberet agrum, vendidit eum, et attulit pretium, et posuit ante pedes Apostolorum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/3/"><svg viewBox=" were speaking to the people the priests and the officer of the temple and the Sadducees came upon them,\"},{\"verse\":2,\"text\":\"Being grieved that they taught the people and preached in Jesus the resurrection from the dead:\"},{\"verse\":3,\"text\":\"And they laid hands upon them and put them in hold till the next day: for it was now evening.\"},{\"verse\":4,\"text\":\"But many of them who had heard the word believed: and the number of the men was made five thousand.\"},{\"verse\":5,\"text\":\"And it came to pass on the morrow, that their princes and ancients and scribes were gathered together in Jerusalem.\"},{\"verse\":6,\"text\":\"And Annas the high priest and Caiphas and John and Alexander: and as many as were of the kindred of the high priest.\"},{\"verse\":7,\"text\":\"And setting them in the midst, they asked: By what power or by what name, have you done this?\"},{\"verse\":8,\"text\":\"Then Peter, filled with the Holy Ghost, said to them: Ye princes of the people and ancients, hear.\"},{\"verse\":9,\"text\":\"If we this day are examined concerning the good deed done to the infirm man, by what means he hath been made whole:\"},{\"verse\":10,\"text\":\"Be it known to you all and to all the people of Israel, that by the name of our Lord Jesus Christ of Nazareth, whom you crucified, whom God hath raised from the dead, even by him, this man standeth here before you, whole.\"},{\"verse\":11,\"text\":\"This is the stone which was rejected by you the builders, which is become the head of the corner.\"},{\"verse\":12,\"text\":\"Neither is there salvation in any other. For there is no other name under heaven given to men, whereby we must be saved.\"},{\"verse\":13,\"text\":\"Now seeing the constancy of Peter and of John, understanding that they were illiterate and ignorant men, they wondered: and they knew them that they had been with Jesus.\"},{\"verse\":14,\"text\":\"Seeing the man also who had been healed, standing with them, they could say nothing against it.\"},{\"verse\":15,\"text\":\"But they commanded them to go aside out of the council: and they conferred among themselves,\"},{\"verse\":16,\"text\":\"Saying: What shall we do to these men? For indeed a miracle hath been done by them, known to all the inhabitants of Jerusalem. It is manifest: and we cannot deny it.\"},{\"verse\":17,\"text\":\"But that it may be no farther spread among the people, let us threaten them that they speak no more in this name to any man.\"},{\"verse\":18,\"text\":\"And calling them, they charged them not to speak at all, nor teach in the name of Jesus.\"},{\"verse\":19,\"text\":\"But Peter and John answering, said to them: If it be just, in the sight of God, to hear you rather than God, judge ye.\"},{\"verse\":20,\"text\":\"For we cannot but speak the things which we have seen and heard.\"},{\"verse\":21,\"text\":\"But they, threatening, sent them away, not finding how they might punish them, because of the people: for all men glorified what had been done, in that which had come to pass.\"},{\"verse\":22,\"text\":\"For the man was above forty years old, in whom that miraculous cure had been wrought.\"},{\"verse\":23,\"text\":\"And being let go, they came to their own company and related all that the chief priests and ancients had said to them.\"},{\"verse\":24,\"text\":\"Who having heard it, with one accord lifted up their voice to God and said: Lord, thou art he that didst make heaven and earth, the sea and all things that are in them.\"},{\"verse\":25,\"text\":\"Who, by the Holy Ghost, by the mouth of our father David, thy servant, hast said: Why did the Gentiles rage: and the people meditate vain things?\"},{\"verse\":26,\"text\":\"The kings of the earth stood up: and the princes assembled together against the Lord and his Christ.\"},{\"verse\":27,\"text\":\"For of a truth there assembled together in this city against thy holy child Jesus, whom thou hast anointed, Herod, and Pontius Pilate, with the Gentiles and the people of Israel,\"},{\"verse\":28,\"text\":\"To do what thy hand and thy counsel decreed to be done.\"},{\"verse\":29,\"text\":\"And now, Lord, behold their threatenings: and grant unto thy servants that with all confidence they may speak thy word,\"},{\"verse\":30,\"text\":\"By stretching forth thy hand to cures and signs and wonders, to be done by the name of thy holy Son, Jesus.\"},{\"verse\":31,\"text\":\"And when they had prayed, the place was moved wherein they were assembled: and they were all filled with the Holy Ghost: and they spoke the word of God with confidence.\"},{\"verse\":32,\"text\":\"And the multitude of believers had but one heart and one soul. Neither did any one say that aught of the things which he possessed was his own: but all things were common unto them.\"},{\"verse\":33,\"text\":\"And with great power did the Apostles give testimony of the resurrection of Jesus Christ our Lord: and great grace was in them all.\"},{\"verse\":34,\"text\":\"For neither was there any one needy among them. For as many as were owners of lands or houses sold them and brought the price of the things they sold,\"},{\"verse\":35,\"text\":\"And laid it down before the feet of the apostles. And distribution was made to every one, according as he had need.\"},{\"verse\":36,\"text\":\"And Joseph, who, by the apostles, was surnamed Barnabas (which is, by interpretation, The son of consolation), a Levite, a Cyprian born,\"},{\"verse\":37,\"text\":\"Having land, sold it and brought the price and laid it at the feet of the Apostles.\"}],\"vul\":[{\"verse\":1,\"text\":\"Loquentibus autem illis ad populum, supervenerunt sacerdotes, et magistratus templi, et sadducæi,\"},{\"verse\":2,\"text\":\"dolentes quod docerent populum, et annuntiarent in Jesu resurrectionem ex mortuis :\"},{\"verse\":3,\"text\":\"et injecerunt in eos manus, et posuerunt eos in custodiam in crastinum : erat enim jam vespera.\"},{\"verse\":4,\"text\":\"Multi autem eorum qui audierant verbum, crediderunt : et factus est numerus virorum quinque millia.\"},{\"verse\":5,\"text\":\"Factum est autem in crastinum, ut congregarentur principes eorum, et seniores, et scribæ, in Jerusalem :\"},{\"verse\":6,\"text\":\"et Annas princeps sacerdotum, et Caiphas, et Joannes, et Alexander, et quotquot erant de genere sacerdotali.\"},{\"verse\":7,\"text\":\"Et statuentes eos in medio, interrogabant : In qua virtute, aut in quo nomine fecistis hoc vos ?\"},{\"verse\":8,\"text\":\"Tunc repletus Spiritu Sancto Petrus, dixit ad eos : Principes populi, et seniores, audite :\"},{\"verse\":9,\"text\":\"si nos hodie dijudicamur in benefacto hominis infirmi, in quo iste salvus factus est,\"},{\"verse\":10,\"text\":\"notum sit omnibus vobis, et omni plebi Israël, quia in nomine Domini nostri Jesu Christi Nazareni, quem vos crucifixistis, quem Deus suscitavit a mortuis, in hoc iste astat coram vobis sanus.\"},{\"verse\":11,\"text\":\"Hic est lapis qui reprobatus est a vobis ædificantibus, qui factus est in caput anguli :\"},{\"verse\":12,\"text\":\"et non est in alio aliquo salus. Nec enim aliud nomen est sub cælo datum hominibus, in quo oporteat nos salvos fieri.\"},{\"verse\":13,\"text\":\"Videntes autem Petri constantiam, et Joannis, comperto quod homines essent sine litteris, et idiotæ, admirabantur, et cognoscebant eos quoniam cum Jesu fuerant :\"},{\"verse\":14,\"text\":\"hominem quoque videntes stantem cum eis, qui curatus fuerat, nihil poterant contradicere.\"},{\"verse\":15,\"text\":\"Jusserunt autem eos foras extra concilium secedere : et conferebant ad invicem,\"},{\"verse\":16,\"text\":\"dicentes : Quid faciemus hominibus istis ? quoniam quidem notum signum factum est per eos omnibus habitantibus Jerusalem : manifestum est, et non possumus negare.\"},{\"verse\":17,\"text\":\"Sed ne amplius divulgetur in populum, comminemur eis ne ultra loquantur in nomine hoc ulli hominum.\"},{\"verse\":18,\"text\":\"Et vocantes eos, denuntiaverunt ne omnino loquerentur neque docerent in nomine Jesu.\"},{\"verse\":19,\"text\":\"Petrus vero et Joannes respondentes, dixerunt ad eos : Si justum est in conspectu Dei vos potius audire quam Deum, judicate.\"},{\"verse\":20,\"text\":\"Non enim possumus quæ vidimus et audivimus non loqui.\"},{\"verse\":21,\"text\":\"At illi comminantes dimiserunt eos, non invenientes quomodo punirent eos propter populum : quia omnes clarificabant id quod factum fuerat in eo quod acciderat.\"},{\"verse\":22,\"text\":\"Annorum enim erat amplius quadraginta homo, in quo factum fuerat signum istud sanitatis.\"},{\"verse\":23,\"text\":\"Dimissi autem venerunt ad suos, et annuntiaverunt eis quanta ad eos principes sacerdotum et seniores dixissent.\"},{\"verse\":24,\"text\":\"Qui cum audissent, unanimiter levaverunt vocem ad Deum, et dixerunt : Domine, tu es qui fecisti cælum et terram, mare et omnia quæ in eis sunt :\"},{\"verse\":25,\"text\":\"qui Spiritu Sancto per os patris nostri David pueri tui dixisti : Quare fremuerunt gentes, et populi meditati sunt inania ?\"},{\"verse\":26,\"text\":\"Astiterunt reges terræ, et principes convenerunt in unum adversus Dominum, et adversus Christum ejus.\"},{\"verse\":27,\"text\":\"Convenerunt enim vere in civitate ista adversus sanctum puerum tuum Jesum, quem unxisti, Herodes et Pontius Pilatus, cum gentibus et populis Israël,\"},{\"verse\":28,\"text\":\"facere quæ manus tua et consilium tuum decreverunt fieri.\"},{\"verse\":29,\"text\":\"Et nunc, Domine, respice in minas eorum, et da servis tuis cum omni fiducia loqui verbum tuum,\"},{\"verse\":30,\"text\":\"in eo quod manum tuam extendas ad sanitates, et signa, et prodigia fieri per nomen sancti filii tui Jesu.\"},{\"verse\":31,\"text\":\"Et cum orassent, motus est locus in quo erant congregati : et repleti sunt omnes Spiritu Sancto, et loquebantur verbum Dei cum fiducia.\"},{\"verse\":32,\"text\":\"Multitudinis autem credentium erat cor unum et anima una : nec quisquam eorum quæ possidebat, aliquid suum esse dicebat, sed erant illis omnia communia.\"},{\"verse\":33,\"text\":\"Et virtute magna reddebant Apostoli testimonium resurrectionis Jesu Christi Domini nostri : et gratia magna erat in omnibus illis.\"},{\"verse\":34,\"text\":\"Neque enim quisquam egens erat inter illos. Quotquot enim possessores agrorum aut domorum erant, vendentes afferebant pretia eorum quæ vendebant,\"},{\"verse\":35,\"text\":\"et ponebant ante pedes Apostolorum. Dividebatur autem singulis prout cuique opus erat.\"},{\"verse\":36,\"text\":\"Joseph autem, qui cognominatus est Barnabas ab Apostolis (quod est interpretatum, Filius consolationis), Levites, Cyprius genere,\"},{\"verse\":37,\"text\":\"cum haberet agrum, vendidit eum, et attulit pretium, et posuit ante pedes Apostolorum.\"}],\"summary\":\"Peter and John are apprehended. Their constancy. The church is increased.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":3,\"label\":\"Acts 3\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":5,\"label\":\"Acts 5\"}}]]\n"])</script></body></html>
