lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">25</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul appeals to Caesar. King Agrippa desires to hear him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now when Festus was come into the province, after three days, he went up to Jerusalem from Cæsarea.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the chief priests and principal men of the Jews went unto him against Paul: and they besought him,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Requesting favour against him, that he would command him to be brought to Jerusalem, laying wait to kill him in the way.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But Festus answered: That Paul was kept in Cæsarea: and that he himself would very shortly depart thither.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Let them, therefore, saith he, among you that are able, go down with me and accuse him, if there be any crime in the man.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And having tarried among them no more than eight or ten days, he went down to Cæsarea. And the next day, he sat in the judgment seat and commanded Paul to be brought.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Who being brought, the Jews stood about him, who were come down from Jerusalem, objecting many and grievious causes, which they could not prove:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Paul making answer for himself: Neither against the law of the Jews, nor against the temple, nor against Caesar, have I offended in any thing.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But Festus, willing to shew the Jews a pleasure, answering Paul, said: Wilt thou go up to Jerusalem and there be judged of these things before me?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Then Paul said: I stand at Caesar’s judgment seat, where I ought to be judged. To the Jews I have done no injury, as thou very well knowest.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For if I have injured them or have committed any thing worthy of death, I refuse not to die. But if there be none of these things whereof they accuse me, no man may deliver me to them. I appeal to Caesar.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then Festus, having conferred with the council, answered: Hast thou appealed to Caesar? To Caesar shalt thou go.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And after some days, king Agrippa and Bernice came down to Cæsarea, to salute Festus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And as they tarried there many days, Festus told the king of Paul, saying: A certain man was left prisoner by Felix.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>About whom, when I was at Jerusalem, the chief priests and the ancients of the Jews came unto me, desiring condemnation against him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>To whom I answered: it is not the custom of the Romans to condemn any man, before that he who is accused have his accusers present and have liberty to make his answer, to clear himself of the things laid to his charge.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>When therefore they were come hither, without any delay, on the day following, sitting in the judgment seat, I commanded the man to be brought.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Against whom, when the accusers stood up, they brought no accusation of this which I thought ill of:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But had certain questions of their own superstition against him, and of one Jesus deceased, whom Paul affirmed to be alive.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>I therefore being in a doubt of this manner of question, asked him whether he would go to Jerusalem and there be judged of these things.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But Paul, appealing to be reserved unto the hearing of Augustus, I commanded him to be kept, till I might send him to Caesar.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Agrippa said to Festus: I would also hear the man, myself. To-morrow, said he, thou shalt hear him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And on the next day, when Agrippa and Bernice were come with great pomp and had entered into the hall of audience with the tribunes and principal men of the city, at Festus’ commandment, Paul was brought forth.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Festus saith: King Agrippa and all ye men who are here present with us, you see this man, about whom all the multitude of the Jews dealt with me at Jerusalem, requesting and crying out that he ought not to live any longer.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Yet have I found nothing that he hath committed worthy of death. But forasmuch as he himself hath appealed to Augustus, I have determined to send him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Of whom I have nothing certain to write to my lord. For which cause, I have brought him forth before you, and especially before thee, O king Agrippa, that, examination being made, I may have what to write.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For it seemeth to me unreasonable to send a prisoner and not to signify the things laid to his charge.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Festus ergo cum venisset in provinciam, post triduum ascendit Jerosolymam a Cæsarea.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Adieruntque eum principes sacerdotum et primi Judæorum adversus Paulum : et rogabant eum,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>postulantes gratiam adversus eum, ut juberet perduci eum in Jerusalem, insidias tendentes ut interficerent eum in via.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Festus autem respondit servari Paulum in Cæsarea : se autem maturius profecturum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui ergo in vobis, ait, potentes sunt, descendentes simul, si quod est in viro crimen, accusent eum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Demoratus autem inter eos dies non amplius quam octo aut decem, descendit Cæsaream, et altera die sedit pro tribunali, et jussit Paulum adduci.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui cum perductus esset, circumsteterunt eum, qui ab Jerosolyma descenderant Judæi, multas et graves causas objicientes, quas non poterant probare :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Paulo rationem reddente : Quoniam neque in legem Judæorum, neque in templum, neque in Cæsarem quidquam peccavi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Festus autem volens gratiam præstare Judæis, respondens Paulo, dixit : Vis Jerosolymam ascendere, et ibi de his judicari apud me ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixit autem Paulus : Ad tribunal Cæsaris sto : ibi me oportet judicari : Judæis non nocui, sicut tu melius nosti.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si enim nocui, aut dignum morte aliquid feci, non recuso mori : si vero nihil est eorum quæ hi accusant me, nemo potest me illis donare. Cæsarem appello.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tunc Festus cum concilio locutus, respondit : Cæsarem appellasti ? ad Cæsarem ibis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et cum dies aliquot transacti essent, Agrippa rex et Bernice descenderunt Cæsaream ad salutandum Festum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et cum dies plures ibi demorarentur, Festus regi indicavit de Paulo, dicens : Vir quidam est derelictus a Felice vinctus,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>de quo cum essem Jerosolymis, adierunt me principes sacerdotum et seniores Judæorum, postulantes adversus illum damnationem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ad quos respondi : Quia non est Romanis consuetudo damnare aliquem hominem priusquam is qui accusatur præsentes habeat accusatores, locumque defendendi accipiat ad abluenda crimina.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cum ergo huc convenissent sine ulla dilatione, sequenti die sedens pro tribunali, jussi adduci virum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>De quo, cum stetissent accusatores, nullam causam deferebant, de quibus ego suspicabar malum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quæstiones vero quasdam de sua superstitione habebant adversus eum, et de quodam Jesu defuncto, quem affirmabat Paulus vivere.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hæsitans autem ego de hujusmodi quæstione, dicebam si vellet ire Jerosolymam, et ibi judicari de istis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Paulo autem appellante ut servaretur ad Augusti cognitionem, jussi servari eum, donec mittam eum ad Cæsarem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Agrippa autem dixit ad Festum : Volebam et ipse hominem audire. Cras, inquit, audies eum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Altera autem die cum venisset Agrippa et Bernice cum multa ambitione, et introissent in auditorium cum tribunis et viris principalibus civitatis, jubente Festo, adductus est Paulus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et dicit Festus : Agrippa rex, et omnes qui simul adestis nobiscum viri, videtis hunc de quo omnis multitudo Judæorum interpellavit me Jerosolymis, petentes et acclamantes non oportere eum vivere amplius.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ego vere comperi nihil dignum morte eum admisisse. Ipso autem hoc appellante ad Augustum, judicavi mittere.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>De quo quid certum scribam domino, non habeo. Propter quod produxi eum ad vos, et maxime ad te, rex Agrippa, ut interrogatione facta habeam quid scribam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sine ratione enim mihi videtur mittere vinctum, et causas ejus non significare.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/24/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 24</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/26/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 26</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->25<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Acts 24" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 act ype\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.25\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":25,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"Now when Festus was come into the province, after three days, he went up to Jerusalem from Cæsarea.\"},{\"verse\":2,\"text\":\"And the chief priests and principal men of the Jews went unto him against Paul: and they besought him,\"},{\"verse\":3,\"text\":\"Requesting favour against him, that he would command him to be brought to Jerusalem, laying wait to kill him in the way.\"},{\"verse\":4,\"text\":\"But Festus answered: That Paul was kept in Cæsarea: and that he himself would very shortly depart thither.\"},{\"verse\":5,\"text\":\"Let them, therefore, saith he, among you that are able, go down with me and accuse him, if there be any crime in the man.\"},{\"verse\":6,\"text\":\"And having tarried among them no more than eight or ten days, he went down to Cæsarea. And the next day, he sat in the judgment seat and commanded Paul to be brought.\"},{\"verse\":7,\"text\":\"Who being brought, the Jews stood about him, who were come down from Jerusalem, objecting many and grievious causes, which they could not prove:\"},{\"verse\":8,\"text\":\"Paul making answer for himself: Neither against the law of the Jews, nor against the temple, nor against Caesar, have I offended in any thing.\"},{\"verse\":9,\"text\":\"But Festus, willing to shew the Jews a pleasure, answering Paul, said: Wilt thou go up to Jerusalem and there be judged of these things before me?\"},{\"verse\":10,\"text\":\"Then Paul said: I stand at Caesar’s judgment seat, where I ought to be judged. To the Jews I have done no injury, as thou very well knowest.\"},{\"verse\":11,\"text\":\"For if I have injured them or have committed any thing worthy of death, I refuse not to die. But if there be none of these things whereof they accuse me, no man may deliver me to them. I appeal to Caesar.\"},{\"verse\":12,\"text\":\"Then Festus, having conferred with the council, answered: Hast thou appealed to Caesar? To Caesar shalt thou go.\"},{\"verse\":13,\"text\":\"And after some days, king Agrippa and Bernice came down to Cæsarea, to salute Festus.\"},{\"verse\":14,\"text\":\"And as they tarried there many days, Festus told the king of Paul, saying: A certain man was left prisoner by Felix.\"},{\"verse\":15,\"text\":\"About whom, when I was at Jerusalem, the chief priests and the ancients of the Jews came unto me, desiring condemnation against him.\"},{\"verse\":16,\"text\":\"To whom I answered: it is not the custom of the Romans to condemn any man, before that he who is accused have his accusers present and have liberty to make his answer, to clear himself of the things laid to his charge.\"},{\"verse\":17,\"text\":\"When therefore they were come hither, without any delay, on the day following, sitting in the judgment seat, I commanded the man to be brought.\"},{\"verse\":18,\"text\":\"Against whom, when the accusers stood up, they brought no accusation of this which I thought ill of:\"},{\"verse\":19,\"text\":\"But had certain questions of their own superstition against him, and of one Jesus deceased, whom Paul affirmed to be alive.\"},{\"verse\":20,\"text\":\"I therefore being in a doubt of this manner of question, asked him whether he would go to Jerusalem and there be judged of these things.\"},{\"verse\":21,\"text\":\"But Paul, appealing to be reserved unto the hearing of Augustus, I commanded him to be kept, till I might send him to Caesar.\"},{\"verse\":22,\"text\":\"And Agrippa said to Festus: I would also hear the man, myself. To-morrow, said he, thou shalt hear him.\"},{\"verse\":23,\"text\":\"And on the next day, when Agrippa and Bernice were come with great pomp and had entered into the hall of audience with the tribunes and principal men of the city, at Festus’ commandment, Paul was brought forth.\"},{\"verse\":24,\"text\":\"And Festus saith: King Agrippa and all ye men who are here present with us, you see this man, about whom all the multitude of the Jews dealt with me at Jerusalem, requesting and crying out that he ought not to live any longer.\"},{\"verse\":25,\"text\":\"Yet have I found nothing that he hath committed worthy of death. But forasmuch as he himself hath appealed to Augustus, I have determined to send him.\"},{\"verse\":26,\"text\":\"Of whom I have nothing certain to write to my lord. For which cause, I have brought him forth before you, and especially before thee, O king Agrippa, that, examination being made, I may have what to write.\"},{\"verse\":27,\"text\":\"For it seemeth to me unreasonable to send a prisoner and not to signify the things laid to his charge.\"}],\"vul\":[{\"verse\":1,\"text\":\"Festus ergo cum venisset in provinciam, post triduum ascendit Jerosolymam a Cæsarea.\"},{\"verse\":2,\"text\":\"Adieruntque eum principes sacerdotum et primi Judæorum adversus Paulum : et rogabant eum,\"},{\"verse\":3,\"text\":\"postulantes gratiam adversus eum, ut juberet perduci eum in Jerusalem, insidias tendentes ut interficerent eum in via.\"},{\"verse\":4,\"text\":\"Festus autem respondit servari Paulum in Cæsarea : se autem maturius profecturum.\"},{\"verse\":5,\"text\":\"Qui ergo in vobis, ait, potentes sunt, descendentes simul, si quod est in viro crimen, accusent eum.\"},{\"verse\":6,\"text\":\"Demoratus autem inter eos dies non amplius quam octo aut decem, descendit Cæsaream, et altera die sedit pro tribunali, et jussit Paulum adduci.\"},{\"verse\":7,\"text\":\"Qui cum perductus esset, circumsteterunt eum, qui ab Jerosolyma descenderant Judæi, multas et graves causas objicientes, quas non poterant probare :\"},{\"verse\":8,\"text\":\"Paulo rationem reddente : Quoniam neque in legem Judæorum, neque in templum, neque in Cæsarem quidquam peccavi.\"},{\"verse\":9,\"text\":\"Festus autem volens gratiam præstare Judæis, respondens Paulo, dixit : Vis Jerosolymam ascendere, et ibi de his judicari apud me ?\"},{\"verse\":10,\"text\":\"Dixit autem Paulus : Ad tribunal Cæsaris sto : ibi me oportet judicari : Judæis non nocui, sicut tu melius nosti.\"},{\"verse\":11,\"text\":\"Si enim nocui, aut dignum morte aliquid feci, non recuso mori : si vero nihil est eorum quæ hi accusant me, nemo potest me illis donare. Cæsarem appello.\"},{\"verse\":12,\"text\":\"Tunc Festus cum concilio locutus, respondit : Cæsarem appellasti ? ad Cæsarem ibis.\"},{\"verse\":13,\"text\":\"Et cum dies aliquot transacti essent, Agrippa rex et Bernice descenderunt Cæsaream ad salutandum Festum.\"},{\"verse\":14,\"text\":\"Et cum dies plures ibi demorarentur, Festus regi indicavit de Paulo, dicens : Vir quidam est derelictus a Felice vinctus,\"},{\"verse\":15,\"text\":\"de quo cum essem Jerosolymis, adierunt me principes sacerdotum et seniores Judæorum, postulantes adversus illum damnationem.\"},{\"verse\":16,\"text\":\"Ad quos respondi : Quia non est Romanis consuetudo damnare aliquem hominem priusquam is qui accusatur præsentes habeat accusatores, locumque defendendi accipiat ad abluenda crimina.\"},{\"verse\":17,\"text\":\"Cum ergo huc convenissent sine ulla dilatione, sequenti die sedens pro tribunali, jussi adduci virum.\"},{\"verse\":18,\"text\":\"De quo, cum stetissent accusatores, nullam causam deferebant, de quibus ego suspicabar malum.\"},{\"verse\":19,\"text\":\"Quæstiones vero quasdam de sua superstitione habebant adversus eum, et de quodam Jesu defuncto, quem affirmabat Paulus vivere.\"},{\"verse\":20,\"text\":\"Hæsitans autem ego de hujusmodi quæstione, dicebam si vellet ire Jerosolymam, et ibi judicari de istis.\"},{\"verse\":21,\"text\":\"Paulo autem appellante ut servaretur ad Augusti cognitionem, jussi servari eum, donec mittam eum ad Cæsarem.\"},{\"verse\":22,\"text\":\"Agrippa autem dixit ad Festum : Volebam et ipse hominem audire. Cras, inquit, audies eum.\"},{\"verse\":23,\"text\":\"Altera autem die cum venisset Agrippa et Bernice cum multa ambitione, et introissent in auditorium cum tribunis et viris principalibus civitatis, jubente Festo, adductus est Paulus.\"},{\"verse\":24,\"text\":\"Et dicit Festus : Agrippa rex, et omnes qui simul adestis nobiscum viri, videtis hunc de quo omnis multitudo Judæorum interpellavit me Jerosolymis, petentes et acclamantes non oportere eum vivere amplius.\"},{\"verse\":25,\"text\":\"Ego vere comperi nihil dignum morte eum admisisse. Ipso autem hoc appellante ad Augustum, judicavi mittere.\"},{\"verse\":26,\"text\":\"De quo quid certum scribam domino, non habeo. Propter quod produxi eum ad vos, et maxime ad te, rex Agrippa, ut interrogatione facta habeam quid scribam.\"},{\"verse\":27,\"text\":\"Sine ratione enim mihi videtur mittere vinctum, et causas ejus non significare.\"}],\"summary\":\"Paul appeals to Caesar. King Agrippa desires to hear him.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":24,\"label\":\"Acts 24\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":26,\"label\":\"Acts 26\"}}]]\n"])</script></body></html>
