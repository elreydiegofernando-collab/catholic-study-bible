lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">17</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul preaches to the Thessalonians and Bereans. His discourse to the Athenians.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where there was a synagogue of the Jews.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Paul, according to his custom, went in unto them. And for three sabbath days he reasoned with them out of the scriptures:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Declaring and insinuating that the Christ was to suffer and to rise again from the dead; and that this is Jesus Christ, whom I preach to you.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And some of them believed and were associated to Paul and Silas: and of those that served God and of the Gentiles a great multitude: and of noble women not a few.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But the Jews, moved with envy and taking unto them some wicked men of the vulgar sort and making a tumult, set the city in an uproar: and besetting Jason’s house, sought to bring them out unto the people.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And not finding them, they drew Jason and certain brethren to the rulers of the city, crying: They that set the city in an uproar are come hither also:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Whom Jason hath received. And these all do contrary to the decrees of Caesar, saying that there is another king, Jesus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they stirred up the people: and the rulers of the city, hearing these things,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And having taken satisfaction of Jason and of the rest, they let them go.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But the brethren immediately sent away Paul and Silas by night unto Berea. Who, when they were come thither, went into the synagogue of the Jews.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now these were more noble than those in Thessalonica, who received the word with all eagerness, daily searching the scriptures, whether these things were so.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And many indeed of them believed: and of honourable women that were Gentiles and of men, not a few.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when the Jews of Thessalonica had knowledge that the word of God was also preached by Paul at Berea, they came thither also, stirring up and troubling the multitude.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And then immediately the brethren sent away Paul, to go unto the sea: but Silas and Timothy remained there.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they that conducted Paul brought him as far as Athens: and receiving a commandment from him to Silas and Timothy, that they should come to him with all speed, they departed.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Now whilst Paul waited for them at Athens, his spirit was stirred within him, seeing the city wholly given to idolatry.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He disputed, therefore, in the synagogue with the Jews and with them that served God: and in the market place, every day, with them that were there.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And certain philosophers of the Epicureans and of the Stoics disputed with him. And some said: What is it that this word sower would say? But others: He seemeth to be a setter forth of new gods. Because he preached to them Jesus and the resurrection.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And taking him, they brought him to the Areopagus, saying: May we know what this new doctrine is, which thou speakest of?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For thou bringest in certain new things to our ears. We would know therefore what these things mean.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>(Now all the Athenians and strangers that were there employed themselves in nothing else, but either in telling or in hearing some new thing.)</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But Paul, standing in the midst of the Areopagus, said: Ye men of Athens, I perceive that in all things you are too superstitious.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For passing by and seeing your idols, I found an altar also, on which was written: To the Unknown God. What therefore you worship without knowing it, that I preach to you:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>God, who made the world and all things therein, he being Lord of heaven and earth, dwelleth not in temples made with hands.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Neither is he served with men’s hands, as though he needed any thing: seeing it is he who giveth to all life and breath and all things:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And hath made of one, all mankind, to dwell upon the whole face of the earth, determining appointed times and the limits of their habitation.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>That they should seek God, if haply they may feel after him or find him, although he be not far from every one of us.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For in him we live and move and are: as some also of your own poets said: For we are also his offspring.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Being therefore the offspring of God, we must not suppose the divinity to be like unto gold or silver or stone, the graving of art and device of man.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And God indeed having winked at the times of this ignorance, now declareth unto men that all should every where do penance.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Because he hath appointed a day wherein he will judge the world in equity, by the man whom he hath appointed: giving faith to all, by raising him up from the dead.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when they had heard of the resurrection of the dead, some indeed mocked. But others said: We will hear thee again concerning this matter.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>So Paul went out from among them.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But certain men, adhering to him, did believe: among whom was also Dionysius the Areopagite and a woman named Damaris and others with them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cum autem perambulassent Amphipolim et Apolloniam, venerunt Thessalonicam, ubi erat synagoga Judæorum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Secundum consuetudinem autem Paulus introivit ad eos, et per sabbata tria disserebat eis de Scripturis,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>adaperiens et insinuans quia Christum oportuit pati, et resurgere a mortuis : et quia hic est Jesus Christus, quem ego annuntio vobis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et quidam ex eis crediderunt et adjuncti sunt Paulo et Silæ : et de colentibus gentilibusque multitudo magna, et mulieres nobiles non paucæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Zelantes autem Judæi, assumentesque de vulgo viros quosdam malos, et turba facta, concitaverunt civitatem : et assistentes domui Jasonis quærebant eos producere in populum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et cum non invenissent eos, trahebant Jasonem et quosdam fratres ad principes civitatis, clamantes : Quoniam hi qui urbem concitant, et huc venerunt,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quos suscepit Jason, et hi omnes contra decreta Cæsaris faciunt, regem alium dicentes esse, Jesum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Concitaverunt autem plebem et principes civitatis audientes hæc.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et accepta satisfactione a Jasone et a ceteris, dimiserunt eos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fratres vero confestim per noctem dimiserunt Paulum et Silam in Berœam. Qui cum venissent, in synagogam Judæorum introierunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hi autem erant nobiliores eorum qui sunt Thessalonicæ, qui susceperunt verbum cum omni aviditate, quotidie scrutantes Scripturas, si hæc ita se haberent.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et multi quidem crediderunt ex eis, et mulierum gentilium honestarum, et viri non pauci.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cum autem cognovissent in Thessalonica Judæi quia et Berœæ prædicatum est a Paulo verbum Dei, venerunt et illuc commoventes, et turbantes multitudinem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Statimque tunc Paulum dimiserunt fratres, ut iret usque ad mare : Silas autem et Timotheus remanserunt ibi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui autem deducebant Paulum, perduxerunt eum usque Athenas, et accepto mandato ab eo ad Silam et Timotheum ut quam celeriter venirent ad illum, profecti sunt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Paulus autem cum Athenis eos exspectaret, incitabatur spiritus ejus in ipso, videns idololatriæ deditam civitatem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Disputabat igitur in synagoga cum Judæis et colentibus, et in foro, per omnes dies ad eos qui aderant.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quidam autem epicurei et stoici philosophi disserebant cum eo, et quidam dicebant : Quid vult seminiverbius hic dicere ? Alii vero : Novorum dæmoniorum videtur annuntiator esse : quia Jesum et resurrectionem annuntiabat eis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et apprehensum eum ad Areopagum duxerunt, dicentes : Possumus scire quæ est hæc nova, quæ a te dicitur, doctrina ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>nova enim quædam infers auribus nostris : volumus ergo scire quidnam velint hæc esse.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>(Athenienses autem omnes, et advenæ hospites, ad nihil aliud vacabant nisi aut dicere aut audire aliquid novi.)</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Stans autem Paulus in medio Areopagi, ait : Viri Athenienses, per omnia quasi superstitiosiores vos video.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Præteriens enim, et videns simulacra vestra, inveni et aram in qua scriptum erat : Ignoto Deo. Quod ergo ignorantes colitis, hoc ego annuntio vobis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Deus, qui fecit mundum, et omnia quæ in eo sunt, hic cæli et terræ cum sit Dominus, non in manufactis templis habitat,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>nec manibus humanis colitur indigens aliquo, cum ipse det omnibus vitam, et inspirationem, et omnia :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>fecitque ex uno omne genus hominum inhabitare super universam faciem terræ, definiens statuta tempora, et terminos habitationis eorum,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>quærere Deum si forte attrectent eum, aut inveniant, quamvis non longe sit ab unoquoque nostrum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In ipso enim vivimus, et movemur, et sumus : sicut et quidam vestrorum poëtarum dixerunt : Ipsius enim et genus sumus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Genus ergo cum simus Dei, non debemus æstimare auro, aut argento, aut lapidi, sculpturæ artis, et cogitationis hominis, divinum esse simile.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et tempora quidem hujus ignorantiæ despiciens Deus, nunc annuntiat hominibus ut omnes ubique pœnitentiam agant,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>eo quod statuit diem in quo judicaturus est orbem in æquitate, in viro in quo statuit, fidem præbens omnibus, suscitans eum a mortuis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Cum audissent autem resurrectionem mortuorum, quidam quidem irridebant, quidam vero dixerunt : Audiemus te de hoc iterum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Sic Paulus exivit de medio eorum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quidam vero viri adhærentes ei, crediderunt : in quibus et Dionysius Areopagita, et mulier nomine Damaris, et alii cum eis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholi e\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.17\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":17,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And when they had passed through Amphipolis and Apollonia, they came to Thessalonica, where there was a synagogue of the Jews.\"},{\"verse\":2,\"text\":\"And Paul, according to his custom, went in unto them. And for three sabbath days he reasoned with them out of the scriptures:\"},{\"verse\":3,\"text\":\"Declaring and insinuating that the Christ was to suffer and to rise again from the dead; and that this is Jesus Christ, whom I preach to you.\"},{\"verse\":4,\"text\":\"And some of them believed and were associated to Paul and Silas: and of those that served God and of the Gentiles a great multitude: and of noble women not a few.\"},{\"verse\":5,\"text\":\"But the Jews, moved with envy and taking unto them some wicked men of the vulgar sort and making a tumult, set the city in an uproar: and besetting Jason’s house, sought to bring them out unto the people.\"},{\"verse\":6,\"text\":\"And not finding them, they drew Jason and certain brethren to the rulers of the city, crying: They that set the city in an uproar are come hither also:\"},{\"verse\":7,\"text\":\"Whom Jason hath received. And these all do contrary to the decrees of Caesar, saying that there is another king, Jesus.\"},{\"verse\":8,\"text\":\"And they stirred up the people: and the rulers of the city, hearing these things,\"},{\"verse\":9,\"text\":\"And having taken satisfaction of Jason and of the rest, they let them go.\"},{\"verse\":10,\"text\":\"But the brethren immediately sent away Paul and Silas by night unto Berea. Who, when they were come thither, went into the synagogue of the Jews.\"},{\"verse\":11,\"text\":\"Now these were more noble than those in Thessalonica, who received the word with all eagerness, daily searching the scriptures, whether these things were so.\"},{\"verse\":12,\"text\":\"And many indeed of them believed: and of honourable women that were Gentiles and of men, not a few.\"},{\"verse\":13,\"text\":\"And when the Jews of Thessalonica had knowledge that the word of God was also preached by Paul at Berea, they came thither also, stirring up and troubling the multitude.\"},{\"verse\":14,\"text\":\"And then immediately the brethren sent away Paul, to go unto the sea: but Silas and Timothy remained there.\"},{\"verse\":15,\"text\":\"And they that conducted Paul brought him as far as Athens: and receiving a commandment from him to Silas and Timothy, that they should come to him with all speed, they departed.\"},{\"verse\":16,\"text\":\"Now whilst Paul waited for them at Athens, his spirit was stirred within him, seeing the city wholly given to idolatry.\"},{\"verse\":17,\"text\":\"He disputed, therefore, in the synagogue with the Jews and with them that served God: and in the market place, every day, with them that were there.\"},{\"verse\":18,\"text\":\"And certain philosophers of the Epicureans and of the Stoics disputed with him. And some said: What is it that this word sower would say? But others: He seemeth to be a setter forth of new gods. Because he preached to them Jesus and the resurrection.\"},{\"verse\":19,\"text\":\"And taking him, they brought him to the Areopagus, saying: May we know what this new doctrine is, which thou speakest of?\"},{\"verse\":20,\"text\":\"For thou bringest in certain new things to our ears. We would know therefore what these things mean.\"},{\"verse\":21,\"text\":\"(Now all the Athenians and strangers that were there employed themselves in nothing else, but either in telling or in hearing some new thing.)\"},{\"verse\":22,\"text\":\"But Paul, standing in the midst of the Areopagus, said: Ye men of Athens, I perceive that in all things you are too superstitious.\"},{\"verse\":23,\"text\":\"For passing by and seeing your idols, I found an altar also, on which was written: To the Unknown God. What therefore you worship without knowing it, that I preach to you:\"},{\"verse\":24,\"text\":\"God, who made the world and all things therein, he being Lord of heaven and earth, dwelleth not in temples made with hands.\"},{\"verse\":25,\"text\":\"Neither is he served with men’s hands, as though he needed any thing: seeing it is he who giveth to all life and breath and all things:\"},{\"verse\":26,\"text\":\"And hath made of one, all mankind, to dwell upon the whole face of the earth, determining appointed times and the limits of their habitation.\"},{\"verse\":27,\"text\":\"That they should seek God, if haply they may feel after him or find him, although he be not far from every one of us.\"},{\"verse\":28,\"text\":\"For in him we live and move and are: as some also of your own poets said: For we are also his offspring.\"},{\"verse\":29,\"text\":\"Being therefore the offspring of God, we must not suppose the divinity to be like unto gold or silver or stone, the graving of art and device of man.\"},{\"verse\":30,\"text\":\"And God indeed having winked at the times of this ignorance, now declareth unto men that all should every where do penance.\"},{\"verse\":31,\"text\":\"Because he hath appointed a day wherein he will judge the world in equity, by the man whom he hath appointed: giving faith to all, by raising him up from the dead.\"},{\"verse\":32,\"text\":\"And when they had heard of the resurrection of the dead, some indeed mocked. But others said: We will hear thee again concerning this matter.\"},{\"verse\":33,\"text\":\"So Paul went out from among them.\"},{\"verse\":34,\"text\":\"But certain men, adhering to him, did believe: among whom was also Dionysius the Areopagite and a woman named Damaris and others with them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cum autem perambulassent Amphipolim et Apolloniam, venerunt Thessalonicam, ubi erat synagoga Judæorum.\"},{\"verse\":2,\"text\":\"Secundum consuetudinem autem Paulus introivit ad eos, et per sabbata tria disserebat eis de Scripturis,\"},{\"verse\":3,\"text\":\"adaperiens et insinuans quia Christum oportuit pati, et resurgere a mortuis : et quia hic est Jesus Christus, quem ego annuntio vobis.\"},{\"verse\":4,\"text\":\"Et quidam ex eis crediderunt et adjuncti sunt Paulo et Silæ : et de colentibus gentilibusque multitudo magna, et mulieres nobiles non paucæ.\"},{\"verse\":5,\"text\":\"Zelantes autem Judæi, assumentesque de vulgo viros quosdam malos, et turba facta, concitaverunt civitatem : et assistentes domui Jasonis quærebant eos producere in populum.\"},{\"verse\":6,\"text\":\"Et cum non invenissent eos, trahebant Jasonem et quosdam fratres ad principes civitatis, clamantes : Quoniam hi qui urbem concitant, et huc venerunt,\"},{\"verse\":7,\"text\":\"quos suscepit Jason, et hi omnes contra decreta Cæsaris faciunt, regem alium dicentes esse, Jesum.\"},{\"verse\":8,\"text\":\"Concitaverunt autem plebem et principes civitatis audientes hæc.\"},{\"verse\":9,\"text\":\"Et accepta satisfactione a Jasone et a ceteris, dimiserunt eos.\"},{\"verse\":10,\"text\":\"Fratres vero confestim per noctem dimiserunt Paulum et Silam in Berœam. Qui cum venissent, in synagogam Judæorum introierunt.\"},{\"verse\":11,\"text\":\"Hi autem erant nobiliores eorum qui sunt Thessalonicæ, qui susceperunt verbum cum omni aviditate, quotidie scrutantes Scripturas, si hæc ita se haberent.\"},{\"verse\":12,\"text\":\"Et multi quidem crediderunt ex eis, et mulierum gentilium honestarum, et viri non pauci.\"},{\"verse\":13,\"text\":\"Cum autem cognovissent in Thessalonica Judæi quia et Berœæ prædicatum est a Paulo verbum Dei, venerunt et illuc commoventes, et turbantes multitudinem.\"},{\"verse\":14,\"text\":\"Statimque tunc Paulum dimiserunt fratres, ut iret usque ad mare : Silas autem et Timotheus remanserunt ibi.\"},{\"verse\":15,\"text\":\"Qui autem deducebant Paulum, perduxerunt eum usque Athenas, et accepto mandato ab eo ad Silam et Timotheum ut quam celeriter venirent ad illum, profecti sunt.\"},{\"verse\":16,\"text\":\"Paulus autem cum Athenis eos exspectaret, incitabatur spiritus ejus in ipso, videns idololatriæ deditam civitatem.\"},{\"verse\":17,\"text\":\"Disputabat igitur in synagoga cum Judæis et colentibus, et in foro, per omnes dies ad eos qui aderant.\"},{\"verse\":18,\"text\":\"Quidam autem epicurei et stoici philosophi disserebant cum eo, et quidam dicebant : Quid vult seminiverbius hic dicere ? Alii vero : Novorum dæmoniorum videtur annuntiator esse : quia Jesum et resurrectionem annuntiabat eis.\"},{\"verse\":19,\"text\":\"Et apprehensum eum ad Areopagum duxerunt, dicentes : Possumus scire quæ est hæc nova, quæ a te dicitur, doctrina ?\"},{\"verse\":20,\"text\":\"nova enim quædam infers auribus nostris : volumus ergo scire quidnam velint hæc esse.\"},{\"verse\":21,\"text\":\"(Athenienses autem omnes, et advenæ hospites, ad nihil aliud vacabant nisi aut dicere aut audire aliquid novi.)\"},{\"verse\":22,\"text\":\"Stans autem Paulus in medio Areopagi, ait : Viri Athenienses, per omnia quasi superstitiosiores vos video.\"},{\"verse\":23,\"text\":\"Præteriens enim, et videns simulacra vestra, inveni et aram in qua scriptum erat : Ignoto Deo. Quod ergo ignorantes colitis, hoc ego annuntio vobis.\"},{\"verse\":24,\"text\":\"Deus, qui fecit mundum, et omnia quæ in eo sunt, hic cæli et terræ cum sit Dominus, non in manufactis templis habitat,\"},{\"verse\":25,\"text\":\"nec manibus humanis colitur indigens aliquo, cum ipse det omnibus vitam, et inspirationem, et omnia :\"},{\"verse\":26,\"text\":\"fecitque ex uno omne genus hominum inhabitare super universam faciem terræ, definiens statuta tempora, et terminos habitationis eorum,\"},{\"verse\":27,\"text\":\"quærere Deum si forte attrectent eum, aut inveniant, quamvis non longe sit ab unoquoque nostrum.\"},{\"verse\":28,\"text\":\"In ipso enim vivimus, et movemur, et sumus : sicut et quidam vestrorum poëtarum dixerunt : Ipsius enim et genus sumus.\"},{\"verse\":29,\"text\":\"Genus ergo cum simus Dei, non debemus æstimare auro, aut argento, aut lapidi, sculpturæ artis, et cogitationis hominis, divinum esse simile.\"},{\"verse\":30,\"text\":\"Et tempora quidem hujus ignorantiæ despiciens Deus, nunc annuntiat hominibus ut omnes ubique pœnitentiam agant,\"},{\"verse\":31,\"text\":\"eo quod statuit diem in quo judicaturus est orbem in æquitate, in viro in quo statuit, fidem præbens omnibus, suscitans eum a mortuis.\"},{\"verse\":32,\"text\":\"Cum audissent autem resurrectionem mortuorum, quidam quidem irridebant, quidam vero dixerunt : Audiemus te de hoc iterum.\"},{\"verse\":33,\"text\":\"Sic Paulus exivit de medio eorum.\"},{\"verse\":34,\"text\":\"Quidam vero viri adhærentes ei, crediderunt : in quibus et Dionysius Areopagita, et mulier nomine Damaris, et alii cum eis.\"}],\"summary\":\"Paul preaches to the Thessalonians and Bereans. His discourse to the Athenians.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":16,\"label\":\"Acts 16\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":18,\"label\":\"Acts 18\"}}]]\n"])</script></body></html>
