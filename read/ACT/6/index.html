ata-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Then the twelve, calling together the multitude of the disciples, said: It is not reason that we should leave the word of God and serve tables.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Wherefore, brethren, look ye out among you seven men of good reputation, full of the Holy Ghost and wisdom, whom we may appoint over this business.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But we will give ourselves continually to prayer and to the ministry of the word.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the saying was liked by all the multitude. And they chose Stephen, a man full of faith and of the Holy Ghost, and Philip and Prochorus and Nicanor, and Timon and Parmenas and Nicolas, a proselyte of Antioch.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>These they set before the apostles: and they praying, imposed hands upon them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the word of the Lord increased: and the number of the disciples was multiplied in Jerusalem exceedingly. A great multitude also of the priests obeyed the faith.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Stephen, full of grace and fortitude, did great wonders and signs among the people.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now there arose some, of that which is called the synagogue of the Libertines and of the Cyrenians and of the Alexandrians and of them that were of Cilicia and Asia, disputing with Stephen.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they were not able to resist the wisdom and the spirit that spoke.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Then they suborned men to say they had heard him speak words of blasphemy against Moses and against God.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they stirred up the people and the ancients and the scribes. And running together, they took him and brought him to the council.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they set up false witnesses, who said: This man ceaseth not to speak words against the holy place and the law.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For we have heard him say that this Jesus of Nazareth shall destroy this place and shall change the traditions which Moses delivered unto us.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all that sat in the council, looking on him, saw his face as if it had been the face of an angel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In diebus illis, crescente numero discipulorum, factum est murmur Græcorum adversus Hebræos, eo quod despicerentur in ministerio quotidiano viduæ eorum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Convocantes autem duodecim multitudinem discipulorum, dixerunt : Non est æquum nos derelinquere verbum Dei, et ministrare mensis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Considerate ergo, fratres, viros ex vobis boni testimonii septem, plenos Spiritu Sancto et sapientia, quos constituamus super hoc opus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nos vero orationi et ministerio verbi instantes erimus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et placuit sermo coram omni multitudine. Et elegerunt Stephanum, virum plenum fide et Spiritu Sancto, et Philippum, et Prochorum, et Nicanorem, et Timonem, et Parmenam, et Nicolaum advenam Antiochenum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hos statuerunt ante conspectum Apostolorum : et orantes imposuerunt eis manus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et verbum Domini crescebat, et multiplicabatur numerus discipulorum in Jerusalem valde : multa etiam turba sacerdotum obediebat fidei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Stephanus autem plenus gratia et fortitudine, faciebat prodigia et signa magna in populo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Surrexerunt autem quidam de synagoga quæ appellatur Libertinorum, et Cyrenensium, et Alexandrinorum, et eorum qui erant a Cilicia, et Asia, disputantes cum Stephano :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et non poterant resistere sapientiæ, et Spiritui qui loquebatur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Tunc summiserunt viros, qui dicerent se audivisse eum dicentem verba blasphemiæ in Moysen et in Deum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Commoverunt itaque plebem, et seniores, et scribas : et concurrentes rapuerunt eum, et adduxerunt in concilium,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et statuerunt falsos testes, qui dicerent : Homo iste non cessat loqui verba adversus locum sanctum, et legem :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>audivimus enim eum dicentem quoniam Jesus Nazarenus hic destruet locum istum, et mutabit traditiones quas tradidit nobis Moyses.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et intuentes eum omnes qui sedebant in concilio, viderunt faciem ejus tamquam faciem angeli.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Acts 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"ACT.6\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":6,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And in those days, the number of the disciples increasing, there arose a murmuring of the Greeks against the Hebrews, for that their widows were neglected in the daily ministration.\"},{\"verse\":2,\"text\":\"Then the twelve, calling together the multitude of the disciples, said: It is not reason that we should leave the word of God and serve tables.\"},{\"verse\":3,\"text\":\"Wherefore, brethren, look ye out among you seven men of good reputation, full of the Holy Ghost and wisdom, whom we may appoint over this business.\"},{\"verse\":4,\"text\":\"But we will give ourselves continually to prayer and to the ministry of the word.\"},{\"verse\":5,\"text\":\"And the saying was liked by all the multitude. And they chose Stephen, a man full of faith and of the Holy Ghost, and Philip and Prochorus and Nicanor, and Timon and Parmenas and Nicolas, a proselyte of Antioch.\"},{\"verse\":6,\"text\":\"These they set before the apostles: and they praying, imposed hands upon them.\"},{\"verse\":7,\"text\":\"And the word of the Lord increased: and the number of the disciples was multiplied in Jerusalem exceedingly. A great multitude also of the priests obeyed the faith.\"},{\"verse\":8,\"text\":\"And Stephen, full of grace and fortitude, did great wonders and signs among the people.\"},{\"verse\":9,\"text\":\"Now there arose some, of that which is called the synagogue of the Libertines and of the Cyrenians and of the Alexandrians and of them that were of Cilicia and Asia, disputing with Stephen.\"},{\"verse\":10,\"text\":\"And they were not able to resist the wisdom and the spirit that spoke.\"},{\"verse\":11,\"text\":\"Then they suborned men to say they had heard him speak words of blasphemy against Moses and against God.\"},{\"verse\":12,\"text\":\"And they stirred up the people and the ancients and the scribes. And running together, they took him and brought him to the council.\"},{\"verse\":13,\"text\":\"And they set up false witnesses, who said: This man ceaseth not to speak words against the holy place and the law.\"},{\"verse\":14,\"text\":\"For we have heard him say that this Jesus of Nazareth shall destroy this place and shall change the traditions which Moses delivered unto us.\"},{\"verse\":15,\"text\":\"And all that sat in the council, looking on him, saw his face as if it had been the face of an angel.\"}],\"vul\":[{\"verse\":1,\"text\":\"In diebus illis, crescente numero discipulorum, factum est murmur Græcorum adversus Hebræos, eo quod despicerentur in ministerio quotidiano viduæ eorum.\"},{\"verse\":2,\"text\":\"Convocantes autem duodecim multitudinem discipulorum, dixerunt : Non est æquum nos derelinquere verbum Dei, et ministrare mensis.\"},{\"verse\":3,\"text\":\"Considerate ergo, fratres, viros ex vobis boni testimonii septem, plenos Spiritu Sancto et sapientia, quos constituamus super hoc opus.\"},{\"verse\":4,\"text\":\"Nos vero orationi et ministerio verbi instantes erimus.\"},{\"verse\":5,\"text\":\"Et placuit sermo coram omni multitudine. Et elegerunt Stephanum, virum plenum fide et Spiritu Sancto, et Philippum, et Prochorum, et Nicanorem, et Timonem, et Parmenam, et Nicolaum advenam Antiochenum.\"},{\"verse\":6,\"text\":\"Hos statuerunt ante conspectum Apostolorum : et orantes imposuerunt eis manus.\"},{\"verse\":7,\"text\":\"Et verbum Domini crescebat, et multiplicabatur numerus discipulorum in Jerusalem valde : multa etiam turba sacerdotum obediebat fidei.\"},{\"verse\":8,\"text\":\"Stephanus autem plenus gratia et fortitudine, faciebat prodigia et signa magna in populo.\"},{\"verse\":9,\"text\":\"Surrexerunt autem quidam de synagoga quæ appellatur Libertinorum, et Cyrenensium, et Alexandrinorum, et eorum qui erant a Cilicia, et Asia, disputantes cum Stephano :\"},{\"verse\":10,\"text\":\"et non poterant resistere sapientiæ, et Spiritui qui loquebatur.\"},{\"verse\":11,\"text\":\"Tunc summiserunt viros, qui dicerent se audivisse eum dicentem verba blasphemiæ in Moysen et in Deum.\"},{\"verse\":12,\"text\":\"Commoverunt itaque plebem, et seniores, et scribas : et concurrentes rapuerunt eum, et adduxerunt in concilium,\"},{\"verse\":13,\"text\":\"et statuerunt falsos testes, qui dicerent : Homo iste non cessat loqui verba adversus locum sanctum, et legem :\"},{\"verse\":14,\"text\":\"audivimus enim eum dicentem quoniam Jesus Nazarenus hic destruet locum istum, et mutabit traditiones quas tradidit nobis Moyses.\"},{\"verse\":15,\"text\":\"Et intuentes eum omnes qui sedebant in concilio, viderunt faciem ejus tamquam faciem angeli.\"}],\"summary\":\"The ordination of the seven deacons. The zeal of Stephen.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":5,\"label\":\"Acts 5\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":7,\"label\":\"Acts 7\"}}]]\n"])</script></body></html>
