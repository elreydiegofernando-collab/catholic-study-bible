ic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Philip converts the Samaritans and baptizes the eunuch.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And at that time, there was raised a great persecution against the church which was at Jerusalem. And they were all dispersed through the countries of Judea, and Samaria, except the apostles.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And devout men took order for Stephen’s funeral and made great mourning over him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But Saul made havock of the church, entering in from house to house: and dragging away men and women, committed them to prison.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They therefore that were dispersed went about preaching the word of God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Philip, going down to the city of Samaria, preached Christ unto them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the people with one accord were attentive to those things which were said by Philip, hearing, and seeing the miracles which he did.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For many of them who had unclean spirits, crying with a loud voice, went out.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And many, taken with the palsy, and that were lame, were healed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>There was therefore great joy in that city. Now there was a certain man named Simon who before had been a magician in that city, seducing the people of Samaria, giving out that he was some great one:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>To whom they all gave ear, from the least to the greatest, saying: This man is the power of God, which is called great.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they were attentive to him, because, for a long time, he had bewitched them with his magical practices.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But when they had believed Philip preaching of the kingdom of God, in the name of Jesus Christ, they were baptized, both men and women.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then Simon himself believed also and, being baptized, he adhered to Philip. And being astonished, wondered to see the signs and exceeding great miracles which were done.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now, when the apostles, who were in Jerusalem, had heard that Samaria had received the word of God, they sent unto them Peter and John.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Who, when they were come, prayed for them that they might receive the Holy Ghost.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For he was not as yet come upon any of them: but they were only baptized in the name of the Lord Jesus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then they laid their hands upon them: and they received the Holy Ghost.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when Simon saw that, by the imposition of the hands of the apostles, the Holy Ghost was given, he offered them money,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Saying: Give me also this power, that on whomsoever I shall lay my hands, he may receive the Holy Ghost. But Peter said to him:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Keep thy money to thyself, to perish with thee: because thou hast thought that the gift of God may be purchased with money.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou hast no part nor lot in this matter. For thy heart is not right in the sight of God.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Do penance therefore for this thy wickedness: and pray to God, that perhaps this thought of thy heart may be forgiven thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For I see thou art in the gall of bitterness and in the bonds of iniquity.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Then Simon answering, said: Pray you for me to the Lord that none of these things which you have spoken may come upon me.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they indeed, having testified and preached the word of the Lord, returned to Jerusalem: and preached the gospel to many countries of the Samaritans.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Now an angel of the Lord spoke to Philip, saying: Arise, go towards the south, to the way that goeth down from Jerusalem into Gaza: this is desert.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And rising up, he went. And behold, a man of Ethiopia, an eunuch, of great authority under Candace the queen of the Ethiopians, who had charge over all her treasures, had come to Jerusalem to adore.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he was returning, sitting in his chariot and reading Isaias the prophet.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the Spirit said to Philip: Go near and join thyself to this chariot.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Philip running thither, heard him reading the prophet Isaias. And he said: Thinkest thou that thou understandest what thou readest?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Who said: And how can I, unless some man shew me? And he desired Philip that he would come up and sit with him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the place of the scripture which he was reading was this: He was led as a sheep to the slaughter: and like a lamb without voice before his shearer, so openeth he not his mouth.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In humility his judgment was taken away. His generation who shall declare, for his life shall be taken from the earth?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And the eunuch answering Philip, said: I beseech thee, of whom doth the prophet speak this? Of himself, or of some other man?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Then Philip, opening his mouth and beginning at this scripture, preached unto him Jesus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And as they went on their way, they came to a certain water. And the eunuch said: See, here is water: What doth hinder me from being baptized?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Philip said: If thou believest with all thy heart, thou mayest. And he answering, said: I believe that Jesus Christ is the Son of God.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he commanded the chariot to stand still. And they went down into the water, both Philip and the eunuch. And he baptized him.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And when they were come up out of the water, the Spirit of the Lord took away Philip: and the eunuch saw him no more. And he went on his way rejoicing.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But Philip was found in Azotus: and passing through, he preached the gospel to all the cities, till he came to Cæsarea.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Facta est autem in illa die persecutio magna in ecclesia quæ erat Jerosolymis, et omnes dispersi sunt per regiones Judææ et Samariæ præter Apostolos.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Curaverunt autem Stephanum viri timorati, et fecerunt planctum magnum super eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Saulus autem devastabat ecclesiam per domos intrans, et trahens viros ac mulieres, tradebat in custodiam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Igitur qui dispersi erant pertransibant, evangelizantes verbum Dei.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Philippus autem descendens in civitatem Samariæ, prædicabant illis Christum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Intendebant autem turbæ his quæ a Philippo dicebantur, unanimiter audientes, et videntes signa quæ faciebat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Multi enim eorum qui habebant spiritus immundos, clamantes voce magna exibant. Multi autem paralytici et claudi curati sunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Factum est ergo gaudium magnum in illa civitate.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Vir autem quidam nomine Simon, qui ante fuerat in civitate magus, seducens gentem Samariæ, dicens se esse aliquem magnum :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>cui auscultabant omnes a minimo usque ad maximum, dicentes : Hic est virtus Dei, quæ vocatur magna.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Attendebant autem eum : propter quod multo tempore magiis suis dementasset eos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum vero credidissent Philippo evangelizanti de regno Dei, in nomine Jesu Christi baptizabantur viri ac mulieres.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tunc Simon et ipse credidit : et cum baptizatus esset, adhærebat Philippo. Videns etiam signa et virtutes maximas fieri, stupens admirabatur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cum autem audissent Apostoli qui erant Jerosolymis, quod recepisset Samaria verbum Dei, miserunt ad eos Petrum et Joannem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui cum venissent, oraverunt pro ipsis ut acciperent Spiritum Sanctum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>nondum enim in quemquam illorum venerat, sed baptizati tantum erant in nomine Domini Jesu.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tunc imponebant manus super illos, et accipiebant Spiritum Sanctum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cum vidisset autem Simon quia per impositionem manus Apostolorum daretur Spiritus Sanctus, obtulit eis pecuniam,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>dicens : Date et mihi hanc potestatem, ut cuicumque imposuero manus, accipiat Spiritum Sanctum. Petrus autem dixit ad eum :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Pecunia tua tecum sit in perditionem : quoniam donum Dei existimasti pecunia possideri.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non est tibi pars neque sors in sermone isto : cor enim tuum non est rectum coram Deo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Pœnitentiam itaque age ab hac nequitia tua : et roga Deum, si forte remittatur tibi hæc cogitatio cordis tui.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>In felle enim amaritudinis, et obligatione iniquitatis, video te esse.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Respondens autem Simon, dixit : Precamini vos pro me ad Dominum, ut nihil veniat super me horum quæ dixistis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et illi quidem testificati, et locuti verbum Domini, redibant Jerosolymam, et multis regionibus Samaritanorum evangelizabant.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Angelus autem Domini locutus est ad Philippum, dicens : Surge, et vade contra meridianum, ad viam quæ descendit ab Jerusalem in Gazam : hæc est deserta.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et surgens abiit. Et ecce vir Æthiops, eunuchus, potens Candacis reginæ Æthiopum, qui erat super omnes gazas ejus, venerat adorare in Jerusalem :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et revertebatur sedens super currum suum, legensque Isaiam prophetam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dixit autem Spiritus Philippo : Accede, et adjunge te ad currum istum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Accurrens autem Philippus, audivit eum legentem Isaiam prophetam, et dixit : Putasne intelligis quæ legis ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Qui ait : Et quomodo possum, si non aliquis ostenderit mihi ? Rogavitque Philippum ut ascenderet, et sederet secum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Locus autem Scripturæ quem legebat, erat hic : Tamquam ovis ad occisionem ductus est : et sicut agnus coram tondente se, sine voce, sic non aperuit os suum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In humilitate judicium ejus sublatum est. Generationem ejus quis enarrabit ? quoniam tolletur de terra vita ejus.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Respondens autem eunuchus Philippo, dixit : Obsecro te, de quo propheta dicit hoc ? de se, an de alio aliquo ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Aperiens autem Philippus os suum, et incipiens a Scriptura ista, evangelizavit illi Jesum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dum irent per viam, venerunt ad quamdam aquam : et ait eunuchus : Ecce aqua : quid prohibet me baptizari ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Dixit autem Philippus : Si credis ex toto corde, licet. Et respondens ait : Credo Filium Dei esse Jesum Christum.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et jussit stare currum : et descenderunt uterque in aquam, Philippus et eunuchus, et baptizavit eum.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Cum autem ascendissent de aqua, Spiritus Domini rapuit Philippum, et amplius non vidit eum eunuchus. Ibat autem per viam suam gaudens.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Philippus autem inventus est in Azoto, et pertransiens evangelizabat civitatibus cunctis, donec veniret Cæsaream.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->8<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn ow there was a certain man named Simon who before had been a magician in that city, seducing the people of Samaria, giving out that he was some great one:\"},{\"verse\":10,\"text\":\"To whom they all gave ear, from the least to the greatest, saying: This man is the power of God, which is called great.\"},{\"verse\":11,\"text\":\"And they were attentive to him, because, for a long time, he had bewitched them with his magical practices.\"},{\"verse\":12,\"text\":\"But when they had believed Philip preaching of the kingdom of God, in the name of Jesus Christ, they were baptized, both men and women.\"},{\"verse\":13,\"text\":\"Then Simon himself believed also and, being baptized, he adhered to Philip. And being astonished, wondered to see the signs and exceeding great miracles which were done.\"},{\"verse\":14,\"text\":\"Now, when the apostles, who were in Jerusalem, had heard that Samaria had received the word of God, they sent unto them Peter and John.\"},{\"verse\":15,\"text\":\"Who, when they were come, prayed for them that they might receive the Holy Ghost.\"},{\"verse\":16,\"text\":\"For he was not as yet come upon any of them: but they were only baptized in the name of the Lord Jesus.\"},{\"verse\":17,\"text\":\"Then they laid their hands upon them: and they received the Holy Ghost.\"},{\"verse\":18,\"text\":\"And when Simon saw that, by the imposition of the hands of the apostles, the Holy Ghost was given, he offered them money,\"},{\"verse\":19,\"text\":\"Saying: Give me also this power, that on whomsoever I shall lay my hands, he may receive the Holy Ghost. But Peter said to him:\"},{\"verse\":20,\"text\":\"Keep thy money to thyself, to perish with thee: because thou hast thought that the gift of God may be purchased with money.\"},{\"verse\":21,\"text\":\"Thou hast no part nor lot in this matter. For thy heart is not right in the sight of God.\"},{\"verse\":22,\"text\":\"Do penance therefore for this thy wickedness: and pray to God, that perhaps this thought of thy heart may be forgiven thee.\"},{\"verse\":23,\"text\":\"For I see thou art in the gall of bitterness and in the bonds of iniquity.\"},{\"verse\":24,\"text\":\"Then Simon answering, said: Pray you for me to the Lord that none of these things which you have spoken may come upon me.\"},{\"verse\":25,\"text\":\"And they indeed, having testified and preached the word of the Lord, returned to Jerusalem: and preached the gospel to many countries of the Samaritans.\"},{\"verse\":26,\"text\":\"Now an angel of the Lord spoke to Philip, saying: Arise, go towards the south, to the way that goeth down from Jerusalem into Gaza: this is desert.\"},{\"verse\":27,\"text\":\"And rising up, he went. And behold, a man of Ethiopia, an eunuch, of great authority under Candace the queen of the Ethiopians, who had charge over all her treasures, had come to Jerusalem to adore.\"},{\"verse\":28,\"text\":\"And he was returning, sitting in his chariot and reading Isaias the prophet.\"},{\"verse\":29,\"text\":\"And the Spirit said to Philip: Go near and join thyself to this chariot.\"},{\"verse\":30,\"text\":\"And Philip running thither, heard him reading the prophet Isaias. And he said: Thinkest thou that thou understandest what thou readest?\"},{\"verse\":31,\"text\":\"Who said: And how can I, unless some man shew me? And he desired Philip that he would come up and sit with him.\"},{\"verse\":32,\"text\":\"And the place of the scripture which he was reading was this: He was led as a sheep to the slaughter: and like a lamb without voice before his shearer, so openeth he not his mouth.\"},{\"verse\":33,\"text\":\"In humility his judgment was taken away. His generation who shall declare, for his life shall be taken from the earth?\"},{\"verse\":34,\"text\":\"And the eunuch answering Philip, said: I beseech thee, of whom doth the prophet speak this? Of himself, or of some other man?\"},{\"verse\":35,\"text\":\"Then Philip, opening his mouth and beginning at this scripture, preached unto him Jesus.\"},{\"verse\":36,\"text\":\"And as they went on their way, they came to a certain water. And the eunuch said: See, here is water: What doth hinder me from being baptized?\"},{\"verse\":37,\"text\":\"And Philip said: If thou believest with all thy heart, thou mayest. And he answering, said: I believe that Jesus Christ is the Son of God.\"},{\"verse\":38,\"text\":\"And he commanded the chariot to stand still. And they went down into the water, both Philip and the eunuch. And he baptized him.\"},{\"verse\":39,\"text\":\"And when they were come up out of the water, the Spirit of the Lord took away Philip: and the eunuch saw him no more. And he went on his way rejoicing.\"},{\"verse\":40,\"text\":\"But Philip was found in Azotus: and passing through, he preached the gospel to all the cities, till he came to Cæsarea.\"}],\"vul\":[{\"verse\":1,\"text\":\"Facta est autem in illa die persecutio magna in ecclesia quæ erat Jerosolymis, et omnes dispersi sunt per regiones Judææ et Samariæ præter Apostolos.\"},{\"verse\":2,\"text\":\"Curaverunt autem Stephanum viri timorati, et fecerunt planctum magnum super eum.\"},{\"verse\":3,\"text\":\"Saulus autem devastabat ecclesiam per domos intrans, et trahens viros ac mulieres, tradebat in custodiam.\"},{\"verse\":4,\"text\":\"Igitur qui dispersi erant pertransibant, evangelizantes verbum Dei.\"},{\"verse\":5,\"text\":\"Philippus autem descendens in civitatem Samariæ, prædicabant illis Christum.\"},{\"verse\":6,\"text\":\"Intendebant autem turbæ his quæ a Philippo dicebantur, unanimiter audientes, et videntes signa quæ faciebat.\"},{\"verse\":7,\"text\":\"Multi enim eorum qui habebant spiritus immundos, clamantes voce magna exibant. Multi autem paralytici et claudi curati sunt.\"},{\"verse\":8,\"text\":\"Factum est ergo gaudium magnum in illa civitate.\"},{\"verse\":9,\"text\":\"Vir autem quidam nomine Simon, qui ante fuerat in civitate magus, seducens gentem Samariæ, dicens se esse aliquem magnum :\"},{\"verse\":10,\"text\":\"cui auscultabant omnes a minimo usque ad maximum, dicentes : Hic est virtus Dei, quæ vocatur magna.\"},{\"verse\":11,\"text\":\"Attendebant autem eum : propter quod multo tempore magiis suis dementasset eos.\"},{\"verse\":12,\"text\":\"Cum vero credidissent Philippo evangelizanti de regno Dei, in nomine Jesu Christi baptizabantur viri ac mulieres.\"},{\"verse\":13,\"text\":\"Tunc Simon et ipse credidit : et cum baptizatus esset, adhærebat Philippo. Videns etiam signa et virtutes maximas fieri, stupens admirabatur.\"},{\"verse\":14,\"text\":\"Cum autem audissent Apostoli qui erant Jerosolymis, quod recepisset Samaria verbum Dei, miserunt ad eos Petrum et Joannem.\"},{\"verse\":15,\"text\":\"Qui cum venissent, oraverunt pro ipsis ut acciperent Spiritum Sanctum :\"},{\"verse\":16,\"text\":\"nondum enim in quemquam illorum venerat, sed baptizati tantum erant in nomine Domini Jesu.\"},{\"verse\":17,\"text\":\"Tunc imponebant manus super illos, et accipiebant Spiritum Sanctum.\"},{\"verse\":18,\"text\":\"Cum vidisset autem Simon quia per impositionem manus Apostolorum daretur Spiritus Sanctus, obtulit eis pecuniam,\"},{\"verse\":19,\"text\":\"dicens : Date et mihi hanc potestatem, ut cuicumque imposuero manus, accipiat Spiritum Sanctum. Petrus autem dixit ad eum :\"},{\"verse\":20,\"text\":\"Pecunia tua tecum sit in perditionem : quoniam donum Dei existimasti pecunia possideri.\"},{\"verse\":21,\"text\":\"Non est tibi pars neque sors in sermone isto : cor enim tuum non est rectum coram Deo.\"},{\"verse\":22,\"text\":\"Pœnitentiam itaque age ab hac nequitia tua : et roga Deum, si forte remittatur tibi hæc cogitatio cordis tui.\"},{\"verse\":23,\"text\":\"In felle enim amaritudinis, et obligatione iniquitatis, video te esse.\"},{\"verse\":24,\"text\":\"Respondens autem Simon, dixit : Precamini vos pro me ad Dominum, ut nihil veniat super me horum quæ dixistis.\"},{\"verse\":25,\"text\":\"Et illi quidem testificati, et locuti verbum Domini, redibant Jerosolymam, et multis regionibus Samaritanorum evangelizabant.\"},{\"verse\":26,\"text\":\"Angelus autem Domini locutus est ad Philippum, dicens : Surge, et vade contra meridianum, ad viam quæ descendit ab Jerusalem in Gazam : hæc est deserta.\"},{\"verse\":27,\"text\":\"Et surgens abiit. Et ecce vir Æthiops, eunuchus, potens Candacis reginæ Æthiopum, qui erat super omnes gazas ejus, venerat adorare in Jerusalem :\"},{\"verse\":28,\"text\":\"et revertebatur sedens super currum suum, legensque Isaiam prophetam.\"},{\"verse\":29,\"text\":\"Dixit autem Spiritus Philippo : Accede, et adjunge te ad currum istum.\"},{\"verse\":30,\"text\":\"Accurrens autem Philippus, audivit eum legentem Isaiam prophetam, et dixit : Putasne intelligis quæ legis ?\"},{\"verse\":31,\"text\":\"Qui ait : Et quomodo possum, si non aliquis ostenderit mihi ? Rogavitque Philippum ut ascenderet, et sederet secum.\"},{\"verse\":32,\"text\":\"Locus autem Scripturæ quem legebat, erat hic : Tamquam ovis ad occisionem ductus est : et sicut agnus coram tondente se, sine voce, sic non aperuit os suum.\"},{\"verse\":33,\"text\":\"In humilitate judicium ejus sublatum est. Generationem ejus quis enarrabit ? quoniam tolletur de terra vita ejus.\"},{\"verse\":34,\"text\":\"Respondens autem eunuchus Philippo, dixit : Obsecro te, de quo propheta dicit hoc ? de se, an de alio aliquo ?\"},{\"verse\":35,\"text\":\"Aperiens autem Philippus os suum, et incipiens a Scriptura ista, evangelizavit illi Jesum.\"},{\"verse\":36,\"text\":\"Et dum irent per viam, venerunt ad quamdam aquam : et ait eunuchus : Ecce aqua : quid prohibet me baptizari ?\"},{\"verse\":37,\"text\":\"Dixit autem Philippus : Si credis ex toto corde, licet. Et respondens ait : Credo Filium Dei esse Jesum Christum.\"},{\"verse\":38,\"text\":\"Et jussit stare currum : et descenderunt uterque in aquam, Philippus et eunuchus, et baptizavit eum.\"},{\"verse\":39,\"text\":\"Cum autem ascendissent de aqua, Spiritus Domini rapuit Philippum, et amplius non vidit eum eunuchus. Ibat autem per viam suam gaudens.\"},{\"verse\":40,\"text\":\"Philippus autem inventus est in Azoto, et pertransiens evangelizabat civitatibus cunctis, donec veniret Cæsaream.\"}],\"summary\":\"Philip converts the Samaritans and baptizes the eunuch.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":7,\"label\":\"Acts 7\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":9,\"label\":\"Acts 9\"}}]]\n"])</script></body></html>
