.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">24</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul defends his innocence before Felix the governor. He preaches the faith to him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And after five days, the high priest, Ananias, came down with some ancients and one Tertullus, an orator, who went to the governor against Paul.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Paul being called for, Tertullus began to accuse him, saying: Whereas, through thee we live in much peace and many things are rectified by thy providence,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>We accept it always and in all places, most excellent Felix, with all thanksgiving.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But that I be no further tedious to thee, I desire thee of thy clemency to hear us in a few words.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>We have found this to be a pestilent man and raising seditions among all the Jews throughout the world: and author of the sedition of the sect of the Nazarenes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who also hath gone about to profane the temple: whom, we having apprehended, would also have judged according to our law.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But Lysias the tribune, coming upon us with great violence, took him away out of our hands;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Commanding his accusers to come to thee. Of whom thou mayest thyself, by examination, have knowledge of all these things whereof we accuse him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Jews also added and said that these things were so.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Then Paul answered (the governor making a sign to him to speak): Knowing that for many years thou hast been judge over this nation, I will with good courage answer for myself.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For thou mayest understand that there are yet but twelve days since I went up to adore in Jerusalem:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And neither in the temple did they find me disputing with any man or causing any concourse of the people: neither in the synagogues, nor in the city.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Neither can they prove unto thee the things whereof they now accuse me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But this I confess to thee that according to the way which they call a heresy, so do I serve the Father and my God, believing all things which are written in the law and the prophets:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Having hope in God, which these also themselves look for, that there shall be a resurrection of the just and unjust.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And herein do I endeavour to have always a conscience without offence, towards God and towards men.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Now after many years, I came to bring alms to my nation and offerings and vows.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In which I was found purified in the temple: neither with multitude nor with tumult.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But certain Jews of Asia, who ought to be present before thee and to accuse, if they had anything against me:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Or let these men themselves say if they found in me any iniquity, when standing before the council,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Except it be for this one voice only that I cried, standing among them: Concerning the resurrection of the dead am I judged this day by you.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Felix put them off, having most certain knowledge of this way, saying: When Lysias the tribune shall come down, I will hear you.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he commanded a centurion to keep him: and that he should be easy and that he should not prohibit any of his friends to minister unto him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And after some days, Felix, coming with Drusilla his wife, who was a Jew, sent for Paul and heard of him the faith that is in Christ Jesus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And as he treated of justice and chastity and of the judgment to come, Felix, being terrified, answered: For this time, go thy way: but when I have a convenient time, I will send for thee.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Hoping also withal that money should be given him by Paul: for which cause also oftentimes sending for him, he spoke with him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But when two years were ended, Felix had for successor Portius Festus. And Felix being willing to shew the Jews a pleasure, left Paul bound.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post quinque autem dies descendit princeps sacerdotum Ananias, cum senioribus quibusdam, et Tertullo quodam oratore, qui adierunt præsidem adversus Paulum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et citato Paulo cœpit accusare Tertullus, dicens : Cum in multa pace agamus per te, et multa corrigantur per tuam providentiam,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>semper et ubique suscipimus, optime Felix, cum omni gratiarum actione.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ne diutius autem te protraham, oro, breviter audias nos pro tua clementia.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Invenimus hunc hominem pestiferum, et concitantem seditiones omnibus Judæis in universo orbe, et auctorem seditionis sectæ Nazarenorum :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>qui etiam templum violare conatus est, quem et apprehensum voluimus secundum legem nostram judicare.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Superveniens autem tribunus Lysias, cum vi magna eripuit eum de manibus nostris,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>jubens accusatores ejus ad te venire : a quo poteris ipse judicans, de omnibus istis cognoscere, de quibus nos accusamus eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Adjecerunt autem et Judæi, dicentes hæc ita se habere.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Respondit autem Paulus (annuente sibi præside dicere) : Ex multis annis te esse judicem genti huic sciens, bono animo pro me satisfaciam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Potes enim cognoscere quia non plus sunt mihi dies quam duodecim, ex quo ascendi adorare in Jerusalem :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et neque in templo invenerunt me cum aliquo disputantem, aut concursum facientem turbæ, neque in synagogis, neque in civitate :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>neque probare possunt tibi de quibus nunc me accusant.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Confiteor autem hoc tibi, quod secundum sectam quam dicunt hæresim, sic deservio Patri et Deo meo, credens omnibus quæ in lege et prophetis scripta sunt :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>spem habens in Deum, quam et hi ipsi exspectant, resurrectionem futuram justorum et iniquorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In hoc et ipse studeo sine offendiculo conscientiam habere ad Deum et ad homines semper.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Post annos autem plures eleemosynas facturus in gentem meam, veni, et oblationes, et vota,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>in quibus invenerunt me purificatum in templo : non cum turba, neque cum tumultu.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quidam autem ex Asia Judæi, quos oportebat apud te præsto esse, et accusare si quid haberent adversum me :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>aut hi ipsi dicant si quid invenerunt in me iniquitatis cum stem in concilio,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>nisi de una hac solummodo voce qua clamavi inter eos stans : Quoniam de resurrectione mortuorum ego judicor hodie a vobis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Distulit autem illos Felix, certissime sciens de via hac, dicens : Cum tribunus Lysias descenderit, audiam vos.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jussitque centurioni custodire eum, et habere requiem, nec quemquam de suis prohibere ministrare ei.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Post aliquot autem dies veniens Felix cum Drusilla uxore sua, quæ erat Judæa, vocavit Paulum, et audivit ab eo fidem quæ est in Christum Jesum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Disputante autem illo de justitia, et castitate, et de judicio futuro, tremefactus Felix, respondit : Quod nunc attinet, vade : tempore autem opportuno accersam te :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>simul et sperans quod pecunia ei daretur a Paulo, propter quod et frequenter accersens eum, loquebatur cum eo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Biennio autem expleto, accepit successorem Felix Portium Festum. Volens autem gratiam præstare Judæis Felix, reliquit Paulum vinctum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/23/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercas nMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Acts 24 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.24\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":24,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And after five days, the high priest, Ananias, came down with some ancients and one Tertullus, an orator, who went to the governor against Paul.\"},{\"verse\":2,\"text\":\"And Paul being called for, Tertullus began to accuse him, saying: Whereas, through thee we live in much peace and many things are rectified by thy providence,\"},{\"verse\":3,\"text\":\"We accept it always and in all places, most excellent Felix, with all thanksgiving.\"},{\"verse\":4,\"text\":\"But that I be no further tedious to thee, I desire thee of thy clemency to hear us in a few words.\"},{\"verse\":5,\"text\":\"We have found this to be a pestilent man and raising seditions among all the Jews throughout the world: and author of the sedition of the sect of the Nazarenes.\"},{\"verse\":6,\"text\":\"Who also hath gone about to profane the temple: whom, we having apprehended, would also have judged according to our law.\"},{\"verse\":7,\"text\":\"But Lysias the tribune, coming upon us with great violence, took him away out of our hands;\"},{\"verse\":8,\"text\":\"Commanding his accusers to come to thee. Of whom thou mayest thyself, by examination, have knowledge of all these things whereof we accuse him.\"},{\"verse\":9,\"text\":\"And the Jews also added and said that these things were so.\"},{\"verse\":10,\"text\":\"Then Paul answered (the governor making a sign to him to speak): Knowing that for many years thou hast been judge over this nation, I will with good courage answer for myself.\"},{\"verse\":11,\"text\":\"For thou mayest understand that there are yet but twelve days since I went up to adore in Jerusalem:\"},{\"verse\":12,\"text\":\"And neither in the temple did they find me disputing with any man or causing any concourse of the people: neither in the synagogues, nor in the city.\"},{\"verse\":13,\"text\":\"Neither can they prove unto thee the things whereof they now accuse me.\"},{\"verse\":14,\"text\":\"But this I confess to thee that according to the way which they call a heresy, so do I serve the Father and my God, believing all things which are written in the law and the prophets:\"},{\"verse\":15,\"text\":\"Having hope in God, which these also themselves look for, that there shall be a resurrection of the just and unjust.\"},{\"verse\":16,\"text\":\"And herein do I endeavour to have always a conscience without offence, towards God and towards men.\"},{\"verse\":17,\"text\":\"Now after many years, I came to bring alms to my nation and offerings and vows.\"},{\"verse\":18,\"text\":\"In which I was found purified in the temple: neither with multitude nor with tumult.\"},{\"verse\":19,\"text\":\"But certain Jews of Asia, who ought to be present before thee and to accuse, if they had anything against me:\"},{\"verse\":20,\"text\":\"Or let these men themselves say if they found in me any iniquity, when standing before the council,\"},{\"verse\":21,\"text\":\"Except it be for this one voice only that I cried, standing among them: Concerning the resurrection of the dead am I judged this day by you.\"},{\"verse\":22,\"text\":\"And Felix put them off, having most certain knowledge of this way, saying: When Lysias the tribune shall come down, I will hear you.\"},{\"verse\":23,\"text\":\"And he commanded a centurion to keep him: and that he should be easy and that he should not prohibit any of his friends to minister unto him.\"},{\"verse\":24,\"text\":\"And after some days, Felix, coming with Drusilla his wife, who was a Jew, sent for Paul and heard of him the faith that is in Christ Jesus.\"},{\"verse\":25,\"text\":\"And as he treated of justice and chastity and of the judgment to come, Felix, being terrified, answered: For this time, go thy way: but when I have a convenient time, I will send for thee.\"},{\"verse\":26,\"text\":\"Hoping also withal that money should be given him by Paul: for which cause also oftentimes sending for him, he spoke with him.\"},{\"verse\":27,\"text\":\"But when two years were ended, Felix had for successor Portius Festus. And Felix being willing to shew the Jews a pleasure, left Paul bound.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post quinque autem dies descendit princeps sacerdotum Ananias, cum senioribus quibusdam, et Tertullo quodam oratore, qui adierunt præsidem adversus Paulum.\"},{\"verse\":2,\"text\":\"Et citato Paulo cœpit accusare Tertullus, dicens : Cum in multa pace agamus per te, et multa corrigantur per tuam providentiam,\"},{\"verse\":3,\"text\":\"semper et ubique suscipimus, optime Felix, cum omni gratiarum actione.\"},{\"verse\":4,\"text\":\"Ne diutius autem te protraham, oro, breviter audias nos pro tua clementia.\"},{\"verse\":5,\"text\":\"Invenimus hunc hominem pestiferum, et concitantem seditiones omnibus Judæis in universo orbe, et auctorem seditionis sectæ Nazarenorum :\"},{\"verse\":6,\"text\":\"qui etiam templum violare conatus est, quem et apprehensum voluimus secundum legem nostram judicare.\"},{\"verse\":7,\"text\":\"Superveniens autem tribunus Lysias, cum vi magna eripuit eum de manibus nostris,\"},{\"verse\":8,\"text\":\"jubens accusatores ejus ad te venire : a quo poteris ipse judicans, de omnibus istis cognoscere, de quibus nos accusamus eum.\"},{\"verse\":9,\"text\":\"Adjecerunt autem et Judæi, dicentes hæc ita se habere.\"},{\"verse\":10,\"text\":\"Respondit autem Paulus (annuente sibi præside dicere) : Ex multis annis te esse judicem genti huic sciens, bono animo pro me satisfaciam.\"},{\"verse\":11,\"text\":\"Potes enim cognoscere quia non plus sunt mihi dies quam duodecim, ex quo ascendi adorare in Jerusalem :\"},{\"verse\":12,\"text\":\"et neque in templo invenerunt me cum aliquo disputantem, aut concursum facientem turbæ, neque in synagogis, neque in civitate :\"},{\"verse\":13,\"text\":\"neque probare possunt tibi de quibus nunc me accusant.\"},{\"verse\":14,\"text\":\"Confiteor autem hoc tibi, quod secundum sectam quam dicunt hæresim, sic deservio Patri et Deo meo, credens omnibus quæ in lege et prophetis scripta sunt :\"},{\"verse\":15,\"text\":\"spem habens in Deum, quam et hi ipsi exspectant, resurrectionem futuram justorum et iniquorum.\"},{\"verse\":16,\"text\":\"In hoc et ipse studeo sine offendiculo conscientiam habere ad Deum et ad homines semper.\"},{\"verse\":17,\"text\":\"Post annos autem plures eleemosynas facturus in gentem meam, veni, et oblationes, et vota,\"},{\"verse\":18,\"text\":\"in quibus invenerunt me purificatum in templo : non cum turba, neque cum tumultu.\"},{\"verse\":19,\"text\":\"Quidam autem ex Asia Judæi, quos oportebat apud te præsto esse, et accusare si quid haberent adversum me :\"},{\"verse\":20,\"text\":\"aut hi ipsi dicant si quid invenerunt in me iniquitatis cum stem in concilio,\"},{\"verse\":21,\"text\":\"nisi de una hac solummodo voce qua clamavi inter eos stans : Quoniam de resurrectione mortuorum ego judicor hodie a vobis.\"},{\"verse\":22,\"text\":\"Distulit autem illos Felix, certissime sciens de via hac, dicens : Cum tribunus Lysias descenderit, audiam vos.\"},{\"verse\":23,\"text\":\"Jussitque centurioni custodire eum, et habere requiem, nec quemquam de suis prohibere ministrare ei.\"},{\"verse\":24,\"text\":\"Post aliquot autem dies veniens Felix cum Drusilla uxore sua, quæ erat Judæa, vocavit Paulum, et audivit ab eo fidem quæ est in Christum Jesum.\"},{\"verse\":25,\"text\":\"Disputante autem illo de justitia, et castitate, et de judicio futuro, tremefactus Felix, respondit : Quod nunc attinet, vade : tempore autem opportuno accersam te :\"},{\"verse\":26,\"text\":\"simul et sperans quod pecunia ei daretur a Paulo, propter quod et frequenter accersens eum, loquebatur cum eo.\"},{\"verse\":27,\"text\":\"Biennio autem expleto, accepit successorem Felix Portium Festum. Volens autem gratiam præstare Judæis Felix, reliquit Paulum vinctum.\"}],\"summary\":\"Paul defends his innocence before Felix the governor. He preaches the faith to him.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":23,\"label\":\"Acts 23\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":25,\"label\":\"Acts 25\"}}]]\n"])</script></body></html>
