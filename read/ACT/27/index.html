<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 27 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">27</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul is shipped for Rome. His voyage and shipwreck.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when it was determined that he should sail into Italy and that Paul, with the other prisoners, should be delivered to a centurion, named Julius, of the band Augusta,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Going on board a ship of Adrumetum, we launched, meaning to sail by the coasts of Asia, Aristarchus, the Macedonian of Thessalonica, continuing with us.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the day following, we came to Sidon. And Julius, treating Paul courteously, permitted him to go to his friends and to take care of himself.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when we had launched from thence, we sailed under Cyprus, because the winds were contrary.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And sailing over the sea of Cilicia and Pamphylia, we came to Lystra, which is in Lycia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And there, the centurion, finding a ship of Alexandria sailing into Italy, removed us into it.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when for many days we had sailed slowly and were scarce come over against Gnidus, the wind not suffering us, we sailed near Crete by Salmone.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And with much ado sailing by it, we came into a certain place, which is called Good-havens, nigh to which was the city of Thalassa.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when much time was spent and when sailing now was dangerous, because the fast was now past, Paul comforted them,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Saying to them: Ye men, I see that the voyage beginneth to be with injury and much damage, not only of the lading and ship, but also of our lives.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the centurion believed the pilot and the master of the ship, more than those things which were said by Paul.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And whereas it was not a commodious haven to winter in, the greatest part gave counsel to sail thence, if by any means they might reach Phenice, to winter there, which is a haven of Crete, looking towards the south-west and north-west.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the south wind gently blowing, thinking that they had obtained their purpose, when they had loosed from Asson, they sailed close by Crete.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But not long after, there arose against it a tempestuous wind, called Euroaquilo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when the ship was caught and could not bear up against the wind, giving up the ship to the winds, we were driven.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And running under a certain island that is called Cauda, we had much work to come by the boat.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Which being taken up, they used helps, undergirding the ship: and fearing lest they should fall into the quicksands, they let down the sail yard and so were driven.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And we, being mightily tossed with the tempest, the next day they lightened the ship.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the third day they cast out with their own hands the tackling of the ship.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when neither sun nor stars appeared for many days and no small storm lay on us, all hope of our being saved was now taken away.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And after they had fasted a long time, Paul standing forth in the midst of them, said: You should indeed, O ye men, have hearkened unto me and not have loosed from Crete and have gained this harm and loss.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And now I exhort you to be of good cheer. For there shall be no loss of any man’s life among you, but only of the ship.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For an angel of God, whose I am and whom I serve, stood by me this night,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Saying: Fear not, Paul, thou must be brought before Caesar; and behold, God hath given thee all them that sail with thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Wherefore, sirs, be of good cheer: for I believe God, that it shall so be, as it hath been told me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And we must come unto a certain island.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But after the fourteenth night was come, as we were sailing in Adria, about midnight, the shipmen deemed that they discovered some country.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who also sounding, found twenty fathoms: and going on a little further, they found fifteen fathoms.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then fearing lest we should fall upon rough places, they cast four anchors out of the stern: and wished for the day.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But as the shipmen sought to fly out of the ship, having let down the boat into the sea, under colour, as though they would have cast anchors out of the forepart of the ship,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Paul said to the centurion and to the soldiers: Except these stay in the ship, you cannot be saved.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Then the soldiers cut off the ropes of the boat and let her fall off.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And when it began to be light, Paul besought them all to take meat, saying: This day is the fourteenth day that you have waited and continued fasting, taking nothing.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Wherefore, I pray you to take some meat for your health’s sake: for there shall not an hair of the head of any of you perish.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when he had said these things, taking bread, he gave thanks to God in the sight of them all. And when he had broken it, he began to eat.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Then were they all of better cheer: and they also took some meat.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And we were in all in the ship two hundred threescore and sixteen souls.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And when they had eaten enough, they lightened the ship, casting the wheat into the sea.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And when it was day, they knew not the land. But they discovered a certain creek that had a shore, into which they minded, if they could, to thrust in the ship.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when they had taken up the anchors, they committed themselves to the sea, loosing withal the rudder bands. And hoisting up the mainsail to the wind, they made towards shore.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And when we were fallen into a place where two seas met, they run the ship aground. And the forepart indeed, sticking fast, remained unmoveable: but the hinder part was broken with the violence of the sea.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And the soldiers’ counsel was that they should kill the prisoners, lest any of them, swimming out should escape.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>But the centurion, willing to save Paul, forbade it to be done. And he commanded that they who could swim should cast themselves first into the sea and save themselves and get to land.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the rest, some they carried on boards and some on those things that belonged to the ship. And so it came to pass that every soul got safe to land.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ut autem judicatum est navigare eum in Italiam, et tradi Paulum cum reliquis custodiis centurioni nomine Julio cohortis Augustæ,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ascendentes navem Adrumetinam, incipientes navigare circa Asiæ loca, sustulimus, perseverante nobiscum Aristarcho Macedone Thessalonicensi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sequenti autem die devenimus Sidonem. Humane autem tractans Julius Paulum, permisit ad amicos ire, et curam sui agere.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et inde cum sustulissemus, subnavigavimus Cyprum, propterea quod essent venti contrarii.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et pelagus Ciliciæ et Pamphyliæ navigantes, venimus Lystram, quæ est Lyciæ :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et ibi inveniens centurio navem Alexandrinam navigantem in Italiam, transposuit nos in eam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum multis diebus tarde navigaremus, et vix devenissemus contra Gnidum, prohibente nos vento, adnavigavimus Cretæ juxta Salmonem :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et vix juxta navigantes, venimus in locum quemdam qui vocatur Boniportus, cui juxta erat civitas Thalassa.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Multo autem tempore peracto, et cum jam non esset tuta navigatio eo quod et jejunium jam præteriisset, consolabatur eos Paulus,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>dicens eis : Viri, video quoniam cum injuria et multo damno non solum oneris, et navis, sed etiam animarum nostrarum incipit esse navigatio.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Centurio autem gubernatori et nauclero magis credebat, quam his quæ a Paulo dicebantur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et cum aptus portus non esset ad hiemandum, plurimi statuerunt consilium navigare inde, si quomodo possent, devenientes Phœnicen hiemare, portum Cretæ respicientem ad Africum et ad Corum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Aspirante autem austro, æstimantes propositum se tenere, cum sustulissent de Asson, legebant Cretam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non post multum autem misit se contra ipsam ventus typhonicus, qui vocatur Euroaquilo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cumque arrepta esset navis, et non posset conari in ventum, data nave flatibus, ferebamur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In insulam autem quamdam decurrentes, quæ vocatur Cauda, potuimus vix obtinere scapham.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qua sublata, adjutoriis utebantur, accingentes navem, timentes ne in Syrtim inciderent, summisso vase sic ferebantur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Valida autem nobis tempestate jactatis, sequenti die jactum fecerunt :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et tertia die suis manibus armamenta navis projecerunt.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Neque autem sole, neque sideribus apparentibus per plures dies, et tempestate non exigua imminente, jam ablata erat spes omnis salutis nostræ.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et cum multa jejunatio fuisset, tunc stans Paulus in medio eorum, dixit : Oportebat quidem, o viri, audito me, non tollere a Creta, lucrique facere injuriam hanc et jacturam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et nunc suadeo vobis bono animo esse : amissio enim nullius animæ erit ex vobis, præterquam navis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Astitit enim mihi hac nocte angelus Dei, cujus sum ego, et cui deservio,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>dicens : Ne timeas, Paule : Cæsari te oportet assistere : et ecce donavit tibi Deus omnes qui navigant tecum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Propter quod bono animo estote, viri : credo enim Deo quia sic erit, quemadmodum dictum est mihi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In insulam autem quamdam oportet nos devenire.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sed posteaquam quartadecima nox supervenit, navigantibus nobis in Adria circa mediam noctem, suspicabantur nautæ apparere sibi aliquam regionem.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Qui et summittentes bolidem, invenerunt passus viginti : et pusillum inde separati, invenerunt passus quindecim.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Timentes autem ne in aspera loca incideremus, de puppi mittentes anchoras quatuor, optabant diem fieri.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Nautis vero quærentibus fugere de navi, cum misissent scapham in mare, sub obtentu quasi inciperent a prora anchoras extendere,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>dixit Paulus centurioni et militibus : Nisi hi in navi manserint, vos salvi fieri non potestis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Tunc absciderunt milites funes scaphæ, et passi sunt eam excidere.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et cum lux inciperet fieri, rogabat Paulus omnes sumere cibum, dicens : Quartadecima die hodie exspectantes jejuni permanetis, nihil accipientes.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Propter quod rogo vos accipere cibum pro salute vestra : quia nullius vestrum capillus de capite peribit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et cum hæc dixisset, sumens panem, gratias egit Deo in conspectu omnium : et cum fregisset, cœpit manducare.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Animæquiores autem facti omnes, et ipsi sumpserunt cibum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Eramus vero universæ animæ in navi ducentæ septuaginta sex.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et satiati cibo alleviabant navem, jactantes triticum in mare.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Cum autem dies factus esset, terram non agnoscebant : sinum vero quemdam considerabant habentem littus, in quem cogitabant si possent ejicere navem.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et cum anchoras sustulissent, committebant se mari, simul laxantes juncturas gubernaculorum : et levato artemone secundum auræ flatum, tendebant ad littus.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et cum incidissemus in locum dithalassum, impegerunt navem : et prora quidem fixa manebat immobilis, puppis vero solvebatur a vi maris.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Militum autem consilium fuit ut custodias occiderent, ne quis cum enatasset, effugeret.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Centurio autem volens servare Paulum, prohibuit fieri : jussitque eos qui possent natare, emittere se primos, et evadere, et ad terram exire :</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>et ceteros, alios in tabulis ferebant, quosdam super ea quæ de navi erant. Et sic factum est, ut omnes animæ evaderent ad terram.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/28/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 28</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->27<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previo 80\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"ACT.27\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":27,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And when it was determined that he should sail into Italy and that Paul, with the other prisoners, should be delivered to a centurion, named Julius, of the band Augusta,\"},{\"verse\":2,\"text\":\"Going on board a ship of Adrumetum, we launched, meaning to sail by the coasts of Asia, Aristarchus, the Macedonian of Thessalonica, continuing with us.\"},{\"verse\":3,\"text\":\"And the day following, we came to Sidon. And Julius, treating Paul courteously, permitted him to go to his friends and to take care of himself.\"},{\"verse\":4,\"text\":\"And when we had launched from thence, we sailed under Cyprus, because the winds were contrary.\"},{\"verse\":5,\"text\":\"And sailing over the sea of Cilicia and Pamphylia, we came to Lystra, which is in Lycia.\"},{\"verse\":6,\"text\":\"And there, the centurion, finding a ship of Alexandria sailing into Italy, removed us into it.\"},{\"verse\":7,\"text\":\"And when for many days we had sailed slowly and were scarce come over against Gnidus, the wind not suffering us, we sailed near Crete by Salmone.\"},{\"verse\":8,\"text\":\"And with much ado sailing by it, we came into a certain place, which is called Good-havens, nigh to which was the city of Thalassa.\"},{\"verse\":9,\"text\":\"And when much time was spent and when sailing now was dangerous, because the fast was now past, Paul comforted them,\"},{\"verse\":10,\"text\":\"Saying to them: Ye men, I see that the voyage beginneth to be with injury and much damage, not only of the lading and ship, but also of our lives.\"},{\"verse\":11,\"text\":\"But the centurion believed the pilot and the master of the ship, more than those things which were said by Paul.\"},{\"verse\":12,\"text\":\"And whereas it was not a commodious haven to winter in, the greatest part gave counsel to sail thence, if by any means they might reach Phenice, to winter there, which is a haven of Crete, looking towards the south-west and north-west.\"},{\"verse\":13,\"text\":\"And the south wind gently blowing, thinking that they had obtained their purpose, when they had loosed from Asson, they sailed close by Crete.\"},{\"verse\":14,\"text\":\"But not long after, there arose against it a tempestuous wind, called Euroaquilo.\"},{\"verse\":15,\"text\":\"And when the ship was caught and could not bear up against the wind, giving up the ship to the winds, we were driven.\"},{\"verse\":16,\"text\":\"And running under a certain island that is called Cauda, we had much work to come by the boat.\"},{\"verse\":17,\"text\":\"Which being taken up, they used helps, undergirding the ship: and fearing lest they should fall into the quicksands, they let down the sail yard and so were driven.\"},{\"verse\":18,\"text\":\"And we, being mightily tossed with the tempest, the next day they lightened the ship.\"},{\"verse\":19,\"text\":\"And the third day they cast out with their own hands the tackling of the ship.\"},{\"verse\":20,\"text\":\"And when neither sun nor stars appeared for many days and no small storm lay on us, all hope of our being saved was now taken away.\"},{\"verse\":21,\"text\":\"And after they had fasted a long time, Paul standing forth in the midst of them, said: You should indeed, O ye men, have hearkened unto me and not have loosed from Crete and have gained this harm and loss.\"},{\"verse\":22,\"text\":\"And now I exhort you to be of good cheer. For there shall be no loss of any man’s life among you, but only of the ship.\"},{\"verse\":23,\"text\":\"For an angel of God, whose I am and whom I serve, stood by me this night,\"},{\"verse\":24,\"text\":\"Saying: Fear not, Paul, thou must be brought before Caesar; and behold, God hath given thee all them that sail with thee.\"},{\"verse\":25,\"text\":\"Wherefore, sirs, be of good cheer: for I believe God, that it shall so be, as it hath been told me.\"},{\"verse\":26,\"text\":\"And we must come unto a certain island.\"},{\"verse\":27,\"text\":\"But after the fourteenth night was come, as we were sailing in Adria, about midnight, the shipmen deemed that they discovered some country.\"},{\"verse\":28,\"text\":\"Who also sounding, found twenty fathoms: and going on a little further, they found fifteen fathoms.\"},{\"verse\":29,\"text\":\"Then fearing lest we should fall upon rough places, they cast four anchors out of the stern: and wished for the day.\"},{\"verse\":30,\"text\":\"But as the shipmen sought to fly out of the ship, having let down the boat into the sea, under colour, as though they would have cast anchors out of the forepart of the ship,\"},{\"verse\":31,\"text\":\"Paul said to the centurion and to the soldiers: Except these stay in the ship, you cannot be saved.\"},{\"verse\":32,\"text\":\"Then the soldiers cut off the ropes of the boat and let her fall off.\"},{\"verse\":33,\"text\":\"And when it began to be light, Paul besought them all to take meat, saying: This day is the fourteenth day that you have waited and continued fasting, taking nothing.\"},{\"verse\":34,\"text\":\"Wherefore, I pray you to take some meat for your health’s sake: for there shall not an hair of the head of any of you perish.\"},{\"verse\":35,\"text\":\"And when he had said these things, taking bread, he gave thanks to God in the sight of them all. And when he had broken it, he began to eat.\"},{\"verse\":36,\"text\":\"Then were they all of better cheer: and they also took some meat.\"},{\"verse\":37,\"text\":\"And we were in all in the ship two hundred threescore and sixteen souls.\"},{\"verse\":38,\"text\":\"And when they had eaten enough, they lightened the ship, casting the wheat into the sea.\"},{\"verse\":39,\"text\":\"And when it was day, they knew not the land. But they discovered a certain creek that had a shore, into which they minded, if they could, to thrust in the ship.\"},{\"verse\":40,\"text\":\"And when they had taken up the anchors, they committed themselves to the sea, loosing withal the rudder bands. And hoisting up the mainsail to the wind, they made towards shore.\"},{\"verse\":41,\"text\":\"And when we were fallen into a place where two seas met, they run the ship aground. And the forepart indeed, sticking fast, remained unmoveable: but the hinder part was broken with the violence of the sea.\"},{\"verse\":42,\"text\":\"And the soldiers’ counsel was that they should kill the prisoners, lest any of them, swimming out should escape.\"},{\"verse\":43,\"text\":\"But the centurion, willing to save Paul, forbade it to be done. And he commanded that they who could swim should cast themselves first into the sea and save themselves and get to land.\"},{\"verse\":44,\"text\":\"And the rest, some they carried on boards and some on those things that belonged to the ship. And so it came to pass that every soul got safe to land.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ut autem judicatum est navigare eum in Italiam, et tradi Paulum cum reliquis custodiis centurioni nomine Julio cohortis Augustæ,\"},{\"verse\":2,\"text\":\"ascendentes navem Adrumetinam, incipientes navigare circa Asiæ loca, sustulimus, perseverante nobiscum Aristarcho Macedone Thessalonicensi.\"},{\"verse\":3,\"text\":\"Sequenti autem die devenimus Sidonem. Humane autem tractans Julius Paulum, permisit ad amicos ire, et curam sui agere.\"},{\"verse\":4,\"text\":\"Et inde cum sustulissemus, subnavigavimus Cyprum, propterea quod essent venti contrarii.\"},{\"verse\":5,\"text\":\"Et pelagus Ciliciæ et Pamphyliæ navigantes, venimus Lystram, quæ est Lyciæ :\"},{\"verse\":6,\"text\":\"et ibi inveniens centurio navem Alexandrinam navigantem in Italiam, transposuit nos in eam.\"},{\"verse\":7,\"text\":\"Et cum multis diebus tarde navigaremus, et vix devenissemus contra Gnidum, prohibente nos vento, adnavigavimus Cretæ juxta Salmonem :\"},{\"verse\":8,\"text\":\"et vix juxta navigantes, venimus in locum quemdam qui vocatur Boniportus, cui juxta erat civitas Thalassa.\"},{\"verse\":9,\"text\":\"Multo autem tempore peracto, et cum jam non esset tuta navigatio eo quod et jejunium jam præteriisset, consolabatur eos Paulus,\"},{\"verse\":10,\"text\":\"dicens eis : Viri, video quoniam cum injuria et multo damno non solum oneris, et navis, sed etiam animarum nostrarum incipit esse navigatio.\"},{\"verse\":11,\"text\":\"Centurio autem gubernatori et nauclero magis credebat, quam his quæ a Paulo dicebantur.\"},{\"verse\":12,\"text\":\"Et cum aptus portus non esset ad hiemandum, plurimi statuerunt consilium navigare inde, si quomodo possent, devenientes Phœnicen hiemare, portum Cretæ respicientem ad Africum et ad Corum.\"},{\"verse\":13,\"text\":\"Aspirante autem austro, æstimantes propositum se tenere, cum sustulissent de Asson, legebant Cretam.\"},{\"verse\":14,\"text\":\"Non post multum autem misit se contra ipsam ventus typhonicus, qui vocatur Euroaquilo.\"},{\"verse\":15,\"text\":\"Cumque arrepta esset navis, et non posset conari in ventum, data nave flatibus, ferebamur.\"},{\"verse\":16,\"text\":\"In insulam autem quamdam decurrentes, quæ vocatur Cauda, potuimus vix obtinere scapham.\"},{\"verse\":17,\"text\":\"Qua sublata, adjutoriis utebantur, accingentes navem, timentes ne in Syrtim inciderent, summisso vase sic ferebantur.\"},{\"verse\":18,\"text\":\"Valida autem nobis tempestate jactatis, sequenti die jactum fecerunt :\"},{\"verse\":19,\"text\":\"et tertia die suis manibus armamenta navis projecerunt.\"},{\"verse\":20,\"text\":\"Neque autem sole, neque sideribus apparentibus per plures dies, et tempestate non exigua imminente, jam ablata erat spes omnis salutis nostræ.\"},{\"verse\":21,\"text\":\"Et cum multa jejunatio fuisset, tunc stans Paulus in medio eorum, dixit : Oportebat quidem, o viri, audito me, non tollere a Creta, lucrique facere injuriam hanc et jacturam.\"},{\"verse\":22,\"text\":\"Et nunc suadeo vobis bono animo esse : amissio enim nullius animæ erit ex vobis, præterquam navis.\"},{\"verse\":23,\"text\":\"Astitit enim mihi hac nocte angelus Dei, cujus sum ego, et cui deservio,\"},{\"verse\":24,\"text\":\"dicens : Ne timeas, Paule : Cæsari te oportet assistere : et ecce donavit tibi Deus omnes qui navigant tecum.\"},{\"verse\":25,\"text\":\"Propter quod bono animo estote, viri : credo enim Deo quia sic erit, quemadmodum dictum est mihi.\"},{\"verse\":26,\"text\":\"In insulam autem quamdam oportet nos devenire.\"},{\"verse\":27,\"text\":\"Sed posteaquam quartadecima nox supervenit, navigantibus nobis in Adria circa mediam noctem, suspicabantur nautæ apparere sibi aliquam regionem.\"},{\"verse\":28,\"text\":\"Qui et summittentes bolidem, invenerunt passus viginti : et pusillum inde separati, invenerunt passus quindecim.\"},{\"verse\":29,\"text\":\"Timentes autem ne in aspera loca incideremus, de puppi mittentes anchoras quatuor, optabant diem fieri.\"},{\"verse\":30,\"text\":\"Nautis vero quærentibus fugere de navi, cum misissent scapham in mare, sub obtentu quasi inciperent a prora anchoras extendere,\"},{\"verse\":31,\"text\":\"dixit Paulus centurioni et militibus : Nisi hi in navi manserint, vos salvi fieri non potestis.\"},{\"verse\":32,\"text\":\"Tunc absciderunt milites funes scaphæ, et passi sunt eam excidere.\"},{\"verse\":33,\"text\":\"Et cum lux inciperet fieri, rogabat Paulus omnes sumere cibum, dicens : Quartadecima die hodie exspectantes jejuni permanetis, nihil accipientes.\"},{\"verse\":34,\"text\":\"Propter quod rogo vos accipere cibum pro salute vestra : quia nullius vestrum capillus de capite peribit.\"},{\"verse\":35,\"text\":\"Et cum hæc dixisset, sumens panem, gratias egit Deo in conspectu omnium : et cum fregisset, cœpit manducare.\"},{\"verse\":36,\"text\":\"Animæquiores autem facti omnes, et ipsi sumpserunt cibum.\"},{\"verse\":37,\"text\":\"Eramus vero universæ animæ in navi ducentæ septuaginta sex.\"},{\"verse\":38,\"text\":\"Et satiati cibo alleviabant navem, jactantes triticum in mare.\"},{\"verse\":39,\"text\":\"Cum autem dies factus esset, terram non agnoscebant : sinum vero quemdam considerabant habentem littus, in quem cogitabant si possent ejicere navem.\"},{\"verse\":40,\"text\":\"Et cum anchoras sustulissent, committebant se mari, simul laxantes juncturas gubernaculorum : et levato artemone secundum auræ flatum, tendebant ad littus.\"},{\"verse\":41,\"text\":\"Et cum incidissemus in locum dithalassum, impegerunt navem : et prora quidem fixa manebat immobilis, puppis vero solvebatur a vi maris.\"},{\"verse\":42,\"text\":\"Militum autem consilium fuit ut custodias occiderent, ne quis cum enatasset, effugeret.\"},{\"verse\":43,\"text\":\"Centurio autem volens servare Paulum, prohibuit fieri : jussitque eos qui possent natare, emittere se primos, et evadere, et ad terram exire :\"},{\"verse\":44,\"text\":\"et ceteros, alios in tabulis ferebant, quosdam super ea quæ de navi erant. Et sic factum est, ut omnes animæ evaderent ad terram.\"}],\"summary\":\"Paul is shipped for Rome. His voyage and shipwreck.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":26,\"label\":\"Acts 26\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":28,\"label\":\"Acts 28\"}}]]\n"])</script></body></html>
