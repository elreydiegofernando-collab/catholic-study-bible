lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">15</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A dissension about circumcision. The decision and letter of the council of Jerusalem.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And some, coming down from Judea, taught the brethren: That, except you be circumcised after the manner of Moses, you cannot be saved.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when Paul and Barnabas had no small contest with them, they determined that Paul and Barnabas and certain others of the other side should go up to the apostles and priests to Jerusalem, about this question.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They therefore, being brought on their way by the church, passed through Phenice and Samaria, relating the conversion of the Gentiles. And they caused great joy to all the brethren.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when they were come to Jerusalem, they were received by the church and by the apostles and ancients, declaring how great things God had done with them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But there arose of the sect of the Pharisees some that believed, saying: They must be circumcised and be commanded to observe the law of Moses.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the apostles and ancients assembled to consider of this matter.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when there had been much disputing, Peter, rising up, said to them: Men, brethren, you know that in former days God made choice among us, that by my mouth the Gentiles should hear the word of the gospel and believe.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And God, who knoweth the hearts, gave testimony, giving unto them the Holy Ghost, as well as to us:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And put no difference between us and them, purifying their hearts by faith.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Now therefore, why tempt you God to put a yoke upon the necks of the disciples which neither our fathers nor we have been able to bear?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But by the grace of the Lord Jesus Christ, we believe to be saved, in like manner as they also.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And all the multitude held their peace: and they heard Barnabas and Paul telling what great signs and wonders God had wrought among the Gentiles by them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And after they had held their peace, James answered, saying: Men, brethren, hear me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Simon hath related how God first visited to take of the Gentiles, a people to his name.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And to this agree the words of the prophets, as it is written:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>After these things I will return and will rebuild the tabernacle of David, which is fallen down: and the ruins thereof I will rebuild. And I will set it up:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>That the residue of men may seek after the Lord, and all nations upon whom my name is invoked, saith the Lord, who doth these things.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>To the Lord was his own work known from the beginning of the world.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For which cause I judge that they who from among the Gentiles are converted to God are not to be disquieted:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But that we write unto them, that they refrain themselves from the pollutions of idols and from fornication and from things strangled and from blood.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For Moses of old time hath in every city them that preach him in the synagogues, where he is read every sabbath.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Then it pleased the apostles and ancients, with the whole church, to choose men of their own company and to send to Antioch with Paul and Barnabas, namely, Judas, who was surnamed Barsabas, and Silas, chief men among the brethren.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Writing by their hands: The apostles and ancients, brethren, to the brethren of the Gentiles that are at Antioch and in Syria and Cilicia, greeting.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Forasmuch as we have heard that some going out from us have troubled you with words, subverting your souls, to whom we gave no commandment:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>It hath seemed good to us, being assembled together, to choose out men and to send them unto you, with our well beloved Barnabas and Paul:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Men that have given their lives for the name of our Lord Jesus Christ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>We have sent therefore Judas and Silas, who themselves also will, by word of mouth, tell you the same things.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For it hath seemed good to the Holy Ghost and to us to lay no further burden upon you than these necessary things:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>That you abstain from things sacrificed to idols and from blood and from things strangled and from fornication: from which things keeping yourselves, you shall do well. Fare ye well.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>They therefore, being dismissed, went down to Antioch and, gathering together the multitude, delivered the epistle.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Which when they had read, they rejoiced for the consolation.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But Judas and Silas, being prophets also themselves, with many words comforted the brethren and confirmed them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And after they had spent some time there, they were let go with peace by the brethren unto them that had sent them.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But it seemed good unto Silas to remain there: and Judas alone departed to Jerusalem.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Paul and Barnabas continued at Antioch, teaching and preaching, with many others, the word of the Lord.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And after some days, Paul said to Barnabas: Let us return and visit our brethren in all the cities wherein we have preached the word of the Lord, to see how they do.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Barnabas would have taken with them John also, that was surnamed Mark.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But Paul desired that he (as having departed from them out of Pamphylia and not gone with them to the work) might not be received.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And there arose a dissension so that they departed one from another. And Barnabas indeed, taking Mark, sailed to Cyprus.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But Paul, choosing Silas, departed, being delivered by the brethren to the grace of God.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And he went through Syria and Cilicia, confirming the churches, commanding them to keep the precepts of the apostles and the ancients.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et quidam descendentes de Judæa docebant fratres : Quia nisi circumcidamini secundum morem Moysi, non potestis salvari.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Facta ergo seditione non minima Paulo et Barnabæ adversus illos, statuerunt ut ascenderent Paulus et Barnabas, et quidam alii ex aliis ad Apostolos et presbyteros in Jerusalem super hac quæstione.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Illi ergo deducti ab ecclesia pertransibant Phœnicen et Samariam, narrantes conversionem gentium : et faciebant gaudium magnum omnibus fratribus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cum autem venissent Jerosolymam, suscepti sunt ab ecclesia, et ab Apostolis et senioribus, annuntiantes quanta Deus fecisset cum illis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Surrexerunt autem quidam de hæresi pharisæorum, qui crediderunt, dicentes quia oportet circumcidi eos, præcipere quoque servare legem Moysi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Conveneruntque Apostoli et seniores videre de verbo hoc.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cum autem magna conquisitio fieret, surgens Petrus dixit ad eos : Viri fratres, vos scitis quoniam ab antiquis diebus Deus in nobis elegit, per os meum audire gentes verbum Evangelii et credere.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et qui novit corda Deus, testimonium perhibuit, dans illis Spiritum Sanctum, sicut et nobis,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et nihil discrevit inter nos et illos, fide purificans corda eorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nunc ergo quid tentatis Deum, imponere jugum super cervices discipulorum quod neque patres nostri, neque nos portare potuimus ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>sed per gratiam Domini Jesu Christi credimus salvari, quemadmodum et illi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tacuit autem omnis multitudo : et audiebant Barnabam et Paulum narrantes quanta Deus fecisset signa et prodigia in gentibus per eos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et postquam tacuerunt, respondit Jacobus, dicens : Viri fratres, audite me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Simon narravit quemadmodum primum Deus visitavit sumere ex gentibus populum nomini suo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et huic concordant verba prophetarum : sicut scriptum est :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Post hæc revertar, et reædificabo tabernaculum David quod decidit : et diruta ejus reædificabo, et erigam illud :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>ut requirant ceteri hominum Dominum, et omnes gentes super quas invocatum est nomen meum, dicit Dominus faciens hæc.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Notum a sæculo est Domino opus suum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Propter quod ego judico non inquietari eos qui ex gentibus convertuntur ad Deum,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sed scribere ad eos ut abstineant se a contaminationibus simulacrorum, et fornicatione, et suffocatis, et sanguine.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Moyses enim a temporibus antiquis habet in singulis civitatibus qui eum prædicent in synagogis, ubi per omne sabbatum legitur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tunc placuit Apostolis et senioribus cum omni ecclesia eligere viros ex eis, et mittere Antiochiam cum Paulo et Barnaba : Judam, qui cognominabatur Barsabas, et Silam, viros primos in fratribus :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>scribentes per manus eorum : Apostoli et seniores fratres, his qui sunt Antiochiæ, et Syriæ, et Ciliciæ, fratribus ex gentibus, salutem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quoniam audivimus quia quidam ex nobis exeuntes, turbaverunt vos verbis, evertentes animas vestras, quibus non mandavimus,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>placuit nobis collectis in unum eligere viros, et mittere ad vos cum carissimis nostris Barnaba et Paulo,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>hominibus qui tradiderunt animas suas pro nomine Domini nostri Jesu Christi.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Misimus ergo Judam et Silam, qui et ipsi vobis verbis referent eadem.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Visum est enim Spiritui Sancto et nobis nihil ultra imponere vobis oneris quam hæc necessaria :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>ut abstineatis vos ab immolatis simulacrorum, et sanguine, et suffocato, et fornicatione : a quibus custodientes vos, bene agetis. Valete.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Illi ergo dimissi, descenderunt Antiochiam : et congregata multitudine tradiderunt epistolam.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Quam cum legissent, gavisi sunt super consolatione.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Judas autem et Silas, et ipsi cum essent prophetæ, verbo plurimo consolati sunt fratres, et confirmaverunt.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Facto autem ibi aliquanto tempore, dimissi sunt cum pace a fratribus ad eos qui miserant illos.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Visum est autem Silæ ibi remanere : Judas autem solus abiit Jerusalem.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Paulus autem et Barnabas demorabantur Antiochiæ, docentes et evangelizantes cum aliis pluribus verbum Domini.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Post aliquot autem dies, dixit ad Barnabam Paulus : Revertentes visitemus fratres per universas civitates in quibus prædicavimus verbum Domini, quomodo se habeant.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Barnabas autem volebat secum assumere et Joannem, qui cognominabatur Marcus.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Paulus autem rogabat eum (ut qui discessisset ab eis de Pamphylia, et non isset cum eis in opus) non debere recipi.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Facta est autem dissensio, ita ut discederent ab invicem, et Barnabas quidem, assumpto Marco, navigaret Cyprum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Paulus vero, electo Sila, profectus est, traditus gratiæ Dei a fratribus.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Perambulabat autem Syriam et Ciliciam, confirmans ecclesias : præcipiens custodire præcepta Apostolorum et seniorum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 14</span></span></a><a c on.\"},{\"verse\":3,\"text\":\"They therefore, being brought on their way by the church, passed through Phenice and Samaria, relating the conversion of the Gentiles. And they caused great joy to all the brethren.\"},{\"verse\":4,\"text\":\"And when they were come to Jerusalem, they were received by the church and by the apostles and ancients, declaring how great things God had done with them.\"},{\"verse\":5,\"text\":\"But there arose of the sect of the Pharisees some that believed, saying: They must be circumcised and be commanded to observe the law of Moses.\"},{\"verse\":6,\"text\":\"And the apostles and ancients assembled to consider of this matter.\"},{\"verse\":7,\"text\":\"And when there had been much disputing, Peter, rising up, said to them: Men, brethren, you know that in former days God made choice among us, that by my mouth the Gentiles should hear the word of the gospel and believe.\"},{\"verse\":8,\"text\":\"And God, who knoweth the hearts, gave testimony, giving unto them the Holy Ghost, as well as to us:\"},{\"verse\":9,\"text\":\"And put no difference between us and them, purifying their hearts by faith.\"},{\"verse\":10,\"text\":\"Now therefore, why tempt you God to put a yoke upon the necks of the disciples which neither our fathers nor we have been able to bear?\"},{\"verse\":11,\"text\":\"But by the grace of the Lord Jesus Christ, we believe to be saved, in like manner as they also.\"},{\"verse\":12,\"text\":\"And all the multitude held their peace: and they heard Barnabas and Paul telling what great signs and wonders God had wrought among the Gentiles by them.\"},{\"verse\":13,\"text\":\"And after they had held their peace, James answered, saying: Men, brethren, hear me.\"},{\"verse\":14,\"text\":\"Simon hath related how God first visited to take of the Gentiles, a people to his name.\"},{\"verse\":15,\"text\":\"And to this agree the words of the prophets, as it is written:\"},{\"verse\":16,\"text\":\"After these things I will return and will rebuild the tabernacle of David, which is fallen down: and the ruins thereof I will rebuild. And I will set it up:\"},{\"verse\":17,\"text\":\"That the residue of men may seek after the Lord, and all nations upon whom my name is invoked, saith the Lord, who doth these things.\"},{\"verse\":18,\"text\":\"To the Lord was his own work known from the beginning of the world.\"},{\"verse\":19,\"text\":\"For which cause I judge that they who from among the Gentiles are converted to God are not to be disquieted:\"},{\"verse\":20,\"text\":\"But that we write unto them, that they refrain themselves from the pollutions of idols and from fornication and from things strangled and from blood.\"},{\"verse\":21,\"text\":\"For Moses of old time hath in every city them that preach him in the synagogues, where he is read every sabbath.\"},{\"verse\":22,\"text\":\"Then it pleased the apostles and ancients, with the whole church, to choose men of their own company and to send to Antioch with Paul and Barnabas, namely, Judas, who was surnamed Barsabas, and Silas, chief men among the brethren.\"},{\"verse\":23,\"text\":\"Writing by their hands: The apostles and ancients, brethren, to the brethren of the Gentiles that are at Antioch and in Syria and Cilicia, greeting.\"},{\"verse\":24,\"text\":\"Forasmuch as we have heard that some going out from us have troubled you with words, subverting your souls, to whom we gave no commandment:\"},{\"verse\":25,\"text\":\"It hath seemed good to us, being assembled together, to choose out men and to send them unto you, with our well beloved Barnabas and Paul:\"},{\"verse\":26,\"text\":\"Men that have given their lives for the name of our Lord Jesus Christ.\"},{\"verse\":27,\"text\":\"We have sent therefore Judas and Silas, who themselves also will, by word of mouth, tell you the same things.\"},{\"verse\":28,\"text\":\"For it hath seemed good to the Holy Ghost and to us to lay no further burden upon you than these necessary things:\"},{\"verse\":29,\"text\":\"That you abstain from things sacrificed to idols and from blood and from things strangled and from fornication: from which things keeping yourselves, you shall do well. Fare ye well.\"},{\"verse\":30,\"text\":\"They therefore, being dismissed, went down to Antioch and, gathering together the multitude, delivered the epistle.\"},{\"verse\":31,\"text\":\"Which when they had read, they rejoiced for the consolation.\"},{\"verse\":32,\"text\":\"But Judas and Silas, being prophets also themselves, with many words comforted the brethren and confirmed them.\"},{\"verse\":33,\"text\":\"And after they had spent some time there, they were let go with peace by the brethren unto them that had sent them.\"},{\"verse\":34,\"text\":\"But it seemed good unto Silas to remain there: and Judas alone departed to Jerusalem.\"},{\"verse\":35,\"text\":\"And Paul and Barnabas continued at Antioch, teaching and preaching, with many others, the word of the Lord.\"},{\"verse\":36,\"text\":\"And after some days, Paul said to Barnabas: Let us return and visit our brethren in all the cities wherein we have preached the word of the Lord, to see how they do.\"},{\"verse\":37,\"text\":\"And Barnabas would have taken with them John also, that was surnamed Mark.\"},{\"verse\":38,\"text\":\"But Paul desired that he (as having departed from them out of Pamphylia and not gone with them to the work) might not be received.\"},{\"verse\":39,\"text\":\"And there arose a dissension so that they departed one from another. And Barnabas indeed, taking Mark, sailed to Cyprus.\"},{\"verse\":40,\"text\":\"But Paul, choosing Silas, departed, being delivered by the brethren to the grace of God.\"},{\"verse\":41,\"text\":\"And he went through Syria and Cilicia, confirming the churches, commanding them to keep the precepts of the apostles and the ancients.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et quidam descendentes de Judæa docebant fratres : Quia nisi circumcidamini secundum morem Moysi, non potestis salvari.\"},{\"verse\":2,\"text\":\"Facta ergo seditione non minima Paulo et Barnabæ adversus illos, statuerunt ut ascenderent Paulus et Barnabas, et quidam alii ex aliis ad Apostolos et presbyteros in Jerusalem super hac quæstione.\"},{\"verse\":3,\"text\":\"Illi ergo deducti ab ecclesia pertransibant Phœnicen et Samariam, narrantes conversionem gentium : et faciebant gaudium magnum omnibus fratribus.\"},{\"verse\":4,\"text\":\"Cum autem venissent Jerosolymam, suscepti sunt ab ecclesia, et ab Apostolis et senioribus, annuntiantes quanta Deus fecisset cum illis.\"},{\"verse\":5,\"text\":\"Surrexerunt autem quidam de hæresi pharisæorum, qui crediderunt, dicentes quia oportet circumcidi eos, præcipere quoque servare legem Moysi.\"},{\"verse\":6,\"text\":\"Conveneruntque Apostoli et seniores videre de verbo hoc.\"},{\"verse\":7,\"text\":\"Cum autem magna conquisitio fieret, surgens Petrus dixit ad eos : Viri fratres, vos scitis quoniam ab antiquis diebus Deus in nobis elegit, per os meum audire gentes verbum Evangelii et credere.\"},{\"verse\":8,\"text\":\"Et qui novit corda Deus, testimonium perhibuit, dans illis Spiritum Sanctum, sicut et nobis,\"},{\"verse\":9,\"text\":\"et nihil discrevit inter nos et illos, fide purificans corda eorum.\"},{\"verse\":10,\"text\":\"Nunc ergo quid tentatis Deum, imponere jugum super cervices discipulorum quod neque patres nostri, neque nos portare potuimus ?\"},{\"verse\":11,\"text\":\"sed per gratiam Domini Jesu Christi credimus salvari, quemadmodum et illi.\"},{\"verse\":12,\"text\":\"Tacuit autem omnis multitudo : et audiebant Barnabam et Paulum narrantes quanta Deus fecisset signa et prodigia in gentibus per eos.\"},{\"verse\":13,\"text\":\"Et postquam tacuerunt, respondit Jacobus, dicens : Viri fratres, audite me.\"},{\"verse\":14,\"text\":\"Simon narravit quemadmodum primum Deus visitavit sumere ex gentibus populum nomini suo.\"},{\"verse\":15,\"text\":\"Et huic concordant verba prophetarum : sicut scriptum est :\"},{\"verse\":16,\"text\":\"Post hæc revertar, et reædificabo tabernaculum David quod decidit : et diruta ejus reædificabo, et erigam illud :\"},{\"verse\":17,\"text\":\"ut requirant ceteri hominum Dominum, et omnes gentes super quas invocatum est nomen meum, dicit Dominus faciens hæc.\"},{\"verse\":18,\"text\":\"Notum a sæculo est Domino opus suum.\"},{\"verse\":19,\"text\":\"Propter quod ego judico non inquietari eos qui ex gentibus convertuntur ad Deum,\"},{\"verse\":20,\"text\":\"sed scribere ad eos ut abstineant se a contaminationibus simulacrorum, et fornicatione, et suffocatis, et sanguine.\"},{\"verse\":21,\"text\":\"Moyses enim a temporibus antiquis habet in singulis civitatibus qui eum prædicent in synagogis, ubi per omne sabbatum legitur.\"},{\"verse\":22,\"text\":\"Tunc placuit Apostolis et senioribus cum omni ecclesia eligere viros ex eis, et mittere Antiochiam cum Paulo et Barnaba : Judam, qui cognominabatur Barsabas, et Silam, viros primos in fratribus :\"},{\"verse\":23,\"text\":\"scribentes per manus eorum : Apostoli et seniores fratres, his qui sunt Antiochiæ, et Syriæ, et Ciliciæ, fratribus ex gentibus, salutem.\"},{\"verse\":24,\"text\":\"Quoniam audivimus quia quidam ex nobis exeuntes, turbaverunt vos verbis, evertentes animas vestras, quibus non mandavimus,\"},{\"verse\":25,\"text\":\"placuit nobis collectis in unum eligere viros, et mittere ad vos cum carissimis nostris Barnaba et Paulo,\"},{\"verse\":26,\"text\":\"hominibus qui tradiderunt animas suas pro nomine Domini nostri Jesu Christi.\"},{\"verse\":27,\"text\":\"Misimus ergo Judam et Silam, qui et ipsi vobis verbis referent eadem.\"},{\"verse\":28,\"text\":\"Visum est enim Spiritui Sancto et nobis nihil ultra imponere vobis oneris quam hæc necessaria :\"},{\"verse\":29,\"text\":\"ut abstineatis vos ab immolatis simulacrorum, et sanguine, et suffocato, et fornicatione : a quibus custodientes vos, bene agetis. Valete.\"},{\"verse\":30,\"text\":\"Illi ergo dimissi, descenderunt Antiochiam : et congregata multitudine tradiderunt epistolam.\"},{\"verse\":31,\"text\":\"Quam cum legissent, gavisi sunt super consolatione.\"},{\"verse\":32,\"text\":\"Judas autem et Silas, et ipsi cum essent prophetæ, verbo plurimo consolati sunt fratres, et confirmaverunt.\"},{\"verse\":33,\"text\":\"Facto autem ibi aliquanto tempore, dimissi sunt cum pace a fratribus ad eos qui miserant illos.\"},{\"verse\":34,\"text\":\"Visum est autem Silæ ibi remanere : Judas autem solus abiit Jerusalem.\"},{\"verse\":35,\"text\":\"Paulus autem et Barnabas demorabantur Antiochiæ, docentes et evangelizantes cum aliis pluribus verbum Domini.\"},{\"verse\":36,\"text\":\"Post aliquot autem dies, dixit ad Barnabam Paulus : Revertentes visitemus fratres per universas civitates in quibus prædicavimus verbum Domini, quomodo se habeant.\"},{\"verse\":37,\"text\":\"Barnabas autem volebat secum assumere et Joannem, qui cognominabatur Marcus.\"},{\"verse\":38,\"text\":\"Paulus autem rogabat eum (ut qui discessisset ab eis de Pamphylia, et non isset cum eis in opus) non debere recipi.\"},{\"verse\":39,\"text\":\"Facta est autem dissensio, ita ut discederent ab invicem, et Barnabas quidem, assumpto Marco, navigaret Cyprum.\"},{\"verse\":40,\"text\":\"Paulus vero, electo Sila, profectus est, traditus gratiæ Dei a fratribus.\"},{\"verse\":41,\"text\":\"Perambulabat autem Syriam et Ciliciam, confirmans ecclesias : præcipiens custodire præcepta Apostolorum et seniorum.\"}],\"summary\":\"A dissension about circumcision. The decision and letter of the council of Jerusalem.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":14,\"label\":\"Acts 14\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":16,\"label\":\"Acts 16\"}}]]\n"])</script></body></html>
