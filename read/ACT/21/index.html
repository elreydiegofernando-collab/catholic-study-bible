<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 21 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul goes up to Jerusalem. He is apprehended by the Jews in the temple.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when it came to pass that, being parted from them, we set sail, we came with a straight course to Coos, and the day following to Rhodes: and from thence to Patara.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when we had found a ship sailing over to Phenice, we went aboard and set forth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when we had discovered Cyprus, leaving it on the left hand, we sailed into Syria, and came to Tyre: for there the ship was to unlade her burden.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And finding disciples, we tarried there seven days: who said to Paul, through the Spirit, that he should not go up to Jerusalem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the days being expired, departing we went forward, they all bringing us on our way, with their wives and children, till we were out of the city. And we kneeled down on the shore: and we prayed.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when we had bid one another farewell, we took ship. And they returned home.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But we, having finished the voyage by sea, from Tyre came down to Ptolemais: and saluting the brethren, we abode one day with them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the next day departing, we came to Cæsarea. And entering into the house of Philip the evangelist, who was one of the seven, we abode with him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he had four daughters, virgins, who did prophesy.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And as we tarried there for some days, there came from Judea a certain prophet, named Agabus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who, when he was come to us, took Paul’s girdle: and binding his own feet and hands, he said: Thus saith the Holy Ghost: The man whose girdle this is, the Jews shall bind in this manner in Jerusalem and shall deliver him into the hands of the Gentiles.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Which when we had heard, both we and they that were of that place desired him that he would not go up to Jerusalem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then Paul answered and said: What do you mean, weeping and afflicting my heart? For I am ready not only to be bound, but to die also in Jerusalem, for the name of the Lord Jesus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when we could not persuade him, we ceased, saying: The will of the Lord be done.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And after those days, being prepared, we went up to Jerusalem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And there went also with us some of the disciples from Cæsarea, bringing with them one Mnason a Cyprian, an old disciple, with whom we should lodge.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when we were come to Jerusalem, the brethren received us gladly.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the day following, Paul went in with us unto James: and all the ancients were assembled.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Whom when he had saluted, he related particularly what things God had wrought among the Gentiles by his ministry.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But they hearing it, glorified God and said to him: Thou seest, brother, how many thousands there are among the Jews that have believed: and they are all zealous for the law.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Now they have heard of thee that thou teachest those Jews, who are among the Gentiles to depart from Moses: saying that they ought not to circumcise their children, nor walk according to the custom.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>What is it therefore? The multitude must needs come together: for they will hear that thou art come.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Do therefore this that we say to thee. We have four men, who have a vow on them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Take these and sanctify thyself with them: and bestow on them, that they may shave their heads. And all will know that the things which they have heard of thee are false: but that thou thyself also walkest keeping the law.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But, as touching the Gentiles that believe, we have written, decreeing that they should only refrain themselves from that which has been offered to idols and from blood and from things strangled and from fornication.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then Paul took the men and, the next day being purified with them, entered into the temple, giving notice of the accomplishment of the days of purification, until an oblation should be offered for every one of them.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But when the seven days were drawing to an end, those Jews that were of Asia, when they saw him in the temple, stirred up all the people and laid hands upon him, crying out:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Men of Israel, help: This is the man that teacheth all men every where against the people and the law and this place; and moreover hath brought in Gentiles into the temple and hath violated this holy place.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>(For they had seen Trophimus the Ephesian in the city with him. whom they supposed that Paul had brought into the temple.)</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the whole city was in an uproar: and the people ran together. And taking Paul, they drew him out of the temple: and immediately the doors were shut.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And as they went about to kill him, it was told the tribune of the band that all Jerusalem was in confusion.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Who, forthwith taking with him soldiers and centurions, ran down to them. And when they saw the tribune and the soldiers, they left off beating Paul.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Then the tribune, coming near, took him and commanded him to be bound with two chains: and demanded who he was and what he had done.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And some cried one thing, some another, among the multitude. And when he could not know the certainty for the tumult, he commanded him to be carried into the castle.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when he was come to the stairs, it fell out that he was carried by the soldiers, because of the violence of the people.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For the multitude of the people followed after, crying: Away with him!</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And as Paul was about to be brought into the castle, he saith to the tribune: May I speak something to thee? Who said: Canst thou speak Greek?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Art not thou that Egyptian who before these days didst raise a tumult and didst lead forth into the desert four thousand men that were murderers?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>But Paul said to him: I am a Jew of Tarsus in Cilicia, a citizen of no mean city. And I beseech thee, suffer me to speak to the people.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when he had given him leave, Paul standing on the stairs, beckoned with his hand to the people. And a great silence being made, he spoke unto them in the Hebrew tongue, saying:</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cum autem factum esset ut navigaremus abstracti ab eis, recto cursu venimus Coum, et sequenti die Rhodum, et inde Pataram.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et cum invenissemus navem transfretantem in Phœnicen, ascendentes navigavimus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cum apparuissemus autem Cypro, relinquentes eam ad sinistram, navigavimus in Syriam, et venimus Tyrum : ibi enim navis expositura erat onus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Inventis autem discipulis, mansimus ibi diebus septem : qui Paulo dicebant per Spiritum ne ascenderet Jerosolymam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et expletis diebus, profecti ibamus, deducentibus nos omnibus cum uxoribus et filiis usque foras civitatem : et positis genibus in littore, oravimus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et cum valefecissemus invicem, ascendimus navem : illi autem redierunt in sua.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nos vero navigatione expleta a Tyro descendimus Ptolemaidam : et salutatis fratribus, mansimus die una apud illos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Alia autem die profecti, venimus Cæsaream. Et intrantes domum Philippi evangelistæ, qui erat unus de septem, mansimus apud eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Huic autem erant quatuor filiæ virgines prophetantes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et cum moraremur per dies aliquot, supervenit quidam a Judæa propheta, nomine Agabus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Is cum venisset ad nos, tulit zonam Pauli : et alligans sibi pedes et manus, dixit : Hæc dicit Spiritus Sanctus : Virum, cujus est zona hæc, sic alligabunt in Jerusalem Judæi, et tradent in manus gentium.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quod cum audissemus, rogabamus nos, et qui loci illius erant, ne ascenderet Jerosolymam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tunc respondit Paulus, et dixit : Quid facitis flentes, et affligentes cor meum ? Ego enim non solum alligari, sed et mori in Jerusalem paratus sum propter nomen Domini Jesu.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et cum ei suadere non possemus, quievimus, dicentes : Domini voluntas fiat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Post dies autem istos, præparati ascendebamus in Jerusalem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Venerunt autem et ex discipulis a Cæsarea nobiscum, adducentes secum apud quem hospitaremur Mnasonem quemdam Cyprium, antiquum discipulum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et cum venissemus Jerosolymam, libenter exceperunt nos fratres.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sequenti autem die introibat Paulus nobiscum ad Jacobum, omnesque collecti sunt seniores.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quos cum salutasset, narrabat per singula quæ Deus fecisset in gentibus per ministerium ipsius.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>At illi cum audissent, magnificabant Deum, dixeruntque ei : Vides, frater, quot millia sunt in Judæis qui crediderunt, et omnes æmulatores sunt legis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Audierunt autem de te quia discessionem doceas a Moyse eorum qui per gentes sunt Judæorum, dicens non debere eos circumcidere filios suos, neque secundum consuetudinem ingredi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quid ergo est ? utique oportet convenire multitudinem : audient enim te supervenisse.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Hoc ergo fac quod tibi dicimus. Sunt nobis viri quatuor, votum habentes super se.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>His assumptis, sanctifica te cum illis, et impende in illis ut radant capita : et scient omnes quia quæ de te audierunt, falsa sunt, sed ambulas et ipse custodiens legem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>De his autem qui crediderunt ex gentibus, nos scripsimus judicantes ut abstineant se ab idolis immolato, et sanguine, et suffocato, et fornicatione.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tunc Paulus, assumptis viris, postera die purificatus cum illis intravit in templum, annuntians expletionem dierum purificationis, donec offerretur pro unoquoque eorum oblatio.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dum autem septem dies consummarentur, hi qui de Asia erant Judæi, cum vidissent eum in templo, concitaverunt omnem populum, et injecerunt ei manus, clamantes :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Viri Israëlitæ, adjuvate : hic est homo qui adversus populum, et legem, et locum hunc, omnes ubique docens, insuper et gentiles induxit in templum, et violavit sanctum locum istum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Viderant enim Trophimum Ephesium in civitate cum ipso, quem æstimaverunt quoniam in templum introduxisset Paulus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Commotaque est civitas tota, et facta est concursio populi. Et apprehendentes Paulum, trahebant eum extra templum : et statim clausæ sunt januæ.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Quærentibus autem eum occidere, nuntiatum est tribuno cohortis quia tota confunditur Jerusalem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Qui statim, assumptis militibus et centurionibus, decurrit ad illos. Qui cum vidissent tribunum et milites, cessaverunt percutere Paulum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Tunc accedens tribunus apprehendit eum, et jussit eum alligari catenis duabus : et interrogabat quis esset, et quid fecisset.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Alii autem aliud clamabant in turba. Et cum non posset certum cognoscere præ tumultu, jussit duci eum in castra.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et cum venisset ad gradus, contigit ut portaretur a militibus propter vim populi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Sequebatur enim multitudo populi, clamans : Tolle eum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et cum cœpisset induci in castra Paulus, dicit tribuno : Si licet mihi loqui aliquid ad te ? Qui dixit : Græce nosti ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>nonne tu es Ægyptius, qui ante hos dies tumultum concitasti, et eduxisti in desertum quatuor millia virorum sicariorum ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et dixit ad eum Paulus : Ego homo sum quidem Judæus a Tarso Ciliciæ, non ignotæ civitatis municeps. Rogo autem te, permitte mihi loqui ad populum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et cum ille permisisset, Paulus stans in gradibus annuit manu ad plebem, et magno silentio facto, allocutus est lingua hebræa, dicens :</button></div><nav class h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.21\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":21,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And when it came to pass that, being parted from them, we set sail, we came with a straight course to Coos, and the day following to Rhodes: and from thence to Patara.\"},{\"verse\":2,\"text\":\"And when we had found a ship sailing over to Phenice, we went aboard and set forth.\"},{\"verse\":3,\"text\":\"And when we had discovered Cyprus, leaving it on the left hand, we sailed into Syria, and came to Tyre: for there the ship was to unlade her burden.\"},{\"verse\":4,\"text\":\"And finding disciples, we tarried there seven days: who said to Paul, through the Spirit, that he should not go up to Jerusalem.\"},{\"verse\":5,\"text\":\"And the days being expired, departing we went forward, they all bringing us on our way, with their wives and children, till we were out of the city. And we kneeled down on the shore: and we prayed.\"},{\"verse\":6,\"text\":\"And when we had bid one another farewell, we took ship. And they returned home.\"},{\"verse\":7,\"text\":\"But we, having finished the voyage by sea, from Tyre came down to Ptolemais: and saluting the brethren, we abode one day with them.\"},{\"verse\":8,\"text\":\"And the next day departing, we came to Cæsarea. And entering into the house of Philip the evangelist, who was one of the seven, we abode with him.\"},{\"verse\":9,\"text\":\"And he had four daughters, virgins, who did prophesy.\"},{\"verse\":10,\"text\":\"And as we tarried there for some days, there came from Judea a certain prophet, named Agabus.\"},{\"verse\":11,\"text\":\"Who, when he was come to us, took Paul’s girdle: and binding his own feet and hands, he said: Thus saith the Holy Ghost: The man whose girdle this is, the Jews shall bind in this manner in Jerusalem and shall deliver him into the hands of the Gentiles.\"},{\"verse\":12,\"text\":\"Which when we had heard, both we and they that were of that place desired him that he would not go up to Jerusalem.\"},{\"verse\":13,\"text\":\"Then Paul answered and said: What do you mean, weeping and afflicting my heart? For I am ready not only to be bound, but to die also in Jerusalem, for the name of the Lord Jesus.\"},{\"verse\":14,\"text\":\"And when we could not persuade him, we ceased, saying: The will of the Lord be done.\"},{\"verse\":15,\"text\":\"And after those days, being prepared, we went up to Jerusalem.\"},{\"verse\":16,\"text\":\"And there went also with us some of the disciples from Cæsarea, bringing with them one Mnason a Cyprian, an old disciple, with whom we should lodge.\"},{\"verse\":17,\"text\":\"And when we were come to Jerusalem, the brethren received us gladly.\"},{\"verse\":18,\"text\":\"And the day following, Paul went in with us unto James: and all the ancients were assembled.\"},{\"verse\":19,\"text\":\"Whom when he had saluted, he related particularly what things God had wrought among the Gentiles by his ministry.\"},{\"verse\":20,\"text\":\"But they hearing it, glorified God and said to him: Thou seest, brother, how many thousands there are among the Jews that have believed: and they are all zealous for the law.\"},{\"verse\":21,\"text\":\"Now they have heard of thee that thou teachest those Jews, who are among the Gentiles to depart from Moses: saying that they ought not to circumcise their children, nor walk according to the custom.\"},{\"verse\":22,\"text\":\"What is it therefore? The multitude must needs come together: for they will hear that thou art come.\"},{\"verse\":23,\"text\":\"Do therefore this that we say to thee. We have four men, who have a vow on them.\"},{\"verse\":24,\"text\":\"Take these and sanctify thyself with them: and bestow on them, that they may shave their heads. And all will know that the things which they have heard of thee are false: but that thou thyself also walkest keeping the law.\"},{\"verse\":25,\"text\":\"But, as touching the Gentiles that believe, we have written, decreeing that they should only refrain themselves from that which has been offered to idols and from blood and from things strangled and from fornication.\"},{\"verse\":26,\"text\":\"Then Paul took the men and, the next day being purified with them, entered into the temple, giving notice of the accomplishment of the days of purification, until an oblation should be offered for every one of them.\"},{\"verse\":27,\"text\":\"But when the seven days were drawing to an end, those Jews that were of Asia, when they saw him in the temple, stirred up all the people and laid hands upon him, crying out:\"},{\"verse\":28,\"text\":\"Men of Israel, help: This is the man that teacheth all men every where against the people and the law and this place; and moreover hath brought in Gentiles into the temple and hath violated this holy place.\"},{\"verse\":29,\"text\":\"(For they had seen Trophimus the Ephesian in the city with him. whom they supposed that Paul had brought into the temple.)\"},{\"verse\":30,\"text\":\"And the whole city was in an uproar: and the people ran together. And taking Paul, they drew him out of the temple: and immediately the doors were shut.\"},{\"verse\":31,\"text\":\"And as they went about to kill him, it was told the tribune of the band that all Jerusalem was in confusion.\"},{\"verse\":32,\"text\":\"Who, forthwith taking with him soldiers and centurions, ran down to them. And when they saw the tribune and the soldiers, they left off beating Paul.\"},{\"verse\":33,\"text\":\"Then the tribune, coming near, took him and commanded him to be bound with two chains: and demanded who he was and what he had done.\"},{\"verse\":34,\"text\":\"And some cried one thing, some another, among the multitude. And when he could not know the certainty for the tumult, he commanded him to be carried into the castle.\"},{\"verse\":35,\"text\":\"And when he was come to the stairs, it fell out that he was carried by the soldiers, because of the violence of the people.\"},{\"verse\":36,\"text\":\"For the multitude of the people followed after, crying: Away with him!\"},{\"verse\":37,\"text\":\"And as Paul was about to be brought into the castle, he saith to the tribune: May I speak something to thee? Who said: Canst thou speak Greek?\"},{\"verse\":38,\"text\":\"Art not thou that Egyptian who before these days didst raise a tumult and didst lead forth into the desert four thousand men that were murderers?\"},{\"verse\":39,\"text\":\"But Paul said to him: I am a Jew of Tarsus in Cilicia, a citizen of no mean city. And I beseech thee, suffer me to speak to the people.\"},{\"verse\":40,\"text\":\"And when he had given him leave, Paul standing on the stairs, beckoned with his hand to the people. And a great silence being made, he spoke unto them in the Hebrew tongue, saying:\"}],\"vul\":[{\"verse\":1,\"text\":\"Cum autem factum esset ut navigaremus abstracti ab eis, recto cursu venimus Coum, et sequenti die Rhodum, et inde Pataram.\"},{\"verse\":2,\"text\":\"Et cum invenissemus navem transfretantem in Phœnicen, ascendentes navigavimus.\"},{\"verse\":3,\"text\":\"Cum apparuissemus autem Cypro, relinquentes eam ad sinistram, navigavimus in Syriam, et venimus Tyrum : ibi enim navis expositura erat onus.\"},{\"verse\":4,\"text\":\"Inventis autem discipulis, mansimus ibi diebus septem : qui Paulo dicebant per Spiritum ne ascenderet Jerosolymam.\"},{\"verse\":5,\"text\":\"Et expletis diebus, profecti ibamus, deducentibus nos omnibus cum uxoribus et filiis usque foras civitatem : et positis genibus in littore, oravimus.\"},{\"verse\":6,\"text\":\"Et cum valefecissemus invicem, ascendimus navem : illi autem redierunt in sua.\"},{\"verse\":7,\"text\":\"Nos vero navigatione expleta a Tyro descendimus Ptolemaidam : et salutatis fratribus, mansimus die una apud illos.\"},{\"verse\":8,\"text\":\"Alia autem die profecti, venimus Cæsaream. Et intrantes domum Philippi evangelistæ, qui erat unus de septem, mansimus apud eum.\"},{\"verse\":9,\"text\":\"Huic autem erant quatuor filiæ virgines prophetantes.\"},{\"verse\":10,\"text\":\"Et cum moraremur per dies aliquot, supervenit quidam a Judæa propheta, nomine Agabus.\"},{\"verse\":11,\"text\":\"Is cum venisset ad nos, tulit zonam Pauli : et alligans sibi pedes et manus, dixit : Hæc dicit Spiritus Sanctus : Virum, cujus est zona hæc, sic alligabunt in Jerusalem Judæi, et tradent in manus gentium.\"},{\"verse\":12,\"text\":\"Quod cum audissemus, rogabamus nos, et qui loci illius erant, ne ascenderet Jerosolymam.\"},{\"verse\":13,\"text\":\"Tunc respondit Paulus, et dixit : Quid facitis flentes, et affligentes cor meum ? Ego enim non solum alligari, sed et mori in Jerusalem paratus sum propter nomen Domini Jesu.\"},{\"verse\":14,\"text\":\"Et cum ei suadere non possemus, quievimus, dicentes : Domini voluntas fiat.\"},{\"verse\":15,\"text\":\"Post dies autem istos, præparati ascendebamus in Jerusalem.\"},{\"verse\":16,\"text\":\"Venerunt autem et ex discipulis a Cæsarea nobiscum, adducentes secum apud quem hospitaremur Mnasonem quemdam Cyprium, antiquum discipulum.\"},{\"verse\":17,\"text\":\"Et cum venissemus Jerosolymam, libenter exceperunt nos fratres.\"},{\"verse\":18,\"text\":\"Sequenti autem die introibat Paulus nobiscum ad Jacobum, omnesque collecti sunt seniores.\"},{\"verse\":19,\"text\":\"Quos cum salutasset, narrabat per singula quæ Deus fecisset in gentibus per ministerium ipsius.\"},{\"verse\":20,\"text\":\"At illi cum audissent, magnificabant Deum, dixeruntque ei : Vides, frater, quot millia sunt in Judæis qui crediderunt, et omnes æmulatores sunt legis.\"},{\"verse\":21,\"text\":\"Audierunt autem de te quia discessionem doceas a Moyse eorum qui per gentes sunt Judæorum, dicens non debere eos circumcidere filios suos, neque secundum consuetudinem ingredi.\"},{\"verse\":22,\"text\":\"Quid ergo est ? utique oportet convenire multitudinem : audient enim te supervenisse.\"},{\"verse\":23,\"text\":\"Hoc ergo fac quod tibi dicimus. Sunt nobis viri quatuor, votum habentes super se.\"},{\"verse\":24,\"text\":\"His assumptis, sanctifica te cum illis, et impende in illis ut radant capita : et scient omnes quia quæ de te audierunt, falsa sunt, sed ambulas et ipse custodiens legem.\"},{\"verse\":25,\"text\":\"De his autem qui crediderunt ex gentibus, nos scripsimus judicantes ut abstineant se ab idolis immolato, et sanguine, et suffocato, et fornicatione.\"},{\"verse\":26,\"text\":\"Tunc Paulus, assumptis viris, postera die purificatus cum illis intravit in templum, annuntians expletionem dierum purificationis, donec offerretur pro unoquoque eorum oblatio.\"},{\"verse\":27,\"text\":\"Dum autem septem dies consummarentur, hi qui de Asia erant Judæi, cum vidissent eum in templo, concitaverunt omnem populum, et injecerunt ei manus, clamantes :\"},{\"verse\":28,\"text\":\"Viri Israëlitæ, adjuvate : hic est homo qui adversus populum, et legem, et locum hunc, omnes ubique docens, insuper et gentiles induxit in templum, et violavit sanctum locum istum.\"},{\"verse\":29,\"text\":\"Viderant enim Trophimum Ephesium in civitate cum ipso, quem æstimaverunt quoniam in templum introduxisset Paulus.\"},{\"verse\":30,\"text\":\"Commotaque est civitas tota, et facta est concursio populi. Et apprehendentes Paulum, trahebant eum extra templum : et statim clausæ sunt januæ.\"},{\"verse\":31,\"text\":\"Quærentibus autem eum occidere, nuntiatum est tribuno cohortis quia tota confunditur Jerusalem.\"},{\"verse\":32,\"text\":\"Qui statim, assumptis militibus et centurionibus, decurrit ad illos. Qui cum vidissent tribunum et milites, cessaverunt percutere Paulum.\"},{\"verse\":33,\"text\":\"Tunc accedens tribunus apprehendit eum, et jussit eum alligari catenis duabus : et interrogabat quis esset, et quid fecisset.\"},{\"verse\":34,\"text\":\"Alii autem aliud clamabant in turba. Et cum non posset certum cognoscere præ tumultu, jussit duci eum in castra.\"},{\"verse\":35,\"text\":\"Et cum venisset ad gradus, contigit ut portaretur a militibus propter vim populi.\"},{\"verse\":36,\"text\":\"Sequebatur enim multitudo populi, clamans : Tolle eum.\"},{\"verse\":37,\"text\":\"Et cum cœpisset induci in castra Paulus, dicit tribuno : Si licet mihi loqui aliquid ad te ? Qui dixit : Græce nosti ?\"},{\"verse\":38,\"text\":\"nonne tu es Ægyptius, qui ante hos dies tumultum concitasti, et eduxisti in desertum quatuor millia virorum sicariorum ?\"},{\"verse\":39,\"text\":\"Et dixit ad eum Paulus : Ego homo sum quidem Judæus a Tarso Ciliciæ, non ignotæ civitatis municeps. Rogo autem te, permitte mihi loqui ad populum.\"},{\"verse\":40,\"text\":\"Et cum ille permisisset, Paulus stans in gradibus annuit manu ad plebem, et magno silentio facto, allocutus est lingua hebræa, dicens :\"}],\"summary\":\"Paul goes up to Jerusalem. He is apprehended by the Jews in the temple.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":20,\"label\":\"Acts 20\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":22,\"label\":\"Acts 22\"}}]]\n"])</script></body></html>
