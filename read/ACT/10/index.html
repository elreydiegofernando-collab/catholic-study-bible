<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 10 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Cornelius is received into the church. Peter’s vision.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And there was a certain man in Cæsarea, named Cornelius, a centurion of that which is called the Italian band:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A religious man, and fearing God with all his house, giving much alms to the people and always praying to God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>This man saw in a vision manifestly, about the ninth hour of the day, an angel of God coming in unto him and saying to him: Cornelius.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he, beholding him, being seized with fear, said: What is it, Lord? And he said to him: Thy prayers and thy alms are ascended for a memorial in the sight of God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And now send men to Joppe: and call hither one Simon, who is surnamed Peter.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He lodgeth with one Simon a tanner, whose house is by the sea side. He will tell thee what thou must do.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when the angel who spoke to him was departed, he called two of his household servants and a soldier who feared the Lord, of them that were under him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>To whom when he had related all, he sent them to Joppe.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And on the next day, whilst they were going on their journey and drawing nigh to the city, Peter went up to the higher parts of the house to pray, about the sixth hour.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And being hungry, he was desirous to taste somewhat. And as they were preparing, there came upon him an ecstasy of mind.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he saw the heaven opened and a certain vessel descending, as it were a great linen sheet let down by the four corners from heaven to the earth:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wherein were all manner of four-footed beasts and creeping things of the earth and fowls of the air.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And there came a voice to him: Arise, Peter. Kill and eat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But Peter said: Far be it from me. For I never did eat any thing that is common and unclean.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the voice spoke to him again the second time: That which God hath cleansed, do not thou call common.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And this was done thrice. And presently the vessel was taken up into heaven.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Now, whilst Peter was doubting within himself what the vision that he had seen should mean, behold the men who were sent from Cornelius, inquiring for Simon’s house, stood at the gate.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when they had called, they asked if Simon, who is surnamed Peter, were lodged there.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And as Peter was thinking of the vision, the Spirit said to him: Behold three men seek thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Arise, therefore: get thee down and go with them, doubting nothing: for I have sent them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then Peter, going down to the men, said: Behold, I am he whom you seek. What is the cause for which you are come?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Who said: Cornelius, a centurion, a just man and one that feareth God, and having good testimony from all the nation of the Jews, received an answer of an holy angel, to send for thee into his house And to hear words of thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Then bringing them in, he lodged them. And the day following, he arose and went with them: and some of the brethren from Joppe accompanied him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the morrow after, he entered into Cæsarea. And Cornelius waited for them, having called together his kinsmen and special friends.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And it came to pass that when Peter was come in, Cornelius came to meet him and falling at his feet adored.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But Peter lifted him up, saying: Arise: I myself also am a man.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And talking with him, he went in and found many that were come together.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said to them: you know how abominable it is for a man that is a Jew to keep company or to come unto one of another nation: but God hath shewed to me, to call no man common or unclean.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For which cause, making no doubt, I came when I was sent for. I ask, therefore, for what cause you have sent for me?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Cornelius said: Four days ago, unto this hour, I was praying in my house, at the ninth hour and behold a man stood before me in white apparel and said:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cornelius, thy prayer is heard and thy alms are had in remembrance in the sight of God.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Send therefore to Joppe: and call hither Simon, who is surnamed Peter. He lodgeth in the house of Simon a tanner, by the sea side.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Immediately therefore I sent to thee: and thou hast done well in coming. Now, therefore, all we are present in thy sight to hear all things whatsoever are commanded thee by the Lord.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And Peter opening his mouth, said: in very deed I perceive that God is not a respecter of persons.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But in every nation, he that feareth him and worketh justice is acceptable to him.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>God sent the word to the children of Israel, preaching peace by Jesus Christ (He is Lord of all).</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>You know the word which hath been published through all Judea: for it began from Galilee, after the baptism which John preached.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesus of Nazareth: how God anointed him with the Holy Ghost and with power, who went about doing good and healing all that were oppressed by the devil, for God was with him.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And we are witnesses of all things that he did in the land of the Jews and in Jerusalem: whom they killed, hanging him upon a tree.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Him God raised up the third day and gave him to be made manifest,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Not to all the people, but to witnesses preordained by God, even to us, who did eat and drink with him, after he arose again from the dead.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And he commanded us to preach to the people and to testify that it is he who was appointed by God to be judge of the living and of the dead.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>To him all the prophets give testimony, that by his name all receive remission of sins, who believe in him.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>While Peter was yet speaking these words, the Holy Ghost fell on all them that heard the word.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And the faithful of the circumcision, who came with Peter, were astonished for that the grace of the Holy Ghost was poured out upon the Gentiles also.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>For they heard them speaking with tongues and magnifying God.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Then Peter answered: Can any man forbid water, that these should not be baptized, who have received the Holy Ghost, as well as we?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And he commanded them to be baptized in the name of the Lord Jesus Christ. Then they desired him to tarry with them some days.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vir autem quidam erat in Cæsarea, nomine Cornelius, centurio cohortis quæ dicitur Italica,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>religiosus, ac timens Deum cum omni domo sua, faciens eleemosynas multas plebi, et deprecans Deum semper.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Is vidit in visu manifeste, quasi hora diei nona, angelum Dei introëuntem ad se, et dicentem sibi : Corneli.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>At ille intuens eum, timore correptus, dixit : Quid est, domine ? Dixit autem illi : Orationes tuæ et eleemosynæ tuæ ascenderunt in memoriam in conspectu Dei.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et nunc mitte viros in Joppen, et accersi Simonem quemdam, qui cognominatur Petrus :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>hic hospitatur apud Simonem quemdam coriarium, cujus est domus juxta mare : hic dicet tibi quid te oporteat facere.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum discessisset angelus qui loquebatur illi, vocavit duos domesticos suos, et militem metuentem Dominum ex his qui illi parebant.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quibus cum narrasset omnia, misit illos in Joppen.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Postera autem die, iter illis facientibus, et appropinquantibus civitati, ascendit Petrus in superiora ut oraret circa horam sextam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et cum esuriret, voluit gustare. Parantibus autem illis, cecidit super eum mentis excessus :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et vidit cælum apertum, et descendens vas quoddam, velut linteum magnum, quatuor initiis submitti de cælo in terram,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>in quo erant omnia quadrupedia, et serpentia terræ, et volatilia cæli.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et facta est vox ad eum : Surge, Petre : occide, et manduca.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ait autem Petrus : Absit Domine, quia numquam manducavi omne commune et immundum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et vox iterum secundo ad eum : Quod Deus purificavit, tu commune ne dixeris.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hoc autem factum est per ter : et statim receptum est vas in cælum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et dum intra se hæsitaret Petrus quidnam esset visio quam vidisset, ecce viri qui missi erant a Cornelio, inquirentes domum Simonis astiterunt ad januam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et cum vocassent, interrogabant, si Simon qui cognominatur Petrus illic haberet hospitium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Petro autem cogitante de visione, dixit Spiritus ei : Ecce viri tres quærunt te.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Surge itaque, descende, et vade cum eis nihil dubitans : quia ego misi illos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Descendens autem Petrus ad viros, dixit : Ecce ego sum, quem quæritis : quæ causa est, propter quam venistis ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui dixerunt : Cornelius centurio, vir justus et timens Deum, et testimonium habens ab universa gente Judæorum, responsum accepit ab angelo sancto accersire te in domum suam, et audire verba abs te.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Introducens ergo eos, recepit hospitio. Sequenti autem die, surgens profectus est cum illis, et quidam ex fratribus ab Joppe comitati sunt eum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Altera autem die introivit Cæsaream. Cornelius vero exspectabat illos, convocatis cognatis suis et necessariis amicis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et factum est cum introisset Petrus, obvius venit ei Cornelius, et procidens ad pedes ejus adoravit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Petrus vero elevavit eum, dicens : Surge : et ego ipse homo sum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et loquens cum illo intravit, et invenit multos qui convenerant :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>dixitque ad illos : Vos scitis quomodo abominatum sit viro Judæo conjungi aut accedere ad alienigenam : sed mihi ostendit Deus neminem communem aut immundum dicere hominem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Propter quod sine dubitatione veni accersitus. Interrogo ergo, quam ob causam accersistis me ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et Cornelius ait : A nudiusquarta die usque ad hanc horam, orans eram hora nona in domo mea, et ecce vir stetit ante me in veste candida, et ait :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Corneli, exaudita est oratio tua, et eleemosynæ tuæ commemoratæ sunt in conspectu Dei.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Mitte ergo in Joppen, et accersi Simonem qui cognominatur Petrus : hic hospitatur in domo Simonis coriarii juxta mare.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Confestim ergo misi ad te : et tu benefecisti veniendo. Nunc ergo omnes nos in conspectu tuo adsumus audire omnia quæcumque tibi præcepta sunt a Domino.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Aperiens autem Petrus os suum, dixit : In veritate comperi quia non est personarum acceptor Deus ;</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>sed in omni gente qui timet eum, et operatur justitiam, acceptus est illi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Verbum misit Deus filiis Israël, annuntians pacem per Jesum Christum (hic est omnium Dominus).</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Vos scitis quod factum est verbum per universam Judæam : incipiens enim a Galilæa post baptismum quod prædicavit Joannes,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesum a Nazareth : quomodo unxit eum Deus Spiritu Sancto, et virtute, qui pertransiit benefaciendo, et sanando omnes oppressos a diabolo, quoniam Deus erat cum illo.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et nos testes sumus omnium quæ fecit in regione Judæorum, et Jerusalem, quem occiderunt suspendentes in ligno.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Hunc Deus suscitavit tertia die, et dedit eum manifestum fieri,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>non omni populo, sed testibus præordinatis a Deo : nobis, qui manducavimus et bibimus cum illo postquam resurrexit a mortuis.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et præcepit nobis prædicare populo, et testificari, quia ipse est qui constitutus est a Deo judex vivorum et mortuorum.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Huic omnes prophetæ testimonium perhibent remissionem peccatorum accipere per nomen ejus omnes qui credunt in eum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Adhuc loquente Petro verba hæc, cecidit Spiritus Sanctus super omnes qui audiebant verbum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et obstupuerunt ex circumcisione fideles qui venerant cum Petro, quia et in nationes gratia Spiritus Sancti effusa est.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Audiebant enim illos loquentes linguis, et magnificantes Deum.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Tunc respondit Petrus : Numquid aquam quis prohibere potest ut non baptizentur hi qui Spiritum Sanctum acceperunt sicut et nos ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Et jussit eos baptizari in nomine Domini Jesu Christi. Tunc rogaverunt eum ut maneret apud eos aliquot diebus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria atic/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.10\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":10,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And there was a certain man in Cæsarea, named Cornelius, a centurion of that which is called the Italian band:\"},{\"verse\":2,\"text\":\"A religious man, and fearing God with all his house, giving much alms to the people and always praying to God.\"},{\"verse\":3,\"text\":\"This man saw in a vision manifestly, about the ninth hour of the day, an angel of God coming in unto him and saying to him: Cornelius.\"},{\"verse\":4,\"text\":\"And he, beholding him, being seized with fear, said: What is it, Lord? And he said to him: Thy prayers and thy alms are ascended for a memorial in the sight of God.\"},{\"verse\":5,\"text\":\"And now send men to Joppe: and call hither one Simon, who is surnamed Peter.\"},{\"verse\":6,\"text\":\"He lodgeth with one Simon a tanner, whose house is by the sea side. He will tell thee what thou must do.\"},{\"verse\":7,\"text\":\"And when the angel who spoke to him was departed, he called two of his household servants and a soldier who feared the Lord, of them that were under him.\"},{\"verse\":8,\"text\":\"To whom when he had related all, he sent them to Joppe.\"},{\"verse\":9,\"text\":\"And on the next day, whilst they were going on their journey and drawing nigh to the city, Peter went up to the higher parts of the house to pray, about the sixth hour.\"},{\"verse\":10,\"text\":\"And being hungry, he was desirous to taste somewhat. And as they were preparing, there came upon him an ecstasy of mind.\"},{\"verse\":11,\"text\":\"And he saw the heaven opened and a certain vessel descending, as it were a great linen sheet let down by the four corners from heaven to the earth:\"},{\"verse\":12,\"text\":\"Wherein were all manner of four-footed beasts and creeping things of the earth and fowls of the air.\"},{\"verse\":13,\"text\":\"And there came a voice to him: Arise, Peter. Kill and eat.\"},{\"verse\":14,\"text\":\"But Peter said: Far be it from me. For I never did eat any thing that is common and unclean.\"},{\"verse\":15,\"text\":\"And the voice spoke to him again the second time: That which God hath cleansed, do not thou call common.\"},{\"verse\":16,\"text\":\"And this was done thrice. And presently the vessel was taken up into heaven.\"},{\"verse\":17,\"text\":\"Now, whilst Peter was doubting within himself what the vision that he had seen should mean, behold the men who were sent from Cornelius, inquiring for Simon’s house, stood at the gate.\"},{\"verse\":18,\"text\":\"And when they had called, they asked if Simon, who is surnamed Peter, were lodged there.\"},{\"verse\":19,\"text\":\"And as Peter was thinking of the vision, the Spirit said to him: Behold three men seek thee.\"},{\"verse\":20,\"text\":\"Arise, therefore: get thee down and go with them, doubting nothing: for I have sent them.\"},{\"verse\":21,\"text\":\"Then Peter, going down to the men, said: Behold, I am he whom you seek. What is the cause for which you are come?\"},{\"verse\":22,\"text\":\"Who said: Cornelius, a centurion, a just man and one that feareth God, and having good testimony from all the nation of the Jews, received an answer of an holy angel, to send for thee into his house And to hear words of thee.\"},{\"verse\":23,\"text\":\"Then bringing them in, he lodged them. And the day following, he arose and went with them: and some of the brethren from Joppe accompanied him.\"},{\"verse\":24,\"text\":\"And the morrow after, he entered into Cæsarea. And Cornelius waited for them, having called together his kinsmen and special friends.\"},{\"verse\":25,\"text\":\"And it came to pass that when Peter was come in, Cornelius came to meet him and falling at his feet adored.\"},{\"verse\":26,\"text\":\"But Peter lifted him up, saying: Arise: I myself also am a man.\"},{\"verse\":27,\"text\":\"And talking with him, he went in and found many that were come together.\"},{\"verse\":28,\"text\":\"And he said to them: you know how abominable it is for a man that is a Jew to keep company or to come unto one of another nation: but God hath shewed to me, to call no man common or unclean.\"},{\"verse\":29,\"text\":\"For which cause, making no doubt, I came when I was sent for. I ask, therefore, for what cause you have sent for me?\"},{\"verse\":30,\"text\":\"And Cornelius said: Four days ago, unto this hour, I was praying in my house, at the ninth hour and behold a man stood before me in white apparel and said:\"},{\"verse\":31,\"text\":\"Cornelius, thy prayer is heard and thy alms are had in remembrance in the sight of God.\"},{\"verse\":32,\"text\":\"Send therefore to Joppe: and call hither Simon, who is surnamed Peter. He lodgeth in the house of Simon a tanner, by the sea side.\"},{\"verse\":33,\"text\":\"Immediately therefore I sent to thee: and thou hast done well in coming. Now, therefore, all we are present in thy sight to hear all things whatsoever are commanded thee by the Lord.\"},{\"verse\":34,\"text\":\"And Peter opening his mouth, said: in very deed I perceive that God is not a respecter of persons.\"},{\"verse\":35,\"text\":\"But in every nation, he that feareth him and worketh justice is acceptable to him.\"},{\"verse\":36,\"text\":\"God sent the word to the children of Israel, preaching peace by Jesus Christ (He is Lord of all).\"},{\"verse\":37,\"text\":\"You know the word which hath been published through all Judea: for it began from Galilee, after the baptism which John preached.\"},{\"verse\":38,\"text\":\"Jesus of Nazareth: how God anointed him with the Holy Ghost and with power, who went about doing good and healing all that were oppressed by the devil, for God was with him.\"},{\"verse\":39,\"text\":\"And we are witnesses of all things that he did in the land of the Jews and in Jerusalem: whom they killed, hanging him upon a tree.\"},{\"verse\":40,\"text\":\"Him God raised up the third day and gave him to be made manifest,\"},{\"verse\":41,\"text\":\"Not to all the people, but to witnesses preordained by God, even to us, who did eat and drink with him, after he arose again from the dead.\"},{\"verse\":42,\"text\":\"And he commanded us to preach to the people and to testify that it is he who was appointed by God to be judge of the living and of the dead.\"},{\"verse\":43,\"text\":\"To him all the prophets give testimony, that by his name all receive remission of sins, who believe in him.\"},{\"verse\":44,\"text\":\"While Peter was yet speaking these words, the Holy Ghost fell on all them that heard the word.\"},{\"verse\":45,\"text\":\"And the faithful of the circumcision, who came with Peter, were astonished for that the grace of the Holy Ghost was poured out upon the Gentiles also.\"},{\"verse\":46,\"text\":\"For they heard them speaking with tongues and magnifying God.\"},{\"verse\":47,\"text\":\"Then Peter answered: Can any man forbid water, that these should not be baptized, who have received the Holy Ghost, as well as we?\"},{\"verse\":48,\"text\":\"And he commanded them to be baptized in the name of the Lord Jesus Christ. Then they desired him to tarry with them some days.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vir autem quidam erat in Cæsarea, nomine Cornelius, centurio cohortis quæ dicitur Italica,\"},{\"verse\":2,\"text\":\"religiosus, ac timens Deum cum omni domo sua, faciens eleemosynas multas plebi, et deprecans Deum semper.\"},{\"verse\":3,\"text\":\"Is vidit in visu manifeste, quasi hora diei nona, angelum Dei introëuntem ad se, et dicentem sibi : Corneli.\"},{\"verse\":4,\"text\":\"At ille intuens eum, timore correptus, dixit : Quid est, domine ? Dixit autem illi : Orationes tuæ et eleemosynæ tuæ ascenderunt in memoriam in conspectu Dei.\"},{\"verse\":5,\"text\":\"Et nunc mitte viros in Joppen, et accersi Simonem quemdam, qui cognominatur Petrus :\"},{\"verse\":6,\"text\":\"hic hospitatur apud Simonem quemdam coriarium, cujus est domus juxta mare : hic dicet tibi quid te oporteat facere.\"},{\"verse\":7,\"text\":\"Et cum discessisset angelus qui loquebatur illi, vocavit duos domesticos suos, et militem metuentem Dominum ex his qui illi parebant.\"},{\"verse\":8,\"text\":\"Quibus cum narrasset omnia, misit illos in Joppen.\"},{\"verse\":9,\"text\":\"Postera autem die, iter illis facientibus, et appropinquantibus civitati, ascendit Petrus in superiora ut oraret circa horam sextam.\"},{\"verse\":10,\"text\":\"Et cum esuriret, voluit gustare. Parantibus autem illis, cecidit super eum mentis excessus :\"},{\"verse\":11,\"text\":\"et vidit cælum apertum, et descendens vas quoddam, velut linteum magnum, quatuor initiis submitti de cælo in terram,\"},{\"verse\":12,\"text\":\"in quo erant omnia quadrupedia, et serpentia terræ, et volatilia cæli.\"},{\"verse\":13,\"text\":\"Et facta est vox ad eum : Surge, Petre : occide, et manduca.\"},{\"verse\":14,\"text\":\"Ait autem Petrus : Absit Domine, quia numquam manducavi omne commune et immundum.\"},{\"verse\":15,\"text\":\"Et vox iterum secundo ad eum : Quod Deus purificavit, tu commune ne dixeris.\"},{\"verse\":16,\"text\":\"Hoc autem factum est per ter : et statim receptum est vas in cælum.\"},{\"verse\":17,\"text\":\"Et dum intra se hæsitaret Petrus quidnam esset visio quam vidisset, ecce viri qui missi erant a Cornelio, inquirentes domum Simonis astiterunt ad januam.\"},{\"verse\":18,\"text\":\"Et cum vocassent, interrogabant, si Simon qui cognominatur Petrus illic haberet hospitium.\"},{\"verse\":19,\"text\":\"Petro autem cogitante de visione, dixit Spiritus ei : Ecce viri tres quærunt te.\"},{\"verse\":20,\"text\":\"Surge itaque, descende, et vade cum eis nihil dubitans : quia ego misi illos.\"},{\"verse\":21,\"text\":\"Descendens autem Petrus ad viros, dixit : Ecce ego sum, quem quæritis : quæ causa est, propter quam venistis ?\"},{\"verse\":22,\"text\":\"Qui dixerunt : Cornelius centurio, vir justus et timens Deum, et testimonium habens ab universa gente Judæorum, responsum accepit ab angelo sancto accersire te in domum suam, et audire verba abs te.\"},{\"verse\":23,\"text\":\"Introducens ergo eos, recepit hospitio. Sequenti autem die, surgens profectus est cum illis, et quidam ex fratribus ab Joppe comitati sunt eum.\"},{\"verse\":24,\"text\":\"Altera autem die introivit Cæsaream. Cornelius vero exspectabat illos, convocatis cognatis suis et necessariis amicis.\"},{\"verse\":25,\"text\":\"Et factum est cum introisset Petrus, obvius venit ei Cornelius, et procidens ad pedes ejus adoravit.\"},{\"verse\":26,\"text\":\"Petrus vero elevavit eum, dicens : Surge : et ego ipse homo sum.\"},{\"verse\":27,\"text\":\"Et loquens cum illo intravit, et invenit multos qui convenerant :\"},{\"verse\":28,\"text\":\"dixitque ad illos : Vos scitis quomodo abominatum sit viro Judæo conjungi aut accedere ad alienigenam : sed mihi ostendit Deus neminem communem aut immundum dicere hominem.\"},{\"verse\":29,\"text\":\"Propter quod sine dubitatione veni accersitus. Interrogo ergo, quam ob causam accersistis me ?\"},{\"verse\":30,\"text\":\"Et Cornelius ait : A nudiusquarta die usque ad hanc horam, orans eram hora nona in domo mea, et ecce vir stetit ante me in veste candida, et ait :\"},{\"verse\":31,\"text\":\"Corneli, exaudita est oratio tua, et eleemosynæ tuæ commemoratæ sunt in conspectu Dei.\"},{\"verse\":32,\"text\":\"Mitte ergo in Joppen, et accersi Simonem qui cognominatur Petrus : hic hospitatur in domo Simonis coriarii juxta mare.\"},{\"verse\":33,\"text\":\"Confestim ergo misi ad te : et tu benefecisti veniendo. Nunc ergo omnes nos in conspectu tuo adsumus audire omnia quæcumque tibi præcepta sunt a Domino.\"},{\"verse\":34,\"text\":\"Aperiens autem Petrus os suum, dixit : In veritate comperi quia non est personarum acceptor Deus ;\"},{\"verse\":35,\"text\":\"sed in omni gente qui timet eum, et operatur justitiam, acceptus est illi.\"},{\"verse\":36,\"text\":\"Verbum misit Deus filiis Israël, annuntians pacem per Jesum Christum (hic est omnium Dominus).\"},{\"verse\":37,\"text\":\"Vos scitis quod factum est verbum per universam Judæam : incipiens enim a Galilæa post baptismum quod prædicavit Joannes,\"},{\"verse\":38,\"text\":\"Jesum a Nazareth : quomodo unxit eum Deus Spiritu Sancto, et virtute, qui pertransiit benefaciendo, et sanando omnes oppressos a diabolo, quoniam Deus erat cum illo.\"},{\"verse\":39,\"text\":\"Et nos testes sumus omnium quæ fecit in regione Judæorum, et Jerusalem, quem occiderunt suspendentes in ligno.\"},{\"verse\":40,\"text\":\"Hunc Deus suscitavit tertia die, et dedit eum manifestum fieri,\"},{\"verse\":41,\"text\":\"non omni populo, sed testibus præordinatis a Deo : nobis, qui manducavimus et bibimus cum illo postquam resurrexit a mortuis.\"},{\"verse\":42,\"text\":\"Et præcepit nobis prædicare populo, et testificari, quia ipse est qui constitutus est a Deo judex vivorum et mortuorum.\"},{\"verse\":43,\"text\":\"Huic omnes prophetæ testimonium perhibent remissionem peccatorum accipere per nomen ejus omnes qui credunt in eum.\"},{\"verse\":44,\"text\":\"Adhuc loquente Petro verba hæc, cecidit Spiritus Sanctus super omnes qui audiebant verbum.\"},{\"verse\":45,\"text\":\"Et obstupuerunt ex circumcisione fideles qui venerant cum Petro, quia et in nationes gratia Spiritus Sancti effusa est.\"},{\"verse\":46,\"text\":\"Audiebant enim illos loquentes linguis, et magnificantes Deum.\"},{\"verse\":47,\"text\":\"Tunc respondit Petrus : Numquid aquam quis prohibere potest ut non baptizentur hi qui Spiritum Sanctum acceperunt sicut et nos ?\"},{\"verse\":48,\"text\":\"Et jussit eos baptizari in nomine Domini Jesu Christi. Tunc rogaverunt eum ut maneret apud eos aliquot diebus.\"}],\"summary\":\"Cornelius is received into the church. Peter’s vision.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":9,\"label\":\"Acts 9\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":11,\"label\":\"Acts 11\"}}]]\n"])</script></body></html>
