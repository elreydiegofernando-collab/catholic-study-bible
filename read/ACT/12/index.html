 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">12</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Herod’s persecution. Peter’s deliverance by an angel. Herod’s punishment.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And at the same time, Herod the king stretched forth his hands, to afflict some of the church.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he killed James, the brother of John, With the sword.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And seeing that it pleased the Jews, he proceeded to take up Peter also. Now it was in the days of the Azymes.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when he had apprehended him, he cast him into prison, delivering him to four files of soldiers, to be kept, intending, after the pasch, to bring him forth to the people.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Peter therefore was kept in prison. But prayer was made without ceasing by the church unto God for him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when Herod would have brought him forth, the same night, Peter was sleeping between two soldiers, bound with two chains: and the keepers before the door kept the prison.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And behold an angel of the Lord stood by him and a light shined in the room. And he, striking Peter on the side, raised him up, saying: Arise quickly. And the chains fell off from his hands.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the angel said to him: Gird thyself and put on thy sandals. And he did so. And he said to him: Cast thy garment about thee and follow me,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And going out, he followed him. And he knew not that it was true which was done by the angel: but thought he saw a vision.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And passing through the first and the second ward, they came to the iron gate that leadeth to the city which of itself opened to them. And going out, they passed on through one street. And immediately the angel departed from him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Peter coming to himself, said: Now I know in very deed that the Lord hath sent his angel and hath delivered me out of the hand of Herod and from all the expectation of the people of the Jews.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And considering, he came to the house of Mary the mother of John, who was surnamed Mark, where many were gathered together and praying.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when he knocked at the door of the gate, a damsel came to hearken, whose name was Rhode.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And as soon as she knew Peter’s voice, she opened not the gate for joy: but running in she told that Peter stood before the gate.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But they said to her: Thou art mad. But she affirmed that it was so. Then said they: It is his angel.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But Peter continued knocking. And when they had opened, they saw him and were astonished.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But he, beckoning to them with his hand to hold their peace, told how the Lord had brought him out of prison. And he said: Tell these things to James and to the brethren. And going out, he went into another place.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Now when day was come, there was no small stir among the soldiers, what was become of Peter.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And when Herod had sought for him and found him not, having examined the keepers, he commanded they should be put to death. And going down from Judea to Cæsarea, he abode there.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he was angry with the Tyrians and the Sidonians. But they with one accord came to him: and, having gained Blastus who was the king’s chamberlain, they desired peace, because their countries were nourished by him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And upon a day appointed, Herod being arrayed in kingly apparel, sat in the judgment seat and made an oration to them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the people made acclamation, saying: It is the voice of a god, and not of a man.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And forthwith an angel of the Lord struck him, because he had not given the honour to God: and, being eaten up by worms, he gave up the ghost.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But the word of the Lord increased and multiplied.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Barnabas and Saul, returned from Jerusalem, having fulfilled their ministry, taking with them John who was surnamed Mark.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Eodem autem tempore misit Herodes rex manus, ut affligeret quosdam de ecclesia.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Occidit autem Jacobum fratrem Joannis gladio.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Videns autem quia placeret Judæis, apposuit ut apprehenderet et Petrum. Erant autem dies Azymorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quem cum apprehendisset, misit in carcerem, tradens quatuor quaternionibus militum custodiendum, volens post Pascha producere eum populo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et Petrus quidem servabatur in carcere. Oratio autem fiebat sine intermissione ab ecclesia ad Deum pro eo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cum autem producturus eum esset Herodes, in ipsa nocte erat Petrus dormiens inter duos milites, vinctus catenis duabus : et custodes ante ostium custodiebant carcerem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ecce angelus Domini astitit, et lumen refulsit in habitaculo : percussoque latere Petri, excitavit eum, dicens : Surge velociter. Et ceciderunt catenæ de manibus ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixit autem angelus ad eum : Præcingere, et calcea te caligas tuas. Et fecit sic. Et dixit illi : Circumda tibi vestimentum tuum, et sequere me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et exiens sequebatur eum, et nesciebat quia verum est, quod fiebat per angelum : existimabat autem se visum videre.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Transeuntes autem primam et secundam custodiam, venerunt ad portam ferream, quæ ducit ad civitatem : quæ ultro aperta est eis. Et exeuntes processerunt vicum unum : et continuo discessit angelus ab eo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et Petrus ad se reversus, dixit : Nunc scio vere quia misit Dominus angelum suum, et eripuit me de manu Herodis, et de omni exspectatione plebis Judæorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Consideransque venit ad domum Mariæ matris Joannis, qui cognominatus est Marcus, ubi erant multi congregati, et orantes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Pulsante autem eo ostium januæ, processit puella ad audiendum, nomine Rhode.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ut cognovit vocem Petri, præ gaudio non aperuit januam, sed intro currens nuntiavit stare Petrum ante januam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>At illi dixerunt ad eam : Insanis. Illa autem affirmabat sic se habere. Illi autem dicebant : Angelus ejus est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Petrus autem perseverabat pulsans. Cum autem aperuissent, viderunt eum, et obstupuerunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Annuens autem eis manu ut tacerent, narravit quomodo Dominus eduxisset eum de carcere, dixitque : Nuntiate Jacobo et fratribus hæc. Et egressus abiit in alium locum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Facta autem die, erat non parva turbatio inter milites, quidnam factum esset de Petro.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Herodes autem cum requisisset eum et non invenisset, inquisitione facta de custodibus, jussit eos duci : descendensque a Judæa in Cæsaream, ibi commoratus est.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Erat autem iratus Tyriis et Sidoniis. At illi unanimes venerunt ad eum, et persuaso Blasto, qui erat super cubiculum regis, postulabant pacem, eo quod alerentur regiones eorum ab illo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Statuto autem die Herodes vestitus veste regia sedit pro tribunali, et concionabatur ad eos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Populus autem acclamabat : Dei voces, et non hominis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Confestim autem percussit eum angelus Domini, eo quod non dedisset honorem Deo : et consumptus a vermibus, expiravit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Verbum autem Domini crescebat, et multiplicabatur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Barnabas autem et Saulus reversi sunt ab Jerosolymis expleto ministerio assumpto Joanne, qui cognominatus est Marcus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 11</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/13/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 13</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidde d to him: Gird thyself and put on thy sandals. And he did so. And he said to him: Cast thy garment about thee and follow me,\"},{\"verse\":9,\"text\":\"And going out, he followed him. And he knew not that it was true which was done by the angel: but thought he saw a vision.\"},{\"verse\":10,\"text\":\"And passing through the first and the second ward, they came to the iron gate that leadeth to the city which of itself opened to them. And going out, they passed on through one street. And immediately the angel departed from him.\"},{\"verse\":11,\"text\":\"And Peter coming to himself, said: Now I know in very deed that the Lord hath sent his angel and hath delivered me out of the hand of Herod and from all the expectation of the people of the Jews.\"},{\"verse\":12,\"text\":\"And considering, he came to the house of Mary the mother of John, who was surnamed Mark, where many were gathered together and praying.\"},{\"verse\":13,\"text\":\"And when he knocked at the door of the gate, a damsel came to hearken, whose name was Rhode.\"},{\"verse\":14,\"text\":\"And as soon as she knew Peter’s voice, she opened not the gate for joy: but running in she told that Peter stood before the gate.\"},{\"verse\":15,\"text\":\"But they said to her: Thou art mad. But she affirmed that it was so. Then said they: It is his angel.\"},{\"verse\":16,\"text\":\"But Peter continued knocking. And when they had opened, they saw him and were astonished.\"},{\"verse\":17,\"text\":\"But he, beckoning to them with his hand to hold their peace, told how the Lord had brought him out of prison. And he said: Tell these things to James and to the brethren. And going out, he went into another place.\"},{\"verse\":18,\"text\":\"Now when day was come, there was no small stir among the soldiers, what was become of Peter.\"},{\"verse\":19,\"text\":\"And when Herod had sought for him and found him not, having examined the keepers, he commanded they should be put to death. And going down from Judea to Cæsarea, he abode there.\"},{\"verse\":20,\"text\":\"And he was angry with the Tyrians and the Sidonians. But they with one accord came to him: and, having gained Blastus who was the king’s chamberlain, they desired peace, because their countries were nourished by him.\"},{\"verse\":21,\"text\":\"And upon a day appointed, Herod being arrayed in kingly apparel, sat in the judgment seat and made an oration to them.\"},{\"verse\":22,\"text\":\"And the people made acclamation, saying: It is the voice of a god, and not of a man.\"},{\"verse\":23,\"text\":\"And forthwith an angel of the Lord struck him, because he had not given the honour to God: and, being eaten up by worms, he gave up the ghost.\"},{\"verse\":24,\"text\":\"But the word of the Lord increased and multiplied.\"},{\"verse\":25,\"text\":\"And Barnabas and Saul, returned from Jerusalem, having fulfilled their ministry, taking with them John who was surnamed Mark.\"}],\"vul\":[{\"verse\":1,\"text\":\"Eodem autem tempore misit Herodes rex manus, ut affligeret quosdam de ecclesia.\"},{\"verse\":2,\"text\":\"Occidit autem Jacobum fratrem Joannis gladio.\"},{\"verse\":3,\"text\":\"Videns autem quia placeret Judæis, apposuit ut apprehenderet et Petrum. Erant autem dies Azymorum.\"},{\"verse\":4,\"text\":\"Quem cum apprehendisset, misit in carcerem, tradens quatuor quaternionibus militum custodiendum, volens post Pascha producere eum populo.\"},{\"verse\":5,\"text\":\"Et Petrus quidem servabatur in carcere. Oratio autem fiebat sine intermissione ab ecclesia ad Deum pro eo.\"},{\"verse\":6,\"text\":\"Cum autem producturus eum esset Herodes, in ipsa nocte erat Petrus dormiens inter duos milites, vinctus catenis duabus : et custodes ante ostium custodiebant carcerem.\"},{\"verse\":7,\"text\":\"Et ecce angelus Domini astitit, et lumen refulsit in habitaculo : percussoque latere Petri, excitavit eum, dicens : Surge velociter. Et ceciderunt catenæ de manibus ejus.\"},{\"verse\":8,\"text\":\"Dixit autem angelus ad eum : Præcingere, et calcea te caligas tuas. Et fecit sic. Et dixit illi : Circumda tibi vestimentum tuum, et sequere me.\"},{\"verse\":9,\"text\":\"Et exiens sequebatur eum, et nesciebat quia verum est, quod fiebat per angelum : existimabat autem se visum videre.\"},{\"verse\":10,\"text\":\"Transeuntes autem primam et secundam custodiam, venerunt ad portam ferream, quæ ducit ad civitatem : quæ ultro aperta est eis. Et exeuntes processerunt vicum unum : et continuo discessit angelus ab eo.\"},{\"verse\":11,\"text\":\"Et Petrus ad se reversus, dixit : Nunc scio vere quia misit Dominus angelum suum, et eripuit me de manu Herodis, et de omni exspectatione plebis Judæorum.\"},{\"verse\":12,\"text\":\"Consideransque venit ad domum Mariæ matris Joannis, qui cognominatus est Marcus, ubi erant multi congregati, et orantes.\"},{\"verse\":13,\"text\":\"Pulsante autem eo ostium januæ, processit puella ad audiendum, nomine Rhode.\"},{\"verse\":14,\"text\":\"Et ut cognovit vocem Petri, præ gaudio non aperuit januam, sed intro currens nuntiavit stare Petrum ante januam.\"},{\"verse\":15,\"text\":\"At illi dixerunt ad eam : Insanis. Illa autem affirmabat sic se habere. Illi autem dicebant : Angelus ejus est.\"},{\"verse\":16,\"text\":\"Petrus autem perseverabat pulsans. Cum autem aperuissent, viderunt eum, et obstupuerunt.\"},{\"verse\":17,\"text\":\"Annuens autem eis manu ut tacerent, narravit quomodo Dominus eduxisset eum de carcere, dixitque : Nuntiate Jacobo et fratribus hæc. Et egressus abiit in alium locum.\"},{\"verse\":18,\"text\":\"Facta autem die, erat non parva turbatio inter milites, quidnam factum esset de Petro.\"},{\"verse\":19,\"text\":\"Herodes autem cum requisisset eum et non invenisset, inquisitione facta de custodibus, jussit eos duci : descendensque a Judæa in Cæsaream, ibi commoratus est.\"},{\"verse\":20,\"text\":\"Erat autem iratus Tyriis et Sidoniis. At illi unanimes venerunt ad eum, et persuaso Blasto, qui erat super cubiculum regis, postulabant pacem, eo quod alerentur regiones eorum ab illo.\"},{\"verse\":21,\"text\":\"Statuto autem die Herodes vestitus veste regia sedit pro tribunali, et concionabatur ad eos.\"},{\"verse\":22,\"text\":\"Populus autem acclamabat : Dei voces, et non hominis.\"},{\"verse\":23,\"text\":\"Confestim autem percussit eum angelus Domini, eo quod non dedisset honorem Deo : et consumptus a vermibus, expiravit.\"},{\"verse\":24,\"text\":\"Verbum autem Domini crescebat, et multiplicabatur.\"},{\"verse\":25,\"text\":\"Barnabas autem et Saulus reversi sunt ab Jerosolymis expleto ministerio assumpto Joanne, qui cognominatus est Marcus.\"}],\"summary\":\"Herod’s persecution. Peter’s deliverance by an angel. Herod’s punishment.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":11,\"label\":\"Acts 11\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":13,\"label\":\"Acts 13\"}}]]\n"])</script></body></html>
