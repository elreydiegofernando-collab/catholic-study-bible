meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">23</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul stands before the council. The Jews conspire his death. He is sent away to Cesarea.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Paul, looking upon the council, said: Men, brethren, I have conversed with all good conscience before God until this present day.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the high priest, Ananias, commanded them that stood by him to strike him on the mouth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Then Paul said to him: God shall strike thee, thou whited wall. For, sittest thou to judge me according to the law and, contrary to the law, commandest me to be struck?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they that stood by said: Dost thou revile the high priest of God?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Paul said: I knew not, brethren, that he is the high priest. For it is written: Thou shalt not speak evil of the prince of thy people.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Paul, knowing that the one part were Sadducees and the other Pharisees, cried out in the council: Men, brethren, I am a Pharisee, the son of Pharisees: concerning the hope and resurrection of the dead I am called in question.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when he had so said, there arose a dissension between the Pharisees and the Sadducees. And the multitude was divided.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And there arose a great cry. And some of the Pharisees rising up, strove, saying: We find no evil in this man. What if a spirit hath spoken to him, or an angel?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when there arose a great dissension, the tribune, fearing lest Paul should be pulled in pieces by them, commanded the soldiers to go down and to take him by force from among them and to bring him into the castle.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the night following, the Lord standing by him, said: Be constant: for as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when day was come, some of the Jews gathered together and bound themselves under a curse, saying that they would neither eat nor drink till they killed Paul.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they were more than forty men that had made this conspiracy.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Who came to the chief priests and the ancients and said: We have bound ourselves under a great curse that we will eat nothing till we have slain Paul.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Now therefore do you with the council signify to the tribune, that he bring him forth to you, as if you meant to know something more certain touching him. And we, before he come near, are ready to kill him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Which when Paul’s sister’s son had heard, of their lying in wait, he came and entered into the castle and told Paul.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Paul, calling to him one of the centurions, said: Bring this young man to the tribune: for he hath some thing to tell him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he, taking him, brought him to the tribune and said: Paul, the prisoner, desired me to bring this young man unto thee, who hath some thing to say to thee.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the tribune, taking him by the hand, went aside with him privately and asked him: What is it that thou hast to tell me?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he said: The Jews have agreed to desire thee that thou wouldst bring forth Paul to-morrow into the council, as if they meant to inquire some thing more certain touching him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But do not thou give credit to them: for there lie in wait for him more than forty men of them, who have bound themselves by oath neither to eat nor to drink, till they have killed him. And they are now ready, looking for a promise from thee.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The tribune therefore dismissed the young man, charging him that he should tell no man that he had made known these things unto him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Then having called two centurions, he said to them: Make ready two hundred soldiers to go as far as Cæsarea: and seventy horsemen and two hundred spearmen, for the third hour of the night.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And provide beasts, that they may set Paul on and bring him safe to Felix the governor.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>(For he feared lest perhaps the Jews might take him away by force and kill him: and he should afterwards be slandered, as if he was to take money.) And he wrote a letter after this manner:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Claudius Lysias to the most excellent governor, Felix, greeting:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>This man, being taken by the Jews and ready to be killed by them, I rescued, coming in with an army, understanding that he is a Roman.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And meaning to know the cause which they objected unto him, I brought him forth into their council.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Whom I found to be accused concerning questions of their law; but having nothing laid to his charge worthy of death or of bands.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And when I was told of ambushes that they had prepared for him, I sent him to thee, signifying also to his accusers to plead before thee. Farewell.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Then the soldiers, according as it was commanded them, taking Paul, brought him by night to Antipatris.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the next day, leaving the horsemen to go with him, they returned to the castle.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who, when they were come to Cæsarea and had delivered the letter to the governor, did also present Paul before him.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And when he had read it and had asked of what province he was and understood that he was of Cilicia:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>I will hear thee, said he, when thy accusers come. And he commanded him to be kept in Herod’s judgment hall.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Intendens autem in concilium Paulus, ait : Viri fratres, ego omni conscientia bona conversatus sum ante Deum usque in hodiernum diem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Princeps autem sacerdotum Ananias præcepit astantibus sibi percutere os ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tunc Paulus dixit ad eum : Percutiet te Deus, paries dealbate. Et tu sedens judicas me secundum legem, et contra legem jubes me percuti ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et qui astabant dixerunt : Summum sacerdotem Dei maledicis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixit autem Paulus : Nesciebam, fratres, quia princeps est sacerdotum. Scriptum est enim : Principem populi tui non maledices.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sciens autem Paulus quia una pars esset sadducæorum, et altera pharisæorum, exclamavit in concilio : Viri fratres, ego pharisæus sum, filius pharisæorum : de spe et resurrectione mortuorum ego judicor.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum hæc dixisset, facta est dissensio inter pharisæos et sadducæos, et soluta est multitudo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sadducæi enim dicunt non esse resurrectionem, neque angelum, neque spiritum : pharisæi autem utraque confitentur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Factus est autem clamor magnus. Et surgentes quidam pharisæorum, pugnabant, dicentes : Nihil mali invenimus in homine isto : quid si spiritus locutus est ei, aut angelus ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et cum magna dissensio facta esset, timens tribunus ne discerperetur Paulus ab ipsis, jussit milites descendere, et rapere eum de medio eorum, ac deducere eum in castra.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sequenti autem nocte assistens ei Dominus, ait : Constans esto : sicut enim testificatus es de me in Jerusalem, sic te oportet et Romæ testificari.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Facta autem die collegerunt se quidam ex Judæis, et devoverunt, se dicentes neque manducaturos, neque bibituros donec occiderent Paulum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Erant autem plus quam quadraginta viri qui hanc conjurationem fecerant :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>qui accesserunt ad principes sacerdotum et seniores, et dixerunt : Devotione devovimus nos nihil gustaturos, donec occidamus Paulum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nunc ergo vos notum facite tribuno cum concilio, ut producat illum ad vos, tamquam aliquid certius cognituri de eo. Nos vero priusquam appropiet, parati sumus interficere illum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quod cum audisset filius sororis Pauli insidias, venit, et intravit in castra, nuntiavitque Paulo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vocans autem Paulus ad se unum ex centurionibus, ait : Adolescentem hunc perduc ad tribunum, habet enim aliquid indicare illi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et ille quidem assumens eum duxit ad tribunum, et ait : Vinctus Paulus rogavit me hunc adolescentem perducere ad te, habentem aliquid loqui tibi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Apprehendens autem tribunus manum illius, secessit cum eo seorsum, et interrogavit illum : Quid est quod habes indicare mihi ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ille autem dixit : Judæis convenit rogare te ut crastina die producas Paulum in concilium, quasi aliquid certius inquisituri sint de illo :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>tu vero ne credideris illis : insidiantur enim ei ex eis viri amplius quam quadraginta, qui se devoverunt non manducare, neque bibere donec interficiant eum : et nunc parati sunt, exspectantes promissum tuum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tribunus igitur dimisit adolescentem, præcipiens ne cui loqueretur quoniam hæc nota sibi fecisset.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et vocatis duobus centurionibus, dixit illis : Parate milites ducentos ut eant usque Cæsaream, et equites septuaginta, et lancearios ducentos a tertia hora noctis,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et jumenta præparate ut imponentes Paulum, salvum perducerent ad Felicem præsidem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>(Timuit enim ne forte raperent eum Judæi, et occiderent, et ipse postea calumniam sustineret, tamquam accepturus pecuniam.)</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Scribens epistolam continentem hæc : Claudius Lysias optimo præsidi Felici, salutem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Virum hunc comprehensum a Judæis, et incipientem interfici ab eis, superveniens cum exercitu eripui, cognito quia Romanus est.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Volensque scire causam quam objiciebant illi, deduxi eum in concilium eorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quem inveni accusari de quæstionibus legis ipsorum, nihil vero dignum morte aut vinculis habentem criminis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et cum mihi perlatum esset de insidiis quas paraverant illi, misi eum ad te, denuntians et accusatoribus ut dicant apud te. Vale.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Milites ergo secundum præceptum sibi assumentes Paulum, duxerunt per noctem in Antipatridem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et postera die dimissis equitibus ut cum eo irent, reversi sunt ad castra.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Qui cum venissent Cæsaream, et tradidissent epistolam præsidi, statuerunt ante illum et Paulum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Cum legisset autem, et interrogasset de qua provincia esset, et cognoscens quia de Cilicia :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Audiam te, inquit, cum accusatores tui venerint. Jussitque in prætorio Herodis custodiri eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide t n with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"ACT.23\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":23,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And Paul, looking upon the council, said: Men, brethren, I have conversed with all good conscience before God until this present day.\"},{\"verse\":2,\"text\":\"And the high priest, Ananias, commanded them that stood by him to strike him on the mouth.\"},{\"verse\":3,\"text\":\"Then Paul said to him: God shall strike thee, thou whited wall. For, sittest thou to judge me according to the law and, contrary to the law, commandest me to be struck?\"},{\"verse\":4,\"text\":\"And they that stood by said: Dost thou revile the high priest of God?\"},{\"verse\":5,\"text\":\"And Paul said: I knew not, brethren, that he is the high priest. For it is written: Thou shalt not speak evil of the prince of thy people.\"},{\"verse\":6,\"text\":\"And Paul, knowing that the one part were Sadducees and the other Pharisees, cried out in the council: Men, brethren, I am a Pharisee, the son of Pharisees: concerning the hope and resurrection of the dead I am called in question.\"},{\"verse\":7,\"text\":\"And when he had so said, there arose a dissension between the Pharisees and the Sadducees. And the multitude was divided.\"},{\"verse\":8,\"text\":\"For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both.\"},{\"verse\":9,\"text\":\"And there arose a great cry. And some of the Pharisees rising up, strove, saying: We find no evil in this man. What if a spirit hath spoken to him, or an angel?\"},{\"verse\":10,\"text\":\"And when there arose a great dissension, the tribune, fearing lest Paul should be pulled in pieces by them, commanded the soldiers to go down and to take him by force from among them and to bring him into the castle.\"},{\"verse\":11,\"text\":\"And the night following, the Lord standing by him, said: Be constant: for as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome.\"},{\"verse\":12,\"text\":\"And when day was come, some of the Jews gathered together and bound themselves under a curse, saying that they would neither eat nor drink till they killed Paul.\"},{\"verse\":13,\"text\":\"And they were more than forty men that had made this conspiracy.\"},{\"verse\":14,\"text\":\"Who came to the chief priests and the ancients and said: We have bound ourselves under a great curse that we will eat nothing till we have slain Paul.\"},{\"verse\":15,\"text\":\"Now therefore do you with the council signify to the tribune, that he bring him forth to you, as if you meant to know something more certain touching him. And we, before he come near, are ready to kill him.\"},{\"verse\":16,\"text\":\"Which when Paul’s sister’s son had heard, of their lying in wait, he came and entered into the castle and told Paul.\"},{\"verse\":17,\"text\":\"And Paul, calling to him one of the centurions, said: Bring this young man to the tribune: for he hath some thing to tell him.\"},{\"verse\":18,\"text\":\"And he, taking him, brought him to the tribune and said: Paul, the prisoner, desired me to bring this young man unto thee, who hath some thing to say to thee.\"},{\"verse\":19,\"text\":\"And the tribune, taking him by the hand, went aside with him privately and asked him: What is it that thou hast to tell me?\"},{\"verse\":20,\"text\":\"And he said: The Jews have agreed to desire thee that thou wouldst bring forth Paul to-morrow into the council, as if they meant to inquire some thing more certain touching him.\"},{\"verse\":21,\"text\":\"But do not thou give credit to them: for there lie in wait for him more than forty men of them, who have bound themselves by oath neither to eat nor to drink, till they have killed him. And they are now ready, looking for a promise from thee.\"},{\"verse\":22,\"text\":\"The tribune therefore dismissed the young man, charging him that he should tell no man that he had made known these things unto him.\"},{\"verse\":23,\"text\":\"Then having called two centurions, he said to them: Make ready two hundred soldiers to go as far as Cæsarea: and seventy horsemen and two hundred spearmen, for the third hour of the night.\"},{\"verse\":24,\"text\":\"And provide beasts, that they may set Paul on and bring him safe to Felix the governor.\"},{\"verse\":25,\"text\":\"(For he feared lest perhaps the Jews might take him away by force and kill him: and he should afterwards be slandered, as if he was to take money.) And he wrote a letter after this manner:\"},{\"verse\":26,\"text\":\"Claudius Lysias to the most excellent governor, Felix, greeting:\"},{\"verse\":27,\"text\":\"This man, being taken by the Jews and ready to be killed by them, I rescued, coming in with an army, understanding that he is a Roman.\"},{\"verse\":28,\"text\":\"And meaning to know the cause which they objected unto him, I brought him forth into their council.\"},{\"verse\":29,\"text\":\"Whom I found to be accused concerning questions of their law; but having nothing laid to his charge worthy of death or of bands.\"},{\"verse\":30,\"text\":\"And when I was told of ambushes that they had prepared for him, I sent him to thee, signifying also to his accusers to plead before thee. Farewell.\"},{\"verse\":31,\"text\":\"Then the soldiers, according as it was commanded them, taking Paul, brought him by night to Antipatris.\"},{\"verse\":32,\"text\":\"And the next day, leaving the horsemen to go with him, they returned to the castle.\"},{\"verse\":33,\"text\":\"Who, when they were come to Cæsarea and had delivered the letter to the governor, did also present Paul before him.\"},{\"verse\":34,\"text\":\"And when he had read it and had asked of what province he was and understood that he was of Cilicia:\"},{\"verse\":35,\"text\":\"I will hear thee, said he, when thy accusers come. And he commanded him to be kept in Herod’s judgment hall.\"}],\"vul\":[{\"verse\":1,\"text\":\"Intendens autem in concilium Paulus, ait : Viri fratres, ego omni conscientia bona conversatus sum ante Deum usque in hodiernum diem.\"},{\"verse\":2,\"text\":\"Princeps autem sacerdotum Ananias præcepit astantibus sibi percutere os ejus.\"},{\"verse\":3,\"text\":\"Tunc Paulus dixit ad eum : Percutiet te Deus, paries dealbate. Et tu sedens judicas me secundum legem, et contra legem jubes me percuti ?\"},{\"verse\":4,\"text\":\"Et qui astabant dixerunt : Summum sacerdotem Dei maledicis.\"},{\"verse\":5,\"text\":\"Dixit autem Paulus : Nesciebam, fratres, quia princeps est sacerdotum. Scriptum est enim : Principem populi tui non maledices.\"},{\"verse\":6,\"text\":\"Sciens autem Paulus quia una pars esset sadducæorum, et altera pharisæorum, exclamavit in concilio : Viri fratres, ego pharisæus sum, filius pharisæorum : de spe et resurrectione mortuorum ego judicor.\"},{\"verse\":7,\"text\":\"Et cum hæc dixisset, facta est dissensio inter pharisæos et sadducæos, et soluta est multitudo.\"},{\"verse\":8,\"text\":\"Sadducæi enim dicunt non esse resurrectionem, neque angelum, neque spiritum : pharisæi autem utraque confitentur.\"},{\"verse\":9,\"text\":\"Factus est autem clamor magnus. Et surgentes quidam pharisæorum, pugnabant, dicentes : Nihil mali invenimus in homine isto : quid si spiritus locutus est ei, aut angelus ?\"},{\"verse\":10,\"text\":\"Et cum magna dissensio facta esset, timens tribunus ne discerperetur Paulus ab ipsis, jussit milites descendere, et rapere eum de medio eorum, ac deducere eum in castra.\"},{\"verse\":11,\"text\":\"Sequenti autem nocte assistens ei Dominus, ait : Constans esto : sicut enim testificatus es de me in Jerusalem, sic te oportet et Romæ testificari.\"},{\"verse\":12,\"text\":\"Facta autem die collegerunt se quidam ex Judæis, et devoverunt, se dicentes neque manducaturos, neque bibituros donec occiderent Paulum.\"},{\"verse\":13,\"text\":\"Erant autem plus quam quadraginta viri qui hanc conjurationem fecerant :\"},{\"verse\":14,\"text\":\"qui accesserunt ad principes sacerdotum et seniores, et dixerunt : Devotione devovimus nos nihil gustaturos, donec occidamus Paulum.\"},{\"verse\":15,\"text\":\"Nunc ergo vos notum facite tribuno cum concilio, ut producat illum ad vos, tamquam aliquid certius cognituri de eo. Nos vero priusquam appropiet, parati sumus interficere illum.\"},{\"verse\":16,\"text\":\"Quod cum audisset filius sororis Pauli insidias, venit, et intravit in castra, nuntiavitque Paulo.\"},{\"verse\":17,\"text\":\"Vocans autem Paulus ad se unum ex centurionibus, ait : Adolescentem hunc perduc ad tribunum, habet enim aliquid indicare illi.\"},{\"verse\":18,\"text\":\"Et ille quidem assumens eum duxit ad tribunum, et ait : Vinctus Paulus rogavit me hunc adolescentem perducere ad te, habentem aliquid loqui tibi.\"},{\"verse\":19,\"text\":\"Apprehendens autem tribunus manum illius, secessit cum eo seorsum, et interrogavit illum : Quid est quod habes indicare mihi ?\"},{\"verse\":20,\"text\":\"Ille autem dixit : Judæis convenit rogare te ut crastina die producas Paulum in concilium, quasi aliquid certius inquisituri sint de illo :\"},{\"verse\":21,\"text\":\"tu vero ne credideris illis : insidiantur enim ei ex eis viri amplius quam quadraginta, qui se devoverunt non manducare, neque bibere donec interficiant eum : et nunc parati sunt, exspectantes promissum tuum.\"},{\"verse\":22,\"text\":\"Tribunus igitur dimisit adolescentem, præcipiens ne cui loqueretur quoniam hæc nota sibi fecisset.\"},{\"verse\":23,\"text\":\"Et vocatis duobus centurionibus, dixit illis : Parate milites ducentos ut eant usque Cæsaream, et equites septuaginta, et lancearios ducentos a tertia hora noctis,\"},{\"verse\":24,\"text\":\"et jumenta præparate ut imponentes Paulum, salvum perducerent ad Felicem præsidem.\"},{\"verse\":25,\"text\":\"(Timuit enim ne forte raperent eum Judæi, et occiderent, et ipse postea calumniam sustineret, tamquam accepturus pecuniam.)\"},{\"verse\":26,\"text\":\"Scribens epistolam continentem hæc : Claudius Lysias optimo præsidi Felici, salutem.\"},{\"verse\":27,\"text\":\"Virum hunc comprehensum a Judæis, et incipientem interfici ab eis, superveniens cum exercitu eripui, cognito quia Romanus est.\"},{\"verse\":28,\"text\":\"Volensque scire causam quam objiciebant illi, deduxi eum in concilium eorum.\"},{\"verse\":29,\"text\":\"Quem inveni accusari de quæstionibus legis ipsorum, nihil vero dignum morte aut vinculis habentem criminis.\"},{\"verse\":30,\"text\":\"Et cum mihi perlatum esset de insidiis quas paraverant illi, misi eum ad te, denuntians et accusatoribus ut dicant apud te. Vale.\"},{\"verse\":31,\"text\":\"Milites ergo secundum præceptum sibi assumentes Paulum, duxerunt per noctem in Antipatridem.\"},{\"verse\":32,\"text\":\"Et postera die dimissis equitibus ut cum eo irent, reversi sunt ad castra.\"},{\"verse\":33,\"text\":\"Qui cum venissent Cæsaream, et tradidissent epistolam præsidi, statuerunt ante illum et Paulum.\"},{\"verse\":34,\"text\":\"Cum legisset autem, et interrogasset de qua provincia esset, et cognoscens quia de Cilicia :\"},{\"verse\":35,\"text\":\"Audiam te, inquit, cum accusatores tui venerint. Jussitque in prætorio Herodis custodiri eum.\"}],\"summary\":\"Paul stands before the council. The Jews conspire his death. He is sent away to Cesarea.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":22,\"label\":\"Acts 22\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":24,\"label\":\"Acts 24\"}}]]\n"])</script></body></html>
