.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Peter defends his having received the Gentiles into the church.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the apostles and brethren, who were in Judea, heard that the Gentiles also had received the word of God.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when Peter was come up to Jerusalem, they that were of the circumcision contended with him,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Saying: Why didst thou go in to men uncircumcised and didst eat with them?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But Peter began and declared to them the matter in order, saying:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I was in the city of Joppe praying: and I saw in an ecstasy of mind a vision, a certain vessel descending, as it were a great sheet let down from heaven by four corners. And it came even unto me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Into which looking, I considered and saw fourfooted creatures of the earth and beasts and creeping things and fowls of the air.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I heard also a voice saying to me: Arise, Peter. Kill and eat.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I said: Not so, Lord: for nothing common or unclean hath ever entered into my mouth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the voice answered again from heaven: What God hath made clean, do not thou call common.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And this was done three times. And all were taken up again into heaven.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And behold, immediately there were three men come to the house wherein I was, sent to me from Cæsarea.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the Spirit said to me that I should go with them, nothing doubting. And these six brethren went with me also: and we entered into the man’s house.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he told us how he had seen an angel in his house, standing and saying to him: Send to Joppe and call hither Simon, who is surnamed Peter,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Who shall speak to thee words whereby thou shalt be saved, and all thy house.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when I had begun to speak, the Holy Ghost fell upon them, as upon us also in the beginning.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And I remembered the word of the Lord, how that he said: John indeed baptized with water but you shall be baptized with the Holy Ghost.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If then God gave them the same grace as to us also who believed in the Lord Jesus Christ: who was I, that could withstand God?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Having heard these things, they held their peace and glorified God, saying: God then hath also to the Gentiles given repentance, unto life.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Now they who had been dispersed by the persecution that arose on occasion of Stephen went about as far as Phenice and Cyprus and Antioch, speaking the word to none, but to the Jews only.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But some of them were men of Cyprus and Cyrene, who, when they were entered into Antioch, spoke also to the Greeks, preaching the Lord Jesus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the hand of he Lord was with them: and a great number believing, were converted to the Lord.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the tidings came to the ears of the church that was at Jerusalem, touching these things: and they sent Barnabas as far as Antioch.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Who, when he was come and had seen the grace of God, rejoiced. And he exhorted them all with purpose of heart to continue in the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For he was a good man and full of the Holy Ghost and of faith. And a great multitude was added to the Lord.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Barnabas went to Tarsus to seek Saul: whom, when he had found, he brought to Antioch.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they conversed there in the church a whole year: and they taught a great multitude, so that at Antioch the disciples were first named Christians.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And in these days there came prophets from Jerusalem to Antioch.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And one of them named Agabus, rising up, signified by the Spirit that there should be a great famine over the whole world, which came to pass under Claudius.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the disciples, every man according to his ability, purposed to send relief to the brethren who dwelt in Judea.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Which also they did, sending it to the ancients, by the hands of Barnabas and Saul.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audierunt autem Apostoli et fratres qui erant in Judæa, quoniam et gentes receperunt verbum Dei.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cum autem ascendisset Petrus Jerosolymam, disceptabant adversus illum qui erant ex circumcisione,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>dicentes : Quare introisti ad viros præputium habentes, et manducasti cum illis ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Incipiens autem Petrus exponebat illis ordinem, dicens :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ego eram in civitate Joppe orans, et vidi in excessu mentis visionem, descendens vas quoddam velut linteum magnum quatuor initiis summitti de cælo, et venit usque ad me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In quod intuens considerabam, et vidi quadrupedia terræ, et bestias, et reptilia, et volatilia cæli.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Audivi autem et vocem dicentem mihi : Surge, Petre : occide, et manduca.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixi autem : Nequaquam Domine : quia commune aut immundum numquam introivit in os meum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Respondit autem vox secundo de cælo : Quæ Deus mundavit, tu ne commune dixeris.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hoc autem factum est per ter : et recepta sunt omnia rursum in cælum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et ecce viri tres confestim astiterunt in domo in qua eram, missi a Cæsarea ad me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixit autem Spiritus mihi ut irem cum illis, nihil hæsitans. Venerunt autem mecum et sex fratres isti, et ingressi sumus in domum viri.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Narravit autem nobis quomodo vidisset angelum in domo sua, stantem et dicentem sibi : Mitte in Joppen, et accersi Simonem qui cognominatur Petrus,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>qui loquetur tibi verba in quibus salvus eris tu, et universa domus tua.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cum autem cœpissem loqui, cecidit Spiritus Sanctus super eos, sicut et in nos in initio.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Recordatus sum autem verbi Domini, sicut dicebat : Joannes quidem baptizavit aqua, vos autem baptizabimini Spiritu Sancto.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si ergo eamdem gratiam dedit illis Deus, sicut et nobis qui credidimus in Dominum Jesum Christum : ego quis eram, qui possem prohibere Deum ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>His auditis, tacuerunt : et glorificaverunt Deum, dicentes : Ergo et gentibus pœnitentiam dedit Deus ad vitam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et illi quidem qui dispersi fuerant a tribulatione quæ facta fuerat sub Stephano, perambulaverunt usque Phœnicen, et Cyprum, et Antiochiam, nemini loquentes verbum, nisi solis Judæis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Erant autem quidam ex eis viri Cyprii et Cyrenæi, qui cum introissent Antiochiam, loquebantur et ad Græcos, annuntiantes Dominum Jesum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et erat manus Domini cum eis : multusque numerus credentium conversus est ad Dominum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Pervenit autem sermo ad aures ecclesiæ quæ erat Jerosolymis super istis : et miserunt Barnabam usque ad Antiochiam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui cum pervenisset, et vidisset gratiam Dei, gavisus est : et hortabatur omnes in proposito cordis permanere in Domino :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>quia erat vir bonus, et plenus Spiritu Sancto, et fide. Et apposita est multa turba Domino.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Profectus est autem Barnabas Tarsum, ut quæreret Saulum : quem cum invenisset, perduxit Antiochiam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et annum totum conversati sunt ibi in ecclesia : et docuerunt turbam multam, ita ut cognominarentur primum Antiochiæ discipuli, christiani.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In his autem diebus supervenerunt ab Jerosolymis prophetæ Antiochiam :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et surgens unus ex eis nomine Agabus, significabat per spiritum famem magnam futuram in universo orbe terrarum, quæ facta est sub Claudio.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Discipuli autem, prout quis habebat, proposuerunt singuli in ministerium mittere habitantibus in Judæa fratribus :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>quod et fecerunt, mittentes ad seniores per manus Barnabæ et Sauli.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Acts 10" class="inline-flex h- "rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.11\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":11,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And the apostles and brethren, who were in Judea, heard that the Gentiles also had received the word of God.\"},{\"verse\":2,\"text\":\"And when Peter was come up to Jerusalem, they that were of the circumcision contended with him,\"},{\"verse\":3,\"text\":\"Saying: Why didst thou go in to men uncircumcised and didst eat with them?\"},{\"verse\":4,\"text\":\"But Peter began and declared to them the matter in order, saying:\"},{\"verse\":5,\"text\":\"I was in the city of Joppe praying: and I saw in an ecstasy of mind a vision, a certain vessel descending, as it were a great sheet let down from heaven by four corners. And it came even unto me.\"},{\"verse\":6,\"text\":\"Into which looking, I considered and saw fourfooted creatures of the earth and beasts and creeping things and fowls of the air.\"},{\"verse\":7,\"text\":\"And I heard also a voice saying to me: Arise, Peter. Kill and eat.\"},{\"verse\":8,\"text\":\"And I said: Not so, Lord: for nothing common or unclean hath ever entered into my mouth.\"},{\"verse\":9,\"text\":\"And the voice answered again from heaven: What God hath made clean, do not thou call common.\"},{\"verse\":10,\"text\":\"And this was done three times. And all were taken up again into heaven.\"},{\"verse\":11,\"text\":\"And behold, immediately there were three men come to the house wherein I was, sent to me from Cæsarea.\"},{\"verse\":12,\"text\":\"And the Spirit said to me that I should go with them, nothing doubting. And these six brethren went with me also: and we entered into the man’s house.\"},{\"verse\":13,\"text\":\"And he told us how he had seen an angel in his house, standing and saying to him: Send to Joppe and call hither Simon, who is surnamed Peter,\"},{\"verse\":14,\"text\":\"Who shall speak to thee words whereby thou shalt be saved, and all thy house.\"},{\"verse\":15,\"text\":\"And when I had begun to speak, the Holy Ghost fell upon them, as upon us also in the beginning.\"},{\"verse\":16,\"text\":\"And I remembered the word of the Lord, how that he said: John indeed baptized with water but you shall be baptized with the Holy Ghost.\"},{\"verse\":17,\"text\":\"If then God gave them the same grace as to us also who believed in the Lord Jesus Christ: who was I, that could withstand God?\"},{\"verse\":18,\"text\":\"Having heard these things, they held their peace and glorified God, saying: God then hath also to the Gentiles given repentance, unto life.\"},{\"verse\":19,\"text\":\"Now they who had been dispersed by the persecution that arose on occasion of Stephen went about as far as Phenice and Cyprus and Antioch, speaking the word to none, but to the Jews only.\"},{\"verse\":20,\"text\":\"But some of them were men of Cyprus and Cyrene, who, when they were entered into Antioch, spoke also to the Greeks, preaching the Lord Jesus.\"},{\"verse\":21,\"text\":\"And the hand of he Lord was with them: and a great number believing, were converted to the Lord.\"},{\"verse\":22,\"text\":\"And the tidings came to the ears of the church that was at Jerusalem, touching these things: and they sent Barnabas as far as Antioch.\"},{\"verse\":23,\"text\":\"Who, when he was come and had seen the grace of God, rejoiced. And he exhorted them all with purpose of heart to continue in the Lord.\"},{\"verse\":24,\"text\":\"For he was a good man and full of the Holy Ghost and of faith. And a great multitude was added to the Lord.\"},{\"verse\":25,\"text\":\"And Barnabas went to Tarsus to seek Saul: whom, when he had found, he brought to Antioch.\"},{\"verse\":26,\"text\":\"And they conversed there in the church a whole year: and they taught a great multitude, so that at Antioch the disciples were first named Christians.\"},{\"verse\":27,\"text\":\"And in these days there came prophets from Jerusalem to Antioch.\"},{\"verse\":28,\"text\":\"And one of them named Agabus, rising up, signified by the Spirit that there should be a great famine over the whole world, which came to pass under Claudius.\"},{\"verse\":29,\"text\":\"And the disciples, every man according to his ability, purposed to send relief to the brethren who dwelt in Judea.\"},{\"verse\":30,\"text\":\"Which also they did, sending it to the ancients, by the hands of Barnabas and Saul.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audierunt autem Apostoli et fratres qui erant in Judæa, quoniam et gentes receperunt verbum Dei.\"},{\"verse\":2,\"text\":\"Cum autem ascendisset Petrus Jerosolymam, disceptabant adversus illum qui erant ex circumcisione,\"},{\"verse\":3,\"text\":\"dicentes : Quare introisti ad viros præputium habentes, et manducasti cum illis ?\"},{\"verse\":4,\"text\":\"Incipiens autem Petrus exponebat illis ordinem, dicens :\"},{\"verse\":5,\"text\":\"Ego eram in civitate Joppe orans, et vidi in excessu mentis visionem, descendens vas quoddam velut linteum magnum quatuor initiis summitti de cælo, et venit usque ad me.\"},{\"verse\":6,\"text\":\"In quod intuens considerabam, et vidi quadrupedia terræ, et bestias, et reptilia, et volatilia cæli.\"},{\"verse\":7,\"text\":\"Audivi autem et vocem dicentem mihi : Surge, Petre : occide, et manduca.\"},{\"verse\":8,\"text\":\"Dixi autem : Nequaquam Domine : quia commune aut immundum numquam introivit in os meum.\"},{\"verse\":9,\"text\":\"Respondit autem vox secundo de cælo : Quæ Deus mundavit, tu ne commune dixeris.\"},{\"verse\":10,\"text\":\"Hoc autem factum est per ter : et recepta sunt omnia rursum in cælum.\"},{\"verse\":11,\"text\":\"Et ecce viri tres confestim astiterunt in domo in qua eram, missi a Cæsarea ad me.\"},{\"verse\":12,\"text\":\"Dixit autem Spiritus mihi ut irem cum illis, nihil hæsitans. Venerunt autem mecum et sex fratres isti, et ingressi sumus in domum viri.\"},{\"verse\":13,\"text\":\"Narravit autem nobis quomodo vidisset angelum in domo sua, stantem et dicentem sibi : Mitte in Joppen, et accersi Simonem qui cognominatur Petrus,\"},{\"verse\":14,\"text\":\"qui loquetur tibi verba in quibus salvus eris tu, et universa domus tua.\"},{\"verse\":15,\"text\":\"Cum autem cœpissem loqui, cecidit Spiritus Sanctus super eos, sicut et in nos in initio.\"},{\"verse\":16,\"text\":\"Recordatus sum autem verbi Domini, sicut dicebat : Joannes quidem baptizavit aqua, vos autem baptizabimini Spiritu Sancto.\"},{\"verse\":17,\"text\":\"Si ergo eamdem gratiam dedit illis Deus, sicut et nobis qui credidimus in Dominum Jesum Christum : ego quis eram, qui possem prohibere Deum ?\"},{\"verse\":18,\"text\":\"His auditis, tacuerunt : et glorificaverunt Deum, dicentes : Ergo et gentibus pœnitentiam dedit Deus ad vitam.\"},{\"verse\":19,\"text\":\"Et illi quidem qui dispersi fuerant a tribulatione quæ facta fuerat sub Stephano, perambulaverunt usque Phœnicen, et Cyprum, et Antiochiam, nemini loquentes verbum, nisi solis Judæis.\"},{\"verse\":20,\"text\":\"Erant autem quidam ex eis viri Cyprii et Cyrenæi, qui cum introissent Antiochiam, loquebantur et ad Græcos, annuntiantes Dominum Jesum.\"},{\"verse\":21,\"text\":\"Et erat manus Domini cum eis : multusque numerus credentium conversus est ad Dominum.\"},{\"verse\":22,\"text\":\"Pervenit autem sermo ad aures ecclesiæ quæ erat Jerosolymis super istis : et miserunt Barnabam usque ad Antiochiam.\"},{\"verse\":23,\"text\":\"Qui cum pervenisset, et vidisset gratiam Dei, gavisus est : et hortabatur omnes in proposito cordis permanere in Domino :\"},{\"verse\":24,\"text\":\"quia erat vir bonus, et plenus Spiritu Sancto, et fide. Et apposita est multa turba Domino.\"},{\"verse\":25,\"text\":\"Profectus est autem Barnabas Tarsum, ut quæreret Saulum : quem cum invenisset, perduxit Antiochiam.\"},{\"verse\":26,\"text\":\"Et annum totum conversati sunt ibi in ecclesia : et docuerunt turbam multam, ita ut cognominarentur primum Antiochiæ discipuli, christiani.\"},{\"verse\":27,\"text\":\"In his autem diebus supervenerunt ab Jerosolymis prophetæ Antiochiam :\"},{\"verse\":28,\"text\":\"et surgens unus ex eis nomine Agabus, significabat per spiritum famem magnam futuram in universo orbe terrarum, quæ facta est sub Claudio.\"},{\"verse\":29,\"text\":\"Discipuli autem, prout quis habebat, proposuerunt singuli in ministerium mittere habitantibus in Judæa fratribus :\"},{\"verse\":30,\"text\":\"quod et fecerunt, mittentes ad seniores per manus Barnabæ et Sauli.\"}],\"summary\":\"Peter defends his having received the Gentiles into the church.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":10,\"label\":\"Acts 10\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":12,\"label\":\"Acts 12\"}}]]\n"])</script></body></html>
