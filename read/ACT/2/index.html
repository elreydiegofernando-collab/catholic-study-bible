<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 2 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The disciples receive the Holy Ghost. Peter’s sermon to the people. The piety of the first converts.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when the days of the Pentecost were accomplished, they were all together in one place:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And suddenly there came a sound from heaven, as of a mighty wind coming: and it filled the whole house where they were sitting.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And there appeared to them parted tongues, as it were of fire: and it sat upon every one of them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they were all filled with the Holy Ghost: and they began to speak with divers tongues, according as the Holy Ghost gave them to speak.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Now there were dwelling at Jerusalem, Jews, devout men, out of every nation under heaven.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when this was noised abroad, the multitude came together, and were confounded in mind, because that every man heard them speak in his own tongue.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And they were all amazed, and wondered, saying: Behold, are not all these that speak Galileans?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And how have we heard, every man our own tongue wherein we were born?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Parthians and Medes and Elamites and inhabitants of Mesopotamia, Judea, and Cappadocia, Pontus and Asia,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Phrygia and Pamphylia, Egypt and the parts of Libya about Cyrene, and strangers of Rome,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Jews also, and proselytes, Cretes, and Arabians: we have heard them speak in our own tongues the wonderful works of God.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they were all astonished, and wondered, saying one to another: What meaneth this?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But others mocking, said: These men are full of new wine.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But Peter standing up with the eleven, lifted up his voice, and spoke to them: Ye men of Judea, and all you that dwell in Jerusalem, be this known to you and with your ears receive my words.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For these are not drunk, as you suppose, seeing it is but the third hour of the day:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But this is that which was spoken of by the prophet Joel:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And it shall come to pass, in the last days, (saith the Lord), I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy: and your young men shall see visions, and your old men shall dream dreams.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And upon my servants indeed and upon my handmaids will I pour out in those days of my spirit: and they shall prophesy.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I will shew wonders in the heaven above, and signs on the earth beneath: blood and fire, and vapour of smoke.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The sun shall be turned into darkness and the moon into blood, before the great and manifest day of the Lord shall come.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And it shall come to pass, that whosoever shall call upon the name of the Lord shall be saved.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ye men of Israel, hear these words: Jesus of Nazareth, a man approved of God among you by miracles and wonders and signs, which God did by him, in the midst of you, as you also know:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>This same being delivered up, by the determinate counsel and foreknowledge of God, you by the hands of wicked men have crucified and slain.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Whom God hath raised up, having loosed the sorrows of hell, as it was impossible that he should be holden by it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For David saith concerning him: I foresaw the Lord before my face: because he is at my right hand, that I may not be moved.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For this my heart hath been glad, and my tongue hath rejoiced: moreover my flesh also shall rest in hope.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Because thou wilt not leave my soul in hell: nor suffer thy Holy One to see corruption.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thou hast made known to me the ways of life: thou shalt make me full of joy with thy countenance.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ye men, brethren, let me freely speak to you of the patriarch David: that he died and was buried; and his sepulchre is with us to this present day.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Whereas therefore he was a prophet and knew that God hath sworn to him with an oath, that of the fruit of his loins one should sit upon his throne.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Foreseeing this, he spoke of the resurrection of Christ. For neither was he left in hell: neither did his flesh see corruption.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>This Jesus hath God raised again, whereof all we are witnesses.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Being exalted therefore by the right hand of God and having received of the Father the promise of the Holy Ghost, he hath poured forth this which you see and hear.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>For David ascended not into heaven; but he himself said: The Lord said to my Lord: Sit thou on my right hand,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Until I make thy enemies thy footstool.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Therefore let all the house of Israel know most certainly that God hath made both Lord and Christ, this same Jesus, whom you have crucified.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Now when they had heard these things, they had compunction in their heart and said to Peter and to the rest of the apostles: What shall we do, men and brethren?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But Peter said to them: Do penance: and be baptized every one of you in the name of Jesus Christ, for the remission of your sins. And you shall receive the gift of the Holy Ghost.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>For the promise is to you and to your children and to all that are far off, whomsoever the Lord our God shall call.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And with very many other words did he testify and exhort them, saying: Save yourselves from this perverse generation.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>They therefore that received his word were baptized: and there were added in that day about three thousand souls.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And they were persevering in the doctrine of the apostles and in the communication of the breaking of bread and in prayers.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And fear came upon every soul. Many wonders also and signs were done by the apostles in Jerusalem: and there was great fear in all.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And all they that believed were together and had all things common.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Their possessions and goods they sold and divided them to all, according as every one had need.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And continuing daily with one accord in the temple and breaking bread from house to house, they took their meat with gladness and simplicity of heart:</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Praising God and having favour with all the people. And the Lord increased daily together such as should be saved.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et cum complerentur dies Pentecostes, erant omnes pariter in eodem loco :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et factus est repente de cælo sonus, tamquam advenientis spiritus vehementis, et replevit totam domum ubi erant sedentes.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et apparuerunt illis dispertitæ linguæ tamquam ignis, seditque supra singulos eorum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et repleti sunt omnes Spiritu Sancto, et cœperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Erant autem in Jerusalem habitantes Judæi, viri religiosi ex omni natione quæ sub cælo est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Facta autem hac voce, convenit multitudo, et mente confusa est, quoniam audiebat unusquisque lingua sua illos loquentes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Stupebant autem omnes, et mirabantur, dicentes : Nonne ecce omnes isti qui loquuntur, Galilæi sunt ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et quomodo nos audivimus unusquisque linguam nostram in qua nati sumus ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Parthi, et Medi, et Ælamitæ, et qui habitant Mespotamiam, Judæam, et Cappadociam, Pontum, et Asiam,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Phrygiam, et Pamphyliam, Ægyptum, et partes Libyæ quæ est circa Cyrenen : et advenæ Romani,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Judæi quoque, et Proselyti, Cretes, et Arabes : audivimus eos loquentes nostris linguis magnalia Dei.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Stupebant autem omnes, et mirabantur ad invicem, dicentes : Quidnam vult hoc esse ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Alii autem irridentes dicebant : Quia musto pleni sunt isti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Stans autem Petrus cum undecim, levavit vocem suam, et locutus est eis : Viri Judæi, et qui habitatis Jerusalem universi, hoc vobis notum sit, et auribus percipite verba mea.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non enim, sicut vos æstimatis, hi ebrii sunt, cum sit hora diei tertia :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>sed hoc est quod dictum est per prophetam Joël :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et erit in novissimis diebus, dicit Dominus, effundam de Spiritu meo super omnem carnem : et prophetabunt filii vestri et filiæ vestræ, et juvenes vestri visiones videbunt, et seniores vestri somnia somniabunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et quidem super servos meos, et super ancillas meas, in diebus illis effundam de Spiritu meo, et prophetabunt :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et dabo prodigia in cælo sursum, et signa in terra deorsum, sanguinem, et ignem, et vaporem fumi :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sol convertetur in tenebras, et luna in sanguinem, antequam veniat dies Domini magnus et manifestus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et erit : omnis quicumque invocaverit nomen Domini, salvus erit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Viri Israëlitæ, audite verba hæc : Jesum Nazarenum, virum approbatum a Deo in vobis, virtutibus, et prodigiis, et signis, quæ fecit Deus per illum in medio vestri, sicut et vos scitis :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>hunc, definito consilio et præscientia Dei traditum, per manus iniquorum affligentes interemistis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>quem Deus suscitavit, solutis doloribus inferni, juxta quod impossibile erat teneri illum ab eo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>David enim dicit in eum : Providebam Dominum in conspectu meo semper : quoniam a dextris est mihi, ne commovear :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>propter hoc lætatum est cor meum, et exsultavit lingua mea, insuper et caro mea requiescet in spe :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Notas mihi fecisti vias vitæ : et replebis me jucunditate cum facie tua.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Viri fratres, liceat audenter dicere ad vos de patriarcha David, quoniam defunctus est, et sepultus : et sepulchrum ejus est apud nos usque in hodiernum diem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Propheta igitur cum esset, et sciret quia jurejurando jurasset illi Deus de fructu lumbi ejus sedere super sedem ejus :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>providens locutus est de resurrectione Christi, quia neque derelictus est in inferno, neque caro ejus vidit corruptionem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Hunc Jesum resuscitavit Deus, cujus omnes nos testes sumus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dextera igitur Dei exaltatus, et promissione Spiritus Sancti accepta a Patre, effudit hunc, quem vos videtis et auditis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Non enim David ascendit in cælum : dixit autem ipse : Dixit Dominus Domino meo : Sede a dextris meis,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>donec ponam inimicos tuos scabellum pedum tuorum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Certissime sciat ergo omnis domus Israël, quia et Dominum eum et Christum fecit Deus hunc Jesum, quem vos crucifixistis.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>His autem auditis, compuncti sunt corde, et dixerunt ad Petrum et ad reliquos Apostolos : Quid faciemus, viri fratres ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Petrus vero ad illos : Pœnitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Jesu Christi in remissionem peccatorum vestrorum : et accipietis donum Spiritus Sancti.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Vobis enim est repromissio, et filiis vestris, et omnibus qui longe sunt, quoscumque advocaverit Dominus Deus noster.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Aliis etiam verbis plurimis testificatus est, et exhortabatur eos, dicens : Salvamini a generatione ista prava.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Qui ergo receperunt sermonem ejus, baptizati sunt : et appositæ sunt in die illa animæ circiter tria millia.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Erant autem perseverantes in doctrina Apostolorum, et communicatione fractionis panis, et orationibus.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Fiebat autem omni animæ timor : multa quoque prodigia et signa per Apostolos in Jerusalem fiebant, et metus erat magnus in universis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Omnes etiam qui credebant, erant pariter, et habebant omnia communia.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Possessiones et substantias vendebant, et dividebant illa omnibus, prout cuique opus erat.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Quotidie quoque perdurantes unanimiter in templo, et frangentes circa domos panem, sumebant cibum cum exsultatione et simplicitate cordis,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>collaudantes Deum et habentes gratiam ad omnem plebem. Dominus autem augebat qui salvi fierent quotidie in idipsum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs upper \":3,\"text\":\"And there appeared to them parted tongues, as it were of fire: and it sat upon every one of them.\"},{\"verse\":4,\"text\":\"And they were all filled with the Holy Ghost: and they began to speak with divers tongues, according as the Holy Ghost gave them to speak.\"},{\"verse\":5,\"text\":\"Now there were dwelling at Jerusalem, Jews, devout men, out of every nation under heaven.\"},{\"verse\":6,\"text\":\"And when this was noised abroad, the multitude came together, and were confounded in mind, because that every man heard them speak in his own tongue.\"},{\"verse\":7,\"text\":\"And they were all amazed, and wondered, saying: Behold, are not all these that speak Galileans?\"},{\"verse\":8,\"text\":\"And how have we heard, every man our own tongue wherein we were born?\"},{\"verse\":9,\"text\":\"Parthians and Medes and Elamites and inhabitants of Mesopotamia, Judea, and Cappadocia, Pontus and Asia,\"},{\"verse\":10,\"text\":\"Phrygia and Pamphylia, Egypt and the parts of Libya about Cyrene, and strangers of Rome,\"},{\"verse\":11,\"text\":\"Jews also, and proselytes, Cretes, and Arabians: we have heard them speak in our own tongues the wonderful works of God.\"},{\"verse\":12,\"text\":\"And they were all astonished, and wondered, saying one to another: What meaneth this?\"},{\"verse\":13,\"text\":\"But others mocking, said: These men are full of new wine.\"},{\"verse\":14,\"text\":\"But Peter standing up with the eleven, lifted up his voice, and spoke to them: Ye men of Judea, and all you that dwell in Jerusalem, be this known to you and with your ears receive my words.\"},{\"verse\":15,\"text\":\"For these are not drunk, as you suppose, seeing it is but the third hour of the day:\"},{\"verse\":16,\"text\":\"But this is that which was spoken of by the prophet Joel:\"},{\"verse\":17,\"text\":\"And it shall come to pass, in the last days, (saith the Lord), I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy: and your young men shall see visions, and your old men shall dream dreams.\"},{\"verse\":18,\"text\":\"And upon my servants indeed and upon my handmaids will I pour out in those days of my spirit: and they shall prophesy.\"},{\"verse\":19,\"text\":\"And I will shew wonders in the heaven above, and signs on the earth beneath: blood and fire, and vapour of smoke.\"},{\"verse\":20,\"text\":\"The sun shall be turned into darkness and the moon into blood, before the great and manifest day of the Lord shall come.\"},{\"verse\":21,\"text\":\"And it shall come to pass, that whosoever shall call upon the name of the Lord shall be saved.\"},{\"verse\":22,\"text\":\"Ye men of Israel, hear these words: Jesus of Nazareth, a man approved of God among you by miracles and wonders and signs, which God did by him, in the midst of you, as you also know:\"},{\"verse\":23,\"text\":\"This same being delivered up, by the determinate counsel and foreknowledge of God, you by the hands of wicked men have crucified and slain.\"},{\"verse\":24,\"text\":\"Whom God hath raised up, having loosed the sorrows of hell, as it was impossible that he should be holden by it.\"},{\"verse\":25,\"text\":\"For David saith concerning him: I foresaw the Lord before my face: because he is at my right hand, that I may not be moved.\"},{\"verse\":26,\"text\":\"For this my heart hath been glad, and my tongue hath rejoiced: moreover my flesh also shall rest in hope.\"},{\"verse\":27,\"text\":\"Because thou wilt not leave my soul in hell: nor suffer thy Holy One to see corruption.\"},{\"verse\":28,\"text\":\"Thou hast made known to me the ways of life: thou shalt make me full of joy with thy countenance.\"},{\"verse\":29,\"text\":\"Ye men, brethren, let me freely speak to you of the patriarch David: that he died and was buried; and his sepulchre is with us to this present day.\"},{\"verse\":30,\"text\":\"Whereas therefore he was a prophet and knew that God hath sworn to him with an oath, that of the fruit of his loins one should sit upon his throne.\"},{\"verse\":31,\"text\":\"Foreseeing this, he spoke of the resurrection of Christ. For neither was he left in hell: neither did his flesh see corruption.\"},{\"verse\":32,\"text\":\"This Jesus hath God raised again, whereof all we are witnesses.\"},{\"verse\":33,\"text\":\"Being exalted therefore by the right hand of God and having received of the Father the promise of the Holy Ghost, he hath poured forth this which you see and hear.\"},{\"verse\":34,\"text\":\"For David ascended not into heaven; but he himself said: The Lord said to my Lord: Sit thou on my right hand,\"},{\"verse\":35,\"text\":\"Until I make thy enemies thy footstool.\"},{\"verse\":36,\"text\":\"Therefore let all the house of Israel know most certainly that God hath made both Lord and Christ, this same Jesus, whom you have crucified.\"},{\"verse\":37,\"text\":\"Now when they had heard these things, they had compunction in their heart and said to Peter and to the rest of the apostles: What shall we do, men and brethren?\"},{\"verse\":38,\"text\":\"But Peter said to them: Do penance: and be baptized every one of you in the name of Jesus Christ, for the remission of your sins. And you shall receive the gift of the Holy Ghost.\"},{\"verse\":39,\"text\":\"For the promise is to you and to your children and to all that are far off, whomsoever the Lord our God shall call.\"},{\"verse\":40,\"text\":\"And with very many other words did he testify and exhort them, saying: Save yourselves from this perverse generation.\"},{\"verse\":41,\"text\":\"They therefore that received his word were baptized: and there were added in that day about three thousand souls.\"},{\"verse\":42,\"text\":\"And they were persevering in the doctrine of the apostles and in the communication of the breaking of bread and in prayers.\"},{\"verse\":43,\"text\":\"And fear came upon every soul. Many wonders also and signs were done by the apostles in Jerusalem: and there was great fear in all.\"},{\"verse\":44,\"text\":\"And all they that believed were together and had all things common.\"},{\"verse\":45,\"text\":\"Their possessions and goods they sold and divided them to all, according as every one had need.\"},{\"verse\":46,\"text\":\"And continuing daily with one accord in the temple and breaking bread from house to house, they took their meat with gladness and simplicity of heart:\"},{\"verse\":47,\"text\":\"Praising God and having favour with all the people. And the Lord increased daily together such as should be saved.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et cum complerentur dies Pentecostes, erant omnes pariter in eodem loco :\"},{\"verse\":2,\"text\":\"et factus est repente de cælo sonus, tamquam advenientis spiritus vehementis, et replevit totam domum ubi erant sedentes.\"},{\"verse\":3,\"text\":\"Et apparuerunt illis dispertitæ linguæ tamquam ignis, seditque supra singulos eorum :\"},{\"verse\":4,\"text\":\"et repleti sunt omnes Spiritu Sancto, et cœperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis.\"},{\"verse\":5,\"text\":\"Erant autem in Jerusalem habitantes Judæi, viri religiosi ex omni natione quæ sub cælo est.\"},{\"verse\":6,\"text\":\"Facta autem hac voce, convenit multitudo, et mente confusa est, quoniam audiebat unusquisque lingua sua illos loquentes.\"},{\"verse\":7,\"text\":\"Stupebant autem omnes, et mirabantur, dicentes : Nonne ecce omnes isti qui loquuntur, Galilæi sunt ?\"},{\"verse\":8,\"text\":\"et quomodo nos audivimus unusquisque linguam nostram in qua nati sumus ?\"},{\"verse\":9,\"text\":\"Parthi, et Medi, et Ælamitæ, et qui habitant Mespotamiam, Judæam, et Cappadociam, Pontum, et Asiam,\"},{\"verse\":10,\"text\":\"Phrygiam, et Pamphyliam, Ægyptum, et partes Libyæ quæ est circa Cyrenen : et advenæ Romani,\"},{\"verse\":11,\"text\":\"Judæi quoque, et Proselyti, Cretes, et Arabes : audivimus eos loquentes nostris linguis magnalia Dei.\"},{\"verse\":12,\"text\":\"Stupebant autem omnes, et mirabantur ad invicem, dicentes : Quidnam vult hoc esse ?\"},{\"verse\":13,\"text\":\"Alii autem irridentes dicebant : Quia musto pleni sunt isti.\"},{\"verse\":14,\"text\":\"Stans autem Petrus cum undecim, levavit vocem suam, et locutus est eis : Viri Judæi, et qui habitatis Jerusalem universi, hoc vobis notum sit, et auribus percipite verba mea.\"},{\"verse\":15,\"text\":\"Non enim, sicut vos æstimatis, hi ebrii sunt, cum sit hora diei tertia :\"},{\"verse\":16,\"text\":\"sed hoc est quod dictum est per prophetam Joël :\"},{\"verse\":17,\"text\":\"Et erit in novissimis diebus, dicit Dominus, effundam de Spiritu meo super omnem carnem : et prophetabunt filii vestri et filiæ vestræ, et juvenes vestri visiones videbunt, et seniores vestri somnia somniabunt.\"},{\"verse\":18,\"text\":\"Et quidem super servos meos, et super ancillas meas, in diebus illis effundam de Spiritu meo, et prophetabunt :\"},{\"verse\":19,\"text\":\"et dabo prodigia in cælo sursum, et signa in terra deorsum, sanguinem, et ignem, et vaporem fumi :\"},{\"verse\":20,\"text\":\"sol convertetur in tenebras, et luna in sanguinem, antequam veniat dies Domini magnus et manifestus.\"},{\"verse\":21,\"text\":\"Et erit : omnis quicumque invocaverit nomen Domini, salvus erit.\"},{\"verse\":22,\"text\":\"Viri Israëlitæ, audite verba hæc : Jesum Nazarenum, virum approbatum a Deo in vobis, virtutibus, et prodigiis, et signis, quæ fecit Deus per illum in medio vestri, sicut et vos scitis :\"},{\"verse\":23,\"text\":\"hunc, definito consilio et præscientia Dei traditum, per manus iniquorum affligentes interemistis :\"},{\"verse\":24,\"text\":\"quem Deus suscitavit, solutis doloribus inferni, juxta quod impossibile erat teneri illum ab eo.\"},{\"verse\":25,\"text\":\"David enim dicit in eum : Providebam Dominum in conspectu meo semper : quoniam a dextris est mihi, ne commovear :\"},{\"verse\":26,\"text\":\"propter hoc lætatum est cor meum, et exsultavit lingua mea, insuper et caro mea requiescet in spe :\"},{\"verse\":27,\"text\":\"quoniam non derelinques animam meam in inferno, nec dabis sanctum tuum videre corruptionem.\"},{\"verse\":28,\"text\":\"Notas mihi fecisti vias vitæ : et replebis me jucunditate cum facie tua.\"},{\"verse\":29,\"text\":\"Viri fratres, liceat audenter dicere ad vos de patriarcha David, quoniam defunctus est, et sepultus : et sepulchrum ejus est apud nos usque in hodiernum diem.\"},{\"verse\":30,\"text\":\"Propheta igitur cum esset, et sciret quia jurejurando jurasset illi Deus de fructu lumbi ejus sedere super sedem ejus :\"},{\"verse\":31,\"text\":\"providens locutus est de resurrectione Christi, quia neque derelictus est in inferno, neque caro ejus vidit corruptionem.\"},{\"verse\":32,\"text\":\"Hunc Jesum resuscitavit Deus, cujus omnes nos testes sumus.\"},{\"verse\":33,\"text\":\"Dextera igitur Dei exaltatus, et promissione Spiritus Sancti accepta a Patre, effudit hunc, quem vos videtis et auditis.\"},{\"verse\":34,\"text\":\"Non enim David ascendit in cælum : dixit autem ipse : Dixit Dominus Domino meo : Sede a dextris meis,\"},{\"verse\":35,\"text\":\"donec ponam inimicos tuos scabellum pedum tuorum.\"},{\"verse\":36,\"text\":\"Certissime sciat ergo omnis domus Israël, quia et Dominum eum et Christum fecit Deus hunc Jesum, quem vos crucifixistis.\"},{\"verse\":37,\"text\":\"His autem auditis, compuncti sunt corde, et dixerunt ad Petrum et ad reliquos Apostolos : Quid faciemus, viri fratres ?\"},{\"verse\":38,\"text\":\"Petrus vero ad illos : Pœnitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Jesu Christi in remissionem peccatorum vestrorum : et accipietis donum Spiritus Sancti.\"},{\"verse\":39,\"text\":\"Vobis enim est repromissio, et filiis vestris, et omnibus qui longe sunt, quoscumque advocaverit Dominus Deus noster.\"},{\"verse\":40,\"text\":\"Aliis etiam verbis plurimis testificatus est, et exhortabatur eos, dicens : Salvamini a generatione ista prava.\"},{\"verse\":41,\"text\":\"Qui ergo receperunt sermonem ejus, baptizati sunt : et appositæ sunt in die illa animæ circiter tria millia.\"},{\"verse\":42,\"text\":\"Erant autem perseverantes in doctrina Apostolorum, et communicatione fractionis panis, et orationibus.\"},{\"verse\":43,\"text\":\"Fiebat autem omni animæ timor : multa quoque prodigia et signa per Apostolos in Jerusalem fiebant, et metus erat magnus in universis.\"},{\"verse\":44,\"text\":\"Omnes etiam qui credebant, erant pariter, et habebant omnia communia.\"},{\"verse\":45,\"text\":\"Possessiones et substantias vendebant, et dividebant illa omnibus, prout cuique opus erat.\"},{\"verse\":46,\"text\":\"Quotidie quoque perdurantes unanimiter in templo, et frangentes circa domos panem, sumebant cibum cum exsultatione et simplicitate cordis,\"},{\"verse\":47,\"text\":\"collaudantes Deum et habentes gratiam ad omnem plebem. Dominus autem augebat qui salvi fierent quotidie in idipsum.\"}],\"summary\":\"The disciples receive the Holy Ghost. Peter’s sermon to the people. The piety of the first converts.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":1,\"label\":\"Acts 1\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":3,\"label\":\"Acts 3\"}}]]\n"])</script></body></html>
