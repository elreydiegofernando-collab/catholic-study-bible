<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 7 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">7</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Stephen’s speech before the council. His martyrdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then the high priest said: Are these things so?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who said: Ye men, brethren and fathers, hear. The God of glory appeared to our father Abraham, when he was in Mesopotamia, before he dwelt in Charan.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And said to him: Go forth out of thy country and from thy kindred: and come into the land which I shall shew thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then he went out of the land of the Chaldeans and dwelt in Charan. And from thence, after his father was dead, he removed him into this land, wherein you now dwell.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he gave him no inheritance in it: no, not the pace of a foot. But he promised to give it him in possession, and to his seed after him, when as yet he had no child.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And God said to him: That his seed should sojourn in a strange country, and that they should bring them under bondage and treat them evil four hundred years.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the nation which they shall serve will I judge (said the Lord): and after these things they shall go out and shall serve me in this place.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he gave him the covenant of circumcision. And so he begot Isaac and circumcised him the eighth day: and Isaac begot Jacob: and Jacob, the twelve patriarchs.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the patriarchs, through envy, sold Joseph into Egypt. And God was with him,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And delivered him out of all his tribulations: and he gave him favour and wisdom in the sight of Pharao, the king of Egypt. And he appointed him governor over Egypt and over all his house.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now there came a famine upon all Egypt and Chanaan, and great tribulation: and our fathers found no food.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But when Jacob had heard that there was corn in Egypt, he sent our fathers first.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And at the second time, Joseph was known by his brethren: and his kindred was made known to Pharao.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Joseph sending, called thither Jacob, his father, and all his kindred, seventy-five souls.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So Jacob went down into Egypt. And he died, and our fathers.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they were translated into Sichem and were laid in the sepulchre that Abraham bought for a sum of money of the sons of Hemor, the son of Sichem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when the time of the promise drew near, which God had promised to Abraham, the people increased and were multiplied in Egypt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Till another king arose in Egypt, who knew not Joseph.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>This same, dealing craftily with our race, afflicted our fathers, that they should expose their children, to the end they might not be kept alive.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>At the same time was Moses born: and he was acceptable to God. Who was nourished three months in his father’s house.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when he was exposed, Pharao’s daughter took him up and nourished him for her own son.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Moses was instructed in all the wisdom of the Egyptians: and he was mighty in his words and in his deeds.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And when he was full forty years old, it came into his heart to visit his brethren, the children of Israel.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And when he had seen one of them suffer wrong, he defended him: and striking the Egyptian, he avenged him who suffered the injury.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he thought that his brethren understood that God by his hand would save them. But they understood it not.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the day following, he shewed himself to them when they were at strife and would have reconciled them in peace, saying: Men, ye are brethren. Why hurt you one another?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But he that did the injury to his neighbour thrust him away, saying: Who hath appointed thee prince and judge over us:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>What! Wilt thou kill me, as thou didst yesterday kill the Egyptian?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Moses fled upon this word: and was a stranger in the land of Madian, where he begot two sons.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And when forty years were expired, there appeared to him, in the desert of mount Sina, an angel in a flame of fire in a bush.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Moses seeing it wondered at the sight. And as he drew near to view it, the voice of the Lord came unto him, saying:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>I am the God of thy fathers: the God of Abraham, the God of Isaac and the God of Jacob. And Moses being terrified durst not behold.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the Lord said to him: Loose the shoes from thy feet: for the place wherein thou standest is holy ground.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Seeing, I have seen the affliction of my people which is in Egypt: and I have heard their groaning and am come down to deliver them. And now come: and I will send thee into Egypt.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>This Moses, whom they refused, saying: Who hath appointed thee prince and judge? Him God sent to be prince and redeemer, by the hand of the angel who appeared to him in the bush.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>He brought them out, doing wonders and signs in the land of Egypt and in the Red Sea and in the desert, forty years.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>This is that Moses who said to the children of Israel: A prophet shall God raise up to you of your own brethren, as myself. Him shall you hear.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>This is he that was in the church in the wilderness, with the angel who spoke to him on Mount Sina and with our fathers. Who received the words of life to give unto us.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Whom our fathers would not obey: but thrust him away and in their hearts turned back into Egypt,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Saying to Aaron: Make us gods to go before us. For as for this Moses, who brought us out of the land of Egypt, we know not what is become of him.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And they made a calf in those days and offered sacrifices to the idol and rejoiced in the works of their own hands.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And God turned and gave them up to serve the host of heaven, as it is written in the books of the prophets: Did you offer victims and sacrifices to me for forty years, in the desert, O house of Israel?</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And you took unto you the tabernacle of Moloch and the star of your god Rempham, figures which you made to adore them. And I will carry you away beyond Babylon.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>The tabernacle of the testimony was with our fathers in the desert, as God ordained for them, speaking to Moses, that he should make it according to the form which he had seen.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Which also our fathers receiving, brought in with Jesus, into the possession of the Gentiles: whom God drove out before the face of our fathers, unto the days of David,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Who found grace before God and desired to find a tabernacle for the God of Jacob.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>But Solomon built him a house,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Yet the most High dwelleth not in houses made by hands, as the prophet saith:</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Heaven is my throne and the earth my footstool. What house will you build me (saith the Lord)? Or what is the place of my resting?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Hath not my hand made all these things?</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>You stiffnecked and uncircumcised in heart and ears, you always resist the Holy Ghost. As your fathers did, so do you also.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Which of the prophets have not your fathers persecuted? And they have slain them who foretold of the coming of the Just One: of whom you have been now the betrayers and murderers.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Who have received the law by the disposition of angels and have not kept it.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Now hearing these things, they were cut to the heart: and they gnashed with their teeth at him.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>But he, being full of the Holy Ghost, looking up steadfastly to heaven, saw the glory of God and Jesus standing on the right hand of God. And he said: Behold, I see the heavens opened and the Son of man standing on the right hand of God.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And they, crying out with a loud voice, stopped their ears and with one accord ran violently upon him.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And casting him forth without the city, they stoned him. And the witnesses laid down their garments at the feet of a young man, whose name was Saul.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>And they stoned Stephen, invoking and saying: Lord Jesus, receive my spirit.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixit autem princeps sacerdotum : Si hæc ita se habent ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui ait : Viri fratres et patres, audite : Deus gloriæ apparuit patri nostro Abrahæ cum esset in Mesopotamia, priusquam moraretur in Charan,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dixit ad illum : Exi de terra tua, et de cognatione tua, et veni in terram quam monstravero tibi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tunc exiit de terra Chaldæorum, et habitavit in Charan. Et inde, postquam mortuus est pater ejus, transtulit illum in terram istam, in qua nunc vos habitatis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et non dedit illi hæreditatem in ea, nec passum pedis : sed repromisit dare illi eam in possessionem, et semini ejus post ipsum, cum non haberet filium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Locutus est autem ei Deus : Quia erit semen ejus accola in terra aliena, et servituti eos subjicient, et male tractabunt eos annis quadringentis :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et gentem cui servierint, judicabo ego, dixit Dominus : et post hæc exibunt, et servient mihi in loco isto.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et dedit illi testamentum circumcisionis : et sic genuit Isaac, et circumcidit eum die octavo : et Isaac, Jacob : et Jacob, duodecim patriarchas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et patriarchæ æmulantes, Joseph vendiderunt in Ægyptum : et erat Deus cum eo,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et eripuit eum ex omnibus tribulationibus ejus, et dedit ei gratiam et sapientiam in conspectu pharaonis regis Ægypti : et constituit eum præpositum super Ægyptum, et super omnem domum suam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Venit autem fames in universam Ægyptum et Chanaan, et tribulatio magna : et non inveniebant cibos patres nostri.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum audisset autem Jacob esse frumentum in Ægypto, misit patres nostros primum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et in secundo cognitus est Joseph a fratribus suis, et manifestatum est Pharaoni genus ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Mittens autem Joseph, accersivit Jacob patrem suum et omnem cognationem suam, in animabus septuaginta quinque.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et descendit Jacob in Ægyptum : et defunctus est ipse, et patres nostri.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et translati sunt in Sichem, et positi sunt in sepulchro, quod emit Abraham pretio argenti a filiis Hemor filii Sichem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cum autem appropinquaret tempus promissionis quam confessus erat Deus Abrahæ, crevit populus, et multiplicatus est in Ægypto,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quoadusque surrexit alius rex in Ægypto, qui non sciebat Joseph.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hic circumveniens genus nostrum, afflixit patres nostros ut exponerent infantes suos, ne vivificarentur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Eodem tempore natus est Moyses, et fuit gratus Deo : qui nutritus est tribus mensibus in domo patris sui.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Exposito autem illo, sustulit eum filia Pharaonis, et nutrivit eum sibi in filium.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et eruditus est Moyses omni sapientia Ægyptiorum, et erat potens in verbis et in operibus suis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cum autem impleretur ei quadraginta annorum tempus, ascendit in cor ejus ut visitaret fratres suos filios Israël.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et cum vidisset quemdam injuriam patientem, vindicavit illum, et fecit ultionem ei qui injuriam sustinebat, percusso Ægyptio.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Existimabat autem intelligere fratres, quoniam Deus per manum ipsius daret salutem illis : at illi non intellexerunt.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sequenti vero die apparuit illis litigantibus : et reconciliabat eos in pace, dicens : Viri, fratres estis : ut quid nocetis alterutrum ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui autem injuriam faciebat proximo, repulit eum, dicens : Quis te constituit principem et judicem super nos ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Numquid interficere me tu vis, quemadmodum interfecisti heri Ægyptium ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Fugit autem Moyses in verbo isto : et factus est advena in terra Madian, ubi generavit filios duos.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et expletis annis quadraginta, apparuit illi in deserto montis Sina angelus in igne flammæ rubi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Moyses autem videns, admiratus est visum. Et accedente illo ut consideraret, facta est ad eum vox Domini, dicens :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ego sum Deus patrum tuorum, Deus Abraham, Deus Isaac, et Deus Jacob. Tremefactus autem Moyses, non audebat considerare.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dixit autem illi Dominus : Solve calceamentum pedum tuorum : locus enim in quo stas, terra sancta est.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Videns vidi afflictionem populi mei qui est in Ægypto, et gemitum eorum audivi, et descendi liberare eos. Et nunc veni, et mittam te in Ægyptum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Hunc Moysen, quem negaverunt, dicentes : Quis te constituit principem et judicem ? hunc Deus principem et redemptorem misit, cum manu angeli qui apparuit illi in rubo.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Hic eduxit illos faciens prodigia et signa in terra Ægypti, et in rubro mari, et in deserto annis quadraginta.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Hic est Moyses, qui dixit filiis Israël : Prophetam suscitabit vobis Deus de fratribus vestris, tamquam me : ipsum audietis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Hic est qui fuit in ecclesia in solitudine cum angelo, qui loquebatur ei in monte Sina, et cum patribus nostris : qui accepit verba vitæ dare nobis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Cui noluerunt obedire patres nostri : sed repulerunt, et aversi sunt cordibus suis in Ægyptum,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>dicentes ad Aaron : Fac nobis deos qui præcedant nos : Moyses enim hic, qui eduxit nos de terra Ægypti, nescimus quid factum sit ei.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et vitulum fecerunt in diebus illis, et obtulerunt hostiam simulacro, et lætabantur in operibus manuum suarum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Convertit autem Deus, et tradidit eos servire militiæ cæli, sicut scriptum est in libro prophetarum : Numquid victimas et hostias obtulistis mihi annis quadraginta in deserto, domus Israël ?</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et suscepistis tabernaculum Moloch, et sidus dei vestri Rempham, figuras quas fecistis adorare eas : et transferam vos trans Babylonem.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Tabernaculum testimonii fuit cum patribus nostris in deserto, sicut disposuit illis Deus loquens ad Moysen, ut faceret illud secundum formam quam viderat.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Quod et induxerunt, suscipientes patres nostri cum Jesu in possessionem gentium quas expulit Deus a facie patrum nostrorum, usque in diebus David,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>qui invenit gratiam ante Deum, et petiit ut inveniret tabernaculum Deo Jacob.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Salomon autem ædificavit illi domum.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Sed non Excelsus in manufactis habitat, sicut propheta dicit :</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Cælum mihi sedes est : terra autem scabellum pedum meorum. Quam domum ædificabitis mihi ? dicit Dominus : aut quis locus requietionis meæ est ?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Nonne manus mea fecit hæc omnia ?</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Dura cervice, et incircumcisis cordibus et auribus, vos semper Spiritui Sancto resistitis : sicut patres vestri, ita et vos.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Quem prophetarum non sunt persecuti patres vestri ? et occiderunt eos qui prænuntiabant de adventu Justi, cujus vos nunc proditores et homicidæ fuistis :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>qui accepistis legem in dispositione angelorum, et non custodistis.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Audientes autem hæc, dissecabantur cordibus suis, et stridebant dentibus in eum.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Cum autem esset plenus Spiritu Sancto, intendens in cælum, vidit gloriam Dei, et Jesum stantem a dextris Dei. Et ait : Ecce video cælos apertos, et Filium hominis stantem a dextris Dei.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Exclamantes autem voce magna continuerunt aures suas, et impetum fecerunt unanimiter in eum.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Et ejicientes eum extra civitatem, lapidabant : et testes deposuerunt vestimenta sua secus pedes adolescentis qui vocabatur Saulus.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Et lapidabant Stephanum invocantem, et dicentem : Domine Jesu, suscipe spiritum meum.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Positis autem genibus, clamavit voce magna, dicens : Domine, ne statuas illis hoc peccatum. Et cum hoc dixisset, obdormivit in Domino. Saulus autem erat consentiens neci ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 6</span></span></a><a class="flex min-h-14 items-center ju canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.7\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":7,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"Then the high priest said: Are these things so?\"},{\"verse\":2,\"text\":\"Who said: Ye men, brethren and fathers, hear. The God of glory appeared to our father Abraham, when he was in Mesopotamia, before he dwelt in Charan.\"},{\"verse\":3,\"text\":\"And said to him: Go forth out of thy country and from thy kindred: and come into the land which I shall shew thee.\"},{\"verse\":4,\"text\":\"Then he went out of the land of the Chaldeans and dwelt in Charan. And from thence, after his father was dead, he removed him into this land, wherein you now dwell.\"},{\"verse\":5,\"text\":\"And he gave him no inheritance in it: no, not the pace of a foot. But he promised to give it him in possession, and to his seed after him, when as yet he had no child.\"},{\"verse\":6,\"text\":\"And God said to him: That his seed should sojourn in a strange country, and that they should bring them under bondage and treat them evil four hundred years.\"},{\"verse\":7,\"text\":\"And the nation which they shall serve will I judge (said the Lord): and after these things they shall go out and shall serve me in this place.\"},{\"verse\":8,\"text\":\"And he gave him the covenant of circumcision. And so he begot Isaac and circumcised him the eighth day: and Isaac begot Jacob: and Jacob, the twelve patriarchs.\"},{\"verse\":9,\"text\":\"And the patriarchs, through envy, sold Joseph into Egypt. And God was with him,\"},{\"verse\":10,\"text\":\"And delivered him out of all his tribulations: and he gave him favour and wisdom in the sight of Pharao, the king of Egypt. And he appointed him governor over Egypt and over all his house.\"},{\"verse\":11,\"text\":\"Now there came a famine upon all Egypt and Chanaan, and great tribulation: and our fathers found no food.\"},{\"verse\":12,\"text\":\"But when Jacob had heard that there was corn in Egypt, he sent our fathers first.\"},{\"verse\":13,\"text\":\"And at the second time, Joseph was known by his brethren: and his kindred was made known to Pharao.\"},{\"verse\":14,\"text\":\"And Joseph sending, called thither Jacob, his father, and all his kindred, seventy-five souls.\"},{\"verse\":15,\"text\":\"So Jacob went down into Egypt. And he died, and our fathers.\"},{\"verse\":16,\"text\":\"And they were translated into Sichem and were laid in the sepulchre that Abraham bought for a sum of money of the sons of Hemor, the son of Sichem.\"},{\"verse\":17,\"text\":\"And when the time of the promise drew near, which God had promised to Abraham, the people increased and were multiplied in Egypt.\"},{\"verse\":18,\"text\":\"Till another king arose in Egypt, who knew not Joseph.\"},{\"verse\":19,\"text\":\"This same, dealing craftily with our race, afflicted our fathers, that they should expose their children, to the end they might not be kept alive.\"},{\"verse\":20,\"text\":\"At the same time was Moses born: and he was acceptable to God. Who was nourished three months in his father’s house.\"},{\"verse\":21,\"text\":\"And when he was exposed, Pharao’s daughter took him up and nourished him for her own son.\"},{\"verse\":22,\"text\":\"And Moses was instructed in all the wisdom of the Egyptians: and he was mighty in his words and in his deeds.\"},{\"verse\":23,\"text\":\"And when he was full forty years old, it came into his heart to visit his brethren, the children of Israel.\"},{\"verse\":24,\"text\":\"And when he had seen one of them suffer wrong, he defended him: and striking the Egyptian, he avenged him who suffered the injury.\"},{\"verse\":25,\"text\":\"And he thought that his brethren understood that God by his hand would save them. But they understood it not.\"},{\"verse\":26,\"text\":\"And the day following, he shewed himself to them when they were at strife and would have reconciled them in peace, saying: Men, ye are brethren. Why hurt you one another?\"},{\"verse\":27,\"text\":\"But he that did the injury to his neighbour thrust him away, saying: Who hath appointed thee prince and judge over us:\"},{\"verse\":28,\"text\":\"What! Wilt thou kill me, as thou didst yesterday kill the Egyptian?\"},{\"verse\":29,\"text\":\"And Moses fled upon this word: and was a stranger in the land of Madian, where he begot two sons.\"},{\"verse\":30,\"text\":\"And when forty years were expired, there appeared to him, in the desert of mount Sina, an angel in a flame of fire in a bush.\"},{\"verse\":31,\"text\":\"And Moses seeing it wondered at the sight. And as he drew near to view it, the voice of the Lord came unto him, saying:\"},{\"verse\":32,\"text\":\"I am the God of thy fathers: the God of Abraham, the God of Isaac and the God of Jacob. And Moses being terrified durst not behold.\"},{\"verse\":33,\"text\":\"And the Lord said to him: Loose the shoes from thy feet: for the place wherein thou standest is holy ground.\"},{\"verse\":34,\"text\":\"Seeing, I have seen the affliction of my people which is in Egypt: and I have heard their groaning and am come down to deliver them. And now come: and I will send thee into Egypt.\"},{\"verse\":35,\"text\":\"This Moses, whom they refused, saying: Who hath appointed thee prince and judge? Him God sent to be prince and redeemer, by the hand of the angel who appeared to him in the bush.\"},{\"verse\":36,\"text\":\"He brought them out, doing wonders and signs in the land of Egypt and in the Red Sea and in the desert, forty years.\"},{\"verse\":37,\"text\":\"This is that Moses who said to the children of Israel: A prophet shall God raise up to you of your own brethren, as myself. Him shall you hear.\"},{\"verse\":38,\"text\":\"This is he that was in the church in the wilderness, with the angel who spoke to him on Mount Sina and with our fathers. Who received the words of life to give unto us.\"},{\"verse\":39,\"text\":\"Whom our fathers would not obey: but thrust him away and in their hearts turned back into Egypt,\"},{\"verse\":40,\"text\":\"Saying to Aaron: Make us gods to go before us. For as for this Moses, who brought us out of the land of Egypt, we know not what is become of him.\"},{\"verse\":41,\"text\":\"And they made a calf in those days and offered sacrifices to the idol and rejoiced in the works of their own hands.\"},{\"verse\":42,\"text\":\"And God turned and gave them up to serve the host of heaven, as it is written in the books of the prophets: Did you offer victims and sacrifices to me for forty years, in the desert, O house of Israel?\"},{\"verse\":43,\"text\":\"And you took unto you the tabernacle of Moloch and the star of your god Rempham, figures which you made to adore them. And I will carry you away beyond Babylon.\"},{\"verse\":44,\"text\":\"The tabernacle of the testimony was with our fathers in the desert, as God ordained for them, speaking to Moses, that he should make it according to the form which he had seen.\"},{\"verse\":45,\"text\":\"Which also our fathers receiving, brought in with Jesus, into the possession of the Gentiles: whom God drove out before the face of our fathers, unto the days of David,\"},{\"verse\":46,\"text\":\"Who found grace before God and desired to find a tabernacle for the God of Jacob.\"},{\"verse\":47,\"text\":\"But Solomon built him a house,\"},{\"verse\":48,\"text\":\"Yet the most High dwelleth not in houses made by hands, as the prophet saith:\"},{\"verse\":49,\"text\":\"Heaven is my throne and the earth my footstool. What house will you build me (saith the Lord)? Or what is the place of my resting?\"},{\"verse\":50,\"text\":\"Hath not my hand made all these things?\"},{\"verse\":51,\"text\":\"You stiffnecked and uncircumcised in heart and ears, you always resist the Holy Ghost. As your fathers did, so do you also.\"},{\"verse\":52,\"text\":\"Which of the prophets have not your fathers persecuted? And they have slain them who foretold of the coming of the Just One: of whom you have been now the betrayers and murderers.\"},{\"verse\":53,\"text\":\"Who have received the law by the disposition of angels and have not kept it.\"},{\"verse\":54,\"text\":\"Now hearing these things, they were cut to the heart: and they gnashed with their teeth at him.\"},{\"verse\":55,\"text\":\"But he, being full of the Holy Ghost, looking up steadfastly to heaven, saw the glory of God and Jesus standing on the right hand of God. And he said: Behold, I see the heavens opened and the Son of man standing on the right hand of God.\"},{\"verse\":56,\"text\":\"And they, crying out with a loud voice, stopped their ears and with one accord ran violently upon him.\"},{\"verse\":57,\"text\":\"And casting him forth without the city, they stoned him. And the witnesses laid down their garments at the feet of a young man, whose name was Saul.\"},{\"verse\":58,\"text\":\"And they stoned Stephen, invoking and saying: Lord Jesus, receive my spirit.\"},{\"verse\":59,\"text\":\"And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixit autem princeps sacerdotum : Si hæc ita se habent ?\"},{\"verse\":2,\"text\":\"Qui ait : Viri fratres et patres, audite : Deus gloriæ apparuit patri nostro Abrahæ cum esset in Mesopotamia, priusquam moraretur in Charan,\"},{\"verse\":3,\"text\":\"et dixit ad illum : Exi de terra tua, et de cognatione tua, et veni in terram quam monstravero tibi.\"},{\"verse\":4,\"text\":\"Tunc exiit de terra Chaldæorum, et habitavit in Charan. Et inde, postquam mortuus est pater ejus, transtulit illum in terram istam, in qua nunc vos habitatis.\"},{\"verse\":5,\"text\":\"Et non dedit illi hæreditatem in ea, nec passum pedis : sed repromisit dare illi eam in possessionem, et semini ejus post ipsum, cum non haberet filium.\"},{\"verse\":6,\"text\":\"Locutus est autem ei Deus : Quia erit semen ejus accola in terra aliena, et servituti eos subjicient, et male tractabunt eos annis quadringentis :\"},{\"verse\":7,\"text\":\"et gentem cui servierint, judicabo ego, dixit Dominus : et post hæc exibunt, et servient mihi in loco isto.\"},{\"verse\":8,\"text\":\"Et dedit illi testamentum circumcisionis : et sic genuit Isaac, et circumcidit eum die octavo : et Isaac, Jacob : et Jacob, duodecim patriarchas.\"},{\"verse\":9,\"text\":\"Et patriarchæ æmulantes, Joseph vendiderunt in Ægyptum : et erat Deus cum eo,\"},{\"verse\":10,\"text\":\"et eripuit eum ex omnibus tribulationibus ejus, et dedit ei gratiam et sapientiam in conspectu pharaonis regis Ægypti : et constituit eum præpositum super Ægyptum, et super omnem domum suam.\"},{\"verse\":11,\"text\":\"Venit autem fames in universam Ægyptum et Chanaan, et tribulatio magna : et non inveniebant cibos patres nostri.\"},{\"verse\":12,\"text\":\"Cum audisset autem Jacob esse frumentum in Ægypto, misit patres nostros primum :\"},{\"verse\":13,\"text\":\"et in secundo cognitus est Joseph a fratribus suis, et manifestatum est Pharaoni genus ejus.\"},{\"verse\":14,\"text\":\"Mittens autem Joseph, accersivit Jacob patrem suum et omnem cognationem suam, in animabus septuaginta quinque.\"},{\"verse\":15,\"text\":\"Et descendit Jacob in Ægyptum : et defunctus est ipse, et patres nostri.\"},{\"verse\":16,\"text\":\"Et translati sunt in Sichem, et positi sunt in sepulchro, quod emit Abraham pretio argenti a filiis Hemor filii Sichem.\"},{\"verse\":17,\"text\":\"Cum autem appropinquaret tempus promissionis quam confessus erat Deus Abrahæ, crevit populus, et multiplicatus est in Ægypto,\"},{\"verse\":18,\"text\":\"quoadusque surrexit alius rex in Ægypto, qui non sciebat Joseph.\"},{\"verse\":19,\"text\":\"Hic circumveniens genus nostrum, afflixit patres nostros ut exponerent infantes suos, ne vivificarentur.\"},{\"verse\":20,\"text\":\"Eodem tempore natus est Moyses, et fuit gratus Deo : qui nutritus est tribus mensibus in domo patris sui.\"},{\"verse\":21,\"text\":\"Exposito autem illo, sustulit eum filia Pharaonis, et nutrivit eum sibi in filium.\"},{\"verse\":22,\"text\":\"Et eruditus est Moyses omni sapientia Ægyptiorum, et erat potens in verbis et in operibus suis.\"},{\"verse\":23,\"text\":\"Cum autem impleretur ei quadraginta annorum tempus, ascendit in cor ejus ut visitaret fratres suos filios Israël.\"},{\"verse\":24,\"text\":\"Et cum vidisset quemdam injuriam patientem, vindicavit illum, et fecit ultionem ei qui injuriam sustinebat, percusso Ægyptio.\"},{\"verse\":25,\"text\":\"Existimabat autem intelligere fratres, quoniam Deus per manum ipsius daret salutem illis : at illi non intellexerunt.\"},{\"verse\":26,\"text\":\"Sequenti vero die apparuit illis litigantibus : et reconciliabat eos in pace, dicens : Viri, fratres estis : ut quid nocetis alterutrum ?\"},{\"verse\":27,\"text\":\"Qui autem injuriam faciebat proximo, repulit eum, dicens : Quis te constituit principem et judicem super nos ?\"},{\"verse\":28,\"text\":\"Numquid interficere me tu vis, quemadmodum interfecisti heri Ægyptium ?\"},{\"verse\":29,\"text\":\"Fugit autem Moyses in verbo isto : et factus est advena in terra Madian, ubi generavit filios duos.\"},{\"verse\":30,\"text\":\"Et expletis annis quadraginta, apparuit illi in deserto montis Sina angelus in igne flammæ rubi.\"},{\"verse\":31,\"text\":\"Moyses autem videns, admiratus est visum. Et accedente illo ut consideraret, facta est ad eum vox Domini, dicens :\"},{\"verse\":32,\"text\":\"Ego sum Deus patrum tuorum, Deus Abraham, Deus Isaac, et Deus Jacob. Tremefactus autem Moyses, non audebat considerare.\"},{\"verse\":33,\"text\":\"Dixit autem illi Dominus : Solve calceamentum pedum tuorum : locus enim in quo stas, terra sancta est.\"},{\"verse\":34,\"text\":\"Videns vidi afflictionem populi mei qui est in Ægypto, et gemitum eorum audivi, et descendi liberare eos. Et nunc veni, et mittam te in Ægyptum.\"},{\"verse\":35,\"text\":\"Hunc Moysen, quem negaverunt, dicentes : Quis te constituit principem et judicem ? hunc Deus principem et redemptorem misit, cum manu angeli qui apparuit illi in rubo.\"},{\"verse\":36,\"text\":\"Hic eduxit illos faciens prodigia et signa in terra Ægypti, et in rubro mari, et in deserto annis quadraginta.\"},{\"verse\":37,\"text\":\"Hic est Moyses, qui dixit filiis Israël : Prophetam suscitabit vobis Deus de fratribus vestris, tamquam me : ipsum audietis.\"},{\"verse\":38,\"text\":\"Hic est qui fuit in ecclesia in solitudine cum angelo, qui loquebatur ei in monte Sina, et cum patribus nostris : qui accepit verba vitæ dare nobis.\"},{\"verse\":39,\"text\":\"Cui noluerunt obedire patres nostri : sed repulerunt, et aversi sunt cordibus suis in Ægyptum,\"},{\"verse\":40,\"text\":\"dicentes ad Aaron : Fac nobis deos qui præcedant nos : Moyses enim hic, qui eduxit nos de terra Ægypti, nescimus quid factum sit ei.\"},{\"verse\":41,\"text\":\"Et vitulum fecerunt in diebus illis, et obtulerunt hostiam simulacro, et lætabantur in operibus manuum suarum.\"},{\"verse\":42,\"text\":\"Convertit autem Deus, et tradidit eos servire militiæ cæli, sicut scriptum est in libro prophetarum : Numquid victimas et hostias obtulistis mihi annis quadraginta in deserto, domus Israël ?\"},{\"verse\":43,\"text\":\"Et suscepistis tabernaculum Moloch, et sidus dei vestri Rempham, figuras quas fecistis adorare eas : et transferam vos trans Babylonem.\"},{\"verse\":44,\"text\":\"Tabernaculum testimonii fuit cum patribus nostris in deserto, sicut disposuit illis Deus loquens ad Moysen, ut faceret illud secundum formam quam viderat.\"},{\"verse\":45,\"text\":\"Quod et induxerunt, suscipientes patres nostri cum Jesu in possessionem gentium quas expulit Deus a facie patrum nostrorum, usque in diebus David,\"},{\"verse\":46,\"text\":\"qui invenit gratiam ante Deum, et petiit ut inveniret tabernaculum Deo Jacob.\"},{\"verse\":47,\"text\":\"Salomon autem ædificavit illi domum.\"},{\"verse\":48,\"text\":\"Sed non Excelsus in manufactis habitat, sicut propheta dicit :\"},{\"verse\":49,\"text\":\"Cælum mihi sedes est : terra autem scabellum pedum meorum. Quam domum ædificabitis mihi ? dicit Dominus : aut quis locus requietionis meæ est ?\"},{\"verse\":50,\"text\":\"Nonne manus mea fecit hæc omnia ?\"},{\"verse\":51,\"text\":\"Dura cervice, et incircumcisis cordibus et auribus, vos semper Spiritui Sancto resistitis : sicut patres vestri, ita et vos.\"},{\"verse\":52,\"text\":\"Quem prophetarum non sunt persecuti patres vestri ? et occiderunt eos qui prænuntiabant de adventu Justi, cujus vos nunc proditores et homicidæ fuistis :\"},{\"verse\":53,\"text\":\"qui accepistis legem in dispositione angelorum, et non custodistis.\"},{\"verse\":54,\"text\":\"Audientes autem hæc, dissecabantur cordibus suis, et stridebant dentibus in eum.\"},{\"verse\":55,\"text\":\"Cum autem esset plenus Spiritu Sancto, intendens in cælum, vidit gloriam Dei, et Jesum stantem a dextris Dei. Et ait : Ecce video cælos apertos, et Filium hominis stantem a dextris Dei.\"},{\"verse\":56,\"text\":\"Exclamantes autem voce magna continuerunt aures suas, et impetum fecerunt unanimiter in eum.\"},{\"verse\":57,\"text\":\"Et ejicientes eum extra civitatem, lapidabant : et testes deposuerunt vestimenta sua secus pedes adolescentis qui vocabatur Saulus.\"},{\"verse\":58,\"text\":\"Et lapidabant Stephanum invocantem, et dicentem : Domine Jesu, suscipe spiritum meum.\"},{\"verse\":59,\"text\":\"Positis autem genibus, clamavit voce magna, dicens : Domine, ne statuas illis hoc peccatum. Et cum hoc dixisset, obdormivit in Domino. Saulus autem erat consentiens neci ejus.\"}],\"summary\":\"Stephen’s speech before the council. His martyrdom.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":6,\"label\":\"Acts 6\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":8,\"label\":\"Acts 8\"}}]]\n"])</script></body></html>
