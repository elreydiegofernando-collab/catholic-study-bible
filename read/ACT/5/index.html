<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 5 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The judgment of God upon Ananias and Saphira. The apostles are cast into prison.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But a certain man named Ananias, with Saphira his wife, sold a piece of land,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And by fraud kept back part of the price of the land, his wife being privy thereunto: and bringing a certain part of it, laid it at the feet of the apostles.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But Peter said: Ananias, why hath Satan tempted thy heart, that thou shouldst lie to the Holy Ghost and by fraud keep part of the price of the land?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Whilst it remained, did it not remain to thee? And after it was sold, was it not in thy power? Why hast thou conceived this thing in thy heart? Thou hast not lied to men, but to God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Ananias, hearing these words, fell down and gave up the ghost. And there came great fear upon all that heard it.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the young men rising up, removed him, and carrying him out, buried him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And it was about the space of three hours after, when his wife, not knowing what had happened, came in.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Peter said to her: Tell me, woman, whether you sold the land for so much? And she said: Yea, for so much.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Peter said unto her: Why have you agreed together to tempt the spirit of the Lord? Behold the feet of them who have buried thy husband are at the door: and they shall carry thee out,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Immediately, she fell down before his feet and gave up the ghost. And the young men coming in found her dead: and carried her out and buried her by her husband.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And there came great fear upon the whole church and upon all that heard these things.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And by the hands of the apostles were many signs and wonders wrought among the people. And they were all with one accord in Solomon’s porch.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But of the rest no man durst join himself unto them: but the people magnified them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the multitude of men and women who believed in the Lord was more increased:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Insomuch that they brought forth the sick into the streets and laid them on beds and couches, that, when Peter came, his shadow at the least might overshadow any of them and they might be delivered from their infirmities.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And there came also together to Jerusalem a multitude out of the neighbouring cities, bringing sick persons and such as were troubled with unclean spirits: who were all healed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then the high priest rising up, and all they that were with him (which is the heresy of the Sadducees) were filled with envy.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they laid hands on the apostles and put them in the common prison.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But an angel of the Lord by night, opening the doors of the prison and leading them out, said:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Go, and standing speak in the temple to the people all the words of this life.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Who having heard this, early in the morning, entered into the temple and taught. And the high priest coming, and they that were with him, called together the council and all the ancients of the children of Israel: and they sent to the prison to have them brought.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But when the ministers came and opening the prison found them not there, they returned and told,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Saying: The prison indeed we found shut with all diligence, and the keepers standing before the doors; but opening it, we found no man within.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Now when the officer of the temple and the chief priests heard these words, they were in doubt concerning them, what would come to pass.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But one came and told them: Behold, the men whom you put in prison are in the temple, standing and teaching the people.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then went the officer with the ministers and brought them without violence: for they feared the people, lest they should be stoned.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when they had brought them, they set them before the council. And the high priest asked them,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Saying: Commanding, we commanded you that you should not teach in this name. And behold, you have filled Jerusalem with your doctrine: and you have a mind to bring the blood of this man upon us.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But Peter and the apostles answering, said: We ought to obey God rather than men.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The God of our fathers hath raised up Jesus, whom you put to death, hanging him upon a tree.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Him hath God exalted with his right hand, to be Prince and Saviour, to give repentance to Israel and remission of sins.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And we are witnesses of these things: and the Holy Ghost, whom God hath given to all that obey him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>When they had heard these things, they were cut to the heart: and they thought to put them to death.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But one in the council rising up, a Pharisee, named Gamaliel, a doctor of the law, respected by all the people, commanded the men to be put forth a little while.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And he said to them: Ye men of Israel, take heed to yourselves what you intend to do, as touching these men.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For before these days rose up Theodas, affirming himself to be somebody, to whom a number of men, about four hundred, joined themselves. Who was slain: and all that believed him were scattered and brought to nothing.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>After this man, rose up Judas of Galilee, in the days of the enrolling, and drew away the people after him. He also perished: and all, even as many as consented to him, were dispersed.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And now, therefore, I say to you: Refrain from these men and let them alone. For if this council or this work be of men, it will come to nought:</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>But if it be of God, you cannot overthrow it, lest perhaps you be found even to fight against God. And they consented to him.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And calling in the apostles, after they had scourged them, they charged them that they should not speak at all in the name of Jesus. And they dismissed them.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And they indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And every day they ceased not, in the temple and from house to house, to teach and preach Christ Jesus.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vir autem quidam nomine Ananias, cum Saphira uxore suo vendidit agrum,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et fraudavit de pretio agri, conscia uxore sua : et afferens partem quamdam, ad pedes Apostolorum posuit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixit autem Petrus : Anania, cur tentavit Satanas cor tuum, mentiri te Spiritui Sancto, et fraudare de pretio agri ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>nonne manens tibi manebat, et venundatum in tua erat potestate ? quare posuisti in corde tuo hanc rem ? non es mentitus hominibus, sed Deo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Audiens autem Ananias hæc verba, cecidit, et expiravit. Et factus est timor magnus super omnes qui audierunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Surgentes autem juvenes amoverunt eum, et efferentes sepelierunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Factum est autem quasi horarum trium spatium, et uxor ipsius, nesciens quod factum fuerat, introivit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixit autem ei Petrus : Dic mihi mulier, si tanti agrum vendidistis ? At illa dixit : Etiam tanti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Petrus autem ad eam : Quid utique convenit vobis tentare Spiritum Domini ? Ecce pedes eorum qui sepelierunt virum tuum ad ostium, et efferent te.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Confestim cecidit ante pedes ejus, et expiravit. Intrantes autem juvenes invenerunt illam mortuam : et extulerunt, et sepelierunt ad virum suum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et factus est timor magnus in universa ecclesia, et in omnes qui audierunt hæc.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Per manus autem Apostolorum fiebant signa et prodigia multa in plebe. Et erant unanimiter omnes in porticu Salomonis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ceterorum autem nemo audebat se conjungere illis : sed magnificabat eos populus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Magis autem augebatur credentium in Domino multitudo virorum ac mulierum,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ita ut in plateas ejicerent infirmos, et ponerent in lectulis et grabatis, ut, veniente Petro, saltem umbra illius obumbraret quemquam illorum, et liberarentur ab infirmitatibus suis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Concurrebat autem et multitudo vicinarum civitatum Jerusalem, afferentes ægros, et vexatos a spiritibus immundis : qui curabantur omnes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Exsurgens autem princeps sacerdotum, et omnes qui cum illo erant (quæ est hæresis sadducæorum), repleti sunt zelo :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et injecerunt manus in Apostolos, et posuerunt eos in custodia publica.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Angelus autem Domini per noctem aperiens januas carceris, et educens eos, dixit :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ite, et stantes loquimini in templo plebi omnia verba vitæ hujus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui cum audissent, intraverunt diluculo in templum, et docebant. Adveniens autem princeps sacerdotum, et qui cum eo erant, convocaverunt concilium, et omnes seniores filiorum Israël : et miserunt ad carcerem ut adducerentur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cum autem venissent ministri, et aperto carcere non invenissent illos, reversi nuntiaverunt,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>dicentes : Carcerem quidem invenimus clausum cum omni diligentia, et custodes stantes ante januas : aperientes autem neminem intus invenimus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ut autem audierunt hos sermones magistratus templi et principes sacerdotum, ambigebant de illis quidnam fieret.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Adveniens autem quidam, nuntiavit eis : Quia ecce viri quos posuistis in carcerem, sunt in templo, stantes et docentes populum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tunc abiit magistratus cum ministris, et adduxit illos sine vi : timebant enim populum ne lapidarentur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et cum adduxissent illos, statuerunt in concilio : et interrogavit eos princeps sacerdotum,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>dicens : Præcipiendo præcepimus vobis ne doceretis in nomine isto, et ecce replestis Jerusalem doctrina vestra : et vultis inducere super nos sanguinem hominis istius.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Respondens autem Petrus et Apostoli, dixerunt : Obedire oportet Deo magis quam hominibus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Deus patrum nostrorum suscitavit Jesum, quem vos interemistis, suspendentes in ligno.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Hunc principem et salvatorem Deus exaltavit dextera sua ad dandam pœnitentiam Israëli, et remissionem peccatorum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et nos sumus testes horum verborum, et Spiritus Sanctus, quem dedit Deus omnibus obedientibus sibi.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hæc cum audissent, dissecabantur, et cogitabant interficere illos.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Surgens autem quidam in concilio pharisæus, nomine Gamaliel, legis doctor, honorabilis universæ plebi, jussit foras ad breve homines fieri,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>dixitque ad illos : Viri Israëlitæ, attendite vobis super hominibus istis quid acturi sitis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Ante hos enim dies extitit Theodas, dicens se esse aliquem, cui consensit numerus virorum circiter quadringentorum : qui occisus est, et omnes qui credebant ei, dissipati sunt, et redacti ad nihilum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Post hunc extitit Judas Galilæus in diebus professionis, et avertit populum post se : et ipse periit, et omnes quotquot consenserunt ei, dispersi sunt.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et nunc itaque dico vobis, discedite ab hominibus istis, et sinite illos : quoniam si est ex hominibus consilium hoc aut opus, dissolvetur :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>si vero ex Deo est, non poteritis dissolvere illud, ne forte et Deo repugnare inveniamini. Consenserunt autem illi.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et convocantes Apostolos, cæsis denuntiaverunt ne omnino loquerentur in nomine Jesu, et dimiserunt eos.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et illi quidem ibant gaudentes a conspectu concilii, quoniam digni habiti sunt pro nomine Jesu contumeliam pati.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Omni autem die non cessabant in templo et circa domos, docentes et evangelizantes Christum Jesum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Acts 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Acts 4" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded /apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ACT.5\",{\"bookId\":51,\"usfm\":\"ACT\",\"bookName\":\"Acts\",\"drName\":\"Acts\",\"chapter\":5,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"But a certain man named Ananias, with Saphira his wife, sold a piece of land,\"},{\"verse\":2,\"text\":\"And by fraud kept back part of the price of the land, his wife being privy thereunto: and bringing a certain part of it, laid it at the feet of the apostles.\"},{\"verse\":3,\"text\":\"But Peter said: Ananias, why hath Satan tempted thy heart, that thou shouldst lie to the Holy Ghost and by fraud keep part of the price of the land?\"},{\"verse\":4,\"text\":\"Whilst it remained, did it not remain to thee? And after it was sold, was it not in thy power? Why hast thou conceived this thing in thy heart? Thou hast not lied to men, but to God.\"},{\"verse\":5,\"text\":\"And Ananias, hearing these words, fell down and gave up the ghost. And there came great fear upon all that heard it.\"},{\"verse\":6,\"text\":\"And the young men rising up, removed him, and carrying him out, buried him.\"},{\"verse\":7,\"text\":\"And it was about the space of three hours after, when his wife, not knowing what had happened, came in.\"},{\"verse\":8,\"text\":\"And Peter said to her: Tell me, woman, whether you sold the land for so much? And she said: Yea, for so much.\"},{\"verse\":9,\"text\":\"And Peter said unto her: Why have you agreed together to tempt the spirit of the Lord? Behold the feet of them who have buried thy husband are at the door: and they shall carry thee out,\"},{\"verse\":10,\"text\":\"Immediately, she fell down before his feet and gave up the ghost. And the young men coming in found her dead: and carried her out and buried her by her husband.\"},{\"verse\":11,\"text\":\"And there came great fear upon the whole church and upon all that heard these things.\"},{\"verse\":12,\"text\":\"And by the hands of the apostles were many signs and wonders wrought among the people. And they were all with one accord in Solomon’s porch.\"},{\"verse\":13,\"text\":\"But of the rest no man durst join himself unto them: but the people magnified them.\"},{\"verse\":14,\"text\":\"And the multitude of men and women who believed in the Lord was more increased:\"},{\"verse\":15,\"text\":\"Insomuch that they brought forth the sick into the streets and laid them on beds and couches, that, when Peter came, his shadow at the least might overshadow any of them and they might be delivered from their infirmities.\"},{\"verse\":16,\"text\":\"And there came also together to Jerusalem a multitude out of the neighbouring cities, bringing sick persons and such as were troubled with unclean spirits: who were all healed.\"},{\"verse\":17,\"text\":\"Then the high priest rising up, and all they that were with him (which is the heresy of the Sadducees) were filled with envy.\"},{\"verse\":18,\"text\":\"And they laid hands on the apostles and put them in the common prison.\"},{\"verse\":19,\"text\":\"But an angel of the Lord by night, opening the doors of the prison and leading them out, said:\"},{\"verse\":20,\"text\":\"Go, and standing speak in the temple to the people all the words of this life.\"},{\"verse\":21,\"text\":\"Who having heard this, early in the morning, entered into the temple and taught. And the high priest coming, and they that were with him, called together the council and all the ancients of the children of Israel: and they sent to the prison to have them brought.\"},{\"verse\":22,\"text\":\"But when the ministers came and opening the prison found them not there, they returned and told,\"},{\"verse\":23,\"text\":\"Saying: The prison indeed we found shut with all diligence, and the keepers standing before the doors; but opening it, we found no man within.\"},{\"verse\":24,\"text\":\"Now when the officer of the temple and the chief priests heard these words, they were in doubt concerning them, what would come to pass.\"},{\"verse\":25,\"text\":\"But one came and told them: Behold, the men whom you put in prison are in the temple, standing and teaching the people.\"},{\"verse\":26,\"text\":\"Then went the officer with the ministers and brought them without violence: for they feared the people, lest they should be stoned.\"},{\"verse\":27,\"text\":\"And when they had brought them, they set them before the council. And the high priest asked them,\"},{\"verse\":28,\"text\":\"Saying: Commanding, we commanded you that you should not teach in this name. And behold, you have filled Jerusalem with your doctrine: and you have a mind to bring the blood of this man upon us.\"},{\"verse\":29,\"text\":\"But Peter and the apostles answering, said: We ought to obey God rather than men.\"},{\"verse\":30,\"text\":\"The God of our fathers hath raised up Jesus, whom you put to death, hanging him upon a tree.\"},{\"verse\":31,\"text\":\"Him hath God exalted with his right hand, to be Prince and Saviour, to give repentance to Israel and remission of sins.\"},{\"verse\":32,\"text\":\"And we are witnesses of these things: and the Holy Ghost, whom God hath given to all that obey him.\"},{\"verse\":33,\"text\":\"When they had heard these things, they were cut to the heart: and they thought to put them to death.\"},{\"verse\":34,\"text\":\"But one in the council rising up, a Pharisee, named Gamaliel, a doctor of the law, respected by all the people, commanded the men to be put forth a little while.\"},{\"verse\":35,\"text\":\"And he said to them: Ye men of Israel, take heed to yourselves what you intend to do, as touching these men.\"},{\"verse\":36,\"text\":\"For before these days rose up Theodas, affirming himself to be somebody, to whom a number of men, about four hundred, joined themselves. Who was slain: and all that believed him were scattered and brought to nothing.\"},{\"verse\":37,\"text\":\"After this man, rose up Judas of Galilee, in the days of the enrolling, and drew away the people after him. He also perished: and all, even as many as consented to him, were dispersed.\"},{\"verse\":38,\"text\":\"And now, therefore, I say to you: Refrain from these men and let them alone. For if this council or this work be of men, it will come to nought:\"},{\"verse\":39,\"text\":\"But if it be of God, you cannot overthrow it, lest perhaps you be found even to fight against God. And they consented to him.\"},{\"verse\":40,\"text\":\"And calling in the apostles, after they had scourged them, they charged them that they should not speak at all in the name of Jesus. And they dismissed them.\"},{\"verse\":41,\"text\":\"And they indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus.\"},{\"verse\":42,\"text\":\"And every day they ceased not, in the temple and from house to house, to teach and preach Christ Jesus.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vir autem quidam nomine Ananias, cum Saphira uxore suo vendidit agrum,\"},{\"verse\":2,\"text\":\"et fraudavit de pretio agri, conscia uxore sua : et afferens partem quamdam, ad pedes Apostolorum posuit.\"},{\"verse\":3,\"text\":\"Dixit autem Petrus : Anania, cur tentavit Satanas cor tuum, mentiri te Spiritui Sancto, et fraudare de pretio agri ?\"},{\"verse\":4,\"text\":\"nonne manens tibi manebat, et venundatum in tua erat potestate ? quare posuisti in corde tuo hanc rem ? non es mentitus hominibus, sed Deo.\"},{\"verse\":5,\"text\":\"Audiens autem Ananias hæc verba, cecidit, et expiravit. Et factus est timor magnus super omnes qui audierunt.\"},{\"verse\":6,\"text\":\"Surgentes autem juvenes amoverunt eum, et efferentes sepelierunt.\"},{\"verse\":7,\"text\":\"Factum est autem quasi horarum trium spatium, et uxor ipsius, nesciens quod factum fuerat, introivit.\"},{\"verse\":8,\"text\":\"Dixit autem ei Petrus : Dic mihi mulier, si tanti agrum vendidistis ? At illa dixit : Etiam tanti.\"},{\"verse\":9,\"text\":\"Petrus autem ad eam : Quid utique convenit vobis tentare Spiritum Domini ? Ecce pedes eorum qui sepelierunt virum tuum ad ostium, et efferent te.\"},{\"verse\":10,\"text\":\"Confestim cecidit ante pedes ejus, et expiravit. Intrantes autem juvenes invenerunt illam mortuam : et extulerunt, et sepelierunt ad virum suum.\"},{\"verse\":11,\"text\":\"Et factus est timor magnus in universa ecclesia, et in omnes qui audierunt hæc.\"},{\"verse\":12,\"text\":\"Per manus autem Apostolorum fiebant signa et prodigia multa in plebe. Et erant unanimiter omnes in porticu Salomonis.\"},{\"verse\":13,\"text\":\"Ceterorum autem nemo audebat se conjungere illis : sed magnificabat eos populus.\"},{\"verse\":14,\"text\":\"Magis autem augebatur credentium in Domino multitudo virorum ac mulierum,\"},{\"verse\":15,\"text\":\"ita ut in plateas ejicerent infirmos, et ponerent in lectulis et grabatis, ut, veniente Petro, saltem umbra illius obumbraret quemquam illorum, et liberarentur ab infirmitatibus suis.\"},{\"verse\":16,\"text\":\"Concurrebat autem et multitudo vicinarum civitatum Jerusalem, afferentes ægros, et vexatos a spiritibus immundis : qui curabantur omnes.\"},{\"verse\":17,\"text\":\"Exsurgens autem princeps sacerdotum, et omnes qui cum illo erant (quæ est hæresis sadducæorum), repleti sunt zelo :\"},{\"verse\":18,\"text\":\"et injecerunt manus in Apostolos, et posuerunt eos in custodia publica.\"},{\"verse\":19,\"text\":\"Angelus autem Domini per noctem aperiens januas carceris, et educens eos, dixit :\"},{\"verse\":20,\"text\":\"Ite, et stantes loquimini in templo plebi omnia verba vitæ hujus.\"},{\"verse\":21,\"text\":\"Qui cum audissent, intraverunt diluculo in templum, et docebant. Adveniens autem princeps sacerdotum, et qui cum eo erant, convocaverunt concilium, et omnes seniores filiorum Israël : et miserunt ad carcerem ut adducerentur.\"},{\"verse\":22,\"text\":\"Cum autem venissent ministri, et aperto carcere non invenissent illos, reversi nuntiaverunt,\"},{\"verse\":23,\"text\":\"dicentes : Carcerem quidem invenimus clausum cum omni diligentia, et custodes stantes ante januas : aperientes autem neminem intus invenimus.\"},{\"verse\":24,\"text\":\"Ut autem audierunt hos sermones magistratus templi et principes sacerdotum, ambigebant de illis quidnam fieret.\"},{\"verse\":25,\"text\":\"Adveniens autem quidam, nuntiavit eis : Quia ecce viri quos posuistis in carcerem, sunt in templo, stantes et docentes populum.\"},{\"verse\":26,\"text\":\"Tunc abiit magistratus cum ministris, et adduxit illos sine vi : timebant enim populum ne lapidarentur.\"},{\"verse\":27,\"text\":\"Et cum adduxissent illos, statuerunt in concilio : et interrogavit eos princeps sacerdotum,\"},{\"verse\":28,\"text\":\"dicens : Præcipiendo præcepimus vobis ne doceretis in nomine isto, et ecce replestis Jerusalem doctrina vestra : et vultis inducere super nos sanguinem hominis istius.\"},{\"verse\":29,\"text\":\"Respondens autem Petrus et Apostoli, dixerunt : Obedire oportet Deo magis quam hominibus.\"},{\"verse\":30,\"text\":\"Deus patrum nostrorum suscitavit Jesum, quem vos interemistis, suspendentes in ligno.\"},{\"verse\":31,\"text\":\"Hunc principem et salvatorem Deus exaltavit dextera sua ad dandam pœnitentiam Israëli, et remissionem peccatorum :\"},{\"verse\":32,\"text\":\"et nos sumus testes horum verborum, et Spiritus Sanctus, quem dedit Deus omnibus obedientibus sibi.\"},{\"verse\":33,\"text\":\"Hæc cum audissent, dissecabantur, et cogitabant interficere illos.\"},{\"verse\":34,\"text\":\"Surgens autem quidam in concilio pharisæus, nomine Gamaliel, legis doctor, honorabilis universæ plebi, jussit foras ad breve homines fieri,\"},{\"verse\":35,\"text\":\"dixitque ad illos : Viri Israëlitæ, attendite vobis super hominibus istis quid acturi sitis.\"},{\"verse\":36,\"text\":\"Ante hos enim dies extitit Theodas, dicens se esse aliquem, cui consensit numerus virorum circiter quadringentorum : qui occisus est, et omnes qui credebant ei, dissipati sunt, et redacti ad nihilum.\"},{\"verse\":37,\"text\":\"Post hunc extitit Judas Galilæus in diebus professionis, et avertit populum post se : et ipse periit, et omnes quotquot consenserunt ei, dispersi sunt.\"},{\"verse\":38,\"text\":\"Et nunc itaque dico vobis, discedite ab hominibus istis, et sinite illos : quoniam si est ex hominibus consilium hoc aut opus, dissolvetur :\"},{\"verse\":39,\"text\":\"si vero ex Deo est, non poteritis dissolvere illud, ne forte et Deo repugnare inveniamini. Consenserunt autem illi.\"},{\"verse\":40,\"text\":\"Et convocantes Apostolos, cæsis denuntiaverunt ne omnino loquerentur in nomine Jesu, et dimiserunt eos.\"},{\"verse\":41,\"text\":\"Et illi quidem ibant gaudentes a conspectu concilii, quoniam digni habiti sunt pro nomine Jesu contumeliam pati.\"},{\"verse\":42,\"text\":\"Omni autem die non cessabant in templo et circa domos, docentes et evangelizantes Christum Jesum.\"}],\"summary\":\"The judgment of God upon Ananias and Saphira. The apostles are cast into prison.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":4,\"label\":\"Acts 4\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":6,\"label\":\"Acts 6\"}}]]\n"])</script></body></html>
