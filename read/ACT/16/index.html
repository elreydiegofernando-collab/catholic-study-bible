<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Acts 16 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul visits the churches. He is called to preach in Macedonia. He is scourged at Philippi.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And he came to Derbe and Lystra. And behold, there was a certain disciple there named Timothy, the son of a Jewish woman that believed: but his father was a Gentile.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>To this man the brethren that were in Lystra and Iconium gave a good testimony.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Him Paul would have to go along with him: and taking him, he circumcised him, because of the Jews who were in those places. For they all knew that his father was a Gentile.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And as they passed through the cities, they delivered unto them the decrees for to keep, that were decreed by the apostles and ancients who were at Jerusalem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the churches were confirmed in faith and increased in number daily.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when they had passed through Phrygia and the country of Galatia, they were forbidden by the Holy Ghost to preach the word in Asia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when they were come into Mysia, they attempted to go into Bithynia: and the Spirit of Jesus suffered them not.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when they had passed through Mysia, they went down to Troas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And a vision was shewed to Paul in the night, which was a man of Macedonia standing and beseeching him and saying: Pass over into Macedonia and help us.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And as soon as he had seen the vision, immediately we sought to go into Macedonia: being assured that God had called us to preach the gospel to them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And sailing from Troas, we came with a straight course to Samothracia, and the day following to Neapolis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And from thence to Philippi, which is the chief city of part of Macedonia, a colony. And we were in this city some days conferring together.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And upon the Sabbath day, we went forth without the gate by a river side, where it seemed that there was prayer: and sitting down, we spoke to the women that were assembled.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And a certain woman named Lydia, a seller of purple, of the city of Thyatira, one that worshipped God, did hear: whose heart the Lord opened to attend to those things which were said by Paul.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when she was baptized, and her household, she besought us, saying: If you have judged me to be faithful to the Lord, come into my house and abide there. And she constrained us.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And it came to pass, as we went to prayer, a certain girl having a pythonical spirit met us, who brought to her masters much gain by divining.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>This same following Paul and us, cried out, saying: These men are the servants of the Most High God, who preach unto you the way of salvation.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And this she did many days. But Paul being grieved, turned and said to the spirit: I command thee, in the name of Jesus Christ, to go out from her. And he went out the same hour.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But her masters, seeing that the hope of their gain was gone, apprehending Paul and Silas, brought them into the market place to the rulers.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And presenting them to the magistrates, they said: These men disturb our city, being Jews:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And preach a fashion which it is not lawful for us to receive nor observe, being Romans.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the people ran together against them: and the magistrates, rending off their clothes, commanded them to be beaten with rods.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And when they had laid many stripes upon them, they cast them into prison, charging the gaoler to keep them diligently.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Who having received such a charge, thrust them into the inner prison and made their feet fast in the stocks.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And at midnight, Paul and Silas, praying, praised God. And they that were in prison heard them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And suddenly there was a great earthquake, so that the foundations of the prison were shaken. And immediately all the doors were opened and the bands of all were loosed.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the keeper of the prison, awakening out of his sleep and seeing the doors of the prison open, drawing his sword, would have killed himself, supposing that the prisoners had been fled.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But Paul cried with a loud voice, saying: Do thyself no harm, for we all are here.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then calling for a light, he went in: and trembling, fell down at the feet of Paul and Silas.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And bringing them out, he said: Masters, what must I do, that I may be saved?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But they said: believe in the Lord Jesus: and thou shalt be saved, and thy house.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they preached the word of the Lord to him and to all that were in his house.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he, taking them the same hour of the night, washed their stripes: and himself was baptized, and all his house immediately.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And when he had brought them into his own house, he laid the table for them: and rejoiced with all his house, believing God.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when the day was come, the magistrates sent the serjeants, saying: Let those men go.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And the keeper of the prison told these words to Paul: The magistrates have sent to let you go. Now therefore depart. And go in peace.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But Paul said to them: They have beaten us publicly, uncondemned, men that are Romans, and have cast us into prison. And now do they thrust us out privately? Not so: but let them come.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And let us out themselves. And the serjeants told these words to the magistrates. And they were afraid: hearing that they were Romans.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And coming, they besought them: and bringing them out, they desired them to depart out of the city.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And they went out of the prison and entered into the house of Lydia: and having seen the brethren, they comforted them and departed.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Pervenit autem Derben et Lystram. Et ecce discipulus quidam erat ibi nomine Timotheus, filius mulieris Judææ fidelis, patre gentili.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Huic testimonium bonum reddebant qui in Lystris erant et Iconio fratres.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hunc voluit Paulus secum proficisci : et assumens circumcidit eum propter Judæos qui erant in illis locis. Sciebant enim omnes quod pater ejus erat gentilis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cum autem pertransirent civitates, tradebant eis custodiri dogmata quæ erant decreta ab Apostolis et senioribus qui erant Jerosolymis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ecclesiæ quidem confirmabantur fide, et abundabunt numero quotidie.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Transeuntes autem Phrygiam et Galatiæ regionem, vetati sunt a Spiritu Sancto loqui verbum Dei in Asia.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cum venissent autem in Mysiam, tentabant ire in Bithyniam : et non permisit eos Spiritus Jesu.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cum autem pertransissent Mysiam, descenderunt Troadem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et visio per noctem Paulo ostensa est : vir Macedo quidam erat stans et deprecans eum, et dicens : Transiens in Macedoniam, adjuva nos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ut autem visum vidit, statim quæsivimus proficisci in Macedoniam, certi facti quod vocasset nos Deus evangelizare eis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Navigantes autem a Troade, recto cursu venimus Samothraciam, et sequenti die Neapolim :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et inde Philippos, quæ est prima partis Macedoniæ civitas, colonia. Eramus autem in hac urbe diebus aliquot, conferentes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Die autem sabbatorum egressi sumus foras portam juxta flumen, ubi videbatur oratio esse : et sedentes loquebamur mulieribus quæ convenerant.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et quædam mulier nomine Lydia, purpuraria civitatis Thyatirenorum, colens Deum, audivit : cujus Dominus aperuit cor intendere his quæ dicebantur a Paulo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cum autem baptizata esset, et domus ejus, deprecata est, dicens : Si judicastis me fidelem Domino esse, introite in domum meam, et manete. Et coëgit nos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Factum est autem euntibus nobis ad orationem, puellam quamdam habentem spiritum pythonem obviare nobis, quæ quæstum magnum præstabat dominis suis divinando.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hæc subsecuta Paulum et nos, clamabat dicens : Isti homines servi Dei excelsi sunt, qui annuntiant vobis viam salutis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hoc autem faciebat multis diebus. Dolens autem Paulus, et conversus, spiritui dixit : Præcipio tibi in nomine Jesu Christi exire ab ea. Et exiit eadem hora.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Videntes autem domini ejus quia exivit spes quæstus eorum, apprehendentes Paulum et Silam, perduxerunt in forum ad principes :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et offerentes eos magistratibus, dixerunt : Hi homines conturbant civitatem nostram, cum sint Judæi :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et annuntiant morem quem non licet nobis suscipere neque facere, cum simus Romani.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et cucurrit plebs adversus eos : et magistratus, scissis tunicis eorum, jusserunt eos virgis cædi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et cum multas plagas eis imposuissent, miserunt eos in carcerem, præcipientes custodi ut diligenter custodiret eos.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui cum tale præceptum accepisset, misit eos in interiorem carcerem, et pedes eorum strinxit ligno.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Media autem nocte Paulus et Silas orantes, laudabant Deum : et audiebant eos qui in custodia erant.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Subito vero terræmotus factus est magnus, ita ut moverentur fundamenta carceris. Et statim aperta sunt omnia ostia : et universorum vincula soluta sunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Expergefactus autem custos carceris, et videns januas apertas carceris, evaginato gladio volebat se interficere, æstimans fugisse vinctos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Clamavit autem Paulus voce magna, dicens : Nihil tibi mali feceris : universi enim hic sumus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Petitoque lumine, introgressus est : et tremefactus procidit Paulo et Silæ ad pedes :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et producens eos foras, ait : Domini, quid me oportet facere, ut salvus fiam ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>At illi dixerunt : Crede in Dominum Jesum, et salvus eris tu, et domus tua.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et locuti sunt ei verbum Domini cum omnibus qui erant in domo ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et tollens eos in illa hora noctis, lavit plagas eorum : et baptizatus est ipse, et omnis domus ejus continuo.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Cumque perduxisset eos in domum suam, apposuit eis mensam, et lætatus est cum omni domo sua credens Deo.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et cum dies factus esset, miserunt magistratus lictores, dicentes : Dimitte homines illos.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Nuntiavit autem custos carceris verba hæc Paulo : Quia miserunt magistratus ut dimittamini : nunc igitur exeuntes, ite in pace.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Paulus autem dixit eis : Cæsos nos publice, indemnatos homines Romanos, miserunt in carcerem : et nunc occulte nos ejiciunt ? Non ita : sed veniant,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et ipsi nos ejiciant. Nuntiaverunt autem magistratibus lictores verba hæc. Timueruntque audito quod Romani essent :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>et venientes deprecati sunt eos, et educentes rogabant ut egrederentur de urbe.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Exeuntes autem de carcere, introierunt ad Lydiam : et visis fratribus consolati sunt eos, et profecti sunt.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 a  as they passed through the cities, they delivered unto them the decrees for to keep, that were decreed by the apostles and ancients who were at Jerusalem.\"},{\"verse\":5,\"text\":\"And the churches were confirmed in faith and increased in number daily.\"},{\"verse\":6,\"text\":\"And when they had passed through Phrygia and the country of Galatia, they were forbidden by the Holy Ghost to preach the word in Asia.\"},{\"verse\":7,\"text\":\"And when they were come into Mysia, they attempted to go into Bithynia: and the Spirit of Jesus suffered them not.\"},{\"verse\":8,\"text\":\"And when they had passed through Mysia, they went down to Troas.\"},{\"verse\":9,\"text\":\"And a vision was shewed to Paul in the night, which was a man of Macedonia standing and beseeching him and saying: Pass over into Macedonia and help us.\"},{\"verse\":10,\"text\":\"And as soon as he had seen the vision, immediately we sought to go into Macedonia: being assured that God had called us to preach the gospel to them.\"},{\"verse\":11,\"text\":\"And sailing from Troas, we came with a straight course to Samothracia, and the day following to Neapolis.\"},{\"verse\":12,\"text\":\"And from thence to Philippi, which is the chief city of part of Macedonia, a colony. And we were in this city some days conferring together.\"},{\"verse\":13,\"text\":\"And upon the Sabbath day, we went forth without the gate by a river side, where it seemed that there was prayer: and sitting down, we spoke to the women that were assembled.\"},{\"verse\":14,\"text\":\"And a certain woman named Lydia, a seller of purple, of the city of Thyatira, one that worshipped God, did hear: whose heart the Lord opened to attend to those things which were said by Paul.\"},{\"verse\":15,\"text\":\"And when she was baptized, and her household, she besought us, saying: If you have judged me to be faithful to the Lord, come into my house and abide there. And she constrained us.\"},{\"verse\":16,\"text\":\"And it came to pass, as we went to prayer, a certain girl having a pythonical spirit met us, who brought to her masters much gain by divining.\"},{\"verse\":17,\"text\":\"This same following Paul and us, cried out, saying: These men are the servants of the Most High God, who preach unto you the way of salvation.\"},{\"verse\":18,\"text\":\"And this she did many days. But Paul being grieved, turned and said to the spirit: I command thee, in the name of Jesus Christ, to go out from her. And he went out the same hour.\"},{\"verse\":19,\"text\":\"But her masters, seeing that the hope of their gain was gone, apprehending Paul and Silas, brought them into the market place to the rulers.\"},{\"verse\":20,\"text\":\"And presenting them to the magistrates, they said: These men disturb our city, being Jews:\"},{\"verse\":21,\"text\":\"And preach a fashion which it is not lawful for us to receive nor observe, being Romans.\"},{\"verse\":22,\"text\":\"And the people ran together against them: and the magistrates, rending off their clothes, commanded them to be beaten with rods.\"},{\"verse\":23,\"text\":\"And when they had laid many stripes upon them, they cast them into prison, charging the gaoler to keep them diligently.\"},{\"verse\":24,\"text\":\"Who having received such a charge, thrust them into the inner prison and made their feet fast in the stocks.\"},{\"verse\":25,\"text\":\"And at midnight, Paul and Silas, praying, praised God. And they that were in prison heard them.\"},{\"verse\":26,\"text\":\"And suddenly there was a great earthquake, so that the foundations of the prison were shaken. And immediately all the doors were opened and the bands of all were loosed.\"},{\"verse\":27,\"text\":\"And the keeper of the prison, awakening out of his sleep and seeing the doors of the prison open, drawing his sword, would have killed himself, supposing that the prisoners had been fled.\"},{\"verse\":28,\"text\":\"But Paul cried with a loud voice, saying: Do thyself no harm, for we all are here.\"},{\"verse\":29,\"text\":\"Then calling for a light, he went in: and trembling, fell down at the feet of Paul and Silas.\"},{\"verse\":30,\"text\":\"And bringing them out, he said: Masters, what must I do, that I may be saved?\"},{\"verse\":31,\"text\":\"But they said: believe in the Lord Jesus: and thou shalt be saved, and thy house.\"},{\"verse\":32,\"text\":\"And they preached the word of the Lord to him and to all that were in his house.\"},{\"verse\":33,\"text\":\"And he, taking them the same hour of the night, washed their stripes: and himself was baptized, and all his house immediately.\"},{\"verse\":34,\"text\":\"And when he had brought them into his own house, he laid the table for them: and rejoiced with all his house, believing God.\"},{\"verse\":35,\"text\":\"And when the day was come, the magistrates sent the serjeants, saying: Let those men go.\"},{\"verse\":36,\"text\":\"And the keeper of the prison told these words to Paul: The magistrates have sent to let you go. Now therefore depart. And go in peace.\"},{\"verse\":37,\"text\":\"But Paul said to them: They have beaten us publicly, uncondemned, men that are Romans, and have cast us into prison. And now do they thrust us out privately? Not so: but let them come.\"},{\"verse\":38,\"text\":\"And let us out themselves. And the serjeants told these words to the magistrates. And they were afraid: hearing that they were Romans.\"},{\"verse\":39,\"text\":\"And coming, they besought them: and bringing them out, they desired them to depart out of the city.\"},{\"verse\":40,\"text\":\"And they went out of the prison and entered into the house of Lydia: and having seen the brethren, they comforted them and departed.\"}],\"vul\":[{\"verse\":1,\"text\":\"Pervenit autem Derben et Lystram. Et ecce discipulus quidam erat ibi nomine Timotheus, filius mulieris Judææ fidelis, patre gentili.\"},{\"verse\":2,\"text\":\"Huic testimonium bonum reddebant qui in Lystris erant et Iconio fratres.\"},{\"verse\":3,\"text\":\"Hunc voluit Paulus secum proficisci : et assumens circumcidit eum propter Judæos qui erant in illis locis. Sciebant enim omnes quod pater ejus erat gentilis.\"},{\"verse\":4,\"text\":\"Cum autem pertransirent civitates, tradebant eis custodiri dogmata quæ erant decreta ab Apostolis et senioribus qui erant Jerosolymis.\"},{\"verse\":5,\"text\":\"Et ecclesiæ quidem confirmabantur fide, et abundabunt numero quotidie.\"},{\"verse\":6,\"text\":\"Transeuntes autem Phrygiam et Galatiæ regionem, vetati sunt a Spiritu Sancto loqui verbum Dei in Asia.\"},{\"verse\":7,\"text\":\"Cum venissent autem in Mysiam, tentabant ire in Bithyniam : et non permisit eos Spiritus Jesu.\"},{\"verse\":8,\"text\":\"Cum autem pertransissent Mysiam, descenderunt Troadem :\"},{\"verse\":9,\"text\":\"et visio per noctem Paulo ostensa est : vir Macedo quidam erat stans et deprecans eum, et dicens : Transiens in Macedoniam, adjuva nos.\"},{\"verse\":10,\"text\":\"Ut autem visum vidit, statim quæsivimus proficisci in Macedoniam, certi facti quod vocasset nos Deus evangelizare eis.\"},{\"verse\":11,\"text\":\"Navigantes autem a Troade, recto cursu venimus Samothraciam, et sequenti die Neapolim :\"},{\"verse\":12,\"text\":\"et inde Philippos, quæ est prima partis Macedoniæ civitas, colonia. Eramus autem in hac urbe diebus aliquot, conferentes.\"},{\"verse\":13,\"text\":\"Die autem sabbatorum egressi sumus foras portam juxta flumen, ubi videbatur oratio esse : et sedentes loquebamur mulieribus quæ convenerant.\"},{\"verse\":14,\"text\":\"Et quædam mulier nomine Lydia, purpuraria civitatis Thyatirenorum, colens Deum, audivit : cujus Dominus aperuit cor intendere his quæ dicebantur a Paulo.\"},{\"verse\":15,\"text\":\"Cum autem baptizata esset, et domus ejus, deprecata est, dicens : Si judicastis me fidelem Domino esse, introite in domum meam, et manete. Et coëgit nos.\"},{\"verse\":16,\"text\":\"Factum est autem euntibus nobis ad orationem, puellam quamdam habentem spiritum pythonem obviare nobis, quæ quæstum magnum præstabat dominis suis divinando.\"},{\"verse\":17,\"text\":\"Hæc subsecuta Paulum et nos, clamabat dicens : Isti homines servi Dei excelsi sunt, qui annuntiant vobis viam salutis.\"},{\"verse\":18,\"text\":\"Hoc autem faciebat multis diebus. Dolens autem Paulus, et conversus, spiritui dixit : Præcipio tibi in nomine Jesu Christi exire ab ea. Et exiit eadem hora.\"},{\"verse\":19,\"text\":\"Videntes autem domini ejus quia exivit spes quæstus eorum, apprehendentes Paulum et Silam, perduxerunt in forum ad principes :\"},{\"verse\":20,\"text\":\"et offerentes eos magistratibus, dixerunt : Hi homines conturbant civitatem nostram, cum sint Judæi :\"},{\"verse\":21,\"text\":\"et annuntiant morem quem non licet nobis suscipere neque facere, cum simus Romani.\"},{\"verse\":22,\"text\":\"Et cucurrit plebs adversus eos : et magistratus, scissis tunicis eorum, jusserunt eos virgis cædi.\"},{\"verse\":23,\"text\":\"Et cum multas plagas eis imposuissent, miserunt eos in carcerem, præcipientes custodi ut diligenter custodiret eos.\"},{\"verse\":24,\"text\":\"Qui cum tale præceptum accepisset, misit eos in interiorem carcerem, et pedes eorum strinxit ligno.\"},{\"verse\":25,\"text\":\"Media autem nocte Paulus et Silas orantes, laudabant Deum : et audiebant eos qui in custodia erant.\"},{\"verse\":26,\"text\":\"Subito vero terræmotus factus est magnus, ita ut moverentur fundamenta carceris. Et statim aperta sunt omnia ostia : et universorum vincula soluta sunt.\"},{\"verse\":27,\"text\":\"Expergefactus autem custos carceris, et videns januas apertas carceris, evaginato gladio volebat se interficere, æstimans fugisse vinctos.\"},{\"verse\":28,\"text\":\"Clamavit autem Paulus voce magna, dicens : Nihil tibi mali feceris : universi enim hic sumus.\"},{\"verse\":29,\"text\":\"Petitoque lumine, introgressus est : et tremefactus procidit Paulo et Silæ ad pedes :\"},{\"verse\":30,\"text\":\"et producens eos foras, ait : Domini, quid me oportet facere, ut salvus fiam ?\"},{\"verse\":31,\"text\":\"At illi dixerunt : Crede in Dominum Jesum, et salvus eris tu, et domus tua.\"},{\"verse\":32,\"text\":\"Et locuti sunt ei verbum Domini cum omnibus qui erant in domo ejus.\"},{\"verse\":33,\"text\":\"Et tollens eos in illa hora noctis, lavit plagas eorum : et baptizatus est ipse, et omnis domus ejus continuo.\"},{\"verse\":34,\"text\":\"Cumque perduxisset eos in domum suam, apposuit eis mensam, et lætatus est cum omni domo sua credens Deo.\"},{\"verse\":35,\"text\":\"Et cum dies factus esset, miserunt magistratus lictores, dicentes : Dimitte homines illos.\"},{\"verse\":36,\"text\":\"Nuntiavit autem custos carceris verba hæc Paulo : Quia miserunt magistratus ut dimittamini : nunc igitur exeuntes, ite in pace.\"},{\"verse\":37,\"text\":\"Paulus autem dixit eis : Cæsos nos publice, indemnatos homines Romanos, miserunt in carcerem : et nunc occulte nos ejiciunt ? Non ita : sed veniant,\"},{\"verse\":38,\"text\":\"et ipsi nos ejiciant. Nuntiaverunt autem magistratibus lictores verba hæc. Timueruntque audito quod Romani essent :\"},{\"verse\":39,\"text\":\"et venientes deprecati sunt eos, et educentes rogabant ut egrederentur de urbe.\"},{\"verse\":40,\"text\":\"Exeuntes autem de carcere, introierunt ad Lydiam : et visis fratribus consolati sunt eos, et profecti sunt.\"}],\"summary\":\"Paul visits the churches. He is called to preach in Macedonia. He is scourged at Philippi.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":15,\"label\":\"Acts 15\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":17,\"label\":\"Acts 17\"}}]]\n"])</script></body></html>
