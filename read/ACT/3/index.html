5rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now Peter and John went up into the temple at the ninth hour of prayer.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And a certain man who was lame from his mother’s womb was carried: whom they laid every day at the gate of the temple, which is called Beautiful, that he might ask alms of them that went into the temple.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He, when he had seen Peter and John, about to go into the temple, asked to receive an alms.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But Peter with John, fastening his eyes upon him, said: Look upon us.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But he looked earnestly upon them, hoping that he should receive something of them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But Peter said: Silver and gold I have none; but what I have, I give thee. In the name of Jesus Christ of Nazareth, arise and walk.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And taking him by the right hand, he lifted him up: and forthwith his feet and soles received strength.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he leaping up, stood and walked and went in with them into the temple, walking and leaping and praising God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And all the people saw him walking and praising God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they knew him, that it was he who sat begging alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened to him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And as he held Peter and John, all the people ran to them, to the porch which is called Solomon’s, greatly wondering.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But Peter seeing, made answer to the people: Ye men of Israel, why wonder you at this? Or why look you upon us, as if by our strength or power we had made this man to walk?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The God of Abraham and the God of Isaac and the God of Jacob, the God of our fathers, hath glorified his Son Jesus, whom you indeed delivered up and denied before the face of Pilate, when he judged he should be released.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But you denied the Holy One and the Just: and desired a murderer to be granted unto you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But the author of life you killed, whom God hath raised from the dead: of which we are witnesses.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And in the faith of his name, this man, whom you have seen and known, hath his name strengthened. And the faith which is by him hath given this perfect soundness in the sight of you all.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And now, brethren, I know that you did it through ignorance: as did also your rulers.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But those things which God before had shewed by the mouth of all the prophets, that his Christ should suffer, he hath so fulfilled.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Be penitent, therefore, and be converted, that your sins may be blotted out.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>That when the times of refreshment shall come from the presence of the Lord, and he shall send him who hath been preached unto you, Jesus Christ.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Whom heaven indeed must receive, until the times of the restitution of all things, which God hath spoken by the mouth of his holy prophets, from the beginning of the world.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For Moses said: A prophet shall the Lord your God raise up unto you of your brethren, like unto me: him you shall hear according to all things whatsoever he shall speak to you.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And it shall be, that every soul which will not hear that prophet shall be destroyed from among the people.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And all the prophets, from Samuel and afterwards, who have spoken, have told of these days.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>You are the children of the prophets and of the testament which God made to our fathers, saying to Abraham: And in thy seed shall all the kindreds of the earth be blessed.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>To you first, God, raising up his Son, hath sent him to bless you: that every one may convert himself from his wickedness.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Petrus autem et Joannes ascendebant in templum ad horam orationis nonam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et quidam vir, qui erat claudus ex utero matris suæ, bajulabatur : quem ponebant quotidie ad portam templi, quæ dicitur Speciosa, ut peteret eleemosynam ab introëuntibus in templum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Is cum vidisset Petrum et Joannem incipientes introire in templum, rogabat ut eleemosynam acciperet.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Intuens autem in eum Petrus cum Joanne, dixit : Respice in nos.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>At ille intendebat in eos, sperans se aliquid accepturum ab eis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Petrus autem dixit : Argentum et aurum non est mihi : quod autem habeo, hoc tibi do : in nomine Jesu Christi Nazareni surge, et ambula.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et apprehensa manu ejus dextera, allevavit eum, et protinus consolidatæ sunt bases ejus et plantæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et exiliens stetit, et ambulabat : et intravit cum illis in templum ambulans, et exiliens, et laudans Deum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et vidit omnis populus eum ambulantem et laudantem Deum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cognoscebant autem illum, quod ipse erat qui ad eleemosynam sedebat ad Speciosam portam templi : et impleti sunt stupore et extasi in eo quod contigerat illi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cum teneret autem Petrum et Joannem, cucurrit omnis populus ad eos ad porticum quæ appellatur Salomonis, stupentes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Videns autem Petrus, respondit ad populum : Viri Israëlitæ, quid miramini in hoc, aut nos quid intuemini, quasi nostra virtute aut potestate fecerimus hunc ambulare ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Deus Abraham, et Deus Isaac, et Deus Jacob, Deus patrum nostrorum glorificavit filium suum Jesum, quem vos quidem tradidistis, et negastis ante faciem Pilati, judicante illo dimitti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Vos autem sanctum et justum negastis, et petistis virum homicidam donari vobis :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>auctorem vero vitæ interfecistis, quem Deus suscitavit a mortuis, cujus nos testes sumus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et in fide nominis ejus, hunc quem vos vidistis et nostis, confirmavit nomen ejus : et fides, quæ per eum est, dedit integram sanitatem istam in conspectu omnium vestrum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et nunc, fratres, scio quia per ignorantiam fecistis, sicut et principes vestri.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Deus autem, quæ prænuntiavit per os omnium prophetarum, pati Christum suum, sic implevit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Pœnitemini igitur et convertimini, ut deleantur peccata vestra :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ut cum venerint tempora refrigerii a conspectu Domini, et miserit eum qui prædicatus est vobis, Jesum Christum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quem oportet quidem cælum suscipere usque in tempora restitutionis omnium quæ locutus est Deus per os sanctorum suorum a sæculo prophetarum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Moyses quidem dixit : Quoniam prophetam suscitabit vobis Dominus Deus vester de fratribus vestris, tamquam me : ipsum audietis juxta omnia quæcumque locutus fuerit vobis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Erit autem : omnis anima quæ non audierit prophetam illum, exterminabitur de plebe.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et omnes prophetæ, a Samuel et deinceps, qui locuti sunt, annuntiaverunt dies istos.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Vos estis filii prophetarum, et testamenti quod disposuit Deus ad patres nostros, dicens ad Abraham : Et in semine tuo benedicentur omnes familiæ terræ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vobis primum Deus suscitans filium suum, misit eum benedicentem vobis : ut convertat se unusquisque a nequitia sua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Acts 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/c "But he looked earnestly upon them, hoping that he should receive something of them.\"},{\"verse\":6,\"text\":\"But Peter said: Silver and gold I have none; but what I have, I give thee. In the name of Jesus Christ of Nazareth, arise and walk.\"},{\"verse\":7,\"text\":\"And taking him by the right hand, he lifted him up: and forthwith his feet and soles received strength.\"},{\"verse\":8,\"text\":\"And he leaping up, stood and walked and went in with them into the temple, walking and leaping and praising God.\"},{\"verse\":9,\"text\":\"And all the people saw him walking and praising God.\"},{\"verse\":10,\"text\":\"And they knew him, that it was he who sat begging alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened to him.\"},{\"verse\":11,\"text\":\"And as he held Peter and John, all the people ran to them, to the porch which is called Solomon’s, greatly wondering.\"},{\"verse\":12,\"text\":\"But Peter seeing, made answer to the people: Ye men of Israel, why wonder you at this? Or why look you upon us, as if by our strength or power we had made this man to walk?\"},{\"verse\":13,\"text\":\"The God of Abraham and the God of Isaac and the God of Jacob, the God of our fathers, hath glorified his Son Jesus, whom you indeed delivered up and denied before the face of Pilate, when he judged he should be released.\"},{\"verse\":14,\"text\":\"But you denied the Holy One and the Just: and desired a murderer to be granted unto you.\"},{\"verse\":15,\"text\":\"But the author of life you killed, whom God hath raised from the dead: of which we are witnesses.\"},{\"verse\":16,\"text\":\"And in the faith of his name, this man, whom you have seen and known, hath his name strengthened. And the faith which is by him hath given this perfect soundness in the sight of you all.\"},{\"verse\":17,\"text\":\"And now, brethren, I know that you did it through ignorance: as did also your rulers.\"},{\"verse\":18,\"text\":\"But those things which God before had shewed by the mouth of all the prophets, that his Christ should suffer, he hath so fulfilled.\"},{\"verse\":19,\"text\":\"Be penitent, therefore, and be converted, that your sins may be blotted out.\"},{\"verse\":20,\"text\":\"That when the times of refreshment shall come from the presence of the Lord, and he shall send him who hath been preached unto you, Jesus Christ.\"},{\"verse\":21,\"text\":\"Whom heaven indeed must receive, until the times of the restitution of all things, which God hath spoken by the mouth of his holy prophets, from the beginning of the world.\"},{\"verse\":22,\"text\":\"For Moses said: A prophet shall the Lord your God raise up unto you of your brethren, like unto me: him you shall hear according to all things whatsoever he shall speak to you.\"},{\"verse\":23,\"text\":\"And it shall be, that every soul which will not hear that prophet shall be destroyed from among the people.\"},{\"verse\":24,\"text\":\"And all the prophets, from Samuel and afterwards, who have spoken, have told of these days.\"},{\"verse\":25,\"text\":\"You are the children of the prophets and of the testament which God made to our fathers, saying to Abraham: And in thy seed shall all the kindreds of the earth be blessed.\"},{\"verse\":26,\"text\":\"To you first, God, raising up his Son, hath sent him to bless you: that every one may convert himself from his wickedness.\"}],\"vul\":[{\"verse\":1,\"text\":\"Petrus autem et Joannes ascendebant in templum ad horam orationis nonam.\"},{\"verse\":2,\"text\":\"Et quidam vir, qui erat claudus ex utero matris suæ, bajulabatur : quem ponebant quotidie ad portam templi, quæ dicitur Speciosa, ut peteret eleemosynam ab introëuntibus in templum.\"},{\"verse\":3,\"text\":\"Is cum vidisset Petrum et Joannem incipientes introire in templum, rogabat ut eleemosynam acciperet.\"},{\"verse\":4,\"text\":\"Intuens autem in eum Petrus cum Joanne, dixit : Respice in nos.\"},{\"verse\":5,\"text\":\"At ille intendebat in eos, sperans se aliquid accepturum ab eis.\"},{\"verse\":6,\"text\":\"Petrus autem dixit : Argentum et aurum non est mihi : quod autem habeo, hoc tibi do : in nomine Jesu Christi Nazareni surge, et ambula.\"},{\"verse\":7,\"text\":\"Et apprehensa manu ejus dextera, allevavit eum, et protinus consolidatæ sunt bases ejus et plantæ.\"},{\"verse\":8,\"text\":\"Et exiliens stetit, et ambulabat : et intravit cum illis in templum ambulans, et exiliens, et laudans Deum.\"},{\"verse\":9,\"text\":\"Et vidit omnis populus eum ambulantem et laudantem Deum.\"},{\"verse\":10,\"text\":\"Cognoscebant autem illum, quod ipse erat qui ad eleemosynam sedebat ad Speciosam portam templi : et impleti sunt stupore et extasi in eo quod contigerat illi.\"},{\"verse\":11,\"text\":\"Cum teneret autem Petrum et Joannem, cucurrit omnis populus ad eos ad porticum quæ appellatur Salomonis, stupentes.\"},{\"verse\":12,\"text\":\"Videns autem Petrus, respondit ad populum : Viri Israëlitæ, quid miramini in hoc, aut nos quid intuemini, quasi nostra virtute aut potestate fecerimus hunc ambulare ?\"},{\"verse\":13,\"text\":\"Deus Abraham, et Deus Isaac, et Deus Jacob, Deus patrum nostrorum glorificavit filium suum Jesum, quem vos quidem tradidistis, et negastis ante faciem Pilati, judicante illo dimitti.\"},{\"verse\":14,\"text\":\"Vos autem sanctum et justum negastis, et petistis virum homicidam donari vobis :\"},{\"verse\":15,\"text\":\"auctorem vero vitæ interfecistis, quem Deus suscitavit a mortuis, cujus nos testes sumus.\"},{\"verse\":16,\"text\":\"Et in fide nominis ejus, hunc quem vos vidistis et nostis, confirmavit nomen ejus : et fides, quæ per eum est, dedit integram sanitatem istam in conspectu omnium vestrum.\"},{\"verse\":17,\"text\":\"Et nunc, fratres, scio quia per ignorantiam fecistis, sicut et principes vestri.\"},{\"verse\":18,\"text\":\"Deus autem, quæ prænuntiavit per os omnium prophetarum, pati Christum suum, sic implevit.\"},{\"verse\":19,\"text\":\"Pœnitemini igitur et convertimini, ut deleantur peccata vestra :\"},{\"verse\":20,\"text\":\"ut cum venerint tempora refrigerii a conspectu Domini, et miserit eum qui prædicatus est vobis, Jesum Christum,\"},{\"verse\":21,\"text\":\"quem oportet quidem cælum suscipere usque in tempora restitutionis omnium quæ locutus est Deus per os sanctorum suorum a sæculo prophetarum.\"},{\"verse\":22,\"text\":\"Moyses quidem dixit : Quoniam prophetam suscitabit vobis Dominus Deus vester de fratribus vestris, tamquam me : ipsum audietis juxta omnia quæcumque locutus fuerit vobis.\"},{\"verse\":23,\"text\":\"Erit autem : omnis anima quæ non audierit prophetam illum, exterminabitur de plebe.\"},{\"verse\":24,\"text\":\"Et omnes prophetæ, a Samuel et deinceps, qui locuti sunt, annuntiaverunt dies istos.\"},{\"verse\":25,\"text\":\"Vos estis filii prophetarum, et testamenti quod disposuit Deus ad patres nostros, dicens ad Abraham : Et in semine tuo benedicentur omnes familiæ terræ.\"},{\"verse\":26,\"text\":\"Vobis primum Deus suscitans filium suum, misit eum benedicentem vobis : ut convertat se unusquisque a nequitia sua.\"}],\"summary\":\"The miracle upon the lame man, followed by the conversion of many.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":2,\"label\":\"Acts 2\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":4,\"label\":\"Acts 4\"}}]]\n"])</script></body></html>
