lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Acts<!-- --> <span class="text-stone-500">19</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ACT/">About <!-- -->Acts</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Paul establishes the church at Ephesus. The tumult of the silversmiths.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass, while Apollo was at Corinth, that Paul, having passed through the upper coasts, came to Ephesus and found certain disciples.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he said to them: Have you received the Holy Ghost since ye believed? But they said to him: We have not so much as heard whether there be a Holy Ghost.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said: In what then were you baptized? Who said: In John’s baptism.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then Paul said: John baptized the people with the baptism of penance saying: That they should believe in him, who was to come after him, that is to say, in Jesus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Having heard these things, they were baptized in the name of the Lord Jesus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when Paul had imposed his hands on them, the Holy Ghost came upon them: and they spoke with tongues and prophesied.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And all the men were about twelve.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And entering into the synagogue, he spoke boldly for the space of three months, disputing and exhorting concerning the kingdom of God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But when some were hardened and believed not, speaking evil of the way of the Lord before the multitude, departing from them, he separated the disciples, disputing daily in the school of one Tyrannus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And this continued for the space of two years, so that all who dwelt in Asia heard the word of the Lord, both Jews and Gentiles.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And God wrought by the hand of Paul more than common miracles.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>So that even there were brought from his body to the sick, handkerchiefs and aprons: and the diseases departed from them: and the wicked spirits went out of them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Now some also of the Jewish exorcists, who went about, attempted to invoke over them that had evil spirits the name of the Lord Jesus, saying: I conjure you by Jesus, whom Paul preacheth.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And there were certain men, seven sons of Sceva, a Jew, a chief priest, that did this.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But the wicked spirit, answering, said to them: Jesus I know: and Paul I know. But who are you?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the man in whom the wicked spirit was, leaping upon them and mastering them both, prevailed against them, so that they fled out of that house naked and wounded.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And this became known to all the Jews and the Gentiles that dwelt a Ephesus. And fear fell on them all: and the name of the Lord Jesus was magnified.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And many of them that believed came, confessing and declaring their deeds.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And many of them who had followed curious arts brought together their books and burnt them before all. And, counting the price of them, they found the money to be fifty thousand pieces of silver.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>So mightily grew the word of God and was confirmed.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when these things were ended, Paul purposed in the spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying: After I have been there, I must see Rome also.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And sending into Macedonia two of them that ministered to him, Timothy and Erastus, he himself remained for a time in Asia.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Now at that time there arose no small disturbance about the way of the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For a certain man named Demetrius, a silversmith, who made silver temples for Diana, brought no small gain to the craftsmen.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Whom he calling together with the workmen of like occupation, said: Sirs, you know that our gain is by this trade.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And you see and hear that this Paul, by persuasion hath drawn away a great multitude, not only of Ephesus, but almost of all Asia, saying: they are not gods which are made by hands.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>So that not only this our craft is in danger to be set at nought, but also the temple of great Diana shall be reputed for nothing! Yea, and her majesty shall begin to be destroyed, whom all Asia and the world worshippeth.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Having heard these things, they were full of anger and cried out, saying: Great is Diana of the Ephesians!</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the whole city was filled with confusion. And having caught Gaius and Aristarchus, men of Macedonia, Paul’s companions, they rushed with one accord into the theatre.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And when Paul would have entered in unto the people, the disciples suffered him not.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And some also of the rulers of Asia, who were his friends, sent unto him, desiring that he would not venture himself into the theatre.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Now some cried one thing, some another. For the assembly was confused: and the greater part knew not for what cause they were come together.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they drew forth Alexander out of the multitude, the Jews thrusting him forward. And Alexander, beckoning with his hand for silence, would have given the people satisfaction,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But as soon as they perceived him to be a Jew, all with one voice, for the space of about two, hours, cried out: Great is Diana of the Ephesians!</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when the town clerk had appeased the multitudes, he said: Ye men of Ephesus, what man is there that knoweth not that the city of the Ephesians is a worshipper of the great Diana and of Jupiter’s offspring?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For as much therefore as these things cannot be contradicted, you ought to be quiet and to do nothing rashly.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>For you have brought hither these men, who are neither guilty of sacrilege nor of blasphemy against your goddess.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But if Demetrius and the craftsmen that are with him have a matter against any man, the courts of justice are open: and there are proconsuls. Let them accuse one another.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And if you inquire after any other matter, it may be decided in a lawful assembly.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>For we are even in danger to be called in question for this day’s uproar, there being no man guilty (of whom we may give account) of this concourse. And when he had said these things, he dismissed the assembly.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem cum Apollo esset Corinthi, ut Paulus peragratis superioribus partibus veniret Ephesum, et inveniret quosdam discipulos :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>dixitque ad eos : Si Spiritum Sanctum accepistis credentes ? At illi dixerunt ad eum : Sed neque si Spiritus Sanctus est, audivimus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ille vero ait : In quo ergo baptizati estis ? Qui dixerunt : In Joannis baptismate.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixit autem Paulus : Joannes baptizavit baptismo pœnitentiæ populum, dicens in eum qui venturus esset post ipsum ut crederent, hoc est, in Jesum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>His auditis, baptizati sunt in nomine Domini Jesu.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et cum imposuisset illis manus Paulus, venit Spiritus Sanctus super eos, et loquebantur linguis, et prophetabant.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Erant autem omnes viri fere duodecim.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Introgressus autem synagogam, cum fiducia loquebatur per tres menses, disputans et suadens de regno Dei.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cum autem quidam indurarentur, et non crederent, maledicentes viam Domini coram multitudine, discedens ab eis, segregavit discipulos, quotidie disputans in schola tyranni cujusdam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hoc autem factum est per biennium, ita ut omnes qui habitabant in Asia audirent verbum Domini, Judæi atque gentiles.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Virtutesque non quaslibet faciebat Deus per manum Pauli,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ita ut etiam super languidos deferrentur a corpore ejus sudaria et semicinctia, et recedebant ab eis languores, et spiritus nequam egrediebantur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tentaverunt autem quidam et de circumeuntibus Judæis exorcistis invocare super eos qui habebant spiritus malos nomen Domini Jesu, dicentes : Adjuro vos per Jesum, quem Paulus prædicat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Erant autem quidam Judæi, Scevæ principis sacerdotum septem filii, qui hoc faciebant.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Respondens autem spiritus nequam dixit eis : Jesum novi, et Paulum scio : vos autem qui estis ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et insiliens in eos homo, in quo erat dæmonium pessimum, et dominatus amborum, invaluit contra eos, ita ut nudi et vulnerati effugerent de domo illa.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hoc autem notum factum est omnibus Judæis, atque gentilibus qui habitabant Ephesi : et cecidit timor super omnes illos, et magnificabatur nomen Domini Jesu.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Multique credentium veniebant, confitentes et annuntiantes actus suos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Multi autem ex eis, qui fuerant curiosa sectati, contulerunt libros, et combusserunt coram omnibus : et computatis pretiis illorum, invenerunt pecuniam denariorum quinquaginta millium.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ita fortiter crescebat verbum Dei, et confirmabatur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>His autem expletis, proposuit Paulus in Spiritu, transita Macedonia et Achaia, ire Jerosolymam, dicens : Quoniam postquam fuero ibi, oportet me et Romam videre.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Mittens autem in Macedoniam duos ex ministrantibus sibi, Timotheum et Erastum, ipse remansit ad tempus in Asia.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Facta est autem illo tempore turbatio non minima de via Domini.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Demetrius enim quidam nomine, argentarius, faciens ædes argenteas Dianæ, præstabat artificibus non modicum quæstum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>quos convocans, et eos qui hujusmodi erant opifices, dixit : Viri, scitis quia de hoc artificio est nobis acquisitio :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et videtis et auditis quia non solum Ephesi, sed pene totius Asiæ, Paulus hic suadens avertit multam turbam, dicens : Quoniam non sunt dii, qui manibus fiunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Non solum autem hæc periclitabitur nobis pars in redargutionem venire, sed et magnæ Dianæ templum in nihilum reputabitur, sed et destrui incipiet majestas ejus, quam tota Asia et orbis colit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>His auditis, repleti sunt ira, et exclamaverunt dicentes : Magna Diana Ephesiorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et impleta est civitas confusione, et impetum fecerunt uno animo in theatrum, rapto Gajo et Aristarcho Macedonibus, comitibus Pauli.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Paulo autem volente intrare in populum, non permiserunt discipuli.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Quidam autem et de Asiæ principibus, qui erant amici ejus, miserunt ad eum rogantes ne se daret in theatrum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>alii autem aliud clamabant. Erat enim ecclesia confusa : et plures nesciebant qua ex causa convenissent.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>De turba autem detraxerunt Alexandrum, propellentibus eum Judæis. Alexander autem manu silentio postulato, volebat reddere rationem populo.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quem ut cognoverunt Judæum esse, vox facta una est omnium, quasi per horas duas clamantium : Magna Diana Ephesiorum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et cum sedasset scriba turbas, dixit : Viri Ephesii, quis enim est hominum, qui nesciat Ephesiorum civitatem cultricem esse magnæ Dianæ, Jovisque prolis ?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Cum ergo his contradici non possit, oportet vos sedatos esse, et nihil temere agere.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Adduxistis enim homines istos, neque sacrilegos, neque blasphemantes deam vestram.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Quod si Demetrius et qui cum eo sunt artifices, habent adversus aliquem causam, conventus forenses aguntur, et proconsules sunt : accusent invicem.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Si quid autem alterius rei quæritis, in legitima ecclesia poterit absolvi.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Nam et periclitamur argui seditionis hodiernæ, cum nullus obnoxius sit de quo possimus reddere rationem concursus istius. Et cum hæc dixisset, dimisit ecclesiam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ACT/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-l  passed through the upper coasts, came to Ephesus and found certain disciples.\"},{\"verse\":2,\"text\":\"And he said to them: Have you received the Holy Ghost since ye believed? But they said to him: We have not so much as heard whether there be a Holy Ghost.\"},{\"verse\":3,\"text\":\"And he said: In what then were you baptized? Who said: In John’s baptism.\"},{\"verse\":4,\"text\":\"Then Paul said: John baptized the people with the baptism of penance saying: That they should believe in him, who was to come after him, that is to say, in Jesus.\"},{\"verse\":5,\"text\":\"Having heard these things, they were baptized in the name of the Lord Jesus.\"},{\"verse\":6,\"text\":\"And when Paul had imposed his hands on them, the Holy Ghost came upon them: and they spoke with tongues and prophesied.\"},{\"verse\":7,\"text\":\"And all the men were about twelve.\"},{\"verse\":8,\"text\":\"And entering into the synagogue, he spoke boldly for the space of three months, disputing and exhorting concerning the kingdom of God.\"},{\"verse\":9,\"text\":\"But when some were hardened and believed not, speaking evil of the way of the Lord before the multitude, departing from them, he separated the disciples, disputing daily in the school of one Tyrannus.\"},{\"verse\":10,\"text\":\"And this continued for the space of two years, so that all who dwelt in Asia heard the word of the Lord, both Jews and Gentiles.\"},{\"verse\":11,\"text\":\"And God wrought by the hand of Paul more than common miracles.\"},{\"verse\":12,\"text\":\"So that even there were brought from his body to the sick, handkerchiefs and aprons: and the diseases departed from them: and the wicked spirits went out of them.\"},{\"verse\":13,\"text\":\"Now some also of the Jewish exorcists, who went about, attempted to invoke over them that had evil spirits the name of the Lord Jesus, saying: I conjure you by Jesus, whom Paul preacheth.\"},{\"verse\":14,\"text\":\"And there were certain men, seven sons of Sceva, a Jew, a chief priest, that did this.\"},{\"verse\":15,\"text\":\"But the wicked spirit, answering, said to them: Jesus I know: and Paul I know. But who are you?\"},{\"verse\":16,\"text\":\"And the man in whom the wicked spirit was, leaping upon them and mastering them both, prevailed against them, so that they fled out of that house naked and wounded.\"},{\"verse\":17,\"text\":\"And this became known to all the Jews and the Gentiles that dwelt a Ephesus. And fear fell on them all: and the name of the Lord Jesus was magnified.\"},{\"verse\":18,\"text\":\"And many of them that believed came, confessing and declaring their deeds.\"},{\"verse\":19,\"text\":\"And many of them who had followed curious arts brought together their books and burnt them before all. And, counting the price of them, they found the money to be fifty thousand pieces of silver.\"},{\"verse\":20,\"text\":\"So mightily grew the word of God and was confirmed.\"},{\"verse\":21,\"text\":\"And when these things were ended, Paul purposed in the spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying: After I have been there, I must see Rome also.\"},{\"verse\":22,\"text\":\"And sending into Macedonia two of them that ministered to him, Timothy and Erastus, he himself remained for a time in Asia.\"},{\"verse\":23,\"text\":\"Now at that time there arose no small disturbance about the way of the Lord.\"},{\"verse\":24,\"text\":\"For a certain man named Demetrius, a silversmith, who made silver temples for Diana, brought no small gain to the craftsmen.\"},{\"verse\":25,\"text\":\"Whom he calling together with the workmen of like occupation, said: Sirs, you know that our gain is by this trade.\"},{\"verse\":26,\"text\":\"And you see and hear that this Paul, by persuasion hath drawn away a great multitude, not only of Ephesus, but almost of all Asia, saying: they are not gods which are made by hands.\"},{\"verse\":27,\"text\":\"So that not only this our craft is in danger to be set at nought, but also the temple of great Diana shall be reputed for nothing! Yea, and her majesty shall begin to be destroyed, whom all Asia and the world worshippeth.\"},{\"verse\":28,\"text\":\"Having heard these things, they were full of anger and cried out, saying: Great is Diana of the Ephesians!\"},{\"verse\":29,\"text\":\"And the whole city was filled with confusion. And having caught Gaius and Aristarchus, men of Macedonia, Paul’s companions, they rushed with one accord into the theatre.\"},{\"verse\":30,\"text\":\"And when Paul would have entered in unto the people, the disciples suffered him not.\"},{\"verse\":31,\"text\":\"And some also of the rulers of Asia, who were his friends, sent unto him, desiring that he would not venture himself into the theatre.\"},{\"verse\":32,\"text\":\"Now some cried one thing, some another. For the assembly was confused: and the greater part knew not for what cause they were come together.\"},{\"verse\":33,\"text\":\"And they drew forth Alexander out of the multitude, the Jews thrusting him forward. And Alexander, beckoning with his hand for silence, would have given the people satisfaction,\"},{\"verse\":34,\"text\":\"But as soon as they perceived him to be a Jew, all with one voice, for the space of about two, hours, cried out: Great is Diana of the Ephesians!\"},{\"verse\":35,\"text\":\"And when the town clerk had appeased the multitudes, he said: Ye men of Ephesus, what man is there that knoweth not that the city of the Ephesians is a worshipper of the great Diana and of Jupiter’s offspring?\"},{\"verse\":36,\"text\":\"For as much therefore as these things cannot be contradicted, you ought to be quiet and to do nothing rashly.\"},{\"verse\":37,\"text\":\"For you have brought hither these men, who are neither guilty of sacrilege nor of blasphemy against your goddess.\"},{\"verse\":38,\"text\":\"But if Demetrius and the craftsmen that are with him have a matter against any man, the courts of justice are open: and there are proconsuls. Let them accuse one another.\"},{\"verse\":39,\"text\":\"And if you inquire after any other matter, it may be decided in a lawful assembly.\"},{\"verse\":40,\"text\":\"For we are even in danger to be called in question for this day’s uproar, there being no man guilty (of whom we may give account) of this concourse. And when he had said these things, he dismissed the assembly.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem cum Apollo esset Corinthi, ut Paulus peragratis superioribus partibus veniret Ephesum, et inveniret quosdam discipulos :\"},{\"verse\":2,\"text\":\"dixitque ad eos : Si Spiritum Sanctum accepistis credentes ? At illi dixerunt ad eum : Sed neque si Spiritus Sanctus est, audivimus.\"},{\"verse\":3,\"text\":\"Ille vero ait : In quo ergo baptizati estis ? Qui dixerunt : In Joannis baptismate.\"},{\"verse\":4,\"text\":\"Dixit autem Paulus : Joannes baptizavit baptismo pœnitentiæ populum, dicens in eum qui venturus esset post ipsum ut crederent, hoc est, in Jesum.\"},{\"verse\":5,\"text\":\"His auditis, baptizati sunt in nomine Domini Jesu.\"},{\"verse\":6,\"text\":\"Et cum imposuisset illis manus Paulus, venit Spiritus Sanctus super eos, et loquebantur linguis, et prophetabant.\"},{\"verse\":7,\"text\":\"Erant autem omnes viri fere duodecim.\"},{\"verse\":8,\"text\":\"Introgressus autem synagogam, cum fiducia loquebatur per tres menses, disputans et suadens de regno Dei.\"},{\"verse\":9,\"text\":\"Cum autem quidam indurarentur, et non crederent, maledicentes viam Domini coram multitudine, discedens ab eis, segregavit discipulos, quotidie disputans in schola tyranni cujusdam.\"},{\"verse\":10,\"text\":\"Hoc autem factum est per biennium, ita ut omnes qui habitabant in Asia audirent verbum Domini, Judæi atque gentiles.\"},{\"verse\":11,\"text\":\"Virtutesque non quaslibet faciebat Deus per manum Pauli,\"},{\"verse\":12,\"text\":\"ita ut etiam super languidos deferrentur a corpore ejus sudaria et semicinctia, et recedebant ab eis languores, et spiritus nequam egrediebantur.\"},{\"verse\":13,\"text\":\"Tentaverunt autem quidam et de circumeuntibus Judæis exorcistis invocare super eos qui habebant spiritus malos nomen Domini Jesu, dicentes : Adjuro vos per Jesum, quem Paulus prædicat.\"},{\"verse\":14,\"text\":\"Erant autem quidam Judæi, Scevæ principis sacerdotum septem filii, qui hoc faciebant.\"},{\"verse\":15,\"text\":\"Respondens autem spiritus nequam dixit eis : Jesum novi, et Paulum scio : vos autem qui estis ?\"},{\"verse\":16,\"text\":\"Et insiliens in eos homo, in quo erat dæmonium pessimum, et dominatus amborum, invaluit contra eos, ita ut nudi et vulnerati effugerent de domo illa.\"},{\"verse\":17,\"text\":\"Hoc autem notum factum est omnibus Judæis, atque gentilibus qui habitabant Ephesi : et cecidit timor super omnes illos, et magnificabatur nomen Domini Jesu.\"},{\"verse\":18,\"text\":\"Multique credentium veniebant, confitentes et annuntiantes actus suos.\"},{\"verse\":19,\"text\":\"Multi autem ex eis, qui fuerant curiosa sectati, contulerunt libros, et combusserunt coram omnibus : et computatis pretiis illorum, invenerunt pecuniam denariorum quinquaginta millium.\"},{\"verse\":20,\"text\":\"Ita fortiter crescebat verbum Dei, et confirmabatur.\"},{\"verse\":21,\"text\":\"His autem expletis, proposuit Paulus in Spiritu, transita Macedonia et Achaia, ire Jerosolymam, dicens : Quoniam postquam fuero ibi, oportet me et Romam videre.\"},{\"verse\":22,\"text\":\"Mittens autem in Macedoniam duos ex ministrantibus sibi, Timotheum et Erastum, ipse remansit ad tempus in Asia.\"},{\"verse\":23,\"text\":\"Facta est autem illo tempore turbatio non minima de via Domini.\"},{\"verse\":24,\"text\":\"Demetrius enim quidam nomine, argentarius, faciens ædes argenteas Dianæ, præstabat artificibus non modicum quæstum :\"},{\"verse\":25,\"text\":\"quos convocans, et eos qui hujusmodi erant opifices, dixit : Viri, scitis quia de hoc artificio est nobis acquisitio :\"},{\"verse\":26,\"text\":\"et videtis et auditis quia non solum Ephesi, sed pene totius Asiæ, Paulus hic suadens avertit multam turbam, dicens : Quoniam non sunt dii, qui manibus fiunt.\"},{\"verse\":27,\"text\":\"Non solum autem hæc periclitabitur nobis pars in redargutionem venire, sed et magnæ Dianæ templum in nihilum reputabitur, sed et destrui incipiet majestas ejus, quam tota Asia et orbis colit.\"},{\"verse\":28,\"text\":\"His auditis, repleti sunt ira, et exclamaverunt dicentes : Magna Diana Ephesiorum.\"},{\"verse\":29,\"text\":\"Et impleta est civitas confusione, et impetum fecerunt uno animo in theatrum, rapto Gajo et Aristarcho Macedonibus, comitibus Pauli.\"},{\"verse\":30,\"text\":\"Paulo autem volente intrare in populum, non permiserunt discipuli.\"},{\"verse\":31,\"text\":\"Quidam autem et de Asiæ principibus, qui erant amici ejus, miserunt ad eum rogantes ne se daret in theatrum :\"},{\"verse\":32,\"text\":\"alii autem aliud clamabant. Erat enim ecclesia confusa : et plures nesciebant qua ex causa convenissent.\"},{\"verse\":33,\"text\":\"De turba autem detraxerunt Alexandrum, propellentibus eum Judæis. Alexander autem manu silentio postulato, volebat reddere rationem populo.\"},{\"verse\":34,\"text\":\"Quem ut cognoverunt Judæum esse, vox facta una est omnium, quasi per horas duas clamantium : Magna Diana Ephesiorum.\"},{\"verse\":35,\"text\":\"Et cum sedasset scriba turbas, dixit : Viri Ephesii, quis enim est hominum, qui nesciat Ephesiorum civitatem cultricem esse magnæ Dianæ, Jovisque prolis ?\"},{\"verse\":36,\"text\":\"Cum ergo his contradici non possit, oportet vos sedatos esse, et nihil temere agere.\"},{\"verse\":37,\"text\":\"Adduxistis enim homines istos, neque sacrilegos, neque blasphemantes deam vestram.\"},{\"verse\":38,\"text\":\"Quod si Demetrius et qui cum eo sunt artifices, habent adversus aliquem causam, conventus forenses aguntur, et proconsules sunt : accusent invicem.\"},{\"verse\":39,\"text\":\"Si quid autem alterius rei quæritis, in legitima ecclesia poterit absolvi.\"},{\"verse\":40,\"text\":\"Nam et periclitamur argui seditionis hodiernæ, cum nullus obnoxius sit de quo possimus reddere rationem concursus istius. Et cum hæc dixisset, dimisit ecclesiam.\"}],\"summary\":\"Paul establishes the church at Ephesus. The tumult of the silversmiths.\",\"intro\":null,\"prev\":{\"usfm\":\"ACT\",\"chapter\":18,\"label\":\"Acts 18\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":20,\"label\":\"Acts 20\"}}]]\n"])</script></body></html>
