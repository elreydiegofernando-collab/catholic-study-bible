[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judges<!-- --> <span class="text-stone-500">17</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDG/">About <!-- -->Judges</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The history of the idol of Michas, and the young Levite.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>There was at that time a man of mount Ephraim, whose name was Michas.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who said to his mother: The eleven hundred pieces of silver, which thou hadst put aside for thyself, and concerning which thou didst swear in my hearing, behold I have, and they are with me. And she said to him. Blessed be my son by the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>So he restored them to his mother, who said to him: I have consecrated and vowed this silver to the Lord, that my son may receive it at my hand, and make a graven and a molten god; so now I deliver it to thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he restored them to his mother: and she took two hundred pieces of silver and gave them to the silversmith, to make of them a graven and a molten god, which was in the house of Michas.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he separated also therein a little temple for the god, and made an ephod, and theraphim, that is to say, a priestly garment, and idols: and he filled the hand of one of his sons, and he became his priest.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In those days there was no king in Israel, but every one did that which seemed right to himself.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>There was also another young man of Bethlehem Juda, of the kindred thereof: and he was a Levite, and dwelt there.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Now he went out from the city of Bethlehem, and desired to sojourn wheresoever he should find it convenient for him. And when he was come to mount Ephraim, as he was on his journey, and had turned aside a little into the house of Michas,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He was asked by him whence he came. And he answered: I am a Levite of Bethlehem Juda, and I am going to dwell where I can, and where I shall find a place to my advantage.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Michas said: Stay with me, and be unto me a father and a priest, and I will give thee every year ten pieces of silver, and a double suit of apparel, and thy victuals.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He was content, and abode with the man, and was unto him as one of his sons.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Michas filled his hand, and had the young man with him for his priest, saying:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Now I know God will do me good, since I have a priest of the race of the Levites.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fuit eo tempore vir quidam de monte Ephraim nomine Michas,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>qui dixit matri suæ : Mille et centum argenteos, quos separaveras tibi, et super quibus me audiente juraveras, ecce ego habeo, et apud me sunt. Cui illa respondit : Benedictus filius meus Domino.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Reddidit ergo eos matri suæ, quæ dixerat ei : Consecravi et vovi hoc argentum Domino, ut de manu mea suscipiat filius meus, et faciat sculptile atque conflatile : et nunc trado illud tibi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Reddidit igitur eos matri suæ : quæ tulit ducentos argenteos, et dedit eos argentario, ut faceret ex eis sculptile atque conflatile, quod fuit in domo Michæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui ædiculam quoque in ea deo separavit, et fecit ephod, et theraphim, id est, vestem sacerdotalem, et idola : implevitque unius filiorum suorum manum, et factus est ei sacerdos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In diebus illis non erat rex in Israël, sed unusquisque quod sibi rectum videbatur, hoc faciebat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fuit quoque alter adolescens de Bethlehem Juda, ex cognatione ejus : eratque ipse Levites, et habitabat ibi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Egressusque de civitate Bethlehem, peregrinari voluit ubicumque sibi commodum reperisset. Cumque venisset in montem Ephraim, iter faciens, et declinasset parumper in domum Michæ,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>interrogatus est ab eo unde venisset. Qui respondit : Levita sum de Bethlehem Juda, et vado ut habitem ubi potuero, et utile mihi esse perspexero.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixitque Michas : Mane apud me, et esto mihi parens ac sacerdos : daboque tibi per annos singulos decem argenteos, ac vestem duplicem, et quæ ad victum sunt necessaria.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Acquievit, et mansit apud hominem, fuitque illi quasi unus de filiis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Implevitque Michas manum ejus, et habuit puerum sacerdotem apud se :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc scio, dicens, quod benefaciet mihi Deus habenti Levitici generis sacerdotem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judges 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judges 18</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->17<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judges 16" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" hr e/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDG.17\",{\"bookId\":7,\"usfm\":\"JDG\",\"bookName\":\"Judges\",\"drName\":\"Judges\",\"chapter\":17,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"There was at that time a man of mount Ephraim, whose name was Michas.\"},{\"verse\":2,\"text\":\"Who said to his mother: The eleven hundred pieces of silver, which thou hadst put aside for thyself, and concerning which thou didst swear in my hearing, behold I have, and they are with me. And she said to him. Blessed be my son by the Lord.\"},{\"verse\":3,\"text\":\"So he restored them to his mother, who said to him: I have consecrated and vowed this silver to the Lord, that my son may receive it at my hand, and make a graven and a molten god; so now I deliver it to thee.\"},{\"verse\":4,\"text\":\"And he restored them to his mother: and she took two hundred pieces of silver and gave them to the silversmith, to make of them a graven and a molten god, which was in the house of Michas.\"},{\"verse\":5,\"text\":\"And he separated also therein a little temple for the god, and made an ephod, and theraphim, that is to say, a priestly garment, and idols: and he filled the hand of one of his sons, and he became his priest.\"},{\"verse\":6,\"text\":\"In those days there was no king in Israel, but every one did that which seemed right to himself.\"},{\"verse\":7,\"text\":\"There was also another young man of Bethlehem Juda, of the kindred thereof: and he was a Levite, and dwelt there.\"},{\"verse\":8,\"text\":\"Now he went out from the city of Bethlehem, and desired to sojourn wheresoever he should find it convenient for him. And when he was come to mount Ephraim, as he was on his journey, and had turned aside a little into the house of Michas,\"},{\"verse\":9,\"text\":\"He was asked by him whence he came. And he answered: I am a Levite of Bethlehem Juda, and I am going to dwell where I can, and where I shall find a place to my advantage.\"},{\"verse\":10,\"text\":\"And Michas said: Stay with me, and be unto me a father and a priest, and I will give thee every year ten pieces of silver, and a double suit of apparel, and thy victuals.\"},{\"verse\":11,\"text\":\"He was content, and abode with the man, and was unto him as one of his sons.\"},{\"verse\":12,\"text\":\"And Michas filled his hand, and had the young man with him for his priest, saying:\"},{\"verse\":13,\"text\":\"Now I know God will do me good, since I have a priest of the race of the Levites.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fuit eo tempore vir quidam de monte Ephraim nomine Michas,\"},{\"verse\":2,\"text\":\"qui dixit matri suæ : Mille et centum argenteos, quos separaveras tibi, et super quibus me audiente juraveras, ecce ego habeo, et apud me sunt. Cui illa respondit : Benedictus filius meus Domino.\"},{\"verse\":3,\"text\":\"Reddidit ergo eos matri suæ, quæ dixerat ei : Consecravi et vovi hoc argentum Domino, ut de manu mea suscipiat filius meus, et faciat sculptile atque conflatile : et nunc trado illud tibi.\"},{\"verse\":4,\"text\":\"Reddidit igitur eos matri suæ : quæ tulit ducentos argenteos, et dedit eos argentario, ut faceret ex eis sculptile atque conflatile, quod fuit in domo Michæ.\"},{\"verse\":5,\"text\":\"Qui ædiculam quoque in ea deo separavit, et fecit ephod, et theraphim, id est, vestem sacerdotalem, et idola : implevitque unius filiorum suorum manum, et factus est ei sacerdos.\"},{\"verse\":6,\"text\":\"In diebus illis non erat rex in Israël, sed unusquisque quod sibi rectum videbatur, hoc faciebat.\"},{\"verse\":7,\"text\":\"Fuit quoque alter adolescens de Bethlehem Juda, ex cognatione ejus : eratque ipse Levites, et habitabat ibi.\"},{\"verse\":8,\"text\":\"Egressusque de civitate Bethlehem, peregrinari voluit ubicumque sibi commodum reperisset. Cumque venisset in montem Ephraim, iter faciens, et declinasset parumper in domum Michæ,\"},{\"verse\":9,\"text\":\"interrogatus est ab eo unde venisset. Qui respondit : Levita sum de Bethlehem Juda, et vado ut habitem ubi potuero, et utile mihi esse perspexero.\"},{\"verse\":10,\"text\":\"Dixitque Michas : Mane apud me, et esto mihi parens ac sacerdos : daboque tibi per annos singulos decem argenteos, ac vestem duplicem, et quæ ad victum sunt necessaria.\"},{\"verse\":11,\"text\":\"Acquievit, et mansit apud hominem, fuitque illi quasi unus de filiis.\"},{\"verse\":12,\"text\":\"Implevitque Michas manum ejus, et habuit puerum sacerdotem apud se :\"},{\"verse\":13,\"text\":\"Nunc scio, dicens, quod benefaciet mihi Deus habenti Levitici generis sacerdotem.\"}],\"summary\":\"The history of the idol of Michas, and the young Levite.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":16,\"label\":\"Judges 16\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":18,\"label\":\"Judges 18\"}}]]\n"])</script></body></html>
