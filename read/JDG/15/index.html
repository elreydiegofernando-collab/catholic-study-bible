20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judges<!-- --> <span class="text-stone-500">15</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Samson is denied his wife. He burns the corn of the Philistines, and kills many of them.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And a while after, when the days of the wheat harvest were at hand, Samson came, meaning to visit his wife, and he brought her a kid of the flock. And when he would have gone into her chamber, as usual, her father would not suffer him, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I thought thou hadst hated her, and therefore I gave her to thy friend: but she hath a sister, who is younger and fairer than she, take her to wife instead of her.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Samson answered him: From this day I shall be blameless in what I do against the Philistines: for I will do you evils.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he went and caught three hundred foxes, and coupled them tail to tail, and fastened torches between the tails:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And setting them on fire he let the foxes go, that they might run about hither and thither. And they presently went into the standing corn of the Philistines. Which being set on fire, both the corn that was already carried together, and that which was yet standing, was all burnt, insomuch that the flame consumed also the vineyards and the oliveyards.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then the Philistines said: Who hath done this thing? And it was answered: Samson, the son in law of the Thamnathite, because he took away his wife, and gave her to another, hath done these things. And the Philistines went up and burnt both the woman and her father.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But Samson said to them: Although you have done this, yet will I be revenged of you, and then I will be quiet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he made a great slaughter of them, so that in astonishment they laid the calf of the leg upon the thigh. And going down he dwelt in a cavern of the rock Etam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then the Philistines going up into the land of Juda, camped in the place which afterwards was called Lechi, that is, the Jawbone, where their army was spread abroad.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the men of the tribe of Juda said to them: Why are you come up against us? They answered: We are come to bind Samson, and to pay him for what he hath done against us.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Wherefore three thousand men of Juda went down to the cave of the rock Etam, and said to Samson: Knowest thou not that the Philistines rule over us? Why wouldst thou do thus? And he said to them: As they did to me, so have I done to them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they said to him: We are come to bind thee, and to deliver thee into the hands of the Philistines. And Samson said to them: Swear to me, and promise me that you will not kill me.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They said: We will not kill thee: but we will deliver thee up bound. And they bound him with two new cords, and brought him from the rock Etam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now when he was come to the place of the Jawbone, and the Philistines shouting went to meet him, the Spirit of the Lord came strongly upon him: and as flax is wont to be consumed at the approach of fire, so the bands with which he was bound were broken and loosed.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And finding a jawbone, even the jawbone of an ass, which lay there, catching it up, he slew therewith a thousand men.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he said: With the jawbone of an ass, with the jaw of the colt of asses, I have destroyed them, and have slain a thousand men.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when he had ended these words, singing, he threw the jawbone out of his hand, and called the name of that place Ramathlechi, which is interpreted the lifting up of the jawbone.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And being very thirsty, he cried to the Lord, and said: Thou hast given this very great deliverance and victory into the hand of thy servant: and behold I die for thirst, and shall fall into the hands of the uncircumcised.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Then the Lord opened a great tooth in the jaw of the ass and waters issued out of it. And when he had drunk them, he refreshed his spirit, and recovered his strength. Therefore the name of that place was called The Spring of him that invoked from the jawbone, until this present day.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he judged Israel, in the days of the Philistines, twenty years.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post aliquantulum autem temporis, cum dies triticeæ messis instarent, venit Samson, invisere volens uxorem suam, et attulit ei hædum de capris. Cumque cubiculum ejus solito vellet intrare, prohibuit eum pater illius, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Putavi quod odisses eam, et ideo tradidi illam amico tuo : sed habet sororem, quæ junior et pulchrior illa est : sit tibi pro ea uxor.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cui Samson respondit : Ab hac die non erit culpa in me contra Philisthæos : faciam enim vobis mala.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Perrexitque et cepit trecentas vulpes, caudasque earum junxit ad caudas, et faces ligavit in medio :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quas igne succendens, dimisit ut huc illucque discurrerent. Quæ statim perrexerunt in segetes Philisthinorum. Quibus succensis, et comportatæ jam fruges, et adhuc stantes in stipula, concrematæ sunt, in tantum ut vineas quoque et oliveta flamma consumeret.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixeruntque Philisthiim : Quis fecit hanc rem ? Quibus dictum est : Samson gener Thamnathæi : quia tulit uxorem ejus, et alteri tradidit, hæc operatus est. Ascenderuntque Philisthiim, et combusserunt tam mulierem quam patrem ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quibus ait Samson : Licet hæc feceritis, tamen adhuc ex vobis expetam ultionem, et tunc quiescam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Percussitque eos ingenti plaga, ita ut stupentes suram femori imponerent. Et descendens habitavit in spelunca petræ Etam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Igitur ascendentes Philisthiim in terram Juda, castrametati sunt in loco, qui postea vocatus est Lechi, id est, Maxilla, ubi eorum effusus est exercitus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixeruntque ad eos de tribu Juda : Cur ascendistis adversum nos ? Qui responderunt : Ut ligemus Samson venimus, et reddamus ei quæ in nos operatus est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Descenderunt ergo tria millia virorum de Juda ad specum silicis Etam, dixeruntque ad Samson : Nescis quod Philisthiim imperent nobis ? quare hoc facere voluisti ? Quibus ille ait : Sicut fecerunt mihi, sic feci eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ligare, inquiunt, te venimus, et tradere in manus Philisthinorum. Quibus Samson : Jurate, ait, et spondete mihi quod non occidatis me.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixerunt : Non te occidemus, sed vinctum trademus. Ligaveruntque eum duobus novis funibus, et tulerunt eum de petra Etam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui cum venisset ad locum Maxillæ, et Philisthiim vociferantes occurrissent ei, irruit spiritus Domini in eum : et sicut solent ad odorem ignis lina consumi, ita vincula, quibus ligatus erat, dissipata sunt et soluta.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Inventamque maxillam, id est, mandibulam asini, quæ jacebat, arripiens interfecit in ea mille viros,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et ait : In maxilla asini, in mandibula pulli asinarum, delevi eos, et percussi mille viros.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cumque hæc verba canens complesset, projecit mandibulam de manu, et vocavit nomen loci illius Ramathlechi, quod interpretatur, Elevatio maxillæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sitiensque valde, clamavit ad Dominum, et ait : Tu dedisti in manu servi tui salutem hanc maximam atque victoriam : en siti morior, incidamque in manus incircumcisorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Aperuit itaque Dominus molarem dentem in maxilla asini, et egressæ sunt ex eo aquæ. Quibus haustis, refocillavit spiritum, et vires recepit. Idcirco appellatum est nomen loci illius, Fons invocantis de maxilla, usque in præsentem diem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Judicavitque Israël in diebus Philisthiim viginti annis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judges 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/16/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judges 16</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->15<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judges 14" class="inline-fl /png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JDG.15\",{\"bookId\":7,\"usfm\":\"JDG\",\"bookName\":\"Judges\",\"drName\":\"Judges\",\"chapter\":15,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"And a while after, when the days of the wheat harvest were at hand, Samson came, meaning to visit his wife, and he brought her a kid of the flock. And when he would have gone into her chamber, as usual, her father would not suffer him, saying:\"},{\"verse\":2,\"text\":\"I thought thou hadst hated her, and therefore I gave her to thy friend: but she hath a sister, who is younger and fairer than she, take her to wife instead of her.\"},{\"verse\":3,\"text\":\"And Samson answered him: From this day I shall be blameless in what I do against the Philistines: for I will do you evils.\"},{\"verse\":4,\"text\":\"And he went and caught three hundred foxes, and coupled them tail to tail, and fastened torches between the tails:\"},{\"verse\":5,\"text\":\"And setting them on fire he let the foxes go, that they might run about hither and thither. And they presently went into the standing corn of the Philistines. Which being set on fire, both the corn that was already carried together, and that which was yet standing, was all burnt, insomuch that the flame consumed also the vineyards and the oliveyards.\"},{\"verse\":6,\"text\":\"Then the Philistines said: Who hath done this thing? And it was answered: Samson, the son in law of the Thamnathite, because he took away his wife, and gave her to another, hath done these things. And the Philistines went up and burnt both the woman and her father.\"},{\"verse\":7,\"text\":\"But Samson said to them: Although you have done this, yet will I be revenged of you, and then I will be quiet.\"},{\"verse\":8,\"text\":\"And he made a great slaughter of them, so that in astonishment they laid the calf of the leg upon the thigh. And going down he dwelt in a cavern of the rock Etam.\"},{\"verse\":9,\"text\":\"Then the Philistines going up into the land of Juda, camped in the place which afterwards was called Lechi, that is, the Jawbone, where their army was spread abroad.\"},{\"verse\":10,\"text\":\"And the men of the tribe of Juda said to them: Why are you come up against us? They answered: We are come to bind Samson, and to pay him for what he hath done against us.\"},{\"verse\":11,\"text\":\"Wherefore three thousand men of Juda went down to the cave of the rock Etam, and said to Samson: Knowest thou not that the Philistines rule over us? Why wouldst thou do thus? And he said to them: As they did to me, so have I done to them.\"},{\"verse\":12,\"text\":\"And they said to him: We are come to bind thee, and to deliver thee into the hands of the Philistines. And Samson said to them: Swear to me, and promise me that you will not kill me.\"},{\"verse\":13,\"text\":\"They said: We will not kill thee: but we will deliver thee up bound. And they bound him with two new cords, and brought him from the rock Etam.\"},{\"verse\":14,\"text\":\"Now when he was come to the place of the Jawbone, and the Philistines shouting went to meet him, the Spirit of the Lord came strongly upon him: and as flax is wont to be consumed at the approach of fire, so the bands with which he was bound were broken and loosed.\"},{\"verse\":15,\"text\":\"And finding a jawbone, even the jawbone of an ass, which lay there, catching it up, he slew therewith a thousand men.\"},{\"verse\":16,\"text\":\"And he said: With the jawbone of an ass, with the jaw of the colt of asses, I have destroyed them, and have slain a thousand men.\"},{\"verse\":17,\"text\":\"And when he had ended these words, singing, he threw the jawbone out of his hand, and called the name of that place Ramathlechi, which is interpreted the lifting up of the jawbone.\"},{\"verse\":18,\"text\":\"And being very thirsty, he cried to the Lord, and said: Thou hast given this very great deliverance and victory into the hand of thy servant: and behold I die for thirst, and shall fall into the hands of the uncircumcised.\"},{\"verse\":19,\"text\":\"Then the Lord opened a great tooth in the jaw of the ass and waters issued out of it. And when he had drunk them, he refreshed his spirit, and recovered his strength. Therefore the name of that place was called The Spring of him that invoked from the jawbone, until this present day.\"},{\"verse\":20,\"text\":\"And he judged Israel, in the days of the Philistines, twenty years.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post aliquantulum autem temporis, cum dies triticeæ messis instarent, venit Samson, invisere volens uxorem suam, et attulit ei hædum de capris. Cumque cubiculum ejus solito vellet intrare, prohibuit eum pater illius, dicens :\"},{\"verse\":2,\"text\":\"Putavi quod odisses eam, et ideo tradidi illam amico tuo : sed habet sororem, quæ junior et pulchrior illa est : sit tibi pro ea uxor.\"},{\"verse\":3,\"text\":\"Cui Samson respondit : Ab hac die non erit culpa in me contra Philisthæos : faciam enim vobis mala.\"},{\"verse\":4,\"text\":\"Perrexitque et cepit trecentas vulpes, caudasque earum junxit ad caudas, et faces ligavit in medio :\"},{\"verse\":5,\"text\":\"quas igne succendens, dimisit ut huc illucque discurrerent. Quæ statim perrexerunt in segetes Philisthinorum. Quibus succensis, et comportatæ jam fruges, et adhuc stantes in stipula, concrematæ sunt, in tantum ut vineas quoque et oliveta flamma consumeret.\"},{\"verse\":6,\"text\":\"Dixeruntque Philisthiim : Quis fecit hanc rem ? Quibus dictum est : Samson gener Thamnathæi : quia tulit uxorem ejus, et alteri tradidit, hæc operatus est. Ascenderuntque Philisthiim, et combusserunt tam mulierem quam patrem ejus.\"},{\"verse\":7,\"text\":\"Quibus ait Samson : Licet hæc feceritis, tamen adhuc ex vobis expetam ultionem, et tunc quiescam.\"},{\"verse\":8,\"text\":\"Percussitque eos ingenti plaga, ita ut stupentes suram femori imponerent. Et descendens habitavit in spelunca petræ Etam.\"},{\"verse\":9,\"text\":\"Igitur ascendentes Philisthiim in terram Juda, castrametati sunt in loco, qui postea vocatus est Lechi, id est, Maxilla, ubi eorum effusus est exercitus.\"},{\"verse\":10,\"text\":\"Dixeruntque ad eos de tribu Juda : Cur ascendistis adversum nos ? Qui responderunt : Ut ligemus Samson venimus, et reddamus ei quæ in nos operatus est.\"},{\"verse\":11,\"text\":\"Descenderunt ergo tria millia virorum de Juda ad specum silicis Etam, dixeruntque ad Samson : Nescis quod Philisthiim imperent nobis ? quare hoc facere voluisti ? Quibus ille ait : Sicut fecerunt mihi, sic feci eis.\"},{\"verse\":12,\"text\":\"Ligare, inquiunt, te venimus, et tradere in manus Philisthinorum. Quibus Samson : Jurate, ait, et spondete mihi quod non occidatis me.\"},{\"verse\":13,\"text\":\"Dixerunt : Non te occidemus, sed vinctum trademus. Ligaveruntque eum duobus novis funibus, et tulerunt eum de petra Etam.\"},{\"verse\":14,\"text\":\"Qui cum venisset ad locum Maxillæ, et Philisthiim vociferantes occurrissent ei, irruit spiritus Domini in eum : et sicut solent ad odorem ignis lina consumi, ita vincula, quibus ligatus erat, dissipata sunt et soluta.\"},{\"verse\":15,\"text\":\"Inventamque maxillam, id est, mandibulam asini, quæ jacebat, arripiens interfecit in ea mille viros,\"},{\"verse\":16,\"text\":\"et ait : In maxilla asini, in mandibula pulli asinarum, delevi eos, et percussi mille viros.\"},{\"verse\":17,\"text\":\"Cumque hæc verba canens complesset, projecit mandibulam de manu, et vocavit nomen loci illius Ramathlechi, quod interpretatur, Elevatio maxillæ.\"},{\"verse\":18,\"text\":\"Sitiensque valde, clamavit ad Dominum, et ait : Tu dedisti in manu servi tui salutem hanc maximam atque victoriam : en siti morior, incidamque in manus incircumcisorum.\"},{\"verse\":19,\"text\":\"Aperuit itaque Dominus molarem dentem in maxilla asini, et egressæ sunt ex eo aquæ. Quibus haustis, refocillavit spiritum, et vires recepit. Idcirco appellatum est nomen loci illius, Fons invocantis de maxilla, usque in præsentem diem.\"},{\"verse\":20,\"text\":\"Judicavitque Israël in diebus Philisthiim viginti annis.\"}],\"summary\":\"Samson is denied his wife. He burns the corn of the Philistines, and kills many of them.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":14,\"label\":\"Judges 14\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":16,\"label\":\"Judges 16\"}}]]\n"])</script></body></html>
