1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judges<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDG/">About <!-- -->Judges</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Debbora and Barac deliver Israel from Jabin and Sisara, Jahal killeth Sisara.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the children of Israel again did evil in the sight of the Lord after the death of Aod:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Lord delivered them up into the hands of Jabin, king of Chanaan, who reigned in Asor: and he had a general of his army named Sisara, and he dwelt in Haroseth of the Gentiles.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the children of Israel cried to the Lord: for he had nine hundred chariots set with scythes and for twenty years had grievously oppressed them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And there was at that time Debbora, a prophetess, the wife of Lapidoth, who judged the people.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And she sat under a palm tree, which was called by her name, between Rama and Bethel, in Mount Ephraim: and the children of Israel came up to her for all judgment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And she sent and called Barac, the Son of Abinoem, out of Cedes, in Nephthali: and she said to him: The Lord God of Israel hath commanded thee: Go, and lead an army to Mount Thabor, and thou shalt take with thee ten thousand fighting men of the children of Nephthali, and of the children of Zabulon:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I will bring unto thee in the place of the torrent Cison, Sisara, the general of Jabin’s army, and his chariots, and all his multitude, and will deliver them into thy hand.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Barac said to her: If thou wilt come with me, I will go: if thou wilt not come with me, I will not go.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>She said to him: I will go, indeed, with thee, but at this time the victory shall not be attributed to thee, because Sisara shall be delivered into the hand of a woman. Debbora therefore arose, and went with Barac to Cedes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he called unto him Zabulon and Nephthali, and went up with ten thousand fighting men, having Debbora in his company.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now Haber, the Cinite, had some time before departed from the rest of the Cinites, his brethren, the sons of Hobab, the kinsman of Moses: and had pitched his tents unto the valley, which is called Sennim, and was near Cedes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And it was told Sisara, that Barac, the son of Abinoem, was gone up to Mount Thabor:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he gathered together his nine hundred chariots armed with scythes, and all his army, from Haroseth of the Gentiles, to the torrent Cison.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Debbora said to Barac: Arise, for this is the day wherein the Lord hath delivered Sisara into thy hands: behold, he is thy leader. And Barac went down from Mount Thabor, and ten thousand fighting men with him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the Lord struck a terror into Sisara, and all his chariots, and all his multitude, with the edge of the sword, at the sight of Barac; insomuch, that Sisara leaping down from off his chariot, fled away on foot,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Barac pursued after the fleeing chariots, and the army, unto Haroseth of the Gentiles; and all the multitude of the enemies was utterly destroyed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But Sisara fleeing, came to the tent of Jahel, the wife of Haber, the Cinite, for there was peace between Jabin, the king of Asor, and the house of Haber, the Cinite.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Jahel went forth to meet Sisara, and said to him: Come in to me, my lord; come in, fear not. He went into her tent, and being covered by her with a cloak,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Said to her: Give me, I beseech thee, a little water, for I am very thirsty. She opened a bottle of milk, and gave him to drink, and covered him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Sisara said to her: Stand before the door of the tent, and when any shall come and inquire of thee, saying: Is there any man here? thou shalt say: There is none.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>So Jahel, Haber’s wife, took a nail of the tent, and taking also a hammer: and going in softly, and with silence, she put the nail upon the temples of his head, and striking it with the hammer, drove it through his brain fast into the ground: and so passing from deep sleep to death, he fainted away and died.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And behold, Barac came pursuing after Sisara: and Jahel went out to meet him, and said to him: Come, and I will shew thee the man whom thou seekest. And when he came into her tent, he saw Sisara lying dead, and the nail fastened in his temples.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>So God that day humbled Jabin, the king of Chanaan, before the children of Israel:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Who grew daily stronger, and with a mighty hand overpowered Jabin, king of Chanaan, till they quite destroyed him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Addideruntque filii Israël facere malum in conspectu Domini post mortem Aod,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et tradidit illos Dominus in manus Jabin regis Chanaan, qui regnavit in Asor : habuitque ducem exercitus sui nomine Sisaram, ipse autem habitabat in Haroseth gentium.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Clamaveruntque filii Israël ad Dominum : nongentos enim habebat falcatos currus, et per viginti annos vehementer oppresserat eos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erat autem Debbora prophetis uxor Lapidoth, quæ judicabat populum in illo tempore.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et sedebat sub palma, quæ nomine illius vocabatur, inter Rama et Bethel in monte Ephraim : ascendebantque ad eam filii Israël in omne judicium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quæ misit et vocavit Barac filium Abinoëm de Cedes Nephthali : dixitque ad eum : Præcepit tibi Dominus Deus Israël : Vade, et duc exercitum in montem Thabor, tollesque tecum decem millia pugnatorum de filiis Nephthali, et de filiis Zabulon :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ego autem adducam ad te in loco torrentis Cison, Sisaram principem exercitus Jabin, et currus ejus, atque omnem multitudinem, et tradam eos in manu tua.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixitque ad eam Barac : Si venis mecum, vadam : si nolueris venire mecum, non pergam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quæ dixit ad eum : Ibo quidem tecum, sed in hac vice victoria non reputabitur tibi, quia in manu mulieris tradetur Sisara. Surrexit itaque Debbora, et perrexit cum Barac in Cedes.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui, accitis Zabulon et Nephthali, ascendit cum decem millibus pugnatorum, habens Debboram in comitatu suo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Haber autem Cinæus recesserat quondam a ceteris Cinæis fratribus suis, filiis Hobab cognati Moysi : et tetenderat tabernacula usque ad vallem, quæ vocatur Sennim, et erat juxta Cedes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nuntiatumque est Sisaræ quod ascendisset Barac filius Abinoëm in montem Thabor :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et congregavit nongentos falcatos currus, et omnem exercitum de Haroseth gentium ad torrentem Cison.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dixitque Debbora ad Barac : Surge, hæc est enim dies, in qua tradidit Dominus Sisaram in manus tuas : en ipse ductor est tuus. Descendit itaque Barac de monte Thabor, et decem millia pugnatorum cum eo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Perterruitque Dominus Sisaram, et omnes currus ejus, universamque multitudinem in ore gladii ad conspectum Barac : in tantum, ut Sisara de curru desiliens, pedibus fugeret,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et Barac persequeretur fugientes currus, et exercitum usque ad Haroseth gentium, et omnis hostium multitudo usque ad internecionem caderet.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sisara autem fugiens pervenit ad tentorium Jahel uxoris Haber Cinæi. Erat enim pax inter Jabin regem Asor, et domum Haber Cinæi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Egressa igitur Jahel in occursum Sisaræ, dixit ad eum : Intra ad me, domine mi : intra, ne timeas. Qui ingressus tabernaculum ejus, et opertus ab ea pallio,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>dixit ad eam : Da mihi, obsecro, paululum aquæ, quia sitio valde. Quæ aperuit utrem lactis, et dedit ei bibere, et operuit illum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dixitque Sisara ad eam : Sta ante ostium tabernaculi : et cum venerit aliquis interrogans te, et dicens : Numquid hic est aliquis ? respondebis : Nullus est.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tulit itaque Jahel uxor Haber clavum tabernaculi, assumens pariter et malleum : et ingressa abscondite et cum silentio, posuit supra tempus capitis ejus clavum, percussumque malleo defixit in cerebrum usque ad terram : qui soporem morti consocians defecit, et mortuus est.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et ecce Barac sequens Sisaram veniebat : egressaque Jahel in occursum ejus, dixit ei : Veni, et ostendam tibi virum quem quæris. Qui cum intrasset ad eam, vidit Sisaram jacentem mortuum, et clavum infixum in tempore ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Humiliavit ergo Deus in die illo Jabin regem Chanaan coram filiis Israël :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>qui crescebant quotidie, et forti manu opprimebant Jabin regem Chanaan, donec delerent eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judges 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judges 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judges 3" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/3/"><svg viewBox="0 0 2 next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDG.4\",{\"bookId\":7,\"usfm\":\"JDG\",\"bookName\":\"Judges\",\"drName\":\"Judges\",\"chapter\":4,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"And the children of Israel again did evil in the sight of the Lord after the death of Aod:\"},{\"verse\":2,\"text\":\"And the Lord delivered them up into the hands of Jabin, king of Chanaan, who reigned in Asor: and he had a general of his army named Sisara, and he dwelt in Haroseth of the Gentiles.\"},{\"verse\":3,\"text\":\"And the children of Israel cried to the Lord: for he had nine hundred chariots set with scythes and for twenty years had grievously oppressed them.\"},{\"verse\":4,\"text\":\"And there was at that time Debbora, a prophetess, the wife of Lapidoth, who judged the people.\"},{\"verse\":5,\"text\":\"And she sat under a palm tree, which was called by her name, between Rama and Bethel, in Mount Ephraim: and the children of Israel came up to her for all judgment.\"},{\"verse\":6,\"text\":\"And she sent and called Barac, the Son of Abinoem, out of Cedes, in Nephthali: and she said to him: The Lord God of Israel hath commanded thee: Go, and lead an army to Mount Thabor, and thou shalt take with thee ten thousand fighting men of the children of Nephthali, and of the children of Zabulon:\"},{\"verse\":7,\"text\":\"And I will bring unto thee in the place of the torrent Cison, Sisara, the general of Jabin’s army, and his chariots, and all his multitude, and will deliver them into thy hand.\"},{\"verse\":8,\"text\":\"And Barac said to her: If thou wilt come with me, I will go: if thou wilt not come with me, I will not go.\"},{\"verse\":9,\"text\":\"She said to him: I will go, indeed, with thee, but at this time the victory shall not be attributed to thee, because Sisara shall be delivered into the hand of a woman. Debbora therefore arose, and went with Barac to Cedes.\"},{\"verse\":10,\"text\":\"And he called unto him Zabulon and Nephthali, and went up with ten thousand fighting men, having Debbora in his company.\"},{\"verse\":11,\"text\":\"Now Haber, the Cinite, had some time before departed from the rest of the Cinites, his brethren, the sons of Hobab, the kinsman of Moses: and had pitched his tents unto the valley, which is called Sennim, and was near Cedes.\"},{\"verse\":12,\"text\":\"And it was told Sisara, that Barac, the son of Abinoem, was gone up to Mount Thabor:\"},{\"verse\":13,\"text\":\"And he gathered together his nine hundred chariots armed with scythes, and all his army, from Haroseth of the Gentiles, to the torrent Cison.\"},{\"verse\":14,\"text\":\"And Debbora said to Barac: Arise, for this is the day wherein the Lord hath delivered Sisara into thy hands: behold, he is thy leader. And Barac went down from Mount Thabor, and ten thousand fighting men with him.\"},{\"verse\":15,\"text\":\"And the Lord struck a terror into Sisara, and all his chariots, and all his multitude, with the edge of the sword, at the sight of Barac; insomuch, that Sisara leaping down from off his chariot, fled away on foot,\"},{\"verse\":16,\"text\":\"And Barac pursued after the fleeing chariots, and the army, unto Haroseth of the Gentiles; and all the multitude of the enemies was utterly destroyed.\"},{\"verse\":17,\"text\":\"But Sisara fleeing, came to the tent of Jahel, the wife of Haber, the Cinite, for there was peace between Jabin, the king of Asor, and the house of Haber, the Cinite.\"},{\"verse\":18,\"text\":\"And Jahel went forth to meet Sisara, and said to him: Come in to me, my lord; come in, fear not. He went into her tent, and being covered by her with a cloak,\"},{\"verse\":19,\"text\":\"Said to her: Give me, I beseech thee, a little water, for I am very thirsty. She opened a bottle of milk, and gave him to drink, and covered him.\"},{\"verse\":20,\"text\":\"And Sisara said to her: Stand before the door of the tent, and when any shall come and inquire of thee, saying: Is there any man here? thou shalt say: There is none.\"},{\"verse\":21,\"text\":\"So Jahel, Haber’s wife, took a nail of the tent, and taking also a hammer: and going in softly, and with silence, she put the nail upon the temples of his head, and striking it with the hammer, drove it through his brain fast into the ground: and so passing from deep sleep to death, he fainted away and died.\"},{\"verse\":22,\"text\":\"And behold, Barac came pursuing after Sisara: and Jahel went out to meet him, and said to him: Come, and I will shew thee the man whom thou seekest. And when he came into her tent, he saw Sisara lying dead, and the nail fastened in his temples.\"},{\"verse\":23,\"text\":\"So God that day humbled Jabin, the king of Chanaan, before the children of Israel:\"},{\"verse\":24,\"text\":\"Who grew daily stronger, and with a mighty hand overpowered Jabin, king of Chanaan, till they quite destroyed him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Addideruntque filii Israël facere malum in conspectu Domini post mortem Aod,\"},{\"verse\":2,\"text\":\"et tradidit illos Dominus in manus Jabin regis Chanaan, qui regnavit in Asor : habuitque ducem exercitus sui nomine Sisaram, ipse autem habitabat in Haroseth gentium.\"},{\"verse\":3,\"text\":\"Clamaveruntque filii Israël ad Dominum : nongentos enim habebat falcatos currus, et per viginti annos vehementer oppresserat eos.\"},{\"verse\":4,\"text\":\"Erat autem Debbora prophetis uxor Lapidoth, quæ judicabat populum in illo tempore.\"},{\"verse\":5,\"text\":\"Et sedebat sub palma, quæ nomine illius vocabatur, inter Rama et Bethel in monte Ephraim : ascendebantque ad eam filii Israël in omne judicium.\"},{\"verse\":6,\"text\":\"Quæ misit et vocavit Barac filium Abinoëm de Cedes Nephthali : dixitque ad eum : Præcepit tibi Dominus Deus Israël : Vade, et duc exercitum in montem Thabor, tollesque tecum decem millia pugnatorum de filiis Nephthali, et de filiis Zabulon :\"},{\"verse\":7,\"text\":\"ego autem adducam ad te in loco torrentis Cison, Sisaram principem exercitus Jabin, et currus ejus, atque omnem multitudinem, et tradam eos in manu tua.\"},{\"verse\":8,\"text\":\"Dixitque ad eam Barac : Si venis mecum, vadam : si nolueris venire mecum, non pergam.\"},{\"verse\":9,\"text\":\"Quæ dixit ad eum : Ibo quidem tecum, sed in hac vice victoria non reputabitur tibi, quia in manu mulieris tradetur Sisara. Surrexit itaque Debbora, et perrexit cum Barac in Cedes.\"},{\"verse\":10,\"text\":\"Qui, accitis Zabulon et Nephthali, ascendit cum decem millibus pugnatorum, habens Debboram in comitatu suo.\"},{\"verse\":11,\"text\":\"Haber autem Cinæus recesserat quondam a ceteris Cinæis fratribus suis, filiis Hobab cognati Moysi : et tetenderat tabernacula usque ad vallem, quæ vocatur Sennim, et erat juxta Cedes.\"},{\"verse\":12,\"text\":\"Nuntiatumque est Sisaræ quod ascendisset Barac filius Abinoëm in montem Thabor :\"},{\"verse\":13,\"text\":\"et congregavit nongentos falcatos currus, et omnem exercitum de Haroseth gentium ad torrentem Cison.\"},{\"verse\":14,\"text\":\"Dixitque Debbora ad Barac : Surge, hæc est enim dies, in qua tradidit Dominus Sisaram in manus tuas : en ipse ductor est tuus. Descendit itaque Barac de monte Thabor, et decem millia pugnatorum cum eo.\"},{\"verse\":15,\"text\":\"Perterruitque Dominus Sisaram, et omnes currus ejus, universamque multitudinem in ore gladii ad conspectum Barac : in tantum, ut Sisara de curru desiliens, pedibus fugeret,\"},{\"verse\":16,\"text\":\"et Barac persequeretur fugientes currus, et exercitum usque ad Haroseth gentium, et omnis hostium multitudo usque ad internecionem caderet.\"},{\"verse\":17,\"text\":\"Sisara autem fugiens pervenit ad tentorium Jahel uxoris Haber Cinæi. Erat enim pax inter Jabin regem Asor, et domum Haber Cinæi.\"},{\"verse\":18,\"text\":\"Egressa igitur Jahel in occursum Sisaræ, dixit ad eum : Intra ad me, domine mi : intra, ne timeas. Qui ingressus tabernaculum ejus, et opertus ab ea pallio,\"},{\"verse\":19,\"text\":\"dixit ad eam : Da mihi, obsecro, paululum aquæ, quia sitio valde. Quæ aperuit utrem lactis, et dedit ei bibere, et operuit illum.\"},{\"verse\":20,\"text\":\"Dixitque Sisara ad eam : Sta ante ostium tabernaculi : et cum venerit aliquis interrogans te, et dicens : Numquid hic est aliquis ? respondebis : Nullus est.\"},{\"verse\":21,\"text\":\"Tulit itaque Jahel uxor Haber clavum tabernaculi, assumens pariter et malleum : et ingressa abscondite et cum silentio, posuit supra tempus capitis ejus clavum, percussumque malleo defixit in cerebrum usque ad terram : qui soporem morti consocians defecit, et mortuus est.\"},{\"verse\":22,\"text\":\"Et ecce Barac sequens Sisaram veniebat : egressaque Jahel in occursum ejus, dixit ei : Veni, et ostendam tibi virum quem quæris. Qui cum intrasset ad eam, vidit Sisaram jacentem mortuum, et clavum infixum in tempore ejus.\"},{\"verse\":23,\"text\":\"Humiliavit ergo Deus in die illo Jabin regem Chanaan coram filiis Israël :\"},{\"verse\":24,\"text\":\"qui crescebant quotidie, et forti manu opprimebant Jabin regem Chanaan, donec delerent eum.\"}],\"summary\":\"Debbora and Barac deliver Israel from Jabin and Sisara, Jahal killeth Sisara.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":3,\"label\":\"Judges 3\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":5,\"label\":\"Judges 5\"}}]]\n"])</script></body></html>
