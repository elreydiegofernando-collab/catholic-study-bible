1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judges<!-- --> <span class="text-stone-500">7</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDG/">About <!-- -->Judges</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Gedeon, with three hundred men, by stratagem defeateth the Madianites.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Jerobaal, who is the same as Gedeon, rising up early, and all the people with him, came to the fountain that is called Harad. Now the camp of Madian was in the valley, on the north side of the high hill.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Lord said to Gedeon: The people that are with thee are many, and Madian shall not be delivered into their hands: lest Israel should glory against me, and say: I was delivered by my own strength.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Speak to the people, and proclaim in the hearing of all: Whosoever is fearful and timorous, let him return. So two and twenty thousand men went away from Mount Galaad and returned home, and only ten thousand remained.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the Lord said to Gedeon: The people are still too many, bring them to the waters, and there I will try them: and of whom I shall say to thee, This shall go with thee, let him go: whom I shall forbid to go, let him return.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when the people were come down to the waters, the Lord said to Gedeon: They that shall lap the water with their tongues, as dogs are wont to lap, thou shalt set apart by themselves: but they that shall drink bowing down their knees, shall be on the other side.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the number of them that had lapped water; casting it with the hand to their mouth, was three hundred men: and all the rest of the multitude had drunk kneeling.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the Lord said to Gedeon: By the three hundred men, that lapped water, I will save you, and deliver Madian into thy hand: but let all the rest of the people return to their place.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>So taking victuals and trumpets according to their number, he ordered all the rest of the multitude to depart to their tents: and he with the three hundred gave himself to the battle. Now the camp of Madia was beneath him in the valley.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The same night the Lord said to him: Arise, and go down into the camp: because I have delivered them into thy hand.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But if thou be afraid to go alone, let Phara, thy servant, go down with thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when thou shalt hear what they are saying, then shall thy hands be strengthened, and thou shalt go down more secure to the enemies’ camp. And he went down with Phara his servant, into part of the camp, where was the watch of men in arms.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But Madian and Amalec, and all the eastern people, lay scattered in the valley, as a multitude of locusts: their camels also were innumerable, as the sand that lieth on the sea shore.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when Gedeon was come, one told his neighbour a dream: and in this manner related what he had seen: I dreamt a dream, and it seemed to me as if a hearth cake of barley bread rolled and came down into the camp of Madian: and when it was come to a tent, it struck it, and beat it down flat to the ground.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He to whom he spoke, answered: This is nothing else but the sword of Gedeon, the son of Joas, a man of Israel. For the Lord hath delivered Madian, and all their camp into his hand.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when Gedeon had heard the dream, and the interpretation thereof, he adored: and returned to the camp of Israel, and said: Arise, for the Lord hath delivered the camp of Madian into our hands.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he divided the three hundred men into three parts, and gave them trumpets in their hands, and empty pitchers, and lamps within the pitchers.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he said to them: What you shall see me do, do you the same: I will go into one part of the camp, and do you as I shall do.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When the trumpet shall sound in my hand, do you also blow the trumpets on every side of the camp, and shout together to the Lord and to Gedeon.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Gedeon, and the three hundred men that were with him, went into part of the camp, at the beginning of the midnight watch, and the watchmen being alarmed, they began to sound their trumpets, and to clap the pitchers one against another.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when they sounded their trumpets in three places round about the camp, and had broken their pitchers, they held their lamps in their left hands, and with their right hands the trumpets which they blew, and they cried out: The sword of the Lord and of Gedeon:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Standing every man in his place round about the enemies’ camp. So all the camp was troubled, and crying out and howling, they fled away:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the three hundred men nevertheless persisted sounding the trumpets. And the Lord sent the sword into all the camp, and they killed one another,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Fleeing as far as Bethsetta, and the border of Abelmahula, in Tebbath. But the men of Israel, shouting from Nephthali, and Aser, and from all Manasses, pursued after Madian.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Gedeon sent messengers into all Mount Ephraim, saying: Come down to meet Madian, and take the waters before them to Bethbera and the Jordan. And all Ephraim shouted, and took the waters before them and the Jordan as far as Bethbera.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And having taken two men of Madian, Oreb and Zeb: Oreb they slew in the rock of Oreb, and Zeb in the winepress of Zeb. And they pursued Madian, carrying the heads of Oreb and Zeb to Gedeon, beyond the waters of the Jordan.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur Jerobaal qui et Gedeon, de nocte consurgens, et omnis populus cum eo, venit ad fontem qui vocatur Harad. Erant autem castra Madian in valle ad septentrionalem plagam collis excelsi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dixitque Dominus ad Gedeon : Multus tecum est populus, nec tradetur Madian in manus ejus : ne glorietur contra me Israël, et dicat : Meis viribus liberatus sum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Loquere ad populum, et cunctis audientibus prædica : Qui formidolosus et timidus est, revertatur. Recesseruntque de monte Galaad, et reversi sunt de populo viginti duo millia virorum, et tantum decem millia remanserunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixitque Dominus ad Gedeon : Adhuc populus multus est : duc eos ad aquas et ibi probabo illos : et de quo dixero tibi ut tecum vadat, ipse pergat ; quem ire prohibuero, revertatur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cumque descendisset populus ad aquas, dixit Dominus ad Gedeon : Qui lingua lambuerint aquas, sicut solent canes lambere, separabis eos seorsum : qui autem curvatis genibus biberint, in altera parte erunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Fuit itaque numerus eorum qui manu ad os projiciente lambuerunt aquas, trecenti viri : omnis autem reliqua multitudo flexo poplite biberat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ait Dominus ad Gedeon : In trecentis viris qui lambuerunt aquas, liberabo vos, et tradam in manu tua Madian : omnis autem reliqua multitudo revertatur in locum suum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sumptis itaque pro numero cibariis et tubis, omnem reliquam multitudinem abire præcepit ad tabernacula sua : et ipse cum trecentis viris se certamini dedit. Castra autem Madian erant subter in valle.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Eadem nocte dixit Dominus ad eum : Surge, et descende in castra : quia tradidi eos in manu tua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sin autem solus ire formidas, descendat tecum Phara puer tuus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et cum audieris quid loquantur, tunc confortabuntur manus tuæ, et securior ad hostium castra descendes. Descendit ergo ipse et Phara puer ejus in partem castrorum, ubi erant armatorum vigiliæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Madian autem et Amalec, et omnes orientales populi, fusi jacebant in valle, ut locustarum multitudo : cameli quoque innumerabiles erant, sicut arena quæ jacet in littore maris.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cumque venisset Gedeon, narrabat aliquis somnium proximo suo : et in hunc modum referebat quod viderat : Vidi somnium, et videbatur mihi quasi subcinericius panis ex hordeo volvi, et in castra Madian descendere : cumque pervenisset ad tabernaculum, percussit illud, atque subvertit, et terræ funditus coæquavit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Respondit is, cui loquebatur : Non est hoc aliud, nisi gladius Gedeonis filii Joas viri Israëlitæ : tradidit enim Dominus in manus ejus Madian, et omnia castra ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cumque audisset Gedeon somnium, et interpretationem ejus, adoravit : et reversus est ad castra Israël, et ait : Surgite, tradidit enim Dominus in manus nostras castra Madian.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Divisitque trecentos viros in tres partes, et dedit tubas in manibus eorum, lagenasque vacuas, ac lampades in medio lagenarum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et dixit ad eos : Quod me facere videritis, hoc facite : ingrediar partem castrorum, et quod fecero, sectamini.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quando personuerit tuba in manu mea, vos quoque per castrorum circuitum clangite, et conclamate : Domino et Gedeoni.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ingressusque est Gedeon, et trecenti viri qui erant cum eo, in partem castrorum, incipientibus vigiliis noctis mediæ : et custodibus suscitatis, cœperunt buccinis clangere, et complodere inter se lagenas.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cumque per gyrum castrorum in tribus personarent locis, et hydrias confregissent, tenuerunt sinistris manibus lampades, et dextris sonantes tubas, clamaveruntque : Gladius Domini et Gedeonis :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>stantes singuli in loco suo per circuitum castrorum hostilium. Omnia itaque castra turbata sunt, et vociferantes ululantesque fugerunt :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et nihilominus insistebant trecenti viri buccinis personantes. Immisitque Dominus gladium omnibus castris, et mutua se cæde truncabant,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>fugientes usque ad Bethsetta, et crepidinem Abelmehula in Tebbath. Conclamantes autem viri Israël de Nephthali, et Aser, et omni Manasse, persequebantur Madian.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Misitque Gedeon nuntios in omnem montem Ephraim, dicens : Descendite in occursum Madian, et occupate aquas usque Bethbera atque Jordanem. Clamavitque omnis Ephraim, et præoccupavit aquas atque Jordanem usque Bethbera.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Apprehensosque duos viros Madian, Oreb et Zeb, interfecit Oreb in petra Oreb, Zeb vero in torculari Zeb. Et persecuti sunt Madian, capita Oreb et Zeb portantes ad Gedeon trans fluenta Jordanis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 item \",\"$L18\",\"JDG.7\",{\"bookId\":7,\"usfm\":\"JDG\",\"bookName\":\"Judges\",\"drName\":\"Judges\",\"chapter\":7,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"Then Jerobaal, who is the same as Gedeon, rising up early, and all the people with him, came to the fountain that is called Harad. Now the camp of Madian was in the valley, on the north side of the high hill.\"},{\"verse\":2,\"text\":\"And the Lord said to Gedeon: The people that are with thee are many, and Madian shall not be delivered into their hands: lest Israel should glory against me, and say: I was delivered by my own strength.\"},{\"verse\":3,\"text\":\"Speak to the people, and proclaim in the hearing of all: Whosoever is fearful and timorous, let him return. So two and twenty thousand men went away from Mount Galaad and returned home, and only ten thousand remained.\"},{\"verse\":4,\"text\":\"And the Lord said to Gedeon: The people are still too many, bring them to the waters, and there I will try them: and of whom I shall say to thee, This shall go with thee, let him go: whom I shall forbid to go, let him return.\"},{\"verse\":5,\"text\":\"And when the people were come down to the waters, the Lord said to Gedeon: They that shall lap the water with their tongues, as dogs are wont to lap, thou shalt set apart by themselves: but they that shall drink bowing down their knees, shall be on the other side.\"},{\"verse\":6,\"text\":\"And the number of them that had lapped water; casting it with the hand to their mouth, was three hundred men: and all the rest of the multitude had drunk kneeling.\"},{\"verse\":7,\"text\":\"And the Lord said to Gedeon: By the three hundred men, that lapped water, I will save you, and deliver Madian into thy hand: but let all the rest of the people return to their place.\"},{\"verse\":8,\"text\":\"So taking victuals and trumpets according to their number, he ordered all the rest of the multitude to depart to their tents: and he with the three hundred gave himself to the battle. Now the camp of Madia was beneath him in the valley.\"},{\"verse\":9,\"text\":\"The same night the Lord said to him: Arise, and go down into the camp: because I have delivered them into thy hand.\"},{\"verse\":10,\"text\":\"But if thou be afraid to go alone, let Phara, thy servant, go down with thee.\"},{\"verse\":11,\"text\":\"And when thou shalt hear what they are saying, then shall thy hands be strengthened, and thou shalt go down more secure to the enemies’ camp. And he went down with Phara his servant, into part of the camp, where was the watch of men in arms.\"},{\"verse\":12,\"text\":\"But Madian and Amalec, and all the eastern people, lay scattered in the valley, as a multitude of locusts: their camels also were innumerable, as the sand that lieth on the sea shore.\"},{\"verse\":13,\"text\":\"And when Gedeon was come, one told his neighbour a dream: and in this manner related what he had seen: I dreamt a dream, and it seemed to me as if a hearth cake of barley bread rolled and came down into the camp of Madian: and when it was come to a tent, it struck it, and beat it down flat to the ground.\"},{\"verse\":14,\"text\":\"He to whom he spoke, answered: This is nothing else but the sword of Gedeon, the son of Joas, a man of Israel. For the Lord hath delivered Madian, and all their camp into his hand.\"},{\"verse\":15,\"text\":\"And when Gedeon had heard the dream, and the interpretation thereof, he adored: and returned to the camp of Israel, and said: Arise, for the Lord hath delivered the camp of Madian into our hands.\"},{\"verse\":16,\"text\":\"And he divided the three hundred men into three parts, and gave them trumpets in their hands, and empty pitchers, and lamps within the pitchers.\"},{\"verse\":17,\"text\":\"And he said to them: What you shall see me do, do you the same: I will go into one part of the camp, and do you as I shall do.\"},{\"verse\":18,\"text\":\"When the trumpet shall sound in my hand, do you also blow the trumpets on every side of the camp, and shout together to the Lord and to Gedeon.\"},{\"verse\":19,\"text\":\"And Gedeon, and the three hundred men that were with him, went into part of the camp, at the beginning of the midnight watch, and the watchmen being alarmed, they began to sound their trumpets, and to clap the pitchers one against another.\"},{\"verse\":20,\"text\":\"And when they sounded their trumpets in three places round about the camp, and had broken their pitchers, they held their lamps in their left hands, and with their right hands the trumpets which they blew, and they cried out: The sword of the Lord and of Gedeon:\"},{\"verse\":21,\"text\":\"Standing every man in his place round about the enemies’ camp. So all the camp was troubled, and crying out and howling, they fled away:\"},{\"verse\":22,\"text\":\"And the three hundred men nevertheless persisted sounding the trumpets. And the Lord sent the sword into all the camp, and they killed one another,\"},{\"verse\":23,\"text\":\"Fleeing as far as Bethsetta, and the border of Abelmahula, in Tebbath. But the men of Israel, shouting from Nephthali, and Aser, and from all Manasses, pursued after Madian.\"},{\"verse\":24,\"text\":\"And Gedeon sent messengers into all Mount Ephraim, saying: Come down to meet Madian, and take the waters before them to Bethbera and the Jordan. And all Ephraim shouted, and took the waters before them and the Jordan as far as Bethbera.\"},{\"verse\":25,\"text\":\"And having taken two men of Madian, Oreb and Zeb: Oreb they slew in the rock of Oreb, and Zeb in the winepress of Zeb. And they pursued Madian, carrying the heads of Oreb and Zeb to Gedeon, beyond the waters of the Jordan.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur Jerobaal qui et Gedeon, de nocte consurgens, et omnis populus cum eo, venit ad fontem qui vocatur Harad. Erant autem castra Madian in valle ad septentrionalem plagam collis excelsi.\"},{\"verse\":2,\"text\":\"Dixitque Dominus ad Gedeon : Multus tecum est populus, nec tradetur Madian in manus ejus : ne glorietur contra me Israël, et dicat : Meis viribus liberatus sum.\"},{\"verse\":3,\"text\":\"Loquere ad populum, et cunctis audientibus prædica : Qui formidolosus et timidus est, revertatur. Recesseruntque de monte Galaad, et reversi sunt de populo viginti duo millia virorum, et tantum decem millia remanserunt.\"},{\"verse\":4,\"text\":\"Dixitque Dominus ad Gedeon : Adhuc populus multus est : duc eos ad aquas et ibi probabo illos : et de quo dixero tibi ut tecum vadat, ipse pergat ; quem ire prohibuero, revertatur.\"},{\"verse\":5,\"text\":\"Cumque descendisset populus ad aquas, dixit Dominus ad Gedeon : Qui lingua lambuerint aquas, sicut solent canes lambere, separabis eos seorsum : qui autem curvatis genibus biberint, in altera parte erunt.\"},{\"verse\":6,\"text\":\"Fuit itaque numerus eorum qui manu ad os projiciente lambuerunt aquas, trecenti viri : omnis autem reliqua multitudo flexo poplite biberat.\"},{\"verse\":7,\"text\":\"Et ait Dominus ad Gedeon : In trecentis viris qui lambuerunt aquas, liberabo vos, et tradam in manu tua Madian : omnis autem reliqua multitudo revertatur in locum suum.\"},{\"verse\":8,\"text\":\"Sumptis itaque pro numero cibariis et tubis, omnem reliquam multitudinem abire præcepit ad tabernacula sua : et ipse cum trecentis viris se certamini dedit. Castra autem Madian erant subter in valle.\"},{\"verse\":9,\"text\":\"Eadem nocte dixit Dominus ad eum : Surge, et descende in castra : quia tradidi eos in manu tua.\"},{\"verse\":10,\"text\":\"Sin autem solus ire formidas, descendat tecum Phara puer tuus.\"},{\"verse\":11,\"text\":\"Et cum audieris quid loquantur, tunc confortabuntur manus tuæ, et securior ad hostium castra descendes. Descendit ergo ipse et Phara puer ejus in partem castrorum, ubi erant armatorum vigiliæ.\"},{\"verse\":12,\"text\":\"Madian autem et Amalec, et omnes orientales populi, fusi jacebant in valle, ut locustarum multitudo : cameli quoque innumerabiles erant, sicut arena quæ jacet in littore maris.\"},{\"verse\":13,\"text\":\"Cumque venisset Gedeon, narrabat aliquis somnium proximo suo : et in hunc modum referebat quod viderat : Vidi somnium, et videbatur mihi quasi subcinericius panis ex hordeo volvi, et in castra Madian descendere : cumque pervenisset ad tabernaculum, percussit illud, atque subvertit, et terræ funditus coæquavit.\"},{\"verse\":14,\"text\":\"Respondit is, cui loquebatur : Non est hoc aliud, nisi gladius Gedeonis filii Joas viri Israëlitæ : tradidit enim Dominus in manus ejus Madian, et omnia castra ejus.\"},{\"verse\":15,\"text\":\"Cumque audisset Gedeon somnium, et interpretationem ejus, adoravit : et reversus est ad castra Israël, et ait : Surgite, tradidit enim Dominus in manus nostras castra Madian.\"},{\"verse\":16,\"text\":\"Divisitque trecentos viros in tres partes, et dedit tubas in manibus eorum, lagenasque vacuas, ac lampades in medio lagenarum.\"},{\"verse\":17,\"text\":\"Et dixit ad eos : Quod me facere videritis, hoc facite : ingrediar partem castrorum, et quod fecero, sectamini.\"},{\"verse\":18,\"text\":\"Quando personuerit tuba in manu mea, vos quoque per castrorum circuitum clangite, et conclamate : Domino et Gedeoni.\"},{\"verse\":19,\"text\":\"Ingressusque est Gedeon, et trecenti viri qui erant cum eo, in partem castrorum, incipientibus vigiliis noctis mediæ : et custodibus suscitatis, cœperunt buccinis clangere, et complodere inter se lagenas.\"},{\"verse\":20,\"text\":\"Cumque per gyrum castrorum in tribus personarent locis, et hydrias confregissent, tenuerunt sinistris manibus lampades, et dextris sonantes tubas, clamaveruntque : Gladius Domini et Gedeonis :\"},{\"verse\":21,\"text\":\"stantes singuli in loco suo per circuitum castrorum hostilium. Omnia itaque castra turbata sunt, et vociferantes ululantesque fugerunt :\"},{\"verse\":22,\"text\":\"et nihilominus insistebant trecenti viri buccinis personantes. Immisitque Dominus gladium omnibus castris, et mutua se cæde truncabant,\"},{\"verse\":23,\"text\":\"fugientes usque ad Bethsetta, et crepidinem Abelmehula in Tebbath. Conclamantes autem viri Israël de Nephthali, et Aser, et omni Manasse, persequebantur Madian.\"},{\"verse\":24,\"text\":\"Misitque Gedeon nuntios in omnem montem Ephraim, dicens : Descendite in occursum Madian, et occupate aquas usque Bethbera atque Jordanem. Clamavitque omnis Ephraim, et præoccupavit aquas atque Jordanem usque Bethbera.\"},{\"verse\":25,\"text\":\"Apprehensosque duos viros Madian, Oreb et Zeb, interfecit Oreb in petra Oreb, Zeb vero in torculari Zeb. Et persecuti sunt Madian, capita Oreb et Zeb portantes ad Gedeon trans fluenta Jordanis.\"}],\"summary\":\"Gedeon, with three hundred men, by stratagem defeateth the Madianites.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":6,\"label\":\"Judges 6\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":8,\"label\":\"Judges 8\"}}]]\n"])</script></body></html>
