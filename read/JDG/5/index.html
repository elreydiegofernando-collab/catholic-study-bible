leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In that day Debbora and Barac, son of Abinoem, sung, and said:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>O you of Israel, that have willingly offered your lives to danger, bless the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hear, O ye kings, give ear, O ye princes: It is I, it is I, that will sing to the Lord, I will sing to the Lord, the God of Israel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O Lord, when thou wentest out of Seir, and passedst by the regions of Edom, the earth trembled, and the heavens and clouds dropped water.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The mountains melted before the face of the Lord, and Sinai before the face of the Lord the God of Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In the days of Samgar, the son of Anath, in the days of Jahel, the paths rested: and they that went by them, walked through bye-ways.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The valiant men ceased, and rested in Israel: until Debbora arose, a mother arose in Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord chose new wars, and he himself overthrew the gates of the enemies: a shield and spear was not seen among forty thousand of Israel.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>My heart loveth the princes of Israel: O you, that of your own good will offered yourselves to danger, bless the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Speak, you that ride upon fair asses, and you that sit in judgment, and walk in the way.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Where the chariots were dashed together, and the army of the enemies was choked, there let the justices of the Lord be rehearsed, and his clemency towards the brave men of Israel: then the people of the Lord went down to the gates, and obtained the sovereignty.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Arise, arise, O Debbora, arise, arise, and utter a canticle. Arise, Barac, and take hold of thy captives, O son of Abinoem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The remnants of the people are saved, the Lord hath fought among the valiant ones.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Out of Ephraim he destroyed them into Amalec, and after him out of Benjamin into thy people, O Amalec: Out of Machir there came down princes, and out of Zabulon they that led the army to fight.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The captains of Issachar were with Debbora, and followed the steps of Barac, who exposed himself to danger, as one going headlong, and into a pit. Ruben being divided against himself, there was found a strife of courageous men.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Why dwellest thou between two borders, that thou mayst hear the bleatings of the flocks? Ruben being divided against himself, there was found a strife of courageous men.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Galaad rested beyond the Jordan, and Dan applied himself to ships: Aser dwelt on the sea shore, and abode in the havens.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But Zabulon and Nephthali offered their lives to death in the region of Merome.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The kings came and fought, the kings of Chanaan fought in Thanac, by the waters of Mageddo and yet they took no spoils.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>There was war made against them from heaven: the stars, remaining in their order and courses, fought against Sisara.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The torrent of Cison dragged their carcasses, the torrent of Cadumim, the torrent of Cison: tread thou, my soul, upon the strong ones.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The hoofs of the horses were broken whilst the stoutest of the enemies fled amain, and fell headlong down.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Curse ye the land of Meroz, said the angel of the Lord: curse the inhabitants thereof, because they came not to the help of the Lord, to help his most valiant men.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Blessed among women be Jahel, the wife of Haber the Cinite, and blessed be she in her tent.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He asked her water, and she gave him milk, and offered him butter in a dish fit for princes.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>She put her left hand to the nail, and her right hand to the workman’s hammer, and she struck Sisara, seeking in his head a place for the wound, and strongly piercing through his temples.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Between her feet he fell: he fainted, and he died: he rolled before her feet, and there he lay lifeless and wretched.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>His mother looked out at a window, and howled: and she spoke from the dining room: Why is his chariot so long in coming back? Why are the feet of his horses so slow?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>One that was wiser than the rest of his wives, returned this answer to her mother in law:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Perhaps he is now dividing the spoils, and the fairest of the women is chosen out for him: garments of divers colours are given to Sisara for his prey, and furniture of different kinds is heaped together to adorn necks.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>So let all thy enemies perish, O Lord: but let them that love thee shine, as the sun shineth in his rising.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the land rested for forty years.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cecineruntque Debbora et Barac filius Abinoëm in illo die, dicentes :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui sponte obtulistis de Israël animas vestras ad periculum, benedicite Domino.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Audite, reges ; auribus percipite, principes : ego sum, ego sum, quæ Domino canam, psallam Domino Deo Israël.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Domine, cum exires de Seir, et transires per regiones Edom, terra mota est, cælique ac nubes distillaverunt aquis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Montes fluxerunt a facie Domini, et Sinai a facie Domini Dei Israël.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In diebus Samgar filii Anath, in diebus Jahel quieverunt semitæ : et qui ingrediebantur per eas, ambulaverunt per calles devios.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cessaverunt fortes in Israël, et quieverunt : donec surgeret Debbora, surgeret mater in Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nova bella elegit Dominus, et portas hostium ipse subvertit : clypeus et hasta si apparuerint in quadraginta millibus Israël.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cor meum diligit principes Israël : qui propria voluntate obtulistis vos discrimini, benedicite Domino.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui ascenditis super nitentes asinos, et sedetis in judicio, et ambulatis in via, loquimini.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ubi collisi sunt currus, et hostium suffocatus est exercitus, ibi narrentur justitiæ Domini, et clementia in fortes Israël : tunc descendit populus Domini ad portas, et obtinuit principatum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Surge, surge Debbora ; surge, surge, et loquere canticum : surge Barac, et apprehende captivos tuos, fili Abinoëm.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Salvatæ sunt reliquiæ populi : Dominus in fortibus dimicavit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ex Ephraim delevit eos in Amalec, et post eum ex Benjamin in populos tuos, o Amalec : de Machir principes descenderunt, et de Zabulon qui exercitum ducerent ad bellandum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Duces Issachar fuere cum Debbora, et Barac vestigia sunt secuti, qui quasi in præceps ac barathrum se discrimini dedit : diviso contra se Ruben, magnanimorum reperta est contentio.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quare habitas inter duos terminos, ut audias sibilos gregum ? diviso contra se Ruben, magnanimorum reperta est contentio.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Galaad trans Jordanem quiescebat, et Dan vacabat navibus : Aser habitabat in littore maris, et in portubus morabatur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Zabulon vero et Nephthali obtulerunt animas suas morti in regione Merome.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Venerunt reges et pugnaverunt : pugnaverunt reges Chanaan in Thanach juxta aquas Mageddo, et tamen nihil tulere prædantes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De cælo dimicatum est contra eos : stellæ manentes in ordine et cursu suo, adversus Sisaram pugnaverunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Torrens Cison traxit cadavera eorum, torrens Cadumim, torrens Cison : conculca, anima mea, robustos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ungulæ equorum ceciderunt, fugientibus impetu, et per præceps ruentibus fortissimis hostium.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Maledicite terræ Meroz, dixit angelus Domini : maledicite habitatoribus ejus, quia non venerunt ad auxilium Domini, in adjutorium fortissimorum ejus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Benedicta inter mulieres Jahel uxor Haber Cinæi, et benedicatur in tabernaculo suo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Aquam petenti lac dedit, et in phiala principum obtulit butyrum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sinistram manum misit ad clavum, et dexteram ad fabrorum malleos. Percussitque Sisaram quærens in capite vulneri locum, et tempus valide perforans :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>inter pedes ejus ruit ; defecit, et mortuus est : volvebatur ante pedes ejus, et jacebat exanimis et miserabilis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Per fenestram respiciens, ululabat mater ejus : et de cœnaculo loquebatur : Cur moratur regredi currus ejus ? quare tardaverunt pedes quadrigarum illius ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Una sapientior ceteris uxoribus ejus, hæc socrui verba respondit :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Forsitan nunc dividit spolia, et pulcherrima feminarum eligitur ei : vestes diversorum colorum Sisaræ traduntur in prædam, et supellex varia ad ornanda colla congeritur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sic pereant omnes inimici tui, Domine : qui autem diligunt te, sicut sol in ortu suo splendet, ita rutilent.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quievitque terra per quadraginta annos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-stud s\":21,\"dra\":[{\"verse\":1,\"text\":\"In that day Debbora and Barac, son of Abinoem, sung, and said:\"},{\"verse\":2,\"text\":\"O you of Israel, that have willingly offered your lives to danger, bless the Lord.\"},{\"verse\":3,\"text\":\"Hear, O ye kings, give ear, O ye princes: It is I, it is I, that will sing to the Lord, I will sing to the Lord, the God of Israel.\"},{\"verse\":4,\"text\":\"O Lord, when thou wentest out of Seir, and passedst by the regions of Edom, the earth trembled, and the heavens and clouds dropped water.\"},{\"verse\":5,\"text\":\"The mountains melted before the face of the Lord, and Sinai before the face of the Lord the God of Israel.\"},{\"verse\":6,\"text\":\"In the days of Samgar, the son of Anath, in the days of Jahel, the paths rested: and they that went by them, walked through bye-ways.\"},{\"verse\":7,\"text\":\"The valiant men ceased, and rested in Israel: until Debbora arose, a mother arose in Israel.\"},{\"verse\":8,\"text\":\"The Lord chose new wars, and he himself overthrew the gates of the enemies: a shield and spear was not seen among forty thousand of Israel.\"},{\"verse\":9,\"text\":\"My heart loveth the princes of Israel: O you, that of your own good will offered yourselves to danger, bless the Lord.\"},{\"verse\":10,\"text\":\"Speak, you that ride upon fair asses, and you that sit in judgment, and walk in the way.\"},{\"verse\":11,\"text\":\"Where the chariots were dashed together, and the army of the enemies was choked, there let the justices of the Lord be rehearsed, and his clemency towards the brave men of Israel: then the people of the Lord went down to the gates, and obtained the sovereignty.\"},{\"verse\":12,\"text\":\"Arise, arise, O Debbora, arise, arise, and utter a canticle. Arise, Barac, and take hold of thy captives, O son of Abinoem.\"},{\"verse\":13,\"text\":\"The remnants of the people are saved, the Lord hath fought among the valiant ones.\"},{\"verse\":14,\"text\":\"Out of Ephraim he destroyed them into Amalec, and after him out of Benjamin into thy people, O Amalec: Out of Machir there came down princes, and out of Zabulon they that led the army to fight.\"},{\"verse\":15,\"text\":\"The captains of Issachar were with Debbora, and followed the steps of Barac, who exposed himself to danger, as one going headlong, and into a pit. Ruben being divided against himself, there was found a strife of courageous men.\"},{\"verse\":16,\"text\":\"Why dwellest thou between two borders, that thou mayst hear the bleatings of the flocks? Ruben being divided against himself, there was found a strife of courageous men.\"},{\"verse\":17,\"text\":\"Galaad rested beyond the Jordan, and Dan applied himself to ships: Aser dwelt on the sea shore, and abode in the havens.\"},{\"verse\":18,\"text\":\"But Zabulon and Nephthali offered their lives to death in the region of Merome.\"},{\"verse\":19,\"text\":\"The kings came and fought, the kings of Chanaan fought in Thanac, by the waters of Mageddo and yet they took no spoils.\"},{\"verse\":20,\"text\":\"There was war made against them from heaven: the stars, remaining in their order and courses, fought against Sisara.\"},{\"verse\":21,\"text\":\"The torrent of Cison dragged their carcasses, the torrent of Cadumim, the torrent of Cison: tread thou, my soul, upon the strong ones.\"},{\"verse\":22,\"text\":\"The hoofs of the horses were broken whilst the stoutest of the enemies fled amain, and fell headlong down.\"},{\"verse\":23,\"text\":\"Curse ye the land of Meroz, said the angel of the Lord: curse the inhabitants thereof, because they came not to the help of the Lord, to help his most valiant men.\"},{\"verse\":24,\"text\":\"Blessed among women be Jahel, the wife of Haber the Cinite, and blessed be she in her tent.\"},{\"verse\":25,\"text\":\"He asked her water, and she gave him milk, and offered him butter in a dish fit for princes.\"},{\"verse\":26,\"text\":\"She put her left hand to the nail, and her right hand to the workman’s hammer, and she struck Sisara, seeking in his head a place for the wound, and strongly piercing through his temples.\"},{\"verse\":27,\"text\":\"Between her feet he fell: he fainted, and he died: he rolled before her feet, and there he lay lifeless and wretched.\"},{\"verse\":28,\"text\":\"His mother looked out at a window, and howled: and she spoke from the dining room: Why is his chariot so long in coming back? Why are the feet of his horses so slow?\"},{\"verse\":29,\"text\":\"One that was wiser than the rest of his wives, returned this answer to her mother in law:\"},{\"verse\":30,\"text\":\"Perhaps he is now dividing the spoils, and the fairest of the women is chosen out for him: garments of divers colours are given to Sisara for his prey, and furniture of different kinds is heaped together to adorn necks.\"},{\"verse\":31,\"text\":\"So let all thy enemies perish, O Lord: but let them that love thee shine, as the sun shineth in his rising.\"},{\"verse\":32,\"text\":\"And the land rested for forty years.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cecineruntque Debbora et Barac filius Abinoëm in illo die, dicentes :\"},{\"verse\":2,\"text\":\"Qui sponte obtulistis de Israël animas vestras ad periculum, benedicite Domino.\"},{\"verse\":3,\"text\":\"Audite, reges ; auribus percipite, principes : ego sum, ego sum, quæ Domino canam, psallam Domino Deo Israël.\"},{\"verse\":4,\"text\":\"Domine, cum exires de Seir, et transires per regiones Edom, terra mota est, cælique ac nubes distillaverunt aquis.\"},{\"verse\":5,\"text\":\"Montes fluxerunt a facie Domini, et Sinai a facie Domini Dei Israël.\"},{\"verse\":6,\"text\":\"In diebus Samgar filii Anath, in diebus Jahel quieverunt semitæ : et qui ingrediebantur per eas, ambulaverunt per calles devios.\"},{\"verse\":7,\"text\":\"Cessaverunt fortes in Israël, et quieverunt : donec surgeret Debbora, surgeret mater in Israël.\"},{\"verse\":8,\"text\":\"Nova bella elegit Dominus, et portas hostium ipse subvertit : clypeus et hasta si apparuerint in quadraginta millibus Israël.\"},{\"verse\":9,\"text\":\"Cor meum diligit principes Israël : qui propria voluntate obtulistis vos discrimini, benedicite Domino.\"},{\"verse\":10,\"text\":\"Qui ascenditis super nitentes asinos, et sedetis in judicio, et ambulatis in via, loquimini.\"},{\"verse\":11,\"text\":\"Ubi collisi sunt currus, et hostium suffocatus est exercitus, ibi narrentur justitiæ Domini, et clementia in fortes Israël : tunc descendit populus Domini ad portas, et obtinuit principatum.\"},{\"verse\":12,\"text\":\"Surge, surge Debbora ; surge, surge, et loquere canticum : surge Barac, et apprehende captivos tuos, fili Abinoëm.\"},{\"verse\":13,\"text\":\"Salvatæ sunt reliquiæ populi : Dominus in fortibus dimicavit.\"},{\"verse\":14,\"text\":\"Ex Ephraim delevit eos in Amalec, et post eum ex Benjamin in populos tuos, o Amalec : de Machir principes descenderunt, et de Zabulon qui exercitum ducerent ad bellandum.\"},{\"verse\":15,\"text\":\"Duces Issachar fuere cum Debbora, et Barac vestigia sunt secuti, qui quasi in præceps ac barathrum se discrimini dedit : diviso contra se Ruben, magnanimorum reperta est contentio.\"},{\"verse\":16,\"text\":\"Quare habitas inter duos terminos, ut audias sibilos gregum ? diviso contra se Ruben, magnanimorum reperta est contentio.\"},{\"verse\":17,\"text\":\"Galaad trans Jordanem quiescebat, et Dan vacabat navibus : Aser habitabat in littore maris, et in portubus morabatur.\"},{\"verse\":18,\"text\":\"Zabulon vero et Nephthali obtulerunt animas suas morti in regione Merome.\"},{\"verse\":19,\"text\":\"Venerunt reges et pugnaverunt : pugnaverunt reges Chanaan in Thanach juxta aquas Mageddo, et tamen nihil tulere prædantes.\"},{\"verse\":20,\"text\":\"De cælo dimicatum est contra eos : stellæ manentes in ordine et cursu suo, adversus Sisaram pugnaverunt.\"},{\"verse\":21,\"text\":\"Torrens Cison traxit cadavera eorum, torrens Cadumim, torrens Cison : conculca, anima mea, robustos.\"},{\"verse\":22,\"text\":\"Ungulæ equorum ceciderunt, fugientibus impetu, et per præceps ruentibus fortissimis hostium.\"},{\"verse\":23,\"text\":\"Maledicite terræ Meroz, dixit angelus Domini : maledicite habitatoribus ejus, quia non venerunt ad auxilium Domini, in adjutorium fortissimorum ejus.\"},{\"verse\":24,\"text\":\"Benedicta inter mulieres Jahel uxor Haber Cinæi, et benedicatur in tabernaculo suo.\"},{\"verse\":25,\"text\":\"Aquam petenti lac dedit, et in phiala principum obtulit butyrum.\"},{\"verse\":26,\"text\":\"Sinistram manum misit ad clavum, et dexteram ad fabrorum malleos. Percussitque Sisaram quærens in capite vulneri locum, et tempus valide perforans :\"},{\"verse\":27,\"text\":\"inter pedes ejus ruit ; defecit, et mortuus est : volvebatur ante pedes ejus, et jacebat exanimis et miserabilis.\"},{\"verse\":28,\"text\":\"Per fenestram respiciens, ululabat mater ejus : et de cœnaculo loquebatur : Cur moratur regredi currus ejus ? quare tardaverunt pedes quadrigarum illius ?\"},{\"verse\":29,\"text\":\"Una sapientior ceteris uxoribus ejus, hæc socrui verba respondit :\"},{\"verse\":30,\"text\":\"Forsitan nunc dividit spolia, et pulcherrima feminarum eligitur ei : vestes diversorum colorum Sisaræ traduntur in prædam, et supellex varia ad ornanda colla congeritur.\"},{\"verse\":31,\"text\":\"Sic pereant omnes inimici tui, Domine : qui autem diligunt te, sicut sol in ortu suo splendet, ita rutilent.\"},{\"verse\":32,\"text\":\"Quievitque terra per quadraginta annos.\"}],\"summary\":\"The canticle of Debbora and Barac after their victory.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":4,\"label\":\"Judges 4\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":6,\"label\":\"Judges 6\"}}]]\n"])</script></body></html>
