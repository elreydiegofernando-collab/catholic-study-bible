<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Judges 16 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judges<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDG/">About <!-- -->Judges</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Samson is deluded by Dalila: and falls into the hands of the Philistines. His death.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He went also into Gaza, and saw there a woman, a harlot, and went in unto her.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when the Philistines had heard this, and it was noised about among them, that Samson was come into the city, they surrounded him, setting guards at the gate of the city, and watching there all the night in silence, that in the morning they might kill him as he went out.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But Samson slept till midnight, and then rising, he took both the doors of the gate, with the posts thereof and the bolt, and laying them on his shoulders, carried them up to the top of the hill, which looketh towards Hebron.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>After this he loved a woman, who dwelt in the valley of Sorec, and she was called Dalila.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the princes of the Philistines came to her, and said: Deceive him, and learn of him wherein his great strength lieth, and how we may be able to overcome him, to bind and afflict him: which if thou shalt do, we will give thee every one of us eleven hundred pieces of silver.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Dalila said to Samson: Tell me, I beseech thee, wherein thy greatest strength lieth, and what it is, wherewith if thou wert bound, thou couldst not break loose.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Samson answered her: If I shall be bound with seven cords, made of sinews not yet dry, but still moist, I shall be weak like other men.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the princes of the Philistines brought unto her seven cords, such as he spoke of, with which she bound him;</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Men lying privately in wait with her, and in the chamber, expecting the event of the thing, and she cried out to him: The Philistines are upon thee, Samson. And he broke the bands, as a man would break a thread of tow twined with spittle, when it smelleth the fire: so it was not known wherein his strength lay.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Dalila said to him: Behold thou hast mocked me, and hast told me a false thing: but now at least tell me wherewith thou mayest be bound.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he answered her: If I shall be bound with new ropes, that were never in work, I shall be weak and like other men.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dalila bound him again with these, and cried out: The Philistines are upon thee, Samson, there being an ambush prepared for him in the chamber. But he broke the bands like threads of webs.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Dalila said to him again: How long dost thou deceive me, and tell me lies? Shew me wherewith thou mayest be bound. And Samson answered her: If thou plattest the seven locks of my head with a lace, and tying them round about a nail, fastenest it in the ground, I shall be weak.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when Dalila had done this, she said to him: The Philistines are upon thee, Samson. And awaking out of his sleep, he drew out the nail with the hairs and the lace.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Dalila said to him: How dost thou say thou lovest me, when thy mind is not with me? Thou hast told me lies these three times, and wouldst not tell me wherein thy greatest strength lieth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when she pressed him much, and continually hung upon him for many days, giving him no time to rest, his soul fainted away, and was wearied even unto death.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then opening the truth of the thing, he said to her: The razor hath never come upon my head, for I am a Nazarite, that is to say, consecrated to God from my mother’s womb: If my head be shaven, my strength shall depart from me, and I shall become weak, and shall be like other men.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Then seeing that he had discovered to her all his mind, she sent to the princes of the Philistines, saying: Come up this once more, for now he hath opened his heart to me. And they went up, taking with them the money which they had promised.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But she made him sleep upon her knees, and lay his head in her bosom. And she called a barber and shaved his seven locks, and began to drive him away, and thrust him from her: for immediately his strength departed from him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And she said: The Philistines are upon thee, Samson. And awaking from sleep, he said in his mind: I will go out as I did before, and shake myself, not knowing that the Lord was departed from him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then the Philistines seized upon him, and forthwith pulled out his eyes, and led him bound in chains to Gaza, and shutting him up in prison made him grind.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And now his hair began to grow again,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the princes of the Philistines assembled together, to offer great sacrifices to Dagon their god, and to make merry, saying: Our god hath delivered our enemy Samson into our hands.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the people also seeing this, praised their god, and said the same: Our god hath delivered our adversary into our hands, him that destroyed our country, and killed very many.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And rejoicing in their feasts, when they had now taken their good cheer, they commanded that Samson should be called, and should play before them. And being brought out of prison, he played before them; and they made him stand between two pillars.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he said to the lad that guided his steps: Suffer me to touch the pillars which support the whole house, and let me lean upon them, and rest a little.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Now the house was full of men and women, and all the princes of the Philistines were there. Moreover about three thousand persons of both sexes, from the roof and the higher part of the house, were beholding Samson’s play.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But he called upon the Lord, saying: O Lord God remember me, and restore to me now my former strength, O my God, that I may revenge myself on my enemies, and for the loss of my two eyes I may take one revenge.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And laying hold on both the pillars on which the house rested, and holding the one with his right hand, and the other with his left,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>He said: Let me die with the Philistines. And when he had strongly shook the pillars, the house fell upon all the princes, and the rest of the multitude, that was there: and he killed many more at his death, than he had killed before in his life.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And his brethren and all his kindred, going down took his body, and buried it between Saraa and Esthaol, in the buryingplace of his father Manue: and he judged Israel twenty years.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Abiit quoque in Gazam, et vidit ibi mulierem meretricem, ingressusque est ad eam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quod cum audissent Philisthiim, et percrebruisset apud eos intrasse urbem Samson, circumdederunt eum, positis in porta civitatis custodibus : et ibi tota nocte cum silentio præstolantes, ut facto mane exeuntem occiderent.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dormivit autem Samson usque ad medium noctem : et inde consurgens, apprehendit ambas portæ fores cum postibus suis et sera, impositasque humeris suis portavit ad verticem montis, qui respicit Hebron.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Post hæc amavit mulierem, quæ habitabat in valle Sorec, et vocabatur Dalila.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Veneruntque ad eam principes Philisthinorum, atque dixerunt : Decipe eum, et disce ab illo, in quo habeat tantam fortitudinem, et quomodo eum superare valeamus, et vinctum affligere : quod si feceris, dabimus tibi singuli mille et centum argenteos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Locuta est ergo Dalila ad Samson : Dic mihi, obsecro, in quo sit tua maxima fortitudo, et quid sit quo ligatus erumpere nequeas ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cui respondit Samson : Si septem nerviceis funibus necdum siccis, et adhuc humentibus, ligatus fuero, infirmus ero ut ceteri homines.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Attuleruntque ad eam satrapæ Philisthinorum septem funes, ut dixerat : quibus vinxit eam,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>latentibus apud se insidiis, et in cubiculo finem rei expectantibus : clamavitque ad eum : Philisthiim super te, Samson. Qui rupit vincula, quomodo si rumpat quis filum de stuppæ tortum putamine, cum odorem ignis acceperit : et non est cognitum in quo esset fortitudo ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixitque ad eum Dalila : Ecce illusisti mihi, et falsum locutus es : saltem nunc indica mihi quo ligari debeas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cui ille respondit : Si ligatus fuero novis funibus, qui numquam fuerunt in opere, infirmus ero, et aliorum hominum similis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quibus rursum Dalila vinxit eum, et clamavit : Philisthiim super te, Samson : in cubiculo insidiis præparatis. Qui ita rupit vincula quasi fila telarum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixitque Dalila rursum ad eum : Usquequo decipis me, et falsum loqueris ? ostende quo vinciri debeas. Cui respondit Samson : Si septem crines capitis mei cum licio plexueris, et clavum his circumligatum terræ fixeris, infirmus ero.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quod cum fecisset Dalila, dixit ad eum : Philisthiim super te, Samson. Qui consurgens de somno extraxit clavum cum crinibus et licio.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dixitque ad eum Dalila : Quomodo dicis quod amas me, cum animus tuus non sit mecum ? Per tres vices mentitus es mihi, et noluisti dicere in quo sit maxima fortitudo tua.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cumque molesta esset ei, et per multos dies jugiter adhæreret, spatium ad quietem non tribuens, defecit anima ejus, et ad mortem usque lassata est.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tunc aperiens veritatem rei, dixit ad eam : Ferrum numquam ascendit super caput meum, quia nazaræus, id est, consecratus Deo, sum de utero matris meæ : si rasum fuerit caput meum, recedet a me fortitudo mea, et deficiam, eroque sicut ceteri homines.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vidensque illa quod confessus ei esset omnem animum suum, misit ad principes Philisthinorum ac mandavit : Ascende adhuc semel, quia nunc mihi aperuit cor suum. Qui ascenderunt assumpta pecunia, quam promiserant.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>At illa dormire eum fecit super genua sua, et in sinu suo reclinare caput. Vocavitque tonsorem, et rasit septem crines ejus, et cœpit abigere eum, et a se repellere : statim enim ab eo fortitudo discessit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dixitque : Philisthiim super te, Samson. Qui de somno consurgens, dixit in animo suo : Egrediar sicut ante feci, et me excutiam : nesciens quod recessisset ab eo Dominus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quem cum apprehendissent Philisthiim, statim eruerunt oculos ejus, et duxerunt Gazam vinctum catenis, et clausum in carcere molere fecerunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Jamque capilli ejus renasci cœperunt.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et principes Philisthinorum convenerunt in unum ut immolarent hostias magnificas Dagon deo suo, et epularentur, dicentes : Tradidit deus noster inimicum nostrum Samson in manus nostras.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quod etiam populus videns, laudabat deum suum, eademque dicebat : Tradidit deus noster adversarium nostrum in manus nostras, qui delevit terram nostram, et occidit plurimos.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Lætantesque per convivia, sumptis jam epulis, præceperunt ut vocaretur Samson, et ante eos luderet. Qui adductus de carcere ludebat ante eos, feceruntque eum stare inter duas columnas.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui dixit puero regenti gressus suos : Dimitte me, ut tangam columnas, quibus omnis imminet domus, et recliner super eas, et paululum requiescam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Domus autem erat plena virorum ac mulierum, et erant ibi omnes principes Philisthinorum, ac de tecto et solario circiter tria millia utriusque sexus spectantes ludentem Samson.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>At ille invocato Domino ait : Domine Deus, memento mei, et redde mihi nunc fortitudinem pristinam, Deus meus, ut ulciscar me de hostibus meis, et pro amissione duorum luminum unam ultionem recipiam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et apprehendens ambas columnas quibus innitebatur domus, alteramque earum dextera et alteram læva tenens,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>ait : Moriatur anima mea cum Philisthiim. Concussisque fortiter columnis, cecidit domus super omnes principes, et ceteram multitudinem quæ ibi erat : multoque plures interfecit moriens, quam ante vivus occiderat.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Descendentes autem fratres ejus et universa cognatio, tulerunt corpus ejus, et sepelierunt inter Saraa et Esthaol in sepulchro patris sui Manue : judicavitque Israël viginti annis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judges 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDG/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judges 17</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-li  said: Deceive him, and learn of him wherein his great strength lieth, and how we may be able to overcome him, to bind and afflict him: which if thou shalt do, we will give thee every one of us eleven hundred pieces of silver.\"},{\"verse\":6,\"text\":\"And Dalila said to Samson: Tell me, I beseech thee, wherein thy greatest strength lieth, and what it is, wherewith if thou wert bound, thou couldst not break loose.\"},{\"verse\":7,\"text\":\"And Samson answered her: If I shall be bound with seven cords, made of sinews not yet dry, but still moist, I shall be weak like other men.\"},{\"verse\":8,\"text\":\"And the princes of the Philistines brought unto her seven cords, such as he spoke of, with which she bound him;\"},{\"verse\":9,\"text\":\"Men lying privately in wait with her, and in the chamber, expecting the event of the thing, and she cried out to him: The Philistines are upon thee, Samson. And he broke the bands, as a man would break a thread of tow twined with spittle, when it smelleth the fire: so it was not known wherein his strength lay.\"},{\"verse\":10,\"text\":\"And Dalila said to him: Behold thou hast mocked me, and hast told me a false thing: but now at least tell me wherewith thou mayest be bound.\"},{\"verse\":11,\"text\":\"And he answered her: If I shall be bound with new ropes, that were never in work, I shall be weak and like other men.\"},{\"verse\":12,\"text\":\"Dalila bound him again with these, and cried out: The Philistines are upon thee, Samson, there being an ambush prepared for him in the chamber. But he broke the bands like threads of webs.\"},{\"verse\":13,\"text\":\"And Dalila said to him again: How long dost thou deceive me, and tell me lies? Shew me wherewith thou mayest be bound. And Samson answered her: If thou plattest the seven locks of my head with a lace, and tying them round about a nail, fastenest it in the ground, I shall be weak.\"},{\"verse\":14,\"text\":\"And when Dalila had done this, she said to him: The Philistines are upon thee, Samson. And awaking out of his sleep, he drew out the nail with the hairs and the lace.\"},{\"verse\":15,\"text\":\"And Dalila said to him: How dost thou say thou lovest me, when thy mind is not with me? Thou hast told me lies these three times, and wouldst not tell me wherein thy greatest strength lieth.\"},{\"verse\":16,\"text\":\"And when she pressed him much, and continually hung upon him for many days, giving him no time to rest, his soul fainted away, and was wearied even unto death.\"},{\"verse\":17,\"text\":\"Then opening the truth of the thing, he said to her: The razor hath never come upon my head, for I am a Nazarite, that is to say, consecrated to God from my mother’s womb: If my head be shaven, my strength shall depart from me, and I shall become weak, and shall be like other men.\"},{\"verse\":18,\"text\":\"Then seeing that he had discovered to her all his mind, she sent to the princes of the Philistines, saying: Come up this once more, for now he hath opened his heart to me. And they went up, taking with them the money which they had promised.\"},{\"verse\":19,\"text\":\"But she made him sleep upon her knees, and lay his head in her bosom. And she called a barber and shaved his seven locks, and began to drive him away, and thrust him from her: for immediately his strength departed from him.\"},{\"verse\":20,\"text\":\"And she said: The Philistines are upon thee, Samson. And awaking from sleep, he said in his mind: I will go out as I did before, and shake myself, not knowing that the Lord was departed from him.\"},{\"verse\":21,\"text\":\"Then the Philistines seized upon him, and forthwith pulled out his eyes, and led him bound in chains to Gaza, and shutting him up in prison made him grind.\"},{\"verse\":22,\"text\":\"And now his hair began to grow again,\"},{\"verse\":23,\"text\":\"And the princes of the Philistines assembled together, to offer great sacrifices to Dagon their god, and to make merry, saying: Our god hath delivered our enemy Samson into our hands.\"},{\"verse\":24,\"text\":\"And the people also seeing this, praised their god, and said the same: Our god hath delivered our adversary into our hands, him that destroyed our country, and killed very many.\"},{\"verse\":25,\"text\":\"And rejoicing in their feasts, when they had now taken their good cheer, they commanded that Samson should be called, and should play before them. And being brought out of prison, he played before them; and they made him stand between two pillars.\"},{\"verse\":26,\"text\":\"And he said to the lad that guided his steps: Suffer me to touch the pillars which support the whole house, and let me lean upon them, and rest a little.\"},{\"verse\":27,\"text\":\"Now the house was full of men and women, and all the princes of the Philistines were there. Moreover about three thousand persons of both sexes, from the roof and the higher part of the house, were beholding Samson’s play.\"},{\"verse\":28,\"text\":\"But he called upon the Lord, saying: O Lord God remember me, and restore to me now my former strength, O my God, that I may revenge myself on my enemies, and for the loss of my two eyes I may take one revenge.\"},{\"verse\":29,\"text\":\"And laying hold on both the pillars on which the house rested, and holding the one with his right hand, and the other with his left,\"},{\"verse\":30,\"text\":\"He said: Let me die with the Philistines. And when he had strongly shook the pillars, the house fell upon all the princes, and the rest of the multitude, that was there: and he killed many more at his death, than he had killed before in his life.\"},{\"verse\":31,\"text\":\"And his brethren and all his kindred, going down took his body, and buried it between Saraa and Esthaol, in the buryingplace of his father Manue: and he judged Israel twenty years.\"}],\"vul\":[{\"verse\":1,\"text\":\"Abiit quoque in Gazam, et vidit ibi mulierem meretricem, ingressusque est ad eam.\"},{\"verse\":2,\"text\":\"Quod cum audissent Philisthiim, et percrebruisset apud eos intrasse urbem Samson, circumdederunt eum, positis in porta civitatis custodibus : et ibi tota nocte cum silentio præstolantes, ut facto mane exeuntem occiderent.\"},{\"verse\":3,\"text\":\"Dormivit autem Samson usque ad medium noctem : et inde consurgens, apprehendit ambas portæ fores cum postibus suis et sera, impositasque humeris suis portavit ad verticem montis, qui respicit Hebron.\"},{\"verse\":4,\"text\":\"Post hæc amavit mulierem, quæ habitabat in valle Sorec, et vocabatur Dalila.\"},{\"verse\":5,\"text\":\"Veneruntque ad eam principes Philisthinorum, atque dixerunt : Decipe eum, et disce ab illo, in quo habeat tantam fortitudinem, et quomodo eum superare valeamus, et vinctum affligere : quod si feceris, dabimus tibi singuli mille et centum argenteos.\"},{\"verse\":6,\"text\":\"Locuta est ergo Dalila ad Samson : Dic mihi, obsecro, in quo sit tua maxima fortitudo, et quid sit quo ligatus erumpere nequeas ?\"},{\"verse\":7,\"text\":\"Cui respondit Samson : Si septem nerviceis funibus necdum siccis, et adhuc humentibus, ligatus fuero, infirmus ero ut ceteri homines.\"},{\"verse\":8,\"text\":\"Attuleruntque ad eam satrapæ Philisthinorum septem funes, ut dixerat : quibus vinxit eam,\"},{\"verse\":9,\"text\":\"latentibus apud se insidiis, et in cubiculo finem rei expectantibus : clamavitque ad eum : Philisthiim super te, Samson. Qui rupit vincula, quomodo si rumpat quis filum de stuppæ tortum putamine, cum odorem ignis acceperit : et non est cognitum in quo esset fortitudo ejus.\"},{\"verse\":10,\"text\":\"Dixitque ad eum Dalila : Ecce illusisti mihi, et falsum locutus es : saltem nunc indica mihi quo ligari debeas.\"},{\"verse\":11,\"text\":\"Cui ille respondit : Si ligatus fuero novis funibus, qui numquam fuerunt in opere, infirmus ero, et aliorum hominum similis.\"},{\"verse\":12,\"text\":\"Quibus rursum Dalila vinxit eum, et clamavit : Philisthiim super te, Samson : in cubiculo insidiis præparatis. Qui ita rupit vincula quasi fila telarum.\"},{\"verse\":13,\"text\":\"Dixitque Dalila rursum ad eum : Usquequo decipis me, et falsum loqueris ? ostende quo vinciri debeas. Cui respondit Samson : Si septem crines capitis mei cum licio plexueris, et clavum his circumligatum terræ fixeris, infirmus ero.\"},{\"verse\":14,\"text\":\"Quod cum fecisset Dalila, dixit ad eum : Philisthiim super te, Samson. Qui consurgens de somno extraxit clavum cum crinibus et licio.\"},{\"verse\":15,\"text\":\"Dixitque ad eum Dalila : Quomodo dicis quod amas me, cum animus tuus non sit mecum ? Per tres vices mentitus es mihi, et noluisti dicere in quo sit maxima fortitudo tua.\"},{\"verse\":16,\"text\":\"Cumque molesta esset ei, et per multos dies jugiter adhæreret, spatium ad quietem non tribuens, defecit anima ejus, et ad mortem usque lassata est.\"},{\"verse\":17,\"text\":\"Tunc aperiens veritatem rei, dixit ad eam : Ferrum numquam ascendit super caput meum, quia nazaræus, id est, consecratus Deo, sum de utero matris meæ : si rasum fuerit caput meum, recedet a me fortitudo mea, et deficiam, eroque sicut ceteri homines.\"},{\"verse\":18,\"text\":\"Vidensque illa quod confessus ei esset omnem animum suum, misit ad principes Philisthinorum ac mandavit : Ascende adhuc semel, quia nunc mihi aperuit cor suum. Qui ascenderunt assumpta pecunia, quam promiserant.\"},{\"verse\":19,\"text\":\"At illa dormire eum fecit super genua sua, et in sinu suo reclinare caput. Vocavitque tonsorem, et rasit septem crines ejus, et cœpit abigere eum, et a se repellere : statim enim ab eo fortitudo discessit.\"},{\"verse\":20,\"text\":\"Dixitque : Philisthiim super te, Samson. Qui de somno consurgens, dixit in animo suo : Egrediar sicut ante feci, et me excutiam : nesciens quod recessisset ab eo Dominus.\"},{\"verse\":21,\"text\":\"Quem cum apprehendissent Philisthiim, statim eruerunt oculos ejus, et duxerunt Gazam vinctum catenis, et clausum in carcere molere fecerunt.\"},{\"verse\":22,\"text\":\"Jamque capilli ejus renasci cœperunt.\"},{\"verse\":23,\"text\":\"Et principes Philisthinorum convenerunt in unum ut immolarent hostias magnificas Dagon deo suo, et epularentur, dicentes : Tradidit deus noster inimicum nostrum Samson in manus nostras.\"},{\"verse\":24,\"text\":\"Quod etiam populus videns, laudabat deum suum, eademque dicebat : Tradidit deus noster adversarium nostrum in manus nostras, qui delevit terram nostram, et occidit plurimos.\"},{\"verse\":25,\"text\":\"Lætantesque per convivia, sumptis jam epulis, præceperunt ut vocaretur Samson, et ante eos luderet. Qui adductus de carcere ludebat ante eos, feceruntque eum stare inter duas columnas.\"},{\"verse\":26,\"text\":\"Qui dixit puero regenti gressus suos : Dimitte me, ut tangam columnas, quibus omnis imminet domus, et recliner super eas, et paululum requiescam.\"},{\"verse\":27,\"text\":\"Domus autem erat plena virorum ac mulierum, et erant ibi omnes principes Philisthinorum, ac de tecto et solario circiter tria millia utriusque sexus spectantes ludentem Samson.\"},{\"verse\":28,\"text\":\"At ille invocato Domino ait : Domine Deus, memento mei, et redde mihi nunc fortitudinem pristinam, Deus meus, ut ulciscar me de hostibus meis, et pro amissione duorum luminum unam ultionem recipiam.\"},{\"verse\":29,\"text\":\"Et apprehendens ambas columnas quibus innitebatur domus, alteramque earum dextera et alteram læva tenens,\"},{\"verse\":30,\"text\":\"ait : Moriatur anima mea cum Philisthiim. Concussisque fortiter columnis, cecidit domus super omnes principes, et ceteram multitudinem quæ ibi erat : multoque plures interfecit moriens, quam ante vivus occiderat.\"},{\"verse\":31,\"text\":\"Descendentes autem fratres ejus et universa cognatio, tulerunt corpus ejus, et sepelierunt inter Saraa et Esthaol in sepulchro patris sui Manue : judicavitque Israël viginti annis.\"}],\"summary\":\"Samson is deluded by Dalila: and falls into the hands of the Philistines. His death.\",\"intro\":null,\"prev\":{\"usfm\":\"JDG\",\"chapter\":15,\"label\":\"Judges 15\"},\"next\":{\"usfm\":\"JDG\",\"chapter\":17,\"label\":\"Judges 17\"}}]]\n"])</script></body></html>
