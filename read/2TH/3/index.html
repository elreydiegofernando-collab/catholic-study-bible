lass="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Thessalonians<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2TH/">About <!-- -->2 Thessalonians</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">He begs their prayers and warns them against idleness.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For the rest, brethren, pray for us that the word of God may run and may be glorified, even as among you:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And that we may be delivered from importunate and evil men: for all men have not faith.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But God is faithful, who will strengthen and keep you from evil.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And we have confidence concerning you in the Lord that the things which we command, you both do and will do.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the Lord direct your hearts, in the charity of God and the patience of Christ.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And we charge you, brethren, in the name of our Lord Jesus Christ, that you withdraw yourselves from every brother walking disorderly and not according to the tradition which they have received of us.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For yourselves know how you ought to imitate us. For we were not disorderly among you.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Neither did we eat any man’s bread for nothing: but in labour and in toil we worked night and day, lest we should be chargeable to any of you.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Not as if we had not power: but that we might give ourselves a pattern unto you, to imitate us.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For also, when we were with you, this we declared to you: that, if any man will not work, neither let him eat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For we have heard there are some among you who walk disorderly: working not at all, but curiously meddling.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now we charge them that are such and beseech them by the Lord Jesus Christ that, working with silence, they would eat their own bread.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But you, brethren, be not weary in well doing.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And if any man obey not our word by this epistle, note that man and do not keep company with him, that he may be ashamed.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Yet do not esteem him as an enemy but admonish him as a brother.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Now the Lord of peace himself give you everlasting peace in every place. The Lord be with you all.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The salutation of Paul with my own hand: which is the sign in every epistle. So I write.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The grace of our Lord Jesus Christ be with you all. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>De cetero fratres, orate pro nobis ut sermo Dei currat, et clarificetur, sicut et apud vos :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et ut liberemur ab importunis, et malis hominibus : non enim omnium est fides.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Fidelis autem Deus est, qui confirmabit vos, et custodiet a malo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Confidimus autem de vobis, in Domino, quoniam quæ præcepimus, et facitis, et facietis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dominus autem dirigat corda vestra in caritate Dei, et patientia Christi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Denuntiamus autem vobis, fratres, in nomine Domini nostri Jesu Christi, ut subtrahatis vos ab omni fratre ambulante inordinate, et non secundum traditionem, quam acceperunt a nobis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ipsi enim scitis quemadmodum oporteat imitari nos : quoniam non inquieti fuimus inter vos :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>neque gratis panem manducavimus ab aliquo, sed in labore, et in fatigatione, nocte et die operantes, ne quem vestrum gravaremus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non quasi non habuerimus potestatem, sed ut nosmetipsos formam daremus vobis ad imitandum nos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nam et cum essemus apud vos, hoc denuntiabamus vobis : quoniam si quis non vult operari, nec manducet.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Audivimus enim inter vos quosdam ambulare inquiete, nihil operantes, sed curiose agentes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Iis autem, qui ejusmodi sunt, denuntiemus, et obsecramus in Domino Jesu Christo, ut cum silentio operantes, suum panem manducent.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vos autem, fratres, nolite deficere benefacientes.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quod si quis non obedit verbo nostro per epistolam, hunc notate, et ne commisceamini cum illo ut confundatur :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et nolite quasi inimicum existimare, sed corripite ut fratrem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ipse autem Dominus pacis det vobis pacem sempiternam in omni loco. Dominus sit cum omnibus vobis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Salutatio, mea manu Pauli : quod est signum in omni epistola, ita scribo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Gratia Domini nostri Jesu Christi cum omnibus vobis. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2TH/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Thessalonians 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1TI/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 Timothy 1</span></spa selves from every brother walking disorderly and not according to the tradition which they have received of us.\"},{\"verse\":7,\"text\":\"For yourselves know how you ought to imitate us. For we were not disorderly among you.\"},{\"verse\":8,\"text\":\"Neither did we eat any man’s bread for nothing: but in labour and in toil we worked night and day, lest we should be chargeable to any of you.\"},{\"verse\":9,\"text\":\"Not as if we had not power: but that we might give ourselves a pattern unto you, to imitate us.\"},{\"verse\":10,\"text\":\"For also, when we were with you, this we declared to you: that, if any man will not work, neither let him eat.\"},{\"verse\":11,\"text\":\"For we have heard there are some among you who walk disorderly: working not at all, but curiously meddling.\"},{\"verse\":12,\"text\":\"Now we charge them that are such and beseech them by the Lord Jesus Christ that, working with silence, they would eat their own bread.\"},{\"verse\":13,\"text\":\"But you, brethren, be not weary in well doing.\"},{\"verse\":14,\"text\":\"And if any man obey not our word by this epistle, note that man and do not keep company with him, that he may be ashamed.\"},{\"verse\":15,\"text\":\"Yet do not esteem him as an enemy but admonish him as a brother.\"},{\"verse\":16,\"text\":\"Now the Lord of peace himself give you everlasting peace in every place. The Lord be with you all.\"},{\"verse\":17,\"text\":\"The salutation of Paul with my own hand: which is the sign in every epistle. So I write.\"},{\"verse\":18,\"text\":\"The grace of our Lord Jesus Christ be with you all. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"De cetero fratres, orate pro nobis ut sermo Dei currat, et clarificetur, sicut et apud vos :\"},{\"verse\":2,\"text\":\"et ut liberemur ab importunis, et malis hominibus : non enim omnium est fides.\"},{\"verse\":3,\"text\":\"Fidelis autem Deus est, qui confirmabit vos, et custodiet a malo.\"},{\"verse\":4,\"text\":\"Confidimus autem de vobis, in Domino, quoniam quæ præcepimus, et facitis, et facietis.\"},{\"verse\":5,\"text\":\"Dominus autem dirigat corda vestra in caritate Dei, et patientia Christi.\"},{\"verse\":6,\"text\":\"Denuntiamus autem vobis, fratres, in nomine Domini nostri Jesu Christi, ut subtrahatis vos ab omni fratre ambulante inordinate, et non secundum traditionem, quam acceperunt a nobis.\"},{\"verse\":7,\"text\":\"Ipsi enim scitis quemadmodum oporteat imitari nos : quoniam non inquieti fuimus inter vos :\"},{\"verse\":8,\"text\":\"neque gratis panem manducavimus ab aliquo, sed in labore, et in fatigatione, nocte et die operantes, ne quem vestrum gravaremus.\"},{\"verse\":9,\"text\":\"Non quasi non habuerimus potestatem, sed ut nosmetipsos formam daremus vobis ad imitandum nos.\"},{\"verse\":10,\"text\":\"Nam et cum essemus apud vos, hoc denuntiabamus vobis : quoniam si quis non vult operari, nec manducet.\"},{\"verse\":11,\"text\":\"Audivimus enim inter vos quosdam ambulare inquiete, nihil operantes, sed curiose agentes.\"},{\"verse\":12,\"text\":\"Iis autem, qui ejusmodi sunt, denuntiemus, et obsecramus in Domino Jesu Christo, ut cum silentio operantes, suum panem manducent.\"},{\"verse\":13,\"text\":\"Vos autem, fratres, nolite deficere benefacientes.\"},{\"verse\":14,\"text\":\"Quod si quis non obedit verbo nostro per epistolam, hunc notate, et ne commisceamini cum illo ut confundatur :\"},{\"verse\":15,\"text\":\"et nolite quasi inimicum existimare, sed corripite ut fratrem.\"},{\"verse\":16,\"text\":\"Ipse autem Dominus pacis det vobis pacem sempiternam in omni loco. Dominus sit cum omnibus vobis.\"},{\"verse\":17,\"text\":\"Salutatio, mea manu Pauli : quod est signum in omni epistola, ita scribo.\"},{\"verse\":18,\"text\":\"Gratia Domini nostri Jesu Christi cum omnibus vobis. Amen.\"}],\"summary\":\"He begs their prayers and warns them against idleness.\",\"intro\":null,\"prev\":{\"usfm\":\"2TH\",\"chapter\":2,\"label\":\"2 Thessalonians 2\"},\"next\":{\"usfm\":\"1TI\",\"chapter\":1,\"label\":\"1 Timothy 1\"}}]]\n"])</script></body></html>
