[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Matthew<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MAT/">About <!-- -->Matthew</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A continuation of the sermon on the mount.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Take heed that you do not your justice before men, to be seen by them: otherwise you shall not have a reward of your Father who is in heaven.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Therefore when thou dost an alms-deed, sound not a trumpet before thee, as the hypocrites do in the synagogues and in the streets, that they may be honoured by men. Amen I say to you, they have received their reward.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But when thou dost alms, let not thy left hand know what thy right hand doth.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>That thy alms may be in secret, and thy Father who seeth in secret will repay thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when ye pray, you shall not be as the hypocrites, that love to stand and pray in the synagogues and corners of the streets, that they may be seen by men: Amen I say to you, they have received their reward.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But thou when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret, and thy father who seeth in secret will repay thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when you are praying, speak not much, as the heathens. For they think that in their much speaking they may be heard.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Be not you therefore like to them for your Father knoweth what is needful for you, before you ask him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thus therefore shall you pray: Our Father who art in heaven, hallowed be thy name.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thy kingdom come. Thy will be done on earth as it is in heaven.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Give us this day our supersubstantial bread.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And forgive us our debts, as we also forgive our debtors.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And lead us not into temptation. But deliver us from evil. Amen.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For if you will forgive men their offences, your heavenly Father will forgive you also your offences.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But if you will not forgive men, neither will your Father forgive you your offences.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when you fast, be not as the hypocrites, sad. For they disfigure their faces, that they may appear unto men to fast. Amen I say to you, they have received their reward.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But thou, when thou fastest anoint thy head, and wash thy face;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>That thou appear not to men to fast, but to thy Father who is in secret: and thy Father who seeth in secret, will repay thee.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Lay not up to yourselves treasures on earth: where the rust, and moth consume, and where thieves break through, and steal.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But lay up to yourselves treasures in heaven: where neither the rust nor moth doth consume, and where thieves do not break through, nor steal.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For where thy treasure is, there is thy heart also.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The light of thy body is thy eye. If thy eye be single, thy whole body shall be lightsome.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But if thy eye be evil thy whole body shall be darksome. If then the light that is in thee, be darkness: the darkness itself how great shall it be!</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>No man can serve two masters. For either he will hate the one, and love the other: or he will sustain the one, and despise the other. You cannot serve God and mammon.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Therefore I say to you, be not solicitous for your life, what you shall eat, nor for your body, what you shall put on. Is not the life more than the meat: and the body more than the raiment?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Behold the birds of the air, for they neither sow, nor do they reap, nor gather into barns: and your heavenly Father feedeth them. Are not you of much more value than they?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And which of you by taking thought, can add to his stature one cubit?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And for raiment why are you solicitous? Consider the lilies of the field, how they grow: they labour not, neither do they spin.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But I say to you, that not even Solomon in all his glory was arrayed as one of these.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And if the grass of the field, which is to day, and to morrow is cast into the oven, God doth so clothe: how much more you, O ye of little faith?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Be not solicitous therefore, saying: What shall we eat: or what shall we drink, or wherewith shall we be clothed?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For after all these things do the heathens seek. For your Father knoweth that you have need of all these things.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Seek ye therefore first the kingdom of God, and his justice, and all these things shall be added unto you.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Be not therefore solicitous for to morrow; for the morrow will be solicitous for itself. Sufficient for the day is the evil thereof.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Attendite ne justitiam vestram faciatis coram hominibus, ut videamini ab eis : alioquin mercedem non habebitis apud Patrem vestrum qui in cælis est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cum ergo facis eleemosynam, noli tuba canere ante te, sicut hypocritæ faciunt in synagogis, et in vicis, ut honorificentur ab hominibus. Amen dico vobis, receperunt mercedem suam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Te autem faciente eleemosynam, nesciat sinistra tua quid faciat dextera tua :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ut sit eleemosyna tua in abscondito, et Pater tuus, qui videt in abscondito, reddet tibi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et cum oratis, non eritis sicut hypocritæ qui amant in synagogis et in angulis platearum stantes orare, ut videantur ab hominibus : amen dico vobis, receperunt mercedem suam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tu autem cum oraveris, intra in cubiculum tuum, et clauso ostio, ora Patrem tuum in abscondito : et Pater tuus, qui videt in abscondito, reddet tibi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Orantes autem, nolite multum loqui, sicut ethnici, putant enim quod in multiloquio suo exaudiantur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nolite ergo assimilari eis : scit enim Pater vester, quid opus sit vobis, antequam petatis eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sic ergo vos orabitis : Pater noster, qui es in cælis, sanctificetur nomen tuum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Adveniat regnum tuum ; fiat voluntas tua, sicut in cælo et in terra.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Panem nostrum supersubstantialem da nobis hodie,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et ne nos inducas in tentationem, sed libera nos a malo. Amen.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si enim dimiseritis hominibus peccata eorum : dimittet et vobis Pater vester cælestis delicta vestra.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si autem non dimiseritis hominibus : nec Pater vester dimittet vobis peccata vestra.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cum autem jejunatis, nolite fieri sicut hypocritæ, tristes. Exterminant enim facies suas, ut appareant hominibus jejunantes. Amen dico vobis, quia receperunt mercedem suam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tu autem, cum jejunas, unge caput tuum, et faciem tuam lava,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ne videaris hominibus jejunans, sed Patri tuo, qui est in abscondito : et Pater tuus, qui videt in abscondito, reddet tibi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Nolite thesaurizare vobis thesauros in terra : ubi ærugo, et tinea demolitur : et ubi fures effodiunt, et furantur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thesaurizate autem vobis thesauros in cælo, ubi neque ærugo, neque tinea demolitur, et ubi fures non effodiunt, nec furantur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ubi enim est thesaurus tuus, ibi est et cor tuum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Lucerna corporis tui est oculus tuus. Si oculus tuus fuerit simplex, totum corpus tuum lucidum erit.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si autem oculus tuus fuerit nequam, totum corpus tuum tenebrosum erit. Si ergo lumen, quod in te est, tenebræ sunt : ipsæ tenebræ quantæ erunt ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nemo potest duobus dominis servire : aut enim unum odio habebit, et alterum diliget : aut unum sustinebit, et alterum contemnet. Non potestis Deo servire et mammonæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ideo dico vobis, ne solliciti sitis animæ vestræ quid manducetis, neque corpori vestro quid induamini. Nonne anima plus est quam esca, et corpus plus quam vestimentum ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Respicite volatilia cæli, quoniam non serunt, neque metunt, neque congregant in horrea : et Pater vester cælestis pascit illa. Nonne vos magis pluris estis illis ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quis autem vestrum cogitans potest adjicere ad staturam suam cubitum unum ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et de vestimento quid solliciti estis ? Considerate lilia agri quomodo crescunt : non laborant, neque nent.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dico autem vobis, quoniam nec Salomon in omni gloria sua coopertus est sicut unum ex istis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Si autem fœnum agri, quod hodie est, et cras in clibanum mittitur, Deus sic vestit, quanto magis vos modicæ fidei ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Nolite ergo solliciti esse, dicentes : Quid manducabimus, aut quid bibemus, aut quo operiemur ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>hæc enim omnia gentes inquirunt. Scit enim Pater vester, quia his omnibus indigetis.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quærite ergo primum regnum Dei, et justitiam ejus : et hæc omnia adjicientur vobis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Nolite ergo solliciti esse in crastinum. Crastinus enim dies sollicitus erit sibi ipsi : sufficit diei malitia sua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Matthew 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Matthew 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Matthew 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/5/"><svg vi ><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MAT.6\",{\"bookId\":47,\"usfm\":\"MAT\",\"bookName\":\"Matthew\",\"drName\":\"Matthew\",\"chapter\":6,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"Take heed that you do not your justice before men, to be seen by them: otherwise you shall not have a reward of your Father who is in heaven.\"},{\"verse\":2,\"text\":\"Therefore when thou dost an alms-deed, sound not a trumpet before thee, as the hypocrites do in the synagogues and in the streets, that they may be honoured by men. Amen I say to you, they have received their reward.\"},{\"verse\":3,\"text\":\"But when thou dost alms, let not thy left hand know what thy right hand doth.\"},{\"verse\":4,\"text\":\"That thy alms may be in secret, and thy Father who seeth in secret will repay thee.\"},{\"verse\":5,\"text\":\"And when ye pray, you shall not be as the hypocrites, that love to stand and pray in the synagogues and corners of the streets, that they may be seen by men: Amen I say to you, they have received their reward.\"},{\"verse\":6,\"text\":\"But thou when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret, and thy father who seeth in secret will repay thee.\"},{\"verse\":7,\"text\":\"And when you are praying, speak not much, as the heathens. For they think that in their much speaking they may be heard.\"},{\"verse\":8,\"text\":\"Be not you therefore like to them for your Father knoweth what is needful for you, before you ask him.\"},{\"verse\":9,\"text\":\"Thus therefore shall you pray: Our Father who art in heaven, hallowed be thy name.\"},{\"verse\":10,\"text\":\"Thy kingdom come. Thy will be done on earth as it is in heaven.\"},{\"verse\":11,\"text\":\"Give us this day our supersubstantial bread.\"},{\"verse\":12,\"text\":\"And forgive us our debts, as we also forgive our debtors.\"},{\"verse\":13,\"text\":\"And lead us not into temptation. But deliver us from evil. Amen.\"},{\"verse\":14,\"text\":\"For if you will forgive men their offences, your heavenly Father will forgive you also your offences.\"},{\"verse\":15,\"text\":\"But if you will not forgive men, neither will your Father forgive you your offences.\"},{\"verse\":16,\"text\":\"And when you fast, be not as the hypocrites, sad. For they disfigure their faces, that they may appear unto men to fast. Amen I say to you, they have received their reward.\"},{\"verse\":17,\"text\":\"But thou, when thou fastest anoint thy head, and wash thy face;\"},{\"verse\":18,\"text\":\"That thou appear not to men to fast, but to thy Father who is in secret: and thy Father who seeth in secret, will repay thee.\"},{\"verse\":19,\"text\":\"Lay not up to yourselves treasures on earth: where the rust, and moth consume, and where thieves break through, and steal.\"},{\"verse\":20,\"text\":\"But lay up to yourselves treasures in heaven: where neither the rust nor moth doth consume, and where thieves do not break through, nor steal.\"},{\"verse\":21,\"text\":\"For where thy treasure is, there is thy heart also.\"},{\"verse\":22,\"text\":\"The light of thy body is thy eye. If thy eye be single, thy whole body shall be lightsome.\"},{\"verse\":23,\"text\":\"But if thy eye be evil thy whole body shall be darksome. If then the light that is in thee, be darkness: the darkness itself how great shall it be!\"},{\"verse\":24,\"text\":\"No man can serve two masters. For either he will hate the one, and love the other: or he will sustain the one, and despise the other. You cannot serve God and mammon.\"},{\"verse\":25,\"text\":\"Therefore I say to you, be not solicitous for your life, what you shall eat, nor for your body, what you shall put on. Is not the life more than the meat: and the body more than the raiment?\"},{\"verse\":26,\"text\":\"Behold the birds of the air, for they neither sow, nor do they reap, nor gather into barns: and your heavenly Father feedeth them. Are not you of much more value than they?\"},{\"verse\":27,\"text\":\"And which of you by taking thought, can add to his stature one cubit?\"},{\"verse\":28,\"text\":\"And for raiment why are you solicitous? Consider the lilies of the field, how they grow: they labour not, neither do they spin.\"},{\"verse\":29,\"text\":\"But I say to you, that not even Solomon in all his glory was arrayed as one of these.\"},{\"verse\":30,\"text\":\"And if the grass of the field, which is to day, and to morrow is cast into the oven, God doth so clothe: how much more you, O ye of little faith?\"},{\"verse\":31,\"text\":\"Be not solicitous therefore, saying: What shall we eat: or what shall we drink, or wherewith shall we be clothed?\"},{\"verse\":32,\"text\":\"For after all these things do the heathens seek. For your Father knoweth that you have need of all these things.\"},{\"verse\":33,\"text\":\"Seek ye therefore first the kingdom of God, and his justice, and all these things shall be added unto you.\"},{\"verse\":34,\"text\":\"Be not therefore solicitous for to morrow; for the morrow will be solicitous for itself. Sufficient for the day is the evil thereof.\"}],\"vul\":[{\"verse\":1,\"text\":\"Attendite ne justitiam vestram faciatis coram hominibus, ut videamini ab eis : alioquin mercedem non habebitis apud Patrem vestrum qui in cælis est.\"},{\"verse\":2,\"text\":\"Cum ergo facis eleemosynam, noli tuba canere ante te, sicut hypocritæ faciunt in synagogis, et in vicis, ut honorificentur ab hominibus. Amen dico vobis, receperunt mercedem suam.\"},{\"verse\":3,\"text\":\"Te autem faciente eleemosynam, nesciat sinistra tua quid faciat dextera tua :\"},{\"verse\":4,\"text\":\"ut sit eleemosyna tua in abscondito, et Pater tuus, qui videt in abscondito, reddet tibi.\"},{\"verse\":5,\"text\":\"Et cum oratis, non eritis sicut hypocritæ qui amant in synagogis et in angulis platearum stantes orare, ut videantur ab hominibus : amen dico vobis, receperunt mercedem suam.\"},{\"verse\":6,\"text\":\"Tu autem cum oraveris, intra in cubiculum tuum, et clauso ostio, ora Patrem tuum in abscondito : et Pater tuus, qui videt in abscondito, reddet tibi.\"},{\"verse\":7,\"text\":\"Orantes autem, nolite multum loqui, sicut ethnici, putant enim quod in multiloquio suo exaudiantur.\"},{\"verse\":8,\"text\":\"Nolite ergo assimilari eis : scit enim Pater vester, quid opus sit vobis, antequam petatis eum.\"},{\"verse\":9,\"text\":\"Sic ergo vos orabitis : Pater noster, qui es in cælis, sanctificetur nomen tuum.\"},{\"verse\":10,\"text\":\"Adveniat regnum tuum ; fiat voluntas tua, sicut in cælo et in terra.\"},{\"verse\":11,\"text\":\"Panem nostrum supersubstantialem da nobis hodie,\"},{\"verse\":12,\"text\":\"et dimitte nobis debita nostra, sicut et nos dimittimus debitoribus nostris.\"},{\"verse\":13,\"text\":\"Et ne nos inducas in tentationem, sed libera nos a malo. Amen.\"},{\"verse\":14,\"text\":\"Si enim dimiseritis hominibus peccata eorum : dimittet et vobis Pater vester cælestis delicta vestra.\"},{\"verse\":15,\"text\":\"Si autem non dimiseritis hominibus : nec Pater vester dimittet vobis peccata vestra.\"},{\"verse\":16,\"text\":\"Cum autem jejunatis, nolite fieri sicut hypocritæ, tristes. Exterminant enim facies suas, ut appareant hominibus jejunantes. Amen dico vobis, quia receperunt mercedem suam.\"},{\"verse\":17,\"text\":\"Tu autem, cum jejunas, unge caput tuum, et faciem tuam lava,\"},{\"verse\":18,\"text\":\"ne videaris hominibus jejunans, sed Patri tuo, qui est in abscondito : et Pater tuus, qui videt in abscondito, reddet tibi.\"},{\"verse\":19,\"text\":\"Nolite thesaurizare vobis thesauros in terra : ubi ærugo, et tinea demolitur : et ubi fures effodiunt, et furantur.\"},{\"verse\":20,\"text\":\"Thesaurizate autem vobis thesauros in cælo, ubi neque ærugo, neque tinea demolitur, et ubi fures non effodiunt, nec furantur.\"},{\"verse\":21,\"text\":\"Ubi enim est thesaurus tuus, ibi est et cor tuum.\"},{\"verse\":22,\"text\":\"Lucerna corporis tui est oculus tuus. Si oculus tuus fuerit simplex, totum corpus tuum lucidum erit.\"},{\"verse\":23,\"text\":\"Si autem oculus tuus fuerit nequam, totum corpus tuum tenebrosum erit. Si ergo lumen, quod in te est, tenebræ sunt : ipsæ tenebræ quantæ erunt ?\"},{\"verse\":24,\"text\":\"Nemo potest duobus dominis servire : aut enim unum odio habebit, et alterum diliget : aut unum sustinebit, et alterum contemnet. Non potestis Deo servire et mammonæ.\"},{\"verse\":25,\"text\":\"Ideo dico vobis, ne solliciti sitis animæ vestræ quid manducetis, neque corpori vestro quid induamini. Nonne anima plus est quam esca, et corpus plus quam vestimentum ?\"},{\"verse\":26,\"text\":\"Respicite volatilia cæli, quoniam non serunt, neque metunt, neque congregant in horrea : et Pater vester cælestis pascit illa. Nonne vos magis pluris estis illis ?\"},{\"verse\":27,\"text\":\"Quis autem vestrum cogitans potest adjicere ad staturam suam cubitum unum ?\"},{\"verse\":28,\"text\":\"Et de vestimento quid solliciti estis ? Considerate lilia agri quomodo crescunt : non laborant, neque nent.\"},{\"verse\":29,\"text\":\"Dico autem vobis, quoniam nec Salomon in omni gloria sua coopertus est sicut unum ex istis.\"},{\"verse\":30,\"text\":\"Si autem fœnum agri, quod hodie est, et cras in clibanum mittitur, Deus sic vestit, quanto magis vos modicæ fidei ?\"},{\"verse\":31,\"text\":\"Nolite ergo solliciti esse, dicentes : Quid manducabimus, aut quid bibemus, aut quo operiemur ?\"},{\"verse\":32,\"text\":\"hæc enim omnia gentes inquirunt. Scit enim Pater vester, quia his omnibus indigetis.\"},{\"verse\":33,\"text\":\"Quærite ergo primum regnum Dei, et justitiam ejus : et hæc omnia adjicientur vobis.\"},{\"verse\":34,\"text\":\"Nolite ergo solliciti esse in crastinum. Crastinus enim dies sollicitus erit sibi ipsi : sufficit diei malitia sua.\"}],\"summary\":\"A continuation of the sermon on the mount.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":5,\"label\":\"Matthew 5\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":7,\"label\":\"Matthew 7\"}}]]\n"])</script></body></html>
