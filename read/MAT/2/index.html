aria-pressed="false" class="verse"><sup>2</sup>Saying: Where is he that is born king of the Jews? For we have seen his star in the East, and are come to adore him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And king Herod hearing this, was troubled, and all Jerusalem with him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And assembling together all the chief priests and the scribes of the people, he inquired of them where Christ should be born.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But they said to him: In Bethlehem of Juda. For so it is written by the prophet:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And thou Bethlehem the land of Juda art not the least among the princes of Juda: for out of thee shall come forth the captain that shall rule my people Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then Herod, privately calling the wise men learned diligently of them the time of the star which appeared to them;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And sending them into Bethlehem, said: Go and diligently inquire after the child, and when you have found him, bring me word again, that I also may come and adore him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who having heard the king, went their way; and behold the star which they had seen in the East, went before them, until it came and stood over where the child was.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And seeing the star they rejoiced with exceeding great joy.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And entering into the house, they found the child with Mary his mother, and falling down they adored him: and opening their treasures, they offered him gifts; gold, frankincense, and myrrh.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And having received an answer in sleep that they should not return to Herod, they went back another way into their country.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And after they were departed, behold an angel of the Lord appeared in sleep to Joseph, saying: Arise, and take the child and his mother, and fly into Egypt: and be there until I shall tell thee. For it will come to pass that Herod will seek the child to destroy him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Who arose, and took the child and his mother by night, and retired into Egypt: and he was there until the death of Herod:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>That it might be fulfilled which the Lord spoke by the prophet, saying: Out of Egypt have I called my son.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then Herod perceiving that he was deluded by the wise men, was exceeding angry: and sending killed all the menchildren that were in Bethlehem, and in all the borders thereof, from two years old and under, according to the time which he had diligently inquired of the wise men.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then was fulfilled that which was spoken by Jeremias the prophet, saying:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A voice in Rama was heard, lamentation and great mourning; Rachel bewailing her children, and would not be comforted, because they are not.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But when Herod was dead, behold an angel of the Lord appeared in sleep to Joseph in Egypt,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Saying: Arise, and take the child and his mother, and go into the land of Israel. For they are dead that sought the life of the child.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Who arose, and took the child and his mother, and came into the land of Israel.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But hearing that Archelaus reigned in Judea in the room of Herod his father, he was afraid to go thither: and being warned in sleep retired into the quarters of Galilee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And coming he dwelt in a city called Nazareth: that it might be fulfilled which was said by the prophets: That he shall be called a Nazarene.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cum ergo natus esset Jesus in Bethlehem Juda in diebus Herodis regis, ecce magi ab oriente venerunt Jerosolymam,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>dicentes : Ubi est qui natus est rex Judæorum ? vidimus enim stellam ejus in oriente, et venimus adorare eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Audiens autem Herodes rex, turbatus est, et omnis Jerosolyma cum illo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et congregans omnes principes sacerdotum, et scribas populi, sciscitabatur ab eis ubi Christus nasceretur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>At illi dixerunt : In Bethlehem Judæ : sic enim scriptum est per prophetam :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et tu Bethlehem terra Juda, nequaquam minima es in principibus Juda : ex te enim exiet dux, qui regat populum meum Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tunc Herodes clam vocatis magis diligenter didicit ab eis tempus stellæ, quæ apparuit eis :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et mittens illos in Bethlehem, dixit : Ite, et interrogate diligenter de puero : et cum inveneritis, renuntiate mihi, ut et ego veniens adorem eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui cum audissent regem, abierunt, et ecce stella, quam viderant in oriente, antecedebat eos, usque dum veniens staret supra, ubi erat puer.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Videntes autem stellam gavisi sunt gaudio magno valde.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et intrantes domum, invenerunt puerum cum Maria matre ejus, et procidentes adoraverunt eum : et apertis thesauris suis obtulerunt ei munera, aurum, thus, et myrrham.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et responso accepto in somnis ne redirent ad Herodem, per aliam viam reversi sunt in regionem suam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui cum recessissent, ecce angelus Domini apparuit in somnis Joseph, dicens : Surge, et accipe puerum, et matrem ejus, et fuge in Ægyptum, et esto ibi usque dum dicam tibi. Futurum est enim ut Herodes quærat puerum ad perdendum eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui consurgens accepit puerum et matrem ejus nocte, et secessit in Ægyptum :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et erat ibi usque ad obitum Herodis : ut adimpleretur quod dictum est a Domino per prophetam dicentem : Ex Ægypto vocavi filium meum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tunc Herodes videns quoniam illusus esset a magis, iratus est valde, et mittens occidit omnes pueros, qui erant in Bethlehem, et in omnibus finibus ejus, a bimatu et infra secundum tempus, quod exquisierat a magis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tunc adimpletum est quod dictum est per Jeremiam prophetam dicentem :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vox in Rama audita est ploratus, et ululatus multus : Rachel plorans filios suos, et noluit consolari, quia non sunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Defuncto autem Herode, ecce angelus Domini apparuit in somnis Joseph in Ægypto,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>dicens : Surge, et accipe puerum, et matrem ejus, et vade in terram Israël : defuncti sunt enim qui quærebant animam pueri.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui consurgens, accepit puerum, et matrem ejus, et venit in terram Israël.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Audiens autem quod Archelaus regnaret in Judæa pro Herode patre suo, timuit illo ire : et admonitus in somnis, secessit in partes Galilææ.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et veniens habitavit in civitate quæ vocatur Nazareth : ut adimpleretur quod dictum est per prophetas : Quoniam Nazaræus vocabitur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Prev xt\":\"When Jesus therefore was born in Bethlehem of Juda, in the days of king Herod, behold, there came wise men from the East to Jerusalem,\"},{\"verse\":2,\"text\":\"Saying: Where is he that is born king of the Jews? For we have seen his star in the East, and are come to adore him.\"},{\"verse\":3,\"text\":\"And king Herod hearing this, was troubled, and all Jerusalem with him.\"},{\"verse\":4,\"text\":\"And assembling together all the chief priests and the scribes of the people, he inquired of them where Christ should be born.\"},{\"verse\":5,\"text\":\"But they said to him: In Bethlehem of Juda. For so it is written by the prophet:\"},{\"verse\":6,\"text\":\"And thou Bethlehem the land of Juda art not the least among the princes of Juda: for out of thee shall come forth the captain that shall rule my people Israel.\"},{\"verse\":7,\"text\":\"Then Herod, privately calling the wise men learned diligently of them the time of the star which appeared to them;\"},{\"verse\":8,\"text\":\"And sending them into Bethlehem, said: Go and diligently inquire after the child, and when you have found him, bring me word again, that I also may come and adore him.\"},{\"verse\":9,\"text\":\"Who having heard the king, went their way; and behold the star which they had seen in the East, went before them, until it came and stood over where the child was.\"},{\"verse\":10,\"text\":\"And seeing the star they rejoiced with exceeding great joy.\"},{\"verse\":11,\"text\":\"And entering into the house, they found the child with Mary his mother, and falling down they adored him: and opening their treasures, they offered him gifts; gold, frankincense, and myrrh.\"},{\"verse\":12,\"text\":\"And having received an answer in sleep that they should not return to Herod, they went back another way into their country.\"},{\"verse\":13,\"text\":\"And after they were departed, behold an angel of the Lord appeared in sleep to Joseph, saying: Arise, and take the child and his mother, and fly into Egypt: and be there until I shall tell thee. For it will come to pass that Herod will seek the child to destroy him.\"},{\"verse\":14,\"text\":\"Who arose, and took the child and his mother by night, and retired into Egypt: and he was there until the death of Herod:\"},{\"verse\":15,\"text\":\"That it might be fulfilled which the Lord spoke by the prophet, saying: Out of Egypt have I called my son.\"},{\"verse\":16,\"text\":\"Then Herod perceiving that he was deluded by the wise men, was exceeding angry: and sending killed all the menchildren that were in Bethlehem, and in all the borders thereof, from two years old and under, according to the time which he had diligently inquired of the wise men.\"},{\"verse\":17,\"text\":\"Then was fulfilled that which was spoken by Jeremias the prophet, saying:\"},{\"verse\":18,\"text\":\"A voice in Rama was heard, lamentation and great mourning; Rachel bewailing her children, and would not be comforted, because they are not.\"},{\"verse\":19,\"text\":\"But when Herod was dead, behold an angel of the Lord appeared in sleep to Joseph in Egypt,\"},{\"verse\":20,\"text\":\"Saying: Arise, and take the child and his mother, and go into the land of Israel. For they are dead that sought the life of the child.\"},{\"verse\":21,\"text\":\"Who arose, and took the child and his mother, and came into the land of Israel.\"},{\"verse\":22,\"text\":\"But hearing that Archelaus reigned in Judea in the room of Herod his father, he was afraid to go thither: and being warned in sleep retired into the quarters of Galilee.\"},{\"verse\":23,\"text\":\"And coming he dwelt in a city called Nazareth: that it might be fulfilled which was said by the prophets: That he shall be called a Nazarene.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cum ergo natus esset Jesus in Bethlehem Juda in diebus Herodis regis, ecce magi ab oriente venerunt Jerosolymam,\"},{\"verse\":2,\"text\":\"dicentes : Ubi est qui natus est rex Judæorum ? vidimus enim stellam ejus in oriente, et venimus adorare eum.\"},{\"verse\":3,\"text\":\"Audiens autem Herodes rex, turbatus est, et omnis Jerosolyma cum illo.\"},{\"verse\":4,\"text\":\"Et congregans omnes principes sacerdotum, et scribas populi, sciscitabatur ab eis ubi Christus nasceretur.\"},{\"verse\":5,\"text\":\"At illi dixerunt : In Bethlehem Judæ : sic enim scriptum est per prophetam :\"},{\"verse\":6,\"text\":\"Et tu Bethlehem terra Juda, nequaquam minima es in principibus Juda : ex te enim exiet dux, qui regat populum meum Israël.\"},{\"verse\":7,\"text\":\"Tunc Herodes clam vocatis magis diligenter didicit ab eis tempus stellæ, quæ apparuit eis :\"},{\"verse\":8,\"text\":\"et mittens illos in Bethlehem, dixit : Ite, et interrogate diligenter de puero : et cum inveneritis, renuntiate mihi, ut et ego veniens adorem eum.\"},{\"verse\":9,\"text\":\"Qui cum audissent regem, abierunt, et ecce stella, quam viderant in oriente, antecedebat eos, usque dum veniens staret supra, ubi erat puer.\"},{\"verse\":10,\"text\":\"Videntes autem stellam gavisi sunt gaudio magno valde.\"},{\"verse\":11,\"text\":\"Et intrantes domum, invenerunt puerum cum Maria matre ejus, et procidentes adoraverunt eum : et apertis thesauris suis obtulerunt ei munera, aurum, thus, et myrrham.\"},{\"verse\":12,\"text\":\"Et responso accepto in somnis ne redirent ad Herodem, per aliam viam reversi sunt in regionem suam.\"},{\"verse\":13,\"text\":\"Qui cum recessissent, ecce angelus Domini apparuit in somnis Joseph, dicens : Surge, et accipe puerum, et matrem ejus, et fuge in Ægyptum, et esto ibi usque dum dicam tibi. Futurum est enim ut Herodes quærat puerum ad perdendum eum.\"},{\"verse\":14,\"text\":\"Qui consurgens accepit puerum et matrem ejus nocte, et secessit in Ægyptum :\"},{\"verse\":15,\"text\":\"et erat ibi usque ad obitum Herodis : ut adimpleretur quod dictum est a Domino per prophetam dicentem : Ex Ægypto vocavi filium meum.\"},{\"verse\":16,\"text\":\"Tunc Herodes videns quoniam illusus esset a magis, iratus est valde, et mittens occidit omnes pueros, qui erant in Bethlehem, et in omnibus finibus ejus, a bimatu et infra secundum tempus, quod exquisierat a magis.\"},{\"verse\":17,\"text\":\"Tunc adimpletum est quod dictum est per Jeremiam prophetam dicentem :\"},{\"verse\":18,\"text\":\"Vox in Rama audita est ploratus, et ululatus multus : Rachel plorans filios suos, et noluit consolari, quia non sunt.\"},{\"verse\":19,\"text\":\"Defuncto autem Herode, ecce angelus Domini apparuit in somnis Joseph in Ægypto,\"},{\"verse\":20,\"text\":\"dicens : Surge, et accipe puerum, et matrem ejus, et vade in terram Israël : defuncti sunt enim qui quærebant animam pueri.\"},{\"verse\":21,\"text\":\"Qui consurgens, accepit puerum, et matrem ejus, et venit in terram Israël.\"},{\"verse\":22,\"text\":\"Audiens autem quod Archelaus regnaret in Judæa pro Herode patre suo, timuit illo ire : et admonitus in somnis, secessit in partes Galilææ.\"},{\"verse\":23,\"text\":\"Et veniens habitavit in civitate quæ vocatur Nazareth : ut adimpleretur quod dictum est per prophetas : Quoniam Nazaræus vocabitur.\"}],\"summary\":\"The offerings of the wise men: the flight into Egypt: the massacre of the Innocents.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":1,\"label\":\"Matthew 1\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":3,\"label\":\"Matthew 3\"}}]]\n"])</script></body></html>
