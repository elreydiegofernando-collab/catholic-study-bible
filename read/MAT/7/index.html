1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Judge not, that you may not be judged.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For with what judgment you judge, you shall be judged: and with what measure you mete, it shall be measured to you again.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And why seest thou the mote that is in thy brother’s eye; and seest not the beam that is in thy own eye?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Or how sayest thou to thy brother: Let me cast the mote out of thy eye; and behold a beam is in thy own eye?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thou hypocrite, cast out first the beam out of thy own eye, and then shalt thou see to cast out the mote out of thy brother’s eye.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Give not that which is holy to dogs; neither cast ye your pearls before swine, lest perhaps they trample them under their feet, and turning upon you, they tear you.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For every one that asketh, receiveth: and he that seeketh, findeth: and to him that knocketh, it shall be opened.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Or what man is there among you, of whom if his son shall ask bread, will he reach him a stone?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Or if he shall ask him a fish, will he reach him a serpent?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If you then being evil, know how to give good gifts to your children: how much more will your Father who is in heaven, give good things to them that ask him?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All things therefore whatsoever you would that men should do to you, do you also to them. For this is the law and the prophets.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Enter ye in at the narrow gate: for wide is the gate, and broad is the way that leadeth to destruction, and many there are who go in thereat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>How narrow is the gate, and strait is the way that leadeth to life: and few there are that find it!</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Beware of false prophets, who come to you in the clothing of sheep, but inwardly they are ravening wolves.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>By their fruits you shall know them. Do men gather grapes of thorns, or figs of thistles?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Even so every good tree bringeth forth good fruit, and the evil tree bringeth forth evil fruit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A good tree cannot bring forth evil fruit, neither can an evil tree bring forth good fruit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Every tree that bringeth not forth good fruit, shall be cut down, and shall be cast into the fire.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Wherefore by their fruits you shall know them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Not every one that saith to me, Lord, Lord, shall enter into the kingdom of heaven: but he that doth the will of my Father who is in heaven, he shall enter into the kingdom of heaven.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Many will say to me in that day: Lord, Lord, have not we prophesied in thy name, and cast out devils in thy name, and done many miracles in thy name?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And then will I profess unto them, I never knew you: depart from me, you that work iniquity.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Every one therefore that heareth these my words, and doth them, shall be likened to a wise man that built his house upon a rock,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell not, for it was founded on a rock.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And every one that heareth these my words and doth them not, shall be like a foolish man that built his house upon the sand,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell, and great was the fall thereof.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And it came to pass when Jesus had fully ended these words, the people were in admiration at his doctrine.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For he was teaching them as one having power, and not as the scribes and Pharisees.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nolite judicare, ut non judicemini.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In quo enim judicio judicaveritis, judicabimini : et in qua mensura mensi fueritis, remetietur vobis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quid autem vides festucam in oculo fratris tui, et trabem in oculo tuo non vides ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>aut quomodo dicis fratri tuo : Sine ejiciam festucam de oculo tuo, et ecce trabs est in oculo tuo ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hypocrita, ejice primum trabem de oculo tuo, et tunc videbis ejicere festucam de oculo fratris tui.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nolite dare sanctum canibus : neque mittatis margaritas vestras ante porcos, ne forte conculcent eas pedibus suis, et conversi dirumpant vos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Petite, et dabitur vobis : quærite, et invenietis : pulsate, et aperietur vobis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnis enim qui petit, accipit : et qui quærit, invenit : et pulsanti aperietur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Aut quis est ex vobis homo, quem si petierit filius suus panem, numquid lapidem porriget ei ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>aut si piscem petierit, numquid serpentem porriget ei ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si ergo vos, cum sitis mali, nostis bona data dare filiis vestris : quanto magis Pater vester, qui in cælis est, dabit bona petentibus se ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Omnia ergo quæcumque vultis ut faciant vobis homines, et vos facite illis. Hæc est enim lex, et prophetæ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Intrate per angustam portam : quia lata porta, et spatiosa via est, quæ ducit ad perditionem, et multi sunt qui intrant per eam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quam angusta porta, et arcta via est, quæ ducit ad vitam : et pauci sunt qui inveniunt eam !</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Attendite a falsis prophetis, qui veniunt ad vos in vestimentis ovium, intrinsecus autem sunt lupi rapaces :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>a fructibus eorum cognoscetis eos. Numquid colligunt de spinis uvas, aut de tribulis ficus ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sic omnis arbor bona fructus bonos facit : mala autem arbor malos fructus facit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non potest arbor bona malos fructus facere : neque arbor mala bonos fructus facere.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnis arbor, quæ non facit fructum bonum, excidetur, et in ignem mittetur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Igitur ex fructibus eorum cognoscetis eos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non omnis qui dicit mihi, Domine, Domine, intrabit in regnum cælorum : sed qui facit voluntatem Patris mei, qui in cælis est, ipse intrabit in regnum cælorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Multi dicent mihi in illa die : Domine, Domine, nonne in nomine tuo prophetavimus, et in nomine tuo dæmonia ejecimus, et in nomine tuo virtutes multas fecimus ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et tunc confitebor illis : Quia numquam novi vos : discedite a me, qui operamini iniquitatem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omnis ergo qui audit verba mea hæc, et facit ea, assimilabitur viro sapienti, qui ædificavit domum suam supra petram,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et descendit pluvia, et venerunt flumina, et flaverunt venti, et irruerunt in domum illam, et non cecidit : fundata enim erat super petram.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et omnis qui audit verba mea hæc, et non facit ea, similis erit viro stulto, qui ædificavit domum suam super arenam :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et descendit pluvia, et venerunt flumina, et flaverunt venti, et irruerunt in domum illam, et cecidit, et fuit ruina illius magna.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et factum est : cum consummasset Jesus verba hæc, admirabantur turbæ super doctrina ejus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Erat enim docens eos sicut potestatem habens, et non sicut scribæ eorum, et pharisæi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentC not be judged.\"},{\"verse\":2,\"text\":\"For with what judgment you judge, you shall be judged: and with what measure you mete, it shall be measured to you again.\"},{\"verse\":3,\"text\":\"And why seest thou the mote that is in thy brother’s eye; and seest not the beam that is in thy own eye?\"},{\"verse\":4,\"text\":\"Or how sayest thou to thy brother: Let me cast the mote out of thy eye; and behold a beam is in thy own eye?\"},{\"verse\":5,\"text\":\"Thou hypocrite, cast out first the beam out of thy own eye, and then shalt thou see to cast out the mote out of thy brother’s eye.\"},{\"verse\":6,\"text\":\"Give not that which is holy to dogs; neither cast ye your pearls before swine, lest perhaps they trample them under their feet, and turning upon you, they tear you.\"},{\"verse\":7,\"text\":\"Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you.\"},{\"verse\":8,\"text\":\"For every one that asketh, receiveth: and he that seeketh, findeth: and to him that knocketh, it shall be opened.\"},{\"verse\":9,\"text\":\"Or what man is there among you, of whom if his son shall ask bread, will he reach him a stone?\"},{\"verse\":10,\"text\":\"Or if he shall ask him a fish, will he reach him a serpent?\"},{\"verse\":11,\"text\":\"If you then being evil, know how to give good gifts to your children: how much more will your Father who is in heaven, give good things to them that ask him?\"},{\"verse\":12,\"text\":\"All things therefore whatsoever you would that men should do to you, do you also to them. For this is the law and the prophets.\"},{\"verse\":13,\"text\":\"Enter ye in at the narrow gate: for wide is the gate, and broad is the way that leadeth to destruction, and many there are who go in thereat.\"},{\"verse\":14,\"text\":\"How narrow is the gate, and strait is the way that leadeth to life: and few there are that find it!\"},{\"verse\":15,\"text\":\"Beware of false prophets, who come to you in the clothing of sheep, but inwardly they are ravening wolves.\"},{\"verse\":16,\"text\":\"By their fruits you shall know them. Do men gather grapes of thorns, or figs of thistles?\"},{\"verse\":17,\"text\":\"Even so every good tree bringeth forth good fruit, and the evil tree bringeth forth evil fruit.\"},{\"verse\":18,\"text\":\"A good tree cannot bring forth evil fruit, neither can an evil tree bring forth good fruit.\"},{\"verse\":19,\"text\":\"Every tree that bringeth not forth good fruit, shall be cut down, and shall be cast into the fire.\"},{\"verse\":20,\"text\":\"Wherefore by their fruits you shall know them.\"},{\"verse\":21,\"text\":\"Not every one that saith to me, Lord, Lord, shall enter into the kingdom of heaven: but he that doth the will of my Father who is in heaven, he shall enter into the kingdom of heaven.\"},{\"verse\":22,\"text\":\"Many will say to me in that day: Lord, Lord, have not we prophesied in thy name, and cast out devils in thy name, and done many miracles in thy name?\"},{\"verse\":23,\"text\":\"And then will I profess unto them, I never knew you: depart from me, you that work iniquity.\"},{\"verse\":24,\"text\":\"Every one therefore that heareth these my words, and doth them, shall be likened to a wise man that built his house upon a rock,\"},{\"verse\":25,\"text\":\"And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell not, for it was founded on a rock.\"},{\"verse\":26,\"text\":\"And every one that heareth these my words and doth them not, shall be like a foolish man that built his house upon the sand,\"},{\"verse\":27,\"text\":\"And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell, and great was the fall thereof.\"},{\"verse\":28,\"text\":\"And it came to pass when Jesus had fully ended these words, the people were in admiration at his doctrine.\"},{\"verse\":29,\"text\":\"For he was teaching them as one having power, and not as the scribes and Pharisees.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nolite judicare, ut non judicemini.\"},{\"verse\":2,\"text\":\"In quo enim judicio judicaveritis, judicabimini : et in qua mensura mensi fueritis, remetietur vobis.\"},{\"verse\":3,\"text\":\"Quid autem vides festucam in oculo fratris tui, et trabem in oculo tuo non vides ?\"},{\"verse\":4,\"text\":\"aut quomodo dicis fratri tuo : Sine ejiciam festucam de oculo tuo, et ecce trabs est in oculo tuo ?\"},{\"verse\":5,\"text\":\"Hypocrita, ejice primum trabem de oculo tuo, et tunc videbis ejicere festucam de oculo fratris tui.\"},{\"verse\":6,\"text\":\"Nolite dare sanctum canibus : neque mittatis margaritas vestras ante porcos, ne forte conculcent eas pedibus suis, et conversi dirumpant vos.\"},{\"verse\":7,\"text\":\"Petite, et dabitur vobis : quærite, et invenietis : pulsate, et aperietur vobis.\"},{\"verse\":8,\"text\":\"Omnis enim qui petit, accipit : et qui quærit, invenit : et pulsanti aperietur.\"},{\"verse\":9,\"text\":\"Aut quis est ex vobis homo, quem si petierit filius suus panem, numquid lapidem porriget ei ?\"},{\"verse\":10,\"text\":\"aut si piscem petierit, numquid serpentem porriget ei ?\"},{\"verse\":11,\"text\":\"Si ergo vos, cum sitis mali, nostis bona data dare filiis vestris : quanto magis Pater vester, qui in cælis est, dabit bona petentibus se ?\"},{\"verse\":12,\"text\":\"Omnia ergo quæcumque vultis ut faciant vobis homines, et vos facite illis. Hæc est enim lex, et prophetæ.\"},{\"verse\":13,\"text\":\"Intrate per angustam portam : quia lata porta, et spatiosa via est, quæ ducit ad perditionem, et multi sunt qui intrant per eam.\"},{\"verse\":14,\"text\":\"Quam angusta porta, et arcta via est, quæ ducit ad vitam : et pauci sunt qui inveniunt eam !\"},{\"verse\":15,\"text\":\"Attendite a falsis prophetis, qui veniunt ad vos in vestimentis ovium, intrinsecus autem sunt lupi rapaces :\"},{\"verse\":16,\"text\":\"a fructibus eorum cognoscetis eos. Numquid colligunt de spinis uvas, aut de tribulis ficus ?\"},{\"verse\":17,\"text\":\"Sic omnis arbor bona fructus bonos facit : mala autem arbor malos fructus facit.\"},{\"verse\":18,\"text\":\"Non potest arbor bona malos fructus facere : neque arbor mala bonos fructus facere.\"},{\"verse\":19,\"text\":\"Omnis arbor, quæ non facit fructum bonum, excidetur, et in ignem mittetur.\"},{\"verse\":20,\"text\":\"Igitur ex fructibus eorum cognoscetis eos.\"},{\"verse\":21,\"text\":\"Non omnis qui dicit mihi, Domine, Domine, intrabit in regnum cælorum : sed qui facit voluntatem Patris mei, qui in cælis est, ipse intrabit in regnum cælorum.\"},{\"verse\":22,\"text\":\"Multi dicent mihi in illa die : Domine, Domine, nonne in nomine tuo prophetavimus, et in nomine tuo dæmonia ejecimus, et in nomine tuo virtutes multas fecimus ?\"},{\"verse\":23,\"text\":\"Et tunc confitebor illis : Quia numquam novi vos : discedite a me, qui operamini iniquitatem.\"},{\"verse\":24,\"text\":\"Omnis ergo qui audit verba mea hæc, et facit ea, assimilabitur viro sapienti, qui ædificavit domum suam supra petram,\"},{\"verse\":25,\"text\":\"et descendit pluvia, et venerunt flumina, et flaverunt venti, et irruerunt in domum illam, et non cecidit : fundata enim erat super petram.\"},{\"verse\":26,\"text\":\"Et omnis qui audit verba mea hæc, et non facit ea, similis erit viro stulto, qui ædificavit domum suam super arenam :\"},{\"verse\":27,\"text\":\"et descendit pluvia, et venerunt flumina, et flaverunt venti, et irruerunt in domum illam, et cecidit, et fuit ruina illius magna.\"},{\"verse\":28,\"text\":\"Et factum est : cum consummasset Jesus verba hæc, admirabantur turbæ super doctrina ejus.\"},{\"verse\":29,\"text\":\"Erat enim docens eos sicut potestatem habens, et non sicut scribæ eorum, et pharisæi.\"}],\"summary\":\"The third part of the sermon on the mount.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":6,\"label\":\"Matthew 6\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":8,\"label\":\"Matthew 8\"}}]]\n"])</script></body></html>
