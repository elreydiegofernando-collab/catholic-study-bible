<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Matthew 5 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Matthew<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MAT/">About <!-- -->Matthew</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s sermon upon the mount. The eight beatitudes.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And seeing the multitudes, he went up into a mountain, and when he was set down, his disciples came unto him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And opening his mouth he taught them, saying:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Blessed are the poor in spirit: for theirs is the kingdom of heaven.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Blessed are the meek: for they shall possess the land.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Blessed are they that mourn: for they shall be comforted.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Blessed are they that hunger and thirst after justice: for they shall have their fill.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Blessed are the merciful: for they shall obtain mercy.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Blessed are the clean of heart: for they shall see God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Blessed are the peacemakers: for they shall be called the children of God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Blessed are they that suffer persecution for justice’ sake: for theirs is the kingdom of heaven.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Blessed are ye when they shall revile you, and persecute you, and speak all that is evil against you, untruly, for my sake:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Be glad and rejoice for your reward is very great in heaven. For so they persecuted the prophets that were before you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>You are the salt of the earth. But if the salt lose its savour, wherewith shall it be salted? It is good for nothing anymore but to be cast out, and to be trodden on by men.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>You are the light of the world. A city seated on a mountain cannot be hid.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Neither do men light a candle and put it under a bushel, but upon a candlestick, that it may shine to all that are in the house.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So let your light shine before men, that they may see your good works, and glorify your Father who is in heaven.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Do not think that I am come to destroy the law, or the prophets. I am not come to destroy, but to fulfil.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For amen I say unto you, till heaven and earth pass, one jot, or one tittle shall not pass of the law, till all be fulfilled.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He therefore that shall break one of these least commandments, and shall so teach men shall be called the least in the kingdom of heaven. But he that shall do and teach, he shall be called great in the kingdom of heaven.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For I tell you, that unless your justice abound more than that of the scribes and Pharisees, you shall not enter into the kingdom of heaven.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>You have heard that it was said to them of old: Thou shalt not kill. And whosoever shall kill, shall be in danger of the judgment.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But I say to you, that whosoever is angry with his brother, shall be in danger of the judgment. And whosoever shall say to his brother, Raca, shall be in danger of the council. And whosoever shall say, Thou fool, shall be in danger of hell fire.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If therefore thou offer thy gift at the altar, and there thou remember that thy brother hath anything against thee;</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Leave there thy offering before the altar, and go first to be reconciled to thy brother, and then coming thou shalt offer thy gift.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Be at agreement with thy adversary betimes, whilst thou art in the way with him: lest perhaps the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Amen I say to thee, thou shalt not go out from thence till thou repay the last farthing.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>You have heard that it was said to them of old: Thou shalt not commit adultery.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But I say to you, that whosoever shall look on a woman to lust after her, hath already committed adultery with her in his heart.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And if thy right eye scandalize thee, pluck it out and cast it from thee. For it is expedient for thee that one of thy members should perish, rather than thy whole body be cast into hell.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And if thy right hand scandalize thee, cut it off, and cast it from thee: for it is expedient for thee that one of thy members should perish, rather than that thy whole body go into hell.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And it hath been said, Whosoever shall put away his wife, let him give her a bill of divorce.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But I say to you, that whosoever shall put away his wife, excepting for the cause of fornication, maketh her to commit adultery: and he that shall marry her that is put away, committeth adultery.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Again you have heard that it was said to them of old, thou shalt not forswear thyself: but thou shalt perform thy oaths to the Lord.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But I say to you not to swear at all, neither by heaven for it is the throne of God:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Nor by the earth, for it is his footstool: nor by Jerusalem, for it is the city of the great king:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Neither shalt thou swear by thy head, because thou canst not make one hair white or black.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But let your speech be yea, yea: no, no: and that which is over and above these, is of evil.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>You have heard that it hath been said: An eye for an eye, and a tooth for a tooth.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>But I say to you not to resist evil: but if one strike thee on thy right cheek, turn to him also the other:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And if a man will contend with thee in judgment, and take away thy coat, let go thy cloak also unto him.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And whosoever will force thee one mile, go with him other two.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Give to him that asketh of thee, and from him that would borrow of thee turn not away.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>You have heard that it hath been said, Thou shalt love thy neighbour, and hate thy enemy.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>But I say to you, Love your enemies: do good to them that hate you: and pray for them that persecute and calumniate you:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>That you may be the children of your Father who is in heaven, who maketh his sun to rise upon the good, and bad, and raineth upon the just and the unjust.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>For if you love them that love you, what reward shall you have? do not even the publicans this?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And if you salute your brethren only, what do you more? do not also the heathens this?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Be you therefore perfect, as also your heavenly Father is perfect.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Videns autem Jesus turbas, ascendit in montem, et cum sedisset, accesserunt ad eum discipuli ejus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et aperiens os suum docebat eos dicens :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Beati pauperes spiritu : quoniam ipsorum est regnum cælorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Beati mites : quoniam ipsi possidebunt terram.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Beati qui lugent : quoniam ipsi consolabuntur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Beati qui esuriunt et sitiunt justitiam : quoniam ipsi saturabuntur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Beati misericordes : quoniam ipsi misericordiam consequentur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Beati mundo corde : quoniam ipsi Deum videbunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Beati pacifici : quoniam filii Dei vocabuntur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Beati qui persecutionem patiuntur propter justitiam : quoniam ipsorum est regnum cælorum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Beati estis cum maledixerint vobis, et persecuti vos fuerint, et dixerint omne malum adversum vos mentientes, propter me :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>gaudete, et exsultate, quoniam merces vestra copiosa est in cælis. Sic enim persecuti sunt prophetas, qui fuerunt ante vos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vos estis sal terræ. Quod si sal evanuerit, in quo salietur ? ad nihilum valet ultra, nisi ut mittatur foras, et conculcetur ab hominibus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Vos estis lux mundi. Non potest civitas abscondi supra montem posita,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>neque accendunt lucernam, et ponunt eam sub modio, sed super candelabrum, ut luceat omnibus qui in domo sunt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sic luceat lux vestra coram hominibus : ut videant opera vestra bona, et glorificent Patrem vestrum, qui in cælis est.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nolite putare quoniam veni solvere legem aut prophetas : non veni solvere, sed adimplere.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Amen quippe dico vobis, donec transeat cælum et terra, jota unum aut unus apex non præteribit a lege, donec omnia fiant.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui ergo solverit unum de mandatis istis minimis, et docuerit sic homines, minimus vocabitur in regno cælorum : qui autem fecerit et docuerit, hic magnus vocabitur in regno cælorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dico enim vobis, quia nisi abundaverit justitia vestra plus quam scribarum et pharisæorum, non intrabitis in regnum cælorum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Audistis quia dictum est antiquis : Non occides : qui autem occiderit, reus erit judicio.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ego autem dico vobis : quia omnis qui irascitur fratri suo, reus erit judicio. Qui autem dixerit fratri suo, raca : reus erit concilio. Qui autem dixerit, fatue : reus erit gehennæ ignis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si ergo offers munus tuum ad altare, et ibi recordatus fueris quia frater tuus habet aliquid adversum te :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>relinque ibi munus tuum ante altare, et vade prius reconciliari fratri tuo : et tunc veniens offeres munus tuum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Esto consentiens adversario tuo cito dum es in via cum eo : ne forte tradat te adversarius judici, et judex tradat te ministro : et in carcerem mittaris.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Amen dico tibi, non exies inde, donec reddas novissimum quadrantem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Audistis quia dictum est antiquis : Non mœchaberis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ego autem dico vobis : quia omnis qui viderit mulierem ad concupiscendum eam, jam mœchatus est eam in corde suo.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quod si oculus tuus dexter scandalizat te, erue eum, et projice abs te : expedit enim tibi ut pereat unum membrorum tuorum, quam totum corpus tuum mittatur in gehennam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et si dextra manus tua scandalizat te, abscide eam, et projice abs te : expedit enim tibi ut pereat unum membrorum tuorum, quam totum corpus tuum eat in gehennam.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Dictum est autem : Quicumque dimiserit uxorem suam, det ei libellum repudii.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ego autem dico vobis : quia omnis qui dimiserit uxorem suam, excepta fornicationis causa, facit eam mœchari : et qui dimissam duxerit, adulterat.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Iterum audistis quia dictum est antiquis : Non perjurabis : reddes autem Domino juramenta tua.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Ego autem dico vobis, non jurare omnino, neque per cælum, quia thronus Dei est :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>neque per terram, quia scabellum est pedum ejus : neque per Jerosolymam, quia civitas est magni regis :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>neque per caput tuum juraveris, quia non potes unum capillum album facere, aut nigrum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Sit autem sermo vester, est, est : non, non : quod autem his abundantius est, a malo est.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Audistis quia dictum est : Oculum pro oculo, et dentem pro dente.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Ego autem dico vobis, non resistere malo : sed si quis te percusserit in dexteram maxillam tuam, præbe illi et alteram :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et ei, qui vult tecum judicio contendere, et tunicam tuam tollere, dimitte ei et pallium :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>et quicumque te angariaverit mille passus, vade cum illo et alia duo.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Qui petit a te, da ei : et volenti mutuari a te, ne avertaris.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Audistis quia dictum est : Diliges proximum tuum, et odio habebis inimicum tuum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Ego autem dico vobis : diligite inimicos vestros, benefacite his qui oderunt vos, et orate pro persequentibus et calumniantibus vos :</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>ut sitis filii Patris vestri, qui in cælis est : qui solem suum oriri facit super bonos et malos : et pluit super justos et injustos.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Si enim diligitis eos qui vos diligunt, quam mercedem habebitis ? nonne et publicani hoc faciunt ?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Et si salutaveritis fratres vestros tantum, quid amplius facitis ? nonne et ethnici hoc faciunt ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Estote ergo vos perfecti, sicut et Pater vester cælestis perfectus est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Matthew 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right h urch's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MAT.5\",{\"bookId\":47,\"usfm\":\"MAT\",\"bookName\":\"Matthew\",\"drName\":\"Matthew\",\"chapter\":5,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And seeing the multitudes, he went up into a mountain, and when he was set down, his disciples came unto him.\"},{\"verse\":2,\"text\":\"And opening his mouth he taught them, saying:\"},{\"verse\":3,\"text\":\"Blessed are the poor in spirit: for theirs is the kingdom of heaven.\"},{\"verse\":4,\"text\":\"Blessed are the meek: for they shall possess the land.\"},{\"verse\":5,\"text\":\"Blessed are they that mourn: for they shall be comforted.\"},{\"verse\":6,\"text\":\"Blessed are they that hunger and thirst after justice: for they shall have their fill.\"},{\"verse\":7,\"text\":\"Blessed are the merciful: for they shall obtain mercy.\"},{\"verse\":8,\"text\":\"Blessed are the clean of heart: for they shall see God.\"},{\"verse\":9,\"text\":\"Blessed are the peacemakers: for they shall be called the children of God.\"},{\"verse\":10,\"text\":\"Blessed are they that suffer persecution for justice’ sake: for theirs is the kingdom of heaven.\"},{\"verse\":11,\"text\":\"Blessed are ye when they shall revile you, and persecute you, and speak all that is evil against you, untruly, for my sake:\"},{\"verse\":12,\"text\":\"Be glad and rejoice for your reward is very great in heaven. For so they persecuted the prophets that were before you.\"},{\"verse\":13,\"text\":\"You are the salt of the earth. But if the salt lose its savour, wherewith shall it be salted? It is good for nothing anymore but to be cast out, and to be trodden on by men.\"},{\"verse\":14,\"text\":\"You are the light of the world. A city seated on a mountain cannot be hid.\"},{\"verse\":15,\"text\":\"Neither do men light a candle and put it under a bushel, but upon a candlestick, that it may shine to all that are in the house.\"},{\"verse\":16,\"text\":\"So let your light shine before men, that they may see your good works, and glorify your Father who is in heaven.\"},{\"verse\":17,\"text\":\"Do not think that I am come to destroy the law, or the prophets. I am not come to destroy, but to fulfil.\"},{\"verse\":18,\"text\":\"For amen I say unto you, till heaven and earth pass, one jot, or one tittle shall not pass of the law, till all be fulfilled.\"},{\"verse\":19,\"text\":\"He therefore that shall break one of these least commandments, and shall so teach men shall be called the least in the kingdom of heaven. But he that shall do and teach, he shall be called great in the kingdom of heaven.\"},{\"verse\":20,\"text\":\"For I tell you, that unless your justice abound more than that of the scribes and Pharisees, you shall not enter into the kingdom of heaven.\"},{\"verse\":21,\"text\":\"You have heard that it was said to them of old: Thou shalt not kill. And whosoever shall kill, shall be in danger of the judgment.\"},{\"verse\":22,\"text\":\"But I say to you, that whosoever is angry with his brother, shall be in danger of the judgment. And whosoever shall say to his brother, Raca, shall be in danger of the council. And whosoever shall say, Thou fool, shall be in danger of hell fire.\"},{\"verse\":23,\"text\":\"If therefore thou offer thy gift at the altar, and there thou remember that thy brother hath anything against thee;\"},{\"verse\":24,\"text\":\"Leave there thy offering before the altar, and go first to be reconciled to thy brother, and then coming thou shalt offer thy gift.\"},{\"verse\":25,\"text\":\"Be at agreement with thy adversary betimes, whilst thou art in the way with him: lest perhaps the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison.\"},{\"verse\":26,\"text\":\"Amen I say to thee, thou shalt not go out from thence till thou repay the last farthing.\"},{\"verse\":27,\"text\":\"You have heard that it was said to them of old: Thou shalt not commit adultery.\"},{\"verse\":28,\"text\":\"But I say to you, that whosoever shall look on a woman to lust after her, hath already committed adultery with her in his heart.\"},{\"verse\":29,\"text\":\"And if thy right eye scandalize thee, pluck it out and cast it from thee. For it is expedient for thee that one of thy members should perish, rather than thy whole body be cast into hell.\"},{\"verse\":30,\"text\":\"And if thy right hand scandalize thee, cut it off, and cast it from thee: for it is expedient for thee that one of thy members should perish, rather than that thy whole body go into hell.\"},{\"verse\":31,\"text\":\"And it hath been said, Whosoever shall put away his wife, let him give her a bill of divorce.\"},{\"verse\":32,\"text\":\"But I say to you, that whosoever shall put away his wife, excepting for the cause of fornication, maketh her to commit adultery: and he that shall marry her that is put away, committeth adultery.\"},{\"verse\":33,\"text\":\"Again you have heard that it was said to them of old, thou shalt not forswear thyself: but thou shalt perform thy oaths to the Lord.\"},{\"verse\":34,\"text\":\"But I say to you not to swear at all, neither by heaven for it is the throne of God:\"},{\"verse\":35,\"text\":\"Nor by the earth, for it is his footstool: nor by Jerusalem, for it is the city of the great king:\"},{\"verse\":36,\"text\":\"Neither shalt thou swear by thy head, because thou canst not make one hair white or black.\"},{\"verse\":37,\"text\":\"But let your speech be yea, yea: no, no: and that which is over and above these, is of evil.\"},{\"verse\":38,\"text\":\"You have heard that it hath been said: An eye for an eye, and a tooth for a tooth.\"},{\"verse\":39,\"text\":\"But I say to you not to resist evil: but if one strike thee on thy right cheek, turn to him also the other:\"},{\"verse\":40,\"text\":\"And if a man will contend with thee in judgment, and take away thy coat, let go thy cloak also unto him.\"},{\"verse\":41,\"text\":\"And whosoever will force thee one mile, go with him other two.\"},{\"verse\":42,\"text\":\"Give to him that asketh of thee, and from him that would borrow of thee turn not away.\"},{\"verse\":43,\"text\":\"You have heard that it hath been said, Thou shalt love thy neighbour, and hate thy enemy.\"},{\"verse\":44,\"text\":\"But I say to you, Love your enemies: do good to them that hate you: and pray for them that persecute and calumniate you:\"},{\"verse\":45,\"text\":\"That you may be the children of your Father who is in heaven, who maketh his sun to rise upon the good, and bad, and raineth upon the just and the unjust.\"},{\"verse\":46,\"text\":\"For if you love them that love you, what reward shall you have? do not even the publicans this?\"},{\"verse\":47,\"text\":\"And if you salute your brethren only, what do you more? do not also the heathens this?\"},{\"verse\":48,\"text\":\"Be you therefore perfect, as also your heavenly Father is perfect.\"}],\"vul\":[{\"verse\":1,\"text\":\"Videns autem Jesus turbas, ascendit in montem, et cum sedisset, accesserunt ad eum discipuli ejus,\"},{\"verse\":2,\"text\":\"et aperiens os suum docebat eos dicens :\"},{\"verse\":3,\"text\":\"Beati pauperes spiritu : quoniam ipsorum est regnum cælorum.\"},{\"verse\":4,\"text\":\"Beati mites : quoniam ipsi possidebunt terram.\"},{\"verse\":5,\"text\":\"Beati qui lugent : quoniam ipsi consolabuntur.\"},{\"verse\":6,\"text\":\"Beati qui esuriunt et sitiunt justitiam : quoniam ipsi saturabuntur.\"},{\"verse\":7,\"text\":\"Beati misericordes : quoniam ipsi misericordiam consequentur.\"},{\"verse\":8,\"text\":\"Beati mundo corde : quoniam ipsi Deum videbunt.\"},{\"verse\":9,\"text\":\"Beati pacifici : quoniam filii Dei vocabuntur.\"},{\"verse\":10,\"text\":\"Beati qui persecutionem patiuntur propter justitiam : quoniam ipsorum est regnum cælorum.\"},{\"verse\":11,\"text\":\"Beati estis cum maledixerint vobis, et persecuti vos fuerint, et dixerint omne malum adversum vos mentientes, propter me :\"},{\"verse\":12,\"text\":\"gaudete, et exsultate, quoniam merces vestra copiosa est in cælis. Sic enim persecuti sunt prophetas, qui fuerunt ante vos.\"},{\"verse\":13,\"text\":\"Vos estis sal terræ. Quod si sal evanuerit, in quo salietur ? ad nihilum valet ultra, nisi ut mittatur foras, et conculcetur ab hominibus.\"},{\"verse\":14,\"text\":\"Vos estis lux mundi. Non potest civitas abscondi supra montem posita,\"},{\"verse\":15,\"text\":\"neque accendunt lucernam, et ponunt eam sub modio, sed super candelabrum, ut luceat omnibus qui in domo sunt.\"},{\"verse\":16,\"text\":\"Sic luceat lux vestra coram hominibus : ut videant opera vestra bona, et glorificent Patrem vestrum, qui in cælis est.\"},{\"verse\":17,\"text\":\"Nolite putare quoniam veni solvere legem aut prophetas : non veni solvere, sed adimplere.\"},{\"verse\":18,\"text\":\"Amen quippe dico vobis, donec transeat cælum et terra, jota unum aut unus apex non præteribit a lege, donec omnia fiant.\"},{\"verse\":19,\"text\":\"Qui ergo solverit unum de mandatis istis minimis, et docuerit sic homines, minimus vocabitur in regno cælorum : qui autem fecerit et docuerit, hic magnus vocabitur in regno cælorum.\"},{\"verse\":20,\"text\":\"Dico enim vobis, quia nisi abundaverit justitia vestra plus quam scribarum et pharisæorum, non intrabitis in regnum cælorum.\"},{\"verse\":21,\"text\":\"Audistis quia dictum est antiquis : Non occides : qui autem occiderit, reus erit judicio.\"},{\"verse\":22,\"text\":\"Ego autem dico vobis : quia omnis qui irascitur fratri suo, reus erit judicio. Qui autem dixerit fratri suo, raca : reus erit concilio. Qui autem dixerit, fatue : reus erit gehennæ ignis.\"},{\"verse\":23,\"text\":\"Si ergo offers munus tuum ad altare, et ibi recordatus fueris quia frater tuus habet aliquid adversum te :\"},{\"verse\":24,\"text\":\"relinque ibi munus tuum ante altare, et vade prius reconciliari fratri tuo : et tunc veniens offeres munus tuum.\"},{\"verse\":25,\"text\":\"Esto consentiens adversario tuo cito dum es in via cum eo : ne forte tradat te adversarius judici, et judex tradat te ministro : et in carcerem mittaris.\"},{\"verse\":26,\"text\":\"Amen dico tibi, non exies inde, donec reddas novissimum quadrantem.\"},{\"verse\":27,\"text\":\"Audistis quia dictum est antiquis : Non mœchaberis.\"},{\"verse\":28,\"text\":\"Ego autem dico vobis : quia omnis qui viderit mulierem ad concupiscendum eam, jam mœchatus est eam in corde suo.\"},{\"verse\":29,\"text\":\"Quod si oculus tuus dexter scandalizat te, erue eum, et projice abs te : expedit enim tibi ut pereat unum membrorum tuorum, quam totum corpus tuum mittatur in gehennam.\"},{\"verse\":30,\"text\":\"Et si dextra manus tua scandalizat te, abscide eam, et projice abs te : expedit enim tibi ut pereat unum membrorum tuorum, quam totum corpus tuum eat in gehennam.\"},{\"verse\":31,\"text\":\"Dictum est autem : Quicumque dimiserit uxorem suam, det ei libellum repudii.\"},{\"verse\":32,\"text\":\"Ego autem dico vobis : quia omnis qui dimiserit uxorem suam, excepta fornicationis causa, facit eam mœchari : et qui dimissam duxerit, adulterat.\"},{\"verse\":33,\"text\":\"Iterum audistis quia dictum est antiquis : Non perjurabis : reddes autem Domino juramenta tua.\"},{\"verse\":34,\"text\":\"Ego autem dico vobis, non jurare omnino, neque per cælum, quia thronus Dei est :\"},{\"verse\":35,\"text\":\"neque per terram, quia scabellum est pedum ejus : neque per Jerosolymam, quia civitas est magni regis :\"},{\"verse\":36,\"text\":\"neque per caput tuum juraveris, quia non potes unum capillum album facere, aut nigrum.\"},{\"verse\":37,\"text\":\"Sit autem sermo vester, est, est : non, non : quod autem his abundantius est, a malo est.\"},{\"verse\":38,\"text\":\"Audistis quia dictum est : Oculum pro oculo, et dentem pro dente.\"},{\"verse\":39,\"text\":\"Ego autem dico vobis, non resistere malo : sed si quis te percusserit in dexteram maxillam tuam, præbe illi et alteram :\"},{\"verse\":40,\"text\":\"et ei, qui vult tecum judicio contendere, et tunicam tuam tollere, dimitte ei et pallium :\"},{\"verse\":41,\"text\":\"et quicumque te angariaverit mille passus, vade cum illo et alia duo.\"},{\"verse\":42,\"text\":\"Qui petit a te, da ei : et volenti mutuari a te, ne avertaris.\"},{\"verse\":43,\"text\":\"Audistis quia dictum est : Diliges proximum tuum, et odio habebis inimicum tuum.\"},{\"verse\":44,\"text\":\"Ego autem dico vobis : diligite inimicos vestros, benefacite his qui oderunt vos, et orate pro persequentibus et calumniantibus vos :\"},{\"verse\":45,\"text\":\"ut sitis filii Patris vestri, qui in cælis est : qui solem suum oriri facit super bonos et malos : et pluit super justos et injustos.\"},{\"verse\":46,\"text\":\"Si enim diligitis eos qui vos diligunt, quam mercedem habebitis ? nonne et publicani hoc faciunt ?\"},{\"verse\":47,\"text\":\"Et si salutaveritis fratres vestros tantum, quid amplius facitis ? nonne et ethnici hoc faciunt ?\"},{\"verse\":48,\"text\":\"Estote ergo vos perfecti, sicut et Pater vester cælestis perfectus est.\"}],\"summary\":\"Christ’s sermon upon the mount. The eight beatitudes.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":4,\"label\":\"Matthew 4\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":6,\"label\":\"Matthew 6\"}}]]\n"])</script></body></html>
