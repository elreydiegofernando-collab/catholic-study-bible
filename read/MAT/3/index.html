1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And in those days cometh John the Baptist preaching in the desert of Judea.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And saying: Do penance: for the kingdom of heaven is at hand.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For this is he that was spoken of by Isaias the prophet, saying: A voice of one crying in the desert, Prepare ye the way of the Lord, make straight his paths.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the same John had his garment of camel’s hair, and a leathern girdle about his loins: and his meat was locusts and wild honey.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Then went out to him Jerusalem and all Judea, and all the country about Jordan:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And were baptized by him in the Jordan, confessing their sins.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And seeing many of the Pharisees and Sadducees coming to his baptism, he said to them: Ye brood of vipers, who hath shewed you to flee from the wrath to come?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Bring forth therefore fruit worthy of penance.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And think not to say within yourselves, We have Abraham for our father. For I tell you that God is able of these stones to raise up children to Abraham.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For now the axe is laid to the root of the trees. Every tree therefore that doth not yield good fruit, shall be cut down, and cast into the fire.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I indeed baptize you in water unto penance, but he that shall come after me, is mightier than I, whose shoes I am not worthy to bear: he shall baptize you in the Holy Ghost and fire.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Whose fan is in his hand, and he will thoroughly cleanse his floor and gather his wheat into the barn; but the chaff he will burn with unquenchable fire.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then cometh Jesus from Galilee to the Jordan, unto John, to be baptized by him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But John stayed him, saying: I ought to be baptized by thee, and comest thou to me?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Jesus answering, said to him: Suffer it to be so now. For so it becometh us to fulfil all justice. Then he suffered him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Jesus being baptized, forthwith came out of the water: and lo, the heavens were opened to him: and he saw the Spirit of God descending as a dove, and coming upon him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And behold a voice from heaven saying: This is my beloved Son, in whom I am well pleased.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In diebus autem illis venit Joannes Baptista prædicans in deserto Judææ,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et dicens : Pœnitentiam agite : appropinquavit enim regnum cælorum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hic est enim, qui dictus est per Isaiam prophetam dicentem : Vox clamantis in deserto : Parate viam Domini ; rectas facite semitas ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ipse autem Joannes habebat vestimentum de pilis camelorum, et zonam pelliceam circa lumbos suos : esca autem ejus erat locustæ, et mel silvestre.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tunc exibat ad eum Jerosolyma, et omnis Judæa, et omnis regio circa Jordanem ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et baptizabantur ab eo in Jordane, confitentes peccata sua.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Videns autem multos pharisæorum, et sadducæorum, venientes ad baptismum suum, dixit eis : Progenies viperarum, quis demonstravit vobis fugere a ventura ira ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Facite ergo fructum dignum pœnitentiæ.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ne velitis dicere intra vos : Patrem habemus Abraham. Dico enim vobis quoniam potens est Deus de lapidibus istis suscitare filios Abrahæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jam enim securis ad radicem arborum posita est. Omnis ergo arbor, quæ non facit fructum bonum, excidetur, et in ignem mittetur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ego quidem baptizo vos in aqua in pœnitentiam : qui autem post me venturus est, fortior me est, cujus non sum dignus calceamenta portare : ipse vos baptizabit in Spiritu Sancto, et igni.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cujus ventilabrum in manu sua : et permundabit aream suam : et congregabit triticum suum in horreum, paleas autem comburet igni inextinguibili.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tunc venit Jesus a Galilæa in Jordanem ad Joannem, ut baptizaretur ab eo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Joannes autem prohibebat eum, dicens : Ego a te debeo baptizari, et tu venis ad me ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Respondens autem Jesus, dixit ei : Sine modo : sic enim decet nos implere omnem justitiam. Tunc dimisit eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Baptizatus autem Jesus, confestim ascendit de aqua, et ecce aperti sunt ei cæli : et vidit Spiritum Dei descendentem sicut columbam, et venientem super se.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et ecce vox de cælis dicens : Hic est Filius meus dilectus, in quo mihi complacui.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Matthew 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/4/"><span class="min-w-0"><span class="block text-xs uppercase tr \"},{\"verse\":6,\"text\":\"And were baptized by him in the Jordan, confessing their sins.\"},{\"verse\":7,\"text\":\"And seeing many of the Pharisees and Sadducees coming to his baptism, he said to them: Ye brood of vipers, who hath shewed you to flee from the wrath to come?\"},{\"verse\":8,\"text\":\"Bring forth therefore fruit worthy of penance.\"},{\"verse\":9,\"text\":\"And think not to say within yourselves, We have Abraham for our father. For I tell you that God is able of these stones to raise up children to Abraham.\"},{\"verse\":10,\"text\":\"For now the axe is laid to the root of the trees. Every tree therefore that doth not yield good fruit, shall be cut down, and cast into the fire.\"},{\"verse\":11,\"text\":\"I indeed baptize you in water unto penance, but he that shall come after me, is mightier than I, whose shoes I am not worthy to bear: he shall baptize you in the Holy Ghost and fire.\"},{\"verse\":12,\"text\":\"Whose fan is in his hand, and he will thoroughly cleanse his floor and gather his wheat into the barn; but the chaff he will burn with unquenchable fire.\"},{\"verse\":13,\"text\":\"Then cometh Jesus from Galilee to the Jordan, unto John, to be baptized by him.\"},{\"verse\":14,\"text\":\"But John stayed him, saying: I ought to be baptized by thee, and comest thou to me?\"},{\"verse\":15,\"text\":\"And Jesus answering, said to him: Suffer it to be so now. For so it becometh us to fulfil all justice. Then he suffered him.\"},{\"verse\":16,\"text\":\"And Jesus being baptized, forthwith came out of the water: and lo, the heavens were opened to him: and he saw the Spirit of God descending as a dove, and coming upon him.\"},{\"verse\":17,\"text\":\"And behold a voice from heaven saying: This is my beloved Son, in whom I am well pleased.\"}],\"vul\":[{\"verse\":1,\"text\":\"In diebus autem illis venit Joannes Baptista prædicans in deserto Judææ,\"},{\"verse\":2,\"text\":\"et dicens : Pœnitentiam agite : appropinquavit enim regnum cælorum.\"},{\"verse\":3,\"text\":\"Hic est enim, qui dictus est per Isaiam prophetam dicentem : Vox clamantis in deserto : Parate viam Domini ; rectas facite semitas ejus.\"},{\"verse\":4,\"text\":\"Ipse autem Joannes habebat vestimentum de pilis camelorum, et zonam pelliceam circa lumbos suos : esca autem ejus erat locustæ, et mel silvestre.\"},{\"verse\":5,\"text\":\"Tunc exibat ad eum Jerosolyma, et omnis Judæa, et omnis regio circa Jordanem ;\"},{\"verse\":6,\"text\":\"et baptizabantur ab eo in Jordane, confitentes peccata sua.\"},{\"verse\":7,\"text\":\"Videns autem multos pharisæorum, et sadducæorum, venientes ad baptismum suum, dixit eis : Progenies viperarum, quis demonstravit vobis fugere a ventura ira ?\"},{\"verse\":8,\"text\":\"Facite ergo fructum dignum pœnitentiæ.\"},{\"verse\":9,\"text\":\"Et ne velitis dicere intra vos : Patrem habemus Abraham. Dico enim vobis quoniam potens est Deus de lapidibus istis suscitare filios Abrahæ.\"},{\"verse\":10,\"text\":\"Jam enim securis ad radicem arborum posita est. Omnis ergo arbor, quæ non facit fructum bonum, excidetur, et in ignem mittetur.\"},{\"verse\":11,\"text\":\"Ego quidem baptizo vos in aqua in pœnitentiam : qui autem post me venturus est, fortior me est, cujus non sum dignus calceamenta portare : ipse vos baptizabit in Spiritu Sancto, et igni.\"},{\"verse\":12,\"text\":\"Cujus ventilabrum in manu sua : et permundabit aream suam : et congregabit triticum suum in horreum, paleas autem comburet igni inextinguibili.\"},{\"verse\":13,\"text\":\"Tunc venit Jesus a Galilæa in Jordanem ad Joannem, ut baptizaretur ab eo.\"},{\"verse\":14,\"text\":\"Joannes autem prohibebat eum, dicens : Ego a te debeo baptizari, et tu venis ad me ?\"},{\"verse\":15,\"text\":\"Respondens autem Jesus, dixit ei : Sine modo : sic enim decet nos implere omnem justitiam. Tunc dimisit eum.\"},{\"verse\":16,\"text\":\"Baptizatus autem Jesus, confestim ascendit de aqua, et ecce aperti sunt ei cæli : et vidit Spiritum Dei descendentem sicut columbam, et venientem super se.\"},{\"verse\":17,\"text\":\"Et ecce vox de cælis dicens : Hic est Filius meus dilectus, in quo mihi complacui.\"}],\"summary\":\"The preaching of John: Christ is baptized.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":2,\"label\":\"Matthew 2\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":4,\"label\":\"Matthew 4\"}}]]\n"])</script></body></html>
