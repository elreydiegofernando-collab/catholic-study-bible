<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Matthew 27 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Matthew<!-- --> <span class="text-stone-500">27</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MAT/">About <!-- -->Matthew</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The continuation of the history of the passion of Christ. His death and burial.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when morning was come, all the chief priests and ancients of the people took counsel against Jesus, that they might put him to death.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they brought him bound and delivered him to Pontius Pilate the governor.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Then Judas, who betrayed him, seeing that he was condemned, repenting himself, brought back the thirty pieces of silver to the chief priests and ancients,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Saying: I have sinned in betraying innocent blood. But they said: What is that to us? Look thou to it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And casting down the pieces of silver in the temple, he departed and went and hanged himself with an halter.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But the chief priests having taken the pieces of silver, said: It is not lawful to put them into the corbona, because it is the price of blood.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And after they had consulted together, they bought with them the potter’s field, to be a burying place for strangers.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For this cause that field was called Haceldama, that is, the field of blood, even to this day.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then was fulfilled that which was spoken by Jeremias the prophet, saying: And they took the thirty pieces of silver, the price of him that was prized, whom they prized of the children of Israel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they gave them unto the potter’s field, as the Lord appointed to me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Jesus stood before the governor, and the governor asked him, saying: Art thou the king of the Jews? Jesus saith to him: Thou sayest it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when he was accused by the chief priests and ancients, he answered nothing.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then Pilate saith to him: Dost not thou hear how great testimonies they allege against thee?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he answered him to never a word, so that the governor wondered exceedingly.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Now upon the solemn day the governor was accustomed to release to the people one prisoner, whom they would.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he had then a notorious prisoner that was called Barabbas.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>They therefore being gathered together, Pilate said: Whom will you that I release to You: Barabbas, or Jesus that is called Christ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For he knew that for envy they had delivered him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And as he was sitting in the place of judgment, his wife sent to him, saying: Have thou nothing to do with that just man; for I have suffered many things this day in a dream because of him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But the chief priests and ancients persuaded the people that they should ask Barabbas and make Jesus away.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the governor answering, said to them: Whether will you of the two to be released unto you? But they said: Barabbas.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Pilate saith to them: What shall I do then with Jesus that is called Christ? They say all: Let him be crucified.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The governor said to them: Why, what evil hath he done? But they cried out the more, saying: Let him be crucified.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Pilate seeing that he prevailed nothing, but that rather a tumult was made, taking water washed his hands before the people, saying: I am innocent of the blood of this just man. Look you to it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the whole people answering, said: His blood be upon us and upon our children.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then he released to them Barabbas: and having scourged Jesus, delivered him unto them to be crucified.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Then the soldiers of the governor, taking Jesus into the hall, gathered together unto him the whole band.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And stripping him, they put a scarlet cloak about him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And platting a crown of thorns, they put it upon his head, and a reed in his right hand. And bowing the knee before him, they mocked him, saying: Hail, King of the Jews.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And spitting upon him, they took the reed and struck his head.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And after they had mocked him, they took off the cloak from him and put on him his own garments and led him away to crucify him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And going out, they found a man of Cyrene, named Simon: him they forced to take up his cross.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they came to the place that is called Golgotha, which is the place of Calvary.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And they gave him wine to drink mingled with gall. And when he had tasted, he would not drink.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And after they had crucified him, they divided his garments, casting lots; that it might be fulfilled which was spoken by the prophet, saying: They divided my garments among them; and upon my vesture they cast lots.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And they sat and watched him.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And they put over his head his cause written: THIS IS JESUS THE KING OF THE JEWS.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Then were crucified with him two thieves: one on the right hand and one on the left.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And they that passed by blasphemed him, wagging their heads,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And saying: Vah, thou that destroyest the temple of God and in three days dost rebuild it: save thy own self. If thou be the Son of God, come down from the cross.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>In like manner also the chief priests, with the scribes and ancients, mocking said:</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>He saved others: himself he cannot save. If he be the king of Israel, let him now come down from the cross: and we will believe him.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>He trusted in God: let him now deliver him if he will have him. For he said: I am the Son of God.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the selfsame thing the thieves also that were crucified with him reproached him with.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Now from the sixth hour, there was darkness over the whole earth, until the ninth hour.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And about the ninth hour, Jesus cried with a loud voice, saying: Eli, Eli, lamma sabacthani? That is, My God, My God, why hast thou forsaken me?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And some that stood there and heard said: This man calleth Elias.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And immediately one of them running took a sponge and filled it with vinegar and put it on a reed and gave him to drink.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And the others said: Let be. Let us see whether Elias will come to deliver him.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And Jesus again crying with a loud voice, yielded up the ghost.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And behold the veil of the temple was rent in two from the top even to the bottom: and the earth quaked and the rocks were rent.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And the graves were opened: and many bodies of the saints that had slept arose,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And coming out of the tombs after his resurrection, came into the holy city and appeared to many.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Now the centurion and they that were with him watching Jesus, having seen the earthquake and the things that were done, were sore afraid, saying: Indeed this was the Son of God.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And there were there many women afar off, who had followed Jesus from Galilee, ministering unto him:</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Among whom was Mary Magdalen and Mary the mother of James and Joseph and the mother of the sons of Zebedee.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And when it was evening, there came a certain rich man of Arimathea, named Joseph, who also himself was a disciple of Jesus.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>He went to Pilate and asked the body of Jesus. Then Pilate commanded that the body should be delivered.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And Joseph taking the body wrapped it up in a clean linen cloth:</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And laid it in his own new monument, which he had hewed out in a rock. And he rolled a great stone to the door of the monument and went his way.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And there was there Mary Magdalen and the other Mary, sitting over against the sepulchre.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And the next day, which followed the day of preparation, the chief priests and the Pharisees came together to Pilate,</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Saying: Sir, we have remembered, that that seducer said, while he was yet alive: After three days I will rise again.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Command therefore the sepulchre to be guarded until the third day: lest perhaps his disciples come and steal him away and say to the people: He is risen from the dead. And the last error shall be worse than the first.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Pilate saith to them: You have a guard. Go, guard it as you know.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>And they departing, made the sepulchre sure, sealing the stone and setting guards.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Mane autem facto, consilium inierunt omnes principes sacerdotum et seniores populi adversus Jesum, ut eum morti traderent.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et vinctum adduxerunt eum, et tradiderunt Pontio Pilato præsidi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tunc videns Judas, qui eum tradidit, quod damnatus esset, pœnitentia ductus, retulit triginta argenteos principibus sacerdotum, et senioribus,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>dicens : Peccavi, tradens sanguinem justum. At illi dixerunt : Quid ad nos ? tu videris.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et projectis argenteis in templo, recessit : et abiens laqueo se suspendit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Principes autem sacerdotum, acceptis argenteis, dixerunt : Non licet eos mittere in corbonam : quia pretium sanguinis est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Consilio autem inito, emerunt ex illis agrum figuli, in sepulturam peregrinorum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Propter hoc vocatus est ager ille, Haceldama, hoc est, Ager sanguinis, usque in hodiernum diem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tunc impletum est quod dictum est per Jeremiam prophetam, dicentem : Et acceperunt triginta argenteos pretium appretiati, quem appretiaverunt a filiis Israël :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et dederunt eos in agrum figuli, sicut constituit mihi Dominus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Jesus autem stetit ante præsidem, et interrogavit eum præses, dicens : Tu es rex Judæorum ? Dicit illi Jesus : Tu dicis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et cum accusaretur a principibus sacerdotum et senioribus, nihil respondit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tunc dicit illi Pilatus : Non audis quanta adversum te dicunt testimonia ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et non respondit ei ad ullum verbum, ita ut miraretur præses vehementer.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Per diem autem solemnem consueverat præses populo dimittere unum vinctum, quem voluissent :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>habebat autem tunc vinctum insignem, qui dicebatur Barabbas.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Congregatis ergo illis, dixit Pilatus : Quem vultis dimittam vobis : Barabbam, an Jesum, qui dicitur Christus ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sciebat enim quod per invidiam tradidissent eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sedente autem illo pro tribunali, misit ad eum uxor ejus, dicens : Nihil tibi, et justo illi : multa enim passa sum hodie per visum propter eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Principes autem sacerdotum et seniores persuaserunt populis ut peterent Barabbam, Jesum vero perderent.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Respondens autem præses, ait illis : Quem vultis vobis de duobus dimitti ? At illi dixerunt : Barabbam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dicit illis Pilatus : Quid igitur faciam de Jesu, qui dicitur Christus ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dicunt omnes : Crucifigatur. Ait illis præses : Quid enim mali fecit ? At illi magis clamabant dicentes : Crucifigatur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Videns autem Pilatus quia nihil proficeret, sed magis tumultus fieret : accepta aqua, lavit manus coram populo, dicens : Innocens ego sum a sanguine justi hujus : vos videritis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et respondens universus populus, dixit : Sanguis ejus super nos, et super filios nostros.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tunc dimisit illis Barabbam : Jesum autem flagellatum tradidit eis ut crucifigeretur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Tunc milites præsidis suscipientes Jesum in prætorium, congregaverunt ad eum universam cohortem :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et exuentes eum, chlamydem coccineam circumdederunt ei,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et plectentes coronam de spinis, posuerunt super caput ejus, et arundinem in dextera ejus. Et genu flexo ante eum, illudebant ei, dicentes : Ave rex Judæorum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et exspuentes in eum, acceperunt arundinem, et percutiebant caput ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et postquam illuserunt ei, exuerunt eum chlamyde, et induerunt eum vestimentis ejus, et duxerunt eum ut crucifigerent.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Exeuntes autem invenerunt hominem Cyrenæum, nomine Simonem : hunc angariaverunt ut tolleret crucem ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et venerunt in locum qui dicitur Golgotha, quod est Calvariæ locus.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et dederunt ei vinum bibere cum felle mistum. Et cum gustasset, noluit bibere.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Postquam autem crucifixerunt eum, diviserunt vestimenta ejus, sortem mittentes : ut impleretur quod dictum est per prophetam dicentem : Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et sedentes servabant eum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et imposuerunt super caput ejus causam ipsius scriptam : Hic est Jesus rex Judæorum.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Tunc crucifixi sunt cum eo duo latrones : unus a dextris, et unus a sinistris.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Prætereuntes autem blasphemabant eum moventes capita sua,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et dicentes : Vah ! qui destruis templum Dei, et in triduo illud reædificas : salva temetipsum : si Filius Dei es, descende de cruce.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Similiter et principes sacerdotum illudentes cum scribis et senioribus dicebant :</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Alios salvos fecit, seipsum non potest salvum facere : si rex Israël est, descendat nunc de cruce, et credimus ei :</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>confidit in Deo : liberet nunc, si vult eum : dixit enim : Quia Filius Dei sum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Idipsum autem et latrones, qui crucifixi erant cum eo, improperabant ei.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>A sexta autem hora tenebræ factæ sunt super universam terram usque ad horam nonam.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Et circa horam nonam clamavit Jesus voce magna, dicens : Eli, Eli, lamma sabacthani ? hoc est : Deus meus, Deus meus, ut quid dereliquisti me ?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Quidam autem illic stantes, et audientes, dicebant : Eliam vocat iste.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Et continuo currens unus ex eis, acceptam spongiam implevit aceto, et imposuit arundini, et dabat ei bibere.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Ceteri vero dicebant : Sine, videamus an veniat Elias liberans eum.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Jesus autem iterum clamans voce magna, emisit spiritum.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Et ecce velum templi scissum est in duas partes a summo usque deorsum : et terra mota est, et petræ scissæ sunt,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>et monumenta aperta sunt : et multa corpora sanctorum, qui dormierant, surrexerunt.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et exeuntes de monumentis post resurrectionem ejus, venerunt in sanctam civitatem, et apparuerunt multis.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Centurio autem, et qui cum eo erant, custodientes Jesum, viso terræmotu, et his quæ fiebant, timuerunt valde, dicentes : Vere Filius Dei erat iste.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Erant autem ibi mulieres multæ a longe, quæ secutæ erant Jesum a Galilæa, ministrantes ei :</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>inter quas erat Maria Magdalene, et Maria Jacobi, et Joseph mater, et mater filiorum Zebedæi.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Cum autem sero factum esset, venit quidam homo dives ab Arimathæa, nomine Joseph, qui et ipse discipulus erat Jesu :</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>hic accessit ad Pilatum, et petiit corpus Jesu. Tunc Pilatus jussit reddi corpus.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Et accepto corpore, Joseph involvit illud in sindone munda,</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>et posuit illud in monumento suo novo, quod exciderat in petra. Et advolvit saxum magnum ad ostium monumenti, et abiit.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Erant autem ibi Maria Magdalene, et altera Maria, sedentes contra sepulchrum.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Altera autem die, quæ est post Parasceven, convenerunt principes sacerdotum et pharisæi ad Pilatum,</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>dicentes : Domine, recordati sumus, quia seductor ille dixit adhuc vivens : Post tres dies resurgam.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Jube ergo custodiri sepulchrum usque in diem tertium : ne forte veniant discipuli ejus, et furentur eum, et dicant plebi : Surrexit a mortuis : et erit novissimus error pejor priore.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Ait illis Pilatus : Habetis custodiam, ite, custodite sicut scitis.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Illi autem abeuntes, munierunt sepulchrum, signantes lapidem, cum custodibus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Matthew 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/28/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Matthew 28</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->27<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Matthew 26" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/re [\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\nd:C\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7f4ee\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n17:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Matthew 27 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MAT.27\",{\"bookId\":47,\"usfm\":\"MAT\",\"bookName\":\"Matthew\",\"drName\":\"Matthew\",\"chapter\":27,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And when morning was come, all the chief priests and ancients of the people took counsel against Jesus, that they might put him to death.\"},{\"verse\":2,\"text\":\"And they brought him bound and delivered him to Pontius Pilate the governor.\"},{\"verse\":3,\"text\":\"Then Judas, who betrayed him, seeing that he was condemned, repenting himself, brought back the thirty pieces of silver to the chief priests and ancients,\"},{\"verse\":4,\"text\":\"Saying: I have sinned in betraying innocent blood. But they said: What is that to us? Look thou to it.\"},{\"verse\":5,\"text\":\"And casting down the pieces of silver in the temple, he departed and went and hanged himself with an halter.\"},{\"verse\":6,\"text\":\"But the chief priests having taken the pieces of silver, said: It is not lawful to put them into the corbona, because it is the price of blood.\"},{\"verse\":7,\"text\":\"And after they had consulted together, they bought with them the potter’s field, to be a burying place for strangers.\"},{\"verse\":8,\"text\":\"For this cause that field was called Haceldama, that is, the field of blood, even to this day.\"},{\"verse\":9,\"text\":\"Then was fulfilled that which was spoken by Jeremias the prophet, saying: And they took the thirty pieces of silver, the price of him that was prized, whom they prized of the children of Israel.\"},{\"verse\":10,\"text\":\"And they gave them unto the potter’s field, as the Lord appointed to me.\"},{\"verse\":11,\"text\":\"And Jesus stood before the governor, and the governor asked him, saying: Art thou the king of the Jews? Jesus saith to him: Thou sayest it.\"},{\"verse\":12,\"text\":\"And when he was accused by the chief priests and ancients, he answered nothing.\"},{\"verse\":13,\"text\":\"Then Pilate saith to him: Dost not thou hear how great testimonies they allege against thee?\"},{\"verse\":14,\"text\":\"And he answered him to never a word, so that the governor wondered exceedingly.\"},{\"verse\":15,\"text\":\"Now upon the solemn day the governor was accustomed to release to the people one prisoner, whom they would.\"},{\"verse\":16,\"text\":\"And he had then a notorious prisoner that was called Barabbas.\"},{\"verse\":17,\"text\":\"They therefore being gathered together, Pilate said: Whom will you that I release to You: Barabbas, or Jesus that is called Christ?\"},{\"verse\":18,\"text\":\"For he knew that for envy they had delivered him.\"},{\"verse\":19,\"text\":\"And as he was sitting in the place of judgment, his wife sent to him, saying: Have thou nothing to do with that just man; for I have suffered many things this day in a dream because of him.\"},{\"verse\":20,\"text\":\"But the chief priests and ancients persuaded the people that they should ask Barabbas and make Jesus away.\"},{\"verse\":21,\"text\":\"And the governor answering, said to them: Whether will you of the two to be released unto you? But they said: Barabbas.\"},{\"verse\":22,\"text\":\"Pilate saith to them: What shall I do then with Jesus that is called Christ? They say all: Let him be crucified.\"},{\"verse\":23,\"text\":\"The governor said to them: Why, what evil hath he done? But they cried out the more, saying: Let him be crucified.\"},{\"verse\":24,\"text\":\"And Pilate seeing that he prevailed nothing, but that rather a tumult was made, taking water washed his hands before the people, saying: I am innocent of the blood of this just man. Look you to it.\"},{\"verse\":25,\"text\":\"And the whole people answering, said: His blood be upon us and upon our children.\"},{\"verse\":26,\"text\":\"Then he released to them Barabbas: and having scourged Jesus, delivered him unto them to be crucified.\"},{\"verse\":27,\"text\":\"Then the soldiers of the governor, taking Jesus into the hall, gathered together unto him the whole band.\"},{\"verse\":28,\"text\":\"And stripping him, they put a scarlet cloak about him.\"},{\"verse\":29,\"text\":\"And platting a crown of thorns, they put it upon his head, and a reed in his right hand. And bowing the knee before him, they mocked him, saying: Hail, King of the Jews.\"},{\"verse\":30,\"text\":\"And spitting upon him, they took the reed and struck his head.\"},{\"verse\":31,\"text\":\"And after they had mocked him, they took off the cloak from him and put on him his own garments and led him away to crucify him.\"},{\"verse\":32,\"text\":\"And going out, they found a man of Cyrene, named Simon: him they forced to take up his cross.\"},{\"verse\":33,\"text\":\"And they came to the place that is called Golgotha, which is the place of Calvary.\"},{\"verse\":34,\"text\":\"And they gave him wine to drink mingled with gall. And when he had tasted, he would not drink.\"},{\"verse\":35,\"text\":\"And after they had crucified him, they divided his garments, casting lots; that it might be fulfilled which was spoken by the prophet, saying: They divided my garments among them; and upon my vesture they cast lots.\"},{\"verse\":36,\"text\":\"And they sat and watched him.\"},{\"verse\":37,\"text\":\"And they put over his head his cause written: THIS IS JESUS THE KING OF THE JEWS.\"},{\"verse\":38,\"text\":\"Then were crucified with him two thieves: one on the right hand and one on the left.\"},{\"verse\":39,\"text\":\"And they that passed by blasphemed him, wagging their heads,\"},{\"verse\":40,\"text\":\"And saying: Vah, thou that destroyest the temple of God and in three days dost rebuild it: save thy own self. If thou be the Son of God, come down from the cross.\"},{\"verse\":41,\"text\":\"In like manner also the chief priests, with the scribes and ancients, mocking said:\"},{\"verse\":42,\"text\":\"He saved others: himself he cannot save. If he be the king of Israel, let him now come down from the cross: and we will believe him.\"},{\"verse\":43,\"text\":\"He trusted in God: let him now deliver him if he will have him. For he said: I am the Son of God.\"},{\"verse\":44,\"text\":\"And the selfsame thing the thieves also that were crucified with him reproached him with.\"},{\"verse\":45,\"text\":\"Now from the sixth hour, there was darkness over the whole earth, until the ninth hour.\"},{\"verse\":46,\"text\":\"And about the ninth hour, Jesus cried with a loud voice, saying: Eli, Eli, lamma sabacthani? That is, My God, My God, why hast thou forsaken me?\"},{\"verse\":47,\"text\":\"And some that stood there and heard said: This man calleth Elias.\"},{\"verse\":48,\"text\":\"And immediately one of them running took a sponge and filled it with vinegar and put it on a reed and gave him to drink.\"},{\"verse\":49,\"text\":\"And the others said: Let be. Let us see whether Elias will come to deliver him.\"},{\"verse\":50,\"text\":\"And Jesus again crying with a loud voice, yielded up the ghost.\"},{\"verse\":51,\"text\":\"And behold the veil of the temple was rent in two from the top even to the bottom: and the earth quaked and the rocks were rent.\"},{\"verse\":52,\"text\":\"And the graves were opened: and many bodies of the saints that had slept arose,\"},{\"verse\":53,\"text\":\"And coming out of the tombs after his resurrection, came into the holy city and appeared to many.\"},{\"verse\":54,\"text\":\"Now the centurion and they that were with him watching Jesus, having seen the earthquake and the things that were done, were sore afraid, saying: Indeed this was the Son of God.\"},{\"verse\":55,\"text\":\"And there were there many women afar off, who had followed Jesus from Galilee, ministering unto him:\"},{\"verse\":56,\"text\":\"Among whom was Mary Magdalen and Mary the mother of James and Joseph and the mother of the sons of Zebedee.\"},{\"verse\":57,\"text\":\"And when it was evening, there came a certain rich man of Arimathea, named Joseph, who also himself was a disciple of Jesus.\"},{\"verse\":58,\"text\":\"He went to Pilate and asked the body of Jesus. Then Pilate commanded that the body should be delivered.\"},{\"verse\":59,\"text\":\"And Joseph taking the body wrapped it up in a clean linen cloth:\"},{\"verse\":60,\"text\":\"And laid it in his own new monument, which he had hewed out in a rock. And he rolled a great stone to the door of the monument and went his way.\"},{\"verse\":61,\"text\":\"And there was there Mary Magdalen and the other Mary, sitting over against the sepulchre.\"},{\"verse\":62,\"text\":\"And the next day, which followed the day of preparation, the chief priests and the Pharisees came together to Pilate,\"},{\"verse\":63,\"text\":\"Saying: Sir, we have remembered, that that seducer said, while he was yet alive: After three days I will rise again.\"},{\"verse\":64,\"text\":\"Command therefore the sepulchre to be guarded until the third day: lest perhaps his disciples come and steal him away and say to the people: He is risen from the dead. And the last error shall be worse than the first.\"},{\"verse\":65,\"text\":\"Pilate saith to them: You have a guard. Go, guard it as you know.\"},{\"verse\":66,\"text\":\"And they departing, made the sepulchre sure, sealing the stone and setting guards.\"}],\"vul\":[{\"verse\":1,\"text\":\"Mane autem facto, consilium inierunt omnes principes sacerdotum et seniores populi adversus Jesum, ut eum morti traderent.\"},{\"verse\":2,\"text\":\"Et vinctum adduxerunt eum, et tradiderunt Pontio Pilato præsidi.\"},{\"verse\":3,\"text\":\"Tunc videns Judas, qui eum tradidit, quod damnatus esset, pœnitentia ductus, retulit triginta argenteos principibus sacerdotum, et senioribus,\"},{\"verse\":4,\"text\":\"dicens : Peccavi, tradens sanguinem justum. At illi dixerunt : Quid ad nos ? tu videris.\"},{\"verse\":5,\"text\":\"Et projectis argenteis in templo, recessit : et abiens laqueo se suspendit.\"},{\"verse\":6,\"text\":\"Principes autem sacerdotum, acceptis argenteis, dixerunt : Non licet eos mittere in corbonam : quia pretium sanguinis est.\"},{\"verse\":7,\"text\":\"Consilio autem inito, emerunt ex illis agrum figuli, in sepulturam peregrinorum.\"},{\"verse\":8,\"text\":\"Propter hoc vocatus est ager ille, Haceldama, hoc est, Ager sanguinis, usque in hodiernum diem.\"},{\"verse\":9,\"text\":\"Tunc impletum est quod dictum est per Jeremiam prophetam, dicentem : Et acceperunt triginta argenteos pretium appretiati, quem appretiaverunt a filiis Israël :\"},{\"verse\":10,\"text\":\"et dederunt eos in agrum figuli, sicut constituit mihi Dominus.\"},{\"verse\":11,\"text\":\"Jesus autem stetit ante præsidem, et interrogavit eum præses, dicens : Tu es rex Judæorum ? Dicit illi Jesus : Tu dicis.\"},{\"verse\":12,\"text\":\"Et cum accusaretur a principibus sacerdotum et senioribus, nihil respondit.\"},{\"verse\":13,\"text\":\"Tunc dicit illi Pilatus : Non audis quanta adversum te dicunt testimonia ?\"},{\"verse\":14,\"text\":\"Et non respondit ei ad ullum verbum, ita ut miraretur præses vehementer.\"},{\"verse\":15,\"text\":\"Per diem autem solemnem consueverat præses populo dimittere unum vinctum, quem voluissent :\"},{\"verse\":16,\"text\":\"habebat autem tunc vinctum insignem, qui dicebatur Barabbas.\"},{\"verse\":17,\"text\":\"Congregatis ergo illis, dixit Pilatus : Quem vultis dimittam vobis : Barabbam, an Jesum, qui dicitur Christus ?\"},{\"verse\":18,\"text\":\"Sciebat enim quod per invidiam tradidissent eum.\"},{\"verse\":19,\"text\":\"Sedente autem illo pro tribunali, misit ad eum uxor ejus, dicens : Nihil tibi, et justo illi : multa enim passa sum hodie per visum propter eum.\"},{\"verse\":20,\"text\":\"Principes autem sacerdotum et seniores persuaserunt populis ut peterent Barabbam, Jesum vero perderent.\"},{\"verse\":21,\"text\":\"Respondens autem præses, ait illis : Quem vultis vobis de duobus dimitti ? At illi dixerunt : Barabbam.\"},{\"verse\":22,\"text\":\"Dicit illis Pilatus : Quid igitur faciam de Jesu, qui dicitur Christus ?\"},{\"verse\":23,\"text\":\"Dicunt omnes : Crucifigatur. Ait illis præses : Quid enim mali fecit ? At illi magis clamabant dicentes : Crucifigatur.\"},{\"verse\":24,\"text\":\"Videns autem Pilatus quia nihil proficeret, sed magis tumultus fieret : accepta aqua, lavit manus coram populo, dicens : Innocens ego sum a sanguine justi hujus : vos videritis.\"},{\"verse\":25,\"text\":\"Et respondens universus populus, dixit : Sanguis ejus super nos, et super filios nostros.\"},{\"verse\":26,\"text\":\"Tunc dimisit illis Barabbam : Jesum autem flagellatum tradidit eis ut crucifigeretur.\"},{\"verse\":27,\"text\":\"Tunc milites præsidis suscipientes Jesum in prætorium, congregaverunt ad eum universam cohortem :\"},{\"verse\":28,\"text\":\"et exuentes eum, chlamydem coccineam circumdederunt ei,\"},{\"verse\":29,\"text\":\"et plectentes coronam de spinis, posuerunt super caput ejus, et arundinem in dextera ejus. Et genu flexo ante eum, illudebant ei, dicentes : Ave rex Judæorum.\"},{\"verse\":30,\"text\":\"Et exspuentes in eum, acceperunt arundinem, et percutiebant caput ejus.\"},{\"verse\":31,\"text\":\"Et postquam illuserunt ei, exuerunt eum chlamyde, et induerunt eum vestimentis ejus, et duxerunt eum ut crucifigerent.\"},{\"verse\":32,\"text\":\"Exeuntes autem invenerunt hominem Cyrenæum, nomine Simonem : hunc angariaverunt ut tolleret crucem ejus.\"},{\"verse\":33,\"text\":\"Et venerunt in locum qui dicitur Golgotha, quod est Calvariæ locus.\"},{\"verse\":34,\"text\":\"Et dederunt ei vinum bibere cum felle mistum. Et cum gustasset, noluit bibere.\"},{\"verse\":35,\"text\":\"Postquam autem crucifixerunt eum, diviserunt vestimenta ejus, sortem mittentes : ut impleretur quod dictum est per prophetam dicentem : Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem.\"},{\"verse\":36,\"text\":\"Et sedentes servabant eum.\"},{\"verse\":37,\"text\":\"Et imposuerunt super caput ejus causam ipsius scriptam : Hic est Jesus rex Judæorum.\"},{\"verse\":38,\"text\":\"Tunc crucifixi sunt cum eo duo latrones : unus a dextris, et unus a sinistris.\"},{\"verse\":39,\"text\":\"Prætereuntes autem blasphemabant eum moventes capita sua,\"},{\"verse\":40,\"text\":\"et dicentes : Vah ! qui destruis templum Dei, et in triduo illud reædificas : salva temetipsum : si Filius Dei es, descende de cruce.\"},{\"verse\":41,\"text\":\"Similiter et principes sacerdotum illudentes cum scribis et senioribus dicebant :\"},{\"verse\":42,\"text\":\"Alios salvos fecit, seipsum non potest salvum facere : si rex Israël est, descendat nunc de cruce, et credimus ei :\"},{\"verse\":43,\"text\":\"confidit in Deo : liberet nunc, si vult eum : dixit enim : Quia Filius Dei sum.\"},{\"verse\":44,\"text\":\"Idipsum autem et latrones, qui crucifixi erant cum eo, improperabant ei.\"},{\"verse\":45,\"text\":\"A sexta autem hora tenebræ factæ sunt super universam terram usque ad horam nonam.\"},{\"verse\":46,\"text\":\"Et circa horam nonam clamavit Jesus voce magna, dicens : Eli, Eli, lamma sabacthani ? hoc est : Deus meus, Deus meus, ut quid dereliquisti me ?\"},{\"verse\":47,\"text\":\"Quidam autem illic stantes, et audientes, dicebant : Eliam vocat iste.\"},{\"verse\":48,\"text\":\"Et continuo currens unus ex eis, acceptam spongiam implevit aceto, et imposuit arundini, et dabat ei bibere.\"},{\"verse\":49,\"text\":\"Ceteri vero dicebant : Sine, videamus an veniat Elias liberans eum.\"},{\"verse\":50,\"text\":\"Jesus autem iterum clamans voce magna, emisit spiritum.\"},{\"verse\":51,\"text\":\"Et ecce velum templi scissum est in duas partes a summo usque deorsum : et terra mota est, et petræ scissæ sunt,\"},{\"verse\":52,\"text\":\"et monumenta aperta sunt : et multa corpora sanctorum, qui dormierant, surrexerunt.\"},{\"verse\":53,\"text\":\"Et exeuntes de monumentis post resurrectionem ejus, venerunt in sanctam civitatem, et apparuerunt multis.\"},{\"verse\":54,\"text\":\"Centurio autem, et qui cum eo erant, custodientes Jesum, viso terræmotu, et his quæ fiebant, timuerunt valde, dicentes : Vere Filius Dei erat iste.\"},{\"verse\":55,\"text\":\"Erant autem ibi mulieres multæ a longe, quæ secutæ erant Jesum a Galilæa, ministrantes ei :\"},{\"verse\":56,\"text\":\"inter quas erat Maria Magdalene, et Maria Jacobi, et Joseph mater, et mater filiorum Zebedæi.\"},{\"verse\":57,\"text\":\"Cum autem sero factum esset, venit quidam homo dives ab Arimathæa, nomine Joseph, qui et ipse discipulus erat Jesu :\"},{\"verse\":58,\"text\":\"hic accessit ad Pilatum, et petiit corpus Jesu. Tunc Pilatus jussit reddi corpus.\"},{\"verse\":59,\"text\":\"Et accepto corpore, Joseph involvit illud in sindone munda,\"},{\"verse\":60,\"text\":\"et posuit illud in monumento suo novo, quod exciderat in petra. Et advolvit saxum magnum ad ostium monumenti, et abiit.\"},{\"verse\":61,\"text\":\"Erant autem ibi Maria Magdalene, et altera Maria, sedentes contra sepulchrum.\"},{\"verse\":62,\"text\":\"Altera autem die, quæ est post Parasceven, convenerunt principes sacerdotum et pharisæi ad Pilatum,\"},{\"verse\":63,\"text\":\"dicentes : Domine, recordati sumus, quia seductor ille dixit adhuc vivens : Post tres dies resurgam.\"},{\"verse\":64,\"text\":\"Jube ergo custodiri sepulchrum usque in diem tertium : ne forte veniant discipuli ejus, et furentur eum, et dicant plebi : Surrexit a mortuis : et erit novissimus error pejor priore.\"},{\"verse\":65,\"text\":\"Ait illis Pilatus : Habetis custodiam, ite, custodite sicut scitis.\"},{\"verse\":66,\"text\":\"Illi autem abeuntes, munierunt sepulchrum, signantes lapidem, cum custodibus.\"}],\"summary\":\"The continuation of the history of the passion of Christ. His death and burial.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":26,\"label\":\"Matthew 26\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":28,\"label\":\"Matthew 28\"}}]]\n"])</script></body></html>
