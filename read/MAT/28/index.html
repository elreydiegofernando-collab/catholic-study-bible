1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And in the end of the sabbath, when it began to dawn towards the first day of the week, came Mary Magdalen and the other Mary, to see the sepulchre.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And behold there was a great earthquake. For an angel of the Lord descended from heaven and coming rolled back the stone and sat upon it.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And his countenance was as lightning and his raiment as snow.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And for fear of him, the guards were struck with terror and became as dead men.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the angel answering, said to the women: Fear not you: for I know that you seek Jesus who was crucified.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He is not here. For he is risen, as he said. Come, and see the place where the Lord was laid.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And going quickly, tell ye his disciples that he is risen. And behold he will go before you into Galilee. There you shall see him. Lo, I have foretold it to you.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they went out quickly from the sepulchre with fear and great joy, running to tell his disciples.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And behold, Jesus met them, saying: All hail. But they came up and took hold of his feet and adored him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Then Jesus said to them: Fear not. Go, tell my brethren that they go into Galilee. There they shall see me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who when they were departed, behold, some of the guards came into the city and told the chief priests all things that had been done.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they being assembled together with the ancients, taking counsel, gave a great sum of money to the soldiers,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Saying: Say you, His disciples came by night and stole him away when we were asleep.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And if the governor shall hear of this, we will persuade him and secure you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So they taking the money, did as they were taught: and this word was spread abroad among the Jews even unto this day.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the eleven disciples went into Galilee, unto the mountain where Jesus had appointed them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And seeing him they adored: but some doubted.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Jesus coming, spoke to them, saying: All power is given to me in heaven and in earth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Going therefore, teach ye all nations: baptizing them in the name of the Father and of the Son and of the Holy Ghost.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Teaching them to observe all things whatsoever I have commanded you. And behold I am with you all days, even to the consummation of the world.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vespere autem sabbati, quæ lucescit in prima sabbati, venit Maria Magdalene, et altera Maria, videre sepulchrum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ecce terræmotus factus est magnus. Angelus enim Domini descendit de cælo : et accedens revolvit lapidem, et sedebat super eum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>erat autem aspectus ejus sicut fulgur : et vestimentum ejus sicut nix.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Præ timore autem ejus exterriti sunt custodes, et facti sunt velut mortui.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Respondens autem angelus dixit mulieribus : Nolite timere vos : scio enim, quod Jesum, qui crucifixus est, quæritis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non est hic : surrexit enim, sicut dixit : venite, et videte locum ubi positus erat Dominus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cito euntes, dicite discipulis ejus quia surrexit : et ecce præcedit vos in Galilæam : ibi eum videbitis : ecce prædixi vobis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et exierunt cito de monumento cum timore et gaudio magno, currentes nuntiare discipulis ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ecce Jesus occurrit illis, dicens : Avete. Illæ autem accesserunt, et tenuerunt pedes ejus, et adoraverunt eum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Tunc ait illis Jesus : Nolite timere : ite, nuntiate fratribus meis ut eant in Galilæam ; ibi me videbunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quæ cum abiissent, ecce quidam de custodibus venerunt in civitatem, et nuntiaverunt principibus sacerdotum omnia quæ facta fuerant.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et congregati cum senioribus consilio accepto, pecuniam copiosam dederunt militibus,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>dicentes : Dicite quia discipuli ejus nocte venerunt, et furati sunt eum, nobis dormientibus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et si hoc auditum fuerit a præside, nos suadebimus ei, et securos vos faciemus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>At illi, accepta pecunia, fecerunt sicut erant edocti. Et divulgatum est verbum istud apud Judæos, usque in hodiernum diem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Undecim autem discipuli abierunt in Galilæam in montem ubi constituerat illis Jesus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et videntes eum adoraverunt : quidam autem dubitaverunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et accedens Jesus locutus est eis, dicens : Data est mihi omnis potestas in cælo et in terra :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>euntes ergo docete omnes gentes : baptizantes eos in nomine Patris, et Filii, et Spiritus Sancti :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>docentes eos servare omnia quæcumque mandavi vobis : et ecce ego vobiscum sum omnibus diebus, usque ad consummationem sæculi.</button></div> c/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MAT.28\",{\"bookId\":47,\"usfm\":\"MAT\",\"bookName\":\"Matthew\",\"drName\":\"Matthew\",\"chapter\":28,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"And in the end of the sabbath, when it began to dawn towards the first day of the week, came Mary Magdalen and the other Mary, to see the sepulchre.\"},{\"verse\":2,\"text\":\"And behold there was a great earthquake. For an angel of the Lord descended from heaven and coming rolled back the stone and sat upon it.\"},{\"verse\":3,\"text\":\"And his countenance was as lightning and his raiment as snow.\"},{\"verse\":4,\"text\":\"And for fear of him, the guards were struck with terror and became as dead men.\"},{\"verse\":5,\"text\":\"And the angel answering, said to the women: Fear not you: for I know that you seek Jesus who was crucified.\"},{\"verse\":6,\"text\":\"He is not here. For he is risen, as he said. Come, and see the place where the Lord was laid.\"},{\"verse\":7,\"text\":\"And going quickly, tell ye his disciples that he is risen. And behold he will go before you into Galilee. There you shall see him. Lo, I have foretold it to you.\"},{\"verse\":8,\"text\":\"And they went out quickly from the sepulchre with fear and great joy, running to tell his disciples.\"},{\"verse\":9,\"text\":\"And behold, Jesus met them, saying: All hail. But they came up and took hold of his feet and adored him.\"},{\"verse\":10,\"text\":\"Then Jesus said to them: Fear not. Go, tell my brethren that they go into Galilee. There they shall see me.\"},{\"verse\":11,\"text\":\"Who when they were departed, behold, some of the guards came into the city and told the chief priests all things that had been done.\"},{\"verse\":12,\"text\":\"And they being assembled together with the ancients, taking counsel, gave a great sum of money to the soldiers,\"},{\"verse\":13,\"text\":\"Saying: Say you, His disciples came by night and stole him away when we were asleep.\"},{\"verse\":14,\"text\":\"And if the governor shall hear of this, we will persuade him and secure you.\"},{\"verse\":15,\"text\":\"So they taking the money, did as they were taught: and this word was spread abroad among the Jews even unto this day.\"},{\"verse\":16,\"text\":\"And the eleven disciples went into Galilee, unto the mountain where Jesus had appointed them.\"},{\"verse\":17,\"text\":\"And seeing him they adored: but some doubted.\"},{\"verse\":18,\"text\":\"And Jesus coming, spoke to them, saying: All power is given to me in heaven and in earth.\"},{\"verse\":19,\"text\":\"Going therefore, teach ye all nations: baptizing them in the name of the Father and of the Son and of the Holy Ghost.\"},{\"verse\":20,\"text\":\"Teaching them to observe all things whatsoever I have commanded you. And behold I am with you all days, even to the consummation of the world.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vespere autem sabbati, quæ lucescit in prima sabbati, venit Maria Magdalene, et altera Maria, videre sepulchrum.\"},{\"verse\":2,\"text\":\"Et ecce terræmotus factus est magnus. Angelus enim Domini descendit de cælo : et accedens revolvit lapidem, et sedebat super eum :\"},{\"verse\":3,\"text\":\"erat autem aspectus ejus sicut fulgur : et vestimentum ejus sicut nix.\"},{\"verse\":4,\"text\":\"Præ timore autem ejus exterriti sunt custodes, et facti sunt velut mortui.\"},{\"verse\":5,\"text\":\"Respondens autem angelus dixit mulieribus : Nolite timere vos : scio enim, quod Jesum, qui crucifixus est, quæritis.\"},{\"verse\":6,\"text\":\"Non est hic : surrexit enim, sicut dixit : venite, et videte locum ubi positus erat Dominus.\"},{\"verse\":7,\"text\":\"Et cito euntes, dicite discipulis ejus quia surrexit : et ecce præcedit vos in Galilæam : ibi eum videbitis : ecce prædixi vobis.\"},{\"verse\":8,\"text\":\"Et exierunt cito de monumento cum timore et gaudio magno, currentes nuntiare discipulis ejus.\"},{\"verse\":9,\"text\":\"Et ecce Jesus occurrit illis, dicens : Avete. Illæ autem accesserunt, et tenuerunt pedes ejus, et adoraverunt eum.\"},{\"verse\":10,\"text\":\"Tunc ait illis Jesus : Nolite timere : ite, nuntiate fratribus meis ut eant in Galilæam ; ibi me videbunt.\"},{\"verse\":11,\"text\":\"Quæ cum abiissent, ecce quidam de custodibus venerunt in civitatem, et nuntiaverunt principibus sacerdotum omnia quæ facta fuerant.\"},{\"verse\":12,\"text\":\"Et congregati cum senioribus consilio accepto, pecuniam copiosam dederunt militibus,\"},{\"verse\":13,\"text\":\"dicentes : Dicite quia discipuli ejus nocte venerunt, et furati sunt eum, nobis dormientibus.\"},{\"verse\":14,\"text\":\"Et si hoc auditum fuerit a præside, nos suadebimus ei, et securos vos faciemus.\"},{\"verse\":15,\"text\":\"At illi, accepta pecunia, fecerunt sicut erant edocti. Et divulgatum est verbum istud apud Judæos, usque in hodiernum diem.\"},{\"verse\":16,\"text\":\"Undecim autem discipuli abierunt in Galilæam in montem ubi constituerat illis Jesus.\"},{\"verse\":17,\"text\":\"Et videntes eum adoraverunt : quidam autem dubitaverunt.\"},{\"verse\":18,\"text\":\"Et accedens Jesus locutus est eis, dicens : Data est mihi omnis potestas in cælo et in terra :\"},{\"verse\":19,\"text\":\"euntes ergo docete omnes gentes : baptizantes eos in nomine Patris, et Filii, et Spiritus Sancti :\"},{\"verse\":20,\"text\":\"docentes eos servare omnia quæcumque mandavi vobis : et ecce ego vobiscum sum omnibus diebus, usque ad consummationem sæculi.\"}],\"summary\":\"The resurrection of Christ. His commission to his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":27,\"label\":\"Matthew 27\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":1,\"label\":\"Mark 1\"}}]]\n"])</script></body></html>
