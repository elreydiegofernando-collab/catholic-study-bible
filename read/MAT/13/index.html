<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Matthew 13 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Matthew<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MAT/">About <!-- -->Matthew</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parables of the sower and the cockle: of the mustardseed, etc.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The same day Jesus going out of the house, sat by the sea side.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And great multitudes were gathered together unto him, so that he went up into a boat and sat: and all the multitude stood on the shore.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he spoke to them many things in parables, saying: Behold the sower went forth to sow.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And whilst he soweth some fell by the way side, and the birds of the air came and ate them up.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And other some fell upon stony ground, where they had not much earth: and they sprung up immediately, because they had no deepness of earth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when the sun was up they were scorched: and because they had not root, they withered away.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And others fell among thorns: and the thorns grew up and choked them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And others fell upon good ground: and they brought forth fruit, some an hundred fold, some sixty fold, and some thirty fold.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that hath ears to hear, let him hear.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And his disciples came and said to him: Why speakest thou to them in parables?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who answered and said to them: Because to you it is given to know the mysteries of the kingdom of heaven: but to them it is not given.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For he that hath, to him shall be given, and he shall abound: but he that hath not, from him shall be taken away that also which he hath.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Therefore do I speak to them in parables: because seeing they see not, and hearing they hear not, neither do they understand.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the prophecy of Isaias is fulfilled in them, who saith: By hearing you shall hear, and shall not understand: and seeing you shall see, and shall not perceive.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For the heart of this people is grown gross, and with their ears they have been dull of hearing, and their eyes they have shut: lest at any time they should see with their eyes, and hear with their ears, and understand with their heart, and be converted, and I should heal them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But blessed are your eyes, because they see, and your ears, because they hear.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For, amen, I say to you, many prophets and just men have desired to see the things that you see, and have not seen them: and to hear the things that you hear and have not heard them.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hear you therefore the parable of the sower.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>When any one heareth the word of the kingdom, and understandeth it not, there cometh the wicked one, and catcheth away that which was sown in his heart: this is he that received the seed by the way side.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he that received the seed upon stony ground, is he that heareth the word, and immediately receiveth it with joy.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Yet hath he not root in himself, but is only for a time: and when there ariseth tribulation and persecution because of the word, he is presently scandalized.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he that received the seed among thorns, is he that heareth the word, and the care of this world and the deceitfulness of riches choketh up the word, and he becometh fruitless.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But he that received the seed upon good ground, is he that heareth the word, and understandeth, and beareth fruit, and yieldeth the one an hundredfold, and another sixty, and another thirty.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Another parable he proposed to them, saying: The kingdom of heaven is likened to a man that sowed good seed in his field.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But while men were asleep, his enemy came and oversowed cockle among the wheat and went his way.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And when the blade was sprung up, and had brought forth fruit, then appeared also the cockle.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the servants of the good man of the house coming said to him. Sir, didst thou not sow good seed in thy field? Whence then hath it cockle?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said to them: An enemy hath done this. And the servants said to him: Wilt thou that we go and gather it up?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he said: No, lest perhaps gathering up the cockle, you root up the wheat also together with it.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Suffer both to grow until the harvest, and in the time of the harvest I will say to the reapers: Gather up first the cockle, and bind it into bundles to burn, but the wheat gather ye into my barn.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Another parable he proposed unto them, saying: The kingdom of heaven is like to a grain of mustard seed, which a man took and sowed in his field.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Which is the least indeed of all seeds; but when it is grown up, it is greater than all herbs, and becometh a tree, so that the birds of the air come, and dwell in the branches thereof.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Another parable he spoke to them: The kingdom of heaven is like to leaven, which a woman took and hid in three measures of meal, until the whole was leavened.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>All these things Jesus spoke in parables to the multitudes: and without parables he did not speak to them.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>That it might be fulfilled which was spoken by the prophet, saying: I will open my mouth in parables, I will utter things hidden from the foundation of the world.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Then having sent away the multitudes, he came into the house, and his disciples came to him, saying: Expound to us the parable of the cockle of the field.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Who made answer and said to them: He that soweth the good seed is the Son of man.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And the field is the world. And the good seed are the children of the kingdom. And the cockle are the children of the wicked one.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And the enemy that sowed them, is the devil. But the harvest is the end of the world. And the reapers are the angels.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Even as cockle therefore is gathered up, and burnt with fire: so shall it be at the end of the world.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The Son of man shall send his angels, and they shall gather out of his kingdom all scandals, and them that work iniquity.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Then shall the just shine as the sun, in the kingdom of their Father. He that hath ears to hear, let him hear.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>The kingdom of heaven is like unto a treasure hidden in a field. Which a man having found, hid it, and for joy thereof goeth, and selleth all that he hath, and buyeth that field.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Again the kingdom of heaven is like to a merchant seeking good pearls.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Who when he had found one pearl of great price, went his way, and sold all that he had, and bought it.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Again the kingdom of heaven is like to a net cast into the sea, and gathering together of all kinds of fishes.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Which, when it was filled, they drew out, and sitting by the shore, they chose out the good into vessels, but the bad they cast forth.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>So shall it be at the end of the world. The angels shall go out, and shall separate the wicked from among the just.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Have ye understood all these things? They say to him: Yes.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>He said unto them: Therefore every scribe instructed in the kingdom of heaven, is like to a man that is a householder, who bringeth forth out of his treasure new things and old.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And it came to pass: when Jesus had finished these parables, he passed from thence.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And coming into his own country, he taught them in their synagogues, so that they wondered and said: How came this man by this wisdom and miracles?</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Is not this the carpenter’s son? Is not his mother called Mary, and his brethren James, and Joseph, and Simon, and Jude:</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And his sisters, are they not all with us? Whence therefore hath he all these things?</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And they were scandalized in his regard. But Jesus said to them: A prophet is not without honour, save in his own country, and in his own house.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>And he wrought not many miracles there, because of their unbelief.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In illo die exiens Jesus de domo, sedebat secus mare.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et congregatæ sunt ad eum turbæ multæ, ita ut naviculam ascendens sederet : et omnis turba stabat in littore,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et locutus est eis multa in parabolis, dicens : Ecce exiit qui seminat, seminare.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dum seminat, quædam ceciderunt secus viam, et venerunt volucres cæli, et comederunt ea.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Alia autem ceciderunt in petrosa, ubi non habebant terram multam : et continuo exorta sunt, quia non habebant altitudinem terræ :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>sole autem orto æstuaverunt ; et quia non habebant radicem, aruerunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Alia autem ceciderunt in spinas : et creverunt spinæ, et suffocaverunt ea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Alia autem ceciderunt in terram bonam : et dabant fructum, aliud centesimum, aliud sexagesimum, aliud trigesimum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui habet aures audiendi, audiat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et accedentes discipuli dixerunt ei : Quare in parabolis loqueris eis ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui respondens, ait illis : Quia vobis datum est nosse mysteria regni cælorum : illis autem non est datum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui enim habet, dabitur ei, et abundabit : qui autem non habet, et quod habet auferetur ab eo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ideo in parabolis loquor eis : quia videntes non vident, et audientes non audiunt, neque intelligunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et adimpletur in eis prophetia Isaiæ, dicentis : Auditu audietis, et non intelligetis : et videntes videbitis, et non videbitis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Incrassatum est enim cor populi hujus, et auribus graviter audierunt, et oculos suos clauserunt : nequando videant oculis, et auribus audiant, et corde intelligant, et convertantur, et sanem eos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vestri autem beati oculi quia vident, et aures vestræ quia audiunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Amen quippe dico vobis, quia multi prophetæ et justi cupierunt videre quæ videtis, et non viderunt : et audire quæ auditis, et non audierunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vos ergo audite parabolam seminantis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnis qui audit verbum regni, et non intelligit, venit malus, et rapit quod seminatum est in corde ejus : hic est qui secus viam seminatus est.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui autem super petrosa seminatus est, hic est qui verbum audit, et continuo cum gaudio accipit illud :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>non habet autem in se radicem, sed est temporalis : facta autem tribulatione et persecutione propter verbum, continuo scandalizatur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui autem seminatus est in spinis, hic est qui verbum audit, et sollicitudo sæculi istius, et fallacia divitiarum suffocat verbum, et sine fructu efficitur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui vero in terram bonam seminatus est, hic est qui audit verbum, et intelligit, et fructum affert, et facit aliud quidem centesimum, aliud autem sexagesimum, aliud vero trigesimum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Aliam parabolam proposuit illis, dicens : Simile factum est regnum cælorum homini, qui seminavit bonum semen in agro suo :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>cum autem dormirent homines, venit inimicus ejus, et superseminavit zizania in medio tritici, et abiit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cum autem crevisset herba, et fructum fecisset, tunc apparuerunt et zizania.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Accedentes autem servi patrisfamilias, dixerunt ei : Domine, nonne bonum semen seminasti in agro tuo ? unde ergo habet zizania ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et ait illis : Inimicus homo hoc fecit. Servi autem dixerunt ei : Vis, imus, et colligimus ea ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et ait : Non : ne forte colligentes zizania, eradicetis simul cum eis et triticum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sinite utraque crescere usque ad messem, et in tempore messis dicam messoribus : Colligite primum zizania, et alligate ea in fasciculos ad comburendum : triticum autem congregate in horreum meum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Aliam parabolam proposuit eis dicens : Simile est regnum cælorum grano sinapis, quod accipiens homo seminavit in agro suo :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>quod minimum quidem est omnibus seminibus : cum autem creverit, majus est omnibus oleribus, et fit arbor, ita ut volucres cæli veniant, et habitent in ramis ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Aliam parabolam locutus est eis : Simile est regnum cælorum fermento, quod acceptum mulier abscondit in farinæ satis tribus, donec fermentatum est totum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hæc omnia locutus est Jesus in parabolis ad turbas : et sine parabolis non loquebatur eis :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>ut impleretur quod dictum erat per prophetam dicentem : Aperiam in parabolis os meum ; eructabo abscondita a constitutione mundi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Tunc, dimissis turbis, venit in domum : et accesserunt ad eum discipuli ejus, dicentes : Edissere nobis parabolam zizaniorum agri.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Qui respondens ait illis : Qui seminat bonum semen, est Filius hominis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ager autem est mundus. Bonum vero semen, hi sunt filii regni. Zizania autem, filii sunt nequam.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Inimicus autem, qui seminavit ea, est diabolus. Messis vero, consummatio sæculi est. Messores autem, angeli sunt.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Sicut ergo colliguntur zizania, et igni comburuntur : sic erit in consummatione sæculi.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Mittet Filius hominis angelos suos, et colligent de regno ejus omnia scandala, et eos qui faciunt iniquitatem :</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>et mittent eos in caminum ignis. Ibi erit fletus et stridor dentium.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Tunc justi fulgebunt sicut sol in regno Patris eorum. Qui habet aures audiendi, audiat.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Simile est regnum cælorum thesauro abscondito in agro : quem qui invenit homo, abscondit, et præ gaudio illius vadit, et vendit universa quæ habet, et emit agrum illum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Iterum simile est regnum cælorum homini negotiatori, quærenti bonas margaritas.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Inventa autem una pretiosa margarita, abiit, et vendidit omnia quæ habuit, et emit eam.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Iterum simile est regnum cælorum sagenæ missæ in mare, et ex omni genere piscium congreganti.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Quam, cum impleta esset, educentes, et secus littus sedentes, elegerunt bonis in vasa, malos autem foras miserunt.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Sic erit in consummatione sæculi : exibunt angeli, et separabunt malos de medio justorum,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>et mittent eos in caminum ignis : ibi erit fletus, et stridor dentium.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Intellexistis hæc omnia ? Dicunt ei : Etiam.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Ait illis : Ideo omnis scriba doctus in regno cælorum, similis est homini patrifamilias, qui profert de thesauro suo nova et vetera.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et factum est, cum consummasset Jesus parabolas istas, transiit inde.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Et veniens in patriam suam, docebat eos in synagogis eorum, ita ut mirarentur, et dicerent : Unde huic sapientia hæc, et virtutes ?</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Nonne hic est fabri filius ? nonne mater ejus dicitur Maria, et fratres ejus, Jacobus, et Joseph, et Simon, et Judas ?</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>et sorores ejus, nonne omnes apud nos sunt ? unde ergo huic omnia ista ?</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Et scandalizabantur in eo. Jesus autem dixit eis : Non est propheta sine honore, nisi in patria sua, et in domo sua.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Et non fecit ibi virtutes multas propter incredulitatem illorum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Matthew 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MAT/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Matthew 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->28<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Matthew 12" class="inline-flex h-12 w-14 shrink-0 items-center just con\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MAT.13\",{\"bookId\":47,\"usfm\":\"MAT\",\"bookName\":\"Matthew\",\"drName\":\"Matthew\",\"chapter\":13,\"totalChapters\":28,\"dra\":[{\"verse\":1,\"text\":\"The same day Jesus going out of the house, sat by the sea side.\"},{\"verse\":2,\"text\":\"And great multitudes were gathered together unto him, so that he went up into a boat and sat: and all the multitude stood on the shore.\"},{\"verse\":3,\"text\":\"And he spoke to them many things in parables, saying: Behold the sower went forth to sow.\"},{\"verse\":4,\"text\":\"And whilst he soweth some fell by the way side, and the birds of the air came and ate them up.\"},{\"verse\":5,\"text\":\"And other some fell upon stony ground, where they had not much earth: and they sprung up immediately, because they had no deepness of earth.\"},{\"verse\":6,\"text\":\"And when the sun was up they were scorched: and because they had not root, they withered away.\"},{\"verse\":7,\"text\":\"And others fell among thorns: and the thorns grew up and choked them.\"},{\"verse\":8,\"text\":\"And others fell upon good ground: and they brought forth fruit, some an hundred fold, some sixty fold, and some thirty fold.\"},{\"verse\":9,\"text\":\"He that hath ears to hear, let him hear.\"},{\"verse\":10,\"text\":\"And his disciples came and said to him: Why speakest thou to them in parables?\"},{\"verse\":11,\"text\":\"Who answered and said to them: Because to you it is given to know the mysteries of the kingdom of heaven: but to them it is not given.\"},{\"verse\":12,\"text\":\"For he that hath, to him shall be given, and he shall abound: but he that hath not, from him shall be taken away that also which he hath.\"},{\"verse\":13,\"text\":\"Therefore do I speak to them in parables: because seeing they see not, and hearing they hear not, neither do they understand.\"},{\"verse\":14,\"text\":\"And the prophecy of Isaias is fulfilled in them, who saith: By hearing you shall hear, and shall not understand: and seeing you shall see, and shall not perceive.\"},{\"verse\":15,\"text\":\"For the heart of this people is grown gross, and with their ears they have been dull of hearing, and their eyes they have shut: lest at any time they should see with their eyes, and hear with their ears, and understand with their heart, and be converted, and I should heal them.\"},{\"verse\":16,\"text\":\"But blessed are your eyes, because they see, and your ears, because they hear.\"},{\"verse\":17,\"text\":\"For, amen, I say to you, many prophets and just men have desired to see the things that you see, and have not seen them: and to hear the things that you hear and have not heard them.\"},{\"verse\":18,\"text\":\"Hear you therefore the parable of the sower.\"},{\"verse\":19,\"text\":\"When any one heareth the word of the kingdom, and understandeth it not, there cometh the wicked one, and catcheth away that which was sown in his heart: this is he that received the seed by the way side.\"},{\"verse\":20,\"text\":\"And he that received the seed upon stony ground, is he that heareth the word, and immediately receiveth it with joy.\"},{\"verse\":21,\"text\":\"Yet hath he not root in himself, but is only for a time: and when there ariseth tribulation and persecution because of the word, he is presently scandalized.\"},{\"verse\":22,\"text\":\"And he that received the seed among thorns, is he that heareth the word, and the care of this world and the deceitfulness of riches choketh up the word, and he becometh fruitless.\"},{\"verse\":23,\"text\":\"But he that received the seed upon good ground, is he that heareth the word, and understandeth, and beareth fruit, and yieldeth the one an hundredfold, and another sixty, and another thirty.\"},{\"verse\":24,\"text\":\"Another parable he proposed to them, saying: The kingdom of heaven is likened to a man that sowed good seed in his field.\"},{\"verse\":25,\"text\":\"But while men were asleep, his enemy came and oversowed cockle among the wheat and went his way.\"},{\"verse\":26,\"text\":\"And when the blade was sprung up, and had brought forth fruit, then appeared also the cockle.\"},{\"verse\":27,\"text\":\"And the servants of the good man of the house coming said to him. Sir, didst thou not sow good seed in thy field? Whence then hath it cockle?\"},{\"verse\":28,\"text\":\"And he said to them: An enemy hath done this. And the servants said to him: Wilt thou that we go and gather it up?\"},{\"verse\":29,\"text\":\"And he said: No, lest perhaps gathering up the cockle, you root up the wheat also together with it.\"},{\"verse\":30,\"text\":\"Suffer both to grow until the harvest, and in the time of the harvest I will say to the reapers: Gather up first the cockle, and bind it into bundles to burn, but the wheat gather ye into my barn.\"},{\"verse\":31,\"text\":\"Another parable he proposed unto them, saying: The kingdom of heaven is like to a grain of mustard seed, which a man took and sowed in his field.\"},{\"verse\":32,\"text\":\"Which is the least indeed of all seeds; but when it is grown up, it is greater than all herbs, and becometh a tree, so that the birds of the air come, and dwell in the branches thereof.\"},{\"verse\":33,\"text\":\"Another parable he spoke to them: The kingdom of heaven is like to leaven, which a woman took and hid in three measures of meal, until the whole was leavened.\"},{\"verse\":34,\"text\":\"All these things Jesus spoke in parables to the multitudes: and without parables he did not speak to them.\"},{\"verse\":35,\"text\":\"That it might be fulfilled which was spoken by the prophet, saying: I will open my mouth in parables, I will utter things hidden from the foundation of the world.\"},{\"verse\":36,\"text\":\"Then having sent away the multitudes, he came into the house, and his disciples came to him, saying: Expound to us the parable of the cockle of the field.\"},{\"verse\":37,\"text\":\"Who made answer and said to them: He that soweth the good seed is the Son of man.\"},{\"verse\":38,\"text\":\"And the field is the world. And the good seed are the children of the kingdom. And the cockle are the children of the wicked one.\"},{\"verse\":39,\"text\":\"And the enemy that sowed them, is the devil. But the harvest is the end of the world. And the reapers are the angels.\"},{\"verse\":40,\"text\":\"Even as cockle therefore is gathered up, and burnt with fire: so shall it be at the end of the world.\"},{\"verse\":41,\"text\":\"The Son of man shall send his angels, and they shall gather out of his kingdom all scandals, and them that work iniquity.\"},{\"verse\":42,\"text\":\"And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth.\"},{\"verse\":43,\"text\":\"Then shall the just shine as the sun, in the kingdom of their Father. He that hath ears to hear, let him hear.\"},{\"verse\":44,\"text\":\"The kingdom of heaven is like unto a treasure hidden in a field. Which a man having found, hid it, and for joy thereof goeth, and selleth all that he hath, and buyeth that field.\"},{\"verse\":45,\"text\":\"Again the kingdom of heaven is like to a merchant seeking good pearls.\"},{\"verse\":46,\"text\":\"Who when he had found one pearl of great price, went his way, and sold all that he had, and bought it.\"},{\"verse\":47,\"text\":\"Again the kingdom of heaven is like to a net cast into the sea, and gathering together of all kinds of fishes.\"},{\"verse\":48,\"text\":\"Which, when it was filled, they drew out, and sitting by the shore, they chose out the good into vessels, but the bad they cast forth.\"},{\"verse\":49,\"text\":\"So shall it be at the end of the world. The angels shall go out, and shall separate the wicked from among the just.\"},{\"verse\":50,\"text\":\"And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth.\"},{\"verse\":51,\"text\":\"Have ye understood all these things? They say to him: Yes.\"},{\"verse\":52,\"text\":\"He said unto them: Therefore every scribe instructed in the kingdom of heaven, is like to a man that is a householder, who bringeth forth out of his treasure new things and old.\"},{\"verse\":53,\"text\":\"And it came to pass: when Jesus had finished these parables, he passed from thence.\"},{\"verse\":54,\"text\":\"And coming into his own country, he taught them in their synagogues, so that they wondered and said: How came this man by this wisdom and miracles?\"},{\"verse\":55,\"text\":\"Is not this the carpenter’s son? Is not his mother called Mary, and his brethren James, and Joseph, and Simon, and Jude:\"},{\"verse\":56,\"text\":\"And his sisters, are they not all with us? Whence therefore hath he all these things?\"},{\"verse\":57,\"text\":\"And they were scandalized in his regard. But Jesus said to them: A prophet is not without honour, save in his own country, and in his own house.\"},{\"verse\":58,\"text\":\"And he wrought not many miracles there, because of their unbelief.\"}],\"vul\":[{\"verse\":1,\"text\":\"In illo die exiens Jesus de domo, sedebat secus mare.\"},{\"verse\":2,\"text\":\"Et congregatæ sunt ad eum turbæ multæ, ita ut naviculam ascendens sederet : et omnis turba stabat in littore,\"},{\"verse\":3,\"text\":\"et locutus est eis multa in parabolis, dicens : Ecce exiit qui seminat, seminare.\"},{\"verse\":4,\"text\":\"Et dum seminat, quædam ceciderunt secus viam, et venerunt volucres cæli, et comederunt ea.\"},{\"verse\":5,\"text\":\"Alia autem ceciderunt in petrosa, ubi non habebant terram multam : et continuo exorta sunt, quia non habebant altitudinem terræ :\"},{\"verse\":6,\"text\":\"sole autem orto æstuaverunt ; et quia non habebant radicem, aruerunt.\"},{\"verse\":7,\"text\":\"Alia autem ceciderunt in spinas : et creverunt spinæ, et suffocaverunt ea.\"},{\"verse\":8,\"text\":\"Alia autem ceciderunt in terram bonam : et dabant fructum, aliud centesimum, aliud sexagesimum, aliud trigesimum.\"},{\"verse\":9,\"text\":\"Qui habet aures audiendi, audiat.\"},{\"verse\":10,\"text\":\"Et accedentes discipuli dixerunt ei : Quare in parabolis loqueris eis ?\"},{\"verse\":11,\"text\":\"Qui respondens, ait illis : Quia vobis datum est nosse mysteria regni cælorum : illis autem non est datum.\"},{\"verse\":12,\"text\":\"Qui enim habet, dabitur ei, et abundabit : qui autem non habet, et quod habet auferetur ab eo.\"},{\"verse\":13,\"text\":\"Ideo in parabolis loquor eis : quia videntes non vident, et audientes non audiunt, neque intelligunt.\"},{\"verse\":14,\"text\":\"Et adimpletur in eis prophetia Isaiæ, dicentis : Auditu audietis, et non intelligetis : et videntes videbitis, et non videbitis.\"},{\"verse\":15,\"text\":\"Incrassatum est enim cor populi hujus, et auribus graviter audierunt, et oculos suos clauserunt : nequando videant oculis, et auribus audiant, et corde intelligant, et convertantur, et sanem eos.\"},{\"verse\":16,\"text\":\"Vestri autem beati oculi quia vident, et aures vestræ quia audiunt.\"},{\"verse\":17,\"text\":\"Amen quippe dico vobis, quia multi prophetæ et justi cupierunt videre quæ videtis, et non viderunt : et audire quæ auditis, et non audierunt.\"},{\"verse\":18,\"text\":\"Vos ergo audite parabolam seminantis.\"},{\"verse\":19,\"text\":\"Omnis qui audit verbum regni, et non intelligit, venit malus, et rapit quod seminatum est in corde ejus : hic est qui secus viam seminatus est.\"},{\"verse\":20,\"text\":\"Qui autem super petrosa seminatus est, hic est qui verbum audit, et continuo cum gaudio accipit illud :\"},{\"verse\":21,\"text\":\"non habet autem in se radicem, sed est temporalis : facta autem tribulatione et persecutione propter verbum, continuo scandalizatur.\"},{\"verse\":22,\"text\":\"Qui autem seminatus est in spinis, hic est qui verbum audit, et sollicitudo sæculi istius, et fallacia divitiarum suffocat verbum, et sine fructu efficitur.\"},{\"verse\":23,\"text\":\"Qui vero in terram bonam seminatus est, hic est qui audit verbum, et intelligit, et fructum affert, et facit aliud quidem centesimum, aliud autem sexagesimum, aliud vero trigesimum.\"},{\"verse\":24,\"text\":\"Aliam parabolam proposuit illis, dicens : Simile factum est regnum cælorum homini, qui seminavit bonum semen in agro suo :\"},{\"verse\":25,\"text\":\"cum autem dormirent homines, venit inimicus ejus, et superseminavit zizania in medio tritici, et abiit.\"},{\"verse\":26,\"text\":\"Cum autem crevisset herba, et fructum fecisset, tunc apparuerunt et zizania.\"},{\"verse\":27,\"text\":\"Accedentes autem servi patrisfamilias, dixerunt ei : Domine, nonne bonum semen seminasti in agro tuo ? unde ergo habet zizania ?\"},{\"verse\":28,\"text\":\"Et ait illis : Inimicus homo hoc fecit. Servi autem dixerunt ei : Vis, imus, et colligimus ea ?\"},{\"verse\":29,\"text\":\"Et ait : Non : ne forte colligentes zizania, eradicetis simul cum eis et triticum.\"},{\"verse\":30,\"text\":\"Sinite utraque crescere usque ad messem, et in tempore messis dicam messoribus : Colligite primum zizania, et alligate ea in fasciculos ad comburendum : triticum autem congregate in horreum meum.\"},{\"verse\":31,\"text\":\"Aliam parabolam proposuit eis dicens : Simile est regnum cælorum grano sinapis, quod accipiens homo seminavit in agro suo :\"},{\"verse\":32,\"text\":\"quod minimum quidem est omnibus seminibus : cum autem creverit, majus est omnibus oleribus, et fit arbor, ita ut volucres cæli veniant, et habitent in ramis ejus.\"},{\"verse\":33,\"text\":\"Aliam parabolam locutus est eis : Simile est regnum cælorum fermento, quod acceptum mulier abscondit in farinæ satis tribus, donec fermentatum est totum.\"},{\"verse\":34,\"text\":\"Hæc omnia locutus est Jesus in parabolis ad turbas : et sine parabolis non loquebatur eis :\"},{\"verse\":35,\"text\":\"ut impleretur quod dictum erat per prophetam dicentem : Aperiam in parabolis os meum ; eructabo abscondita a constitutione mundi.\"},{\"verse\":36,\"text\":\"Tunc, dimissis turbis, venit in domum : et accesserunt ad eum discipuli ejus, dicentes : Edissere nobis parabolam zizaniorum agri.\"},{\"verse\":37,\"text\":\"Qui respondens ait illis : Qui seminat bonum semen, est Filius hominis.\"},{\"verse\":38,\"text\":\"Ager autem est mundus. Bonum vero semen, hi sunt filii regni. Zizania autem, filii sunt nequam.\"},{\"verse\":39,\"text\":\"Inimicus autem, qui seminavit ea, est diabolus. Messis vero, consummatio sæculi est. Messores autem, angeli sunt.\"},{\"verse\":40,\"text\":\"Sicut ergo colliguntur zizania, et igni comburuntur : sic erit in consummatione sæculi.\"},{\"verse\":41,\"text\":\"Mittet Filius hominis angelos suos, et colligent de regno ejus omnia scandala, et eos qui faciunt iniquitatem :\"},{\"verse\":42,\"text\":\"et mittent eos in caminum ignis. Ibi erit fletus et stridor dentium.\"},{\"verse\":43,\"text\":\"Tunc justi fulgebunt sicut sol in regno Patris eorum. Qui habet aures audiendi, audiat.\"},{\"verse\":44,\"text\":\"Simile est regnum cælorum thesauro abscondito in agro : quem qui invenit homo, abscondit, et præ gaudio illius vadit, et vendit universa quæ habet, et emit agrum illum.\"},{\"verse\":45,\"text\":\"Iterum simile est regnum cælorum homini negotiatori, quærenti bonas margaritas.\"},{\"verse\":46,\"text\":\"Inventa autem una pretiosa margarita, abiit, et vendidit omnia quæ habuit, et emit eam.\"},{\"verse\":47,\"text\":\"Iterum simile est regnum cælorum sagenæ missæ in mare, et ex omni genere piscium congreganti.\"},{\"verse\":48,\"text\":\"Quam, cum impleta esset, educentes, et secus littus sedentes, elegerunt bonis in vasa, malos autem foras miserunt.\"},{\"verse\":49,\"text\":\"Sic erit in consummatione sæculi : exibunt angeli, et separabunt malos de medio justorum,\"},{\"verse\":50,\"text\":\"et mittent eos in caminum ignis : ibi erit fletus, et stridor dentium.\"},{\"verse\":51,\"text\":\"Intellexistis hæc omnia ? Dicunt ei : Etiam.\"},{\"verse\":52,\"text\":\"Ait illis : Ideo omnis scriba doctus in regno cælorum, similis est homini patrifamilias, qui profert de thesauro suo nova et vetera.\"},{\"verse\":53,\"text\":\"Et factum est, cum consummasset Jesus parabolas istas, transiit inde.\"},{\"verse\":54,\"text\":\"Et veniens in patriam suam, docebat eos in synagogis eorum, ita ut mirarentur, et dicerent : Unde huic sapientia hæc, et virtutes ?\"},{\"verse\":55,\"text\":\"Nonne hic est fabri filius ? nonne mater ejus dicitur Maria, et fratres ejus, Jacobus, et Joseph, et Simon, et Judas ?\"},{\"verse\":56,\"text\":\"et sorores ejus, nonne omnes apud nos sunt ? unde ergo huic omnia ista ?\"},{\"verse\":57,\"text\":\"Et scandalizabantur in eo. Jesus autem dixit eis : Non est propheta sine honore, nisi in patria sua, et in domo sua.\"},{\"verse\":58,\"text\":\"Et non fecit ibi virtutes multas propter incredulitatem illorum.\"}],\"summary\":\"The parables of the sower and the cockle: of the mustardseed, etc.\",\"intro\":null,\"prev\":{\"usfm\":\"MAT\",\"chapter\":12,\"label\":\"Matthew 12\"},\"next\":{\"usfm\":\"MAT\",\"chapter\":14,\"label\":\"Matthew 14\"}}]]\n"])</script></body></html>
