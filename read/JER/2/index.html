tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Jeremiah<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Jeremias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JER/">About <!-- -->Jeremiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God expostulates with the Jews for their ingratitude and infidelity.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the word of the Lord came to me, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Go, and cry in the ears of Jerusalem, saying: Thus saith the Lord: I have remembered thee, pitying thy youth, and the love of thy espousals, when thou followedst me in the desert, in a land that is not sown.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Israel is holy to the Lord, the firstfruits of his increase: all they that devour him offend: evils shall come upon them, saith the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hear ye the word of the Lord, O house of Jacob, and all ye families of the house of Israel:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thus saith the Lord: What iniquity have your fathers found in me, that they are gone far from me, and have walked after vanity, and are become vain?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they have not said: Where is the Lord, that made us come up out of the land of Egypt? that led us through the desert, through a land uninhabited and unpassable, through a land of drought, and the image of death, through a land wherein no man walked, nor any man dwelt?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I brought you into the land of Carmel, to eat the fruit thereof, and the best things thereof: and when ye entered in, you defiled my land and made my inheritance an abomination.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The priests did not say: Where is the Lord? and they that held the law knew me not, and the pastors transgressed against me: and the prophets prophesied in Baal, and followed idols.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Therefore will I yet contend in judgment with you, saith the Lord, and I will plead with your children.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pass over to the isles of Cethim, and see: and send into Cedar, and consider diligently: and see if there hath been done any thing like this.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If a nation hath changed their gods, and indeed they are not gods: but my people have changed their glory into an idol.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Be astonished, O ye heavens, at this, and ye gates thereof, be very desolate, saith the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For my people have done two evils. They have forsaken me, the fountain of living water, and have digged to themselves cisterns, broken cisterns, that can hold no water.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Is Israel a bondman, or a homeborn slave? why then is he become a prey?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The lions have roared upon him, and have made a noise, they have made his land a wilderness: his cities are burnt down, and there is none to dwell in them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The children also of Memphis, and of Taphnes have defloured thee, even to the crown of the head.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hath not this been done to thee, because thou hast forsaken the Lord thy God at that time, when he led thee by the way?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And now what hast thou to do in the way of Egypt, to drink the troubled water? And what hast thou to do with the way of the Assyrians, to drink the water of the river?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thy own wickedness shall reprove thee, and thy apostasy shall rebuke thee. Know thou, and see that it is an evil and a bitter thing for thee, to have left the Lord thy God, and that my fear is not with thee, saith the Lord the God of hosts.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of old time thou hast broken my yoke, thou hast burst my bands, and thou saidst: I will not serve. For on every high hill, and under every green tree thou didst prostitute thyself.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Yet, I planted thee a chosen vineyard, all true seed: how then art thou turned unto me into that which is good for nothing, O strange vineyard?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Though thou wash thyself with nitre, and multiply to thyself the herb borith, thou art stained in thy iniquity before me, saith the Lord God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>How canst thou say: I am not polluted, I have not walked after Baalim? see thy ways in the valley, know what thou hast done: as a swift runner pursuing his course.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>A wild ass accustomed to the wilderness in the desire of his heart, snuffed up the wind of his love: none shall turn her away: all that seek her shall not fail: in her monthly filth they shall find her.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Keep thy foot from being bare, and thy throat from thirst. But thou saidst: I have lost all hope, I will not do it: for I have loved strangers, and I will walk after them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>As the thief is confounded when he is taken, so is the house of Israel confounded, they and their kings, their princes and their priests, and their prophets.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Saying to a stock: Thou art my father: and to a stone: Thou hast begotten me: they have turned their back to me, and not their face: and in the time of their affliction they will say: Arise, and deliver us.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Where are the gods, whom thou hast made thee? let them arise and deliver thee in the time of thy affliction: for according to the number of thy cities were thy gods, O Juda.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Why will you contend with me in judgment? you have all forsaken me, saith the Lord.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>In vain have I struck your children, they have not received correction: your sword hath devoured your prophets, your generation is like a ravaging lion.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>See ye the word of the Lord: Am I become a wilderness to Israel, or a lateward springing land? why then have my people said: We are revolted, we will come to thee no more?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Will a virgin forget her ornament, or a bride her stomacher? but my people hath forgotten me days without number.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Why dost thou endeavour to shew thy way good to seek my love, thou who hast also taught thy malices to be thy ways,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And in thy skirts is found the blood of the souls of the poor and innocent? not in ditches have I found them, but in all places, which I mentioned before.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And thou hast said: I am without sin and am innocent: and therefore let thy anger be turned away from me. Behold, I will contend with thee in judgment, because thou hast said: I have not sinned.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>How exceeding base art thou become, going the same ways over again! and thou shalt be ashamed of Egypt, as thou wast ashamed of Assyria.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>For from thence thou shalt go, and thy hand shall be upon thy head: for the Lord hath destroyed thy trust, and thou shalt have nothing prosperous therein.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est verbum Domini ad me, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vade, et clama in auribus Jerusalem, dicens : Hæc dicit Dominus : Recordatus sum tui, miserans adolescentiam tuam, et caritatem desponsationis tuæ, quando secuta es me in deserto, in terra quæ non seminatur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sanctus Israël Domino, primitiæ frugum ejus : omnes qui devorant eum delinquunt : mala venient super eos, dicit Dominus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Audite verbum Domini, domus Jacob, et omnes cognationes domus Israël.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hæc dicit Dominus : Quid invenerunt patres vestri in me iniquitatis, quia elongaverunt a me, et ambulaverunt post vanitatem, et vani facti sunt ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et non dixerunt : Ubi est Dominus qui ascendere nos fecit de terra Ægypti ; qui traduxit nos per desertum, per terram inhabitabilem et inviam, per terram sitis, et imaginem mortis, per terram in qua non ambulavit vir, neque habitavit homo ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et induxi vos in terram Carmeli, ut comederetis fructum ejus et optima illius : et ingressi contaminastis terram meam, et hæreditatem meam posuistis in abominationem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sacerdotes non dixerunt : Ubi est Dominus ? et tenentes legem nescierunt me, et pastores prævaricati sunt in me, et prophetæ prophetaverunt in Baal, et idola secuti sunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Propterea adhuc judicio contendam vobiscum, ait Dominus, et cum filiis vestris disceptabo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Transite ad insulas Cethim, et videte : et in Cedar mittite, et considerate vehementer : et videte si factum est hujuscemodi :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>si mutavit gens deos suos, et certe ipsi non sunt dii : populus vero meus mutavit gloriam suam in idolum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Obstupescite, cæli, super hoc, et portæ ejus, desolamini vehementer, dicit Dominus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Duo enim mala fecit populus meus : me dereliquerunt fontem aquæ vivæ, et foderunt sibi cisternas, cisternas dissipatas, quia continere non valent aquas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Numquid servus est Israël, aut vernaculus ? quare ergo factus est in prædam ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Super eum rugierunt leones, et dederunt vocem suam : posuerunt terram ejus in solitudinem. Civitates ejus exustæ sunt, et non est qui habitet in eis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Filii quoque Mempheos et Taphnes constupraverunt te usque ad verticem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Numquid non istud factum est tibi, quia dereliquisti Dominum Deum tuum eo tempore quo ducebat te per viam ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et nunc quid tibi vis in via Ægypti, ut bibas aquam turbidam ? et quid tibi cum via Assyriorum, ut bibas aquam fluminis ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Arguet te malitia tua, et aversio tua increpabit te. Scito et vide quia malum et amarum est reliquisse te Dominum Deum tuum, et non esse timorem mei apud te, dicit Dominus Deus exercituum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>A sæculo confregisti jugum meum : rupisti vincula mea, et dixisti : Non serviam. In omni enim colle sublimi, et sub omni ligno frondoso, tu prosternebaris meretrix.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ego autem plantavi te vineam electam, omne semen verum : quomodo ergo conversa es mihi in pravum, vinea aliena ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si laveris te nitro, et multiplicaveris tibi herbam borith, maculata es in iniquitate tua coram me, dicit Dominus Deus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quomodo dicis : Non sum polluta ; post Baalim non ambulavi ? Vide vias tuas in convalle ; scito quid feceris : cursor levis explicans vias suas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Onager assuetus in solitudine, in desiderio animæ suæ attraxit ventum amoris sui : nullus avertet eam : omnes qui quærunt eam non deficient : in menstruis ejus invenient eam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Prohibe pedem tuum a nuditate, et guttur tuum a siti. Et dixisti : Desperavi : nequaquam faciam : adamavi quippe alienos, et post eos ambulabo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quomodo confunditur fur quando deprehenditur, sic confusi sunt domus Israël, ipsi et reges eorum, principes, et sacerdotes, et prophetæ eorum,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>dicentes ligno : Pater meus es tu : et lapidi : Tu me genuisti. Verterunt ad me tergum et non faciem, et in tempore afflictionis suæ dicent : Surge, et libera nos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ubi sunt dii tui quos fecisti tibi ? surgant, et liberent te in tempore afflictionis tuæ : secundum numerum quippe civitatum tuarum erant dii tui, Juda.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quid vultis mecum judicio contendere ? omnes dereliquistis me, dicit Dominus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Frustra percussi filios vestros : disciplinam non receperunt. Devoravit gladius vester prophetas vestros : quasi leo vastator</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>generatio vestra. Videte verbum Domini : numquid solitudo factus sum Israëli, aut terra serotina ? quare ergo dixit populus meus : Recessimus ; non veniemus ultra ad te ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Numquid obliviscetur virgo ornamenti sui, aut sponsa fasciæ pectoralis suæ ? populus vero meus oblitus est mei diebus innumeris.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quid niteris bonam ostendere viam tuam ad quærendam dilectionem, quæ insuper et malitias tuas docuisti vias tuas,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et in alis tuis inventus est sanguis animarum pauperum et innocentum ? non in fossis inveni eos, sed in omnibus quæ supra memoravi.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et dixisti : Absque peccato et innocens ego sum, et propterea avertatur furor tuus a me. Ecce ego judicio contendam tecum, eo quod dixeris : Non peccavi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quam vilis facta es nimis, iterans vias tuas ! et ab Ægypto confunderis, sicut confusa es ab Assur.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Nam et ab ista egredieris, et manus tuæ erunt super caput tuum : quoniam obtrivit Dominus confidentiam tuam, et nihil habebis prosperum in ea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hi  Thus saith the Lord: I have remembered thee, pitying thy youth, and the love of thy espousals, when thou followedst me in the desert, in a land that is not sown.\"},{\"verse\":3,\"text\":\"Israel is holy to the Lord, the firstfruits of his increase: all they that devour him offend: evils shall come upon them, saith the Lord.\"},{\"verse\":4,\"text\":\"Hear ye the word of the Lord, O house of Jacob, and all ye families of the house of Israel:\"},{\"verse\":5,\"text\":\"Thus saith the Lord: What iniquity have your fathers found in me, that they are gone far from me, and have walked after vanity, and are become vain?\"},{\"verse\":6,\"text\":\"And they have not said: Where is the Lord, that made us come up out of the land of Egypt? that led us through the desert, through a land uninhabited and unpassable, through a land of drought, and the image of death, through a land wherein no man walked, nor any man dwelt?\"},{\"verse\":7,\"text\":\"And I brought you into the land of Carmel, to eat the fruit thereof, and the best things thereof: and when ye entered in, you defiled my land and made my inheritance an abomination.\"},{\"verse\":8,\"text\":\"The priests did not say: Where is the Lord? and they that held the law knew me not, and the pastors transgressed against me: and the prophets prophesied in Baal, and followed idols.\"},{\"verse\":9,\"text\":\"Therefore will I yet contend in judgment with you, saith the Lord, and I will plead with your children.\"},{\"verse\":10,\"text\":\"Pass over to the isles of Cethim, and see: and send into Cedar, and consider diligently: and see if there hath been done any thing like this.\"},{\"verse\":11,\"text\":\"If a nation hath changed their gods, and indeed they are not gods: but my people have changed their glory into an idol.\"},{\"verse\":12,\"text\":\"Be astonished, O ye heavens, at this, and ye gates thereof, be very desolate, saith the Lord.\"},{\"verse\":13,\"text\":\"For my people have done two evils. They have forsaken me, the fountain of living water, and have digged to themselves cisterns, broken cisterns, that can hold no water.\"},{\"verse\":14,\"text\":\"Is Israel a bondman, or a homeborn slave? why then is he become a prey?\"},{\"verse\":15,\"text\":\"The lions have roared upon him, and have made a noise, they have made his land a wilderness: his cities are burnt down, and there is none to dwell in them.\"},{\"verse\":16,\"text\":\"The children also of Memphis, and of Taphnes have defloured thee, even to the crown of the head.\"},{\"verse\":17,\"text\":\"Hath not this been done to thee, because thou hast forsaken the Lord thy God at that time, when he led thee by the way?\"},{\"verse\":18,\"text\":\"And now what hast thou to do in the way of Egypt, to drink the troubled water? And what hast thou to do with the way of the Assyrians, to drink the water of the river?\"},{\"verse\":19,\"text\":\"Thy own wickedness shall reprove thee, and thy apostasy shall rebuke thee. Know thou, and see that it is an evil and a bitter thing for thee, to have left the Lord thy God, and that my fear is not with thee, saith the Lord the God of hosts.\"},{\"verse\":20,\"text\":\"Of old time thou hast broken my yoke, thou hast burst my bands, and thou saidst: I will not serve. For on every high hill, and under every green tree thou didst prostitute thyself.\"},{\"verse\":21,\"text\":\"Yet, I planted thee a chosen vineyard, all true seed: how then art thou turned unto me into that which is good for nothing, O strange vineyard?\"},{\"verse\":22,\"text\":\"Though thou wash thyself with nitre, and multiply to thyself the herb borith, thou art stained in thy iniquity before me, saith the Lord God.\"},{\"verse\":23,\"text\":\"How canst thou say: I am not polluted, I have not walked after Baalim? see thy ways in the valley, know what thou hast done: as a swift runner pursuing his course.\"},{\"verse\":24,\"text\":\"A wild ass accustomed to the wilderness in the desire of his heart, snuffed up the wind of his love: none shall turn her away: all that seek her shall not fail: in her monthly filth they shall find her.\"},{\"verse\":25,\"text\":\"Keep thy foot from being bare, and thy throat from thirst. But thou saidst: I have lost all hope, I will not do it: for I have loved strangers, and I will walk after them.\"},{\"verse\":26,\"text\":\"As the thief is confounded when he is taken, so is the house of Israel confounded, they and their kings, their princes and their priests, and their prophets.\"},{\"verse\":27,\"text\":\"Saying to a stock: Thou art my father: and to a stone: Thou hast begotten me: they have turned their back to me, and not their face: and in the time of their affliction they will say: Arise, and deliver us.\"},{\"verse\":28,\"text\":\"Where are the gods, whom thou hast made thee? let them arise and deliver thee in the time of thy affliction: for according to the number of thy cities were thy gods, O Juda.\"},{\"verse\":29,\"text\":\"Why will you contend with me in judgment? you have all forsaken me, saith the Lord.\"},{\"verse\":30,\"text\":\"In vain have I struck your children, they have not received correction: your sword hath devoured your prophets, your generation is like a ravaging lion.\"},{\"verse\":31,\"text\":\"See ye the word of the Lord: Am I become a wilderness to Israel, or a lateward springing land? why then have my people said: We are revolted, we will come to thee no more?\"},{\"verse\":32,\"text\":\"Will a virgin forget her ornament, or a bride her stomacher? but my people hath forgotten me days without number.\"},{\"verse\":33,\"text\":\"Why dost thou endeavour to shew thy way good to seek my love, thou who hast also taught thy malices to be thy ways,\"},{\"verse\":34,\"text\":\"And in thy skirts is found the blood of the souls of the poor and innocent? not in ditches have I found them, but in all places, which I mentioned before.\"},{\"verse\":35,\"text\":\"And thou hast said: I am without sin and am innocent: and therefore let thy anger be turned away from me. Behold, I will contend with thee in judgment, because thou hast said: I have not sinned.\"},{\"verse\":36,\"text\":\"How exceeding base art thou become, going the same ways over again! and thou shalt be ashamed of Egypt, as thou wast ashamed of Assyria.\"},{\"verse\":37,\"text\":\"For from thence thou shalt go, and thy hand shall be upon thy head: for the Lord hath destroyed thy trust, and thou shalt have nothing prosperous therein.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est verbum Domini ad me, dicens :\"},{\"verse\":2,\"text\":\"Vade, et clama in auribus Jerusalem, dicens : Hæc dicit Dominus : Recordatus sum tui, miserans adolescentiam tuam, et caritatem desponsationis tuæ, quando secuta es me in deserto, in terra quæ non seminatur.\"},{\"verse\":3,\"text\":\"Sanctus Israël Domino, primitiæ frugum ejus : omnes qui devorant eum delinquunt : mala venient super eos, dicit Dominus.\"},{\"verse\":4,\"text\":\"Audite verbum Domini, domus Jacob, et omnes cognationes domus Israël.\"},{\"verse\":5,\"text\":\"Hæc dicit Dominus : Quid invenerunt patres vestri in me iniquitatis, quia elongaverunt a me, et ambulaverunt post vanitatem, et vani facti sunt ?\"},{\"verse\":6,\"text\":\"Et non dixerunt : Ubi est Dominus qui ascendere nos fecit de terra Ægypti ; qui traduxit nos per desertum, per terram inhabitabilem et inviam, per terram sitis, et imaginem mortis, per terram in qua non ambulavit vir, neque habitavit homo ?\"},{\"verse\":7,\"text\":\"Et induxi vos in terram Carmeli, ut comederetis fructum ejus et optima illius : et ingressi contaminastis terram meam, et hæreditatem meam posuistis in abominationem.\"},{\"verse\":8,\"text\":\"Sacerdotes non dixerunt : Ubi est Dominus ? et tenentes legem nescierunt me, et pastores prævaricati sunt in me, et prophetæ prophetaverunt in Baal, et idola secuti sunt.\"},{\"verse\":9,\"text\":\"Propterea adhuc judicio contendam vobiscum, ait Dominus, et cum filiis vestris disceptabo.\"},{\"verse\":10,\"text\":\"Transite ad insulas Cethim, et videte : et in Cedar mittite, et considerate vehementer : et videte si factum est hujuscemodi :\"},{\"verse\":11,\"text\":\"si mutavit gens deos suos, et certe ipsi non sunt dii : populus vero meus mutavit gloriam suam in idolum.\"},{\"verse\":12,\"text\":\"Obstupescite, cæli, super hoc, et portæ ejus, desolamini vehementer, dicit Dominus.\"},{\"verse\":13,\"text\":\"Duo enim mala fecit populus meus : me dereliquerunt fontem aquæ vivæ, et foderunt sibi cisternas, cisternas dissipatas, quia continere non valent aquas.\"},{\"verse\":14,\"text\":\"Numquid servus est Israël, aut vernaculus ? quare ergo factus est in prædam ?\"},{\"verse\":15,\"text\":\"Super eum rugierunt leones, et dederunt vocem suam : posuerunt terram ejus in solitudinem. Civitates ejus exustæ sunt, et non est qui habitet in eis.\"},{\"verse\":16,\"text\":\"Filii quoque Mempheos et Taphnes constupraverunt te usque ad verticem.\"},{\"verse\":17,\"text\":\"Numquid non istud factum est tibi, quia dereliquisti Dominum Deum tuum eo tempore quo ducebat te per viam ?\"},{\"verse\":18,\"text\":\"Et nunc quid tibi vis in via Ægypti, ut bibas aquam turbidam ? et quid tibi cum via Assyriorum, ut bibas aquam fluminis ?\"},{\"verse\":19,\"text\":\"Arguet te malitia tua, et aversio tua increpabit te. Scito et vide quia malum et amarum est reliquisse te Dominum Deum tuum, et non esse timorem mei apud te, dicit Dominus Deus exercituum.\"},{\"verse\":20,\"text\":\"A sæculo confregisti jugum meum : rupisti vincula mea, et dixisti : Non serviam. In omni enim colle sublimi, et sub omni ligno frondoso, tu prosternebaris meretrix.\"},{\"verse\":21,\"text\":\"Ego autem plantavi te vineam electam, omne semen verum : quomodo ergo conversa es mihi in pravum, vinea aliena ?\"},{\"verse\":22,\"text\":\"Si laveris te nitro, et multiplicaveris tibi herbam borith, maculata es in iniquitate tua coram me, dicit Dominus Deus.\"},{\"verse\":23,\"text\":\"Quomodo dicis : Non sum polluta ; post Baalim non ambulavi ? Vide vias tuas in convalle ; scito quid feceris : cursor levis explicans vias suas.\"},{\"verse\":24,\"text\":\"Onager assuetus in solitudine, in desiderio animæ suæ attraxit ventum amoris sui : nullus avertet eam : omnes qui quærunt eam non deficient : in menstruis ejus invenient eam.\"},{\"verse\":25,\"text\":\"Prohibe pedem tuum a nuditate, et guttur tuum a siti. Et dixisti : Desperavi : nequaquam faciam : adamavi quippe alienos, et post eos ambulabo.\"},{\"verse\":26,\"text\":\"Quomodo confunditur fur quando deprehenditur, sic confusi sunt domus Israël, ipsi et reges eorum, principes, et sacerdotes, et prophetæ eorum,\"},{\"verse\":27,\"text\":\"dicentes ligno : Pater meus es tu : et lapidi : Tu me genuisti. Verterunt ad me tergum et non faciem, et in tempore afflictionis suæ dicent : Surge, et libera nos.\"},{\"verse\":28,\"text\":\"Ubi sunt dii tui quos fecisti tibi ? surgant, et liberent te in tempore afflictionis tuæ : secundum numerum quippe civitatum tuarum erant dii tui, Juda.\"},{\"verse\":29,\"text\":\"Quid vultis mecum judicio contendere ? omnes dereliquistis me, dicit Dominus.\"},{\"verse\":30,\"text\":\"Frustra percussi filios vestros : disciplinam non receperunt. Devoravit gladius vester prophetas vestros : quasi leo vastator\"},{\"verse\":31,\"text\":\"generatio vestra. Videte verbum Domini : numquid solitudo factus sum Israëli, aut terra serotina ? quare ergo dixit populus meus : Recessimus ; non veniemus ultra ad te ?\"},{\"verse\":32,\"text\":\"Numquid obliviscetur virgo ornamenti sui, aut sponsa fasciæ pectoralis suæ ? populus vero meus oblitus est mei diebus innumeris.\"},{\"verse\":33,\"text\":\"Quid niteris bonam ostendere viam tuam ad quærendam dilectionem, quæ insuper et malitias tuas docuisti vias tuas,\"},{\"verse\":34,\"text\":\"et in alis tuis inventus est sanguis animarum pauperum et innocentum ? non in fossis inveni eos, sed in omnibus quæ supra memoravi.\"},{\"verse\":35,\"text\":\"Et dixisti : Absque peccato et innocens ego sum, et propterea avertatur furor tuus a me. Ecce ego judicio contendam tecum, eo quod dixeris : Non peccavi.\"},{\"verse\":36,\"text\":\"Quam vilis facta es nimis, iterans vias tuas ! et ab Ægypto confunderis, sicut confusa es ab Assur.\"},{\"verse\":37,\"text\":\"Nam et ab ista egredieris, et manus tuæ erunt super caput tuum : quoniam obtrivit Dominus confidentiam tuam, et nihil habebis prosperum in ea.\"}],\"summary\":\"God expostulates with the Jews for their ingratitude and infidelity.\",\"intro\":null,\"prev\":{\"usfm\":\"JER\",\"chapter\":1,\"label\":\"Jeremiah 1\"},\"next\":{\"usfm\":\"JER\",\"chapter\":3,\"label\":\"Jeremiah 3\"}}]]\n"])</script></body></html>
