"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Jeremiah<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Jeremias</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The prophet’s answer to the messengers of Sedecias, when Jerusalem was besieged.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The word that came to Jeremias from the Lord, when king Sedecias sent unto him Phassur, the son of Melchias, and Sophonias, the son of Maasias the priest, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Inquire of the Lord for us, for Nabuchodonosor king of Babylon maketh war against us: if so be the Lord will deal with us according to all his wonderful works, that he may depart from us.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Jeremias said to them: Thus shall you say to Sedecias:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thus saith the Lord, the God of Israel: Behold I will turn back the weapons of war that are in your hands, and with which you fight against the king of Babylon, and the Chaldeans, that besiege you round about the walls: and I will gather them together in the midst of this city.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And I myself will fight against you with an outstretched hand, and with a strong arm, and in fury, and in indignation, and in great wrath.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And I will strike the inhabitants of this city, men and beasts shall die of a great pestilence.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And after this, saith the Lord, I will give Sedecias the king of Juda, and his servants, and his people, and such as are left in this city from the pestilence, and the sword, and the famine, into the hand of Nabuchodonosor the king of Babylon, and into the hand of their enemies, and into the hand of them that seek their life, and he shall strike them with the edge of the sword, and he shall not be moved to pity, nor spare them, nor shew mercy to them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And to this people thou shalt say: Thus saith the Lord: Behold I set before you the way of life, and the way of death.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that shall abide in this city, shall die by the sword, and by the famine, and by the pestilence: but he that shall go out and flee over to the Chaldeans, that besiege you, shall live, and his life shall be to him as a spoil.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For I have set my face against this city for evil, and not for good, saith the Lord: it shall be given into the hand of the king of Babylon, and he shall burn it with fire.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And to the house of the king of Juda: Hear ye the word of the Lord,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>O house of David, thus saith the Lord: Judge ye judgment in the morning, and deliver him that is oppressed by violence out of the hand of the oppressor: lest my indignation go forth like a fire, and be kindled, and there be none to quench it, because of the evil of your ways.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Behold I come to thee that dwellest in a valley upon a rock above a plain, saith the Lord: and you say: Who shall strike us and who shall enter into our houses?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I will visit upon you according to the fruit of your doings, saith the Lord: and I will kindle a fire in the forest thereof: and it shall devour all things round about it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Verbum quod factum est ad Jeremiam a Domino, quando misit ad eum rex Sedecias Phassur filium Melchiæ, et Sophoniam filium Maasiæ sacerdotem, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Interroga pro nobis Dominum, quia Nabuchodonosor, rex Babylonis, præliatur adversum nos : si forte faciat Dominus nobiscum secundum omnia mirabilia sua, et recedat a nobis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dixit Jeremias ad eos : Sic dicetis Sedeciæ :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæc dicit Dominus Deus Israël : Ecce ego convertam vasa belli quæ in manibus vestris sunt, et quibus vos pugnatis adversum regem Babylonis et Chaldæos qui obsident vos in circuitu murorum : et congregabo ea in medio civitatis hujus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et debellabo ego vos in manu extenta, et in brachio forti, et in furore, et in indignatione, et in ira grandi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et percutiam habitatores civitatis hujus : homines et bestiæ pestilentia magna morientur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et post hæc, ait Dominus, dabo Sedeciam regem Juda, et servos ejus, et populum ejus, et qui derelicti sunt in civitate hac a peste, et gladio, et fame, in manu Nabuchodonosor regis Babylonis, et in manu inimicorum eorum, et in manu quærentium animam eorum : et percutiet eos in ore gladii, et non flectetur, neque parcet, nec miserebitur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ad populum hunc dices : Hæc dicit Dominus : Ecce ego do coram vobis viam vitæ, et viam mortis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui habitaverit in urbe hac morietur gladio, et fame, et peste : qui autem egressus fuerit, et transfugerit ad Chaldæos qui obsident vos, vivet, et erit ei anima sua quasi spolium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Posui enim faciem meam super civitatem hanc in malum, et non in bonum, ait Dominus : in manu regis Babylonis dabitur, et exuret eam igni.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et domui regis Juda : Audite verba Domini,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>domus David. Hæc dicit Dominus : Judicate mane judicium, et eruite vi oppressum de manu calumniantis, ne forte egrediatur ut ignis indignatio mea, et succendatur, et non sit qui extinguat, propter malitiam studiorum vestrorum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ecce ego ad te, habitatricem vallis solidæ atque campestris, ait Dominus : qui dicitis : Quis percutiet nos ? et quis ingredietur domos nostras ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et visitabo super vos juxta fructum studiorum vestrorum, dicit Dominus : et succendam ignem in saltu ejus, et devorabit omnia in circuitu ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Jeremiah 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 acti st\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JER.21\",{\"bookId\":28,\"usfm\":\"JER\",\"bookName\":\"Jeremiah\",\"drName\":\"Jeremias\",\"chapter\":21,\"totalChapters\":52,\"dra\":[{\"verse\":1,\"text\":\"The word that came to Jeremias from the Lord, when king Sedecias sent unto him Phassur, the son of Melchias, and Sophonias, the son of Maasias the priest, saying:\"},{\"verse\":2,\"text\":\"Inquire of the Lord for us, for Nabuchodonosor king of Babylon maketh war against us: if so be the Lord will deal with us according to all his wonderful works, that he may depart from us.\"},{\"verse\":3,\"text\":\"And Jeremias said to them: Thus shall you say to Sedecias:\"},{\"verse\":4,\"text\":\"Thus saith the Lord, the God of Israel: Behold I will turn back the weapons of war that are in your hands, and with which you fight against the king of Babylon, and the Chaldeans, that besiege you round about the walls: and I will gather them together in the midst of this city.\"},{\"verse\":5,\"text\":\"And I myself will fight against you with an outstretched hand, and with a strong arm, and in fury, and in indignation, and in great wrath.\"},{\"verse\":6,\"text\":\"And I will strike the inhabitants of this city, men and beasts shall die of a great pestilence.\"},{\"verse\":7,\"text\":\"And after this, saith the Lord, I will give Sedecias the king of Juda, and his servants, and his people, and such as are left in this city from the pestilence, and the sword, and the famine, into the hand of Nabuchodonosor the king of Babylon, and into the hand of their enemies, and into the hand of them that seek their life, and he shall strike them with the edge of the sword, and he shall not be moved to pity, nor spare them, nor shew mercy to them.\"},{\"verse\":8,\"text\":\"And to this people thou shalt say: Thus saith the Lord: Behold I set before you the way of life, and the way of death.\"},{\"verse\":9,\"text\":\"He that shall abide in this city, shall die by the sword, and by the famine, and by the pestilence: but he that shall go out and flee over to the Chaldeans, that besiege you, shall live, and his life shall be to him as a spoil.\"},{\"verse\":10,\"text\":\"For I have set my face against this city for evil, and not for good, saith the Lord: it shall be given into the hand of the king of Babylon, and he shall burn it with fire.\"},{\"verse\":11,\"text\":\"And to the house of the king of Juda: Hear ye the word of the Lord,\"},{\"verse\":12,\"text\":\"O house of David, thus saith the Lord: Judge ye judgment in the morning, and deliver him that is oppressed by violence out of the hand of the oppressor: lest my indignation go forth like a fire, and be kindled, and there be none to quench it, because of the evil of your ways.\"},{\"verse\":13,\"text\":\"Behold I come to thee that dwellest in a valley upon a rock above a plain, saith the Lord: and you say: Who shall strike us and who shall enter into our houses?\"},{\"verse\":14,\"text\":\"But I will visit upon you according to the fruit of your doings, saith the Lord: and I will kindle a fire in the forest thereof: and it shall devour all things round about it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Verbum quod factum est ad Jeremiam a Domino, quando misit ad eum rex Sedecias Phassur filium Melchiæ, et Sophoniam filium Maasiæ sacerdotem, dicens :\"},{\"verse\":2,\"text\":\"Interroga pro nobis Dominum, quia Nabuchodonosor, rex Babylonis, præliatur adversum nos : si forte faciat Dominus nobiscum secundum omnia mirabilia sua, et recedat a nobis.\"},{\"verse\":3,\"text\":\"Et dixit Jeremias ad eos : Sic dicetis Sedeciæ :\"},{\"verse\":4,\"text\":\"Hæc dicit Dominus Deus Israël : Ecce ego convertam vasa belli quæ in manibus vestris sunt, et quibus vos pugnatis adversum regem Babylonis et Chaldæos qui obsident vos in circuitu murorum : et congregabo ea in medio civitatis hujus.\"},{\"verse\":5,\"text\":\"Et debellabo ego vos in manu extenta, et in brachio forti, et in furore, et in indignatione, et in ira grandi.\"},{\"verse\":6,\"text\":\"Et percutiam habitatores civitatis hujus : homines et bestiæ pestilentia magna morientur.\"},{\"verse\":7,\"text\":\"Et post hæc, ait Dominus, dabo Sedeciam regem Juda, et servos ejus, et populum ejus, et qui derelicti sunt in civitate hac a peste, et gladio, et fame, in manu Nabuchodonosor regis Babylonis, et in manu inimicorum eorum, et in manu quærentium animam eorum : et percutiet eos in ore gladii, et non flectetur, neque parcet, nec miserebitur.\"},{\"verse\":8,\"text\":\"Et ad populum hunc dices : Hæc dicit Dominus : Ecce ego do coram vobis viam vitæ, et viam mortis.\"},{\"verse\":9,\"text\":\"Qui habitaverit in urbe hac morietur gladio, et fame, et peste : qui autem egressus fuerit, et transfugerit ad Chaldæos qui obsident vos, vivet, et erit ei anima sua quasi spolium.\"},{\"verse\":10,\"text\":\"Posui enim faciem meam super civitatem hanc in malum, et non in bonum, ait Dominus : in manu regis Babylonis dabitur, et exuret eam igni.\"},{\"verse\":11,\"text\":\"Et domui regis Juda : Audite verba Domini,\"},{\"verse\":12,\"text\":\"domus David. Hæc dicit Dominus : Judicate mane judicium, et eruite vi oppressum de manu calumniantis, ne forte egrediatur ut ignis indignatio mea, et succendatur, et non sit qui extinguat, propter malitiam studiorum vestrorum.\"},{\"verse\":13,\"text\":\"Ecce ego ad te, habitatricem vallis solidæ atque campestris, ait Dominus : qui dicitis : Quis percutiet nos ? et quis ingredietur domos nostras ?\"},{\"verse\":14,\"text\":\"Et visitabo super vos juxta fructum studiorum vestrorum, dicit Dominus : et succendam ignem in saltu ejus, et devorabit omnia in circuitu ejus.\"}],\"summary\":\"The prophet’s answer to the messengers of Sedecias, when Jerusalem was besieged.\",\"intro\":null,\"prev\":{\"usfm\":\"JER\",\"chapter\":20,\"label\":\"Jeremiah 20\"},\"next\":{\"usfm\":\"JER\",\"chapter\":22,\"label\":\"Jeremiah 22\"}}]]\n"])</script></body></html>
