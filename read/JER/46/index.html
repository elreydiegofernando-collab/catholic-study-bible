h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Jeremiah<!-- --> <span class="text-stone-500">46</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Jeremias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JER/">About <!-- -->Jeremiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A prophecy against Egypt. The Jews shall return from captivity.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The word of the Lord that came to Jeremias the prophet against the Gentiles,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Against Egypt, against the army of Pharao Nechao king of Egypt, which was by the river Euphrates in Charcamis, whom Nabuchodonosor the king of Babylon defeated, in the fourth year of Joakim the son of Josias king of Juda.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Prepare ye the shield and buckler, and go forth to battle.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Harness the horses, and get up, ye horsemen: stand forth with helmets, furbish the spears, put on coats of mail.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>What then? I have seen them dismayed, and turning their backs, their valiant ones slain: they fled apace, and they looked not back: terror was round about, saith the Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let not the swift flee away, nor the strong think to escape: they are overthrown, and fallen down, towards the north by the river Euphrates.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Who is this that cometh up as a flood: and his streams swell like those of rivers?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Egypt riseth up like a flood, and the waves thereof shall be moved as rivers, and he shall say: I will go up and will cover the earth: I will destroy the city, and its inhabitants.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Get ye up on horses, and glory in chariots, and let the valiant men come forth, the Ethiopians, and the Libyans that hold the shield, and the Lydians that take, and shoot arrows.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For this is the day of the Lord the God of hosts, a day of vengeance, that he may revenge himself of his enemies: the sword shall devour, and shall be filled, and shall be drunk with their blood: for there is a sacrifice of the Lord God of hosts in the north country, by the river Euphrates.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Go up into Galaad, and take balm, O virgin daughter of Egypt: in vain dost thou multiply medicines, there shall be no cure for thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The nations have heard of thy disgrace, and thy howling hath filled the land: for the strong hath stumbled against the strong, and both are fallen together.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The word that the Lord spoke to Jeremias the prophet, how Nabuchodonosor king of Babylon should come and strike the land of Egypt:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Declare ye to Egypt, and publish it in Magdal, and let it be known in Memphis, and in Taphnis: say ye: Stand up, and prepare thyself: for the sword shall devour all round about thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Why are thy valiant men come to nothing? they stood not: because the Lord hath overthrown them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He hath multiplied them that fall, and one hath fallen upon another, and they shall say: Arise, and let us return to our own people, and to the land of our nativity, from the sword of the dove.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Call ye the name of Pharao king of Egypt, a tumult time hath brought.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>As I live, saith the King, (whose name is the Lord of hosts,) as Thabor is among the mountains, and as Carmel by the sea, so shall he come.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Furnish thyself to go into captivity, thou daughter inhabitant of Egypt: for Memphis shall be made desolate, and shall be forsaken and uninhabited.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Egypt is like a fair and beautiful heifer: there shall come from the north one that shall goad her.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Her hirelings also that lived in the midst of her, like fatted calves are turned back, and are fled away together, and they could not stand, for the day of their slaughter is come upon them, the time of their visitation.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Her voice shall sound like brass, for they shall hasten with an army, and with axes they shall come against her, as hewers of wood.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>They have cut down her forest, saith the Lord, which cannot be counted: they are multiplied above locusts, and are without number.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The daughter of Egypt is confounded, and delivered into the hand of the people of the north.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The Lord of hosts the God of Israel hath said: Behold I will visit upon the tumult of Alexandria, and upon Pharao, and upon Egypt, and upon her gods, and upon her kings, and upon Pharao, and upon them that trust in him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And I will deliver them into the hand of them that seek their lives, and into the hand of Nabuchodonosor king of Babylon, and into the hand of his servants: and afterwards it shall be inhabited, as in the days of old, saith the Lord.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And thou my servant Jacob, fear not and be not thou dismayed, O Israel: for behold I will save thee from afar off, and thy seed out of the land of thy captivity: and Jacob shall return and be at rest, and prosper: and there shall be none to terrify him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And thou, my servant Jacob, fear not, saith the Lord: because I am with thee, for I will consume all the nations to which I have cast thee out: but thee I will not consume, but I will correct thee in judgment, neither will I spare thee as if thou wert innocent.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quod factum est verbum Domini ad Jeremiam prophetam contra gentes.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ad Ægyptum, adversum exercitum Pharaonis Nechao regis Ægypti, qui erat juxta fluvium Euphraten in Charcamis, quem percussit Nabuchodonosor rex Babylonis, in quarto anno Joakim filii Josiæ regis Juda.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Præparate scutum et clypeum, et procedite ad bellum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Jungite equos, et ascendite, equites : state in galeis, polite lanceas, induite vos loricis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quid igitur ? vidi ipsos pavidos, et terga vertentes, fortes eorum cæsos : fugerunt conciti, nec respexerunt : terror undique, ait Dominus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non fugiat velox, nec salvari se putet fortis : ad aquilonem juxta flumen Euphraten victi sunt, et ruerunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quis est iste, qui quasi flumen ascendit, et veluti fluviorum intumescunt gurgites ejus ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ægyptus fluminis instar ascendit, et velut flumina movebuntur fluctus ejus, et dicet : Ascendens operiam terram : perdam civitatem, et habitatores ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ascendite equos, et exsultate in curribus, et procedant fortes, Æthiopia et Libyes tenentes scutum, et Lydii arripientes et jacientes sagittas.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dies autem ille Domini Dei exercituum dies ultionis, ut sumat vindictam de inimicis suis : devorabit gladius, et saturabitur, et inebriabitur sanguine eorum : victima enim Domini Dei exercituum in terra aquilonis juxta flumen Euphraten.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ascende in Galaad, et tolle resinam, virgo filia Ægypti : frustra multiplicas medicamina : sanitas non erit tibi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Audierunt gentes ignominiam tuam, et ululatus tuus replevit terram : quia fortis impegit in fortem, et ambo pariter conciderunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Verbum quod locutus est Dominus ad Jeremiam prophetam, super eo quod venturus esset Nabuchodonosor rex Babylonis, et percussurus terram Ægypti :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Annuntiate Ægypto, et auditum facite in Magdalo, et resonet in Memphis, et in Taphnis : dicite : Sta, et præpara te, quia devorabit gladius ea quæ per circuitum tuum sunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quare computruit fortis tuus ? non stetit, quoniam Dominus subvertit eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Multiplicavit ruentes, ceciditque vir ad proximum suum, et dicent : Surge, et revertamur ad populum nostrum, et ad terram nativitatis nostræ, a facie gladii columbæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vocate nomen Pharaonis regis Ægypti : tumultum adduxit tempus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vivo ego, inquit Rex (Dominus exercituum nomen ejus), quoniam sicut Thabor in montibus, et sicut Carmelus in mari, veniet.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Vasa transmigrationis fac tibi, habitatrix filia Ægypti : quia Memphis in solitudinem erit, et deseretur, et inhabitabilis erit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vitula elegans atque formosa Ægyptus, stimulator ab aquilone veniet ei.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Mercenarii quoque ejus, qui versabantur in medio ejus quasi vituli saginati, versi sunt, et fugerunt simul, nec stare potuerunt : quia dies interfectionis eorum venit super eos, tempus visitationis eorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vox ejus quasi æris sonabit : quoniam cum exercitu properabunt, et cum securibus venient ei quasi cædentes ligna.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Succiderunt saltum ejus, ait Dominus, qui supputari non potest : multiplicati sunt super locustas, et non est eis numerus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Confusa est filia Ægypti, et tradita in manu populi aquilonis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixit Dominus exercituum, Deus Israël : Ecce ego visitabo super tumultum Alexandriæ, et super Pharaonem, et super Ægyptum, et super deos ejus, et super reges ejus, et super Pharaonem, et super eos qui confidunt in eo :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et dabo eos in manu quærentium animam eorum, et in manu Nabuchodonosor regis Babylonis, et in manu servorum ejus : et post hæc habitabitur sicut diebus pristinis, ait Dominus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et tu ne timeas, serve meus Jacob, et ne paveas, Israël : quia ecce ego salvum te faciam de longinquo, et semen tuum de terra captivitatis tuæ : et revertetur Jacob, et requiescet, et prosperabitur, et non erit qui exterreat eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et tu noli timere, serve meus Jacob, ait Dominus, quia tecum ego sum : quia ego consumam cunctas gentes ad quas ejeci te, te vero non consumam : sed castigabo te in judicio, nec quasi innocenti parcam tibi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/45/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin=" the Gentiles,\"},{\"verse\":2,\"text\":\"Against Egypt, against the army of Pharao Nechao king of Egypt, which was by the river Euphrates in Charcamis, whom Nabuchodonosor the king of Babylon defeated, in the fourth year of Joakim the son of Josias king of Juda.\"},{\"verse\":3,\"text\":\"Prepare ye the shield and buckler, and go forth to battle.\"},{\"verse\":4,\"text\":\"Harness the horses, and get up, ye horsemen: stand forth with helmets, furbish the spears, put on coats of mail.\"},{\"verse\":5,\"text\":\"What then? I have seen them dismayed, and turning their backs, their valiant ones slain: they fled apace, and they looked not back: terror was round about, saith the Lord.\"},{\"verse\":6,\"text\":\"Let not the swift flee away, nor the strong think to escape: they are overthrown, and fallen down, towards the north by the river Euphrates.\"},{\"verse\":7,\"text\":\"Who is this that cometh up as a flood: and his streams swell like those of rivers?\"},{\"verse\":8,\"text\":\"Egypt riseth up like a flood, and the waves thereof shall be moved as rivers, and he shall say: I will go up and will cover the earth: I will destroy the city, and its inhabitants.\"},{\"verse\":9,\"text\":\"Get ye up on horses, and glory in chariots, and let the valiant men come forth, the Ethiopians, and the Libyans that hold the shield, and the Lydians that take, and shoot arrows.\"},{\"verse\":10,\"text\":\"For this is the day of the Lord the God of hosts, a day of vengeance, that he may revenge himself of his enemies: the sword shall devour, and shall be filled, and shall be drunk with their blood: for there is a sacrifice of the Lord God of hosts in the north country, by the river Euphrates.\"},{\"verse\":11,\"text\":\"Go up into Galaad, and take balm, O virgin daughter of Egypt: in vain dost thou multiply medicines, there shall be no cure for thee.\"},{\"verse\":12,\"text\":\"The nations have heard of thy disgrace, and thy howling hath filled the land: for the strong hath stumbled against the strong, and both are fallen together.\"},{\"verse\":13,\"text\":\"The word that the Lord spoke to Jeremias the prophet, how Nabuchodonosor king of Babylon should come and strike the land of Egypt:\"},{\"verse\":14,\"text\":\"Declare ye to Egypt, and publish it in Magdal, and let it be known in Memphis, and in Taphnis: say ye: Stand up, and prepare thyself: for the sword shall devour all round about thee.\"},{\"verse\":15,\"text\":\"Why are thy valiant men come to nothing? they stood not: because the Lord hath overthrown them.\"},{\"verse\":16,\"text\":\"He hath multiplied them that fall, and one hath fallen upon another, and they shall say: Arise, and let us return to our own people, and to the land of our nativity, from the sword of the dove.\"},{\"verse\":17,\"text\":\"Call ye the name of Pharao king of Egypt, a tumult time hath brought.\"},{\"verse\":18,\"text\":\"As I live, saith the King, (whose name is the Lord of hosts,) as Thabor is among the mountains, and as Carmel by the sea, so shall he come.\"},{\"verse\":19,\"text\":\"Furnish thyself to go into captivity, thou daughter inhabitant of Egypt: for Memphis shall be made desolate, and shall be forsaken and uninhabited.\"},{\"verse\":20,\"text\":\"Egypt is like a fair and beautiful heifer: there shall come from the north one that shall goad her.\"},{\"verse\":21,\"text\":\"Her hirelings also that lived in the midst of her, like fatted calves are turned back, and are fled away together, and they could not stand, for the day of their slaughter is come upon them, the time of their visitation.\"},{\"verse\":22,\"text\":\"Her voice shall sound like brass, for they shall hasten with an army, and with axes they shall come against her, as hewers of wood.\"},{\"verse\":23,\"text\":\"They have cut down her forest, saith the Lord, which cannot be counted: they are multiplied above locusts, and are without number.\"},{\"verse\":24,\"text\":\"The daughter of Egypt is confounded, and delivered into the hand of the people of the north.\"},{\"verse\":25,\"text\":\"The Lord of hosts the God of Israel hath said: Behold I will visit upon the tumult of Alexandria, and upon Pharao, and upon Egypt, and upon her gods, and upon her kings, and upon Pharao, and upon them that trust in him.\"},{\"verse\":26,\"text\":\"And I will deliver them into the hand of them that seek their lives, and into the hand of Nabuchodonosor king of Babylon, and into the hand of his servants: and afterwards it shall be inhabited, as in the days of old, saith the Lord.\"},{\"verse\":27,\"text\":\"And thou my servant Jacob, fear not and be not thou dismayed, O Israel: for behold I will save thee from afar off, and thy seed out of the land of thy captivity: and Jacob shall return and be at rest, and prosper: and there shall be none to terrify him.\"},{\"verse\":28,\"text\":\"And thou, my servant Jacob, fear not, saith the Lord: because I am with thee, for I will consume all the nations to which I have cast thee out: but thee I will not consume, but I will correct thee in judgment, neither will I spare thee as if thou wert innocent.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quod factum est verbum Domini ad Jeremiam prophetam contra gentes.\"},{\"verse\":2,\"text\":\"Ad Ægyptum, adversum exercitum Pharaonis Nechao regis Ægypti, qui erat juxta fluvium Euphraten in Charcamis, quem percussit Nabuchodonosor rex Babylonis, in quarto anno Joakim filii Josiæ regis Juda.\"},{\"verse\":3,\"text\":\"Præparate scutum et clypeum, et procedite ad bellum.\"},{\"verse\":4,\"text\":\"Jungite equos, et ascendite, equites : state in galeis, polite lanceas, induite vos loricis.\"},{\"verse\":5,\"text\":\"Quid igitur ? vidi ipsos pavidos, et terga vertentes, fortes eorum cæsos : fugerunt conciti, nec respexerunt : terror undique, ait Dominus.\"},{\"verse\":6,\"text\":\"Non fugiat velox, nec salvari se putet fortis : ad aquilonem juxta flumen Euphraten victi sunt, et ruerunt.\"},{\"verse\":7,\"text\":\"Quis est iste, qui quasi flumen ascendit, et veluti fluviorum intumescunt gurgites ejus ?\"},{\"verse\":8,\"text\":\"Ægyptus fluminis instar ascendit, et velut flumina movebuntur fluctus ejus, et dicet : Ascendens operiam terram : perdam civitatem, et habitatores ejus.\"},{\"verse\":9,\"text\":\"Ascendite equos, et exsultate in curribus, et procedant fortes, Æthiopia et Libyes tenentes scutum, et Lydii arripientes et jacientes sagittas.\"},{\"verse\":10,\"text\":\"Dies autem ille Domini Dei exercituum dies ultionis, ut sumat vindictam de inimicis suis : devorabit gladius, et saturabitur, et inebriabitur sanguine eorum : victima enim Domini Dei exercituum in terra aquilonis juxta flumen Euphraten.\"},{\"verse\":11,\"text\":\"Ascende in Galaad, et tolle resinam, virgo filia Ægypti : frustra multiplicas medicamina : sanitas non erit tibi.\"},{\"verse\":12,\"text\":\"Audierunt gentes ignominiam tuam, et ululatus tuus replevit terram : quia fortis impegit in fortem, et ambo pariter conciderunt.\"},{\"verse\":13,\"text\":\"Verbum quod locutus est Dominus ad Jeremiam prophetam, super eo quod venturus esset Nabuchodonosor rex Babylonis, et percussurus terram Ægypti :\"},{\"verse\":14,\"text\":\"Annuntiate Ægypto, et auditum facite in Magdalo, et resonet in Memphis, et in Taphnis : dicite : Sta, et præpara te, quia devorabit gladius ea quæ per circuitum tuum sunt.\"},{\"verse\":15,\"text\":\"Quare computruit fortis tuus ? non stetit, quoniam Dominus subvertit eum.\"},{\"verse\":16,\"text\":\"Multiplicavit ruentes, ceciditque vir ad proximum suum, et dicent : Surge, et revertamur ad populum nostrum, et ad terram nativitatis nostræ, a facie gladii columbæ.\"},{\"verse\":17,\"text\":\"Vocate nomen Pharaonis regis Ægypti : tumultum adduxit tempus.\"},{\"verse\":18,\"text\":\"Vivo ego, inquit Rex (Dominus exercituum nomen ejus), quoniam sicut Thabor in montibus, et sicut Carmelus in mari, veniet.\"},{\"verse\":19,\"text\":\"Vasa transmigrationis fac tibi, habitatrix filia Ægypti : quia Memphis in solitudinem erit, et deseretur, et inhabitabilis erit.\"},{\"verse\":20,\"text\":\"Vitula elegans atque formosa Ægyptus, stimulator ab aquilone veniet ei.\"},{\"verse\":21,\"text\":\"Mercenarii quoque ejus, qui versabantur in medio ejus quasi vituli saginati, versi sunt, et fugerunt simul, nec stare potuerunt : quia dies interfectionis eorum venit super eos, tempus visitationis eorum.\"},{\"verse\":22,\"text\":\"Vox ejus quasi æris sonabit : quoniam cum exercitu properabunt, et cum securibus venient ei quasi cædentes ligna.\"},{\"verse\":23,\"text\":\"Succiderunt saltum ejus, ait Dominus, qui supputari non potest : multiplicati sunt super locustas, et non est eis numerus.\"},{\"verse\":24,\"text\":\"Confusa est filia Ægypti, et tradita in manu populi aquilonis.\"},{\"verse\":25,\"text\":\"Dixit Dominus exercituum, Deus Israël : Ecce ego visitabo super tumultum Alexandriæ, et super Pharaonem, et super Ægyptum, et super deos ejus, et super reges ejus, et super Pharaonem, et super eos qui confidunt in eo :\"},{\"verse\":26,\"text\":\"et dabo eos in manu quærentium animam eorum, et in manu Nabuchodonosor regis Babylonis, et in manu servorum ejus : et post hæc habitabitur sicut diebus pristinis, ait Dominus.\"},{\"verse\":27,\"text\":\"Et tu ne timeas, serve meus Jacob, et ne paveas, Israël : quia ecce ego salvum te faciam de longinquo, et semen tuum de terra captivitatis tuæ : et revertetur Jacob, et requiescet, et prosperabitur, et non erit qui exterreat eum.\"},{\"verse\":28,\"text\":\"Et tu noli timere, serve meus Jacob, ait Dominus, quia tecum ego sum : quia ego consumam cunctas gentes ad quas ejeci te, te vero non consumam : sed castigabo te in judicio, nec quasi innocenti parcam tibi.\"}],\"summary\":\"A prophecy against Egypt. The Jews shall return from captivity.\",\"intro\":null,\"prev\":{\"usfm\":\"JER\",\"chapter\":45,\"label\":\"Jeremiah 45\"},\"next\":{\"usfm\":\"JER\",\"chapter\":47,\"label\":\"Jeremiah 47\"}}]]\n"])</script></body></html>
