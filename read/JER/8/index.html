t="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>At that time, saith the Lord, they shall cast out the bones of the kings of Juda, and the bones of the princes thereof, and the bones of the priests, and the bones of the prophets, and the bones of the inhabitants of Jerusalem, out of their graves.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they shall spread them abroad to the sun, and the moon, and all the host of heaven, whom they have loved, and whom they have served, and after whom they have walked, and whom they have sought, and adored: they shall not be gathered, and they shall not be buried: they shall be as dung upon the face of the earth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And death shall be chosen rather than life by all that shall remain of this wicked kindred in all places, which are left, to which I have cast them out, saith the Lord of hosts.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou shalt say to them: Thus saith the Lord: Shall not he that falleth, rise again? and he that is turned away, shall he not turn again?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Why then is this people in Jerusalem turned away with a stubborn revolting? they have laid hold on lying, and have refused to return.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I attended, and hearkened; no man speaketh what is good, there is none that doth penance for his sin, saying: What have I done? They are all turned to their own course, as a horse rushing to the battle.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The kite in the air hath known her time: the turtle, and the swallow, and the stork have observed the time of their coming: but my people have not known the judgment of the Lord.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>How do you say: We are wise, and the law of the Lord is with us? Indeed the lying pen of the scribes hath wrought falsehood.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The wise men are confounded, they are dismayed, and taken: for they have cast away the word of the Lord, and there is no wisdom in them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Therefore will I give their women to strangers, their fields to others for an inheritance: because from the least even to the greatest all follow covetousness: from the prophet even to the priest all deal deceitfully.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they healed the breach of the daughter of my people disgracefully, saying: Peace, peace: when there was no peace.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They are confounded, because they have committed abomination: yea rather they are not confounded with confusion, and they have not known how to blush: therefore shall they fall among them that fall; in the time of their visitation they shall fall, saith the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Gathering I will gather them together, saith the Lord, there is no grape on the vines, and there are no figs on the fig tree, the leaf is fallen: and I have given them the things that are passed away.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Why do we sit still? assemble yourselves, and let us enter into the fenced city, and let us be silent there: for the Lord our God hath put us to silence, and hath given us water of gall to drink: for we have sinned against the Lord.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>We looked for peace and no good came: for a time of healing, and behold fear.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The snorting of his horses was heard from Dan, all the land was moved at the sound of the neighing of his warriors: and they came and devoured the land, and all that was in it: the city and its inhabitants.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For behold I will send among you serpents, basilisks, against which there is no charm: and they shall bite you, saith the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>My sorrow is above sorrow, my heart mourneth within me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Behold the voice of the daughter of my people from a far country: Is not the Lord in Sion, or is not her king in her? why then have they provoked me to wrath with their idols, and strange vanities?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The harvest is past, the summer is ended, and we are not saved.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For the affliction of the daughter of my people I am afflicted, and made sorrowful, astonishment hath taken hold on me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Is there no balm in Galaad? or is there no physician there? Why then is not the wound of the daughter of my people closed?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In illo tempore, ait Dominus, ejicient ossa regum Juda, et ossa principum ejus, et ossa sacerdotum, et ossa prophetarum, et ossa eorum qui habitaverunt Jerusalem, de sepulchris suis :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et expandent ea ad solem, et lunam, et omnem militiam cæli, quæ dilexerunt, et quibus servierunt, et post quæ ambulaverunt, et quæ quæsierunt, et adoraverunt. Non colligentur, et non sepelientur : in sterquilinium super faciem terræ erunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et eligent magis mortem quam vitam, omnes qui residui fuerint de cognatione hac pessima, in universis locis quæ derelicta sunt, ad quæ ejeci eos, dicit Dominus exercituum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dices ad eos : Hæc dicit Dominus : Numquid qui cadit non resurget ? et qui aversus est non revertetur ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quare ergo aversus est populus iste in Jerusalem aversione contentiosa ? Apprehenderunt mendacium, et noluerunt reverti.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Attendi, et auscultavi : nemo quod bonum est loquitur ; nullus est qui agat pœnitentiam super peccato suo, dicens : Quid feci ? Omnes conversi sunt ad cursum suum, quasi equus impetu vadens ad prælium.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Milvus in cælo cognovit tempus suum : turtur, et hirundo, et ciconia custodierunt tempus adventus sui : populus autem meus non cognovit judicium Domini.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quomodo dicitis : Sapientes nos sumus, et lex Domini nobiscum est ? vere mendacium operatus est stylus mendax scribarum !</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Confusi sunt sapientes ; perterriti et capti sunt : verbum enim Domini projecerunt, et sapientia nulla est in eis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Propterea dabo mulieres eorum exteris, agros eorum hæredibus, quia a minimo usque ad maximum omnes avaritiam sequuntur : a propheta usque ad sacerdotem cuncti faciunt mendacium.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et sanabant contritionem filiæ populi mei ad ignominiam, dicentes : Pax, pax ! cum non esset pax.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Confusi sunt, quia abominationem fecerunt : quinimmo confusione non sunt confusi, et erubescere nescierunt. Idcirco cadent inter corruentes : in tempore visitationis suæ corruent, dicit Dominus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Congregans congregabo eos, ait Dominus. Non est uva in vitibus, et non sunt ficus in ficulnea : folium defluxit, et dedi eis quæ prætergressa sunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quare sedemus ? convenite, et ingrediamur civitatem munitam, et sileamus ibi : quia Dominus Deus noster silere nos fecit, et potum dedit nobis aquam fellis : peccavimus enim Domino.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Exspectavimus pacem, et non erat bonum : tempus medelæ, et ecce formido.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A Dan auditus est fremitus equorum ejus ; a voce hinnituum pugnatorum ejus commota est omnis terra : et venerunt, et devoraverunt terram et plenitudinem ejus ; urbem et habitatores ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quia ecce ego mittam vobis serpentes regulos, quibus non est incantatio : et mordebunt vos, ait Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dolor meus super dolorem, in me cor meum mœrens.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ecce vox clamoris filiæ populi mei de terra longinqua : Numquid Dominus non est in Sion ? aut rex ejus non est in ea ? Quare ergo me ad iracundiam concitaverunt in sculptilibus suis, et in vanitatibus alienis ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Transiit messis, finita est æstas, et nos salvati non sumus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Super contritione filiæ populi mei contritus sum, et contristatus : stupor obtinuit me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Numquid resina non est in Galaad ? aut medicus non est ibi ? quare igitur non est obducta cicatrix filiæ populi mei ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Jeremiah 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span cla an life by all that shall remain of this wicked kindred in all places, which are left, to which I have cast them out, saith the Lord of hosts.\"},{\"verse\":4,\"text\":\"And thou shalt say to them: Thus saith the Lord: Shall not he that falleth, rise again? and he that is turned away, shall he not turn again?\"},{\"verse\":5,\"text\":\"Why then is this people in Jerusalem turned away with a stubborn revolting? they have laid hold on lying, and have refused to return.\"},{\"verse\":6,\"text\":\"I attended, and hearkened; no man speaketh what is good, there is none that doth penance for his sin, saying: What have I done? They are all turned to their own course, as a horse rushing to the battle.\"},{\"verse\":7,\"text\":\"The kite in the air hath known her time: the turtle, and the swallow, and the stork have observed the time of their coming: but my people have not known the judgment of the Lord.\"},{\"verse\":8,\"text\":\"How do you say: We are wise, and the law of the Lord is with us? Indeed the lying pen of the scribes hath wrought falsehood.\"},{\"verse\":9,\"text\":\"The wise men are confounded, they are dismayed, and taken: for they have cast away the word of the Lord, and there is no wisdom in them.\"},{\"verse\":10,\"text\":\"Therefore will I give their women to strangers, their fields to others for an inheritance: because from the least even to the greatest all follow covetousness: from the prophet even to the priest all deal deceitfully.\"},{\"verse\":11,\"text\":\"And they healed the breach of the daughter of my people disgracefully, saying: Peace, peace: when there was no peace.\"},{\"verse\":12,\"text\":\"They are confounded, because they have committed abomination: yea rather they are not confounded with confusion, and they have not known how to blush: therefore shall they fall among them that fall; in the time of their visitation they shall fall, saith the Lord.\"},{\"verse\":13,\"text\":\"Gathering I will gather them together, saith the Lord, there is no grape on the vines, and there are no figs on the fig tree, the leaf is fallen: and I have given them the things that are passed away.\"},{\"verse\":14,\"text\":\"Why do we sit still? assemble yourselves, and let us enter into the fenced city, and let us be silent there: for the Lord our God hath put us to silence, and hath given us water of gall to drink: for we have sinned against the Lord.\"},{\"verse\":15,\"text\":\"We looked for peace and no good came: for a time of healing, and behold fear.\"},{\"verse\":16,\"text\":\"The snorting of his horses was heard from Dan, all the land was moved at the sound of the neighing of his warriors: and they came and devoured the land, and all that was in it: the city and its inhabitants.\"},{\"verse\":17,\"text\":\"For behold I will send among you serpents, basilisks, against which there is no charm: and they shall bite you, saith the Lord.\"},{\"verse\":18,\"text\":\"My sorrow is above sorrow, my heart mourneth within me.\"},{\"verse\":19,\"text\":\"Behold the voice of the daughter of my people from a far country: Is not the Lord in Sion, or is not her king in her? why then have they provoked me to wrath with their idols, and strange vanities?\"},{\"verse\":20,\"text\":\"The harvest is past, the summer is ended, and we are not saved.\"},{\"verse\":21,\"text\":\"For the affliction of the daughter of my people I am afflicted, and made sorrowful, astonishment hath taken hold on me.\"},{\"verse\":22,\"text\":\"Is there no balm in Galaad? or is there no physician there? Why then is not the wound of the daughter of my people closed?\"}],\"vul\":[{\"verse\":1,\"text\":\"In illo tempore, ait Dominus, ejicient ossa regum Juda, et ossa principum ejus, et ossa sacerdotum, et ossa prophetarum, et ossa eorum qui habitaverunt Jerusalem, de sepulchris suis :\"},{\"verse\":2,\"text\":\"et expandent ea ad solem, et lunam, et omnem militiam cæli, quæ dilexerunt, et quibus servierunt, et post quæ ambulaverunt, et quæ quæsierunt, et adoraverunt. Non colligentur, et non sepelientur : in sterquilinium super faciem terræ erunt.\"},{\"verse\":3,\"text\":\"Et eligent magis mortem quam vitam, omnes qui residui fuerint de cognatione hac pessima, in universis locis quæ derelicta sunt, ad quæ ejeci eos, dicit Dominus exercituum.\"},{\"verse\":4,\"text\":\"Et dices ad eos : Hæc dicit Dominus : Numquid qui cadit non resurget ? et qui aversus est non revertetur ?\"},{\"verse\":5,\"text\":\"Quare ergo aversus est populus iste in Jerusalem aversione contentiosa ? Apprehenderunt mendacium, et noluerunt reverti.\"},{\"verse\":6,\"text\":\"Attendi, et auscultavi : nemo quod bonum est loquitur ; nullus est qui agat pœnitentiam super peccato suo, dicens : Quid feci ? Omnes conversi sunt ad cursum suum, quasi equus impetu vadens ad prælium.\"},{\"verse\":7,\"text\":\"Milvus in cælo cognovit tempus suum : turtur, et hirundo, et ciconia custodierunt tempus adventus sui : populus autem meus non cognovit judicium Domini.\"},{\"verse\":8,\"text\":\"Quomodo dicitis : Sapientes nos sumus, et lex Domini nobiscum est ? vere mendacium operatus est stylus mendax scribarum !\"},{\"verse\":9,\"text\":\"Confusi sunt sapientes ; perterriti et capti sunt : verbum enim Domini projecerunt, et sapientia nulla est in eis.\"},{\"verse\":10,\"text\":\"Propterea dabo mulieres eorum exteris, agros eorum hæredibus, quia a minimo usque ad maximum omnes avaritiam sequuntur : a propheta usque ad sacerdotem cuncti faciunt mendacium.\"},{\"verse\":11,\"text\":\"Et sanabant contritionem filiæ populi mei ad ignominiam, dicentes : Pax, pax ! cum non esset pax.\"},{\"verse\":12,\"text\":\"Confusi sunt, quia abominationem fecerunt : quinimmo confusione non sunt confusi, et erubescere nescierunt. Idcirco cadent inter corruentes : in tempore visitationis suæ corruent, dicit Dominus.\"},{\"verse\":13,\"text\":\"Congregans congregabo eos, ait Dominus. Non est uva in vitibus, et non sunt ficus in ficulnea : folium defluxit, et dedi eis quæ prætergressa sunt.\"},{\"verse\":14,\"text\":\"Quare sedemus ? convenite, et ingrediamur civitatem munitam, et sileamus ibi : quia Dominus Deus noster silere nos fecit, et potum dedit nobis aquam fellis : peccavimus enim Domino.\"},{\"verse\":15,\"text\":\"Exspectavimus pacem, et non erat bonum : tempus medelæ, et ecce formido.\"},{\"verse\":16,\"text\":\"A Dan auditus est fremitus equorum ejus ; a voce hinnituum pugnatorum ejus commota est omnis terra : et venerunt, et devoraverunt terram et plenitudinem ejus ; urbem et habitatores ejus.\"},{\"verse\":17,\"text\":\"Quia ecce ego mittam vobis serpentes regulos, quibus non est incantatio : et mordebunt vos, ait Dominus.\"},{\"verse\":18,\"text\":\"Dolor meus super dolorem, in me cor meum mœrens.\"},{\"verse\":19,\"text\":\"Ecce vox clamoris filiæ populi mei de terra longinqua : Numquid Dominus non est in Sion ? aut rex ejus non est in ea ? Quare ergo me ad iracundiam concitaverunt in sculptilibus suis, et in vanitatibus alienis ?\"},{\"verse\":20,\"text\":\"Transiit messis, finita est æstas, et nos salvati non sumus.\"},{\"verse\":21,\"text\":\"Super contritione filiæ populi mei contritus sum, et contristatus : stupor obtinuit me.\"},{\"verse\":22,\"text\":\"Numquid resina non est in Galaad ? aut medicus non est ibi ? quare igitur non est obducta cicatrix filiæ populi mei ?\"}],\"summary\":\"Other evils that shall fall upon the Jews for their impenitence.\",\"intro\":null,\"prev\":{\"usfm\":\"JER\",\"chapter\":7,\"label\":\"Jeremiah 7\"},\"next\":{\"usfm\":\"JER\",\"chapter\":9,\"label\":\"Jeremiah 9\"}}]]\n"])</script></body></html>
