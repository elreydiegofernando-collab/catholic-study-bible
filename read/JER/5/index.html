-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Jeremiah<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Jeremias</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JER/">About <!-- -->Jeremiah</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The judgments of God shall fall upon the Jews for their manifold sins.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Go about through the streets of Jerusalem, and see, and consider, and seek in the broad places thereof, if you can find a man that executeth judgment, and seeketh faith: and I will be merciful unto it.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And though they say: The Lord liveth; this also they will swear falsely.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>O Lord, thy eyes are upon truth: thou hast struck them, and they have not grieved: thou hast bruised them, and they have refused to receive correction: they have made their faces harder than the rock, and they have refused to return.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But I said: Perhaps these are poor and foolish, that know not the way of the Lord, the judgment of their God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I will go therefore to the great men, and will speak to them: for they have known the way of the Lord, the judgment of their God: and behold these have altogether broken the yoke more, and have burst the bonds.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Wherefore a lion out of the wood hath slain them, a wolf in the evening hath spoiled them, a leopard watcheth for their cities: every one that shall go out thence shall be taken, because their transgressions are multiplied, their rebellions are strengthened.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>How can I be merciful to thee? thy children have forsaken me, and swear by them that are not gods: I fed them to the full, and they committed adultery, and rioted in the harlot’s house.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>They are become as amorous horses and stallions: every one neighed after his neighbour’s wife.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Shall I not visit for these things, saith the Lord? and shall not my soul take revenge on such a nation?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Scale the walls thereof, and throw them down, but do not utterly destroy: take away the branches thereof, because they are not the Lord’s.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For the house of Israel, and the house of Juda have greatly transgressed against me, saith the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They have denied the Lord, and said, It is not he: and the evil shall not come upon us: we shall not see the sword and famine.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The prophets have spoken in the wind, and there was no word of God in them: these things therefore shall befall them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thus saith the Lord the God of hosts: because you have spoken this word, behold I will make my words in thy mouth as fire, and this people as wood, and it shall devour them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Behold I will bring upon you a nation from afar, O house of Israel, saith the Lord: a strong nation, an ancient nation, a nation whose language thou shalt not know, nor understand what they say.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Their quiver is as an open sepulchre, they are all valiant.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they shall eat up thy corn, and thy bread: they shall devour thy sons, and thy daughters: they shall eat up thy flocks, and thy herds: they shall eat thy vineyards, and thy figs: and with the sword they shall destroy thy strong cities, wherein thou trustest.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Nevertheless in those days, saith the Lord, I will not bring you to utter destruction.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And if you shall say: Why hath the Lord our God done all these things to us? thou shalt say to them: As you have forsaken me, and served a strange god in your own land, so shall you serve strangers in a land that is not your own.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Declare ye this to the house of Jacob, and publish it in Juda, saying:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hear, O foolish people, and without understanding: who have eyes, and see not: and ears, and hear not.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Will not you then fear me, saith the Lord: and will you not repent at my presence? I have set the sand a bound for the sea, an everlasting ordinance, which it shall not pass over: and the waves thereof shall toss themselves, and shall not prevail: they shall swell, and shall not pass over it.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But the heart of this people is become hard of belief and provoking, they are revolted and gone away.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they have not said in their heart: Let us fear the Lord our God, who giveth us the early and the latter rain in due season: who preserveth for us the fulness of the yearly harvest.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Your iniquities have turned these things away, and your sins have withholden good things from you.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For among my people are found wicked men, that lie in wait as fowlers, setting snares and traps to catch men.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>As a net is full of birds, so their houses are full of deceit: therefore are they become great and enriched.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They are grown gross and fat: and have most wickedly transgressed my words. They have not judged the cause of the widow, they have not managed the cause of the fatherless, and they have not judged the judgment of the poor.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Shall I not visit for these things, saith the Lord? or shall not my soul take revenge on such a nation?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Astonishing and wonderful things have been done in the land.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The prophets prophesied falsehood, and the priests clapped their hands: and my people loved such things: what then shall be done in the end thereof?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Circuite vias Jerusalem, et aspicite, et considerate, et quærite in plateis ejus, an inveniatis virum facientem judicium, et quærentem fidem : et propitius ero ei.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quod si etiam : Vivit Dominus, dixerint, et hoc falso jurabunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Domine, oculi tui respiciunt fidem : percussisti eos, et non doluerunt ; attrivisti eos, et renuerunt accipere disciplinam : induraverunt facies suas supra petram, et noluerunt reverti.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ego autem dixi : Forsitan pauperes sunt et stulti, ignorantes viam Domini, judicium Dei sui.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ibo igitur ad optimates, et loquar eis : ipsi enim cognoverunt viam Domini, judicium Dei sui : et ecce magis hi simul confregerunt jugum ; ruperunt vincula.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Idcirco percussit eos leo de silva ; lupus ad vesperam vastavit eos : pardus vigilans super civitates eorum : omnis qui egressus fuerit ex eis capietur : quia multiplicatæ sunt prævaricationes eorum ; confortatæ sunt aversiones eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Super quo propitius tibi esse potero ? filii tui dereliquerunt me, et jurant in his qui non sunt dii. Saturavi eos, et mœchati sunt, et in domo meretricis luxuriabantur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Equi amatores et emissarii facti sunt : unusquisque ad uxorem proximi sui hinniebat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Numquid super his non visitabo, dicit Dominus, et in gente tali non ulciscetur anima mea ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ascendite muros ejus, et dissipate : consummationem autem nolite facere : auferte propagines ejus, quia non sunt Domini.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Prævaricatione enim prævaricata est in me domus Israël, et domus Juda, ait Dominus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Negaverunt Dominum, et dixerunt : Non est ipse : neque veniet super nos malum : gladium et famem non videbimus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Prophetæ fuerunt in ventum locuti, et responsum non fuit in eis : hæc ergo evenient illis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hæc dicit Dominus Deus exercituum : Quia locuti estis verbum istud, ecce ego do verba mea in ore tuo in ignem, et populum istum in ligna, et vorabit eos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ecce ego adducam super vos gentem de longinquo, domus Israël, ait Dominus : gentem robustam, gentem antiquam, gentem cujus ignorabis linguam, nec intelliges quid loquatur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Pharetra ejus quasi sepulchrum patens ; universi fortes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et comedet segetes tuas et panem tuum ; devorabit filios tuos et filias tuas ; comedet gregem tuum et armenta tua ; comedet vineam tuam et ficum tuam : et conteret urbes munitas tuas, in quibus tu habes fiduciam, gladio.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Verumtamen in diebus illis, ait Dominus, non faciam vos in consummationem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quod si dixeritis : Quare fecit nobis Dominus Deus noster hæc omnia ? dices ad eos : Sicut dereliquistis me, et servistis deo alieno in terra vestra, sic servietis alienis in terra non vestra.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Annuntiate hoc domui Jacob, et auditum facite in Juda, dicentes :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Audi, popule stulte, qui non habes cor : qui habentes oculos, non videtis ; et aures, et non auditis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Me ergo non timebitis, ait Dominus, et a facie mea non dolebitis ? qui posui arenam terminum mari, præceptum sempiternum quod non præteribit : et commovebuntur, et non poterunt ; et intumescent fluctus ejus, et non transibunt illud.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Populo autem huic factum est cor incredulum et exasperans : recesserunt, et abierunt.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et non dixerunt in corde suo : Metuamus Dominum Deum nostrum, qui dat nobis pluviam temporaneam et serotinam in tempore suo, plenitudinem annuæ messis custodientem nobis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Iniquitates vestræ declinaverunt hæc, et peccata vestra prohibuerunt bonum a vobis :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>quia inventi sunt in populo meo impii insidiantes quasi aucupes, laqueos ponentes et pedicas ad capiendos viros.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sicut decipula plena avibus, sic domus eorum plenæ dolo : ideo magnificati sunt et ditati.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Incrassati sunt et impinguati, et præterierunt sermones meos pessime. Causam viduæ non judicaverunt, causam pupilli non direxerunt, et judicium pauperum non judicaverunt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Numquid super his non visitabo, dicit Dominus, aut super gentem hujuscemodi non ulciscetur anima mea ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Stupor et mirabilia facta sunt in terra :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>prophetæ prophetabant mendacium, et sacerdotes applaudebant manibus suis, et populus meus dilexit talia. Quid igitur fiet in novissimo ejus ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Jeremiah 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JER/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Jeremiah 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->52<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] b \"verse\":7,\"text\":\"How can I be merciful to thee? thy children have forsaken me, and swear by them that are not gods: I fed them to the full, and they committed adultery, and rioted in the harlot’s house.\"},{\"verse\":8,\"text\":\"They are become as amorous horses and stallions: every one neighed after his neighbour’s wife.\"},{\"verse\":9,\"text\":\"Shall I not visit for these things, saith the Lord? and shall not my soul take revenge on such a nation?\"},{\"verse\":10,\"text\":\"Scale the walls thereof, and throw them down, but do not utterly destroy: take away the branches thereof, because they are not the Lord’s.\"},{\"verse\":11,\"text\":\"For the house of Israel, and the house of Juda have greatly transgressed against me, saith the Lord.\"},{\"verse\":12,\"text\":\"They have denied the Lord, and said, It is not he: and the evil shall not come upon us: we shall not see the sword and famine.\"},{\"verse\":13,\"text\":\"The prophets have spoken in the wind, and there was no word of God in them: these things therefore shall befall them.\"},{\"verse\":14,\"text\":\"Thus saith the Lord the God of hosts: because you have spoken this word, behold I will make my words in thy mouth as fire, and this people as wood, and it shall devour them.\"},{\"verse\":15,\"text\":\"Behold I will bring upon you a nation from afar, O house of Israel, saith the Lord: a strong nation, an ancient nation, a nation whose language thou shalt not know, nor understand what they say.\"},{\"verse\":16,\"text\":\"Their quiver is as an open sepulchre, they are all valiant.\"},{\"verse\":17,\"text\":\"And they shall eat up thy corn, and thy bread: they shall devour thy sons, and thy daughters: they shall eat up thy flocks, and thy herds: they shall eat thy vineyards, and thy figs: and with the sword they shall destroy thy strong cities, wherein thou trustest.\"},{\"verse\":18,\"text\":\"Nevertheless in those days, saith the Lord, I will not bring you to utter destruction.\"},{\"verse\":19,\"text\":\"And if you shall say: Why hath the Lord our God done all these things to us? thou shalt say to them: As you have forsaken me, and served a strange god in your own land, so shall you serve strangers in a land that is not your own.\"},{\"verse\":20,\"text\":\"Declare ye this to the house of Jacob, and publish it in Juda, saying:\"},{\"verse\":21,\"text\":\"Hear, O foolish people, and without understanding: who have eyes, and see not: and ears, and hear not.\"},{\"verse\":22,\"text\":\"Will not you then fear me, saith the Lord: and will you not repent at my presence? I have set the sand a bound for the sea, an everlasting ordinance, which it shall not pass over: and the waves thereof shall toss themselves, and shall not prevail: they shall swell, and shall not pass over it.\"},{\"verse\":23,\"text\":\"But the heart of this people is become hard of belief and provoking, they are revolted and gone away.\"},{\"verse\":24,\"text\":\"And they have not said in their heart: Let us fear the Lord our God, who giveth us the early and the latter rain in due season: who preserveth for us the fulness of the yearly harvest.\"},{\"verse\":25,\"text\":\"Your iniquities have turned these things away, and your sins have withholden good things from you.\"},{\"verse\":26,\"text\":\"For among my people are found wicked men, that lie in wait as fowlers, setting snares and traps to catch men.\"},{\"verse\":27,\"text\":\"As a net is full of birds, so their houses are full of deceit: therefore are they become great and enriched.\"},{\"verse\":28,\"text\":\"They are grown gross and fat: and have most wickedly transgressed my words. They have not judged the cause of the widow, they have not managed the cause of the fatherless, and they have not judged the judgment of the poor.\"},{\"verse\":29,\"text\":\"Shall I not visit for these things, saith the Lord? or shall not my soul take revenge on such a nation?\"},{\"verse\":30,\"text\":\"Astonishing and wonderful things have been done in the land.\"},{\"verse\":31,\"text\":\"The prophets prophesied falsehood, and the priests clapped their hands: and my people loved such things: what then shall be done in the end thereof?\"}],\"vul\":[{\"verse\":1,\"text\":\"Circuite vias Jerusalem, et aspicite, et considerate, et quærite in plateis ejus, an inveniatis virum facientem judicium, et quærentem fidem : et propitius ero ei.\"},{\"verse\":2,\"text\":\"Quod si etiam : Vivit Dominus, dixerint, et hoc falso jurabunt.\"},{\"verse\":3,\"text\":\"Domine, oculi tui respiciunt fidem : percussisti eos, et non doluerunt ; attrivisti eos, et renuerunt accipere disciplinam : induraverunt facies suas supra petram, et noluerunt reverti.\"},{\"verse\":4,\"text\":\"Ego autem dixi : Forsitan pauperes sunt et stulti, ignorantes viam Domini, judicium Dei sui.\"},{\"verse\":5,\"text\":\"Ibo igitur ad optimates, et loquar eis : ipsi enim cognoverunt viam Domini, judicium Dei sui : et ecce magis hi simul confregerunt jugum ; ruperunt vincula.\"},{\"verse\":6,\"text\":\"Idcirco percussit eos leo de silva ; lupus ad vesperam vastavit eos : pardus vigilans super civitates eorum : omnis qui egressus fuerit ex eis capietur : quia multiplicatæ sunt prævaricationes eorum ; confortatæ sunt aversiones eorum.\"},{\"verse\":7,\"text\":\"Super quo propitius tibi esse potero ? filii tui dereliquerunt me, et jurant in his qui non sunt dii. Saturavi eos, et mœchati sunt, et in domo meretricis luxuriabantur.\"},{\"verse\":8,\"text\":\"Equi amatores et emissarii facti sunt : unusquisque ad uxorem proximi sui hinniebat.\"},{\"verse\":9,\"text\":\"Numquid super his non visitabo, dicit Dominus, et in gente tali non ulciscetur anima mea ?\"},{\"verse\":10,\"text\":\"Ascendite muros ejus, et dissipate : consummationem autem nolite facere : auferte propagines ejus, quia non sunt Domini.\"},{\"verse\":11,\"text\":\"Prævaricatione enim prævaricata est in me domus Israël, et domus Juda, ait Dominus.\"},{\"verse\":12,\"text\":\"Negaverunt Dominum, et dixerunt : Non est ipse : neque veniet super nos malum : gladium et famem non videbimus.\"},{\"verse\":13,\"text\":\"Prophetæ fuerunt in ventum locuti, et responsum non fuit in eis : hæc ergo evenient illis.\"},{\"verse\":14,\"text\":\"Hæc dicit Dominus Deus exercituum : Quia locuti estis verbum istud, ecce ego do verba mea in ore tuo in ignem, et populum istum in ligna, et vorabit eos.\"},{\"verse\":15,\"text\":\"Ecce ego adducam super vos gentem de longinquo, domus Israël, ait Dominus : gentem robustam, gentem antiquam, gentem cujus ignorabis linguam, nec intelliges quid loquatur.\"},{\"verse\":16,\"text\":\"Pharetra ejus quasi sepulchrum patens ; universi fortes.\"},{\"verse\":17,\"text\":\"Et comedet segetes tuas et panem tuum ; devorabit filios tuos et filias tuas ; comedet gregem tuum et armenta tua ; comedet vineam tuam et ficum tuam : et conteret urbes munitas tuas, in quibus tu habes fiduciam, gladio.\"},{\"verse\":18,\"text\":\"Verumtamen in diebus illis, ait Dominus, non faciam vos in consummationem.\"},{\"verse\":19,\"text\":\"Quod si dixeritis : Quare fecit nobis Dominus Deus noster hæc omnia ? dices ad eos : Sicut dereliquistis me, et servistis deo alieno in terra vestra, sic servietis alienis in terra non vestra.\"},{\"verse\":20,\"text\":\"Annuntiate hoc domui Jacob, et auditum facite in Juda, dicentes :\"},{\"verse\":21,\"text\":\"Audi, popule stulte, qui non habes cor : qui habentes oculos, non videtis ; et aures, et non auditis.\"},{\"verse\":22,\"text\":\"Me ergo non timebitis, ait Dominus, et a facie mea non dolebitis ? qui posui arenam terminum mari, præceptum sempiternum quod non præteribit : et commovebuntur, et non poterunt ; et intumescent fluctus ejus, et non transibunt illud.\"},{\"verse\":23,\"text\":\"Populo autem huic factum est cor incredulum et exasperans : recesserunt, et abierunt.\"},{\"verse\":24,\"text\":\"Et non dixerunt in corde suo : Metuamus Dominum Deum nostrum, qui dat nobis pluviam temporaneam et serotinam in tempore suo, plenitudinem annuæ messis custodientem nobis.\"},{\"verse\":25,\"text\":\"Iniquitates vestræ declinaverunt hæc, et peccata vestra prohibuerunt bonum a vobis :\"},{\"verse\":26,\"text\":\"quia inventi sunt in populo meo impii insidiantes quasi aucupes, laqueos ponentes et pedicas ad capiendos viros.\"},{\"verse\":27,\"text\":\"Sicut decipula plena avibus, sic domus eorum plenæ dolo : ideo magnificati sunt et ditati.\"},{\"verse\":28,\"text\":\"Incrassati sunt et impinguati, et præterierunt sermones meos pessime. Causam viduæ non judicaverunt, causam pupilli non direxerunt, et judicium pauperum non judicaverunt.\"},{\"verse\":29,\"text\":\"Numquid super his non visitabo, dicit Dominus, aut super gentem hujuscemodi non ulciscetur anima mea ?\"},{\"verse\":30,\"text\":\"Stupor et mirabilia facta sunt in terra :\"},{\"verse\":31,\"text\":\"prophetæ prophetabant mendacium, et sacerdotes applaudebant manibus suis, et populus meus dilexit talia. Quid igitur fiet in novissimo ejus ?\"}],\"summary\":\"The judgments of God shall fall upon the Jews for their manifold sins.\",\"intro\":null,\"prev\":{\"usfm\":\"JER\",\"chapter\":4,\"label\":\"Jeremiah 4\"},\"next\":{\"usfm\":\"JER\",\"chapter\":6,\"label\":\"Jeremiah 6\"}}]]\n"])</script></body></html>
