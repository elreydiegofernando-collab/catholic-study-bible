"h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Colossians<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/COL/">About <!-- -->Colossians</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">He recommends constant prayer and wisdom. Various salutations.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Masters, do to your servants that which is just and equal: knowing that you also have a master in heaven.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Be instant in prayer: watching in it with thanksgiving.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Praying withal for us also, that God may open unto us a door of speech to speak the mystery of Christ (for which also I am bound):</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>That I may make it manifest as I ought to speak.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Walk with wisdom towards them that are without, redeeming the time.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let your speech be always in grace seasoned with salt: that you may know how you ought to answer every man.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>All the things that concern me, Tychicus, our dearest brother and faithful minister and fellow servant in the Lord, will make known to you.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Whom I have sent to you for this same purpose, that he may know the things that concern you and comfort your hearts:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>With Onesimus, a most beloved and faithful brother, who is one of you. All things that are done here, they shall make known to you.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Aristarchus, my fellow prisoner, saluteth you: and Mark, the cousin german of Barnabas, touching whom you have received commandments. If he come unto you, receive him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Jesus that is called Justus: who are of the circumcision. These only are my helpers, in the kingdom of God: who have been a comfort to me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Epaphras saluteth you, who is one of you, a servant of Christ Jesus, who is always solicitous for you in prayers, that you may stand perfect and full in all the will of God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For I bear him testimony that he hath much labour for you and for them that are at Laodicea and them at Hierapolis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Luke, the most dear physician, saluteth you: and Demas.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Salute the brethren who are at Laodicea: and Nymphas and the church that is in his house.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when this epistle shall have been read with you, cause that it be read also in the church of the Laodiceans: and that you read that which is of the Laodiceans.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And say to Archippus: Take heed to the ministry which thou hast received in the Lord, that thou fulfil it.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The salutation of Paul with my own hand. Be mindful of my bands. Grace be with you. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Domini, quod justum est et æquum, servis præstate : scientes quod et vos Dominum habetis in cælo.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Orationi instate, vigilantes in ea in gratiarum actione :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>orantes simul et pro nobis, ut Deus aperiat nobis ostium sermonis ad loquendum mysterium Christi (propter quod etiam vinctus sum),</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ut manifestem illud ita ut oportet me loqui.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In sapientia ambulate ad eos, qui foris sunt : tempus redimentes.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sermo vester semper in gratia sale sit conditus, ut sciatis quomodo oporteat vos unicuique respondere.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quæ circa me sunt, omnia vobis nota faciet Tychicus, carissimus frater, et fidelis minister, et conservus in Domino :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>quem misi ad vos ad hoc ipsum, ut cognoscat quæ circa vos sunt, et consoletur corda vestra,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>cum Onesimo carissimo, et fideli fratre, qui ex vobis est. Omnia, quæ hic aguntur, nota facient vobis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Salutat vos Aristarchus concaptivus meus, et Marcus consobrinus Barnabæ, de quo accepistis mandata : si venerit ad vos, excipite illum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et Jesus, qui dicitur Justus : qui sunt ex circumcisione : hi soli sunt adjutores mei in regno Dei, qui mihi fuerunt solatio.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Salutat vos Epaphras, qui ex vobis est, servus Christi Jesu, semper sollicitus pro vobis in orationibus, ut stetis perfecti, et pleni in omni voluntate Dei.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Testimonium enim illi perhibeo quod habet multum laborem pro vobis, et pro iis qui sunt Laodiciæ, et qui Hierapoli.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Salutat vos Lucas, medicus carissimus, et Demas.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Salutate fratres, qui sunt Laodiciæ, et Nympham, et quæ in domo ejus est, ecclesiam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et cum lecta fuerit apud vos epistola hæc, facite ut et in Laodicensium ecclesia legatur : et eam, quæ Laodicensium est, vos legatis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et dicite Archippo : Vide ministerium, quod accepisti in Domino, ut illud impleas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Salutatio, mea manu Pauli. Memores estote vinculorum meorum. Gratia vobiscum. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/COL/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Colossians 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl bord manifest as I ought to speak.\"},{\"verse\":5,\"text\":\"Walk with wisdom towards them that are without, redeeming the time.\"},{\"verse\":6,\"text\":\"Let your speech be always in grace seasoned with salt: that you may know how you ought to answer every man.\"},{\"verse\":7,\"text\":\"All the things that concern me, Tychicus, our dearest brother and faithful minister and fellow servant in the Lord, will make known to you.\"},{\"verse\":8,\"text\":\"Whom I have sent to you for this same purpose, that he may know the things that concern you and comfort your hearts:\"},{\"verse\":9,\"text\":\"With Onesimus, a most beloved and faithful brother, who is one of you. All things that are done here, they shall make known to you.\"},{\"verse\":10,\"text\":\"Aristarchus, my fellow prisoner, saluteth you: and Mark, the cousin german of Barnabas, touching whom you have received commandments. If he come unto you, receive him.\"},{\"verse\":11,\"text\":\"And Jesus that is called Justus: who are of the circumcision. These only are my helpers, in the kingdom of God: who have been a comfort to me.\"},{\"verse\":12,\"text\":\"Epaphras saluteth you, who is one of you, a servant of Christ Jesus, who is always solicitous for you in prayers, that you may stand perfect and full in all the will of God.\"},{\"verse\":13,\"text\":\"For I bear him testimony that he hath much labour for you and for them that are at Laodicea and them at Hierapolis.\"},{\"verse\":14,\"text\":\"Luke, the most dear physician, saluteth you: and Demas.\"},{\"verse\":15,\"text\":\"Salute the brethren who are at Laodicea: and Nymphas and the church that is in his house.\"},{\"verse\":16,\"text\":\"And when this epistle shall have been read with you, cause that it be read also in the church of the Laodiceans: and that you read that which is of the Laodiceans.\"},{\"verse\":17,\"text\":\"And say to Archippus: Take heed to the ministry which thou hast received in the Lord, that thou fulfil it.\"},{\"verse\":18,\"text\":\"The salutation of Paul with my own hand. Be mindful of my bands. Grace be with you. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Domini, quod justum est et æquum, servis præstate : scientes quod et vos Dominum habetis in cælo.\"},{\"verse\":2,\"text\":\"Orationi instate, vigilantes in ea in gratiarum actione :\"},{\"verse\":3,\"text\":\"orantes simul et pro nobis, ut Deus aperiat nobis ostium sermonis ad loquendum mysterium Christi (propter quod etiam vinctus sum),\"},{\"verse\":4,\"text\":\"ut manifestem illud ita ut oportet me loqui.\"},{\"verse\":5,\"text\":\"In sapientia ambulate ad eos, qui foris sunt : tempus redimentes.\"},{\"verse\":6,\"text\":\"Sermo vester semper in gratia sale sit conditus, ut sciatis quomodo oporteat vos unicuique respondere.\"},{\"verse\":7,\"text\":\"Quæ circa me sunt, omnia vobis nota faciet Tychicus, carissimus frater, et fidelis minister, et conservus in Domino :\"},{\"verse\":8,\"text\":\"quem misi ad vos ad hoc ipsum, ut cognoscat quæ circa vos sunt, et consoletur corda vestra,\"},{\"verse\":9,\"text\":\"cum Onesimo carissimo, et fideli fratre, qui ex vobis est. Omnia, quæ hic aguntur, nota facient vobis.\"},{\"verse\":10,\"text\":\"Salutat vos Aristarchus concaptivus meus, et Marcus consobrinus Barnabæ, de quo accepistis mandata : si venerit ad vos, excipite illum :\"},{\"verse\":11,\"text\":\"et Jesus, qui dicitur Justus : qui sunt ex circumcisione : hi soli sunt adjutores mei in regno Dei, qui mihi fuerunt solatio.\"},{\"verse\":12,\"text\":\"Salutat vos Epaphras, qui ex vobis est, servus Christi Jesu, semper sollicitus pro vobis in orationibus, ut stetis perfecti, et pleni in omni voluntate Dei.\"},{\"verse\":13,\"text\":\"Testimonium enim illi perhibeo quod habet multum laborem pro vobis, et pro iis qui sunt Laodiciæ, et qui Hierapoli.\"},{\"verse\":14,\"text\":\"Salutat vos Lucas, medicus carissimus, et Demas.\"},{\"verse\":15,\"text\":\"Salutate fratres, qui sunt Laodiciæ, et Nympham, et quæ in domo ejus est, ecclesiam.\"},{\"verse\":16,\"text\":\"Et cum lecta fuerit apud vos epistola hæc, facite ut et in Laodicensium ecclesia legatur : et eam, quæ Laodicensium est, vos legatis.\"},{\"verse\":17,\"text\":\"Et dicite Archippo : Vide ministerium, quod accepisti in Domino, ut illud impleas.\"},{\"verse\":18,\"text\":\"Salutatio, mea manu Pauli. Memores estote vinculorum meorum. Gratia vobiscum. Amen.\"}],\"summary\":\"He recommends constant prayer and wisdom. Various salutations.\",\"intro\":null,\"prev\":{\"usfm\":\"COL\",\"chapter\":3,\"label\":\"Colossians 3\"},\"next\":{\"usfm\":\"1TH\",\"chapter\":1,\"label\":\"1 Thessalonians 1\"}}]]\n"])</script></body></html>
