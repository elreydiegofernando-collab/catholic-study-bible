 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Micah<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Micheas</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The birth of Christ in Bethlehem: his reign and spiritual conquests.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now shalt thou be laid waste, O daughter of the robber: they have laid siege against us, with a rod shall they strike the cheek of the judge of Israel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And thou Bethlehem Ephrata, art a little one among the thousands of Juda, out of thee shall he come forth unto me that is to be the ruler in Israel: and his going forth is from the beginning, from the days of eternity.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Therefore will he give them up even till the time wherein she that travaileth shall bring forth: and the remnant of his brethren shall be converted to the children of Israel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he shall stand, and feed in the strength of the Lord, in the height of the name of the Lord, his God: and they shall be converted, for now shall he be magnified even to the ends of the earth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And this man shall be our peace, when the Assyrian shall come into our land, and when he shall set his foot in our houses: and we shall raise against him seven shepherds, and eight principal men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they shall feed the land of Assyria with the sword, and the land of Nemrod with the spears thereof: and he shall deliver us from the Assyrian when he shall come into our land, and when he shall tread in our borders.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the remnant of Jacob shall be in the midst of many peoples, as a dew from the Lord, and as drops upon the grass, which waiteth not for man, nor tarrieth for the children of men.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the remnant of Jacob shall be among the Gentiles, in the midst of many peoples, as a lion among the beasts of the forests, and as a young lion among the flocks of sheep: who, when he shall go through, and tread down, and take there is none to deliver.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thy hand shall be lifted up over thy enemies, and all thy enemies shall be cut off.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And it shall come to pass in that day, saith the Lord, that I will take away thy horses out of the midst of thee, and will destroy thy chariots.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I will destroy the cities of thy land, and will throw down all thy strong holds, and I will take away sorceries out of thy hand, and there shall be no divinations in thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And I will destroy thy graven things, and thy statues, out of the midst of thee: and thou shalt no more adore the works of thy hands.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I will pluck up thy groves out of the midst of thee: and will crush thy cities.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And I will execute vengeance in wrath, and in indignation, among all the nations that have not given ear.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nunc vastaberis, filia latronis. Obsidionem posuerunt super nos : in virga percutient maxillam judicis Israël.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et tu, Bethlehem Ephrata, parvulus es in millibus Juda ; ex te mihi egredietur qui sit dominator in Israël, et egressus ejus ab initio, a diebus æternitatis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Propter hoc dabit eos usque ad tempus in quo parturiens pariet, et reliquiæ fratrum ejus convertentur ad filios Israël.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et stabit, et pascet in fortitudine Domini, in sublimitate nominis Domini Dei sui : et convertentur, quia nunc magnificabitur usque ad terminos terræ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et erit iste pax : cum venerit Assyrius in terram nostram, et quando calcaverit domibus nostris, et suscitabimus super eum septem pastores et octo primates homines ;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et pascent terram Assur in gladio, et terram Nemrod in lanceis ejus, et liberabit ab Assur cum venerit in terram nostram, et cum calcaverit in finibus nostris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et erunt reliquiæ Jacob in medio populorum multorum quasi ros a Domino, et quasi stillæ super herbam, quæ non exspectat virum, et non præstolatur filios hominum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et erunt reliquiæ Jacob in gentibus, in medio populorum multorum, quasi leo in jumentis silvarum, et quasi catulus leonis in gregibus pecorum, qui cum transierit, et conculcaverit, et ceperit, non est qui eruat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Exaltabitur manus tua super hostes tuos, et omnes inimici tui interibunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et erit in die illa, dicit Dominus : auferam equos tuos de medio tui, et disperdam quadrigas tuas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et perdam civitates terræ tuæ, et destruam omnes munitiones tuas : et auferam maleficia de manu tua, et divinationes non erunt in te :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et perire faciam sculptilia tua et statuas tuas de medio tui, et non adorabis ultra opera manuum tuarum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et evellam lucos tuos de medio tui, et conteram civitates tuas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et faciam, in furore et in indignatione, ultionem in omnibus gentibus quæ non audierunt.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MIC/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Micah 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MIC/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Micah 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->7<!-- --> · swipe left or right to turn the page</p></article></div>< nant of Jacob shall be in the midst of many peoples, as a dew from the Lord, and as drops upon the grass, which waiteth not for man, nor tarrieth for the children of men.\"},{\"verse\":8,\"text\":\"And the remnant of Jacob shall be among the Gentiles, in the midst of many peoples, as a lion among the beasts of the forests, and as a young lion among the flocks of sheep: who, when he shall go through, and tread down, and take there is none to deliver.\"},{\"verse\":9,\"text\":\"Thy hand shall be lifted up over thy enemies, and all thy enemies shall be cut off.\"},{\"verse\":10,\"text\":\"And it shall come to pass in that day, saith the Lord, that I will take away thy horses out of the midst of thee, and will destroy thy chariots.\"},{\"verse\":11,\"text\":\"And I will destroy the cities of thy land, and will throw down all thy strong holds, and I will take away sorceries out of thy hand, and there shall be no divinations in thee.\"},{\"verse\":12,\"text\":\"And I will destroy thy graven things, and thy statues, out of the midst of thee: and thou shalt no more adore the works of thy hands.\"},{\"verse\":13,\"text\":\"And I will pluck up thy groves out of the midst of thee: and will crush thy cities.\"},{\"verse\":14,\"text\":\"And I will execute vengeance in wrath, and in indignation, among all the nations that have not given ear.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nunc vastaberis, filia latronis. Obsidionem posuerunt super nos : in virga percutient maxillam judicis Israël.\"},{\"verse\":2,\"text\":\"Et tu, Bethlehem Ephrata, parvulus es in millibus Juda ; ex te mihi egredietur qui sit dominator in Israël, et egressus ejus ab initio, a diebus æternitatis.\"},{\"verse\":3,\"text\":\"Propter hoc dabit eos usque ad tempus in quo parturiens pariet, et reliquiæ fratrum ejus convertentur ad filios Israël.\"},{\"verse\":4,\"text\":\"Et stabit, et pascet in fortitudine Domini, in sublimitate nominis Domini Dei sui : et convertentur, quia nunc magnificabitur usque ad terminos terræ.\"},{\"verse\":5,\"text\":\"Et erit iste pax : cum venerit Assyrius in terram nostram, et quando calcaverit domibus nostris, et suscitabimus super eum septem pastores et octo primates homines ;\"},{\"verse\":6,\"text\":\"et pascent terram Assur in gladio, et terram Nemrod in lanceis ejus, et liberabit ab Assur cum venerit in terram nostram, et cum calcaverit in finibus nostris.\"},{\"verse\":7,\"text\":\"Et erunt reliquiæ Jacob in medio populorum multorum quasi ros a Domino, et quasi stillæ super herbam, quæ non exspectat virum, et non præstolatur filios hominum.\"},{\"verse\":8,\"text\":\"Et erunt reliquiæ Jacob in gentibus, in medio populorum multorum, quasi leo in jumentis silvarum, et quasi catulus leonis in gregibus pecorum, qui cum transierit, et conculcaverit, et ceperit, non est qui eruat.\"},{\"verse\":9,\"text\":\"Exaltabitur manus tua super hostes tuos, et omnes inimici tui interibunt.\"},{\"verse\":10,\"text\":\"Et erit in die illa, dicit Dominus : auferam equos tuos de medio tui, et disperdam quadrigas tuas.\"},{\"verse\":11,\"text\":\"Et perdam civitates terræ tuæ, et destruam omnes munitiones tuas : et auferam maleficia de manu tua, et divinationes non erunt in te :\"},{\"verse\":12,\"text\":\"et perire faciam sculptilia tua et statuas tuas de medio tui, et non adorabis ultra opera manuum tuarum :\"},{\"verse\":13,\"text\":\"et evellam lucos tuos de medio tui, et conteram civitates tuas.\"},{\"verse\":14,\"text\":\"Et faciam, in furore et in indignatione, ultionem in omnibus gentibus quæ non audierunt.\"}],\"summary\":\"The birth of Christ in Bethlehem: his reign and spiritual conquests.\",\"intro\":null,\"prev\":{\"usfm\":\"MIC\",\"chapter\":4,\"label\":\"Micah 4\"},\"next\":{\"usfm\":\"MIC\",\"chapter\":6,\"label\":\"Micah 6\"}}]]\n"])</script></body></html>
