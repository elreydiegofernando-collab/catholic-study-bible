"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">2</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of offerings of flour, and firstfruits.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>When any one shall offer an oblation of sacrifice to the Lord, his offering shall be of fine flour: and he shall pour oil upon it, and put frankincense,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And shall bring it to the sons of Aaron the priests. And one of them shall take a handful of the flour and oil, and all the frankincense; and shall put it a memorial upon the altar for a most sweet savour to the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the remnant of the sacrifice shall be Aaron’s, and his sons’, holy of holies of the offerings of the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But when thou offerest a sacrifice baked in the oven of flour, to wit, loaves without leaven, tempered with oil, and unleavened wafers, anointed with oil:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If thy oblation be from the fryingpan, of flour tempered with oil, and without leaven:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thou shalt divide it into little pieces, and shalt pour oil upon it.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And if the sacrifice be from the gridiron, in like manner the flour shall be tempered with oil.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when thou offerest it to the Lord, thou shalt deliver it to the hands of the priest.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when he hath offered it, he shall take a memorial out of the sacrifice, and burn it upon the altar for a sweet savour to the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And whatsoever is left, shall be Aaron’s, and his sons’: holy of holies of the offerings of the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Every oblation that is offered to the Lord shall be made without leaven: neither shall any leaven or honey be burnt in the sacrifice to the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>You shall offer only the firstfruits of them and gifts: but they shall not be put upon the altar, for a savour of sweetness.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Whatsoever sacrifice thou offerest, thou shalt season it with salt: neither shalt thou take away the salt of the covenant of thy God from thy sacrifice. In all thy oblations thou shalt offer salt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But if thou offer a gift of the firstfruits of thy corn to the Lord, of the ears yet green, thou shalt dry it at the fire, and break it small like meal; and so shalt thou offer thy firstfruits to the Lord:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Pouring oil upon it and putting on frankincense, because it is the oblation of the Lord.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Whereof the priest shall burn for a memorial of the gift, part of the corn broken small and of the oil, and all the frankincense.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Anima cum obtulerit oblationem sacrificii Domino, simila erit ejus oblatio ; fundetque super eam oleum, et ponet thus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ac deferet ad filios Aaron sacerdotes : quorum unus tollet pugillum plenum similæ et olei, ac totum thus, et ponet memoriale super altare in odorem suavissimum Domino.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quod autem reliquum fuerit de sacrificio, erit Aaron et filiorum ejus, Sanctum sanctorum de oblationibus Domini.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cum autem obtuleris sacrificium coctum in clibano : de simila, panes scilicet absque fermento, conspersos oleo, et lagana azyma oleo lita.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si oblatio tua fuerit de sartagine, similæ conspersæ oleo et absque fermento,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>divides eam minutatim, et fundes super eam oleum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sin autem de craticula fuerit sacrificium, æque simila oleo conspergetur :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>quam offerens Domino, trades manibus sacerdotis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui cum obtulerit eam, tollet memoriale de sacrificio, et adolebit super altare in odorem suavitatis Domino :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>quidquid autem reliquum est, erit Aaron, et filiorum ejus, Sanctum sanctorum de oblationibus Domini.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Omnis oblatio quæ offeretur Domino, absque fermento fiet, nec quidquam fermenti ac mellis adolebitur in sacrificio Domino.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Primitias tantum eorum offeretis ac munera : super altare vero non imponentur in odorem suavitatis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quidquid obtuleris sacrificii, sale condies, nec auferes sal fœderis Dei tui de sacrificio tuo : in omni oblatione tua offeres sal.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si autem obtuleris munus primarum frugum tuarum Domino de spicis adhuc virentibus, torrebis igni, et confringes in morem farris, et sic offeres primitias tuas Domino,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>fundens supra oleum, et thus imponens, quia oblatio Domini est :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>de qua adolebit sacerdos in memoriam muneris partem farris fracti, et olei, ac totum thus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom- whatsoever is left, shall be Aaron’s, and his sons’: holy of holies of the offerings of the Lord.\"},{\"verse\":11,\"text\":\"Every oblation that is offered to the Lord shall be made without leaven: neither shall any leaven or honey be burnt in the sacrifice to the Lord.\"},{\"verse\":12,\"text\":\"You shall offer only the firstfruits of them and gifts: but they shall not be put upon the altar, for a savour of sweetness.\"},{\"verse\":13,\"text\":\"Whatsoever sacrifice thou offerest, thou shalt season it with salt: neither shalt thou take away the salt of the covenant of thy God from thy sacrifice. In all thy oblations thou shalt offer salt.\"},{\"verse\":14,\"text\":\"But if thou offer a gift of the firstfruits of thy corn to the Lord, of the ears yet green, thou shalt dry it at the fire, and break it small like meal; and so shalt thou offer thy firstfruits to the Lord:\"},{\"verse\":15,\"text\":\"Pouring oil upon it and putting on frankincense, because it is the oblation of the Lord.\"},{\"verse\":16,\"text\":\"Whereof the priest shall burn for a memorial of the gift, part of the corn broken small and of the oil, and all the frankincense.\"}],\"vul\":[{\"verse\":1,\"text\":\"Anima cum obtulerit oblationem sacrificii Domino, simila erit ejus oblatio ; fundetque super eam oleum, et ponet thus,\"},{\"verse\":2,\"text\":\"ac deferet ad filios Aaron sacerdotes : quorum unus tollet pugillum plenum similæ et olei, ac totum thus, et ponet memoriale super altare in odorem suavissimum Domino.\"},{\"verse\":3,\"text\":\"Quod autem reliquum fuerit de sacrificio, erit Aaron et filiorum ejus, Sanctum sanctorum de oblationibus Domini.\"},{\"verse\":4,\"text\":\"Cum autem obtuleris sacrificium coctum in clibano : de simila, panes scilicet absque fermento, conspersos oleo, et lagana azyma oleo lita.\"},{\"verse\":5,\"text\":\"Si oblatio tua fuerit de sartagine, similæ conspersæ oleo et absque fermento,\"},{\"verse\":6,\"text\":\"divides eam minutatim, et fundes super eam oleum.\"},{\"verse\":7,\"text\":\"Sin autem de craticula fuerit sacrificium, æque simila oleo conspergetur :\"},{\"verse\":8,\"text\":\"quam offerens Domino, trades manibus sacerdotis.\"},{\"verse\":9,\"text\":\"Qui cum obtulerit eam, tollet memoriale de sacrificio, et adolebit super altare in odorem suavitatis Domino :\"},{\"verse\":10,\"text\":\"quidquid autem reliquum est, erit Aaron, et filiorum ejus, Sanctum sanctorum de oblationibus Domini.\"},{\"verse\":11,\"text\":\"Omnis oblatio quæ offeretur Domino, absque fermento fiet, nec quidquam fermenti ac mellis adolebitur in sacrificio Domino.\"},{\"verse\":12,\"text\":\"Primitias tantum eorum offeretis ac munera : super altare vero non imponentur in odorem suavitatis.\"},{\"verse\":13,\"text\":\"Quidquid obtuleris sacrificii, sale condies, nec auferes sal fœderis Dei tui de sacrificio tuo : in omni oblatione tua offeres sal.\"},{\"verse\":14,\"text\":\"Si autem obtuleris munus primarum frugum tuarum Domino de spicis adhuc virentibus, torrebis igni, et confringes in morem farris, et sic offeres primitias tuas Domino,\"},{\"verse\":15,\"text\":\"fundens supra oleum, et thus imponens, quia oblatio Domini est :\"},{\"verse\":16,\"text\":\"de qua adolebit sacerdos in memoriam muneris partem farris fracti, et olei, ac totum thus.\"}],\"summary\":\"Of offerings of flour, and firstfruits.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":1,\"label\":\"Leviticus 1\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":3,\"label\":\"Leviticus 3\"}}]]\n"])</script></body></html>
