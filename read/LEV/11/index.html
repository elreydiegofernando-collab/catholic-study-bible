<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Leviticus 11 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">11</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LEV/">About <!-- -->Leviticus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The distinction of clean and unclean animals.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Say to the children of Israel: These are the animals which you are to eat of all the living things of the earth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Whatsoever hath the hoof divided, and cheweth the cud among the beasts, you shall eat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But whatsoever cheweth indeed the cud, and hath a hoof, but divideth it not, as the camel, and others: that you shall not eat, but shall reckon it among the unclean.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The cherogrillus which cheweth the cud, but divideth not the hoof, is unclean.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The hare also: for that too cheweth the cud, but divideth not the hoof.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the swine, which, though it divideth the hoof, cheweth not the cud.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The flesh of these you shall not eat, nor shall you touch their carcasses, because they are unclean to you.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>These are the things that breed in the waters, and which it is lawful to eat. All that hath fins, and scales, as well in the sea, as in the rivers, and the pools, you shall eat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But whatsoever hath not fins and scales, of those things that move and live in the waters, shall be an abomination to you,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And detestable. Their flesh you shall not eat: and their carcasses you shall avoid.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All that have not fins and scales, in the waters, shall be unclean.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Of birds these are they which you must not eat, and which are to be avoided by you: The eagle, and the griffon, and the osprey.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the kite, and the vulture, according to their kind.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all that is of the raven kind, according to their likeness.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The ostrich, and the owl, and the larus, and the hawk according to its kind.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The screech owl, and the cormorant, and the ibis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the swan, and the bittern, and the porphyrion.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The heron, and the charadroin according to its kind, the houp also, and the bat.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of things that fly, whatsoever goeth upon four feet, shall be abominable to you.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But whatsoever walketh upon four feet, but hath the legs behind longer, wherewith it hoppeth upon the earth,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>That you shall eat: as the bruchus in its kind, the attacus, and ophimachus, and the locust, every one according to their kind.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But of flying things whatsoever hath four feet only, shall be an abomination to you.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And whosoever shall touch the carcasses of them, shall be defiled: and shall be unclean until the evening:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And if it be necessary that he carry any of these things when they are dead: he shall wash his clothes, and shall be unclean until the sun set.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Every beast that hath a hoof, but divideth it not, nor cheweth the cud shall be unclean: and he that toucheth it, shall be defiled.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>That which walketh upon hands of all animals which go on all four, shall be unclean: he that shall touch their carcasses shall be defiled until evening.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he that shall carry such carcasses, shall wash his clothes, and shall be unclean until evening: because all these things are unclean to you.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>These also shall be reckoned among unclean things, of all that move upon the earth. The weasel, and the mouse, and the crocodile, every one according to their kind:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The shrew, and the chameleon, and the stellio, and the lizard, and the mole.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>All these are unclean. He that toucheth their carcasses shall be unclean until the evening.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And upon what thing soever any of their carcasses shall fall, it shall be defiled, whether it be a vessel of wood, or a garment, or skins or haircloths: or any thing in which work is done. They shall be dipped in water, and shall be unclean until the evening, and so afterwards shall be clean.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But an earthen vessel, into which any of these shall fall, shall be defiled: and therefore is to be broken.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Any meat which you eat, if water from such a vessel be poured upon it, shall be unclean; and every liquor that is drunk out of any such vessel, shall be unclean.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And upon whatsoever thing any of these dead beasts shall fall, it shall be unclean. Whether it be oven, or pots with feet, they shall be destroyed, and shall be unclean.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But fountains and cisterns, and all gatherings together of waters shall be clean. He that toucheth their carcasses shall be defiled.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>If it fall upon seed corn, it shall not defile it.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But if any man pour water upon the seed, and afterwards it be touched by the carcasses, it shall be forthwith defiled.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>If any beast die, of which it is lawful for you to eat, he that toucheth the carcass thereof, shall be unclean until the evening.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And he that eateth or carrieth any thing thereof, shall wash his clothes, and shall be unclean until the evening.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>All that creepeth upon the earth shall be abominable: neither shall it be taken for meat.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Whatsoever goeth upon the breast on four feet, or hath many feet, or traileth on the earth, you shall not eat, because it is abominable.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Do not defile your souls, nor touch aught thereof, lest you be unclean,</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>For I am the Lord your God. Be holy because I am holy. Defile not your souls by any creeping thing, that moveth upon the earth.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>For I am the Lord, who brought you out of the land of Egypt, that I might be your God.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>You shall be holy, because I am holy. This is the law of beasts and fowls, and of every living creature that moveth in the waters, and creepeth on the earth:</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>That you may know the differences of the clean, and unclean, and know what you ought to eat, and what to refuse.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dicite filiis Israël : Hæc sunt animalia quæ comedere debetis de cunctis animantibus terræ :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>omne quod habet divisam ungulam, et ruminat in pecoribus, comedetis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quidquid autem ruminat quidem, et habet ungulam, sed non dividit eam, sicut camelus et cetera, non comedetis illud, et inter immunda reputabitis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Chœrogryllus qui ruminat, ungulamque non dividit, immundus est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Lepus quoque : nam et ipse ruminat, sed ungulam non dividit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et sus : qui cum ungulam dividat, non ruminat.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Horum carnibus non vescemini, nec cadavera contingetis, quia immunda sunt vobis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæc sunt quæ gignuntur in aquis, et vesci licitum est : omne quod habet pinnulas et squamas, tam in mari quam in fluminibus et stagnis, comedetis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quidquid autem pinnulas et squamas non habet, eorum quæ in aquis moventur et vivunt, abominabile vobis,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>execrandumque erit : carnes eorum non comedetis, et morticina vitabitis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cuncta quæ non habent pinnulas et squamas in aquis, polluta erunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hæc sunt quæ de avibus comedere non debetis, et vitanda sunt vobis : aquilam, et gryphem, et haliæetum,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et milvum ac vulturem juxta genus suum,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et omne corvini generis in similitudinem suam,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>struthionem, et noctuam, et larum, et accipitrem juxta genus suum :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>bubonem, et mergulum, et ibin,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et cygnum, et onocrotalum, et porphyrionem,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>herodionem, et charadrion juxta genus suum, upupam quoque, et vespertilionem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omne de volucribus quod graditur super quatuor pedes, abominabile erit vobis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quidquid autem ambulat quidem super quatuor pedes, sed habet longiora retro crura, per quæ salit super terram,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>comedere debetis, ut est bruchus in genere suo, et attacus atque ophiomachus, ac locusta, singula juxta genus suum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quidquid autem ex volucribus quatuor tantum habet pedes, execrabile erit vobis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et quicumque morticina eorum tetigerit, polluetur, et erit immundus usque ad vesperum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et si necesse fuerit ut portet quippiam horum mortuum, lavabit vestimenta sua, et immundus erit usque ad occasum solis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Omne animal quod habet quidem ungulam, sed non dividit eam, nec ruminat, immundum erit : et qui tetigerit illud, contaminabitur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quod ambulat super manus ex cunctis animantibus, quæ incedunt quadrupedia, immundum erit : qui tetigerit morticina eorum, polluetur usque ad vesperum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et qui portaverit hujuscemodi cadavera, lavabit vestimenta sua, et immundus erit usque ad vesperum : quia omnia hæc immunda sunt vobis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Hæc quoque inter polluta reputabuntur de his quæ moventur in terra, mustela et mus et crocodilus, singula juxta genus suum,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>mygale, et chamæleon, et stellio, et lacerta, et talpa.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Omnia hæc immunda sunt. Qui tetigerit morticina eorum, immundus erit usque ad vesperum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et super quod ceciderit quidquam de morticinis eorum, polluetur, tam vas ligneum et vestimentum, quam pelles et cilicia : et in quocumque fit opus, tingentur aqua, et polluta erunt usque ad vesperum, et sic postea mundabuntur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Vas autem fictile, in quod horum quidquam intro cecidit, polluetur, et idcirco frangendum est.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Omnis cibus, quem comedetis, si fusa fuerit super eum aqua, immundus erit : et omne liquens quod bibitur de universo vase, immundum erit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et quidquid de morticinis hujuscemodi ceciderit super illud, immundum erit : sive clibani, sive chytropodes, destruentur, et immundi erunt.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Fontes vero et cisternæ, et omnis aquarum congregatio munda erit. Qui morticinum eorum tetigerit, polluetur.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Si ceciderit super sementem, non polluet eam.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Si autem quispiam aqua sementem perfuderit, et postea morticinis tacta fuerit, illico polluetur.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Si mortuum fuerit animal, quod licet vobis comedere, qui cadaver ejus tetigerit, immundus erit usque ad vesperum :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et qui comederit ex eo quippiam, sive portaverit, lavabit vestimenta sua, et immundus erit usque ad vesperum.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Omne quod reptat super terram, abominabile erit, nec assumetur in cibum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Quidquid super pectus quadrupes graditur, et multos habet pedes, sive per humum trahitur, non comedetis, quia abominabile est.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Nolite contaminare animas vestras, nec tangatis quidquam eorum, ne immundi sitis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Ego enim sum Dominus Deus vester : sancti estote, quia ego sanctus sum. Ne polluatis animas vestras in omni reptili quod movetur super terram.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Ego enim sum Dominus, qui eduxi vos de terra Ægypti, ut essem vobis in Deum. Sancti eritis, quia ego sanctus sum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Ista est lex animantium ac volucrum, et omnis animæ viventis, quæ movetur in aqua, et reptat in terra,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>ut differentias noveritis mundi et immundi, et sciatis quid comedere et quid respuere debeatis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></artic cales, as well in the sea, as in the rivers, and the pools, you shall eat.\"},{\"verse\":10,\"text\":\"But whatsoever hath not fins and scales, of those things that move and live in the waters, shall be an abomination to you,\"},{\"verse\":11,\"text\":\"And detestable. Their flesh you shall not eat: and their carcasses you shall avoid.\"},{\"verse\":12,\"text\":\"All that have not fins and scales, in the waters, shall be unclean.\"},{\"verse\":13,\"text\":\"Of birds these are they which you must not eat, and which are to be avoided by you: The eagle, and the griffon, and the osprey.\"},{\"verse\":14,\"text\":\"And the kite, and the vulture, according to their kind.\"},{\"verse\":15,\"text\":\"And all that is of the raven kind, according to their likeness.\"},{\"verse\":16,\"text\":\"The ostrich, and the owl, and the larus, and the hawk according to its kind.\"},{\"verse\":17,\"text\":\"The screech owl, and the cormorant, and the ibis.\"},{\"verse\":18,\"text\":\"And the swan, and the bittern, and the porphyrion.\"},{\"verse\":19,\"text\":\"The heron, and the charadroin according to its kind, the houp also, and the bat.\"},{\"verse\":20,\"text\":\"Of things that fly, whatsoever goeth upon four feet, shall be abominable to you.\"},{\"verse\":21,\"text\":\"But whatsoever walketh upon four feet, but hath the legs behind longer, wherewith it hoppeth upon the earth,\"},{\"verse\":22,\"text\":\"That you shall eat: as the bruchus in its kind, the attacus, and ophimachus, and the locust, every one according to their kind.\"},{\"verse\":23,\"text\":\"But of flying things whatsoever hath four feet only, shall be an abomination to you.\"},{\"verse\":24,\"text\":\"And whosoever shall touch the carcasses of them, shall be defiled: and shall be unclean until the evening:\"},{\"verse\":25,\"text\":\"And if it be necessary that he carry any of these things when they are dead: he shall wash his clothes, and shall be unclean until the sun set.\"},{\"verse\":26,\"text\":\"Every beast that hath a hoof, but divideth it not, nor cheweth the cud shall be unclean: and he that toucheth it, shall be defiled.\"},{\"verse\":27,\"text\":\"That which walketh upon hands of all animals which go on all four, shall be unclean: he that shall touch their carcasses shall be defiled until evening.\"},{\"verse\":28,\"text\":\"And he that shall carry such carcasses, shall wash his clothes, and shall be unclean until evening: because all these things are unclean to you.\"},{\"verse\":29,\"text\":\"These also shall be reckoned among unclean things, of all that move upon the earth. The weasel, and the mouse, and the crocodile, every one according to their kind:\"},{\"verse\":30,\"text\":\"The shrew, and the chameleon, and the stellio, and the lizard, and the mole.\"},{\"verse\":31,\"text\":\"All these are unclean. He that toucheth their carcasses shall be unclean until the evening.\"},{\"verse\":32,\"text\":\"And upon what thing soever any of their carcasses shall fall, it shall be defiled, whether it be a vessel of wood, or a garment, or skins or haircloths: or any thing in which work is done. They shall be dipped in water, and shall be unclean until the evening, and so afterwards shall be clean.\"},{\"verse\":33,\"text\":\"But an earthen vessel, into which any of these shall fall, shall be defiled: and therefore is to be broken.\"},{\"verse\":34,\"text\":\"Any meat which you eat, if water from such a vessel be poured upon it, shall be unclean; and every liquor that is drunk out of any such vessel, shall be unclean.\"},{\"verse\":35,\"text\":\"And upon whatsoever thing any of these dead beasts shall fall, it shall be unclean. Whether it be oven, or pots with feet, they shall be destroyed, and shall be unclean.\"},{\"verse\":36,\"text\":\"But fountains and cisterns, and all gatherings together of waters shall be clean. He that toucheth their carcasses shall be defiled.\"},{\"verse\":37,\"text\":\"If it fall upon seed corn, it shall not defile it.\"},{\"verse\":38,\"text\":\"But if any man pour water upon the seed, and afterwards it be touched by the carcasses, it shall be forthwith defiled.\"},{\"verse\":39,\"text\":\"If any beast die, of which it is lawful for you to eat, he that toucheth the carcass thereof, shall be unclean until the evening.\"},{\"verse\":40,\"text\":\"And he that eateth or carrieth any thing thereof, shall wash his clothes, and shall be unclean until the evening.\"},{\"verse\":41,\"text\":\"All that creepeth upon the earth shall be abominable: neither shall it be taken for meat.\"},{\"verse\":42,\"text\":\"Whatsoever goeth upon the breast on four feet, or hath many feet, or traileth on the earth, you shall not eat, because it is abominable.\"},{\"verse\":43,\"text\":\"Do not defile your souls, nor touch aught thereof, lest you be unclean,\"},{\"verse\":44,\"text\":\"For I am the Lord your God. Be holy because I am holy. Defile not your souls by any creeping thing, that moveth upon the earth.\"},{\"verse\":45,\"text\":\"For I am the Lord, who brought you out of the land of Egypt, that I might be your God.\"},{\"verse\":46,\"text\":\"You shall be holy, because I am holy. This is the law of beasts and fowls, and of every living creature that moveth in the waters, and creepeth on the earth:\"},{\"verse\":47,\"text\":\"That you may know the differences of the clean, and unclean, and know what you ought to eat, and what to refuse.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Dicite filiis Israël : Hæc sunt animalia quæ comedere debetis de cunctis animantibus terræ :\"},{\"verse\":3,\"text\":\"omne quod habet divisam ungulam, et ruminat in pecoribus, comedetis.\"},{\"verse\":4,\"text\":\"Quidquid autem ruminat quidem, et habet ungulam, sed non dividit eam, sicut camelus et cetera, non comedetis illud, et inter immunda reputabitis.\"},{\"verse\":5,\"text\":\"Chœrogryllus qui ruminat, ungulamque non dividit, immundus est.\"},{\"verse\":6,\"text\":\"Lepus quoque : nam et ipse ruminat, sed ungulam non dividit.\"},{\"verse\":7,\"text\":\"Et sus : qui cum ungulam dividat, non ruminat.\"},{\"verse\":8,\"text\":\"Horum carnibus non vescemini, nec cadavera contingetis, quia immunda sunt vobis.\"},{\"verse\":9,\"text\":\"Hæc sunt quæ gignuntur in aquis, et vesci licitum est : omne quod habet pinnulas et squamas, tam in mari quam in fluminibus et stagnis, comedetis.\"},{\"verse\":10,\"text\":\"Quidquid autem pinnulas et squamas non habet, eorum quæ in aquis moventur et vivunt, abominabile vobis,\"},{\"verse\":11,\"text\":\"execrandumque erit : carnes eorum non comedetis, et morticina vitabitis.\"},{\"verse\":12,\"text\":\"Cuncta quæ non habent pinnulas et squamas in aquis, polluta erunt.\"},{\"verse\":13,\"text\":\"Hæc sunt quæ de avibus comedere non debetis, et vitanda sunt vobis : aquilam, et gryphem, et haliæetum,\"},{\"verse\":14,\"text\":\"et milvum ac vulturem juxta genus suum,\"},{\"verse\":15,\"text\":\"et omne corvini generis in similitudinem suam,\"},{\"verse\":16,\"text\":\"struthionem, et noctuam, et larum, et accipitrem juxta genus suum :\"},{\"verse\":17,\"text\":\"bubonem, et mergulum, et ibin,\"},{\"verse\":18,\"text\":\"et cygnum, et onocrotalum, et porphyrionem,\"},{\"verse\":19,\"text\":\"herodionem, et charadrion juxta genus suum, upupam quoque, et vespertilionem.\"},{\"verse\":20,\"text\":\"Omne de volucribus quod graditur super quatuor pedes, abominabile erit vobis.\"},{\"verse\":21,\"text\":\"Quidquid autem ambulat quidem super quatuor pedes, sed habet longiora retro crura, per quæ salit super terram,\"},{\"verse\":22,\"text\":\"comedere debetis, ut est bruchus in genere suo, et attacus atque ophiomachus, ac locusta, singula juxta genus suum.\"},{\"verse\":23,\"text\":\"Quidquid autem ex volucribus quatuor tantum habet pedes, execrabile erit vobis :\"},{\"verse\":24,\"text\":\"et quicumque morticina eorum tetigerit, polluetur, et erit immundus usque ad vesperum :\"},{\"verse\":25,\"text\":\"et si necesse fuerit ut portet quippiam horum mortuum, lavabit vestimenta sua, et immundus erit usque ad occasum solis.\"},{\"verse\":26,\"text\":\"Omne animal quod habet quidem ungulam, sed non dividit eam, nec ruminat, immundum erit : et qui tetigerit illud, contaminabitur.\"},{\"verse\":27,\"text\":\"Quod ambulat super manus ex cunctis animantibus, quæ incedunt quadrupedia, immundum erit : qui tetigerit morticina eorum, polluetur usque ad vesperum.\"},{\"verse\":28,\"text\":\"Et qui portaverit hujuscemodi cadavera, lavabit vestimenta sua, et immundus erit usque ad vesperum : quia omnia hæc immunda sunt vobis.\"},{\"verse\":29,\"text\":\"Hæc quoque inter polluta reputabuntur de his quæ moventur in terra, mustela et mus et crocodilus, singula juxta genus suum,\"},{\"verse\":30,\"text\":\"mygale, et chamæleon, et stellio, et lacerta, et talpa.\"},{\"verse\":31,\"text\":\"Omnia hæc immunda sunt. Qui tetigerit morticina eorum, immundus erit usque ad vesperum :\"},{\"verse\":32,\"text\":\"et super quod ceciderit quidquam de morticinis eorum, polluetur, tam vas ligneum et vestimentum, quam pelles et cilicia : et in quocumque fit opus, tingentur aqua, et polluta erunt usque ad vesperum, et sic postea mundabuntur.\"},{\"verse\":33,\"text\":\"Vas autem fictile, in quod horum quidquam intro cecidit, polluetur, et idcirco frangendum est.\"},{\"verse\":34,\"text\":\"Omnis cibus, quem comedetis, si fusa fuerit super eum aqua, immundus erit : et omne liquens quod bibitur de universo vase, immundum erit.\"},{\"verse\":35,\"text\":\"Et quidquid de morticinis hujuscemodi ceciderit super illud, immundum erit : sive clibani, sive chytropodes, destruentur, et immundi erunt.\"},{\"verse\":36,\"text\":\"Fontes vero et cisternæ, et omnis aquarum congregatio munda erit. Qui morticinum eorum tetigerit, polluetur.\"},{\"verse\":37,\"text\":\"Si ceciderit super sementem, non polluet eam.\"},{\"verse\":38,\"text\":\"Si autem quispiam aqua sementem perfuderit, et postea morticinis tacta fuerit, illico polluetur.\"},{\"verse\":39,\"text\":\"Si mortuum fuerit animal, quod licet vobis comedere, qui cadaver ejus tetigerit, immundus erit usque ad vesperum :\"},{\"verse\":40,\"text\":\"et qui comederit ex eo quippiam, sive portaverit, lavabit vestimenta sua, et immundus erit usque ad vesperum.\"},{\"verse\":41,\"text\":\"Omne quod reptat super terram, abominabile erit, nec assumetur in cibum.\"},{\"verse\":42,\"text\":\"Quidquid super pectus quadrupes graditur, et multos habet pedes, sive per humum trahitur, non comedetis, quia abominabile est.\"},{\"verse\":43,\"text\":\"Nolite contaminare animas vestras, nec tangatis quidquam eorum, ne immundi sitis.\"},{\"verse\":44,\"text\":\"Ego enim sum Dominus Deus vester : sancti estote, quia ego sanctus sum. Ne polluatis animas vestras in omni reptili quod movetur super terram.\"},{\"verse\":45,\"text\":\"Ego enim sum Dominus, qui eduxi vos de terra Ægypti, ut essem vobis in Deum. Sancti eritis, quia ego sanctus sum.\"},{\"verse\":46,\"text\":\"Ista est lex animantium ac volucrum, et omnis animæ viventis, quæ movetur in aqua, et reptat in terra,\"},{\"verse\":47,\"text\":\"ut differentias noveritis mundi et immundi, et sciatis quid comedere et quid respuere debeatis.\"}],\"summary\":\"The distinction of clean and unclean animals.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":10,\"label\":\"Leviticus 10\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":12,\"label\":\"Leviticus 12\"}}]]\n"])</script></body></html>
