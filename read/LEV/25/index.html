<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Leviticus 25 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">25</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The law of the seventh and of the fiftieth year of jubilee.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses in mount Sinai, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, observe the rest of the sabbath of the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Six years thou shalt sow thy field and six years thou shalt prune thy vineyard, and shalt gather the fruits thereof.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But in the seventh year there shall be a sabbath to the land, of the resting of the Lord. Thou shalt not sow thy field, nor prune thy vineyard.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>What the ground shall bring forth of itself, thou shalt not reap: neither shalt thou gather the grapes or the firstfruits as a vintage. For it is a year of rest to the land.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But they shall be unto you for meat, to thee and to thy manservant, to thy maidservant and thy hireling, and to the strangers that sojourn with thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>All things that grow shall be meat to thy beasts and to thy cattle.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thou shalt also number to thee seven weeks of years: that is to say, seven times seven, which together make forty-nine years.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And thou shalt sound the trumpet in the seventh month, the tenth day of the month, in the time of the expiation in all your land.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And thou shalt sanctify the fiftieth year, and shalt proclaim remission to all the inhabitants of thy land: for it is the year of jubilee. Every man shall return to his possession, and every one shall go back to his former family:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Because it is the jubilee and the fiftieth year. You shall not sow, nor reap the things that grow in the field of their own accord, neither shall you gather the firstfruits of the vines,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Because of the sanctification of the jubilee. But as they grow you shall presently eat them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In the year of the jubilee all shall return to their possessions.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>When thou shalt sell any thing to thy neighbour, or shalt buy of him: grieve not thy brother. But thou shalt buy of him according to the number of years from the jubilee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he shall sell to thee according to the computation of the fruits.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The more years remain after the jubilee, the more shall the price increase: and the less time is counted, so much the less shall the purchase cost. For he shall sell to thee the time of the fruits.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Do not afflict your countrymen: but let every one fear his God. Because I am the Lord your God.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Do my precepts, and keep my judgments, and fulfil them: that you may dwell in the land without any fear.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the ground may yield you its fruits, of which you may eat your fill, fearing no man’s invasion.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But if you say: What shall we eat the seventh year, if we sow not, nor gather our fruits?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>I will give you my blessing the sixth year: and it shall yield the fruits of three years.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the eighth year you shall sow, and shall eat of the old fruits, until the ninth year: till new grow up, you shall eat the old store.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The land also shall not be sold for ever: because it is mine, and you are strangers and sojourners with me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For which cause all the country of your possession shall be under the condition of redemption.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>If thy brother being impoverished sell his little possession, and his kinsman will: he may redeem what he had sold.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But if he have no kinsman, and he himself can find the price to redeem it:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The value of the fruits shall be counted from that time when he sold it. And the overplus he shall restore to the buyer, and so shall receive his possession again.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But if his hands find not the means to repay the price, the buyer shall have what he bought, until the year of the jubilee. For in that year all that is sold shall return to the owner, and to the ancient possessor.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He that selleth a house within the walls of a city, shall have the liberty to redeem it, until one year be expired.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>If he redeem it not, and the whole year be fully out, the buyer shall possess it, and his posterity for ever, and it cannot be redeemed, not even in the jubilee.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But if the house be in a village, that hath no walls, it shall be sold according to the same law as the fields. If it be not redeemed before, in the jubilee it shall return to the owner.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The houses of Levites, which are in cities, may always be redeemed.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>If they be not redeemed, in the jubilee they shall all return to the owners: because the houses of the cities of the Levites are for their possessions among the children of Israel.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But let not their suburbs be sold, because it is a perpetual possession.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If thy brother be impoverished, and weak of hand, and thou receive him as a stranger and sojourner, and he live with thee:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Take not usury of him nor more than thou gavest. Fear thy God, that thy brother may live with thee.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Thou shalt not give him thy money upon usury: nor exact of him any increase of fruits.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>I am the Lord your God, who brought you out of the land of Egypt, that I might give you the land of Chanaan, and might be your God.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>If thy brother constrained by poverty, sell himself to thee: thou shalt not oppress him with the service of bondservants.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But he shall be as a hireling, and a sojourner: he shall work with thee until the year of the jubilee.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And afterwards he shall go out with his children: and shall return to his kindred and to the possession of his fathers.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>For they are my servants, and I brought them out of the land of Egypt: let them not be sold as bondmen.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Afflict him not by might: but fear thy God.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Let your bondmen, and your bondwomen, be of the nations that are round about you:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And of the strangers that sojourn among you, or that were born of them in your land. These you shall have for servants:</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And by right of inheritance shall leave them to your posterity, and shall possess them for ever. But oppress not your brethren the children of Israel by might.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>If the hand of a stranger or a sojourner grow strong among you, and thy brother being impoverished sell himself to him, or to any of his race:</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>After the sale he may be redeemed. He that will of his brethren shall redeem him:</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Either his uncle, or his uncle’s son, or his kinsman, by blood, or by affinity. But if he himself be able also, he shall redeem himself:</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Counting only the years from the time of his selling unto the year of the jubilee: and counting the money that he was sold for, according to the number of the years and the reckoning of a hired servant.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>If there be many years that remain until the jubilee, according to them shall he also repay the price.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>If few, he shall make the reckoning with him according to the number of the years: and shall repay to the buyer of what remaineth of the years.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>His wages being allowed for which he served before: he shall not afflict him violently in thy sight.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And if by these means he cannot be redeemed, in the year of the jubilee he shall go out with his children.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>For the children of Israel are my servants, whom I brought forth out of the land of Egypt.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen in monte Sinai, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere filiis Israël, et dices ad eos : Quando ingressi fueritis terram quam ego dabo vobis, sabbatizes sabbatum Domino.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sex annis seres agrum tuum, et sex annis putabis vineam tuam, colligesque fructus ejus :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>septimo autem anno sabbatum erit terræ, requietionis Domini : agrum non seres, et vineam non putabis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quæ sponte gignet humus, non metes : et uvas primitiarum tuarum non colliges quasi vindemiam : annus enim requietionis terræ est :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>sed erunt vobis in cibum, tibi et servo tuo, ancillæ et mercenario tuo, et advenæ qui peregrinantur apud te :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>jumentis tuis et pecoribus, omnia quæ nascuntur præbebunt cibum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Numerabis quoque tibi septem hebdomadas annorum, id est, septies septem, quæ simul faciunt annos quadraginta novem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et clanges buccina mense septimo, decima die mensis, propitiationis tempore, in universa terra vestra.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sanctificabisque annum quinquagesimum, et vocabis remissionem cunctis habitatoribus terræ tuæ : ipse est enim jubilæus. Revertetur homo ad possessionem suam, et unusquisque rediet ad familiam pristinam :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>quia jubilæus est, et quinquagesimus annus. Non seretis neque metetis sponte in agro nascentia, et primitias vindemiæ non colligetis,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ob sanctificationem jubilæi : sed statim oblata comedetis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Anno jubilæi, redient omnes ad possessiones suas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quando vendes quippiam civi tuo, vel emes ab eo, ne contristes fratrem tuum, sed juxta numerum annorum jubilæi emes ab eo,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et juxta supputationem frugum vendet tibi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quanto plures anni remanserint post jubilæum, tanto crescet et pretium : et quanto minus temporis numeraveris, tanto minoris et emptio constabit : tempus enim frugum vendet tibi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nolite affligere contribules vestros, sed timeat unusquisque Deum suum, quia ego Dominus Deus vester.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Facite præcepta mea, et judicia custodite, et implete ea : ut habitare possitis in terra absque ullo pavore,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et gignat vobis humus fructus suos, quibus vescamini usque ad saturitatem, nullius impetum formidantes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quod si dixeritis : Quid comedemus anno septimo, si non severimus, neque collegerimus fruges nostras ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>dabo benedictionem meam vobis anno sexto, et faciet fructus trium annorum :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>seretisque anno octavo, et comedetis veteres fruges usque ad nonum annum : donec nova nascantur, edetis vetera.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Terra quoque non vendetur in perpetuum, quia mea est, et vos advenæ et coloni mei estis :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>unde cuncta regio possessionis vestræ sub redemptionis conditione vendetur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Si attenuatus frater tuus vendiderit possessiunculam suam, et voluerit propinquus ejus, potest redimere quod ille vendiderat.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sin autem non habuerit proximum, et ipse pretium ad redimendum potuerit invenire,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>computabuntur fructus ex eo tempore quo vendidit : et quod reliquum est, reddet emptori, sicque recipiet possessionem suam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Quod si non invenerit manus ejus ut reddat pretium, habebit emptor quod emerat, usque ad annum jubilæum. In ipso enim omnis venditio redibit ad dominum et ad possessorem pristinum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Qui vendiderit domum intra urbis muros, habebit licentiam redimendi, donec unus impleatur annus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Si non redemerit, et anni circulus fuerit evolutus, emptor possidebit eam, et posteri ejus in perpetuum, et redimi non poterit, etiam in jubilæo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sin autem in villa domus, quæ muros non habet, agrorum jure vendetur : si ante redempta non fuerit, in jubilæo revertetur ad dominum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ædes Levitarum quæ in urbibus sunt, semper possunt redimi :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>si redemptæ non fuerint, in jubilæo revertentur ad dominos, quia domus urbium Levitarum pro possessionibus sunt inter filios Israël.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Suburbana autem eorum non veneant, quia possessio sempiterna est.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Si attenuatus fuerit frater tuus, et infirmus manu, et susceperis eum quasi advenam et peregrinum, et vixerit tecum,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>ne accipias usuras ab eo, nec amplius quam dedisti : time Deum tuum, ut vivere possit frater tuus apud te.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Pecuniam tuam non dabis ei ad usuram, et frugum superabundantiam non exiges.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ego Dominus Deus vester, qui eduxi vos de terra Ægypti, ut darem vobis terram Chanaan, et essem vester Deus.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Si paupertate compulsus vendiderit se tibi frater tuus, non eum opprimes servitute famulorum,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>sed quasi mercenarius et colonus erit : usque ad annum jubilæum operabitur apud te,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>et postea egredietur cum liberis suis, et revertetur ad cognationem, ad possessionem patrum suorum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Mei enim servi sunt, et ego eduxi eos de terra Ægypti : non veneant conditione servorum :</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>ne affligas eum per potentiam, sed metuito Deum tuum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Servus et ancilla sint vobis de nationibus quæ in circuitu vestro sunt :</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>et de advenis qui peregrinantur apud vos, vel qui ex his nati fuerint in terra vestra, hos habebitis famulos :</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>et hæreditario jure transmittetis ad posteros, ac possidebitis in æternum : fratres autem vestros filios Israël ne opprimatis per potentiam.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Si invaluerit apud vos manus advenæ atque peregrini, et attenuatus frater tuus vendiderit se ei, aut cuiquam de stirpe ejus :</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>post venditionem potest redimi. Qui voluerit ex fratribus suis, redimet eum,</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>et patruus, et patruelis, et consanguineus, et affinis. Sin autem et ipse potuerit, redimet se,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>supputatis dumtaxat annis a tempore venditionis suæ usque ad annum jubilæum : et pecunia, qua venditus fuerat, juxta annorum numerum, et rationem mercenarii supputata.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Si plures fuerint anni qui remanent usque ad jubilæum, secundum hos reddet et pretium :</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>si pauci, ponet rationem cum eo juxta annorum numerum, et reddet emptori quod reliquum est annorum,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>quibus ante servivit mercedibus imputatis : non affliget eum violenter in conspectu tuo.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Quod si per hæc redimi non potuerit, anno jubilæo egredietur cum liberis suis.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Mei enim sunt servi filii Israël, quos eduxi de terra Ægypti.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/24/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 24</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/26/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 26</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->25<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-pape age/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LEV.25\",{\"bookId\":3,\"usfm\":\"LEV\",\"bookName\":\"Leviticus\",\"drName\":\"Leviticus\",\"chapter\":25,\"totalChapters\":27,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses in mount Sinai, saying:\"},{\"verse\":2,\"text\":\"Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, observe the rest of the sabbath of the Lord.\"},{\"verse\":3,\"text\":\"Six years thou shalt sow thy field and six years thou shalt prune thy vineyard, and shalt gather the fruits thereof.\"},{\"verse\":4,\"text\":\"But in the seventh year there shall be a sabbath to the land, of the resting of the Lord. Thou shalt not sow thy field, nor prune thy vineyard.\"},{\"verse\":5,\"text\":\"What the ground shall bring forth of itself, thou shalt not reap: neither shalt thou gather the grapes or the firstfruits as a vintage. For it is a year of rest to the land.\"},{\"verse\":6,\"text\":\"But they shall be unto you for meat, to thee and to thy manservant, to thy maidservant and thy hireling, and to the strangers that sojourn with thee.\"},{\"verse\":7,\"text\":\"All things that grow shall be meat to thy beasts and to thy cattle.\"},{\"verse\":8,\"text\":\"Thou shalt also number to thee seven weeks of years: that is to say, seven times seven, which together make forty-nine years.\"},{\"verse\":9,\"text\":\"And thou shalt sound the trumpet in the seventh month, the tenth day of the month, in the time of the expiation in all your land.\"},{\"verse\":10,\"text\":\"And thou shalt sanctify the fiftieth year, and shalt proclaim remission to all the inhabitants of thy land: for it is the year of jubilee. Every man shall return to his possession, and every one shall go back to his former family:\"},{\"verse\":11,\"text\":\"Because it is the jubilee and the fiftieth year. You shall not sow, nor reap the things that grow in the field of their own accord, neither shall you gather the firstfruits of the vines,\"},{\"verse\":12,\"text\":\"Because of the sanctification of the jubilee. But as they grow you shall presently eat them.\"},{\"verse\":13,\"text\":\"In the year of the jubilee all shall return to their possessions.\"},{\"verse\":14,\"text\":\"When thou shalt sell any thing to thy neighbour, or shalt buy of him: grieve not thy brother. But thou shalt buy of him according to the number of years from the jubilee.\"},{\"verse\":15,\"text\":\"And he shall sell to thee according to the computation of the fruits.\"},{\"verse\":16,\"text\":\"The more years remain after the jubilee, the more shall the price increase: and the less time is counted, so much the less shall the purchase cost. For he shall sell to thee the time of the fruits.\"},{\"verse\":17,\"text\":\"Do not afflict your countrymen: but let every one fear his God. Because I am the Lord your God.\"},{\"verse\":18,\"text\":\"Do my precepts, and keep my judgments, and fulfil them: that you may dwell in the land without any fear.\"},{\"verse\":19,\"text\":\"And the ground may yield you its fruits, of which you may eat your fill, fearing no man’s invasion.\"},{\"verse\":20,\"text\":\"But if you say: What shall we eat the seventh year, if we sow not, nor gather our fruits?\"},{\"verse\":21,\"text\":\"I will give you my blessing the sixth year: and it shall yield the fruits of three years.\"},{\"verse\":22,\"text\":\"And the eighth year you shall sow, and shall eat of the old fruits, until the ninth year: till new grow up, you shall eat the old store.\"},{\"verse\":23,\"text\":\"The land also shall not be sold for ever: because it is mine, and you are strangers and sojourners with me.\"},{\"verse\":24,\"text\":\"For which cause all the country of your possession shall be under the condition of redemption.\"},{\"verse\":25,\"text\":\"If thy brother being impoverished sell his little possession, and his kinsman will: he may redeem what he had sold.\"},{\"verse\":26,\"text\":\"But if he have no kinsman, and he himself can find the price to redeem it:\"},{\"verse\":27,\"text\":\"The value of the fruits shall be counted from that time when he sold it. And the overplus he shall restore to the buyer, and so shall receive his possession again.\"},{\"verse\":28,\"text\":\"But if his hands find not the means to repay the price, the buyer shall have what he bought, until the year of the jubilee. For in that year all that is sold shall return to the owner, and to the ancient possessor.\"},{\"verse\":29,\"text\":\"He that selleth a house within the walls of a city, shall have the liberty to redeem it, until one year be expired.\"},{\"verse\":30,\"text\":\"If he redeem it not, and the whole year be fully out, the buyer shall possess it, and his posterity for ever, and it cannot be redeemed, not even in the jubilee.\"},{\"verse\":31,\"text\":\"But if the house be in a village, that hath no walls, it shall be sold according to the same law as the fields. If it be not redeemed before, in the jubilee it shall return to the owner.\"},{\"verse\":32,\"text\":\"The houses of Levites, which are in cities, may always be redeemed.\"},{\"verse\":33,\"text\":\"If they be not redeemed, in the jubilee they shall all return to the owners: because the houses of the cities of the Levites are for their possessions among the children of Israel.\"},{\"verse\":34,\"text\":\"But let not their suburbs be sold, because it is a perpetual possession.\"},{\"verse\":35,\"text\":\"If thy brother be impoverished, and weak of hand, and thou receive him as a stranger and sojourner, and he live with thee:\"},{\"verse\":36,\"text\":\"Take not usury of him nor more than thou gavest. Fear thy God, that thy brother may live with thee.\"},{\"verse\":37,\"text\":\"Thou shalt not give him thy money upon usury: nor exact of him any increase of fruits.\"},{\"verse\":38,\"text\":\"I am the Lord your God, who brought you out of the land of Egypt, that I might give you the land of Chanaan, and might be your God.\"},{\"verse\":39,\"text\":\"If thy brother constrained by poverty, sell himself to thee: thou shalt not oppress him with the service of bondservants.\"},{\"verse\":40,\"text\":\"But he shall be as a hireling, and a sojourner: he shall work with thee until the year of the jubilee.\"},{\"verse\":41,\"text\":\"And afterwards he shall go out with his children: and shall return to his kindred and to the possession of his fathers.\"},{\"verse\":42,\"text\":\"For they are my servants, and I brought them out of the land of Egypt: let them not be sold as bondmen.\"},{\"verse\":43,\"text\":\"Afflict him not by might: but fear thy God.\"},{\"verse\":44,\"text\":\"Let your bondmen, and your bondwomen, be of the nations that are round about you:\"},{\"verse\":45,\"text\":\"And of the strangers that sojourn among you, or that were born of them in your land. These you shall have for servants:\"},{\"verse\":46,\"text\":\"And by right of inheritance shall leave them to your posterity, and shall possess them for ever. But oppress not your brethren the children of Israel by might.\"},{\"verse\":47,\"text\":\"If the hand of a stranger or a sojourner grow strong among you, and thy brother being impoverished sell himself to him, or to any of his race:\"},{\"verse\":48,\"text\":\"After the sale he may be redeemed. He that will of his brethren shall redeem him:\"},{\"verse\":49,\"text\":\"Either his uncle, or his uncle’s son, or his kinsman, by blood, or by affinity. But if he himself be able also, he shall redeem himself:\"},{\"verse\":50,\"text\":\"Counting only the years from the time of his selling unto the year of the jubilee: and counting the money that he was sold for, according to the number of the years and the reckoning of a hired servant.\"},{\"verse\":51,\"text\":\"If there be many years that remain until the jubilee, according to them shall he also repay the price.\"},{\"verse\":52,\"text\":\"If few, he shall make the reckoning with him according to the number of the years: and shall repay to the buyer of what remaineth of the years.\"},{\"verse\":53,\"text\":\"His wages being allowed for which he served before: he shall not afflict him violently in thy sight.\"},{\"verse\":54,\"text\":\"And if by these means he cannot be redeemed, in the year of the jubilee he shall go out with his children.\"},{\"verse\":55,\"text\":\"For the children of Israel are my servants, whom I brought forth out of the land of Egypt.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen in monte Sinai, dicens :\"},{\"verse\":2,\"text\":\"Loquere filiis Israël, et dices ad eos : Quando ingressi fueritis terram quam ego dabo vobis, sabbatizes sabbatum Domino.\"},{\"verse\":3,\"text\":\"Sex annis seres agrum tuum, et sex annis putabis vineam tuam, colligesque fructus ejus :\"},{\"verse\":4,\"text\":\"septimo autem anno sabbatum erit terræ, requietionis Domini : agrum non seres, et vineam non putabis.\"},{\"verse\":5,\"text\":\"Quæ sponte gignet humus, non metes : et uvas primitiarum tuarum non colliges quasi vindemiam : annus enim requietionis terræ est :\"},{\"verse\":6,\"text\":\"sed erunt vobis in cibum, tibi et servo tuo, ancillæ et mercenario tuo, et advenæ qui peregrinantur apud te :\"},{\"verse\":7,\"text\":\"jumentis tuis et pecoribus, omnia quæ nascuntur præbebunt cibum.\"},{\"verse\":8,\"text\":\"Numerabis quoque tibi septem hebdomadas annorum, id est, septies septem, quæ simul faciunt annos quadraginta novem :\"},{\"verse\":9,\"text\":\"et clanges buccina mense septimo, decima die mensis, propitiationis tempore, in universa terra vestra.\"},{\"verse\":10,\"text\":\"Sanctificabisque annum quinquagesimum, et vocabis remissionem cunctis habitatoribus terræ tuæ : ipse est enim jubilæus. Revertetur homo ad possessionem suam, et unusquisque rediet ad familiam pristinam :\"},{\"verse\":11,\"text\":\"quia jubilæus est, et quinquagesimus annus. Non seretis neque metetis sponte in agro nascentia, et primitias vindemiæ non colligetis,\"},{\"verse\":12,\"text\":\"ob sanctificationem jubilæi : sed statim oblata comedetis.\"},{\"verse\":13,\"text\":\"Anno jubilæi, redient omnes ad possessiones suas.\"},{\"verse\":14,\"text\":\"Quando vendes quippiam civi tuo, vel emes ab eo, ne contristes fratrem tuum, sed juxta numerum annorum jubilæi emes ab eo,\"},{\"verse\":15,\"text\":\"et juxta supputationem frugum vendet tibi.\"},{\"verse\":16,\"text\":\"Quanto plures anni remanserint post jubilæum, tanto crescet et pretium : et quanto minus temporis numeraveris, tanto minoris et emptio constabit : tempus enim frugum vendet tibi.\"},{\"verse\":17,\"text\":\"Nolite affligere contribules vestros, sed timeat unusquisque Deum suum, quia ego Dominus Deus vester.\"},{\"verse\":18,\"text\":\"Facite præcepta mea, et judicia custodite, et implete ea : ut habitare possitis in terra absque ullo pavore,\"},{\"verse\":19,\"text\":\"et gignat vobis humus fructus suos, quibus vescamini usque ad saturitatem, nullius impetum formidantes.\"},{\"verse\":20,\"text\":\"Quod si dixeritis : Quid comedemus anno septimo, si non severimus, neque collegerimus fruges nostras ?\"},{\"verse\":21,\"text\":\"dabo benedictionem meam vobis anno sexto, et faciet fructus trium annorum :\"},{\"verse\":22,\"text\":\"seretisque anno octavo, et comedetis veteres fruges usque ad nonum annum : donec nova nascantur, edetis vetera.\"},{\"verse\":23,\"text\":\"Terra quoque non vendetur in perpetuum, quia mea est, et vos advenæ et coloni mei estis :\"},{\"verse\":24,\"text\":\"unde cuncta regio possessionis vestræ sub redemptionis conditione vendetur.\"},{\"verse\":25,\"text\":\"Si attenuatus frater tuus vendiderit possessiunculam suam, et voluerit propinquus ejus, potest redimere quod ille vendiderat.\"},{\"verse\":26,\"text\":\"Sin autem non habuerit proximum, et ipse pretium ad redimendum potuerit invenire,\"},{\"verse\":27,\"text\":\"computabuntur fructus ex eo tempore quo vendidit : et quod reliquum est, reddet emptori, sicque recipiet possessionem suam.\"},{\"verse\":28,\"text\":\"Quod si non invenerit manus ejus ut reddat pretium, habebit emptor quod emerat, usque ad annum jubilæum. In ipso enim omnis venditio redibit ad dominum et ad possessorem pristinum.\"},{\"verse\":29,\"text\":\"Qui vendiderit domum intra urbis muros, habebit licentiam redimendi, donec unus impleatur annus.\"},{\"verse\":30,\"text\":\"Si non redemerit, et anni circulus fuerit evolutus, emptor possidebit eam, et posteri ejus in perpetuum, et redimi non poterit, etiam in jubilæo.\"},{\"verse\":31,\"text\":\"Sin autem in villa domus, quæ muros non habet, agrorum jure vendetur : si ante redempta non fuerit, in jubilæo revertetur ad dominum.\"},{\"verse\":32,\"text\":\"Ædes Levitarum quæ in urbibus sunt, semper possunt redimi :\"},{\"verse\":33,\"text\":\"si redemptæ non fuerint, in jubilæo revertentur ad dominos, quia domus urbium Levitarum pro possessionibus sunt inter filios Israël.\"},{\"verse\":34,\"text\":\"Suburbana autem eorum non veneant, quia possessio sempiterna est.\"},{\"verse\":35,\"text\":\"Si attenuatus fuerit frater tuus, et infirmus manu, et susceperis eum quasi advenam et peregrinum, et vixerit tecum,\"},{\"verse\":36,\"text\":\"ne accipias usuras ab eo, nec amplius quam dedisti : time Deum tuum, ut vivere possit frater tuus apud te.\"},{\"verse\":37,\"text\":\"Pecuniam tuam non dabis ei ad usuram, et frugum superabundantiam non exiges.\"},{\"verse\":38,\"text\":\"Ego Dominus Deus vester, qui eduxi vos de terra Ægypti, ut darem vobis terram Chanaan, et essem vester Deus.\"},{\"verse\":39,\"text\":\"Si paupertate compulsus vendiderit se tibi frater tuus, non eum opprimes servitute famulorum,\"},{\"verse\":40,\"text\":\"sed quasi mercenarius et colonus erit : usque ad annum jubilæum operabitur apud te,\"},{\"verse\":41,\"text\":\"et postea egredietur cum liberis suis, et revertetur ad cognationem, ad possessionem patrum suorum.\"},{\"verse\":42,\"text\":\"Mei enim servi sunt, et ego eduxi eos de terra Ægypti : non veneant conditione servorum :\"},{\"verse\":43,\"text\":\"ne affligas eum per potentiam, sed metuito Deum tuum.\"},{\"verse\":44,\"text\":\"Servus et ancilla sint vobis de nationibus quæ in circuitu vestro sunt :\"},{\"verse\":45,\"text\":\"et de advenis qui peregrinantur apud vos, vel qui ex his nati fuerint in terra vestra, hos habebitis famulos :\"},{\"verse\":46,\"text\":\"et hæreditario jure transmittetis ad posteros, ac possidebitis in æternum : fratres autem vestros filios Israël ne opprimatis per potentiam.\"},{\"verse\":47,\"text\":\"Si invaluerit apud vos manus advenæ atque peregrini, et attenuatus frater tuus vendiderit se ei, aut cuiquam de stirpe ejus :\"},{\"verse\":48,\"text\":\"post venditionem potest redimi. Qui voluerit ex fratribus suis, redimet eum,\"},{\"verse\":49,\"text\":\"et patruus, et patruelis, et consanguineus, et affinis. Sin autem et ipse potuerit, redimet se,\"},{\"verse\":50,\"text\":\"supputatis dumtaxat annis a tempore venditionis suæ usque ad annum jubilæum : et pecunia, qua venditus fuerat, juxta annorum numerum, et rationem mercenarii supputata.\"},{\"verse\":51,\"text\":\"Si plures fuerint anni qui remanent usque ad jubilæum, secundum hos reddet et pretium :\"},{\"verse\":52,\"text\":\"si pauci, ponet rationem cum eo juxta annorum numerum, et reddet emptori quod reliquum est annorum,\"},{\"verse\":53,\"text\":\"quibus ante servivit mercedibus imputatis : non affliget eum violenter in conspectu tuo.\"},{\"verse\":54,\"text\":\"Quod si per hæc redimi non potuerit, anno jubilæo egredietur cum liberis suis.\"},{\"verse\":55,\"text\":\"Mei enim sunt servi filii Israël, quos eduxi de terra Ægypti.\"}],\"summary\":\"The law of the seventh and of the fiftieth year of jubilee.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":24,\"label\":\"Leviticus 24\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":26,\"label\":\"Leviticus 26\"}}]]\n"])</script></body></html>
