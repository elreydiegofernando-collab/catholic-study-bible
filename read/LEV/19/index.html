="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">19</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Divers ordinances, partly moral, partly ceremonial or judicial.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to all the congregation of the children of Israel. And thou shalt say to them: Be ye holy, because I the Lord your God am holy.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let every one fear his father, and his mother. Keep my sabbaths. I am the Lord your God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Turn ye not to idols: nor make to yourselves molten gods. I am the Lord your God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If ye offer in sacrifice a peace offering to the Lord, that he may be favourable:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>You shall eat it on the same day it was offered, and the next day. And whatsoever shall be left until the third day, you shall burn with fire.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If after two days any man eat thereof, he shall be profane and guilty of impiety:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And shall bear his iniquity, because he hath defiled the holy thing of the Lord. And that soul shall perish from among his people.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>When thou reapest the corn of thy land, thou shalt not cut down all that is on the face of the earth to the very ground: nor shalt thou gather the ears that remain.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Neither shalt thou gather the bunches and grapes that fall down in thy vineyard: but shalt leave them to the poor and the strangers to take. I am the Lord your God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>You shall not steal. You shall not lie: neither shall any man deceive his neighbour.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou shalt not swear falsely by my name, nor profane the name of thy God. I am the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt not calumniate thy neighbour, nor oppress him by violence. The wages of him that hath been hired by thee shall not abide with thee until the morning.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt not speak evil of the deaf, nor put a stumbling block before the blind: but thou shalt fear the Lord thy God, because I am the Lord.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou shalt not do that which is unjust, nor judge unjustly. Respect not the person of the poor: nor honour the countenance of the mighty. But judge thy neighbour according to justice.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou shalt not be a detractor nor a whisperer among the people. Thou shalt not stand against the blood of thy neighbour. I am the Lord.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou shalt not hate thy brother in thy heart: But reprove him openly, lest thou incur sin through him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Seek not revenge, nor be mindful of the injury of thy citizens. Thou shalt love thy friend as thyself. I am the Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Keep ye my laws. Thou shalt not make thy cattle to gender with beasts of any other kind. Thou shalt not sow thy field with different seeds. Thou shalt not wear a garment that is woven of two sorts.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If a man carnally lie with a woman that is a bondservant and marriageable, and yet not redeemed with a price, nor made free: they both shall be scourged: and they shall not be put to death, because she was not a free woman.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And for his trespass he shall offer a ram to the Lord, at the door of the tabernacle of the testimony.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the priest shall pray for him: and for his sin before the Lord: and he shall have mercy on him, and the sin shall be forgiven.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>When you shall be come into the land, and shall have planted in it fruit trees, you shall take away the firstfruits of them. The fruit that comes forth shall be unclean to you: neither shall you eat of them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But in the fourth year, all their fruit shall be sanctified, to the praise of the Lord.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And in the fifth year you shall eat the fruits thereof, gathering the increase thereof. I am the Lord your God.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>You shall not eat with blood. You shall not divine nor observe dreams.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nor shall you cut your hair roundwise: nor shave your beard.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>You shall not make any cuttings in your flesh, for the dead: neither shall you make in yourselves any figures or marks. I am the Lord.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Make not thy daughter a common strumpet, lest the land be defiled, and filled with wickedness.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Keep ye my sabbaths, and reverence my sanctuary. I am the Lord.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Go not aside after wizards: neither ask any thing of soothsayers, to be defiled by them. I am the Lord your God.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Rise up before the hoary head, and honour the person of the aged man: and fear the Lord thy God. I am the Lord.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>If a stranger dwell in your land, and abide among you, do not upbraid him:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But let him be among you as one of the same country. And you shall love him as yourselves: for you were strangers in the land of Egypt. I am the Lord your God.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Do not any unjust thing in judgment, in rule, in weight, or in measure.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Let the balance be just and the weights equal, the bushel just, and the sextary equal. I am the Lord your God, that brought you out of the land of Egypt.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Keep all my precepts, and all my judgments: and do them. I am the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutus est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere ad omnem cœtum filiorum Israël, et dices ad eos : Sancti estote, quia ego sanctus sum, Dominus Deus vester.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Unusquisque patrem suum, et matrem suam timeat. Sabbata mea custodite. Ego Dominus Deus vester.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nolite converti ad idola, nec deos conflatiles faciatis vobis. Ego Dominus Deus vester.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si immolaveritis hostiam pacificorum Domino, ut sit placabilis,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>eo die quo fuerit immolata, comedetis eam, et die altero : quidquid autem residuum fuerit in diem tertium, igne comburetis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si quis post biduum comederit ex ea, profanus erit, et impietatis reus :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>portabitque iniquitatem suam, quia sanctum Domini polluit, et peribit anima illa de populo suo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cumque messueris segetes terræ tuæ, non tondebis usque ad solum superficiem terræ, nec remanentes spicas colliges,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>neque in vinea tua racemos et grana decidentia congregabis : sed pauperibus et peregrinis carpenda dimittes. Ego Dominus Deus vester.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non facietis furtum. Non mentiemini, nec decipiet unusquisque proximum suum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non perjurabis in nomine meo, nec pollues nomen Dei tui. Ego Dominus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non facies calumniam proximo tuo nec vi opprimes eum. Non morabitur opus mercenarii tui apud te usque mane.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non maledices surdo, nec coram cæco pones offendiculum : sed timebis Dominum Deum tuum, quia ego sum Dominus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non facies quod iniquum est, nec injuste judicabis. Non consideres personam pauperis, nec honores vultum potentis. Juste judica proximo tuo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non eris criminator, nec susurro in populo. Non stabis contra sanguinem proximi tui. Ego Dominus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non oderis fratrem tuum in corde tuo, sed publice argue eum, ne habeas super illo peccatum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non quæras ultionem, nec memor eris injuriæ civium tuorum. Diliges amicum tuum sicut teipsum. Ego Dominus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Leges meas custodite. Jumentum tuum non facies coire cum alterius generis animantibus. Agrum tuum non seres diverso semine. Veste, quæ ex duobus texta est, non indueris.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Homo, si dormierit cum muliere coitu seminis, quæ sit ancilla etiam nubilis, et tamen pretio non redempta, nec libertate donata : vapulabunt ambo, et non morientur, quia non fuit libera.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Pro delicto autem suo offeret Domino ad ostium tabernaculi testimonii arietem :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>orabitque pro eo sacerdos, et pro peccato ejus coram Domino, et repropitiabitur ei, dimitteturque peccatum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quando ingressi fueritis terram, et plantaveritis in ea ligna pomifera, auferetis præputia eorum : poma, quæ germinant, immunda erunt vobis, nec edetis ex eis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quarto autem anno omnis fructus eorum sanctificabitur, laudabilis Domino.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quinto autem anno comedetis fructus, congregantes poma, quæ proferunt. Ego Dominus Deus vester.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non comedetis cum sanguine. Non augurabimini, nec observabitis somnia.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Neque in rotundum attondebitis comam, nec radetis barbam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et super mortuo non incidetis carnem vestram, neque figuras aliquas aut stigmata facietis vobis. Ego Dominus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ne prostituas filiam tuam, ne contaminetur terra et impleatur piaculo.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sabbata mea custodite, et sanctuarium meum metuite. Ego Dominus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Non declinetis ad magos, nec ab ariolis aliquid sciscitemini, ut polluamini per eos. Ego Dominus Deus vester.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Coram cano capite consurge, et honora personam senis : et time Dominum Deum tuum. Ego sum Dominus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Si habitaverit advena in terra vestra, et moratus fuerit inter vos, non exprobretis ei :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sed sit inter vos quasi indigena, et diligetis eum quasi vosmetipsos : fuistis enim et vos advenæ in terra Ægypti. Ego Dominus Deus vester.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Nolite facere iniquum aliquid in judicio, in regula, in pondere, in mensura.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Statera justa, et æqua sint pondera, justus modius, æquusque sextarius. Ego Dominus Deus vester, qui eduxi vos de terra Ægypti.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Custodite omnia præcepta mea, et universa judicia, et facite ea. Ego Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/20/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 20</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink is on the face of the earth to the very ground: nor shalt thou gather the ears that remain.\"},{\"verse\":10,\"text\":\"Neither shalt thou gather the bunches and grapes that fall down in thy vineyard: but shalt leave them to the poor and the strangers to take. I am the Lord your God.\"},{\"verse\":11,\"text\":\"You shall not steal. You shall not lie: neither shall any man deceive his neighbour.\"},{\"verse\":12,\"text\":\"Thou shalt not swear falsely by my name, nor profane the name of thy God. I am the Lord.\"},{\"verse\":13,\"text\":\"Thou shalt not calumniate thy neighbour, nor oppress him by violence. The wages of him that hath been hired by thee shall not abide with thee until the morning.\"},{\"verse\":14,\"text\":\"Thou shalt not speak evil of the deaf, nor put a stumbling block before the blind: but thou shalt fear the Lord thy God, because I am the Lord.\"},{\"verse\":15,\"text\":\"Thou shalt not do that which is unjust, nor judge unjustly. Respect not the person of the poor: nor honour the countenance of the mighty. But judge thy neighbour according to justice.\"},{\"verse\":16,\"text\":\"Thou shalt not be a detractor nor a whisperer among the people. Thou shalt not stand against the blood of thy neighbour. I am the Lord.\"},{\"verse\":17,\"text\":\"Thou shalt not hate thy brother in thy heart: But reprove him openly, lest thou incur sin through him.\"},{\"verse\":18,\"text\":\"Seek not revenge, nor be mindful of the injury of thy citizens. Thou shalt love thy friend as thyself. I am the Lord.\"},{\"verse\":19,\"text\":\"Keep ye my laws. Thou shalt not make thy cattle to gender with beasts of any other kind. Thou shalt not sow thy field with different seeds. Thou shalt not wear a garment that is woven of two sorts.\"},{\"verse\":20,\"text\":\"If a man carnally lie with a woman that is a bondservant and marriageable, and yet not redeemed with a price, nor made free: they both shall be scourged: and they shall not be put to death, because she was not a free woman.\"},{\"verse\":21,\"text\":\"And for his trespass he shall offer a ram to the Lord, at the door of the tabernacle of the testimony.\"},{\"verse\":22,\"text\":\"And the priest shall pray for him: and for his sin before the Lord: and he shall have mercy on him, and the sin shall be forgiven.\"},{\"verse\":23,\"text\":\"When you shall be come into the land, and shall have planted in it fruit trees, you shall take away the firstfruits of them. The fruit that comes forth shall be unclean to you: neither shall you eat of them.\"},{\"verse\":24,\"text\":\"But in the fourth year, all their fruit shall be sanctified, to the praise of the Lord.\"},{\"verse\":25,\"text\":\"And in the fifth year you shall eat the fruits thereof, gathering the increase thereof. I am the Lord your God.\"},{\"verse\":26,\"text\":\"You shall not eat with blood. You shall not divine nor observe dreams.\"},{\"verse\":27,\"text\":\"Nor shall you cut your hair roundwise: nor shave your beard.\"},{\"verse\":28,\"text\":\"You shall not make any cuttings in your flesh, for the dead: neither shall you make in yourselves any figures or marks. I am the Lord.\"},{\"verse\":29,\"text\":\"Make not thy daughter a common strumpet, lest the land be defiled, and filled with wickedness.\"},{\"verse\":30,\"text\":\"Keep ye my sabbaths, and reverence my sanctuary. I am the Lord.\"},{\"verse\":31,\"text\":\"Go not aside after wizards: neither ask any thing of soothsayers, to be defiled by them. I am the Lord your God.\"},{\"verse\":32,\"text\":\"Rise up before the hoary head, and honour the person of the aged man: and fear the Lord thy God. I am the Lord.\"},{\"verse\":33,\"text\":\"If a stranger dwell in your land, and abide among you, do not upbraid him:\"},{\"verse\":34,\"text\":\"But let him be among you as one of the same country. And you shall love him as yourselves: for you were strangers in the land of Egypt. I am the Lord your God.\"},{\"verse\":35,\"text\":\"Do not any unjust thing in judgment, in rule, in weight, or in measure.\"},{\"verse\":36,\"text\":\"Let the balance be just and the weights equal, the bushel just, and the sextary equal. I am the Lord your God, that brought you out of the land of Egypt.\"},{\"verse\":37,\"text\":\"Keep all my precepts, and all my judgments: and do them. I am the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutus est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere ad omnem cœtum filiorum Israël, et dices ad eos : Sancti estote, quia ego sanctus sum, Dominus Deus vester.\"},{\"verse\":3,\"text\":\"Unusquisque patrem suum, et matrem suam timeat. Sabbata mea custodite. Ego Dominus Deus vester.\"},{\"verse\":4,\"text\":\"Nolite converti ad idola, nec deos conflatiles faciatis vobis. Ego Dominus Deus vester.\"},{\"verse\":5,\"text\":\"Si immolaveritis hostiam pacificorum Domino, ut sit placabilis,\"},{\"verse\":6,\"text\":\"eo die quo fuerit immolata, comedetis eam, et die altero : quidquid autem residuum fuerit in diem tertium, igne comburetis.\"},{\"verse\":7,\"text\":\"Si quis post biduum comederit ex ea, profanus erit, et impietatis reus :\"},{\"verse\":8,\"text\":\"portabitque iniquitatem suam, quia sanctum Domini polluit, et peribit anima illa de populo suo.\"},{\"verse\":9,\"text\":\"Cumque messueris segetes terræ tuæ, non tondebis usque ad solum superficiem terræ, nec remanentes spicas colliges,\"},{\"verse\":10,\"text\":\"neque in vinea tua racemos et grana decidentia congregabis : sed pauperibus et peregrinis carpenda dimittes. Ego Dominus Deus vester.\"},{\"verse\":11,\"text\":\"Non facietis furtum. Non mentiemini, nec decipiet unusquisque proximum suum.\"},{\"verse\":12,\"text\":\"Non perjurabis in nomine meo, nec pollues nomen Dei tui. Ego Dominus.\"},{\"verse\":13,\"text\":\"Non facies calumniam proximo tuo nec vi opprimes eum. Non morabitur opus mercenarii tui apud te usque mane.\"},{\"verse\":14,\"text\":\"Non maledices surdo, nec coram cæco pones offendiculum : sed timebis Dominum Deum tuum, quia ego sum Dominus.\"},{\"verse\":15,\"text\":\"Non facies quod iniquum est, nec injuste judicabis. Non consideres personam pauperis, nec honores vultum potentis. Juste judica proximo tuo.\"},{\"verse\":16,\"text\":\"Non eris criminator, nec susurro in populo. Non stabis contra sanguinem proximi tui. Ego Dominus.\"},{\"verse\":17,\"text\":\"Non oderis fratrem tuum in corde tuo, sed publice argue eum, ne habeas super illo peccatum.\"},{\"verse\":18,\"text\":\"Non quæras ultionem, nec memor eris injuriæ civium tuorum. Diliges amicum tuum sicut teipsum. Ego Dominus.\"},{\"verse\":19,\"text\":\"Leges meas custodite. Jumentum tuum non facies coire cum alterius generis animantibus. Agrum tuum non seres diverso semine. Veste, quæ ex duobus texta est, non indueris.\"},{\"verse\":20,\"text\":\"Homo, si dormierit cum muliere coitu seminis, quæ sit ancilla etiam nubilis, et tamen pretio non redempta, nec libertate donata : vapulabunt ambo, et non morientur, quia non fuit libera.\"},{\"verse\":21,\"text\":\"Pro delicto autem suo offeret Domino ad ostium tabernaculi testimonii arietem :\"},{\"verse\":22,\"text\":\"orabitque pro eo sacerdos, et pro peccato ejus coram Domino, et repropitiabitur ei, dimitteturque peccatum.\"},{\"verse\":23,\"text\":\"Quando ingressi fueritis terram, et plantaveritis in ea ligna pomifera, auferetis præputia eorum : poma, quæ germinant, immunda erunt vobis, nec edetis ex eis.\"},{\"verse\":24,\"text\":\"Quarto autem anno omnis fructus eorum sanctificabitur, laudabilis Domino.\"},{\"verse\":25,\"text\":\"Quinto autem anno comedetis fructus, congregantes poma, quæ proferunt. Ego Dominus Deus vester.\"},{\"verse\":26,\"text\":\"Non comedetis cum sanguine. Non augurabimini, nec observabitis somnia.\"},{\"verse\":27,\"text\":\"Neque in rotundum attondebitis comam, nec radetis barbam.\"},{\"verse\":28,\"text\":\"Et super mortuo non incidetis carnem vestram, neque figuras aliquas aut stigmata facietis vobis. Ego Dominus.\"},{\"verse\":29,\"text\":\"Ne prostituas filiam tuam, ne contaminetur terra et impleatur piaculo.\"},{\"verse\":30,\"text\":\"Sabbata mea custodite, et sanctuarium meum metuite. Ego Dominus.\"},{\"verse\":31,\"text\":\"Non declinetis ad magos, nec ab ariolis aliquid sciscitemini, ut polluamini per eos. Ego Dominus Deus vester.\"},{\"verse\":32,\"text\":\"Coram cano capite consurge, et honora personam senis : et time Dominum Deum tuum. Ego sum Dominus.\"},{\"verse\":33,\"text\":\"Si habitaverit advena in terra vestra, et moratus fuerit inter vos, non exprobretis ei :\"},{\"verse\":34,\"text\":\"sed sit inter vos quasi indigena, et diligetis eum quasi vosmetipsos : fuistis enim et vos advenæ in terra Ægypti. Ego Dominus Deus vester.\"},{\"verse\":35,\"text\":\"Nolite facere iniquum aliquid in judicio, in regula, in pondere, in mensura.\"},{\"verse\":36,\"text\":\"Statera justa, et æqua sint pondera, justus modius, æquusque sextarius. Ego Dominus Deus vester, qui eduxi vos de terra Ægypti.\"},{\"verse\":37,\"text\":\"Custodite omnia præcepta mea, et universa judicia, et facite ea. Ego Dominus.\"}],\"summary\":\"Divers ordinances, partly moral, partly ceremonial or judicial.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":18,\"label\":\"Leviticus 18\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":20,\"label\":\"Leviticus 20\"}}]]\n"])</script></body></html>
