="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">15</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Other legal uncleannesses.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, and say to them: The man that hath an issue of seed, shall be unclean.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And then shall he be judged subject to this evil, when a filthy humour, at every moment, cleaveth to his flesh, and gathereth there.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Every bed on which he sleepeth, shall be unclean, and every place on which he sitteth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>If any man touch his bed, he shall wash his clothes and being washed with water, he shall be unclean until the evening.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>If a man sit where that man hath sitten, he also shall wash his clothes: and being washed with water, shall be unclean until the evening.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that toucheth his flesh, shall wash his clothes: and being himself washed with water shall be unclean until the evening.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If such a man cast his spittle upon him that is clean, he shall wash his clothes: and being washed with water, he shall be unclean until the evening.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The saddle on which he hath sitten shall be unclean.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And whatsoever has been under him that hath the issue of seed, shall be unclean until the evening. He that carrieth any of these things, shall wash his clothes: and being washed with water, he shall be unclean until the evening.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Every person whom such a one shall touch, not having washed his hands before, shall wash his clothes: and being washed with water, shall be unclean until the evening.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If he touch a vessel of earth, it shall be broken: but if a vessel of wood, it shall be washed with water.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>If he who suffereth this disease be healed, he shall number seven days after his cleansing: and having washed his clothes, and all his body in living water, he shall be clean.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And on the eighth day he shall take two turtles, or two young pigeons, and he shall come before the Lord, to the door of the tabernacle of the testimony, and shall give them to the priest.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Who shall offer one for sin, and the other for a holocaust: and he shall pray for him before the Lord, that he may be cleansed of the issue of his seed.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The man from whom the seed of copulation goeth out, shall wash all his body with water: and he shall be unclean until the evening.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The garment or skin that he weareth, he shall wash with water: and it shall be unclean until the evening.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The woman, with whom he copulateth, shall be washed with water: and shall be unclean until the evening.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The woman, who at the return of the month, hath her issue of blood, shall be separated seven days.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Every one that toucheth her, shall be unclean until the evening.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And every thing that she sleepeth on, or that she sitteth on in the days of her separation, shall be defiled.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He that toucheth her bed shall wash his clothes: and being himself washed with water, shall be unclean until the evening.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Whosoever shall touch any vessel on which she sitteth, shall wash his clothes: and himself being washed with water, shall be defiled until the evening.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>If a man copulateth with her in the time of her flowers, he shall be unclean seven days: and every bed on which he shall sleep, shall be defiled.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The woman that hath still issue of blood many days out of her ordinary time, or that ceaseth not to flow after the monthly courses, as long as she is subject to this disease, shall be unclean, in the same manner as if she were in her flowers.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Every bed on which she sleepeth, and every vessel on which she sitteth, shall be defiled.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Whosoever toucheth them shall wash his clothes: and himself being washed with water, shall be unclean until the evening.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>If the blood stop and cease to run, she shall count seven days of her purification:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And on the eighth day she shall offer for herself to the priest, two turtles, or two young pigeons, at the door of the tabernacle of the testimony:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he shall offer one for sin, and the other for a holocaust, and he shall pray for her before the Lord, and for the issue of her uncleanness.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>You shall teach therefore the children of Israel to take heed of uncleanness, that they may not die in their filth, when they shall have defiled my tabernacle that is among them.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>This is the law of him that hath the issue of seed, and that is defiled by copulation.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And of the woman that is separated in her monthly times, or that hath a continual issue of blood, and of the man that sleepeth with her.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquimini filiis Israël, et dicite eis : Vir, qui patitur fluxum seminis, immundus erit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et tunc judicabitur huic vitio subjacere, cum per singula momenta adhæserit carni ejus, atque concreverit fœdus humor.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Omne stratum, in quo dormierit, immundum erit, et ubicumque sederit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Si quis hominum tetigerit lectum ejus, lavabit vestimenta sua, et ipse lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si sederit ubi ille sederat, et ipse lavabit vestimenta sua : et lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui tetigerit carnem ejus, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si salivam hujuscemodi homo jecerit super eum qui mundus est, lavabit vestimenta sua : et lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sagma, super quo sederit, immundum erit :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et quidquid sub eo fuerit, qui fluxum seminis patitur, pollutum erit usque ad vesperum. Qui portaverit horum aliquid, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Omnis, quem tetigerit qui talis est, non lotis ante manibus, lavabit vestimenta sua, et lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vas fictile quod tetigerit confringetur : vas autem ligneum lavabitur aqua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Si sanatus fuerit qui hujuscemodi sustinet passionem, numerabit septem dies post emundationem sui, et lotis vestibus et toto corpore in aquis viventibus, erit mundus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Die autem octavo sumet duos turtures, aut duos pullos columbæ, et veniet in conspectum Domini ad ostium tabernaculi testimonii, dabitque eos sacerdoti :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui faciet unum pro peccato et alterum in holocaustum : rogabitque pro eo coram Domino, ut emundetur a fluxi seminis sui.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vir de quo egreditur semen coitus, lavabit aqua omne corpus suum : et immundus erit usque ad vesperum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vestem et pellem, quam habuerit, lavabit aqua, et immunda erit usque ad vesperum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Mulier, cum qua coierit, lavabitur aqua, et immunda erit usque ad vesperum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Mulier, quæ redeunte mense patitur fluxum sanguinis, septem diebus separabitur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omnis qui tetigerit eam, immundus erit usque ad vesperum :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et in quo dormierit vel sederit diebus separationis suæ, polluetur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui tetigerit lectum ejus, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Omne vas, super quo illa sederit, quisquis attigerit, lavabit vestimenta sua : et ipse lotus aqua, pollutus erit usque ad vesperum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Si coierit cum ea vir tempore sanguinis menstrualis, immundus erit septem diebus : et omne stratum, in quo dormierit, polluetur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Mulier, quæ patitur multis diebus fluxum sanguinis non in tempore menstruali, vel quæ post menstruum sanguinem fluere non cessat, quamdiu subjacet huic passioni, immunda erit quasi sit in tempore menstruo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Omne stratum, in quo dormierit, et vas in quo sederit, pollutum erit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quicumque tetigerit ea, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Si steterit sanguis, et fluere cessaverit, numerabit septem dies purificationis suæ :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et die octavo offeret pro se sacerdoti duos turtures, aut duos pullos columbarum, ad ostium tabernaculi testimonii :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>qui unum faciet pro peccato, et alterum in holocaustum, rogabitque pro ea coram Domino, et pro fluxu immunditiæ ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Docebitis ergo filios Israël ut caveant immunditiam, et non moriantur in sordibus suis, cum polluerint tabernaculum meum quod est inter eos.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ista est lex ejus, qui patitur fluxum seminis, et qui polluitur coitu,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>et quæ menstruis temporibus separatur, vel quæ jugi fluit sanguine, et hominis qui dormierit cum ea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/14/"><svg viewBox= ean.\"},{\"verse\":3,\"text\":\"And then shall he be judged subject to this evil, when a filthy humour, at every moment, cleaveth to his flesh, and gathereth there.\"},{\"verse\":4,\"text\":\"Every bed on which he sleepeth, shall be unclean, and every place on which he sitteth.\"},{\"verse\":5,\"text\":\"If any man touch his bed, he shall wash his clothes and being washed with water, he shall be unclean until the evening.\"},{\"verse\":6,\"text\":\"If a man sit where that man hath sitten, he also shall wash his clothes: and being washed with water, shall be unclean until the evening.\"},{\"verse\":7,\"text\":\"He that toucheth his flesh, shall wash his clothes: and being himself washed with water shall be unclean until the evening.\"},{\"verse\":8,\"text\":\"If such a man cast his spittle upon him that is clean, he shall wash his clothes: and being washed with water, he shall be unclean until the evening.\"},{\"verse\":9,\"text\":\"The saddle on which he hath sitten shall be unclean.\"},{\"verse\":10,\"text\":\"And whatsoever has been under him that hath the issue of seed, shall be unclean until the evening. He that carrieth any of these things, shall wash his clothes: and being washed with water, he shall be unclean until the evening.\"},{\"verse\":11,\"text\":\"Every person whom such a one shall touch, not having washed his hands before, shall wash his clothes: and being washed with water, shall be unclean until the evening.\"},{\"verse\":12,\"text\":\"If he touch a vessel of earth, it shall be broken: but if a vessel of wood, it shall be washed with water.\"},{\"verse\":13,\"text\":\"If he who suffereth this disease be healed, he shall number seven days after his cleansing: and having washed his clothes, and all his body in living water, he shall be clean.\"},{\"verse\":14,\"text\":\"And on the eighth day he shall take two turtles, or two young pigeons, and he shall come before the Lord, to the door of the tabernacle of the testimony, and shall give them to the priest.\"},{\"verse\":15,\"text\":\"Who shall offer one for sin, and the other for a holocaust: and he shall pray for him before the Lord, that he may be cleansed of the issue of his seed.\"},{\"verse\":16,\"text\":\"The man from whom the seed of copulation goeth out, shall wash all his body with water: and he shall be unclean until the evening.\"},{\"verse\":17,\"text\":\"The garment or skin that he weareth, he shall wash with water: and it shall be unclean until the evening.\"},{\"verse\":18,\"text\":\"The woman, with whom he copulateth, shall be washed with water: and shall be unclean until the evening.\"},{\"verse\":19,\"text\":\"The woman, who at the return of the month, hath her issue of blood, shall be separated seven days.\"},{\"verse\":20,\"text\":\"Every one that toucheth her, shall be unclean until the evening.\"},{\"verse\":21,\"text\":\"And every thing that she sleepeth on, or that she sitteth on in the days of her separation, shall be defiled.\"},{\"verse\":22,\"text\":\"He that toucheth her bed shall wash his clothes: and being himself washed with water, shall be unclean until the evening.\"},{\"verse\":23,\"text\":\"Whosoever shall touch any vessel on which she sitteth, shall wash his clothes: and himself being washed with water, shall be defiled until the evening.\"},{\"verse\":24,\"text\":\"If a man copulateth with her in the time of her flowers, he shall be unclean seven days: and every bed on which he shall sleep, shall be defiled.\"},{\"verse\":25,\"text\":\"The woman that hath still issue of blood many days out of her ordinary time, or that ceaseth not to flow after the monthly courses, as long as she is subject to this disease, shall be unclean, in the same manner as if she were in her flowers.\"},{\"verse\":26,\"text\":\"Every bed on which she sleepeth, and every vessel on which she sitteth, shall be defiled.\"},{\"verse\":27,\"text\":\"Whosoever toucheth them shall wash his clothes: and himself being washed with water, shall be unclean until the evening.\"},{\"verse\":28,\"text\":\"If the blood stop and cease to run, she shall count seven days of her purification:\"},{\"verse\":29,\"text\":\"And on the eighth day she shall offer for herself to the priest, two turtles, or two young pigeons, at the door of the tabernacle of the testimony:\"},{\"verse\":30,\"text\":\"And he shall offer one for sin, and the other for a holocaust, and he shall pray for her before the Lord, and for the issue of her uncleanness.\"},{\"verse\":31,\"text\":\"You shall teach therefore the children of Israel to take heed of uncleanness, that they may not die in their filth, when they shall have defiled my tabernacle that is among them.\"},{\"verse\":32,\"text\":\"This is the law of him that hath the issue of seed, and that is defiled by copulation.\"},{\"verse\":33,\"text\":\"And of the woman that is separated in her monthly times, or that hath a continual issue of blood, and of the man that sleepeth with her.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Loquimini filiis Israël, et dicite eis : Vir, qui patitur fluxum seminis, immundus erit.\"},{\"verse\":3,\"text\":\"Et tunc judicabitur huic vitio subjacere, cum per singula momenta adhæserit carni ejus, atque concreverit fœdus humor.\"},{\"verse\":4,\"text\":\"Omne stratum, in quo dormierit, immundum erit, et ubicumque sederit.\"},{\"verse\":5,\"text\":\"Si quis hominum tetigerit lectum ejus, lavabit vestimenta sua, et ipse lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":6,\"text\":\"Si sederit ubi ille sederat, et ipse lavabit vestimenta sua : et lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":7,\"text\":\"Qui tetigerit carnem ejus, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":8,\"text\":\"Si salivam hujuscemodi homo jecerit super eum qui mundus est, lavabit vestimenta sua : et lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":9,\"text\":\"Sagma, super quo sederit, immundum erit :\"},{\"verse\":10,\"text\":\"et quidquid sub eo fuerit, qui fluxum seminis patitur, pollutum erit usque ad vesperum. Qui portaverit horum aliquid, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":11,\"text\":\"Omnis, quem tetigerit qui talis est, non lotis ante manibus, lavabit vestimenta sua, et lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":12,\"text\":\"Vas fictile quod tetigerit confringetur : vas autem ligneum lavabitur aqua.\"},{\"verse\":13,\"text\":\"Si sanatus fuerit qui hujuscemodi sustinet passionem, numerabit septem dies post emundationem sui, et lotis vestibus et toto corpore in aquis viventibus, erit mundus.\"},{\"verse\":14,\"text\":\"Die autem octavo sumet duos turtures, aut duos pullos columbæ, et veniet in conspectum Domini ad ostium tabernaculi testimonii, dabitque eos sacerdoti :\"},{\"verse\":15,\"text\":\"qui faciet unum pro peccato et alterum in holocaustum : rogabitque pro eo coram Domino, ut emundetur a fluxi seminis sui.\"},{\"verse\":16,\"text\":\"Vir de quo egreditur semen coitus, lavabit aqua omne corpus suum : et immundus erit usque ad vesperum.\"},{\"verse\":17,\"text\":\"Vestem et pellem, quam habuerit, lavabit aqua, et immunda erit usque ad vesperum.\"},{\"verse\":18,\"text\":\"Mulier, cum qua coierit, lavabitur aqua, et immunda erit usque ad vesperum.\"},{\"verse\":19,\"text\":\"Mulier, quæ redeunte mense patitur fluxum sanguinis, septem diebus separabitur.\"},{\"verse\":20,\"text\":\"Omnis qui tetigerit eam, immundus erit usque ad vesperum :\"},{\"verse\":21,\"text\":\"et in quo dormierit vel sederit diebus separationis suæ, polluetur.\"},{\"verse\":22,\"text\":\"Qui tetigerit lectum ejus, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperum.\"},{\"verse\":23,\"text\":\"Omne vas, super quo illa sederit, quisquis attigerit, lavabit vestimenta sua : et ipse lotus aqua, pollutus erit usque ad vesperum.\"},{\"verse\":24,\"text\":\"Si coierit cum ea vir tempore sanguinis menstrualis, immundus erit septem diebus : et omne stratum, in quo dormierit, polluetur.\"},{\"verse\":25,\"text\":\"Mulier, quæ patitur multis diebus fluxum sanguinis non in tempore menstruali, vel quæ post menstruum sanguinem fluere non cessat, quamdiu subjacet huic passioni, immunda erit quasi sit in tempore menstruo.\"},{\"verse\":26,\"text\":\"Omne stratum, in quo dormierit, et vas in quo sederit, pollutum erit.\"},{\"verse\":27,\"text\":\"Quicumque tetigerit ea, lavabit vestimenta sua : et ipse lotus aqua, immundus erit usque ad vesperam.\"},{\"verse\":28,\"text\":\"Si steterit sanguis, et fluere cessaverit, numerabit septem dies purificationis suæ :\"},{\"verse\":29,\"text\":\"et die octavo offeret pro se sacerdoti duos turtures, aut duos pullos columbarum, ad ostium tabernaculi testimonii :\"},{\"verse\":30,\"text\":\"qui unum faciet pro peccato, et alterum in holocaustum, rogabitque pro ea coram Domino, et pro fluxu immunditiæ ejus.\"},{\"verse\":31,\"text\":\"Docebitis ergo filios Israël ut caveant immunditiam, et non moriantur in sordibus suis, cum polluerint tabernaculum meum quod est inter eos.\"},{\"verse\":32,\"text\":\"Ista est lex ejus, qui patitur fluxum seminis, et qui polluitur coitu,\"},{\"verse\":33,\"text\":\"et quæ menstruis temporibus separatur, vel quæ jugi fluit sanguine, et hominis qui dormierit cum ea.\"}],\"summary\":\"Other legal uncleannesses.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":14,\"label\":\"Leviticus 14\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":16,\"label\":\"Leviticus 16\"}}]]\n"])</script></body></html>
