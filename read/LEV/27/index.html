="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">27</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of vows and tithes.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, and thou shalt say to them: The man that shall have made a vow, and promised his soul to God, shall give the price according to estimation.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>If it be a man from twenty years old unto sixty years old, he shall give fifty sicles of silver, after the weight of the sanctuary:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>If a woman, thirty.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But from the fifth year until the twentieth, a man shall give twenty sicles: a woman ten.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>From one month until the fifth year, for a male shall be given five sicles: for a female three.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>A man that is sixty years old or upward, shall give fifteen sicles: a woman ten.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If he be poor, and not able to pay the estimation, he shall stand before the priest: and as much as he shall value him at, and see him able to pay, so much shall he give.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But a beast that may be sacrificed to the Lord, if any one shall vow, shall be holy,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And cannot be changed: that is to say, neither a better for a worse, nor a worse for a better. And if he shall change it: both that which was changed, and that for which it was changed, shall be consecrated to the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>An unclean beast, which cannot be sacrificed to the Lord, if any man shall vow, shall be brought before the priest:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Who judging whether it be good or bad, shall set the price.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Which, if he that offereth it will give, he shall add above the estimation the fifth part.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If a man shall vow his house, and sanctify it to the Lord, the priest shall consider it, whether it be good or bad: and it shall be sold according to the price, which he shall appoint.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But if he that vowed, will redeem it, he shall give the fifth part of the estimation over and above: and shall have the house.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And if he vow the field of his possession, and consecrate it to the Lord, the price shall be rated according to the measure of the seed. If the ground be sown with thirty bushels of barley, let it be sold for fifty sicles of silver.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If he vow his field immediately from the year of jubilee that is beginning: as much as it may be worth, at so much it shall be rated.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But if some time after, the priest shall reckon the money according to the number of years that remain until the jubilee, and the price shall be abated.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And if he that had vowed, will redeem his field, he shall add the fifth part of the money of the estimation, and shall possess it.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And if he will not redeem it, but it be sold to any other man, he that vowed it, may not redeem it any more.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For when the day of jubilee cometh, it shall be sanctified to the Lord, and as a possession consecrated, pertaineth to the right of the priest.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If a field that was bought, and not of a man’s ancestors’ possession, be sanctified to the Lord:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The priest shall reckon the price according to the number of years, unto the jubilee. And he that had vowed, shall give that to the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But in the jubilee, it shall return to the former owner, who had sold it, and had it in the lot of his possession.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>All estimation shall be made according to the sicle of the sanctuary. A sicle hath twenty obols.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The firstborn, which belong to the Lord, no man may sanctify and vow: whether it be bullock, or sheep, they are the Lord’s.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And if it be an unclean beast, he that offereth it shall redeem it, according to thy estimation, and shall add the fifth part of the price. If he will not redeem it, it shall be sold to another for how much soever it was estimated by thee.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Any thing that is devoted to the Lord, whether it be man, or beast, or field, shall not be sold: neither may it be redeemed. Whatsoever is once consecrated shall be holy of holies to the Lord.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And any consecration that is offered by man, shall not be redeemed, but dying shall die.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>All tithes of the land, whether of corn, or of the fruits of trees, are the Lord’s, and are sanctified to him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And if any man will redeem his tithes, he shall add the fifth part of them.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Of all the tithes of oxen, and sheep, and goats, that pass under the shepherd’s rod, every tenth that cometh shall be sanctified to the Lord.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>It shall not be chosen neither good nor bad, neither shall it be changed for another. If any man change it: both that which was changed, and that for which it was changed, shall be sanctified to the Lord, and shall not be redeemed.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>These are the precepts which the Lord commanded Moses for the children of Israel in mount Sinai.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere filiis Israël, et dices ad eos : Homo qui votum fecerit, et spoponderit Deo animam suam, sub æstimatione dabit pretium.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Si fuerit masculus a vigesimo anno usque ad sexagesimum annum, dabit quinquaginta siclos argenti ad mensuram sanctuarii :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>si mulier, triginta.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A quinto autem anno usque ad vigesimum, masculus dabit viginti siclos : femina, decem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ab uno mense usque ad annum quintum, pro masculo dabuntur quinque sicli : pro femina, tres.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sexagenarius et ultra masculus dabit quindecim siclos : femina, decem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si pauper fuerit, et æstimationem reddere non valebit, stabit coram sacerdote : et quantum ille æstimaverit, et viderit eum posse reddere, tantum dabit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Animal autem, quod immolari potest Domino, si quis voverit, sanctum erit,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et mutari non poterit, id est, nec melius malo, nec pejus bono : quod si mutaverit, et ipsum quod mutatum est, et illud pro quo mutatum est, consecratum erit Domino.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Animal immundum, quod immolari Domino non potest, si quis voverit, adducetur ante sacerdotem :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>qui judicans utrum bonum an malum sit, statuet pretium.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quod si dare voluerit is qui offert, addet supra æstimationem quintam partem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Homo si voverit domum suam, et sanctificaverit Domino, considerabit eam sacerdos utrum bona an mala sit, et juxta pretium, quod ab eo fuerit constitutum, venundabitur :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>sin autem ille qui voverat, voluerit redimere eam, dabit quintam partem æstimationis supra, et habebit domum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quod si agrum possessionis suæ voverit, et consecraverit Domino, juxta mensuram sementis æstimabitur pretium : si triginta modiis hordei seritur terra, quinquaginta siclis venundetur argenti.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si statim ab anno incipientis jubilæi voverit agrum, quanto valere potest, tanto æstimabitur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sin autem post aliquantum temporis, supputabit sacerdos pecuniam juxta annorum, qui reliqui sunt, numerum usque ad jubilæum, et detrahetur ex pretio.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quod si voluerit redimere agrum ille qui voverat, addet quintam partem æstimatæ pecuniæ, et possidebit eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Sin autem noluerit redimere, sed alteri cuilibet fuerit venundatus, ultra eum qui voverat redimere non poterit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quia cum jubilæi venerit dies, sanctificatus erit Domino, et possessio consecrata ad jus pertinet sacerdotum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si ager emptus est, et non de possessione majorum sanctificatus fuerit Domino,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>supputabit sacerdos juxta annorum numerum usque ad jubilæum, pretium : et dabit ille qui voverat eum, Domino.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In jubilæo autem revertetur ad priorem dominum, qui vendiderat eum, et habuerat in sorte possessionis suæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Omnis æstimatio siclo sanctuarii ponderabitur. Siclus viginti obolos habet.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Primogenita, quæ ad Dominum pertinent, nemo sanctificare poterit et vovere : sive bos, sive ovis fuerit, Domini sunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quod si immundum est animal, redimet qui obtulit, juxta æstimationem tuam, et addet quintam partem pretii : si redimere noluerit, vendetur alteri quantocumque a te fuerit æstimatum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Omne quod Domino consecratur, sive homo fuerit, sive animal, sive ager, non vendetur, nec redimi poterit. Quidquid semel fuerit consecratum, Sanctum sanctorum erit Domino :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et omnis consecratio, quæ offertur ab homine, non redimetur, sed morte morietur.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Omnes decimæ terræ, sive de frugibus, sive de pomis arborum, Domini sunt, et illi sanctificantur.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si quis autem voluerit redimere decimas suas, addet quintam partem earum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Omnium decimarum bovis et ovis et capræ, quæ sub pastoris virga transeunt, quidquid decimum venerit, sanctificabitur Domino.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Non eligetur nec bonum nec malum, nec altero commutabitur, si quis mutaverit : et quod mutatum est, et pro quo mutatum est, sanctificabitur Domino, et non redimetur.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hæc sunt præcepta, quæ mandavit Dominus Moysi ad filios Israël in monte Sinai.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NUM/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Numbers 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->27<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Leviticus 26" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catho catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LEV.27\",{\"bookId\":3,\"usfm\":\"LEV\",\"bookName\":\"Leviticus\",\"drName\":\"Leviticus\",\"chapter\":27,\"totalChapters\":27,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":2,\"text\":\"Speak to the children of Israel, and thou shalt say to them: The man that shall have made a vow, and promised his soul to God, shall give the price according to estimation.\"},{\"verse\":3,\"text\":\"If it be a man from twenty years old unto sixty years old, he shall give fifty sicles of silver, after the weight of the sanctuary:\"},{\"verse\":4,\"text\":\"If a woman, thirty.\"},{\"verse\":5,\"text\":\"But from the fifth year until the twentieth, a man shall give twenty sicles: a woman ten.\"},{\"verse\":6,\"text\":\"From one month until the fifth year, for a male shall be given five sicles: for a female three.\"},{\"verse\":7,\"text\":\"A man that is sixty years old or upward, shall give fifteen sicles: a woman ten.\"},{\"verse\":8,\"text\":\"If he be poor, and not able to pay the estimation, he shall stand before the priest: and as much as he shall value him at, and see him able to pay, so much shall he give.\"},{\"verse\":9,\"text\":\"But a beast that may be sacrificed to the Lord, if any one shall vow, shall be holy,\"},{\"verse\":10,\"text\":\"And cannot be changed: that is to say, neither a better for a worse, nor a worse for a better. And if he shall change it: both that which was changed, and that for which it was changed, shall be consecrated to the Lord.\"},{\"verse\":11,\"text\":\"An unclean beast, which cannot be sacrificed to the Lord, if any man shall vow, shall be brought before the priest:\"},{\"verse\":12,\"text\":\"Who judging whether it be good or bad, shall set the price.\"},{\"verse\":13,\"text\":\"Which, if he that offereth it will give, he shall add above the estimation the fifth part.\"},{\"verse\":14,\"text\":\"If a man shall vow his house, and sanctify it to the Lord, the priest shall consider it, whether it be good or bad: and it shall be sold according to the price, which he shall appoint.\"},{\"verse\":15,\"text\":\"But if he that vowed, will redeem it, he shall give the fifth part of the estimation over and above: and shall have the house.\"},{\"verse\":16,\"text\":\"And if he vow the field of his possession, and consecrate it to the Lord, the price shall be rated according to the measure of the seed. If the ground be sown with thirty bushels of barley, let it be sold for fifty sicles of silver.\"},{\"verse\":17,\"text\":\"If he vow his field immediately from the year of jubilee that is beginning: as much as it may be worth, at so much it shall be rated.\"},{\"verse\":18,\"text\":\"But if some time after, the priest shall reckon the money according to the number of years that remain until the jubilee, and the price shall be abated.\"},{\"verse\":19,\"text\":\"And if he that had vowed, will redeem his field, he shall add the fifth part of the money of the estimation, and shall possess it.\"},{\"verse\":20,\"text\":\"And if he will not redeem it, but it be sold to any other man, he that vowed it, may not redeem it any more.\"},{\"verse\":21,\"text\":\"For when the day of jubilee cometh, it shall be sanctified to the Lord, and as a possession consecrated, pertaineth to the right of the priest.\"},{\"verse\":22,\"text\":\"If a field that was bought, and not of a man’s ancestors’ possession, be sanctified to the Lord:\"},{\"verse\":23,\"text\":\"The priest shall reckon the price according to the number of years, unto the jubilee. And he that had vowed, shall give that to the Lord.\"},{\"verse\":24,\"text\":\"But in the jubilee, it shall return to the former owner, who had sold it, and had it in the lot of his possession.\"},{\"verse\":25,\"text\":\"All estimation shall be made according to the sicle of the sanctuary. A sicle hath twenty obols.\"},{\"verse\":26,\"text\":\"The firstborn, which belong to the Lord, no man may sanctify and vow: whether it be bullock, or sheep, they are the Lord’s.\"},{\"verse\":27,\"text\":\"And if it be an unclean beast, he that offereth it shall redeem it, according to thy estimation, and shall add the fifth part of the price. If he will not redeem it, it shall be sold to another for how much soever it was estimated by thee.\"},{\"verse\":28,\"text\":\"Any thing that is devoted to the Lord, whether it be man, or beast, or field, shall not be sold: neither may it be redeemed. Whatsoever is once consecrated shall be holy of holies to the Lord.\"},{\"verse\":29,\"text\":\"And any consecration that is offered by man, shall not be redeemed, but dying shall die.\"},{\"verse\":30,\"text\":\"All tithes of the land, whether of corn, or of the fruits of trees, are the Lord’s, and are sanctified to him.\"},{\"verse\":31,\"text\":\"And if any man will redeem his tithes, he shall add the fifth part of them.\"},{\"verse\":32,\"text\":\"Of all the tithes of oxen, and sheep, and goats, that pass under the shepherd’s rod, every tenth that cometh shall be sanctified to the Lord.\"},{\"verse\":33,\"text\":\"It shall not be chosen neither good nor bad, neither shall it be changed for another. If any man change it: both that which was changed, and that for which it was changed, shall be sanctified to the Lord, and shall not be redeemed.\"},{\"verse\":34,\"text\":\"These are the precepts which the Lord commanded Moses for the children of Israel in mount Sinai.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere filiis Israël, et dices ad eos : Homo qui votum fecerit, et spoponderit Deo animam suam, sub æstimatione dabit pretium.\"},{\"verse\":3,\"text\":\"Si fuerit masculus a vigesimo anno usque ad sexagesimum annum, dabit quinquaginta siclos argenti ad mensuram sanctuarii :\"},{\"verse\":4,\"text\":\"si mulier, triginta.\"},{\"verse\":5,\"text\":\"A quinto autem anno usque ad vigesimum, masculus dabit viginti siclos : femina, decem.\"},{\"verse\":6,\"text\":\"Ab uno mense usque ad annum quintum, pro masculo dabuntur quinque sicli : pro femina, tres.\"},{\"verse\":7,\"text\":\"Sexagenarius et ultra masculus dabit quindecim siclos : femina, decem.\"},{\"verse\":8,\"text\":\"Si pauper fuerit, et æstimationem reddere non valebit, stabit coram sacerdote : et quantum ille æstimaverit, et viderit eum posse reddere, tantum dabit.\"},{\"verse\":9,\"text\":\"Animal autem, quod immolari potest Domino, si quis voverit, sanctum erit,\"},{\"verse\":10,\"text\":\"et mutari non poterit, id est, nec melius malo, nec pejus bono : quod si mutaverit, et ipsum quod mutatum est, et illud pro quo mutatum est, consecratum erit Domino.\"},{\"verse\":11,\"text\":\"Animal immundum, quod immolari Domino non potest, si quis voverit, adducetur ante sacerdotem :\"},{\"verse\":12,\"text\":\"qui judicans utrum bonum an malum sit, statuet pretium.\"},{\"verse\":13,\"text\":\"Quod si dare voluerit is qui offert, addet supra æstimationem quintam partem.\"},{\"verse\":14,\"text\":\"Homo si voverit domum suam, et sanctificaverit Domino, considerabit eam sacerdos utrum bona an mala sit, et juxta pretium, quod ab eo fuerit constitutum, venundabitur :\"},{\"verse\":15,\"text\":\"sin autem ille qui voverat, voluerit redimere eam, dabit quintam partem æstimationis supra, et habebit domum.\"},{\"verse\":16,\"text\":\"Quod si agrum possessionis suæ voverit, et consecraverit Domino, juxta mensuram sementis æstimabitur pretium : si triginta modiis hordei seritur terra, quinquaginta siclis venundetur argenti.\"},{\"verse\":17,\"text\":\"Si statim ab anno incipientis jubilæi voverit agrum, quanto valere potest, tanto æstimabitur.\"},{\"verse\":18,\"text\":\"Sin autem post aliquantum temporis, supputabit sacerdos pecuniam juxta annorum, qui reliqui sunt, numerum usque ad jubilæum, et detrahetur ex pretio.\"},{\"verse\":19,\"text\":\"Quod si voluerit redimere agrum ille qui voverat, addet quintam partem æstimatæ pecuniæ, et possidebit eum.\"},{\"verse\":20,\"text\":\"Sin autem noluerit redimere, sed alteri cuilibet fuerit venundatus, ultra eum qui voverat redimere non poterit.\"},{\"verse\":21,\"text\":\"Quia cum jubilæi venerit dies, sanctificatus erit Domino, et possessio consecrata ad jus pertinet sacerdotum.\"},{\"verse\":22,\"text\":\"Si ager emptus est, et non de possessione majorum sanctificatus fuerit Domino,\"},{\"verse\":23,\"text\":\"supputabit sacerdos juxta annorum numerum usque ad jubilæum, pretium : et dabit ille qui voverat eum, Domino.\"},{\"verse\":24,\"text\":\"In jubilæo autem revertetur ad priorem dominum, qui vendiderat eum, et habuerat in sorte possessionis suæ.\"},{\"verse\":25,\"text\":\"Omnis æstimatio siclo sanctuarii ponderabitur. Siclus viginti obolos habet.\"},{\"verse\":26,\"text\":\"Primogenita, quæ ad Dominum pertinent, nemo sanctificare poterit et vovere : sive bos, sive ovis fuerit, Domini sunt.\"},{\"verse\":27,\"text\":\"Quod si immundum est animal, redimet qui obtulit, juxta æstimationem tuam, et addet quintam partem pretii : si redimere noluerit, vendetur alteri quantocumque a te fuerit æstimatum.\"},{\"verse\":28,\"text\":\"Omne quod Domino consecratur, sive homo fuerit, sive animal, sive ager, non vendetur, nec redimi poterit. Quidquid semel fuerit consecratum, Sanctum sanctorum erit Domino :\"},{\"verse\":29,\"text\":\"et omnis consecratio, quæ offertur ab homine, non redimetur, sed morte morietur.\"},{\"verse\":30,\"text\":\"Omnes decimæ terræ, sive de frugibus, sive de pomis arborum, Domini sunt, et illi sanctificantur.\"},{\"verse\":31,\"text\":\"Si quis autem voluerit redimere decimas suas, addet quintam partem earum.\"},{\"verse\":32,\"text\":\"Omnium decimarum bovis et ovis et capræ, quæ sub pastoris virga transeunt, quidquid decimum venerit, sanctificabitur Domino.\"},{\"verse\":33,\"text\":\"Non eligetur nec bonum nec malum, nec altero commutabitur, si quis mutaverit : et quod mutatum est, et pro quo mutatum est, sanctificabitur Domino, et non redimetur.\"},{\"verse\":34,\"text\":\"Hæc sunt præcepta, quæ mandavit Dominus Moysi ad filios Israël in monte Sinai.\"}],\"summary\":\"Of vows and tithes.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":26,\"label\":\"Leviticus 26\"},\"next\":{\"usfm\":\"NUM\",\"chapter\":1,\"label\":\"Numbers 1\"}}]]\n"])</script></body></html>
