ding-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thus shalt thou say to the children of Israel: If any man of the children Israel, or of the strangers that dwell in Israel, give of his seed to the idol Moloch, dying let him die. The people of the land shall stone him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I will set my face against him: and I will cut him off from the midst of his people, because he hath given of his seed to Moloch, and hath defiled my sanctuary, and profaned my holy name.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And if the people of the land neglecting, and as it were little regarding my commandment, let alone the man that hath given of his seed to Moloch, and will not kill him:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I will set my face against that man, and his kindred, and will cut off both him and all that consented with him, to commit fornication with Moloch, out of the midst of their people.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The soul that shall go aside after magicians, and soothsayers, and shall commit fornication with them: I will set my face against that soul, and destroy it out of the midst of its people.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sanctify yourselves, and be ye holy: because I am the Lord your God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Keep my precepts, and do them. I am the Lord that sanctify you.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that curseth his father, or mother, dying let him die. He hath cursed his father, and mother: let his blood be upon him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If any man commit adultery with the wife of another, and defile his neighbour’s wife: let them be put to death, both the adulterer and the adulteress.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If a man lie with his stepmother, and discover the nakedness of his father, let them both be put to death: their blood be upon them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If any man lie with his daughter in law: let both die, because they have done a heinous crime. Their blood be upon them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>If any one lie with a man as with a woman, both have committed an abomination: let them be put to death. Their blood be upon them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If any man after marrying the daughter, marry her mother, he hath done a heinous crime. He shall be burnt alive with them: neither shall so great an abomination remain in the midst of you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He that shall copulate with any beast or cattle, dying let him die: the beast also ye shall kill.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The woman that shall lie under any beast, shall be killed together with the same. Their blood be upon them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If any man take his sister, the daughter of his father, or the daughter of his mother, and see her nakedness, and she behold her brother’s shame: they have committed a crime. They shall be slain, in the sight of their people, because they have discovered one another’s nakedness. And they shall bear their iniquity.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If any man lie with a woman in her flowers, and uncover her nakedness, and she open the fountain of her blood: both shall be destroyed out of the midst of their people.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thou shalt not uncover the nakedness of thy aunt by thy mother, and of thy aunt by thy father. He that doth this, hath uncovered the shame of his own flesh: both shall bear their iniquity.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If any man lie with the wife of his uncle by the father, or of his uncle by the mother, and uncover the shame of his near akin, both shall bear their sin. They shall die without children.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that marrieth his brother’s wife, doth an unlawful thing: he hath uncovered his brother’s nakedness. They shall be without children.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Keep my laws and my judgments, and do them: lest the land into which you are to enter to dwell therein, vomit you also out.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Walk not after the laws of the nations, which I will cast out before you. For they have done all these things: and therefore I abhorred them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But to you I say: Possess their land which I will give you for an inheritance, a land flowing with milk and honey. I am the Lord your God, who have separated you from other people.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Therefore do you also separate the clean beast from the unclean, and the clean fowl from the unclean. Defile not your souls with beasts, or birds, or any things that move on the earth, and which I have shewn you to be unclean:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>You shall be holy unto me, because I the Lord am holy: and I have separated you from other people, that you should be mine.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>A man, or woman, in whom there is a pythonical or divining spirit, dying let them die. They shall stone them. Their blood be upon them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hæc loqueris filiis Israël : Homo de filiis Israël, et de advenis qui habitant in Israël, si quis dederit de semine suo idolo Moloch, morte moriatur : populus terræ lapidabit eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ego ponam faciem meam contra illum : succidamque eum de medio populi sui, eo quod dederit de semine suo Moloch, et contaminaverit sanctuarium meum, ac polluerit nomen sanctum meum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quod si negligens populus terræ, et quasi parvipendens imperium meum, dimiserit hominem qui dedit de semine suo Moloch, nec voluerit eum occidere :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ponam faciem meam super hominem illum, et super cognationem ejus, succidamque et ipsum, et omnes qui consenserunt ei ut fornicarentur cum Moloch, de medio populi sui.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Anima, quæ declinaverit ad magos et ariolos, et fornicata fuerit cum eis, ponam faciem meam contra eam, et interficiam illam de medio populi sui.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sanctificamini et estote sancti, quia ego sum Dominus Deus vester.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Custodite præcepta mea, et facite ea : ego Dominus qui sanctifico vos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui maledixerit patri suo, aut matri, morte moriatur : patri matrique maledixit : sanguis ejus sit super eum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si mœchatus quis fuerit cum uxore alterius, et adulterium perpetraverit cum conjuge proximi sui, morte moriantur et mœchus et adultera.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui dormierit cum noverca sua, et revelaverit ignominiam patris sui, morte moriantur ambo : sanguis eorum sit super eos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si quis dormierit cum nuru sua, uterque moriatur, quia scelus operati sunt : sanguis eorum sit super eos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui dormierit cum masculo coitu femineo, uterque operatus est nefas : morte moriantur : sit sanguis eorum super eos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui supra uxorem filiam, duxerit matrem ejus, scelus operatus est : vivus ardebit cum eis, nec permanebit tantum nefas in medio vestri.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui cum jumento et pecore coierit, morte moriatur : pecus quoque occidite.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mulier, quæ succubuerit cuilibet jumento, simul interficietur cum eo : sanguis eorum sit super eos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui acceperit sororem suam filiam patris sui, vel filiam matris suæ, et viderit turpitudinem ejus, illaque conspexerit fratris ignominiam, nefariam rem operati sunt : occidentur in conspectu populi sui, eo quod turpitudinem suam mutuo revelaverint, et portabunt iniquitatem suam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui coierit cum muliere in fluxu menstruo, et revelaverit turpitudinem ejus, ipsaque aperuerit fontem sanguinis sui, interficientur ambo de medio populi sui.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Turpitudinem materteræ et amitæ tuæ non discooperies : qui hoc fecerit, ignominiam carnis suæ nudavit ; portabunt ambo iniquitatem suam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui coierit cum uxore patrui vel avunculi sui, et revelaverit ignominiam cognationis suæ, portabunt ambo peccatum suum : absque liberis morientur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui duxerit uxorem fratris sui, rem facit illicitam : turpitudinem fratris sui revelavit : absque liberis erunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Custodite leges meas, atque judicia, et facite ea : ne et vos evomat terra quam intraturi estis et habitaturi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Nolite ambulare in legitimis nationum, quas ego expulsurus sum ante vos. Omnia enim hæc fecerunt, et abominatus sum eas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Vobis autem loquor. Possidete terram eorum, quam dabo vobis in hæreditatem, terram fluentem lacte et melle. Ego Dominus Deus vester, qui separavi vos a ceteris populis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Separate ergo et vos jumentum mundum ab immundo, et avem mundam ab immunda : ne polluatis animas vestras in pecore, et avibus, et cunctis quæ moventur in terra, et quæ vobis ostendi esse polluta.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Eritis mihi sancti, quia sanctus sum ego Dominus, et separavi vos a ceteris populis, ut essetis mei.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Vir, sive mulier, in quibus pythonicus, vel divinationis fuerit spiritus, morte moriantur : lapidibus obruent eos : sanguis eorum sit super illos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=" with him, to commit fornication with Moloch, out of the midst of their people.\"},{\"verse\":6,\"text\":\"The soul that shall go aside after magicians, and soothsayers, and shall commit fornication with them: I will set my face against that soul, and destroy it out of the midst of its people.\"},{\"verse\":7,\"text\":\"Sanctify yourselves, and be ye holy: because I am the Lord your God.\"},{\"verse\":8,\"text\":\"Keep my precepts, and do them. I am the Lord that sanctify you.\"},{\"verse\":9,\"text\":\"He that curseth his father, or mother, dying let him die. He hath cursed his father, and mother: let his blood be upon him.\"},{\"verse\":10,\"text\":\"If any man commit adultery with the wife of another, and defile his neighbour’s wife: let them be put to death, both the adulterer and the adulteress.\"},{\"verse\":11,\"text\":\"If a man lie with his stepmother, and discover the nakedness of his father, let them both be put to death: their blood be upon them.\"},{\"verse\":12,\"text\":\"If any man lie with his daughter in law: let both die, because they have done a heinous crime. Their blood be upon them.\"},{\"verse\":13,\"text\":\"If any one lie with a man as with a woman, both have committed an abomination: let them be put to death. Their blood be upon them.\"},{\"verse\":14,\"text\":\"If any man after marrying the daughter, marry her mother, he hath done a heinous crime. He shall be burnt alive with them: neither shall so great an abomination remain in the midst of you.\"},{\"verse\":15,\"text\":\"He that shall copulate with any beast or cattle, dying let him die: the beast also ye shall kill.\"},{\"verse\":16,\"text\":\"The woman that shall lie under any beast, shall be killed together with the same. Their blood be upon them.\"},{\"verse\":17,\"text\":\"If any man take his sister, the daughter of his father, or the daughter of his mother, and see her nakedness, and she behold her brother’s shame: they have committed a crime. They shall be slain, in the sight of their people, because they have discovered one another’s nakedness. And they shall bear their iniquity.\"},{\"verse\":18,\"text\":\"If any man lie with a woman in her flowers, and uncover her nakedness, and she open the fountain of her blood: both shall be destroyed out of the midst of their people.\"},{\"verse\":19,\"text\":\"Thou shalt not uncover the nakedness of thy aunt by thy mother, and of thy aunt by thy father. He that doth this, hath uncovered the shame of his own flesh: both shall bear their iniquity.\"},{\"verse\":20,\"text\":\"If any man lie with the wife of his uncle by the father, or of his uncle by the mother, and uncover the shame of his near akin, both shall bear their sin. They shall die without children.\"},{\"verse\":21,\"text\":\"He that marrieth his brother’s wife, doth an unlawful thing: he hath uncovered his brother’s nakedness. They shall be without children.\"},{\"verse\":22,\"text\":\"Keep my laws and my judgments, and do them: lest the land into which you are to enter to dwell therein, vomit you also out.\"},{\"verse\":23,\"text\":\"Walk not after the laws of the nations, which I will cast out before you. For they have done all these things: and therefore I abhorred them.\"},{\"verse\":24,\"text\":\"But to you I say: Possess their land which I will give you for an inheritance, a land flowing with milk and honey. I am the Lord your God, who have separated you from other people.\"},{\"verse\":25,\"text\":\"Therefore do you also separate the clean beast from the unclean, and the clean fowl from the unclean. Defile not your souls with beasts, or birds, or any things that move on the earth, and which I have shewn you to be unclean:\"},{\"verse\":26,\"text\":\"You shall be holy unto me, because I the Lord am holy: and I have separated you from other people, that you should be mine.\"},{\"verse\":27,\"text\":\"A man, or woman, in whom there is a pythonical or divining spirit, dying let them die. They shall stone them. Their blood be upon them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Hæc loqueris filiis Israël : Homo de filiis Israël, et de advenis qui habitant in Israël, si quis dederit de semine suo idolo Moloch, morte moriatur : populus terræ lapidabit eum.\"},{\"verse\":3,\"text\":\"Et ego ponam faciem meam contra illum : succidamque eum de medio populi sui, eo quod dederit de semine suo Moloch, et contaminaverit sanctuarium meum, ac polluerit nomen sanctum meum.\"},{\"verse\":4,\"text\":\"Quod si negligens populus terræ, et quasi parvipendens imperium meum, dimiserit hominem qui dedit de semine suo Moloch, nec voluerit eum occidere :\"},{\"verse\":5,\"text\":\"ponam faciem meam super hominem illum, et super cognationem ejus, succidamque et ipsum, et omnes qui consenserunt ei ut fornicarentur cum Moloch, de medio populi sui.\"},{\"verse\":6,\"text\":\"Anima, quæ declinaverit ad magos et ariolos, et fornicata fuerit cum eis, ponam faciem meam contra eam, et interficiam illam de medio populi sui.\"},{\"verse\":7,\"text\":\"Sanctificamini et estote sancti, quia ego sum Dominus Deus vester.\"},{\"verse\":8,\"text\":\"Custodite præcepta mea, et facite ea : ego Dominus qui sanctifico vos.\"},{\"verse\":9,\"text\":\"Qui maledixerit patri suo, aut matri, morte moriatur : patri matrique maledixit : sanguis ejus sit super eum.\"},{\"verse\":10,\"text\":\"Si mœchatus quis fuerit cum uxore alterius, et adulterium perpetraverit cum conjuge proximi sui, morte moriantur et mœchus et adultera.\"},{\"verse\":11,\"text\":\"Qui dormierit cum noverca sua, et revelaverit ignominiam patris sui, morte moriantur ambo : sanguis eorum sit super eos.\"},{\"verse\":12,\"text\":\"Si quis dormierit cum nuru sua, uterque moriatur, quia scelus operati sunt : sanguis eorum sit super eos.\"},{\"verse\":13,\"text\":\"Qui dormierit cum masculo coitu femineo, uterque operatus est nefas : morte moriantur : sit sanguis eorum super eos.\"},{\"verse\":14,\"text\":\"Qui supra uxorem filiam, duxerit matrem ejus, scelus operatus est : vivus ardebit cum eis, nec permanebit tantum nefas in medio vestri.\"},{\"verse\":15,\"text\":\"Qui cum jumento et pecore coierit, morte moriatur : pecus quoque occidite.\"},{\"verse\":16,\"text\":\"Mulier, quæ succubuerit cuilibet jumento, simul interficietur cum eo : sanguis eorum sit super eos.\"},{\"verse\":17,\"text\":\"Qui acceperit sororem suam filiam patris sui, vel filiam matris suæ, et viderit turpitudinem ejus, illaque conspexerit fratris ignominiam, nefariam rem operati sunt : occidentur in conspectu populi sui, eo quod turpitudinem suam mutuo revelaverint, et portabunt iniquitatem suam.\"},{\"verse\":18,\"text\":\"Qui coierit cum muliere in fluxu menstruo, et revelaverit turpitudinem ejus, ipsaque aperuerit fontem sanguinis sui, interficientur ambo de medio populi sui.\"},{\"verse\":19,\"text\":\"Turpitudinem materteræ et amitæ tuæ non discooperies : qui hoc fecerit, ignominiam carnis suæ nudavit ; portabunt ambo iniquitatem suam.\"},{\"verse\":20,\"text\":\"Qui coierit cum uxore patrui vel avunculi sui, et revelaverit ignominiam cognationis suæ, portabunt ambo peccatum suum : absque liberis morientur.\"},{\"verse\":21,\"text\":\"Qui duxerit uxorem fratris sui, rem facit illicitam : turpitudinem fratris sui revelavit : absque liberis erunt.\"},{\"verse\":22,\"text\":\"Custodite leges meas, atque judicia, et facite ea : ne et vos evomat terra quam intraturi estis et habitaturi.\"},{\"verse\":23,\"text\":\"Nolite ambulare in legitimis nationum, quas ego expulsurus sum ante vos. Omnia enim hæc fecerunt, et abominatus sum eas.\"},{\"verse\":24,\"text\":\"Vobis autem loquor. Possidete terram eorum, quam dabo vobis in hæreditatem, terram fluentem lacte et melle. Ego Dominus Deus vester, qui separavi vos a ceteris populis.\"},{\"verse\":25,\"text\":\"Separate ergo et vos jumentum mundum ab immundo, et avem mundam ab immunda : ne polluatis animas vestras in pecore, et avibus, et cunctis quæ moventur in terra, et quæ vobis ostendi esse polluta.\"},{\"verse\":26,\"text\":\"Eritis mihi sancti, quia sanctus sum ego Dominus, et separavi vos a ceteris populis, ut essetis mei.\"},{\"verse\":27,\"text\":\"Vir, sive mulier, in quibus pythonicus, vel divinationis fuerit spiritus, morte moriantur : lapidibus obruent eos : sanguis eorum sit super illos.\"}],\"summary\":\"Divers crimes to be punished with death.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":19,\"label\":\"Leviticus 19\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":21,\"label\":\"Leviticus 21\"}}]]\n"])</script></body></html>
