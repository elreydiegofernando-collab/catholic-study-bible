"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">4</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of offerings for sins of ignorance.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Say to the children of Israel: The soul that sinneth through ignorance, and doth any thing concerning any of the commandments of the Lord, which he commanded not to be done:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>If the priest that is anointed shall sin, making the people to offend, he shall offer to the Lord for his sin a calf without blemish.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he shall bring it to the door of the testimony before the Lord: and shall put his hand upon the head thereof, and shall sacrifice it to the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He shall take also of the blood of the calf: and carry it into the tabernacle of the testimony.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And having dipped his finger in the blood, he shall sprinkle with it seven times before the Lord, before the veil of the sanctuary.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he shall put some of the same blood upon the horns of the altar of the sweet incense most acceptable to the Lord, which is in the tabernacle of the testimony. And he shall pour all the rest of the blood at the foot of the altar of holocaust in the entry of the tabernacle.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he shall take off the fat of the calf for the sin offering, as well that which covereth the entrails, as all the inwards:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The two little kidneys, and the caul that is upon them, which is by the flanks, and the fat of the liver with the little kidneys:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>As it is taken off from the calf of the sacrifice of peace offerings. And he shall burn them upon the altar of holocaust.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the skin and all the flesh with the head and the feet and the bowels and the dung:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the rest of the body, he shall carry forth without the camp into a clean place where the ashes are wont to be poured out: and he shall burn them upon a pile of wood. They shall be burnt in the place where the ashes are poured out.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And if all the multitude of Israel shall be ignorant, and through ignorance shall do that which is against the commandment of the Lord,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And afterwards shall understand their sin: they shall offer for their sin a calf, and shall bring it to the door of the tabernacle.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the ancients of the people shall put their hands upon the head thereof before the Lord. And the calf being immolated in the sight of the Lord:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The priest that is anointed shall carry of the blood into the tabernacle of the testimony.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And shall dip his finger in it and sprinkle it seven times before the veil.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he shall put of the same blood on the horns of the altar that is before the Lord, in the tabernacle of the testimony. And the rest of the blood he shall pour at the foot of the altar of holocaust, which is at the door of the tabernacle of the testimony.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And all the fat thereof he shall take off, and shall burn it upon the altar:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Doing so with this calf, as he did also with that before. And the priest praying for them, the Lord will be merciful unto them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But the calf itself he shall carry forth without the camp, and shall burn it as he did the former calf: because it is for the sin of the multitude.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If a prince shall sin, and through ignorance do any one of the things that the law of the Lord forbiddeth,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And afterwards shall come to know his sin: he shall offer a buck goat without blemish, a sacrifice to the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he shall put his hand upon the head thereof: and when he hath immolated it in the place where the holocaust is wont to be slain before the Lord, because it is for sin,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The priest shall dip his finger in the blood of the victim for sin, touching therewith the horns of the altar of holocaust, and pouring out the rest at the foot thereof.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But the fat he shall burn upon it, as is wont to be done with the victims of peace offerings. And the priest shall pray for him, and for his sin: and it shall be forgiven him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And if any one of the people of the land shall sin through ignorance, doing any of those things that by the law of the Lord are forbidden, and offending,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And shall come to know his sin: he shall offer a she goat without blemish.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he shall put his hand upon the head of the victim that is for sin: and shall immolate it in the place of the holocaust.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the priest shall take of the blood with his finger, and shall touch the horns of the altar of holocaust: and shall pour out the rest at the foot thereof.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But taking off all the fat, as is wont to be taken away of the victims of peace offerings, he shall burn it upon the altar, for a sweet savour to the Lord: and he shall pray for him, and it shall be forgiven him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But if he offer of the flock a victim for his sin, to wit, an ewe without blemish:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He shall put his hand upon the head thereof, and shall immolate it in the place where the victims of holocausts are wont to be slain.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And the priest shall take of the blood thereof with his finger, and shall touch the horns of the altar of holocaust: and the rest he shall pour out at the foot thereof.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>All the fat also he shall take off, as the fat of the ram that is offered for peace offerings is wont to be taken away: and shall burn it upon the altar, for a burnt sacrifice of the Lord. And he shall pray for him and his sin, and it shall be forgiven him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere filiis Israël : Anima, quæ peccaverit per ignorantiam, et de universis mandatis Domini, quæ præcepit ut non fierent, quippiam fecerit :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>si sacerdos, qui unctus est, peccaverit, delinquere faciens populum, offeret pro peccato suo vitulum immaculatum Domino :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et adducet illum ad ostium tabernaculi testimonii coram Domino, ponetque manum super caput ejus, et immolabit eum Domino.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hauriet quoque de sanguine vituli, inferens illum in tabernaculum testimonii.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cumque intinxerit digitum in sanguine, asperget eo septies coram Domino contra velum sanctuarii.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ponetque de eodem sanguine super cornua altaris thymiamatis gratissimi Domino, quod est in tabernaculo testimonii : omnem autem reliquum sanguinem fundet in basim altaris holocausti in introitu tabernaculi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et adipem vituli auferet pro peccato, tam eum qui vitalia operit quam omnia quæ intrinsecus sunt :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>duos renunculos et reticulum quod est super eos juxta ilia, et adipem jecoris cum renunculis,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>sicut aufertur de vitulo hostiæ pacificorum : et adolebit ea super altare holocausti.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pellem vero et omnes carnes, cum capite et pedibus et intestinis et fimo,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et reliquo corpore, efferet extra castra in locum mundum, ubi cineres effundi solent : incendetque ea super lignorum struem, quæ in loco effusorum cinerum cremabuntur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quod si omnis turba Israël ignoraverit, et per imperitiam fecerit quod contra mandatum Domini est,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et postea intellexerit peccatum suum, offeret pro peccato suo vitulum, adducetque eum ad ostium tabernaculi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ponent seniores populi manus super caput ejus coram Domino. Immolatoque vitulo in conspectu Domini,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>inferet sacerdos, qui unctus est, de sanguine ejus in tabernaculum testimonii,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>tincto digito aspergens septies contra velum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ponetque de eodem sanguine in cornibus altaris, quod est coram Domino in tabernaculo testimonii : reliquum autem sanguinem fundet juxta basim altaris holocaustorum, quod est in ostio tabernaculi testimonii.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnemque ejus adipem tollet, et adolebit super altare :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sic faciens et de hoc vitulo quomodo fecit et prius : et rogante pro eis sacerdote, propitius erit eis Dominus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ipsum autem vitulum efferet extra castra, atque comburet sicut et priorem vitulum : quia est pro peccato multitudinis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si peccaverit princeps, et fecerit unum e pluribus per ignorantiam, quod Domini lege prohibetur :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et postea intellexerit peccatum suum, offeret hostiam Domino, hircum de capris immaculatum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ponetque manum suam super caput ejus : cumque immolaverit eum loco ubi solet mactari holocaustum coram Domino, quia pro peccato est,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>tinget sacerdos digitum in sanguine hostiæ pro peccato, tangens cornua altaris holocausti, et reliquum fundens ad basim ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Adipem vero adolebit supra, sicut in victimis pacificorum fieri solet : rogabitque pro eo sacerdos, et pro peccato ejus, et dimittetur ei.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quod si peccaverit anima per ignorantiam, de populo terræ, ut faciat quidquam de his, quæ Domini lege prohibentur, atque delinquat,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et cognoverit peccatum suum, offeret capram immaculatam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ponetque manum super caput hostiæ quæ pro peccato est, et immolabit eam in loco holocausti.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Tolletque sacerdos de sanguine in digito suo : et tangens cornua altaris holocausti, reliquum fundet ad basim ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Omnem autem adipem auferens, sicut auferri solet de victimis pacificorum, adolebit super altare in odorem suavitatis Domino : rogabitque pro eo, et dimittetur ei.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sin autem de pecoribus obtulerit victimam pro peccato, ovem scilicet immaculatam :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>ponet manum super caput ejus, et immolabit eam in loco ubi solent cædi holocaustorum hostiæ.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Sumetque sacerdos de sanguine ejus digito suo, et tangens cornua altaris holocausti, reliquum fundet ad basim ejus.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Omnem quoque adipem auferens, sicut auferri solet adeps arietis, qui immolatur pro pacificis, cremabit super altare in incensum Domini : rogabitque pro eo, et pro peccato ejus, et dimittetur ei.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:bor the testimony.\"},{\"verse\":6,\"text\":\"And having dipped his finger in the blood, he shall sprinkle with it seven times before the Lord, before the veil of the sanctuary.\"},{\"verse\":7,\"text\":\"And he shall put some of the same blood upon the horns of the altar of the sweet incense most acceptable to the Lord, which is in the tabernacle of the testimony. And he shall pour all the rest of the blood at the foot of the altar of holocaust in the entry of the tabernacle.\"},{\"verse\":8,\"text\":\"And he shall take off the fat of the calf for the sin offering, as well that which covereth the entrails, as all the inwards:\"},{\"verse\":9,\"text\":\"The two little kidneys, and the caul that is upon them, which is by the flanks, and the fat of the liver with the little kidneys:\"},{\"verse\":10,\"text\":\"As it is taken off from the calf of the sacrifice of peace offerings. And he shall burn them upon the altar of holocaust.\"},{\"verse\":11,\"text\":\"But the skin and all the flesh with the head and the feet and the bowels and the dung:\"},{\"verse\":12,\"text\":\"And the rest of the body, he shall carry forth without the camp into a clean place where the ashes are wont to be poured out: and he shall burn them upon a pile of wood. They shall be burnt in the place where the ashes are poured out.\"},{\"verse\":13,\"text\":\"And if all the multitude of Israel shall be ignorant, and through ignorance shall do that which is against the commandment of the Lord,\"},{\"verse\":14,\"text\":\"And afterwards shall understand their sin: they shall offer for their sin a calf, and shall bring it to the door of the tabernacle.\"},{\"verse\":15,\"text\":\"And the ancients of the people shall put their hands upon the head thereof before the Lord. And the calf being immolated in the sight of the Lord:\"},{\"verse\":16,\"text\":\"The priest that is anointed shall carry of the blood into the tabernacle of the testimony.\"},{\"verse\":17,\"text\":\"And shall dip his finger in it and sprinkle it seven times before the veil.\"},{\"verse\":18,\"text\":\"And he shall put of the same blood on the horns of the altar that is before the Lord, in the tabernacle of the testimony. And the rest of the blood he shall pour at the foot of the altar of holocaust, which is at the door of the tabernacle of the testimony.\"},{\"verse\":19,\"text\":\"And all the fat thereof he shall take off, and shall burn it upon the altar:\"},{\"verse\":20,\"text\":\"Doing so with this calf, as he did also with that before. And the priest praying for them, the Lord will be merciful unto them.\"},{\"verse\":21,\"text\":\"But the calf itself he shall carry forth without the camp, and shall burn it as he did the former calf: because it is for the sin of the multitude.\"},{\"verse\":22,\"text\":\"If a prince shall sin, and through ignorance do any one of the things that the law of the Lord forbiddeth,\"},{\"verse\":23,\"text\":\"And afterwards shall come to know his sin: he shall offer a buck goat without blemish, a sacrifice to the Lord.\"},{\"verse\":24,\"text\":\"And he shall put his hand upon the head thereof: and when he hath immolated it in the place where the holocaust is wont to be slain before the Lord, because it is for sin,\"},{\"verse\":25,\"text\":\"The priest shall dip his finger in the blood of the victim for sin, touching therewith the horns of the altar of holocaust, and pouring out the rest at the foot thereof.\"},{\"verse\":26,\"text\":\"But the fat he shall burn upon it, as is wont to be done with the victims of peace offerings. And the priest shall pray for him, and for his sin: and it shall be forgiven him.\"},{\"verse\":27,\"text\":\"And if any one of the people of the land shall sin through ignorance, doing any of those things that by the law of the Lord are forbidden, and offending,\"},{\"verse\":28,\"text\":\"And shall come to know his sin: he shall offer a she goat without blemish.\"},{\"verse\":29,\"text\":\"And he shall put his hand upon the head of the victim that is for sin: and shall immolate it in the place of the holocaust.\"},{\"verse\":30,\"text\":\"And the priest shall take of the blood with his finger, and shall touch the horns of the altar of holocaust: and shall pour out the rest at the foot thereof.\"},{\"verse\":31,\"text\":\"But taking off all the fat, as is wont to be taken away of the victims of peace offerings, he shall burn it upon the altar, for a sweet savour to the Lord: and he shall pray for him, and it shall be forgiven him.\"},{\"verse\":32,\"text\":\"But if he offer of the flock a victim for his sin, to wit, an ewe without blemish:\"},{\"verse\":33,\"text\":\"He shall put his hand upon the head thereof, and shall immolate it in the place where the victims of holocausts are wont to be slain.\"},{\"verse\":34,\"text\":\"And the priest shall take of the blood thereof with his finger, and shall touch the horns of the altar of holocaust: and the rest he shall pour out at the foot thereof.\"},{\"verse\":35,\"text\":\"All the fat also he shall take off, as the fat of the ram that is offered for peace offerings is wont to be taken away: and shall burn it upon the altar, for a burnt sacrifice of the Lord. And he shall pray for him and his sin, and it shall be forgiven him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere filiis Israël : Anima, quæ peccaverit per ignorantiam, et de universis mandatis Domini, quæ præcepit ut non fierent, quippiam fecerit :\"},{\"verse\":3,\"text\":\"si sacerdos, qui unctus est, peccaverit, delinquere faciens populum, offeret pro peccato suo vitulum immaculatum Domino :\"},{\"verse\":4,\"text\":\"et adducet illum ad ostium tabernaculi testimonii coram Domino, ponetque manum super caput ejus, et immolabit eum Domino.\"},{\"verse\":5,\"text\":\"Hauriet quoque de sanguine vituli, inferens illum in tabernaculum testimonii.\"},{\"verse\":6,\"text\":\"Cumque intinxerit digitum in sanguine, asperget eo septies coram Domino contra velum sanctuarii.\"},{\"verse\":7,\"text\":\"Ponetque de eodem sanguine super cornua altaris thymiamatis gratissimi Domino, quod est in tabernaculo testimonii : omnem autem reliquum sanguinem fundet in basim altaris holocausti in introitu tabernaculi.\"},{\"verse\":8,\"text\":\"Et adipem vituli auferet pro peccato, tam eum qui vitalia operit quam omnia quæ intrinsecus sunt :\"},{\"verse\":9,\"text\":\"duos renunculos et reticulum quod est super eos juxta ilia, et adipem jecoris cum renunculis,\"},{\"verse\":10,\"text\":\"sicut aufertur de vitulo hostiæ pacificorum : et adolebit ea super altare holocausti.\"},{\"verse\":11,\"text\":\"Pellem vero et omnes carnes, cum capite et pedibus et intestinis et fimo,\"},{\"verse\":12,\"text\":\"et reliquo corpore, efferet extra castra in locum mundum, ubi cineres effundi solent : incendetque ea super lignorum struem, quæ in loco effusorum cinerum cremabuntur.\"},{\"verse\":13,\"text\":\"Quod si omnis turba Israël ignoraverit, et per imperitiam fecerit quod contra mandatum Domini est,\"},{\"verse\":14,\"text\":\"et postea intellexerit peccatum suum, offeret pro peccato suo vitulum, adducetque eum ad ostium tabernaculi.\"},{\"verse\":15,\"text\":\"Et ponent seniores populi manus super caput ejus coram Domino. Immolatoque vitulo in conspectu Domini,\"},{\"verse\":16,\"text\":\"inferet sacerdos, qui unctus est, de sanguine ejus in tabernaculum testimonii,\"},{\"verse\":17,\"text\":\"tincto digito aspergens septies contra velum.\"},{\"verse\":18,\"text\":\"Ponetque de eodem sanguine in cornibus altaris, quod est coram Domino in tabernaculo testimonii : reliquum autem sanguinem fundet juxta basim altaris holocaustorum, quod est in ostio tabernaculi testimonii.\"},{\"verse\":19,\"text\":\"Omnemque ejus adipem tollet, et adolebit super altare :\"},{\"verse\":20,\"text\":\"sic faciens et de hoc vitulo quomodo fecit et prius : et rogante pro eis sacerdote, propitius erit eis Dominus.\"},{\"verse\":21,\"text\":\"Ipsum autem vitulum efferet extra castra, atque comburet sicut et priorem vitulum : quia est pro peccato multitudinis.\"},{\"verse\":22,\"text\":\"Si peccaverit princeps, et fecerit unum e pluribus per ignorantiam, quod Domini lege prohibetur :\"},{\"verse\":23,\"text\":\"et postea intellexerit peccatum suum, offeret hostiam Domino, hircum de capris immaculatum.\"},{\"verse\":24,\"text\":\"Ponetque manum suam super caput ejus : cumque immolaverit eum loco ubi solet mactari holocaustum coram Domino, quia pro peccato est,\"},{\"verse\":25,\"text\":\"tinget sacerdos digitum in sanguine hostiæ pro peccato, tangens cornua altaris holocausti, et reliquum fundens ad basim ejus.\"},{\"verse\":26,\"text\":\"Adipem vero adolebit supra, sicut in victimis pacificorum fieri solet : rogabitque pro eo sacerdos, et pro peccato ejus, et dimittetur ei.\"},{\"verse\":27,\"text\":\"Quod si peccaverit anima per ignorantiam, de populo terræ, ut faciat quidquam de his, quæ Domini lege prohibentur, atque delinquat,\"},{\"verse\":28,\"text\":\"et cognoverit peccatum suum, offeret capram immaculatam.\"},{\"verse\":29,\"text\":\"Ponetque manum super caput hostiæ quæ pro peccato est, et immolabit eam in loco holocausti.\"},{\"verse\":30,\"text\":\"Tolletque sacerdos de sanguine in digito suo : et tangens cornua altaris holocausti, reliquum fundet ad basim ejus.\"},{\"verse\":31,\"text\":\"Omnem autem adipem auferens, sicut auferri solet de victimis pacificorum, adolebit super altare in odorem suavitatis Domino : rogabitque pro eo, et dimittetur ei.\"},{\"verse\":32,\"text\":\"Sin autem de pecoribus obtulerit victimam pro peccato, ovem scilicet immaculatam :\"},{\"verse\":33,\"text\":\"ponet manum super caput ejus, et immolabit eam in loco ubi solent cædi holocaustorum hostiæ.\"},{\"verse\":34,\"text\":\"Sumetque sacerdos de sanguine ejus digito suo, et tangens cornua altaris holocausti, reliquum fundet ad basim ejus.\"},{\"verse\":35,\"text\":\"Omnem quoque adipem auferens, sicut auferri solet adeps arietis, qui immolatur pro pacificis, cremabit super altare in incensum Domini : rogabitque pro eo, et pro peccato ejus, et dimittetur ei.\"}],\"summary\":\"Of offerings for sins of ignorance.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":3,\"label\":\"Leviticus 3\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":5,\"label\":\"Leviticus 5\"}}]]\n"])</script></body></html>
