text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to Aaron and to his sons, that they beware of those things that are consecrated of the children of Israel: and defile not the name of the things sanctified to me, which they offer. I am the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Say to them and to their posterity: Every man of your race, that approacheth to those things that are consecrated, and which the children of Israel have offered to the Lord, in whom there is uncleanness, shall perish before the Lord. I am the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The man of the seed of Aaron, that is a leper, or that suffereth a running of the seed, shall not eat of those things that are sanctified to me, until he be healed. He that toucheth any thing unclean by occasion of the dead: and he whose seed goeth from him as in generation:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he that toucheth a creeping thing, or any unclean thing, the touching of which is defiling:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Shall be unclean until the evening, and shall not eat those things that are sanctified. But when he hath washed his flesh with water,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the sun is down, then being purified, he shall eat of the sanctified things, because it is his meat.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>That which dieth of itself, and that which was taken by a beast, they shall not eat, nor be defiled therewith. I am the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Let them keep my precepts, that they may not fall into sin, and die in the sanctuary, when they shall have defiled it. I am the Lord who sanctify them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>No stranger shall eat of the sanctified things: a sojourner of the priests, or a hired servant, shall not eat of them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But he whom the priest hath bought, and he that is his servant, born in his house, these shall eat of them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If the daughter of a priest be married to any of the people, she shall not eat of those things that are sanctified nor of the firstfruits.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But if she be a widow, or divorced, and having no children return to her father’s house, she shall eat of her father’s meats, as she was wont to do when she was a maid. No stranger hath leave to eat of them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He that eateth of the sanctified things through ignorance, shall add the fifth part with that which he ate, and shall give it to the priest into the sanctuary.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they shall not profane the sanctified things of the children of Israel, which they offer to the Lord:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Lest perhaps they bear the iniquity of their trespass, when they shall have eaten the sanctified things. I am the Lord who sanctify them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Speak to Aaron, and to his sons, and to all the children of Israel, and thou shalt say to them: The man of the house of Israel, and of the strangers who dwell with you, that offereth his oblation, either paying his vows, or offering of his own accord, whatsoever it be which he presenteth for a holocaust of the Lord,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To be offered by you: it shall be a male without blemish of the beeves, or of the sheep, or of the goats.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If it have a blemish you shall not offer it: neither shall it be acceptable.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The man that offereth a victim of peace offerings to the Lord, either paying his vows, or offering of his own accord, whether of beeves or of sheep, shall offer it without blemish, that it may be acceptable. There shall be no blemish in it.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If it be blind, or broken, or have a scar or blisters, or a scab, or a dry scurf: you shall not offer them to the Lord, nor burn any thing of them upon the Lord’s altar.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>An ox or a sheep, that hath the ear and the tail cut off, thou mayst offer voluntarily: but a vow may not be paid with them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>you shall not offer to the Lord any beast that hath the testicles bruised, or crushed, or cut and taken away: neither shall you do any such things in your land.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>you shall not offer bread to your God, from the hand of a stranger, nor any other thing that he would give: because they are all corrupted, and defiled. You shall not receive them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>When a bullock, or a sheep, or a goat, is brought forth, they shall be seven days under the udder of their dam: but the eighth day, and thenceforth, they may be offered to the Lord.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Whether it be a cow, or a sheep, they shall not be sacrificed the same day with their young ones.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>If you immolate a victim for thanksgiving to the Lord, that he may be favourable,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>You shall eat it the same day. There shall not any of it remain until the morning of the next day. I am the Lord.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Keep my commandments, and do them. I am the Lord.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Profane not my holy name, that I may be sanctified in the midst of the children of Israel. I am the Lord who sanctify you:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And who brought you out of the land of Egypt, that I might be your God. I am the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutus quoque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere ad Aaron et ad filios ejus, ut caveant ab his quæ consecrata sunt filiorum Israël, et non contaminent nomen sanctificatorum mihi, quæ ipsi offerunt. Ego Dominus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dic ad eos, et ad posteros eorum : Omnis homo qui accesserit de stirpe vestra ad ea quæ consecrata sunt, et quæ obtulerunt filii Israël Domino, in quo est immunditia, peribit coram Domino. Ego sum Dominus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Homo de semine Aaron, qui fuerit leprosus, aut patiens fluxum seminis, non vescetur de his quæ sanctificata sunt mihi, donec sanetur. Qui tetigerit immundum super mortuo, et ex quo egreditur semen quasi coitus,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et qui tangit reptile, et quodlibet immundum cujus tactus est sordidus,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>immundus erit usque ad vesperum, et non vescetur his quæ sanctificata sunt : sed cum laverit carnem suam aqua,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et occubuerit sol, tunc mundatus vescetur de sanctificatis, quia cibus illius est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Morticinum et captum a bestia non comedent, nec polluentur in eis. Ego sum Dominus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Custodiant præcepta mea, ut non subjaceant peccato, et moriantur in sanctuario, cum polluerint illud. Ego Dominus qui sanctifico eos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnis alienigena non comedet de sanctificatis ; inquilinus sacerdotis et mercenarius non vescentur ex eis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quem autem sacerdos emerit, et qui vernaculus domus ejus fuerit, his comedent ex eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si filia sacerdotis cuilibet ex populo nupta fuerit, de his quæ sanctificata sunt, et de primitiis non vescetur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sin autem vidua, vel repudiata, et absque liberis reversa fuerit ad domum patris sui : sicut puella consueverat, aletur cibis patris sui. Omnis alienigena comedendi ex eis non habet potestatem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui comederit de sanctificatis per ignorantiam, addet quintam partem cum eo quod comedit, et dabit sacerdoti in sanctuarium.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nec contaminabunt sanctificata filiorum Israël, quæ offerunt Domino :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>ne forte sustineant iniquitatem delicti sui, cum sanctificata comederint. Ego Dominus qui sanctifico eos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Loquere ad Aaron et filios ejus, et ad omnes filios Israël, dicesque ad eos : Homo de domo Israël, et de advenis qui habitant apud vos, qui obtulerit oblationem suam, vel vota solvens, vel sponte offerens, quidquid illud obtulerit in holocaustum Domini,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>ut offeratur per vos, masculus immaculatus erit ex bobus, et ovibus, et ex capris :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>si maculam habuerit, non offeretis, neque erit acceptabile.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Homo qui obtulerit victimam pacificorum Domino, vel vota solvens, vel sponte offerens, tam de bobus quam de ovibus, immaculatum offeret ut acceptabile sit : omnis macula non erit in eo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si cæcum fuerit, si fractum, si cicatricem habens, si papulas, aut scabiem, aut impetiginem : non offeretis ea Domino, nec adolebitis ex eis super altare Domini.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Bovem et ovem, aure et cauda amputatis, voluntarie offerre potes, votum autem ex eis solvi non potest.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omne animal, quod vel contritis, vel tusis, vel sectis ablatisque testiculis est, non offeretis Domino, et in terra vestra hoc omnino ne faciatis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>De manu alienigenæ non offeretis panes Deo vestro, et quidquid aliud dare voluerit, quia corrupta, et maculata sunt omnia : non suscipietis ea.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Bos, ovis et capra, cum genita fuerint, septem diebus erunt sub ubere matris suæ : die autem octavo, et deinceps, offerri poterunt Domino.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sive illa bos, sive ovis, non immolabuntur una die cum fœtibus suis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Si immolaveritis hostiam pro gratiarum actione Domino, ut possit esse placabilis,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>eodem die comedetis eam : non remanebit quidquam in mane alterius diei. Ego Dominus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Custodite mandata mea, et facite ea. Ego Dominus.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ne polluatis nomen meum sanctum, ut sanctificer in medio filiorum Israël. Ego Dominus qui sanctifico vos,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>et eduxi de terra Ægypti, ut essem vobis in Deum. Ego Dominus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 21</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/23/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 23</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->22<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapter th washed his flesh with water,\"},{\"verse\":7,\"text\":\"And the sun is down, then being purified, he shall eat of the sanctified things, because it is his meat.\"},{\"verse\":8,\"text\":\"That which dieth of itself, and that which was taken by a beast, they shall not eat, nor be defiled therewith. I am the Lord.\"},{\"verse\":9,\"text\":\"Let them keep my precepts, that they may not fall into sin, and die in the sanctuary, when they shall have defiled it. I am the Lord who sanctify them.\"},{\"verse\":10,\"text\":\"No stranger shall eat of the sanctified things: a sojourner of the priests, or a hired servant, shall not eat of them.\"},{\"verse\":11,\"text\":\"But he whom the priest hath bought, and he that is his servant, born in his house, these shall eat of them.\"},{\"verse\":12,\"text\":\"If the daughter of a priest be married to any of the people, she shall not eat of those things that are sanctified nor of the firstfruits.\"},{\"verse\":13,\"text\":\"But if she be a widow, or divorced, and having no children return to her father’s house, she shall eat of her father’s meats, as she was wont to do when she was a maid. No stranger hath leave to eat of them.\"},{\"verse\":14,\"text\":\"He that eateth of the sanctified things through ignorance, shall add the fifth part with that which he ate, and shall give it to the priest into the sanctuary.\"},{\"verse\":15,\"text\":\"And they shall not profane the sanctified things of the children of Israel, which they offer to the Lord:\"},{\"verse\":16,\"text\":\"Lest perhaps they bear the iniquity of their trespass, when they shall have eaten the sanctified things. I am the Lord who sanctify them.\"},{\"verse\":17,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":18,\"text\":\"Speak to Aaron, and to his sons, and to all the children of Israel, and thou shalt say to them: The man of the house of Israel, and of the strangers who dwell with you, that offereth his oblation, either paying his vows, or offering of his own accord, whatsoever it be which he presenteth for a holocaust of the Lord,\"},{\"verse\":19,\"text\":\"To be offered by you: it shall be a male without blemish of the beeves, or of the sheep, or of the goats.\"},{\"verse\":20,\"text\":\"If it have a blemish you shall not offer it: neither shall it be acceptable.\"},{\"verse\":21,\"text\":\"The man that offereth a victim of peace offerings to the Lord, either paying his vows, or offering of his own accord, whether of beeves or of sheep, shall offer it without blemish, that it may be acceptable. There shall be no blemish in it.\"},{\"verse\":22,\"text\":\"If it be blind, or broken, or have a scar or blisters, or a scab, or a dry scurf: you shall not offer them to the Lord, nor burn any thing of them upon the Lord’s altar.\"},{\"verse\":23,\"text\":\"An ox or a sheep, that hath the ear and the tail cut off, thou mayst offer voluntarily: but a vow may not be paid with them.\"},{\"verse\":24,\"text\":\"you shall not offer to the Lord any beast that hath the testicles bruised, or crushed, or cut and taken away: neither shall you do any such things in your land.\"},{\"verse\":25,\"text\":\"you shall not offer bread to your God, from the hand of a stranger, nor any other thing that he would give: because they are all corrupted, and defiled. You shall not receive them.\"},{\"verse\":26,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":27,\"text\":\"When a bullock, or a sheep, or a goat, is brought forth, they shall be seven days under the udder of their dam: but the eighth day, and thenceforth, they may be offered to the Lord.\"},{\"verse\":28,\"text\":\"Whether it be a cow, or a sheep, they shall not be sacrificed the same day with their young ones.\"},{\"verse\":29,\"text\":\"If you immolate a victim for thanksgiving to the Lord, that he may be favourable,\"},{\"verse\":30,\"text\":\"You shall eat it the same day. There shall not any of it remain until the morning of the next day. I am the Lord.\"},{\"verse\":31,\"text\":\"Keep my commandments, and do them. I am the Lord.\"},{\"verse\":32,\"text\":\"Profane not my holy name, that I may be sanctified in the midst of the children of Israel. I am the Lord who sanctify you:\"},{\"verse\":33,\"text\":\"And who brought you out of the land of Egypt, that I might be your God. I am the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutus quoque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere ad Aaron et ad filios ejus, ut caveant ab his quæ consecrata sunt filiorum Israël, et non contaminent nomen sanctificatorum mihi, quæ ipsi offerunt. Ego Dominus.\"},{\"verse\":3,\"text\":\"Dic ad eos, et ad posteros eorum : Omnis homo qui accesserit de stirpe vestra ad ea quæ consecrata sunt, et quæ obtulerunt filii Israël Domino, in quo est immunditia, peribit coram Domino. Ego sum Dominus.\"},{\"verse\":4,\"text\":\"Homo de semine Aaron, qui fuerit leprosus, aut patiens fluxum seminis, non vescetur de his quæ sanctificata sunt mihi, donec sanetur. Qui tetigerit immundum super mortuo, et ex quo egreditur semen quasi coitus,\"},{\"verse\":5,\"text\":\"et qui tangit reptile, et quodlibet immundum cujus tactus est sordidus,\"},{\"verse\":6,\"text\":\"immundus erit usque ad vesperum, et non vescetur his quæ sanctificata sunt : sed cum laverit carnem suam aqua,\"},{\"verse\":7,\"text\":\"et occubuerit sol, tunc mundatus vescetur de sanctificatis, quia cibus illius est.\"},{\"verse\":8,\"text\":\"Morticinum et captum a bestia non comedent, nec polluentur in eis. Ego sum Dominus.\"},{\"verse\":9,\"text\":\"Custodiant præcepta mea, ut non subjaceant peccato, et moriantur in sanctuario, cum polluerint illud. Ego Dominus qui sanctifico eos.\"},{\"verse\":10,\"text\":\"Omnis alienigena non comedet de sanctificatis ; inquilinus sacerdotis et mercenarius non vescentur ex eis.\"},{\"verse\":11,\"text\":\"Quem autem sacerdos emerit, et qui vernaculus domus ejus fuerit, his comedent ex eis.\"},{\"verse\":12,\"text\":\"Si filia sacerdotis cuilibet ex populo nupta fuerit, de his quæ sanctificata sunt, et de primitiis non vescetur.\"},{\"verse\":13,\"text\":\"Sin autem vidua, vel repudiata, et absque liberis reversa fuerit ad domum patris sui : sicut puella consueverat, aletur cibis patris sui. Omnis alienigena comedendi ex eis non habet potestatem.\"},{\"verse\":14,\"text\":\"Qui comederit de sanctificatis per ignorantiam, addet quintam partem cum eo quod comedit, et dabit sacerdoti in sanctuarium.\"},{\"verse\":15,\"text\":\"Nec contaminabunt sanctificata filiorum Israël, quæ offerunt Domino :\"},{\"verse\":16,\"text\":\"ne forte sustineant iniquitatem delicti sui, cum sanctificata comederint. Ego Dominus qui sanctifico eos.\"},{\"verse\":17,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":18,\"text\":\"Loquere ad Aaron et filios ejus, et ad omnes filios Israël, dicesque ad eos : Homo de domo Israël, et de advenis qui habitant apud vos, qui obtulerit oblationem suam, vel vota solvens, vel sponte offerens, quidquid illud obtulerit in holocaustum Domini,\"},{\"verse\":19,\"text\":\"ut offeratur per vos, masculus immaculatus erit ex bobus, et ovibus, et ex capris :\"},{\"verse\":20,\"text\":\"si maculam habuerit, non offeretis, neque erit acceptabile.\"},{\"verse\":21,\"text\":\"Homo qui obtulerit victimam pacificorum Domino, vel vota solvens, vel sponte offerens, tam de bobus quam de ovibus, immaculatum offeret ut acceptabile sit : omnis macula non erit in eo.\"},{\"verse\":22,\"text\":\"Si cæcum fuerit, si fractum, si cicatricem habens, si papulas, aut scabiem, aut impetiginem : non offeretis ea Domino, nec adolebitis ex eis super altare Domini.\"},{\"verse\":23,\"text\":\"Bovem et ovem, aure et cauda amputatis, voluntarie offerre potes, votum autem ex eis solvi non potest.\"},{\"verse\":24,\"text\":\"Omne animal, quod vel contritis, vel tusis, vel sectis ablatisque testiculis est, non offeretis Domino, et in terra vestra hoc omnino ne faciatis.\"},{\"verse\":25,\"text\":\"De manu alienigenæ non offeretis panes Deo vestro, et quidquid aliud dare voluerit, quia corrupta, et maculata sunt omnia : non suscipietis ea.\"},{\"verse\":26,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":27,\"text\":\"Bos, ovis et capra, cum genita fuerint, septem diebus erunt sub ubere matris suæ : die autem octavo, et deinceps, offerri poterunt Domino.\"},{\"verse\":28,\"text\":\"Sive illa bos, sive ovis, non immolabuntur una die cum fœtibus suis.\"},{\"verse\":29,\"text\":\"Si immolaveritis hostiam pro gratiarum actione Domino, ut possit esse placabilis,\"},{\"verse\":30,\"text\":\"eodem die comedetis eam : non remanebit quidquam in mane alterius diei. Ego Dominus.\"},{\"verse\":31,\"text\":\"Custodite mandata mea, et facite ea. Ego Dominus.\"},{\"verse\":32,\"text\":\"Ne polluatis nomen meum sanctum, ut sanctificer in medio filiorum Israël. Ego Dominus qui sanctifico vos,\"},{\"verse\":33,\"text\":\"et eduxi de terra Ægypti, ut essem vobis in Deum. Ego Dominus.\"}],\"summary\":\"Who may eat the holy things: and what things may be offered.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":21,\"label\":\"Leviticus 21\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":23,\"label\":\"Leviticus 23\"}}]]\n"])</script></body></html>
