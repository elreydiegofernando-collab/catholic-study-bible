<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Leviticus 14 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LEV/">About <!-- -->Leviticus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The rites of sacrifices in cleansing the leprosy. Leprosy in houses.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>This is the rite of a leper, when he is to be cleansed. He shall be brought to the priest:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Who going out of the camp, when he shall find that the leprosy is cleansed,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Shall command him that is to be purified, to offer for himself two living sparrows, which it is lawful to eat, and cedar wood, and scarlet, and hyssop.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he shall command one of the sparrows to be immolated in an earthen vessel over living waters.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But the other that is alive, he shall dip, with the cedar wood, and the scarlet and the hyssop, in the blood of the sparrow that is immolated:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Wherewith he shall sprinkle him that is to be cleansed seven times, that he may be rightly purified. And he shall let go the living sparrow, that it may fly into the field.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the man hath washed his clothes, he shall shave all the hair of his body, and shall be washed with water: and being purified he shall enter into the camp, yet so that he tarry without his own tent seven days.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And on the seventh day he shall shave the hair of his head, and his beard and his eyebrows, and the hair of all his body. And having washed again his clothes, and his body,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>On the eighth day, he shall take two lambs without blemish, and an ewe of a year old without blemish, and three tenths of flour tempered with oil for a sacrifice, and a sextary of oil apart.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when the priest that purifieth the man, hath presented him, and all these things before the Lord, at the door of the tabernacle of the testimony:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He shall take a lamb, and offer it for a trespass offering with the sextary of oil. And having offered all before the Lord,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He shall immolate the lamb, where the victim for sin is wont to be immolated, and the holocaust, that is, in the holy place. For as that which is for sin, so also the victim for a trespass offering pertaineth to the priest: it is holy of holies.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the priest taking of the blood of the victim that was immolated for trespass, shall put it upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he shall pour of the sextary of oil into his own left hand,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And shall dip his right finger in it, and sprinkle it before the Lord seven times.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the rest of the oil in his left hand, he shall pour upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot, and upon the blood that was shed for trespass:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And upon his head.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he shall pray for him before the Lord, and shall offer the sacrifice for sin. Then shall he immolate the holocaust.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And put it on the altar with the libations thereof: and the man shall be rightly cleansed.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But if he be poor, and his hand cannot find the things aforesaid: he shall take a lamb for an offering for trespass, that the priest may pray for him, and a tenth part of flour tempered with oil for a sacrifice, and a sextary of oil:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And two turtles or two young pigeons, of which one may be for sin, and the other for a holocaust.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he shall offer them on the eighth day of his purification to the priest, at the door of the tabernacle of the testimony before the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the priest receiving the lamb for trespass, and the sextary of oil, shall elevate them together.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the lamb being immolated, he shall put of the blood thereof upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand, and the great toe of his right foot.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But he shall pour part of the oil into his own left hand,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And dipping the finger of his right hand in it, he shall sprinkle it seven times before the Lord.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he shall touch the tip of the right ear of him that is cleansed, and the thumb of his right hand and the great toe of his right foot, in the place of the blood that was shed for trespass.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the other part of the oil that is in his left hand, he shall pour upon the head of the purified person, that he may appease the Lord for him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he shall offer a turtle, or young pigeon:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>One for trespass, and the other for a holocaust, with their libations.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>This is the sacrifice of a leper, that is not able to have all things that appertain to his cleansing.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>When you shall come into the land of Chanaan, which I will give you for a possession, if there be the plague of leprosy in a house:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>He whose house it is, shall go and tell the priest, saying: It seemeth to me, that there is the plague of leprosy in my house,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he shall command, that they carry forth all things out of the house, before he go into it, and see whether it have the leprosy, let all things become unclean that are in the house. And afterwards he shall go in to view the leprosy of the house.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And if he see in the walls thereof as it were little dints, disfigured with paleness or redness, and lower than all he rest:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>He shall go out of the door of the house, and forthwith shut it up seven days,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And returning on the seventh day, he shall look upon it. If he find that the leprosy is spread,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>He shall command, that the stones wherein the leprosy is, be taken out, and cast without the city into an unclean place:</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And that the house be scraped on the inside round about, and the dust of the scrapings be scattered without the city into an unclean place:</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And that other stones be laid in the place of them that were taken away, and the house be plastered with other mortar.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>But if after the stones be taken out, and the dust scraped off, and it be plastered with other earth.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>The priest going in perceive that the leprosy is returned, and the walls full of spots, it is a lasting leprosy, and the house is unclean.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And they shall destroy it forthwith, and shall cast the stones and timber thereof, and all the dust without the town into an unclean place.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>He that entereth into the house when it is shut, shall be unclean until evening,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And he that sleepeth in it, and eateth any thing, shall wash his clothes.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>But if the priest going in perceive that the leprosy is not spread in the house, after it was plastered again, he shall purify it, it being cured.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And for the purification thereof he shall take two sparrows, and cedar wood, and scarlet, and hyssop.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And having immolated one sparrow in an earthen vessel, over living waters,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>He shall take the cedar wood, and the hyssop, and the scarlet, and the living sparrow, and shall dip all in the blood of the sparrow that is immolated, and in the living water: and he shall sprinkle the house seven times.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And shall purify it as well with the blood of the sparrow, as with the living water, and with the living sparrow, and with the cedar wood, and the hyssop, and the scarlet.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And when he hath let go the sparrow to fly freely away into the field, he shall pray for the house: and it shall be rightly cleansed.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>This is the law of every kind of leprosy and stroke.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Of the leprosy of garments and houses,</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Of a scar and of blisters breaking out of a shining spot, and when the colours are diversely changed:</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>That it may be known when a thing is clean or unclean.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hic est ritus leprosi, quando mundandus est. Adducetur ad sacerdotem :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>qui egressus de castris, cum invenerit lepram esse mundatam,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>præcipiet ei, qui purificatur, ut offerat duos passeres vivos pro se, quibus vesci licitum est, et lignum cedrinum, vermiculumque et hyssopum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et unum ex passeribus immolari jubebit in vase fictili super aquas viventes :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>alium autem vivum cum ligno cedrino, et cocco et hyssopo, tinget in sanguine passeris immolati,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quo asperget illum, qui mundandus est, septies, ut jure purgetur : et dimittet passerem vivum, ut in agrum avolet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cumque laverit homo vestimenta sua, radet omnes pilos corporis, et lavabitur aqua : purificatusque ingredietur castra, ita dumtaxat ut maneat extra tabernaculum suum septem diebus,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et die septimo radet capillos capitis, barbamque et supercilia, ac totius corporis pilos. Et lotis rursum vestibus et corpore,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>die octavo assumet duos agnos immaculatos, et ovem anniculam absque macula, et tres decimas similæ in sacrificium, quæ conspersa sit oleo, et seorsum olei sextarium.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cumque sacerdos purificans hominem, statuerit eum, et hæc omnia coram Domino in ostio tabernaculi testimonii,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>tollet agnum et offeret eum pro delicto, oleique sextarium : et oblatis ante Dominum omnibus,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>immolabit agnum, ubi solet immolari hostia pro peccato, et holocaustum, id est, in loco sancto. Sicut enim pro peccato, ita et pro delicto ad sacerdotem pertinet hostia : Sancta sanctorum est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Assumensque sacerdos de sanguine hostiæ, quæ immolata est pro delicto, ponet super extremum auriculæ dextræ ejus qui mundatur, et super pollices manus dextræ et pedis :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et de olei sextario mittet in manum suam sinistram,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>tingetque digitum dextrum in eo, et asperget coram Domino septies.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quod autem reliquum est olei in læva manu, fundet super extremum auriculæ dextræ ejus qui mundatur, et super pollices manus ac pedis dextri, et super sanguinem qui effusus est pro delicto,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et super caput ejus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Rogabitque pro eo coram Domino, et faciet sacrificium pro peccato : tunc immolabit holocaustum,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et ponet illud in altari cum libamentis suis, et homo rite mundabitur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quod si pauper est, et non potest manus ejus invenire quæ dicta sunt pro delicto, assumet agnum ad oblationem, ut roget pro eo sacerdos, decimamque partem similæ conspersæ oleo in sacrificium, et olei sextarium,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>duosque turtures sive duos pullos columbæ, quorum unus sit pro peccato, et alter in holocaustum :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>offeretque ea die octavo purificationis suæ sacerdoti, ad ostium tabernaculi testimonii coram Domino.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui suscipiens agnum pro delicto et sextarium olei, levabit simul :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>immolatoque agno, de sanguine ejus ponet super extremum auriculæ dextræ illius qui mundatur, et super pollices manus ejus ac pedis dextri :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>olei vero partem mittet in manum suam sinistram,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>in quo tingens digitum dextræ manus asperget septies coram Domino :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>tangetque extremum dextræ auriculæ illius qui mundatur, et pollices manus ac pedis dextri, in loco sanguinis qui effusus est pro delicto :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>reliquam autem partem olei, quæ est in sinistra manu, mittet super caput purificati, ut placet pro eo Dominum :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et turturem sive pullum columbæ offeret,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>unum pro delicto, et alterum in holocaustum cum libamentis suis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Hoc est sacrificium leprosi, qui habere non potest omnia in emundationem sui.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Locutusque est Dominus ad Moysen et Aaron, dicens :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Cum ingressi fueritis terram Chanaan, quam ego dabo vobis in possessionem, si fuerit plaga lepræ in ædibus,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>ibit cujus est domus, nuntians sacerdoti, et dicet : Quasi plaga lepræ videtur mihi esse in domo mea.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>At ille præcipiet ut efferant universa de domo, priusquam ingrediatur eam, et videat utrum leprosa sit, ne immunda fiant omnia quæ in domo sunt. Intrabitque postea ut consideret lepram domus :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et cum viderit in parietibus illius quasi valliculas pallore sive rubore deformes, et humiliores superficie reliqua,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>egredietur ostium domus, et statim claudet illam septem diebus.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Reversusque die septimo, considerabit eam : si invenerit crevisse lepram,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>jubebit erui lapides in quibus lepra est, et projici eos extra civitatem in locum immundum :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>domum autem ipsam radi intrinsecus per circuitum, et spargi pulverem rasuræ extra urbem in locum immundum,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>lapidesque alios reponi pro his qui ablati fuerint, et luto alio liniri domum.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Sin autem postquam eruti sunt lapides, et pulvis erasus, et alia terra lita,</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>ingressus sacerdos viderit reversam lepram, et parietes respersos maculis, lepra est perseverans, et immunda domus :</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>quam statim destruent, et lapides ejus ac ligna, atque universum pulverem projicient extra oppidum in locum immundum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Qui intraverit domum quando clausa est, immundus erit usque ad vesperum :</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>et qui dormierit in ea, et comederit quippiam, lavabit vestimenta sua.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Quod si introiens sacerdos viderit lepram non crevisse in domo, postquam denuo lita fuerit, purificabit eam reddita sanitate :</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>et in purificationem ejus sumet duos passeres, lignumque cedrinum, et vermiculum atque hyssopum :</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>et immolato uno passere in vase fictili super aquas vivas,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>tollet lignum cedrinum, et hyssopum, et coccum, et passerem vivum, et tinget omnia in sanguine passeris immolati, atque in aquis viventibus, et asperget domum septies,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>purificabitque eam tam in sanguine passeris quam in aquis viventibus, et in passere vivo, lignoque cedrino et hyssopo atque vermiculo.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Cumque dimiserit passerem avolare in agrum libere, orabit pro domo, et jure mundabitur.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Ista est lex omnis lepræ et percussuræ,</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>lepræ vestium et domorum,</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>cicatricis et erumpentium papularum, lucentis maculæ, et in varias species, coloribus immutatis,</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>ut possit sciri quo tempore mundum quid, vel immundum sit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></s o the priest:\"},{\"verse\":3,\"text\":\"Who going out of the camp, when he shall find that the leprosy is cleansed,\"},{\"verse\":4,\"text\":\"Shall command him that is to be purified, to offer for himself two living sparrows, which it is lawful to eat, and cedar wood, and scarlet, and hyssop.\"},{\"verse\":5,\"text\":\"And he shall command one of the sparrows to be immolated in an earthen vessel over living waters.\"},{\"verse\":6,\"text\":\"But the other that is alive, he shall dip, with the cedar wood, and the scarlet and the hyssop, in the blood of the sparrow that is immolated:\"},{\"verse\":7,\"text\":\"Wherewith he shall sprinkle him that is to be cleansed seven times, that he may be rightly purified. And he shall let go the living sparrow, that it may fly into the field.\"},{\"verse\":8,\"text\":\"And when the man hath washed his clothes, he shall shave all the hair of his body, and shall be washed with water: and being purified he shall enter into the camp, yet so that he tarry without his own tent seven days.\"},{\"verse\":9,\"text\":\"And on the seventh day he shall shave the hair of his head, and his beard and his eyebrows, and the hair of all his body. And having washed again his clothes, and his body,\"},{\"verse\":10,\"text\":\"On the eighth day, he shall take two lambs without blemish, and an ewe of a year old without blemish, and three tenths of flour tempered with oil for a sacrifice, and a sextary of oil apart.\"},{\"verse\":11,\"text\":\"And when the priest that purifieth the man, hath presented him, and all these things before the Lord, at the door of the tabernacle of the testimony:\"},{\"verse\":12,\"text\":\"He shall take a lamb, and offer it for a trespass offering with the sextary of oil. And having offered all before the Lord,\"},{\"verse\":13,\"text\":\"He shall immolate the lamb, where the victim for sin is wont to be immolated, and the holocaust, that is, in the holy place. For as that which is for sin, so also the victim for a trespass offering pertaineth to the priest: it is holy of holies.\"},{\"verse\":14,\"text\":\"And the priest taking of the blood of the victim that was immolated for trespass, shall put it upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot.\"},{\"verse\":15,\"text\":\"And he shall pour of the sextary of oil into his own left hand,\"},{\"verse\":16,\"text\":\"And shall dip his right finger in it, and sprinkle it before the Lord seven times.\"},{\"verse\":17,\"text\":\"And the rest of the oil in his left hand, he shall pour upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand and the great toe of his right foot, and upon the blood that was shed for trespass:\"},{\"verse\":18,\"text\":\"And upon his head.\"},{\"verse\":19,\"text\":\"And he shall pray for him before the Lord, and shall offer the sacrifice for sin. Then shall he immolate the holocaust.\"},{\"verse\":20,\"text\":\"And put it on the altar with the libations thereof: and the man shall be rightly cleansed.\"},{\"verse\":21,\"text\":\"But if he be poor, and his hand cannot find the things aforesaid: he shall take a lamb for an offering for trespass, that the priest may pray for him, and a tenth part of flour tempered with oil for a sacrifice, and a sextary of oil:\"},{\"verse\":22,\"text\":\"And two turtles or two young pigeons, of which one may be for sin, and the other for a holocaust.\"},{\"verse\":23,\"text\":\"And he shall offer them on the eighth day of his purification to the priest, at the door of the tabernacle of the testimony before the Lord.\"},{\"verse\":24,\"text\":\"And the priest receiving the lamb for trespass, and the sextary of oil, shall elevate them together.\"},{\"verse\":25,\"text\":\"And the lamb being immolated, he shall put of the blood thereof upon the tip of the right ear of him that is cleansed, and upon the thumb of his right hand, and the great toe of his right foot.\"},{\"verse\":26,\"text\":\"But he shall pour part of the oil into his own left hand,\"},{\"verse\":27,\"text\":\"And dipping the finger of his right hand in it, he shall sprinkle it seven times before the Lord.\"},{\"verse\":28,\"text\":\"And he shall touch the tip of the right ear of him that is cleansed, and the thumb of his right hand and the great toe of his right foot, in the place of the blood that was shed for trespass.\"},{\"verse\":29,\"text\":\"And the other part of the oil that is in his left hand, he shall pour upon the head of the purified person, that he may appease the Lord for him.\"},{\"verse\":30,\"text\":\"And he shall offer a turtle, or young pigeon:\"},{\"verse\":31,\"text\":\"One for trespass, and the other for a holocaust, with their libations.\"},{\"verse\":32,\"text\":\"This is the sacrifice of a leper, that is not able to have all things that appertain to his cleansing.\"},{\"verse\":33,\"text\":\"And the Lord spoke to Moses and Aaron, saying:\"},{\"verse\":34,\"text\":\"When you shall come into the land of Chanaan, which I will give you for a possession, if there be the plague of leprosy in a house:\"},{\"verse\":35,\"text\":\"He whose house it is, shall go and tell the priest, saying: It seemeth to me, that there is the plague of leprosy in my house,\"},{\"verse\":36,\"text\":\"And he shall command, that they carry forth all things out of the house, before he go into it, and see whether it have the leprosy, let all things become unclean that are in the house. And afterwards he shall go in to view the leprosy of the house.\"},{\"verse\":37,\"text\":\"And if he see in the walls thereof as it were little dints, disfigured with paleness or redness, and lower than all he rest:\"},{\"verse\":38,\"text\":\"He shall go out of the door of the house, and forthwith shut it up seven days,\"},{\"verse\":39,\"text\":\"And returning on the seventh day, he shall look upon it. If he find that the leprosy is spread,\"},{\"verse\":40,\"text\":\"He shall command, that the stones wherein the leprosy is, be taken out, and cast without the city into an unclean place:\"},{\"verse\":41,\"text\":\"And that the house be scraped on the inside round about, and the dust of the scrapings be scattered without the city into an unclean place:\"},{\"verse\":42,\"text\":\"And that other stones be laid in the place of them that were taken away, and the house be plastered with other mortar.\"},{\"verse\":43,\"text\":\"But if after the stones be taken out, and the dust scraped off, and it be plastered with other earth.\"},{\"verse\":44,\"text\":\"The priest going in perceive that the leprosy is returned, and the walls full of spots, it is a lasting leprosy, and the house is unclean.\"},{\"verse\":45,\"text\":\"And they shall destroy it forthwith, and shall cast the stones and timber thereof, and all the dust without the town into an unclean place.\"},{\"verse\":46,\"text\":\"He that entereth into the house when it is shut, shall be unclean until evening,\"},{\"verse\":47,\"text\":\"And he that sleepeth in it, and eateth any thing, shall wash his clothes.\"},{\"verse\":48,\"text\":\"But if the priest going in perceive that the leprosy is not spread in the house, after it was plastered again, he shall purify it, it being cured.\"},{\"verse\":49,\"text\":\"And for the purification thereof he shall take two sparrows, and cedar wood, and scarlet, and hyssop.\"},{\"verse\":50,\"text\":\"And having immolated one sparrow in an earthen vessel, over living waters,\"},{\"verse\":51,\"text\":\"He shall take the cedar wood, and the hyssop, and the scarlet, and the living sparrow, and shall dip all in the blood of the sparrow that is immolated, and in the living water: and he shall sprinkle the house seven times.\"},{\"verse\":52,\"text\":\"And shall purify it as well with the blood of the sparrow, as with the living water, and with the living sparrow, and with the cedar wood, and the hyssop, and the scarlet.\"},{\"verse\":53,\"text\":\"And when he hath let go the sparrow to fly freely away into the field, he shall pray for the house: and it shall be rightly cleansed.\"},{\"verse\":54,\"text\":\"This is the law of every kind of leprosy and stroke.\"},{\"verse\":55,\"text\":\"Of the leprosy of garments and houses,\"},{\"verse\":56,\"text\":\"Of a scar and of blisters breaking out of a shining spot, and when the colours are diversely changed:\"},{\"verse\":57,\"text\":\"That it may be known when a thing is clean or unclean.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Hic est ritus leprosi, quando mundandus est. Adducetur ad sacerdotem :\"},{\"verse\":3,\"text\":\"qui egressus de castris, cum invenerit lepram esse mundatam,\"},{\"verse\":4,\"text\":\"præcipiet ei, qui purificatur, ut offerat duos passeres vivos pro se, quibus vesci licitum est, et lignum cedrinum, vermiculumque et hyssopum.\"},{\"verse\":5,\"text\":\"Et unum ex passeribus immolari jubebit in vase fictili super aquas viventes :\"},{\"verse\":6,\"text\":\"alium autem vivum cum ligno cedrino, et cocco et hyssopo, tinget in sanguine passeris immolati,\"},{\"verse\":7,\"text\":\"quo asperget illum, qui mundandus est, septies, ut jure purgetur : et dimittet passerem vivum, ut in agrum avolet.\"},{\"verse\":8,\"text\":\"Cumque laverit homo vestimenta sua, radet omnes pilos corporis, et lavabitur aqua : purificatusque ingredietur castra, ita dumtaxat ut maneat extra tabernaculum suum septem diebus,\"},{\"verse\":9,\"text\":\"et die septimo radet capillos capitis, barbamque et supercilia, ac totius corporis pilos. Et lotis rursum vestibus et corpore,\"},{\"verse\":10,\"text\":\"die octavo assumet duos agnos immaculatos, et ovem anniculam absque macula, et tres decimas similæ in sacrificium, quæ conspersa sit oleo, et seorsum olei sextarium.\"},{\"verse\":11,\"text\":\"Cumque sacerdos purificans hominem, statuerit eum, et hæc omnia coram Domino in ostio tabernaculi testimonii,\"},{\"verse\":12,\"text\":\"tollet agnum et offeret eum pro delicto, oleique sextarium : et oblatis ante Dominum omnibus,\"},{\"verse\":13,\"text\":\"immolabit agnum, ubi solet immolari hostia pro peccato, et holocaustum, id est, in loco sancto. Sicut enim pro peccato, ita et pro delicto ad sacerdotem pertinet hostia : Sancta sanctorum est.\"},{\"verse\":14,\"text\":\"Assumensque sacerdos de sanguine hostiæ, quæ immolata est pro delicto, ponet super extremum auriculæ dextræ ejus qui mundatur, et super pollices manus dextræ et pedis :\"},{\"verse\":15,\"text\":\"et de olei sextario mittet in manum suam sinistram,\"},{\"verse\":16,\"text\":\"tingetque digitum dextrum in eo, et asperget coram Domino septies.\"},{\"verse\":17,\"text\":\"Quod autem reliquum est olei in læva manu, fundet super extremum auriculæ dextræ ejus qui mundatur, et super pollices manus ac pedis dextri, et super sanguinem qui effusus est pro delicto,\"},{\"verse\":18,\"text\":\"et super caput ejus.\"},{\"verse\":19,\"text\":\"Rogabitque pro eo coram Domino, et faciet sacrificium pro peccato : tunc immolabit holocaustum,\"},{\"verse\":20,\"text\":\"et ponet illud in altari cum libamentis suis, et homo rite mundabitur.\"},{\"verse\":21,\"text\":\"Quod si pauper est, et non potest manus ejus invenire quæ dicta sunt pro delicto, assumet agnum ad oblationem, ut roget pro eo sacerdos, decimamque partem similæ conspersæ oleo in sacrificium, et olei sextarium,\"},{\"verse\":22,\"text\":\"duosque turtures sive duos pullos columbæ, quorum unus sit pro peccato, et alter in holocaustum :\"},{\"verse\":23,\"text\":\"offeretque ea die octavo purificationis suæ sacerdoti, ad ostium tabernaculi testimonii coram Domino.\"},{\"verse\":24,\"text\":\"Qui suscipiens agnum pro delicto et sextarium olei, levabit simul :\"},{\"verse\":25,\"text\":\"immolatoque agno, de sanguine ejus ponet super extremum auriculæ dextræ illius qui mundatur, et super pollices manus ejus ac pedis dextri :\"},{\"verse\":26,\"text\":\"olei vero partem mittet in manum suam sinistram,\"},{\"verse\":27,\"text\":\"in quo tingens digitum dextræ manus asperget septies coram Domino :\"},{\"verse\":28,\"text\":\"tangetque extremum dextræ auriculæ illius qui mundatur, et pollices manus ac pedis dextri, in loco sanguinis qui effusus est pro delicto :\"},{\"verse\":29,\"text\":\"reliquam autem partem olei, quæ est in sinistra manu, mittet super caput purificati, ut placet pro eo Dominum :\"},{\"verse\":30,\"text\":\"et turturem sive pullum columbæ offeret,\"},{\"verse\":31,\"text\":\"unum pro delicto, et alterum in holocaustum cum libamentis suis.\"},{\"verse\":32,\"text\":\"Hoc est sacrificium leprosi, qui habere non potest omnia in emundationem sui.\"},{\"verse\":33,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, dicens :\"},{\"verse\":34,\"text\":\"Cum ingressi fueritis terram Chanaan, quam ego dabo vobis in possessionem, si fuerit plaga lepræ in ædibus,\"},{\"verse\":35,\"text\":\"ibit cujus est domus, nuntians sacerdoti, et dicet : Quasi plaga lepræ videtur mihi esse in domo mea.\"},{\"verse\":36,\"text\":\"At ille præcipiet ut efferant universa de domo, priusquam ingrediatur eam, et videat utrum leprosa sit, ne immunda fiant omnia quæ in domo sunt. Intrabitque postea ut consideret lepram domus :\"},{\"verse\":37,\"text\":\"et cum viderit in parietibus illius quasi valliculas pallore sive rubore deformes, et humiliores superficie reliqua,\"},{\"verse\":38,\"text\":\"egredietur ostium domus, et statim claudet illam septem diebus.\"},{\"verse\":39,\"text\":\"Reversusque die septimo, considerabit eam : si invenerit crevisse lepram,\"},{\"verse\":40,\"text\":\"jubebit erui lapides in quibus lepra est, et projici eos extra civitatem in locum immundum :\"},{\"verse\":41,\"text\":\"domum autem ipsam radi intrinsecus per circuitum, et spargi pulverem rasuræ extra urbem in locum immundum,\"},{\"verse\":42,\"text\":\"lapidesque alios reponi pro his qui ablati fuerint, et luto alio liniri domum.\"},{\"verse\":43,\"text\":\"Sin autem postquam eruti sunt lapides, et pulvis erasus, et alia terra lita,\"},{\"verse\":44,\"text\":\"ingressus sacerdos viderit reversam lepram, et parietes respersos maculis, lepra est perseverans, et immunda domus :\"},{\"verse\":45,\"text\":\"quam statim destruent, et lapides ejus ac ligna, atque universum pulverem projicient extra oppidum in locum immundum.\"},{\"verse\":46,\"text\":\"Qui intraverit domum quando clausa est, immundus erit usque ad vesperum :\"},{\"verse\":47,\"text\":\"et qui dormierit in ea, et comederit quippiam, lavabit vestimenta sua.\"},{\"verse\":48,\"text\":\"Quod si introiens sacerdos viderit lepram non crevisse in domo, postquam denuo lita fuerit, purificabit eam reddita sanitate :\"},{\"verse\":49,\"text\":\"et in purificationem ejus sumet duos passeres, lignumque cedrinum, et vermiculum atque hyssopum :\"},{\"verse\":50,\"text\":\"et immolato uno passere in vase fictili super aquas vivas,\"},{\"verse\":51,\"text\":\"tollet lignum cedrinum, et hyssopum, et coccum, et passerem vivum, et tinget omnia in sanguine passeris immolati, atque in aquis viventibus, et asperget domum septies,\"},{\"verse\":52,\"text\":\"purificabitque eam tam in sanguine passeris quam in aquis viventibus, et in passere vivo, lignoque cedrino et hyssopo atque vermiculo.\"},{\"verse\":53,\"text\":\"Cumque dimiserit passerem avolare in agrum libere, orabit pro domo, et jure mundabitur.\"},{\"verse\":54,\"text\":\"Ista est lex omnis lepræ et percussuræ,\"},{\"verse\":55,\"text\":\"lepræ vestium et domorum,\"},{\"verse\":56,\"text\":\"cicatricis et erumpentium papularum, lucentis maculæ, et in varias species, coloribus immutatis,\"},{\"verse\":57,\"text\":\"ut possit sciri quo tempore mundum quid, vel immundum sit.\"}],\"summary\":\"The rites of sacrifices in cleansing the leprosy. Leprosy in houses.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":13,\"label\":\"Leviticus 13\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":15,\"label\":\"Leviticus 15\"}}]]\n"])</script></body></html>
