pe="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And if his oblation be a sacrifice of peace offerings, and he will offer of the herd, whether male or female: he shall offer them without blemish before the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he shall lay his hand upon the head of his victim, which shall be slain in the entry of the tabernacle of the testimony: and the sons of Aaron the priests shall pour the blood round about upon the altar.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And they shall offer of the sacrifice of peace offerings, for an oblation to the Lord: the fat that covereth the entrails, and all the fat that is within,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The two kidneys with the fat wherewith the flanks are covered, and the caul of the liver with the two little kidneys.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they shall burn them upon the altar, for a holocaust, putting fire under the wood: for an oblation of most sweet savour to the Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But if his oblation and the sacrifice of peace offering be of the flock, whether he offer male or female, they shall be without blemish.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If he offer a lamb before the Lord:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He shall put his hand upon the head of the victim. And it shall be slain in the entry of the tabernacle of the testimony: and the sons of Aaron shall pour the blood thereof round about upon the altar.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they shall offer of the victim of peace offerings, a sacrifice to the Lord: the fat and the whole rump,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>With the kidneys, and the fat that covereth the belly and all the vitals and both the little kidneys, with the fat that is about the flanks, and the caul of the liver with the little kidneys.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the priest shall burn them upon the altar, for the food of the fire, and of the oblation of the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If his offering be a goat, and he offer it to the Lord:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He shall put his hand upon the head thereof: and shall immolate it in the entry of the tabernacle of the testimony. And the sons of Aaron shall pour the blood thereof round about upon the altar.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they shall take of it for the food of the Lord’s fire, the fat that covereth the belly, and that covereth all the vital parts:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The two little kidneys with the caul that is upon them which is by the flanks, and the fat of the liver with the little kidneys.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the priest shall burn them upon the altar, for the food of the fire, and of a most sweet savour. All the fat shall be the Lord’s.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>By a perpetual law for your generations, and in all your habitations: neither blood nor fat shall you eat at all.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quod si hostia pacificorum fuerit ejus oblatio, et de bobus voluerit offerre, marem sive feminam, immaculata offeret coram Domino.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ponetque manum super caput victimæ suæ, quæ immolabitur in introitu tabernaculi testimonii, fundentque filii Aaron sacerdotes sanguinem per altaris circuitum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et offerent de hostia pacificorum in oblationem Domino, adipem qui operit vitalia, et quidquid pinguedinis est intrinsecus :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>duos renes cum adipe quo teguntur ilia, et reticulum jecoris cum renunculis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Adolebuntque ea super altare in holocaustum, lignis igne supposito, in oblationem suavissimi odoris Domino.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si vero de ovibus fuerit ejus oblatio et pacificorum hostia, sive masculum obtulerit, sive feminam, immaculata erunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si agnum obtulerit coram Domino,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>ponet manum suam super caput victimæ suæ : quæ immolabitur in vestibulo tabernaculi testimonii : fundentque filii Aaron sanguinem ejus per circuitum altaris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et offerent de pacificorum hostia sacrificium Domino : adipem et caudam totam</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>cum renibus, et pinguedinem quæ operit ventrem atque universa vitalia, et utrumque renunculum cum adipe qui est juxta ilia, reticulumque jecoris cum renunculis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et adolebit ea sacerdos super altare in pabulum ignis et oblationis Domini.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si capra fuerit ejus oblatio, et obtulerit eam Domino,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ponet manum suam super caput ejus : immolabitque eam in introitu tabernaculi testimonii, et fundent filii Aaron sanguinem ejus per altaris circuitum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tollentque ex ea in pastum ignis dominici, adipem qui operit ventrem, et qui tegit universa vitalia :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>duos renunculos cum reticulo, quod est super eos juxta ilia, et arvinam jecoris cum renunculis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>adolebitque ea super altare sacerdos in alimoniam ignis, et suavissimi odoris. Omnis adeps, Domini erit</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>jure perpetuo in generationibus, et cunctis habitaculis vestris : nec sanguinem nec adipem omnino comedetis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block tr e tabernacle of the testimony: and the sons of Aaron the priests shall pour the blood round about upon the altar.\"},{\"verse\":3,\"text\":\"And they shall offer of the sacrifice of peace offerings, for an oblation to the Lord: the fat that covereth the entrails, and all the fat that is within,\"},{\"verse\":4,\"text\":\"The two kidneys with the fat wherewith the flanks are covered, and the caul of the liver with the two little kidneys.\"},{\"verse\":5,\"text\":\"And they shall burn them upon the altar, for a holocaust, putting fire under the wood: for an oblation of most sweet savour to the Lord.\"},{\"verse\":6,\"text\":\"But if his oblation and the sacrifice of peace offering be of the flock, whether he offer male or female, they shall be without blemish.\"},{\"verse\":7,\"text\":\"If he offer a lamb before the Lord:\"},{\"verse\":8,\"text\":\"He shall put his hand upon the head of the victim. And it shall be slain in the entry of the tabernacle of the testimony: and the sons of Aaron shall pour the blood thereof round about upon the altar.\"},{\"verse\":9,\"text\":\"And they shall offer of the victim of peace offerings, a sacrifice to the Lord: the fat and the whole rump,\"},{\"verse\":10,\"text\":\"With the kidneys, and the fat that covereth the belly and all the vitals and both the little kidneys, with the fat that is about the flanks, and the caul of the liver with the little kidneys.\"},{\"verse\":11,\"text\":\"And the priest shall burn them upon the altar, for the food of the fire, and of the oblation of the Lord.\"},{\"verse\":12,\"text\":\"If his offering be a goat, and he offer it to the Lord:\"},{\"verse\":13,\"text\":\"He shall put his hand upon the head thereof: and shall immolate it in the entry of the tabernacle of the testimony. And the sons of Aaron shall pour the blood thereof round about upon the altar.\"},{\"verse\":14,\"text\":\"And they shall take of it for the food of the Lord’s fire, the fat that covereth the belly, and that covereth all the vital parts:\"},{\"verse\":15,\"text\":\"The two little kidneys with the caul that is upon them which is by the flanks, and the fat of the liver with the little kidneys.\"},{\"verse\":16,\"text\":\"And the priest shall burn them upon the altar, for the food of the fire, and of a most sweet savour. All the fat shall be the Lord’s.\"},{\"verse\":17,\"text\":\"By a perpetual law for your generations, and in all your habitations: neither blood nor fat shall you eat at all.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quod si hostia pacificorum fuerit ejus oblatio, et de bobus voluerit offerre, marem sive feminam, immaculata offeret coram Domino.\"},{\"verse\":2,\"text\":\"Ponetque manum super caput victimæ suæ, quæ immolabitur in introitu tabernaculi testimonii, fundentque filii Aaron sacerdotes sanguinem per altaris circuitum.\"},{\"verse\":3,\"text\":\"Et offerent de hostia pacificorum in oblationem Domino, adipem qui operit vitalia, et quidquid pinguedinis est intrinsecus :\"},{\"verse\":4,\"text\":\"duos renes cum adipe quo teguntur ilia, et reticulum jecoris cum renunculis.\"},{\"verse\":5,\"text\":\"Adolebuntque ea super altare in holocaustum, lignis igne supposito, in oblationem suavissimi odoris Domino.\"},{\"verse\":6,\"text\":\"Si vero de ovibus fuerit ejus oblatio et pacificorum hostia, sive masculum obtulerit, sive feminam, immaculata erunt.\"},{\"verse\":7,\"text\":\"Si agnum obtulerit coram Domino,\"},{\"verse\":8,\"text\":\"ponet manum suam super caput victimæ suæ : quæ immolabitur in vestibulo tabernaculi testimonii : fundentque filii Aaron sanguinem ejus per circuitum altaris.\"},{\"verse\":9,\"text\":\"Et offerent de pacificorum hostia sacrificium Domino : adipem et caudam totam\"},{\"verse\":10,\"text\":\"cum renibus, et pinguedinem quæ operit ventrem atque universa vitalia, et utrumque renunculum cum adipe qui est juxta ilia, reticulumque jecoris cum renunculis.\"},{\"verse\":11,\"text\":\"Et adolebit ea sacerdos super altare in pabulum ignis et oblationis Domini.\"},{\"verse\":12,\"text\":\"Si capra fuerit ejus oblatio, et obtulerit eam Domino,\"},{\"verse\":13,\"text\":\"ponet manum suam super caput ejus : immolabitque eam in introitu tabernaculi testimonii, et fundent filii Aaron sanguinem ejus per altaris circuitum.\"},{\"verse\":14,\"text\":\"Tollentque ex ea in pastum ignis dominici, adipem qui operit ventrem, et qui tegit universa vitalia :\"},{\"verse\":15,\"text\":\"duos renunculos cum reticulo, quod est super eos juxta ilia, et arvinam jecoris cum renunculis :\"},{\"verse\":16,\"text\":\"adolebitque ea super altare sacerdos in alimoniam ignis, et suavissimi odoris. Omnis adeps, Domini erit\"},{\"verse\":17,\"text\":\"jure perpetuo in generationibus, et cunctis habitaculis vestris : nec sanguinem nec adipem omnino comedetis.\"}],\"summary\":\"Of peace offerings.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":2,\"label\":\"Leviticus 2\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":4,\"label\":\"Leviticus 4\"}}]]\n"])</script></body></html>
