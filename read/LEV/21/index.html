"h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LEV/">About <!-- -->Leviticus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Ordinances relating to the priests.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The Lord said also to Moses: Speak to the priests the sons of Aaron, and thou shalt say to them: Let not a priest incur an uncleanness at the death of his citizens.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But only for his kin, such as are near in blood: that is to say, for his father and for his mother, and for his son, and for his daughter, for his brother also:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And for a maiden sister, who hath had no husband.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But not even for the prince of his people shall he do any thing that may make him unclean.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Neither shall they shave their head, nor their beard, nor make incisions in their flesh.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They shall be holy to their God, and shall not profane his name. For they offer the burnt offering of the Lord, and the bread of their God: and therefore they shall be holy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They shall not take to wife a harlot or a vile prostitute, nor one that has been put away from her husband: because they are consecrated to their God,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And offer the loaves of proposition. Let them therefore be holy because I also am holy: the Lord, who sanctify them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If the daughter of a priest be taken in whoredom and dishonour the name of her father, she shall be burnt with fire.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The high priest, that is to say, the priest who is the greatest among his brethren, upon whose head the oil of unction hath been poured; and whose hands have been consecrated for the priesthood; and who hath been vested with the holy vestments. He shall not uncover his head: he shall not rend his garments.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nor shall he go in at all to any dead person: not even for his father, or his mother, shall he be defiled.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Neither shall he go out of the holy places, lest he defile the sanctuary of the Lord: because the oil of the holy unction of his God is upon him. I am the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He shall take a virgin unto his wife.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But a widow or one that is divorced, or defiled, or a harlot, he shall not take: but a maid of his own people.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He shall not mingle the stock of his kindred with the common people of this nation: for I am the Lord who sanctify him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Say to Aaron: Whosoever of thy seed throughout their families, hath a blemish, he shall not offer bread to his God.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Neither shall he approach to minister to him: If he be blind; if he be lame; if he have a little, or a great, or a crooked nose;</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If his foot, or if his hand be broken;</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If he be crookbacked; or blear eyed; or have a pearl in his eye, or a continual scab, or a dry scurf in his body, or a rupture.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Whosoever of the seed of Aaron the priest hath a blemish: he shall not approach to offer sacrifices to the Lord, nor bread to his God.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He shall eat nevertheless of the loaves that are offered in the sanctuary.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Yet so that he enter not within the veil, nor approach to the altar: because he hath a blemish, and he must not defile my sanctuary. I am the Lord who sanctify them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Moses, therefore spoke to Aaron, and to his sons and to all Israel, all the things that had been commanded him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixit quoque Dominus ad Moysen : Loquere ad sacerdotes filios Aaron, et dices ad eos : Ne contaminetur sacerdos in mortibus civium suorum,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>nisi tantum in consanguineis, ac propinquis, id est, super patre et matre, et filio, et filia, fratre quoque,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et sorore virgine quæ non est nupta viro :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sed nec in principe populi sui contaminabitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non radent caput, nec barbam, neque in carnibus suis facient incisuras.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sancti erunt Deo suo, et non polluent nomen ejus : incensum enim Domini, et panes Dei sui offerunt, et ideo sancti erunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Scortum et vile prostibulum non ducent uxorem, nec eam quæ repudiata est a marito : quia consecrati sunt Deo suo,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et panes propositionis offerunt. Sint ergo sancti, quia et ego sanctus sum, Dominus qui sanctifico eos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sacerdotis filia si deprehensa fuerit in stupro, et violaverit nomen patris sui, flammis exuretur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pontifex, id est, sacerdos maximus inter fratres suos, super cujus caput fusum est unctionis oleum, et cujus manus in sacerdotio consecratæ sunt, vestitusque est sanctis vestibus, caput suum non discooperiet, vestimenta non scindet :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et ad omnem mortuum non ingredietur omnino : super patre quoque suo et matre non contaminabitur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nec egredietur de sanctis, ne polluat sanctuarium Domini, quia oleum sanctæ unctionis Dei sui super eum est. Ego Dominus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Virginem ducet uxorem :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>viduam autem et repudiatam, et sordidam, atque meretricem non accipiet, sed puellam de populo suo :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ne commisceat stirpem generis sui vulgo gentis suæ : quia ego Dominus, qui sanctifico eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Loquere ad Aaron : Homo de semine tuo per familias qui habuerit maculam, non offeret panes Deo suo,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>nec accedet ad ministerium ejus : si cæcus fuerit, si claudus, si parvo vel grandi, vel torto naso,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>si fracto pede, si manu,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>si gibbus, si lippus, si albuginem habens in oculo, si jugem scabiem, si impetiginem in corpore, vel herniosus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Omnis qui habuerit maculam de semine Aaron sacerdotis, non accedet offerre hostias Domino, nec panes Deo suo :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>vescetur tamen panibus qui offeruntur in sanctuario,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>ita dumtaxat, ut intra velum non ingrediatur, nec accedat ad altare, quia maculam habet, et contaminare non debet sanctuarium meum. Ego Dominus qui sanctifico eos.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Locutus est ergo Moyses ad Aaron, et ad filios ejus, et ad omnem Israël cuncta quæ fuerant sibi imperata.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border- fm\":\"LEV\",\"bookName\":\"Leviticus\",\"drName\":\"Leviticus\",\"chapter\":21,\"totalChapters\":27,\"dra\":[{\"verse\":1,\"text\":\"The Lord said also to Moses: Speak to the priests the sons of Aaron, and thou shalt say to them: Let not a priest incur an uncleanness at the death of his citizens.\"},{\"verse\":2,\"text\":\"But only for his kin, such as are near in blood: that is to say, for his father and for his mother, and for his son, and for his daughter, for his brother also:\"},{\"verse\":3,\"text\":\"And for a maiden sister, who hath had no husband.\"},{\"verse\":4,\"text\":\"But not even for the prince of his people shall he do any thing that may make him unclean.\"},{\"verse\":5,\"text\":\"Neither shall they shave their head, nor their beard, nor make incisions in their flesh.\"},{\"verse\":6,\"text\":\"They shall be holy to their God, and shall not profane his name. For they offer the burnt offering of the Lord, and the bread of their God: and therefore they shall be holy.\"},{\"verse\":7,\"text\":\"They shall not take to wife a harlot or a vile prostitute, nor one that has been put away from her husband: because they are consecrated to their God,\"},{\"verse\":8,\"text\":\"And offer the loaves of proposition. Let them therefore be holy because I also am holy: the Lord, who sanctify them.\"},{\"verse\":9,\"text\":\"If the daughter of a priest be taken in whoredom and dishonour the name of her father, she shall be burnt with fire.\"},{\"verse\":10,\"text\":\"The high priest, that is to say, the priest who is the greatest among his brethren, upon whose head the oil of unction hath been poured; and whose hands have been consecrated for the priesthood; and who hath been vested with the holy vestments. He shall not uncover his head: he shall not rend his garments.\"},{\"verse\":11,\"text\":\"Nor shall he go in at all to any dead person: not even for his father, or his mother, shall he be defiled.\"},{\"verse\":12,\"text\":\"Neither shall he go out of the holy places, lest he defile the sanctuary of the Lord: because the oil of the holy unction of his God is upon him. I am the Lord.\"},{\"verse\":13,\"text\":\"He shall take a virgin unto his wife.\"},{\"verse\":14,\"text\":\"But a widow or one that is divorced, or defiled, or a harlot, he shall not take: but a maid of his own people.\"},{\"verse\":15,\"text\":\"He shall not mingle the stock of his kindred with the common people of this nation: for I am the Lord who sanctify him.\"},{\"verse\":16,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":17,\"text\":\"Say to Aaron: Whosoever of thy seed throughout their families, hath a blemish, he shall not offer bread to his God.\"},{\"verse\":18,\"text\":\"Neither shall he approach to minister to him: If he be blind; if he be lame; if he have a little, or a great, or a crooked nose;\"},{\"verse\":19,\"text\":\"If his foot, or if his hand be broken;\"},{\"verse\":20,\"text\":\"If he be crookbacked; or blear eyed; or have a pearl in his eye, or a continual scab, or a dry scurf in his body, or a rupture.\"},{\"verse\":21,\"text\":\"Whosoever of the seed of Aaron the priest hath a blemish: he shall not approach to offer sacrifices to the Lord, nor bread to his God.\"},{\"verse\":22,\"text\":\"He shall eat nevertheless of the loaves that are offered in the sanctuary.\"},{\"verse\":23,\"text\":\"Yet so that he enter not within the veil, nor approach to the altar: because he hath a blemish, and he must not defile my sanctuary. I am the Lord who sanctify them.\"},{\"verse\":24,\"text\":\"Moses, therefore spoke to Aaron, and to his sons and to all Israel, all the things that had been commanded him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixit quoque Dominus ad Moysen : Loquere ad sacerdotes filios Aaron, et dices ad eos : Ne contaminetur sacerdos in mortibus civium suorum,\"},{\"verse\":2,\"text\":\"nisi tantum in consanguineis, ac propinquis, id est, super patre et matre, et filio, et filia, fratre quoque,\"},{\"verse\":3,\"text\":\"et sorore virgine quæ non est nupta viro :\"},{\"verse\":4,\"text\":\"sed nec in principe populi sui contaminabitur.\"},{\"verse\":5,\"text\":\"Non radent caput, nec barbam, neque in carnibus suis facient incisuras.\"},{\"verse\":6,\"text\":\"Sancti erunt Deo suo, et non polluent nomen ejus : incensum enim Domini, et panes Dei sui offerunt, et ideo sancti erunt.\"},{\"verse\":7,\"text\":\"Scortum et vile prostibulum non ducent uxorem, nec eam quæ repudiata est a marito : quia consecrati sunt Deo suo,\"},{\"verse\":8,\"text\":\"et panes propositionis offerunt. Sint ergo sancti, quia et ego sanctus sum, Dominus qui sanctifico eos.\"},{\"verse\":9,\"text\":\"Sacerdotis filia si deprehensa fuerit in stupro, et violaverit nomen patris sui, flammis exuretur.\"},{\"verse\":10,\"text\":\"Pontifex, id est, sacerdos maximus inter fratres suos, super cujus caput fusum est unctionis oleum, et cujus manus in sacerdotio consecratæ sunt, vestitusque est sanctis vestibus, caput suum non discooperiet, vestimenta non scindet :\"},{\"verse\":11,\"text\":\"et ad omnem mortuum non ingredietur omnino : super patre quoque suo et matre non contaminabitur.\"},{\"verse\":12,\"text\":\"Nec egredietur de sanctis, ne polluat sanctuarium Domini, quia oleum sanctæ unctionis Dei sui super eum est. Ego Dominus.\"},{\"verse\":13,\"text\":\"Virginem ducet uxorem :\"},{\"verse\":14,\"text\":\"viduam autem et repudiatam, et sordidam, atque meretricem non accipiet, sed puellam de populo suo :\"},{\"verse\":15,\"text\":\"ne commisceat stirpem generis sui vulgo gentis suæ : quia ego Dominus, qui sanctifico eum.\"},{\"verse\":16,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":17,\"text\":\"Loquere ad Aaron : Homo de semine tuo per familias qui habuerit maculam, non offeret panes Deo suo,\"},{\"verse\":18,\"text\":\"nec accedet ad ministerium ejus : si cæcus fuerit, si claudus, si parvo vel grandi, vel torto naso,\"},{\"verse\":19,\"text\":\"si fracto pede, si manu,\"},{\"verse\":20,\"text\":\"si gibbus, si lippus, si albuginem habens in oculo, si jugem scabiem, si impetiginem in corpore, vel herniosus.\"},{\"verse\":21,\"text\":\"Omnis qui habuerit maculam de semine Aaron sacerdotis, non accedet offerre hostias Domino, nec panes Deo suo :\"},{\"verse\":22,\"text\":\"vescetur tamen panibus qui offeruntur in sanctuario,\"},{\"verse\":23,\"text\":\"ita dumtaxat, ut intra velum non ingrediatur, nec accedat ad altare, quia maculam habet, et contaminare non debet sanctuarium meum. Ego Dominus qui sanctifico eos.\"},{\"verse\":24,\"text\":\"Locutus est ergo Moyses ad Aaron, et ad filios ejus, et ad omnem Israël cuncta quæ fuerant sibi imperata.\"}],\"summary\":\"Ordinances relating to the priests.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":20,\"label\":\"Leviticus 20\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":22,\"label\":\"Leviticus 22\"}}]]\n"])</script></body></html>
