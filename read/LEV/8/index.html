atholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LEV/">About <!-- -->Leviticus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Moses consecrateth Aaron and his sons.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Take Aaron with his sons, their vestments, and the oil of unction: a calf for sin, two rams, a basket with unleavened bread.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And thou shalt gather together all the congregation to the door of the tabernacle.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Moses did as the Lord had commanded. And all the multitude being gathered together before the door of the tabernacle:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He said: This is the word that the Lord hath commanded to be done.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And immediately, he offered Aaron and his sons. And when he had washed them,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He vested the high priest with the strait linen garment, girding him with the girdle, and putting on him the violet tunick: and over it he put the ephod.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And binding it with the girdle, he fitted it to the rational, on which was Doctrine and Truth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He put also the mitre upon his head: and upon the mitre over the forehead, he put the plate of gold, consecrated with sanctification, as the Lord had commanded him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He took also the oil of unction, with which he anointed the tabernacle, with all the furniture thereof.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when he had sanctified and sprinkled the altar seven times, he anointed it, and all the vessels thereof: and the laver with the foot thereof, he sanctified with the oil.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he poured it upon Aaron’s head: and he anointed and consecrated him.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And after he had offered his sons, he vested them with linen tunicks, and girded them with girdles: and put mitres on them as the Lord had commanded.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He offered also the calf for sin: and when Aaron and his sons had put their hands upon the head thereof,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He immolated it: and took the blood, and dipping his finger in it, he touched the horns of the altar round about. Which being expiated, and sanctified, he poured the rest of the blood at the bottom thereof.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But the fat that was upon the entrails, and the caul of the liver, and the two little kidneys, with their fat, he burnt upon the altar.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the calf with the skin, and the flesh and the dung, he burnt without the camp, as the Lord had commanded.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He offered also a ram for holocaust. And when Aaron and his sons had put their hands upon its head:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He immolated it, and poured the blood thereof round about the altar.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And cutting the ram into pieces, the head thereof, and the joints, and the fat he burnt in the fire.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Having first washed the entrails, and the feet, and the whole ram together he burnt upon the altar: because it was a holocaust of most sweet odour to the Lord, as he had commanded him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He offered also the second ram, in the consecration of priests: and Aaron, and his sons put their hands upon the head thereof.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And when Moses had immolated it, he took of the blood thereof, and touched the tip of Aaron’s right ear, and the thumb of his right hand, and in like manner also the great toe of his right foot.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He offered also the sons of Aaron: and when with the blood of the ram that was immolated, he had touched the tip of the right ear of every one of them, and the thumbs of their right hands, and the great toes of their right feet, the rest he poured on the altar round about.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But the fat, and the rump, and all the fat that covereth the entrails, and the caul of the liver, and the two kidneys with their fat, and with the right shoulder, he separated.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And taking out of the basket of unleavened bread, which was before the Lord, a loaf without leaven, and a cake tempered with oil and a wafer, he put them upon the fat, and the right shoulder:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Delivering all to Aaron, and to his sons. Who having lifted them up before the Lord,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He took them again from their hands, and burnt them upon the altar of holocaust: because it was the oblation of consecration, for a sweet odour of sacrifice to the Lord.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he took of the ram of consecration, the breast for his portion, elevating it before the Lord, as the Lord had commanded him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And taking the ointment, and the blood that was upon the altar, he sprinkled Aaron, and his vestments, and his sons, and their vestments with it.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And when he had sanctified them in their vestments, he commanded them, saying: Boil the flesh before the door of the tabernacle, and there eat it. Eat ye also the loaves of consecration, that are laid in the basket, as the Lord commanded me, saying: Aaron and his sons shall eat them.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And whatsoever shall be left of the flesh and the loaves, shall be consumed with fire.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And you shall not go out of the door of the tabernacle for seven days, until the day wherein the time of your consecration shall be expired. For in seven days the consecration is finished:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>As at this present it hath been done, that the rite of the sacrifice might be accomplished.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Day and night shall you remain in the tabernacle observing the watches of the Lord, lest you die. For so it hath been commanded me.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And Aaron and his sons did all things which the Lord spoke by the hand of Moses.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tolle Aaron cum filiis suis, vestes eorum, et unctionis oleum, vitulum pro peccato, duos arietes, canistrum cum azymis :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et congregabis omnem cœtum ad ostium tabernaculi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Fecit Moyses ut Dominus imperaverat. Congregataque omni turba ante fores tabernaculi,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ait : Iste est sermo, quem jussit Dominus fieri.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Statimque obtulit Aaron et filios ejus. Cumque lavisset eos,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>vestivit pontificem subucula linea, accingens eum balteo, et induens eum tunica hyacinthina, et desuper humerale imposuit,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>quod astringens cingulo aptavit rationali, in quo erat Doctrina et Veritas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cidari quoque texit caput : et super eam, contra frontem, posuit laminam auream consecratam in sanctificatione, sicut præceperat ei Dominus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Tulit et unctionis oleum, quo linivit tabernaculum cum omni supellectili sua.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cumque sanctificans aspersisset altare septem vicibus, unxit illud, et omnia vasa ejus, labrumque cum basi sua sanctificavit oleo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quod fundens super caput Aaron, unxit eum, et consecravit :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>filios quoque ejus oblatos vestivit tunicis lineis, et cinxit balteis, imposuitque mitras, ut jusserat Dominus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Obtulit et vitulum pro peccato : cumque super caput ejus posuisset Aaron et filii ejus manus suas,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>immolavit eum, hauriens sanguinem, et tincto digito, tetigit cornua altaris per gyrum : quo expiato et sanctificato, fudit reliquum sanguinem ad fundamenta ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Adipem vero qui erat super vitalia, et reticulum jecoris, duosque renunculos, cum arvinulis suis, adolevit super altare :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>vitulum cum pelle, et carnibus, et fimo, cremans extra castra, sicut præceperat Dominus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Obtulit et arietem in holocaustum : super cujus caput cum imposuissent Aaron et filii ejus manus suas,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>immolavit eum, et fudit sanguinem ejus per circuitum altaris.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ipsumque arietem in frusta concidens, caput ejus, et artus, et adipem adolevit igni,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>lotis prius intestinis et pedibus : totumque simul arietem incendit super altare, eo quod esset holocaustum suavissimi odoris Domino, sicut præceperat ei.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Obtulit et arietem secundum in consecratione sacerdotum, posueruntque super caput ejus Aaron et filii ejus manus suas :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quem cum immolasset Moyses, sumens de sanguine ejus, tetigit extremum auriculæ dextræ Aaron, et pollicem manus ejus dextræ, similiter et pedis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Obtulit et filios Aaron : cumque de sanguine arietis immolati tetigisset extremum auriculæ singulorum dextræ, et pollices manus ac pedis dextri, reliquum fudit super altare per circuitum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>adipem vero, et caudam, omnemque pinguedinem quæ operit intestina, reticulumque jecoris, et duos renes cum adipibus suis et armo dextro separavit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tollens autem de canistro azymorum, quod erat coram Domino, panem absque fermento, et collyridam conspersam oleo, laganumque, posuit super adipes, et armum dextrum,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>tradens simul omnia Aaron et filiis ejus. Qui postquam levaverunt ea coram Domino,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>rursum suscepta de manibus eorum, adolevit super altare holocausti, eo quod consecrationis esset oblatio, in odorem suavitatis, sacrificii Domino.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Tulitque pectusculum, elevans illud coram Domino, de ariete consecrationis in partem suam, sicut præceperat ei Dominus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Assumensque unguentum, et sanguinem qui erat in altari, aspersit super Aaron et vestimenta ejus, et super filios illius ac vestes eorum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cumque sanctificasset eos in vestitu suo, præcepit eis, dicens : Coquite carnes ante fores tabernaculi, et ibi comedite eas ; panes quoque consecrationis edite, qui positi sunt in canistro, sicut præcepit mihi Dominus, dicens : Aaron et filii ejus comedent eos :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>quidquid autem reliquum fuerit de carne et panibus, ignis absumet.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>De ostio quoque tabernaculi non exibitis septem diebus, usque ad diem quo complebitur tempus consecrationis vestræ ; septem enim diebus finitur consecratio :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sicut et impræsentiarum factum est, ut ritus sacrificii compleretur.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Die ac nocte manebitis in tabernaculo observantes custodias Domini, ne moriamini : sic enim mihi præceptum est.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Feceruntque Aaron et filii ejus cuncta quæ locutus est Dominus per manum Moysi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap= rse\":2,\"text\":\"Take Aaron with his sons, their vestments, and the oil of unction: a calf for sin, two rams, a basket with unleavened bread.\"},{\"verse\":3,\"text\":\"And thou shalt gather together all the congregation to the door of the tabernacle.\"},{\"verse\":4,\"text\":\"And Moses did as the Lord had commanded. And all the multitude being gathered together before the door of the tabernacle:\"},{\"verse\":5,\"text\":\"He said: This is the word that the Lord hath commanded to be done.\"},{\"verse\":6,\"text\":\"And immediately, he offered Aaron and his sons. And when he had washed them,\"},{\"verse\":7,\"text\":\"He vested the high priest with the strait linen garment, girding him with the girdle, and putting on him the violet tunick: and over it he put the ephod.\"},{\"verse\":8,\"text\":\"And binding it with the girdle, he fitted it to the rational, on which was Doctrine and Truth.\"},{\"verse\":9,\"text\":\"He put also the mitre upon his head: and upon the mitre over the forehead, he put the plate of gold, consecrated with sanctification, as the Lord had commanded him.\"},{\"verse\":10,\"text\":\"He took also the oil of unction, with which he anointed the tabernacle, with all the furniture thereof.\"},{\"verse\":11,\"text\":\"And when he had sanctified and sprinkled the altar seven times, he anointed it, and all the vessels thereof: and the laver with the foot thereof, he sanctified with the oil.\"},{\"verse\":12,\"text\":\"And he poured it upon Aaron’s head: and he anointed and consecrated him.\"},{\"verse\":13,\"text\":\"And after he had offered his sons, he vested them with linen tunicks, and girded them with girdles: and put mitres on them as the Lord had commanded.\"},{\"verse\":14,\"text\":\"He offered also the calf for sin: and when Aaron and his sons had put their hands upon the head thereof,\"},{\"verse\":15,\"text\":\"He immolated it: and took the blood, and dipping his finger in it, he touched the horns of the altar round about. Which being expiated, and sanctified, he poured the rest of the blood at the bottom thereof.\"},{\"verse\":16,\"text\":\"But the fat that was upon the entrails, and the caul of the liver, and the two little kidneys, with their fat, he burnt upon the altar.\"},{\"verse\":17,\"text\":\"And the calf with the skin, and the flesh and the dung, he burnt without the camp, as the Lord had commanded.\"},{\"verse\":18,\"text\":\"He offered also a ram for holocaust. And when Aaron and his sons had put their hands upon its head:\"},{\"verse\":19,\"text\":\"He immolated it, and poured the blood thereof round about the altar.\"},{\"verse\":20,\"text\":\"And cutting the ram into pieces, the head thereof, and the joints, and the fat he burnt in the fire.\"},{\"verse\":21,\"text\":\"Having first washed the entrails, and the feet, and the whole ram together he burnt upon the altar: because it was a holocaust of most sweet odour to the Lord, as he had commanded him.\"},{\"verse\":22,\"text\":\"He offered also the second ram, in the consecration of priests: and Aaron, and his sons put their hands upon the head thereof.\"},{\"verse\":23,\"text\":\"And when Moses had immolated it, he took of the blood thereof, and touched the tip of Aaron’s right ear, and the thumb of his right hand, and in like manner also the great toe of his right foot.\"},{\"verse\":24,\"text\":\"He offered also the sons of Aaron: and when with the blood of the ram that was immolated, he had touched the tip of the right ear of every one of them, and the thumbs of their right hands, and the great toes of their right feet, the rest he poured on the altar round about.\"},{\"verse\":25,\"text\":\"But the fat, and the rump, and all the fat that covereth the entrails, and the caul of the liver, and the two kidneys with their fat, and with the right shoulder, he separated.\"},{\"verse\":26,\"text\":\"And taking out of the basket of unleavened bread, which was before the Lord, a loaf without leaven, and a cake tempered with oil and a wafer, he put them upon the fat, and the right shoulder:\"},{\"verse\":27,\"text\":\"Delivering all to Aaron, and to his sons. Who having lifted them up before the Lord,\"},{\"verse\":28,\"text\":\"He took them again from their hands, and burnt them upon the altar of holocaust: because it was the oblation of consecration, for a sweet odour of sacrifice to the Lord.\"},{\"verse\":29,\"text\":\"And he took of the ram of consecration, the breast for his portion, elevating it before the Lord, as the Lord had commanded him.\"},{\"verse\":30,\"text\":\"And taking the ointment, and the blood that was upon the altar, he sprinkled Aaron, and his vestments, and his sons, and their vestments with it.\"},{\"verse\":31,\"text\":\"And when he had sanctified them in their vestments, he commanded them, saying: Boil the flesh before the door of the tabernacle, and there eat it. Eat ye also the loaves of consecration, that are laid in the basket, as the Lord commanded me, saying: Aaron and his sons shall eat them.\"},{\"verse\":32,\"text\":\"And whatsoever shall be left of the flesh and the loaves, shall be consumed with fire.\"},{\"verse\":33,\"text\":\"And you shall not go out of the door of the tabernacle for seven days, until the day wherein the time of your consecration shall be expired. For in seven days the consecration is finished:\"},{\"verse\":34,\"text\":\"As at this present it hath been done, that the rite of the sacrifice might be accomplished.\"},{\"verse\":35,\"text\":\"Day and night shall you remain in the tabernacle observing the watches of the Lord, lest you die. For so it hath been commanded me.\"},{\"verse\":36,\"text\":\"And Aaron and his sons did all things which the Lord spoke by the hand of Moses.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Tolle Aaron cum filiis suis, vestes eorum, et unctionis oleum, vitulum pro peccato, duos arietes, canistrum cum azymis :\"},{\"verse\":3,\"text\":\"et congregabis omnem cœtum ad ostium tabernaculi.\"},{\"verse\":4,\"text\":\"Fecit Moyses ut Dominus imperaverat. Congregataque omni turba ante fores tabernaculi,\"},{\"verse\":5,\"text\":\"ait : Iste est sermo, quem jussit Dominus fieri.\"},{\"verse\":6,\"text\":\"Statimque obtulit Aaron et filios ejus. Cumque lavisset eos,\"},{\"verse\":7,\"text\":\"vestivit pontificem subucula linea, accingens eum balteo, et induens eum tunica hyacinthina, et desuper humerale imposuit,\"},{\"verse\":8,\"text\":\"quod astringens cingulo aptavit rationali, in quo erat Doctrina et Veritas.\"},{\"verse\":9,\"text\":\"Cidari quoque texit caput : et super eam, contra frontem, posuit laminam auream consecratam in sanctificatione, sicut præceperat ei Dominus.\"},{\"verse\":10,\"text\":\"Tulit et unctionis oleum, quo linivit tabernaculum cum omni supellectili sua.\"},{\"verse\":11,\"text\":\"Cumque sanctificans aspersisset altare septem vicibus, unxit illud, et omnia vasa ejus, labrumque cum basi sua sanctificavit oleo.\"},{\"verse\":12,\"text\":\"Quod fundens super caput Aaron, unxit eum, et consecravit :\"},{\"verse\":13,\"text\":\"filios quoque ejus oblatos vestivit tunicis lineis, et cinxit balteis, imposuitque mitras, ut jusserat Dominus.\"},{\"verse\":14,\"text\":\"Obtulit et vitulum pro peccato : cumque super caput ejus posuisset Aaron et filii ejus manus suas,\"},{\"verse\":15,\"text\":\"immolavit eum, hauriens sanguinem, et tincto digito, tetigit cornua altaris per gyrum : quo expiato et sanctificato, fudit reliquum sanguinem ad fundamenta ejus.\"},{\"verse\":16,\"text\":\"Adipem vero qui erat super vitalia, et reticulum jecoris, duosque renunculos, cum arvinulis suis, adolevit super altare :\"},{\"verse\":17,\"text\":\"vitulum cum pelle, et carnibus, et fimo, cremans extra castra, sicut præceperat Dominus.\"},{\"verse\":18,\"text\":\"Obtulit et arietem in holocaustum : super cujus caput cum imposuissent Aaron et filii ejus manus suas,\"},{\"verse\":19,\"text\":\"immolavit eum, et fudit sanguinem ejus per circuitum altaris.\"},{\"verse\":20,\"text\":\"Ipsumque arietem in frusta concidens, caput ejus, et artus, et adipem adolevit igni,\"},{\"verse\":21,\"text\":\"lotis prius intestinis et pedibus : totumque simul arietem incendit super altare, eo quod esset holocaustum suavissimi odoris Domino, sicut præceperat ei.\"},{\"verse\":22,\"text\":\"Obtulit et arietem secundum in consecratione sacerdotum, posueruntque super caput ejus Aaron et filii ejus manus suas :\"},{\"verse\":23,\"text\":\"quem cum immolasset Moyses, sumens de sanguine ejus, tetigit extremum auriculæ dextræ Aaron, et pollicem manus ejus dextræ, similiter et pedis.\"},{\"verse\":24,\"text\":\"Obtulit et filios Aaron : cumque de sanguine arietis immolati tetigisset extremum auriculæ singulorum dextræ, et pollices manus ac pedis dextri, reliquum fudit super altare per circuitum :\"},{\"verse\":25,\"text\":\"adipem vero, et caudam, omnemque pinguedinem quæ operit intestina, reticulumque jecoris, et duos renes cum adipibus suis et armo dextro separavit.\"},{\"verse\":26,\"text\":\"Tollens autem de canistro azymorum, quod erat coram Domino, panem absque fermento, et collyridam conspersam oleo, laganumque, posuit super adipes, et armum dextrum,\"},{\"verse\":27,\"text\":\"tradens simul omnia Aaron et filiis ejus. Qui postquam levaverunt ea coram Domino,\"},{\"verse\":28,\"text\":\"rursum suscepta de manibus eorum, adolevit super altare holocausti, eo quod consecrationis esset oblatio, in odorem suavitatis, sacrificii Domino.\"},{\"verse\":29,\"text\":\"Tulitque pectusculum, elevans illud coram Domino, de ariete consecrationis in partem suam, sicut præceperat ei Dominus.\"},{\"verse\":30,\"text\":\"Assumensque unguentum, et sanguinem qui erat in altari, aspersit super Aaron et vestimenta ejus, et super filios illius ac vestes eorum.\"},{\"verse\":31,\"text\":\"Cumque sanctificasset eos in vestitu suo, præcepit eis, dicens : Coquite carnes ante fores tabernaculi, et ibi comedite eas ; panes quoque consecrationis edite, qui positi sunt in canistro, sicut præcepit mihi Dominus, dicens : Aaron et filii ejus comedent eos :\"},{\"verse\":32,\"text\":\"quidquid autem reliquum fuerit de carne et panibus, ignis absumet.\"},{\"verse\":33,\"text\":\"De ostio quoque tabernaculi non exibitis septem diebus, usque ad diem quo complebitur tempus consecrationis vestræ ; septem enim diebus finitur consecratio :\"},{\"verse\":34,\"text\":\"sicut et impræsentiarum factum est, ut ritus sacrificii compleretur.\"},{\"verse\":35,\"text\":\"Die ac nocte manebitis in tabernaculo observantes custodias Domini, ne moriamini : sic enim mihi præceptum est.\"},{\"verse\":36,\"text\":\"Feceruntque Aaron et filii ejus cuncta quæ locutus est Dominus per manum Moysi.\"}],\"summary\":\"Moses consecrateth Aaron and his sons.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":7,\"label\":\"Leviticus 7\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":9,\"label\":\"Leviticus 9\"}}]]\n"])</script></body></html>
