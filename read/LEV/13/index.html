<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Leviticus 13 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LEV/">About <!-- -->Leviticus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The law concerning leprosy in men, and in garments.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses and Aaron, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The man in whose skin or flesh shall arise a different colour or a blister, or as it were something shining, that is the stroke of the leprosy, shall be brought to Aaron the priest, or any one of his sons.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And if he see the leprosy in his skin, and the hair turned white and the place where the leprosy appears lower than the skin and the rest of the flesh: it is the stroke of the leprosy, and upon his judgment he shall be separated.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But if there be a shining whiteness in the skin, and not lower than the other flesh, and the hair be of the former colour, the priest shall shut him up seven days.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the seventh day he shall look on him: and if the leprosy be grown no farther, and hath not spread itself in the skin, he shall shut him up again other seven days.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And on the seventh day, he shall look on him. If the leprosy be somewhat obscure, and not spread in the skin, he shall declare him clean, because it is but a scab: and the man shall wash his clothes, and shall be clean.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But, if the leprosy grow again, after he was seen by the priest and restored to cleanness, he shall be brought to him:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And shall be condemned of uncleanness.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If the stroke of the leprosy be in a man, he shall be brought to the priest:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he shall view him. And when there shall be a white colour in the skin, and it shall have changed the look of the hair, and the living flesh itself shall appear:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>It shall be judged an inveterate leprosy, and grown into the skin. The priest therefore shall declare him unclean: and shall not shut him up, because he is evidently unclean.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But if the leprosy spring out running about in the skin, and cover all the skin from the head to the feet, whatsoever falleth under the sight of the eyes:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The priest shall view him, and shall judge that the leprosy which he has is very clean: because it is all turned into whiteness, and therefore the man shall be clean.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But when the live flesh shall appear in him:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then by the judgment of the priest he shall be defiled, and shall be reckoned among the unclean. For live flesh, if it be spotted with leprosy, is unclean.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And if again it be turned into whiteness, and cover all the man:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The priest shall view him, and shall judge him to be clean.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When also there has been an ulcer in the flesh and the skin, and it has been healed:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And in the place of the ulcer, there appeareth a white scar, or somewhat red, the man shall be brought to the priest.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when he shall see the place of the leprosy lower than the other flesh, and the hair turned white: he shall declare him unclean, for the plague of leprosy is broken out in the ulcer.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But if the hair be of the former colour, and the scar somewhat obscure, and be not lower than the flesh that is near it: he shall shut him up seven days.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And if it spread, he shall judge him to have the leprosy:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But if it stay in its place, it is but the scar of an ulcer: and the man shall be clean.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The flesh also and skin that hath been burnt, and after it is healed hath a white or a red scar:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The priest shall view it, and if he see it turned white, and the place thereof is lower than the other skin: he shall declare him unclean, because the evil of leprosy is broken out in the scar.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But if the colour of the hair be not changed, nor the blemish lower than the other flesh, and the appearance of the leprosy be somewhat obscure: he shall shut him up seven days,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And on the seventh day he shall view him. If the leprosy be grown farther in the skin, he shall declare him unclean.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But if the whiteness stay in its place, and be not very clear, it is the sore of a burning: and therefore he shall be cleansed, because it is only the scar of a burning.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>If the leprosy break out in the head or the beard of a man or woman, the priest shall see them,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And if the place be lower than the other flesh, and the hair yellow, and thinner than usual: he shall declare them unclean, because it is the leprosy of the head and the beard;</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But if he perceive the place of the spot is equal with the flesh that is near it, and the hair black: he shall shut him up seven days,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And on the seventh day he shall look upon it. If the spot be not grown, and the hair keep its colour, and the place of the blemish be even with the other flesh:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The man shall be shaven all but the place of the spot: and he shall be shut up other seven days.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>If on the seventh day the evil seem to have stayed in its place, and not lower than the other flesh, he shall cleanse him: and his clothes being washed he shall be clean.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But if after his cleansing the spot spread again in the skin:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>He shall seek no more whether the hair be turned yellow, because he is evidently unclean.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But if the spot be stayed, and the hair be black, let him know that the man is healed: and let him confidently pronounce him clean.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>If a whiteness appear in the skin of a man or a woman,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>The priest shall view them. If he find that a darkish whiteness shineth in the skin, let him know that it is not the leprosy, but a white blemish, and that the man is clean.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The man whose hair falleth off from his head, he is bald and clean:</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And if the hair fall from his forehead, he is bald before and clean.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>But if in the bald head or in the bald forehead there be risen a white or reddish colour:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And the priest perceive this, he shall condemn him undoubtedly of leprosy which is risen in the bald part.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Now whosoever shall be defiled with the leprosy, and is separated by the judgment of the priest:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Shall have his clothes hanging loose, his head bare, his mouth covered with a cloth: and he shall cry out that he is defiled and unclean.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>All the time that he is a leper and unclean he shall dwell alone without the camp.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>A woollen or linen garment that shall have the leprosy</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>In the warp, and the woof: or skin, or whatsoever is made of a skin:</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>If it be infected with a white or red spot, it shall be accounted the leprosy, and shall be shewn to the priest.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And he shall look upon it and shall shut it up seven days.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And on the seventh day when he looketh on it again, if he find that it is grown, it is a fixed leprosy. He shall judge the garment unclean, and every thing wherein it shall be found.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And therefore it shall be burnt with fire.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>But if he see that it is not grown,</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>He shall give orders, and they shall wash that part wherein the leprosy is: and he shall shut it up other seven days.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And when he shall see that the former colour is not returned, nor yet the leprosy spread, he shall judge it unclean: and shall burn it with fire, for the leprosy has taken hold of the outside of the garment, or through the whole.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>But if the place of the leprosy be somewhat dark, after the garment is washed, he shall tear it off, and divide it from that which is sound.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And if after this there appear in those places that before were without spot, a flying and wandering leprosy: it must be burnt with fire.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>If it cease, he shall wash with water the parts that are pure, the second time: and they shall be clean.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>This is the law touching the leprosy of any woollen or linen garment, either in the warp or woof, or any thing of skins: how it ought to be cleaned, or pronounced unclean.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, et Aaron, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Homo, in cujus cute et carne ortus fuerit diversus color, sive pustula, aut quasi lucens quippiam, id est, plaga lepræ, adducetur ad Aaron sacerdotem, vel ad unum quemlibet filiorum ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Qui cum viderit lepram in cute, et pilos in album mutatos colorem, ipsamque speciem lepræ humiliorem cute et carne reliqua : plaga lepræ est, et ad arbitrium ejus separabitur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sin autem lucens candor fuerit in cute, nec humilior carne reliqua, et pili coloris pristini, recludet eum sacerdos septem diebus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et considerabit die septimo : et si quidem lepra ultra non creverit, nec transierit in cute priores terminos, rursum recludet eum septem diebus aliis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et die septimo contemplabitur : si obscurior fuerit lepra, et non creverit in cute, mundabit eum, quia scabies est : lavabitque homo vestimenta sua, et mundus erit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quod si postquam a sacerdote visus est, et redditus munditiæ, iterum lepra creverit : adducetur ad eum,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et immunditiæ condemnabitur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Plaga lepræ si fuerit in homine, adducetur ad sacerdotem,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et videbit eum. Cumque color albus in cute fuerit, et capillorum mutaverit aspectum, ipsa quoque caro viva apparuerit :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>lepra vetustissima judicabitur, atque inolita cuti. Contaminabit itaque eum sacerdos, et non recludet, quia perspicuæ immunditiæ est.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sin autem effloruerit discurrens lepra in cute, et operuerit omnem cutem a capite usque ad pedes, quidquid sub aspectum oculorum cadit,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>considerabit eum sacerdos, et teneri lepra mundissima judicabit : eo quod omnis in candorem versa sit, et idcirco homo mundus erit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quando vero caro vivens in eo apparuerit,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>tunc sacerdotis judicio polluetur, et inter immundos reputabitur : caro enim viva, si lepra aspergitur, immunda est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quod si rursum versa fuerit in alborem, et totum hominem operuerit,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>considerabit eum sacerdos, et mundum esse decernet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Caro autem et cutis in qua ulcus natum est, et sanatum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et in loco ulceris cicatrix alba apparuerit, sive subrufa, adducetur homo ad sacerdotem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui cum viderit locum lepræ humiliorem carne reliqua, et pilos versos in candorem, contaminabit eum : plaga enim lepræ orta est in ulcere.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quod si pilus coloris est pristini, et cicatrix subobscura, et vicina carne non est humilior, recludet eum septem diebus :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et si quidem creverit, adjudicabit eum lepræ ;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>sin autem steterit in loco suo, ulceris est cicatrix, et homo mundus erit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Caro autem et cutis, quam ignis exusserit, et sanata albam sive rufam habuerit cicatricem,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>considerabit eam sacerdos : et ecce versa est in alborem, et locus ejus reliqua cute est humilior, contaminabit eum, quia plaga lepræ in cicatrice orta est.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quod si pilorum color non fuerit immutatus, nec humilior plaga carne reliqua, et ipsa lepræ species fuerit subobscura, recludet eum septem diebus,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et die septimo contemplabitur : si creverit in cute lepra, contaminabit eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sin autem in loco suo candor steterit non satis clarus, plaga combustionis est, et idcirco mundabitur, quia cicatrix est combusturæ.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vir, sive mulier, in cujus capite vel barba germinaverit lepra, videbit eos sacerdos.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et si quidem humilior fuerit locus carne reliqua, et capillus flavus, solitoque subtilior, contaminabit eos, quia lepra capitis ac barbæ est.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sin autem viderit locum maculæ æqualem vicinæ carni, et capillum nigrum : recludet eum septem diebus,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et die septimo intuebitur. Si non creverit macula, et capillus sui coloris est, et locus plagæ carni reliquæ æqualis :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>radetur homo absque loco maculæ, et includetur septem diebus aliis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Si die septimo visa fuerit stetisse plaga in loco suo, nec humilior carne reliqua, mundabit eum : lotisque vestibus suis, mundus erit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Sin autem post emundationem rursus creverit macula in cute,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>non quæret amplius utrum capillus in flavum colorem sit immutatus, quia aperte immundus est.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Porro si steterit macula, et capilli nigri fuerint, noverit hominem sanatum esse, et confidenter eum pronuntiet mundum.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Vir, sive mulier, in cujus cute candor apparuerit,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>intuebitur eos sacerdos. Si deprehenderit subobscurum alborem lucere in cute, sciat non esse lepram, sed maculam coloris candidi, et hominem mundum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Vir, de cujus capite capilli fluunt, calvus et mundus est :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>et si a fronte ceciderint pili, recalvaster et mundus est.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Sin autem in calvitio sive in recalvatione albus vel rufus color fuerit exortus,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>et hoc sacerdos viderit, condemnabit eum haud dubiæ lepræ, quæ orta est in calvitio.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Quicumque ergo maculatus fuerit lepra, et separatus est ad arbitrium sacerdotis,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>habebit vestimenta dissuta, caput nudum, os veste contectum, contaminatum ac sordidum se clamabit.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Omni tempore quo leprosus est et immundus, solus habitabit extra castra.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Vestis lanea sive linea, quæ lepram habuerit,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>in stamine atque subtegmine, aut certe pellis, vel quidquid ex pelle confectum est,</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>si alba vel rufa macula fuerit infecta, lepra reputabitur, ostendeturque sacerdoti :</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>qui consideratam recludet septem diebus :</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>et die septimo rursus aspiciens, si deprehenderit crevisse, lepra perseverans est : pollutum judicabit vestimentum, et omne in quo fuerit inventa :</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>et idcirco comburetur flammis.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Quod si eam viderit non crevisse,</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>præcipiet, et lavabunt id in quo lepra est, recludetque illud septem diebus aliis.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Et cum viderit faciem quidem pristinam non reversam, nec tamen crevisse lepram, immundum judicabit, et igne comburet, eo quod infusa sit in superficie vestimenti, vel per totum, lepra.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Sin autem obscurior fuerit locus lepræ, postquam vestis est lota, abrumpet eum, et a solido dividet.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Quod si ultra apparuerit in his locis, quæ prius immaculata erant, lepra volatilis et vaga, debet igne comburi.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Si cessaverit, lavabit aqua ea, quæ pura sunt, secundo, et munda erunt.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Ista est lex lepræ vestimenti lanei et linei, staminis, atque subtegminis, omnisque supellectilis pelliceæ, quomodo mundari debeat, vel contaminari.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Leviticus 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->27<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Leviticus 12" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href=" ":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LEV.13\",{\"bookId\":3,\"usfm\":\"LEV\",\"bookName\":\"Leviticus\",\"drName\":\"Leviticus\",\"chapter\":13,\"totalChapters\":27,\"dra\":[{\"verse\":1,\"text\":\"And the Lord spoke to Moses and Aaron, saying:\"},{\"verse\":2,\"text\":\"The man in whose skin or flesh shall arise a different colour or a blister, or as it were something shining, that is the stroke of the leprosy, shall be brought to Aaron the priest, or any one of his sons.\"},{\"verse\":3,\"text\":\"And if he see the leprosy in his skin, and the hair turned white and the place where the leprosy appears lower than the skin and the rest of the flesh: it is the stroke of the leprosy, and upon his judgment he shall be separated.\"},{\"verse\":4,\"text\":\"But if there be a shining whiteness in the skin, and not lower than the other flesh, and the hair be of the former colour, the priest shall shut him up seven days.\"},{\"verse\":5,\"text\":\"And the seventh day he shall look on him: and if the leprosy be grown no farther, and hath not spread itself in the skin, he shall shut him up again other seven days.\"},{\"verse\":6,\"text\":\"And on the seventh day, he shall look on him. If the leprosy be somewhat obscure, and not spread in the skin, he shall declare him clean, because it is but a scab: and the man shall wash his clothes, and shall be clean.\"},{\"verse\":7,\"text\":\"But, if the leprosy grow again, after he was seen by the priest and restored to cleanness, he shall be brought to him:\"},{\"verse\":8,\"text\":\"And shall be condemned of uncleanness.\"},{\"verse\":9,\"text\":\"If the stroke of the leprosy be in a man, he shall be brought to the priest:\"},{\"verse\":10,\"text\":\"And he shall view him. And when there shall be a white colour in the skin, and it shall have changed the look of the hair, and the living flesh itself shall appear:\"},{\"verse\":11,\"text\":\"It shall be judged an inveterate leprosy, and grown into the skin. The priest therefore shall declare him unclean: and shall not shut him up, because he is evidently unclean.\"},{\"verse\":12,\"text\":\"But if the leprosy spring out running about in the skin, and cover all the skin from the head to the feet, whatsoever falleth under the sight of the eyes:\"},{\"verse\":13,\"text\":\"The priest shall view him, and shall judge that the leprosy which he has is very clean: because it is all turned into whiteness, and therefore the man shall be clean.\"},{\"verse\":14,\"text\":\"But when the live flesh shall appear in him:\"},{\"verse\":15,\"text\":\"Then by the judgment of the priest he shall be defiled, and shall be reckoned among the unclean. For live flesh, if it be spotted with leprosy, is unclean.\"},{\"verse\":16,\"text\":\"And if again it be turned into whiteness, and cover all the man:\"},{\"verse\":17,\"text\":\"The priest shall view him, and shall judge him to be clean.\"},{\"verse\":18,\"text\":\"When also there has been an ulcer in the flesh and the skin, and it has been healed:\"},{\"verse\":19,\"text\":\"And in the place of the ulcer, there appeareth a white scar, or somewhat red, the man shall be brought to the priest.\"},{\"verse\":20,\"text\":\"And when he shall see the place of the leprosy lower than the other flesh, and the hair turned white: he shall declare him unclean, for the plague of leprosy is broken out in the ulcer.\"},{\"verse\":21,\"text\":\"But if the hair be of the former colour, and the scar somewhat obscure, and be not lower than the flesh that is near it: he shall shut him up seven days.\"},{\"verse\":22,\"text\":\"And if it spread, he shall judge him to have the leprosy:\"},{\"verse\":23,\"text\":\"But if it stay in its place, it is but the scar of an ulcer: and the man shall be clean.\"},{\"verse\":24,\"text\":\"The flesh also and skin that hath been burnt, and after it is healed hath a white or a red scar:\"},{\"verse\":25,\"text\":\"The priest shall view it, and if he see it turned white, and the place thereof is lower than the other skin: he shall declare him unclean, because the evil of leprosy is broken out in the scar.\"},{\"verse\":26,\"text\":\"But if the colour of the hair be not changed, nor the blemish lower than the other flesh, and the appearance of the leprosy be somewhat obscure: he shall shut him up seven days,\"},{\"verse\":27,\"text\":\"And on the seventh day he shall view him. If the leprosy be grown farther in the skin, he shall declare him unclean.\"},{\"verse\":28,\"text\":\"But if the whiteness stay in its place, and be not very clear, it is the sore of a burning: and therefore he shall be cleansed, because it is only the scar of a burning.\"},{\"verse\":29,\"text\":\"If the leprosy break out in the head or the beard of a man or woman, the priest shall see them,\"},{\"verse\":30,\"text\":\"And if the place be lower than the other flesh, and the hair yellow, and thinner than usual: he shall declare them unclean, because it is the leprosy of the head and the beard;\"},{\"verse\":31,\"text\":\"But if he perceive the place of the spot is equal with the flesh that is near it, and the hair black: he shall shut him up seven days,\"},{\"verse\":32,\"text\":\"And on the seventh day he shall look upon it. If the spot be not grown, and the hair keep its colour, and the place of the blemish be even with the other flesh:\"},{\"verse\":33,\"text\":\"The man shall be shaven all but the place of the spot: and he shall be shut up other seven days.\"},{\"verse\":34,\"text\":\"If on the seventh day the evil seem to have stayed in its place, and not lower than the other flesh, he shall cleanse him: and his clothes being washed he shall be clean.\"},{\"verse\":35,\"text\":\"But if after his cleansing the spot spread again in the skin:\"},{\"verse\":36,\"text\":\"He shall seek no more whether the hair be turned yellow, because he is evidently unclean.\"},{\"verse\":37,\"text\":\"But if the spot be stayed, and the hair be black, let him know that the man is healed: and let him confidently pronounce him clean.\"},{\"verse\":38,\"text\":\"If a whiteness appear in the skin of a man or a woman,\"},{\"verse\":39,\"text\":\"The priest shall view them. If he find that a darkish whiteness shineth in the skin, let him know that it is not the leprosy, but a white blemish, and that the man is clean.\"},{\"verse\":40,\"text\":\"The man whose hair falleth off from his head, he is bald and clean:\"},{\"verse\":41,\"text\":\"And if the hair fall from his forehead, he is bald before and clean.\"},{\"verse\":42,\"text\":\"But if in the bald head or in the bald forehead there be risen a white or reddish colour:\"},{\"verse\":43,\"text\":\"And the priest perceive this, he shall condemn him undoubtedly of leprosy which is risen in the bald part.\"},{\"verse\":44,\"text\":\"Now whosoever shall be defiled with the leprosy, and is separated by the judgment of the priest:\"},{\"verse\":45,\"text\":\"Shall have his clothes hanging loose, his head bare, his mouth covered with a cloth: and he shall cry out that he is defiled and unclean.\"},{\"verse\":46,\"text\":\"All the time that he is a leper and unclean he shall dwell alone without the camp.\"},{\"verse\":47,\"text\":\"A woollen or linen garment that shall have the leprosy\"},{\"verse\":48,\"text\":\"In the warp, and the woof: or skin, or whatsoever is made of a skin:\"},{\"verse\":49,\"text\":\"If it be infected with a white or red spot, it shall be accounted the leprosy, and shall be shewn to the priest.\"},{\"verse\":50,\"text\":\"And he shall look upon it and shall shut it up seven days.\"},{\"verse\":51,\"text\":\"And on the seventh day when he looketh on it again, if he find that it is grown, it is a fixed leprosy. He shall judge the garment unclean, and every thing wherein it shall be found.\"},{\"verse\":52,\"text\":\"And therefore it shall be burnt with fire.\"},{\"verse\":53,\"text\":\"But if he see that it is not grown,\"},{\"verse\":54,\"text\":\"He shall give orders, and they shall wash that part wherein the leprosy is: and he shall shut it up other seven days.\"},{\"verse\":55,\"text\":\"And when he shall see that the former colour is not returned, nor yet the leprosy spread, he shall judge it unclean: and shall burn it with fire, for the leprosy has taken hold of the outside of the garment, or through the whole.\"},{\"verse\":56,\"text\":\"But if the place of the leprosy be somewhat dark, after the garment is washed, he shall tear it off, and divide it from that which is sound.\"},{\"verse\":57,\"text\":\"And if after this there appear in those places that before were without spot, a flying and wandering leprosy: it must be burnt with fire.\"},{\"verse\":58,\"text\":\"If it cease, he shall wash with water the parts that are pure, the second time: and they shall be clean.\"},{\"verse\":59,\"text\":\"This is the law touching the leprosy of any woollen or linen garment, either in the warp or woof, or any thing of skins: how it ought to be cleaned, or pronounced unclean.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, et Aaron, dicens :\"},{\"verse\":2,\"text\":\"Homo, in cujus cute et carne ortus fuerit diversus color, sive pustula, aut quasi lucens quippiam, id est, plaga lepræ, adducetur ad Aaron sacerdotem, vel ad unum quemlibet filiorum ejus.\"},{\"verse\":3,\"text\":\"Qui cum viderit lepram in cute, et pilos in album mutatos colorem, ipsamque speciem lepræ humiliorem cute et carne reliqua : plaga lepræ est, et ad arbitrium ejus separabitur.\"},{\"verse\":4,\"text\":\"Sin autem lucens candor fuerit in cute, nec humilior carne reliqua, et pili coloris pristini, recludet eum sacerdos septem diebus :\"},{\"verse\":5,\"text\":\"et considerabit die septimo : et si quidem lepra ultra non creverit, nec transierit in cute priores terminos, rursum recludet eum septem diebus aliis.\"},{\"verse\":6,\"text\":\"Et die septimo contemplabitur : si obscurior fuerit lepra, et non creverit in cute, mundabit eum, quia scabies est : lavabitque homo vestimenta sua, et mundus erit.\"},{\"verse\":7,\"text\":\"Quod si postquam a sacerdote visus est, et redditus munditiæ, iterum lepra creverit : adducetur ad eum,\"},{\"verse\":8,\"text\":\"et immunditiæ condemnabitur.\"},{\"verse\":9,\"text\":\"Plaga lepræ si fuerit in homine, adducetur ad sacerdotem,\"},{\"verse\":10,\"text\":\"et videbit eum. Cumque color albus in cute fuerit, et capillorum mutaverit aspectum, ipsa quoque caro viva apparuerit :\"},{\"verse\":11,\"text\":\"lepra vetustissima judicabitur, atque inolita cuti. Contaminabit itaque eum sacerdos, et non recludet, quia perspicuæ immunditiæ est.\"},{\"verse\":12,\"text\":\"Sin autem effloruerit discurrens lepra in cute, et operuerit omnem cutem a capite usque ad pedes, quidquid sub aspectum oculorum cadit,\"},{\"verse\":13,\"text\":\"considerabit eum sacerdos, et teneri lepra mundissima judicabit : eo quod omnis in candorem versa sit, et idcirco homo mundus erit.\"},{\"verse\":14,\"text\":\"Quando vero caro vivens in eo apparuerit,\"},{\"verse\":15,\"text\":\"tunc sacerdotis judicio polluetur, et inter immundos reputabitur : caro enim viva, si lepra aspergitur, immunda est.\"},{\"verse\":16,\"text\":\"Quod si rursum versa fuerit in alborem, et totum hominem operuerit,\"},{\"verse\":17,\"text\":\"considerabit eum sacerdos, et mundum esse decernet.\"},{\"verse\":18,\"text\":\"Caro autem et cutis in qua ulcus natum est, et sanatum,\"},{\"verse\":19,\"text\":\"et in loco ulceris cicatrix alba apparuerit, sive subrufa, adducetur homo ad sacerdotem.\"},{\"verse\":20,\"text\":\"Qui cum viderit locum lepræ humiliorem carne reliqua, et pilos versos in candorem, contaminabit eum : plaga enim lepræ orta est in ulcere.\"},{\"verse\":21,\"text\":\"Quod si pilus coloris est pristini, et cicatrix subobscura, et vicina carne non est humilior, recludet eum septem diebus :\"},{\"verse\":22,\"text\":\"et si quidem creverit, adjudicabit eum lepræ ;\"},{\"verse\":23,\"text\":\"sin autem steterit in loco suo, ulceris est cicatrix, et homo mundus erit.\"},{\"verse\":24,\"text\":\"Caro autem et cutis, quam ignis exusserit, et sanata albam sive rufam habuerit cicatricem,\"},{\"verse\":25,\"text\":\"considerabit eam sacerdos : et ecce versa est in alborem, et locus ejus reliqua cute est humilior, contaminabit eum, quia plaga lepræ in cicatrice orta est.\"},{\"verse\":26,\"text\":\"Quod si pilorum color non fuerit immutatus, nec humilior plaga carne reliqua, et ipsa lepræ species fuerit subobscura, recludet eum septem diebus,\"},{\"verse\":27,\"text\":\"et die septimo contemplabitur : si creverit in cute lepra, contaminabit eum.\"},{\"verse\":28,\"text\":\"Sin autem in loco suo candor steterit non satis clarus, plaga combustionis est, et idcirco mundabitur, quia cicatrix est combusturæ.\"},{\"verse\":29,\"text\":\"Vir, sive mulier, in cujus capite vel barba germinaverit lepra, videbit eos sacerdos.\"},{\"verse\":30,\"text\":\"Et si quidem humilior fuerit locus carne reliqua, et capillus flavus, solitoque subtilior, contaminabit eos, quia lepra capitis ac barbæ est.\"},{\"verse\":31,\"text\":\"Sin autem viderit locum maculæ æqualem vicinæ carni, et capillum nigrum : recludet eum septem diebus,\"},{\"verse\":32,\"text\":\"et die septimo intuebitur. Si non creverit macula, et capillus sui coloris est, et locus plagæ carni reliquæ æqualis :\"},{\"verse\":33,\"text\":\"radetur homo absque loco maculæ, et includetur septem diebus aliis.\"},{\"verse\":34,\"text\":\"Si die septimo visa fuerit stetisse plaga in loco suo, nec humilior carne reliqua, mundabit eum : lotisque vestibus suis, mundus erit.\"},{\"verse\":35,\"text\":\"Sin autem post emundationem rursus creverit macula in cute,\"},{\"verse\":36,\"text\":\"non quæret amplius utrum capillus in flavum colorem sit immutatus, quia aperte immundus est.\"},{\"verse\":37,\"text\":\"Porro si steterit macula, et capilli nigri fuerint, noverit hominem sanatum esse, et confidenter eum pronuntiet mundum.\"},{\"verse\":38,\"text\":\"Vir, sive mulier, in cujus cute candor apparuerit,\"},{\"verse\":39,\"text\":\"intuebitur eos sacerdos. Si deprehenderit subobscurum alborem lucere in cute, sciat non esse lepram, sed maculam coloris candidi, et hominem mundum.\"},{\"verse\":40,\"text\":\"Vir, de cujus capite capilli fluunt, calvus et mundus est :\"},{\"verse\":41,\"text\":\"et si a fronte ceciderint pili, recalvaster et mundus est.\"},{\"verse\":42,\"text\":\"Sin autem in calvitio sive in recalvatione albus vel rufus color fuerit exortus,\"},{\"verse\":43,\"text\":\"et hoc sacerdos viderit, condemnabit eum haud dubiæ lepræ, quæ orta est in calvitio.\"},{\"verse\":44,\"text\":\"Quicumque ergo maculatus fuerit lepra, et separatus est ad arbitrium sacerdotis,\"},{\"verse\":45,\"text\":\"habebit vestimenta dissuta, caput nudum, os veste contectum, contaminatum ac sordidum se clamabit.\"},{\"verse\":46,\"text\":\"Omni tempore quo leprosus est et immundus, solus habitabit extra castra.\"},{\"verse\":47,\"text\":\"Vestis lanea sive linea, quæ lepram habuerit,\"},{\"verse\":48,\"text\":\"in stamine atque subtegmine, aut certe pellis, vel quidquid ex pelle confectum est,\"},{\"verse\":49,\"text\":\"si alba vel rufa macula fuerit infecta, lepra reputabitur, ostendeturque sacerdoti :\"},{\"verse\":50,\"text\":\"qui consideratam recludet septem diebus :\"},{\"verse\":51,\"text\":\"et die septimo rursus aspiciens, si deprehenderit crevisse, lepra perseverans est : pollutum judicabit vestimentum, et omne in quo fuerit inventa :\"},{\"verse\":52,\"text\":\"et idcirco comburetur flammis.\"},{\"verse\":53,\"text\":\"Quod si eam viderit non crevisse,\"},{\"verse\":54,\"text\":\"præcipiet, et lavabunt id in quo lepra est, recludetque illud septem diebus aliis.\"},{\"verse\":55,\"text\":\"Et cum viderit faciem quidem pristinam non reversam, nec tamen crevisse lepram, immundum judicabit, et igne comburet, eo quod infusa sit in superficie vestimenti, vel per totum, lepra.\"},{\"verse\":56,\"text\":\"Sin autem obscurior fuerit locus lepræ, postquam vestis est lota, abrumpet eum, et a solido dividet.\"},{\"verse\":57,\"text\":\"Quod si ultra apparuerit in his locis, quæ prius immaculata erant, lepra volatilis et vaga, debet igne comburi.\"},{\"verse\":58,\"text\":\"Si cessaverit, lavabit aqua ea, quæ pura sunt, secundo, et munda erunt.\"},{\"verse\":59,\"text\":\"Ista est lex lepræ vestimenti lanei et linei, staminis, atque subtegminis, omnisque supellectilis pelliceæ, quomodo mundari debeat, vel contaminari.\"}],\"summary\":\"The law concerning leprosy in men, and in garments.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":12,\"label\":\"Leviticus 12\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":14,\"label\":\"Leviticus 14\"}}]]\n"])</script></body></html>
