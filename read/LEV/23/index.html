<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Leviticus 23 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Leviticus<!-- --> <span class="text-stone-500">23</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Holy days to be kept.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, and thou shalt say to them: These are the feasts of the Lord, which you shall call holy.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Six days shall ye do work: the seventh day, because it is the rest of the sabbath, shall be called holy. You shall do no work on that day: it is the sabbath of the Lord in all your habitations.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>These also are the holy days of the Lord, which you must celebrate in their seasons.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The first month, the fourteenth day of the month at evening, is the phase of the Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the fifteenth day of the same month is the solemnity of the unleavened bread of the Lord. Seven days shall you eat unleavened bread.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The first day shall be most solemn unto you, and holy: you shall do no servile work therein.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But you shall offer sacrifice in fire to the Lord seven days. And the seventh day shall be more solemn, and more holy: and you shall do no servile work therein.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, and shall reap your corn, you shall bring sheaves of ears, the firstfruits of your harvest to the priest.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who shall lift up the sheaf before the Lord, the next day after the sabbath, that it may be acceptable for you, and shall sanctify it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And on the same day that the sheaf is consecrated, a lamb without blemish of the first year shall be killed for a holocaust of the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the libations shall be offered with it: two tenths of flour tempered with oil, for a burnt offering of the Lord, and a most sweet odour. Libations also of wine, the fourth part of a hin.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>You shall not eat either bread, or parched corn, or frumenty or the harvest, until the day that you shall offer thereof to your God. It is a precept for ever throughout your generations, and all your dwellings.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>You shall count therefore from the morrow after the sabbath, wherein you offered the sheaf of firstfruits, seven full weeks.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Even unto the morrow after the seventh week be expired, that is to say, fifty days: and so you shall offer a new sacrifice to the Lord.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Out of all your dwellings, two loaves of the firstfruits, of two tenths of flour leavened, which you shall bake for the firstfruits of the Lord.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And you shall offer with the loaves seven lambs without blemish of the first year, and one calf from the herd, and two rams, and they shall be for a holocaust with their libations for a most sweet odour to the Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>You shall offer also a buck goat for sin, and two lambs of the first year for sacrifices of peace offerings.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when the priest hath lifted them up with the loaves of the firstfruits before the Lord, they shall fall to his use.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And you shall call this day most solemn, and most holy. You shall do no servile work therein. It shall be an everlasting ordinance in all your dwellings and generations.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And when you reap the corn of your land, you shall not cut it to the very ground: neither shall you gather the ears that remain. But you shall leave them for the poor and for the strangers. I am the Lord your God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Say to the children of Israel: The seventh month, on the first day of the month, you shall keep a sabbath, a memorial, with the sound of trumpets, and it shall be called holy.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>You shall do no servile work therein, and you shall offer a holocaust to the Lord.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Upon the tenth day of this seventh month shall be the day of atonement. It shall be most solemn, and shall be called holy: and you shall afflict your souls on that day, and shall offer a holocaust to the Lord.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>You shall do no servile work in the time of this day: because it is a day of propitiation, that the Lord your God may be merciful unto you.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Every soul that is not afflicted on this day, shall perish from among his people.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And every soul that shall do any work, the same will I destroy from among his people.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>You shall do no work therefore on that day: it shall be an everlasting ordinance unto you in all your generations, and dwellings.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>It is a sabbath of rest, and you shall afflict your souls beginning on the ninth day of the month. From evening until evening you shall celebrate your sabbaths.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Say to the children of Israel: From the fifteenth day of this same seventh month, shall be kept the feast of tabernacles, seven days to the Lord.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The first day shall be called most solemn and most holy: you shall do no servile work therein. And seven days you shall offer holocausts to the Lord.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The eighth day also shall be most solemn and most holy: and you shall offer holocausts to the Lord. For it is the day of assembly and congregation. You shall do no servile work therein.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>These are the feasts of the Lord which you shall call most solemn and most holy, and shall offer on them oblations to the Lord: holocausts and libations according to the rite of every day.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Besides the sabbaths of the Lord, and your gifts, and those things that you offer by vow, or which you shall give to the Lord voluntarily.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>So from the fifteenth day of the seventh month, when you shall have gathered in all the fruits of your land, you shall celebrate the feast of the Lord seven days. On the first day and the eighth shall be a sabbath: that is a day of rest.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And you shall take to you on the first day the fruits of the fairest tree, and branches of palm trees, and boughs of thick trees, and willows of the brook: And you shall rejoice before the Lord your God.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And you shall keep the solemnity thereof seven days in the year. It shall be an everlasting ordinance in your generations. In the seventh month shall you celebrate this feast.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And you shall dwell in bowers seven days. Every one that is of the race of Israel, shall dwell in tabernacles:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>That your posterity may know, that I made the children of Israel to dwell in tabernacles, when I brought them out of the land of Egypt. I am the Lord your God.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And Moses spoke concerning the feasts of the Lord to the children of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere filiis Israël, et dices ad eos : Hæ sunt feriæ Domini, quas vocabitis sanctas.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sex diebus facietis opus : dies septimus, quia sabbati requies est, vocabitur sanctus : omne opus non facietis in eo : sabbatum Domini est in cunctis habitationibus vestris.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæ sunt ergo feriæ Domini sanctæ, quas celebrare debetis temporibus suis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Mense primo, quartadecima die mensis ad vesperum, Phase Domini est :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et quintadecima die mensis hujus, solemnitas azymorum Domini est. Septem diebus azyma comedetis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dies primus erit vobis celeberrimus, sanctusque : omne opus servile non facietis in eo,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>sed offeretis sacrificium in igne Domino septem diebus. Dies autem septimus erit celebrior et sanctior : nullumque servile opus facietis in eo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Loquere filiis Israël, et dices ad eos : Cum ingressi fueritis terram, quam ego dabo vobis, et messueritis segetem, feretis manipulos spicarum, primitias messis vestræ, ad sacerdotem :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>qui elevabit fasciculum coram Domino, ut acceptabile sit pro vobis, altero die sabbati, et sanctificabit illum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Atque in eodem die quo manipulus consecratur, cædetur agnus immaculatus anniculus in holocaustum Domini.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et libamenta offerentur cum eo, duæ decimæ similæ conspersæ oleo in incensum Domini, odoremque suavissimum : liba quoque vini, quarta pars hin.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Panem, et polentam, et pultes non comedetis ex segete, usque ad diem qua offeretis ex ea Deo vestro. Præceptum est sempiternum in generationibus, cunctisque habitaculis vestris.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Numerabitis ergo ab altero die sabbati, in quo obtulistis manipulum primitiarum, septem hebdomadas plenas,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>usque ad alteram diem expletionis hebdomadæ septimæ, id est, quinquaginta dies : et sic offeretis sacrificium novum Domino</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>ex omnibus habitaculis vestris, panes primitiarum duos de duabus decimis similæ fermentatæ, quos coquetis in primitias Domini.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Offeretisque cum panibus septem agnos immaculatos anniculos, et vitulum de armento unum, et arietes duos, et erunt in holocaustum cum libamentis suis, in odorem suavissimum Domini.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Facietis et hircum pro peccato, duosque agnos anniculos hostias pacificorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cumque elevaverit eos sacerdos cum panibus primitiarum coram Domino, cedent in usum ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et vocabitis hunc diem celeberrimum, atque sanctissimum : omne opus servile non facietis in eo. Legitimum sempiternum erit in cunctis habitaculis, et generationibus vestris.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Postquam autem messueritis segetem terræ vestræ, nec secabitis eam usque ad solum, nec remanentes spicas colligetis : sed pauperibus et peregrinis dimittetis eas. Ego sum Dominus Deus vester.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Loquere filiis Israël : Mense septimo, prima die mensis, erit vobis sabbatum, memoriale, clangentibus tubis, et vocabitur sanctum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>omne opus servile non facietis in eo, et offeretis holocaustum Domino.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Decimo die mensis hujus septimi, dies expiationum erit celeberrimus, et vocabitur sanctus : affligetisque animas vestras in eo, et offeretis holocaustum Domino.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Omne opus servile non facietis in tempore diei hujus : quia dies propitiationis est, ut propitietur vobis Dominus Deus vester.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Omnis anima, quæ afflicta non fuerit die hac, peribit de populis suis :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et quæ operis quippiam fecerit, delebo eam de populo suo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Nihil ergo operis facietis in eo : legitimum sempiternum erit vobis in cunctis generationibus, et habitationibus vestris.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sabbatum requietionis est, et affligetis animas vestras die nono mensis : a vespera usque ad vesperam celebrabitis sabbata vestra.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et locutus est Dominus ad Moysen, dicens :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Loquere filiis Israël : A quintodecimo die mensis hujus septimi, erunt feriæ tabernaculorum septem diebus Domino.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Dies primus vocabitur celeberrimus atque sanctissimus : omne opus servile non facietis in eo.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et septem diebus offeretis holocausta Domino. Dies quoque octavus erit celeberrimus, atque sanctissimus, et offeretis holocaustum Domino : est enim cœtus atque collectæ : omne opus servile non facietis in eo.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Hæ sunt feriæ Domini, quas vocabitis celeberrimas atque sanctissimas, offeretisque in eis oblationes Domino, holocausta et libamenta juxta ritum uniuscujusque diei :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>exceptis sabbatis Domini, donisque vestris, et quæ offeretis ex voto, vel quæ sponte tribuetis Domino.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>A quintodecimo ergo die mensis septimi, quando congregaveritis omnes fructus terræ vestræ, celebrabitis ferias Domini septem diebus : die primo et die octavo erit sabbatum, id est, requies.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Sumetisque vobis die primo fructus arboris pulcherrimæ, spatulasque palmarum, et ramos ligni densarum frondium, et salices de torrente, et lætabimini coram Domino Deo vestro.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Celebrabitisque solemnitatem ejus septem diebus per annum : legitimum sempiternum erit in generationibus vestris. Mense septimo festa celebrabitis,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>et habitabitis in umbraculis septem diebus : omnis, qui de genere est Israël, manebit in tabernaculis,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>ut discant posteri vestri quod in tabernaculis habitare fecerim filios Israël, cum educerem eos de terra Ægypti. Ego Dominus Deus vester.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Locutusque est Moyses super solemnitatibus Domini ad filios Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Leviticus 22</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href=" mnity of the unleavened bread of the Lord. Seven days shall you eat unleavened bread.\"},{\"verse\":7,\"text\":\"The first day shall be most solemn unto you, and holy: you shall do no servile work therein.\"},{\"verse\":8,\"text\":\"But you shall offer sacrifice in fire to the Lord seven days. And the seventh day shall be more solemn, and more holy: and you shall do no servile work therein.\"},{\"verse\":9,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":10,\"text\":\"Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, and shall reap your corn, you shall bring sheaves of ears, the firstfruits of your harvest to the priest.\"},{\"verse\":11,\"text\":\"Who shall lift up the sheaf before the Lord, the next day after the sabbath, that it may be acceptable for you, and shall sanctify it.\"},{\"verse\":12,\"text\":\"And on the same day that the sheaf is consecrated, a lamb without blemish of the first year shall be killed for a holocaust of the Lord.\"},{\"verse\":13,\"text\":\"And the libations shall be offered with it: two tenths of flour tempered with oil, for a burnt offering of the Lord, and a most sweet odour. Libations also of wine, the fourth part of a hin.\"},{\"verse\":14,\"text\":\"You shall not eat either bread, or parched corn, or frumenty or the harvest, until the day that you shall offer thereof to your God. It is a precept for ever throughout your generations, and all your dwellings.\"},{\"verse\":15,\"text\":\"You shall count therefore from the morrow after the sabbath, wherein you offered the sheaf of firstfruits, seven full weeks.\"},{\"verse\":16,\"text\":\"Even unto the morrow after the seventh week be expired, that is to say, fifty days: and so you shall offer a new sacrifice to the Lord.\"},{\"verse\":17,\"text\":\"Out of all your dwellings, two loaves of the firstfruits, of two tenths of flour leavened, which you shall bake for the firstfruits of the Lord.\"},{\"verse\":18,\"text\":\"And you shall offer with the loaves seven lambs without blemish of the first year, and one calf from the herd, and two rams, and they shall be for a holocaust with their libations for a most sweet odour to the Lord.\"},{\"verse\":19,\"text\":\"You shall offer also a buck goat for sin, and two lambs of the first year for sacrifices of peace offerings.\"},{\"verse\":20,\"text\":\"And when the priest hath lifted them up with the loaves of the firstfruits before the Lord, they shall fall to his use.\"},{\"verse\":21,\"text\":\"And you shall call this day most solemn, and most holy. You shall do no servile work therein. It shall be an everlasting ordinance in all your dwellings and generations.\"},{\"verse\":22,\"text\":\"And when you reap the corn of your land, you shall not cut it to the very ground: neither shall you gather the ears that remain. But you shall leave them for the poor and for the strangers. I am the Lord your God.\"},{\"verse\":23,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":24,\"text\":\"Say to the children of Israel: The seventh month, on the first day of the month, you shall keep a sabbath, a memorial, with the sound of trumpets, and it shall be called holy.\"},{\"verse\":25,\"text\":\"You shall do no servile work therein, and you shall offer a holocaust to the Lord.\"},{\"verse\":26,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":27,\"text\":\"Upon the tenth day of this seventh month shall be the day of atonement. It shall be most solemn, and shall be called holy: and you shall afflict your souls on that day, and shall offer a holocaust to the Lord.\"},{\"verse\":28,\"text\":\"You shall do no servile work in the time of this day: because it is a day of propitiation, that the Lord your God may be merciful unto you.\"},{\"verse\":29,\"text\":\"Every soul that is not afflicted on this day, shall perish from among his people.\"},{\"verse\":30,\"text\":\"And every soul that shall do any work, the same will I destroy from among his people.\"},{\"verse\":31,\"text\":\"You shall do no work therefore on that day: it shall be an everlasting ordinance unto you in all your generations, and dwellings.\"},{\"verse\":32,\"text\":\"It is a sabbath of rest, and you shall afflict your souls beginning on the ninth day of the month. From evening until evening you shall celebrate your sabbaths.\"},{\"verse\":33,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":34,\"text\":\"Say to the children of Israel: From the fifteenth day of this same seventh month, shall be kept the feast of tabernacles, seven days to the Lord.\"},{\"verse\":35,\"text\":\"The first day shall be called most solemn and most holy: you shall do no servile work therein. And seven days you shall offer holocausts to the Lord.\"},{\"verse\":36,\"text\":\"The eighth day also shall be most solemn and most holy: and you shall offer holocausts to the Lord. For it is the day of assembly and congregation. You shall do no servile work therein.\"},{\"verse\":37,\"text\":\"These are the feasts of the Lord which you shall call most solemn and most holy, and shall offer on them oblations to the Lord: holocausts and libations according to the rite of every day.\"},{\"verse\":38,\"text\":\"Besides the sabbaths of the Lord, and your gifts, and those things that you offer by vow, or which you shall give to the Lord voluntarily.\"},{\"verse\":39,\"text\":\"So from the fifteenth day of the seventh month, when you shall have gathered in all the fruits of your land, you shall celebrate the feast of the Lord seven days. On the first day and the eighth shall be a sabbath: that is a day of rest.\"},{\"verse\":40,\"text\":\"And you shall take to you on the first day the fruits of the fairest tree, and branches of palm trees, and boughs of thick trees, and willows of the brook: And you shall rejoice before the Lord your God.\"},{\"verse\":41,\"text\":\"And you shall keep the solemnity thereof seven days in the year. It shall be an everlasting ordinance in your generations. In the seventh month shall you celebrate this feast.\"},{\"verse\":42,\"text\":\"And you shall dwell in bowers seven days. Every one that is of the race of Israel, shall dwell in tabernacles:\"},{\"verse\":43,\"text\":\"That your posterity may know, that I made the children of Israel to dwell in tabernacles, when I brought them out of the land of Egypt. I am the Lord your God.\"},{\"verse\":44,\"text\":\"And Moses spoke concerning the feasts of the Lord to the children of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere filiis Israël, et dices ad eos : Hæ sunt feriæ Domini, quas vocabitis sanctas.\"},{\"verse\":3,\"text\":\"Sex diebus facietis opus : dies septimus, quia sabbati requies est, vocabitur sanctus : omne opus non facietis in eo : sabbatum Domini est in cunctis habitationibus vestris.\"},{\"verse\":4,\"text\":\"Hæ sunt ergo feriæ Domini sanctæ, quas celebrare debetis temporibus suis.\"},{\"verse\":5,\"text\":\"Mense primo, quartadecima die mensis ad vesperum, Phase Domini est :\"},{\"verse\":6,\"text\":\"et quintadecima die mensis hujus, solemnitas azymorum Domini est. Septem diebus azyma comedetis.\"},{\"verse\":7,\"text\":\"Dies primus erit vobis celeberrimus, sanctusque : omne opus servile non facietis in eo,\"},{\"verse\":8,\"text\":\"sed offeretis sacrificium in igne Domino septem diebus. Dies autem septimus erit celebrior et sanctior : nullumque servile opus facietis in eo.\"},{\"verse\":9,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":10,\"text\":\"Loquere filiis Israël, et dices ad eos : Cum ingressi fueritis terram, quam ego dabo vobis, et messueritis segetem, feretis manipulos spicarum, primitias messis vestræ, ad sacerdotem :\"},{\"verse\":11,\"text\":\"qui elevabit fasciculum coram Domino, ut acceptabile sit pro vobis, altero die sabbati, et sanctificabit illum.\"},{\"verse\":12,\"text\":\"Atque in eodem die quo manipulus consecratur, cædetur agnus immaculatus anniculus in holocaustum Domini.\"},{\"verse\":13,\"text\":\"Et libamenta offerentur cum eo, duæ decimæ similæ conspersæ oleo in incensum Domini, odoremque suavissimum : liba quoque vini, quarta pars hin.\"},{\"verse\":14,\"text\":\"Panem, et polentam, et pultes non comedetis ex segete, usque ad diem qua offeretis ex ea Deo vestro. Præceptum est sempiternum in generationibus, cunctisque habitaculis vestris.\"},{\"verse\":15,\"text\":\"Numerabitis ergo ab altero die sabbati, in quo obtulistis manipulum primitiarum, septem hebdomadas plenas,\"},{\"verse\":16,\"text\":\"usque ad alteram diem expletionis hebdomadæ septimæ, id est, quinquaginta dies : et sic offeretis sacrificium novum Domino\"},{\"verse\":17,\"text\":\"ex omnibus habitaculis vestris, panes primitiarum duos de duabus decimis similæ fermentatæ, quos coquetis in primitias Domini.\"},{\"verse\":18,\"text\":\"Offeretisque cum panibus septem agnos immaculatos anniculos, et vitulum de armento unum, et arietes duos, et erunt in holocaustum cum libamentis suis, in odorem suavissimum Domini.\"},{\"verse\":19,\"text\":\"Facietis et hircum pro peccato, duosque agnos anniculos hostias pacificorum.\"},{\"verse\":20,\"text\":\"Cumque elevaverit eos sacerdos cum panibus primitiarum coram Domino, cedent in usum ejus.\"},{\"verse\":21,\"text\":\"Et vocabitis hunc diem celeberrimum, atque sanctissimum : omne opus servile non facietis in eo. Legitimum sempiternum erit in cunctis habitaculis, et generationibus vestris.\"},{\"verse\":22,\"text\":\"Postquam autem messueritis segetem terræ vestræ, nec secabitis eam usque ad solum, nec remanentes spicas colligetis : sed pauperibus et peregrinis dimittetis eas. Ego sum Dominus Deus vester.\"},{\"verse\":23,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":24,\"text\":\"Loquere filiis Israël : Mense septimo, prima die mensis, erit vobis sabbatum, memoriale, clangentibus tubis, et vocabitur sanctum :\"},{\"verse\":25,\"text\":\"omne opus servile non facietis in eo, et offeretis holocaustum Domino.\"},{\"verse\":26,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":27,\"text\":\"Decimo die mensis hujus septimi, dies expiationum erit celeberrimus, et vocabitur sanctus : affligetisque animas vestras in eo, et offeretis holocaustum Domino.\"},{\"verse\":28,\"text\":\"Omne opus servile non facietis in tempore diei hujus : quia dies propitiationis est, ut propitietur vobis Dominus Deus vester.\"},{\"verse\":29,\"text\":\"Omnis anima, quæ afflicta non fuerit die hac, peribit de populis suis :\"},{\"verse\":30,\"text\":\"et quæ operis quippiam fecerit, delebo eam de populo suo.\"},{\"verse\":31,\"text\":\"Nihil ergo operis facietis in eo : legitimum sempiternum erit vobis in cunctis generationibus, et habitationibus vestris.\"},{\"verse\":32,\"text\":\"Sabbatum requietionis est, et affligetis animas vestras die nono mensis : a vespera usque ad vesperam celebrabitis sabbata vestra.\"},{\"verse\":33,\"text\":\"Et locutus est Dominus ad Moysen, dicens :\"},{\"verse\":34,\"text\":\"Loquere filiis Israël : A quintodecimo die mensis hujus septimi, erunt feriæ tabernaculorum septem diebus Domino.\"},{\"verse\":35,\"text\":\"Dies primus vocabitur celeberrimus atque sanctissimus : omne opus servile non facietis in eo.\"},{\"verse\":36,\"text\":\"Et septem diebus offeretis holocausta Domino. Dies quoque octavus erit celeberrimus, atque sanctissimus, et offeretis holocaustum Domino : est enim cœtus atque collectæ : omne opus servile non facietis in eo.\"},{\"verse\":37,\"text\":\"Hæ sunt feriæ Domini, quas vocabitis celeberrimas atque sanctissimas, offeretisque in eis oblationes Domino, holocausta et libamenta juxta ritum uniuscujusque diei :\"},{\"verse\":38,\"text\":\"exceptis sabbatis Domini, donisque vestris, et quæ offeretis ex voto, vel quæ sponte tribuetis Domino.\"},{\"verse\":39,\"text\":\"A quintodecimo ergo die mensis septimi, quando congregaveritis omnes fructus terræ vestræ, celebrabitis ferias Domini septem diebus : die primo et die octavo erit sabbatum, id est, requies.\"},{\"verse\":40,\"text\":\"Sumetisque vobis die primo fructus arboris pulcherrimæ, spatulasque palmarum, et ramos ligni densarum frondium, et salices de torrente, et lætabimini coram Domino Deo vestro.\"},{\"verse\":41,\"text\":\"Celebrabitisque solemnitatem ejus septem diebus per annum : legitimum sempiternum erit in generationibus vestris. Mense septimo festa celebrabitis,\"},{\"verse\":42,\"text\":\"et habitabitis in umbraculis septem diebus : omnis, qui de genere est Israël, manebit in tabernaculis,\"},{\"verse\":43,\"text\":\"ut discant posteri vestri quod in tabernaculis habitare fecerim filios Israël, cum educerem eos de terra Ægypti. Ego Dominus Deus vester.\"},{\"verse\":44,\"text\":\"Locutusque est Moyses super solemnitatibus Domini ad filios Israël.\"}],\"summary\":\"Holy days to be kept.\",\"intro\":null,\"prev\":{\"usfm\":\"LEV\",\"chapter\":22,\"label\":\"Leviticus 22\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":24,\"label\":\"Leviticus 24\"}}]]\n"])</script></body></html>
