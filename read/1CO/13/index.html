ass="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Corinthians<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1CO/">About <!-- -->1 Corinthians</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Charity is to be preferred before all gifts.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>If I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And if I should have prophecy and should know all mysteries and all knowledge, and if I should have all faith, so that I could remove mountains, and have not charity, I am nothing.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And if I should distribute all my goods to feed the poor, and if I should deliver my body to be burned, and have not charity, it profiteth me nothing.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Charity is patient, is kind: charity envieth not, dealeth not perversely, is not puffed up,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Is not ambitious, seeketh not her own, is not provoked to anger, thinketh no evil:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Rejoiceth not in iniquity, but rejoiceth with the truth:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Beareth all things, believeth all things, hopeth all things, endureth all things.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Charity never falleth away: whether prophecies shall be made void or tongues shall cease or knowledge shall be destroyed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For we know in part: and we prophesy in part.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But when that which is perfect is come, that which is in part shall be done away.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>When I was a child, I spoke as a child, I understood as a child, I thought as a child. But, when I became a man, I put away the things of a child.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>We see now through a glass in a dark manner: but then face to face. Now I know in part: but then I shall know even as I am known.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And now there remain faith, hope, and charity, these three: but the greatest of these is charity.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Si linguis hominum loquar, et angelorum, caritatem autem non habeam, factus sum velut æs sonans, aut cymbalum tinniens.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et si habuero prophetiam, et noverim mysteria omnia, et omnem scientiam : et si habuero omnem fidem ita ut montes transferam, caritatem autem non habuero, nihil sum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et si distribuero in cibos pauperum omnes facultates meas, et si tradidero corpus meum ita ut ardeam, caritatem autem non habuero, nihil mihi prodest.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Caritas patiens est, benigna est. Caritas non æmulatur, non agit perperam, non inflatur,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>non est ambitiosa, non quærit quæ sua sunt, non irritatur, non cogitat malum,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>non gaudet super iniquitate, congaudet autem veritati :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>omnia suffert, omnia credit, omnia sperat, omnia sustinet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Caritas numquam excidit : sive prophetiæ evacuabuntur, sive linguæ cessabunt, sive scientia destruetur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ex parte enim cognoscimus, et ex parte prophetamus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cum autem venerit quod perfectum est, evacuabitur quod ex parte est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cum essem parvulus, loquebar ut parvulus, sapiebam ut parvulus, cogitabam ut parvulus. Quando autem factus sum vir, evacuavi quæ erant parvuli.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Videmus nunc per speculum in ænigmate : tunc autem facie ad faciem. Nunc cognosco ex parte : tunc autem cognoscam sicut et cognitus sum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc autem manent fides, spes, caritas, tria hæc : major autem horum est caritas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CO/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Corinthians 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-r  feed the poor, and if I should deliver my body to be burned, and have not charity, it profiteth me nothing.\"},{\"verse\":4,\"text\":\"Charity is patient, is kind: charity envieth not, dealeth not perversely, is not puffed up,\"},{\"verse\":5,\"text\":\"Is not ambitious, seeketh not her own, is not provoked to anger, thinketh no evil:\"},{\"verse\":6,\"text\":\"Rejoiceth not in iniquity, but rejoiceth with the truth:\"},{\"verse\":7,\"text\":\"Beareth all things, believeth all things, hopeth all things, endureth all things.\"},{\"verse\":8,\"text\":\"Charity never falleth away: whether prophecies shall be made void or tongues shall cease or knowledge shall be destroyed.\"},{\"verse\":9,\"text\":\"For we know in part: and we prophesy in part.\"},{\"verse\":10,\"text\":\"But when that which is perfect is come, that which is in part shall be done away.\"},{\"verse\":11,\"text\":\"When I was a child, I spoke as a child, I understood as a child, I thought as a child. But, when I became a man, I put away the things of a child.\"},{\"verse\":12,\"text\":\"We see now through a glass in a dark manner: but then face to face. Now I know in part: but then I shall know even as I am known.\"},{\"verse\":13,\"text\":\"And now there remain faith, hope, and charity, these three: but the greatest of these is charity.\"}],\"vul\":[{\"verse\":1,\"text\":\"Si linguis hominum loquar, et angelorum, caritatem autem non habeam, factus sum velut æs sonans, aut cymbalum tinniens.\"},{\"verse\":2,\"text\":\"Et si habuero prophetiam, et noverim mysteria omnia, et omnem scientiam : et si habuero omnem fidem ita ut montes transferam, caritatem autem non habuero, nihil sum.\"},{\"verse\":3,\"text\":\"Et si distribuero in cibos pauperum omnes facultates meas, et si tradidero corpus meum ita ut ardeam, caritatem autem non habuero, nihil mihi prodest.\"},{\"verse\":4,\"text\":\"Caritas patiens est, benigna est. Caritas non æmulatur, non agit perperam, non inflatur,\"},{\"verse\":5,\"text\":\"non est ambitiosa, non quærit quæ sua sunt, non irritatur, non cogitat malum,\"},{\"verse\":6,\"text\":\"non gaudet super iniquitate, congaudet autem veritati :\"},{\"verse\":7,\"text\":\"omnia suffert, omnia credit, omnia sperat, omnia sustinet.\"},{\"verse\":8,\"text\":\"Caritas numquam excidit : sive prophetiæ evacuabuntur, sive linguæ cessabunt, sive scientia destruetur.\"},{\"verse\":9,\"text\":\"Ex parte enim cognoscimus, et ex parte prophetamus.\"},{\"verse\":10,\"text\":\"Cum autem venerit quod perfectum est, evacuabitur quod ex parte est.\"},{\"verse\":11,\"text\":\"Cum essem parvulus, loquebar ut parvulus, sapiebam ut parvulus, cogitabam ut parvulus. Quando autem factus sum vir, evacuavi quæ erant parvuli.\"},{\"verse\":12,\"text\":\"Videmus nunc per speculum in ænigmate : tunc autem facie ad faciem. Nunc cognosco ex parte : tunc autem cognoscam sicut et cognitus sum.\"},{\"verse\":13,\"text\":\"Nunc autem manent fides, spes, caritas, tria hæc : major autem horum est caritas.\"}],\"summary\":\"Charity is to be preferred before all gifts.\",\"intro\":null,\"prev\":{\"usfm\":\"1CO\",\"chapter\":12,\"label\":\"1 Corinthians 12\"},\"next\":{\"usfm\":\"1CO\",\"chapter\":14,\"label\":\"1 Corinthians 14\"}}]]\n"])</script></body></html>
