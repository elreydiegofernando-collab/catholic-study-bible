th d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Corinthians<!-- --> <span class="text-stone-500">16</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Of collection of alms. Admonitions and salutations.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now concerning the collections that are made for the saints: as I have given order to the churches of Galatia, so do ye also.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>On the first day of the week, let every one of you put apart with himself, laying up what it shall well please him: that when I come, the collections be not then to be made.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when I shall be with you, whomsoever you shall approve by letters, them will I send to carry your grace to Jerusalem.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And if it be meet that I also go, they shall go with me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Now I will come to you, when I shall have passed through Macedonia. For I shall pass through Macedonia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And with you perhaps I shall abide, or even spend the winter: that you may bring me on my way whithersoever I shall go.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For I will not see you now by the way: for I trust that I shall abide with you some time, if the Lord permit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But I will tarry at Ephesus, until Pentecost.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For a great door and evident is opened unto me: and many adversaries.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Now if Timothy come, see that he be with you without fear: for he worketh the work of the Lord, as I also do.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Let no man therefore despise him: but conduct ye him on his way in peace, that he may come to me. For I look for him with the brethren.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And touching our brother Apollo, I give you to understand that I much entreated him to come unto you with the brethren: and indeed it was not his will at all to come at this time. But he will come when he shall have leisure.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Watch ye: stand fast in the faith: do manfully and be strengthened.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Let all your things be done in charity.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I beseech you, brethren, you know the house of Stephanus, and of Fortunatus, and of Achaicus, that they are the firstfruits of Achaia, and have dedicated themselves to the ministry of the saints:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>That you also be subject to such and to every one that worketh with us and laboureth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And I rejoice in the presence of Stephanus and Fortunatus and Achaicus: because that which was wanting on your part, they have supplied.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For they have refreshed both my spirit and yours. Know them, therefore, that are such.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The churches of Asia salute you. Aquila and Priscilla salute you much in the Lord, with the church that is in their house, with whom I also lodge.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>All the brethren salute you. Salute one another with a holy kiss.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The salutation of me Paul, with my own hand.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If any man love not our Lord Jesus Christ, let him be anathema, maranatha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The grace of our Lord Jesus Christ be with you.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>My charity be with you all in Christ Jesus. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>De collectis autem, quæ fiunt in sanctos, sicut ordinavi ecclesiis Galatiæ, ita et vos facite.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Per unam sabbati unusquisque vestrum apud se seponat, recondens quod ei bene placuerit : ut non, cum venero, tunc collectæ fiant.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cum autem præsens fuero, quos probaveritis per epistolas, hos mittam perferre gratiam vestram in Jerusalem.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quod si dignum fuerit ut et ego eam, mecum ibunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Veniam autem ad vos, cum Macedoniam pertransiero : nam Macedoniam pertransibo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Apud vos autem forsitan manebo, vel etiam hiemabo : ut vos me deducatis quocumque iero.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nolo enim vos modo in transitu videre, spero enim me aliquantulum temporis manere apud vos, si Dominus permiserit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Permanebo autem Ephesi usque ad Pentecosten.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ostium enim mihi apertum est magnum, et evidens : et adversarii multi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si autem venerit Timotheus, videte ut sine timore sit apud vos : opus enim Domini operatur, sicut et ego.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ne quis ergo illum spernat : deducite autem illum in pace, ut veniat ad me : exspecto enim illum cum fratribus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>De Apollo autem fratre vobis notum facio, quoniam multum rogavi eum ut veniret ad vos cum fratribus : et utique non fuit voluntas ut nunc veniret : veniet autem, cum ei vacuum fuerit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vigilate, state in fide, viriliter agite, et confortamini.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Omnia vestra in caritate fiant.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Obsecro autem vos fratres, nostis domum Stephanæ, et Fortunati, et Achaici : quoniam sunt primitiæ Achaiæ, et in ministerium sanctorum ordinaverunt seipsos :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>ut et vos subditi sitis ejusmodi, et omni cooperanti, et laboranti.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Gaudeo autem in præsentia Stephanæ, et Fortunati, et Achaici : quoniam id, quod vobis deerat, ipsi suppleverunt :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>refecerunt enim et meum spiritum, et vestrum. Cognoscite ergo qui hujusmodi sunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Salutant vos ecclesiæ Asiæ. Salutant vos in Domino multum, Aquila et Priscilla cum domestica sua ecclesia : apud quos et hospitor.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Salutant vos omnes fratres. Salutate invicem in osculo sancto.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Salutatio, mea manu Pauli.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si quis non amat Dominum nostrum Jesum Christum, sit anathema, Maran Atha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Gratia Domini nostri Jesu Christi vobiscum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Caritas mea cum omnibus vobis in Christo Jesu. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CO/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Corinthians 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CO/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Corinthians 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shri  Pentecost.\"},{\"verse\":9,\"text\":\"For a great door and evident is opened unto me: and many adversaries.\"},{\"verse\":10,\"text\":\"Now if Timothy come, see that he be with you without fear: for he worketh the work of the Lord, as I also do.\"},{\"verse\":11,\"text\":\"Let no man therefore despise him: but conduct ye him on his way in peace, that he may come to me. For I look for him with the brethren.\"},{\"verse\":12,\"text\":\"And touching our brother Apollo, I give you to understand that I much entreated him to come unto you with the brethren: and indeed it was not his will at all to come at this time. But he will come when he shall have leisure.\"},{\"verse\":13,\"text\":\"Watch ye: stand fast in the faith: do manfully and be strengthened.\"},{\"verse\":14,\"text\":\"Let all your things be done in charity.\"},{\"verse\":15,\"text\":\"And I beseech you, brethren, you know the house of Stephanus, and of Fortunatus, and of Achaicus, that they are the firstfruits of Achaia, and have dedicated themselves to the ministry of the saints:\"},{\"verse\":16,\"text\":\"That you also be subject to such and to every one that worketh with us and laboureth.\"},{\"verse\":17,\"text\":\"And I rejoice in the presence of Stephanus and Fortunatus and Achaicus: because that which was wanting on your part, they have supplied.\"},{\"verse\":18,\"text\":\"For they have refreshed both my spirit and yours. Know them, therefore, that are such.\"},{\"verse\":19,\"text\":\"The churches of Asia salute you. Aquila and Priscilla salute you much in the Lord, with the church that is in their house, with whom I also lodge.\"},{\"verse\":20,\"text\":\"All the brethren salute you. Salute one another with a holy kiss.\"},{\"verse\":21,\"text\":\"The salutation of me Paul, with my own hand.\"},{\"verse\":22,\"text\":\"If any man love not our Lord Jesus Christ, let him be anathema, maranatha.\"},{\"verse\":23,\"text\":\"The grace of our Lord Jesus Christ be with you.\"},{\"verse\":24,\"text\":\"My charity be with you all in Christ Jesus. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"De collectis autem, quæ fiunt in sanctos, sicut ordinavi ecclesiis Galatiæ, ita et vos facite.\"},{\"verse\":2,\"text\":\"Per unam sabbati unusquisque vestrum apud se seponat, recondens quod ei bene placuerit : ut non, cum venero, tunc collectæ fiant.\"},{\"verse\":3,\"text\":\"Cum autem præsens fuero, quos probaveritis per epistolas, hos mittam perferre gratiam vestram in Jerusalem.\"},{\"verse\":4,\"text\":\"Quod si dignum fuerit ut et ego eam, mecum ibunt.\"},{\"verse\":5,\"text\":\"Veniam autem ad vos, cum Macedoniam pertransiero : nam Macedoniam pertransibo.\"},{\"verse\":6,\"text\":\"Apud vos autem forsitan manebo, vel etiam hiemabo : ut vos me deducatis quocumque iero.\"},{\"verse\":7,\"text\":\"Nolo enim vos modo in transitu videre, spero enim me aliquantulum temporis manere apud vos, si Dominus permiserit.\"},{\"verse\":8,\"text\":\"Permanebo autem Ephesi usque ad Pentecosten.\"},{\"verse\":9,\"text\":\"Ostium enim mihi apertum est magnum, et evidens : et adversarii multi.\"},{\"verse\":10,\"text\":\"Si autem venerit Timotheus, videte ut sine timore sit apud vos : opus enim Domini operatur, sicut et ego.\"},{\"verse\":11,\"text\":\"Ne quis ergo illum spernat : deducite autem illum in pace, ut veniat ad me : exspecto enim illum cum fratribus.\"},{\"verse\":12,\"text\":\"De Apollo autem fratre vobis notum facio, quoniam multum rogavi eum ut veniret ad vos cum fratribus : et utique non fuit voluntas ut nunc veniret : veniet autem, cum ei vacuum fuerit.\"},{\"verse\":13,\"text\":\"Vigilate, state in fide, viriliter agite, et confortamini.\"},{\"verse\":14,\"text\":\"Omnia vestra in caritate fiant.\"},{\"verse\":15,\"text\":\"Obsecro autem vos fratres, nostis domum Stephanæ, et Fortunati, et Achaici : quoniam sunt primitiæ Achaiæ, et in ministerium sanctorum ordinaverunt seipsos :\"},{\"verse\":16,\"text\":\"ut et vos subditi sitis ejusmodi, et omni cooperanti, et laboranti.\"},{\"verse\":17,\"text\":\"Gaudeo autem in præsentia Stephanæ, et Fortunati, et Achaici : quoniam id, quod vobis deerat, ipsi suppleverunt :\"},{\"verse\":18,\"text\":\"refecerunt enim et meum spiritum, et vestrum. Cognoscite ergo qui hujusmodi sunt.\"},{\"verse\":19,\"text\":\"Salutant vos ecclesiæ Asiæ. Salutant vos in Domino multum, Aquila et Priscilla cum domestica sua ecclesia : apud quos et hospitor.\"},{\"verse\":20,\"text\":\"Salutant vos omnes fratres. Salutate invicem in osculo sancto.\"},{\"verse\":21,\"text\":\"Salutatio, mea manu Pauli.\"},{\"verse\":22,\"text\":\"Si quis non amat Dominum nostrum Jesum Christum, sit anathema, Maran Atha.\"},{\"verse\":23,\"text\":\"Gratia Domini nostri Jesu Christi vobiscum.\"},{\"verse\":24,\"text\":\"Caritas mea cum omnibus vobis in Christo Jesu. Amen.\"}],\"summary\":\"Of collection of alms. Admonitions and salutations.\",\"intro\":null,\"prev\":{\"usfm\":\"1CO\",\"chapter\":15,\"label\":\"1 Corinthians 15\"},\"next\":{\"usfm\":\"2CO\",\"chapter\":1,\"label\":\"2 Corinthians 1\"}}]]\n"])</script></body></html>
