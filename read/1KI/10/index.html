m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Kings<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->3 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The queen of Saba cometh to king Solomon: his riches and glory.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the queen of Saba having heard of the fame of Solomon in the name of the Lord, came to try him with hard questions.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And entering into Jerusalem with a great train, and riches, and camels that carried spices, and an immense quantity of gold, and precious stones, she came to king Solomon, and spoke to him all that she had in her heart.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Solomon informed her of all the things she proposed to him: there was not any word the king was ignorant of, and which he could not answer her.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when the queen of Saba saw all the wisdom of Solomon, and the house which he had built,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the meat of his table, and the apartments of his servants, and the order of his ministers, and their apparel, and the cupbearers, and the holocausts, which he offered in the house of the Lord, she had no longer any spirit in her;</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And she said to the king: The report is true, which I heard in my own country,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Concerning thy words, and concerning thy wisdom. And I did not believe them that told me, till I came myself, and saw with my own eyes, and have found that the half hath not been told me: thy wisdom and thy works exceed the fame which I heard.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Blessed are thy men, and blessed are thy servants, who stand before thee always, and hear thy wisdom.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Blessed be the Lord thy God, whom thou hast pleased, and who hath set thee upon the throne of Israel, because the Lord hath loved Israel for ever, and hath appointed thee king, to do judgment and justice.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And she gave the king a hundred and twenty talents of gold, and of spices a very great store, and precious stones: there was brought no more such abundance of spices as these which the queen of Saba gave to king Solomon.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>(The navy also of Hiram, which brought gold from Ophir, brought from Ophir great plenty of thyine trees, and precious stones.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the king made of the thyine trees the rails of the house of the Lord, and of the king’s house: and citterns and harps for singers: there were no such thyine trees as these brought nor seen unto this day.)</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And king Solomon gave the queen of Saba all that she desired, and asked of him: besides what he offered her of himself of his royal bounty. And she returned, and went to her own country, with her servants.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the weight of the gold that was brought to Solomon every year, was six hundred and sixty-six talents of gold:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Besides that which the men brought him that were over the tributes, and the merchants, and they that sold by retail, and all the kings of Arabia, and the governors of the country.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Solomon made two hundred shields of the purest gold: he allowed six hundred sicles of gold for the plates of one shield.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And three hundred targets of fine gold: three hundred pounds of gold covered one target: and the king put them in the house of the forest of Libanus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>King Solomon also made a great throne of ivory: and overlaid it with the finest gold.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>It had six steps: and the top of the throne was round behind: and there were two hands on either side holding the seat: and two lions stood, one at each hand,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And twelve little lions stood upon the six steps, on the one side and on the other: there was no such work made in any kingdom.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Moreover, all the vessels out of which king Solomon drank, were of gold: and all the furniture of the house of the forest of Libanus was of most pure gold: there was no silver, nor was any account made of it in the days of Solomon:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For the king’s navy, once in three years, went with the navy of Hiram by sea to Tharsis, and brought from thence gold, and silver, and elephants’ teeth, and apes, and peacocks.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And king Solomon exceeded all the kings of the earth in riches and wisdom.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And all the earth desired to see Solomon’s face, to hear his wisdom, which God had given in his heart.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And every one brought him presents, vessels of silver and of gold, garments, and armour, and spices, and horses, and mules, every year.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Solomon gathered together chariots and horsemen, and he had a thousand four hundred chariots, and twelve thousand horsemen: and he bestowed them in fenced cities, and with the king in Jerusalem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he made silver to be as plentiful in Jerusalem as stones: and cedars to be as common as sycamores which grow in the plains.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And horses were brought for Solomon out of Egypt, and Coa: for the king’s merchants bought them out of Coa, and brought them at a set price.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And a chariot of four horses came out of Egypt, for six hundred sicles of silver, and a horse for a hundred and fifty. And after this manner did all the kings of the Hethites, and of Syria, sell horses.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sed et regina Saba, audita fama Salomonis in nomine Domini, venit tentare eum in ænigmatibus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ingressa Jerusalem multo cum comitatu et divitiis, camelis portantibus aromata, et aurum infinitum nimis, et gemmas pretiosas, venit ad regem Salomonem, et locuta est ei universa quæ habebat in corde suo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et docuit eam Salomon omnia verba quæ proposuerat : non fuit sermo qui regem posset latere, et non responderet ei.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Videns autem regina Saba omnem sapientiam Salomonis, et domum quam ædificaverat,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et cibos mensæ ejus, et habitacula servorum, et ordines ministrantium, vestesque eorum, et pincernas, et holocausta quæ offerebat in domo Domini : non habebat ultra spiritum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque ad regem : Verus est sermo quem audivi in terra mea</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>super sermonibus tuis, et super sapientia tua : et non credebam narrantibus mihi, donec ipsa veni, et vidi oculis meis, et probavi quod media pars mihi nuntiata non fuerit : major est sapientia et opera tua, quam rumor quem audivi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Beati viri tui, et beati servi tui, qui stant coram te semper, et audiunt sapientiam tuam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sit Dominus Deus tuus benedictus, cui complacuisti, et posuit te super thronum Israël, eo quod dilexerit Dominus Israël in sempiternum, et constituit te regem ut faceres judicium et justitiam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dedit ergo regi centum viginti talenta auri, et aromata multa nimis, et gemmas pretiosas : non sunt allata ultra aromata tam multa, quam ea quæ dedit regina Saba regi Salomoni.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>(Sed et classis Hiram, quæ portabat aurum de Ophir, attulit ex Ophir ligna thyina multa nimis, et gemmas pretiosas.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fecitque rex de lignis thyinis fulcra domus Domini et domus regiæ, et citharas lyrasque cantoribus : non sunt allata hujuscemodi ligna thyina, neque visa usque in præsentem diem.)</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Rex autem Salomon dedit reginæ Saba omnia quæ voluit et petivit ab eo, exceptis his quæ ultro obtulerat ei munere regio. Quæ reversa est, et abiit in terram suam cum servis suis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Erat autem pondus auri quod afferebatur Salomoni per annos singulos, sexcentorum sexaginta sex talentorum auri,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>excepto eo quod afferebant viri qui super vectigalia erant, et negotiatores, universique scruta vendentes, et omnes reges Arabiæ, ducesque terræ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fecit quoque rex Salomon ducenta scuta de auro purissimo : sexcentos auri siclos dedit in laminas scuti unius.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et trecentas peltas ex auro probato : trecentæ minæ auri unam peltam vestiebant : posuitque eas rex in domo saltus Libani.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Fecit etiam rex Salomon thronum de ebore grandem : et vestivit eum auro fulvo nimis,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>qui habebat sex gradus : et summitas throni rotunda erat in parte posteriori : et duæ manus hinc atque inde tenentes sedile : et duo leones stabant juxta manus singulas.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et duodecim leunculi stantes super sex gradus hinc atque inde : non est factum tale opus in universis regnis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sed et omnia vasa quibus potabat rex Salomon, erant aurea : et universa supellex domus saltus Libani de auro purissimo : non erat argentum, nec alicujus pretii putabatur in diebus Salomonis,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>quia classis regis per mare cum classe Hiram semel per tres annos ibat in Tharsis, deferens inde aurum, et argentum, et dentes elephantorum, et simias, et pavos.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Magnificatus est ergo rex Salomon super omnes reges terræ divitiis et sapientia.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et universa terra desiderabat vultum Salomonis, ut audiret sapientiam ejus, quam dederat Deus in corde ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et singuli deferebant ei munera, vasa argentea et aurea, vestes et arma bellica, aromata quoque, et equos et mulos per annos singulos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Congregavitque Salomon currus et equites, et facti sunt ei mille quadringenti currus, et duodecim millia equitum : et disposuit eos per civitates munitas, et cum rege in Jerusalem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Fecitque ut tanta esset abundantia argenti in Jerusalem, quanta et lapidum : et cedrorum præbuit multitudinem quasi sycomoros quæ nascuntur in campestribus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et educebantur equi Salomoni de Ægypto, et de Coa. Negotiatores enim regis emebant de Coa, et statuto pretio perducebant.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Egrediebatur autem quadriga ex Ægypto sexcentis siclis argenti, et equus centum quinquaginta. Atque in hunc modum cuncti reges Hethæorum et Syriæ equos venundabant.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a c queen of Saba having heard of the fame of Solomon in the name of the Lord, came to try him with hard questions.\"},{\"verse\":2,\"text\":\"And entering into Jerusalem with a great train, and riches, and camels that carried spices, and an immense quantity of gold, and precious stones, she came to king Solomon, and spoke to him all that she had in her heart.\"},{\"verse\":3,\"text\":\"And Solomon informed her of all the things she proposed to him: there was not any word the king was ignorant of, and which he could not answer her.\"},{\"verse\":4,\"text\":\"And when the queen of Saba saw all the wisdom of Solomon, and the house which he had built,\"},{\"verse\":5,\"text\":\"And the meat of his table, and the apartments of his servants, and the order of his ministers, and their apparel, and the cupbearers, and the holocausts, which he offered in the house of the Lord, she had no longer any spirit in her;\"},{\"verse\":6,\"text\":\"And she said to the king: The report is true, which I heard in my own country,\"},{\"verse\":7,\"text\":\"Concerning thy words, and concerning thy wisdom. And I did not believe them that told me, till I came myself, and saw with my own eyes, and have found that the half hath not been told me: thy wisdom and thy works exceed the fame which I heard.\"},{\"verse\":8,\"text\":\"Blessed are thy men, and blessed are thy servants, who stand before thee always, and hear thy wisdom.\"},{\"verse\":9,\"text\":\"Blessed be the Lord thy God, whom thou hast pleased, and who hath set thee upon the throne of Israel, because the Lord hath loved Israel for ever, and hath appointed thee king, to do judgment and justice.\"},{\"verse\":10,\"text\":\"And she gave the king a hundred and twenty talents of gold, and of spices a very great store, and precious stones: there was brought no more such abundance of spices as these which the queen of Saba gave to king Solomon.\"},{\"verse\":11,\"text\":\"(The navy also of Hiram, which brought gold from Ophir, brought from Ophir great plenty of thyine trees, and precious stones.\"},{\"verse\":12,\"text\":\"And the king made of the thyine trees the rails of the house of the Lord, and of the king’s house: and citterns and harps for singers: there were no such thyine trees as these brought nor seen unto this day.)\"},{\"verse\":13,\"text\":\"And king Solomon gave the queen of Saba all that she desired, and asked of him: besides what he offered her of himself of his royal bounty. And she returned, and went to her own country, with her servants.\"},{\"verse\":14,\"text\":\"And the weight of the gold that was brought to Solomon every year, was six hundred and sixty-six talents of gold:\"},{\"verse\":15,\"text\":\"Besides that which the men brought him that were over the tributes, and the merchants, and they that sold by retail, and all the kings of Arabia, and the governors of the country.\"},{\"verse\":16,\"text\":\"And Solomon made two hundred shields of the purest gold: he allowed six hundred sicles of gold for the plates of one shield.\"},{\"verse\":17,\"text\":\"And three hundred targets of fine gold: three hundred pounds of gold covered one target: and the king put them in the house of the forest of Libanus.\"},{\"verse\":18,\"text\":\"King Solomon also made a great throne of ivory: and overlaid it with the finest gold.\"},{\"verse\":19,\"text\":\"It had six steps: and the top of the throne was round behind: and there were two hands on either side holding the seat: and two lions stood, one at each hand,\"},{\"verse\":20,\"text\":\"And twelve little lions stood upon the six steps, on the one side and on the other: there was no such work made in any kingdom.\"},{\"verse\":21,\"text\":\"Moreover, all the vessels out of which king Solomon drank, were of gold: and all the furniture of the house of the forest of Libanus was of most pure gold: there was no silver, nor was any account made of it in the days of Solomon:\"},{\"verse\":22,\"text\":\"For the king’s navy, once in three years, went with the navy of Hiram by sea to Tharsis, and brought from thence gold, and silver, and elephants’ teeth, and apes, and peacocks.\"},{\"verse\":23,\"text\":\"And king Solomon exceeded all the kings of the earth in riches and wisdom.\"},{\"verse\":24,\"text\":\"And all the earth desired to see Solomon’s face, to hear his wisdom, which God had given in his heart.\"},{\"verse\":25,\"text\":\"And every one brought him presents, vessels of silver and of gold, garments, and armour, and spices, and horses, and mules, every year.\"},{\"verse\":26,\"text\":\"And Solomon gathered together chariots and horsemen, and he had a thousand four hundred chariots, and twelve thousand horsemen: and he bestowed them in fenced cities, and with the king in Jerusalem.\"},{\"verse\":27,\"text\":\"And he made silver to be as plentiful in Jerusalem as stones: and cedars to be as common as sycamores which grow in the plains.\"},{\"verse\":28,\"text\":\"And horses were brought for Solomon out of Egypt, and Coa: for the king’s merchants bought them out of Coa, and brought them at a set price.\"},{\"verse\":29,\"text\":\"And a chariot of four horses came out of Egypt, for six hundred sicles of silver, and a horse for a hundred and fifty. And after this manner did all the kings of the Hethites, and of Syria, sell horses.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sed et regina Saba, audita fama Salomonis in nomine Domini, venit tentare eum in ænigmatibus.\"},{\"verse\":2,\"text\":\"Et ingressa Jerusalem multo cum comitatu et divitiis, camelis portantibus aromata, et aurum infinitum nimis, et gemmas pretiosas, venit ad regem Salomonem, et locuta est ei universa quæ habebat in corde suo.\"},{\"verse\":3,\"text\":\"Et docuit eam Salomon omnia verba quæ proposuerat : non fuit sermo qui regem posset latere, et non responderet ei.\"},{\"verse\":4,\"text\":\"Videns autem regina Saba omnem sapientiam Salomonis, et domum quam ædificaverat,\"},{\"verse\":5,\"text\":\"et cibos mensæ ejus, et habitacula servorum, et ordines ministrantium, vestesque eorum, et pincernas, et holocausta quæ offerebat in domo Domini : non habebat ultra spiritum.\"},{\"verse\":6,\"text\":\"Dixitque ad regem : Verus est sermo quem audivi in terra mea\"},{\"verse\":7,\"text\":\"super sermonibus tuis, et super sapientia tua : et non credebam narrantibus mihi, donec ipsa veni, et vidi oculis meis, et probavi quod media pars mihi nuntiata non fuerit : major est sapientia et opera tua, quam rumor quem audivi.\"},{\"verse\":8,\"text\":\"Beati viri tui, et beati servi tui, qui stant coram te semper, et audiunt sapientiam tuam.\"},{\"verse\":9,\"text\":\"Sit Dominus Deus tuus benedictus, cui complacuisti, et posuit te super thronum Israël, eo quod dilexerit Dominus Israël in sempiternum, et constituit te regem ut faceres judicium et justitiam.\"},{\"verse\":10,\"text\":\"Dedit ergo regi centum viginti talenta auri, et aromata multa nimis, et gemmas pretiosas : non sunt allata ultra aromata tam multa, quam ea quæ dedit regina Saba regi Salomoni.\"},{\"verse\":11,\"text\":\"(Sed et classis Hiram, quæ portabat aurum de Ophir, attulit ex Ophir ligna thyina multa nimis, et gemmas pretiosas.\"},{\"verse\":12,\"text\":\"Fecitque rex de lignis thyinis fulcra domus Domini et domus regiæ, et citharas lyrasque cantoribus : non sunt allata hujuscemodi ligna thyina, neque visa usque in præsentem diem.)\"},{\"verse\":13,\"text\":\"Rex autem Salomon dedit reginæ Saba omnia quæ voluit et petivit ab eo, exceptis his quæ ultro obtulerat ei munere regio. Quæ reversa est, et abiit in terram suam cum servis suis.\"},{\"verse\":14,\"text\":\"Erat autem pondus auri quod afferebatur Salomoni per annos singulos, sexcentorum sexaginta sex talentorum auri,\"},{\"verse\":15,\"text\":\"excepto eo quod afferebant viri qui super vectigalia erant, et negotiatores, universique scruta vendentes, et omnes reges Arabiæ, ducesque terræ.\"},{\"verse\":16,\"text\":\"Fecit quoque rex Salomon ducenta scuta de auro purissimo : sexcentos auri siclos dedit in laminas scuti unius.\"},{\"verse\":17,\"text\":\"Et trecentas peltas ex auro probato : trecentæ minæ auri unam peltam vestiebant : posuitque eas rex in domo saltus Libani.\"},{\"verse\":18,\"text\":\"Fecit etiam rex Salomon thronum de ebore grandem : et vestivit eum auro fulvo nimis,\"},{\"verse\":19,\"text\":\"qui habebat sex gradus : et summitas throni rotunda erat in parte posteriori : et duæ manus hinc atque inde tenentes sedile : et duo leones stabant juxta manus singulas.\"},{\"verse\":20,\"text\":\"Et duodecim leunculi stantes super sex gradus hinc atque inde : non est factum tale opus in universis regnis.\"},{\"verse\":21,\"text\":\"Sed et omnia vasa quibus potabat rex Salomon, erant aurea : et universa supellex domus saltus Libani de auro purissimo : non erat argentum, nec alicujus pretii putabatur in diebus Salomonis,\"},{\"verse\":22,\"text\":\"quia classis regis per mare cum classe Hiram semel per tres annos ibat in Tharsis, deferens inde aurum, et argentum, et dentes elephantorum, et simias, et pavos.\"},{\"verse\":23,\"text\":\"Magnificatus est ergo rex Salomon super omnes reges terræ divitiis et sapientia.\"},{\"verse\":24,\"text\":\"Et universa terra desiderabat vultum Salomonis, ut audiret sapientiam ejus, quam dederat Deus in corde ejus.\"},{\"verse\":25,\"text\":\"Et singuli deferebant ei munera, vasa argentea et aurea, vestes et arma bellica, aromata quoque, et equos et mulos per annos singulos.\"},{\"verse\":26,\"text\":\"Congregavitque Salomon currus et equites, et facti sunt ei mille quadringenti currus, et duodecim millia equitum : et disposuit eos per civitates munitas, et cum rege in Jerusalem.\"},{\"verse\":27,\"text\":\"Fecitque ut tanta esset abundantia argenti in Jerusalem, quanta et lapidum : et cedrorum præbuit multitudinem quasi sycomoros quæ nascuntur in campestribus.\"},{\"verse\":28,\"text\":\"Et educebantur equi Salomoni de Ægypto, et de Coa. Negotiatores enim regis emebant de Coa, et statuto pretio perducebant.\"},{\"verse\":29,\"text\":\"Egrediebatur autem quadriga ex Ægypto sexcentis siclis argenti, et equus centum quinquaginta. Atque in hunc modum cuncti reges Hethæorum et Syriæ equos venundabant.\"}],\"summary\":\"The queen of Saba cometh to king Solomon: his riches and glory.\",\"intro\":null,\"prev\":{\"usfm\":\"1KI\",\"chapter\":9,\"label\":\"1 Kings 9\"},\"next\":{\"usfm\":\"1KI\",\"chapter\":11,\"label\":\"1 Kings 11\"}}]]\n"])</script></body></html>
