[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Kings<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->3 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1KI/">About <!-- -->1 Kings</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Solomon’s chief officers. His riches and wisdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And king Solomon reigned over all Israel:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And these were the princes which he had: Azarias, the son of Sadoc, the priest:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Elihoreph, and Ahia, the sons of Sisa, scribes: Josaphat, the son of Ahilud, recorder:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Banaias, the son of Joiada, over the army: and Sadoc, and Abiathar, priests.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Azarias, the son of Nathan, over them that were about the king: Zabud, the son of Nathan, the priest, the king’s friend:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Ahisar, governor of the house: and Adoniram, the son of Abda, over the tribute.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Solomon had twelve governors over all Israel, who provided victuals for the king and for his house hold: for every one provided necessaries, each man his month in the year.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And these are their names: Benhur, in mount Ephraim.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Bendecar, in Macces, and in Salebim, and in Bethsames, and in Elon, and in Bethanan.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Benhesed, in Aruboth: his was Socho, and all the land of Epher.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Benabinadab, to whom belonged all Nephath-Dor: he had Tapheth, the daughter of Solomon, to wife.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Bana, the son of Ahilud, who governed Thanac, and Mageddo, and all Bethsan, which is by Sarthana, beneath Jezrael, from Bethsan unto Abelmehula, over against Jecmaan.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Bengaber, in Ramoth Galaad: he had the town of Jair, the son of Manasses, in Galaad: he was chief in all the country of Argob, which is in Basan, threescore great cities with walls, and brazen bolts.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ahinadab, the son of Addo, was chief in Manaim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Achimaas, in Nephthali: he also had Basemath, the daughter of Solomon, to wife.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Baana, the son of Husi, in Aser, and in Baloth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Josaphat, the son of Pharue, in Issachar.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Semei, the son of Ela, in Benjamin.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Gaber, the son of Uri, in the land of Galaad, in the land of Sehon, the king of the Amorrhites, and of Og, the king of Basan, over all that were in that land.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Juda and Israel were innumerable, as the sand of the sea in multitude; eating and drinking, and rejoicing.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Solomon had under him all the kingdoms, from the river to the land of the Philistines, even to the border of Egypt: and they brought him presents, and served him all the days of his life.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the provision of Solomon, for each day, was thirty measures of fine flour, and threescore measures of meal;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ten fat oxen, and twenty out of the pastures, and a hundred rams; besides venison of harts, roes, and buffles, and fatted fowls.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For he had all the country which was beyond the river, from Thaphsa to Gazan, and all the kings of those countries: and he had peace on every side round about.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Juda, and Israel, dwelt without any fear, every one under his vine, and under his fig tree, from Dan to Bersabee, all the days of Solomon.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Solomon had forty thousand stalls of chariot horses, and twelve thousand for the saddle.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the foresaid governors of the king fed them; and they furnished the necessaries also for king Solomon’s table, with great care, in their time.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They brought barley also, and straw for the horses and beasts, to the place where the king was, according as it was appointed them.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And God gave to Solomon wisdom, and understanding exceeding much, and largeness of heart, as the sand that is on the sea shore.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the wisdom of Solomon surpassed the wisdom of all the Orientals, and of the Egyptians;</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And he was wiser than all men: wiser than Ethan, the Ezrahite, and Heman, and Chalcol, and Dorda, the sons of Mahol, and he was renowned in all nations round about.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Solomon also spoke three thousand parables: and his poems were a thousand and five.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he treated about trees, from the cedar that is in Libanus, unto the hyssop that cometh out of the wall: and he discoursed of beasts, and of fowls, and of creeping things, and of fishes.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And they came from all nations to hear the wisdom of Solomon, and from all the kings of the earth, who heard of his wisdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem rex Salomon regnans super omnem Israël :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et hi principes quos habebat : Azarias filius Sadoc sacerdotis :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Elihoreph et Ahia filii Sisa scribæ : Josaphat filius Ahilud a commentariis :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Banaias filius Jojadæ super exercitum : Sadoc autem et Abiathar sacerdotes :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Azarias filius Nathan super eos qui assistebant regi : Zabud filius Nathan sacerdos, amicus regis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et Ahisar præpositus domus : et Adoniram filius Abda super tributa.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Habebat autem Salomon duodecim præfectos super omnem Israël, qui præbebant annonam regi et domui ejus : per singulos enim menses in anno, singuli necessaria ministrabant.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et hæc nomina eorum : Benhur in monte Ephraim.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Bendecar in Macces, et in Salebim, et in Bethsames, et in Elon, et in Bethanan.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Benhesed in Aruboth : ipsius erat Socho, et omnis terra Epher.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Benabinadab, cujus omnis Nephath Dor : Tapheth filiam Salomonis habebat uxorem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Bana filius Ahilud regebat Thanac et Mageddo, et universam Bethsan, quæ est juxta Sarthana subter Jezrahel, a Bethsan usque Abelmehula e regione Jecmaan.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Bengaber in Ramoth Galaad : habebat Avothjair filii Manasse in Galaad : ipse præerat in omni regione Argob, quæ est in Basan, sexaginta civitatibus magnis atque muratis quæ habebant seras æreas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ahinadab filius Addo præerat in Manaim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Achimaas in Nephthali : sed et ipse habebat Basemath filiam Salomonis in conjugio.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Baana filius Husi in Aser, et in Baloth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Josaphat filius Pharue in Issachar.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Semei filius Ela in Benjamin.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Gaber filius Uri in terra Galaad, in terra Sehon regis Amorrhæi et Og regis Basan, super omnia quæ erant in illa terra.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Juda et Israël innumerabiles, sicut arena maris in multitudine : comedentes, et bibentes, atque lætantes.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Salomon autem erat in ditione sua, habens omnia regna a flumine terræ Philisthiim usque ad terminum Ægypti : offerentium sibi munera, et servientium ei cunctis diebus vitæ ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Erat autem cibus Salomonis per dies singulos triginta cori similæ, et sexaginta cori farinæ,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>decem boves pingues, et viginti boves pascuales, et centum arietes, excepta venatione cervorum, caprearum, atque bubalorum, et avium altilium.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ipse enim obtinebat omnem regionem quæ erat trans flumen, a Thaphsa usque ad Gazan, et cunctos reges illarum regionum : et habebat pacem ex omni parte in circuitu.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Habitabatque Juda et Israël absque timore ullo, unusquisque sub vite sua et sub ficu sua, a Dan usque Bersabee, cunctis diebus Salomonis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et habebat Salomon quadraginta millia præsepia equorum currilium, et duodecim millia equestrium.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nutriebantque eos supradicti regis præfecti : sed et necessaria mensæ regis Salomonis cum ingenti cura præbebant in tempore suo.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Hordeum quoque, et paleas equorum et jumentorum, deferebant in locum ubi erat rex, juxta constitutum sibi.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dedit quoque Deus sapientiam Salomoni, et prudentiam multam nimis, et latitudinem cordis quasi arenam quæ est in littore maris.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et præcedebat sapientia Salomonis sapientiam omnium Orientalium et Ægyptiorum,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et erat sapientior cunctis hominibus : sapientior Ethan Ezrahita, et Heman, et Chalcol, et Dorda filiis Mahol : et erat nominatus in universis gentibus per circuitum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Locutus est quoque Salomon tria millia parabolas : et fuerunt carmina ejus quinque et mille.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et disputavit super lignis a cedro quæ est in Libano, usque ad hyssopum quæ egreditur de pariete : et disseruit de jumentis, et volucribus, et reptilibus, et piscibus.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et veniebant de cunctis populis ad audiendam sapientiam Salomonis, et ab universis regibus terræ qui audiebant sapientiam ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1KI ,\"dra\":[{\"verse\":1,\"text\":\"And king Solomon reigned over all Israel:\"},{\"verse\":2,\"text\":\"And these were the princes which he had: Azarias, the son of Sadoc, the priest:\"},{\"verse\":3,\"text\":\"Elihoreph, and Ahia, the sons of Sisa, scribes: Josaphat, the son of Ahilud, recorder:\"},{\"verse\":4,\"text\":\"Banaias, the son of Joiada, over the army: and Sadoc, and Abiathar, priests.\"},{\"verse\":5,\"text\":\"Azarias, the son of Nathan, over them that were about the king: Zabud, the son of Nathan, the priest, the king’s friend:\"},{\"verse\":6,\"text\":\"And Ahisar, governor of the house: and Adoniram, the son of Abda, over the tribute.\"},{\"verse\":7,\"text\":\"And Solomon had twelve governors over all Israel, who provided victuals for the king and for his house hold: for every one provided necessaries, each man his month in the year.\"},{\"verse\":8,\"text\":\"And these are their names: Benhur, in mount Ephraim.\"},{\"verse\":9,\"text\":\"Bendecar, in Macces, and in Salebim, and in Bethsames, and in Elon, and in Bethanan.\"},{\"verse\":10,\"text\":\"Benhesed, in Aruboth: his was Socho, and all the land of Epher.\"},{\"verse\":11,\"text\":\"Benabinadab, to whom belonged all Nephath-Dor: he had Tapheth, the daughter of Solomon, to wife.\"},{\"verse\":12,\"text\":\"Bana, the son of Ahilud, who governed Thanac, and Mageddo, and all Bethsan, which is by Sarthana, beneath Jezrael, from Bethsan unto Abelmehula, over against Jecmaan.\"},{\"verse\":13,\"text\":\"Bengaber, in Ramoth Galaad: he had the town of Jair, the son of Manasses, in Galaad: he was chief in all the country of Argob, which is in Basan, threescore great cities with walls, and brazen bolts.\"},{\"verse\":14,\"text\":\"Ahinadab, the son of Addo, was chief in Manaim.\"},{\"verse\":15,\"text\":\"Achimaas, in Nephthali: he also had Basemath, the daughter of Solomon, to wife.\"},{\"verse\":16,\"text\":\"Baana, the son of Husi, in Aser, and in Baloth.\"},{\"verse\":17,\"text\":\"Josaphat, the son of Pharue, in Issachar.\"},{\"verse\":18,\"text\":\"Semei, the son of Ela, in Benjamin.\"},{\"verse\":19,\"text\":\"Gaber, the son of Uri, in the land of Galaad, in the land of Sehon, the king of the Amorrhites, and of Og, the king of Basan, over all that were in that land.\"},{\"verse\":20,\"text\":\"Juda and Israel were innumerable, as the sand of the sea in multitude; eating and drinking, and rejoicing.\"},{\"verse\":21,\"text\":\"And Solomon had under him all the kingdoms, from the river to the land of the Philistines, even to the border of Egypt: and they brought him presents, and served him all the days of his life.\"},{\"verse\":22,\"text\":\"And the provision of Solomon, for each day, was thirty measures of fine flour, and threescore measures of meal;\"},{\"verse\":23,\"text\":\"Ten fat oxen, and twenty out of the pastures, and a hundred rams; besides venison of harts, roes, and buffles, and fatted fowls.\"},{\"verse\":24,\"text\":\"For he had all the country which was beyond the river, from Thaphsa to Gazan, and all the kings of those countries: and he had peace on every side round about.\"},{\"verse\":25,\"text\":\"And Juda, and Israel, dwelt without any fear, every one under his vine, and under his fig tree, from Dan to Bersabee, all the days of Solomon.\"},{\"verse\":26,\"text\":\"And Solomon had forty thousand stalls of chariot horses, and twelve thousand for the saddle.\"},{\"verse\":27,\"text\":\"And the foresaid governors of the king fed them; and they furnished the necessaries also for king Solomon’s table, with great care, in their time.\"},{\"verse\":28,\"text\":\"They brought barley also, and straw for the horses and beasts, to the place where the king was, according as it was appointed them.\"},{\"verse\":29,\"text\":\"And God gave to Solomon wisdom, and understanding exceeding much, and largeness of heart, as the sand that is on the sea shore.\"},{\"verse\":30,\"text\":\"And the wisdom of Solomon surpassed the wisdom of all the Orientals, and of the Egyptians;\"},{\"verse\":31,\"text\":\"And he was wiser than all men: wiser than Ethan, the Ezrahite, and Heman, and Chalcol, and Dorda, the sons of Mahol, and he was renowned in all nations round about.\"},{\"verse\":32,\"text\":\"Solomon also spoke three thousand parables: and his poems were a thousand and five.\"},{\"verse\":33,\"text\":\"And he treated about trees, from the cedar that is in Libanus, unto the hyssop that cometh out of the wall: and he discoursed of beasts, and of fowls, and of creeping things, and of fishes.\"},{\"verse\":34,\"text\":\"And they came from all nations to hear the wisdom of Solomon, and from all the kings of the earth, who heard of his wisdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem rex Salomon regnans super omnem Israël :\"},{\"verse\":2,\"text\":\"et hi principes quos habebat : Azarias filius Sadoc sacerdotis :\"},{\"verse\":3,\"text\":\"Elihoreph et Ahia filii Sisa scribæ : Josaphat filius Ahilud a commentariis :\"},{\"verse\":4,\"text\":\"Banaias filius Jojadæ super exercitum : Sadoc autem et Abiathar sacerdotes :\"},{\"verse\":5,\"text\":\"Azarias filius Nathan super eos qui assistebant regi : Zabud filius Nathan sacerdos, amicus regis :\"},{\"verse\":6,\"text\":\"et Ahisar præpositus domus : et Adoniram filius Abda super tributa.\"},{\"verse\":7,\"text\":\"Habebat autem Salomon duodecim præfectos super omnem Israël, qui præbebant annonam regi et domui ejus : per singulos enim menses in anno, singuli necessaria ministrabant.\"},{\"verse\":8,\"text\":\"Et hæc nomina eorum : Benhur in monte Ephraim.\"},{\"verse\":9,\"text\":\"Bendecar in Macces, et in Salebim, et in Bethsames, et in Elon, et in Bethanan.\"},{\"verse\":10,\"text\":\"Benhesed in Aruboth : ipsius erat Socho, et omnis terra Epher.\"},{\"verse\":11,\"text\":\"Benabinadab, cujus omnis Nephath Dor : Tapheth filiam Salomonis habebat uxorem.\"},{\"verse\":12,\"text\":\"Bana filius Ahilud regebat Thanac et Mageddo, et universam Bethsan, quæ est juxta Sarthana subter Jezrahel, a Bethsan usque Abelmehula e regione Jecmaan.\"},{\"verse\":13,\"text\":\"Bengaber in Ramoth Galaad : habebat Avothjair filii Manasse in Galaad : ipse præerat in omni regione Argob, quæ est in Basan, sexaginta civitatibus magnis atque muratis quæ habebant seras æreas.\"},{\"verse\":14,\"text\":\"Ahinadab filius Addo præerat in Manaim.\"},{\"verse\":15,\"text\":\"Achimaas in Nephthali : sed et ipse habebat Basemath filiam Salomonis in conjugio.\"},{\"verse\":16,\"text\":\"Baana filius Husi in Aser, et in Baloth.\"},{\"verse\":17,\"text\":\"Josaphat filius Pharue in Issachar.\"},{\"verse\":18,\"text\":\"Semei filius Ela in Benjamin.\"},{\"verse\":19,\"text\":\"Gaber filius Uri in terra Galaad, in terra Sehon regis Amorrhæi et Og regis Basan, super omnia quæ erant in illa terra.\"},{\"verse\":20,\"text\":\"Juda et Israël innumerabiles, sicut arena maris in multitudine : comedentes, et bibentes, atque lætantes.\"},{\"verse\":21,\"text\":\"Salomon autem erat in ditione sua, habens omnia regna a flumine terræ Philisthiim usque ad terminum Ægypti : offerentium sibi munera, et servientium ei cunctis diebus vitæ ejus.\"},{\"verse\":22,\"text\":\"Erat autem cibus Salomonis per dies singulos triginta cori similæ, et sexaginta cori farinæ,\"},{\"verse\":23,\"text\":\"decem boves pingues, et viginti boves pascuales, et centum arietes, excepta venatione cervorum, caprearum, atque bubalorum, et avium altilium.\"},{\"verse\":24,\"text\":\"Ipse enim obtinebat omnem regionem quæ erat trans flumen, a Thaphsa usque ad Gazan, et cunctos reges illarum regionum : et habebat pacem ex omni parte in circuitu.\"},{\"verse\":25,\"text\":\"Habitabatque Juda et Israël absque timore ullo, unusquisque sub vite sua et sub ficu sua, a Dan usque Bersabee, cunctis diebus Salomonis.\"},{\"verse\":26,\"text\":\"Et habebat Salomon quadraginta millia præsepia equorum currilium, et duodecim millia equestrium.\"},{\"verse\":27,\"text\":\"Nutriebantque eos supradicti regis præfecti : sed et necessaria mensæ regis Salomonis cum ingenti cura præbebant in tempore suo.\"},{\"verse\":28,\"text\":\"Hordeum quoque, et paleas equorum et jumentorum, deferebant in locum ubi erat rex, juxta constitutum sibi.\"},{\"verse\":29,\"text\":\"Dedit quoque Deus sapientiam Salomoni, et prudentiam multam nimis, et latitudinem cordis quasi arenam quæ est in littore maris.\"},{\"verse\":30,\"text\":\"Et præcedebat sapientia Salomonis sapientiam omnium Orientalium et Ægyptiorum,\"},{\"verse\":31,\"text\":\"et erat sapientior cunctis hominibus : sapientior Ethan Ezrahita, et Heman, et Chalcol, et Dorda filiis Mahol : et erat nominatus in universis gentibus per circuitum.\"},{\"verse\":32,\"text\":\"Locutus est quoque Salomon tria millia parabolas : et fuerunt carmina ejus quinque et mille.\"},{\"verse\":33,\"text\":\"Et disputavit super lignis a cedro quæ est in Libano, usque ad hyssopum quæ egreditur de pariete : et disseruit de jumentis, et volucribus, et reptilibus, et piscibus.\"},{\"verse\":34,\"text\":\"Et veniebant de cunctis populis ad audiendam sapientiam Salomonis, et ab universis regibus terræ qui audiebant sapientiam ejus.\"}],\"summary\":\"Solomon’s chief officers. His riches and wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"1KI\",\"chapter\":3,\"label\":\"1 Kings 3\"},\"next\":{\"usfm\":\"1KI\",\"chapter\":5,\"label\":\"1 Kings 5\"}}]]\n"])</script></body></html>
