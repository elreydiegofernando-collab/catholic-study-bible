m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Kings<!-- --> <span class="text-stone-500">15</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->3 Kings</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The acts of Abiam and of Asa kings of Juda. And of Nadab and Baasa kings of Israel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now in the eighteenth year of the reign of Jeroboam, the son of Nabat, Abiam reigned over Juda.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He reigned three years in Jerusalem: the name of his mother was Maacha, the daughter of Abessalom.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he walked in all the sins of his father, which he had done before him: and his heart was not perfect with the Lord his God, as was the heart of David, his father.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But for David’s sake the Lord his God gave him a lamp in Jerusalem, to set up his son after him, and to establish Jerusalem:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Because David had done that which was right in the eyes of the Lord, and had not turned aside from any thing that he commanded him, all the days of his life, except the matter of Urias, the Hethite.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But there was war between Roboam and Jeroboam all the time of his life.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the rest of the words of Abiam, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And there was war between Abiam and Jeroboam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Abiam slept with his fathers, and they buried him in the city of David: and Asa, his son, reigned in his stead.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>So in the twentieth year of Jeroboam, king of Israel, reigned Asa, king of Juda,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he reigned one and forty years in Jerusalem. His mother’s name was Maacha, the daughter of Abessalom.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Asa did that which was right in the sight of the Lord, as did David, his father:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he took away the effeminate out of the land, and removed all the filth of the idols, which his fathers had made.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Moreover, he also removed his mother, Maacha, from being the princess in the sacrifices of Priapus, and in the grove which she had consecrated to him: and he destroyed her den, and broke in pieces the filthy idol, and burnt it by the torrent Cedron:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But the high places he did not take away. Nevertheless, the heart of Asa was perfect with the Lord all his days:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he brought in the things which his father had dedicated, and he had vowed, into the house of the Lord, silver and gold, and vessels.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And there was war between Asa, and Baasa, king of Israel, all their days.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Baasa, king of Israel, went up against Juda, and built Rama, that no man might go out or come in of the side of Asa, king of Juda.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Then Asa took all the silver and gold that remained in the treasures of the house of the Lord, and in the treasures of the king’s house, and delivered it into the hands of his servants: and sent them to Benadad, son of Tabremon, the son of Hezion, king of Syria, who dwelt in Damascus, saying:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>There is a league between me and thee, and between my father and thy father: therefore I have sent thee presents of silver and gold: and I desire thee to come, and break thy league with Baasa, king of Israel, that he may depart from me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Benadad, hearkening to king Asa, sent the captains of his army against the cities of Israel, and they smote Ahion, and Dan, and Abeldomum Maacha, and all Cenneroth; that is all the land of Nephthali.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when Baasa had heard this, he left off building Rama, and returned into Thersa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But king Asa sent word into all Juda, saying: Let no man be excused: and they took away the stones from Rama, and the timber thereof, wherewith Baasa had been building, and with them king Asa built Gabaa of Benjamin, and Maspha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But the rest of all the acts of Asa, and all his strength, and all that he did, and the cities that he built, are they not written in the book of the words of the days of the kings of Juda? But in the time of his old age he was diseased in his feet.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he slept with his fathers, and was buried with them in the city of David, his father. And Josaphat, his son, reigned in his place.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But Nadab, the son of Jeroboam, reigned over Israel the second year of Asa, king of Juda: and he reigned over Israel two years.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he did evil in the sight of the Lord, and walked in the ways of his father, and in his sins, wherewith he made Israel to sin.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Baasa, the son of Ahias, of the house of Issachar, conspired against him, and slew him in Gebbethon, which is a city of the Philistines: for Nadab and all Israel besieged Gebbethon.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>So Baasa slew him in the third year of Asa, king of Juda, and reigned in his place.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And when he was king, he cut off all the house of Jeroboam: he left not so much as one soul of his seed, till he had utterly destroyed him, according to the word of the Lord, which he had spoken in the hand of Ahias, the Silonite:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Because of the sin of Jeroboam, which he had sinned, and wherewith he had made Israel to sin, and for the offence wherewith he provoked the Lord, the God of Israel.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But the rest of the acts of Nadab, and all that he did, are they not written in the book of the words of the days of the kings of Israel?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And there was war between Asa and Baasa, the king of Israel, all their days.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In the third year of Asa, king of Juda, Baasa, the son of Ahias, reigned over all Israel, in Thersa, four and twenty years.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And he did evil before the Lord, and walked in the ways of Jeroboam, and in his sins, wherewith he made Israel to sin.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur in octavodecimo anno regni Jeroboam filii Nabat, regnavit Abiam super Judam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tribus annis regnavit in Jerusalem : nomen matris ejus Maacha filia Abessalom.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ambulavitque in omnibus peccatis patris sui, quæ fecerat ante eum : nec erat cor ejus perfectum cum Domino Deo suo, sicut cor David patris ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sed propter David dedit ei Dominus Deus suus lucernam in Jerusalem, ut suscitaret filium ejus post eum, et statueret Jerusalem :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>eo quod fecisset David rectum in oculis Domini, et non declinasset ab omnibus quæ præceperat ei cunctis diebus vitæ suæ, excepto sermone Uriæ Hethæi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Attamen bellum fuit inter Roboam et Jeroboam omni tempore vitæ ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Reliqua autem sermonum Abiam, et omnia quæ fecit, nonne hæc scripta sunt in libro verborum dierum regum Juda ? Fuitque prælium inter Abiam et inter Jeroboam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et dormivit Abiam cum patribus suis, et sepelierunt eum in civitate David, regnavitque Asa filius ejus pro eo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In anno ergo vigesimo Jeroboam regis Israël regnavit Asa rex Juda,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et quadraginta et uno anno regnavit in Jerusalem. Nomen matris ejus Maacha filia Abessalom.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et fecit Asa rectum ante conspectum Domini, sicut David pater ejus :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et abstulit effeminatos de terra, purgavitque universas sordes idolorum quæ fecerant patres ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Insuper et Maacham matrem suam amovit, ne esset princeps in sacris Priapi, et in luco ejus quem consecraverat : subvertitque specum ejus, et confregit simulacrum turpissimum, et combussit in torrente Cedron :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>excelsa autem non abstulit. Verumtamen cor Asa perfectum erat cum Domino cunctis diebus suis :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et intulit ea quæ sanctificaverat pater suus, et voverat, in domum Domini, argentum, et aurum, et vasa.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Bellum autem erat inter Asa, et Baasa regem Israël cunctis diebus eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ascendit quoque Baasa rex Israël in Judam, et ædificavit Rama, ut non posset quispiam egredi vel ingredi de parte Asa regis Juda.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tollens itaque Asa omne argentum et aurum quod remanserat in thesauris domus Domini, et in thesauris domus regiæ, et dedit illud in manus servorum suorum : et misit ad Benadad filium Tabremon filii Hezion, regem Syriæ, qui habitabat in Damasco, dicens :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fœdus est inter me et te, et inter patrem meum et patrem tuum : ideo misi tibi munera, argentum et aurum : et peto ut venias, et irritum facias fœdus quod habes cum Baasa rege Israël, et recedat a me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Acquiescens Benadad regi Asa, misit principes exercitus sui in civitates Israël, et percusserunt Ahion, et Dan, et Abeldomum Maacha, et universam Cenneroth, omnem scilicet terram Nephthali.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quod cum audisset Baasa, intermisit ædificare Rama, et reversus est in Thersa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Rex autem Asa nuntium misit in omnem Judam, dicens : Nemo sit excusatus. Et tulerunt lapides de Rama, et ligna ejus, quibus ædificaverat Baasa, et exstruxit de eis rex Asa Gabaa Benjamin, et Maspha.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Reliqua autem omnium sermonum Asa, et universæ fortitudines ejus, et cuncta quæ fecit, et civitates quas exstruxit, nonne hæc scripta sunt in libro verborum dierum regum Juda ? Verumtamen in tempore senectutis suæ doluit pedes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et dormivit cum patribus suis, et sepultus est cum eis in civitate David patris sui. Regnavitque Josaphat filius ejus pro eo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Nadab vero filius Jeroboam regnavit super Israël anno secundo Asa regis Juda : regnavitque super Israël duobus annis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et fecit quod malum est in conspectu Domini, et ambulavit in viis patris sui, et in peccatis ejus quibus peccare fecit Israël.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Insidiatus est autem ei Baasa filius Ahiæ de domo Issachar, et percussit eum in Gebbethon, quæ est urbs Philisthinorum : siquidem Nadab et omnis Israël obsidebant Gebbethon.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Interfecit ergo illum Baasa in anno tertio Asa regis Juda, et regnavit pro eo.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Cumque regnasset, percussit omnem domum Jeroboam : non dimisit ne unam quidem animam de semine ejus donec deleret eum, juxta verbum Domini quod locutus fuerat in manu servi sui Ahiæ Silonitis,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>propter peccata Jeroboam, quæ peccaverat, et quibus peccare fecerat Israël : et propter delictum quo irritaverat Dominum Deum Israël.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Reliqua autem sermonum Nadab, et omnia quæ operatus est, nonne hæc scripta sunt in libro verborum dierum regum Israël ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Fuitque bellum inter Asa, et Baasa regem Israël, cunctis diebus eorum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Anno tertio Asa regis Juda, regnavit Baasa filius Ahiæ super omnem Israël in Thersa, viginti quatuor annis.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et fecit malum coram Domino, ambulavitque in via Jeroboam, et in peccatis ejus quibus peccare fecit Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1KI/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 :null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"1 Kings 15 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1KI.15\",{\"bookId\":11,\"usfm\":\"1KI\",\"bookName\":\"1 Kings\",\"drName\":\"3 Kings\",\"chapter\":15,\"totalChapters\":22,\"dra\":[{\"verse\":1,\"text\":\"Now in the eighteenth year of the reign of Jeroboam, the son of Nabat, Abiam reigned over Juda.\"},{\"verse\":2,\"text\":\"He reigned three years in Jerusalem: the name of his mother was Maacha, the daughter of Abessalom.\"},{\"verse\":3,\"text\":\"And he walked in all the sins of his father, which he had done before him: and his heart was not perfect with the Lord his God, as was the heart of David, his father.\"},{\"verse\":4,\"text\":\"But for David’s sake the Lord his God gave him a lamp in Jerusalem, to set up his son after him, and to establish Jerusalem:\"},{\"verse\":5,\"text\":\"Because David had done that which was right in the eyes of the Lord, and had not turned aside from any thing that he commanded him, all the days of his life, except the matter of Urias, the Hethite.\"},{\"verse\":6,\"text\":\"But there was war between Roboam and Jeroboam all the time of his life.\"},{\"verse\":7,\"text\":\"And the rest of the words of Abiam, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And there was war between Abiam and Jeroboam.\"},{\"verse\":8,\"text\":\"And Abiam slept with his fathers, and they buried him in the city of David: and Asa, his son, reigned in his stead.\"},{\"verse\":9,\"text\":\"So in the twentieth year of Jeroboam, king of Israel, reigned Asa, king of Juda,\"},{\"verse\":10,\"text\":\"And he reigned one and forty years in Jerusalem. His mother’s name was Maacha, the daughter of Abessalom.\"},{\"verse\":11,\"text\":\"And Asa did that which was right in the sight of the Lord, as did David, his father:\"},{\"verse\":12,\"text\":\"And he took away the effeminate out of the land, and removed all the filth of the idols, which his fathers had made.\"},{\"verse\":13,\"text\":\"Moreover, he also removed his mother, Maacha, from being the princess in the sacrifices of Priapus, and in the grove which she had consecrated to him: and he destroyed her den, and broke in pieces the filthy idol, and burnt it by the torrent Cedron:\"},{\"verse\":14,\"text\":\"But the high places he did not take away. Nevertheless, the heart of Asa was perfect with the Lord all his days:\"},{\"verse\":15,\"text\":\"And he brought in the things which his father had dedicated, and he had vowed, into the house of the Lord, silver and gold, and vessels.\"},{\"verse\":16,\"text\":\"And there was war between Asa, and Baasa, king of Israel, all their days.\"},{\"verse\":17,\"text\":\"And Baasa, king of Israel, went up against Juda, and built Rama, that no man might go out or come in of the side of Asa, king of Juda.\"},{\"verse\":18,\"text\":\"Then Asa took all the silver and gold that remained in the treasures of the house of the Lord, and in the treasures of the king’s house, and delivered it into the hands of his servants: and sent them to Benadad, son of Tabremon, the son of Hezion, king of Syria, who dwelt in Damascus, saying:\"},{\"verse\":19,\"text\":\"There is a league between me and thee, and between my father and thy father: therefore I have sent thee presents of silver and gold: and I desire thee to come, and break thy league with Baasa, king of Israel, that he may depart from me.\"},{\"verse\":20,\"text\":\"Benadad, hearkening to king Asa, sent the captains of his army against the cities of Israel, and they smote Ahion, and Dan, and Abeldomum Maacha, and all Cenneroth; that is all the land of Nephthali.\"},{\"verse\":21,\"text\":\"And when Baasa had heard this, he left off building Rama, and returned into Thersa.\"},{\"verse\":22,\"text\":\"But king Asa sent word into all Juda, saying: Let no man be excused: and they took away the stones from Rama, and the timber thereof, wherewith Baasa had been building, and with them king Asa built Gabaa of Benjamin, and Maspha.\"},{\"verse\":23,\"text\":\"But the rest of all the acts of Asa, and all his strength, and all that he did, and the cities that he built, are they not written in the book of the words of the days of the kings of Juda? But in the time of his old age he was diseased in his feet.\"},{\"verse\":24,\"text\":\"And he slept with his fathers, and was buried with them in the city of David, his father. And Josaphat, his son, reigned in his place.\"},{\"verse\":25,\"text\":\"But Nadab, the son of Jeroboam, reigned over Israel the second year of Asa, king of Juda: and he reigned over Israel two years.\"},{\"verse\":26,\"text\":\"And he did evil in the sight of the Lord, and walked in the ways of his father, and in his sins, wherewith he made Israel to sin.\"},{\"verse\":27,\"text\":\"And Baasa, the son of Ahias, of the house of Issachar, conspired against him, and slew him in Gebbethon, which is a city of the Philistines: for Nadab and all Israel besieged Gebbethon.\"},{\"verse\":28,\"text\":\"So Baasa slew him in the third year of Asa, king of Juda, and reigned in his place.\"},{\"verse\":29,\"text\":\"And when he was king, he cut off all the house of Jeroboam: he left not so much as one soul of his seed, till he had utterly destroyed him, according to the word of the Lord, which he had spoken in the hand of Ahias, the Silonite:\"},{\"verse\":30,\"text\":\"Because of the sin of Jeroboam, which he had sinned, and wherewith he had made Israel to sin, and for the offence wherewith he provoked the Lord, the God of Israel.\"},{\"verse\":31,\"text\":\"But the rest of the acts of Nadab, and all that he did, are they not written in the book of the words of the days of the kings of Israel?\"},{\"verse\":32,\"text\":\"And there was war between Asa and Baasa, the king of Israel, all their days.\"},{\"verse\":33,\"text\":\"In the third year of Asa, king of Juda, Baasa, the son of Ahias, reigned over all Israel, in Thersa, four and twenty years.\"},{\"verse\":34,\"text\":\"And he did evil before the Lord, and walked in the ways of Jeroboam, and in his sins, wherewith he made Israel to sin.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur in octavodecimo anno regni Jeroboam filii Nabat, regnavit Abiam super Judam.\"},{\"verse\":2,\"text\":\"Tribus annis regnavit in Jerusalem : nomen matris ejus Maacha filia Abessalom.\"},{\"verse\":3,\"text\":\"Ambulavitque in omnibus peccatis patris sui, quæ fecerat ante eum : nec erat cor ejus perfectum cum Domino Deo suo, sicut cor David patris ejus.\"},{\"verse\":4,\"text\":\"Sed propter David dedit ei Dominus Deus suus lucernam in Jerusalem, ut suscitaret filium ejus post eum, et statueret Jerusalem :\"},{\"verse\":5,\"text\":\"eo quod fecisset David rectum in oculis Domini, et non declinasset ab omnibus quæ præceperat ei cunctis diebus vitæ suæ, excepto sermone Uriæ Hethæi.\"},{\"verse\":6,\"text\":\"Attamen bellum fuit inter Roboam et Jeroboam omni tempore vitæ ejus.\"},{\"verse\":7,\"text\":\"Reliqua autem sermonum Abiam, et omnia quæ fecit, nonne hæc scripta sunt in libro verborum dierum regum Juda ? Fuitque prælium inter Abiam et inter Jeroboam.\"},{\"verse\":8,\"text\":\"Et dormivit Abiam cum patribus suis, et sepelierunt eum in civitate David, regnavitque Asa filius ejus pro eo.\"},{\"verse\":9,\"text\":\"In anno ergo vigesimo Jeroboam regis Israël regnavit Asa rex Juda,\"},{\"verse\":10,\"text\":\"et quadraginta et uno anno regnavit in Jerusalem. Nomen matris ejus Maacha filia Abessalom.\"},{\"verse\":11,\"text\":\"Et fecit Asa rectum ante conspectum Domini, sicut David pater ejus :\"},{\"verse\":12,\"text\":\"et abstulit effeminatos de terra, purgavitque universas sordes idolorum quæ fecerant patres ejus.\"},{\"verse\":13,\"text\":\"Insuper et Maacham matrem suam amovit, ne esset princeps in sacris Priapi, et in luco ejus quem consecraverat : subvertitque specum ejus, et confregit simulacrum turpissimum, et combussit in torrente Cedron :\"},{\"verse\":14,\"text\":\"excelsa autem non abstulit. Verumtamen cor Asa perfectum erat cum Domino cunctis diebus suis :\"},{\"verse\":15,\"text\":\"et intulit ea quæ sanctificaverat pater suus, et voverat, in domum Domini, argentum, et aurum, et vasa.\"},{\"verse\":16,\"text\":\"Bellum autem erat inter Asa, et Baasa regem Israël cunctis diebus eorum.\"},{\"verse\":17,\"text\":\"Ascendit quoque Baasa rex Israël in Judam, et ædificavit Rama, ut non posset quispiam egredi vel ingredi de parte Asa regis Juda.\"},{\"verse\":18,\"text\":\"Tollens itaque Asa omne argentum et aurum quod remanserat in thesauris domus Domini, et in thesauris domus regiæ, et dedit illud in manus servorum suorum : et misit ad Benadad filium Tabremon filii Hezion, regem Syriæ, qui habitabat in Damasco, dicens :\"},{\"verse\":19,\"text\":\"Fœdus est inter me et te, et inter patrem meum et patrem tuum : ideo misi tibi munera, argentum et aurum : et peto ut venias, et irritum facias fœdus quod habes cum Baasa rege Israël, et recedat a me.\"},{\"verse\":20,\"text\":\"Acquiescens Benadad regi Asa, misit principes exercitus sui in civitates Israël, et percusserunt Ahion, et Dan, et Abeldomum Maacha, et universam Cenneroth, omnem scilicet terram Nephthali.\"},{\"verse\":21,\"text\":\"Quod cum audisset Baasa, intermisit ædificare Rama, et reversus est in Thersa.\"},{\"verse\":22,\"text\":\"Rex autem Asa nuntium misit in omnem Judam, dicens : Nemo sit excusatus. Et tulerunt lapides de Rama, et ligna ejus, quibus ædificaverat Baasa, et exstruxit de eis rex Asa Gabaa Benjamin, et Maspha.\"},{\"verse\":23,\"text\":\"Reliqua autem omnium sermonum Asa, et universæ fortitudines ejus, et cuncta quæ fecit, et civitates quas exstruxit, nonne hæc scripta sunt in libro verborum dierum regum Juda ? Verumtamen in tempore senectutis suæ doluit pedes.\"},{\"verse\":24,\"text\":\"Et dormivit cum patribus suis, et sepultus est cum eis in civitate David patris sui. Regnavitque Josaphat filius ejus pro eo.\"},{\"verse\":25,\"text\":\"Nadab vero filius Jeroboam regnavit super Israël anno secundo Asa regis Juda : regnavitque super Israël duobus annis.\"},{\"verse\":26,\"text\":\"Et fecit quod malum est in conspectu Domini, et ambulavit in viis patris sui, et in peccatis ejus quibus peccare fecit Israël.\"},{\"verse\":27,\"text\":\"Insidiatus est autem ei Baasa filius Ahiæ de domo Issachar, et percussit eum in Gebbethon, quæ est urbs Philisthinorum : siquidem Nadab et omnis Israël obsidebant Gebbethon.\"},{\"verse\":28,\"text\":\"Interfecit ergo illum Baasa in anno tertio Asa regis Juda, et regnavit pro eo.\"},{\"verse\":29,\"text\":\"Cumque regnasset, percussit omnem domum Jeroboam : non dimisit ne unam quidem animam de semine ejus donec deleret eum, juxta verbum Domini quod locutus fuerat in manu servi sui Ahiæ Silonitis,\"},{\"verse\":30,\"text\":\"propter peccata Jeroboam, quæ peccaverat, et quibus peccare fecerat Israël : et propter delictum quo irritaverat Dominum Deum Israël.\"},{\"verse\":31,\"text\":\"Reliqua autem sermonum Nadab, et omnia quæ operatus est, nonne hæc scripta sunt in libro verborum dierum regum Israël ?\"},{\"verse\":32,\"text\":\"Fuitque bellum inter Asa, et Baasa regem Israël, cunctis diebus eorum.\"},{\"verse\":33,\"text\":\"Anno tertio Asa regis Juda, regnavit Baasa filius Ahiæ super omnem Israël in Thersa, viginti quatuor annis.\"},{\"verse\":34,\"text\":\"Et fecit malum coram Domino, ambulavitque in via Jeroboam, et in peccatis ejus quibus peccare fecit Israël.\"}],\"summary\":\"The acts of Abiam and of Asa kings of Juda. And of Nadab and Baasa kings of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"1KI\",\"chapter\":14,\"label\":\"1 Kings 14\"},\"next\":{\"usfm\":\"1KI\",\"chapter\":16,\"label\":\"1 Kings 16\"}}]]\n"])</script></body></html>
