holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Kings<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->3 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1KI/">About <!-- -->1 Kings</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The building of Solomon’s temple.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass in the four hundred and eightieth year after the children of Israel came out of the land of Egypt, in the fourth year of the reign of Solomon over Israel, in the month Zio, (the same is the second month) he began to build a house to the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the house, which king Solomon built to the Lord, was threescore cubits in length, and twenty cubits in breadth, and thirty cubits in height.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And there was a porch before the temple, of twenty cubits in length, according to the measure of the breadth of the temple: and it was ten cubits in breadth, before the face of the temple.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he made in the temple oblique windows.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And upon the wall of the temple, he built floors round about, in the walls of the house, round about the temple and the oracle, and he made chambers in the sides round about.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The floor that was underneath was five cubits in breadth, and the middle floor was six cubits in breadth, and the third floor was seven cubits in breadth. And he put beams in the house round about on the outside, that they might not be fastened in the walls of the temple.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the house, when it was in building, was built of stones, hewed and made ready: so that there was neither hammer nor axe, nor any tool of iron heard in the house when it was in building.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The door, for the middle side, was on the right hand of the house: and by winding stairs they went up to the middle room, and from the middle to the third.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>So he built the house, and finished it: and he covered the house with roofs of cedar.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he built a floor over all the house, five cubits in height, and he covered the house with timber of cedar.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the word of the Lord came to Solomon, saying:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>As for this house, which thou art building, if thou wilt walk in my statutes, and execute my judgments, and keep all my commandments, walking in them, I will fulfil my word to thee, which I spoke to David thy father.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I will dwell in the midst of the children of Israel, and I will not forsake my people Israel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So Solomon built the house, and finished it.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he built the walls of the house on the inside, with boards of cedar, from the floor of the house to the top of the walls, and to the roofs, he covered it with boards of cedar on the inside: and he covered the floor of the house with planks of fir.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he built up twenty cubits with boards of cedar at the hinder part of the temple, from the floor to the top: and made the inner house of the oracle to be the holy of holies.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the temple itself, before the doors of the oracle, was forty cubits long.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all the house was covered within with cedar, having the turnings, and the joints thereof artfully wrought, and carvings projecting out: all was covered with boards of cedar: and no stone could be seen in the wall at all.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he made the oracle in the midst of the house, in the inner part, to set there the ark of the covenant of the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Now the oracle was twenty cubits in length, and twenty cubits in breadth, and twenty cubits in height. And he covered it, and overlaid it with most pure gold. And the altar also he covered with cedar.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the house before the oracle he overlaid with most pure gold, and fastened on the plates with nails of gold.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And there was nothing in the temple that was not covered with gold: the whole altar of the oracle he covered also with gold.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he made in the oracle two cherubims of olive tree, of ten cubits in height.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>One wing of the cherub was five cubits, and the other wing of the cherub was five cubits: that is, in all ten cubits, from the extremity of one wing to the extremity of the other wing.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The second cherub also was ten cubits: and the measure, and the work was the same in both the cherubims:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>That is to say, one cherub was ten cubits high, and in like manner the other cherub.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he set the cherubims in the midst of the inner temple: and the cherubims stretched forth their wings, and the wing of the one touched one wall, and the wing of the other cherub touched the other wall: and the other wings in the midst of the temple touched one another.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he overlaid the cherubims with gold.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And all the walls of the temple round about he carved with divers figures and carvings: and he made in them cherubims and palm trees, and divers representations, as it were standing out, and coming forth from the wall.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the floor of the house he also overlaid with gold within and without.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And in the entrance of the oracle, he made little doors of olive tree, and posts of five corners,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And two doors of olive tree: and he carved upon them figures of cherubims, and figures of palm trees, and carvings very much projecting; and he overlaid them with gold: and he covered both the cherubims and the palm trees, and the other things, with gold.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he made in the entrance of the temple posts of olive tree foursquare:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And two doors of fir tree, one of each side: and each door was double, and so opened with folding leaves.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And he carved cherubims, and palm trees, and carved work standing very much out: and he overlaid all with golden plates in square work by rule.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he built the inner court with three rows of polished stones, and one row of beams of cedar.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>In the fourth year was the house of the Lord founded, in the month Zio:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And in the eleventh year, in the month Bul. (which is the eighth month) the house was finished in all the works thereof, and in all the appurtenances thereof: and he was seven years in building it.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est ergo quadringentesimo et octogesimo anno egressionis filiorum Israël de terra Ægypti, in anno quarto, mense Zio (ipse est mensis secundus), regni Salomonis super Israël, ædificari cœpit domus Domino.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domus autem quam ædificabat rex Salomon Domino, habebat sexaginta cubitos in longitudine, et viginti cubitos in latitudine, et triginta cubitos in altitudine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et porticus erat ante templum viginti cubitorum longitudinis, juxta mensuram latitudinis templi : et habebat decem cubitos latitudinis ante faciem templi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Fecitque in templo fenestras obliquas.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ædificavit super parietem templi tabulata per gyrum, in parietibus domus per circuitum templi et oraculi, et fecit latera in circuitu.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tabulatum quod subter erat, quinque cubitos habebat latitudinis, et medium tabulatum sex cubitorum latitudinis, et tertium tabulatum septem habens cubitos latitudinis. Trabes autem posuit in domo per circuitum forinsecus, ut non hærerent muris templi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Domus autem cum ædificaretur, de lapidibus dolatis atque perfectis ædificata est : et malleus, et securis, et omne ferramentum non sunt audita in domo cum ædificaretur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ostium lateris medii in parte erat domus dextræ : et per cochleam ascendebant in medium cœnaculum, et a medio in tertium.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ædificavit domum, et consummavit eam : texit quoque domum laquearibus cedrinis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et ædificavit tabulatum super omnem domum quinque cubitis altitudinis, et operuit domum lignis cedrinis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et factus est sermo Domini ad Salomonem, dicens :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Domus hæc, quam ædificas, si ambulaveris in præceptis meis, et judicia mea feceris, et custodieris omnia mandata mea, gradiens per ea, firmabo sermonem meum tibi, quem locutus sum ad David patrem tuum :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et habitabo in medio filiorum Israël, et non derelinquam populum meum Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Igitur ædificavit Salomon domum, et consummavit eam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ædificavit parietes domus intrinsecus tabulatis cedrinis : a pavimento domus usque ad summitatem parietum, et usque ad laquearia, operuit lignis cedrinis intrinsecus : et texit pavimentum domus tabulis abiegnis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ædificavitque viginti cubitorum ad posteriorem partem templi tabulata cedrina, a pavimento usque ad superiora : et fecit interiorem domum oraculi in Sanctum sanctorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Porro quadraginta cubitorum erat ipsum templum pro foribus oraculi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et cedro omnis domus intrinsecus vestiebatur, habens tornaturas et juncturas suas fabrefactas, et cælaturas eminentes : omnia cedrinis tabulis vestiebantur : nec omnino lapis apparere poterat in pariete.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Oraculum autem in medio domus, in interiori parte fecerat, ut poneret ibi arcam fœderis Domini.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Porro oraculum habebat viginti cubitos longitudinis, et viginti cubitos latitudinis, et viginti cubitos altitudinis : et operuit illud atque vestivit auro purissimo : sed et altare vestivit cedro.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Domum quoque ante oraculum operuit auro purissimo, et affixit laminas clavis aureis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nihilque erat in templo quod non auro tegeretur : sed et totum altare oraculi texit auro.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et fecit in oraculo duos cherubim de lignis olivarum, decem cubitorum altitudinis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quinque cubitorum ala cherub una, et quinque cubitorum ala cherub altera : id est, decem cubitos habentes, a summitate alæ unius usque ad alæ alterius summitatem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Decem quoque cubitorum erat cherub secundus : in mensura pari, et opus unum erat in duobus cherubim,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>id est, altitudinem habebat unus cherub decem cubitorum, et similiter cherub secundus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Posuitque cherubim in medio templi interioris : extendebant autem alas suas cherubim, et tangebat ala una parietem, et ala cherub secundi tangebat parietem alterum : alæ autem alteræ in media parte templi se invicem contingebant.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Texit quoque cherubim auro.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et omnes parietes templi per circuitum sculpsit variis cælaturis et torno : et fecit in eis cherubim, et palmas, et picturas varias, quasi prominentes de pariete, et egredientes.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sed et pavimentum domus texit auro intrinsecus et extrinsecus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et in ingressu oraculi fecit ostiola de lignis olivarum, postesque angulorum quinque.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et duo ostia de lignis olivarum : et sculpsit in eis picturam cherubim, et palmarum species, et anaglypha valde prominentia : et texit ea auro, et operuit tam cherubim quam palmas, et cetera, auro.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Fecitque in introitu templi postes de lignis olivarum quadrangulatos,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et duo ostia de lignis abiegnis altrinsecus : et utrumque ostium duplex erat, et se invicem tenens aperiebatur.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et sculpsit cherubim, et palmas, et cælaturas valde eminentes : operuitque omnia laminis aureis opere quadro ad regulam.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et ædificavit atrium interius tribus ordinibus lapidum politorum, et uno ordine lignorum cedri.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Anno quarto fundata est domus Domini in mense Zio :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et in anno undecimo, mense Bul (ipse est mensis octavus), perfecta est domus in omni opere suo, et in universis utensilibus suis : ædificavitque eam annis septem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1KI/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500 "},{\"verse\":2,\"text\":\"And the house, which king Solomon built to the Lord, was threescore cubits in length, and twenty cubits in breadth, and thirty cubits in height.\"},{\"verse\":3,\"text\":\"And there was a porch before the temple, of twenty cubits in length, according to the measure of the breadth of the temple: and it was ten cubits in breadth, before the face of the temple.\"},{\"verse\":4,\"text\":\"And he made in the temple oblique windows.\"},{\"verse\":5,\"text\":\"And upon the wall of the temple, he built floors round about, in the walls of the house, round about the temple and the oracle, and he made chambers in the sides round about.\"},{\"verse\":6,\"text\":\"The floor that was underneath was five cubits in breadth, and the middle floor was six cubits in breadth, and the third floor was seven cubits in breadth. And he put beams in the house round about on the outside, that they might not be fastened in the walls of the temple.\"},{\"verse\":7,\"text\":\"And the house, when it was in building, was built of stones, hewed and made ready: so that there was neither hammer nor axe, nor any tool of iron heard in the house when it was in building.\"},{\"verse\":8,\"text\":\"The door, for the middle side, was on the right hand of the house: and by winding stairs they went up to the middle room, and from the middle to the third.\"},{\"verse\":9,\"text\":\"So he built the house, and finished it: and he covered the house with roofs of cedar.\"},{\"verse\":10,\"text\":\"And he built a floor over all the house, five cubits in height, and he covered the house with timber of cedar.\"},{\"verse\":11,\"text\":\"And the word of the Lord came to Solomon, saying:\"},{\"verse\":12,\"text\":\"As for this house, which thou art building, if thou wilt walk in my statutes, and execute my judgments, and keep all my commandments, walking in them, I will fulfil my word to thee, which I spoke to David thy father.\"},{\"verse\":13,\"text\":\"And I will dwell in the midst of the children of Israel, and I will not forsake my people Israel.\"},{\"verse\":14,\"text\":\"So Solomon built the house, and finished it.\"},{\"verse\":15,\"text\":\"And he built the walls of the house on the inside, with boards of cedar, from the floor of the house to the top of the walls, and to the roofs, he covered it with boards of cedar on the inside: and he covered the floor of the house with planks of fir.\"},{\"verse\":16,\"text\":\"And he built up twenty cubits with boards of cedar at the hinder part of the temple, from the floor to the top: and made the inner house of the oracle to be the holy of holies.\"},{\"verse\":17,\"text\":\"And the temple itself, before the doors of the oracle, was forty cubits long.\"},{\"verse\":18,\"text\":\"And all the house was covered within with cedar, having the turnings, and the joints thereof artfully wrought, and carvings projecting out: all was covered with boards of cedar: and no stone could be seen in the wall at all.\"},{\"verse\":19,\"text\":\"And he made the oracle in the midst of the house, in the inner part, to set there the ark of the covenant of the Lord.\"},{\"verse\":20,\"text\":\"Now the oracle was twenty cubits in length, and twenty cubits in breadth, and twenty cubits in height. And he covered it, and overlaid it with most pure gold. And the altar also he covered with cedar.\"},{\"verse\":21,\"text\":\"And the house before the oracle he overlaid with most pure gold, and fastened on the plates with nails of gold.\"},{\"verse\":22,\"text\":\"And there was nothing in the temple that was not covered with gold: the whole altar of the oracle he covered also with gold.\"},{\"verse\":23,\"text\":\"And he made in the oracle two cherubims of olive tree, of ten cubits in height.\"},{\"verse\":24,\"text\":\"One wing of the cherub was five cubits, and the other wing of the cherub was five cubits: that is, in all ten cubits, from the extremity of one wing to the extremity of the other wing.\"},{\"verse\":25,\"text\":\"The second cherub also was ten cubits: and the measure, and the work was the same in both the cherubims:\"},{\"verse\":26,\"text\":\"That is to say, one cherub was ten cubits high, and in like manner the other cherub.\"},{\"verse\":27,\"text\":\"And he set the cherubims in the midst of the inner temple: and the cherubims stretched forth their wings, and the wing of the one touched one wall, and the wing of the other cherub touched the other wall: and the other wings in the midst of the temple touched one another.\"},{\"verse\":28,\"text\":\"And he overlaid the cherubims with gold.\"},{\"verse\":29,\"text\":\"And all the walls of the temple round about he carved with divers figures and carvings: and he made in them cherubims and palm trees, and divers representations, as it were standing out, and coming forth from the wall.\"},{\"verse\":30,\"text\":\"And the floor of the house he also overlaid with gold within and without.\"},{\"verse\":31,\"text\":\"And in the entrance of the oracle, he made little doors of olive tree, and posts of five corners,\"},{\"verse\":32,\"text\":\"And two doors of olive tree: and he carved upon them figures of cherubims, and figures of palm trees, and carvings very much projecting; and he overlaid them with gold: and he covered both the cherubims and the palm trees, and the other things, with gold.\"},{\"verse\":33,\"text\":\"And he made in the entrance of the temple posts of olive tree foursquare:\"},{\"verse\":34,\"text\":\"And two doors of fir tree, one of each side: and each door was double, and so opened with folding leaves.\"},{\"verse\":35,\"text\":\"And he carved cherubims, and palm trees, and carved work standing very much out: and he overlaid all with golden plates in square work by rule.\"},{\"verse\":36,\"text\":\"And he built the inner court with three rows of polished stones, and one row of beams of cedar.\"},{\"verse\":37,\"text\":\"In the fourth year was the house of the Lord founded, in the month Zio:\"},{\"verse\":38,\"text\":\"And in the eleventh year, in the month Bul. (which is the eighth month) the house was finished in all the works thereof, and in all the appurtenances thereof: and he was seven years in building it.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est ergo quadringentesimo et octogesimo anno egressionis filiorum Israël de terra Ægypti, in anno quarto, mense Zio (ipse est mensis secundus), regni Salomonis super Israël, ædificari cœpit domus Domino.\"},{\"verse\":2,\"text\":\"Domus autem quam ædificabat rex Salomon Domino, habebat sexaginta cubitos in longitudine, et viginti cubitos in latitudine, et triginta cubitos in altitudine.\"},{\"verse\":3,\"text\":\"Et porticus erat ante templum viginti cubitorum longitudinis, juxta mensuram latitudinis templi : et habebat decem cubitos latitudinis ante faciem templi.\"},{\"verse\":4,\"text\":\"Fecitque in templo fenestras obliquas.\"},{\"verse\":5,\"text\":\"Et ædificavit super parietem templi tabulata per gyrum, in parietibus domus per circuitum templi et oraculi, et fecit latera in circuitu.\"},{\"verse\":6,\"text\":\"Tabulatum quod subter erat, quinque cubitos habebat latitudinis, et medium tabulatum sex cubitorum latitudinis, et tertium tabulatum septem habens cubitos latitudinis. Trabes autem posuit in domo per circuitum forinsecus, ut non hærerent muris templi.\"},{\"verse\":7,\"text\":\"Domus autem cum ædificaretur, de lapidibus dolatis atque perfectis ædificata est : et malleus, et securis, et omne ferramentum non sunt audita in domo cum ædificaretur.\"},{\"verse\":8,\"text\":\"Ostium lateris medii in parte erat domus dextræ : et per cochleam ascendebant in medium cœnaculum, et a medio in tertium.\"},{\"verse\":9,\"text\":\"Et ædificavit domum, et consummavit eam : texit quoque domum laquearibus cedrinis.\"},{\"verse\":10,\"text\":\"Et ædificavit tabulatum super omnem domum quinque cubitis altitudinis, et operuit domum lignis cedrinis.\"},{\"verse\":11,\"text\":\"Et factus est sermo Domini ad Salomonem, dicens :\"},{\"verse\":12,\"text\":\"Domus hæc, quam ædificas, si ambulaveris in præceptis meis, et judicia mea feceris, et custodieris omnia mandata mea, gradiens per ea, firmabo sermonem meum tibi, quem locutus sum ad David patrem tuum :\"},{\"verse\":13,\"text\":\"et habitabo in medio filiorum Israël, et non derelinquam populum meum Israël.\"},{\"verse\":14,\"text\":\"Igitur ædificavit Salomon domum, et consummavit eam.\"},{\"verse\":15,\"text\":\"Et ædificavit parietes domus intrinsecus tabulatis cedrinis : a pavimento domus usque ad summitatem parietum, et usque ad laquearia, operuit lignis cedrinis intrinsecus : et texit pavimentum domus tabulis abiegnis.\"},{\"verse\":16,\"text\":\"Ædificavitque viginti cubitorum ad posteriorem partem templi tabulata cedrina, a pavimento usque ad superiora : et fecit interiorem domum oraculi in Sanctum sanctorum.\"},{\"verse\":17,\"text\":\"Porro quadraginta cubitorum erat ipsum templum pro foribus oraculi.\"},{\"verse\":18,\"text\":\"Et cedro omnis domus intrinsecus vestiebatur, habens tornaturas et juncturas suas fabrefactas, et cælaturas eminentes : omnia cedrinis tabulis vestiebantur : nec omnino lapis apparere poterat in pariete.\"},{\"verse\":19,\"text\":\"Oraculum autem in medio domus, in interiori parte fecerat, ut poneret ibi arcam fœderis Domini.\"},{\"verse\":20,\"text\":\"Porro oraculum habebat viginti cubitos longitudinis, et viginti cubitos latitudinis, et viginti cubitos altitudinis : et operuit illud atque vestivit auro purissimo : sed et altare vestivit cedro.\"},{\"verse\":21,\"text\":\"Domum quoque ante oraculum operuit auro purissimo, et affixit laminas clavis aureis.\"},{\"verse\":22,\"text\":\"Nihilque erat in templo quod non auro tegeretur : sed et totum altare oraculi texit auro.\"},{\"verse\":23,\"text\":\"Et fecit in oraculo duos cherubim de lignis olivarum, decem cubitorum altitudinis.\"},{\"verse\":24,\"text\":\"Quinque cubitorum ala cherub una, et quinque cubitorum ala cherub altera : id est, decem cubitos habentes, a summitate alæ unius usque ad alæ alterius summitatem.\"},{\"verse\":25,\"text\":\"Decem quoque cubitorum erat cherub secundus : in mensura pari, et opus unum erat in duobus cherubim,\"},{\"verse\":26,\"text\":\"id est, altitudinem habebat unus cherub decem cubitorum, et similiter cherub secundus.\"},{\"verse\":27,\"text\":\"Posuitque cherubim in medio templi interioris : extendebant autem alas suas cherubim, et tangebat ala una parietem, et ala cherub secundi tangebat parietem alterum : alæ autem alteræ in media parte templi se invicem contingebant.\"},{\"verse\":28,\"text\":\"Texit quoque cherubim auro.\"},{\"verse\":29,\"text\":\"Et omnes parietes templi per circuitum sculpsit variis cælaturis et torno : et fecit in eis cherubim, et palmas, et picturas varias, quasi prominentes de pariete, et egredientes.\"},{\"verse\":30,\"text\":\"Sed et pavimentum domus texit auro intrinsecus et extrinsecus.\"},{\"verse\":31,\"text\":\"Et in ingressu oraculi fecit ostiola de lignis olivarum, postesque angulorum quinque.\"},{\"verse\":32,\"text\":\"Et duo ostia de lignis olivarum : et sculpsit in eis picturam cherubim, et palmarum species, et anaglypha valde prominentia : et texit ea auro, et operuit tam cherubim quam palmas, et cetera, auro.\"},{\"verse\":33,\"text\":\"Fecitque in introitu templi postes de lignis olivarum quadrangulatos,\"},{\"verse\":34,\"text\":\"et duo ostia de lignis abiegnis altrinsecus : et utrumque ostium duplex erat, et se invicem tenens aperiebatur.\"},{\"verse\":35,\"text\":\"Et sculpsit cherubim, et palmas, et cælaturas valde eminentes : operuitque omnia laminis aureis opere quadro ad regulam.\"},{\"verse\":36,\"text\":\"Et ædificavit atrium interius tribus ordinibus lapidum politorum, et uno ordine lignorum cedri.\"},{\"verse\":37,\"text\":\"Anno quarto fundata est domus Domini in mense Zio :\"},{\"verse\":38,\"text\":\"et in anno undecimo, mense Bul (ipse est mensis octavus), perfecta est domus in omni opere suo, et in universis utensilibus suis : ædificavitque eam annis septem.\"}],\"summary\":\"The building of Solomon’s temple.\",\"intro\":null,\"prev\":{\"usfm\":\"1KI\",\"chapter\":5,\"label\":\"1 Kings 5\"},\"next\":{\"usfm\":\"1KI\",\"chapter\":7,\"label\":\"1 Kings 7\"}}]]\n"])</script></body></html>
