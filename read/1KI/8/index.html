<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>1 Kings 8 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">1 Kings<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->3 Kings</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/1KI/">About <!-- -->1 Kings</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The dedication of the temple: Solomon’s prayer and sacrifices.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then all the ancients of Israel, with the princes of the tribes, and the heads of the families of the children of Israel, were assembled to king Solomon, in Jerusalem: that they might carry the ark of the covenant of the Lord, out of the city of David, that is, out of Sion.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And all Israel assembled themselves to king Solomon, on the festival day, in the month of Ethanim, the same is the seventh month.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And all the ancients of Israel came, and the priests took up the ark,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And carried the ark of the Lord, and the tabernacle of the covenant, and all the vessels of the sanctuary, that were in the tabernacle: and the priests and the Levites carried them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And king Solomon, and all the multitude of Israel, that were assembled unto him, went with him before the ark, and they sacrificed sheep and oxen, that could not be counted or numbered.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the priests brought in the ark of the covenant of the Lord into its place, into the oracle of the temple, into the holy of holies, under the wings of the cherubims.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For the cherubims spread forth their wings over the place of the ark, and covered the ark, and the staves thereof above.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And whereas the staves stood out, the ends of them were seen without, in the sanctuary before the oracle, but were not seen farther out, and there they have been unto this day.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now in the ark there was nothing else but the two tables of stone, which Moses put there at Horeb, when the Lord made a covenant with the children of Israel, when they came out of the land of Egypt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And it came to pass, when the priests were come out of the sanctuary, that a cloud filled the house of the Lord,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then Solomon said: The Lord said that he would dwell in a cloud.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Building, I have built a house for thy dwelling, to be thy most firm throne for ever.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the king turned his face, and blessed all the assembly of Israel: for all the assembly of Israel stood.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Solomon said: Blessed be the Lord the God of Israel, who spoke with his mouth to David, my father, and with his own hands hath accomplished it, saying:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Since the day that I brought my people Israel, out of Egypt, I chose no city out of all the tribes of Israel, for a house to be built, that my name might be there: but I chose David to be over my people Israel.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And David, my father, would have built a house to the name of the Lord, the God of Israel:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the Lord said to David, my father: Whereas, thou hast thought in thy heart to build a house to my name, thou hast done well in having this same thing in thy mind.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Nevertheless, thou shalt not build me a house, but thy son, that shall come forth out of thy loins, he shall build a house to my name.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The Lord hath performed his word which he spoke. And I stand in the room of David, my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord, the God of Israel.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I have set there a place for the ark, wherein is the covenant of the Lord, which he made with our fathers, when they came out of the land of Egypt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Solomon stood before the altar of the Lord, in the sight of the assembly of Israel, and spread forth his hands towards heaven,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And said: Lord God of Israel, there is no God like thee, in heaven above, or on the earth beneath: who keepest covenant and mercy with thy servants, that have walked before thee with all their heart:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Who hast kept with thy servant David, my father, what thou hast promised him: with thy mouth thou didst speak, and with thy hands thou hast performed, as this day proveth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Now, therefore, O Lord God of Israel, keep with thy servant David, my father, what thou hast spoken to him, saying: There shall not be taken away of thee a man in my sight, to sit on the throne of Israel: yet so that thy children take heed to their way, that they walk before me as thou hast walked in my sight.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And now, Lord God of Israel, let thy words be established, which thou hast spoken to thy servant David, my father.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Is it then to be thought that God should indeed dwell upon earth? for if heaven, and the heavens of heavens, cannot contain thee, how much less this house which I have built?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But have regard to the prayer of thy servant, and to his supplications, O Lord, my God: hear the hymn and the prayer, which thy servant prayeth before thee this day:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>That thy eyes may be open upon this house, night and day: upon the house of which thou hast said: My name shall be there: that thou mayst hearken to the prayer which thy servant prayeth, in this place to thee:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>That thou mayst hearken to the supplication of thy servant, and of thy people Israel, whatsoever they shall pray for in this place, and hear them in the place of thy dwelling in heaven; and when thou hearest, shew them mercy.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>If any man trespass against his neighbour, and have an oath upon him, wherewith he is bound, and come, because of the oath, before thy altar, to thy house,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Then hear thou in heaven: and do and judge thy servants, condemning the wicked, and bringing his way upon his own head, and justifying the just, and rewarding him according to his justice.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>If thy people Israel shall fly before their enemies (because they will sin against thee) and doing penance, and confessing to thy name, shall come and pray, and make supplications to thee in this house:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Then hear thou in heaven, and forgive the sin of thy people Israel, and bring them back to the land which thou gavest to their fathers.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If heaven shall be shut up, and there shall be no rain, because of their sins, and they, praying in this place, shall do penance to thy name, and shall be converted from their sins, by occasion of their afflictions:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Then hear thou them in heaven, and forgive the sins of thy servants, and of thy people Israel: and shew them the good way wherein they should walk, and give rain upon thy land, which thou hast given to thy people in possession.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>If a famine arise in the land, or a pestilence, or corrupt air, or blasting, or locust, or mildew; if their enemy afflict them, besieging the gates, whatsoever plague, whatsoever infirmity,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Whatsoever curse or imprecation shall happen to any man of thy people Israel: when a man shall know the wound of his own heart, and shall spread forth his hands in this house;</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Then hear thou in heaven, in the place of thy dwelling, and forgive, and do so as to give to every one according to his ways, as thou shalt see his heart (for thou only knowest the heart of all the children of men)</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>That they may fear thee all the days that they live upon the face of the land, which thou hast given to our fathers.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Moreover also the stranger, who is not of thy people Israel, when he shall come out of a far country for thy name’s sake, (for they shall hear every where of thy great name, and thy mighty hand,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And thy stretched out arm) so when he shall come, and shall pray in this place,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Then hear thou in heaven, in the firmament of thy dwelling place, and do all those things, for which that stranger shall call upon thee: that all the people of the earth may learn to fear thy name, as do thy people Israel, and may prove that thy name is called upon on this house, which I have built.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>If thy people go out to war against their enemies, by what way soever thou shalt send them, they shall pray to thee towards the way of the city, which thou hast chosen, and towards the house, which I have built to thy name:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And then hear thou in heaven their prayers, and their supplications, and do judgment for them.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>But if they sin against thee, (for there is no man who sinneth not) and thou being angry, deliver them up to their enemies, so that they be led away captives into the land of their enemies, far or near;</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Then if they do penance in their heart, in the place of captivity, and being converted, make supplication to thee in their captivity, saying: We have sinned, we have done unjustly, we have committed wickedness:</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And return to thee with all their heart, and all their soul, in the land of their enemies, to which they have been led captives: and pray to thee towards the way of their land, which thou gavest to their fathers, and of the city which thou hast chosen, and of the temple which I have built to thy name:</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Then hear thou in heaven, in the firmament of thy throne, their prayers, and their supplications, and do judgment for them:</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And forgive thy people, that have sinned against thee, and all their iniquities, by which they have transgressed against thee: and give them mercy before them that have made them captives, that they may have compassion on them.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>For they are thy people, and thy inheritance, whom thou hast brought out of the land of Egypt, from the midst of the furnace of iron.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>That thy eyes may be open to the supplication of thy servant, and of thy people Israel, to hear them in all things for which they shall call upon thee.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>For thou hast separated them to thyself for an inheritance, from amongst all the people of the earth, as thou hast spoken by Moses, thy servant, when thou broughtest our fathers out of Egypt, O Lord God.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And it came to pass, when Solomon had made an end of praying all this prayer and supplication to the Lord, that he rose from before the altar of the Lord: for he had fixed both knees on the ground, and had spread his hands towards heaven.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And he stood, and blessed all the assembly of Israel with a loud voice, saying:</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Blessed be the Lord, who hath given rest to his people Israel, according to all that he promised: there hath not failed so much as one word of all the good things that he promised by his servant Moses.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>The Lord our God be with us, as he was with our fathers, and not leave us, nor cast us off:</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>But may he incline our hearts to himself, that we may walk in all his ways, and keep his commandments, and his ceremonies, and all his judgments, which he commanded our fathers.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And let these my words, wherewith I have prayed before the Lord, be nigh unto the Lord our God day and night, that he may do judgment for his servant, and for his people Israel, day by day:</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>That all the people of the earth may know, that the Lord he is God, and there is no other besides him.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Let our hearts also be perfect with the Lord our God, that we may walk in his statutes, and keep his commandments, as at this day.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And the king, and all Israel with him, offered victims before the Lord.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>And Solomon slew victims of peace offerings, which he sacrificed to the Lord, two and twenty thousand oxen, and a hundred and twenty thousand sheep so the king, and all the children of Israel, dedicated the temple of the Lord.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>In that day the king sanctified the middle of the court, that was before the house of the Lord for there he offered the holocaust, and sacrifice, and the fat of the peace offerings: because the brazen altar that was before the Lord, was too little to receive the holocaust, and sacrifice, and the fat of the peace offerings.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And Solomon made at the same time a solemn feast, and all Israel with him, a great multitude, from the entrance of Emath to the river of Egypt, before the Lord our God, seven days and seven days, that is, fourteen days.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>And on the eighth day, he sent away the people: and they blessed the king, and went to their dwellings, rejoicing, and glad in heart, for all the good things that the Lord had done for David, his servant, and for Israel, his people.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc congregati sunt omnes majores natu Israël cum principibus tribuum, et duces familiarum filiorum Israël, ad regem Salomonem in Jerusalem, ut deferrent arcam fœderis Domini de civitate David, id est, de Sion.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Convenitque ad regem Salomonem universus Israël in mense Ethanim, in solemni die : ipse est mensis septimus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Veneruntque cuncti senes de Israël, et tulerunt arcam sacerdotes,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et portaverunt arcam Domini, et tabernaculum fœderis, et omnia vasa sanctuarii quæ erant in tabernaculo : et ferebant ea sacerdotes et Levitæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Rex autem Salomon, et omnis multitudo Israël quæ convenerat ad eum, gradiebatur cum illo ante arcam, et immolabant oves et boves absque æstimatione et numero.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et intulerunt sacerdotes arcam fœderis Domini in locum suum, in oraculum templi, in Sanctum sanctorum, subter alas cherubim.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Siquidem cherubim expandebant alas super locum arcæ, et protegebant arcam, et vectes ejus desuper.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cumque eminerent vectes, et apparerent summitates eorum foris sanctuarium ante oraculum, non apparebant ultra extrinsecus, qui et fuerunt ibi usque in præsentem diem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In arca autem non erat aliud nisi duæ tabulæ lapideæ quas posuerat in ea Moyses in Horeb, quando pepigit Dominus fœdus cum filiis Israël, cum egrederentur de terra Ægypti.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Factum est autem cum exissent sacerdotes de sanctuario, nebula implevit domum Domini,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et non poterant sacerdotes stare et ministrare propter nebulam : impleverat enim gloria Domini domum Domini.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tunc ait Salomon : Dominus dixit ut habitaret in nebula.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ædificans ædificavi domum in habitaculum tuum : firmissimum solium tuum in sempiternum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Convertitque rex faciem suam, et benedixit omni ecclesiæ Israël : omnia enim ecclesia Israël stabat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ait Salomon : Benedictus Dominus Deus Israël, qui locutus est ore suo ad David patrem meum, et in manibus ejus perfecit, dicens :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A die qua eduxi populum meum Israël de Ægypto, non elegi civitatem de universis tribubus Israël, ut ædificaretur domus, et esset nomen meum ibi : sed elegi David ut esset super populum meum Israël.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Voluitque David pater meus ædificare domum nomini Domini Dei Israël :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et ait Dominus ad David patrem meum : Quod cogitasti in corde tuo ædificare domum nomini meo, bene fecisti, hoc ipsum mente tractans.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Verumtamen tu non ædificabis mihi domum, sed filius tuus, qui egredietur de renibus tuis, ipse ædificabit domum nomini meo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Confirmavit Dominus sermonem suum quem locutus est : stetique pro David patre meo, et sedi super thronum Israël, sicut locutus est Dominus : et ædificavi domum nomini Domini Dei Israël.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et constitui ibi locum arcæ in qua fœdus Domini est, quod percussit cum patribus nostris quando egressi sunt de terra Ægypti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Stetit autem Salomon ante altare Domini in conspectu ecclesiæ Israël, et expandit manus suas in cælum,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et ait : Domine Deus Israël, non est similis tui deus in cælo desuper, et super terram deorsum : qui custodis pactum et misericordiam servis tuis qui ambulant coram te in toto corde suo.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui custodisti servo tuo David patri meo quæ locutus es ei : ore locutus es, et manibus perfecisti, ut hæc dies probat.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Nunc igitur Domine Deus Israël, conserva famulo tuo David patri meo quæ locutus es ei, dicens : Non auferetur de te vir coram me, qui sedeat super thronum Israël : ita tamen si custodierint filii tui viam suam, ut ambulent coram me sicut tu ambulasti in conspectu meo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et nunc Domine Deus Israël, firmentur verba tua quæ locutus es servo tuo David patri meo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ergone putandum est quod vere Deus habitet super terram ? si enim cælum, et cæli cælorum, te capere non possunt, quanto magis domus hæc, quam ædificavi ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sed respice ad orationem servi tui, et ad preces ejus, Domine Deus meus : audi hymnum et orationem quam servus tuus orat coram te hodie :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>ut sint oculi tui aperti super domum hanc nocte ac die : super domum, de qua dixisti : Erit nomen meum ibi : ut exaudias orationem quam orat in loco isto ad te servus tuus :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>ut exaudias deprecationem servi tui et populi tui Israël, quodcumque oraverint in loco isto, et exaudies in loco habitaculi tui in cælo : et cum exaudieris, propitius eris.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si peccaverit homo in proximum suum, et habuerit aliquod juramentum quo teneatur astrictus, et venerit propter juramentum coram altari tuo in domum tuam,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>tu exaudies in cælo : et facies, et judicabis servos tuos, condemnans impium, et reddens viam suam super caput ejus, justificansque justum, et retribuens ei secundum justitiam suam.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Si fugerit populus tuus Israël inimicos suos (quia peccaturus est tibi), et agentes pœnitentiam, et confitentes nomini tuo, venerint, et oraverint, et deprecati te fuerint in domo hac :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>exaudi in cælo, et dimitte peccatum populi tui Israël, et reduces eos in terram quam dedisti patribus eorum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Si clausum fuerit cælum, et non pluerit propter peccata eorum, et orantes in loco isto, pœnitentiam egerint nomini tuo, et a peccatis suis conversi fuerint propter afflictionem suam :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>exaudi eos in cælo, et dimitte peccata servorum tuorum, et populi tui Israël : et ostende eis viam bonam per quam ambulent, et da pluviam super terram tuam, quam dedisti populo tuo in possessionem.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Fames si oborta fuerit in terra, aut pestilentia, aut corruptus aër, aut ærugo, aut locusta, vel rubigo, et afflixerit eum inimicus ejus portas obsidens : omnis plaga, universa infirmitas,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>cuncta devotatio, et imprecatio quæ acciderit omni homini de populo tuo Israël : si quis cognoverit plagam cordis sui, et expanderit manus suas in domo hac,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>tu exaudies in cælo in loco habitationis tuæ, et repropitiaberis, et facies ut des unicuique secundum omnes vias suas, sicut videris cor ejus (quia tu nosti solus cor omnium filiorum hominum),</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>ut timeant te cunctis diebus quibus vivunt super faciem terræ quam dedisti patribus nostris.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Insuper et alienigena, qui non est de populo tuo Israël, cum venerit de terra longinqua propter nomen tuum (audietur enim nomen tuum magnum, et manus tua fortis, et brachium tuum</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>extentum ubique), cum venerit ergo, et oraverit in hoc loco,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>tu exaudies in cælo, in firmamento habitaculi tui, et facies omnia pro quibus invocaverit te alienigena : ut discant universi populi terrarum nomen tuum timere, sicut populus tuus Israël, et probent quia nomen tuum invocatum est super domum hanc quam ædificavi.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Si egressus fuerit populus tuus ad bellum contra inimicos suos per viam, quocumque miseris eos, orabunt te contra viam civitatis quam elegisti, et contra domum quam ædificavi nomini tuo,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>et exaudies in cælo orationes eorum et preces eorum, et facies judicium eorum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Quod si peccaverint tibi (non est enim homo qui non peccet) et iratus tradideris eos inimicis suis, et captivi ducti fuerint in terram inimicorum longe vel prope,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>et egerint pœnitentiam in corde suo in loco captivitatis, et conversi deprecati te fuerint in captivitate sua, dicentes : Peccavimus : inique egimus, impie gessimus :</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>et reversi fuerint ad te in universo corde suo et tota anima sua in terra inimicorum suorum, ad quam captivi ducti fuerint : et oraverint te contra viam terræ suæ, quam dedisti patribus eorum, et civitatis quam elegisti, et templi quod ædificavi nomini tuo :</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>exaudies in cælo, in firmamento solii tui, orationes eorum et preces eorum, et facies judicium eorum :</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>et propitiaberis populo tuo qui peccavit tibi, et omnibus iniquitatibus eorum quibus prævaricati sunt in te : et dabis misericordiam coram eis qui eos captivos habuerint, ut misereantur eis.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Populus enim tuus est, et hæreditas tua, quos eduxisti de terra Ægypti, de medio fornacis ferreæ.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Ut sint oculi tui aperti ad deprecationem servi tui, et populi tui Israël, et exaudias eos in universis pro quibus invocaverint te.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Tu enim separasti eos tibi in hæreditatem de universis populis terræ, sicut locutus es per Moysen servum tuum quando eduxisti patres nostros de Ægypto, Domine Deus.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Factum est autem, cum complesset Salomon orans Dominum omnem orationem et deprecationem hanc, surrexit de conspectu altaris Domini : utrumque enim genu in terram fixerat, et manus expanderat in cælum.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Stetit ergo, et benedixit omni ecclesiæ Israël voce magna, dicens :</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Benedictus Dominus, qui dedit requiem populo suo Israël, juxta omnia quæ locutus est : non cecidit ne unus quidem sermo ex omnibus bonis quæ locutus est per Moysen servum suum.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Sit Dominus Deus noster nobiscum, sicut fuit cum patribus nostris, non derelinquens nos, neque projiciens.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Sed inclinet corda nostra ad se, ut ambulemus in universis viis ejus, et custodiamus mandata ejus, et cæremonias ejus, et judicia quæcumque mandavit patribus nostris.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Et sint sermones mei isti, quibus deprecatus sum coram Domino, appropinquantes Domino Deo nostro die ac nocte, ut faciat judicium servo suo, et populo suo Israël per singulos dies :</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>ut sciant omnes populi terræ quia Dominus ipse est Deus, et non est ultra absque eo.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Sit quoque cor nostrum perfectum cum Domino Deo nostro, ut ambulemus in decretis ejus, et custodiamus mandata ejus, sicut et hodie.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Igitur rex, et omnis Israël cum eo, immolabant victimas coram Domino.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Mactavitque Salomon hostias pacificas, quas immolavit Domino, boum viginti duo millia, et ovium centum viginti millia : et dedicaverunt templum Domini rex et filii Israël.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>In die illa sanctificavit rex medium atrii quod erat ante domum Domini : fecit quippe holocaustum ibi, et sacrificium, et adipem pacificorum : quoniam altare æreum quod erat coram Domino, minus erat, et capere non poterat holocaustum, et sacrificium, et adipem pacificorum.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Fecit ergo Salomon in tempore illo festivitatem celebrem, et omnis Israël cum eo, multitudo magna ab introitu Emath usque ad rivum Ægypti, coram Domino Deo nostro, septem diebus et septem diebus, id est, quatuordecim diebus.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Et in die octava dimisit populos : qui benedicentes regi, profecti sunt in tabernacula sua lætantes, et alacri corde super omnibus bonis quæ fecerat Dominus David servo suo, et Israël populo suo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/cathol :8,\"totalChapters\":22,\"dra\":[{\"verse\":1,\"text\":\"Then all the ancients of Israel, with the princes of the tribes, and the heads of the families of the children of Israel, were assembled to king Solomon, in Jerusalem: that they might carry the ark of the covenant of the Lord, out of the city of David, that is, out of Sion.\"},{\"verse\":2,\"text\":\"And all Israel assembled themselves to king Solomon, on the festival day, in the month of Ethanim, the same is the seventh month.\"},{\"verse\":3,\"text\":\"And all the ancients of Israel came, and the priests took up the ark,\"},{\"verse\":4,\"text\":\"And carried the ark of the Lord, and the tabernacle of the covenant, and all the vessels of the sanctuary, that were in the tabernacle: and the priests and the Levites carried them.\"},{\"verse\":5,\"text\":\"And king Solomon, and all the multitude of Israel, that were assembled unto him, went with him before the ark, and they sacrificed sheep and oxen, that could not be counted or numbered.\"},{\"verse\":6,\"text\":\"And the priests brought in the ark of the covenant of the Lord into its place, into the oracle of the temple, into the holy of holies, under the wings of the cherubims.\"},{\"verse\":7,\"text\":\"For the cherubims spread forth their wings over the place of the ark, and covered the ark, and the staves thereof above.\"},{\"verse\":8,\"text\":\"And whereas the staves stood out, the ends of them were seen without, in the sanctuary before the oracle, but were not seen farther out, and there they have been unto this day.\"},{\"verse\":9,\"text\":\"Now in the ark there was nothing else but the two tables of stone, which Moses put there at Horeb, when the Lord made a covenant with the children of Israel, when they came out of the land of Egypt.\"},{\"verse\":10,\"text\":\"And it came to pass, when the priests were come out of the sanctuary, that a cloud filled the house of the Lord,\"},{\"verse\":11,\"text\":\"And the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord.\"},{\"verse\":12,\"text\":\"Then Solomon said: The Lord said that he would dwell in a cloud.\"},{\"verse\":13,\"text\":\"Building, I have built a house for thy dwelling, to be thy most firm throne for ever.\"},{\"verse\":14,\"text\":\"And the king turned his face, and blessed all the assembly of Israel: for all the assembly of Israel stood.\"},{\"verse\":15,\"text\":\"And Solomon said: Blessed be the Lord the God of Israel, who spoke with his mouth to David, my father, and with his own hands hath accomplished it, saying:\"},{\"verse\":16,\"text\":\"Since the day that I brought my people Israel, out of Egypt, I chose no city out of all the tribes of Israel, for a house to be built, that my name might be there: but I chose David to be over my people Israel.\"},{\"verse\":17,\"text\":\"And David, my father, would have built a house to the name of the Lord, the God of Israel:\"},{\"verse\":18,\"text\":\"And the Lord said to David, my father: Whereas, thou hast thought in thy heart to build a house to my name, thou hast done well in having this same thing in thy mind.\"},{\"verse\":19,\"text\":\"Nevertheless, thou shalt not build me a house, but thy son, that shall come forth out of thy loins, he shall build a house to my name.\"},{\"verse\":20,\"text\":\"The Lord hath performed his word which he spoke. And I stand in the room of David, my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord, the God of Israel.\"},{\"verse\":21,\"text\":\"And I have set there a place for the ark, wherein is the covenant of the Lord, which he made with our fathers, when they came out of the land of Egypt.\"},{\"verse\":22,\"text\":\"And Solomon stood before the altar of the Lord, in the sight of the assembly of Israel, and spread forth his hands towards heaven,\"},{\"verse\":23,\"text\":\"And said: Lord God of Israel, there is no God like thee, in heaven above, or on the earth beneath: who keepest covenant and mercy with thy servants, that have walked before thee with all their heart:\"},{\"verse\":24,\"text\":\"Who hast kept with thy servant David, my father, what thou hast promised him: with thy mouth thou didst speak, and with thy hands thou hast performed, as this day proveth.\"},{\"verse\":25,\"text\":\"Now, therefore, O Lord God of Israel, keep with thy servant David, my father, what thou hast spoken to him, saying: There shall not be taken away of thee a man in my sight, to sit on the throne of Israel: yet so that thy children take heed to their way, that they walk before me as thou hast walked in my sight.\"},{\"verse\":26,\"text\":\"And now, Lord God of Israel, let thy words be established, which thou hast spoken to thy servant David, my father.\"},{\"verse\":27,\"text\":\"Is it then to be thought that God should indeed dwell upon earth? for if heaven, and the heavens of heavens, cannot contain thee, how much less this house which I have built?\"},{\"verse\":28,\"text\":\"But have regard to the prayer of thy servant, and to his supplications, O Lord, my God: hear the hymn and the prayer, which thy servant prayeth before thee this day:\"},{\"verse\":29,\"text\":\"That thy eyes may be open upon this house, night and day: upon the house of which thou hast said: My name shall be there: that thou mayst hearken to the prayer which thy servant prayeth, in this place to thee:\"},{\"verse\":30,\"text\":\"That thou mayst hearken to the supplication of thy servant, and of thy people Israel, whatsoever they shall pray for in this place, and hear them in the place of thy dwelling in heaven; and when thou hearest, shew them mercy.\"},{\"verse\":31,\"text\":\"If any man trespass against his neighbour, and have an oath upon him, wherewith he is bound, and come, because of the oath, before thy altar, to thy house,\"},{\"verse\":32,\"text\":\"Then hear thou in heaven: and do and judge thy servants, condemning the wicked, and bringing his way upon his own head, and justifying the just, and rewarding him according to his justice.\"},{\"verse\":33,\"text\":\"If thy people Israel shall fly before their enemies (because they will sin against thee) and doing penance, and confessing to thy name, shall come and pray, and make supplications to thee in this house:\"},{\"verse\":34,\"text\":\"Then hear thou in heaven, and forgive the sin of thy people Israel, and bring them back to the land which thou gavest to their fathers.\"},{\"verse\":35,\"text\":\"If heaven shall be shut up, and there shall be no rain, because of their sins, and they, praying in this place, shall do penance to thy name, and shall be converted from their sins, by occasion of their afflictions:\"},{\"verse\":36,\"text\":\"Then hear thou them in heaven, and forgive the sins of thy servants, and of thy people Israel: and shew them the good way wherein they should walk, and give rain upon thy land, which thou hast given to thy people in possession.\"},{\"verse\":37,\"text\":\"If a famine arise in the land, or a pestilence, or corrupt air, or blasting, or locust, or mildew; if their enemy afflict them, besieging the gates, whatsoever plague, whatsoever infirmity,\"},{\"verse\":38,\"text\":\"Whatsoever curse or imprecation shall happen to any man of thy people Israel: when a man shall know the wound of his own heart, and shall spread forth his hands in this house;\"},{\"verse\":39,\"text\":\"Then hear thou in heaven, in the place of thy dwelling, and forgive, and do so as to give to every one according to his ways, as thou shalt see his heart (for thou only knowest the heart of all the children of men)\"},{\"verse\":40,\"text\":\"That they may fear thee all the days that they live upon the face of the land, which thou hast given to our fathers.\"},{\"verse\":41,\"text\":\"Moreover also the stranger, who is not of thy people Israel, when he shall come out of a far country for thy name’s sake, (for they shall hear every where of thy great name, and thy mighty hand,\"},{\"verse\":42,\"text\":\"And thy stretched out arm) so when he shall come, and shall pray in this place,\"},{\"verse\":43,\"text\":\"Then hear thou in heaven, in the firmament of thy dwelling place, and do all those things, for which that stranger shall call upon thee: that all the people of the earth may learn to fear thy name, as do thy people Israel, and may prove that thy name is called upon on this house, which I have built.\"},{\"verse\":44,\"text\":\"If thy people go out to war against their enemies, by what way soever thou shalt send them, they shall pray to thee towards the way of the city, which thou hast chosen, and towards the house, which I have built to thy name:\"},{\"verse\":45,\"text\":\"And then hear thou in heaven their prayers, and their supplications, and do judgment for them.\"},{\"verse\":46,\"text\":\"But if they sin against thee, (for there is no man who sinneth not) and thou being angry, deliver them up to their enemies, so that they be led away captives into the land of their enemies, far or near;\"},{\"verse\":47,\"text\":\"Then if they do penance in their heart, in the place of captivity, and being converted, make supplication to thee in their captivity, saying: We have sinned, we have done unjustly, we have committed wickedness:\"},{\"verse\":48,\"text\":\"And return to thee with all their heart, and all their soul, in the land of their enemies, to which they have been led captives: and pray to thee towards the way of their land, which thou gavest to their fathers, and of the city which thou hast chosen, and of the temple which I have built to thy name:\"},{\"verse\":49,\"text\":\"Then hear thou in heaven, in the firmament of thy throne, their prayers, and their supplications, and do judgment for them:\"},{\"verse\":50,\"text\":\"And forgive thy people, that have sinned against thee, and all their iniquities, by which they have transgressed against thee: and give them mercy before them that have made them captives, that they may have compassion on them.\"},{\"verse\":51,\"text\":\"For they are thy people, and thy inheritance, whom thou hast brought out of the land of Egypt, from the midst of the furnace of iron.\"},{\"verse\":52,\"text\":\"That thy eyes may be open to the supplication of thy servant, and of thy people Israel, to hear them in all things for which they shall call upon thee.\"},{\"verse\":53,\"text\":\"For thou hast separated them to thyself for an inheritance, from amongst all the people of the earth, as thou hast spoken by Moses, thy servant, when thou broughtest our fathers out of Egypt, O Lord God.\"},{\"verse\":54,\"text\":\"And it came to pass, when Solomon had made an end of praying all this prayer and supplication to the Lord, that he rose from before the altar of the Lord: for he had fixed both knees on the ground, and had spread his hands towards heaven.\"},{\"verse\":55,\"text\":\"And he stood, and blessed all the assembly of Israel with a loud voice, saying:\"},{\"verse\":56,\"text\":\"Blessed be the Lord, who hath given rest to his people Israel, according to all that he promised: there hath not failed so much as one word of all the good things that he promised by his servant Moses.\"},{\"verse\":57,\"text\":\"The Lord our God be with us, as he was with our fathers, and not leave us, nor cast us off:\"},{\"verse\":58,\"text\":\"But may he incline our hearts to himself, that we may walk in all his ways, and keep his commandments, and his ceremonies, and all his judgments, which he commanded our fathers.\"},{\"verse\":59,\"text\":\"And let these my words, wherewith I have prayed before the Lord, be nigh unto the Lord our God day and night, that he may do judgment for his servant, and for his people Israel, day by day:\"},{\"verse\":60,\"text\":\"That all the people of the earth may know, that the Lord he is God, and there is no other besides him.\"},{\"verse\":61,\"text\":\"Let our hearts also be perfect with the Lord our God, that we may walk in his statutes, and keep his commandments, as at this day.\"},{\"verse\":62,\"text\":\"And the king, and all Israel with him, offered victims before the Lord.\"},{\"verse\":63,\"text\":\"And Solomon slew victims of peace offerings, which he sacrificed to the Lord, two and twenty thousand oxen, and a hundred and twenty thousand sheep so the king, and all the children of Israel, dedicated the temple of the Lord.\"},{\"verse\":64,\"text\":\"In that day the king sanctified the middle of the court, that was before the house of the Lord for there he offered the holocaust, and sacrifice, and the fat of the peace offerings: because the brazen altar that was before the Lord, was too little to receive the holocaust, and sacrifice, and the fat of the peace offerings.\"},{\"verse\":65,\"text\":\"And Solomon made at the same time a solemn feast, and all Israel with him, a great multitude, from the entrance of Emath to the river of Egypt, before the Lord our God, seven days and seven days, that is, fourteen days.\"},{\"verse\":66,\"text\":\"And on the eighth day, he sent away the people: and they blessed the king, and went to their dwellings, rejoicing, and glad in heart, for all the good things that the Lord had done for David, his servant, and for Israel, his people.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc congregati sunt omnes majores natu Israël cum principibus tribuum, et duces familiarum filiorum Israël, ad regem Salomonem in Jerusalem, ut deferrent arcam fœderis Domini de civitate David, id est, de Sion.\"},{\"verse\":2,\"text\":\"Convenitque ad regem Salomonem universus Israël in mense Ethanim, in solemni die : ipse est mensis septimus.\"},{\"verse\":3,\"text\":\"Veneruntque cuncti senes de Israël, et tulerunt arcam sacerdotes,\"},{\"verse\":4,\"text\":\"et portaverunt arcam Domini, et tabernaculum fœderis, et omnia vasa sanctuarii quæ erant in tabernaculo : et ferebant ea sacerdotes et Levitæ.\"},{\"verse\":5,\"text\":\"Rex autem Salomon, et omnis multitudo Israël quæ convenerat ad eum, gradiebatur cum illo ante arcam, et immolabant oves et boves absque æstimatione et numero.\"},{\"verse\":6,\"text\":\"Et intulerunt sacerdotes arcam fœderis Domini in locum suum, in oraculum templi, in Sanctum sanctorum, subter alas cherubim.\"},{\"verse\":7,\"text\":\"Siquidem cherubim expandebant alas super locum arcæ, et protegebant arcam, et vectes ejus desuper.\"},{\"verse\":8,\"text\":\"Cumque eminerent vectes, et apparerent summitates eorum foris sanctuarium ante oraculum, non apparebant ultra extrinsecus, qui et fuerunt ibi usque in præsentem diem.\"},{\"verse\":9,\"text\":\"In arca autem non erat aliud nisi duæ tabulæ lapideæ quas posuerat in ea Moyses in Horeb, quando pepigit Dominus fœdus cum filiis Israël, cum egrederentur de terra Ægypti.\"},{\"verse\":10,\"text\":\"Factum est autem cum exissent sacerdotes de sanctuario, nebula implevit domum Domini,\"},{\"verse\":11,\"text\":\"et non poterant sacerdotes stare et ministrare propter nebulam : impleverat enim gloria Domini domum Domini.\"},{\"verse\":12,\"text\":\"Tunc ait Salomon : Dominus dixit ut habitaret in nebula.\"},{\"verse\":13,\"text\":\"Ædificans ædificavi domum in habitaculum tuum : firmissimum solium tuum in sempiternum.\"},{\"verse\":14,\"text\":\"Convertitque rex faciem suam, et benedixit omni ecclesiæ Israël : omnia enim ecclesia Israël stabat.\"},{\"verse\":15,\"text\":\"Et ait Salomon : Benedictus Dominus Deus Israël, qui locutus est ore suo ad David patrem meum, et in manibus ejus perfecit, dicens :\"},{\"verse\":16,\"text\":\"A die qua eduxi populum meum Israël de Ægypto, non elegi civitatem de universis tribubus Israël, ut ædificaretur domus, et esset nomen meum ibi : sed elegi David ut esset super populum meum Israël.\"},{\"verse\":17,\"text\":\"Voluitque David pater meus ædificare domum nomini Domini Dei Israël :\"},{\"verse\":18,\"text\":\"et ait Dominus ad David patrem meum : Quod cogitasti in corde tuo ædificare domum nomini meo, bene fecisti, hoc ipsum mente tractans.\"},{\"verse\":19,\"text\":\"Verumtamen tu non ædificabis mihi domum, sed filius tuus, qui egredietur de renibus tuis, ipse ædificabit domum nomini meo.\"},{\"verse\":20,\"text\":\"Confirmavit Dominus sermonem suum quem locutus est : stetique pro David patre meo, et sedi super thronum Israël, sicut locutus est Dominus : et ædificavi domum nomini Domini Dei Israël.\"},{\"verse\":21,\"text\":\"Et constitui ibi locum arcæ in qua fœdus Domini est, quod percussit cum patribus nostris quando egressi sunt de terra Ægypti.\"},{\"verse\":22,\"text\":\"Stetit autem Salomon ante altare Domini in conspectu ecclesiæ Israël, et expandit manus suas in cælum,\"},{\"verse\":23,\"text\":\"et ait : Domine Deus Israël, non est similis tui deus in cælo desuper, et super terram deorsum : qui custodis pactum et misericordiam servis tuis qui ambulant coram te in toto corde suo.\"},{\"verse\":24,\"text\":\"Qui custodisti servo tuo David patri meo quæ locutus es ei : ore locutus es, et manibus perfecisti, ut hæc dies probat.\"},{\"verse\":25,\"text\":\"Nunc igitur Domine Deus Israël, conserva famulo tuo David patri meo quæ locutus es ei, dicens : Non auferetur de te vir coram me, qui sedeat super thronum Israël : ita tamen si custodierint filii tui viam suam, ut ambulent coram me sicut tu ambulasti in conspectu meo.\"},{\"verse\":26,\"text\":\"Et nunc Domine Deus Israël, firmentur verba tua quæ locutus es servo tuo David patri meo.\"},{\"verse\":27,\"text\":\"Ergone putandum est quod vere Deus habitet super terram ? si enim cælum, et cæli cælorum, te capere non possunt, quanto magis domus hæc, quam ædificavi ?\"},{\"verse\":28,\"text\":\"Sed respice ad orationem servi tui, et ad preces ejus, Domine Deus meus : audi hymnum et orationem quam servus tuus orat coram te hodie :\"},{\"verse\":29,\"text\":\"ut sint oculi tui aperti super domum hanc nocte ac die : super domum, de qua dixisti : Erit nomen meum ibi : ut exaudias orationem quam orat in loco isto ad te servus tuus :\"},{\"verse\":30,\"text\":\"ut exaudias deprecationem servi tui et populi tui Israël, quodcumque oraverint in loco isto, et exaudies in loco habitaculi tui in cælo : et cum exaudieris, propitius eris.\"},{\"verse\":31,\"text\":\"Si peccaverit homo in proximum suum, et habuerit aliquod juramentum quo teneatur astrictus, et venerit propter juramentum coram altari tuo in domum tuam,\"},{\"verse\":32,\"text\":\"tu exaudies in cælo : et facies, et judicabis servos tuos, condemnans impium, et reddens viam suam super caput ejus, justificansque justum, et retribuens ei secundum justitiam suam.\"},{\"verse\":33,\"text\":\"Si fugerit populus tuus Israël inimicos suos (quia peccaturus est tibi), et agentes pœnitentiam, et confitentes nomini tuo, venerint, et oraverint, et deprecati te fuerint in domo hac :\"},{\"verse\":34,\"text\":\"exaudi in cælo, et dimitte peccatum populi tui Israël, et reduces eos in terram quam dedisti patribus eorum.\"},{\"verse\":35,\"text\":\"Si clausum fuerit cælum, et non pluerit propter peccata eorum, et orantes in loco isto, pœnitentiam egerint nomini tuo, et a peccatis suis conversi fuerint propter afflictionem suam :\"},{\"verse\":36,\"text\":\"exaudi eos in cælo, et dimitte peccata servorum tuorum, et populi tui Israël : et ostende eis viam bonam per quam ambulent, et da pluviam super terram tuam, quam dedisti populo tuo in possessionem.\"},{\"verse\":37,\"text\":\"Fames si oborta fuerit in terra, aut pestilentia, aut corruptus aër, aut ærugo, aut locusta, vel rubigo, et afflixerit eum inimicus ejus portas obsidens : omnis plaga, universa infirmitas,\"},{\"verse\":38,\"text\":\"cuncta devotatio, et imprecatio quæ acciderit omni homini de populo tuo Israël : si quis cognoverit plagam cordis sui, et expanderit manus suas in domo hac,\"},{\"verse\":39,\"text\":\"tu exaudies in cælo in loco habitationis tuæ, et repropitiaberis, et facies ut des unicuique secundum omnes vias suas, sicut videris cor ejus (quia tu nosti solus cor omnium filiorum hominum),\"},{\"verse\":40,\"text\":\"ut timeant te cunctis diebus quibus vivunt super faciem terræ quam dedisti patribus nostris.\"},{\"verse\":41,\"text\":\"Insuper et alienigena, qui non est de populo tuo Israël, cum venerit de terra longinqua propter nomen tuum (audietur enim nomen tuum magnum, et manus tua fortis, et brachium tuum\"},{\"verse\":42,\"text\":\"extentum ubique), cum venerit ergo, et oraverit in hoc loco,\"},{\"verse\":43,\"text\":\"tu exaudies in cælo, in firmamento habitaculi tui, et facies omnia pro quibus invocaverit te alienigena : ut discant universi populi terrarum nomen tuum timere, sicut populus tuus Israël, et probent quia nomen tuum invocatum est super domum hanc quam ædificavi.\"},{\"verse\":44,\"text\":\"Si egressus fuerit populus tuus ad bellum contra inimicos suos per viam, quocumque miseris eos, orabunt te contra viam civitatis quam elegisti, et contra domum quam ædificavi nomini tuo,\"},{\"verse\":45,\"text\":\"et exaudies in cælo orationes eorum et preces eorum, et facies judicium eorum.\"},{\"verse\":46,\"text\":\"Quod si peccaverint tibi (non est enim homo qui non peccet) et iratus tradideris eos inimicis suis, et captivi ducti fuerint in terram inimicorum longe vel prope,\"},{\"verse\":47,\"text\":\"et egerint pœnitentiam in corde suo in loco captivitatis, et conversi deprecati te fuerint in captivitate sua, dicentes : Peccavimus : inique egimus, impie gessimus :\"},{\"verse\":48,\"text\":\"et reversi fuerint ad te in universo corde suo et tota anima sua in terra inimicorum suorum, ad quam captivi ducti fuerint : et oraverint te contra viam terræ suæ, quam dedisti patribus eorum, et civitatis quam elegisti, et templi quod ædificavi nomini tuo :\"},{\"verse\":49,\"text\":\"exaudies in cælo, in firmamento solii tui, orationes eorum et preces eorum, et facies judicium eorum :\"},{\"verse\":50,\"text\":\"et propitiaberis populo tuo qui peccavit tibi, et omnibus iniquitatibus eorum quibus prævaricati sunt in te : et dabis misericordiam coram eis qui eos captivos habuerint, ut misereantur eis.\"},{\"verse\":51,\"text\":\"Populus enim tuus est, et hæreditas tua, quos eduxisti de terra Ægypti, de medio fornacis ferreæ.\"},{\"verse\":52,\"text\":\"Ut sint oculi tui aperti ad deprecationem servi tui, et populi tui Israël, et exaudias eos in universis pro quibus invocaverint te.\"},{\"verse\":53,\"text\":\"Tu enim separasti eos tibi in hæreditatem de universis populis terræ, sicut locutus es per Moysen servum tuum quando eduxisti patres nostros de Ægypto, Domine Deus.\"},{\"verse\":54,\"text\":\"Factum est autem, cum complesset Salomon orans Dominum omnem orationem et deprecationem hanc, surrexit de conspectu altaris Domini : utrumque enim genu in terram fixerat, et manus expanderat in cælum.\"},{\"verse\":55,\"text\":\"Stetit ergo, et benedixit omni ecclesiæ Israël voce magna, dicens :\"},{\"verse\":56,\"text\":\"Benedictus Dominus, qui dedit requiem populo suo Israël, juxta omnia quæ locutus est : non cecidit ne unus quidem sermo ex omnibus bonis quæ locutus est per Moysen servum suum.\"},{\"verse\":57,\"text\":\"Sit Dominus Deus noster nobiscum, sicut fuit cum patribus nostris, non derelinquens nos, neque projiciens.\"},{\"verse\":58,\"text\":\"Sed inclinet corda nostra ad se, ut ambulemus in universis viis ejus, et custodiamus mandata ejus, et cæremonias ejus, et judicia quæcumque mandavit patribus nostris.\"},{\"verse\":59,\"text\":\"Et sint sermones mei isti, quibus deprecatus sum coram Domino, appropinquantes Domino Deo nostro die ac nocte, ut faciat judicium servo suo, et populo suo Israël per singulos dies :\"},{\"verse\":60,\"text\":\"ut sciant omnes populi terræ quia Dominus ipse est Deus, et non est ultra absque eo.\"},{\"verse\":61,\"text\":\"Sit quoque cor nostrum perfectum cum Domino Deo nostro, ut ambulemus in decretis ejus, et custodiamus mandata ejus, sicut et hodie.\"},{\"verse\":62,\"text\":\"Igitur rex, et omnis Israël cum eo, immolabant victimas coram Domino.\"},{\"verse\":63,\"text\":\"Mactavitque Salomon hostias pacificas, quas immolavit Domino, boum viginti duo millia, et ovium centum viginti millia : et dedicaverunt templum Domini rex et filii Israël.\"},{\"verse\":64,\"text\":\"In die illa sanctificavit rex medium atrii quod erat ante domum Domini : fecit quippe holocaustum ibi, et sacrificium, et adipem pacificorum : quoniam altare æreum quod erat coram Domino, minus erat, et capere non poterat holocaustum, et sacrificium, et adipem pacificorum.\"},{\"verse\":65,\"text\":\"Fecit ergo Salomon in tempore illo festivitatem celebrem, et omnis Israël cum eo, multitudo magna ab introitu Emath usque ad rivum Ægypti, coram Domino Deo nostro, septem diebus et septem diebus, id est, quatuordecim diebus.\"},{\"verse\":66,\"text\":\"Et in die octava dimisit populos : qui benedicentes regi, profecti sunt in tabernacula sua lætantes, et alacri corde super omnibus bonis quæ fecerat Dominus David servo suo, et Israël populo suo.\"}],\"summary\":\"The dedication of the temple: Solomon’s prayer and sacrifices.\",\"intro\":null,\"prev\":{\"usfm\":\"1KI\",\"chapter\":7,\"label\":\"1 Kings 7\"},\"next\":{\"usfm\":\"1KI\",\"chapter\":9,\"label\":\"1 Kings 9\"}}]]\n"])</script></body></html>
