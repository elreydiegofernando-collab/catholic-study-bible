nly-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But speak thou the things that become sound doctrine:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>That the aged men be sober, chaste, prudent, sound in faith, in love, in patience.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The aged women, in like manner, in holy attire, not false accusers, not given to much wine, teaching well:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>That they may teach the young women to be wise, to love their husbands, to love their children.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>To be discreet, chaste, sober, having a care of the house, gentle, obedient to their husbands: that the word of God be not blasphemed.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Young men, in like manner, exhort that they be sober.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In all things shew thyself an example of good works, in doctrine, in integrity, in gravity,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The sound word that can not be blamed: that he who is on the contrary part may be afraid, having no evil to say of us.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Exhort servants to be obedient to their masters: in all things pleasing, not gainsaying:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Not defrauding, but in all things shewing good fidelity, that they may adorn the doctrine of God our Saviour in all things.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For the grace of God our Saviour hath appeared to all men:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Instructing us, that, denying ungodliness and worldly desires, we should live soberly and justly and godly in this world,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Looking for the blessed hope and coming of the glory of the great God and our Saviour Jesus Christ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Who gave himself for us, that he might redeem us from all iniquity and might cleanse to himself a people acceptable, a pursuer of good works.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>These things speak and exhort and rebuke with all authority. Let no man despise thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tu autem loquere quæ decent sanam doctrinam :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>senes ut sobrii sint, pudici, prudentes, sani in fide, in dilectione, in patientia :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>anus similiter in habitu sancto, non criminatrices, non multo vino servientes, bene docentes :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ut prudentiam doceant adolescentulas, ut viros suos ament, filios suos diligant,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>prudentes, castas, sobrias, domus curam habentes, benignas, subditas viris suis, ut non blasphemetur verbum Dei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Juvenes similiter hortare ut sobrii sint.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In omnibus teipsum præbe exemplum bonorum operum, in doctrina, in integritate, in gravitate,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>verbum sanum, irreprehensibile : ut is qui ex adverso est, vereatur, nihil habens malum dicere de nobis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Servos dominis suis subditos esse, in omnibus placentes, non contradicentes,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>non fraudantes, sed in omnibus fidem bonam ostendentes : ut doctrinam Salvatoris nostri Dei ornent in omnibus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Apparuit enim gratia Dei Salvatoris nostri omnibus hominibus,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>erudiens nos, ut abnegantes impietatem, et sæcularia desideria, sobrie, et juste, et pie vivamus in hoc sæculo,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>exspectantes beatam spem, et adventum gloriæ magni Dei, et Salvatoris nostri Jesu Christi :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>qui dedit semetipsum pro nobis, ut nos redimeret ab omni iniquitate, et mundaret sibi populum acceptabilem, sectatorem bonorum operum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hæc loquere, et exhortare, et argue cum omni imperio. Nemo te contemnat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/TIT/1/"><svg viewBox="0 0 24 ou the things that become sound doctrine:\"},{\"verse\":2,\"text\":\"That the aged men be sober, chaste, prudent, sound in faith, in love, in patience.\"},{\"verse\":3,\"text\":\"The aged women, in like manner, in holy attire, not false accusers, not given to much wine, teaching well:\"},{\"verse\":4,\"text\":\"That they may teach the young women to be wise, to love their husbands, to love their children.\"},{\"verse\":5,\"text\":\"To be discreet, chaste, sober, having a care of the house, gentle, obedient to their husbands: that the word of God be not blasphemed.\"},{\"verse\":6,\"text\":\"Young men, in like manner, exhort that they be sober.\"},{\"verse\":7,\"text\":\"In all things shew thyself an example of good works, in doctrine, in integrity, in gravity,\"},{\"verse\":8,\"text\":\"The sound word that can not be blamed: that he who is on the contrary part may be afraid, having no evil to say of us.\"},{\"verse\":9,\"text\":\"Exhort servants to be obedient to their masters: in all things pleasing, not gainsaying:\"},{\"verse\":10,\"text\":\"Not defrauding, but in all things shewing good fidelity, that they may adorn the doctrine of God our Saviour in all things.\"},{\"verse\":11,\"text\":\"For the grace of God our Saviour hath appeared to all men:\"},{\"verse\":12,\"text\":\"Instructing us, that, denying ungodliness and worldly desires, we should live soberly and justly and godly in this world,\"},{\"verse\":13,\"text\":\"Looking for the blessed hope and coming of the glory of the great God and our Saviour Jesus Christ.\"},{\"verse\":14,\"text\":\"Who gave himself for us, that he might redeem us from all iniquity and might cleanse to himself a people acceptable, a pursuer of good works.\"},{\"verse\":15,\"text\":\"These things speak and exhort and rebuke with all authority. Let no man despise thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tu autem loquere quæ decent sanam doctrinam :\"},{\"verse\":2,\"text\":\"senes ut sobrii sint, pudici, prudentes, sani in fide, in dilectione, in patientia :\"},{\"verse\":3,\"text\":\"anus similiter in habitu sancto, non criminatrices, non multo vino servientes, bene docentes :\"},{\"verse\":4,\"text\":\"ut prudentiam doceant adolescentulas, ut viros suos ament, filios suos diligant,\"},{\"verse\":5,\"text\":\"prudentes, castas, sobrias, domus curam habentes, benignas, subditas viris suis, ut non blasphemetur verbum Dei.\"},{\"verse\":6,\"text\":\"Juvenes similiter hortare ut sobrii sint.\"},{\"verse\":7,\"text\":\"In omnibus teipsum præbe exemplum bonorum operum, in doctrina, in integritate, in gravitate,\"},{\"verse\":8,\"text\":\"verbum sanum, irreprehensibile : ut is qui ex adverso est, vereatur, nihil habens malum dicere de nobis.\"},{\"verse\":9,\"text\":\"Servos dominis suis subditos esse, in omnibus placentes, non contradicentes,\"},{\"verse\":10,\"text\":\"non fraudantes, sed in omnibus fidem bonam ostendentes : ut doctrinam Salvatoris nostri Dei ornent in omnibus.\"},{\"verse\":11,\"text\":\"Apparuit enim gratia Dei Salvatoris nostri omnibus hominibus,\"},{\"verse\":12,\"text\":\"erudiens nos, ut abnegantes impietatem, et sæcularia desideria, sobrie, et juste, et pie vivamus in hoc sæculo,\"},{\"verse\":13,\"text\":\"exspectantes beatam spem, et adventum gloriæ magni Dei, et Salvatoris nostri Jesu Christi :\"},{\"verse\":14,\"text\":\"qui dedit semetipsum pro nobis, ut nos redimeret ab omni iniquitate, et mundaret sibi populum acceptabilem, sectatorem bonorum operum.\"},{\"verse\":15,\"text\":\"Hæc loquere, et exhortare, et argue cum omni imperio. Nemo te contemnat.\"}],\"summary\":\"How he is to instruct both old and young. The duty of servants. The Christian’s rule of life.\",\"intro\":null,\"prev\":{\"usfm\":\"TIT\",\"chapter\":1,\"label\":\"Titus 1\"},\"next\":{\"usfm\":\"TIT\",\"chapter\":3,\"label\":\"Titus 3\"}}]]\n"])</script></body></html>
