20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Esther<!-- --> <span class="text-stone-500">15</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Esther comes into the king’s presence: she is terrified, but God turns his heart.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And he commanded her (no doubt but he was Mardochai) to go to the king, and petition for her people, and for her country.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Remember, (said he,) the days of thy low estate, how thou wast brought up by my hand, because Aman the second after the king hath spoken against us unto death.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And do thou call upon the Lord, and speak to the king for us, and deliver us from death.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And on the third day she laid away the garments she wore, and put on her glorious apparel.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And glittering in royal robes, after she had called upon God the ruler and Saviour of all, she took two maids with her,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And upon one of them she leaned, as if for delicateness and overmuch tenderness she were not able to bear up her own body.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the other maid followed her lady, bearing up her train flowing on the ground.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But she with a rosy colour in her face, and with gracious and bright eyes hid a mind full of anguish, and exceeding great fear.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>So going in she passed through all doors in order, and stood before the king, where he sat upon his royal throne, clothed with his royal robes, and glittering with gold, and precious stones, and he was terrible to behold.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when he had lifted up his countenance, and with burning eyes had shewn the wrath of his heart, the queen sunk down, and her colour turned pale, and she rested her weary head upon her handmaid.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And God changed the king’s spirit into mildness, and all in haste and in fear he leaped from his throne, and holding her up in his arms, till she came to herself, caressed her with these words:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>What is the matter, Esther? I am thy brother, fear not.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt not die: for this law is not made for thee, but for all others.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Come near then, and touch the sceptre.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And as she held her peace, he took the golden sceptre, and laid it upon her neck, and kissed her, and said: Why dost thou not speak to me?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>She answered: I saw thee, my lord, as an angel of God, and my heart was troubled for fear of thy majesty.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For thou, my lord, art very admirable, and thy face is full of graces.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And while she was speaking, she fell down again, and was almost in a swoon.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But the king was troubled, and all his servants comforted her.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et mandavit ei (haud dubium quin esset Mardochæus) ut ingrederetur ad regem, et rogaret pro populo suo et pro patria sua.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Memorare, inquit, dierum humilitatis tuæ, quomodo nutrita sis in manu mea, quia Aman secundus a rege locutus est contra nos in mortem :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et tu invoca Dominum, et loquere regi pro nobis, et libera nos de morte.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Die autem tertio deposuit vestimenta ornatus sui, et circumdata est gloria sua.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cumque regio fulgeret habitu, et invocasset omnium rectorem et salvatorem Deum, assumpsit duas famulas,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et super unam quidem innitebatur, quasi præ deliciis et nimia teneritudine corpus suum ferre non sustinens :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>altera autem famularum sequebatur dominam, defluentia in humum indumenta sustentans.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ipsa autem roseo colore vultum perfusa, et gratis ac nitentibus oculis, tristem celabat animum, et nimio timore contractum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ingressa igitur cuncta per ordinem ostia, stetit contra regem, ubi ille residebat super solium regni sui, indutus vestibus regiis, auroque fulgens, et pretiosis lapidibus : eratque terribilis aspectu.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque elevasset faciem, et ardentibus oculis furorem pectoris indicasset, regina corruit, et in pallorem colore mutato, lassum super ancillulam reclinavit caput.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Convertitque Deus spiritum regis in mansuetudinem, et festinus ac metuens exilivit de solio, et sustentans eam ulnis suis donec rediret ad se, his verbis blandiebatur :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quid habes, Esther ? ego sum frater tuus : noli metuere.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non morieris : non enim pro te, sed pro omnibus hæc lex constituta est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Accede igitur, et tange sceptrum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cumque illa reticeret, tulit auream virgam, et posuit super collum ejus, et osculatus est eam, et ait : Cur mihi non loqueris ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quæ respondit : Vidi te, domine, quasi angelum Dei, et conturbatum est cor meum præ timore gloriæ tuæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Valde enim mirabilis es, domine, et facies tua plena est gratiarum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cumque loqueretur, rursus corruit, et pene exanimata est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Rex autem turbabatur, et omnes ministri ejus consolabantur eam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase trac d on the third day she laid away the garments she wore, and put on her glorious apparel.\"},{\"verse\":5,\"text\":\"And glittering in royal robes, after she had called upon God the ruler and Saviour of all, she took two maids with her,\"},{\"verse\":6,\"text\":\"And upon one of them she leaned, as if for delicateness and overmuch tenderness she were not able to bear up her own body.\"},{\"verse\":7,\"text\":\"And the other maid followed her lady, bearing up her train flowing on the ground.\"},{\"verse\":8,\"text\":\"But she with a rosy colour in her face, and with gracious and bright eyes hid a mind full of anguish, and exceeding great fear.\"},{\"verse\":9,\"text\":\"So going in she passed through all doors in order, and stood before the king, where he sat upon his royal throne, clothed with his royal robes, and glittering with gold, and precious stones, and he was terrible to behold.\"},{\"verse\":10,\"text\":\"And when he had lifted up his countenance, and with burning eyes had shewn the wrath of his heart, the queen sunk down, and her colour turned pale, and she rested her weary head upon her handmaid.\"},{\"verse\":11,\"text\":\"And God changed the king’s spirit into mildness, and all in haste and in fear he leaped from his throne, and holding her up in his arms, till she came to herself, caressed her with these words:\"},{\"verse\":12,\"text\":\"What is the matter, Esther? I am thy brother, fear not.\"},{\"verse\":13,\"text\":\"Thou shalt not die: for this law is not made for thee, but for all others.\"},{\"verse\":14,\"text\":\"Come near then, and touch the sceptre.\"},{\"verse\":15,\"text\":\"And as she held her peace, he took the golden sceptre, and laid it upon her neck, and kissed her, and said: Why dost thou not speak to me?\"},{\"verse\":16,\"text\":\"She answered: I saw thee, my lord, as an angel of God, and my heart was troubled for fear of thy majesty.\"},{\"verse\":17,\"text\":\"For thou, my lord, art very admirable, and thy face is full of graces.\"},{\"verse\":18,\"text\":\"And while she was speaking, she fell down again, and was almost in a swoon.\"},{\"verse\":19,\"text\":\"But the king was troubled, and all his servants comforted her.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et mandavit ei (haud dubium quin esset Mardochæus) ut ingrederetur ad regem, et rogaret pro populo suo et pro patria sua.\"},{\"verse\":2,\"text\":\"Memorare, inquit, dierum humilitatis tuæ, quomodo nutrita sis in manu mea, quia Aman secundus a rege locutus est contra nos in mortem :\"},{\"verse\":3,\"text\":\"et tu invoca Dominum, et loquere regi pro nobis, et libera nos de morte.\"},{\"verse\":4,\"text\":\"Die autem tertio deposuit vestimenta ornatus sui, et circumdata est gloria sua.\"},{\"verse\":5,\"text\":\"Cumque regio fulgeret habitu, et invocasset omnium rectorem et salvatorem Deum, assumpsit duas famulas,\"},{\"verse\":6,\"text\":\"et super unam quidem innitebatur, quasi præ deliciis et nimia teneritudine corpus suum ferre non sustinens :\"},{\"verse\":7,\"text\":\"altera autem famularum sequebatur dominam, defluentia in humum indumenta sustentans.\"},{\"verse\":8,\"text\":\"Ipsa autem roseo colore vultum perfusa, et gratis ac nitentibus oculis, tristem celabat animum, et nimio timore contractum.\"},{\"verse\":9,\"text\":\"Ingressa igitur cuncta per ordinem ostia, stetit contra regem, ubi ille residebat super solium regni sui, indutus vestibus regiis, auroque fulgens, et pretiosis lapidibus : eratque terribilis aspectu.\"},{\"verse\":10,\"text\":\"Cumque elevasset faciem, et ardentibus oculis furorem pectoris indicasset, regina corruit, et in pallorem colore mutato, lassum super ancillulam reclinavit caput.\"},{\"verse\":11,\"text\":\"Convertitque Deus spiritum regis in mansuetudinem, et festinus ac metuens exilivit de solio, et sustentans eam ulnis suis donec rediret ad se, his verbis blandiebatur :\"},{\"verse\":12,\"text\":\"Quid habes, Esther ? ego sum frater tuus : noli metuere.\"},{\"verse\":13,\"text\":\"Non morieris : non enim pro te, sed pro omnibus hæc lex constituta est.\"},{\"verse\":14,\"text\":\"Accede igitur, et tange sceptrum.\"},{\"verse\":15,\"text\":\"Cumque illa reticeret, tulit auream virgam, et posuit super collum ejus, et osculatus est eam, et ait : Cur mihi non loqueris ?\"},{\"verse\":16,\"text\":\"Quæ respondit : Vidi te, domine, quasi angelum Dei, et conturbatum est cor meum præ timore gloriæ tuæ.\"},{\"verse\":17,\"text\":\"Valde enim mirabilis es, domine, et facies tua plena est gratiarum.\"},{\"verse\":18,\"text\":\"Cumque loqueretur, rursus corruit, et pene exanimata est.\"},{\"verse\":19,\"text\":\"Rex autem turbabatur, et omnes ministri ejus consolabantur eam.\"}],\"summary\":\"Esther comes into the king’s presence: she is terrified, but God turns his heart.\",\"intro\":null,\"prev\":{\"usfm\":\"EST\",\"chapter\":14,\"label\":\"Esther 14\"},\"next\":{\"usfm\":\"EST\",\"chapter\":16,\"label\":\"Esther 16\"}}]]\n"])</script></body></html>
