[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Esther<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EST/">About <!-- -->Esther</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The prayer of Esther for herself and her people.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Queen Esther also, fearing the danger that was at hand, had recourse to the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when she had laid away her royal apparel, she put on garments suitable for weeping and mourning: instead of divers precious ointments, she covered her head with ashes and dung, and she humbled her body with fasts: and all the places in which before she was accustomed to rejoice, she filled with her torn hair.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And she prayed to the Lord the God of Israel, saying: O my Lord, who alone art our king, help me a desolate woman, and who have no other helper but thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>My danger is in my hands.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I have heard of my father that thou, O Lord, didst take Israel from among all nations, and our fathers from all their predecessors, to possess them as an everlasting inheritance, and thou hast done to them as thou hast promised.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>We have sinned in thy sight, and therefore thou hast delivered us into the hands of our enemies:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For we have worshipped their gods. Thou art just, O Lord.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And now they are not content to oppress us with most hard bondage, but attributing the strength of their hands to the power of their idols.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They design to change thy promises, and destroy thy inheritance, and shut the mouths of them that praise thee, and extinguish the glory of thy temple and altar,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>That they may open the mouths of Gentiles, and praise the strength of idols, and magnify for ever a carnal king.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Give not, O Lord, thy sceptre to them that are not, lest they laugh at our ruin: but turn their counsel upon themselves, and destroy him that hath begun to rage against us.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Remember, O Lord, and shew thyself to us in the time of our tribulation, and give me boldness, O Lord, king of gods, and of all power:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Give me a well ordered speech in my mouth in the presence of the lion, and turn his heart to the hatred of our enemy, that both he himself may perish, and the rest that consent to him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But deliver us by thy hand, and help me, who have no other helper, but thee, O Lord, who hast the knowledge of all things.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou knowest that I hate the glory of the wicked, and abhor the bed of the uncircumcised, and of every stranger.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou knowest my necessity, that I abominate the sign of my pride and glory, which is upon my head in the days of my public appearance, and detest it as a menstruous rag, and wear it not in the days of my silence,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And that I have not eaten at Aman’s table, nor hath the king’s banquet pleased me, and that I have not drunk the wine of the drink offerings:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And that thy handmaid hath never rejoiced, since I was brought hither unto this day but in thee, O Lord, the God of Abraham.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>O God, who art mighty above all, hear the voice of them, that have no other hope, and deliver us from the hand of the wicked, and deliver me from my fear.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Esther quoque regina confugit ad Dominum, pavens periculum quod imminebat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cumque deposuisset vestes regias, fletibus et luctui apta indumenta suscepit, et pro unguentis variis, cinere et stercore implevit caput, et corpus suum humiliavit jejuniis : omniaque loca, in quibus antea lætari consueverat, crinium laceratione complevit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et deprecabatur Dominum Deum Israël, dicens : Domine mi, qui rex noster es solus, adjuva me solitariam, et cujus præter te nullus est auxiliator alius.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Periculum meum in manibus meis est.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Audivi a patre meo quod tu, Domine, tulisses Israël de cunctis gentibus, et patres nostros ex omnibus retro majoribus suis, ut possideres hæreditatem sempiternam, fecistique eis sicut locutus es.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Peccavimus in conspectu tuo, et idcirco tradidisti nos in manus inimicorum nostrorum :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>coluimus enim deos eorum. Justus es Domine :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et nunc non eis sufficit, quod durissima nos opprimunt servitute, sed robur manuum suarum, idolorum potentiæ deputantes,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>volunt tua mutare promissa, et delere hæreditatem tuam, et claudere ora laudantium te, atque extinguere gloriam templi et altaris tui,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ut aperiant ora gentium, et laudent idolorum fortitudinem, et prædicent carnalem regem in sempiternum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ne tradas, Domine, sceptrum tuum his, qui non sunt, ne rideant ad ruinam nostram : sed converte consilium eorum super eos, et eum qui in nos cœpit sævire, disperde.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Memento, Domine, et ostende te nobis in tempore tribulationis nostræ, et da mihi fiduciam, Domine rex deorum, et universæ potestatis :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>tribue sermonem compositum in ore meo in conspectu leonis, et transfer cor illius in odium hostis nostri, ut et ipse pereat, et ceteri qui ei consentiunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nos autem libera manu tua, et adjuva me, nullum aliud auxilium habentem nisi te, Domine, qui habes omnium scientiam,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et nosti quia oderim gloriam iniquorum, et detester cubile incircumcisorum, et omnis alienigenæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tu scis necessitatem meam, quod abominer signum superbiæ et gloriæ meæ, quod est super caput meum in diebus ostentationis meæ, et detester illud quasi pannum menstruatæ, et non portem in diebus silentii mei,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et quod non comederim in mensa Aman, nec mihi placuerit convivium regis, et non biberim vinum libaminum :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et numquam lætata sit ancilla tua, ex quo huc translata sum usque in præsentem diem, nisi in te, Domine Deus Abraham.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Deus fortis super omnes, exaudi vocem eorum qui nullam aliam spem habent, et libera nos de manu iniquorum, et erue me a timore meo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Esther 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Esther 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-h ast done to them as thou hast promised.\"},{\"verse\":6,\"text\":\"We have sinned in thy sight, and therefore thou hast delivered us into the hands of our enemies:\"},{\"verse\":7,\"text\":\"For we have worshipped their gods. Thou art just, O Lord.\"},{\"verse\":8,\"text\":\"And now they are not content to oppress us with most hard bondage, but attributing the strength of their hands to the power of their idols.\"},{\"verse\":9,\"text\":\"They design to change thy promises, and destroy thy inheritance, and shut the mouths of them that praise thee, and extinguish the glory of thy temple and altar,\"},{\"verse\":10,\"text\":\"That they may open the mouths of Gentiles, and praise the strength of idols, and magnify for ever a carnal king.\"},{\"verse\":11,\"text\":\"Give not, O Lord, thy sceptre to them that are not, lest they laugh at our ruin: but turn their counsel upon themselves, and destroy him that hath begun to rage against us.\"},{\"verse\":12,\"text\":\"Remember, O Lord, and shew thyself to us in the time of our tribulation, and give me boldness, O Lord, king of gods, and of all power:\"},{\"verse\":13,\"text\":\"Give me a well ordered speech in my mouth in the presence of the lion, and turn his heart to the hatred of our enemy, that both he himself may perish, and the rest that consent to him.\"},{\"verse\":14,\"text\":\"But deliver us by thy hand, and help me, who have no other helper, but thee, O Lord, who hast the knowledge of all things.\"},{\"verse\":15,\"text\":\"And thou knowest that I hate the glory of the wicked, and abhor the bed of the uncircumcised, and of every stranger.\"},{\"verse\":16,\"text\":\"Thou knowest my necessity, that I abominate the sign of my pride and glory, which is upon my head in the days of my public appearance, and detest it as a menstruous rag, and wear it not in the days of my silence,\"},{\"verse\":17,\"text\":\"And that I have not eaten at Aman’s table, nor hath the king’s banquet pleased me, and that I have not drunk the wine of the drink offerings:\"},{\"verse\":18,\"text\":\"And that thy handmaid hath never rejoiced, since I was brought hither unto this day but in thee, O Lord, the God of Abraham.\"},{\"verse\":19,\"text\":\"O God, who art mighty above all, hear the voice of them, that have no other hope, and deliver us from the hand of the wicked, and deliver me from my fear.\"}],\"vul\":[{\"verse\":1,\"text\":\"Esther quoque regina confugit ad Dominum, pavens periculum quod imminebat.\"},{\"verse\":2,\"text\":\"Cumque deposuisset vestes regias, fletibus et luctui apta indumenta suscepit, et pro unguentis variis, cinere et stercore implevit caput, et corpus suum humiliavit jejuniis : omniaque loca, in quibus antea lætari consueverat, crinium laceratione complevit.\"},{\"verse\":3,\"text\":\"Et deprecabatur Dominum Deum Israël, dicens : Domine mi, qui rex noster es solus, adjuva me solitariam, et cujus præter te nullus est auxiliator alius.\"},{\"verse\":4,\"text\":\"Periculum meum in manibus meis est.\"},{\"verse\":5,\"text\":\"Audivi a patre meo quod tu, Domine, tulisses Israël de cunctis gentibus, et patres nostros ex omnibus retro majoribus suis, ut possideres hæreditatem sempiternam, fecistique eis sicut locutus es.\"},{\"verse\":6,\"text\":\"Peccavimus in conspectu tuo, et idcirco tradidisti nos in manus inimicorum nostrorum :\"},{\"verse\":7,\"text\":\"coluimus enim deos eorum. Justus es Domine :\"},{\"verse\":8,\"text\":\"et nunc non eis sufficit, quod durissima nos opprimunt servitute, sed robur manuum suarum, idolorum potentiæ deputantes,\"},{\"verse\":9,\"text\":\"volunt tua mutare promissa, et delere hæreditatem tuam, et claudere ora laudantium te, atque extinguere gloriam templi et altaris tui,\"},{\"verse\":10,\"text\":\"ut aperiant ora gentium, et laudent idolorum fortitudinem, et prædicent carnalem regem in sempiternum.\"},{\"verse\":11,\"text\":\"Ne tradas, Domine, sceptrum tuum his, qui non sunt, ne rideant ad ruinam nostram : sed converte consilium eorum super eos, et eum qui in nos cœpit sævire, disperde.\"},{\"verse\":12,\"text\":\"Memento, Domine, et ostende te nobis in tempore tribulationis nostræ, et da mihi fiduciam, Domine rex deorum, et universæ potestatis :\"},{\"verse\":13,\"text\":\"tribue sermonem compositum in ore meo in conspectu leonis, et transfer cor illius in odium hostis nostri, ut et ipse pereat, et ceteri qui ei consentiunt.\"},{\"verse\":14,\"text\":\"Nos autem libera manu tua, et adjuva me, nullum aliud auxilium habentem nisi te, Domine, qui habes omnium scientiam,\"},{\"verse\":15,\"text\":\"et nosti quia oderim gloriam iniquorum, et detester cubile incircumcisorum, et omnis alienigenæ.\"},{\"verse\":16,\"text\":\"Tu scis necessitatem meam, quod abominer signum superbiæ et gloriæ meæ, quod est super caput meum in diebus ostentationis meæ, et detester illud quasi pannum menstruatæ, et non portem in diebus silentii mei,\"},{\"verse\":17,\"text\":\"et quod non comederim in mensa Aman, nec mihi placuerit convivium regis, et non biberim vinum libaminum :\"},{\"verse\":18,\"text\":\"et numquam lætata sit ancilla tua, ex quo huc translata sum usque in præsentem diem, nisi in te, Domine Deus Abraham.\"},{\"verse\":19,\"text\":\"Deus fortis super omnes, exaudi vocem eorum qui nullam aliam spem habent, et libera nos de manu iniquorum, et erue me a timore meo.\"}],\"summary\":\"The prayer of Esther for herself and her people.\",\"intro\":null,\"prev\":{\"usfm\":\"EST\",\"chapter\":13,\"label\":\"Esther 13\"},\"next\":{\"usfm\":\"EST\",\"chapter\":15,\"label\":\"Esther 15\"}}]]\n"])</script></body></html>
