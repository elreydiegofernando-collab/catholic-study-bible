ly-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And this was the copy of the letter: Artaxerxes the great king who reigneth from India to Ethiopia, to the princes and governors of the hundred and twenty-seven provinces, that are subject to his empire, greeting.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Whereas I reigned over many nations, and had brought all the world under my dominion, I was not willing to abuse the greatness of my power, but to govern my subjects with clemency and that they might live quietly without any terror, and might enjoy peace, which is desired by all men,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But when I asked my counsellors how this might be accomplished, one that excelled the rest in wisdom and fidelity, and was second after the king, Aman by name,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Told me that there was a people scattered through the whole world, which used new laws, and acted against the customs of all nations, despised the commandments of kings, and violated by their opposition the concord of all nations.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Wherefore having learned this, and seeing one nation in opposition to all mankind using perverse laws, and going against our commandments, and disturbing the peace and concord of the provinces subject to us,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>We have commanded that all whom Aman shall mark out, who is chief over all the provinces, and second after the king, and whom we honour as a father, shall be utterly destroyed by their enemies, with their wives and children, and that none shall have pity on them, on the fourteenth day of the twelfth month Adar of this present year:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That these wicked men going down to hell in one day, may restore to our empire the peace which they had disturbed.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But Mardochai besought the Lord, remembering all his works,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And said: O Lord, Lord, almighty king, for all things are in thy power, and there is none that can resist thy will, if thou determine to save Israel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou hast made heaven and earth and all things that are under the cope of heaven.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou art Lord of all, and there is none that can resist thy majesty.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou knowest all things, and thou knowest that it was not out of pride and or any desire of glory, that I refused to worship the proud Aman,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>(For I would willingly and readily for the salvation of Israel have kissed even the steps of his feet,)</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I feared lest I should transfer the honour of my God to a man, and lest I should adore any one except my God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And now, O Lord, O king, O God of Abraham, have mercy on thy people, because our enemies resolve to destroy us, and extinguish thy inheritance.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Despise not thy portion, which thou hast redeemed for thyself out of Egypt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hear my supplication, and be merciful to thy lot and inheritance, and turn our mourning into joy, that we may live and praise thy name, O Lord, and shut not the mouths of them that sing to thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all Israel with like mind and supplication cried to the Lord, because they saw certain death hanging over their heads.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Rex maximus Artaxerxes ab India usque Æthiopiam, centum viginti septem provinciarum principibus et ducibus qui ejus imperio subjecti sunt, salutem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cum plurimis gentibus imperarem, et universum orbem meæ ditioni subjugassem, volui nequaquam abuti potentiæ magnitudine, sed clementia et lenitate gubernare subjectos, ut absque ullo terrore vitam silentio transigentes, optata cunctis mortalibus pace fruerentur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quærente autem me a consiliariis meis quomodo posset hoc impleri, unus qui sapientia et fide ceteros præcellebat, et erat post regem secundus, Aman nomine,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>indicavit mihi in toto orbe terrarum populum esse dispersum, qui novis uteretur legibus, et, contra omnium gentium consuetudinem faciens, regum jussa contemneret, et universarum concordiam nationum sua dissensione violaret.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quod cum didicissemus, videntes unam gentem rebellem adversus omne hominum genus perversis uti legibus, nostrisque jussionibus contraire, et turbare subjectarum nobis provinciarum pacem atque concordiam,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>jussimus ut quoscumque Aman, qui omnibus provinciis præpositus est et secundus a rege, et quem patris loco colimus, monstraverit, cum conjugibus ac liberis deleantur ab inimicis suis, nullusque eorum misereatur, quartadecima die duodecimi mensis Adar anni præsentis :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ut nefarii homines uno die ad inferos descendentes, reddant imperio nostro pacem, quam turbaverant. Pergensque Mardochæus, fecit omnia quæ ei mandaverat Esther.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Mardochæus autem deprecatus est Dominum, memor omnium operum ejus,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et dixit : Domine, Domine rex omnipotens, in ditione enim tua cuncta sunt posita, et non est qui possit tuæ resistere voluntati, si decreveris salvare Israël.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Tu fecisti cælum et terram, et quidquid cæli ambitu continetur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Dominus omnium es, nec est qui resistat majestati tuæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cuncta nosti, et scis quia non pro superbia et contumelia, et aliqua gloriæ cupiditate, fecerim hoc, ut non adorarem Aman superbissimum</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>(libenter enim pro salute Israël etiam vestigia pedum ejus deosculari paratus essem),</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>sed timui ne honorem Dei mei transferrem ad hominem, et ne quemquam adorarem, excepto Deo meo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et nunc, Domine rex, Deus Abraham, miserere populi tui, quia volunt nos inimici nostri perdere, et hæreditatem tuam delere.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ne despicias partem tuam, quam redemisti tibi de Ægypto.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Exaudi deprecationem meam, et propitius esto sorti et funiculo tuo, et converte luctum nostrum in gaudium, ut viventes laudemus nomen tuum, Domine : et ne claudas ora te canentium.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omnis quoque Israël pari mente et obsecratione clamavit ad Dominum, eo quod eis certa mors impenderet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Esther 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Esther 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=" customs of all nations, despised the commandments of kings, and violated by their opposition the concord of all nations.\"},{\"verse\":5,\"text\":\"Wherefore having learned this, and seeing one nation in opposition to all mankind using perverse laws, and going against our commandments, and disturbing the peace and concord of the provinces subject to us,\"},{\"verse\":6,\"text\":\"We have commanded that all whom Aman shall mark out, who is chief over all the provinces, and second after the king, and whom we honour as a father, shall be utterly destroyed by their enemies, with their wives and children, and that none shall have pity on them, on the fourteenth day of the twelfth month Adar of this present year:\"},{\"verse\":7,\"text\":\"That these wicked men going down to hell in one day, may restore to our empire the peace which they had disturbed.\"},{\"verse\":8,\"text\":\"But Mardochai besought the Lord, remembering all his works,\"},{\"verse\":9,\"text\":\"And said: O Lord, Lord, almighty king, for all things are in thy power, and there is none that can resist thy will, if thou determine to save Israel.\"},{\"verse\":10,\"text\":\"Thou hast made heaven and earth and all things that are under the cope of heaven.\"},{\"verse\":11,\"text\":\"Thou art Lord of all, and there is none that can resist thy majesty.\"},{\"verse\":12,\"text\":\"Thou knowest all things, and thou knowest that it was not out of pride and or any desire of glory, that I refused to worship the proud Aman,\"},{\"verse\":13,\"text\":\"(For I would willingly and readily for the salvation of Israel have kissed even the steps of his feet,)\"},{\"verse\":14,\"text\":\"But I feared lest I should transfer the honour of my God to a man, and lest I should adore any one except my God.\"},{\"verse\":15,\"text\":\"And now, O Lord, O king, O God of Abraham, have mercy on thy people, because our enemies resolve to destroy us, and extinguish thy inheritance.\"},{\"verse\":16,\"text\":\"Despise not thy portion, which thou hast redeemed for thyself out of Egypt.\"},{\"verse\":17,\"text\":\"Hear my supplication, and be merciful to thy lot and inheritance, and turn our mourning into joy, that we may live and praise thy name, O Lord, and shut not the mouths of them that sing to thee.\"},{\"verse\":18,\"text\":\"And all Israel with like mind and supplication cried to the Lord, because they saw certain death hanging over their heads.\"}],\"vul\":[{\"verse\":1,\"text\":\"Rex maximus Artaxerxes ab India usque Æthiopiam, centum viginti septem provinciarum principibus et ducibus qui ejus imperio subjecti sunt, salutem.\"},{\"verse\":2,\"text\":\"Cum plurimis gentibus imperarem, et universum orbem meæ ditioni subjugassem, volui nequaquam abuti potentiæ magnitudine, sed clementia et lenitate gubernare subjectos, ut absque ullo terrore vitam silentio transigentes, optata cunctis mortalibus pace fruerentur.\"},{\"verse\":3,\"text\":\"Quærente autem me a consiliariis meis quomodo posset hoc impleri, unus qui sapientia et fide ceteros præcellebat, et erat post regem secundus, Aman nomine,\"},{\"verse\":4,\"text\":\"indicavit mihi in toto orbe terrarum populum esse dispersum, qui novis uteretur legibus, et, contra omnium gentium consuetudinem faciens, regum jussa contemneret, et universarum concordiam nationum sua dissensione violaret.\"},{\"verse\":5,\"text\":\"Quod cum didicissemus, videntes unam gentem rebellem adversus omne hominum genus perversis uti legibus, nostrisque jussionibus contraire, et turbare subjectarum nobis provinciarum pacem atque concordiam,\"},{\"verse\":6,\"text\":\"jussimus ut quoscumque Aman, qui omnibus provinciis præpositus est et secundus a rege, et quem patris loco colimus, monstraverit, cum conjugibus ac liberis deleantur ab inimicis suis, nullusque eorum misereatur, quartadecima die duodecimi mensis Adar anni præsentis :\"},{\"verse\":7,\"text\":\"ut nefarii homines uno die ad inferos descendentes, reddant imperio nostro pacem, quam turbaverant. Pergensque Mardochæus, fecit omnia quæ ei mandaverat Esther.\"},{\"verse\":8,\"text\":\"Mardochæus autem deprecatus est Dominum, memor omnium operum ejus,\"},{\"verse\":9,\"text\":\"et dixit : Domine, Domine rex omnipotens, in ditione enim tua cuncta sunt posita, et non est qui possit tuæ resistere voluntati, si decreveris salvare Israël.\"},{\"verse\":10,\"text\":\"Tu fecisti cælum et terram, et quidquid cæli ambitu continetur.\"},{\"verse\":11,\"text\":\"Dominus omnium es, nec est qui resistat majestati tuæ.\"},{\"verse\":12,\"text\":\"Cuncta nosti, et scis quia non pro superbia et contumelia, et aliqua gloriæ cupiditate, fecerim hoc, ut non adorarem Aman superbissimum\"},{\"verse\":13,\"text\":\"(libenter enim pro salute Israël etiam vestigia pedum ejus deosculari paratus essem),\"},{\"verse\":14,\"text\":\"sed timui ne honorem Dei mei transferrem ad hominem, et ne quemquam adorarem, excepto Deo meo.\"},{\"verse\":15,\"text\":\"Et nunc, Domine rex, Deus Abraham, miserere populi tui, quia volunt nos inimici nostri perdere, et hæreditatem tuam delere.\"},{\"verse\":16,\"text\":\"Ne despicias partem tuam, quam redemisti tibi de Ægypto.\"},{\"verse\":17,\"text\":\"Exaudi deprecationem meam, et propitius esto sorti et funiculo tuo, et converte luctum nostrum in gaudium, ut viventes laudemus nomen tuum, Domine : et ne claudas ora te canentium.\"},{\"verse\":18,\"text\":\"Omnis quoque Israël pari mente et obsecratione clamavit ad Dominum, eo quod eis certa mors impenderet.\"}],\"summary\":\"A copy of a letter sent by Aman to destroy the Jews. Mardochai’s prayer for the people.\",\"intro\":null,\"prev\":{\"usfm\":\"EST\",\"chapter\":12,\"label\":\"Esther 12\"},\"next\":{\"usfm\":\"EST\",\"chapter\":14,\"label\":\"Esther 14\"}}]]\n"])</script></body></html>
