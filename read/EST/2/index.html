1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Esther<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EST/">About <!-- -->Esther</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Esther is advanced to be queen. Mardochai detecteth a plot against the king.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After this, when the wrath of king Assuerus was appeased, he remembered Vasthi, and what she had done and what she had suffered:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the king’s servants and his officers said: Let young women be sought for the king, virgins and beautiful,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And let some persons be sent through all the provinces to look for beautiful maidens and virgins: and let them bring them to the city of Susan, and put them into the house of the women under the hand of Egeus the eunuch, who is the overseer and keeper of the king’s women: and let them receive women’s ornaments, and other things necessary for their use.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And whosoever among them all shall please the king’s eyes, let her be queen instead of Vasthi. The word pleased the king: and he commanded it should be done as they had suggested.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>There was a man in the city of Susan, a Jew, named Mardochai, the son of Jair, the son of Semei, the son of Cis, of the race of Jemini,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Who had been carried away from Jerusalem at the time that Nabuchodonosor king of Babylon carried away Jechonias king of Juda,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he had brought up his brother’s daughter Edissa, who by another name was called Esther: now she had lost both her parents: and was exceeding fair and beautiful. And her father and mother being dead, Mardochai adopted her for his daughter.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the king’s ordinance was noised abroad, and according to his commandment many beautiful virgins were brought to Susan, and were delivered to Egeus the eunuch: Esther also among the rest of the maidens was delivered to him to be kept in the number of the women.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And she pleased him, and found favour in his sight. And he commanded the eunuch to hasten the women’s ornaments, and to deliver to her her part, and seven of the most beautiful maidens of the king’s house, and to adorn and deck out both her and her waiting maids.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And she would not tell him her people nor her country. For Mardochai had charged her to say nothing at all of that:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he walked every day before the court of the house, in which the chosen virgins were kept, having a care for Esther’s welfare, and desiring to know what would befall her.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now when every virgin’s turn came to go in to the king, after all had been done for setting them off to advantage, it was the twelfth month: so that for six months they were anointed with oil of myrrh, and for other six months they used certain perfumes and sweet spices.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when they were going in to the king, whatsoever they asked to adorn themselves they received: and being decked out, as it pleased them, they passed from the chamber of the women to the king’s chamber.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And she that went in at evening, came out in the morning, and from thence she was conducted to the second house, that was under the hand of Susagaz the eunuch, who had the charge over the king’s concubines: neither could she return any more to the king, unless the king desired it, and had ordered her by name to come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And as the time came orderly about, the day was at hand, when Esther, the daughter of Abihail the brother of Mardochai, whom he had adopted for his daughter, was to go in to the king. But she sought not women’s ornaments, but whatsoever Egeus the eunuch the keeper of the virgins had a mind, he gave her to adorn her. For she was exceeding fair, and her incredible beauty made her appear agreeable and amiable in the eyes of all.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So she was brought to the chamber of king Assuerus the tenth month, which is called Tebeth, in the seventh year of his reign.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the king loved her more than all the women, and she had favour and kindness before him above all the women, and he set the royal crown on her head, and made her queen instead of Vasthi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he commanded a magnificent feast to be prepared for all the princes, and for his servants, for the marriage and wedding of Esther, And he gave rest to all the provinces, and bestowed gifts according to princely magnificence.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And when the virgins were sought the second time, and gathered together, Mardochai stayed at the king’s gate,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Neither had Esther as yet declared her country and people, according to his commandment. For whatsoever he commanded, Esther observed: and she did all things in the same manner as she was wont at that time when he brought her up a little one.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At that time, therefore, when Mardochai abode at the king’s gate, Bagathan and Thares, two of the king’s eunuchs, who were porters, and presided in the first entry of the palace, were angry: and they designed to rise up against the king, and to kill him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Mardochai had notice of it, and immediately he told it to queen Esther: and she to the king in Mardochai’s name, who had reported the thing unto her.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>It was inquired into, and found out: and they were both hanged on a gibbet. And it was put in the histories, and recorded in the chronicles before the king.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>His ita gestis, postquam regis Assueri indignatio deferbuerat, recordatus est Vasthi, et quæ fecisset, vel quæ passa esset :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>dixeruntque pueri regis ac ministri ejus : Quærantur regi puellæ virgines ac speciosæ,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et mittantur qui considerent per universas provincias puellas speciosas et virgines : et adducant eas ad civitatem Susan, et tradant eas in domum feminarum sub manu Egei eunuchi, qui est præpositus et custos mulierum regiarum : et accipiant mundum muliebrem, et cetera ad usus necessaria.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et quæcumque inter omnes oculis regis placuerit, ipsa regnet pro Vasthi. Placuit sermo regi : et ita, ut suggesserant, jussit fieri.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Erat vir Judæus in Susan civitate, vocabulo Mardochæus filius Jair, filii Semei, filii Cis, de stirpe Jemini,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>qui translatus fuerat de Jerusalem eo tempore quo Jechoniam regem Juda Nabuchodonosor rex Babylonis transtulerat,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>qui fuit nutritius filiæ fratris sui Edissæ, quæ altero nomine vocabatur Esther, et utrumque parentem amiserat : pulchra nimis, et decora facie. Mortuisque patre ejus ac matre, Mardochæus sibi eam adoptavit in filiam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cumque percrebruisset regis imperium, et juxta mandatum illius multæ pulchræ virgines adducerentur Susan, et Egeo traderentur eunucho, Esther quoque inter ceteras puellas ei tradita est, ut servaretur in numero feminarum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quæ placuit ei, et invenit gratiam in conspectu illius. Et præcepit eunucho, ut acceleraret mundum muliebrem, et traderet ei partes suas, et septem puellas speciosissimas de domo regis, et tam ipsam quam pedissequas ejus ornaret atque excoleret.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quæ noluit indicare ei populum et patriam suam : Mardochæus enim præceperat ei, ut de hac re omnino reticeret :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>qui deambulabat quotidie ante vestibulum domus, in qua electæ virgines servabantur, curam agens salutis Esther, et scire volens quid ei accideret.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum autem venisset tempus singularum per ordinem puellarum ut intrarent ad regem, expletis omnibus quæ ad cultum muliebrem pertinebant, mensis duodecimus vertebatur : ita dumtaxat, ut sex mensibus oleo ungerentur myrrhino, et aliis sex quibusdam pigmentis et aromatibus uterentur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ingredientesque ad regem, quidquid postulassent ad ornatum pertinens, accipiebant : et ut eis placuerat, compositæ de triclinio feminarum ad regis cubiculum transibant.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et quæ intraverat vespere, egrediebatur mane, atque inde in secundas ædes deducebatur, quæ sub manu Susagazi eunuchi erant, qui concubinis regis præsidebat : nec habebat potestatem ad regem ultra redeundi, nisi voluisset rex, et eam venire jussisset ex nomine.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Evoluto autem tempore per ordinem, instabat dies quo Esther filia Abihail fratris Mardochæi, quam sibi adoptaverat in filiam, deberet intrare ad regem. Quæ non quæsivit muliebrem cultum, sed quæcumque voluit Egeus eunuchus custos virginum, hæc ei ad ornatum dedit. Erat enim formosa valde, et incredibili pulchritudine : omnium oculis gratiosa et amabilis videbatur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ducta est itaque ad cubiculum regis Assueri mense decimo, qui vocatur Tebeth, septimo anno regni ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et adamavit eam rex plus quam omnes mulieres, habuitque gratiam et misericordiam coram eo super omnes mulieres : et posuit diadema regni in capite ejus, fecitque eam regnare in loco Vasthi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et jussit convivium præparari permagnificum cunctis principibus et servis suis pro conjunctione et nuptiis Esther. Et dedit requiem universis provinciis, ac dona largitus est juxta magnificentiam principalem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cumque secundo quærerentur virgines et congregarentur, Mardochæus manebat ad januam regis :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>necdum prodiderat Esther patriam et populum suum, juxta mandatum ejus. Quidquid enim ille præcipiebat, observabat Esther : et ita cuncta faciebat ut eo tempore solita erat, quo eam parvulam nutriebat.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Eo igitur tempore, quo Mardochæus ad regis januam morabatur, irati sunt Bagathan et Thares duo eunuchi regis, qui janitores erant, et in primo palatii limine præsidebant : volueruntque insurgere in regem, et occidere eum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod Mardochæum non latuit, statimque nuntiavit reginæ Esther : et illa regi ex nomine Mardochæi, qui ad se rem detulerat.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quæsitum est, et inventum : et appensus est uterque eorum in patibulo. Mandatumque est historiis, et annalibus traditum coram rege.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Esther 1</sp meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"EST.2\",{\"bookId\":19,\"usfm\":\"EST\",\"bookName\":\"Esther\",\"drName\":\"Esther\",\"chapter\":2,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"After this, when the wrath of king Assuerus was appeased, he remembered Vasthi, and what she had done and what she had suffered:\"},{\"verse\":2,\"text\":\"And the king’s servants and his officers said: Let young women be sought for the king, virgins and beautiful,\"},{\"verse\":3,\"text\":\"And let some persons be sent through all the provinces to look for beautiful maidens and virgins: and let them bring them to the city of Susan, and put them into the house of the women under the hand of Egeus the eunuch, who is the overseer and keeper of the king’s women: and let them receive women’s ornaments, and other things necessary for their use.\"},{\"verse\":4,\"text\":\"And whosoever among them all shall please the king’s eyes, let her be queen instead of Vasthi. The word pleased the king: and he commanded it should be done as they had suggested.\"},{\"verse\":5,\"text\":\"There was a man in the city of Susan, a Jew, named Mardochai, the son of Jair, the son of Semei, the son of Cis, of the race of Jemini,\"},{\"verse\":6,\"text\":\"Who had been carried away from Jerusalem at the time that Nabuchodonosor king of Babylon carried away Jechonias king of Juda,\"},{\"verse\":7,\"text\":\"And he had brought up his brother’s daughter Edissa, who by another name was called Esther: now she had lost both her parents: and was exceeding fair and beautiful. And her father and mother being dead, Mardochai adopted her for his daughter.\"},{\"verse\":8,\"text\":\"And when the king’s ordinance was noised abroad, and according to his commandment many beautiful virgins were brought to Susan, and were delivered to Egeus the eunuch: Esther also among the rest of the maidens was delivered to him to be kept in the number of the women.\"},{\"verse\":9,\"text\":\"And she pleased him, and found favour in his sight. And he commanded the eunuch to hasten the women’s ornaments, and to deliver to her her part, and seven of the most beautiful maidens of the king’s house, and to adorn and deck out both her and her waiting maids.\"},{\"verse\":10,\"text\":\"And she would not tell him her people nor her country. For Mardochai had charged her to say nothing at all of that:\"},{\"verse\":11,\"text\":\"And he walked every day before the court of the house, in which the chosen virgins were kept, having a care for Esther’s welfare, and desiring to know what would befall her.\"},{\"verse\":12,\"text\":\"Now when every virgin’s turn came to go in to the king, after all had been done for setting them off to advantage, it was the twelfth month: so that for six months they were anointed with oil of myrrh, and for other six months they used certain perfumes and sweet spices.\"},{\"verse\":13,\"text\":\"And when they were going in to the king, whatsoever they asked to adorn themselves they received: and being decked out, as it pleased them, they passed from the chamber of the women to the king’s chamber.\"},{\"verse\":14,\"text\":\"And she that went in at evening, came out in the morning, and from thence she was conducted to the second house, that was under the hand of Susagaz the eunuch, who had the charge over the king’s concubines: neither could she return any more to the king, unless the king desired it, and had ordered her by name to come.\"},{\"verse\":15,\"text\":\"And as the time came orderly about, the day was at hand, when Esther, the daughter of Abihail the brother of Mardochai, whom he had adopted for his daughter, was to go in to the king. But she sought not women’s ornaments, but whatsoever Egeus the eunuch the keeper of the virgins had a mind, he gave her to adorn her. For she was exceeding fair, and her incredible beauty made her appear agreeable and amiable in the eyes of all.\"},{\"verse\":16,\"text\":\"So she was brought to the chamber of king Assuerus the tenth month, which is called Tebeth, in the seventh year of his reign.\"},{\"verse\":17,\"text\":\"And the king loved her more than all the women, and she had favour and kindness before him above all the women, and he set the royal crown on her head, and made her queen instead of Vasthi.\"},{\"verse\":18,\"text\":\"And he commanded a magnificent feast to be prepared for all the princes, and for his servants, for the marriage and wedding of Esther, And he gave rest to all the provinces, and bestowed gifts according to princely magnificence.\"},{\"verse\":19,\"text\":\"And when the virgins were sought the second time, and gathered together, Mardochai stayed at the king’s gate,\"},{\"verse\":20,\"text\":\"Neither had Esther as yet declared her country and people, according to his commandment. For whatsoever he commanded, Esther observed: and she did all things in the same manner as she was wont at that time when he brought her up a little one.\"},{\"verse\":21,\"text\":\"At that time, therefore, when Mardochai abode at the king’s gate, Bagathan and Thares, two of the king’s eunuchs, who were porters, and presided in the first entry of the palace, were angry: and they designed to rise up against the king, and to kill him.\"},{\"verse\":22,\"text\":\"And Mardochai had notice of it, and immediately he told it to queen Esther: and she to the king in Mardochai’s name, who had reported the thing unto her.\"},{\"verse\":23,\"text\":\"It was inquired into, and found out: and they were both hanged on a gibbet. And it was put in the histories, and recorded in the chronicles before the king.\"}],\"vul\":[{\"verse\":1,\"text\":\"His ita gestis, postquam regis Assueri indignatio deferbuerat, recordatus est Vasthi, et quæ fecisset, vel quæ passa esset :\"},{\"verse\":2,\"text\":\"dixeruntque pueri regis ac ministri ejus : Quærantur regi puellæ virgines ac speciosæ,\"},{\"verse\":3,\"text\":\"et mittantur qui considerent per universas provincias puellas speciosas et virgines : et adducant eas ad civitatem Susan, et tradant eas in domum feminarum sub manu Egei eunuchi, qui est præpositus et custos mulierum regiarum : et accipiant mundum muliebrem, et cetera ad usus necessaria.\"},{\"verse\":4,\"text\":\"Et quæcumque inter omnes oculis regis placuerit, ipsa regnet pro Vasthi. Placuit sermo regi : et ita, ut suggesserant, jussit fieri.\"},{\"verse\":5,\"text\":\"Erat vir Judæus in Susan civitate, vocabulo Mardochæus filius Jair, filii Semei, filii Cis, de stirpe Jemini,\"},{\"verse\":6,\"text\":\"qui translatus fuerat de Jerusalem eo tempore quo Jechoniam regem Juda Nabuchodonosor rex Babylonis transtulerat,\"},{\"verse\":7,\"text\":\"qui fuit nutritius filiæ fratris sui Edissæ, quæ altero nomine vocabatur Esther, et utrumque parentem amiserat : pulchra nimis, et decora facie. Mortuisque patre ejus ac matre, Mardochæus sibi eam adoptavit in filiam.\"},{\"verse\":8,\"text\":\"Cumque percrebruisset regis imperium, et juxta mandatum illius multæ pulchræ virgines adducerentur Susan, et Egeo traderentur eunucho, Esther quoque inter ceteras puellas ei tradita est, ut servaretur in numero feminarum.\"},{\"verse\":9,\"text\":\"Quæ placuit ei, et invenit gratiam in conspectu illius. Et præcepit eunucho, ut acceleraret mundum muliebrem, et traderet ei partes suas, et septem puellas speciosissimas de domo regis, et tam ipsam quam pedissequas ejus ornaret atque excoleret.\"},{\"verse\":10,\"text\":\"Quæ noluit indicare ei populum et patriam suam : Mardochæus enim præceperat ei, ut de hac re omnino reticeret :\"},{\"verse\":11,\"text\":\"qui deambulabat quotidie ante vestibulum domus, in qua electæ virgines servabantur, curam agens salutis Esther, et scire volens quid ei accideret.\"},{\"verse\":12,\"text\":\"Cum autem venisset tempus singularum per ordinem puellarum ut intrarent ad regem, expletis omnibus quæ ad cultum muliebrem pertinebant, mensis duodecimus vertebatur : ita dumtaxat, ut sex mensibus oleo ungerentur myrrhino, et aliis sex quibusdam pigmentis et aromatibus uterentur.\"},{\"verse\":13,\"text\":\"Ingredientesque ad regem, quidquid postulassent ad ornatum pertinens, accipiebant : et ut eis placuerat, compositæ de triclinio feminarum ad regis cubiculum transibant.\"},{\"verse\":14,\"text\":\"Et quæ intraverat vespere, egrediebatur mane, atque inde in secundas ædes deducebatur, quæ sub manu Susagazi eunuchi erant, qui concubinis regis præsidebat : nec habebat potestatem ad regem ultra redeundi, nisi voluisset rex, et eam venire jussisset ex nomine.\"},{\"verse\":15,\"text\":\"Evoluto autem tempore per ordinem, instabat dies quo Esther filia Abihail fratris Mardochæi, quam sibi adoptaverat in filiam, deberet intrare ad regem. Quæ non quæsivit muliebrem cultum, sed quæcumque voluit Egeus eunuchus custos virginum, hæc ei ad ornatum dedit. Erat enim formosa valde, et incredibili pulchritudine : omnium oculis gratiosa et amabilis videbatur.\"},{\"verse\":16,\"text\":\"Ducta est itaque ad cubiculum regis Assueri mense decimo, qui vocatur Tebeth, septimo anno regni ejus.\"},{\"verse\":17,\"text\":\"Et adamavit eam rex plus quam omnes mulieres, habuitque gratiam et misericordiam coram eo super omnes mulieres : et posuit diadema regni in capite ejus, fecitque eam regnare in loco Vasthi.\"},{\"verse\":18,\"text\":\"Et jussit convivium præparari permagnificum cunctis principibus et servis suis pro conjunctione et nuptiis Esther. Et dedit requiem universis provinciis, ac dona largitus est juxta magnificentiam principalem.\"},{\"verse\":19,\"text\":\"Cumque secundo quærerentur virgines et congregarentur, Mardochæus manebat ad januam regis :\"},{\"verse\":20,\"text\":\"necdum prodiderat Esther patriam et populum suum, juxta mandatum ejus. Quidquid enim ille præcipiebat, observabat Esther : et ita cuncta faciebat ut eo tempore solita erat, quo eam parvulam nutriebat.\"},{\"verse\":21,\"text\":\"Eo igitur tempore, quo Mardochæus ad regis januam morabatur, irati sunt Bagathan et Thares duo eunuchi regis, qui janitores erant, et in primo palatii limine præsidebant : volueruntque insurgere in regem, et occidere eum.\"},{\"verse\":22,\"text\":\"Quod Mardochæum non latuit, statimque nuntiavit reginæ Esther : et illa regi ex nomine Mardochæi, qui ad se rem detulerat.\"},{\"verse\":23,\"text\":\"Quæsitum est, et inventum : et appensus est uterque eorum in patibulo. Mandatumque est historiis, et annalibus traditum coram rege.\"}],\"summary\":\"Esther is advanced to be queen. Mardochai detecteth a plot against the king.\",\"intro\":null,\"prev\":{\"usfm\":\"EST\",\"chapter\":1,\"label\":\"Esther 1\"},\"next\":{\"usfm\":\"EST\",\"chapter\":3,\"label\":\"Esther 3\"}}]]\n"])</script></body></html>
