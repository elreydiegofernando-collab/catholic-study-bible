[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Esther<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EST/">About <!-- -->Esther</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A copy of the king’s letter in favour of the Jews.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The great king Artaxerxes, from India to Ethiopia, to the governors and princes of a hundred and twenty-seven provinces, which obey our command, sendeth greeting.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Many have abused unto pride the goodness of princes, and the honour that hath been bestowed upon them:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And not only endeavour to oppress the king’s subjects, but not bearing the glory that is given them, take in hand, to practise also against them that gave it.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Neither are they content not to return thanks for benefits received, and to violate in themselves the laws of humanity, but they think they can also escape the justice of God who seeth all things.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they break out into so great madness, as to endeavour to undermine by lies such as observe diligently the offices committed to them, and do all things in such manner as to be worthy of all men’s praise,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>While with crafty fraud they deceive the ears of princes that are well meaning, and judge of others by their own nature.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now this is proved both from ancient histories, and by the things which are done daily, how the good designs of kings are depraved by the evil suggestions of certain men.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wherefore we must provide for the peace of all provinces.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Neither must you think, if we command different things, that it cometh of the levity of our mind, but that we give sentence according to the quality and necessity of times, as the profit of the commonwealth requireth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Now that you may more plainly understand what we say, Aman the son of Amadathi, a Macedonian both in mind and country, and having nothing of the Persian blood, but with his cruelty staining our goodness, was received being a stranger by us:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And found our humanity so great towards him, that he was called our father, and was worshipped by all as the next man after the king:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But he was so far puffed up with arrogancy, as to go about to deprive us of our kingdom and life.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For with certain new and unheard of devices he hath sought the destruction of Mardochai, by whose fidelity and good services our life was saved, and of Esther the partner of our kingdom with all their nation:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thinking that after they were slain, he might work treason against us left alone without friends, and might transfer the kingdom of the Persians to the Macedonians.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But we have found that the Jews, who were by that most wicked man appointed to be slain, are in no fault at all, but contrariwise, use just laws,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And are the children of the highest and the greatest, and the ever living God, by whose benefit the kingdom was given both to our fathers and to us, and is kept unto this day.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Wherefore know ye that those letters which he sent in our name, are void and of no effect.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For which crime both he himself that devised it, and all his kindred hang on gibbets, before the gates of this city Susan: not we, but God repaying him as he deserved.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But this edict, which we now send, shall be published in all cities, that the Jews may freely follow their own laws.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And you shall aid them that they may kill those who had prepared themselves to kill them, on the thirteenth day of the twelfth month, which is called Adar.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For the almighty God hath turned this day of sadness and mourning into joy to them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Wherefore you shall also count this day among other festival days, and celebrate it with all joy, that it may be known also in times to come,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>That all they who faithfully obey the Persians, receive a worthy reward for their fidelity: but they that are traitors to their kingdom, are destroyed for their wickedness.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And let every province and city, that will not be partaker of this solemnity, perish by the sword and by fire, and be destroyed in such manner as to be made unpassable, both to men and beasts, for an example of contempt, and disobedience.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Rex magnus Artaxerxes ab India usque Æthiopiam, centum viginti septem provinciarum ducibus ac principibus qui nostræ jussioni obediunt, salutem dicit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Multi bonitate principum et honore, qui in eos collatus est, abusi sunt in superbiam :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et non solum subjectos regibus nituntur opprimere, sed datam sibi gloriam non ferentes, in ipsos qui dederunt, moliuntur insidias.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nec contenti sunt gratias non agere beneficiis, et humanitatis in se jura violare, sed Dei quoque cuncta cernentis arbitrantur se posse fugere sententiam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et in tantum vesaniæ proruperunt, ut eos qui credita sibi officia diligenter observant, et ita cuncta agunt ut omnium laude digni sint, mendaciorum cuniculis conentur subvertere,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>dum aures principum simplices, et ex sua natura alios æstimantes, callida fraude decipiunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quæ res et ex veteribus probatur historiis, et ex his quæ geruntur quotidie, quomodo malis quorumdam suggestionibus regum studia depraventur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Unde providendum est paci omnium provinciarum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nec putare debetis, si diversa jubeamus, ex animi nostri venire levitate, sed pro qualitate et necessitate temporum, ut reipublicæ poscit utilitas, ferre sententiam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et ut manifestius quod dicimus intelligatis, Aman filius Amadathi, et animo et gente Macedo, alienusque a Persarum sanguine, et pietatem nostram sua crudelitate commaculans, peregrinus a nobis susceptus est :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et tantam in se expertus humanitatem, ut pater noster vocaretur, et adoraretur ab omnibus post regem secundus :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>qui in tantum arrogantiæ tumorem sublatus est, ut regno privare nos niteretur et spiritu.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nam Mardochæum, cujus fide et beneficiis vivimus, et consortem regni nostri Esther cum omni gente sua, novis quibusdam atque inauditis machinis expetivit in mortem :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>hoc cogitans ut illis interfectis, insidiaretur nostræ solitudini, et regnum Persarum transferret in Macedonas.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nos autem a pessimo mortalium Judæos neci destinatos, in nulla penitus culpa reperimus, sed e contrario justis utentes legibus,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et filios altissimi et maximi semperque viventis Dei, cujus beneficio et patribus nostris et nobis regnum est traditum, et usque hodie custoditur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Unde eas litteras, quas sub nomine nostro ille direxerat, sciatis esse irritas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Pro quo scelere ante portas hujus urbis, id est, Susan, et ipse qui machinatus est, et omnis cognatio ejus pendet in patibulis : non nobis, sed Deo reddente ei quod meruit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hoc autem edictum, quod nunc mittimus, in cunctis urbibus proponatur, ut liceat Judæis uti legibus suis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quibus debetis esse adminiculo, ut eos qui se ad necem eorum paraverant, possint interficere tertiadecima die mensis duodecimi, qui vocatur Adar.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hanc enim diem, Deus omnipotens, mœroris et luctus, eis vertit in gaudium.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Unde et vos inter ceteros festos dies, hanc habetote diem, et celebrate eam cum omni lætitia, ut et in posterum cognoscatur,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>omnes qui fideliter Persis obediunt, dignam pro fide recipere mercedem ; qui autem insidiantur regno eorum, perire pro scelere.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omnis autem provincia et civitas quæ noluerit solemnitatis hujus esse particeps, gladio et igne pereat, et sic deleatur, ut non solum hominibus, sed etiam bestiis invia sit in sempiternum, pro exemplo contemptus et inobedientiæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class= ide the goodness of princes, and the honour that hath been bestowed upon them:\"},{\"verse\":3,\"text\":\"And not only endeavour to oppress the king’s subjects, but not bearing the glory that is given them, take in hand, to practise also against them that gave it.\"},{\"verse\":4,\"text\":\"Neither are they content not to return thanks for benefits received, and to violate in themselves the laws of humanity, but they think they can also escape the justice of God who seeth all things.\"},{\"verse\":5,\"text\":\"And they break out into so great madness, as to endeavour to undermine by lies such as observe diligently the offices committed to them, and do all things in such manner as to be worthy of all men’s praise,\"},{\"verse\":6,\"text\":\"While with crafty fraud they deceive the ears of princes that are well meaning, and judge of others by their own nature.\"},{\"verse\":7,\"text\":\"Now this is proved both from ancient histories, and by the things which are done daily, how the good designs of kings are depraved by the evil suggestions of certain men.\"},{\"verse\":8,\"text\":\"Wherefore we must provide for the peace of all provinces.\"},{\"verse\":9,\"text\":\"Neither must you think, if we command different things, that it cometh of the levity of our mind, but that we give sentence according to the quality and necessity of times, as the profit of the commonwealth requireth.\"},{\"verse\":10,\"text\":\"Now that you may more plainly understand what we say, Aman the son of Amadathi, a Macedonian both in mind and country, and having nothing of the Persian blood, but with his cruelty staining our goodness, was received being a stranger by us:\"},{\"verse\":11,\"text\":\"And found our humanity so great towards him, that he was called our father, and was worshipped by all as the next man after the king:\"},{\"verse\":12,\"text\":\"But he was so far puffed up with arrogancy, as to go about to deprive us of our kingdom and life.\"},{\"verse\":13,\"text\":\"For with certain new and unheard of devices he hath sought the destruction of Mardochai, by whose fidelity and good services our life was saved, and of Esther the partner of our kingdom with all their nation:\"},{\"verse\":14,\"text\":\"Thinking that after they were slain, he might work treason against us left alone without friends, and might transfer the kingdom of the Persians to the Macedonians.\"},{\"verse\":15,\"text\":\"But we have found that the Jews, who were by that most wicked man appointed to be slain, are in no fault at all, but contrariwise, use just laws,\"},{\"verse\":16,\"text\":\"And are the children of the highest and the greatest, and the ever living God, by whose benefit the kingdom was given both to our fathers and to us, and is kept unto this day.\"},{\"verse\":17,\"text\":\"Wherefore know ye that those letters which he sent in our name, are void and of no effect.\"},{\"verse\":18,\"text\":\"For which crime both he himself that devised it, and all his kindred hang on gibbets, before the gates of this city Susan: not we, but God repaying him as he deserved.\"},{\"verse\":19,\"text\":\"But this edict, which we now send, shall be published in all cities, that the Jews may freely follow their own laws.\"},{\"verse\":20,\"text\":\"And you shall aid them that they may kill those who had prepared themselves to kill them, on the thirteenth day of the twelfth month, which is called Adar.\"},{\"verse\":21,\"text\":\"For the almighty God hath turned this day of sadness and mourning into joy to them.\"},{\"verse\":22,\"text\":\"Wherefore you shall also count this day among other festival days, and celebrate it with all joy, that it may be known also in times to come,\"},{\"verse\":23,\"text\":\"That all they who faithfully obey the Persians, receive a worthy reward for their fidelity: but they that are traitors to their kingdom, are destroyed for their wickedness.\"},{\"verse\":24,\"text\":\"And let every province and city, that will not be partaker of this solemnity, perish by the sword and by fire, and be destroyed in such manner as to be made unpassable, both to men and beasts, for an example of contempt, and disobedience.\"}],\"vul\":[{\"verse\":1,\"text\":\"Rex magnus Artaxerxes ab India usque Æthiopiam, centum viginti septem provinciarum ducibus ac principibus qui nostræ jussioni obediunt, salutem dicit.\"},{\"verse\":2,\"text\":\"Multi bonitate principum et honore, qui in eos collatus est, abusi sunt in superbiam :\"},{\"verse\":3,\"text\":\"et non solum subjectos regibus nituntur opprimere, sed datam sibi gloriam non ferentes, in ipsos qui dederunt, moliuntur insidias.\"},{\"verse\":4,\"text\":\"Nec contenti sunt gratias non agere beneficiis, et humanitatis in se jura violare, sed Dei quoque cuncta cernentis arbitrantur se posse fugere sententiam.\"},{\"verse\":5,\"text\":\"Et in tantum vesaniæ proruperunt, ut eos qui credita sibi officia diligenter observant, et ita cuncta agunt ut omnium laude digni sint, mendaciorum cuniculis conentur subvertere,\"},{\"verse\":6,\"text\":\"dum aures principum simplices, et ex sua natura alios æstimantes, callida fraude decipiunt.\"},{\"verse\":7,\"text\":\"Quæ res et ex veteribus probatur historiis, et ex his quæ geruntur quotidie, quomodo malis quorumdam suggestionibus regum studia depraventur.\"},{\"verse\":8,\"text\":\"Unde providendum est paci omnium provinciarum.\"},{\"verse\":9,\"text\":\"Nec putare debetis, si diversa jubeamus, ex animi nostri venire levitate, sed pro qualitate et necessitate temporum, ut reipublicæ poscit utilitas, ferre sententiam.\"},{\"verse\":10,\"text\":\"Et ut manifestius quod dicimus intelligatis, Aman filius Amadathi, et animo et gente Macedo, alienusque a Persarum sanguine, et pietatem nostram sua crudelitate commaculans, peregrinus a nobis susceptus est :\"},{\"verse\":11,\"text\":\"et tantam in se expertus humanitatem, ut pater noster vocaretur, et adoraretur ab omnibus post regem secundus :\"},{\"verse\":12,\"text\":\"qui in tantum arrogantiæ tumorem sublatus est, ut regno privare nos niteretur et spiritu.\"},{\"verse\":13,\"text\":\"Nam Mardochæum, cujus fide et beneficiis vivimus, et consortem regni nostri Esther cum omni gente sua, novis quibusdam atque inauditis machinis expetivit in mortem :\"},{\"verse\":14,\"text\":\"hoc cogitans ut illis interfectis, insidiaretur nostræ solitudini, et regnum Persarum transferret in Macedonas.\"},{\"verse\":15,\"text\":\"Nos autem a pessimo mortalium Judæos neci destinatos, in nulla penitus culpa reperimus, sed e contrario justis utentes legibus,\"},{\"verse\":16,\"text\":\"et filios altissimi et maximi semperque viventis Dei, cujus beneficio et patribus nostris et nobis regnum est traditum, et usque hodie custoditur.\"},{\"verse\":17,\"text\":\"Unde eas litteras, quas sub nomine nostro ille direxerat, sciatis esse irritas.\"},{\"verse\":18,\"text\":\"Pro quo scelere ante portas hujus urbis, id est, Susan, et ipse qui machinatus est, et omnis cognatio ejus pendet in patibulis : non nobis, sed Deo reddente ei quod meruit.\"},{\"verse\":19,\"text\":\"Hoc autem edictum, quod nunc mittimus, in cunctis urbibus proponatur, ut liceat Judæis uti legibus suis.\"},{\"verse\":20,\"text\":\"Quibus debetis esse adminiculo, ut eos qui se ad necem eorum paraverant, possint interficere tertiadecima die mensis duodecimi, qui vocatur Adar.\"},{\"verse\":21,\"text\":\"Hanc enim diem, Deus omnipotens, mœroris et luctus, eis vertit in gaudium.\"},{\"verse\":22,\"text\":\"Unde et vos inter ceteros festos dies, hanc habetote diem, et celebrate eam cum omni lætitia, ut et in posterum cognoscatur,\"},{\"verse\":23,\"text\":\"omnes qui fideliter Persis obediunt, dignam pro fide recipere mercedem ; qui autem insidiantur regno eorum, perire pro scelere.\"},{\"verse\":24,\"text\":\"Omnis autem provincia et civitas quæ noluerit solemnitatis hujus esse particeps, gladio et igne pereat, et sic deleatur, ut non solum hominibus, sed etiam bestiis invia sit in sempiternum, pro exemplo contemptus et inobedientiæ.\"}],\"summary\":\"A copy of the king’s letter in favour of the Jews.\",\"intro\":null,\"prev\":{\"usfm\":\"EST\",\"chapter\":15,\"label\":\"Esther 15\"},\"next\":{\"usfm\":\"JOB\",\"chapter\":1,\"label\":\"Job 1\"}}]]\n"])</script></body></html>
