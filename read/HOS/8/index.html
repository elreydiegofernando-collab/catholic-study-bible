.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hosea<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Osee</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/HOS/">About <!-- -->Hosea</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The Israelites are threatened with destruction for their impiety and idolatry.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Let there be a trumpet in thy throat like an eagle upon the house of the Lord: because they have transgressed my covenant, and have violated my law.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>They shall call upon me: O my God, we, Israel, know thee.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Israel hath cast off the thing that is good, the enemy shall pursue him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They have reigned, but not by me: they have been princes, and I knew not: of their silver and their gold they have made idols to themselves, that they might perish.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thy calf, O Samaria, is cast off, my wrath is kindled against them. How long will they be incapable of being cleansed?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For itself also is the invention of Israel: a workman made it, and it is no god: for the calf of Samaria shall be turned to spiders’ webs.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For they shall sow wind, and reap a whirlwind, there is no standing stalk in it, the bud shall yield no meal; and if it should yield, strangers shall eat it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Israel is swallowed up: now is he become among the nations like an unclean vessel.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath given gifts to his lovers.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But even though they shall have hired the nations, now will I gather them together: and they shall rest a while from the burden of the king, and the princes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Because Ephraim hath made many altars to sin: altars are become to him unto sin.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I shall write to him my manifold laws, which have been accounted as foreign.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They shall offer victims, they shall sacrifice flesh, and shall eat it, and the Lord will not receive them: now will he remember their iniquity, and will visit their sins: they shall return to Egypt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Israel hath forgotten his Maker, and hath built temples: and Juda hath built many fenced cities: and I will send a fire upon his cities, and it shall devour the houses thereof.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In gutture tuo sit tuba quasi aquila super domum Domini, pro eo quod transgressi sunt fœdus meum, et legem meam prævaricati sunt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Me invocabunt : Deus meus, cognovimus te Israël.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Projecit Israël bonum : inimicus persequetur eum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ipsi regnaverunt, et non ex me ; principes exstiterunt, et non cognovi : argentum suum et aurum suum fecerunt sibi idola, ut interirent.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Projectus est vitulus tuus, Samaria ; iratus est furor meus in eos. Usquequo non poterunt emundari ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quia ex Israël et ipse est : artifex fecit illum, et non est deus ; quoniam in aranearum telas erit vitulus Samariæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quia ventum seminabunt, et turbinem metent : culmus stans non est in eo ; germen non faciet farinam : quod etsi fecerit, alieni comedent eam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Devoratus est Israël ; nunc factus est in nationibus quasi vas immundum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quia ipsi ascenderunt ad Assur, onager solitarius sibi ; Ephraim munera dederunt amatoribus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sed et cum mercede conduxerint nationes, nunc congregabo eos, et quiescent paulisper ab onere regis et principum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quia multiplicavit Ephraim altaria ad peccandum ; factæ sunt ei aræ in delictum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Scribam ei multiplices leges meas, quæ velut alienæ computatæ sunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hostias offerent, immolabunt carnes et comedent, et Dominus non suscipiet eas : nunc recordabitur iniquitatis eorum, et visitabit peccata eorum : ipsi in Ægyptum convertentur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et oblitus est Israël factoris sui, et ædificavit delubra ; et Judas multiplicavit urbes munitas ; et mittam ignem in civitates ejus, et devorabit ædes illius.</button></di i_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"HOS.8\",{\"bookId\":33,\"usfm\":\"HOS\",\"bookName\":\"Hosea\",\"drName\":\"Osee\",\"chapter\":8,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"Let there be a trumpet in thy throat like an eagle upon the house of the Lord: because they have transgressed my covenant, and have violated my law.\"},{\"verse\":2,\"text\":\"They shall call upon me: O my God, we, Israel, know thee.\"},{\"verse\":3,\"text\":\"Israel hath cast off the thing that is good, the enemy shall pursue him.\"},{\"verse\":4,\"text\":\"They have reigned, but not by me: they have been princes, and I knew not: of their silver and their gold they have made idols to themselves, that they might perish.\"},{\"verse\":5,\"text\":\"Thy calf, O Samaria, is cast off, my wrath is kindled against them. How long will they be incapable of being cleansed?\"},{\"verse\":6,\"text\":\"For itself also is the invention of Israel: a workman made it, and it is no god: for the calf of Samaria shall be turned to spiders’ webs.\"},{\"verse\":7,\"text\":\"For they shall sow wind, and reap a whirlwind, there is no standing stalk in it, the bud shall yield no meal; and if it should yield, strangers shall eat it.\"},{\"verse\":8,\"text\":\"Israel is swallowed up: now is he become among the nations like an unclean vessel.\"},{\"verse\":9,\"text\":\"For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath given gifts to his lovers.\"},{\"verse\":10,\"text\":\"But even though they shall have hired the nations, now will I gather them together: and they shall rest a while from the burden of the king, and the princes.\"},{\"verse\":11,\"text\":\"Because Ephraim hath made many altars to sin: altars are become to him unto sin.\"},{\"verse\":12,\"text\":\"I shall write to him my manifold laws, which have been accounted as foreign.\"},{\"verse\":13,\"text\":\"They shall offer victims, they shall sacrifice flesh, and shall eat it, and the Lord will not receive them: now will he remember their iniquity, and will visit their sins: they shall return to Egypt.\"},{\"verse\":14,\"text\":\"And Israel hath forgotten his Maker, and hath built temples: and Juda hath built many fenced cities: and I will send a fire upon his cities, and it shall devour the houses thereof.\"}],\"vul\":[{\"verse\":1,\"text\":\"In gutture tuo sit tuba quasi aquila super domum Domini, pro eo quod transgressi sunt fœdus meum, et legem meam prævaricati sunt.\"},{\"verse\":2,\"text\":\"Me invocabunt : Deus meus, cognovimus te Israël.\"},{\"verse\":3,\"text\":\"Projecit Israël bonum : inimicus persequetur eum.\"},{\"verse\":4,\"text\":\"Ipsi regnaverunt, et non ex me ; principes exstiterunt, et non cognovi : argentum suum et aurum suum fecerunt sibi idola, ut interirent.\"},{\"verse\":5,\"text\":\"Projectus est vitulus tuus, Samaria ; iratus est furor meus in eos. Usquequo non poterunt emundari ?\"},{\"verse\":6,\"text\":\"Quia ex Israël et ipse est : artifex fecit illum, et non est deus ; quoniam in aranearum telas erit vitulus Samariæ.\"},{\"verse\":7,\"text\":\"Quia ventum seminabunt, et turbinem metent : culmus stans non est in eo ; germen non faciet farinam : quod etsi fecerit, alieni comedent eam.\"},{\"verse\":8,\"text\":\"Devoratus est Israël ; nunc factus est in nationibus quasi vas immundum.\"},{\"verse\":9,\"text\":\"Quia ipsi ascenderunt ad Assur, onager solitarius sibi ; Ephraim munera dederunt amatoribus.\"},{\"verse\":10,\"text\":\"Sed et cum mercede conduxerint nationes, nunc congregabo eos, et quiescent paulisper ab onere regis et principum.\"},{\"verse\":11,\"text\":\"Quia multiplicavit Ephraim altaria ad peccandum ; factæ sunt ei aræ in delictum.\"},{\"verse\":12,\"text\":\"Scribam ei multiplices leges meas, quæ velut alienæ computatæ sunt.\"},{\"verse\":13,\"text\":\"Hostias offerent, immolabunt carnes et comedent, et Dominus non suscipiet eas : nunc recordabitur iniquitatis eorum, et visitabit peccata eorum : ipsi in Ægyptum convertentur.\"},{\"verse\":14,\"text\":\"Et oblitus est Israël factoris sui, et ædificavit delubra ; et Judas multiplicavit urbes munitas ; et mittam ignem in civitates ejus, et devorabit ædes illius.\"}],\"summary\":\"The Israelites are threatened with destruction for their impiety and idolatry.\",\"intro\":null,\"prev\":{\"usfm\":\"HOS\",\"chapter\":7,\"label\":\"Hosea 7\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":9,\"label\":\"Hosea 9\"}}]]\n"])</script></body></html>
