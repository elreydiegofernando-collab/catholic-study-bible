ont-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ephraim feedeth on the wind, and followeth the burning heat: all the day long he multiplied lies and desolation: and he hath made a covenant with the Assyrians, and carried oil into Egypt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Therefore there is a judgment of the Lord with Juda, and a visitation for Jacob: he will render to him according to his ways, and according to his devices.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In the womb he supplanted his brother: and by his strength he had success with an angel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he prevailed over the angel, and was strengthened: he wept, and made supplication to him: he found him in Bethel, and there he spoke with us.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Even the Lord God of hosts, the Lord is his memorial.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Therefore turn thou to thy God: keep mercy and judgment, and hope in thy God always.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He is like Chanaan, there is a deceitful balance in his hand, he hath loved oppression.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Ephraim said: But yet I am become rich, I have found me an idol: all my labours shall not find me the iniquity that I have committed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And I that am the Lord thy God from the land of Egypt, will yet cause thee to dwell in tabernacles, as in the days of the feast.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And I have spoken by the prophets, and I have multiplied visions, and I have used similitudes by the ministry of the prophets.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If Galaad be an idol, then in vain were they in Galgal offering sacrifices with bullocks: for their altars also are as heaps in the furrows of the field.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Jacob fled into the country of Syria, and Israel served for a wife, and was a keeper for a wife.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But the Lord by a prophet brought Israel out of Egypt: and he was preserved by a prophet.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ephraim hath provoked me to wrath with his bitterness, and his blood shall come upon him, and his Lord will render his reproach unto him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ephraim pascit ventum, et sequitur æstum ; tota die mendacium et vastitatem multiplicat : et fœdus cum Assyriis iniit, et oleum in Ægyptum ferebat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Judicium ergo Domini cum Juda, et visitatio super Jacob : juxta vias ejus, et juxta adinventiones ejus reddet ei.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In utero supplantavit fratrem suum, et in fortitudine sua directus est cum angelo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et invaluit ad angelum, et confortatus est ; flevit, et rogavit eum. In Bethel invenit eum, et ibi locutus est nobiscum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et Dominus Deus exercituum, Dominus memoriale ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et tu ad Deum tuum converteris ; misericordiam et judicium custodi, et spera in Deo tuo semper.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Chanaan, in manu ejus statera dolosa, calumniam dilexit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et dixit Ephraim : Verumtamen dives effectus sum ; inveni idolum mihi : omnes labores mei non invenient mihi iniquitatem quam peccavi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ego Dominus Deus tuus ex terra Ægypti : adhuc sedere te faciam in tabernaculis, sicut in diebus festivitatis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et locutus sum super prophetas, et ego visionem multiplicavi, et in manu prophetarum assimilatus sum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si Galaad idolum, ergo frustra erant in Galgal bobus immolantes ; nam et altaria eorum quasi acervi super sulcos agri.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fugit Jacob in regionem Syriæ, et servivit Israël in uxorem, et in uxorem servavit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In propheta autem eduxit Dominus Israël de Ægypto, et in propheta servatus est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ad iracundiam me provocavit Ephraim in amaritudinibus suis : et sanguis ejus super eum veniet, et opprobrium ejus restituet ei Dominus suus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl 12\",{\"bookId\":33,\"usfm\":\"HOS\",\"bookName\":\"Hosea\",\"drName\":\"Osee\",\"chapter\":12,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"Ephraim feedeth on the wind, and followeth the burning heat: all the day long he multiplied lies and desolation: and he hath made a covenant with the Assyrians, and carried oil into Egypt.\"},{\"verse\":2,\"text\":\"Therefore there is a judgment of the Lord with Juda, and a visitation for Jacob: he will render to him according to his ways, and according to his devices.\"},{\"verse\":3,\"text\":\"In the womb he supplanted his brother: and by his strength he had success with an angel.\"},{\"verse\":4,\"text\":\"And he prevailed over the angel, and was strengthened: he wept, and made supplication to him: he found him in Bethel, and there he spoke with us.\"},{\"verse\":5,\"text\":\"Even the Lord God of hosts, the Lord is his memorial.\"},{\"verse\":6,\"text\":\"Therefore turn thou to thy God: keep mercy and judgment, and hope in thy God always.\"},{\"verse\":7,\"text\":\"He is like Chanaan, there is a deceitful balance in his hand, he hath loved oppression.\"},{\"verse\":8,\"text\":\"And Ephraim said: But yet I am become rich, I have found me an idol: all my labours shall not find me the iniquity that I have committed.\"},{\"verse\":9,\"text\":\"And I that am the Lord thy God from the land of Egypt, will yet cause thee to dwell in tabernacles, as in the days of the feast.\"},{\"verse\":10,\"text\":\"And I have spoken by the prophets, and I have multiplied visions, and I have used similitudes by the ministry of the prophets.\"},{\"verse\":11,\"text\":\"If Galaad be an idol, then in vain were they in Galgal offering sacrifices with bullocks: for their altars also are as heaps in the furrows of the field.\"},{\"verse\":12,\"text\":\"Jacob fled into the country of Syria, and Israel served for a wife, and was a keeper for a wife.\"},{\"verse\":13,\"text\":\"But the Lord by a prophet brought Israel out of Egypt: and he was preserved by a prophet.\"},{\"verse\":14,\"text\":\"Ephraim hath provoked me to wrath with his bitterness, and his blood shall come upon him, and his Lord will render his reproach unto him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ephraim pascit ventum, et sequitur æstum ; tota die mendacium et vastitatem multiplicat : et fœdus cum Assyriis iniit, et oleum in Ægyptum ferebat.\"},{\"verse\":2,\"text\":\"Judicium ergo Domini cum Juda, et visitatio super Jacob : juxta vias ejus, et juxta adinventiones ejus reddet ei.\"},{\"verse\":3,\"text\":\"In utero supplantavit fratrem suum, et in fortitudine sua directus est cum angelo.\"},{\"verse\":4,\"text\":\"Et invaluit ad angelum, et confortatus est ; flevit, et rogavit eum. In Bethel invenit eum, et ibi locutus est nobiscum.\"},{\"verse\":5,\"text\":\"Et Dominus Deus exercituum, Dominus memoriale ejus.\"},{\"verse\":6,\"text\":\"Et tu ad Deum tuum converteris ; misericordiam et judicium custodi, et spera in Deo tuo semper.\"},{\"verse\":7,\"text\":\"Chanaan, in manu ejus statera dolosa, calumniam dilexit.\"},{\"verse\":8,\"text\":\"Et dixit Ephraim : Verumtamen dives effectus sum ; inveni idolum mihi : omnes labores mei non invenient mihi iniquitatem quam peccavi.\"},{\"verse\":9,\"text\":\"Et ego Dominus Deus tuus ex terra Ægypti : adhuc sedere te faciam in tabernaculis, sicut in diebus festivitatis.\"},{\"verse\":10,\"text\":\"Et locutus sum super prophetas, et ego visionem multiplicavi, et in manu prophetarum assimilatus sum.\"},{\"verse\":11,\"text\":\"Si Galaad idolum, ergo frustra erant in Galgal bobus immolantes ; nam et altaria eorum quasi acervi super sulcos agri.\"},{\"verse\":12,\"text\":\"Fugit Jacob in regionem Syriæ, et servivit Israël in uxorem, et in uxorem servavit.\"},{\"verse\":13,\"text\":\"In propheta autem eduxit Dominus Israël de Ægypto, et in propheta servatus est.\"},{\"verse\":14,\"text\":\"Ad iracundiam me provocavit Ephraim in amaritudinibus suis : et sanguis ejus super eum veniet, et opprobrium ejus restituet ei Dominus suus.\"}],\"summary\":\"Israel is reproved for sin. God’s favours to them.\",\"intro\":null,\"prev\":{\"usfm\":\"HOS\",\"chapter\":11,\"label\":\"Hosea 11\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":13,\"label\":\"Hosea 13\"}}]]\n"])</script></body></html>
