.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hosea<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Osee</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/HOS/">About <!-- -->Hosea</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The distress and captivity of Israel for their sins and idolatry.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Rejoice not, O Israel: rejoice not as the nations do: for thou hast committed fornication against thy God, thou hast loved a reward upon every cornfloor.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The floor and the winepress shall not feed them, and the wine shall deceive them.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They shall not dwell in the Lord’s land: Ephraim is returned to Egypt, and hath eaten unclean things among the Assyrians.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They shall not offer wine to the Lord, neither shall they please him: their sacrifices shall be like the bread of mourners: all that shall eat it shall be defiled: for their bread is life for their soul, it shall not enter into the house of the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>What will you do in the solemn day, in the day of the feast of the Lord?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For behold they are gone because of destruction: Egypt shall gather them together, Memphis shall bury them: nettles shall inherit their beloved silver, the bur shall be in their tabernacles.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The days of visitation are come, the days of repaying are come: know ye, O Israel, that the prophet was foolish, the spiritual man was mad, for the multitude of thy iniquity, and the multitude of thy madness.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The watchman of Ephraim was with my God: the prophet is become a snare of ruin upon all his ways, madness is in the house of his God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They have sinned deeply, as in the days of Gabaa: he will remember their iniquity, and will visit their sin.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I found Israel like grapes in the desert, I saw their fathers like the firstfruits of the fig tree in the top thereof: but they went in to Beelphegor, and alienated themselves to that confusion, and became abominable, as those things were, which they loved.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As for Ephraim, their glory hath flown away like a bird from the birth, and from the womb, and from the conception.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And though they should bring up their children, I will make them without children among men: yea, and woe to them, when I shall depart from them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ephraim, as I saw, was a Tyre, founded in beauty: and Ephraim shall bring out his children to the murderer.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Give them, O Lord. What wilt thou give them? Give them a womb without children, and dry breasts.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>All their wickedness is in Galgal, for there I hated them: for the wickedness of their devices I will cast them forth out of my house: I will love them no more, all their princes are revolters.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ephraim is struck, their root is dried up, they shall yield no fruit. And if they should have issue, I will slay the best beloved fruit of their womb.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>My God will cast them away, because they hearkened not to him: and they shall be wanderers among the nations.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Noli lætari, Israël ; noli exsultare sicut populi : quia fornicatus es a Deo tuo ; dilexisti mercedem super omnes areas tritici.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Area et torcular non pascet eos, et vinum mentietur eis :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>non habitabunt in terra Domini. Reversus est Ephraim in Ægyptum, et in Assyriis pollutum comedit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non libabunt Domino vinum, et non placebunt ei. Sacrificia eorum quasi panis lugentium ; omnes qui comedent eum, contaminabuntur : quia panis eorum animæ ipsorum : non intrabit in domum Domini.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quid facietis in die solemni, in die festivitatis Domini ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ecce enim profecti sunt a vastitate : Ægyptus congregabit eos ; Memphis sepeliet eos : desiderabile argentum eorum urtica hæreditabit, lappa in tabernaculis eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venerunt dies visitationis, venerunt dies retributionis. Scitote, Israël, stultum prophetam, insanum virum spiritualem, propter multitudinem iniquitatis tuæ, et multitudinem amentiæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Speculator Ephraim cum Deo meo, propheta laqueus ruinæ factus est super omnes vias ejus ; insania in domo Dei ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Profunde peccaverunt, sicut in diebus Gabaa. Recordabitur iniquitatis eorum, et visitabit peccata eorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quasi uvas in deserto inveni Israël, quasi prima poma ficulneæ in cacumine ejus vidi patres eorum : ipsi autem intraverunt ad Beelphegor, et abalienati sunt in confusionem, et facti sunt abominabiles sicut ea quæ dilexerunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ephraim quasi avis avolavit ; gloria eorum a partu, et ab utero, et a conceptu.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quod etsi enutrierint filios suos, absque liberis eos faciam in hominibus ; sed et væ eis cum recessero ab eis !</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ephraim, ut vidi, Tyrus erat fundata in pulchritudine ; et Ephraim educet ad interfectorem filios suos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Da eis, Domine. Quid dabis eis ? da eis vulvam sine liberis, et ubera arentia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnes nequitiæ eorum in Galgal, quia ibi exosos habui eos. Propter malitiam adinventionum eorum, de domo mea ejiciam eos ; non addam ut diligam eos : omnes principes eorum recedentes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Percussus est Ephraim ; radix eorum exsiccata est : fructum nequaquam facient, quod etsi genuerint, interficiam amantissima uteri eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Abjiciet eos Deus meus, quia non audierunt eum, et erunt vagi in nationibus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hosea 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hosea 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->14<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Hosea 8" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><button type="button" aria-l .js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"HOS.9\",{\"bookId\":33,\"usfm\":\"HOS\",\"bookName\":\"Hosea\",\"drName\":\"Osee\",\"chapter\":9,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"Rejoice not, O Israel: rejoice not as the nations do: for thou hast committed fornication against thy God, thou hast loved a reward upon every cornfloor.\"},{\"verse\":2,\"text\":\"The floor and the winepress shall not feed them, and the wine shall deceive them.\"},{\"verse\":3,\"text\":\"They shall not dwell in the Lord’s land: Ephraim is returned to Egypt, and hath eaten unclean things among the Assyrians.\"},{\"verse\":4,\"text\":\"They shall not offer wine to the Lord, neither shall they please him: their sacrifices shall be like the bread of mourners: all that shall eat it shall be defiled: for their bread is life for their soul, it shall not enter into the house of the Lord.\"},{\"verse\":5,\"text\":\"What will you do in the solemn day, in the day of the feast of the Lord?\"},{\"verse\":6,\"text\":\"For behold they are gone because of destruction: Egypt shall gather them together, Memphis shall bury them: nettles shall inherit their beloved silver, the bur shall be in their tabernacles.\"},{\"verse\":7,\"text\":\"The days of visitation are come, the days of repaying are come: know ye, O Israel, that the prophet was foolish, the spiritual man was mad, for the multitude of thy iniquity, and the multitude of thy madness.\"},{\"verse\":8,\"text\":\"The watchman of Ephraim was with my God: the prophet is become a snare of ruin upon all his ways, madness is in the house of his God.\"},{\"verse\":9,\"text\":\"They have sinned deeply, as in the days of Gabaa: he will remember their iniquity, and will visit their sin.\"},{\"verse\":10,\"text\":\"I found Israel like grapes in the desert, I saw their fathers like the firstfruits of the fig tree in the top thereof: but they went in to Beelphegor, and alienated themselves to that confusion, and became abominable, as those things were, which they loved.\"},{\"verse\":11,\"text\":\"As for Ephraim, their glory hath flown away like a bird from the birth, and from the womb, and from the conception.\"},{\"verse\":12,\"text\":\"And though they should bring up their children, I will make them without children among men: yea, and woe to them, when I shall depart from them.\"},{\"verse\":13,\"text\":\"Ephraim, as I saw, was a Tyre, founded in beauty: and Ephraim shall bring out his children to the murderer.\"},{\"verse\":14,\"text\":\"Give them, O Lord. What wilt thou give them? Give them a womb without children, and dry breasts.\"},{\"verse\":15,\"text\":\"All their wickedness is in Galgal, for there I hated them: for the wickedness of their devices I will cast them forth out of my house: I will love them no more, all their princes are revolters.\"},{\"verse\":16,\"text\":\"Ephraim is struck, their root is dried up, they shall yield no fruit. And if they should have issue, I will slay the best beloved fruit of their womb.\"},{\"verse\":17,\"text\":\"My God will cast them away, because they hearkened not to him: and they shall be wanderers among the nations.\"}],\"vul\":[{\"verse\":1,\"text\":\"Noli lætari, Israël ; noli exsultare sicut populi : quia fornicatus es a Deo tuo ; dilexisti mercedem super omnes areas tritici.\"},{\"verse\":2,\"text\":\"Area et torcular non pascet eos, et vinum mentietur eis :\"},{\"verse\":3,\"text\":\"non habitabunt in terra Domini. Reversus est Ephraim in Ægyptum, et in Assyriis pollutum comedit.\"},{\"verse\":4,\"text\":\"Non libabunt Domino vinum, et non placebunt ei. Sacrificia eorum quasi panis lugentium ; omnes qui comedent eum, contaminabuntur : quia panis eorum animæ ipsorum : non intrabit in domum Domini.\"},{\"verse\":5,\"text\":\"Quid facietis in die solemni, in die festivitatis Domini ?\"},{\"verse\":6,\"text\":\"Ecce enim profecti sunt a vastitate : Ægyptus congregabit eos ; Memphis sepeliet eos : desiderabile argentum eorum urtica hæreditabit, lappa in tabernaculis eorum.\"},{\"verse\":7,\"text\":\"Venerunt dies visitationis, venerunt dies retributionis. Scitote, Israël, stultum prophetam, insanum virum spiritualem, propter multitudinem iniquitatis tuæ, et multitudinem amentiæ.\"},{\"verse\":8,\"text\":\"Speculator Ephraim cum Deo meo, propheta laqueus ruinæ factus est super omnes vias ejus ; insania in domo Dei ejus.\"},{\"verse\":9,\"text\":\"Profunde peccaverunt, sicut in diebus Gabaa. Recordabitur iniquitatis eorum, et visitabit peccata eorum.\"},{\"verse\":10,\"text\":\"Quasi uvas in deserto inveni Israël, quasi prima poma ficulneæ in cacumine ejus vidi patres eorum : ipsi autem intraverunt ad Beelphegor, et abalienati sunt in confusionem, et facti sunt abominabiles sicut ea quæ dilexerunt.\"},{\"verse\":11,\"text\":\"Ephraim quasi avis avolavit ; gloria eorum a partu, et ab utero, et a conceptu.\"},{\"verse\":12,\"text\":\"Quod etsi enutrierint filios suos, absque liberis eos faciam in hominibus ; sed et væ eis cum recessero ab eis !\"},{\"verse\":13,\"text\":\"Ephraim, ut vidi, Tyrus erat fundata in pulchritudine ; et Ephraim educet ad interfectorem filios suos.\"},{\"verse\":14,\"text\":\"Da eis, Domine. Quid dabis eis ? da eis vulvam sine liberis, et ubera arentia.\"},{\"verse\":15,\"text\":\"Omnes nequitiæ eorum in Galgal, quia ibi exosos habui eos. Propter malitiam adinventionum eorum, de domo mea ejiciam eos ; non addam ut diligam eos : omnes principes eorum recedentes.\"},{\"verse\":16,\"text\":\"Percussus est Ephraim ; radix eorum exsiccata est : fructum nequaquam facient, quod etsi genuerint, interficiam amantissima uteri eorum.\"},{\"verse\":17,\"text\":\"Abjiciet eos Deus meus, quia non audierunt eum, et erunt vagi in nationibus.\"}],\"summary\":\"The distress and captivity of Israel for their sins and idolatry.\",\"intro\":null,\"prev\":{\"usfm\":\"HOS\",\"chapter\":8,\"label\":\"Hosea 8\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":10,\"label\":\"Hosea 10\"}}]]\n"])</script></body></html>
