 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hosea<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Osee</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Israel is justly punished for leaving God. The abundance of grace in the church of Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Say ye to your brethren: You are my people: and to your sister: Thou hast obtained mercy.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Judge your mother, judge her: because she is not my wife, and I am not her husband. Let her put away her fornications from her face, and her adulteries from between her breasts.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lest I strip her naked, and set her as in the day that she was born: and I will make her as a wilderness, and will set her as a land that none can pass through and will kill her with drought.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And I will not have mercy on her children, for they are the children of fornications.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For their mother hath committed fornication, she that conceived them is covered with shame: for she said: I will go after my lovers, that give me my bread, and my water, my wool, and my flax, my oil, and my drink.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Wherefore, behold, I will hedge up thy way with thorns, and I will stop it up with a wall, and she shall not find her paths.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And she shall follow after her lovers, and shall not overtake them: and she shall seek them, and shall not find, and she shall say: I will go, and return to my first husband: because it was better with me then than now.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And she did not know that I gave her corn, and wine, and oil, and multiplied her silver, and gold, which they have used in the service of Baal.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Therefore will I return, and take away my corn in its season, and my wine in its season, and I will set at liberty my wool, and my flax, which covered her disgrace.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And now I will lay open her folly in the eyes of her lovers: and no man shall deliver her out of my hand:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I will cause all her mirth to cease, her solemnities, her new moons, her sabbaths, and all her festival times.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And I will destroy her vines, and her fig trees, of which she said: These are my rewards, which my lovers have given me: and I will make her as a forest and the beasts of the field shall devour her.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I will visit upon her the days of Baalim, to whom she burnt incense, and decked herself out with her earrings, and with her jewels, and went after her lovers, and forgot me, saith the Lord.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Therefore, behold I will allure her, and will lead her into the wilderness: and I will speak to her heart.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I will give her vinedressers out of the same place, and the valley of Achor for an opening of hope: and she shall sing there according to the days of her youth, and according to the days of her coming up out of the land of Egypt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And it shall be in that day, saith the Lord: That she shall call me: My husband, and she shall call me no more Baali.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And I will take away the names of Baalim out of her mouth, and she shall no more remember their name.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And in that day I will make a covenant with them, with the beasts of the field, and with the fowls of the air, and with the creeping things of the earth: and I will destroy the bow, and the sword, and war out of the land: and I will make them sleep secure.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I will espouse thee to me for ever: and I will espouse thee to me in justice, and judgment, and in mercy, and in commiserations.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And I will espouse thee to me in faith: and thou shalt know that I am the Lord.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And it shall come to pass in that day: I will hear, saith the Lord, I will hear the heavens, and they shall hear the earth.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the earth shall hear the corn, and the wine, and the oil, and these shall hear Jezrahel.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And I will sow her unto me in the earth, and I will have mercy on her that was without mercy.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And I will say to that which is not my people: Thou art my people: and they shall say: Thou art my God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dicite fratribus vestris : Populus meus ; et sorori vestræ : Misericordiam consecuta.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Judicate matrem vestram, judicate, quoniam ipsa non uxor mea, et ego non vir ejus. Auferat fornicationes suas a facie sua, et adulteria sua de medio uberum suorum ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>ne forte expoliem eam nudam, et statuam eam secundum diem nativitatis suæ, et ponam eam quasi solitudinem, et statuam eam velut terram inviam, et interficiam eam siti.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et filiorum illius non miserebor, quoniam filii fornicationum sunt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quia fornicata est mater eorum, confusa est quæ concepit eos ; quia dixit : Vadam post amatores meos, qui dant panes mihi, et aquas meas, lanam meam, et linum meum, oleum meum, et potum meum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Propter hoc ecce ego sepiam viam tuam spinis, et sepiam eam maceria, et semitas suas non inveniet.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et sequetur amatores suos, et non apprehendet eos ; et quæret eos, et non inveniet : et dicet : Vadam, et revertar ad virum meum priorem, quia bene mihi erat tunc magis quam nunc.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et hæc nescivit, quia ego dedi ei frumentum, et vinum, et oleum, et argentum multiplicavi ei, et aurum, quæ fecerunt Baal.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Idcirco convertar, et sumam frumentum meum in tempore suo, et vinum meum in tempore suo. Et liberabo lanam meam et linum meum, quæ operiebant ignominiam ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et nunc revelabo stultitiam ejus in oculis amatorum ejus ; et vir non eruet eam de manu mea ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et cessare faciam omne gaudium ejus, solemnitatem ejus, neomeniam ejus, sabbatum ejus, et omnia festa tempora ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et corrumpam vineam ejus, et ficum ejus, de quibus dixit : Mercedes hæ meæ sunt, quas dederunt mihi amatores mei ; et ponam eam in saltum, et comedet eam bestia agri.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et visitabo super eam dies Baalim, quibus accendebat incensum, et ornabatur in aure sua, et monili suo. Et ibat post amatores suos, et mei obliviscebatur, dicit Dominus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Propter hoc ecce ego lactabo eam, et ducam eam in solitudinem, et loquar ad cor ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et dabo ei vinitores ejus ex eodem loco, et vallem Achor, ad aperiendam spem ; et canet ibi juxta dies juventutis suæ, et juxta dies ascensionis suæ de terra Ægypti.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et erit in die illa, ait Dominus : vocabit me, Vir meus, et non vocabit me ultra Baali.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et auferam nomina Baalim de ore ejus, et non recordabitur ultra nominis eorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et percutiam cum eis fœdus in die illa, cum bestia agri, et cum volucre cæli, et cum reptili terræ ; et arcum, et gladium, et bellum conteram de terra, et dormire eos faciam fiducialiter.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et sponsabo te mihi in sempiternum ; et sponsabo te mihi in justitia, et judicio, et in misericordia, et in miserationibus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et sponsabo te mihi in fide ; et scies quia ego Dominus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et erit in die illa : exaudiam, dicit Dominus, exaudiam cælos, et illi exaudient terram.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et terra exaudiet triticum, et vinum, et oleum, et hæc exaudient Jezrahel.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et seminabo eam mihi in terra, et miserebor ejus quæ fuit Absque misericordia.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et dicam Non populo meo : Populus meus es tu ; et ipse dicet : Deus meus es tu.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hosea 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hosea 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 tex  return to my first husband: because it was better with me then than now.\"},{\"verse\":8,\"text\":\"And she did not know that I gave her corn, and wine, and oil, and multiplied her silver, and gold, which they have used in the service of Baal.\"},{\"verse\":9,\"text\":\"Therefore will I return, and take away my corn in its season, and my wine in its season, and I will set at liberty my wool, and my flax, which covered her disgrace.\"},{\"verse\":10,\"text\":\"And now I will lay open her folly in the eyes of her lovers: and no man shall deliver her out of my hand:\"},{\"verse\":11,\"text\":\"And I will cause all her mirth to cease, her solemnities, her new moons, her sabbaths, and all her festival times.\"},{\"verse\":12,\"text\":\"And I will destroy her vines, and her fig trees, of which she said: These are my rewards, which my lovers have given me: and I will make her as a forest and the beasts of the field shall devour her.\"},{\"verse\":13,\"text\":\"And I will visit upon her the days of Baalim, to whom she burnt incense, and decked herself out with her earrings, and with her jewels, and went after her lovers, and forgot me, saith the Lord.\"},{\"verse\":14,\"text\":\"Therefore, behold I will allure her, and will lead her into the wilderness: and I will speak to her heart.\"},{\"verse\":15,\"text\":\"And I will give her vinedressers out of the same place, and the valley of Achor for an opening of hope: and she shall sing there according to the days of her youth, and according to the days of her coming up out of the land of Egypt.\"},{\"verse\":16,\"text\":\"And it shall be in that day, saith the Lord: That she shall call me: My husband, and she shall call me no more Baali.\"},{\"verse\":17,\"text\":\"And I will take away the names of Baalim out of her mouth, and she shall no more remember their name.\"},{\"verse\":18,\"text\":\"And in that day I will make a covenant with them, with the beasts of the field, and with the fowls of the air, and with the creeping things of the earth: and I will destroy the bow, and the sword, and war out of the land: and I will make them sleep secure.\"},{\"verse\":19,\"text\":\"And I will espouse thee to me for ever: and I will espouse thee to me in justice, and judgment, and in mercy, and in commiserations.\"},{\"verse\":20,\"text\":\"And I will espouse thee to me in faith: and thou shalt know that I am the Lord.\"},{\"verse\":21,\"text\":\"And it shall come to pass in that day: I will hear, saith the Lord, I will hear the heavens, and they shall hear the earth.\"},{\"verse\":22,\"text\":\"And the earth shall hear the corn, and the wine, and the oil, and these shall hear Jezrahel.\"},{\"verse\":23,\"text\":\"And I will sow her unto me in the earth, and I will have mercy on her that was without mercy.\"},{\"verse\":24,\"text\":\"And I will say to that which is not my people: Thou art my people: and they shall say: Thou art my God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dicite fratribus vestris : Populus meus ; et sorori vestræ : Misericordiam consecuta.\"},{\"verse\":2,\"text\":\"Judicate matrem vestram, judicate, quoniam ipsa non uxor mea, et ego non vir ejus. Auferat fornicationes suas a facie sua, et adulteria sua de medio uberum suorum ;\"},{\"verse\":3,\"text\":\"ne forte expoliem eam nudam, et statuam eam secundum diem nativitatis suæ, et ponam eam quasi solitudinem, et statuam eam velut terram inviam, et interficiam eam siti.\"},{\"verse\":4,\"text\":\"Et filiorum illius non miserebor, quoniam filii fornicationum sunt.\"},{\"verse\":5,\"text\":\"Quia fornicata est mater eorum, confusa est quæ concepit eos ; quia dixit : Vadam post amatores meos, qui dant panes mihi, et aquas meas, lanam meam, et linum meum, oleum meum, et potum meum.\"},{\"verse\":6,\"text\":\"Propter hoc ecce ego sepiam viam tuam spinis, et sepiam eam maceria, et semitas suas non inveniet.\"},{\"verse\":7,\"text\":\"Et sequetur amatores suos, et non apprehendet eos ; et quæret eos, et non inveniet : et dicet : Vadam, et revertar ad virum meum priorem, quia bene mihi erat tunc magis quam nunc.\"},{\"verse\":8,\"text\":\"Et hæc nescivit, quia ego dedi ei frumentum, et vinum, et oleum, et argentum multiplicavi ei, et aurum, quæ fecerunt Baal.\"},{\"verse\":9,\"text\":\"Idcirco convertar, et sumam frumentum meum in tempore suo, et vinum meum in tempore suo. Et liberabo lanam meam et linum meum, quæ operiebant ignominiam ejus.\"},{\"verse\":10,\"text\":\"Et nunc revelabo stultitiam ejus in oculis amatorum ejus ; et vir non eruet eam de manu mea ;\"},{\"verse\":11,\"text\":\"et cessare faciam omne gaudium ejus, solemnitatem ejus, neomeniam ejus, sabbatum ejus, et omnia festa tempora ejus.\"},{\"verse\":12,\"text\":\"Et corrumpam vineam ejus, et ficum ejus, de quibus dixit : Mercedes hæ meæ sunt, quas dederunt mihi amatores mei ; et ponam eam in saltum, et comedet eam bestia agri.\"},{\"verse\":13,\"text\":\"Et visitabo super eam dies Baalim, quibus accendebat incensum, et ornabatur in aure sua, et monili suo. Et ibat post amatores suos, et mei obliviscebatur, dicit Dominus.\"},{\"verse\":14,\"text\":\"Propter hoc ecce ego lactabo eam, et ducam eam in solitudinem, et loquar ad cor ejus.\"},{\"verse\":15,\"text\":\"Et dabo ei vinitores ejus ex eodem loco, et vallem Achor, ad aperiendam spem ; et canet ibi juxta dies juventutis suæ, et juxta dies ascensionis suæ de terra Ægypti.\"},{\"verse\":16,\"text\":\"Et erit in die illa, ait Dominus : vocabit me, Vir meus, et non vocabit me ultra Baali.\"},{\"verse\":17,\"text\":\"Et auferam nomina Baalim de ore ejus, et non recordabitur ultra nominis eorum.\"},{\"verse\":18,\"text\":\"Et percutiam cum eis fœdus in die illa, cum bestia agri, et cum volucre cæli, et cum reptili terræ ; et arcum, et gladium, et bellum conteram de terra, et dormire eos faciam fiducialiter.\"},{\"verse\":19,\"text\":\"Et sponsabo te mihi in sempiternum ; et sponsabo te mihi in justitia, et judicio, et in misericordia, et in miserationibus.\"},{\"verse\":20,\"text\":\"Et sponsabo te mihi in fide ; et scies quia ego Dominus.\"},{\"verse\":21,\"text\":\"Et erit in die illa : exaudiam, dicit Dominus, exaudiam cælos, et illi exaudient terram.\"},{\"verse\":22,\"text\":\"Et terra exaudiet triticum, et vinum, et oleum, et hæc exaudient Jezrahel.\"},{\"verse\":23,\"text\":\"Et seminabo eam mihi in terra, et miserebor ejus quæ fuit Absque misericordia.\"},{\"verse\":24,\"text\":\"Et dicam Non populo meo : Populus meus es tu ; et ipse dicet : Deus meus es tu.\"}],\"summary\":\"Israel is justly punished for leaving God. The abundance of grace in the church of Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"HOS\",\"chapter\":1,\"label\":\"Hosea 1\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":3,\"label\":\"Hosea 3\"}}]]\n"])</script></body></html>
