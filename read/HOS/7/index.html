.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hosea<!-- --> <span class="text-stone-500">7</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->Osee</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/HOS/">About <!-- -->Hosea</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The manifold sins of Israel, and of their kings, hinder the Lord from healing them.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>When I would have healed Israel, the iniquity of Ephraim was discovered, and the wickedness of Samaria, for they have committed falsehood, and the thief is come in to steal, the robber is without.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And lest they may say in their hearts, that I remember all their wickedness: their own devices now have beset them about, they have been done before my face.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They have made the king glad with their wickedness: and the princes with their lies.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They are all adulterers, like an oven heated by the baker: the city rested a little from the mingling of the leaven, till the whole was leavened.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The day of our king, the princes began to be mad with wine: he stretched out his hand with scorners.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Because they have applied their heart like an oven, when he laid snares for them: he slept all the night baking them, in the morning he himself was heated as a flaming fire.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They were all heated like an oven, and have devoured their judges: all their kings have fallen: there is none amongst them that calleth unto me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ephraim himself is mixed among the nations: Ephraim is become as bread baked under the ashes, that is not turned.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Strangers have devoured his strength, and he knew it not: yea, grey hairs also are spread about upon him, and he is ignorant of it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the pride of Israel shall be humbled before his face: and they have not returned to the Lord their God, nor have they sought him in all these.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Ephraim is become as a dove that is decoyed, not having a heart: they called upon Egypt, they went to the Assyrians.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when they shall go, I will spread my net upon them: I will bring them down as the fowl of the air, I will strike them as their congregation hath heard.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Woe to them, for they have departed from me: they shall be wasted because they have transgressed against me: and I redeemed them: and they have spoken lies against me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they have not cried to me with their heart, but they howled in their beds: they have thought upon wheat and wine, they are departed from me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I have chastised them, and strengthened their arms: and they have imagined evil against me.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>They returned, that they might be without yoke: they became like a deceitful bow: their princes shall fall by the sword, for the rage of their tongue. This is their derision in the land of Egypt.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cum sanare vellem Israël, revelata est iniquitas Ephraim, et malitia Samariæ, quia operati sunt mendacium ; et fur ingressus est spolians, latrunculus foris.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ne forte dicant in cordibus suis, omnem malitiam eorum me recordatum, nunc circumdederunt eos adinventiones suæ : coram facie mea factæ sunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In malitia sua lætificaverunt regem, et in mendaciis suis principes.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Omnes adulterantes, quasi clibanus succensus a coquente ; quievit paululum civitas a commistione fermenti, donec fermentaretur totum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dies regis nostri : cœperunt principes furere a vino ; extendit manum suam cum illusoribus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quia applicuerunt quasi clibanum cor suum, cum insidiaretur eis ; tota nocte dormivit coquens eos : mane ipse succensus quasi ignis flammæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Omnes calefacti sunt quasi clibanus, et devoraverunt judices suos : omnes reges eorum ceciderunt ; non est qui clamat in eis ad me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ephraim in populis ipse commiscebatur ; Ephraim factus est subcinericius panis, qui non reversatur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Comederunt alieni robur ejus, et ipse nescivit ; sed et cani effusi sunt in eo, et ipse ignoravit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et humiliabitur superbia Israël in facie ejus ; nec reversi sunt ad Dominum Deum suum, et non quæsierunt eum in omnibus his.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et factus est Ephraim quasi columba seducta non habens cor. Ægyptum invocabant ; ad Assyrios abierunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et cum profecti fuerint, expandam super eos rete meum : quasi volucrem cæli detraham eos ; cædam eos secundum auditionem cœtus eorum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Væ eis, quoniam recesserunt a me ! vastabuntur, quia prævaricati sunt in me, et ego redemi eos, et ipsi locuti sunt contra me mendacia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et non clamaverunt ad me in corde suo, sed ululabant in cubilibus suis : super triticum et vinum ruminabant ; recesserunt a me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ego erudivi eos, et confortavi brachia eorum, et in me cogitaverunt malitiam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Reversi sunt ut essent absque jugo ; facti sunt quasi arcus dolosus : cadent in gladio principes eorum, a furore linguæ suæ. Ista subsannatio eorum in terra Ægypti.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HOS/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hosea 6</span></ ",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"HOS.7\",{\"bookId\":33,\"usfm\":\"HOS\",\"bookName\":\"Hosea\",\"drName\":\"Osee\",\"chapter\":7,\"totalChapters\":14,\"dra\":[{\"verse\":1,\"text\":\"When I would have healed Israel, the iniquity of Ephraim was discovered, and the wickedness of Samaria, for they have committed falsehood, and the thief is come in to steal, the robber is without.\"},{\"verse\":2,\"text\":\"And lest they may say in their hearts, that I remember all their wickedness: their own devices now have beset them about, they have been done before my face.\"},{\"verse\":3,\"text\":\"They have made the king glad with their wickedness: and the princes with their lies.\"},{\"verse\":4,\"text\":\"They are all adulterers, like an oven heated by the baker: the city rested a little from the mingling of the leaven, till the whole was leavened.\"},{\"verse\":5,\"text\":\"The day of our king, the princes began to be mad with wine: he stretched out his hand with scorners.\"},{\"verse\":6,\"text\":\"Because they have applied their heart like an oven, when he laid snares for them: he slept all the night baking them, in the morning he himself was heated as a flaming fire.\"},{\"verse\":7,\"text\":\"They were all heated like an oven, and have devoured their judges: all their kings have fallen: there is none amongst them that calleth unto me.\"},{\"verse\":8,\"text\":\"Ephraim himself is mixed among the nations: Ephraim is become as bread baked under the ashes, that is not turned.\"},{\"verse\":9,\"text\":\"Strangers have devoured his strength, and he knew it not: yea, grey hairs also are spread about upon him, and he is ignorant of it.\"},{\"verse\":10,\"text\":\"And the pride of Israel shall be humbled before his face: and they have not returned to the Lord their God, nor have they sought him in all these.\"},{\"verse\":11,\"text\":\"And Ephraim is become as a dove that is decoyed, not having a heart: they called upon Egypt, they went to the Assyrians.\"},{\"verse\":12,\"text\":\"And when they shall go, I will spread my net upon them: I will bring them down as the fowl of the air, I will strike them as their congregation hath heard.\"},{\"verse\":13,\"text\":\"Woe to them, for they have departed from me: they shall be wasted because they have transgressed against me: and I redeemed them: and they have spoken lies against me.\"},{\"verse\":14,\"text\":\"And they have not cried to me with their heart, but they howled in their beds: they have thought upon wheat and wine, they are departed from me.\"},{\"verse\":15,\"text\":\"And I have chastised them, and strengthened their arms: and they have imagined evil against me.\"},{\"verse\":16,\"text\":\"They returned, that they might be without yoke: they became like a deceitful bow: their princes shall fall by the sword, for the rage of their tongue. This is their derision in the land of Egypt.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cum sanare vellem Israël, revelata est iniquitas Ephraim, et malitia Samariæ, quia operati sunt mendacium ; et fur ingressus est spolians, latrunculus foris.\"},{\"verse\":2,\"text\":\"Et ne forte dicant in cordibus suis, omnem malitiam eorum me recordatum, nunc circumdederunt eos adinventiones suæ : coram facie mea factæ sunt.\"},{\"verse\":3,\"text\":\"In malitia sua lætificaverunt regem, et in mendaciis suis principes.\"},{\"verse\":4,\"text\":\"Omnes adulterantes, quasi clibanus succensus a coquente ; quievit paululum civitas a commistione fermenti, donec fermentaretur totum.\"},{\"verse\":5,\"text\":\"Dies regis nostri : cœperunt principes furere a vino ; extendit manum suam cum illusoribus.\"},{\"verse\":6,\"text\":\"Quia applicuerunt quasi clibanum cor suum, cum insidiaretur eis ; tota nocte dormivit coquens eos : mane ipse succensus quasi ignis flammæ.\"},{\"verse\":7,\"text\":\"Omnes calefacti sunt quasi clibanus, et devoraverunt judices suos : omnes reges eorum ceciderunt ; non est qui clamat in eis ad me.\"},{\"verse\":8,\"text\":\"Ephraim in populis ipse commiscebatur ; Ephraim factus est subcinericius panis, qui non reversatur.\"},{\"verse\":9,\"text\":\"Comederunt alieni robur ejus, et ipse nescivit ; sed et cani effusi sunt in eo, et ipse ignoravit.\"},{\"verse\":10,\"text\":\"Et humiliabitur superbia Israël in facie ejus ; nec reversi sunt ad Dominum Deum suum, et non quæsierunt eum in omnibus his.\"},{\"verse\":11,\"text\":\"Et factus est Ephraim quasi columba seducta non habens cor. Ægyptum invocabant ; ad Assyrios abierunt.\"},{\"verse\":12,\"text\":\"Et cum profecti fuerint, expandam super eos rete meum : quasi volucrem cæli detraham eos ; cædam eos secundum auditionem cœtus eorum.\"},{\"verse\":13,\"text\":\"Væ eis, quoniam recesserunt a me ! vastabuntur, quia prævaricati sunt in me, et ego redemi eos, et ipsi locuti sunt contra me mendacia.\"},{\"verse\":14,\"text\":\"Et non clamaverunt ad me in corde suo, sed ululabant in cubilibus suis : super triticum et vinum ruminabant ; recesserunt a me.\"},{\"verse\":15,\"text\":\"Et ego erudivi eos, et confortavi brachia eorum, et in me cogitaverunt malitiam.\"},{\"verse\":16,\"text\":\"Reversi sunt ut essent absque jugo ; facti sunt quasi arcus dolosus : cadent in gladio principes eorum, a furore linguæ suæ. Ista subsannatio eorum in terra Ægypti.\"}],\"summary\":\"The manifold sins of Israel, and of their kings, hinder the Lord from healing them.\",\"intro\":null,\"prev\":{\"usfm\":\"HOS\",\"chapter\":6,\"label\":\"Hosea 6\"},\"next\":{\"usfm\":\"HOS\",\"chapter\":8,\"label\":\"Hosea 8\"}}]]\n"])</script></body></html>
