s="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Lamentations<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LAM/">About <!-- -->Lamentations</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aleph. How hath the Lord covered with obscurity the daughter of Sion in his wrath! how hath he cast down from heaven to the earth the glorious one of Israel, and hath not remembered his footstool in the day of his anger.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beth. The Lord hath cast down headlong, and hath not spared, all that was beautiful in Jacob: he hath destroyed in his wrath the strong holds of the virgin of Juda, and brought them down to the ground: he hath made the kingdom unclean, and the princes thereof.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ghimel. He hath broken in his fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy: and he hath kindled in Jacob as it were a flaming fire devouring round about.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Daleth. He hath bent his bow as an enemy, he hath fixed his right hand as an adversary: and he hath killed all that was fair to behold in the tabernacle of the daughter of Sion, he hath poured out his indignation like fire.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He. The Lord is become as an enemy: he hath cast down Israel headlong, he hath overthrown all the walls thereof: he hath destroyed his strong holds, and hath multiplied in the daughter of Juda the afflicted, both men and women.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vau. And he hath destroyed his tent as a garden, he hath thrown down his tabernacle: the Lord hath caused feasts and sabbaths to be forgotten in Sion: and hath delivered up king and priest to reproach, and to the indignation of his wrath.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Zain. The Lord hath cast off his altar, he hath cursed his sanctuary: he hath delivered the walls of the towers thereof into the hand of the enemy: they have made a noise in the house of the Lord, as in the day of a solemn feast.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Heth. The Lord hath purposed to destroy the wall of the daughter of Sion: he hath stretched out his line, and hath not withdrawn his hand from destroying: and the bulwark hath mourned, and the wall hath been destroyed together.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Teth. Her gates are sunk into the ground: he hath destroyed, and broken her bars: her king and her princes are among the Gentiles: the law is no more, and her prophets have found no vision from the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jod. The ancients of the daughter of Sion sit upon the ground, they have held their peace: they have sprinkled their heads with dust, they are girded with haircloth, the virgins of Jerusalem hang down their heads to the ground.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Caph. My eyes have failed with weeping, my bowels are troubled: my liver is poured out upon the earth, for the destruction of the daughter of my people, when the children, and the sucklings, fainted away in the streets of the city.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Lamed. They said to their mothers: Where is corn and wine? when they fainted away as the wounded in the streets of the city: when they breathed out their souls in the bosoms of their mothers.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mem. To what shall I compare thee? or to what shall I liken thee, O daughter of Jerusalem? to what shall I equal thee, that I may comfort thee, O virgin daughter of Sion? for great as the sea is thy destruction: who shall heal thee?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nun. Thy prophets have seen false and foolish things for thee: and they have not laid open thy iniquity, to excite thee to penance: but they have seen for thee false revelations and banishments.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Samech. All they that passed by the way have clapped their hands at thee: they have hissed, and wagged their heads at the daughter of Jerusalem, saying: Is this the city of perfect beauty, the joy of all the earth?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Phe. All thy enemies have opened their mouth against thee: they have hissed, and gnashed with the teeth, and have said: We will swallow her up: lo, this is the day which we looked for: we have found it, we have seen it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ain. The Lord hath done that which he purposed, he hath fulfilled his word, which he commanded in the days of old: he hath destroyed, and hath not spared, and he hath caused the enemy to rejoice over thee, and hath set up the horn of thy adversaries.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sade. Their heart cried to the Lord upon the walls of the daughter of Sion: Let tears run down like a torrent day and night: give thyself no rest, and let not the apple of thy eye cease.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Coph. Arise, give praise in the night, in the beginning of the watches: pour out thy heart like water, before the face of the Lord: lift up thy hands to him for the life of thy little children, that have fainted for hunger at the top of all the streets.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Res. Behold, O Lord, and consider whom thou hast thus dealt with: shall women then eat their own fruit, their children of a span long? shall the priest and the prophet be slain in the sanctuary of the Lord?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sin. The child and the old man lie without on the ground: my virgins and my young men are fallen by the sword: thou hast slain them in the day of thy wrath: thou hast killed, and shewn them no pity.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thau. Thou hast called as to a festival, those that should terrify me round about, and there was none in the day of the wrath of the Lord that escaped and was left: those that I brought up, and nourished, my enemy hath consumed them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aleph Quomodo obtexit caligine in furore suo Dominus filiam Sion ; projecit de cælo in terram inclytam Israël, et non est recordatus scabelli pedum suorum in die furoris sui !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beth Præcipitavit Dominus, nec pepercit omnia speciosa Jacob : destruxit in furore suo munitiones virginis Juda, et dejecit in terram ; polluit regnum et principes ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ghimel Confregit in ira furoris sui omne cornu Israël ; avertit retrorsum dexteram suam a facie inimici, et succendit in Jacob quasi ignem flammæ devorantis in gyro.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Daleth Tetendit arcum suum quasi inimicus, firmavit dexteram suam quasi hostis, et occidit omne quod pulchrum erat visu in tabernaculo filiæ Sion ; effudit quasi ignem indignationem suam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He Factus est Dominus velut inimicus, præcipitavit Israël : præcipitavit omnia mœnia ejus, dissipavit munitiones ejus, et replevit in filia Juda humiliatum et humiliatam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vau Et dissipavit quasi hortum tentorium suum ; demolitus est tabernaculum suum. Oblivioni tradidit Dominus in Sion festivitatem et sabbatum ; et in opprobrium, et in indignationem furoris sui, regem et sacerdotem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Zain Repulit Dominus altare suum ; maledixit sanctificationi suæ : tradidit in manu inimici muros turrium ejus. Vocem dederunt in domo Domini sicut in die solemni.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Heth Cogitavit Dominus dissipare murum filiæ Sion ; tetendit funiculum suum, et non avertit manum suam a perditione : luxitque antemurale, et murus pariter dissipatus est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Teth Defixæ sunt in terra portæ ejus, perdidit et contrivit vectes ejus ; regem ejus et principes ejus in gentibus : non est lex, et prophetæ ejus non invenerunt visionem a Domino.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jod Sederunt in terra, conticuerunt senes filiæ Sion ; consperserunt cinere capita sua, accincti sunt ciliciis : abjecerunt in terram capita sua virgines Jerusalem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Caph Defecerunt præ lacrimis oculi mei, conturbata sunt viscera mea ; effusum est in terra jecur meum super contritione filiæ populi mei, cum deficeret parvulus et lactens in plateis oppidi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Lamed Matribus suis dixerunt : Ubi est triticum et vinum ? cum deficerent quasi vulnerati in plateis civitatis, cum exhalarent animas suas in sinu matrum suarum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mem Cui comparabo te, vel cui assimilabo te, filia Jerusalem ? cui exæquabo te, et consolabor te, virgo, filia Sion ? magna est enim velut mare contritio tua : quis medebitur tui ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nun Prophetæ tui viderunt tibi falsa et stulta ; nec aperiebant iniquitatem tuam, ut te ad pœnitentiam provocarent ; viderunt autem tibi assumptiones falsas, et ejectiones.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Samech Plauserunt super te manibus omnes transeuntes per viam ; sibilaverunt et moverunt caput suum super filiam Jerusalem : Hæccine est urbs, dicentes, perfecti decoris, gaudium universæ terræ ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Phe Aperuerunt super te os suum omnes inimici tui : sibilaverunt, et fremuerunt dentibus, et dixerunt : Devorabimus : en ista est dies quam exspectabamus ; invenimus, vidimus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ain Fecit Dominus quæ cogitavit ; complevit sermonem suum, quem præceperat a diebus antiquis : destruxit, et non pepercit, et lætificavit super te inimicum, et exaltavit cornu hostium tuorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sade Clamavit cor eorum ad Dominum super muros filiæ Sion : Deduc quasi torrentem lacrimas per diem et noctem ; non des requiem tibi, neque taceat pupilla oculi tui.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Coph Consurge, lauda in nocte, in principio vigiliarum ; effunde sicut aquam cor tuum ante conspectum Domini : leva ad eum manus tuas pro anima parvulorum tuorum, qui defecerunt in fame in capite omnium compitorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Res Vide, Domine, et considera quem vindemiaveris ita. Ergone comedent mulieres fructum suum, parvulos ad mensuram palmæ ? si occiditur in sanctuario Domini sacerdos et propheta ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sin Jacuerunt in terra foris puer et senex ; virgines meæ et juvenes mei ceciderunt in gladio : interfecisti in die furoris tui, percussisti, nec misertus es.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thau Vocasti quasi ad diem solemnem, qui terrerent me de circuitu ; et non fuit in die furoris Domini qui effugeret, et relinqueretur : quos educavi et enutrivi, inimicus meus consumpsit eos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Lamentations 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Lamentations 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-li ath bent his bow as an enemy, he hath fixed his right hand as an adversary: and he hath killed all that was fair to behold in the tabernacle of the daughter of Sion, he hath poured out his indignation like fire.\"},{\"verse\":5,\"text\":\"He. The Lord is become as an enemy: he hath cast down Israel headlong, he hath overthrown all the walls thereof: he hath destroyed his strong holds, and hath multiplied in the daughter of Juda the afflicted, both men and women.\"},{\"verse\":6,\"text\":\"Vau. And he hath destroyed his tent as a garden, he hath thrown down his tabernacle: the Lord hath caused feasts and sabbaths to be forgotten in Sion: and hath delivered up king and priest to reproach, and to the indignation of his wrath.\"},{\"verse\":7,\"text\":\"Zain. The Lord hath cast off his altar, he hath cursed his sanctuary: he hath delivered the walls of the towers thereof into the hand of the enemy: they have made a noise in the house of the Lord, as in the day of a solemn feast.\"},{\"verse\":8,\"text\":\"Heth. The Lord hath purposed to destroy the wall of the daughter of Sion: he hath stretched out his line, and hath not withdrawn his hand from destroying: and the bulwark hath mourned, and the wall hath been destroyed together.\"},{\"verse\":9,\"text\":\"Teth. Her gates are sunk into the ground: he hath destroyed, and broken her bars: her king and her princes are among the Gentiles: the law is no more, and her prophets have found no vision from the Lord.\"},{\"verse\":10,\"text\":\"Jod. The ancients of the daughter of Sion sit upon the ground, they have held their peace: they have sprinkled their heads with dust, they are girded with haircloth, the virgins of Jerusalem hang down their heads to the ground.\"},{\"verse\":11,\"text\":\"Caph. My eyes have failed with weeping, my bowels are troubled: my liver is poured out upon the earth, for the destruction of the daughter of my people, when the children, and the sucklings, fainted away in the streets of the city.\"},{\"verse\":12,\"text\":\"Lamed. They said to their mothers: Where is corn and wine? when they fainted away as the wounded in the streets of the city: when they breathed out their souls in the bosoms of their mothers.\"},{\"verse\":13,\"text\":\"Mem. To what shall I compare thee? or to what shall I liken thee, O daughter of Jerusalem? to what shall I equal thee, that I may comfort thee, O virgin daughter of Sion? for great as the sea is thy destruction: who shall heal thee?\"},{\"verse\":14,\"text\":\"Nun. Thy prophets have seen false and foolish things for thee: and they have not laid open thy iniquity, to excite thee to penance: but they have seen for thee false revelations and banishments.\"},{\"verse\":15,\"text\":\"Samech. All they that passed by the way have clapped their hands at thee: they have hissed, and wagged their heads at the daughter of Jerusalem, saying: Is this the city of perfect beauty, the joy of all the earth?\"},{\"verse\":16,\"text\":\"Phe. All thy enemies have opened their mouth against thee: they have hissed, and gnashed with the teeth, and have said: We will swallow her up: lo, this is the day which we looked for: we have found it, we have seen it.\"},{\"verse\":17,\"text\":\"Ain. The Lord hath done that which he purposed, he hath fulfilled his word, which he commanded in the days of old: he hath destroyed, and hath not spared, and he hath caused the enemy to rejoice over thee, and hath set up the horn of thy adversaries.\"},{\"verse\":18,\"text\":\"Sade. Their heart cried to the Lord upon the walls of the daughter of Sion: Let tears run down like a torrent day and night: give thyself no rest, and let not the apple of thy eye cease.\"},{\"verse\":19,\"text\":\"Coph. Arise, give praise in the night, in the beginning of the watches: pour out thy heart like water, before the face of the Lord: lift up thy hands to him for the life of thy little children, that have fainted for hunger at the top of all the streets.\"},{\"verse\":20,\"text\":\"Res. Behold, O Lord, and consider whom thou hast thus dealt with: shall women then eat their own fruit, their children of a span long? shall the priest and the prophet be slain in the sanctuary of the Lord?\"},{\"verse\":21,\"text\":\"Sin. The child and the old man lie without on the ground: my virgins and my young men are fallen by the sword: thou hast slain them in the day of thy wrath: thou hast killed, and shewn them no pity.\"},{\"verse\":22,\"text\":\"Thau. Thou hast called as to a festival, those that should terrify me round about, and there was none in the day of the wrath of the Lord that escaped and was left: those that I brought up, and nourished, my enemy hath consumed them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Aleph Quomodo obtexit caligine in furore suo Dominus filiam Sion ; projecit de cælo in terram inclytam Israël, et non est recordatus scabelli pedum suorum in die furoris sui !\"},{\"verse\":2,\"text\":\"Beth Præcipitavit Dominus, nec pepercit omnia speciosa Jacob : destruxit in furore suo munitiones virginis Juda, et dejecit in terram ; polluit regnum et principes ejus.\"},{\"verse\":3,\"text\":\"Ghimel Confregit in ira furoris sui omne cornu Israël ; avertit retrorsum dexteram suam a facie inimici, et succendit in Jacob quasi ignem flammæ devorantis in gyro.\"},{\"verse\":4,\"text\":\"Daleth Tetendit arcum suum quasi inimicus, firmavit dexteram suam quasi hostis, et occidit omne quod pulchrum erat visu in tabernaculo filiæ Sion ; effudit quasi ignem indignationem suam.\"},{\"verse\":5,\"text\":\"He Factus est Dominus velut inimicus, præcipitavit Israël : præcipitavit omnia mœnia ejus, dissipavit munitiones ejus, et replevit in filia Juda humiliatum et humiliatam.\"},{\"verse\":6,\"text\":\"Vau Et dissipavit quasi hortum tentorium suum ; demolitus est tabernaculum suum. Oblivioni tradidit Dominus in Sion festivitatem et sabbatum ; et in opprobrium, et in indignationem furoris sui, regem et sacerdotem.\"},{\"verse\":7,\"text\":\"Zain Repulit Dominus altare suum ; maledixit sanctificationi suæ : tradidit in manu inimici muros turrium ejus. Vocem dederunt in domo Domini sicut in die solemni.\"},{\"verse\":8,\"text\":\"Heth Cogitavit Dominus dissipare murum filiæ Sion ; tetendit funiculum suum, et non avertit manum suam a perditione : luxitque antemurale, et murus pariter dissipatus est.\"},{\"verse\":9,\"text\":\"Teth Defixæ sunt in terra portæ ejus, perdidit et contrivit vectes ejus ; regem ejus et principes ejus in gentibus : non est lex, et prophetæ ejus non invenerunt visionem a Domino.\"},{\"verse\":10,\"text\":\"Jod Sederunt in terra, conticuerunt senes filiæ Sion ; consperserunt cinere capita sua, accincti sunt ciliciis : abjecerunt in terram capita sua virgines Jerusalem.\"},{\"verse\":11,\"text\":\"Caph Defecerunt præ lacrimis oculi mei, conturbata sunt viscera mea ; effusum est in terra jecur meum super contritione filiæ populi mei, cum deficeret parvulus et lactens in plateis oppidi.\"},{\"verse\":12,\"text\":\"Lamed Matribus suis dixerunt : Ubi est triticum et vinum ? cum deficerent quasi vulnerati in plateis civitatis, cum exhalarent animas suas in sinu matrum suarum.\"},{\"verse\":13,\"text\":\"Mem Cui comparabo te, vel cui assimilabo te, filia Jerusalem ? cui exæquabo te, et consolabor te, virgo, filia Sion ? magna est enim velut mare contritio tua : quis medebitur tui ?\"},{\"verse\":14,\"text\":\"Nun Prophetæ tui viderunt tibi falsa et stulta ; nec aperiebant iniquitatem tuam, ut te ad pœnitentiam provocarent ; viderunt autem tibi assumptiones falsas, et ejectiones.\"},{\"verse\":15,\"text\":\"Samech Plauserunt super te manibus omnes transeuntes per viam ; sibilaverunt et moverunt caput suum super filiam Jerusalem : Hæccine est urbs, dicentes, perfecti decoris, gaudium universæ terræ ?\"},{\"verse\":16,\"text\":\"Phe Aperuerunt super te os suum omnes inimici tui : sibilaverunt, et fremuerunt dentibus, et dixerunt : Devorabimus : en ista est dies quam exspectabamus ; invenimus, vidimus.\"},{\"verse\":17,\"text\":\"Ain Fecit Dominus quæ cogitavit ; complevit sermonem suum, quem præceperat a diebus antiquis : destruxit, et non pepercit, et lætificavit super te inimicum, et exaltavit cornu hostium tuorum.\"},{\"verse\":18,\"text\":\"Sade Clamavit cor eorum ad Dominum super muros filiæ Sion : Deduc quasi torrentem lacrimas per diem et noctem ; non des requiem tibi, neque taceat pupilla oculi tui.\"},{\"verse\":19,\"text\":\"Coph Consurge, lauda in nocte, in principio vigiliarum ; effunde sicut aquam cor tuum ante conspectum Domini : leva ad eum manus tuas pro anima parvulorum tuorum, qui defecerunt in fame in capite omnium compitorum.\"},{\"verse\":20,\"text\":\"Res Vide, Domine, et considera quem vindemiaveris ita. Ergone comedent mulieres fructum suum, parvulos ad mensuram palmæ ? si occiditur in sanctuario Domini sacerdos et propheta ?\"},{\"verse\":21,\"text\":\"Sin Jacuerunt in terra foris puer et senex ; virgines meæ et juvenes mei ceciderunt in gladio : interfecisti in die furoris tui, percussisti, nec misertus es.\"},{\"verse\":22,\"text\":\"Thau Vocasti quasi ad diem solemnem, qui terrerent me de circuitu ; et non fuit in die furoris Domini qui effugeret, et relinqueretur : quos educavi et enutrivi, inimicus meus consumpsit eos.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"LAM\",\"chapter\":1,\"label\":\"Lamentations 1\"},\"next\":{\"usfm\":\"LAM\",\"chapter\":3,\"label\":\"Lamentations 3\"}}]]\n"])</script></body></html>
