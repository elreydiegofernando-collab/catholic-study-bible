 d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Lamentations<!-- --> <span class="text-stone-500">3</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aleph. I am the man that see my poverty by the rod of his indignation.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Aleph. He hath led me, and brought me into darkness, and not into light.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Aleph. Only against me he hath turned, and turned again his hand all the day.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Beth. My skin and my flesh he hath made old, he hath broken my bones.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Beth. He hath built round about me, and he hath compassed me with gall, and labour.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Beth. He hath set me in dark places as those that are dead for ever.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ghimel. He hath built against me round about, that I may not get out: he hath made my fetters heavy.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ghimel. Yea, and when I cry, and entreat, he hath shut out my prayer.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ghimel. He hath shut up my ways with square stones, he hath turned my paths upside down.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Daleth. He is become to me as a bear lying in wait: as a lion in secret places.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Daleth. He hath turned aside my paths, and hath broken me in pieces, he hath made me desolate.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Daleth. He hath bent his bow, and set me as a mark for his arrows.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He. He hath shot into my reins the daughters of his quiver.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He. I am made a derision to all my people, their song all the day long.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He. He hath filled me with bitterness, he hath inebriated me with wormwood.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vau. And he hath broken my teeth one by one, he hath fed me with ashes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vau. And my soul is removed far off from peace, I have forgotten good things.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vau. And I said: My end and my hope is perished from the Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Zain. Remember my poverty, and transgression, the wormwood and the gall.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Zain. I will be mindful and remember, and my soul shall languish within me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Zain. These things I shall think over in my heart, therefore will I hope.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Heth. They are new every morning, great is thy faithfulness.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Heth. The Lord is my portion, said my soul: therefore will I wait for him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Teth. The Lord is good to them that hope in him, to the soul that seeketh him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Teth. It is good to wait with silence for the salvation of God.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Teth. It is good for a man, when he hath borne the yoke from his youth.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Jod. He shall sit solitary, and hold his peace: because he hath taken it up upon himself.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Jod. He shall put his mouth in the dust, if so be there may be hope.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Jod. He shall give his cheek to him that striketh him, he shall be filled with reproaches.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Caph. For the Lord will not cast off for ever.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Caph. For if he hath cast off, he will also have mercy, according to the multitude of his mercies.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Caph. For he hath not willingly afflicted, nor cast off the children of men.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Lamed. To crush under his feet all the prisoners of the land,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Lamed. To turn aside the judgment of a man before the face of the most High,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Lamed. To destroy a man wrongfully in his judgment, the Lord hath not approved.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Mem. Who is he that hath commanded a thing to be done, when the Lord commandeth it not?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Mem. Shall not both evil and good proceed out of the mouth of the Highest?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Mem. Why hath a living man murmured, man suffering for his sins?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Nun. Let us search our ways, and seek, and return to the Lord.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Nun. Let us lift up our hearts with our hands to the Lord in the heavens.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Nun. We have done wickedly, and provoked thee to wrath: therefore thou art inexorable.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Samech. Thou hast covered in thy wrath, and hast struck us: thou hast killed and hast not spared.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Samech. Thou hast set a cloud before thee, that our prayer may not pass through.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Samech. Thou hast made me as an outcast, and refuse in the midst of the people.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Phe. All our enemies have opened their mouths against us.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Phe. Prophecy is become to us a fear, and a snare, and destruction.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Phe. My eye hath run down with streams of water, for the destruction of the daughter of my people.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Ain. My eye is afflicted, and hath not been quiet, because there was no rest:</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Ain. Till the Lord regarded and looked down from the heavens.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Ain. My eye hath wasted my soul because of all the daughters of my city.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Sade. My enemies have chased me and caught me like a bird, without cause.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Sade. My life is fallen into the pit, and they have laid a stone over me.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Sade. Waters have flowed over my head: I said: I am cut off.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Coph. I have called upon thy name, O Lord, from the lowest pit.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Coph. Thou hast heard my voice: turn not away thy ear from my sighs, and cries.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Coph. Thou drewest near in the day, when I called upon thee, thou saidst: Fear not.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Res. Thou hast judged, O Lord, the cause of my soul, thou the Redeemer of my life.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Res. Thou hast seen, O Lord, their iniquity against me: judge thou my judgment.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Res. Thou hast seen all their fury, and all their thoughts against me.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Sin. Thou hast heard their reproach, O Lord, all their imaginations against me.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Sin. The lips of them that rise up against me: and their devices against me all the day.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Sin. Behold their sitting down, and their rising up, I am their song.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Thau. Thou shalt render them a recompense, O Lord, according to the works of their hands.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Thau. Thou shalt give them a buckler of heart, thy labour.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Thau. Thou shalt persecute them in anger, and shalt destroy them from under the heavens, O Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aleph Ego vir videns paupertatem meam in virga indignationis ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Aleph Me minavit, et adduxit in tenebras, et non in lucem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Aleph Tantum in me vertit et convertit manum suam tota die.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Beth Vetustam fecit pellem meam et carnem meam ; contrivit ossa mea.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Beth Ædificavit in gyro meo, et circumdedit me felle et labore.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Beth In tenebrosis collocavit me, quasi mortuos sempiternos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ghimel Circumædificavit adversum me, ut non egrediar ; aggravavit compedem meum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ghimel Sed et cum clamavero, et rogavero, exclusit orationem meam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ghimel Conclusit vias meas lapidibus quadris ; semitas meas subvertit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Daleth Ursus insidians factus est mihi, leo in absconditis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Daleth Semitas meas subvertit, et confregit me ; posuit me desolatam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Daleth Tetendit arcum suum, et posuit me quasi signum ad sagittam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He Misit in renibus meis filias pharetræ suæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He Factus sum in derisum omni populo meo, canticum eorum tota die.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He Replevit me amaritudinibus ; inebriavit me absinthio.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vau Et fregit ad numerum dentes meos ; cibavit me cinere.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vau Et repulsa est a pace anima mea ; oblitus sum bonorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vau Et dixi : Periit finis meus, et spes mea a Domino.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Zain Recordare paupertatis, et transgressionis meæ, absinthii et fellis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Zain Memoria memor ero, et tabescet in me anima mea.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Zain Hæc recolens in corde meo, ideo sperabo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Heth Misericordiæ Domini, quia non sumus consumpti ; quia non defecerunt miserationes ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Heth Novi diluculo, multa est fides tua.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Heth Pars mea Dominus, dixit anima mea ; propterea exspectabo eum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Teth Bonus est Dominus sperantibus in eum, animæ quærenti illum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Teth Bonum est præstolari cum silentio salutare Dei.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Teth Bonum est viro cum portaverit jugum ab adolescentia sua.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Jod Sedebit solitarius, et tacebit, quia levavit super se.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Jod Ponet in pulvere os suum, si forte sit spes.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Jod Dabit percutienti se maxillam : saturabitur opprobriis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Caph Quia non repellet in sempiternum Dominus.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Caph Quia si abjecit, et miserebitur, secundum multitudinem misericordiarum suarum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Caph Non enim humiliavit ex corde suo et abjecit filios hominum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Lamed Ut conteret sub pedibus suis omnes vinctos terræ.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Lamed Ut declinaret judicium viri in conspectu vultus Altissimi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Lamed Ut perverteret hominem in judicio suo ; Dominus ignoravit.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Mem Quis est iste qui dixit ut fieret, Domino non jubente ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Mem Ex ore Altissimi non egredientur nec mala nec bona ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Mem Quid murmuravit homo vivens, vir pro peccatis suis ?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Nun Scrutemur vias nostras, et quæramus, et revertamur ad Dominum.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Nun Levemus corda nostra cum manibus ad Dominum in cælos.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Nun Nos inique egimus, et ad iracundiam provocavimus ; idcirco tu inexorabilis es.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Samech Operuisti in furore, et percussisti nos ; occidisti, nec pepercisti.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Samech Opposuisti nubem tibi, ne transeat oratio.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Samech Eradicationem et abjectionem posuisti me in medio populorum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Phe Aperuerunt super nos os suum omnes inimici.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Phe Formido et laqueus facta est nobis vaticinatio, et contritio.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Phe Divisiones aquarum deduxit oculus meus, in contritione filiæ populi mei.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Ain Oculus meus afflictus est, nec tacuit, eo quod non esset requies.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Ain Donec respiceret et videret Dominus de cælis.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Ain Oculus meus deprædatus est animam meam in cunctis filiabus urbis meæ.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Sade Venatione ceperunt me quasi avem inimici mei gratis.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Sade Lapsa est in lacum vita mea, et posuerunt lapidem super me.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Sade Inundaverunt aquæ super caput meum ; dixi : Perii.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Coph Invocavi nomen tuum, Domine, de lacu novissimo.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Coph Vocem meam audisti ; ne avertas aurem tuam a singultu meo et clamoribus.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Coph Appropinquasti in die quando invocavi te ; dixisti : Ne timeas.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Res Judicasti, Domine, causam animæ meæ, redemptor vitæ meæ.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Res Vidisti, Domine, iniquitatem illorum adversum me : judica judicium meum.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Res Vidisti omnem furorem, universas cogitationes eorum adversum me.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Sin Audisti opprobrium eorum, Domine, omnes cogitationes eorum adversum me.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Sin Labia insurgentium mihi, et meditationes eorum adversum me tota die.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Sin Sessionem eorum et resurrectionem eorum vide ; ego sum psalmus eorum.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Thau Redes eis vicem, Domine, juxta opera manuum suarum.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Thau Dabis eis scutum cordis, laborem tuum.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Thau Persequeris in furore, et conteres eos sub cælis, Domine.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Lamentations 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-s t get out: he hath made my fetters heavy.\"},{\"verse\":8,\"text\":\"Ghimel. Yea, and when I cry, and entreat, he hath shut out my prayer.\"},{\"verse\":9,\"text\":\"Ghimel. He hath shut up my ways with square stones, he hath turned my paths upside down.\"},{\"verse\":10,\"text\":\"Daleth. He is become to me as a bear lying in wait: as a lion in secret places.\"},{\"verse\":11,\"text\":\"Daleth. He hath turned aside my paths, and hath broken me in pieces, he hath made me desolate.\"},{\"verse\":12,\"text\":\"Daleth. He hath bent his bow, and set me as a mark for his arrows.\"},{\"verse\":13,\"text\":\"He. He hath shot into my reins the daughters of his quiver.\"},{\"verse\":14,\"text\":\"He. I am made a derision to all my people, their song all the day long.\"},{\"verse\":15,\"text\":\"He. He hath filled me with bitterness, he hath inebriated me with wormwood.\"},{\"verse\":16,\"text\":\"Vau. And he hath broken my teeth one by one, he hath fed me with ashes.\"},{\"verse\":17,\"text\":\"Vau. And my soul is removed far off from peace, I have forgotten good things.\"},{\"verse\":18,\"text\":\"Vau. And I said: My end and my hope is perished from the Lord.\"},{\"verse\":19,\"text\":\"Zain. Remember my poverty, and transgression, the wormwood and the gall.\"},{\"verse\":20,\"text\":\"Zain. I will be mindful and remember, and my soul shall languish within me.\"},{\"verse\":21,\"text\":\"Zain. These things I shall think over in my heart, therefore will I hope.\"},{\"verse\":22,\"text\":\"Heth. The mercies of the Lord that we are not consumed: because his commiserations have not failed.\"},{\"verse\":23,\"text\":\"Heth. They are new every morning, great is thy faithfulness.\"},{\"verse\":24,\"text\":\"Heth. The Lord is my portion, said my soul: therefore will I wait for him.\"},{\"verse\":25,\"text\":\"Teth. The Lord is good to them that hope in him, to the soul that seeketh him.\"},{\"verse\":26,\"text\":\"Teth. It is good to wait with silence for the salvation of God.\"},{\"verse\":27,\"text\":\"Teth. It is good for a man, when he hath borne the yoke from his youth.\"},{\"verse\":28,\"text\":\"Jod. He shall sit solitary, and hold his peace: because he hath taken it up upon himself.\"},{\"verse\":29,\"text\":\"Jod. He shall put his mouth in the dust, if so be there may be hope.\"},{\"verse\":30,\"text\":\"Jod. He shall give his cheek to him that striketh him, he shall be filled with reproaches.\"},{\"verse\":31,\"text\":\"Caph. For the Lord will not cast off for ever.\"},{\"verse\":32,\"text\":\"Caph. For if he hath cast off, he will also have mercy, according to the multitude of his mercies.\"},{\"verse\":33,\"text\":\"Caph. For he hath not willingly afflicted, nor cast off the children of men.\"},{\"verse\":34,\"text\":\"Lamed. To crush under his feet all the prisoners of the land,\"},{\"verse\":35,\"text\":\"Lamed. To turn aside the judgment of a man before the face of the most High,\"},{\"verse\":36,\"text\":\"Lamed. To destroy a man wrongfully in his judgment, the Lord hath not approved.\"},{\"verse\":37,\"text\":\"Mem. Who is he that hath commanded a thing to be done, when the Lord commandeth it not?\"},{\"verse\":38,\"text\":\"Mem. Shall not both evil and good proceed out of the mouth of the Highest?\"},{\"verse\":39,\"text\":\"Mem. Why hath a living man murmured, man suffering for his sins?\"},{\"verse\":40,\"text\":\"Nun. Let us search our ways, and seek, and return to the Lord.\"},{\"verse\":41,\"text\":\"Nun. Let us lift up our hearts with our hands to the Lord in the heavens.\"},{\"verse\":42,\"text\":\"Nun. We have done wickedly, and provoked thee to wrath: therefore thou art inexorable.\"},{\"verse\":43,\"text\":\"Samech. Thou hast covered in thy wrath, and hast struck us: thou hast killed and hast not spared.\"},{\"verse\":44,\"text\":\"Samech. Thou hast set a cloud before thee, that our prayer may not pass through.\"},{\"verse\":45,\"text\":\"Samech. Thou hast made me as an outcast, and refuse in the midst of the people.\"},{\"verse\":46,\"text\":\"Phe. All our enemies have opened their mouths against us.\"},{\"verse\":47,\"text\":\"Phe. Prophecy is become to us a fear, and a snare, and destruction.\"},{\"verse\":48,\"text\":\"Phe. My eye hath run down with streams of water, for the destruction of the daughter of my people.\"},{\"verse\":49,\"text\":\"Ain. My eye is afflicted, and hath not been quiet, because there was no rest:\"},{\"verse\":50,\"text\":\"Ain. Till the Lord regarded and looked down from the heavens.\"},{\"verse\":51,\"text\":\"Ain. My eye hath wasted my soul because of all the daughters of my city.\"},{\"verse\":52,\"text\":\"Sade. My enemies have chased me and caught me like a bird, without cause.\"},{\"verse\":53,\"text\":\"Sade. My life is fallen into the pit, and they have laid a stone over me.\"},{\"verse\":54,\"text\":\"Sade. Waters have flowed over my head: I said: I am cut off.\"},{\"verse\":55,\"text\":\"Coph. I have called upon thy name, O Lord, from the lowest pit.\"},{\"verse\":56,\"text\":\"Coph. Thou hast heard my voice: turn not away thy ear from my sighs, and cries.\"},{\"verse\":57,\"text\":\"Coph. Thou drewest near in the day, when I called upon thee, thou saidst: Fear not.\"},{\"verse\":58,\"text\":\"Res. Thou hast judged, O Lord, the cause of my soul, thou the Redeemer of my life.\"},{\"verse\":59,\"text\":\"Res. Thou hast seen, O Lord, their iniquity against me: judge thou my judgment.\"},{\"verse\":60,\"text\":\"Res. Thou hast seen all their fury, and all their thoughts against me.\"},{\"verse\":61,\"text\":\"Sin. Thou hast heard their reproach, O Lord, all their imaginations against me.\"},{\"verse\":62,\"text\":\"Sin. The lips of them that rise up against me: and their devices against me all the day.\"},{\"verse\":63,\"text\":\"Sin. Behold their sitting down, and their rising up, I am their song.\"},{\"verse\":64,\"text\":\"Thau. Thou shalt render them a recompense, O Lord, according to the works of their hands.\"},{\"verse\":65,\"text\":\"Thau. Thou shalt give them a buckler of heart, thy labour.\"},{\"verse\":66,\"text\":\"Thau. Thou shalt persecute them in anger, and shalt destroy them from under the heavens, O Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Aleph Ego vir videns paupertatem meam in virga indignationis ejus.\"},{\"verse\":2,\"text\":\"Aleph Me minavit, et adduxit in tenebras, et non in lucem.\"},{\"verse\":3,\"text\":\"Aleph Tantum in me vertit et convertit manum suam tota die.\"},{\"verse\":4,\"text\":\"Beth Vetustam fecit pellem meam et carnem meam ; contrivit ossa mea.\"},{\"verse\":5,\"text\":\"Beth Ædificavit in gyro meo, et circumdedit me felle et labore.\"},{\"verse\":6,\"text\":\"Beth In tenebrosis collocavit me, quasi mortuos sempiternos.\"},{\"verse\":7,\"text\":\"Ghimel Circumædificavit adversum me, ut non egrediar ; aggravavit compedem meum.\"},{\"verse\":8,\"text\":\"Ghimel Sed et cum clamavero, et rogavero, exclusit orationem meam.\"},{\"verse\":9,\"text\":\"Ghimel Conclusit vias meas lapidibus quadris ; semitas meas subvertit.\"},{\"verse\":10,\"text\":\"Daleth Ursus insidians factus est mihi, leo in absconditis.\"},{\"verse\":11,\"text\":\"Daleth Semitas meas subvertit, et confregit me ; posuit me desolatam.\"},{\"verse\":12,\"text\":\"Daleth Tetendit arcum suum, et posuit me quasi signum ad sagittam.\"},{\"verse\":13,\"text\":\"He Misit in renibus meis filias pharetræ suæ.\"},{\"verse\":14,\"text\":\"He Factus sum in derisum omni populo meo, canticum eorum tota die.\"},{\"verse\":15,\"text\":\"He Replevit me amaritudinibus ; inebriavit me absinthio.\"},{\"verse\":16,\"text\":\"Vau Et fregit ad numerum dentes meos ; cibavit me cinere.\"},{\"verse\":17,\"text\":\"Vau Et repulsa est a pace anima mea ; oblitus sum bonorum.\"},{\"verse\":18,\"text\":\"Vau Et dixi : Periit finis meus, et spes mea a Domino.\"},{\"verse\":19,\"text\":\"Zain Recordare paupertatis, et transgressionis meæ, absinthii et fellis.\"},{\"verse\":20,\"text\":\"Zain Memoria memor ero, et tabescet in me anima mea.\"},{\"verse\":21,\"text\":\"Zain Hæc recolens in corde meo, ideo sperabo.\"},{\"verse\":22,\"text\":\"Heth Misericordiæ Domini, quia non sumus consumpti ; quia non defecerunt miserationes ejus.\"},{\"verse\":23,\"text\":\"Heth Novi diluculo, multa est fides tua.\"},{\"verse\":24,\"text\":\"Heth Pars mea Dominus, dixit anima mea ; propterea exspectabo eum.\"},{\"verse\":25,\"text\":\"Teth Bonus est Dominus sperantibus in eum, animæ quærenti illum.\"},{\"verse\":26,\"text\":\"Teth Bonum est præstolari cum silentio salutare Dei.\"},{\"verse\":27,\"text\":\"Teth Bonum est viro cum portaverit jugum ab adolescentia sua.\"},{\"verse\":28,\"text\":\"Jod Sedebit solitarius, et tacebit, quia levavit super se.\"},{\"verse\":29,\"text\":\"Jod Ponet in pulvere os suum, si forte sit spes.\"},{\"verse\":30,\"text\":\"Jod Dabit percutienti se maxillam : saturabitur opprobriis.\"},{\"verse\":31,\"text\":\"Caph Quia non repellet in sempiternum Dominus.\"},{\"verse\":32,\"text\":\"Caph Quia si abjecit, et miserebitur, secundum multitudinem misericordiarum suarum.\"},{\"verse\":33,\"text\":\"Caph Non enim humiliavit ex corde suo et abjecit filios hominum.\"},{\"verse\":34,\"text\":\"Lamed Ut conteret sub pedibus suis omnes vinctos terræ.\"},{\"verse\":35,\"text\":\"Lamed Ut declinaret judicium viri in conspectu vultus Altissimi.\"},{\"verse\":36,\"text\":\"Lamed Ut perverteret hominem in judicio suo ; Dominus ignoravit.\"},{\"verse\":37,\"text\":\"Mem Quis est iste qui dixit ut fieret, Domino non jubente ?\"},{\"verse\":38,\"text\":\"Mem Ex ore Altissimi non egredientur nec mala nec bona ?\"},{\"verse\":39,\"text\":\"Mem Quid murmuravit homo vivens, vir pro peccatis suis ?\"},{\"verse\":40,\"text\":\"Nun Scrutemur vias nostras, et quæramus, et revertamur ad Dominum.\"},{\"verse\":41,\"text\":\"Nun Levemus corda nostra cum manibus ad Dominum in cælos.\"},{\"verse\":42,\"text\":\"Nun Nos inique egimus, et ad iracundiam provocavimus ; idcirco tu inexorabilis es.\"},{\"verse\":43,\"text\":\"Samech Operuisti in furore, et percussisti nos ; occidisti, nec pepercisti.\"},{\"verse\":44,\"text\":\"Samech Opposuisti nubem tibi, ne transeat oratio.\"},{\"verse\":45,\"text\":\"Samech Eradicationem et abjectionem posuisti me in medio populorum.\"},{\"verse\":46,\"text\":\"Phe Aperuerunt super nos os suum omnes inimici.\"},{\"verse\":47,\"text\":\"Phe Formido et laqueus facta est nobis vaticinatio, et contritio.\"},{\"verse\":48,\"text\":\"Phe Divisiones aquarum deduxit oculus meus, in contritione filiæ populi mei.\"},{\"verse\":49,\"text\":\"Ain Oculus meus afflictus est, nec tacuit, eo quod non esset requies.\"},{\"verse\":50,\"text\":\"Ain Donec respiceret et videret Dominus de cælis.\"},{\"verse\":51,\"text\":\"Ain Oculus meus deprædatus est animam meam in cunctis filiabus urbis meæ.\"},{\"verse\":52,\"text\":\"Sade Venatione ceperunt me quasi avem inimici mei gratis.\"},{\"verse\":53,\"text\":\"Sade Lapsa est in lacum vita mea, et posuerunt lapidem super me.\"},{\"verse\":54,\"text\":\"Sade Inundaverunt aquæ super caput meum ; dixi : Perii.\"},{\"verse\":55,\"text\":\"Coph Invocavi nomen tuum, Domine, de lacu novissimo.\"},{\"verse\":56,\"text\":\"Coph Vocem meam audisti ; ne avertas aurem tuam a singultu meo et clamoribus.\"},{\"verse\":57,\"text\":\"Coph Appropinquasti in die quando invocavi te ; dixisti : Ne timeas.\"},{\"verse\":58,\"text\":\"Res Judicasti, Domine, causam animæ meæ, redemptor vitæ meæ.\"},{\"verse\":59,\"text\":\"Res Vidisti, Domine, iniquitatem illorum adversum me : judica judicium meum.\"},{\"verse\":60,\"text\":\"Res Vidisti omnem furorem, universas cogitationes eorum adversum me.\"},{\"verse\":61,\"text\":\"Sin Audisti opprobrium eorum, Domine, omnes cogitationes eorum adversum me.\"},{\"verse\":62,\"text\":\"Sin Labia insurgentium mihi, et meditationes eorum adversum me tota die.\"},{\"verse\":63,\"text\":\"Sin Sessionem eorum et resurrectionem eorum vide ; ego sum psalmus eorum.\"},{\"verse\":64,\"text\":\"Thau Redes eis vicem, Domine, juxta opera manuum suarum.\"},{\"verse\":65,\"text\":\"Thau Dabis eis scutum cordis, laborem tuum.\"},{\"verse\":66,\"text\":\"Thau Persequeris in furore, et conteres eos sub cælis, Domine.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"LAM\",\"chapter\":2,\"label\":\"Lamentations 2\"},\"next\":{\"usfm\":\"LAM\",\"chapter\":4,\"label\":\"Lamentations 4\"}}]]\n"])</script></body></html>
