nged, the stones of the sanctuary are scattered in the top of every street?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beth. The noble sons of Sion, and they that were clothed with the best gold: how are they esteemed as earthen vessels, the work of the potter’s hands?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ghimel. Even the sea monsters have drawn out the breast, they have given suck to their young: the daughter of my people is cruel, like the ostrich in the desert.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Daleth. The tongue of the sucking child hath stuck to the roof of his mouth for thirst: the little ones have asked for bread, and there was none to break it unto them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He. They that were fed delicately have died in the streets: they that were brought up in scarlet have embraced the dung.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vau. And the iniquity of the daughter of my people is made greater than the sin of Sodom, which was overthrown in a moment, and hands took nothing in her.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Zain. Her Nazarites were whiter than snow, purer than milk, more ruddy than the old ivory, fairer than the sapphire.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Heth. Their face is now made blacker than coals, and they are not known in the streets: their skin hath stuck to their bones, it is withered, and is become like wood.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Teth. It was better with them that were slain by the sword, than with them that died with hunger: for these pined away being consumed for want of the fruits of the earth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jod. The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Caph. The Lord hath accomplished his wrath, he hath poured out his fierce anger: and he hath kindled a fire in Sion, and it hath devoured the foundations thereof.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Lamed. The kings of the earth, and all the inhabitants of the world would not have believed, that the adversary and the enemy should enter in by the gates of Jerusalem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mem. For the sins of her prophets, and the iniquities of her priests, that have shed the blood of the just in the midst of her.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nun. They have wandered as blind men in the streets, they were defiled with blood: and when they could not help walking in it, they held up their skirts.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Samech. Depart you that are defiled, they cried out to them: Depart, get ye hence, touch not: for they quarrelled, and being removed, they said among the Gentiles: He will no more dwell among them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Phe. The face of the Lord hath divided them, he will no more regard them: they respected not the persons of the priests, neither had they pity on the ancient.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ain. While we were yet standing, our eyes failed, expecting help for us in vain, when we looked attentively towards a nation that was not able to save.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sade. Our steps have slipped in the way of our streets, our end draweth near: our days are fulfilled, for our end is come.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Coph. Our persecutors were swifter than the eagles of the air: they pursued us upon the mountains, they lay in wait for us in the wilderness.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Res. The breath of our mouth, Christ the Lord, is taken in our sins: to whom we said: Under thy shadow we shall live among the Gentiles.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sin. Rejoice, and be glad, O daughter of Edom, that dwellest in the land of Hus: to thee also shall the cup come, thou shalt be made drunk, and naked.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thau. Thy iniquity is accomplished, O daughter of Sion, he will no more carry thee away into captivity: he hath visited thy iniquity, O daughter of Edom, he hath discovered thy sins.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aleph Quomodo obscuratum est aurum, mutatus est color optimus ! dispersi sunt lapides sanctuarii in capite omnium platearum !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Beth Filii Sion inclyti, et amicti auro primo : quomodo reputati sunt in vasa testea, opus manuum figuli !</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ghimel Sed et lamiæ nudaverunt mammam, lactaverunt catulos suos : filia populi mei crudelis quasi struthio in deserto.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Daleth Adhæsit lingua lactentis ad palatum ejus in siti ; parvuli petierunt panem, et non erat qui frangeret eis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He Qui vescebantur voluptuose, interierunt in viis ; qui nutriebantur in croceis, amplexati sunt stercora.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vau Et major effecta est iniquitas filiæ populi mei peccato Sodomorum, quæ subversa est in momento, et non ceperunt in ea manus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Zain Candidiores Nazaræi ejus nive, nitidiores lacte, rubicundiores ebore antiquo, sapphiro pulchriores.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Heth Denigrata est super carbones facies eorum et non sunt cogniti in plateis ; adhæsit cutis eorum ossibus : aruit, et facta est quasi lignum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Teth Melius fuit occisis gladio quam interfectis fame, quoniam isti extabuerunt consumpti a sterilitate terræ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jod Manus mulierum misericordium coxerunt filios suos ; facti sunt cibus earum in contritione filiæ populi mei.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Caph Complevit Dominus furorem suum, effudit iram indignationis suæ : et succendit ignem in Sion, et devoravit fundamenta ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Lamed Non crediderunt reges terræ, et universi habitatores orbis, quoniam ingrederetur hostis et inimicus per portas Jerusalem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mem Propter peccata prophetarum ejus, et iniquitates sacerdotum ejus, qui effuderunt in medio ejus sanguinem justorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nun Erraverunt cæci in plateis, polluti sunt in sanguine ; cumque non possent, tenuerunt lacinias suas.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Samech Recedite polluti, clamaverunt eis ; recedite, abite, nolite tangere : jurgati quippe sunt, et commoti dixerunt inter gentes : Non addet ultra ut habitet in eis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Phe Facies Domini divisit eos, non addet ut respiciat eos ; facies sacerdotum non erubuerunt, neque senum miserti sunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ain Cum adhuc subsisteremus, defecerunt oculi nostri ad auxilium nostrum vanum ; cum respiceremus attenti ad gentem quæ salvare non poterat.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sade Lubricaverunt vestigia nostra in itinere platearum nostrarum ; appropinquavit finis noster, completi sunt dies nostri, quia venit finis noster.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Coph Velociores fuerunt persecutores nostri aquilis cæli ; super montes persecuti sunt nos, in deserto insidiati sunt nobis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Res Spiritus oris nostri, christus Dominus, captus est in peccatis nostris, cui diximus : In umbra tua vivemus in gentibus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sin Gaude et lætare, filia Edom, quæ habitas in terra Hus ! ad te quoque perveniet calix : inebriaberis, atque nudaberis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thau Completa est iniquitas tua, filia Sion : non addet ultra ut transmigret te. Visitavit iniquitatem tuam, filia Edom ; discooperuit peccata tua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Lamentations 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Lamentations 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->5<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Lamentations 3" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bibl ],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LAM.4\",{\"bookId\":29,\"usfm\":\"LAM\",\"bookName\":\"Lamentations\",\"drName\":\"Lamentations\",\"chapter\":4,\"totalChapters\":5,\"dra\":[{\"verse\":1,\"text\":\"Aleph. How is the gold become dim, the finest colour is changed, the stones of the sanctuary are scattered in the top of every street?\"},{\"verse\":2,\"text\":\"Beth. The noble sons of Sion, and they that were clothed with the best gold: how are they esteemed as earthen vessels, the work of the potter’s hands?\"},{\"verse\":3,\"text\":\"Ghimel. Even the sea monsters have drawn out the breast, they have given suck to their young: the daughter of my people is cruel, like the ostrich in the desert.\"},{\"verse\":4,\"text\":\"Daleth. The tongue of the sucking child hath stuck to the roof of his mouth for thirst: the little ones have asked for bread, and there was none to break it unto them.\"},{\"verse\":5,\"text\":\"He. They that were fed delicately have died in the streets: they that were brought up in scarlet have embraced the dung.\"},{\"verse\":6,\"text\":\"Vau. And the iniquity of the daughter of my people is made greater than the sin of Sodom, which was overthrown in a moment, and hands took nothing in her.\"},{\"verse\":7,\"text\":\"Zain. Her Nazarites were whiter than snow, purer than milk, more ruddy than the old ivory, fairer than the sapphire.\"},{\"verse\":8,\"text\":\"Heth. Their face is now made blacker than coals, and they are not known in the streets: their skin hath stuck to their bones, it is withered, and is become like wood.\"},{\"verse\":9,\"text\":\"Teth. It was better with them that were slain by the sword, than with them that died with hunger: for these pined away being consumed for want of the fruits of the earth.\"},{\"verse\":10,\"text\":\"Jod. The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people.\"},{\"verse\":11,\"text\":\"Caph. The Lord hath accomplished his wrath, he hath poured out his fierce anger: and he hath kindled a fire in Sion, and it hath devoured the foundations thereof.\"},{\"verse\":12,\"text\":\"Lamed. The kings of the earth, and all the inhabitants of the world would not have believed, that the adversary and the enemy should enter in by the gates of Jerusalem.\"},{\"verse\":13,\"text\":\"Mem. For the sins of her prophets, and the iniquities of her priests, that have shed the blood of the just in the midst of her.\"},{\"verse\":14,\"text\":\"Nun. They have wandered as blind men in the streets, they were defiled with blood: and when they could not help walking in it, they held up their skirts.\"},{\"verse\":15,\"text\":\"Samech. Depart you that are defiled, they cried out to them: Depart, get ye hence, touch not: for they quarrelled, and being removed, they said among the Gentiles: He will no more dwell among them.\"},{\"verse\":16,\"text\":\"Phe. The face of the Lord hath divided them, he will no more regard them: they respected not the persons of the priests, neither had they pity on the ancient.\"},{\"verse\":17,\"text\":\"Ain. While we were yet standing, our eyes failed, expecting help for us in vain, when we looked attentively towards a nation that was not able to save.\"},{\"verse\":18,\"text\":\"Sade. Our steps have slipped in the way of our streets, our end draweth near: our days are fulfilled, for our end is come.\"},{\"verse\":19,\"text\":\"Coph. Our persecutors were swifter than the eagles of the air: they pursued us upon the mountains, they lay in wait for us in the wilderness.\"},{\"verse\":20,\"text\":\"Res. The breath of our mouth, Christ the Lord, is taken in our sins: to whom we said: Under thy shadow we shall live among the Gentiles.\"},{\"verse\":21,\"text\":\"Sin. Rejoice, and be glad, O daughter of Edom, that dwellest in the land of Hus: to thee also shall the cup come, thou shalt be made drunk, and naked.\"},{\"verse\":22,\"text\":\"Thau. Thy iniquity is accomplished, O daughter of Sion, he will no more carry thee away into captivity: he hath visited thy iniquity, O daughter of Edom, he hath discovered thy sins.\"}],\"vul\":[{\"verse\":1,\"text\":\"Aleph Quomodo obscuratum est aurum, mutatus est color optimus ! dispersi sunt lapides sanctuarii in capite omnium platearum !\"},{\"verse\":2,\"text\":\"Beth Filii Sion inclyti, et amicti auro primo : quomodo reputati sunt in vasa testea, opus manuum figuli !\"},{\"verse\":3,\"text\":\"Ghimel Sed et lamiæ nudaverunt mammam, lactaverunt catulos suos : filia populi mei crudelis quasi struthio in deserto.\"},{\"verse\":4,\"text\":\"Daleth Adhæsit lingua lactentis ad palatum ejus in siti ; parvuli petierunt panem, et non erat qui frangeret eis.\"},{\"verse\":5,\"text\":\"He Qui vescebantur voluptuose, interierunt in viis ; qui nutriebantur in croceis, amplexati sunt stercora.\"},{\"verse\":6,\"text\":\"Vau Et major effecta est iniquitas filiæ populi mei peccato Sodomorum, quæ subversa est in momento, et non ceperunt in ea manus.\"},{\"verse\":7,\"text\":\"Zain Candidiores Nazaræi ejus nive, nitidiores lacte, rubicundiores ebore antiquo, sapphiro pulchriores.\"},{\"verse\":8,\"text\":\"Heth Denigrata est super carbones facies eorum et non sunt cogniti in plateis ; adhæsit cutis eorum ossibus : aruit, et facta est quasi lignum.\"},{\"verse\":9,\"text\":\"Teth Melius fuit occisis gladio quam interfectis fame, quoniam isti extabuerunt consumpti a sterilitate terræ.\"},{\"verse\":10,\"text\":\"Jod Manus mulierum misericordium coxerunt filios suos ; facti sunt cibus earum in contritione filiæ populi mei.\"},{\"verse\":11,\"text\":\"Caph Complevit Dominus furorem suum, effudit iram indignationis suæ : et succendit ignem in Sion, et devoravit fundamenta ejus.\"},{\"verse\":12,\"text\":\"Lamed Non crediderunt reges terræ, et universi habitatores orbis, quoniam ingrederetur hostis et inimicus per portas Jerusalem.\"},{\"verse\":13,\"text\":\"Mem Propter peccata prophetarum ejus, et iniquitates sacerdotum ejus, qui effuderunt in medio ejus sanguinem justorum.\"},{\"verse\":14,\"text\":\"Nun Erraverunt cæci in plateis, polluti sunt in sanguine ; cumque non possent, tenuerunt lacinias suas.\"},{\"verse\":15,\"text\":\"Samech Recedite polluti, clamaverunt eis ; recedite, abite, nolite tangere : jurgati quippe sunt, et commoti dixerunt inter gentes : Non addet ultra ut habitet in eis.\"},{\"verse\":16,\"text\":\"Phe Facies Domini divisit eos, non addet ut respiciat eos ; facies sacerdotum non erubuerunt, neque senum miserti sunt.\"},{\"verse\":17,\"text\":\"Ain Cum adhuc subsisteremus, defecerunt oculi nostri ad auxilium nostrum vanum ; cum respiceremus attenti ad gentem quæ salvare non poterat.\"},{\"verse\":18,\"text\":\"Sade Lubricaverunt vestigia nostra in itinere platearum nostrarum ; appropinquavit finis noster, completi sunt dies nostri, quia venit finis noster.\"},{\"verse\":19,\"text\":\"Coph Velociores fuerunt persecutores nostri aquilis cæli ; super montes persecuti sunt nos, in deserto insidiati sunt nobis.\"},{\"verse\":20,\"text\":\"Res Spiritus oris nostri, christus Dominus, captus est in peccatis nostris, cui diximus : In umbra tua vivemus in gentibus.\"},{\"verse\":21,\"text\":\"Sin Gaude et lætare, filia Edom, quæ habitas in terra Hus ! ad te quoque perveniet calix : inebriaberis, atque nudaberis.\"},{\"verse\":22,\"text\":\"Thau Completa est iniquitas tua, filia Sion : non addet ultra ut transmigret te. Visitavit iniquitatem tuam, filia Edom ; discooperuit peccata tua.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"LAM\",\"chapter\":3,\"label\":\"Lamentations 3\"},\"next\":{\"usfm\":\"LAM\",\"chapter\":5,\"label\":\"Lamentations 5\"}}]]\n"])</script></body></html>
