s widows.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>We have drunk our water for money: we have bought our wood.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>We were dragged by the necks, we were weary and no rest was given us.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>We have given our hand to Egypt, and to the Assyrians, that we might be satisfied with bread.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Our fathers have sinned, and are not: and we have borne their iniquities.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Servants have ruled over us: there was none to redeem us out of their hand.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>We fetched our bread at the peril of our lives, because of the sword in the desert.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Our skin was burnt as an oven, by reason of the violence of the famine.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>They oppressed the women in Sion, and the virgins in the cities of Juda.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The princes were hanged up by their hand: they did not respect the persons of the ancients.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They abused the young men indecently: and the children fell under the wood.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The ancients have ceased from the gates: the young men from the choir of the singers.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The joy of our heart is ceased, our dancing is turned into mourning.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The crown is fallen from our head: woe to us, because we have sinned.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Therefore is our heart sorrowful, therefore are our eyes become dim.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For mount Sion, because it is destroyed, foxes have walked upon it.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But thou, O Lord, shalt remain for ever, thy throne from generation to generation.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Why wilt thou forget us for ever? why wilt thou forsake us for a long time?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Convert us, O Lord, to thee, and we shall be converted: renew our days, as from the beginning.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But thou hast utterly rejected us, thou art exceedingly angry with us.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Recordare, Domine, quid acciderit nobis ; intuere et respice opprobrium nostrum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hæreditas nostra versa est ad alienos, domus nostræ ad extraneos.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pupilli facti sumus absque patre, matres nostræ quasi viduæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Aquam nostram pecunia bibimus ; ligna nostra pretio comparavimus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cervicibus nostris minabamur, lassis non dabatur requies.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ægypto dedimus manum et Assyriis, ut saturaremur pane.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Patres nostri peccaverunt, et non sunt : et nos iniquitates eorum portavimus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Servi dominati sunt nostri : non fuit qui redimeret de manu eorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In animabus nostris afferebamus panem nobis, a facie gladii in deserto.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pellis nostra quasi clibanus exusta est, a facie tempestatum famis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mulieres in Sion humiliaverunt, et virgines in civitatibus Juda.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Principes manu suspensi sunt ; facies senum non erubuerunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Adolescentibus impudice abusi sunt, et pueri in ligno corruerunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Senes defecerunt de portis, juvenes de choro psallentium.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Defecit gaudium cordis nostri ; versus est in luctum chorus noster.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cecidit corona capitis nostri : væ nobis, quia peccavimus !</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Propterea mœstum factum est cor nostrum ; ideo contenebrati sunt oculi nostri,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>propter montem Sion quia disperiit ; vulpes ambulaverunt in eo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Tu autem, Domine, in æternum permanebis, solium tuum in generationem et generationem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quare in perpetuum oblivisceris nostri, derelinques nos in longitudine dierum ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Converte nos, Domine, ad te, et convertemur ; innova dies nostros, sicut a principio.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sed projiciens repulisti nos : iratus es contra nos vehementer.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LAM/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Lamentations 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Baruch 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" \"text\":\"They oppressed the women in Sion, and the virgins in the cities of Juda.\"},{\"verse\":12,\"text\":\"The princes were hanged up by their hand: they did not respect the persons of the ancients.\"},{\"verse\":13,\"text\":\"They abused the young men indecently: and the children fell under the wood.\"},{\"verse\":14,\"text\":\"The ancients have ceased from the gates: the young men from the choir of the singers.\"},{\"verse\":15,\"text\":\"The joy of our heart is ceased, our dancing is turned into mourning.\"},{\"verse\":16,\"text\":\"The crown is fallen from our head: woe to us, because we have sinned.\"},{\"verse\":17,\"text\":\"Therefore is our heart sorrowful, therefore are our eyes become dim.\"},{\"verse\":18,\"text\":\"For mount Sion, because it is destroyed, foxes have walked upon it.\"},{\"verse\":19,\"text\":\"But thou, O Lord, shalt remain for ever, thy throne from generation to generation.\"},{\"verse\":20,\"text\":\"Why wilt thou forget us for ever? why wilt thou forsake us for a long time?\"},{\"verse\":21,\"text\":\"Convert us, O Lord, to thee, and we shall be converted: renew our days, as from the beginning.\"},{\"verse\":22,\"text\":\"But thou hast utterly rejected us, thou art exceedingly angry with us.\"}],\"vul\":[{\"verse\":1,\"text\":\"Recordare, Domine, quid acciderit nobis ; intuere et respice opprobrium nostrum.\"},{\"verse\":2,\"text\":\"Hæreditas nostra versa est ad alienos, domus nostræ ad extraneos.\"},{\"verse\":3,\"text\":\"Pupilli facti sumus absque patre, matres nostræ quasi viduæ.\"},{\"verse\":4,\"text\":\"Aquam nostram pecunia bibimus ; ligna nostra pretio comparavimus.\"},{\"verse\":5,\"text\":\"Cervicibus nostris minabamur, lassis non dabatur requies.\"},{\"verse\":6,\"text\":\"Ægypto dedimus manum et Assyriis, ut saturaremur pane.\"},{\"verse\":7,\"text\":\"Patres nostri peccaverunt, et non sunt : et nos iniquitates eorum portavimus.\"},{\"verse\":8,\"text\":\"Servi dominati sunt nostri : non fuit qui redimeret de manu eorum.\"},{\"verse\":9,\"text\":\"In animabus nostris afferebamus panem nobis, a facie gladii in deserto.\"},{\"verse\":10,\"text\":\"Pellis nostra quasi clibanus exusta est, a facie tempestatum famis.\"},{\"verse\":11,\"text\":\"Mulieres in Sion humiliaverunt, et virgines in civitatibus Juda.\"},{\"verse\":12,\"text\":\"Principes manu suspensi sunt ; facies senum non erubuerunt.\"},{\"verse\":13,\"text\":\"Adolescentibus impudice abusi sunt, et pueri in ligno corruerunt.\"},{\"verse\":14,\"text\":\"Senes defecerunt de portis, juvenes de choro psallentium.\"},{\"verse\":15,\"text\":\"Defecit gaudium cordis nostri ; versus est in luctum chorus noster.\"},{\"verse\":16,\"text\":\"Cecidit corona capitis nostri : væ nobis, quia peccavimus !\"},{\"verse\":17,\"text\":\"Propterea mœstum factum est cor nostrum ; ideo contenebrati sunt oculi nostri,\"},{\"verse\":18,\"text\":\"propter montem Sion quia disperiit ; vulpes ambulaverunt in eo.\"},{\"verse\":19,\"text\":\"Tu autem, Domine, in æternum permanebis, solium tuum in generationem et generationem.\"},{\"verse\":20,\"text\":\"Quare in perpetuum oblivisceris nostri, derelinques nos in longitudine dierum ?\"},{\"verse\":21,\"text\":\"Converte nos, Domine, ad te, et convertemur ; innova dies nostros, sicut a principio.\"},{\"verse\":22,\"text\":\"Sed projiciens repulisti nos : iratus es contra nos vehementer.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"LAM\",\"chapter\":4,\"label\":\"Lamentations 4\"},\"next\":{\"usfm\":\"BAR\",\"chapter\":1,\"label\":\"Baruch 1\"}}]]\n"])</script></body></html>
