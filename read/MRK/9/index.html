<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Mark 9 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MRK/">About <!-- -->Mark</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ is transfigured. He casts out the dumb spirit. He teaches humility and to avoid scandal.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And after six days, Jesus taketh with him Peter and James and John, and leadeth them up into an high mountain apart by themselves, and was transfigured before them.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And his garments became shining and exceeding white as snow, so as no fuller upon earth can make white.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And there appeared to them Elias with Moses: and they were talking with Jesus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Peter answering, said to Jesus: Rabbi, it is good for us to be here. And let us make three tabernacles, one for thee, and one for Moses, and one for Elias.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For he knew not what he said: for they were struck with fear.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And there was a cloud overshadowing them. And a voice came out of the cloud, saying: This is my most beloved Son. Hear ye him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And immediately looking about, they saw no man any more, but Jesus only with them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And as they came down from the mountain, he charged them not to tell any man what things they had seen, till the Son of man shall be risen again from the dead.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they kept the word to themselves; questioning together what that should mean, when he shall be risen from the dead.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they asked him, saying: Why then do the Pharisees and scribes say that Elias must come first?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who answering, said to them: Elias, when he shall come first, shall restore all things; and as it is written of the Son of man that he must suffer many things and be despised.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But I say to you that Elias also is come (and they have done to him whatsoever they would), as it is written of him.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And coming to his disciples he saw a great multitude about them and the scribes disputing with them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And presently all the people, seeing Jesus, were astonished and struck with fear: and running to him, they saluted him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he asked them: What do you question about among you?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And one of the multitude, answering, said: Master, I have brought my son to thee, having a dumb spirit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Who, wheresoever he taketh him, dasheth him: and he foameth and gnasheth with the teeth and pineth away. And I spoke to thy disciples to cast him out: and they could not.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Who answering them, said: O incredulous generation, how long shall I be with you? How long shall I suffer you? Bring him unto me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they brought him. And when he had seen him, immediately the spirit troubled him and being thrown down upon the ground, he rolled about foaming.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he asked his father: How long time is it since this hath happened unto him? But he said: From his infancy.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And oftentimes hath he cast him into the fire and into the waters to destroy him. But if thou canst do any thing, help us, having compassion on us.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Jesus saith to him: If thou canst believe, all things are possible to him that believeth.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And immediately the father of the boy crying out, with tears said: I do believe, Lord. Help my unbelief.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And when Jesus saw the multitude running together, he threatened the unclean spirit, saying to him: Deaf and dumb spirit, I command thee, go out of him and enter not any more into him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And crying out and greatly tearing him, he went our of him. And he became as dead, so that many said: He is dead.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But Jesus taking him by the hand, lifted him up. And he arose.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when he was come into the house, his disciples secretly asked him: Why could not we cast him out?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said to them: This kind can go out by nothing, but by prayer and fasting.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And departing from thence, they passed through Galilee: and he would not that any man should know it.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he taught his disciples and said to them: The Son of man shall be betrayed into the hands of men, and they shall kill him; and after that he is killed, he shall rise again the third day.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But they understood not the word: and they were afraid to ask him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they came to Capharnaum. And when they were in the house, he asked them: What did you treat of in the way?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But they held their peace, for in the way they had disputed among themselves, which of them should be the greatest.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And sitting down, he called the twelve and saith to them: If any man desire to be first, he shall be the last of all and be minister of all.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And taking a child, he set him in the midst of them. Whom when he had embraced, he saith to them:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Whosoever shall receive one such child as this in my name receiveth me. And whosoever shall receive me receiveth not me but him that sent me.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>John answered him, saying: Master, we saw one casting out devils in thy name, who followeth not us: and we forbade him.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But Jesus said: Do not forbid him. For there is no man that doth a miracle in my name and can soon speak ill of me.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>For he that is not against you is for you.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>For whosoever shall give you to drink a cup of water in my name, because you belong to Christ: amen I say to you, he shall not lose his reward.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And whosoever shall scandalize one of these little ones that believe in me: it were better for him that a millstone were hanged about his neck and he were cast into the sea.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And if thy hand scandalize thee, cut it off: it is better for thee to enter into life, maimed, than having two hands to go into hell, into unquenchable fire:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Where their worm dieth not, and the fire is not extinguished.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And if thy foot scandalize thee, cut it off: it is better for thee to enter lame into life everlasting than having two feet to be cast into the hell of unquenchable fire:</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Where their worm dieth not, and the fire is not extinguished.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And if thy eye scandalize thee, pluck it out: it is better for thee with one eye to enter into the kingdom of God than having two eyes to be cast into the hell of fire:</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Where their worm dieth not, and the fire is not extinguished.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>For every one shall be salted with fire: and every victim shall be salted with salt.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Salt is good. But if the salt become unsavoury, wherewith will you season it? Have salt in you: and have peace among you.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et post dies sex assumit Jesus Petrum, et Jacobum, et Joannem, et ducit illos in montem excelsum seorsum solos, et transfiguratus est coram ipsis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et vestimenta ejus facta sunt splendentia, et candida nimis velut nix, qualia fullo non potest super terram candida facere.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et apparuit illis Elias cum Moyse : et erant loquentes cum Jesu.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et respondens Petrus, ait Jesu : Rabbi, bonum est nos hic esse : et faciamus tria tabernacula, tibi unum, et Moysi unum, et Eliæ unum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non enim sciebat quid diceret : erant enim timore exterriti.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et facta est nubes obumbrans eos : et venit vox de nube, dicens : Hic est Filius meus carissimus : audite illum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et statim circumspicientes, neminem amplius viderunt, nisi Jesum tantum secum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et descendentibus illis de monte, præcepit illis ne cuiquam quæ vidissent, narrarent : nisi cum Filius hominis a mortuis resurrexerit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et verbum continuerunt apud se : conquirentes quid esset, cum a mortuis resurrexerit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et interrogabant eum, dicentes : Quid ergo dicunt pharisæi et scribæ, quia Eliam oportet venire primum ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui respondens, ait illis : Elias cum venerit primo, restituet omnia : et quomodo scriptum est in Filium hominis, ut multa patiatur et contemnatur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Sed dico vobis quia et Elias venit (et fecerunt illi quæcumque voluerunt) sicut scriptum est de eo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et veniens ad discipulos suos, vidit turbam magnam circa eos, et scribas conquirentes cum illis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et confestim omnis populus videns Jesum, stupefactus est, et expaverunt, et accurrentes salutabant eum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et interrogavit eos : Quid inter vos conquiritis ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et respondens unus de turba, dixit : Magister, attuli filium meum ad te habentem spiritum mutum :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>qui ubicumque eum apprehenderit, allidit illum, et spumat, et stridet dentibus, et arescit : et dixi discipulis tuis ut ejicerent illum, et non potuerunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui respondens eis, dixit : O generatio incredula, quamdiu apud vos ero ? quamdiu vos patiar ? afferte illum ad me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et attulerunt eum. Et cum vidisset eum, statim spiritus conturbavit illum : et elisus in terram, volutabatur spumans.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et interrogavit patrem ejus : Quantum temporis est ex quo ei hoc accidit ? At ille ait : Ab infantia :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et frequenter eum in ignem, et in aquas misit ut eum perderet : sed si quid potes, adjuva nos, misertus nostri.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Jesus autem ait illi : Si potes credere, omnia possibilia sunt credenti.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et continuo exclamans pater pueri, cum lacrimis aiebat : Credo, Domine ; adjuva incredulitatem meam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et cum videret Jesus concurrentem turbam, comminatus est spiritui immundo, dicens illi : Surde et mute spiritus, ego præcipio tibi, exi ab eo : et amplius ne introëas in eum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et exclamans, et multum discerpens eum, exiit ab eo, et factus est sicut mortuus, ita ut multi dicerent : Quia mortuus est.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Jesus autem tenens manum ejus elevavit eum, et surrexit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et cum introisset in domum, discipuli ejus secreto interrogabant eum : Quare nos non potuimus ejicere eum ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et dixit illis : Hoc genus in nullo potest exire, nisi in oratione et jejunio.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et inde profecti prætergrediebantur Galilæam : nec volebat quemquam scire.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Docebat autem discipulos suos, et dicebat illis : Quoniam Filius hominis tradetur in manus hominum, et occident eum, et occisus tertia die resurget.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>At illi ignorabant verbum : et timebant interrogare eum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et venerunt Capharnaum. Qui cum domi essent, interrogabat eos : Quid in via tractabatis ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>At illi tacebant : siquidem in via inter se disputaverunt : quis eorum major esset.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et residens vocavit duodecim, et ait illis : Si quis vult primus esse, erit omnium novissimus, et omnium minister.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et accipiens puerum, statuit eum in medio eorum : quem cum complexus esset, ait illis :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quisquis unum ex hujusmodi pueris receperit in nomine meo, me recipit : et quicumque me susceperit, non me suscipit, sed eum qui misit me.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Respondit illi Joannes, dicens : Magister, vidimus quemdam in nomine tuo ejicientem dæmonia, qui non sequitur nos, et prohibuimus eum.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesus autem ait : Nolite prohibere eum : nemo est enim qui faciat virtutem in nomine meo, et possit cito male loqui de me :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>qui enim non est adversum vos, pro vobis est.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Quisquis enim potum dederit vobis calicem aquæ in nomine meo, quia Christi estis : amen dico vobis, non perdet mercedem suam.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et quisquis scandalizaverit unum ex his pusillis credentibus in me : bonum est ei magis si circumdaretur mola asinaria collo ejus, et in mare mitteretur.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et si scandalizaverit te manus tua, abscide illam : bonum est tibi debilem introire in vitam, quam duas manus habentem ire in gehennam, in ignem inextinguibilem,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>ubi vermis eorum non moritur, et ignis non extinguitur.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et si pes tuus te scandalizat, amputa illum : bonum est tibi claudum introire in vitam æternam, quam duos pedes habentem mitti in gehennam ignis inextinguibilis,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>ubi vermis eorum non moritur, et ignis non extinguitur.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Quod si oculus tuus scandalizat te, ejice eum : bonum est tibi luscum introire in regnum Dei, quam duos oculos habentem mitti in gehennam ignis,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>ubi vermis eorum non moritur, et ignis non extinguitur.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Omnis enim igne salietur, et omnis victima sale salietur.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Bonum est sal : quod si sal insulsum fuerit, in quo illud condietis ? Habete in vobis sal, et pacem habete inter vos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Mark 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Mark 8" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:bord x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MRK.9\",{\"bookId\":48,\"usfm\":\"MRK\",\"bookName\":\"Mark\",\"drName\":\"Mark\",\"chapter\":9,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And after six days, Jesus taketh with him Peter and James and John, and leadeth them up into an high mountain apart by themselves, and was transfigured before them.\"},{\"verse\":2,\"text\":\"And his garments became shining and exceeding white as snow, so as no fuller upon earth can make white.\"},{\"verse\":3,\"text\":\"And there appeared to them Elias with Moses: and they were talking with Jesus.\"},{\"verse\":4,\"text\":\"And Peter answering, said to Jesus: Rabbi, it is good for us to be here. And let us make three tabernacles, one for thee, and one for Moses, and one for Elias.\"},{\"verse\":5,\"text\":\"For he knew not what he said: for they were struck with fear.\"},{\"verse\":6,\"text\":\"And there was a cloud overshadowing them. And a voice came out of the cloud, saying: This is my most beloved Son. Hear ye him.\"},{\"verse\":7,\"text\":\"And immediately looking about, they saw no man any more, but Jesus only with them.\"},{\"verse\":8,\"text\":\"And as they came down from the mountain, he charged them not to tell any man what things they had seen, till the Son of man shall be risen again from the dead.\"},{\"verse\":9,\"text\":\"And they kept the word to themselves; questioning together what that should mean, when he shall be risen from the dead.\"},{\"verse\":10,\"text\":\"And they asked him, saying: Why then do the Pharisees and scribes say that Elias must come first?\"},{\"verse\":11,\"text\":\"Who answering, said to them: Elias, when he shall come first, shall restore all things; and as it is written of the Son of man that he must suffer many things and be despised.\"},{\"verse\":12,\"text\":\"But I say to you that Elias also is come (and they have done to him whatsoever they would), as it is written of him.\"},{\"verse\":13,\"text\":\"And coming to his disciples he saw a great multitude about them and the scribes disputing with them.\"},{\"verse\":14,\"text\":\"And presently all the people, seeing Jesus, were astonished and struck with fear: and running to him, they saluted him.\"},{\"verse\":15,\"text\":\"And he asked them: What do you question about among you?\"},{\"verse\":16,\"text\":\"And one of the multitude, answering, said: Master, I have brought my son to thee, having a dumb spirit.\"},{\"verse\":17,\"text\":\"Who, wheresoever he taketh him, dasheth him: and he foameth and gnasheth with the teeth and pineth away. And I spoke to thy disciples to cast him out: and they could not.\"},{\"verse\":18,\"text\":\"Who answering them, said: O incredulous generation, how long shall I be with you? How long shall I suffer you? Bring him unto me.\"},{\"verse\":19,\"text\":\"And they brought him. And when he had seen him, immediately the spirit troubled him and being thrown down upon the ground, he rolled about foaming.\"},{\"verse\":20,\"text\":\"And he asked his father: How long time is it since this hath happened unto him? But he said: From his infancy.\"},{\"verse\":21,\"text\":\"And oftentimes hath he cast him into the fire and into the waters to destroy him. But if thou canst do any thing, help us, having compassion on us.\"},{\"verse\":22,\"text\":\"And Jesus saith to him: If thou canst believe, all things are possible to him that believeth.\"},{\"verse\":23,\"text\":\"And immediately the father of the boy crying out, with tears said: I do believe, Lord. Help my unbelief.\"},{\"verse\":24,\"text\":\"And when Jesus saw the multitude running together, he threatened the unclean spirit, saying to him: Deaf and dumb spirit, I command thee, go out of him and enter not any more into him.\"},{\"verse\":25,\"text\":\"And crying out and greatly tearing him, he went our of him. And he became as dead, so that many said: He is dead.\"},{\"verse\":26,\"text\":\"But Jesus taking him by the hand, lifted him up. And he arose.\"},{\"verse\":27,\"text\":\"And when he was come into the house, his disciples secretly asked him: Why could not we cast him out?\"},{\"verse\":28,\"text\":\"And he said to them: This kind can go out by nothing, but by prayer and fasting.\"},{\"verse\":29,\"text\":\"And departing from thence, they passed through Galilee: and he would not that any man should know it.\"},{\"verse\":30,\"text\":\"And he taught his disciples and said to them: The Son of man shall be betrayed into the hands of men, and they shall kill him; and after that he is killed, he shall rise again the third day.\"},{\"verse\":31,\"text\":\"But they understood not the word: and they were afraid to ask him.\"},{\"verse\":32,\"text\":\"And they came to Capharnaum. And when they were in the house, he asked them: What did you treat of in the way?\"},{\"verse\":33,\"text\":\"But they held their peace, for in the way they had disputed among themselves, which of them should be the greatest.\"},{\"verse\":34,\"text\":\"And sitting down, he called the twelve and saith to them: If any man desire to be first, he shall be the last of all and be minister of all.\"},{\"verse\":35,\"text\":\"And taking a child, he set him in the midst of them. Whom when he had embraced, he saith to them:\"},{\"verse\":36,\"text\":\"Whosoever shall receive one such child as this in my name receiveth me. And whosoever shall receive me receiveth not me but him that sent me.\"},{\"verse\":37,\"text\":\"John answered him, saying: Master, we saw one casting out devils in thy name, who followeth not us: and we forbade him.\"},{\"verse\":38,\"text\":\"But Jesus said: Do not forbid him. For there is no man that doth a miracle in my name and can soon speak ill of me.\"},{\"verse\":39,\"text\":\"For he that is not against you is for you.\"},{\"verse\":40,\"text\":\"For whosoever shall give you to drink a cup of water in my name, because you belong to Christ: amen I say to you, he shall not lose his reward.\"},{\"verse\":41,\"text\":\"And whosoever shall scandalize one of these little ones that believe in me: it were better for him that a millstone were hanged about his neck and he were cast into the sea.\"},{\"verse\":42,\"text\":\"And if thy hand scandalize thee, cut it off: it is better for thee to enter into life, maimed, than having two hands to go into hell, into unquenchable fire:\"},{\"verse\":43,\"text\":\"Where their worm dieth not, and the fire is not extinguished.\"},{\"verse\":44,\"text\":\"And if thy foot scandalize thee, cut it off: it is better for thee to enter lame into life everlasting than having two feet to be cast into the hell of unquenchable fire:\"},{\"verse\":45,\"text\":\"Where their worm dieth not, and the fire is not extinguished.\"},{\"verse\":46,\"text\":\"And if thy eye scandalize thee, pluck it out: it is better for thee with one eye to enter into the kingdom of God than having two eyes to be cast into the hell of fire:\"},{\"verse\":47,\"text\":\"Where their worm dieth not, and the fire is not extinguished.\"},{\"verse\":48,\"text\":\"For every one shall be salted with fire: and every victim shall be salted with salt.\"},{\"verse\":49,\"text\":\"Salt is good. But if the salt become unsavoury, wherewith will you season it? Have salt in you: and have peace among you.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et post dies sex assumit Jesus Petrum, et Jacobum, et Joannem, et ducit illos in montem excelsum seorsum solos, et transfiguratus est coram ipsis.\"},{\"verse\":2,\"text\":\"Et vestimenta ejus facta sunt splendentia, et candida nimis velut nix, qualia fullo non potest super terram candida facere.\"},{\"verse\":3,\"text\":\"Et apparuit illis Elias cum Moyse : et erant loquentes cum Jesu.\"},{\"verse\":4,\"text\":\"Et respondens Petrus, ait Jesu : Rabbi, bonum est nos hic esse : et faciamus tria tabernacula, tibi unum, et Moysi unum, et Eliæ unum.\"},{\"verse\":5,\"text\":\"Non enim sciebat quid diceret : erant enim timore exterriti.\"},{\"verse\":6,\"text\":\"Et facta est nubes obumbrans eos : et venit vox de nube, dicens : Hic est Filius meus carissimus : audite illum.\"},{\"verse\":7,\"text\":\"Et statim circumspicientes, neminem amplius viderunt, nisi Jesum tantum secum.\"},{\"verse\":8,\"text\":\"Et descendentibus illis de monte, præcepit illis ne cuiquam quæ vidissent, narrarent : nisi cum Filius hominis a mortuis resurrexerit.\"},{\"verse\":9,\"text\":\"Et verbum continuerunt apud se : conquirentes quid esset, cum a mortuis resurrexerit.\"},{\"verse\":10,\"text\":\"Et interrogabant eum, dicentes : Quid ergo dicunt pharisæi et scribæ, quia Eliam oportet venire primum ?\"},{\"verse\":11,\"text\":\"Qui respondens, ait illis : Elias cum venerit primo, restituet omnia : et quomodo scriptum est in Filium hominis, ut multa patiatur et contemnatur.\"},{\"verse\":12,\"text\":\"Sed dico vobis quia et Elias venit (et fecerunt illi quæcumque voluerunt) sicut scriptum est de eo.\"},{\"verse\":13,\"text\":\"Et veniens ad discipulos suos, vidit turbam magnam circa eos, et scribas conquirentes cum illis.\"},{\"verse\":14,\"text\":\"Et confestim omnis populus videns Jesum, stupefactus est, et expaverunt, et accurrentes salutabant eum.\"},{\"verse\":15,\"text\":\"Et interrogavit eos : Quid inter vos conquiritis ?\"},{\"verse\":16,\"text\":\"Et respondens unus de turba, dixit : Magister, attuli filium meum ad te habentem spiritum mutum :\"},{\"verse\":17,\"text\":\"qui ubicumque eum apprehenderit, allidit illum, et spumat, et stridet dentibus, et arescit : et dixi discipulis tuis ut ejicerent illum, et non potuerunt.\"},{\"verse\":18,\"text\":\"Qui respondens eis, dixit : O generatio incredula, quamdiu apud vos ero ? quamdiu vos patiar ? afferte illum ad me.\"},{\"verse\":19,\"text\":\"Et attulerunt eum. Et cum vidisset eum, statim spiritus conturbavit illum : et elisus in terram, volutabatur spumans.\"},{\"verse\":20,\"text\":\"Et interrogavit patrem ejus : Quantum temporis est ex quo ei hoc accidit ? At ille ait : Ab infantia :\"},{\"verse\":21,\"text\":\"et frequenter eum in ignem, et in aquas misit ut eum perderet : sed si quid potes, adjuva nos, misertus nostri.\"},{\"verse\":22,\"text\":\"Jesus autem ait illi : Si potes credere, omnia possibilia sunt credenti.\"},{\"verse\":23,\"text\":\"Et continuo exclamans pater pueri, cum lacrimis aiebat : Credo, Domine ; adjuva incredulitatem meam.\"},{\"verse\":24,\"text\":\"Et cum videret Jesus concurrentem turbam, comminatus est spiritui immundo, dicens illi : Surde et mute spiritus, ego præcipio tibi, exi ab eo : et amplius ne introëas in eum.\"},{\"verse\":25,\"text\":\"Et exclamans, et multum discerpens eum, exiit ab eo, et factus est sicut mortuus, ita ut multi dicerent : Quia mortuus est.\"},{\"verse\":26,\"text\":\"Jesus autem tenens manum ejus elevavit eum, et surrexit.\"},{\"verse\":27,\"text\":\"Et cum introisset in domum, discipuli ejus secreto interrogabant eum : Quare nos non potuimus ejicere eum ?\"},{\"verse\":28,\"text\":\"Et dixit illis : Hoc genus in nullo potest exire, nisi in oratione et jejunio.\"},{\"verse\":29,\"text\":\"Et inde profecti prætergrediebantur Galilæam : nec volebat quemquam scire.\"},{\"verse\":30,\"text\":\"Docebat autem discipulos suos, et dicebat illis : Quoniam Filius hominis tradetur in manus hominum, et occident eum, et occisus tertia die resurget.\"},{\"verse\":31,\"text\":\"At illi ignorabant verbum : et timebant interrogare eum.\"},{\"verse\":32,\"text\":\"Et venerunt Capharnaum. Qui cum domi essent, interrogabat eos : Quid in via tractabatis ?\"},{\"verse\":33,\"text\":\"At illi tacebant : siquidem in via inter se disputaverunt : quis eorum major esset.\"},{\"verse\":34,\"text\":\"Et residens vocavit duodecim, et ait illis : Si quis vult primus esse, erit omnium novissimus, et omnium minister.\"},{\"verse\":35,\"text\":\"Et accipiens puerum, statuit eum in medio eorum : quem cum complexus esset, ait illis :\"},{\"verse\":36,\"text\":\"Quisquis unum ex hujusmodi pueris receperit in nomine meo, me recipit : et quicumque me susceperit, non me suscipit, sed eum qui misit me.\"},{\"verse\":37,\"text\":\"Respondit illi Joannes, dicens : Magister, vidimus quemdam in nomine tuo ejicientem dæmonia, qui non sequitur nos, et prohibuimus eum.\"},{\"verse\":38,\"text\":\"Jesus autem ait : Nolite prohibere eum : nemo est enim qui faciat virtutem in nomine meo, et possit cito male loqui de me :\"},{\"verse\":39,\"text\":\"qui enim non est adversum vos, pro vobis est.\"},{\"verse\":40,\"text\":\"Quisquis enim potum dederit vobis calicem aquæ in nomine meo, quia Christi estis : amen dico vobis, non perdet mercedem suam.\"},{\"verse\":41,\"text\":\"Et quisquis scandalizaverit unum ex his pusillis credentibus in me : bonum est ei magis si circumdaretur mola asinaria collo ejus, et in mare mitteretur.\"},{\"verse\":42,\"text\":\"Et si scandalizaverit te manus tua, abscide illam : bonum est tibi debilem introire in vitam, quam duas manus habentem ire in gehennam, in ignem inextinguibilem,\"},{\"verse\":43,\"text\":\"ubi vermis eorum non moritur, et ignis non extinguitur.\"},{\"verse\":44,\"text\":\"Et si pes tuus te scandalizat, amputa illum : bonum est tibi claudum introire in vitam æternam, quam duos pedes habentem mitti in gehennam ignis inextinguibilis,\"},{\"verse\":45,\"text\":\"ubi vermis eorum non moritur, et ignis non extinguitur.\"},{\"verse\":46,\"text\":\"Quod si oculus tuus scandalizat te, ejice eum : bonum est tibi luscum introire in regnum Dei, quam duos oculos habentem mitti in gehennam ignis,\"},{\"verse\":47,\"text\":\"ubi vermis eorum non moritur, et ignis non extinguitur.\"},{\"verse\":48,\"text\":\"Omnis enim igne salietur, et omnis victima sale salietur.\"},{\"verse\":49,\"text\":\"Bonum est sal : quod si sal insulsum fuerit, in quo illud condietis ? Habete in vobis sal, et pacem habete inter vos.\"}],\"summary\":\"Christ is transfigured. He casts out the dumb spirit. He teaches humility and to avoid scandal.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":8,\"label\":\"Mark 8\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":10,\"label\":\"Mark 10\"}}]]\n"])</script></body></html>
