20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">4</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parable of the sower. Christ stills the tempest at sea.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And again he began to teach by the sea side; and a great multitude was gathered together unto him, so that he went up into a ship and sat in the sea: and all the multitude was upon the land by the sea side.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he taught them many things in parables, and said unto them in his doctrine:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hear ye: Behold, the sower went out to sow.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And whilst he sowed, some fell by the way side, and the birds of the air came and ate it up.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And other some fell upon stony ground, where it had not much earth; and it shot up immediately, because it had no depth of earth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when the sun was risen, it was scorched; and because it had no root, it withered away.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And some fell among thorns; and the thorns grew up, and choked it, and it yielded no fruit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And some fell upon good ground; and brought forth fruit that grew up, and increased and yielded, one thirty, another sixty, and another a hundred.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he said: He that hath ears to hear, let him hear.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when he was alone, the twelve that were with him asked him the parable.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he said to them: To you it is given to know the mystery of the kingdom of God: but to them that are without, all things are done in parables:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>That seeing they may see, and not perceive; and hearing they may hear, and not understand; lest at any time they should be converted, and their sins should be forgiven them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he saith to them: Are you ignorant of this, parable? and how shall you know all parables?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He that soweth, soweth the word.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And these are they by the way side, where the word is sown, and as soon as they have heard, immediately Satan cometh and taketh away the word that was sown in their hearts.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And these likewise are they that are sown on the stony ground: who when they have heard the word, immediately receive it with joy.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they have no root in themselves, but are only for a time: and then when tribulation and persecution ariseth for the word they are presently scandalized.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And others there are who are sown among thorns: these are they that hear the word,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the cares of the world, and the deceitfulness of riches, and the lusts after other things entering in choke the word, and it is made fruitless.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And these are they who are sown upon the good ground, who hear the word, and receive it, and yield fruit, the one thirty, another sixty, and another a hundred.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he said to them: Doth a candle come in to be put under a bushel, or under a bed? and not to be set on a candlestick?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For there is nothing hid, which shall not be made manifest: neither was it made secret, but that it may come abroad.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If any man have ears to hear, let him hear.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he said to them: Take heed what you hear. In what measure you shall mete, it shall be measured to you again, and more shall be given to you.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For he that hath, to him shall be given: and he that hath not, that also which he hath shall be taken away from him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he said: So is the kingdom of God, as if a man should cast seed into the earth,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And should sleep, and rise, night and day, and the seed should spring, and grow up whilst he knoweth not.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For the earth of itself bringeth forth fruit, first the blade, then the ear, afterwards the full corn in the ear.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he said: To what shall we liken the kingdom of God? or to what parable shall we compare it?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>It is as a grain of mustard seed: which when it is sown in the earth, is less than all the seeds that are in the earth:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when it is sown, it groweth up, and becometh greater than all herbs, and shooteth out great branches, so that the birds of the air may dwell under the shadow thereof.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And with many such parables, he spoke to them the word, according as they were able to hear.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And without parable he did not speak unto them; but apart, he explained all things to his disciples.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And he saith to them that day, when evening was come: Let us pass over to the other side.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And sending away the multitude, they take him even as he was in the ship: and there were other ships with him.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And there arose a great storm of wind, and the waves beat into the ship, so that the ship was filled.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he was in the hinder part of the ship, sleeping upon a pillow; and they awake him, and say to him: Master, doth, it not concern thee that we perish?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And rising up, he rebuked the wind, and said to the sea: Peace, be still. And the wind ceased: and there was made a great calm.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And he said to them: Why are you fearful? have you not faith yet? And they feared exceedingly: and they said one to another: Who is this (thinkest thou) that both wind and sea obey him?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et iterum cœpit docere ad mare : et congregata est ad eum turba multa, ita ut navim ascendens sederet in mari, et omnis turba circa mare super terram erat :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et docebat eos in parabolis multa, et dicebat illis in doctrina sua :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Audite : ecce exiit seminans ad seminandum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dum seminat, aliud cecidit circa viam, et venerunt volucres cæli, et comederunt illud.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Aliud vero cecidit super petrosa, ubi non habuit terram multam : et statim exortum est, quoniam non habebat altitudinem terræ :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et quando exortus est sol, exæstuavit : et eo quod non habebat radicem, exaruit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et aliud cecidit in spinas : et ascenderunt spinæ, et suffocaverunt illud, et fructum non dedit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et aliud cecidit in terram bonam : et dabat fructum ascendentem et crescentem, et afferebat unum triginta, unum sexaginta, et unum centum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et dicebat : Qui habet aures audiendi, audiat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et cum esset singularis, interrogaverunt eum hi qui cum eo erant duodecim, parabolam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et dicebat eis : Vobis datum est nosse mysterium regni Dei : illis autem, qui foris sunt, in parabolis omnia fiunt :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ut videntes videant, et non videant : et audientes audiant, et non intelligant : nequando convertantur, et dimittantur eis peccata.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et ait illis : Nescitis parabolam hanc ? Et quomodo omnes parabolas cognoscetis ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui seminat, verbum seminat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hi autem sunt, qui circa viam, ubi seminatur verbum, et cum audierint, confestim venit Satanas, et aufert verbum, quod seminatum est in cordibus eorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et hi sunt similiter, qui super petrosa seminantur : qui cum audierint verbum, statim cum gaudio accipiunt illud :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et non habent radicem in se, sed temporales sunt : deinde orta tribulatione et persecutione propter verbum, confestim scandalizantur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et alii sunt qui in spinas seminantur : hi sunt qui verbum audiunt,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et ærumnæ sæculi, et deceptio divitiarum, et circa reliqua concupiscentiæ introëuntes suffocant verbum, et sine fructu efficitur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et hi sunt qui super terram bonam seminati sunt, qui audiunt verbum, et suscipiunt, et fructificant, unum triginta, unum sexaginta, et unum centum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et dicebat illis : Numquid venit lucerna ut sub modio ponatur, aut sub lecto ? nonne ut super candelabrum ponatur ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non est enim aliquid absconditum, quod non manifestetur : nec factum est occultum, sed ut in palam veniat.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si quis habet aures audiendi, audiat.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et dicebat illis : Videte quid audiatis. In qua mensura mensi fueritis, remetietur vobis, et adjicietur vobis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui enim habet, dabitur illi : et qui non habet, etiam quod habet auferetur ab eo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et dicebat : Sic est regnum Dei, quemadmodum si homo jaciat sementem in terram,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et dormiat, et exsurgat nocte et die, et semen germinet, et increscat dum nescit ille.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ultro enim terra fructificat, primum herbam, deinde spicam, deinde plenum frumentum in spica.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et cum produxerit fructus, statim mittit falcem, quoniam adest messis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et dicebat : Cui assimilabimus regnum Dei ? aut cui parabolæ comparabimus illud ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sicut granum sinapis, quod cum seminatum fuerit in terra, minus est omnibus seminibus, quæ sunt in terra :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et cum seminatum fuerit, ascendit, et fit majus omnibus oleribus, et facit ramos magnos, ita ut possint sub umbra ejus aves cæli habitare.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et talibus multis parabolis loquebatur eis verbum, prout poterant audire :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sine parabola autem non loquebatur eis : seorsum autem discipulis suis disserebat omnia.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et ait illis in illa die, cum sero esset factum : Transeamus contra.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dimittentes turbam, assumunt eum ita ut erat in navi : et aliæ naves erant cum illo.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et facta est procella magna venti, et fluctus mittebat in navim, ita ut impleretur navis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et erat ipse in puppi super cervical dormiens : et excitant eum, et dicunt illi : Magister, non ad te pertinet, quia perimus ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et exsurgens comminatus est vento, et dixit mari : Tace, obmutesce. Et cessavit ventus : et facta est tranquillitas magna.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et ait illis : Quid timidi estis ? necdum habetis fidem ? et timuerunt timore magno, et dicebant ad alterutrum : Quis, putas, est iste, quia et ventus et mare obediunt ei ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Mark 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Mark 3" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><button type="button" aria-label="Mark 4. Choose another bo titude was gathered together unto him, so that he went up into a ship and sat in the sea: and all the multitude was upon the land by the sea side.\"},{\"verse\":2,\"text\":\"And he taught them many things in parables, and said unto them in his doctrine:\"},{\"verse\":3,\"text\":\"Hear ye: Behold, the sower went out to sow.\"},{\"verse\":4,\"text\":\"And whilst he sowed, some fell by the way side, and the birds of the air came and ate it up.\"},{\"verse\":5,\"text\":\"And other some fell upon stony ground, where it had not much earth; and it shot up immediately, because it had no depth of earth.\"},{\"verse\":6,\"text\":\"And when the sun was risen, it was scorched; and because it had no root, it withered away.\"},{\"verse\":7,\"text\":\"And some fell among thorns; and the thorns grew up, and choked it, and it yielded no fruit.\"},{\"verse\":8,\"text\":\"And some fell upon good ground; and brought forth fruit that grew up, and increased and yielded, one thirty, another sixty, and another a hundred.\"},{\"verse\":9,\"text\":\"And he said: He that hath ears to hear, let him hear.\"},{\"verse\":10,\"text\":\"And when he was alone, the twelve that were with him asked him the parable.\"},{\"verse\":11,\"text\":\"And he said to them: To you it is given to know the mystery of the kingdom of God: but to them that are without, all things are done in parables:\"},{\"verse\":12,\"text\":\"That seeing they may see, and not perceive; and hearing they may hear, and not understand; lest at any time they should be converted, and their sins should be forgiven them.\"},{\"verse\":13,\"text\":\"And he saith to them: Are you ignorant of this, parable? and how shall you know all parables?\"},{\"verse\":14,\"text\":\"He that soweth, soweth the word.\"},{\"verse\":15,\"text\":\"And these are they by the way side, where the word is sown, and as soon as they have heard, immediately Satan cometh and taketh away the word that was sown in their hearts.\"},{\"verse\":16,\"text\":\"And these likewise are they that are sown on the stony ground: who when they have heard the word, immediately receive it with joy.\"},{\"verse\":17,\"text\":\"And they have no root in themselves, but are only for a time: and then when tribulation and persecution ariseth for the word they are presently scandalized.\"},{\"verse\":18,\"text\":\"And others there are who are sown among thorns: these are they that hear the word,\"},{\"verse\":19,\"text\":\"And the cares of the world, and the deceitfulness of riches, and the lusts after other things entering in choke the word, and it is made fruitless.\"},{\"verse\":20,\"text\":\"And these are they who are sown upon the good ground, who hear the word, and receive it, and yield fruit, the one thirty, another sixty, and another a hundred.\"},{\"verse\":21,\"text\":\"And he said to them: Doth a candle come in to be put under a bushel, or under a bed? and not to be set on a candlestick?\"},{\"verse\":22,\"text\":\"For there is nothing hid, which shall not be made manifest: neither was it made secret, but that it may come abroad.\"},{\"verse\":23,\"text\":\"If any man have ears to hear, let him hear.\"},{\"verse\":24,\"text\":\"And he said to them: Take heed what you hear. In what measure you shall mete, it shall be measured to you again, and more shall be given to you.\"},{\"verse\":25,\"text\":\"For he that hath, to him shall be given: and he that hath not, that also which he hath shall be taken away from him.\"},{\"verse\":26,\"text\":\"And he said: So is the kingdom of God, as if a man should cast seed into the earth,\"},{\"verse\":27,\"text\":\"And should sleep, and rise, night and day, and the seed should spring, and grow up whilst he knoweth not.\"},{\"verse\":28,\"text\":\"For the earth of itself bringeth forth fruit, first the blade, then the ear, afterwards the full corn in the ear.\"},{\"verse\":29,\"text\":\"And when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come.\"},{\"verse\":30,\"text\":\"And he said: To what shall we liken the kingdom of God? or to what parable shall we compare it?\"},{\"verse\":31,\"text\":\"It is as a grain of mustard seed: which when it is sown in the earth, is less than all the seeds that are in the earth:\"},{\"verse\":32,\"text\":\"And when it is sown, it groweth up, and becometh greater than all herbs, and shooteth out great branches, so that the birds of the air may dwell under the shadow thereof.\"},{\"verse\":33,\"text\":\"And with many such parables, he spoke to them the word, according as they were able to hear.\"},{\"verse\":34,\"text\":\"And without parable he did not speak unto them; but apart, he explained all things to his disciples.\"},{\"verse\":35,\"text\":\"And he saith to them that day, when evening was come: Let us pass over to the other side.\"},{\"verse\":36,\"text\":\"And sending away the multitude, they take him even as he was in the ship: and there were other ships with him.\"},{\"verse\":37,\"text\":\"And there arose a great storm of wind, and the waves beat into the ship, so that the ship was filled.\"},{\"verse\":38,\"text\":\"And he was in the hinder part of the ship, sleeping upon a pillow; and they awake him, and say to him: Master, doth, it not concern thee that we perish?\"},{\"verse\":39,\"text\":\"And rising up, he rebuked the wind, and said to the sea: Peace, be still. And the wind ceased: and there was made a great calm.\"},{\"verse\":40,\"text\":\"And he said to them: Why are you fearful? have you not faith yet? And they feared exceedingly: and they said one to another: Who is this (thinkest thou) that both wind and sea obey him?\"}],\"vul\":[{\"verse\":1,\"text\":\"Et iterum cœpit docere ad mare : et congregata est ad eum turba multa, ita ut navim ascendens sederet in mari, et omnis turba circa mare super terram erat :\"},{\"verse\":2,\"text\":\"et docebat eos in parabolis multa, et dicebat illis in doctrina sua :\"},{\"verse\":3,\"text\":\"Audite : ecce exiit seminans ad seminandum.\"},{\"verse\":4,\"text\":\"Et dum seminat, aliud cecidit circa viam, et venerunt volucres cæli, et comederunt illud.\"},{\"verse\":5,\"text\":\"Aliud vero cecidit super petrosa, ubi non habuit terram multam : et statim exortum est, quoniam non habebat altitudinem terræ :\"},{\"verse\":6,\"text\":\"et quando exortus est sol, exæstuavit : et eo quod non habebat radicem, exaruit.\"},{\"verse\":7,\"text\":\"Et aliud cecidit in spinas : et ascenderunt spinæ, et suffocaverunt illud, et fructum non dedit.\"},{\"verse\":8,\"text\":\"Et aliud cecidit in terram bonam : et dabat fructum ascendentem et crescentem, et afferebat unum triginta, unum sexaginta, et unum centum.\"},{\"verse\":9,\"text\":\"Et dicebat : Qui habet aures audiendi, audiat.\"},{\"verse\":10,\"text\":\"Et cum esset singularis, interrogaverunt eum hi qui cum eo erant duodecim, parabolam.\"},{\"verse\":11,\"text\":\"Et dicebat eis : Vobis datum est nosse mysterium regni Dei : illis autem, qui foris sunt, in parabolis omnia fiunt :\"},{\"verse\":12,\"text\":\"ut videntes videant, et non videant : et audientes audiant, et non intelligant : nequando convertantur, et dimittantur eis peccata.\"},{\"verse\":13,\"text\":\"Et ait illis : Nescitis parabolam hanc ? Et quomodo omnes parabolas cognoscetis ?\"},{\"verse\":14,\"text\":\"Qui seminat, verbum seminat.\"},{\"verse\":15,\"text\":\"Hi autem sunt, qui circa viam, ubi seminatur verbum, et cum audierint, confestim venit Satanas, et aufert verbum, quod seminatum est in cordibus eorum.\"},{\"verse\":16,\"text\":\"Et hi sunt similiter, qui super petrosa seminantur : qui cum audierint verbum, statim cum gaudio accipiunt illud :\"},{\"verse\":17,\"text\":\"et non habent radicem in se, sed temporales sunt : deinde orta tribulatione et persecutione propter verbum, confestim scandalizantur.\"},{\"verse\":18,\"text\":\"Et alii sunt qui in spinas seminantur : hi sunt qui verbum audiunt,\"},{\"verse\":19,\"text\":\"et ærumnæ sæculi, et deceptio divitiarum, et circa reliqua concupiscentiæ introëuntes suffocant verbum, et sine fructu efficitur.\"},{\"verse\":20,\"text\":\"Et hi sunt qui super terram bonam seminati sunt, qui audiunt verbum, et suscipiunt, et fructificant, unum triginta, unum sexaginta, et unum centum.\"},{\"verse\":21,\"text\":\"Et dicebat illis : Numquid venit lucerna ut sub modio ponatur, aut sub lecto ? nonne ut super candelabrum ponatur ?\"},{\"verse\":22,\"text\":\"Non est enim aliquid absconditum, quod non manifestetur : nec factum est occultum, sed ut in palam veniat.\"},{\"verse\":23,\"text\":\"Si quis habet aures audiendi, audiat.\"},{\"verse\":24,\"text\":\"Et dicebat illis : Videte quid audiatis. In qua mensura mensi fueritis, remetietur vobis, et adjicietur vobis.\"},{\"verse\":25,\"text\":\"Qui enim habet, dabitur illi : et qui non habet, etiam quod habet auferetur ab eo.\"},{\"verse\":26,\"text\":\"Et dicebat : Sic est regnum Dei, quemadmodum si homo jaciat sementem in terram,\"},{\"verse\":27,\"text\":\"et dormiat, et exsurgat nocte et die, et semen germinet, et increscat dum nescit ille.\"},{\"verse\":28,\"text\":\"Ultro enim terra fructificat, primum herbam, deinde spicam, deinde plenum frumentum in spica.\"},{\"verse\":29,\"text\":\"Et cum produxerit fructus, statim mittit falcem, quoniam adest messis.\"},{\"verse\":30,\"text\":\"Et dicebat : Cui assimilabimus regnum Dei ? aut cui parabolæ comparabimus illud ?\"},{\"verse\":31,\"text\":\"Sicut granum sinapis, quod cum seminatum fuerit in terra, minus est omnibus seminibus, quæ sunt in terra :\"},{\"verse\":32,\"text\":\"et cum seminatum fuerit, ascendit, et fit majus omnibus oleribus, et facit ramos magnos, ita ut possint sub umbra ejus aves cæli habitare.\"},{\"verse\":33,\"text\":\"Et talibus multis parabolis loquebatur eis verbum, prout poterant audire :\"},{\"verse\":34,\"text\":\"sine parabola autem non loquebatur eis : seorsum autem discipulis suis disserebat omnia.\"},{\"verse\":35,\"text\":\"Et ait illis in illa die, cum sero esset factum : Transeamus contra.\"},{\"verse\":36,\"text\":\"Et dimittentes turbam, assumunt eum ita ut erat in navi : et aliæ naves erant cum illo.\"},{\"verse\":37,\"text\":\"Et facta est procella magna venti, et fluctus mittebat in navim, ita ut impleretur navis.\"},{\"verse\":38,\"text\":\"Et erat ipse in puppi super cervical dormiens : et excitant eum, et dicunt illi : Magister, non ad te pertinet, quia perimus ?\"},{\"verse\":39,\"text\":\"Et exsurgens comminatus est vento, et dixit mari : Tace, obmutesce. Et cessavit ventus : et facta est tranquillitas magna.\"},{\"verse\":40,\"text\":\"Et ait illis : Quid timidi estis ? necdum habetis fidem ? et timuerunt timore magno, et dicebant ad alterutrum : Quis, putas, est iste, quia et ventus et mare obediunt ei ?\"}],\"summary\":\"The parable of the sower. Christ stills the tempest at sea.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":3,\"label\":\"Mark 3\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":5,\"label\":\"Mark 5\"}}]]\n"])</script></body></html>
