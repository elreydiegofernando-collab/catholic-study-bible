ic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MRK/">About <!-- -->Mark</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ feeds four thousand. He gives sight to a blind man. He foretells his passion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In those days again, when there was a great multitude and they had nothing to eat; calling his disciples together, he saith to them:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I have compassion on the multitude, for behold they have now been with me three days and have nothing to eat.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And if I shall send them away fasting to their home, they will faint in the way: for some of them came from afar off.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And his disciples answered him: From whence can any one fill them here with bread in the wilderness?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he asked them: How many loaves have ye? Who said: Seven.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he commanded the people to sit down on the ground. And taking the seven loaves, giving thanks, he broke and gave to his disciples for to set before them. And they set them before the people.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And they had a few little fishes: and he blessed them and commanded them to be set before them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they did eat and were filled: and they took up that which was left of the fragments, seven baskets.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they that had eaten were about four thousand. And he sent them away.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And immediately going up into a ship with his disciples, he came into the parts of Dalmanutha.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the Pharisees came forth and began to question with him, asking him a sign from heaven, tempting him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And sighing deeply in spirit, he saith: Why doth this generation seek a sign? Amen, I say to you, a sign shall not be given to this generation.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And leaving them, he went up again into the ship and passed to the other side of the water.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they forgot to take bread: and they had but one loaf with them in the ship.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he charged them saying: Take heed and beware of the leaven of the Pharisees and of the leaven of Herod.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they reasoned among themselves, saying: Because we have no bread.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Which Jesus knowing, saith to them: Why do you reason, because you have no bread? Do you not yet know nor understand? Have you still your heart blinded?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Having eyes, see you not? And having ears, hear you not? Neither do you remember?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>When I broke the five loaves among five thousand, how many baskets full of fragments took you up? They say to him: Twelve.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>When also the seven loaves among four thousand, how many baskets of fragments took you up? And they say to him: Seven.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he said to them: How do you not yet understand?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they came to Bethsaida: and they bring to him a blind man. And they besought him that he would touch him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And taking the blind man by the hand, he led him out of the town. And spitting upon his eyes, laying his hands on him, he asked him if he saw any thing.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And looking up, he said: I see men, as it were trees, walking.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>After that again he laid his hands upon his eyes: and he began to see and was restored, so that he saw all things clearly.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he sent him into his house, saying: Go into thy house, and if thou enter into the town, tell nobody.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Jesus went out, and his disciples into the towns of Cæsarea Philippi. And in the way, he asked his disciples, saying to them: Whom do men say that I am?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who answered him, saying: John the Baptist; but some Elias, and others as one of the prophets.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then he saith to them: But whom do you say that I am? Peter answering said to him: Thou art the Christ.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he strictly charged them that they should not tell any man of him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And he began to teach them that the Son of man must suffer many things and be rejected by the ancients and by the high priests and the scribes: and be killed and after three days rise again.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And he spoke the word openly. And Peter taking him began to rebuke him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who turning about and seeing his disciples, threatened Peter, saying: Go behind me, Satan, because thou savourest not the things that are of God but that are of men.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And calling the multitude together with his disciples, he said to them: If any man will follow me, let him deny himself and take up his cross and follow me.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>For whosoever will save his life shall lose it: and whosoever shall lose his life for my sake and the gospel shall save it.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For what shall it profit a man, if he gain the whole world and suffer the loss of his soul?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Or what shall a man give in exchange for his soul?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>For he that shall be ashamed of me and of my words, in this adulterous and sinful generation: the Son of man also will be ashamed of him, when he shall come in the glory of his Father with the holy angels.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And he said to them: Amen I say to you that there are some of them that stand here who shall not taste death till they see the kingdom of God coming in power.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In diebus illis iterum cum turba multa esset, nec haberent quod manducarent, convocatis discipulis, ait illis :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Misereor super turbam : quia ecce jam triduo sustinent me, nec habent quod manducent :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et si dimisero eos jejunos in domum suam, deficient in via : quidam enim ex eis de longe venerunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et responderunt ei discipuli sui : Unde illos quis poterit saturare panibus in solitudine ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et interrogavit eos : Quot panes habetis ? Qui dixerunt : Septem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et præcepit turbæ discumbere super terram. Et accipiens septem panes, gratias agens fregit, et dabat discipulis suis ut apponerent, et apposuerunt turbæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et habebant pisciculos paucos : et ipsos benedixit, et jussit apponi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et manducaverunt, et saturati sunt, et sustulerunt quod superaverat de fragmentis, septem sportas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Erant autem qui manducaverunt, quasi quatuor millia : et dimisit eos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et statim ascendens navim cum discipulis suis, venit in partes Dalmanutha.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et exierunt pharisæi, et cœperunt conquirere cum eo, quærentes ab illo signum de cælo, tentantes eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et ingemiscens spiritu, ait : Quid generatio ista signum quærit ? Amen dico vobis, si dabitur generationi isti signum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et dimittens eos, ascendit iterum navim et abiit trans fretum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et obliti sunt panes sumere : et nisi unum panem non habebant secum in navi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et præcipiebat eis, dicens : Videte, et cavete a fermento pharisæorum, et fermento Herodis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et cogitabant ad alterutrum, dicentes : quia panes non habemus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quo cognito, ait illis Jesus : Quid cogitatis, quia panes non habetis ? nondum cognoscetis nec intelligitis ? adhuc cæcatum habetis cor vestrum ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>oculos habentes non videtis ? et aures habentes non auditis ? nec recordamini,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>quando quinque panes fregi in quinque millia : quot cophinos fragmentorum plenos sustulistis ? Dicunt ei : Duodecim.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quando et septem panes in quatuor millia : quot sportas fragmentorum tulistis ? Et dicunt ei : Septem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et dicebat eis : Quomodo nondum intelligitis ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et veniunt Bethsaidam, et adducunt ei cæcum, et rogabant eum ut illum tangeret.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et apprehensa manu cæci, eduxit eum extra vicum : et exspuens in oculos ejus impositis manibus suis, interrogavit eum si quid videret.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et aspiciens, ait : Video homines velut arbores ambulantes.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Deinde iterum imposuit manus super oculos ejus : et cœpit videre : et restitutus est ita ut clare videret omnia.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et misit illum in domum suam, dicens : Vade in domum tuam : et si in vicum introieris, nemini dixeris.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et egressus est Jesus, et discipuli ejus in castella Cæsareæ Philippi : et in via interrogabat discipulos suos, dicens eis : Quem me dicunt esse homines ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Qui responderunt illi, dicentes : Joannem Baptistam, alii Eliam, alii vero quasi unum de prophetis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Tunc dicit illis : Vos vero quem me esse dicitis ? Respondens Petrus, ait ei : Tu es Christus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et comminatus est eis, ne cui dicerent de illo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et cœpit docere eos quoniam oportet Filium hominis pati multa, et reprobari a senioribus, et a summis sacerdotibus et scribis, et occidi : et post tres dies resurgere.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et palam verbum loquebatur. Et apprehendens eum Petrus, cœpit increpare eum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Qui conversus, et videns discipulos suos, comminatus est Petro, dicens : Vade retro me Satana, quoniam non sapis quæ Dei sunt, sed quæ sunt hominum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et convocata turba cum discipulis suis, dixit eis : Si quis vult me sequi, deneget semetipsum : et tollat crucem suam, et sequatur me.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Qui enim voluerit animam suam salvam facere, perdet eam : qui autem perdiderit animam suam propter me, et Evangelium, salvam faciet eam.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quid enim proderit homini, si lucretur mundum totum et detrimentum animæ suæ faciat ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Aut quid dabit homo commutationis pro anima sua ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Qui enim me confusus fuerit, et verba mea in generatione ista adultera et peccatrice, et Filius hominis confundetur eum, cum venerit in gloria Patris sui cum angelis sanctis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et dicebat illis : Amen dico vobis, quia sunt quidam de hic stantibus, qui non gustabunt mortem donec videant regnum Dei veniens in virtute.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Mark 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->8<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Mark 7" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><button type="button" aria-label="Mark 8. Choose another book or chapter" class="flex h-12 min-w-0 flex-1 items-center justify-center gap-1.5 rounded-xl border border-st otalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"In those days again, when there was a great multitude and they had nothing to eat; calling his disciples together, he saith to them:\"},{\"verse\":2,\"text\":\"I have compassion on the multitude, for behold they have now been with me three days and have nothing to eat.\"},{\"verse\":3,\"text\":\"And if I shall send them away fasting to their home, they will faint in the way: for some of them came from afar off.\"},{\"verse\":4,\"text\":\"And his disciples answered him: From whence can any one fill them here with bread in the wilderness?\"},{\"verse\":5,\"text\":\"And he asked them: How many loaves have ye? Who said: Seven.\"},{\"verse\":6,\"text\":\"And he commanded the people to sit down on the ground. And taking the seven loaves, giving thanks, he broke and gave to his disciples for to set before them. And they set them before the people.\"},{\"verse\":7,\"text\":\"And they had a few little fishes: and he blessed them and commanded them to be set before them.\"},{\"verse\":8,\"text\":\"And they did eat and were filled: and they took up that which was left of the fragments, seven baskets.\"},{\"verse\":9,\"text\":\"And they that had eaten were about four thousand. And he sent them away.\"},{\"verse\":10,\"text\":\"And immediately going up into a ship with his disciples, he came into the parts of Dalmanutha.\"},{\"verse\":11,\"text\":\"And the Pharisees came forth and began to question with him, asking him a sign from heaven, tempting him.\"},{\"verse\":12,\"text\":\"And sighing deeply in spirit, he saith: Why doth this generation seek a sign? Amen, I say to you, a sign shall not be given to this generation.\"},{\"verse\":13,\"text\":\"And leaving them, he went up again into the ship and passed to the other side of the water.\"},{\"verse\":14,\"text\":\"And they forgot to take bread: and they had but one loaf with them in the ship.\"},{\"verse\":15,\"text\":\"And he charged them saying: Take heed and beware of the leaven of the Pharisees and of the leaven of Herod.\"},{\"verse\":16,\"text\":\"And they reasoned among themselves, saying: Because we have no bread.\"},{\"verse\":17,\"text\":\"Which Jesus knowing, saith to them: Why do you reason, because you have no bread? Do you not yet know nor understand? Have you still your heart blinded?\"},{\"verse\":18,\"text\":\"Having eyes, see you not? And having ears, hear you not? Neither do you remember?\"},{\"verse\":19,\"text\":\"When I broke the five loaves among five thousand, how many baskets full of fragments took you up? They say to him: Twelve.\"},{\"verse\":20,\"text\":\"When also the seven loaves among four thousand, how many baskets of fragments took you up? And they say to him: Seven.\"},{\"verse\":21,\"text\":\"And he said to them: How do you not yet understand?\"},{\"verse\":22,\"text\":\"And they came to Bethsaida: and they bring to him a blind man. And they besought him that he would touch him.\"},{\"verse\":23,\"text\":\"And taking the blind man by the hand, he led him out of the town. And spitting upon his eyes, laying his hands on him, he asked him if he saw any thing.\"},{\"verse\":24,\"text\":\"And looking up, he said: I see men, as it were trees, walking.\"},{\"verse\":25,\"text\":\"After that again he laid his hands upon his eyes: and he began to see and was restored, so that he saw all things clearly.\"},{\"verse\":26,\"text\":\"And he sent him into his house, saying: Go into thy house, and if thou enter into the town, tell nobody.\"},{\"verse\":27,\"text\":\"And Jesus went out, and his disciples into the towns of Cæsarea Philippi. And in the way, he asked his disciples, saying to them: Whom do men say that I am?\"},{\"verse\":28,\"text\":\"Who answered him, saying: John the Baptist; but some Elias, and others as one of the prophets.\"},{\"verse\":29,\"text\":\"Then he saith to them: But whom do you say that I am? Peter answering said to him: Thou art the Christ.\"},{\"verse\":30,\"text\":\"And he strictly charged them that they should not tell any man of him.\"},{\"verse\":31,\"text\":\"And he began to teach them that the Son of man must suffer many things and be rejected by the ancients and by the high priests and the scribes: and be killed and after three days rise again.\"},{\"verse\":32,\"text\":\"And he spoke the word openly. And Peter taking him began to rebuke him.\"},{\"verse\":33,\"text\":\"Who turning about and seeing his disciples, threatened Peter, saying: Go behind me, Satan, because thou savourest not the things that are of God but that are of men.\"},{\"verse\":34,\"text\":\"And calling the multitude together with his disciples, he said to them: If any man will follow me, let him deny himself and take up his cross and follow me.\"},{\"verse\":35,\"text\":\"For whosoever will save his life shall lose it: and whosoever shall lose his life for my sake and the gospel shall save it.\"},{\"verse\":36,\"text\":\"For what shall it profit a man, if he gain the whole world and suffer the loss of his soul?\"},{\"verse\":37,\"text\":\"Or what shall a man give in exchange for his soul?\"},{\"verse\":38,\"text\":\"For he that shall be ashamed of me and of my words, in this adulterous and sinful generation: the Son of man also will be ashamed of him, when he shall come in the glory of his Father with the holy angels.\"},{\"verse\":39,\"text\":\"And he said to them: Amen I say to you that there are some of them that stand here who shall not taste death till they see the kingdom of God coming in power.\"}],\"vul\":[{\"verse\":1,\"text\":\"In diebus illis iterum cum turba multa esset, nec haberent quod manducarent, convocatis discipulis, ait illis :\"},{\"verse\":2,\"text\":\"Misereor super turbam : quia ecce jam triduo sustinent me, nec habent quod manducent :\"},{\"verse\":3,\"text\":\"et si dimisero eos jejunos in domum suam, deficient in via : quidam enim ex eis de longe venerunt.\"},{\"verse\":4,\"text\":\"Et responderunt ei discipuli sui : Unde illos quis poterit saturare panibus in solitudine ?\"},{\"verse\":5,\"text\":\"Et interrogavit eos : Quot panes habetis ? Qui dixerunt : Septem.\"},{\"verse\":6,\"text\":\"Et præcepit turbæ discumbere super terram. Et accipiens septem panes, gratias agens fregit, et dabat discipulis suis ut apponerent, et apposuerunt turbæ.\"},{\"verse\":7,\"text\":\"Et habebant pisciculos paucos : et ipsos benedixit, et jussit apponi.\"},{\"verse\":8,\"text\":\"Et manducaverunt, et saturati sunt, et sustulerunt quod superaverat de fragmentis, septem sportas.\"},{\"verse\":9,\"text\":\"Erant autem qui manducaverunt, quasi quatuor millia : et dimisit eos.\"},{\"verse\":10,\"text\":\"Et statim ascendens navim cum discipulis suis, venit in partes Dalmanutha.\"},{\"verse\":11,\"text\":\"Et exierunt pharisæi, et cœperunt conquirere cum eo, quærentes ab illo signum de cælo, tentantes eum.\"},{\"verse\":12,\"text\":\"Et ingemiscens spiritu, ait : Quid generatio ista signum quærit ? Amen dico vobis, si dabitur generationi isti signum.\"},{\"verse\":13,\"text\":\"Et dimittens eos, ascendit iterum navim et abiit trans fretum.\"},{\"verse\":14,\"text\":\"Et obliti sunt panes sumere : et nisi unum panem non habebant secum in navi.\"},{\"verse\":15,\"text\":\"Et præcipiebat eis, dicens : Videte, et cavete a fermento pharisæorum, et fermento Herodis.\"},{\"verse\":16,\"text\":\"Et cogitabant ad alterutrum, dicentes : quia panes non habemus.\"},{\"verse\":17,\"text\":\"Quo cognito, ait illis Jesus : Quid cogitatis, quia panes non habetis ? nondum cognoscetis nec intelligitis ? adhuc cæcatum habetis cor vestrum ?\"},{\"verse\":18,\"text\":\"oculos habentes non videtis ? et aures habentes non auditis ? nec recordamini,\"},{\"verse\":19,\"text\":\"quando quinque panes fregi in quinque millia : quot cophinos fragmentorum plenos sustulistis ? Dicunt ei : Duodecim.\"},{\"verse\":20,\"text\":\"Quando et septem panes in quatuor millia : quot sportas fragmentorum tulistis ? Et dicunt ei : Septem.\"},{\"verse\":21,\"text\":\"Et dicebat eis : Quomodo nondum intelligitis ?\"},{\"verse\":22,\"text\":\"Et veniunt Bethsaidam, et adducunt ei cæcum, et rogabant eum ut illum tangeret.\"},{\"verse\":23,\"text\":\"Et apprehensa manu cæci, eduxit eum extra vicum : et exspuens in oculos ejus impositis manibus suis, interrogavit eum si quid videret.\"},{\"verse\":24,\"text\":\"Et aspiciens, ait : Video homines velut arbores ambulantes.\"},{\"verse\":25,\"text\":\"Deinde iterum imposuit manus super oculos ejus : et cœpit videre : et restitutus est ita ut clare videret omnia.\"},{\"verse\":26,\"text\":\"Et misit illum in domum suam, dicens : Vade in domum tuam : et si in vicum introieris, nemini dixeris.\"},{\"verse\":27,\"text\":\"Et egressus est Jesus, et discipuli ejus in castella Cæsareæ Philippi : et in via interrogabat discipulos suos, dicens eis : Quem me dicunt esse homines ?\"},{\"verse\":28,\"text\":\"Qui responderunt illi, dicentes : Joannem Baptistam, alii Eliam, alii vero quasi unum de prophetis.\"},{\"verse\":29,\"text\":\"Tunc dicit illis : Vos vero quem me esse dicitis ? Respondens Petrus, ait ei : Tu es Christus.\"},{\"verse\":30,\"text\":\"Et comminatus est eis, ne cui dicerent de illo.\"},{\"verse\":31,\"text\":\"Et cœpit docere eos quoniam oportet Filium hominis pati multa, et reprobari a senioribus, et a summis sacerdotibus et scribis, et occidi : et post tres dies resurgere.\"},{\"verse\":32,\"text\":\"Et palam verbum loquebatur. Et apprehendens eum Petrus, cœpit increpare eum.\"},{\"verse\":33,\"text\":\"Qui conversus, et videns discipulos suos, comminatus est Petro, dicens : Vade retro me Satana, quoniam non sapis quæ Dei sunt, sed quæ sunt hominum.\"},{\"verse\":34,\"text\":\"Et convocata turba cum discipulis suis, dixit eis : Si quis vult me sequi, deneget semetipsum : et tollat crucem suam, et sequatur me.\"},{\"verse\":35,\"text\":\"Qui enim voluerit animam suam salvam facere, perdet eam : qui autem perdiderit animam suam propter me, et Evangelium, salvam faciet eam.\"},{\"verse\":36,\"text\":\"Quid enim proderit homini, si lucretur mundum totum et detrimentum animæ suæ faciat ?\"},{\"verse\":37,\"text\":\"Aut quid dabit homo commutationis pro anima sua ?\"},{\"verse\":38,\"text\":\"Qui enim me confusus fuerit, et verba mea in generatione ista adultera et peccatrice, et Filius hominis confundetur eum, cum venerit in gloria Patris sui cum angelis sanctis.\"},{\"verse\":39,\"text\":\"Et dicebat illis : Amen dico vobis, quia sunt quidam de hic stantibus, qui non gustabunt mortem donec videant regnum Dei veniens in virtute.\"}],\"summary\":\"Christ feeds four thousand. He gives sight to a blind man. He foretells his passion.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":7,\"label\":\"Mark 7\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":9,\"label\":\"Mark 9\"}}]]\n"])</script></body></html>
