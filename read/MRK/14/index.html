<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Mark 14 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MRK/">About <!-- -->Mark</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The first part of the history of the passion of Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the feast of the pasch and of the Azymes was after two days: and the chief priests and the scribes sought how they might by some wile lay hold on him and kill him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But they said: Not on the festival day, lest there should be a tumult among the people.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when he was in Bethania, in the house of Simon the leper, and was at meat, there came a woman having an alabaster box of ointment of precious spikenard. And breaking the alabaster box, she poured it out upon his head.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Now there were some that had indignation within themselves and said: Why was this waste of the ointment made?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For this ointment might have been sold for more than three hundred pence and given to the poor. And they murmured against her.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But Jesus said: Let her alone. Why do you molest her? She hath wrought a good work upon me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For the poor you have always with you: and whensoever you will, you may do them good: but me you have not always.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>She hath done what she could: she is come beforehand to anoint my body for the burial.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Amen, I say to you, wheresoever this gospel shall be preached in the whole world, that also which she hath done shall be told for a memorial of her.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Judas Iscariot, one of the twelve, went to the chief priests, to betray him to them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who hearing it were glad: and they promised him they would give him money. And he sought how he might conveniently betray him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now on the first day of the unleavened bread, when they sacrificed the pasch, the disciples say to him: Whither wilt thou that we go and prepare for thee to eat the pasch?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he sendeth two of his disciples and saith to them: Go ye into the city; and there shall meet you a man carrying a pitcher of water. Follow him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And whithersoever he shall go in, say to the master of the house, The master saith, Where is my refectory, where I may eat the pasch with my disciples?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he will shew you a large dining room furnished. And there prepare ye for us.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And his disciples went their way and came into the city. And they found as he had told them: and they prepared the pasch.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when evening was come, he cometh with the twelve.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when they were at table and eating, Jesus saith: Amen I say to you, one of you that eateth with me shall betray me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But they began to be sorrowful and to say to him, one by one: Is it I?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Who saith to them: One of the twelve, who dippeth with me his hand in the dish.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man shall be betrayed. It were better for him, if that man had not been born.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And whilst they were eating, Jesus took bread; and blessing, broke and gave to them and said: Take ye. This is my body.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And having taken the chalice, giving thanks, he gave it to them. And they all drank of it.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he said to them: This is my blood of the new testament, which shall be shed for many.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Amen I say to you that I will drink no more of the fruit of the vine until that day when I shall drink it new in the kingdom of God.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And when they had sung an hymn, they went forth to the mount of Olives.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Jesus saith to them: You will all be scandalized in my regard this night. For it is written: I will strike the shepherd, and the sheep shall be dispersed.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But after I shall be risen again, I will go before you into Galilee.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But Peter saith to him: Although all shall be scandalized in thee, yet not I.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Jesus saith to him: Amen I say to thee, to-day, even in this night, before the cock crow twice, thou shalt deny me thrice.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But he spoke the more vehemently: Although I should die together with thee, I will not deny thee. And in like manner also said they all.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they came to a farm called Gethsemani. And he saith to his disciples: Sit you here, while I pray.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he taketh Peter and James and John with him: and he began to fear and to be heavy.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And he saith to them: My soul is sorrowful even unto death. Stay you here and watch.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And when he was gone forward a little, he fell flat on the ground: and he prayed that, if it might be, the hour might pass from him.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he saith: Abba, Father, all things are possible to thee: remove this chalice from me; but not what I will, but what thou wilt.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And he cometh and findeth them sleeping. And he saith to Peter: Simon, sleepest thou? Couldst thou not watch one hour?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Watch ye: and pray that you enter not into temptation. The spirit indeed is willing, but the flesh is weak.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And going away again, he prayed, saying the same words.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when he returned, he found them again asleep (for their eyes were heavy): and they knew not what to answer him.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And he cometh the third time and saith to them: Sleep ye now and take your rest. It is enough. The hour is come: behold the Son of man shall be betrayed into the hands of sinners.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Rise up: let us go. Behold, he that will betray me is at hand.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And while he was yet speaking, cometh Judas Iscariot, one of the twelve: and with him a great multitude with swords and staves, from the chief priests and the scribes and the ancients.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he that betrayed him had given them a sign, saying: Whomsoever I shall kiss, that is he. Lay hold on him: and lead him away carefully.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And when he was come, immediately going up to him he saith: Hail, Rabbi! And he kissed him.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>But they laid hands on him and held him.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And one of them that stood by, drawing a sword, struck a servant of the chief priest and cut off his ear.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And Jesus answering, said to them: Are you come out as to a robber, with swords and staves to apprehend me?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>I was daily with you in the temple teaching: and you did not lay hands on me. But that the scriptures may be fulfilled.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Then his disciples, leaving him, all fled away.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And a certain young man followed him, having a linen cloth cast about his naked body. And they laid hold on him.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>But he, casting off the linen cloth, fled from them naked.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And they brought Jesus to the high priest. And all the priests and the scribes and the ancients assembled together.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And Peter followed him afar off, even into the court of the high priest. And he sat with the servants at the fire and warmed himself.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And the chief priests and all the council sought for evidence against Jesus, that they might put him to death: and found none.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>For many bore false witness against him: and their evidences were not agreeing.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And some rising up, bore false witness against him, saying:</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>We heard him say, I will destroy this temple made with hands and within three days I will build another not made with hands.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And their witness did not agree.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And the high priest rising up in the midst, asked Jesus, saying: Answerest thou nothing to the things that are laid to thy charge by these men?</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>But he held his peace and answered nothing. Again the high priest asked him and said to him: Art thou the Christ, the Son of the Blessed God?</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And Jesus said to him: I am. And you shall see the Son of man sitting on the right hand of the power of God and coming with the clouds of heaven.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Then the high priest rending his garments, saith: What need we any further witnesses?</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>You have heard the blasphemy. What think you? Who all condemned him to be guilty of death.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And some began to spit on him and to cover his face and to buffet him and to say unto him: Prophesy. And the servants struck him with the palms of their hands.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Now when Peter was in the court below, there cometh one of the maidservants of the high priest.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>And when she had seen Peter warming himself looking on him, she saith: Thou also wast with Jesus of Nazareth.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>But he denied, saying: I neither know nor understand what thou sayest. And he went forth before the court; and the cock crew.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>And again a maidservant seeing him, began to say to the standers by: This is one of them.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>But he denied again. And after a while they that stood by said again to Peter: Surely thou art one of them; for thou art also a Galilean.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>But he began to curse and to swear, saying: I know not this man of whom you speak.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>And immediately the cock crew again. And Peter remembered the word that Jesus had said unto him: Before the cock crow twice, thou shalt thrice deny me. And he began to weep.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem Pascha et azyma post biduum : et quærebant summi sacerdotes et scribæ quomodo eum dolo tenerent, et occiderent.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dicebant autem : Non in die festo, ne forte tumultus fieret in populo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et cum esset Bethaniæ in domo Simonis leprosi, et recumberet, venit mulier habens alabastrum unguenti nardi spicati pretiosi : et fracto alabastro, effudit super caput ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erant autem quidam indigne ferentes intra semetipsos, et dicentes : Ut quid perditio ista unguenti facta est ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>poterat enim unguentum istud venundari plus quam trecentis denariis, et dari pauperibus. Et fremebant in eam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Jesus autem dixit : Sinite eam, quid illi molesti estis ? Bonum opus operata est in me :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>semper enim pauperes habetis vobiscum : et cum volueritis, potestis illis benefacere : me autem non semper habetis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quod habuit hæc, fecit : prævenit ungere corpus meum in sepulturam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Amen dico vobis : Ubicumque prædicatum fuerit Evangelium istud in universo mundo, et quod fecit hæc, narrabitur in memoriam ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et Judas Iscariotes, unus de duodecim, abiit ad summos sacerdotes, ut proderet eum illis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui audientes gavisi sunt : et promiserunt ei pecuniam se daturos. Et quærebat quomodo illum opportune traderet.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et primo die azymorum quando Pascha immolabant, dicunt ei discipuli : Quo vis eamus, et paremus tibi ut manduces Pascha ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et mittit duos ex discipulis suis, et dicit eis : Ite in civitatem, et occurret vobis homo lagenam aquæ bajulans : sequimini eum,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et quocumque introierit, dicite domino domus, quia magister dicit : Ubi est refectio mea, ubi Pascha cum discipulis meis manducem ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ipse vobis demonstrabit cœnaculum grande, stratum : et illic parate nobis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et abierunt discipuli ejus, et venerunt in civitatem : et invenerunt sicut dixerat illis, et paraverunt Pascha.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Vespere autem facto, venit cum duodecim.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et discumbentibus eis, et manducantibus, ait Jesus : Amen dico vobis, quia unus ex vobis tradet me, qui manducat mecum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>At illi cœperunt contristari, et dicere ei singulatim : Numquid ego ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui ait illis : Unus ex duodecim, qui intingit mecum manum in catino.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et Filius quidem hominis vadit sicut scriptum est de eo : væ autem homini illi per quem Filius hominis tradetur ! bonum erat ei, si non esset natus homo ille.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et manducantibus illis, accepit Jesus panem : et benedicens fregit, et dedit eis, et ait : Sumite, hoc est corpus meum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et accepto calice, gratias agens dedit eis : et biberunt ex illo omnes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et ait illis : Hic est sanguis meus novi testamenti, qui pro multis effundetur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Amen dico vobis, quia jam non bibam de hoc genimine vitis usque in diem illum, cum illud bibam novum in regno Dei.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et hymno dicto exierunt in montem Olivarum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et ait eis Jesus : Omnes scandalizabimini in me in nocte ista : quia scriptum est : Percutiam pastorem, et dispergentur oves.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sed postquam resurrexero, præcedam vos in Galilæam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Petrus autem ait illi : Et si omnes scandalizati fuerint in te, sed non ego.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ait illi Jesus : Amen dico tibi, quia tu hodie in nocte hac, priusquam gallus vocem bis dederit, ter me es negaturus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>At ille amplius loquebatur : Et si oportuerit me simul commori tibi, non te negabo. Similiter autem et omnes dicebant.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et veniunt in prædium, cui nomen Gethsemani. Et ait discipulis suis : Sedete hic donec orem.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et assumit Petrum, et Jacobum, et Joannem secum : et cœpit pavere et tædere.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et ait illis : Tristis est anima mea usque ad mortem : sustinete hic, et vigilate.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et cum processisset paululum, procidit super terram, et orabat ut, si fieri posset, transiret ab eo hora.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dixit : Abba pater, omnia tibi possibilia sunt : transfer calicem hunc a me : sed non quod ego volo, sed quod tu.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et venit, et invenit eos dormientes. Et ait Petro : Simon, dormis ? non potuisti una hora vigilare ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>vigilate et orate, ut non intretis in tentationem. Spiritus quidem promptus est, caro vero infirma.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et iterum abiens oravit, eumdem sermonem dicens.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et reversus, denuo invenit eos dormientes (erant enim oculi eorum gravati), et ignorabant quid responderent ei.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et venit tertio, et ait illis : Dormite jam, et requiescite. Sufficit : venit hora : ecce Filius hominis tradetur in manus peccatorum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Surgite, eamus : ecce qui me tradet, prope est.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et, adhuc eo loquente, venit Judas Iscariotes unus de duodecim, et cum eo turba multa cum gladiis et lignis, a summis sacerdotibus, et scribis, et senioribus.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Dederat autem traditor ejus signum eis, dicens : Quemcumque osculatus fuero, ipse est, tenete eum, et ducite caute.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et cum venisset, statim accedens ad eum, ait : Ave Rabbi : et osculatus est eum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>At illi manus injecerunt in eum, et tenuerunt eum.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Unus autem quidam de circumstantibus educens gladium, percussit servum summi sacerdotis, et amputavit illi auriculam.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Et respondens Jesus, ait illis : Tamquam ad latronem existis cum gladiis et lignis comprehendere me ?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>quotidie eram apud vos in templo docens, et non me tenuistis. Sed ut impleantur Scripturæ.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Tunc discipuli ejus relinquentes eum, omnes fugerunt.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Adolescens autem quidam sequebatur eum amictus sindone super nudo : et tenuerunt eum.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>At ille rejecta sindone, nudus profugit ab eis.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et adduxerunt Jesum ad summum sacerdotem : et convenerunt omnes sacerdotes, et scribæ, et seniores.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Petrus autem a longe secutus est eum usque intro in atrium summi sacerdotis : et sedebat cum ministris ad ignem, et calefaciebat se.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Summi vero sacerdotes et omne concilium quærebant adversus Jesum testimonium ut eum morti traderent : nec inveniebant.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Multi enim testimonium falsum dicebant adversus eum : et convenientia testimonia non erant.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Et quidam surgentes, falsum testimonium ferebant adversus eum, dicentes :</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Quoniam nos audivimus eum dicentem : Ego dissolvam templum hoc manu factum, et per triduum aliud non manu factum ædificabo.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Et non erat conveniens testimonium illorum.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Et exsurgens summus sacerdos in medium, interrogavit Jesum, dicens : Non respondes quidquam ad ea quæ tibi objiciuntur ab his ?</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Ille autem tacebat, et nihil respondit. Rursum summus sacerdos interrogabat eum, et dixit ei : Tu es Christus Filius Dei benedicti ?</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Jesus autem dixit illi : Ego sum : et videbitis Filium hominis sedentem a dextris virtutis Dei, et venientem cum nubibus cæli.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Summus autem sacerdos scindens vestimenta sua, ait : Quid adhuc desideramus testes ?</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Audistis blasphemiam : quid vobis videtur ? Qui omnes condemnaverunt eum esse reum mortis.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Et cœperunt quidam conspuere eum, et velare faciem ejus, et colaphis eum cædere, et dicere ei : Prophetiza : et ministri alapis eum cædebant.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Et cum esset Petrus in atrio deorsum, venit una ex ancillis summi sacerdotis :</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>et cum vidisset Petrum calefacientem se, aspiciens illum, ait : Et tu cum Jesu Nazareno eras.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>At ille negavit, dicens : Neque scio, neque novi quid dicas. Et exiit foras ante atrium, et gallus cantavit.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Rursus autem cum vidisset illum ancilla, cœpit dicere circumstantibus : Quia hic ex illis est.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>At ille iterum negavit. Et post pusillum rursus qui astabant, dicebant Petro : Vere ex illis es : nam et Galilæus es.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>Ille autem cœpit anathematizare et jurare : Quia nescio hominem istum, quem dicitis.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>Et statim gallus iterum cantavit. Et recordatus est Petrus verbi quod dixerat ei Jesus : Priusquam gallus cantet bis, ter me negabis. Et cœpit flere.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Mark 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="roun "5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MRK.14\",{\"bookId\":48,\"usfm\":\"MRK\",\"bookName\":\"Mark\",\"drName\":\"Mark\",\"chapter\":14,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"Now the feast of the pasch and of the Azymes was after two days: and the chief priests and the scribes sought how they might by some wile lay hold on him and kill him.\"},{\"verse\":2,\"text\":\"But they said: Not on the festival day, lest there should be a tumult among the people.\"},{\"verse\":3,\"text\":\"And when he was in Bethania, in the house of Simon the leper, and was at meat, there came a woman having an alabaster box of ointment of precious spikenard. And breaking the alabaster box, she poured it out upon his head.\"},{\"verse\":4,\"text\":\"Now there were some that had indignation within themselves and said: Why was this waste of the ointment made?\"},{\"verse\":5,\"text\":\"For this ointment might have been sold for more than three hundred pence and given to the poor. And they murmured against her.\"},{\"verse\":6,\"text\":\"But Jesus said: Let her alone. Why do you molest her? She hath wrought a good work upon me.\"},{\"verse\":7,\"text\":\"For the poor you have always with you: and whensoever you will, you may do them good: but me you have not always.\"},{\"verse\":8,\"text\":\"She hath done what she could: she is come beforehand to anoint my body for the burial.\"},{\"verse\":9,\"text\":\"Amen, I say to you, wheresoever this gospel shall be preached in the whole world, that also which she hath done shall be told for a memorial of her.\"},{\"verse\":10,\"text\":\"And Judas Iscariot, one of the twelve, went to the chief priests, to betray him to them.\"},{\"verse\":11,\"text\":\"Who hearing it were glad: and they promised him they would give him money. And he sought how he might conveniently betray him.\"},{\"verse\":12,\"text\":\"Now on the first day of the unleavened bread, when they sacrificed the pasch, the disciples say to him: Whither wilt thou that we go and prepare for thee to eat the pasch?\"},{\"verse\":13,\"text\":\"And he sendeth two of his disciples and saith to them: Go ye into the city; and there shall meet you a man carrying a pitcher of water. Follow him.\"},{\"verse\":14,\"text\":\"And whithersoever he shall go in, say to the master of the house, The master saith, Where is my refectory, where I may eat the pasch with my disciples?\"},{\"verse\":15,\"text\":\"And he will shew you a large dining room furnished. And there prepare ye for us.\"},{\"verse\":16,\"text\":\"And his disciples went their way and came into the city. And they found as he had told them: and they prepared the pasch.\"},{\"verse\":17,\"text\":\"And when evening was come, he cometh with the twelve.\"},{\"verse\":18,\"text\":\"And when they were at table and eating, Jesus saith: Amen I say to you, one of you that eateth with me shall betray me.\"},{\"verse\":19,\"text\":\"But they began to be sorrowful and to say to him, one by one: Is it I?\"},{\"verse\":20,\"text\":\"Who saith to them: One of the twelve, who dippeth with me his hand in the dish.\"},{\"verse\":21,\"text\":\"And the Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man shall be betrayed. It were better for him, if that man had not been born.\"},{\"verse\":22,\"text\":\"And whilst they were eating, Jesus took bread; and blessing, broke and gave to them and said: Take ye. This is my body.\"},{\"verse\":23,\"text\":\"And having taken the chalice, giving thanks, he gave it to them. And they all drank of it.\"},{\"verse\":24,\"text\":\"And he said to them: This is my blood of the new testament, which shall be shed for many.\"},{\"verse\":25,\"text\":\"Amen I say to you that I will drink no more of the fruit of the vine until that day when I shall drink it new in the kingdom of God.\"},{\"verse\":26,\"text\":\"And when they had sung an hymn, they went forth to the mount of Olives.\"},{\"verse\":27,\"text\":\"And Jesus saith to them: You will all be scandalized in my regard this night. For it is written: I will strike the shepherd, and the sheep shall be dispersed.\"},{\"verse\":28,\"text\":\"But after I shall be risen again, I will go before you into Galilee.\"},{\"verse\":29,\"text\":\"But Peter saith to him: Although all shall be scandalized in thee, yet not I.\"},{\"verse\":30,\"text\":\"And Jesus saith to him: Amen I say to thee, to-day, even in this night, before the cock crow twice, thou shalt deny me thrice.\"},{\"verse\":31,\"text\":\"But he spoke the more vehemently: Although I should die together with thee, I will not deny thee. And in like manner also said they all.\"},{\"verse\":32,\"text\":\"And they came to a farm called Gethsemani. And he saith to his disciples: Sit you here, while I pray.\"},{\"verse\":33,\"text\":\"And he taketh Peter and James and John with him: and he began to fear and to be heavy.\"},{\"verse\":34,\"text\":\"And he saith to them: My soul is sorrowful even unto death. Stay you here and watch.\"},{\"verse\":35,\"text\":\"And when he was gone forward a little, he fell flat on the ground: and he prayed that, if it might be, the hour might pass from him.\"},{\"verse\":36,\"text\":\"And he saith: Abba, Father, all things are possible to thee: remove this chalice from me; but not what I will, but what thou wilt.\"},{\"verse\":37,\"text\":\"And he cometh and findeth them sleeping. And he saith to Peter: Simon, sleepest thou? Couldst thou not watch one hour?\"},{\"verse\":38,\"text\":\"Watch ye: and pray that you enter not into temptation. The spirit indeed is willing, but the flesh is weak.\"},{\"verse\":39,\"text\":\"And going away again, he prayed, saying the same words.\"},{\"verse\":40,\"text\":\"And when he returned, he found them again asleep (for their eyes were heavy): and they knew not what to answer him.\"},{\"verse\":41,\"text\":\"And he cometh the third time and saith to them: Sleep ye now and take your rest. It is enough. The hour is come: behold the Son of man shall be betrayed into the hands of sinners.\"},{\"verse\":42,\"text\":\"Rise up: let us go. Behold, he that will betray me is at hand.\"},{\"verse\":43,\"text\":\"And while he was yet speaking, cometh Judas Iscariot, one of the twelve: and with him a great multitude with swords and staves, from the chief priests and the scribes and the ancients.\"},{\"verse\":44,\"text\":\"And he that betrayed him had given them a sign, saying: Whomsoever I shall kiss, that is he. Lay hold on him: and lead him away carefully.\"},{\"verse\":45,\"text\":\"And when he was come, immediately going up to him he saith: Hail, Rabbi! And he kissed him.\"},{\"verse\":46,\"text\":\"But they laid hands on him and held him.\"},{\"verse\":47,\"text\":\"And one of them that stood by, drawing a sword, struck a servant of the chief priest and cut off his ear.\"},{\"verse\":48,\"text\":\"And Jesus answering, said to them: Are you come out as to a robber, with swords and staves to apprehend me?\"},{\"verse\":49,\"text\":\"I was daily with you in the temple teaching: and you did not lay hands on me. But that the scriptures may be fulfilled.\"},{\"verse\":50,\"text\":\"Then his disciples, leaving him, all fled away.\"},{\"verse\":51,\"text\":\"And a certain young man followed him, having a linen cloth cast about his naked body. And they laid hold on him.\"},{\"verse\":52,\"text\":\"But he, casting off the linen cloth, fled from them naked.\"},{\"verse\":53,\"text\":\"And they brought Jesus to the high priest. And all the priests and the scribes and the ancients assembled together.\"},{\"verse\":54,\"text\":\"And Peter followed him afar off, even into the court of the high priest. And he sat with the servants at the fire and warmed himself.\"},{\"verse\":55,\"text\":\"And the chief priests and all the council sought for evidence against Jesus, that they might put him to death: and found none.\"},{\"verse\":56,\"text\":\"For many bore false witness against him: and their evidences were not agreeing.\"},{\"verse\":57,\"text\":\"And some rising up, bore false witness against him, saying:\"},{\"verse\":58,\"text\":\"We heard him say, I will destroy this temple made with hands and within three days I will build another not made with hands.\"},{\"verse\":59,\"text\":\"And their witness did not agree.\"},{\"verse\":60,\"text\":\"And the high priest rising up in the midst, asked Jesus, saying: Answerest thou nothing to the things that are laid to thy charge by these men?\"},{\"verse\":61,\"text\":\"But he held his peace and answered nothing. Again the high priest asked him and said to him: Art thou the Christ, the Son of the Blessed God?\"},{\"verse\":62,\"text\":\"And Jesus said to him: I am. And you shall see the Son of man sitting on the right hand of the power of God and coming with the clouds of heaven.\"},{\"verse\":63,\"text\":\"Then the high priest rending his garments, saith: What need we any further witnesses?\"},{\"verse\":64,\"text\":\"You have heard the blasphemy. What think you? Who all condemned him to be guilty of death.\"},{\"verse\":65,\"text\":\"And some began to spit on him and to cover his face and to buffet him and to say unto him: Prophesy. And the servants struck him with the palms of their hands.\"},{\"verse\":66,\"text\":\"Now when Peter was in the court below, there cometh one of the maidservants of the high priest.\"},{\"verse\":67,\"text\":\"And when she had seen Peter warming himself looking on him, she saith: Thou also wast with Jesus of Nazareth.\"},{\"verse\":68,\"text\":\"But he denied, saying: I neither know nor understand what thou sayest. And he went forth before the court; and the cock crew.\"},{\"verse\":69,\"text\":\"And again a maidservant seeing him, began to say to the standers by: This is one of them.\"},{\"verse\":70,\"text\":\"But he denied again. And after a while they that stood by said again to Peter: Surely thou art one of them; for thou art also a Galilean.\"},{\"verse\":71,\"text\":\"But he began to curse and to swear, saying: I know not this man of whom you speak.\"},{\"verse\":72,\"text\":\"And immediately the cock crew again. And Peter remembered the word that Jesus had said unto him: Before the cock crow twice, thou shalt thrice deny me. And he began to weep.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem Pascha et azyma post biduum : et quærebant summi sacerdotes et scribæ quomodo eum dolo tenerent, et occiderent.\"},{\"verse\":2,\"text\":\"Dicebant autem : Non in die festo, ne forte tumultus fieret in populo.\"},{\"verse\":3,\"text\":\"Et cum esset Bethaniæ in domo Simonis leprosi, et recumberet, venit mulier habens alabastrum unguenti nardi spicati pretiosi : et fracto alabastro, effudit super caput ejus.\"},{\"verse\":4,\"text\":\"Erant autem quidam indigne ferentes intra semetipsos, et dicentes : Ut quid perditio ista unguenti facta est ?\"},{\"verse\":5,\"text\":\"poterat enim unguentum istud venundari plus quam trecentis denariis, et dari pauperibus. Et fremebant in eam.\"},{\"verse\":6,\"text\":\"Jesus autem dixit : Sinite eam, quid illi molesti estis ? Bonum opus operata est in me :\"},{\"verse\":7,\"text\":\"semper enim pauperes habetis vobiscum : et cum volueritis, potestis illis benefacere : me autem non semper habetis.\"},{\"verse\":8,\"text\":\"Quod habuit hæc, fecit : prævenit ungere corpus meum in sepulturam.\"},{\"verse\":9,\"text\":\"Amen dico vobis : Ubicumque prædicatum fuerit Evangelium istud in universo mundo, et quod fecit hæc, narrabitur in memoriam ejus.\"},{\"verse\":10,\"text\":\"Et Judas Iscariotes, unus de duodecim, abiit ad summos sacerdotes, ut proderet eum illis.\"},{\"verse\":11,\"text\":\"Qui audientes gavisi sunt : et promiserunt ei pecuniam se daturos. Et quærebat quomodo illum opportune traderet.\"},{\"verse\":12,\"text\":\"Et primo die azymorum quando Pascha immolabant, dicunt ei discipuli : Quo vis eamus, et paremus tibi ut manduces Pascha ?\"},{\"verse\":13,\"text\":\"Et mittit duos ex discipulis suis, et dicit eis : Ite in civitatem, et occurret vobis homo lagenam aquæ bajulans : sequimini eum,\"},{\"verse\":14,\"text\":\"et quocumque introierit, dicite domino domus, quia magister dicit : Ubi est refectio mea, ubi Pascha cum discipulis meis manducem ?\"},{\"verse\":15,\"text\":\"Et ipse vobis demonstrabit cœnaculum grande, stratum : et illic parate nobis.\"},{\"verse\":16,\"text\":\"Et abierunt discipuli ejus, et venerunt in civitatem : et invenerunt sicut dixerat illis, et paraverunt Pascha.\"},{\"verse\":17,\"text\":\"Vespere autem facto, venit cum duodecim.\"},{\"verse\":18,\"text\":\"Et discumbentibus eis, et manducantibus, ait Jesus : Amen dico vobis, quia unus ex vobis tradet me, qui manducat mecum.\"},{\"verse\":19,\"text\":\"At illi cœperunt contristari, et dicere ei singulatim : Numquid ego ?\"},{\"verse\":20,\"text\":\"Qui ait illis : Unus ex duodecim, qui intingit mecum manum in catino.\"},{\"verse\":21,\"text\":\"Et Filius quidem hominis vadit sicut scriptum est de eo : væ autem homini illi per quem Filius hominis tradetur ! bonum erat ei, si non esset natus homo ille.\"},{\"verse\":22,\"text\":\"Et manducantibus illis, accepit Jesus panem : et benedicens fregit, et dedit eis, et ait : Sumite, hoc est corpus meum.\"},{\"verse\":23,\"text\":\"Et accepto calice, gratias agens dedit eis : et biberunt ex illo omnes.\"},{\"verse\":24,\"text\":\"Et ait illis : Hic est sanguis meus novi testamenti, qui pro multis effundetur.\"},{\"verse\":25,\"text\":\"Amen dico vobis, quia jam non bibam de hoc genimine vitis usque in diem illum, cum illud bibam novum in regno Dei.\"},{\"verse\":26,\"text\":\"Et hymno dicto exierunt in montem Olivarum.\"},{\"verse\":27,\"text\":\"Et ait eis Jesus : Omnes scandalizabimini in me in nocte ista : quia scriptum est : Percutiam pastorem, et dispergentur oves.\"},{\"verse\":28,\"text\":\"Sed postquam resurrexero, præcedam vos in Galilæam.\"},{\"verse\":29,\"text\":\"Petrus autem ait illi : Et si omnes scandalizati fuerint in te, sed non ego.\"},{\"verse\":30,\"text\":\"Et ait illi Jesus : Amen dico tibi, quia tu hodie in nocte hac, priusquam gallus vocem bis dederit, ter me es negaturus.\"},{\"verse\":31,\"text\":\"At ille amplius loquebatur : Et si oportuerit me simul commori tibi, non te negabo. Similiter autem et omnes dicebant.\"},{\"verse\":32,\"text\":\"Et veniunt in prædium, cui nomen Gethsemani. Et ait discipulis suis : Sedete hic donec orem.\"},{\"verse\":33,\"text\":\"Et assumit Petrum, et Jacobum, et Joannem secum : et cœpit pavere et tædere.\"},{\"verse\":34,\"text\":\"Et ait illis : Tristis est anima mea usque ad mortem : sustinete hic, et vigilate.\"},{\"verse\":35,\"text\":\"Et cum processisset paululum, procidit super terram, et orabat ut, si fieri posset, transiret ab eo hora.\"},{\"verse\":36,\"text\":\"Et dixit : Abba pater, omnia tibi possibilia sunt : transfer calicem hunc a me : sed non quod ego volo, sed quod tu.\"},{\"verse\":37,\"text\":\"Et venit, et invenit eos dormientes. Et ait Petro : Simon, dormis ? non potuisti una hora vigilare ?\"},{\"verse\":38,\"text\":\"vigilate et orate, ut non intretis in tentationem. Spiritus quidem promptus est, caro vero infirma.\"},{\"verse\":39,\"text\":\"Et iterum abiens oravit, eumdem sermonem dicens.\"},{\"verse\":40,\"text\":\"Et reversus, denuo invenit eos dormientes (erant enim oculi eorum gravati), et ignorabant quid responderent ei.\"},{\"verse\":41,\"text\":\"Et venit tertio, et ait illis : Dormite jam, et requiescite. Sufficit : venit hora : ecce Filius hominis tradetur in manus peccatorum.\"},{\"verse\":42,\"text\":\"Surgite, eamus : ecce qui me tradet, prope est.\"},{\"verse\":43,\"text\":\"Et, adhuc eo loquente, venit Judas Iscariotes unus de duodecim, et cum eo turba multa cum gladiis et lignis, a summis sacerdotibus, et scribis, et senioribus.\"},{\"verse\":44,\"text\":\"Dederat autem traditor ejus signum eis, dicens : Quemcumque osculatus fuero, ipse est, tenete eum, et ducite caute.\"},{\"verse\":45,\"text\":\"Et cum venisset, statim accedens ad eum, ait : Ave Rabbi : et osculatus est eum.\"},{\"verse\":46,\"text\":\"At illi manus injecerunt in eum, et tenuerunt eum.\"},{\"verse\":47,\"text\":\"Unus autem quidam de circumstantibus educens gladium, percussit servum summi sacerdotis, et amputavit illi auriculam.\"},{\"verse\":48,\"text\":\"Et respondens Jesus, ait illis : Tamquam ad latronem existis cum gladiis et lignis comprehendere me ?\"},{\"verse\":49,\"text\":\"quotidie eram apud vos in templo docens, et non me tenuistis. Sed ut impleantur Scripturæ.\"},{\"verse\":50,\"text\":\"Tunc discipuli ejus relinquentes eum, omnes fugerunt.\"},{\"verse\":51,\"text\":\"Adolescens autem quidam sequebatur eum amictus sindone super nudo : et tenuerunt eum.\"},{\"verse\":52,\"text\":\"At ille rejecta sindone, nudus profugit ab eis.\"},{\"verse\":53,\"text\":\"Et adduxerunt Jesum ad summum sacerdotem : et convenerunt omnes sacerdotes, et scribæ, et seniores.\"},{\"verse\":54,\"text\":\"Petrus autem a longe secutus est eum usque intro in atrium summi sacerdotis : et sedebat cum ministris ad ignem, et calefaciebat se.\"},{\"verse\":55,\"text\":\"Summi vero sacerdotes et omne concilium quærebant adversus Jesum testimonium ut eum morti traderent : nec inveniebant.\"},{\"verse\":56,\"text\":\"Multi enim testimonium falsum dicebant adversus eum : et convenientia testimonia non erant.\"},{\"verse\":57,\"text\":\"Et quidam surgentes, falsum testimonium ferebant adversus eum, dicentes :\"},{\"verse\":58,\"text\":\"Quoniam nos audivimus eum dicentem : Ego dissolvam templum hoc manu factum, et per triduum aliud non manu factum ædificabo.\"},{\"verse\":59,\"text\":\"Et non erat conveniens testimonium illorum.\"},{\"verse\":60,\"text\":\"Et exsurgens summus sacerdos in medium, interrogavit Jesum, dicens : Non respondes quidquam ad ea quæ tibi objiciuntur ab his ?\"},{\"verse\":61,\"text\":\"Ille autem tacebat, et nihil respondit. Rursum summus sacerdos interrogabat eum, et dixit ei : Tu es Christus Filius Dei benedicti ?\"},{\"verse\":62,\"text\":\"Jesus autem dixit illi : Ego sum : et videbitis Filium hominis sedentem a dextris virtutis Dei, et venientem cum nubibus cæli.\"},{\"verse\":63,\"text\":\"Summus autem sacerdos scindens vestimenta sua, ait : Quid adhuc desideramus testes ?\"},{\"verse\":64,\"text\":\"Audistis blasphemiam : quid vobis videtur ? Qui omnes condemnaverunt eum esse reum mortis.\"},{\"verse\":65,\"text\":\"Et cœperunt quidam conspuere eum, et velare faciem ejus, et colaphis eum cædere, et dicere ei : Prophetiza : et ministri alapis eum cædebant.\"},{\"verse\":66,\"text\":\"Et cum esset Petrus in atrio deorsum, venit una ex ancillis summi sacerdotis :\"},{\"verse\":67,\"text\":\"et cum vidisset Petrum calefacientem se, aspiciens illum, ait : Et tu cum Jesu Nazareno eras.\"},{\"verse\":68,\"text\":\"At ille negavit, dicens : Neque scio, neque novi quid dicas. Et exiit foras ante atrium, et gallus cantavit.\"},{\"verse\":69,\"text\":\"Rursus autem cum vidisset illum ancilla, cœpit dicere circumstantibus : Quia hic ex illis est.\"},{\"verse\":70,\"text\":\"At ille iterum negavit. Et post pusillum rursus qui astabant, dicebant Petro : Vere ex illis es : nam et Galilæus es.\"},{\"verse\":71,\"text\":\"Ille autem cœpit anathematizare et jurare : Quia nescio hominem istum, quem dicitis.\"},{\"verse\":72,\"text\":\"Et statim gallus iterum cantavit. Et recordatus est Petrus verbi quod dixerat ei Jesus : Priusquam gallus cantet bis, ter me negabis. Et cœpit flere.\"}],\"summary\":\"The first part of the history of the passion of Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":13,\"label\":\"Mark 13\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":15,\"label\":\"Mark 15\"}}]]\n"])</script></body></html>
