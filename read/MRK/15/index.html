<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Mark 15 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">15</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MRK/">About <!-- -->Mark</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The continuation of the history of the passion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And straightway in the morning, the chief priests holding a consultation with the ancients and the scribes and the whole council, binding Jesus, led him away and delivered him to Pilate.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Pilate asked him: Art thou the king of the Jews? But he answering, saith to him: Thou sayest it.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the chief priests accused him in many things.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Pilate again asked him, saying: Answerest thou nothing? Behold in how many things they accuse thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But Jesus still answered nothing: so that Pilate wondered.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now on the festival day he was wont to release unto them one of the prisoners, whomsoever they demanded.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And there was one called Barabbas, who was put in prison with some seditious men, who in the sedition had committed murder.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when the multitude was come up, they began to desire that he would do as he had ever done unto them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Pilate answered them and said: Will you that I release to you the king of the Jews?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For he knew that the chief priests had delivered him up out of envy.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But the chief priests moved the people, that he should rather release Barabbas to them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Pilate again answering, saith to them: What will you then that I do to the king of the Jews?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But they again cried out: Crucify him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Pilate saith to them: Why, what evil hath he done? But they cried out the more: Crucify him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And so Pilate being willing to satisfy the people, released to them Barabbas: and delivered up Jesus, when he had scourged him, to be crucified.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the soldiers led him away into the court of the palace: and they called together the whole band.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they clothed him with purple: and, platting a crown of thorns, they put it upon him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they began to salute him: Hail, king of the Jews.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they struck his head with a reed: and they did spit on him. And bowing their knees, they adored him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And after they had mocked him, they took off the purple from him and put his own garments on him: and they led him out to crucify him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they forced one Simon a Cyrenian, who passed by coming out of the country, the father of Alexander and of Rufus, to take up his cross.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they bring him into the place called Golgotha, which being interpreted is, The place of Calvary.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they gave him to drink wine mingled with myrrh. But he took it not.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And crucifying him, they divided his garments, casting lots upon them, what every man should take.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And it was the third hour: and they crucified him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the inscription of his cause was written over: THE KING OF THE JEWS.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And with him they crucify two thieves: the one on his right hand, and the other on his left.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And the scripture was fulfilled, which saith: And with the wicked he was reputed.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they that passed by blasphemed him, wagging their heads and saying: Vah, thou that destroyest the temple of God and in three days buildest it up again:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Save thyself, coming down from the cross.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In like manner also the chief priests, mocking, said with the scribes one to another: He saved others; himself he cannot save.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Let Christ the king of Israel come down now from the cross, that we may see and believe. And they that were crucified with him, reviled him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And when the sixth hour was come, there was darkness over the whole earth until the ninth hour.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And at the ninth hour, Jesus cried out with a loud voice, saying: Eloi, Eloi, lamma sabacthani? Which is, being interpreted: My God, My God, Why hast thou forsaken me?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And some of the standers by hearing, said: Behold he calleth Elias.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And one running and filling a sponge with vinegar and putting it upon a reed, gave him to drink, saying: Stay, let us see if Elias come to take him down.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Jesus, having cried out with a loud voice, gave up the ghost.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And the veil of the temple was rent in two, from the top to the bottom.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And the centurion who stood over against him, seeing that crying out in this manner he had given up the ghost, said: Indeed this man was the son of God.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And there were also women looking on afar off: among whom was Mary Magdalen and Mary the mother of James the Less and of Joseph and Salome,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Who also when he was in Galilee followed him and ministered to him, and many other women that came up with him to Jerusalem.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And when evening was now come (because it was the Parasceve, that is, the day before the sabbath),</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Joseph of Arimathea, a noble counsellor, who was also himself looking for the kingdom of God, came and went in boldly to Pilate and begged the body of Jesus.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>But Pilate wondered that he should be already dead. And sending for the centurion, he asked him if he were already dead.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And when he had understood it by the centurion, he gave the body to Joseph.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And Joseph, buying fine linen and taking him down, wrapped him up in the fine linen and laid him in a sepulchre which was hewed out of a rock. And he rolled a stone to the door of the sepulchre.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And Mary Magdalen and Mary the mother of Joseph, beheld where he was laid.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et confestim mane consilium facientes summi sacerdotes cum senioribus, et scribis, et universo concilio, vincientes Jesum, duxerunt, et tradiderunt Pilato.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et interrogavit eum Pilatus : Tu es rex Judæorum ? At ille respondens, ait illi : Tu dicis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et accusabant eum summi sacerdotes in multis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Pilatus autem rursum interrogavit eum, dicens : Non respondes quidquam ? vide in quantis te accusant.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Jesus autem amplius nihil respondit, ita ut miraretur Pilatus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Per diem autem festum solebat dimittere illis unum ex vinctis, quemcumque petissent.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Erat autem qui dicebatur Barrabas, qui cum seditiosis erat vinctus, qui in seditione fecerat homicidium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et cum ascendisset turba, cœpit rogare, sicut semper faciebat illis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Pilatus autem respondit eis, et dixit : Vultis dimittam vobis regem Judæorum ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sciebat enim quod per invidiam tradidissent eum summi sacerdotes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pontifices autem concitaverunt turbam, ut magis Barabbam dimitteret eis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Pilatus autem iterum respondens, ait illis : Quid ergo vultis faciam regi Judæorum ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At illi iterum clamaverunt : Crucifige eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Pilatus vero dicebat illis : Quid enim mali fecit ? At illi magis clamabant : Crucifige eum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Pilatus autem volens populo satisfacere, dimisit illis Barabbam, et tradidit Jesum flagellis cæsum, ut crucifigeretur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Milites autem duxerunt eum in atrium prætorii, et convocant totam cohortem,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et induunt eum purpura, et imponunt ei plectentes spineam coronam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et cœperunt salutare eum : Ave rex Judæorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et percutiebant caput ejus arundine : et conspuebant eum, et ponentes genua, adorabant eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et postquam illuserunt ei, exuerunt illum purpura, et induerunt eum vestimentis suis : et educunt illum ut crucifigerent eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et angariaverunt prætereuntem quempiam, Simonem Cyrenæum venientem de villa, patrem Alexandri et Rufi, ut tolleret crucem ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et perducunt illum in Golgotha locum : quod est interpretatum Calvariæ locus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et dabant ei bibere myrrhatum vinum : et non accepit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et crucifigentes eum, diviserunt vestimenta ejus, mittentes sortem super eis, quis quid tolleret.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Erat autem hora tertia : et crucifixerunt eum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et erat titulus causæ ejus inscriptus : Rex Judæorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et cum eo crucifigunt duos latrones : unum a dextris, et alium a sinistris ejus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et impleta est Scriptura, quæ dicit : Et cum iniquis reputatus est.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et prætereuntes blasphemabant eum, moventes capita sua, et dicentes : Vah ! qui destruis templum Dei, et in tribus diebus reædificas,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>salvum fac temetipsum descendens de cruce.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Similiter et summi sacerdotes illudentes, ad alterutrum cum scribis dicebant : Alios salvos fecit ; seipsum non potest salvum facere.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Christus rex Israël descendat nunc de cruce, ut videamus, et credamus. Et qui cum eo crucifixi erant, convitiabantur ei.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et facta hora sexta, tenebræ factæ sunt per totam terram usque in horam nonam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et hora nona exclamavit Jesus voce magna, dicens : Eloi, eloi, lamma sabacthani ? quod est interpretatum : Deus meus, Deus meus, ut quid dereliquisti me ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et quidam de circumstantibus audientes, dicebant : Ecce Eliam vocat.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Currens autem unus, et implens spongiam aceto, circumponensque calamo, potum dabat ei, dicens : Sinite, videamus si veniat Elias ad deponendum eum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Jesus autem emissa voce magna expiravit.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et velum templi scissum est in duo, a summo usque deorsum.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Videns autem centurio, qui ex adverso stabat, quia sic clamans expirasset, ait : Vere hic homo Filius Dei erat.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Erant autem et mulieres de longe aspicientes : inter quas erat Maria Magdalene, et Maria Jacobi minoris, et Joseph mater, et Salome :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>et cum esset in Galilæa, sequebantur eum, et ministrabant ei, et aliæ multæ, quæ simul cum eo ascenderant Jerosolymam.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et cum jam sero esset factum (quia erat parasceve, quod est ante sabbatum),</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>venit Joseph ab Arimathæa nobilis decurio, qui et ipse erat exspectans regnum Dei, et audacter introivit ad Pilatum, et petiit corpus Jesu.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Pilatus autem mirabatur si jam obiisset. Et accersito centurione, interrogavit eum si jam mortuus esset.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et cum cognovisset a centurione, donavit corpus Joseph.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Joseph autem mercatus sindonem, et deponens eum involvit sindone, et posuit eum in monumento quod erat excisum de petra, et advolvit lapidem ad ostium monumenti.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Maria autem Magdalene et Maria Joseph aspici -study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MRK.15\",{\"bookId\":48,\"usfm\":\"MRK\",\"bookName\":\"Mark\",\"drName\":\"Mark\",\"chapter\":15,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And straightway in the morning, the chief priests holding a consultation with the ancients and the scribes and the whole council, binding Jesus, led him away and delivered him to Pilate.\"},{\"verse\":2,\"text\":\"And Pilate asked him: Art thou the king of the Jews? But he answering, saith to him: Thou sayest it.\"},{\"verse\":3,\"text\":\"And the chief priests accused him in many things.\"},{\"verse\":4,\"text\":\"And Pilate again asked him, saying: Answerest thou nothing? Behold in how many things they accuse thee.\"},{\"verse\":5,\"text\":\"But Jesus still answered nothing: so that Pilate wondered.\"},{\"verse\":6,\"text\":\"Now on the festival day he was wont to release unto them one of the prisoners, whomsoever they demanded.\"},{\"verse\":7,\"text\":\"And there was one called Barabbas, who was put in prison with some seditious men, who in the sedition had committed murder.\"},{\"verse\":8,\"text\":\"And when the multitude was come up, they began to desire that he would do as he had ever done unto them.\"},{\"verse\":9,\"text\":\"And Pilate answered them and said: Will you that I release to you the king of the Jews?\"},{\"verse\":10,\"text\":\"For he knew that the chief priests had delivered him up out of envy.\"},{\"verse\":11,\"text\":\"But the chief priests moved the people, that he should rather release Barabbas to them.\"},{\"verse\":12,\"text\":\"And Pilate again answering, saith to them: What will you then that I do to the king of the Jews?\"},{\"verse\":13,\"text\":\"But they again cried out: Crucify him.\"},{\"verse\":14,\"text\":\"And Pilate saith to them: Why, what evil hath he done? But they cried out the more: Crucify him.\"},{\"verse\":15,\"text\":\"And so Pilate being willing to satisfy the people, released to them Barabbas: and delivered up Jesus, when he had scourged him, to be crucified.\"},{\"verse\":16,\"text\":\"And the soldiers led him away into the court of the palace: and they called together the whole band.\"},{\"verse\":17,\"text\":\"And they clothed him with purple: and, platting a crown of thorns, they put it upon him.\"},{\"verse\":18,\"text\":\"And they began to salute him: Hail, king of the Jews.\"},{\"verse\":19,\"text\":\"And they struck his head with a reed: and they did spit on him. And bowing their knees, they adored him.\"},{\"verse\":20,\"text\":\"And after they had mocked him, they took off the purple from him and put his own garments on him: and they led him out to crucify him.\"},{\"verse\":21,\"text\":\"And they forced one Simon a Cyrenian, who passed by coming out of the country, the father of Alexander and of Rufus, to take up his cross.\"},{\"verse\":22,\"text\":\"And they bring him into the place called Golgotha, which being interpreted is, The place of Calvary.\"},{\"verse\":23,\"text\":\"And they gave him to drink wine mingled with myrrh. But he took it not.\"},{\"verse\":24,\"text\":\"And crucifying him, they divided his garments, casting lots upon them, what every man should take.\"},{\"verse\":25,\"text\":\"And it was the third hour: and they crucified him.\"},{\"verse\":26,\"text\":\"And the inscription of his cause was written over: THE KING OF THE JEWS.\"},{\"verse\":27,\"text\":\"And with him they crucify two thieves: the one on his right hand, and the other on his left.\"},{\"verse\":28,\"text\":\"And the scripture was fulfilled, which saith: And with the wicked he was reputed.\"},{\"verse\":29,\"text\":\"And they that passed by blasphemed him, wagging their heads and saying: Vah, thou that destroyest the temple of God and in three days buildest it up again:\"},{\"verse\":30,\"text\":\"Save thyself, coming down from the cross.\"},{\"verse\":31,\"text\":\"In like manner also the chief priests, mocking, said with the scribes one to another: He saved others; himself he cannot save.\"},{\"verse\":32,\"text\":\"Let Christ the king of Israel come down now from the cross, that we may see and believe. And they that were crucified with him, reviled him.\"},{\"verse\":33,\"text\":\"And when the sixth hour was come, there was darkness over the whole earth until the ninth hour.\"},{\"verse\":34,\"text\":\"And at the ninth hour, Jesus cried out with a loud voice, saying: Eloi, Eloi, lamma sabacthani? Which is, being interpreted: My God, My God, Why hast thou forsaken me?\"},{\"verse\":35,\"text\":\"And some of the standers by hearing, said: Behold he calleth Elias.\"},{\"verse\":36,\"text\":\"And one running and filling a sponge with vinegar and putting it upon a reed, gave him to drink, saying: Stay, let us see if Elias come to take him down.\"},{\"verse\":37,\"text\":\"And Jesus, having cried out with a loud voice, gave up the ghost.\"},{\"verse\":38,\"text\":\"And the veil of the temple was rent in two, from the top to the bottom.\"},{\"verse\":39,\"text\":\"And the centurion who stood over against him, seeing that crying out in this manner he had given up the ghost, said: Indeed this man was the son of God.\"},{\"verse\":40,\"text\":\"And there were also women looking on afar off: among whom was Mary Magdalen and Mary the mother of James the Less and of Joseph and Salome,\"},{\"verse\":41,\"text\":\"Who also when he was in Galilee followed him and ministered to him, and many other women that came up with him to Jerusalem.\"},{\"verse\":42,\"text\":\"And when evening was now come (because it was the Parasceve, that is, the day before the sabbath),\"},{\"verse\":43,\"text\":\"Joseph of Arimathea, a noble counsellor, who was also himself looking for the kingdom of God, came and went in boldly to Pilate and begged the body of Jesus.\"},{\"verse\":44,\"text\":\"But Pilate wondered that he should be already dead. And sending for the centurion, he asked him if he were already dead.\"},{\"verse\":45,\"text\":\"And when he had understood it by the centurion, he gave the body to Joseph.\"},{\"verse\":46,\"text\":\"And Joseph, buying fine linen and taking him down, wrapped him up in the fine linen and laid him in a sepulchre which was hewed out of a rock. And he rolled a stone to the door of the sepulchre.\"},{\"verse\":47,\"text\":\"And Mary Magdalen and Mary the mother of Joseph, beheld where he was laid.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et confestim mane consilium facientes summi sacerdotes cum senioribus, et scribis, et universo concilio, vincientes Jesum, duxerunt, et tradiderunt Pilato.\"},{\"verse\":2,\"text\":\"Et interrogavit eum Pilatus : Tu es rex Judæorum ? At ille respondens, ait illi : Tu dicis.\"},{\"verse\":3,\"text\":\"Et accusabant eum summi sacerdotes in multis.\"},{\"verse\":4,\"text\":\"Pilatus autem rursum interrogavit eum, dicens : Non respondes quidquam ? vide in quantis te accusant.\"},{\"verse\":5,\"text\":\"Jesus autem amplius nihil respondit, ita ut miraretur Pilatus.\"},{\"verse\":6,\"text\":\"Per diem autem festum solebat dimittere illis unum ex vinctis, quemcumque petissent.\"},{\"verse\":7,\"text\":\"Erat autem qui dicebatur Barrabas, qui cum seditiosis erat vinctus, qui in seditione fecerat homicidium.\"},{\"verse\":8,\"text\":\"Et cum ascendisset turba, cœpit rogare, sicut semper faciebat illis.\"},{\"verse\":9,\"text\":\"Pilatus autem respondit eis, et dixit : Vultis dimittam vobis regem Judæorum ?\"},{\"verse\":10,\"text\":\"Sciebat enim quod per invidiam tradidissent eum summi sacerdotes.\"},{\"verse\":11,\"text\":\"Pontifices autem concitaverunt turbam, ut magis Barabbam dimitteret eis.\"},{\"verse\":12,\"text\":\"Pilatus autem iterum respondens, ait illis : Quid ergo vultis faciam regi Judæorum ?\"},{\"verse\":13,\"text\":\"At illi iterum clamaverunt : Crucifige eum.\"},{\"verse\":14,\"text\":\"Pilatus vero dicebat illis : Quid enim mali fecit ? At illi magis clamabant : Crucifige eum.\"},{\"verse\":15,\"text\":\"Pilatus autem volens populo satisfacere, dimisit illis Barabbam, et tradidit Jesum flagellis cæsum, ut crucifigeretur.\"},{\"verse\":16,\"text\":\"Milites autem duxerunt eum in atrium prætorii, et convocant totam cohortem,\"},{\"verse\":17,\"text\":\"et induunt eum purpura, et imponunt ei plectentes spineam coronam.\"},{\"verse\":18,\"text\":\"Et cœperunt salutare eum : Ave rex Judæorum.\"},{\"verse\":19,\"text\":\"Et percutiebant caput ejus arundine : et conspuebant eum, et ponentes genua, adorabant eum.\"},{\"verse\":20,\"text\":\"Et postquam illuserunt ei, exuerunt illum purpura, et induerunt eum vestimentis suis : et educunt illum ut crucifigerent eum.\"},{\"verse\":21,\"text\":\"Et angariaverunt prætereuntem quempiam, Simonem Cyrenæum venientem de villa, patrem Alexandri et Rufi, ut tolleret crucem ejus.\"},{\"verse\":22,\"text\":\"Et perducunt illum in Golgotha locum : quod est interpretatum Calvariæ locus.\"},{\"verse\":23,\"text\":\"Et dabant ei bibere myrrhatum vinum : et non accepit.\"},{\"verse\":24,\"text\":\"Et crucifigentes eum, diviserunt vestimenta ejus, mittentes sortem super eis, quis quid tolleret.\"},{\"verse\":25,\"text\":\"Erat autem hora tertia : et crucifixerunt eum.\"},{\"verse\":26,\"text\":\"Et erat titulus causæ ejus inscriptus : Rex Judæorum.\"},{\"verse\":27,\"text\":\"Et cum eo crucifigunt duos latrones : unum a dextris, et alium a sinistris ejus.\"},{\"verse\":28,\"text\":\"Et impleta est Scriptura, quæ dicit : Et cum iniquis reputatus est.\"},{\"verse\":29,\"text\":\"Et prætereuntes blasphemabant eum, moventes capita sua, et dicentes : Vah ! qui destruis templum Dei, et in tribus diebus reædificas,\"},{\"verse\":30,\"text\":\"salvum fac temetipsum descendens de cruce.\"},{\"verse\":31,\"text\":\"Similiter et summi sacerdotes illudentes, ad alterutrum cum scribis dicebant : Alios salvos fecit ; seipsum non potest salvum facere.\"},{\"verse\":32,\"text\":\"Christus rex Israël descendat nunc de cruce, ut videamus, et credamus. Et qui cum eo crucifixi erant, convitiabantur ei.\"},{\"verse\":33,\"text\":\"Et facta hora sexta, tenebræ factæ sunt per totam terram usque in horam nonam.\"},{\"verse\":34,\"text\":\"Et hora nona exclamavit Jesus voce magna, dicens : Eloi, eloi, lamma sabacthani ? quod est interpretatum : Deus meus, Deus meus, ut quid dereliquisti me ?\"},{\"verse\":35,\"text\":\"Et quidam de circumstantibus audientes, dicebant : Ecce Eliam vocat.\"},{\"verse\":36,\"text\":\"Currens autem unus, et implens spongiam aceto, circumponensque calamo, potum dabat ei, dicens : Sinite, videamus si veniat Elias ad deponendum eum.\"},{\"verse\":37,\"text\":\"Jesus autem emissa voce magna expiravit.\"},{\"verse\":38,\"text\":\"Et velum templi scissum est in duo, a summo usque deorsum.\"},{\"verse\":39,\"text\":\"Videns autem centurio, qui ex adverso stabat, quia sic clamans expirasset, ait : Vere hic homo Filius Dei erat.\"},{\"verse\":40,\"text\":\"Erant autem et mulieres de longe aspicientes : inter quas erat Maria Magdalene, et Maria Jacobi minoris, et Joseph mater, et Salome :\"},{\"verse\":41,\"text\":\"et cum esset in Galilæa, sequebantur eum, et ministrabant ei, et aliæ multæ, quæ simul cum eo ascenderant Jerosolymam.\"},{\"verse\":42,\"text\":\"Et cum jam sero esset factum (quia erat parasceve, quod est ante sabbatum),\"},{\"verse\":43,\"text\":\"venit Joseph ab Arimathæa nobilis decurio, qui et ipse erat exspectans regnum Dei, et audacter introivit ad Pilatum, et petiit corpus Jesu.\"},{\"verse\":44,\"text\":\"Pilatus autem mirabatur si jam obiisset. Et accersito centurione, interrogavit eum si jam mortuus esset.\"},{\"verse\":45,\"text\":\"Et cum cognovisset a centurione, donavit corpus Joseph.\"},{\"verse\":46,\"text\":\"Joseph autem mercatus sindonem, et deponens eum involvit sindone, et posuit eum in monumento quod erat excisum de petra, et advolvit lapidem ad ostium monumenti.\"},{\"verse\":47,\"text\":\"Maria autem Magdalene et Maria Joseph aspiciebant ubi poneretur.\"}],\"summary\":\"The continuation of the history of the passion.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":14,\"label\":\"Mark 14\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":16,\"label\":\"Mark 16\"}}]]\n"])</script></body></html>
