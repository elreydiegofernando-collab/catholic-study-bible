f text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And again he entered into Capharnaum after some days.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And it was heard that he was in the house. And many came together, so that there was no room: no, not even at the door. And he spoke to them the word.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And they came to him, bringing one sick of the palsy, who was carried by four.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when they could not offer him unto him for the multitude, they uncovered the roof where he was: and opening it, they let down the bed wherein the man sick of the palsy lay.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when Jesus had seen their faith, he saith to the sick of the palsy: Son, thy sins are forgiven thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And there were some of the scribes sitting there and thinking in their hearts:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Why doth this man speak thus? He blasphemeth. Who can forgive sins, but God only?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Which Jesus presently knowing in his spirit that they so thought within themselves, saith to them: Why think you these things in your hearts?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Which is easier, to say to the sick of the palsy: Thy sins are forgiven thee; or to say: Arise, take up thy bed and walk?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But that you may know that the Son of man hath power on earth to forgive sins (he saith to the sick of the palsy):</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I say to thee: Arise. Take up thy bed and go into thy house.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And immediately he arose and, taking up his bed, went his way in the sight of all: so that all wondered and glorified God, saying: We never saw the like.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he went forth again to the sea side: and all the multitude came to him. And he taught them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when he was passing by, he saw Levi, the son of Alpheus, sitting at the receipt of custom; and he saith to him: Follow me. And rising up, he followed him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it came to pass as he sat at meat in his house, many publicans and sinners sat down together with Jesus and his disciples. For they were many, who also followed him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the scribes and the Pharisees, seeing that he ate with publicans and sinners, said to his disciples: Why doth your master eat and drink with publicans and sinners?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Jesus hearing this, saith to them: They that are well have no need of a physician, but they that are sick. For I came not to call the just, but sinners.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the disciples of John and the Pharisees used to fast. And they come and say to him: Why do the disciples of John and of the Pharisees fast; but thy disciples do not fast?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Jesus saith to them: Can the children of the marriage fast, as long as the bridegroom is with them? As long as they have the bridegroom with them, they cannot fast.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But the days will come when the bridegroom shall be taken away from them: and then they shall fast in those days.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>No man seweth a piece of raw cloth to an old garment: otherwise the new piecing taketh away from the old, and there is made a greater rent.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And no man putteth new wine into old bottles: otherwise the wine will burst the bottles, and both the wine will be spilled and the bottles will be lost. But new wine must be put into new bottles.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And it came to pass again, as the Lord walked through the corn fields on the sabbath, that his disciples began to go forward and to pluck the ears of corn.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the Pharisees said to him: Behold, why do they on the sabbath day that which is not lawful?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he said to them: Have you never read what David did when he had need and was hungry, himself and they that were with him?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>How he went into the house of God, under Abiathar the high priest, and did eat the loaves of proposition, which was not lawful to eat but for the priests, and gave to them who were with him?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he said to them: The sabbath was made for man, and not man for the sabbath.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Therefore the Son of man is Lord of the sabbath also.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et iterum intravit Capharnaum post dies,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et auditum est quod in domo esset, et convenerunt multi, ita ut non caperet neque ad januam, et loquebatur eis verbum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et venerunt ad eum ferentes paralyticum, qui a quatuor portabatur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et cum non possent offerre eum illi præ turba, nudaverunt tectum ubi erat : et patefacientes submiserunt grabatum in quo paralyticus jacebat.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cum autem vidisset Jesus fidem illorum, ait paralytico : Fili, dimittuntur tibi peccata tua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Erant autem illic quidam de scribis sedentes, et cogitantes in cordibus suis :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quid hic sic loquitur ? blasphemat. Quis potest dimittere peccata, nisi solus Deus ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quo statim cognito Jesus spiritu suo, quia sic cogitarent intra se, dicit illis : Quid ista cogitatis in cordibus vestris ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quid est facilius dicere paralytico : Dimittuntur tibi peccata : an dicere : Surge, tolle grabatum tuum, et ambula ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ut autem sciatis quia Filius hominis habet potestatem in terra dimittendi peccata (ait paralytico),</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>tibi dico : Surge, tolle grabatum tuum, et vade in domum tuam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et statim surrexit ille : et, sublato grabato, abiit coram omnibus, ita ut mirarentur omnes, et honorificent Deum, dicentes : Quia numquam sic vidimus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et egressus est rursus ad mare, omnisque turba veniebat ad eum, et docebat eos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et cum præteriret, vidit Levi Alphæi sedentem ad telonium, et ait illi : Sequere me. Et surgens secutus est eum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et factum est, cum accumberet in domo illius, multi publicani et peccatores simul discumbebant cum Jesu et discipulis ejus : erant enim multi, qui et sequebantur eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et scribæ et pharisæi videntes quia manducaret cum publicanis et peccatoribus, dicebant discipulis ejus : Quare cum publicanis et peccatoribus manducat et bibit Magister vester ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hoc audito Jesus ait illis : Non necesse habent sani medico, sed qui male habent : non enim veni vocare justos, sed peccatores.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et erant discipuli Joannis et pharisæi jejunantes : et veniunt, et dicunt illi : Quare discipuli Joannis et pharisæorum jejunant, tui autem discipuli non jejunant ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et ait illis Jesus : Numquid possunt filii nuptiarum, quamdiu sponsus cum illis est, jejunare ? Quanto tempore habent secum sponsum, non possunt jejunare.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Venient autem dies cum auferetur ab eis sponsus : et tunc jejunabunt in illis diebus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nemo assumentum panni rudis assuit vestimento veteri : alioquin aufert supplementum novum a veteri, et major scissura fit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et nemo mittit vinum novum in utres veteres : alioquin dirumpet vinum utres, et vinum effundetur, et utres peribunt : sed vinum novum in utres novos mitti debet.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et factum est iterum Dominus sabbatis ambularet per sata, et discipuli ejus cœperunt progredi, et vellere spicas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pharisæi autem dicebant ei : Ecce, quid faciunt sabbatis quod non licet ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ait illis : Numquam legistis quid fecerit David, quando necessitatem habuit, et esuriit ipse, et qui cum eo erant ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>quomodo introivit in domum Dei sub Abiathar principe sacerdotum, et panes propositionis manducavit, quos non licebat manducare, nisi sacerdotibus, et dedit eis qui cum eo erant ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et dicebat eis : Sabbatum propter hominem factum est, et non homo propter sabbatum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Itaque Dominus est Filius hominis, etiam sabbati.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Mark 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Mark 1" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width= tic/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"MRK.2\",{\"bookId\":48,\"usfm\":\"MRK\",\"bookName\":\"Mark\",\"drName\":\"Mark\",\"chapter\":2,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And again he entered into Capharnaum after some days.\"},{\"verse\":2,\"text\":\"And it was heard that he was in the house. And many came together, so that there was no room: no, not even at the door. And he spoke to them the word.\"},{\"verse\":3,\"text\":\"And they came to him, bringing one sick of the palsy, who was carried by four.\"},{\"verse\":4,\"text\":\"And when they could not offer him unto him for the multitude, they uncovered the roof where he was: and opening it, they let down the bed wherein the man sick of the palsy lay.\"},{\"verse\":5,\"text\":\"And when Jesus had seen their faith, he saith to the sick of the palsy: Son, thy sins are forgiven thee.\"},{\"verse\":6,\"text\":\"And there were some of the scribes sitting there and thinking in their hearts:\"},{\"verse\":7,\"text\":\"Why doth this man speak thus? He blasphemeth. Who can forgive sins, but God only?\"},{\"verse\":8,\"text\":\"Which Jesus presently knowing in his spirit that they so thought within themselves, saith to them: Why think you these things in your hearts?\"},{\"verse\":9,\"text\":\"Which is easier, to say to the sick of the palsy: Thy sins are forgiven thee; or to say: Arise, take up thy bed and walk?\"},{\"verse\":10,\"text\":\"But that you may know that the Son of man hath power on earth to forgive sins (he saith to the sick of the palsy):\"},{\"verse\":11,\"text\":\"I say to thee: Arise. Take up thy bed and go into thy house.\"},{\"verse\":12,\"text\":\"And immediately he arose and, taking up his bed, went his way in the sight of all: so that all wondered and glorified God, saying: We never saw the like.\"},{\"verse\":13,\"text\":\"And he went forth again to the sea side: and all the multitude came to him. And he taught them.\"},{\"verse\":14,\"text\":\"And when he was passing by, he saw Levi, the son of Alpheus, sitting at the receipt of custom; and he saith to him: Follow me. And rising up, he followed him.\"},{\"verse\":15,\"text\":\"And it came to pass as he sat at meat in his house, many publicans and sinners sat down together with Jesus and his disciples. For they were many, who also followed him.\"},{\"verse\":16,\"text\":\"And the scribes and the Pharisees, seeing that he ate with publicans and sinners, said to his disciples: Why doth your master eat and drink with publicans and sinners?\"},{\"verse\":17,\"text\":\"Jesus hearing this, saith to them: They that are well have no need of a physician, but they that are sick. For I came not to call the just, but sinners.\"},{\"verse\":18,\"text\":\"And the disciples of John and the Pharisees used to fast. And they come and say to him: Why do the disciples of John and of the Pharisees fast; but thy disciples do not fast?\"},{\"verse\":19,\"text\":\"And Jesus saith to them: Can the children of the marriage fast, as long as the bridegroom is with them? As long as they have the bridegroom with them, they cannot fast.\"},{\"verse\":20,\"text\":\"But the days will come when the bridegroom shall be taken away from them: and then they shall fast in those days.\"},{\"verse\":21,\"text\":\"No man seweth a piece of raw cloth to an old garment: otherwise the new piecing taketh away from the old, and there is made a greater rent.\"},{\"verse\":22,\"text\":\"And no man putteth new wine into old bottles: otherwise the wine will burst the bottles, and both the wine will be spilled and the bottles will be lost. But new wine must be put into new bottles.\"},{\"verse\":23,\"text\":\"And it came to pass again, as the Lord walked through the corn fields on the sabbath, that his disciples began to go forward and to pluck the ears of corn.\"},{\"verse\":24,\"text\":\"And the Pharisees said to him: Behold, why do they on the sabbath day that which is not lawful?\"},{\"verse\":25,\"text\":\"And he said to them: Have you never read what David did when he had need and was hungry, himself and they that were with him?\"},{\"verse\":26,\"text\":\"How he went into the house of God, under Abiathar the high priest, and did eat the loaves of proposition, which was not lawful to eat but for the priests, and gave to them who were with him?\"},{\"verse\":27,\"text\":\"And he said to them: The sabbath was made for man, and not man for the sabbath.\"},{\"verse\":28,\"text\":\"Therefore the Son of man is Lord of the sabbath also.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et iterum intravit Capharnaum post dies,\"},{\"verse\":2,\"text\":\"et auditum est quod in domo esset, et convenerunt multi, ita ut non caperet neque ad januam, et loquebatur eis verbum.\"},{\"verse\":3,\"text\":\"Et venerunt ad eum ferentes paralyticum, qui a quatuor portabatur.\"},{\"verse\":4,\"text\":\"Et cum non possent offerre eum illi præ turba, nudaverunt tectum ubi erat : et patefacientes submiserunt grabatum in quo paralyticus jacebat.\"},{\"verse\":5,\"text\":\"Cum autem vidisset Jesus fidem illorum, ait paralytico : Fili, dimittuntur tibi peccata tua.\"},{\"verse\":6,\"text\":\"Erant autem illic quidam de scribis sedentes, et cogitantes in cordibus suis :\"},{\"verse\":7,\"text\":\"Quid hic sic loquitur ? blasphemat. Quis potest dimittere peccata, nisi solus Deus ?\"},{\"verse\":8,\"text\":\"Quo statim cognito Jesus spiritu suo, quia sic cogitarent intra se, dicit illis : Quid ista cogitatis in cordibus vestris ?\"},{\"verse\":9,\"text\":\"Quid est facilius dicere paralytico : Dimittuntur tibi peccata : an dicere : Surge, tolle grabatum tuum, et ambula ?\"},{\"verse\":10,\"text\":\"Ut autem sciatis quia Filius hominis habet potestatem in terra dimittendi peccata (ait paralytico),\"},{\"verse\":11,\"text\":\"tibi dico : Surge, tolle grabatum tuum, et vade in domum tuam.\"},{\"verse\":12,\"text\":\"Et statim surrexit ille : et, sublato grabato, abiit coram omnibus, ita ut mirarentur omnes, et honorificent Deum, dicentes : Quia numquam sic vidimus.\"},{\"verse\":13,\"text\":\"Et egressus est rursus ad mare, omnisque turba veniebat ad eum, et docebat eos.\"},{\"verse\":14,\"text\":\"Et cum præteriret, vidit Levi Alphæi sedentem ad telonium, et ait illi : Sequere me. Et surgens secutus est eum.\"},{\"verse\":15,\"text\":\"Et factum est, cum accumberet in domo illius, multi publicani et peccatores simul discumbebant cum Jesu et discipulis ejus : erant enim multi, qui et sequebantur eum.\"},{\"verse\":16,\"text\":\"Et scribæ et pharisæi videntes quia manducaret cum publicanis et peccatoribus, dicebant discipulis ejus : Quare cum publicanis et peccatoribus manducat et bibit Magister vester ?\"},{\"verse\":17,\"text\":\"Hoc audito Jesus ait illis : Non necesse habent sani medico, sed qui male habent : non enim veni vocare justos, sed peccatores.\"},{\"verse\":18,\"text\":\"Et erant discipuli Joannis et pharisæi jejunantes : et veniunt, et dicunt illi : Quare discipuli Joannis et pharisæorum jejunant, tui autem discipuli non jejunant ?\"},{\"verse\":19,\"text\":\"Et ait illis Jesus : Numquid possunt filii nuptiarum, quamdiu sponsus cum illis est, jejunare ? Quanto tempore habent secum sponsum, non possunt jejunare.\"},{\"verse\":20,\"text\":\"Venient autem dies cum auferetur ab eis sponsus : et tunc jejunabunt in illis diebus.\"},{\"verse\":21,\"text\":\"Nemo assumentum panni rudis assuit vestimento veteri : alioquin aufert supplementum novum a veteri, et major scissura fit.\"},{\"verse\":22,\"text\":\"Et nemo mittit vinum novum in utres veteres : alioquin dirumpet vinum utres, et vinum effundetur, et utres peribunt : sed vinum novum in utres novos mitti debet.\"},{\"verse\":23,\"text\":\"Et factum est iterum Dominus sabbatis ambularet per sata, et discipuli ejus cœperunt progredi, et vellere spicas.\"},{\"verse\":24,\"text\":\"Pharisæi autem dicebant ei : Ecce, quid faciunt sabbatis quod non licet ?\"},{\"verse\":25,\"text\":\"Et ait illis : Numquam legistis quid fecerit David, quando necessitatem habuit, et esuriit ipse, et qui cum eo erant ?\"},{\"verse\":26,\"text\":\"quomodo introivit in domum Dei sub Abiathar principe sacerdotum, et panes propositionis manducavit, quos non licebat manducare, nisi sacerdotibus, et dedit eis qui cum eo erant ?\"},{\"verse\":27,\"text\":\"Et dicebat eis : Sabbatum propter hominem factum est, et non homo propter sabbatum.\"},{\"verse\":28,\"text\":\"Itaque Dominus est Filius hominis, etiam sabbati.\"}],\"summary\":\"Christ heals the sick of the palsy. He calls Matthew and excuses his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":1,\"label\":\"Mark 1\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":3,\"label\":\"Mark 3\"}}]]\n"])</script></body></html>
