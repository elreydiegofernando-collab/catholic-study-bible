35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Mark<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/MRK/">About <!-- -->Mark</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ heals the withered hand. He chooses the twelve. He confutes the blasphemy of the Pharisees.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And he entered again into the synagogue: and there was a man there who had a withered hand.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they watched him whether he would heal on the sabbath days, that they might accuse him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said to the man who had the withered hand: Stand up in the midst.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he saith to them: Is it lawful to do good on the sabbath days, or to do evil? To save life, or to destroy? But they held their peace.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And looking round about on them with anger, being grieved for the blindness of their hearts, he saith to the man: Stretch forth thy hand. And he stretched it forth: and his hand was restored unto him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Pharisees going out, immediately made a consultation with the Herodians against him, how they might destroy him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But Jesus retired with his disciples to the sea; and a great multitude followed him from Galilee and Judea,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And from Jerusalem, and from Idumea and from beyond the Jordan. And they about Tyre and Sidon, a great multitude, hearing the things which he did, came to him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he spoke to his disciples that a small ship should wait on him, because of the multitude, lest they should throng him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For he healed many, so that they pressed upon him for to touch him, as many as had evils.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the unclean spirits, when they saw him, fell down before him: and they cried, saying:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou art the Son of God. And he strictly charged them that they should not make him known.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And going up into a mountain, he called unto him whom he would himself: and they came to him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he made that twelve should be with him, and that he might send them to preach.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he gave them power to heal sicknesses, and to cast out devils.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And to Simon he gave the name Peter:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And James the son of Zebedee, and John the brother of James; and he named them Boanerges, which is, The sons of thunder.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Andrew and Philip, and Bartholomew and Matthew, and Thomas and James of Alpheus, and Thaddeus and Simon the Cananean:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Judas Iscariot, who also betrayed him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they come to a house, and the multitude cometh together again, so that they could not so much as eat bread.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when his friends had heard of it, they went out to lay hold on him. For they said: He is become mad.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the scribes who were come down from Jerusalem, said: He hath Beelzebub, and by the prince of devils he casteth out devils.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And after he had called them together, he said to them in parables: How can Satan cast out Satan?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And if a kingdom be divided against itself, that kingdom cannot stand.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And if a house be divided against itself, that house cannot stand.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And if Satan be risen up against himself, he is divided, and cannot stand, but hath an end.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>No man can enter into the house of a strong man and rob him of his goods, unless he first bind the strong man, and then shall he plunder his house.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Amen I say to you that all sins shall be forgiven unto the sons of men, and the blasphemies wherewith they shall blaspheme:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But he that shall blaspheme against the Holy Ghost, shall never have forgiveness, but shall be guilty of an everlasting sin.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Because they said: He hath an unclean spirit.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And his mother and his brethren came; and standing without, sent unto him, calling him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the multitude sat about him; and they say to him: Behold thy mother and thy brethren without seek for thee.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And answering them, he said: Who is my mother and my brethren?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And looking round about on them who sat about him, he saith: Behold my mother and my brethren.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>For whosoever shall do the will of God, he is my brother, and my sister, and mother.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et introivit iterum in synagogam : et erat ibi homo habens manum aridam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et observabant eum, si sabbatis curaret, ut accusarent illum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ait homini habenti manum aridam : Surge in medium.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dicit eis : Licet sabbatis benefacere, an male ? animam salvam facere, an perdere ? At illi tacebant.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et circumspiciens eos cum ira, contristatus super cæcitate cordis eorum, dicit homini : Extende manum tuam. Et extendit, et restituta est manus illi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Exeuntes autem pharisæi, statim cum Herodianis consilium faciebant adversus eum quomodo eum perderent.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Jesus autem cum discipulis suis secessit ad mare : et multa turba a Galilæa et Judæa secuta est eum,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et ab Jerosolymis, et ab Idumæa, et trans Jordanem : et qui circa Tyrum et Sidonem multitudo magna, audientes quæ faciebat, venerunt ad eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et dicit discipulis suis ut navicula sibi deserviret propter turbam, ne comprimerent eum :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>multos enim sanabat, ita ut irruerent in eum ut illum tangerent, quotquot habebant plagas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et spiritus immundi, cum illum videbant, procidebant ei : et clamabant, dicentes :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tu es Filius Dei. Et vehementer comminabatur eis ne manifestarent illum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et ascendens in montem vocavit ad se quos voluit ipse : et venerunt ad eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et fecit ut essent duodecim cum illo : et ut mitteret eos prædicare.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et dedit illis potestatem curandi infirmitates et ejiciendi dæmonia.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et imposuit Simoni nomen Petrus :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et Jacobum Zebedæi, et Joannem fratrem Jacobi, et imposuit eis nomina Boanerges, quod est, Filii tonitrui :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et Andræam, et Philippum, et Bartholomæum, et Matthæum, et Thomam, et Jacobum Alphæi, et Thaddæum, et Simonem Cananæum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et Judam Iscariotem, qui et tradidit illum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et veniunt ad domum : et convenit iterum turba, ita ut non possent neque panem manducare.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et cum audissent sui, exierunt tenere eum : dicebant enim : Quoniam in furorem versus est.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et scribæ, qui ab Jerosolymis descenderant, dicebant : Quoniam Beelzebub habet, et quia in principe dæmoniorum ejicit dæmonia.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et convocatis eis in parabolis dicebat illis : Quomodo potest Satanas Satanam ejicere ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et si regnum in se dividatur, non potest regnum illud stare.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et si domus super semetipsam dispertiatur, non potest domus illa stare.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et si Satanas consurrexerit in semetipsum, dispertitus est, et non poterit stare, sed finem habet.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nemo potest vasa fortis ingressus in domum diripere, nisi prius fortem alliget, et tunc domum ejus diripiet.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Amen dico vobis, quoniam omnia dimittentur filiis hominum peccata, et blasphemiæ quibus blasphemaverint :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>qui autem blasphemaverit in Spiritum Sanctum, non habebit remissionem in æternum, sed reus erit æterni delicti.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quoniam dicebant : Spiritum immundum habet.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et veniunt mater ejus et fratres : et foris stantes miserunt ad eum vocantes eum,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et sedebat circa eum turba : et dicunt ei : Ecce mater tua et fratres tui foris quærunt te.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et respondens eis, ait : Quæ est mater mea et fratres mei ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et circumspiciens eos, qui in circuitu ejus sedebant, ait : Ecce mater mea et fratres mei.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Qui enim fecerit voluntatem Dei, hic frater meus, et soror mea, et mater est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/MRK/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Mark 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-r ":5,\"text\":\"And looking round about on them with anger, being grieved for the blindness of their hearts, he saith to the man: Stretch forth thy hand. And he stretched it forth: and his hand was restored unto him.\"},{\"verse\":6,\"text\":\"And the Pharisees going out, immediately made a consultation with the Herodians against him, how they might destroy him.\"},{\"verse\":7,\"text\":\"But Jesus retired with his disciples to the sea; and a great multitude followed him from Galilee and Judea,\"},{\"verse\":8,\"text\":\"And from Jerusalem, and from Idumea and from beyond the Jordan. And they about Tyre and Sidon, a great multitude, hearing the things which he did, came to him.\"},{\"verse\":9,\"text\":\"And he spoke to his disciples that a small ship should wait on him, because of the multitude, lest they should throng him.\"},{\"verse\":10,\"text\":\"For he healed many, so that they pressed upon him for to touch him, as many as had evils.\"},{\"verse\":11,\"text\":\"And the unclean spirits, when they saw him, fell down before him: and they cried, saying:\"},{\"verse\":12,\"text\":\"Thou art the Son of God. And he strictly charged them that they should not make him known.\"},{\"verse\":13,\"text\":\"And going up into a mountain, he called unto him whom he would himself: and they came to him.\"},{\"verse\":14,\"text\":\"And he made that twelve should be with him, and that he might send them to preach.\"},{\"verse\":15,\"text\":\"And he gave them power to heal sicknesses, and to cast out devils.\"},{\"verse\":16,\"text\":\"And to Simon he gave the name Peter:\"},{\"verse\":17,\"text\":\"And James the son of Zebedee, and John the brother of James; and he named them Boanerges, which is, The sons of thunder.\"},{\"verse\":18,\"text\":\"And Andrew and Philip, and Bartholomew and Matthew, and Thomas and James of Alpheus, and Thaddeus and Simon the Cananean:\"},{\"verse\":19,\"text\":\"And Judas Iscariot, who also betrayed him.\"},{\"verse\":20,\"text\":\"And they come to a house, and the multitude cometh together again, so that they could not so much as eat bread.\"},{\"verse\":21,\"text\":\"And when his friends had heard of it, they went out to lay hold on him. For they said: He is become mad.\"},{\"verse\":22,\"text\":\"And the scribes who were come down from Jerusalem, said: He hath Beelzebub, and by the prince of devils he casteth out devils.\"},{\"verse\":23,\"text\":\"And after he had called them together, he said to them in parables: How can Satan cast out Satan?\"},{\"verse\":24,\"text\":\"And if a kingdom be divided against itself, that kingdom cannot stand.\"},{\"verse\":25,\"text\":\"And if a house be divided against itself, that house cannot stand.\"},{\"verse\":26,\"text\":\"And if Satan be risen up against himself, he is divided, and cannot stand, but hath an end.\"},{\"verse\":27,\"text\":\"No man can enter into the house of a strong man and rob him of his goods, unless he first bind the strong man, and then shall he plunder his house.\"},{\"verse\":28,\"text\":\"Amen I say to you that all sins shall be forgiven unto the sons of men, and the blasphemies wherewith they shall blaspheme:\"},{\"verse\":29,\"text\":\"But he that shall blaspheme against the Holy Ghost, shall never have forgiveness, but shall be guilty of an everlasting sin.\"},{\"verse\":30,\"text\":\"Because they said: He hath an unclean spirit.\"},{\"verse\":31,\"text\":\"And his mother and his brethren came; and standing without, sent unto him, calling him.\"},{\"verse\":32,\"text\":\"And the multitude sat about him; and they say to him: Behold thy mother and thy brethren without seek for thee.\"},{\"verse\":33,\"text\":\"And answering them, he said: Who is my mother and my brethren?\"},{\"verse\":34,\"text\":\"And looking round about on them who sat about him, he saith: Behold my mother and my brethren.\"},{\"verse\":35,\"text\":\"For whosoever shall do the will of God, he is my brother, and my sister, and mother.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et introivit iterum in synagogam : et erat ibi homo habens manum aridam.\"},{\"verse\":2,\"text\":\"Et observabant eum, si sabbatis curaret, ut accusarent illum.\"},{\"verse\":3,\"text\":\"Et ait homini habenti manum aridam : Surge in medium.\"},{\"verse\":4,\"text\":\"Et dicit eis : Licet sabbatis benefacere, an male ? animam salvam facere, an perdere ? At illi tacebant.\"},{\"verse\":5,\"text\":\"Et circumspiciens eos cum ira, contristatus super cæcitate cordis eorum, dicit homini : Extende manum tuam. Et extendit, et restituta est manus illi.\"},{\"verse\":6,\"text\":\"Exeuntes autem pharisæi, statim cum Herodianis consilium faciebant adversus eum quomodo eum perderent.\"},{\"verse\":7,\"text\":\"Jesus autem cum discipulis suis secessit ad mare : et multa turba a Galilæa et Judæa secuta est eum,\"},{\"verse\":8,\"text\":\"et ab Jerosolymis, et ab Idumæa, et trans Jordanem : et qui circa Tyrum et Sidonem multitudo magna, audientes quæ faciebat, venerunt ad eum.\"},{\"verse\":9,\"text\":\"Et dicit discipulis suis ut navicula sibi deserviret propter turbam, ne comprimerent eum :\"},{\"verse\":10,\"text\":\"multos enim sanabat, ita ut irruerent in eum ut illum tangerent, quotquot habebant plagas.\"},{\"verse\":11,\"text\":\"Et spiritus immundi, cum illum videbant, procidebant ei : et clamabant, dicentes :\"},{\"verse\":12,\"text\":\"Tu es Filius Dei. Et vehementer comminabatur eis ne manifestarent illum.\"},{\"verse\":13,\"text\":\"Et ascendens in montem vocavit ad se quos voluit ipse : et venerunt ad eum.\"},{\"verse\":14,\"text\":\"Et fecit ut essent duodecim cum illo : et ut mitteret eos prædicare.\"},{\"verse\":15,\"text\":\"Et dedit illis potestatem curandi infirmitates et ejiciendi dæmonia.\"},{\"verse\":16,\"text\":\"Et imposuit Simoni nomen Petrus :\"},{\"verse\":17,\"text\":\"et Jacobum Zebedæi, et Joannem fratrem Jacobi, et imposuit eis nomina Boanerges, quod est, Filii tonitrui :\"},{\"verse\":18,\"text\":\"et Andræam, et Philippum, et Bartholomæum, et Matthæum, et Thomam, et Jacobum Alphæi, et Thaddæum, et Simonem Cananæum,\"},{\"verse\":19,\"text\":\"et Judam Iscariotem, qui et tradidit illum.\"},{\"verse\":20,\"text\":\"Et veniunt ad domum : et convenit iterum turba, ita ut non possent neque panem manducare.\"},{\"verse\":21,\"text\":\"Et cum audissent sui, exierunt tenere eum : dicebant enim : Quoniam in furorem versus est.\"},{\"verse\":22,\"text\":\"Et scribæ, qui ab Jerosolymis descenderant, dicebant : Quoniam Beelzebub habet, et quia in principe dæmoniorum ejicit dæmonia.\"},{\"verse\":23,\"text\":\"Et convocatis eis in parabolis dicebat illis : Quomodo potest Satanas Satanam ejicere ?\"},{\"verse\":24,\"text\":\"Et si regnum in se dividatur, non potest regnum illud stare.\"},{\"verse\":25,\"text\":\"Et si domus super semetipsam dispertiatur, non potest domus illa stare.\"},{\"verse\":26,\"text\":\"Et si Satanas consurrexerit in semetipsum, dispertitus est, et non poterit stare, sed finem habet.\"},{\"verse\":27,\"text\":\"Nemo potest vasa fortis ingressus in domum diripere, nisi prius fortem alliget, et tunc domum ejus diripiet.\"},{\"verse\":28,\"text\":\"Amen dico vobis, quoniam omnia dimittentur filiis hominum peccata, et blasphemiæ quibus blasphemaverint :\"},{\"verse\":29,\"text\":\"qui autem blasphemaverit in Spiritum Sanctum, non habebit remissionem in æternum, sed reus erit æterni delicti.\"},{\"verse\":30,\"text\":\"Quoniam dicebant : Spiritum immundum habet.\"},{\"verse\":31,\"text\":\"Et veniunt mater ejus et fratres : et foris stantes miserunt ad eum vocantes eum,\"},{\"verse\":32,\"text\":\"et sedebat circa eum turba : et dicunt ei : Ecce mater tua et fratres tui foris quærunt te.\"},{\"verse\":33,\"text\":\"Et respondens eis, ait : Quæ est mater mea et fratres mei ?\"},{\"verse\":34,\"text\":\"Et circumspiciens eos, qui in circuitu ejus sedebant, ait : Ecce mater mea et fratres mei.\"},{\"verse\":35,\"text\":\"Qui enim fecerit voluntatem Dei, hic frater meus, et soror mea, et mater est.\"}],\"summary\":\"Christ heals the withered hand. He chooses the twelve. He confutes the blasphemy of the Pharisees.\",\"intro\":null,\"prev\":{\"usfm\":\"MRK\",\"chapter\":2,\"label\":\"Mark 2\"},\"next\":{\"usfm\":\"MRK\",\"chapter\":4,\"label\":\"Mark 4\"}}]]\n"])</script></body></html>
