ss="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">28</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Paralipomenon</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2CH/">About <!-- -->2 Chronicles</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The wicked and unhappy reign of Achaz.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Achaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: he did not that which was right in the sight of the Lord as David his father had done,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But walked in the ways of the kings of Israel; moreover also he cast statues for Baalim.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>It was he that burnt incense in the valley of Benennom, and consecrated his sons in the fire according to the manner of the nations, which the Lord slew at the coming of the children of Israel.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He sacrificed also, and burnt incense in the high places, and on the hills, and under every green tree.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the Lord his God delivered him into the hands of the king of Syria, who defeated him, and took a great booty out of his kingdom, and carried it to Damascus: he was also delivered into the hands of the king of Israel, who overthrew him with a great slaughter.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For Phacee the son of Romelia slew of Juda a hundred and twenty thousand in one day, all valiant men, because they had forsaken the Lord the God of their fathers.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>At the same time Zechri a powerful man of Ephraim, slew Maasias the king’s son, and Ezricam the governor of his house, and Elcana who was next to the king.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the children of Israel carried away of their brethren two hundred thousand women, boys, and girls, and an immense booty: and they brought it to Samaria.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>At that time there was a prophet of the Lord there, whose name was Oded: and he went out to meet the army that came to Samaria, and said to them: Behold the Lord the God of your fathers being angry with Juda, hath delivered them into your hands, and you have butchered them cruelly, so that your cruelty hath reached up to heaven.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Moreover you have a mind to keep under the children of Juda and Jerusalem for your bondmen and bondwomen, which ought not to be done: for you have sinned in this against the Lord your God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But hear ye my counsel, and release the captives that you have brought of your brethren, because a great indignation of the Lord hangeth over you.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then some of the chief men of the sons of Ephraim, Azarias the son of Johanan, Barachias the son of Mosollamoth, Ezechias the son of Sellum, and Amasa the son of Adali, stood up against them that came from the war.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they said to them: You shall not bring in the captives hither, lest we sin against the Lord. Why will you add to our sins, and heap up upon our former offences? for the sin is great, and the fierce anger of the Lord hangeth over Israel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So the soldiers left the spoils, and all that they had taken, before the princes and all the multitude.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the men, whom we mentioned above, rose up and took the captives, and with the spoils clothed all them that were naked: and when they had clothed and shod them, and refreshed them with meat and drink, and anointed them because of their labour, and had taken care of them, they set such of them as could not walk, and were feeble, upon beasts, and brought them to Jericho the city of palm trees to their brethren, and they returned to Samaria.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>At that time king Achaz sent to the king of the Assyrians asking help.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the Edomites came and slew many of Juda, and took a great booty.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Philistines also spread themselves among the cities of the plains, and to the south of Juda: and they took Bethsames, and Aialon, and Gaderoth, and Socho, and Thamnan, and Gamzo, with their villages, and they dwelt in them.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For the Lord had humbled Juda because of Achaz the king of Juda, for he had stripped it of help, and had contemned the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he brought against him Thelgathphalnasar king of the Assyrians, who also afflicted him, and plundered him without any resistance.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Achaz stripped the house of the Lord, and the house of the kings, and of the princes, and gave gifts to the king of the Assyrians, and yet it availed him nothing.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Moreover also in the time of his distress he increased contempt against the Lord: king Achaz himself by himself,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sacrificed victims to the gods of Damascus that struck him, and he said: The gods of the kings of Syria help them, and I will appease them with victims, and they will help me; whereas on the contrary they were the ruin of him, and of all Israel.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Then Achaz having taken away all the vessels of the house of God, and broken them, shut up the doors of the temple of God, and made himself altars in all the corners of Jerusalem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And in all the cities of Juda he built altars to burn frankincense, and he provoked the Lord the God of his fathers to wrath.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But the rest of his acts, and all his works first and last are written in the book of the kings of Juda and Israel.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Achaz slept with his fathers, and they buried him in the city of Jerusalem: for they received him not into the sepulchres of the kings of Israel. And Ezechias his son reigned in his stead.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Viginti annorum erat Achaz cum regnare cœpisset, et sedecim annis regnavit in Jerusalem. Non fecit rectum in conspectu Domini sicut David pater ejus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sed ambulavit in viis regum Israël, insuper et statuas fudit Baalim.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ipse est qui adolevit incensum in valle Benennom, et lustravit filios suos in igne juxta ritum gentium quas interfecit Dominus in adventu filiorum Israël.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sacrificabat quoque, et thymiama succendebat in excelsis, et in collibus, et sub omni ligno frondoso.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tradiditque eum Dominus Deus ejus in manu regis Syriæ, qui percussit eum, magnamque prædam cepit de ejus imperio, et adduxit in Damascum : manibus quoque regis Israël traditus est, et percussus plaga grandi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Occiditque Phacee filius Romeliæ, de Juda centum viginti millia in die uno, omnes viros bellatores : eo quod reliquissent Dominum Deum patrum suorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Eodem tempore occidit Zechri, vir potens ex Ephraim, Maasiam filium regis, et Ezricam ducem domus ejus, Elcanam quoque secundum a rege.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ceperuntque filii Israël de fratribus suis ducenta millia mulierum, puerorum, et puellarum, et infinitam prædam : pertuleruntque eam in Samariam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ea tempestate erat ibi propheta Domini, nomine Oded : qui egressus obviam exercitui venienti in Samariam, dixit eis : Ecce iratus Dominus Deus patrum vestrorum contra Juda, tradidit eos in manibus vestris, et occidistis eos atrociter, ita ut ad cælum pertingeret vestra crudelitas.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Insuper filios Juda et Jerusalem vultis vobis subjicere in servos et ancillas : quod nequaquam facto opus est : peccastis enim super hoc Domino Deo vestro.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sed audite consilium meum, et reducite captivos quos adduxistis de fratribus vestris, quia magnus furor Domini imminet vobis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Steterunt itaque viri de principibus filiorum Ephraim, Azarias filius Johanan, Barachias filius Mosollamoth, Ezechias filius Sellum, et Amasa filius Adali, contra eos qui veniebant de prælio,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et dixerunt eis : Non introducetis huc captivos, ne peccemus Domino. Quare vultis adjicere super peccata nostra, et vetera cumulare delicta ? grande quippe peccatum est, et ira furoris Domini imminet super Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dimiseruntque viri bellatores prædam, et universa quæ ceperant, coram principibus, et omni multitudine.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Steteruntque viri quos supra memoravimus, et apprehendentes captivos, omnesque qui nudi erant, vestierunt de spoliis : cumque vestissent eos, et calceassent, et refecissent cibo ac potu, unxissentque propter laborem, et adhibuissent eis curam : quicumque ambulare non poterant, et erant imbecillo corpore, imposuerunt eos jumentis, et adduxerunt Jericho civitatem palmarum ad fratres eorum, ipsique reversi sunt in Samariam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tempore illo misit rex Achaz ad regem Assyriorum, postulans auxilium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Veneruntque Idumæi, et percusserunt multos ex Juda, et ceperunt prædam magnam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Philisthiim quoque diffusi sunt per urbes campestres, et ad meridiem Juda : ceperuntque Bethsames, et Ajalon, et Gaderoth, Socho quoque, et Thamnan, et Gamzo, cum viculis suis, et habitaverunt in eis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Humiliaverat enim Dominus Judam propter Achaz regem Juda, eo quod nudasset eum auxilio, et contemptui habuisset Dominum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Adduxitque contra eum Thelgathphalnasar regem Assyriorum, qui et afflixit eum, et nullo resistente vastavit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Igitur Achaz, spoliata domo Domini, et domo regum ac principum, dedit regi Assyriorum munera, et tamen nihil ei profuit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Insuper et tempore angustiæ suæ auxit contemptum in Dominum, ipse per se rex Achaz,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>immolavit diis Damasci victimas percussoribus suis, et dixit : Dii regum Syriæ auxiliantur eis, quos ego placabo hostiis, et aderunt mihi : cum e contrario ipsi fuerint ruinæ ei, et universo Israël.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Direptis itaque Achaz omnibus vasis domus Dei, atque confractis, clausit januas templi Dei, et fecit sibi altaria in universis angulis Jerusalem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In omnibus quoque urbibus Juda exstruxit aras ad cremandum thus, atque ad iracundiam provocavit Dominum Deum patrum suorum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Reliqua autem sermonum ejus, et omnium operum suorum priorum et novissimorum, scripta sunt in libro regum Juda et Israël.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dormivitque Achaz cum patribus suis, et sepelierunt eum in civitate Jerusalem : neque enim receperunt eum in sepulchra regum Israël. Regnavitque Ezechias filius ejus pro eo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/27/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Chronicles 27</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/29/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Chronicles 29</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->28<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 2 Chronicles 27" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/27/"><svg viewBox 11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"2CH.28\",{\"bookId\":14,\"usfm\":\"2CH\",\"bookName\":\"2 Chronicles\",\"drName\":\"2 Paralipomenon\",\"chapter\":28,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"Achaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: he did not that which was right in the sight of the Lord as David his father had done,\"},{\"verse\":2,\"text\":\"But walked in the ways of the kings of Israel; moreover also he cast statues for Baalim.\"},{\"verse\":3,\"text\":\"It was he that burnt incense in the valley of Benennom, and consecrated his sons in the fire according to the manner of the nations, which the Lord slew at the coming of the children of Israel.\"},{\"verse\":4,\"text\":\"He sacrificed also, and burnt incense in the high places, and on the hills, and under every green tree.\"},{\"verse\":5,\"text\":\"And the Lord his God delivered him into the hands of the king of Syria, who defeated him, and took a great booty out of his kingdom, and carried it to Damascus: he was also delivered into the hands of the king of Israel, who overthrew him with a great slaughter.\"},{\"verse\":6,\"text\":\"For Phacee the son of Romelia slew of Juda a hundred and twenty thousand in one day, all valiant men, because they had forsaken the Lord the God of their fathers.\"},{\"verse\":7,\"text\":\"At the same time Zechri a powerful man of Ephraim, slew Maasias the king’s son, and Ezricam the governor of his house, and Elcana who was next to the king.\"},{\"verse\":8,\"text\":\"And the children of Israel carried away of their brethren two hundred thousand women, boys, and girls, and an immense booty: and they brought it to Samaria.\"},{\"verse\":9,\"text\":\"At that time there was a prophet of the Lord there, whose name was Oded: and he went out to meet the army that came to Samaria, and said to them: Behold the Lord the God of your fathers being angry with Juda, hath delivered them into your hands, and you have butchered them cruelly, so that your cruelty hath reached up to heaven.\"},{\"verse\":10,\"text\":\"Moreover you have a mind to keep under the children of Juda and Jerusalem for your bondmen and bondwomen, which ought not to be done: for you have sinned in this against the Lord your God.\"},{\"verse\":11,\"text\":\"But hear ye my counsel, and release the captives that you have brought of your brethren, because a great indignation of the Lord hangeth over you.\"},{\"verse\":12,\"text\":\"Then some of the chief men of the sons of Ephraim, Azarias the son of Johanan, Barachias the son of Mosollamoth, Ezechias the son of Sellum, and Amasa the son of Adali, stood up against them that came from the war.\"},{\"verse\":13,\"text\":\"And they said to them: You shall not bring in the captives hither, lest we sin against the Lord. Why will you add to our sins, and heap up upon our former offences? for the sin is great, and the fierce anger of the Lord hangeth over Israel.\"},{\"verse\":14,\"text\":\"So the soldiers left the spoils, and all that they had taken, before the princes and all the multitude.\"},{\"verse\":15,\"text\":\"And the men, whom we mentioned above, rose up and took the captives, and with the spoils clothed all them that were naked: and when they had clothed and shod them, and refreshed them with meat and drink, and anointed them because of their labour, and had taken care of them, they set such of them as could not walk, and were feeble, upon beasts, and brought them to Jericho the city of palm trees to their brethren, and they returned to Samaria.\"},{\"verse\":16,\"text\":\"At that time king Achaz sent to the king of the Assyrians asking help.\"},{\"verse\":17,\"text\":\"And the Edomites came and slew many of Juda, and took a great booty.\"},{\"verse\":18,\"text\":\"The Philistines also spread themselves among the cities of the plains, and to the south of Juda: and they took Bethsames, and Aialon, and Gaderoth, and Socho, and Thamnan, and Gamzo, with their villages, and they dwelt in them.\"},{\"verse\":19,\"text\":\"For the Lord had humbled Juda because of Achaz the king of Juda, for he had stripped it of help, and had contemned the Lord.\"},{\"verse\":20,\"text\":\"And he brought against him Thelgathphalnasar king of the Assyrians, who also afflicted him, and plundered him without any resistance.\"},{\"verse\":21,\"text\":\"And Achaz stripped the house of the Lord, and the house of the kings, and of the princes, and gave gifts to the king of the Assyrians, and yet it availed him nothing.\"},{\"verse\":22,\"text\":\"Moreover also in the time of his distress he increased contempt against the Lord: king Achaz himself by himself,\"},{\"verse\":23,\"text\":\"Sacrificed victims to the gods of Damascus that struck him, and he said: The gods of the kings of Syria help them, and I will appease them with victims, and they will help me; whereas on the contrary they were the ruin of him, and of all Israel.\"},{\"verse\":24,\"text\":\"Then Achaz having taken away all the vessels of the house of God, and broken them, shut up the doors of the temple of God, and made himself altars in all the corners of Jerusalem.\"},{\"verse\":25,\"text\":\"And in all the cities of Juda he built altars to burn frankincense, and he provoked the Lord the God of his fathers to wrath.\"},{\"verse\":26,\"text\":\"But the rest of his acts, and all his works first and last are written in the book of the kings of Juda and Israel.\"},{\"verse\":27,\"text\":\"And Achaz slept with his fathers, and they buried him in the city of Jerusalem: for they received him not into the sepulchres of the kings of Israel. And Ezechias his son reigned in his stead.\"}],\"vul\":[{\"verse\":1,\"text\":\"Viginti annorum erat Achaz cum regnare cœpisset, et sedecim annis regnavit in Jerusalem. Non fecit rectum in conspectu Domini sicut David pater ejus,\"},{\"verse\":2,\"text\":\"sed ambulavit in viis regum Israël, insuper et statuas fudit Baalim.\"},{\"verse\":3,\"text\":\"Ipse est qui adolevit incensum in valle Benennom, et lustravit filios suos in igne juxta ritum gentium quas interfecit Dominus in adventu filiorum Israël.\"},{\"verse\":4,\"text\":\"Sacrificabat quoque, et thymiama succendebat in excelsis, et in collibus, et sub omni ligno frondoso.\"},{\"verse\":5,\"text\":\"Tradiditque eum Dominus Deus ejus in manu regis Syriæ, qui percussit eum, magnamque prædam cepit de ejus imperio, et adduxit in Damascum : manibus quoque regis Israël traditus est, et percussus plaga grandi.\"},{\"verse\":6,\"text\":\"Occiditque Phacee filius Romeliæ, de Juda centum viginti millia in die uno, omnes viros bellatores : eo quod reliquissent Dominum Deum patrum suorum.\"},{\"verse\":7,\"text\":\"Eodem tempore occidit Zechri, vir potens ex Ephraim, Maasiam filium regis, et Ezricam ducem domus ejus, Elcanam quoque secundum a rege.\"},{\"verse\":8,\"text\":\"Ceperuntque filii Israël de fratribus suis ducenta millia mulierum, puerorum, et puellarum, et infinitam prædam : pertuleruntque eam in Samariam.\"},{\"verse\":9,\"text\":\"Ea tempestate erat ibi propheta Domini, nomine Oded : qui egressus obviam exercitui venienti in Samariam, dixit eis : Ecce iratus Dominus Deus patrum vestrorum contra Juda, tradidit eos in manibus vestris, et occidistis eos atrociter, ita ut ad cælum pertingeret vestra crudelitas.\"},{\"verse\":10,\"text\":\"Insuper filios Juda et Jerusalem vultis vobis subjicere in servos et ancillas : quod nequaquam facto opus est : peccastis enim super hoc Domino Deo vestro.\"},{\"verse\":11,\"text\":\"Sed audite consilium meum, et reducite captivos quos adduxistis de fratribus vestris, quia magnus furor Domini imminet vobis.\"},{\"verse\":12,\"text\":\"Steterunt itaque viri de principibus filiorum Ephraim, Azarias filius Johanan, Barachias filius Mosollamoth, Ezechias filius Sellum, et Amasa filius Adali, contra eos qui veniebant de prælio,\"},{\"verse\":13,\"text\":\"et dixerunt eis : Non introducetis huc captivos, ne peccemus Domino. Quare vultis adjicere super peccata nostra, et vetera cumulare delicta ? grande quippe peccatum est, et ira furoris Domini imminet super Israël.\"},{\"verse\":14,\"text\":\"Dimiseruntque viri bellatores prædam, et universa quæ ceperant, coram principibus, et omni multitudine.\"},{\"verse\":15,\"text\":\"Steteruntque viri quos supra memoravimus, et apprehendentes captivos, omnesque qui nudi erant, vestierunt de spoliis : cumque vestissent eos, et calceassent, et refecissent cibo ac potu, unxissentque propter laborem, et adhibuissent eis curam : quicumque ambulare non poterant, et erant imbecillo corpore, imposuerunt eos jumentis, et adduxerunt Jericho civitatem palmarum ad fratres eorum, ipsique reversi sunt in Samariam.\"},{\"verse\":16,\"text\":\"Tempore illo misit rex Achaz ad regem Assyriorum, postulans auxilium.\"},{\"verse\":17,\"text\":\"Veneruntque Idumæi, et percusserunt multos ex Juda, et ceperunt prædam magnam.\"},{\"verse\":18,\"text\":\"Philisthiim quoque diffusi sunt per urbes campestres, et ad meridiem Juda : ceperuntque Bethsames, et Ajalon, et Gaderoth, Socho quoque, et Thamnan, et Gamzo, cum viculis suis, et habitaverunt in eis.\"},{\"verse\":19,\"text\":\"Humiliaverat enim Dominus Judam propter Achaz regem Juda, eo quod nudasset eum auxilio, et contemptui habuisset Dominum.\"},{\"verse\":20,\"text\":\"Adduxitque contra eum Thelgathphalnasar regem Assyriorum, qui et afflixit eum, et nullo resistente vastavit.\"},{\"verse\":21,\"text\":\"Igitur Achaz, spoliata domo Domini, et domo regum ac principum, dedit regi Assyriorum munera, et tamen nihil ei profuit.\"},{\"verse\":22,\"text\":\"Insuper et tempore angustiæ suæ auxit contemptum in Dominum, ipse per se rex Achaz,\"},{\"verse\":23,\"text\":\"immolavit diis Damasci victimas percussoribus suis, et dixit : Dii regum Syriæ auxiliantur eis, quos ego placabo hostiis, et aderunt mihi : cum e contrario ipsi fuerint ruinæ ei, et universo Israël.\"},{\"verse\":24,\"text\":\"Direptis itaque Achaz omnibus vasis domus Dei, atque confractis, clausit januas templi Dei, et fecit sibi altaria in universis angulis Jerusalem.\"},{\"verse\":25,\"text\":\"In omnibus quoque urbibus Juda exstruxit aras ad cremandum thus, atque ad iracundiam provocavit Dominum Deum patrum suorum.\"},{\"verse\":26,\"text\":\"Reliqua autem sermonum ejus, et omnium operum suorum priorum et novissimorum, scripta sunt in libro regum Juda et Israël.\"},{\"verse\":27,\"text\":\"Dormivitque Achaz cum patribus suis, et sepelierunt eum in civitate Jerusalem : neque enim receperunt eum in sepulchra regum Israël. Regnavitque Ezechias filius ejus pro eo.\"}],\"summary\":\"The wicked and unhappy reign of Achaz.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":27,\"label\":\"2 Chronicles 27\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":29,\"label\":\"2 Chronicles 29\"}}]]\n"])</script></body></html>
