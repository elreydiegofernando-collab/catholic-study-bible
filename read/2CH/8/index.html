ass="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And at the end of twenty years after Solomon had built the house of the Lord and his own house:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He built the cities which Hiram had given to Solomon, and caused the children of Israel to dwell there.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He went also into Emath Suba, and possessed it.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he built Palmira in the desert, and he built other strong cities in Emath.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he built Beth-horon the upper, and Beth-horon the nether, walled cities with gates and bars and locks.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Balaath also and all the strong cities that were Solomon’s, and all the cities of the chariots, and the cities of the horsemen. All that Solomon had a mind, and designed, he built in Jerusalem and in Libanus, and in all the land of his dominion.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>All the people that were left of the Hethites, and the Amorrhites, and the Pherezites, and the Hevites, and the Jebusites, that were not of the stock of Israel:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Of their children, and of the posterity, whom the children of Israel had not slain, Solomon made to be the tributaries, unto this day.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But of the children of Israel he set none to serve in the king’s works: for they were men of war, and chief captains, and rulers of his chariots and horsemen.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And all the chief captains of king Solomon’s army were two hundred and fifty, who taught the people.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he removed the daughter of Pharao from the city of David, to the house which he had built for her. For the king said: My wife shall not dwell in the house of David king of Israel, for it is sanctified: because the ark of the Lord came into it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then Solomon offered holocausts to the Lord upon the altar of the Lord which he had built before the porch,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>That every day an offering might be made on it according to the ordinance of Moses, in the sabbaths, and on the new moons, and on the festival days three times a year, that is to say, in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he appointed according to the order of David his father the offices of the priests in their ministries: and the Levites in their order to give praise, and minister before the priests according to the duty of every day: and the porters in their divisions by gate and gate: for so David the man of God had commanded.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the priests and Levites departed not from the king’s commandments, as to any thing that he had commanded, and as to the keeping of the treasures.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Solomon had all charges prepared, from the day that he founded the house of the Lord, until the day wherein he finished it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then Solomon went to Asiongaber, and to Ailath, on the coast of the Red Sea, which is in the land of Edom.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Hiram sent him ships by the hands of his servants, and skilful mariners, and they went with Solomon’s servants to Ophir, and they took thence four hundred and fifty talents of gold, and brought it to king Solomon.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Expletis autem viginti annis postquam ædificavit Salomon domum Domini et domum suam,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>civitates quas dederat Hiram Salomoni, ædificavit, et habitare ibi fecit filios Israël.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Abiit quoque in Emath Suba, et obtinuit eam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et ædificavit Palmyram in deserto, et alias civitates munitissimas ædificavit in Emath.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Exstruxitque Bethoron superiorem, et Bethoron inferiorem, civitates muratas habentes portas et vectes et seras :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Balaath etiam et omnes urbes firmissimas quæ fuerunt Salomonis, cunctasque urbes quadrigarum, et urbes equitum. Omnia quæcumque voluit Salomon atque disposuit, ædificavit in Jerusalem, et in Libano, et in universa terra potestatis suæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Omnem populum qui derelictus fuerat de Hethæis, et Amorrhæis, et Pherezæis, et Hevæis, et Jebusæis, qui non erant de stirpe Israël,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>de filiis eorum, et de posteris, quos non interfecerant filii Israël, subjugavit Salomon in tributarios, usque in diem hanc.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Porro de filiis Israël non posuit ut servirent operibus regis : ipsi enim erant viri bellatores, et duces primi, et principes quadrigarum et equitum ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnes autem principes exercitus regis Salomonis fuerunt ducenti quinquaginta, qui erudiebant populum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Filiam vero Pharaonis transtulit de civitate David in domum quam ædificaverat ei. Dixit enim rex : Non habitabit uxor mea in domo David regis Israël, eo quod sanctificata sit : quia ingressa est in eam arca Domini.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tunc obtulit Salomon holocausta Domino super altare Domini, quod exstruxerat ante porticum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ut per singulos dies offerretur in eo juxta præceptum Moysi in sabbatis et in calendis, et in festis diebus, ter per annum, id est, in solemnitate azymorum, et in solemnitatem hebdomadarum, et in solemnitate tabernaculorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et constituit juxta dispositionem David patris sui officia sacerdotum in ministeriis suis, et Levitas in ordine suo, ut laudarent et ministrarent coram sacerdotibus juxta ritum uniuscujusque diei, et janitores in divisionibus suis per portam et portam : sic enim præceperat David homo Dei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Nec prætergressi sunt de mandatis regis tam sacerdotes quam Levitæ, ex omnibus quæ præceperat, et in custodiis thesaurorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Omnes impensas præparatas habuit Salomon ex eo die quo fundavit domum Domini usque in diem quo perfecit eam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tunc abiit Salomon in Asiongaber, et in Ailath ad oram maris Rubri, quæ est in terra Edom.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Misit autem ei Hiram per manus servorum suorum naves, et nautas gnaros maris, et abierunt cum servis Salomonis in Ophir, tuleruntque inde quadringenta quinquaginta talenta auri, et attulerunt ad regem Salomonem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Chronicles 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Chronicles 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidd l the people that were left of the Hethites, and the Amorrhites, and the Pherezites, and the Hevites, and the Jebusites, that were not of the stock of Israel:\"},{\"verse\":8,\"text\":\"Of their children, and of the posterity, whom the children of Israel had not slain, Solomon made to be the tributaries, unto this day.\"},{\"verse\":9,\"text\":\"But of the children of Israel he set none to serve in the king’s works: for they were men of war, and chief captains, and rulers of his chariots and horsemen.\"},{\"verse\":10,\"text\":\"And all the chief captains of king Solomon’s army were two hundred and fifty, who taught the people.\"},{\"verse\":11,\"text\":\"And he removed the daughter of Pharao from the city of David, to the house which he had built for her. For the king said: My wife shall not dwell in the house of David king of Israel, for it is sanctified: because the ark of the Lord came into it.\"},{\"verse\":12,\"text\":\"Then Solomon offered holocausts to the Lord upon the altar of the Lord which he had built before the porch,\"},{\"verse\":13,\"text\":\"That every day an offering might be made on it according to the ordinance of Moses, in the sabbaths, and on the new moons, and on the festival days three times a year, that is to say, in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.\"},{\"verse\":14,\"text\":\"And he appointed according to the order of David his father the offices of the priests in their ministries: and the Levites in their order to give praise, and minister before the priests according to the duty of every day: and the porters in their divisions by gate and gate: for so David the man of God had commanded.\"},{\"verse\":15,\"text\":\"And the priests and Levites departed not from the king’s commandments, as to any thing that he had commanded, and as to the keeping of the treasures.\"},{\"verse\":16,\"text\":\"Solomon had all charges prepared, from the day that he founded the house of the Lord, until the day wherein he finished it.\"},{\"verse\":17,\"text\":\"Then Solomon went to Asiongaber, and to Ailath, on the coast of the Red Sea, which is in the land of Edom.\"},{\"verse\":18,\"text\":\"And Hiram sent him ships by the hands of his servants, and skilful mariners, and they went with Solomon’s servants to Ophir, and they took thence four hundred and fifty talents of gold, and brought it to king Solomon.\"}],\"vul\":[{\"verse\":1,\"text\":\"Expletis autem viginti annis postquam ædificavit Salomon domum Domini et domum suam,\"},{\"verse\":2,\"text\":\"civitates quas dederat Hiram Salomoni, ædificavit, et habitare ibi fecit filios Israël.\"},{\"verse\":3,\"text\":\"Abiit quoque in Emath Suba, et obtinuit eam.\"},{\"verse\":4,\"text\":\"Et ædificavit Palmyram in deserto, et alias civitates munitissimas ædificavit in Emath.\"},{\"verse\":5,\"text\":\"Exstruxitque Bethoron superiorem, et Bethoron inferiorem, civitates muratas habentes portas et vectes et seras :\"},{\"verse\":6,\"text\":\"Balaath etiam et omnes urbes firmissimas quæ fuerunt Salomonis, cunctasque urbes quadrigarum, et urbes equitum. Omnia quæcumque voluit Salomon atque disposuit, ædificavit in Jerusalem, et in Libano, et in universa terra potestatis suæ.\"},{\"verse\":7,\"text\":\"Omnem populum qui derelictus fuerat de Hethæis, et Amorrhæis, et Pherezæis, et Hevæis, et Jebusæis, qui non erant de stirpe Israël,\"},{\"verse\":8,\"text\":\"de filiis eorum, et de posteris, quos non interfecerant filii Israël, subjugavit Salomon in tributarios, usque in diem hanc.\"},{\"verse\":9,\"text\":\"Porro de filiis Israël non posuit ut servirent operibus regis : ipsi enim erant viri bellatores, et duces primi, et principes quadrigarum et equitum ejus.\"},{\"verse\":10,\"text\":\"Omnes autem principes exercitus regis Salomonis fuerunt ducenti quinquaginta, qui erudiebant populum.\"},{\"verse\":11,\"text\":\"Filiam vero Pharaonis transtulit de civitate David in domum quam ædificaverat ei. Dixit enim rex : Non habitabit uxor mea in domo David regis Israël, eo quod sanctificata sit : quia ingressa est in eam arca Domini.\"},{\"verse\":12,\"text\":\"Tunc obtulit Salomon holocausta Domino super altare Domini, quod exstruxerat ante porticum,\"},{\"verse\":13,\"text\":\"ut per singulos dies offerretur in eo juxta præceptum Moysi in sabbatis et in calendis, et in festis diebus, ter per annum, id est, in solemnitate azymorum, et in solemnitatem hebdomadarum, et in solemnitate tabernaculorum.\"},{\"verse\":14,\"text\":\"Et constituit juxta dispositionem David patris sui officia sacerdotum in ministeriis suis, et Levitas in ordine suo, ut laudarent et ministrarent coram sacerdotibus juxta ritum uniuscujusque diei, et janitores in divisionibus suis per portam et portam : sic enim præceperat David homo Dei.\"},{\"verse\":15,\"text\":\"Nec prætergressi sunt de mandatis regis tam sacerdotes quam Levitæ, ex omnibus quæ præceperat, et in custodiis thesaurorum.\"},{\"verse\":16,\"text\":\"Omnes impensas præparatas habuit Salomon ex eo die quo fundavit domum Domini usque in diem quo perfecit eam.\"},{\"verse\":17,\"text\":\"Tunc abiit Salomon in Asiongaber, et in Ailath ad oram maris Rubri, quæ est in terra Edom.\"},{\"verse\":18,\"text\":\"Misit autem ei Hiram per manus servorum suorum naves, et nautas gnaros maris, et abierunt cum servis Salomonis in Ophir, tuleruntque inde quadringenta quinquaginta talenta auri, et attulerunt ad regem Salomonem.\"}],\"summary\":\"Solomon’s buildings and other acts.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":7,\"label\":\"2 Chronicles 7\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":9,\"label\":\"2 Chronicles 9\"}}]]\n"])</script></body></html>
