DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In the eighteenth year of king Jeroboam, Abia reigned over Juda.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Three years he reigned in Jerusalem, and his mother’s name was Michaia, the daughter of Uriel of Gabaa: and there was war between Abia and Jeroboam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And when Abia had begun battle, and had with him four hundred thousand most valiant and chosen men, Jeroboam put his army in array against him, eight hundred thousand men, who were also chosen and most valiant for war.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Abia stood upon mount Semeron, which was in Ephraim, and said: Hear me, O Jeroboam, and all Israel:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Do you not know that the Lord God of Israel gave to David the kingdom over Israel for ever, to him and to his sons by a covenant of salt?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Jeroboam the son of Nabat, the servant of Solomon the son of David, rose up: and rebelled against his lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And there were gathered to him vain men, and children of Belial: and they prevailed against Roboam the son of Solomon: for Roboam was unexperienced, and of a fearful heart, and could not resist them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And now you say that you are able to withstand the kingdom of the Lord, which he possesseth by the sons of David, and you have a great multitude of people, and golden calves, which Jeroboam hath made you for gods.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And you have cast out the priests of the Lord, the sons of Aaron, and the Levites: and you have made you priests, like all the nations of the earth: whosoever cometh and consecrateth his hand with a bullock of the herd, and with seven rams, is made a priest of those who are no gods.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But the Lord is our God, whom we forsake not, and the priests who minister to the Lord are the sons of Aaron, and the Levites are in their order.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they offer holocausts to the Lord, every day, morning and evening, and incense made according to the ordinance of the law, and the loaves are set forth on a most clean table, and there is with us the golden candlestick, and the lamps thereof, to be lighted always in the evening: for we keep the precepts of the Lord our God, whom you have forsaken.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Therefore God is the leader in our army, and his priests who sound with trumpets, and resound against you: O children of Israel, fight not against the Lord the God of your fathers, for it is not good for you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>While he spoke these things, Jeroboam caused an ambushment to come about behind him. And while he stood facing the enemies, he encompassed Juda, who perceived it not, with his army.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when Juda looked back, they saw the battle coming upon them both before and behind, and they cried to the Lord: and the priests began to sound with the trumpets.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all the men of Juda shouted: and behold when they shouted, God terrified Jeroboam, and all Israel that stood against Abia and Juda.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the children of Israel fled before Juda, and the Lord delivered them into their hand.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Abia and his people slew them with a great slaughter, and there fell wounded of Israel five hundred thousand valiant men.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the children of Israel were brought down, at that time, and the children of Juda were exceedingly strengthened, because they had trusted in the Lord the God of their fathers.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Abia pursued after Jeroboam, and took cities from him, Bethel and her daughters, and Jesana with her daughters, Ephron also and her daughters.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Jeroboam was not able to resist any more, in the days of Abia: and the Lord struck him, and he died.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But Abia, being strengthened in his kingdom, took fourteen wives: and begot two and twenty sons, and sixteen daughters.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the rest of the acts of Abia, and of his ways and works, are written diligently in the book of Addo the prophet.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Anno octavodecimo regis Jeroboam, regnavit Abia super Judam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tribus annis regnavit in Jerusalem, nomenque matris ejus Michaia filia Uriel de Gabaa : et erat bellum inter Abiam et Jeroboam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cumque iniisset Abia certamen, et haberet bellicosissimos viros, et electorum quadringenta millia : Jeroboam instruxit econtra aciem octingenta millia virorum, qui et ipsi electi erant, et ad bella fortissimi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Stetit ergo Abia super montem Semeron, qui erat in Ephraim, et ait : Audi, Jeroboam, et omnis Israël.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Num ignoratis quod Dominus Deus Israël dederit regnum David super Israël in sempiternum, ipsi et filiis ejus in pactum salis ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et surrexit Jeroboam filius Nabat, servus Salomonis filii David, et rebellavit contra dominum suum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Congregatique sunt ad eum viri vanissimi, et filii Belial, et prævaluerunt contra Roboam filium Salomonis : porro Roboam erat rudis, et corde pavido, nec potuit resistere eis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nunc ergo vos dicitis quod resistere possitis regno Domini, quod possidet per filios David, habetisque grandem populi multitudinem, atque vitulos aureos quos fecit vobis Jeroboam in deos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ejecistis sacerdotes Domini, filios Aaron, atque Levitas, et fecistis vobis sacerdotes sicut omnes populi terrarum : quicumque venerit, et initiaverit manum suam in tauro de bobus, et in arietibus septem, fit sacerdos eorum qui non sunt dii.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Noster autem Dominus, Deus est, quem non relinquimus, sacerdotesque ministrant Domino, de filiis Aaron, et Levitæ sunt in ordine suo :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>holocausta quoque offerunt Domino per singulos dies mane et vespere, et thymiama juxta legis præcepta confectum, et proponuntur panes in mensa mundissima, estque apud nos candelabrum aureum, et lucernæ ejus, ut accendantur semper ad vesperam : nos quippe custodimus præcepta Domini Dei nostri, quem vos reliquistis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ergo in exercitu nostro dux Deus est, et sacerdotes ejus, qui clangunt tubis, et resonant contra vos : filii Israël, nolite pugnare contra Dominum Deum patrum vestrorum, quia non vobis expedit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hæc illo loquente, Jeroboam retro moliebatur insidias. Cumque ex adverso hostium staret, ignorantem Judam suo ambiebat exercitu.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Respiciensque Judas, vidit instare bellum ex adverso et post tergum, et clamavit ad Dominum, ac sacerdotes tubis canere cœperunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnesque viri Juda vociferati sunt : et ecce illis clamantibus, perterruit Deus Jeroboam, et omnem Israël qui stabat ex adverso Abia et Juda.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fugeruntque filii Israël Judam, et tradidit eos Deus in manu eorum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Percussit ergo eos Abia et populus ejus plaga magna : et corruerunt vulnerati ex Israël quingenta millia virorum fortium.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Humiliatique sunt filii Israël in tempore illo, et vehementissime confortati filii Juda, eo quod sperassent in Domino Deo patrum suorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Persecutus est autem Abia fugientem Jeroboam, et cepit civitates ejus, Bethel et filias ejus, et Jesana cum filiabus suis, Ephron quoque et filias ejus :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>nec valuit ultra resistere Jeroboam in diebus Abia : quem percussit Dominus, et mortuus est.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Igitur Abia, confortato imperio suo, accepit uxores quatuordecim : procreavitque viginti duos filios, et sedecim filias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Reliqua autem sermonum Abia, viarumque et operum ejus, scripta sunt diligentissime in libro Addo prophetæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Chronicles 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif "/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"2CH.13\",{\"bookId\":14,\"usfm\":\"2CH\",\"bookName\":\"2 Chronicles\",\"drName\":\"2 Paralipomenon\",\"chapter\":13,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"In the eighteenth year of king Jeroboam, Abia reigned over Juda.\"},{\"verse\":2,\"text\":\"Three years he reigned in Jerusalem, and his mother’s name was Michaia, the daughter of Uriel of Gabaa: and there was war between Abia and Jeroboam.\"},{\"verse\":3,\"text\":\"And when Abia had begun battle, and had with him four hundred thousand most valiant and chosen men, Jeroboam put his army in array against him, eight hundred thousand men, who were also chosen and most valiant for war.\"},{\"verse\":4,\"text\":\"And Abia stood upon mount Semeron, which was in Ephraim, and said: Hear me, O Jeroboam, and all Israel:\"},{\"verse\":5,\"text\":\"Do you not know that the Lord God of Israel gave to David the kingdom over Israel for ever, to him and to his sons by a covenant of salt?\"},{\"verse\":6,\"text\":\"And Jeroboam the son of Nabat, the servant of Solomon the son of David, rose up: and rebelled against his lord.\"},{\"verse\":7,\"text\":\"And there were gathered to him vain men, and children of Belial: and they prevailed against Roboam the son of Solomon: for Roboam was unexperienced, and of a fearful heart, and could not resist them.\"},{\"verse\":8,\"text\":\"And now you say that you are able to withstand the kingdom of the Lord, which he possesseth by the sons of David, and you have a great multitude of people, and golden calves, which Jeroboam hath made you for gods.\"},{\"verse\":9,\"text\":\"And you have cast out the priests of the Lord, the sons of Aaron, and the Levites: and you have made you priests, like all the nations of the earth: whosoever cometh and consecrateth his hand with a bullock of the herd, and with seven rams, is made a priest of those who are no gods.\"},{\"verse\":10,\"text\":\"But the Lord is our God, whom we forsake not, and the priests who minister to the Lord are the sons of Aaron, and the Levites are in their order.\"},{\"verse\":11,\"text\":\"And they offer holocausts to the Lord, every day, morning and evening, and incense made according to the ordinance of the law, and the loaves are set forth on a most clean table, and there is with us the golden candlestick, and the lamps thereof, to be lighted always in the evening: for we keep the precepts of the Lord our God, whom you have forsaken.\"},{\"verse\":12,\"text\":\"Therefore God is the leader in our army, and his priests who sound with trumpets, and resound against you: O children of Israel, fight not against the Lord the God of your fathers, for it is not good for you.\"},{\"verse\":13,\"text\":\"While he spoke these things, Jeroboam caused an ambushment to come about behind him. And while he stood facing the enemies, he encompassed Juda, who perceived it not, with his army.\"},{\"verse\":14,\"text\":\"And when Juda looked back, they saw the battle coming upon them both before and behind, and they cried to the Lord: and the priests began to sound with the trumpets.\"},{\"verse\":15,\"text\":\"And all the men of Juda shouted: and behold when they shouted, God terrified Jeroboam, and all Israel that stood against Abia and Juda.\"},{\"verse\":16,\"text\":\"And the children of Israel fled before Juda, and the Lord delivered them into their hand.\"},{\"verse\":17,\"text\":\"And Abia and his people slew them with a great slaughter, and there fell wounded of Israel five hundred thousand valiant men.\"},{\"verse\":18,\"text\":\"And the children of Israel were brought down, at that time, and the children of Juda were exceedingly strengthened, because they had trusted in the Lord the God of their fathers.\"},{\"verse\":19,\"text\":\"And Abia pursued after Jeroboam, and took cities from him, Bethel and her daughters, and Jesana with her daughters, Ephron also and her daughters.\"},{\"verse\":20,\"text\":\"And Jeroboam was not able to resist any more, in the days of Abia: and the Lord struck him, and he died.\"},{\"verse\":21,\"text\":\"But Abia, being strengthened in his kingdom, took fourteen wives: and begot two and twenty sons, and sixteen daughters.\"},{\"verse\":22,\"text\":\"And the rest of the acts of Abia, and of his ways and works, are written diligently in the book of Addo the prophet.\"}],\"vul\":[{\"verse\":1,\"text\":\"Anno octavodecimo regis Jeroboam, regnavit Abia super Judam.\"},{\"verse\":2,\"text\":\"Tribus annis regnavit in Jerusalem, nomenque matris ejus Michaia filia Uriel de Gabaa : et erat bellum inter Abiam et Jeroboam.\"},{\"verse\":3,\"text\":\"Cumque iniisset Abia certamen, et haberet bellicosissimos viros, et electorum quadringenta millia : Jeroboam instruxit econtra aciem octingenta millia virorum, qui et ipsi electi erant, et ad bella fortissimi.\"},{\"verse\":4,\"text\":\"Stetit ergo Abia super montem Semeron, qui erat in Ephraim, et ait : Audi, Jeroboam, et omnis Israël.\"},{\"verse\":5,\"text\":\"Num ignoratis quod Dominus Deus Israël dederit regnum David super Israël in sempiternum, ipsi et filiis ejus in pactum salis ?\"},{\"verse\":6,\"text\":\"Et surrexit Jeroboam filius Nabat, servus Salomonis filii David, et rebellavit contra dominum suum.\"},{\"verse\":7,\"text\":\"Congregatique sunt ad eum viri vanissimi, et filii Belial, et prævaluerunt contra Roboam filium Salomonis : porro Roboam erat rudis, et corde pavido, nec potuit resistere eis.\"},{\"verse\":8,\"text\":\"Nunc ergo vos dicitis quod resistere possitis regno Domini, quod possidet per filios David, habetisque grandem populi multitudinem, atque vitulos aureos quos fecit vobis Jeroboam in deos.\"},{\"verse\":9,\"text\":\"Et ejecistis sacerdotes Domini, filios Aaron, atque Levitas, et fecistis vobis sacerdotes sicut omnes populi terrarum : quicumque venerit, et initiaverit manum suam in tauro de bobus, et in arietibus septem, fit sacerdos eorum qui non sunt dii.\"},{\"verse\":10,\"text\":\"Noster autem Dominus, Deus est, quem non relinquimus, sacerdotesque ministrant Domino, de filiis Aaron, et Levitæ sunt in ordine suo :\"},{\"verse\":11,\"text\":\"holocausta quoque offerunt Domino per singulos dies mane et vespere, et thymiama juxta legis præcepta confectum, et proponuntur panes in mensa mundissima, estque apud nos candelabrum aureum, et lucernæ ejus, ut accendantur semper ad vesperam : nos quippe custodimus præcepta Domini Dei nostri, quem vos reliquistis.\"},{\"verse\":12,\"text\":\"Ergo in exercitu nostro dux Deus est, et sacerdotes ejus, qui clangunt tubis, et resonant contra vos : filii Israël, nolite pugnare contra Dominum Deum patrum vestrorum, quia non vobis expedit.\"},{\"verse\":13,\"text\":\"Hæc illo loquente, Jeroboam retro moliebatur insidias. Cumque ex adverso hostium staret, ignorantem Judam suo ambiebat exercitu.\"},{\"verse\":14,\"text\":\"Respiciensque Judas, vidit instare bellum ex adverso et post tergum, et clamavit ad Dominum, ac sacerdotes tubis canere cœperunt.\"},{\"verse\":15,\"text\":\"Omnesque viri Juda vociferati sunt : et ecce illis clamantibus, perterruit Deus Jeroboam, et omnem Israël qui stabat ex adverso Abia et Juda.\"},{\"verse\":16,\"text\":\"Fugeruntque filii Israël Judam, et tradidit eos Deus in manu eorum.\"},{\"verse\":17,\"text\":\"Percussit ergo eos Abia et populus ejus plaga magna : et corruerunt vulnerati ex Israël quingenta millia virorum fortium.\"},{\"verse\":18,\"text\":\"Humiliatique sunt filii Israël in tempore illo, et vehementissime confortati filii Juda, eo quod sperassent in Domino Deo patrum suorum.\"},{\"verse\":19,\"text\":\"Persecutus est autem Abia fugientem Jeroboam, et cepit civitates ejus, Bethel et filias ejus, et Jesana cum filiabus suis, Ephron quoque et filias ejus :\"},{\"verse\":20,\"text\":\"nec valuit ultra resistere Jeroboam in diebus Abia : quem percussit Dominus, et mortuus est.\"},{\"verse\":21,\"text\":\"Igitur Abia, confortato imperio suo, accepit uxores quatuordecim : procreavitque viginti duos filios, et sedecim filias.\"},{\"verse\":22,\"text\":\"Reliqua autem sermonum Abia, viarumque et operum ejus, scripta sunt diligentissime in libro Addo prophetæ.\"}],\"summary\":\"Abia’s reign: his victory over Jeroboam.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":12,\"label\":\"2 Chronicles 12\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":14,\"label\":\"2 Chronicles 14\"}}]]\n"])</script></body></html>
