h d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">19</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Paralipomenon</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Josaphat’s charge to the judges and to the Levites.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Josaphat king of Juda returned to his house in peace to Jerusalem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Jehu the son of Hanani the seer met him, and said to him: Thou helpest the ungodly, and thou art joined in friendship with them that hate the Lord, and therefore thou didst deserve indeed the wrath of the Lord:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But good works are found in thee, because thou hast taken away the groves out of the land of Juda, and hast prepared thy heart to seek the Lord the God of thy fathers.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Josaphat dwelt at Jerusalem: and he went out again to the people from Bersabee to mount Ephraim, and brought them back to the Lord the God of their fathers.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he set judges of the land in all the fenced cities of Juda, in every place.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And charging the judges, he said: Take heed what you do: for you exercise not the judgment of man, but of the Lord: and whatsoever you judge, it shall redound to you.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Let the fear of the Lord be with you, and do all things with diligence: for there is no iniquity with the Lord our God, nor respect of persons, nor desire of gifts.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In Jerusalem also Josaphat appointed Levites, and priests and chiefs of the families of Israel, to judge the judgment and the cause of the Lord for the inhabitants thereof.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he charged them, saying, Thus shall you do in the fear of the Lord faithfully, and with a perfect heart.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Every cause that shall come to you of your brethren, that dwell in their cities, between kindred and kindred, wheresoever there is question concerning the law, the commandment, the ceremonies, the justifications: shew it them, that they may not sin against the Lord, and that wrath may not come upon you and your brethren: and so doing you shall not sin.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Amarias the priest your high priest shall be chief in the things which regard God: and Zabadias the son of Ismahel, who is ruler in the house of Juda, shall be over those matters which belong to the king’s office: and you have before you the Levites for masters, take courage and do diligently, and the Lord will be with you in good things.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Reversus est autem Josaphat rex Juda in domum suam pacifice in Jerusalem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cui occurrit Jehu filius Henani videns, et ait ad eum : Impio præbes auxilium, et his qui oderunt Dominum amicitia jungeris, et idcirco iram quidem Domini merebaris :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>sed bona opera inventa sunt in te, eo quod abstuleris lucos de terra Juda, et præparaveris cor tuum ut requireres Dominum Deum patrum tuorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Habitavit ergo Josaphat in Jerusalem, rursumque egressus est ad populum de Bersabee usque ad montem Ephraim, et revocavit eos ad Dominum Deum patrum suorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Constituitque judices terræ in cunctis civitatibus Juda munitis per singula loca,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et præcipiens judicibus : Videte, ait, quid faciatis : non enim hominis exercetis judicium, sed Domini : et quodcumque judicaveritis, in vos redundabit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sit timor Domini vobiscum, et cum diligentia cuncta facite : non est enim apud Dominum Deum nostrum iniquitas, nec personarum acceptio, nec cupido munerum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In Jerusalem quoque constituit Josaphat Levitas, et sacerdotes, et principes familiarum ex Israël, ut judicium et causam Domini judicarent habitatoribus ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Præcepitque eis, dicens : Sic agetis in timore Domini fideliter et corde perfecto.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Omnem causam quæ venerit ad vos fratrum vestrorum, qui habitant in urbibus suis inter cognationem et cognationem, ubicumque quæstio est de lege, de mandato, de cæremoniis, de justificationibus : ostendite eis, ut non peccent in Dominum, et ne veniat ira super vos et super fratres vestros : sic ergo agentes non peccabitis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Amarias autem sacerdos et pontifex vester in his quæ ad Deum pertinent, præsidebit : porro Zabadias filius Ismahel, qui est dux in domo Juda, super ea opera erit quæ ad regis officium pertinent : habetisque magistros Levitas coram vobis. Confortamini, et agite diligenter, et erit Dominus vobiscum in bonis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/  the seer met him, and said to him: Thou helpest the ungodly, and thou art joined in friendship with them that hate the Lord, and therefore thou didst deserve indeed the wrath of the Lord:\"},{\"verse\":3,\"text\":\"But good works are found in thee, because thou hast taken away the groves out of the land of Juda, and hast prepared thy heart to seek the Lord the God of thy fathers.\"},{\"verse\":4,\"text\":\"And Josaphat dwelt at Jerusalem: and he went out again to the people from Bersabee to mount Ephraim, and brought them back to the Lord the God of their fathers.\"},{\"verse\":5,\"text\":\"And he set judges of the land in all the fenced cities of Juda, in every place.\"},{\"verse\":6,\"text\":\"And charging the judges, he said: Take heed what you do: for you exercise not the judgment of man, but of the Lord: and whatsoever you judge, it shall redound to you.\"},{\"verse\":7,\"text\":\"Let the fear of the Lord be with you, and do all things with diligence: for there is no iniquity with the Lord our God, nor respect of persons, nor desire of gifts.\"},{\"verse\":8,\"text\":\"In Jerusalem also Josaphat appointed Levites, and priests and chiefs of the families of Israel, to judge the judgment and the cause of the Lord for the inhabitants thereof.\"},{\"verse\":9,\"text\":\"And he charged them, saying, Thus shall you do in the fear of the Lord faithfully, and with a perfect heart.\"},{\"verse\":10,\"text\":\"Every cause that shall come to you of your brethren, that dwell in their cities, between kindred and kindred, wheresoever there is question concerning the law, the commandment, the ceremonies, the justifications: shew it them, that they may not sin against the Lord, and that wrath may not come upon you and your brethren: and so doing you shall not sin.\"},{\"verse\":11,\"text\":\"And Amarias the priest your high priest shall be chief in the things which regard God: and Zabadias the son of Ismahel, who is ruler in the house of Juda, shall be over those matters which belong to the king’s office: and you have before you the Levites for masters, take courage and do diligently, and the Lord will be with you in good things.\"}],\"vul\":[{\"verse\":1,\"text\":\"Reversus est autem Josaphat rex Juda in domum suam pacifice in Jerusalem.\"},{\"verse\":2,\"text\":\"Cui occurrit Jehu filius Henani videns, et ait ad eum : Impio præbes auxilium, et his qui oderunt Dominum amicitia jungeris, et idcirco iram quidem Domini merebaris :\"},{\"verse\":3,\"text\":\"sed bona opera inventa sunt in te, eo quod abstuleris lucos de terra Juda, et præparaveris cor tuum ut requireres Dominum Deum patrum tuorum.\"},{\"verse\":4,\"text\":\"Habitavit ergo Josaphat in Jerusalem, rursumque egressus est ad populum de Bersabee usque ad montem Ephraim, et revocavit eos ad Dominum Deum patrum suorum.\"},{\"verse\":5,\"text\":\"Constituitque judices terræ in cunctis civitatibus Juda munitis per singula loca,\"},{\"verse\":6,\"text\":\"et præcipiens judicibus : Videte, ait, quid faciatis : non enim hominis exercetis judicium, sed Domini : et quodcumque judicaveritis, in vos redundabit.\"},{\"verse\":7,\"text\":\"Sit timor Domini vobiscum, et cum diligentia cuncta facite : non est enim apud Dominum Deum nostrum iniquitas, nec personarum acceptio, nec cupido munerum.\"},{\"verse\":8,\"text\":\"In Jerusalem quoque constituit Josaphat Levitas, et sacerdotes, et principes familiarum ex Israël, ut judicium et causam Domini judicarent habitatoribus ejus.\"},{\"verse\":9,\"text\":\"Præcepitque eis, dicens : Sic agetis in timore Domini fideliter et corde perfecto.\"},{\"verse\":10,\"text\":\"Omnem causam quæ venerit ad vos fratrum vestrorum, qui habitant in urbibus suis inter cognationem et cognationem, ubicumque quæstio est de lege, de mandato, de cæremoniis, de justificationibus : ostendite eis, ut non peccent in Dominum, et ne veniat ira super vos et super fratres vestros : sic ergo agentes non peccabitis.\"},{\"verse\":11,\"text\":\"Amarias autem sacerdos et pontifex vester in his quæ ad Deum pertinent, præsidebit : porro Zabadias filius Ismahel, qui est dux in domo Juda, super ea opera erit quæ ad regis officium pertinent : habetisque magistros Levitas coram vobis. Confortamini, et agite diligenter, et erit Dominus vobiscum in bonis.\"}],\"summary\":\"Josaphat’s charge to the judges and to the Levites.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":18,\"label\":\"2 Chronicles 18\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":20,\"label\":\"2 Chronicles 20\"}}]]\n"])</script></body></html>
