h d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Paralipomenon</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The reign of Asa: his victory over the Ethiopians.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Abia slept with his fathers, and they buried him in the city of David: and Asa his son reigned in his stead: in his days the land was quiet ten years.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Asa did that which was good and pleasing in the sight of his God, and he destroyed the altars of foreign worship, and the high places.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And broke the statues, and cut down the groves.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he commanded Juda to seek the Lord the God of their fathers, and to do the law, and all the commandments.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he took away out of all the cities of Juda the altars, and temples, and reigned in peace.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He built also strong cities in Juda, for he was quiet, and there had no wars risen in his time, the Lord giving peace.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he said to Juda: Let us build these cities, and compass them with walls, and fortify them with towers, and gates, and bars, while all is quiet from wars, because we have sought the Lord the God of our fathers, and he hath given us peace round about. So they built, and there was no hinderance in building.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Asa had in his army of men that bore shields and spears of Juda three hundred thousand, and of Benjamin that bore shields and drew bows, two hundred and eighty thousand, all these were most valiant men.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Zara the Ethiopian came out against them with his army of ten hundred thousand men, and with three hundred chariots: and he came as far as Maresa.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Asa went out to meet him, and set his army in array for battle in the vale of Sephata, which is near Maresa:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he called upon the Lord God, and said: Lord, there is no difference with thee, whether thou help with few, or with many: help us, O Lord our God: for with confidence in thee, and in thy name we are come against this multitude. O Lord thou art our God, let not man prevail against thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the Lord terrified the Ethiopians before Asa and Juda: and the Ethiopians fled.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Asa and the people that were with him pursued them to Gerara: and the Ethiopians fell even to utter destruction, for the Lord slew them, and his army fought against them, and they were destroyed. And they took abundance of spoils,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they took all the cities round about Gerara: for a great fear was come upon all men: and they pillaged the cities, and carried off much booty.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they destroyed the sheepcotes, and took an infinite number of cattle, and of camels: and returned to Jerusalem.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dormivit autem Abia cum patribus suis, et sepelierunt eum in civitate David : regnavitque Asa filius ejus pro eo, in cujus diebus quievit terra annis decem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fecit autem Asa quod bonum et placitum erat in conspectu Dei sui, et subvertit altaria peregrini cultus, et excelsa.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et confregit statuas, lucosque succidit :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et præcepit Judæ ut quæreret Dominum Deum patrum suorum, et faceret legem, et universa mandata :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et abstulit de cunctis urbibus Juda aras et fana, et regnavit in pace.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ædificavit quoque urbes munitas in Juda, quia quietus erat, et nulla temporibus ejus bella surrexerant, pacem Domino largiente.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixit autem Judæ : Ædificemus civitates istas, et vallemus muris, et roboremus turribus, et portis, et seris, donec a bellis quieta sunt omnia, eo quod quæsierimus Dominum Deum patrum nostrorum, et dederit nobis pacem per gyrum. Ædificaverunt igitur, et nullum in exstruendo impedimentum fuit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Habuit autem Asa in exercitu suo portantium scuta et hastas de Juda trecenta millia, de Benjamin vero scutariorum et sagittariorum ducenta octoginta millia : omnes isti viri fortissimi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Egressus est autem contra eos Zara Æthiops cum exercitu suo, decies centena millia, et curribus trecentis : et venit usque Maresa.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Porro Asa perrexit obviam ei, et instruxit aciem ad bellum in valle Sephata, quæ est juxta Maresa :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et invocavit Dominum Deum, et ait : Domine, non est apud te ulla distantia, utrum in paucis auxilieris, an in pluribus. Adjuva nos, Domine Deus noster : in te enim, et in tuo nomine habentes fiduciam, venimus contra hanc multitudinem. Domine, Deus noster tu es : non prævaleat contra te homo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Exterruit itaque Dominus Æthiopes coram Asa et Juda : fugeruntque Æthiopes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et persecutus est eos Asa, et populus qui cum eo erat, usque Gerara : et ruerunt Æthiopes usque ad internecionem, quia Domino cædente contriti sunt, et exercitu illius præliante. Tulerunt ergo spolia multa,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et percusserunt civitates omnes per circuitum Geraræ : grandis quippe cunctos terror invaserat : et diripuerunt urbes, et multam prædam asportaverunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sed et caulas ovium destruentes, tulerunt pecorum infinitam multitudinem, et camelorum : reversique sunt in Jerusalem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Chronicles 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-b g cities in Juda, for he was quiet, and there had no wars risen in his time, the Lord giving peace.\"},{\"verse\":7,\"text\":\"And he said to Juda: Let us build these cities, and compass them with walls, and fortify them with towers, and gates, and bars, while all is quiet from wars, because we have sought the Lord the God of our fathers, and he hath given us peace round about. So they built, and there was no hinderance in building.\"},{\"verse\":8,\"text\":\"And Asa had in his army of men that bore shields and spears of Juda three hundred thousand, and of Benjamin that bore shields and drew bows, two hundred and eighty thousand, all these were most valiant men.\"},{\"verse\":9,\"text\":\"And Zara the Ethiopian came out against them with his army of ten hundred thousand men, and with three hundred chariots: and he came as far as Maresa.\"},{\"verse\":10,\"text\":\"And Asa went out to meet him, and set his army in array for battle in the vale of Sephata, which is near Maresa:\"},{\"verse\":11,\"text\":\"And he called upon the Lord God, and said: Lord, there is no difference with thee, whether thou help with few, or with many: help us, O Lord our God: for with confidence in thee, and in thy name we are come against this multitude. O Lord thou art our God, let not man prevail against thee.\"},{\"verse\":12,\"text\":\"And the Lord terrified the Ethiopians before Asa and Juda: and the Ethiopians fled.\"},{\"verse\":13,\"text\":\"And Asa and the people that were with him pursued them to Gerara: and the Ethiopians fell even to utter destruction, for the Lord slew them, and his army fought against them, and they were destroyed. And they took abundance of spoils,\"},{\"verse\":14,\"text\":\"And they took all the cities round about Gerara: for a great fear was come upon all men: and they pillaged the cities, and carried off much booty.\"},{\"verse\":15,\"text\":\"And they destroyed the sheepcotes, and took an infinite number of cattle, and of camels: and returned to Jerusalem.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dormivit autem Abia cum patribus suis, et sepelierunt eum in civitate David : regnavitque Asa filius ejus pro eo, in cujus diebus quievit terra annis decem.\"},{\"verse\":2,\"text\":\"Fecit autem Asa quod bonum et placitum erat in conspectu Dei sui, et subvertit altaria peregrini cultus, et excelsa.\"},{\"verse\":3,\"text\":\"Et confregit statuas, lucosque succidit :\"},{\"verse\":4,\"text\":\"et præcepit Judæ ut quæreret Dominum Deum patrum suorum, et faceret legem, et universa mandata :\"},{\"verse\":5,\"text\":\"et abstulit de cunctis urbibus Juda aras et fana, et regnavit in pace.\"},{\"verse\":6,\"text\":\"Ædificavit quoque urbes munitas in Juda, quia quietus erat, et nulla temporibus ejus bella surrexerant, pacem Domino largiente.\"},{\"verse\":7,\"text\":\"Dixit autem Judæ : Ædificemus civitates istas, et vallemus muris, et roboremus turribus, et portis, et seris, donec a bellis quieta sunt omnia, eo quod quæsierimus Dominum Deum patrum nostrorum, et dederit nobis pacem per gyrum. Ædificaverunt igitur, et nullum in exstruendo impedimentum fuit.\"},{\"verse\":8,\"text\":\"Habuit autem Asa in exercitu suo portantium scuta et hastas de Juda trecenta millia, de Benjamin vero scutariorum et sagittariorum ducenta octoginta millia : omnes isti viri fortissimi.\"},{\"verse\":9,\"text\":\"Egressus est autem contra eos Zara Æthiops cum exercitu suo, decies centena millia, et curribus trecentis : et venit usque Maresa.\"},{\"verse\":10,\"text\":\"Porro Asa perrexit obviam ei, et instruxit aciem ad bellum in valle Sephata, quæ est juxta Maresa :\"},{\"verse\":11,\"text\":\"et invocavit Dominum Deum, et ait : Domine, non est apud te ulla distantia, utrum in paucis auxilieris, an in pluribus. Adjuva nos, Domine Deus noster : in te enim, et in tuo nomine habentes fiduciam, venimus contra hanc multitudinem. Domine, Deus noster tu es : non prævaleat contra te homo.\"},{\"verse\":12,\"text\":\"Exterruit itaque Dominus Æthiopes coram Asa et Juda : fugeruntque Æthiopes.\"},{\"verse\":13,\"text\":\"Et persecutus est eos Asa, et populus qui cum eo erat, usque Gerara : et ruerunt Æthiopes usque ad internecionem, quia Domino cædente contriti sunt, et exercitu illius præliante. Tulerunt ergo spolia multa,\"},{\"verse\":14,\"text\":\"et percusserunt civitates omnes per circuitum Geraræ : grandis quippe cunctos terror invaserat : et diripuerunt urbes, et multam prædam asportaverunt.\"},{\"verse\":15,\"text\":\"Sed et caulas ovium destruentes, tulerunt pecorum infinitam multitudinem, et camelorum : reversique sunt in Jerusalem.\"}],\"summary\":\"The reign of Asa: his victory over the Ethiopians.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":13,\"label\":\"2 Chronicles 13\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":15,\"label\":\"2 Chronicles 15\"}}]]\n"])</script></body></html>
