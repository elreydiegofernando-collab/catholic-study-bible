<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>2 Chronicles 29 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">29</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Paralipomenon</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Ezechias purifieth the temple, and restoreth religion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now Ezechias began to reign, when he was five and twenty years old, and he reigned nine and twenty years in Jerusalem: the name of his mother was Abia, the daughter of Zacharias.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he did that which was pleasing in the sight of the Lord, according to all that David his father had done.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In the first year and month of his reign he opened the doors of the house of the Lord, and repaired them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he brought the priests and the Levites, and assembled them in the east street.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he said to them: Hear me, ye Levites, and be sanctified, purify the house of the Lord the God of your fathers, and take away all filth out of the sanctuary.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Our fathers have sinned and done evil in the sight of the Lord God, forsaking him: they have turned away their faces from the tabernacle of the Lord, and turned their backs.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They have shut up the doors that were in the porch, and put out the lamps, and have not burnt incense, nor offered holocausts in the sanctuary of the God of Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Therefore the wrath of the Lord hath been stirred up against Juda and Jerusalem, and he hath delivered them to trouble, and to destruction, and to be hissed at, as you see with your eyes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Behold, our fathers are fallen by the sword, our sons, and our daughters, and wives are led away captives for this wickedness.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Now therefore I have a mind that we make a covenant with the Lord the God of Israel, and he will turn away the wrath of his indignation from us.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My sons, be not negligent: the Lord hath chosen you to stand before him, and to minister to him, and to worship him, and to burn incense to him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azarias, of the sons of Caath: and of the sons of Merari, Cis the son of Abdi, and Azarias the son of Jalaleel. And of the sons of Gerson, Joah the son of Zemma, and Eden the son of Joah.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And of the sons of Elisaphan, Samri, and Jahiel. Also of the sons of Asaph, Zacharias, and Mathanias.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And of the sons of Heman, Jahiel, and Semei: and of the sons of Idithun, Semeias, and Oziel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they gathered together their brethren, and sanctified themselves, and went in according to the commandment of the king, and the precept of the Lord, to purify the house of God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the priests went into the temple of the Lord to sanctify it, and brought out all the uncleanness that they found within to the entrance of the house of the Lord, and the Levites took it away, and carried it out abroad to the torrent Cedron.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they began to cleanse on the first day of the first month, and on the eighth day of the same month they came into the porch of the temple of the Lord, and they purified the temple in eight days, and on the sixteenth day of the same month they finished what they had begun.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they went in to king Ezechias, and said to him: We have sanctified all the house of the Lord, and the altar of holocaust, and the vessels thereof, and the table of proposition with all its vessels,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And all the furniture of the temple, which king Achaz in his reign had defiled, after his transgression; and behold they are all set forth before the altar of the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And king Ezechias rising early, assembled all the rulers of the city, and went up into the house of the Lord:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they offered together seven bullocks, and seven rams, and seven lambs, and seven he goats for sin, for the kingdom, for the sanctuary, for Juda: and he spoke to the priests the sons of Aaron, to offer them upon the altar of the Lord.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Therefore they killed the bullocks, and the priests took the blood, and poured it upon the altar; they killed also the rams, and their blood they poured also upon the altar, and they killed the lambs, and poured the blood upon the altar.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they brought the he goats for sin before the king, and the whole multitude, and they laid their hand upon them:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the priests immolated them, and sprinkled their blood before the altar for an expiation of all Israel: for the king had commanded that the holocaust and the sin offering should be made for all Israel.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he set the Levites in the house of the Lord with cymbals, and psalteries, and harps according to the regulation of David the king, and of Gad the seer, and of Nathan the prophet: for it was the commandment of the Lord by the hand of his prophets.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And the Levites stood, with the instruments of David, and the priests with trumpets.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Ezechias commanded that they should offer holocausts upon the altar: and when the holocausts were offered, they began to sing praises to the Lord, and to sound with trumpets, and divers instruments which David the king of Israel had prepared.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And all the multitude adored, and the singers, and the trumpeters, were in their office till the holocaust was finished.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And when the oblation was ended, the king, and all that were with him bowed down and adored.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Ezechias and the princes commanded the Levites to praise the Lord with the words of David, and Asaph the seer: and they praised him with great joy, and bowing the knee adored.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Ezechias added, and said: You have filled your hands to the Lord, come and offer victims, and praises in the house of the Lord. And all the multitude offered victims, and praises, and holocausts with a devout mind.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the number of the holocausts which the multitude offered, was seventy bullocks, a hundred rams, and two hundred lambs.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they consecrated to the Lord six hundred oxen, and three thousand sheep.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But the priests were few, and were not enough to flay the holocausts: wherefore the Levites their brethren helped them, till the work was ended, and priests were sanctified, for the Levites are sanctified with an easier rite than the priests.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>So there were many holocausts, and the fat of peace offerings, and the libations of holocausts: and the service of the house of the Lord was completed.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And Ezechias, and all the people rejoiced because the ministry of the Lord was accomplished. For the resolution of doing this thing was taken suddenly.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur Ezechias regnare cœpit, cum viginti quinque esset annorum, et viginti novem annis regnavit in Jerusalem : nomen matris ejus Abia filia Zachariæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fecitque quod erat placitum in conspectu Domini, juxta omnia quæ fecerat David pater ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ipse, anno et mense primo regni sui, aperuit valvas domus Domini, et instauravit eas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Adduxitque sacerdotes atque Levitas, et congregavit eos in plateam orientalem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixitque ad eos : Audite me, Levitæ, et sanctificamini : mundate domum Domini Dei patrum vestrorum, et auferte omnem immunditiam de sanctuario.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Peccaverunt patres nostri, et fecerunt malum in conspectu Domini Dei nostri, derelinquentes eum : averterunt facies suas a tabernaculo Domini, et præbuerunt dorsum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Clauserunt ostia quæ erant in porticu, et extinxerunt lucernas, incensumque non adoleverunt, et holocausta non obtulerunt in sanctuario Deo Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Concitatus est itaque furor Domini super Judam et Jerusalem, tradiditque eos in commotionem, et in interitum, et in sibilum, sicut ipsi cernitis oculis vestris.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>En corruerunt patres nostri gladiis : filii nostri, et filiæ nostræ, et conjuges captivæ ductæ sunt propter hoc scelus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Nunc ergo placet mihi ut ineamus fœdus cum Domino Deo Israël, et avertet a nobis furorem iræ suæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Filii mei, nolite negligere : vos elegit Dominus ut stetis coram eo, et ministretis illi, colatisque eum, et cremetis ei incensum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Surrexerunt ergo Levitæ : Mahath filius Amasai, et Joël filius Azariæ de filiis Caath : porro de filiis Merari, Cis filius Abdi, et Azarias filius Jalaleel. De filiis autem Gersom, Joah filius Zemma, et Eden filius Joah.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At vero de filiis Elisaphan, Samri, et Jahiel. De filiis quoque Asaph, Zacharias, et Mathanias :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>necnon de filiis Heman, Jahiel, et Semei : sed et de filiis Idithun, Semeias, et Oziel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Congregaveruntque fratres suos, et sanctificati sunt, et ingressi sunt juxta mandatum regis et imperium Domini, ut expiarent domum Dei.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sacerdotes quoque ingressi templum Domini ut sanctificarent illud, extulerunt omnem immunditiam quam intro repererant in vestibulo domus Domini : quam tulerunt Levitæ, et asportaverunt ad torrentem Cedron foras.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cœperunt autem prima die mensis primi mundare, et in die octavo ejusdem mensis ingressi sunt porticum templi Domini, expiaveruntque templum diebus octo, et in die sextadecima mensis ejusdem, quod cœperant, impleverunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ingressi quoque sunt ad Ezechiam regem, et dixerunt ei : Sanctificavimus omnem domum Domini, et altare holocausti, vasaque ejus, necnon et mensam propositionis cum omnibus vasis suis,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>cunctamque templi supellectilem, quam polluerat rex Achaz in regno suo, postquam prævaricatus est : et ecce exposita sunt omnia coram altare Domini.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Consurgensque diluculo Ezechias rex, adunavit omnes principes civitatis, et ascendit in domum Domini :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>obtuleruntque simul tauros septem, et arietes septem, agnos septem, et hircos septem pro peccato, pro regno, pro sanctuario, pro Juda : dixitque sacerdotibus filiis Aaron, ut offerrent super altare Domini.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Mactaverunt igitur tauros, et susceperunt sanguinem sacerdotes, et fuderunt illum super altare : mactaverunt etiam arietes, et illorum sanguinem super altare fuderunt, immolaveruntque agnos, et fuderunt super altare sanguinem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Applicuerunt hircos pro peccato coram rege, et universa multitudine, imposueruntque manus suas super eos :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et immolaverunt illos sacerdotes, et asperserunt sanguinem eorum coram altare pro piaculo universi Israëlis : pro omni quippe Israël præceperat rex ut holocaustum fieret, et pro peccato.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Constituit quoque Levitas in domo Domini cum cymbalis, et psalteriis, et citharis secundum dispositionem David regis, et Gad videntis, et Nathan prophetæ : siquidem Domini præceptum fuit per manum prophetarum ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Steteruntque Levitæ tenentes organa David, et sacerdotes tubas.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et jussit Ezechias ut offerrent holocausta super altare : cumque offerrentur holocausta, cœperunt laudes canere Domino, et clangere tubis, atque in diversis organis quæ David rex Israël præparaverat, concrepare.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Omni autem turba adorante, cantores, et ii qui tenebant tubas, erant in officio suo donec compleretur holocaustum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Cumque finita esset oblatio, incurvatus est rex, et omnes qui erant cum eo, et adoraverunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Præcepitque Ezechias et principes Levitis, ut laudarent Dominum sermonibus David, et Asaph videntis : qui laudaverunt eum magna lætitia, et incurvato genu adoraverunt.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ezechias autem etiam hæc addidit : Implestis manus vestras Domino : accedite, et offerte victimas et laudes in domo Domini. Obtulit ergo universa multitudo hostias, et laudes, et holocausta, mente devota.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Porro numerus holocaustorum quæ obtulit multitudo, hic fuit : tauros septuaginta, arietes centum, agnos ducentos.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Sanctificaveruntque Domino boves sexcentos, et oves tria millia.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Sacerdotes vero pauci erant, nec poterant sufficere ut pelles holocaustorum detraherent : unde et Levitæ fratres eorum adjuverunt eos, donec impleretur opus, et sanctificarentur antistites : Levitæ quippe faciliori ritu sanctificantur quam sacerdotes.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Fuerunt ergo holocausta plurima, adipes pacificorum, et libamina holocaustorum : et completus est cultus domus Domini.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Lætatusque est Ezechias et omnis populus, eo quod ministerium Domini esset expletum : de repente quippe hoc fieri placuerat.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border borde  to reign, when he was five and twenty years old, and he reigned nine and twenty years in Jerusalem: the name of his mother was Abia, the daughter of Zacharias.\"},{\"verse\":2,\"text\":\"And he did that which was pleasing in the sight of the Lord, according to all that David his father had done.\"},{\"verse\":3,\"text\":\"In the first year and month of his reign he opened the doors of the house of the Lord, and repaired them.\"},{\"verse\":4,\"text\":\"And he brought the priests and the Levites, and assembled them in the east street.\"},{\"verse\":5,\"text\":\"And he said to them: Hear me, ye Levites, and be sanctified, purify the house of the Lord the God of your fathers, and take away all filth out of the sanctuary.\"},{\"verse\":6,\"text\":\"Our fathers have sinned and done evil in the sight of the Lord God, forsaking him: they have turned away their faces from the tabernacle of the Lord, and turned their backs.\"},{\"verse\":7,\"text\":\"They have shut up the doors that were in the porch, and put out the lamps, and have not burnt incense, nor offered holocausts in the sanctuary of the God of Israel.\"},{\"verse\":8,\"text\":\"Therefore the wrath of the Lord hath been stirred up against Juda and Jerusalem, and he hath delivered them to trouble, and to destruction, and to be hissed at, as you see with your eyes.\"},{\"verse\":9,\"text\":\"Behold, our fathers are fallen by the sword, our sons, and our daughters, and wives are led away captives for this wickedness.\"},{\"verse\":10,\"text\":\"Now therefore I have a mind that we make a covenant with the Lord the God of Israel, and he will turn away the wrath of his indignation from us.\"},{\"verse\":11,\"text\":\"My sons, be not negligent: the Lord hath chosen you to stand before him, and to minister to him, and to worship him, and to burn incense to him.\"},{\"verse\":12,\"text\":\"Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azarias, of the sons of Caath: and of the sons of Merari, Cis the son of Abdi, and Azarias the son of Jalaleel. And of the sons of Gerson, Joah the son of Zemma, and Eden the son of Joah.\"},{\"verse\":13,\"text\":\"And of the sons of Elisaphan, Samri, and Jahiel. Also of the sons of Asaph, Zacharias, and Mathanias.\"},{\"verse\":14,\"text\":\"And of the sons of Heman, Jahiel, and Semei: and of the sons of Idithun, Semeias, and Oziel.\"},{\"verse\":15,\"text\":\"And they gathered together their brethren, and sanctified themselves, and went in according to the commandment of the king, and the precept of the Lord, to purify the house of God.\"},{\"verse\":16,\"text\":\"And the priests went into the temple of the Lord to sanctify it, and brought out all the uncleanness that they found within to the entrance of the house of the Lord, and the Levites took it away, and carried it out abroad to the torrent Cedron.\"},{\"verse\":17,\"text\":\"And they began to cleanse on the first day of the first month, and on the eighth day of the same month they came into the porch of the temple of the Lord, and they purified the temple in eight days, and on the sixteenth day of the same month they finished what they had begun.\"},{\"verse\":18,\"text\":\"And they went in to king Ezechias, and said to him: We have sanctified all the house of the Lord, and the altar of holocaust, and the vessels thereof, and the table of proposition with all its vessels,\"},{\"verse\":19,\"text\":\"And all the furniture of the temple, which king Achaz in his reign had defiled, after his transgression; and behold they are all set forth before the altar of the Lord.\"},{\"verse\":20,\"text\":\"And king Ezechias rising early, assembled all the rulers of the city, and went up into the house of the Lord:\"},{\"verse\":21,\"text\":\"And they offered together seven bullocks, and seven rams, and seven lambs, and seven he goats for sin, for the kingdom, for the sanctuary, for Juda: and he spoke to the priests the sons of Aaron, to offer them upon the altar of the Lord.\"},{\"verse\":22,\"text\":\"Therefore they killed the bullocks, and the priests took the blood, and poured it upon the altar; they killed also the rams, and their blood they poured also upon the altar, and they killed the lambs, and poured the blood upon the altar.\"},{\"verse\":23,\"text\":\"And they brought the he goats for sin before the king, and the whole multitude, and they laid their hand upon them:\"},{\"verse\":24,\"text\":\"And the priests immolated them, and sprinkled their blood before the altar for an expiation of all Israel: for the king had commanded that the holocaust and the sin offering should be made for all Israel.\"},{\"verse\":25,\"text\":\"And he set the Levites in the house of the Lord with cymbals, and psalteries, and harps according to the regulation of David the king, and of Gad the seer, and of Nathan the prophet: for it was the commandment of the Lord by the hand of his prophets.\"},{\"verse\":26,\"text\":\"And the Levites stood, with the instruments of David, and the priests with trumpets.\"},{\"verse\":27,\"text\":\"And Ezechias commanded that they should offer holocausts upon the altar: and when the holocausts were offered, they began to sing praises to the Lord, and to sound with trumpets, and divers instruments which David the king of Israel had prepared.\"},{\"verse\":28,\"text\":\"And all the multitude adored, and the singers, and the trumpeters, were in their office till the holocaust was finished.\"},{\"verse\":29,\"text\":\"And when the oblation was ended, the king, and all that were with him bowed down and adored.\"},{\"verse\":30,\"text\":\"And Ezechias and the princes commanded the Levites to praise the Lord with the words of David, and Asaph the seer: and they praised him with great joy, and bowing the knee adored.\"},{\"verse\":31,\"text\":\"And Ezechias added, and said: You have filled your hands to the Lord, come and offer victims, and praises in the house of the Lord. And all the multitude offered victims, and praises, and holocausts with a devout mind.\"},{\"verse\":32,\"text\":\"And the number of the holocausts which the multitude offered, was seventy bullocks, a hundred rams, and two hundred lambs.\"},{\"verse\":33,\"text\":\"And they consecrated to the Lord six hundred oxen, and three thousand sheep.\"},{\"verse\":34,\"text\":\"But the priests were few, and were not enough to flay the holocausts: wherefore the Levites their brethren helped them, till the work was ended, and priests were sanctified, for the Levites are sanctified with an easier rite than the priests.\"},{\"verse\":35,\"text\":\"So there were many holocausts, and the fat of peace offerings, and the libations of holocausts: and the service of the house of the Lord was completed.\"},{\"verse\":36,\"text\":\"And Ezechias, and all the people rejoiced because the ministry of the Lord was accomplished. For the resolution of doing this thing was taken suddenly.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur Ezechias regnare cœpit, cum viginti quinque esset annorum, et viginti novem annis regnavit in Jerusalem : nomen matris ejus Abia filia Zachariæ.\"},{\"verse\":2,\"text\":\"Fecitque quod erat placitum in conspectu Domini, juxta omnia quæ fecerat David pater ejus.\"},{\"verse\":3,\"text\":\"Ipse, anno et mense primo regni sui, aperuit valvas domus Domini, et instauravit eas.\"},{\"verse\":4,\"text\":\"Adduxitque sacerdotes atque Levitas, et congregavit eos in plateam orientalem.\"},{\"verse\":5,\"text\":\"Dixitque ad eos : Audite me, Levitæ, et sanctificamini : mundate domum Domini Dei patrum vestrorum, et auferte omnem immunditiam de sanctuario.\"},{\"verse\":6,\"text\":\"Peccaverunt patres nostri, et fecerunt malum in conspectu Domini Dei nostri, derelinquentes eum : averterunt facies suas a tabernaculo Domini, et præbuerunt dorsum.\"},{\"verse\":7,\"text\":\"Clauserunt ostia quæ erant in porticu, et extinxerunt lucernas, incensumque non adoleverunt, et holocausta non obtulerunt in sanctuario Deo Israël.\"},{\"verse\":8,\"text\":\"Concitatus est itaque furor Domini super Judam et Jerusalem, tradiditque eos in commotionem, et in interitum, et in sibilum, sicut ipsi cernitis oculis vestris.\"},{\"verse\":9,\"text\":\"En corruerunt patres nostri gladiis : filii nostri, et filiæ nostræ, et conjuges captivæ ductæ sunt propter hoc scelus.\"},{\"verse\":10,\"text\":\"Nunc ergo placet mihi ut ineamus fœdus cum Domino Deo Israël, et avertet a nobis furorem iræ suæ.\"},{\"verse\":11,\"text\":\"Filii mei, nolite negligere : vos elegit Dominus ut stetis coram eo, et ministretis illi, colatisque eum, et cremetis ei incensum.\"},{\"verse\":12,\"text\":\"Surrexerunt ergo Levitæ : Mahath filius Amasai, et Joël filius Azariæ de filiis Caath : porro de filiis Merari, Cis filius Abdi, et Azarias filius Jalaleel. De filiis autem Gersom, Joah filius Zemma, et Eden filius Joah.\"},{\"verse\":13,\"text\":\"At vero de filiis Elisaphan, Samri, et Jahiel. De filiis quoque Asaph, Zacharias, et Mathanias :\"},{\"verse\":14,\"text\":\"necnon de filiis Heman, Jahiel, et Semei : sed et de filiis Idithun, Semeias, et Oziel.\"},{\"verse\":15,\"text\":\"Congregaveruntque fratres suos, et sanctificati sunt, et ingressi sunt juxta mandatum regis et imperium Domini, ut expiarent domum Dei.\"},{\"verse\":16,\"text\":\"Sacerdotes quoque ingressi templum Domini ut sanctificarent illud, extulerunt omnem immunditiam quam intro repererant in vestibulo domus Domini : quam tulerunt Levitæ, et asportaverunt ad torrentem Cedron foras.\"},{\"verse\":17,\"text\":\"Cœperunt autem prima die mensis primi mundare, et in die octavo ejusdem mensis ingressi sunt porticum templi Domini, expiaveruntque templum diebus octo, et in die sextadecima mensis ejusdem, quod cœperant, impleverunt.\"},{\"verse\":18,\"text\":\"Ingressi quoque sunt ad Ezechiam regem, et dixerunt ei : Sanctificavimus omnem domum Domini, et altare holocausti, vasaque ejus, necnon et mensam propositionis cum omnibus vasis suis,\"},{\"verse\":19,\"text\":\"cunctamque templi supellectilem, quam polluerat rex Achaz in regno suo, postquam prævaricatus est : et ecce exposita sunt omnia coram altare Domini.\"},{\"verse\":20,\"text\":\"Consurgensque diluculo Ezechias rex, adunavit omnes principes civitatis, et ascendit in domum Domini :\"},{\"verse\":21,\"text\":\"obtuleruntque simul tauros septem, et arietes septem, agnos septem, et hircos septem pro peccato, pro regno, pro sanctuario, pro Juda : dixitque sacerdotibus filiis Aaron, ut offerrent super altare Domini.\"},{\"verse\":22,\"text\":\"Mactaverunt igitur tauros, et susceperunt sanguinem sacerdotes, et fuderunt illum super altare : mactaverunt etiam arietes, et illorum sanguinem super altare fuderunt, immolaveruntque agnos, et fuderunt super altare sanguinem.\"},{\"verse\":23,\"text\":\"Applicuerunt hircos pro peccato coram rege, et universa multitudine, imposueruntque manus suas super eos :\"},{\"verse\":24,\"text\":\"et immolaverunt illos sacerdotes, et asperserunt sanguinem eorum coram altare pro piaculo universi Israëlis : pro omni quippe Israël præceperat rex ut holocaustum fieret, et pro peccato.\"},{\"verse\":25,\"text\":\"Constituit quoque Levitas in domo Domini cum cymbalis, et psalteriis, et citharis secundum dispositionem David regis, et Gad videntis, et Nathan prophetæ : siquidem Domini præceptum fuit per manum prophetarum ejus.\"},{\"verse\":26,\"text\":\"Steteruntque Levitæ tenentes organa David, et sacerdotes tubas.\"},{\"verse\":27,\"text\":\"Et jussit Ezechias ut offerrent holocausta super altare : cumque offerrentur holocausta, cœperunt laudes canere Domino, et clangere tubis, atque in diversis organis quæ David rex Israël præparaverat, concrepare.\"},{\"verse\":28,\"text\":\"Omni autem turba adorante, cantores, et ii qui tenebant tubas, erant in officio suo donec compleretur holocaustum.\"},{\"verse\":29,\"text\":\"Cumque finita esset oblatio, incurvatus est rex, et omnes qui erant cum eo, et adoraverunt.\"},{\"verse\":30,\"text\":\"Præcepitque Ezechias et principes Levitis, ut laudarent Dominum sermonibus David, et Asaph videntis : qui laudaverunt eum magna lætitia, et incurvato genu adoraverunt.\"},{\"verse\":31,\"text\":\"Ezechias autem etiam hæc addidit : Implestis manus vestras Domino : accedite, et offerte victimas et laudes in domo Domini. Obtulit ergo universa multitudo hostias, et laudes, et holocausta, mente devota.\"},{\"verse\":32,\"text\":\"Porro numerus holocaustorum quæ obtulit multitudo, hic fuit : tauros septuaginta, arietes centum, agnos ducentos.\"},{\"verse\":33,\"text\":\"Sanctificaveruntque Domino boves sexcentos, et oves tria millia.\"},{\"verse\":34,\"text\":\"Sacerdotes vero pauci erant, nec poterant sufficere ut pelles holocaustorum detraherent : unde et Levitæ fratres eorum adjuverunt eos, donec impleretur opus, et sanctificarentur antistites : Levitæ quippe faciliori ritu sanctificantur quam sacerdotes.\"},{\"verse\":35,\"text\":\"Fuerunt ergo holocausta plurima, adipes pacificorum, et libamina holocaustorum : et completus est cultus domus Domini.\"},{\"verse\":36,\"text\":\"Lætatusque est Ezechias et omnis populus, eo quod ministerium Domini esset expletum : de repente quippe hoc fieri placuerat.\"}],\"summary\":\"Ezechias purifieth the temple, and restoreth religion.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":28,\"label\":\"2 Chronicles 28\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":30,\"label\":\"2 Chronicles 30\"}}]]\n"])</script></body></html>
