<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>2 Chronicles 6 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->2 Paralipomenon</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/2CH/">About <!-- -->2 Chronicles</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Solomon’s blessings and prayer.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Solomon said: The Lord promised that he would dwell in a cloud.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But I have built a house to his name, that he might dwell there for ever.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the king turned his face, and blessed all the multitude of Israel for all the multitude stood attentive and he said:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Blessed be the Lord the God of Israel, who hath accomplished in deed that which he spoke to David my father, saying:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>From the day that I brought my people out of the land of Egypt, I chose no city among all the tribes of Israel, for a house to be built in it to my name: neither chose I any other man, to be the ruler of my people Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But I chose Jerusalem, that my name might be there: and I chose David to set him over my people Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And whereas David my father had a mind to build a house to the name of the Lord the God of Israel,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Lord said to him: Forasmuch as it was thy will to build a house to my name, thou hast done well indeed in having such a will:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But thou shalt not build the house, but thy son, who shall come out of thy loins, he shall build a house to my name.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The Lord therefore hath accomplished his word which he spoke: and I am risen up in the place of David my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord God of Israel.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I have put in it the ark, wherein is the covenant of the Lord, which he made with the children of Israel.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he stood before the altar of the Lord, in presence of all the multitude of Israel, and stretched forth his hands.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For Solomon had made a brazen scaffold, and had set it in the midst of the temple, which was five cubits long, and five cubits broad, and three cubits high: and he stood upon it: then kneeling down in the presence of all the multitude of Israel, and lifting up his hands towards heaven,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He said: O Lord God of Israel, there is no God like thee in heaven nor in earth: who keepest covenant and mercy with thy servants, that walk before thee with all their hearts:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Who hast performed to thy servant David my father all that thou hast promised him: and hast accomplished in fact, what thou hast spoken with thy mouth, as also the present time proveth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Now then, O Lord God of Israel, fulfil to thy servant David my father, whatsoever thou hast promised him, saying: There shall not fail thee a man in my sight, to sit upon the throne of Israel: yet so that thy children take heed to their ways, and walk in my law, as thou hast walked before me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And now, Lord God of Israel, let thy word be established which thou hast spoken to thy servant David.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Is it credible then that God should dwell with men on the earth? If heaven and the heavens of heavens do not contain thee, how much less this house, which I have built?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But to this end only it is made, that thou mayest regard the prayer of thy servant and his supplication, O Lord my God: and mayest hear the prayers which thy servant poureth out before thee.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>That thou mayest open thy eyes upon this house day and night, upon the place wherein thou hast promised that thy name should be called upon,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And that thou wouldst hear the prayer which thy servant prayeth in it: hearken then to the prayers of thy servant, and of thy people Israel. Whosoever shall pray in this place, hear thou from thy dwelling place, that is, from heaven, and shew mercy.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If any man sin against his neighbour, and come to swear against him, and bind himself with a curse before the altar in this house:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Then hear thou from heaven, and do justice to thy servants, so to requite the wicked by making his wickedness fall upon his own head, and to revenge the just, rewarding him according to his justice.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>If thy people Israel be overcome by their enemies, (for they will sin against thee,) and being converted shall do penance, and call upon thy name, and pray to thee in this place,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Then hear thou from heaven, and forgive the sin of thy people Israel and bring them back into the land which thou gavest to them, and their fathers.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>If the heavens be shut up, and there fall no rain by reason of the sin of the people, and they shall pray to thee in this place, and confess to thy name, and be converted from their sins, where thou dost afflict them,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Then hear thou from heaven, O Lord, and forgive the sins of thy servants and of thy people Israel and teach them the good way in which they may walk: and give rain to thy land which thou hast given to thy people to possess.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>If a famine arise in the land, or a pestilence or blasting, or mildew, or locusts, or caterpillars: or if their enemies waste the country, and besiege the cities, whatsoever scourge or infirmity shall be upon them:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then if any of thy people Israel, knowing his own scourge and infirmity shall pray, and shall spread forth his hands in this house,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Hear thou from heaven, from thy high dwelling place, and forgive, and render to every one according to his ways, which thou knowest him to have in his heart: for thou only knowest the hearts of the children of men:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>That they may fear thee, and walk in thy ways all the days that they live upon the face of the land, which thou hast given to our fathers.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>If the stranger also, who is not of thy people Israel, come from a far country, for the sake of thy great name, and thy strong hand, and thy stretched out arm, and adore in this place:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hear thou from heaven thy firm dwelling place, and do all that which that stranger shall call upon thee for: that all the people of the earth may know thy name, and may fear thee, as thy people Israel, and may know, that thy name is invoked upon this house, which I have built.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>If thy people go out to war against their enemies, by the way that thou shalt send them, and adore thee towards the way of this city, which thou hast chosen, and the house which I have built to thy name:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Then hear thou from heaven their prayers, and their supplications, and revenge them.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And if they sin against thee (for there is no man that sinneth not) and thou be angry with them, and deliver them up to their enemies, and they lead them away captive to a land either afar off, or near at hand,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And if they be converted in their heart in the land to which they were led captive, and do penance, and pray to thee in the land of their captivity saying: We have sinned, we have done wickedly, we have dealt unjustly:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And return to thee with all their heart, and with all their soul, in the land of their captivity, to which they were led away, and adore thee towards the way of their own land which thou gavest their fathers, and of the city, which thou hast chosen, and the house which I have built to thy name:</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Then hear thou from heaven, that is, from thy firm dwelling place, their prayers, and do judgment, and forgive thy people, although they have sinned:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>For thou art my God: let thy eyes, I beseech thee, be open, and let thy ears be attentive to the prayer, that is made in this place.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Now therefore arise, O Lord God, into thy resting place, thou and the ark of thy strength: let thy priests, O Lord God, put on salvation, and thy saints rejoice in good things.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>O Lord God, turn not away the face of thy anointed: remember the mercies of David thy servant.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc Salomon ait : Dominus pollicitus est ut habitaret in caligine :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ego autem ædificavi domum nomini ejus, ut habitaret ibi in perpetuum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et convertit rex faciem suam, et benedixit universæ multitudini Israël (nam omnis turba stabat intenta), et ait :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Benedictus Dominus Deus Israël, qui quod locutus est David patri meo, opere complevit, dicens :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A die qua eduxi populum meum de terra Ægypti, non elegi civitatem de cunctis tribubus Israël ut ædificaretur in ea domus nomini meo, neque elegi quemquam alium virum ut esset dux in populo Israël :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>sed elegi Jerusalem ut sit nomen meum in ea, et elegi David ut constituerem eum super populum meum Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cumque fuisset voluntatis David patris mei ut ædificaret domum nomini Domini Dei Israël,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>dixit Dominus ad eum : Quia hæc fuit voluntas tua, ut ædificares domum nomini meo, bene quidem fecisti hujuscemodi habere voluntatem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>sed non tu ædificabis domum : verum filius tuus, qui egredietur de lumbis tuis, ipse ædificabit domum nomini meo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Complevit ergo Dominus sermonem suum quem locutus fuerat : et ego surrexi pro David patre meo, et sedi super thronum Israël, sicut locutus est Dominus : et ædificavi domum nomini Domini Dei Israël.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et posui in ea arcam in qua est pactum Domini quod pepigit cum filiis Israël.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Stetit ergo coram altari Domini ex adverso universæ multitudinis Israël, et extendit manus suas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Siquidem fecerat Salomon basim æneam, et posuerat eam in medio basilicæ, habentem quinque cubitos longitudinis, et quinque cubitos latitudinis, et tres cubitos altitudinis : stetitque super eam, et deinceps flexis genibus contra universam multitudinem Israël, et palmis in cælum levatis,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ait : Domine Deus Israël, non est similis tui deus in cælo et in terra : qui custodis pactum et misericordiam cum servis tuis qui ambulant coram te in toto corde suo :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui præstitisti servo tuo David patri meo quæcumque locutus fueras ei : et quæ ore promiseras, opere complesti, sicut et præsens tempus probat.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nunc ergo Domine Deus Israël, imple servo tuo patri meo David quæcumque locutus es, dicens : Non deficiet ex te vir coram me, qui sedeat super thronum Israël : ita tamen si custodierint filii tui vias suas, et ambulaverint in lege mea, sicut et tu ambulasti coram me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et nunc Domine Deus Israël, firmetur sermo tuus quem locutus es servo tuo David.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ergone credibile est ut habitet Deus cum hominibus super terram ? si cælum et cæli cælorum non te capiunt, quanto magis domus ista quam ædificavi ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sed ad hoc tantum facta est, ut respicias orationem servi tui, et obsecrationem ejus, Domine Deus meus, et audias preces quas fundit famulus tuus coram te :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ut aperias oculos tuos super domum istam diebus ac noctibus, super locum in quo pollicitus es ut invocaretur nomen tuum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et exaudires orationem quam servus tuus orat in eo : et exaudias preces famuli tui, et populi tui Israël. Quicumque oraverit in loco isto, exaudi de habitaculo tuo, id est, de cælis, et propitiare.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si peccaverit quispiam in proximum suum, et jurare contra eum paratus venerit, seque maledicto constrinxerit coram altari in domo ista :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>tu audies de cælo, et facies judicium servorum tuorum, ita ut reddas iniquo viam suam in caput proprium, et ulciscaris justum, retribuens ei secundum justitiam suam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Si superatus fuerit populus tuus Israël ab inimicis (peccabunt enim tibi), et conversi egerint pœnitentiam, et obsecraverint nomen tuum, et fuerint deprecati in loco isto,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>tu exaudies de cælo : et propitiare peccato populi tui Israël, et reduc eos in terram quam dedisti eis, et patribus eorum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Si clauso cælo pluvia non fluxerit propter peccata populi, et deprecati te fuerint in loco isto, et confessi nomini tuo, et conversi a peccatis suis, cum eos afflixeris,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>exaudi de cælo, Domine, et dimitte peccata servis tuis et populi tui Israël, et doce eos viam bonam, per quam ingrediantur : et da pluviam terræ quam dedisti populo tuo ad possidendum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Fames si orta fuerit in terra, et pestilentia, ærugo, et aurugo, et locusta, et bruchus : et hostes, vastatis regionibus, portas obsederint civitatis, omnisque plaga et infirmitas presserit :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>si quis de populo tuo Israël fuerit deprecatus, cognoscens plagam et infirmitatem suam, et expanderit manus suas in domo hac,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>tu exaudies de cælo, de sublimi scilicet habitaculo tuo : et propitiare, et redde unicuique secundum vias suas, quas nosti eum habere in corde suo (tu enim solus nosti corda filiorum hominum) :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>ut timeant te, et ambulent in viis tuis cunctis diebus quibus vivunt super faciem terræ quam dedisti patribus nostris.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Externum quoque, qui non est de populo tuo Israël, si venerit de terra longinqua propter nomen tuum magnum, et propter manum tuam robustam, et brachium tuum extentum, et adoraverit in loco isto,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>tu exaudies de cælo firmissimo habitaculo tuo, et facies cuncta pro quibus invocaverit te ille peregrinus : ut sciant omnes populi terræ nomen tuum, et timeant te sicut populus tuus Israël, et cognoscant quia nomen tuum invocatum est super domum hanc quam ædificavi.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Si egressus fuerit populus tuus ad bellum contra adversarios suos per viam in qua miseris eos, adorabunt te contra viam in qua civitas hæc est, quam elegisti, et domus quam ædificavi nomini tuo,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>tu exaudies de cælo preces eorum, et obsecrationem : et ulciscaris.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Si autem peccaverint tibi (neque enim est homo qui non peccet), et iratus fueris eis, et tradideris hostibus, et captivos duxerint eos in terram longinquam, vel certe quæ juxta est,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et conversi in corde suo in terra ad quam captivi ducti fuerant, egerint pœnitentiam, et deprecati te fuerint in terra captivitatis suæ, dicentes : Peccavimus : inique fecimus, injuste egimus :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et reversi fuerint ad te in toto corde suo, et in tota anima sua, in terra captivitatis suæ ad quam ducti sunt, adorabunt te contra viam terræ suæ, quam dedisti patribus eorum, et urbis quam elegisti, et domus quam ædificavi nomini tuo :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>tu exaudies de cælo, hoc est, de firmo habitaculo tuo, preces eorum : et facias judicium, et dimittas populo tuo, quamvis peccatori :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>tu es enim Deus meus : aperiantur, quæso, oculi tui, et aures tuæ intentæ sint ad orationem quæ fit in loco isto.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Nunc igitur consurge, Domine Deus, in requiem tuam, tu et arca fortitudinis tuæ : sacerdotes tui, Domine Deus, induantur salutem, et sancti tui lætentur in bonis.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Domine Deus, ne averteris faciem christi tui : memento misericordiarum David servi tui.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w- 201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"2 Chronicles 6 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"2CH.6\",{\"bookId\":14,\"usfm\":\"2CH\",\"bookName\":\"2 Chronicles\",\"drName\":\"2 Paralipomenon\",\"chapter\":6,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"Then Solomon said: The Lord promised that he would dwell in a cloud.\"},{\"verse\":2,\"text\":\"But I have built a house to his name, that he might dwell there for ever.\"},{\"verse\":3,\"text\":\"And the king turned his face, and blessed all the multitude of Israel for all the multitude stood attentive and he said:\"},{\"verse\":4,\"text\":\"Blessed be the Lord the God of Israel, who hath accomplished in deed that which he spoke to David my father, saying:\"},{\"verse\":5,\"text\":\"From the day that I brought my people out of the land of Egypt, I chose no city among all the tribes of Israel, for a house to be built in it to my name: neither chose I any other man, to be the ruler of my people Israel.\"},{\"verse\":6,\"text\":\"But I chose Jerusalem, that my name might be there: and I chose David to set him over my people Israel.\"},{\"verse\":7,\"text\":\"And whereas David my father had a mind to build a house to the name of the Lord the God of Israel,\"},{\"verse\":8,\"text\":\"The Lord said to him: Forasmuch as it was thy will to build a house to my name, thou hast done well indeed in having such a will:\"},{\"verse\":9,\"text\":\"But thou shalt not build the house, but thy son, who shall come out of thy loins, he shall build a house to my name.\"},{\"verse\":10,\"text\":\"The Lord therefore hath accomplished his word which he spoke: and I am risen up in the place of David my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord God of Israel.\"},{\"verse\":11,\"text\":\"And I have put in it the ark, wherein is the covenant of the Lord, which he made with the children of Israel.\"},{\"verse\":12,\"text\":\"And he stood before the altar of the Lord, in presence of all the multitude of Israel, and stretched forth his hands.\"},{\"verse\":13,\"text\":\"For Solomon had made a brazen scaffold, and had set it in the midst of the temple, which was five cubits long, and five cubits broad, and three cubits high: and he stood upon it: then kneeling down in the presence of all the multitude of Israel, and lifting up his hands towards heaven,\"},{\"verse\":14,\"text\":\"He said: O Lord God of Israel, there is no God like thee in heaven nor in earth: who keepest covenant and mercy with thy servants, that walk before thee with all their hearts:\"},{\"verse\":15,\"text\":\"Who hast performed to thy servant David my father all that thou hast promised him: and hast accomplished in fact, what thou hast spoken with thy mouth, as also the present time proveth.\"},{\"verse\":16,\"text\":\"Now then, O Lord God of Israel, fulfil to thy servant David my father, whatsoever thou hast promised him, saying: There shall not fail thee a man in my sight, to sit upon the throne of Israel: yet so that thy children take heed to their ways, and walk in my law, as thou hast walked before me.\"},{\"verse\":17,\"text\":\"And now, Lord God of Israel, let thy word be established which thou hast spoken to thy servant David.\"},{\"verse\":18,\"text\":\"Is it credible then that God should dwell with men on the earth? If heaven and the heavens of heavens do not contain thee, how much less this house, which I have built?\"},{\"verse\":19,\"text\":\"But to this end only it is made, that thou mayest regard the prayer of thy servant and his supplication, O Lord my God: and mayest hear the prayers which thy servant poureth out before thee.\"},{\"verse\":20,\"text\":\"That thou mayest open thy eyes upon this house day and night, upon the place wherein thou hast promised that thy name should be called upon,\"},{\"verse\":21,\"text\":\"And that thou wouldst hear the prayer which thy servant prayeth in it: hearken then to the prayers of thy servant, and of thy people Israel. Whosoever shall pray in this place, hear thou from thy dwelling place, that is, from heaven, and shew mercy.\"},{\"verse\":22,\"text\":\"If any man sin against his neighbour, and come to swear against him, and bind himself with a curse before the altar in this house:\"},{\"verse\":23,\"text\":\"Then hear thou from heaven, and do justice to thy servants, so to requite the wicked by making his wickedness fall upon his own head, and to revenge the just, rewarding him according to his justice.\"},{\"verse\":24,\"text\":\"If thy people Israel be overcome by their enemies, (for they will sin against thee,) and being converted shall do penance, and call upon thy name, and pray to thee in this place,\"},{\"verse\":25,\"text\":\"Then hear thou from heaven, and forgive the sin of thy people Israel and bring them back into the land which thou gavest to them, and their fathers.\"},{\"verse\":26,\"text\":\"If the heavens be shut up, and there fall no rain by reason of the sin of the people, and they shall pray to thee in this place, and confess to thy name, and be converted from their sins, where thou dost afflict them,\"},{\"verse\":27,\"text\":\"Then hear thou from heaven, O Lord, and forgive the sins of thy servants and of thy people Israel and teach them the good way in which they may walk: and give rain to thy land which thou hast given to thy people to possess.\"},{\"verse\":28,\"text\":\"If a famine arise in the land, or a pestilence or blasting, or mildew, or locusts, or caterpillars: or if their enemies waste the country, and besiege the cities, whatsoever scourge or infirmity shall be upon them:\"},{\"verse\":29,\"text\":\"Then if any of thy people Israel, knowing his own scourge and infirmity shall pray, and shall spread forth his hands in this house,\"},{\"verse\":30,\"text\":\"Hear thou from heaven, from thy high dwelling place, and forgive, and render to every one according to his ways, which thou knowest him to have in his heart: for thou only knowest the hearts of the children of men:\"},{\"verse\":31,\"text\":\"That they may fear thee, and walk in thy ways all the days that they live upon the face of the land, which thou hast given to our fathers.\"},{\"verse\":32,\"text\":\"If the stranger also, who is not of thy people Israel, come from a far country, for the sake of thy great name, and thy strong hand, and thy stretched out arm, and adore in this place:\"},{\"verse\":33,\"text\":\"Hear thou from heaven thy firm dwelling place, and do all that which that stranger shall call upon thee for: that all the people of the earth may know thy name, and may fear thee, as thy people Israel, and may know, that thy name is invoked upon this house, which I have built.\"},{\"verse\":34,\"text\":\"If thy people go out to war against their enemies, by the way that thou shalt send them, and adore thee towards the way of this city, which thou hast chosen, and the house which I have built to thy name:\"},{\"verse\":35,\"text\":\"Then hear thou from heaven their prayers, and their supplications, and revenge them.\"},{\"verse\":36,\"text\":\"And if they sin against thee (for there is no man that sinneth not) and thou be angry with them, and deliver them up to their enemies, and they lead them away captive to a land either afar off, or near at hand,\"},{\"verse\":37,\"text\":\"And if they be converted in their heart in the land to which they were led captive, and do penance, and pray to thee in the land of their captivity saying: We have sinned, we have done wickedly, we have dealt unjustly:\"},{\"verse\":38,\"text\":\"And return to thee with all their heart, and with all their soul, in the land of their captivity, to which they were led away, and adore thee towards the way of their own land which thou gavest their fathers, and of the city, which thou hast chosen, and the house which I have built to thy name:\"},{\"verse\":39,\"text\":\"Then hear thou from heaven, that is, from thy firm dwelling place, their prayers, and do judgment, and forgive thy people, although they have sinned:\"},{\"verse\":40,\"text\":\"For thou art my God: let thy eyes, I beseech thee, be open, and let thy ears be attentive to the prayer, that is made in this place.\"},{\"verse\":41,\"text\":\"Now therefore arise, O Lord God, into thy resting place, thou and the ark of thy strength: let thy priests, O Lord God, put on salvation, and thy saints rejoice in good things.\"},{\"verse\":42,\"text\":\"O Lord God, turn not away the face of thy anointed: remember the mercies of David thy servant.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc Salomon ait : Dominus pollicitus est ut habitaret in caligine :\"},{\"verse\":2,\"text\":\"ego autem ædificavi domum nomini ejus, ut habitaret ibi in perpetuum.\"},{\"verse\":3,\"text\":\"Et convertit rex faciem suam, et benedixit universæ multitudini Israël (nam omnis turba stabat intenta), et ait :\"},{\"verse\":4,\"text\":\"Benedictus Dominus Deus Israël, qui quod locutus est David patri meo, opere complevit, dicens :\"},{\"verse\":5,\"text\":\"A die qua eduxi populum meum de terra Ægypti, non elegi civitatem de cunctis tribubus Israël ut ædificaretur in ea domus nomini meo, neque elegi quemquam alium virum ut esset dux in populo Israël :\"},{\"verse\":6,\"text\":\"sed elegi Jerusalem ut sit nomen meum in ea, et elegi David ut constituerem eum super populum meum Israël.\"},{\"verse\":7,\"text\":\"Cumque fuisset voluntatis David patris mei ut ædificaret domum nomini Domini Dei Israël,\"},{\"verse\":8,\"text\":\"dixit Dominus ad eum : Quia hæc fuit voluntas tua, ut ædificares domum nomini meo, bene quidem fecisti hujuscemodi habere voluntatem :\"},{\"verse\":9,\"text\":\"sed non tu ædificabis domum : verum filius tuus, qui egredietur de lumbis tuis, ipse ædificabit domum nomini meo.\"},{\"verse\":10,\"text\":\"Complevit ergo Dominus sermonem suum quem locutus fuerat : et ego surrexi pro David patre meo, et sedi super thronum Israël, sicut locutus est Dominus : et ædificavi domum nomini Domini Dei Israël.\"},{\"verse\":11,\"text\":\"Et posui in ea arcam in qua est pactum Domini quod pepigit cum filiis Israël.\"},{\"verse\":12,\"text\":\"Stetit ergo coram altari Domini ex adverso universæ multitudinis Israël, et extendit manus suas.\"},{\"verse\":13,\"text\":\"Siquidem fecerat Salomon basim æneam, et posuerat eam in medio basilicæ, habentem quinque cubitos longitudinis, et quinque cubitos latitudinis, et tres cubitos altitudinis : stetitque super eam, et deinceps flexis genibus contra universam multitudinem Israël, et palmis in cælum levatis,\"},{\"verse\":14,\"text\":\"ait : Domine Deus Israël, non est similis tui deus in cælo et in terra : qui custodis pactum et misericordiam cum servis tuis qui ambulant coram te in toto corde suo :\"},{\"verse\":15,\"text\":\"qui præstitisti servo tuo David patri meo quæcumque locutus fueras ei : et quæ ore promiseras, opere complesti, sicut et præsens tempus probat.\"},{\"verse\":16,\"text\":\"Nunc ergo Domine Deus Israël, imple servo tuo patri meo David quæcumque locutus es, dicens : Non deficiet ex te vir coram me, qui sedeat super thronum Israël : ita tamen si custodierint filii tui vias suas, et ambulaverint in lege mea, sicut et tu ambulasti coram me.\"},{\"verse\":17,\"text\":\"Et nunc Domine Deus Israël, firmetur sermo tuus quem locutus es servo tuo David.\"},{\"verse\":18,\"text\":\"Ergone credibile est ut habitet Deus cum hominibus super terram ? si cælum et cæli cælorum non te capiunt, quanto magis domus ista quam ædificavi ?\"},{\"verse\":19,\"text\":\"Sed ad hoc tantum facta est, ut respicias orationem servi tui, et obsecrationem ejus, Domine Deus meus, et audias preces quas fundit famulus tuus coram te :\"},{\"verse\":20,\"text\":\"ut aperias oculos tuos super domum istam diebus ac noctibus, super locum in quo pollicitus es ut invocaretur nomen tuum,\"},{\"verse\":21,\"text\":\"et exaudires orationem quam servus tuus orat in eo : et exaudias preces famuli tui, et populi tui Israël. Quicumque oraverit in loco isto, exaudi de habitaculo tuo, id est, de cælis, et propitiare.\"},{\"verse\":22,\"text\":\"Si peccaverit quispiam in proximum suum, et jurare contra eum paratus venerit, seque maledicto constrinxerit coram altari in domo ista :\"},{\"verse\":23,\"text\":\"tu audies de cælo, et facies judicium servorum tuorum, ita ut reddas iniquo viam suam in caput proprium, et ulciscaris justum, retribuens ei secundum justitiam suam.\"},{\"verse\":24,\"text\":\"Si superatus fuerit populus tuus Israël ab inimicis (peccabunt enim tibi), et conversi egerint pœnitentiam, et obsecraverint nomen tuum, et fuerint deprecati in loco isto,\"},{\"verse\":25,\"text\":\"tu exaudies de cælo : et propitiare peccato populi tui Israël, et reduc eos in terram quam dedisti eis, et patribus eorum.\"},{\"verse\":26,\"text\":\"Si clauso cælo pluvia non fluxerit propter peccata populi, et deprecati te fuerint in loco isto, et confessi nomini tuo, et conversi a peccatis suis, cum eos afflixeris,\"},{\"verse\":27,\"text\":\"exaudi de cælo, Domine, et dimitte peccata servis tuis et populi tui Israël, et doce eos viam bonam, per quam ingrediantur : et da pluviam terræ quam dedisti populo tuo ad possidendum.\"},{\"verse\":28,\"text\":\"Fames si orta fuerit in terra, et pestilentia, ærugo, et aurugo, et locusta, et bruchus : et hostes, vastatis regionibus, portas obsederint civitatis, omnisque plaga et infirmitas presserit :\"},{\"verse\":29,\"text\":\"si quis de populo tuo Israël fuerit deprecatus, cognoscens plagam et infirmitatem suam, et expanderit manus suas in domo hac,\"},{\"verse\":30,\"text\":\"tu exaudies de cælo, de sublimi scilicet habitaculo tuo : et propitiare, et redde unicuique secundum vias suas, quas nosti eum habere in corde suo (tu enim solus nosti corda filiorum hominum) :\"},{\"verse\":31,\"text\":\"ut timeant te, et ambulent in viis tuis cunctis diebus quibus vivunt super faciem terræ quam dedisti patribus nostris.\"},{\"verse\":32,\"text\":\"Externum quoque, qui non est de populo tuo Israël, si venerit de terra longinqua propter nomen tuum magnum, et propter manum tuam robustam, et brachium tuum extentum, et adoraverit in loco isto,\"},{\"verse\":33,\"text\":\"tu exaudies de cælo firmissimo habitaculo tuo, et facies cuncta pro quibus invocaverit te ille peregrinus : ut sciant omnes populi terræ nomen tuum, et timeant te sicut populus tuus Israël, et cognoscant quia nomen tuum invocatum est super domum hanc quam ædificavi.\"},{\"verse\":34,\"text\":\"Si egressus fuerit populus tuus ad bellum contra adversarios suos per viam in qua miseris eos, adorabunt te contra viam in qua civitas hæc est, quam elegisti, et domus quam ædificavi nomini tuo,\"},{\"verse\":35,\"text\":\"tu exaudies de cælo preces eorum, et obsecrationem : et ulciscaris.\"},{\"verse\":36,\"text\":\"Si autem peccaverint tibi (neque enim est homo qui non peccet), et iratus fueris eis, et tradideris hostibus, et captivos duxerint eos in terram longinquam, vel certe quæ juxta est,\"},{\"verse\":37,\"text\":\"et conversi in corde suo in terra ad quam captivi ducti fuerant, egerint pœnitentiam, et deprecati te fuerint in terra captivitatis suæ, dicentes : Peccavimus : inique fecimus, injuste egimus :\"},{\"verse\":38,\"text\":\"et reversi fuerint ad te in toto corde suo, et in tota anima sua, in terra captivitatis suæ ad quam ducti sunt, adorabunt te contra viam terræ suæ, quam dedisti patribus eorum, et urbis quam elegisti, et domus quam ædificavi nomini tuo :\"},{\"verse\":39,\"text\":\"tu exaudies de cælo, hoc est, de firmo habitaculo tuo, preces eorum : et facias judicium, et dimittas populo tuo, quamvis peccatori :\"},{\"verse\":40,\"text\":\"tu es enim Deus meus : aperiantur, quæso, oculi tui, et aures tuæ intentæ sint ad orationem quæ fit in loco isto.\"},{\"verse\":41,\"text\":\"Nunc igitur consurge, Domine Deus, in requiem tuam, tu et arca fortitudinis tuæ : sacerdotes tui, Domine Deus, induantur salutem, et sancti tui lætentur in bonis.\"},{\"verse\":42,\"text\":\"Domine Deus, ne averteris faciem christi tui : memento misericordiarum David servi tui.\"}],\"summary\":\"Solomon’s blessings and prayer.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":5,\"label\":\"2 Chronicles 5\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":7,\"label\":\"2 Chronicles 7\"}}]]\n"])</script></body></html>
