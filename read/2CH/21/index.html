h d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">2 Chronicles<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->2 Paralipomenon</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Joram’s wicked reign: his punishment and death.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Josaphat slept with his fathers, and was buried with them in the city of David: and Joram his son reigned in his stead.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he had brethren the sons of Josaphat, Azarias, and Jahiel, and Zacharias, and Azaria, and Michael, and Saphatias, all these were the sons of Josaphat king of Juda.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And their father gave them great gifts of silver, and of gold, and pensions, with strong cities in Juda: but the kingdom he gave to Joram, because he was the eldest.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>So Joram rose up over the kingdom of his father: and when he had established himself, he slew all his brethren with the sword, and some of the princes of Israel.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Joram was two and thirty years old when he began to reign: and he reigned eight years in Jerusalem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he walked in the ways of the kings of Israel, as the house of Achab had done: for his wife was a daughter of Achab, and he did evil in the sight of the Lord.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But the Lord would not destroy the house of David: because of the covenant which he had made with him: and because he had promised to give a lamp to him, and to his sons for ever.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In those days Edom revolted, from being subject to Juda, and made themselves a king.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Joram went over with his princes, and all his cavalry with him, and rose in the night, and defeated the Edomites who had surrounded him, and all the captains of his cavalry.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>However Edom revolted, from being under the dominion of Juda unto this day: at that time Lobna also revolted, from being under his hand. For he had forsaken the Lord the God of his fathers.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Moreover he built also high places in the cities of Juda, and he made the inhabitants of Jerusalem to commit fornication, and Juda to transgress.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And there was a letter brought him from Eliseus the prophet, in which it was written: Thus saith the Lord the God of David thy father: Because thou hast not walked in the ways of Josaphat thy father nor in the ways of Asa king of Juda,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But hast walked in the ways of the kings of Israel, and hast made Juda and the inhabitants of Jerusalem to commit fornication, imitating the fornication of the house of Achab, moreover also thou hast killed thy brethren, the house of thy father, better men than thyself,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Behold the Lord will strike thee with a great plague, with all thy people, and thy children, and thy wives, and all thy substance.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou shalt be sick of a very grievous disease of thy bowels, till thy vital parts come out by little and little every day.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Lord stirred up against Joram the spirit of the Philistines, and of the Arabians, who border on the Ethiopians.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they came up into the land of Juda, and wasted it, and they carried away all the substance that was found in the king’s house, his sons also, and his wives: so that there was no son left him but Joachaz, who was the youngest.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And besides all this the Lord struck him with an incurable disease in his bowels.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And as day came after day, and time rolled on, two whole years passed: then after being wasted with a long consumption, so as to void his very bowels, his disease ended with his life. And he died of a most wretched illness, and the people did not make a funeral for him according to the manner of burning, as they had done for his ancestors.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He was two and thirty years old when he began his reign, and he reigned eight years in Jerusalem. And he walked not rightly, and they buried him in the city of David: but not in the sepulchres of the kings.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dormivit autem Josaphat cum patribus suis, et sepultus est cum eis in civitate David : regnavitque Joram filius ejus pro eo.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui habuit fratres filios Josaphat, Azariam, et Jahiel, et Zachariam, et Azariam, et Michaël, et Saphatiam : omnes hi filii Josaphat regis Juda.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deditque eis pater suus multa munera argenti et auri, et pensitationes, cum civitatibus munitissimis in Juda : regnum autem tradidit Joram, eo quod esset primogenitus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Surrexit ergo Joram super regnum patris sui : cumque se confirmasset, occidit omnes fratres suos gladio, et quosdam de principibus Israël.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Triginta duorum annorum erat Joram cum regnare cœpisset, et octo annis regnavit in Jerusalem.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ambulavitque in viis regum Israël, sicut egerat domus Achab : filia quippe Achab erat uxor ejus : et fecit malum in conspectu Domini.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Noluit autem Dominus disperdere domum David propter pactum quod inierat cum eo : et quia promiserat ut daret ei lucernam, et filiis ejus omni tempore.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In diebus illis rebellavit Edom, ne esset subditus Judæ, et constituit sibi regem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cumque transisset Joram cum principibus suis, et cuncto equitatu qui erat secum, surrexit nocte, et percussit Edom, qui se circumdederat, et omnes duces equitatus ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Attamen rebellavit Edom, ne esset sub ditione Juda usque ad hanc diem : eo tempore et Lobna recessit ne esset sub manu illius. Dereliquerat enim Dominum Deum patrum suorum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>insuper et excelsa fabricatus est in urbibus Juda, et fornicari fecit habitatores Jerusalem, et prævaricari Judam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Allatæ sunt autem ei litteræ ab Elia propheta, in quibus scriptum erat : Hæc dicit Dominus Deus David patris tui : Quoniam non ambulasti in viis Josaphat patris tui, et in viis Asa regis Juda,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>sed incessisti per iter regum Israël, et fornicari fecisti Judam et habitatores Jerusalem, imitatus fornicationem domus Achab, insuper et fratres tuos, domum patris tui, meliores te, occidisti :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ecce Dominus percutiet te plaga magna cum populo tuo, et filiis, et uxoribus tuis, universaque substantia tua.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tu autem ægrotabis pessimo languore uteri tui, donec egrediantur vitalia tua paulatim per singulos dies.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Suscitavit ergo Dominus contra Joram spiritum Philisthinorum, et Arabum qui confines sunt Æthiopibus :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et ascenderunt in terram Juda, et vastaverunt eam, diripueruntque cunctam substantiam quæ inventa est in domo regis, insuper et filios ejus, et uxores : nec remansit ei filius, nisi Joachaz, qui minimus natu erat.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et super hæc omnia percussit eum Dominus alvi languore insanabili.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cumque diei succederet dies, et temporum spatia volverentur, duorum annorum expletus est circulus : et sic longa consumptus tabe, ita ut egereret etiam viscera sua, languore pariter, et vita caruit. Mortuusque est in infirmitate pessima, et non fecit ei populus secundum morem combustionis exequias, sicut fecerat majoribus ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Triginta duorum annorum fuit cum regnare cœpisset, et octo annis regnavit in Jerusalem. Ambulavitque non recte, et sepelierunt eum in civitate David, verumtamen non in sepulchro regum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Chronicles 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/22/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Chronicles 22</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->21<!-- --> of <!-- -->36<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 2 Chronicles 20" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2CH/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" str ,[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#f7f4ee\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n16:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n11:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"2 Chronicles 21 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"2CH.21\",{\"bookId\":14,\"usfm\":\"2CH\",\"bookName\":\"2 Chronicles\",\"drName\":\"2 Paralipomenon\",\"chapter\":21,\"totalChapters\":36,\"dra\":[{\"verse\":1,\"text\":\"And Josaphat slept with his fathers, and was buried with them in the city of David: and Joram his son reigned in his stead.\"},{\"verse\":2,\"text\":\"And he had brethren the sons of Josaphat, Azarias, and Jahiel, and Zacharias, and Azaria, and Michael, and Saphatias, all these were the sons of Josaphat king of Juda.\"},{\"verse\":3,\"text\":\"And their father gave them great gifts of silver, and of gold, and pensions, with strong cities in Juda: but the kingdom he gave to Joram, because he was the eldest.\"},{\"verse\":4,\"text\":\"So Joram rose up over the kingdom of his father: and when he had established himself, he slew all his brethren with the sword, and some of the princes of Israel.\"},{\"verse\":5,\"text\":\"Joram was two and thirty years old when he began to reign: and he reigned eight years in Jerusalem.\"},{\"verse\":6,\"text\":\"And he walked in the ways of the kings of Israel, as the house of Achab had done: for his wife was a daughter of Achab, and he did evil in the sight of the Lord.\"},{\"verse\":7,\"text\":\"But the Lord would not destroy the house of David: because of the covenant which he had made with him: and because he had promised to give a lamp to him, and to his sons for ever.\"},{\"verse\":8,\"text\":\"In those days Edom revolted, from being subject to Juda, and made themselves a king.\"},{\"verse\":9,\"text\":\"And Joram went over with his princes, and all his cavalry with him, and rose in the night, and defeated the Edomites who had surrounded him, and all the captains of his cavalry.\"},{\"verse\":10,\"text\":\"However Edom revolted, from being under the dominion of Juda unto this day: at that time Lobna also revolted, from being under his hand. For he had forsaken the Lord the God of his fathers.\"},{\"verse\":11,\"text\":\"Moreover he built also high places in the cities of Juda, and he made the inhabitants of Jerusalem to commit fornication, and Juda to transgress.\"},{\"verse\":12,\"text\":\"And there was a letter brought him from Eliseus the prophet, in which it was written: Thus saith the Lord the God of David thy father: Because thou hast not walked in the ways of Josaphat thy father nor in the ways of Asa king of Juda,\"},{\"verse\":13,\"text\":\"But hast walked in the ways of the kings of Israel, and hast made Juda and the inhabitants of Jerusalem to commit fornication, imitating the fornication of the house of Achab, moreover also thou hast killed thy brethren, the house of thy father, better men than thyself,\"},{\"verse\":14,\"text\":\"Behold the Lord will strike thee with a great plague, with all thy people, and thy children, and thy wives, and all thy substance.\"},{\"verse\":15,\"text\":\"And thou shalt be sick of a very grievous disease of thy bowels, till thy vital parts come out by little and little every day.\"},{\"verse\":16,\"text\":\"And the Lord stirred up against Joram the spirit of the Philistines, and of the Arabians, who border on the Ethiopians.\"},{\"verse\":17,\"text\":\"And they came up into the land of Juda, and wasted it, and they carried away all the substance that was found in the king’s house, his sons also, and his wives: so that there was no son left him but Joachaz, who was the youngest.\"},{\"verse\":18,\"text\":\"And besides all this the Lord struck him with an incurable disease in his bowels.\"},{\"verse\":19,\"text\":\"And as day came after day, and time rolled on, two whole years passed: then after being wasted with a long consumption, so as to void his very bowels, his disease ended with his life. And he died of a most wretched illness, and the people did not make a funeral for him according to the manner of burning, as they had done for his ancestors.\"},{\"verse\":20,\"text\":\"He was two and thirty years old when he began his reign, and he reigned eight years in Jerusalem. And he walked not rightly, and they buried him in the city of David: but not in the sepulchres of the kings.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dormivit autem Josaphat cum patribus suis, et sepultus est cum eis in civitate David : regnavitque Joram filius ejus pro eo.\"},{\"verse\":2,\"text\":\"Qui habuit fratres filios Josaphat, Azariam, et Jahiel, et Zachariam, et Azariam, et Michaël, et Saphatiam : omnes hi filii Josaphat regis Juda.\"},{\"verse\":3,\"text\":\"Deditque eis pater suus multa munera argenti et auri, et pensitationes, cum civitatibus munitissimis in Juda : regnum autem tradidit Joram, eo quod esset primogenitus.\"},{\"verse\":4,\"text\":\"Surrexit ergo Joram super regnum patris sui : cumque se confirmasset, occidit omnes fratres suos gladio, et quosdam de principibus Israël.\"},{\"verse\":5,\"text\":\"Triginta duorum annorum erat Joram cum regnare cœpisset, et octo annis regnavit in Jerusalem.\"},{\"verse\":6,\"text\":\"Ambulavitque in viis regum Israël, sicut egerat domus Achab : filia quippe Achab erat uxor ejus : et fecit malum in conspectu Domini.\"},{\"verse\":7,\"text\":\"Noluit autem Dominus disperdere domum David propter pactum quod inierat cum eo : et quia promiserat ut daret ei lucernam, et filiis ejus omni tempore.\"},{\"verse\":8,\"text\":\"In diebus illis rebellavit Edom, ne esset subditus Judæ, et constituit sibi regem.\"},{\"verse\":9,\"text\":\"Cumque transisset Joram cum principibus suis, et cuncto equitatu qui erat secum, surrexit nocte, et percussit Edom, qui se circumdederat, et omnes duces equitatus ejus.\"},{\"verse\":10,\"text\":\"Attamen rebellavit Edom, ne esset sub ditione Juda usque ad hanc diem : eo tempore et Lobna recessit ne esset sub manu illius. Dereliquerat enim Dominum Deum patrum suorum :\"},{\"verse\":11,\"text\":\"insuper et excelsa fabricatus est in urbibus Juda, et fornicari fecit habitatores Jerusalem, et prævaricari Judam.\"},{\"verse\":12,\"text\":\"Allatæ sunt autem ei litteræ ab Elia propheta, in quibus scriptum erat : Hæc dicit Dominus Deus David patris tui : Quoniam non ambulasti in viis Josaphat patris tui, et in viis Asa regis Juda,\"},{\"verse\":13,\"text\":\"sed incessisti per iter regum Israël, et fornicari fecisti Judam et habitatores Jerusalem, imitatus fornicationem domus Achab, insuper et fratres tuos, domum patris tui, meliores te, occidisti :\"},{\"verse\":14,\"text\":\"ecce Dominus percutiet te plaga magna cum populo tuo, et filiis, et uxoribus tuis, universaque substantia tua.\"},{\"verse\":15,\"text\":\"Tu autem ægrotabis pessimo languore uteri tui, donec egrediantur vitalia tua paulatim per singulos dies.\"},{\"verse\":16,\"text\":\"Suscitavit ergo Dominus contra Joram spiritum Philisthinorum, et Arabum qui confines sunt Æthiopibus :\"},{\"verse\":17,\"text\":\"et ascenderunt in terram Juda, et vastaverunt eam, diripueruntque cunctam substantiam quæ inventa est in domo regis, insuper et filios ejus, et uxores : nec remansit ei filius, nisi Joachaz, qui minimus natu erat.\"},{\"verse\":18,\"text\":\"Et super hæc omnia percussit eum Dominus alvi languore insanabili.\"},{\"verse\":19,\"text\":\"Cumque diei succederet dies, et temporum spatia volverentur, duorum annorum expletus est circulus : et sic longa consumptus tabe, ita ut egereret etiam viscera sua, languore pariter, et vita caruit. Mortuusque est in infirmitate pessima, et non fecit ei populus secundum morem combustionis exequias, sicut fecerat majoribus ejus.\"},{\"verse\":20,\"text\":\"Triginta duorum annorum fuit cum regnare cœpisset, et octo annis regnavit in Jerusalem. Ambulavitque non recte, et sepelierunt eum in civitate David, verumtamen non in sepulchro regum.\"}],\"summary\":\"Joram’s wicked reign: his punishment and death.\",\"intro\":null,\"prev\":{\"usfm\":\"2CH\",\"chapter\":20,\"label\":\"2 Chronicles 20\"},\"next\":{\"usfm\":\"2CH\",\"chapter\":22,\"label\":\"2 Chronicles 22\"}}]]\n"])</script></body></html>
