t.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>So that no one spoke to his neighbour, but hanging down the head, leaving all things behind, they made haste to escape from the Hebrews, who, as they heard, were coming armed upon them, and fled by the ways of the fields, and the paths of the hills.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>So the children of Israel seeing them fleeing, followed after them. And they went down sounding with trumpets and shouting after them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And because the Assyrians were not united together, they went without order in their flight; but the children of Israel pursuing in one body, defeated all that they could find.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Ozias sent messengers through all the cities and countries of Israel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And every country, and every city, sent their chosen young men armed after them, and they pursued them with the edge of the sword until they came to the extremities of their confines.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the rest that were in Bethulia went into the camp of the Assyrians, and took away the spoils which the Assyrians in their flight had left behind them, and they were laden exceedingly,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But they that returned conquerors to Bethulia, brought with them all things that were theirs, so that there was no numbering of their cattle, and beasts, and all their moveables, insomuch that from the least to the greatest all were made rich by their spoils.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Joachim the high priest came from Jerusalem to Bethulia with all his ancients to see Judith.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when she was come out to him, they all blessed her with one voice, saying: Thou art the glory of Jerusalem, thou art the joy of Israel, thou art the honour of our people:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For thou hast done manfully, and thy heart has been strengthened, because thou hast loved chastity, and after thy husband hast not known any other: therefore also the hand of the Lord hath strengthened thee, and therefore thou shalt be blessed for ever.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And all the people said: So be it, so be it.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And thirty days were scarce sufficient for the people of Israel to gather up the spoils of the Assyrians.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But all those things that were proved to be the peculiar goods of Holofernes, they gave to Judith in gold, and silver, and garments and precious stones, and all household stuff, and they all were delivered to her by the people.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all the people rejoiced, with the women, and virgins, and young men, playing on instruments and harps.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cumque omnis exercitus decollatum Holofernem audisset, fugit mens et consilium ab eis, et solo tremore et metu agitati, fugæ præsidium sumunt,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ita ut nullus loqueretur cum proximo suo, sed inclinato capite, relictis omnibus, evadere festinabant Hebræos, quos armatos super se venire audiebant, fugientes per vias camporum et semitas collium.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Videntes itaque filii Israël fugientes, secuti sunt illos. Descenderuntque clangentes tubis, et ululantes post ipsos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et quoniam Assyrii non adunati, in fugam ibant præcipites : filii autem Israël uno agmine persequentes debilitabant omnes quos invenire potuissent.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Misit itaque Ozias nuntios per omnes civitates et regiones Israël.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Omnis itaque regio, omnisque urbs electam juventutem armatam misit post eos, et persecuti sunt eos in ore gladii, quousque pervenirent ad extremitatem finium suorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Reliqui autem qui erant in Bethulia, ingressi sunt castra Assyriorum, et prædam quam fugientes Assyrii reliquerant, abstulerunt, et onustati sunt valde.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Hi vero qui victores reversi sunt ad Bethuliam, omnia quæ erant illorum attulerunt secum, ita ut non esset numerus in pecoribus et jumentis et universis mobilibus eorum, ut a minimo usque ad maximum omnes divites fierent de prædationibus eorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Joacim autem summus pontifex de Jerusalem venit in Bethuliam cum universis presbyteris suis ut videret Judith.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quæ cum exisset ad illum, benedixerunt eam omnes una voce, dicentes : Tu gloria Jerusalem ; tu lætitia Israël ; tu honorificentia populi nostri :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>quia fecisti viriliter, et confortatum est cor tuum, eo quod castitatem amaveris, et post virum tuum, alterum nescieris : ideo et manus Domini confortavit te, et ideo eris benedicta in æternum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et dixit omnis populus : Fiat, fiat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Per dies autem triginta, vix collecta sunt spolia Assyriorum a populo Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Porro autem universa quæ Holofernis peculiaria fuisse probata sunt, dederunt Judith in auro, et argento, et vestibus, et gemmis, et omni supellectili : et tradita sunt omnia illi a populo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et omnes populi gaudebant cum mulieribus, et virginibus, et juvenibus, in organis et citharis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bibl dren of Israel pursuing in one body, defeated all that they could find.\"},{\"verse\":5,\"text\":\"And Ozias sent messengers through all the cities and countries of Israel.\"},{\"verse\":6,\"text\":\"And every country, and every city, sent their chosen young men armed after them, and they pursued them with the edge of the sword until they came to the extremities of their confines.\"},{\"verse\":7,\"text\":\"And the rest that were in Bethulia went into the camp of the Assyrians, and took away the spoils which the Assyrians in their flight had left behind them, and they were laden exceedingly,\"},{\"verse\":8,\"text\":\"But they that returned conquerors to Bethulia, brought with them all things that were theirs, so that there was no numbering of their cattle, and beasts, and all their moveables, insomuch that from the least to the greatest all were made rich by their spoils.\"},{\"verse\":9,\"text\":\"And Joachim the high priest came from Jerusalem to Bethulia with all his ancients to see Judith.\"},{\"verse\":10,\"text\":\"And when she was come out to him, they all blessed her with one voice, saying: Thou art the glory of Jerusalem, thou art the joy of Israel, thou art the honour of our people:\"},{\"verse\":11,\"text\":\"For thou hast done manfully, and thy heart has been strengthened, because thou hast loved chastity, and after thy husband hast not known any other: therefore also the hand of the Lord hath strengthened thee, and therefore thou shalt be blessed for ever.\"},{\"verse\":12,\"text\":\"And all the people said: So be it, so be it.\"},{\"verse\":13,\"text\":\"And thirty days were scarce sufficient for the people of Israel to gather up the spoils of the Assyrians.\"},{\"verse\":14,\"text\":\"But all those things that were proved to be the peculiar goods of Holofernes, they gave to Judith in gold, and silver, and garments and precious stones, and all household stuff, and they all were delivered to her by the people.\"},{\"verse\":15,\"text\":\"And all the people rejoiced, with the women, and virgins, and young men, playing on instruments and harps.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cumque omnis exercitus decollatum Holofernem audisset, fugit mens et consilium ab eis, et solo tremore et metu agitati, fugæ præsidium sumunt,\"},{\"verse\":2,\"text\":\"ita ut nullus loqueretur cum proximo suo, sed inclinato capite, relictis omnibus, evadere festinabant Hebræos, quos armatos super se venire audiebant, fugientes per vias camporum et semitas collium.\"},{\"verse\":3,\"text\":\"Videntes itaque filii Israël fugientes, secuti sunt illos. Descenderuntque clangentes tubis, et ululantes post ipsos.\"},{\"verse\":4,\"text\":\"Et quoniam Assyrii non adunati, in fugam ibant præcipites : filii autem Israël uno agmine persequentes debilitabant omnes quos invenire potuissent.\"},{\"verse\":5,\"text\":\"Misit itaque Ozias nuntios per omnes civitates et regiones Israël.\"},{\"verse\":6,\"text\":\"Omnis itaque regio, omnisque urbs electam juventutem armatam misit post eos, et persecuti sunt eos in ore gladii, quousque pervenirent ad extremitatem finium suorum.\"},{\"verse\":7,\"text\":\"Reliqui autem qui erant in Bethulia, ingressi sunt castra Assyriorum, et prædam quam fugientes Assyrii reliquerant, abstulerunt, et onustati sunt valde.\"},{\"verse\":8,\"text\":\"Hi vero qui victores reversi sunt ad Bethuliam, omnia quæ erant illorum attulerunt secum, ita ut non esset numerus in pecoribus et jumentis et universis mobilibus eorum, ut a minimo usque ad maximum omnes divites fierent de prædationibus eorum.\"},{\"verse\":9,\"text\":\"Joacim autem summus pontifex de Jerusalem venit in Bethuliam cum universis presbyteris suis ut videret Judith.\"},{\"verse\":10,\"text\":\"Quæ cum exisset ad illum, benedixerunt eam omnes una voce, dicentes : Tu gloria Jerusalem ; tu lætitia Israël ; tu honorificentia populi nostri :\"},{\"verse\":11,\"text\":\"quia fecisti viriliter, et confortatum est cor tuum, eo quod castitatem amaveris, et post virum tuum, alterum nescieris : ideo et manus Domini confortavit te, et ideo eris benedicta in æternum.\"},{\"verse\":12,\"text\":\"Et dixit omnis populus : Fiat, fiat.\"},{\"verse\":13,\"text\":\"Per dies autem triginta, vix collecta sunt spolia Assyriorum a populo Israël.\"},{\"verse\":14,\"text\":\"Porro autem universa quæ Holofernis peculiaria fuisse probata sunt, dederunt Judith in auro, et argento, et vestibus, et gemmis, et omni supellectili : et tradita sunt omnia illi a populo.\"},{\"verse\":15,\"text\":\"Et omnes populi gaudebant cum mulieribus, et virginibus, et juvenibus, in organis et citharis.\"}],\"summary\":\"The Assyrians flee: the Hebrews pursue after them, and are enriched by their spoils.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":14,\"label\":\"Judith 14\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":16,\"label\":\"Judith 16\"}}]]\n"])</script></body></html>
