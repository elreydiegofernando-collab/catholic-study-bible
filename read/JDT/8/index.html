1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judith<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDT/">About <!-- -->Judith</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The character of Judith: her discourse to the ancients.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now it came to pass, when Judith a widow had heard these words, who was the daughter of Merari, the son of Idox, the son of Joseph, the son of Ozias, the son of Elai, the son of Jamnor, the son of Gedeon, the son of Raphaim, the son of Achitob, the son of Melchias, the son of Enan, the son of Nathanias, the son of Salathiel, the son of Simeon, the son of Ruben:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And her husband was Manasses, who died in the time of the barley harvest:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For he was standing over them that bound sheaves in the field; and the heat came upon his head, and he died in Bethulia his own city, and was buried there with his fathers.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Judith his relict was a widow now three years and six months.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And she made herself a private chamber in the upper part of her house, in which she abode shut up with her maids.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And she wore haircloth upon her loins, and fasted all the days of her life, except the sabbaths, and new moons, and the feasts of the house of Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And she was exceedingly beautiful, and her husband left her great riches, and very many servants, and large possessions of herds of oxen, and flocks of sheep.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And she was greatly renowned among all, because she feared the Lord very much, neither was there any one that spoke an ill word of her.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>When therefore she had heard that Ozias had promised that he would deliver up the city after the fifth day, she sent to the ancients Chabri and Charmi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they came to her, and she said to them: What is this word, by which Ozias hath consented to give up the city to the Assyrians, if within five days there come no aid to us?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And who are you that tempt the Lord?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>This is not a word that may draw down mercy, but rather that may stir up wrath, and enkindle indignation.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>You have set a time for the mercy of the Lord, and you have appointed him a day, according to your pleasure.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But forasmuch as the Lord is patient, let us be penitent for this same thing, and with many tears let us beg his pardon:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For God will not threaten like man, nor be inflamed to anger like the son of man.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And therefore let us humble our souls before him, and continuing in an humble spirit, in his service:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let us ask the Lord with tears, that according to his will so he would shew his mercy to us: that as our heart is troubled by their pride, so also we may glorify in our humility.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For we have not followed the sins of our fathers, who forsook their God, and worshipped strange gods.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For which crime they were given up to their enemies, to the sword, and to pillage, and to confusion: but we know no other God but him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Let us humbly wait for his consolation, and the Lord our God will require our blood of the afflictions of our enemies, and he will humble all the nations that shall rise up against us, and bring them to disgrace.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And now, brethren, as you are the ancients among the people of God, and their very soul resteth upon you: comfort their hearts by your speech, that they may be mindful how our fathers were tempted that they might be proved, whether they worshipped their God truly.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>They must remember how our father Abraham was tempted, and being proved by many tribulations, was made the friend of God.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>So Isaac, so Jacob, so Moses, and all that have pleased God, passed through many tribulations, remaining faithful.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But they that did not receive the trials with the fear of the Lord, but uttered their impatience and the reproach of their murmuring against the Lord,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Were destroyed by the destroyer, and perished by serpents.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>As for us therefore let us not revenge ourselves for these things which we suffer.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But esteeming these very punishments to be less than our sins deserve, let us believe that these scourges of the Lord, with which like servants we are chastised, have happened for our amendment, and not for our destruction.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Ozias and the ancients said to her: All things which thou hast spoken are true, and there is nothing to be reprehended in thy words.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Now therefore pray for us, for thou art a holy woman, and one fearing God.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Judith said to them: As you know that what I have been able to say is of God:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>So that which I intend to do prove ye if it be of God, and pray that God may strengthen my design.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>You shall stand at the gate this night, and I will go out with my maidservant: and pray ye, that as you have said, in five days the Lord may look down upon his people Israel.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But I desire that you search not into what I am doing, and till I bring you word let nothing else be done but to pray for me to the Lord our God.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And Ozias the prince of Juda said to her: Go in peace, and the Lord be with thee to take revenge of our enemies. So returning they departed.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est cum audisset hæc verba Judith vidua, quæ erat filia Merari filii Idox filii Joseph filii Oziæ filii Elai filii Jamnor filii Gedeon filii Raphaim filii Achitob filii Melchiæ filii Enan filii Nathaniæ filii Salathiel filii Simeon filii Ruben,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et vir ejus fuit Manasses, qui mortuus est in diebus messis hordeaceæ :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>instabat enim super alligantes manipulos in campo, et venit æstus super caput ejus, et mortuus est in Bethulia civitate sua, et sepultus est illic cum patribus suis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Erat autem Judith relicta ejus vidua jam annis tribus et mensibus sex.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et in superioribus domus suæ fecit sibi secretum cubiculum, in quo cum puellis suis clausa morabatur,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et habens super lumbos suos cilicium, jejunabat omnibus diebus vitæ suæ, præter sabbata et neomenias et festa domus Israël.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Erat autem eleganti aspectu nimis, cui vir suus reliquerat divitias multas, et familiam copiosam, ac possessiones armentis boum, et gregibus ovium plenas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et erat hæc in omnibus famosissima, quoniam timebat Dominum valde, nec erat qui loqueretur de illa verbum malum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæc itaque cum audisset quoniam Ozias promisisset quod transacto quinto die traderet civitatem, misit ad presbyteros Chabri et Charmi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et venerunt ad illam, et dixit illis : Quod est hoc verbum, in quo consensit Ozias, ut tradat civitatem Assyriis si intra quinque dies non venerit vobis adjutorium ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et qui estis vos, qui tentatis Dominum ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>non est iste sermo qui misericordiam provocet, sed potius qui iram excitet, et furorem accendat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Posuistis vos tempus miserationis Domini, et in arbitrium vestrum, diem constituistis ei.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sed quia patiens Dominus est, in hoc ipso pœniteamus, et indulgentiam ejus fusis lacrimis postulemus :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>non enim quasi homo sic Deus comminabitur, neque sicut filius hominis ad iracundiam inflammabitur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et ideo humiliemus illi animas nostras, et in spiritu constituti humiliato, servientes illi</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>dicamus flentes Domino, ut secundum voluntatem suam sic faciat nobiscum misericordiam suam : ut sicut conturbatum est cor nostrum in superbia eorum, ita etiam de nostra humilitate gloriemur :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quoniam non sumus secuti peccata patrum nostrorum, qui dereliquerunt Deum suum, et adoraverunt deos alienos,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>pro quo scelere dati sunt in gladium, et in rapinam, et in confusionem inimicis suis : nos autem alterum deum nescimus præter ipsum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Expectemus humiles consolationem ejus, et exquiret sanguinem nostrum de afflictionibus inimicorum nostrorum, et humiliabit omnes gentes, quæcumque insurgunt contra nos, et faciet illas sine honore Dominus Deus noster.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et nunc fratres, quoniam vos estis presbyteri in populo Dei, et ex vobis pendet anima illorum, ad eloquium vestrum corda eorum erigite, ut memores sint quia tentati sunt patres nostri, ut probarentur si vere colerent Deum suum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Memores esse debent quomodo pater noster Abraham tentatus est, et per multas tribulationes probatus, Dei amicus effectus est.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sic Isaac, sic Jacob, sic Moyses, et omnes qui placuerunt Deo, per multas tribulationes transierunt fideles.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Illi autem qui tentationes non susceperunt cum timore Domini, et impatientiam suam et improperium murmurationis suæ contra Dominum protulerunt,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>exterminati sunt ab exterminatore, et a serpentibus perierunt.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et nos ergo non ulciscamur nos pro his quæ patimur,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>sed reputantes peccatis nostris hæc ipsa supplicia minora esse flagella Domini, quibus quasi servi corripimur ad emendationem, et non ad perditionem nostram evenisse credamus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et dixerunt illi Ozias et presbyteri : Omnia quæ locuta es, vera sunt, et non est in sermonibus tuis ulla reprehensio.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Nunc ergo ora pro nobis, quoniam mulier sancta es, et timens Deum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et dixit illis Judith : Sicut quod potui loqui, Dei esse cognoscitis,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>ita quod facere disposui, probate si ex Deo est, et orate ut firmum faciat Deus consilium meum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Stabitis vos ad portam nocte ista, et ego exeam cum abra mea : et orate, ut sicut dixistis, in diebus quinque respiciat Dominus populum suum Israël.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Vos autem nolo ut scrutemini actum meum, et usque dum renuntiem vobis, nihil aliud fiat, nisi oratio pro me ad Dominum Deum nostrum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et dixit ad eam Ozias princeps Juda : Vade in pace, et Dominus sit tecum in ultionem inimicorum nostrorum. Et revertentes abierunt.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded- ied in the time of the barley harvest:\"},{\"verse\":3,\"text\":\"For he was standing over them that bound sheaves in the field; and the heat came upon his head, and he died in Bethulia his own city, and was buried there with his fathers.\"},{\"verse\":4,\"text\":\"And Judith his relict was a widow now three years and six months.\"},{\"verse\":5,\"text\":\"And she made herself a private chamber in the upper part of her house, in which she abode shut up with her maids.\"},{\"verse\":6,\"text\":\"And she wore haircloth upon her loins, and fasted all the days of her life, except the sabbaths, and new moons, and the feasts of the house of Israel.\"},{\"verse\":7,\"text\":\"And she was exceedingly beautiful, and her husband left her great riches, and very many servants, and large possessions of herds of oxen, and flocks of sheep.\"},{\"verse\":8,\"text\":\"And she was greatly renowned among all, because she feared the Lord very much, neither was there any one that spoke an ill word of her.\"},{\"verse\":9,\"text\":\"When therefore she had heard that Ozias had promised that he would deliver up the city after the fifth day, she sent to the ancients Chabri and Charmi.\"},{\"verse\":10,\"text\":\"And they came to her, and she said to them: What is this word, by which Ozias hath consented to give up the city to the Assyrians, if within five days there come no aid to us?\"},{\"verse\":11,\"text\":\"And who are you that tempt the Lord?\"},{\"verse\":12,\"text\":\"This is not a word that may draw down mercy, but rather that may stir up wrath, and enkindle indignation.\"},{\"verse\":13,\"text\":\"You have set a time for the mercy of the Lord, and you have appointed him a day, according to your pleasure.\"},{\"verse\":14,\"text\":\"But forasmuch as the Lord is patient, let us be penitent for this same thing, and with many tears let us beg his pardon:\"},{\"verse\":15,\"text\":\"For God will not threaten like man, nor be inflamed to anger like the son of man.\"},{\"verse\":16,\"text\":\"And therefore let us humble our souls before him, and continuing in an humble spirit, in his service:\"},{\"verse\":17,\"text\":\"Let us ask the Lord with tears, that according to his will so he would shew his mercy to us: that as our heart is troubled by their pride, so also we may glorify in our humility.\"},{\"verse\":18,\"text\":\"For we have not followed the sins of our fathers, who forsook their God, and worshipped strange gods.\"},{\"verse\":19,\"text\":\"For which crime they were given up to their enemies, to the sword, and to pillage, and to confusion: but we know no other God but him.\"},{\"verse\":20,\"text\":\"Let us humbly wait for his consolation, and the Lord our God will require our blood of the afflictions of our enemies, and he will humble all the nations that shall rise up against us, and bring them to disgrace.\"},{\"verse\":21,\"text\":\"And now, brethren, as you are the ancients among the people of God, and their very soul resteth upon you: comfort their hearts by your speech, that they may be mindful how our fathers were tempted that they might be proved, whether they worshipped their God truly.\"},{\"verse\":22,\"text\":\"They must remember how our father Abraham was tempted, and being proved by many tribulations, was made the friend of God.\"},{\"verse\":23,\"text\":\"So Isaac, so Jacob, so Moses, and all that have pleased God, passed through many tribulations, remaining faithful.\"},{\"verse\":24,\"text\":\"But they that did not receive the trials with the fear of the Lord, but uttered their impatience and the reproach of their murmuring against the Lord,\"},{\"verse\":25,\"text\":\"Were destroyed by the destroyer, and perished by serpents.\"},{\"verse\":26,\"text\":\"As for us therefore let us not revenge ourselves for these things which we suffer.\"},{\"verse\":27,\"text\":\"But esteeming these very punishments to be less than our sins deserve, let us believe that these scourges of the Lord, with which like servants we are chastised, have happened for our amendment, and not for our destruction.\"},{\"verse\":28,\"text\":\"And Ozias and the ancients said to her: All things which thou hast spoken are true, and there is nothing to be reprehended in thy words.\"},{\"verse\":29,\"text\":\"Now therefore pray for us, for thou art a holy woman, and one fearing God.\"},{\"verse\":30,\"text\":\"And Judith said to them: As you know that what I have been able to say is of God:\"},{\"verse\":31,\"text\":\"So that which I intend to do prove ye if it be of God, and pray that God may strengthen my design.\"},{\"verse\":32,\"text\":\"You shall stand at the gate this night, and I will go out with my maidservant: and pray ye, that as you have said, in five days the Lord may look down upon his people Israel.\"},{\"verse\":33,\"text\":\"But I desire that you search not into what I am doing, and till I bring you word let nothing else be done but to pray for me to the Lord our God.\"},{\"verse\":34,\"text\":\"And Ozias the prince of Juda said to her: Go in peace, and the Lord be with thee to take revenge of our enemies. So returning they departed.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est cum audisset hæc verba Judith vidua, quæ erat filia Merari filii Idox filii Joseph filii Oziæ filii Elai filii Jamnor filii Gedeon filii Raphaim filii Achitob filii Melchiæ filii Enan filii Nathaniæ filii Salathiel filii Simeon filii Ruben,\"},{\"verse\":2,\"text\":\"et vir ejus fuit Manasses, qui mortuus est in diebus messis hordeaceæ :\"},{\"verse\":3,\"text\":\"instabat enim super alligantes manipulos in campo, et venit æstus super caput ejus, et mortuus est in Bethulia civitate sua, et sepultus est illic cum patribus suis.\"},{\"verse\":4,\"text\":\"Erat autem Judith relicta ejus vidua jam annis tribus et mensibus sex.\"},{\"verse\":5,\"text\":\"Et in superioribus domus suæ fecit sibi secretum cubiculum, in quo cum puellis suis clausa morabatur,\"},{\"verse\":6,\"text\":\"et habens super lumbos suos cilicium, jejunabat omnibus diebus vitæ suæ, præter sabbata et neomenias et festa domus Israël.\"},{\"verse\":7,\"text\":\"Erat autem eleganti aspectu nimis, cui vir suus reliquerat divitias multas, et familiam copiosam, ac possessiones armentis boum, et gregibus ovium plenas.\"},{\"verse\":8,\"text\":\"Et erat hæc in omnibus famosissima, quoniam timebat Dominum valde, nec erat qui loqueretur de illa verbum malum.\"},{\"verse\":9,\"text\":\"Hæc itaque cum audisset quoniam Ozias promisisset quod transacto quinto die traderet civitatem, misit ad presbyteros Chabri et Charmi.\"},{\"verse\":10,\"text\":\"Et venerunt ad illam, et dixit illis : Quod est hoc verbum, in quo consensit Ozias, ut tradat civitatem Assyriis si intra quinque dies non venerit vobis adjutorium ?\"},{\"verse\":11,\"text\":\"et qui estis vos, qui tentatis Dominum ?\"},{\"verse\":12,\"text\":\"non est iste sermo qui misericordiam provocet, sed potius qui iram excitet, et furorem accendat.\"},{\"verse\":13,\"text\":\"Posuistis vos tempus miserationis Domini, et in arbitrium vestrum, diem constituistis ei.\"},{\"verse\":14,\"text\":\"Sed quia patiens Dominus est, in hoc ipso pœniteamus, et indulgentiam ejus fusis lacrimis postulemus :\"},{\"verse\":15,\"text\":\"non enim quasi homo sic Deus comminabitur, neque sicut filius hominis ad iracundiam inflammabitur.\"},{\"verse\":16,\"text\":\"Et ideo humiliemus illi animas nostras, et in spiritu constituti humiliato, servientes illi\"},{\"verse\":17,\"text\":\"dicamus flentes Domino, ut secundum voluntatem suam sic faciat nobiscum misericordiam suam : ut sicut conturbatum est cor nostrum in superbia eorum, ita etiam de nostra humilitate gloriemur :\"},{\"verse\":18,\"text\":\"quoniam non sumus secuti peccata patrum nostrorum, qui dereliquerunt Deum suum, et adoraverunt deos alienos,\"},{\"verse\":19,\"text\":\"pro quo scelere dati sunt in gladium, et in rapinam, et in confusionem inimicis suis : nos autem alterum deum nescimus præter ipsum.\"},{\"verse\":20,\"text\":\"Expectemus humiles consolationem ejus, et exquiret sanguinem nostrum de afflictionibus inimicorum nostrorum, et humiliabit omnes gentes, quæcumque insurgunt contra nos, et faciet illas sine honore Dominus Deus noster.\"},{\"verse\":21,\"text\":\"Et nunc fratres, quoniam vos estis presbyteri in populo Dei, et ex vobis pendet anima illorum, ad eloquium vestrum corda eorum erigite, ut memores sint quia tentati sunt patres nostri, ut probarentur si vere colerent Deum suum.\"},{\"verse\":22,\"text\":\"Memores esse debent quomodo pater noster Abraham tentatus est, et per multas tribulationes probatus, Dei amicus effectus est.\"},{\"verse\":23,\"text\":\"Sic Isaac, sic Jacob, sic Moyses, et omnes qui placuerunt Deo, per multas tribulationes transierunt fideles.\"},{\"verse\":24,\"text\":\"Illi autem qui tentationes non susceperunt cum timore Domini, et impatientiam suam et improperium murmurationis suæ contra Dominum protulerunt,\"},{\"verse\":25,\"text\":\"exterminati sunt ab exterminatore, et a serpentibus perierunt.\"},{\"verse\":26,\"text\":\"Et nos ergo non ulciscamur nos pro his quæ patimur,\"},{\"verse\":27,\"text\":\"sed reputantes peccatis nostris hæc ipsa supplicia minora esse flagella Domini, quibus quasi servi corripimur ad emendationem, et non ad perditionem nostram evenisse credamus.\"},{\"verse\":28,\"text\":\"Et dixerunt illi Ozias et presbyteri : Omnia quæ locuta es, vera sunt, et non est in sermonibus tuis ulla reprehensio.\"},{\"verse\":29,\"text\":\"Nunc ergo ora pro nobis, quoniam mulier sancta es, et timens Deum.\"},{\"verse\":30,\"text\":\"Et dixit illis Judith : Sicut quod potui loqui, Dei esse cognoscitis,\"},{\"verse\":31,\"text\":\"ita quod facere disposui, probate si ex Deo est, et orate ut firmum faciat Deus consilium meum.\"},{\"verse\":32,\"text\":\"Stabitis vos ad portam nocte ista, et ego exeam cum abra mea : et orate, ut sicut dixistis, in diebus quinque respiciat Dominus populum suum Israël.\"},{\"verse\":33,\"text\":\"Vos autem nolo ut scrutemini actum meum, et usque dum renuntiem vobis, nihil aliud fiat, nisi oratio pro me ad Dominum Deum nostrum.\"},{\"verse\":34,\"text\":\"Et dixit ad eam Ozias princeps Juda : Vade in pace, et Dominus sit tecum in ultionem inimicorum nostrorum. Et revertentes abierunt.\"}],\"summary\":\"The character of Judith: her discourse to the ancients.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":7,\"label\":\"Judith 7\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":9,\"label\":\"Judith 9\"}}]]\n"])</script></body></html>
