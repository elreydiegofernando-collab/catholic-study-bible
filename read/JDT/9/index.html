1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when they were gone, Judith went into her oratory: and putting on haircloth, laid ashes on her head: and falling down prostrate before the Lord, she cried to the Lord, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Lord God of my father Simeon, who gavest him a sword to execute vengeance against strangers, who had defiled by their uncleanness, and uncovered the virgin unto confusion:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And who gavest their wives to be made a prey, and their daughters into captivity: and all their spoils to be divided to the servants, who were zealous with thy zeal: assist, I beseech thee, O Lord God, me a widow.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thou hast done the things of old, and hast devised one thing after another: and what thou hast designed hath been done.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For all thy ways are prepared, and in thy providence thou hast placed thy judgments.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Look upon the camp of the Assyrians now, as thou wast pleased to look upon the camp of the Egyptians, when they pursued armed after thy servants, trusting in their chariots, and in their horsemen, and in a multitude of warriors.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But thou lookedst over their camp, and darkness wearied them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The deep held their feet, and the waters overwhelmed them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>So may it be with these also, O Lord, who trust in their multitude, and in their chariots, and in their pikes, and in their shields, and in their arrows, and glory in their spears,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And know not that thou art our God, who destroyest wars from the beginning, and the Lord is thy name.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Lift up thy arm as from the beginning, and crush their power with thy power: let their power fall in their wrath, who promise themselves to violate thy sanctuary, and defile the dwelling place of thy name, and to beat down with their sword the horn of thy altar.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Bring to pass, O Lord, that his pride may be cut off with his own sword.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let him be caught in the net of his own eyes in my regard, and do thou strike him by the graces of the words of my lips.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Give me constancy in my mind, that I may despise him: and fortitude that I may overthrow him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For this will be a glorious monument for thy name, when he shall fall by the hand of a woman.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For thy power, O Lord, is not in a multitude, nor is thy pleasure in the strength of horses, nor from the beginning have the proud been acceptable to thee: but the prayer of the humble and the meek hath always pleased thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>O God of the heavens, creator of the waters, and Lord of the whole creation, hear me a poor wretch, making supplication to thee, and presuming of thy mercy.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Remember, O Lord, thy covenant, and put thou words in my mouth, and strengthen the resolution in my heart, that thy house may continue in thy holiness:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And all nations may acknowledge that thou art God, and there is no other besides thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quibus ascendentibus, Judith ingressa est oratorium suum : et induens se cilicio, posuit cinerem super caput suum : et prosternens se Domino, clamabat ad Dominum, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine Deus patris mei Simeon, qui dedisti illi gladium in defensionem alienigenarum, qui violatores extiterunt in coinquinatione sua, et denudaverunt femur virginis in confusionem :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dedisti mulieres illorum in prædam, et filias illorum in captivitatem : et omnem prædam in divisionem servis tuis, qui zelaverunt zelum tuum : subveni, quæso te, Domine Deus meus, mihi viduæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tu enim fecisti priora, et illa post illa cogitasti : et hoc factum est quod ipse voluisti.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Omnes enim viæ tuæ paratæ sunt, et tua judicia in tua providentia posuisti.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Respice castra Assyriorum nunc, sicut tunc castra Ægyptiorum videre dignatus es, quando post servos tuos armati currebant, confidentes in quadrigis, et in equitatu suo, et in multitudine bellatorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sed aspexisti super castra eorum, et tenebræ fatigaverunt eos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tenuit pedes eorum abyssus, et aquæ operuerunt eos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sic fiant et isti, Domine, qui confidunt in multitudine sua, et in curribus suis, et in contis, et in scutis, et in sagittis suis, et in lanceis gloriantur,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et nesciunt quia tu ipse es Deus noster, qui conteris bella ab initio, et Dominus nomen est tibi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Erige brachium tuum sicut ab initio, et allide virtutem illorum in virtute tua : cadat virtus eorum in iracundia tua, qui promittunt se violare sancta tua, et polluere tabernaculum nominis tui, et dejicere gladio suo cornu altaris tui.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fac, Domine, ut gladio proprio ejus superbia amputetur :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>capiatur laqueo oculorum suorum in me, et percuties eum ex labiis caritatis meæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Da mihi in animo constantiam ut contemnam illum, et virtutem, ut evertam illum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Erit enim hoc memoriale nominis tui, cum manus feminæ dejecerit eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non enim in multitudine est virtus tua, Domine, neque in equorum viribus voluntas tua est, nec superbi ab initio placuerunt tibi : sed humilium et mansuetorum semper tibi placuit deprecatio.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Deus cælorum, creator aquarum, et Dominus totius creaturæ, exaudi me miseram deprecantem, et de tua misericordia præsumentem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Memento, Domine, testamenti tui, et da verbum in ore meo, et in corde meo consilium corrobora, ut domus tua in sanctificatione tua permaneat :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et omnes gentes agnoscant quia tu es Deus, et non est alius præter te.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->16<!-- - r thy servants, trusting in their chariots, and in their horsemen, and in a multitude of warriors.\"},{\"verse\":7,\"text\":\"But thou lookedst over their camp, and darkness wearied them.\"},{\"verse\":8,\"text\":\"The deep held their feet, and the waters overwhelmed them.\"},{\"verse\":9,\"text\":\"So may it be with these also, O Lord, who trust in their multitude, and in their chariots, and in their pikes, and in their shields, and in their arrows, and glory in their spears,\"},{\"verse\":10,\"text\":\"And know not that thou art our God, who destroyest wars from the beginning, and the Lord is thy name.\"},{\"verse\":11,\"text\":\"Lift up thy arm as from the beginning, and crush their power with thy power: let their power fall in their wrath, who promise themselves to violate thy sanctuary, and defile the dwelling place of thy name, and to beat down with their sword the horn of thy altar.\"},{\"verse\":12,\"text\":\"Bring to pass, O Lord, that his pride may be cut off with his own sword.\"},{\"verse\":13,\"text\":\"Let him be caught in the net of his own eyes in my regard, and do thou strike him by the graces of the words of my lips.\"},{\"verse\":14,\"text\":\"Give me constancy in my mind, that I may despise him: and fortitude that I may overthrow him.\"},{\"verse\":15,\"text\":\"For this will be a glorious monument for thy name, when he shall fall by the hand of a woman.\"},{\"verse\":16,\"text\":\"For thy power, O Lord, is not in a multitude, nor is thy pleasure in the strength of horses, nor from the beginning have the proud been acceptable to thee: but the prayer of the humble and the meek hath always pleased thee.\"},{\"verse\":17,\"text\":\"O God of the heavens, creator of the waters, and Lord of the whole creation, hear me a poor wretch, making supplication to thee, and presuming of thy mercy.\"},{\"verse\":18,\"text\":\"Remember, O Lord, thy covenant, and put thou words in my mouth, and strengthen the resolution in my heart, that thy house may continue in thy holiness:\"},{\"verse\":19,\"text\":\"And all nations may acknowledge that thou art God, and there is no other besides thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quibus ascendentibus, Judith ingressa est oratorium suum : et induens se cilicio, posuit cinerem super caput suum : et prosternens se Domino, clamabat ad Dominum, dicens :\"},{\"verse\":2,\"text\":\"Domine Deus patris mei Simeon, qui dedisti illi gladium in defensionem alienigenarum, qui violatores extiterunt in coinquinatione sua, et denudaverunt femur virginis in confusionem :\"},{\"verse\":3,\"text\":\"et dedisti mulieres illorum in prædam, et filias illorum in captivitatem : et omnem prædam in divisionem servis tuis, qui zelaverunt zelum tuum : subveni, quæso te, Domine Deus meus, mihi viduæ.\"},{\"verse\":4,\"text\":\"Tu enim fecisti priora, et illa post illa cogitasti : et hoc factum est quod ipse voluisti.\"},{\"verse\":5,\"text\":\"Omnes enim viæ tuæ paratæ sunt, et tua judicia in tua providentia posuisti.\"},{\"verse\":6,\"text\":\"Respice castra Assyriorum nunc, sicut tunc castra Ægyptiorum videre dignatus es, quando post servos tuos armati currebant, confidentes in quadrigis, et in equitatu suo, et in multitudine bellatorum.\"},{\"verse\":7,\"text\":\"Sed aspexisti super castra eorum, et tenebræ fatigaverunt eos.\"},{\"verse\":8,\"text\":\"Tenuit pedes eorum abyssus, et aquæ operuerunt eos.\"},{\"verse\":9,\"text\":\"Sic fiant et isti, Domine, qui confidunt in multitudine sua, et in curribus suis, et in contis, et in scutis, et in sagittis suis, et in lanceis gloriantur,\"},{\"verse\":10,\"text\":\"et nesciunt quia tu ipse es Deus noster, qui conteris bella ab initio, et Dominus nomen est tibi.\"},{\"verse\":11,\"text\":\"Erige brachium tuum sicut ab initio, et allide virtutem illorum in virtute tua : cadat virtus eorum in iracundia tua, qui promittunt se violare sancta tua, et polluere tabernaculum nominis tui, et dejicere gladio suo cornu altaris tui.\"},{\"verse\":12,\"text\":\"Fac, Domine, ut gladio proprio ejus superbia amputetur :\"},{\"verse\":13,\"text\":\"capiatur laqueo oculorum suorum in me, et percuties eum ex labiis caritatis meæ.\"},{\"verse\":14,\"text\":\"Da mihi in animo constantiam ut contemnam illum, et virtutem, ut evertam illum.\"},{\"verse\":15,\"text\":\"Erit enim hoc memoriale nominis tui, cum manus feminæ dejecerit eum.\"},{\"verse\":16,\"text\":\"Non enim in multitudine est virtus tua, Domine, neque in equorum viribus voluntas tua est, nec superbi ab initio placuerunt tibi : sed humilium et mansuetorum semper tibi placuit deprecatio.\"},{\"verse\":17,\"text\":\"Deus cælorum, creator aquarum, et Dominus totius creaturæ, exaudi me miseram deprecantem, et de tua misericordia præsumentem.\"},{\"verse\":18,\"text\":\"Memento, Domine, testamenti tui, et da verbum in ore meo, et in corde meo consilium corrobora, ut domus tua in sanctificatione tua permaneat :\"},{\"verse\":19,\"text\":\"et omnes gentes agnoscant quia tu es Deus, et non est alius præter te.\"}],\"summary\":\"Judith’s prayer, to beg of God to fortify her in her undertaking.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":8,\"label\":\"Judith 8\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":10,\"label\":\"Judith 10\"}}]]\n"])</script></body></html>
