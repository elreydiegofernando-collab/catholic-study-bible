only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass when they had left off speaking, that Holofernes being in a violent passion, said to Achior:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Because thou hast prophesied unto us, saying: That the nation of Israel is defended by their God, to shew thee that there is no God, but Nabuchodonosor:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>When we shall slay them all as one man, then thou also shalt die with them by the sword of the Assyrians, and all Israel shall perish with thee:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou shalt find that Nabuchodonosor is lord of the whole earth: and then the sword of my soldiers shall pass through thy sides, and thou shalt be stabbed and fall among the wounded of Israel, and thou shalt breathe no more till thou be destroyed with them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But if thou think thy prophecy true, let not thy countenance sink, and let the paleness that is in thy face, depart from thee, if thou imaginest these my words cannot be accomplished.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And that thou mayst know that thou shalt experience these things together with them, behold from this hour thou shalt be associated to their people, that when they shall receive the punishment they deserve from my sword, thou mayst fall under the same vengeance.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then Holofernes commanded his servants to take Achior, and to lead him to Bethulia, and to deliver him into the hands of the children of Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the servants of Holofernes taking him, went through the plains: but when they came near the mountains, the slingers came out against them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then turning out of the way by the side of the mountain, they tied Achior to a tree hand and foot, and so left him bound with ropes, and returned to their master.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the children of Israel coming down from Bethulia, came to him, and loosing him they brought him to Bethulia, and setting him in the midst of the people, asked him what was the matter that the Assyrians had left him bound.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In those days the rulers there, were Ozias the son of Micha of the tribe of Simeon, and Charmi, called also Gothoniel.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Achior related in the midst of the ancients, and in the presence of all the people, all that he had said being asked by Holofernes: and how the people of Holofernes would have killed him for this word,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And how Holofernes himself being angry had commanded him to be delivered for this cause to the Israelites: that when he should overcome the children of Israel, then he might command Achior also himself to be put to death by diverse torments, for having said: The God of heaven is their defender.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when Achior had declared all these things, all the people fell upon their faces, adoring the Lord, and all of them together mourning and weeping poured out their prayers with one accord to the Lord,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Saying: O Lord God of heaven and earth, behold their pride, and look on our low condition, and have regard to the face of thy saints, and shew that thou forsakest not them that trust on thee, and that thou humblest them that presume of themselves, and glory in their own strength.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So when their weeping was ended, and the people’s prayer, in which they continued all the day, was concluded, they comforted Achior,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Saying: The God of our fathers, whose power thou hast set forth, will make this return to thee, that thou rather shalt see their destruction.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when the Lord our God shall give this liberty to his servants, let God be with thee also in the midst of us: that as it shall please thee, so thou with all thine mayst converse with us.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Then Ozias, after the assembly was broken up, received him into his house, and made him a great supper.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And all the ancients were invited, and they refreshed themselves together after their fast was over.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And afterwards all the people were called together, and they prayed all the night long within the church, desiring help of the God of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem cum cessassent loqui, indignatus Holofernes vehementer, dixit ad Achior :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quoniam prophetasti nobis, dicens quod gens Israël defendatur a Deo suo, ut ostendam tibi quoniam non est deus nisi Nabuchodonosor,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>cum percusserimus eos omnes, sicut hominem unum, tunc et ipse cum illis Assyriorum gladio interibis, et omnis Israël tecum perditione disperiet :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et probabis quoniam Nabuchodonosor dominus sit universæ terræ : tuncque gladius militiæ meæ transiet per latera tua, et confixus cades inter vulneratos Israël, et non respirabis ultra, donec extermineris cum illis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Porro autem si prophetiam tuam veram existimas, non concidat vultus tuus : et pallor qui faciem tuam obtinet abscedat a te, si verba mea hæc putas impleri non posse.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ut autem noveris quia simul cum illis hæc experieris, ecce ex hac hora illorum populo sociaberis, ut, dum dignas mei gladii pœnas exceperint, ipse simul ultioni subjaceas.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tunc Holofernes præcepit servis suis ut comprehenderent Achior, et perducerent eum in Bethuliam, et traderent eum in manus filiorum Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et accipientes eum servi Holofernis, profecti sunt per campestria : sed cum appropinquassent ad montana, exierunt contra eos fundibularii.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Illi autem divertentes a latere montis, ligaverunt Achior ad arborem manibus et pedibus, et sic vinctum restibus dimiserunt eum, et reversi sunt ad dominum suum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Porro filii Israël descendentes de Bethulia, venerunt ad eum : quem solventes, duxerunt ad Bethuliam, atque in medium populi illum statuentes, percunctati sunt quid rerum esset quod illum vinctum Assyrii reliquissent.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In diebus illis erant illic principes Ozias filius Micha de tribu Simeon, et Charmi, qui et Gothoniel.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In medio itaque seniorum, et in conspectu omnium, Achior dixit omnia quæ locutus ipse fuerat ab Holoferne interrogatus : et qualiter populus Holofernis voluisset propter hoc verbum interficere eum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et quemadmodum ipse Holofernes iratus jusserit eum Israëlitis hac de causa tradi, ut dum vicerit filios Israël, tunc et ipsum Achior diversis jubeat interire suppliciis, propter hoc quod dixisset : Deus cæli defensor eorum est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cumque Achior universa hæc exposuisset, omnis populus cecidit in faciem, adorantes Dominum, et communi lamentatione et fletu unanimes preces suas Domino effuderunt,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>dicentes : Domine Deus cæli et terræ, intuere superbiam eorum, et respice ad nostram humilitatem, et faciem sanctorum tuorum attende, et ostende quoniam non derelinquis præsumentes de te : et præsumentes de se, et de sua virtute gloriantes, humilias.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Finito itaque fletu, et per totam diem oratione populorum completa, consolati sunt Achior,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>dicentes : Deus patrum nostrorum, cujus tu virtutem prædicasti, ipse tibi hanc dabit vicissitudinem, ut eorum magis tu interitum videas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cum vero Dominus Deus noster dederit hanc libertatem servis suis, sit et tecum Deus in medio nostri : ut sicut placuerit tibi, ita cum tuis omnibus converseris nobiscum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Tunc Ozias, finito consilio, suscepit eum in domum suam, et fecit ei cœnam magnam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et vocatis omnibus presbyteris, simul expleto jejunio refecerunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Postea vero convocatus est omnis populus, et per totam noctem intra ecclesiam oraverunt, petentes auxilium a Deo Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 7</span></span><svg viewBox="0 0 "4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDT.6\",{\"bookId\":18,\"usfm\":\"JDT\",\"bookName\":\"Judith\",\"drName\":\"Judith\",\"chapter\":6,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass when they had left off speaking, that Holofernes being in a violent passion, said to Achior:\"},{\"verse\":2,\"text\":\"Because thou hast prophesied unto us, saying: That the nation of Israel is defended by their God, to shew thee that there is no God, but Nabuchodonosor:\"},{\"verse\":3,\"text\":\"When we shall slay them all as one man, then thou also shalt die with them by the sword of the Assyrians, and all Israel shall perish with thee:\"},{\"verse\":4,\"text\":\"And thou shalt find that Nabuchodonosor is lord of the whole earth: and then the sword of my soldiers shall pass through thy sides, and thou shalt be stabbed and fall among the wounded of Israel, and thou shalt breathe no more till thou be destroyed with them.\"},{\"verse\":5,\"text\":\"But if thou think thy prophecy true, let not thy countenance sink, and let the paleness that is in thy face, depart from thee, if thou imaginest these my words cannot be accomplished.\"},{\"verse\":6,\"text\":\"And that thou mayst know that thou shalt experience these things together with them, behold from this hour thou shalt be associated to their people, that when they shall receive the punishment they deserve from my sword, thou mayst fall under the same vengeance.\"},{\"verse\":7,\"text\":\"Then Holofernes commanded his servants to take Achior, and to lead him to Bethulia, and to deliver him into the hands of the children of Israel.\"},{\"verse\":8,\"text\":\"And the servants of Holofernes taking him, went through the plains: but when they came near the mountains, the slingers came out against them.\"},{\"verse\":9,\"text\":\"Then turning out of the way by the side of the mountain, they tied Achior to a tree hand and foot, and so left him bound with ropes, and returned to their master.\"},{\"verse\":10,\"text\":\"And the children of Israel coming down from Bethulia, came to him, and loosing him they brought him to Bethulia, and setting him in the midst of the people, asked him what was the matter that the Assyrians had left him bound.\"},{\"verse\":11,\"text\":\"In those days the rulers there, were Ozias the son of Micha of the tribe of Simeon, and Charmi, called also Gothoniel.\"},{\"verse\":12,\"text\":\"And Achior related in the midst of the ancients, and in the presence of all the people, all that he had said being asked by Holofernes: and how the people of Holofernes would have killed him for this word,\"},{\"verse\":13,\"text\":\"And how Holofernes himself being angry had commanded him to be delivered for this cause to the Israelites: that when he should overcome the children of Israel, then he might command Achior also himself to be put to death by diverse torments, for having said: The God of heaven is their defender.\"},{\"verse\":14,\"text\":\"And when Achior had declared all these things, all the people fell upon their faces, adoring the Lord, and all of them together mourning and weeping poured out their prayers with one accord to the Lord,\"},{\"verse\":15,\"text\":\"Saying: O Lord God of heaven and earth, behold their pride, and look on our low condition, and have regard to the face of thy saints, and shew that thou forsakest not them that trust on thee, and that thou humblest them that presume of themselves, and glory in their own strength.\"},{\"verse\":16,\"text\":\"So when their weeping was ended, and the people’s prayer, in which they continued all the day, was concluded, they comforted Achior,\"},{\"verse\":17,\"text\":\"Saying: The God of our fathers, whose power thou hast set forth, will make this return to thee, that thou rather shalt see their destruction.\"},{\"verse\":18,\"text\":\"And when the Lord our God shall give this liberty to his servants, let God be with thee also in the midst of us: that as it shall please thee, so thou with all thine mayst converse with us.\"},{\"verse\":19,\"text\":\"Then Ozias, after the assembly was broken up, received him into his house, and made him a great supper.\"},{\"verse\":20,\"text\":\"And all the ancients were invited, and they refreshed themselves together after their fast was over.\"},{\"verse\":21,\"text\":\"And afterwards all the people were called together, and they prayed all the night long within the church, desiring help of the God of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem cum cessassent loqui, indignatus Holofernes vehementer, dixit ad Achior :\"},{\"verse\":2,\"text\":\"Quoniam prophetasti nobis, dicens quod gens Israël defendatur a Deo suo, ut ostendam tibi quoniam non est deus nisi Nabuchodonosor,\"},{\"verse\":3,\"text\":\"cum percusserimus eos omnes, sicut hominem unum, tunc et ipse cum illis Assyriorum gladio interibis, et omnis Israël tecum perditione disperiet :\"},{\"verse\":4,\"text\":\"et probabis quoniam Nabuchodonosor dominus sit universæ terræ : tuncque gladius militiæ meæ transiet per latera tua, et confixus cades inter vulneratos Israël, et non respirabis ultra, donec extermineris cum illis.\"},{\"verse\":5,\"text\":\"Porro autem si prophetiam tuam veram existimas, non concidat vultus tuus : et pallor qui faciem tuam obtinet abscedat a te, si verba mea hæc putas impleri non posse.\"},{\"verse\":6,\"text\":\"Ut autem noveris quia simul cum illis hæc experieris, ecce ex hac hora illorum populo sociaberis, ut, dum dignas mei gladii pœnas exceperint, ipse simul ultioni subjaceas.\"},{\"verse\":7,\"text\":\"Tunc Holofernes præcepit servis suis ut comprehenderent Achior, et perducerent eum in Bethuliam, et traderent eum in manus filiorum Israël.\"},{\"verse\":8,\"text\":\"Et accipientes eum servi Holofernis, profecti sunt per campestria : sed cum appropinquassent ad montana, exierunt contra eos fundibularii.\"},{\"verse\":9,\"text\":\"Illi autem divertentes a latere montis, ligaverunt Achior ad arborem manibus et pedibus, et sic vinctum restibus dimiserunt eum, et reversi sunt ad dominum suum.\"},{\"verse\":10,\"text\":\"Porro filii Israël descendentes de Bethulia, venerunt ad eum : quem solventes, duxerunt ad Bethuliam, atque in medium populi illum statuentes, percunctati sunt quid rerum esset quod illum vinctum Assyrii reliquissent.\"},{\"verse\":11,\"text\":\"In diebus illis erant illic principes Ozias filius Micha de tribu Simeon, et Charmi, qui et Gothoniel.\"},{\"verse\":12,\"text\":\"In medio itaque seniorum, et in conspectu omnium, Achior dixit omnia quæ locutus ipse fuerat ab Holoferne interrogatus : et qualiter populus Holofernis voluisset propter hoc verbum interficere eum,\"},{\"verse\":13,\"text\":\"et quemadmodum ipse Holofernes iratus jusserit eum Israëlitis hac de causa tradi, ut dum vicerit filios Israël, tunc et ipsum Achior diversis jubeat interire suppliciis, propter hoc quod dixisset : Deus cæli defensor eorum est.\"},{\"verse\":14,\"text\":\"Cumque Achior universa hæc exposuisset, omnis populus cecidit in faciem, adorantes Dominum, et communi lamentatione et fletu unanimes preces suas Domino effuderunt,\"},{\"verse\":15,\"text\":\"dicentes : Domine Deus cæli et terræ, intuere superbiam eorum, et respice ad nostram humilitatem, et faciem sanctorum tuorum attende, et ostende quoniam non derelinquis præsumentes de te : et præsumentes de se, et de sua virtute gloriantes, humilias.\"},{\"verse\":16,\"text\":\"Finito itaque fletu, et per totam diem oratione populorum completa, consolati sunt Achior,\"},{\"verse\":17,\"text\":\"dicentes : Deus patrum nostrorum, cujus tu virtutem prædicasti, ipse tibi hanc dabit vicissitudinem, ut eorum magis tu interitum videas.\"},{\"verse\":18,\"text\":\"Cum vero Dominus Deus noster dederit hanc libertatem servis suis, sit et tecum Deus in medio nostri : ut sicut placuerit tibi, ita cum tuis omnibus converseris nobiscum.\"},{\"verse\":19,\"text\":\"Tunc Ozias, finito consilio, suscepit eum in domum suam, et fecit ei cœnam magnam.\"},{\"verse\":20,\"text\":\"Et vocatis omnibus presbyteris, simul expleto jejunio refecerunt.\"},{\"verse\":21,\"text\":\"Postea vero convocatus est omnis populus, et per totam noctem intra ecclesiam oraverunt, petentes auxilium a Deo Israël.\"}],\"summary\":\"Holofernes in great rage sendeth Achior to Bethulia, there to be slain with the Israelites.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":5,\"label\":\"Judith 5\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":7,\"label\":\"Judith 7\"}}]]\n"])</script></body></html>
