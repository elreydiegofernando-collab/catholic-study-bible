[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judith<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDT/">About <!-- -->Judith</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Judith cutteth off the head of Holofernes, and returneth to Bethulia.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when it was grown late, his servants made haste to their lodgings, and Vagao shut the chamber doors, and went his way.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they were all overcharged with wine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Judith was alone in the chamber.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But Holofernes lay on his bed, fast asleep, being exceedingly drunk.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Judith spoke to her maid to stand without before the chamber, and to watch:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Judith stood before the bed praying with tears, and the motion of her lips in silence,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Saying: Strengthen me, O Lord God of Israel, and in this hour look on the works of my hands, that as thou hast promised, thou mayst raise up Jerusalem thy city: and that I may bring to pass that which I have purposed, having a belief that it might be done by thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when she had said this, she went to the pillar that was at his bed’s head, and loosed his sword that hung tied upon it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when she had drawn it out, she took him by the hair of his head, and said: Strengthen me, O Lord God, at this hour.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And she struck twice upon his neck, and cut off his head, and took off his canopy from the pillars, and rolled away his headless body.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And after a while she went out, and delivered the head of Holofernes to her maid, and bade her put it into her wallet.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they two went out according to their custom, as it were to prayer, and they passed the camp, and having compassed the valley, they came to the gate of the city.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Judith from afar off cried to the watchmen upon the walls: Open the gates for God is with us, who hath shewn his power in Israel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And it came to pass, when the men had heard her voice, that they called the ancients of the city.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And all ran to meet her from the least to the greatest: for they now had no hopes that she would come.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And lighting up lights they all gathered round about her: and she went up to a higher place, and commanded silence to be made. And when all had held their peace,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Judith said: Praise ye the Lord our God, who hath not forsaken them that hope in him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And by me his handmaid he hath fulfilled his mercy, which he promised to the house of Israel: and he hath killed the enemy of his people by my hand this night.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Then she brought forth the head of Holofernes out of the wallet, and shewed it them, saying: Behold the head of Holofernes the general of the army of the Assyrians, and behold his canopy, wherein he lay in his drunkenness, where the Lord our God slew him by the hand of a woman.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But as the same Lord liveth, his angel hath been my keeper both going hence, and abiding there, and returning from thence hither: and the Lord hath not suffered me his handmaid to be defiled, but hath brought me back to you without pollution of sin, rejoicing for his victory, for my escape, and for your deliverance.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Give all of you glory to him, because he is good, because his mercy endureth for ever.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they all adored the Lord, and said to her: The Lord hath blessed thee by his power, because by thee he hath brought our enemies to nought.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Ozias the prince of the people of Israel, said to her: Blessed art thou, O daughter, by the Lord the most high God, above all women upon the earth.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Blessed be the Lord who made heaven and earth, who hath directed thee to the cutting off the head of the prince of our enemies.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Because he hath so magnified thy name this day, that thy praise shall not depart out of the mouth of men who shall be mindful of the power of the Lord for ever, for that thou hast not spared thy life, by reason of the distress and tribulation of thy people, but hast prevented our ruin in the presence of our God.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And all the people said: So be it, so be it.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Achior being called for came, and Judith said to him: The God of Israel, to whom thou gavest testimony, that he revengeth himself of his enemies, he hath cut off the head of all the unbelievers this night by my hand.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And that thou mayst find that it is so, behold the head of Holofernes, who in the contempt of his pride despised the God of Israel: and threatened them with death, saying: When the people of Israel shall be taken, I will command thy sides to be pierced with a sword.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Then Achior seeing the head of Holofernes, being seized with a great fear he fell on his face upon the earth, and his soul swooned away.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But after he had recovered his spirits he fell down at her feet, and reverenced her, and said:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Blessed art thou by thy God in every tabernacle of Jacob, for in every nation which shall hear thy name, the God of Israel shall be magnified on occasion of thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ut autem sero factum est, festinaverunt servi illius ad hospitia sua, et conclusit Vagao ostia cubiculi, et abiit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Erant autem omnes fatigati a vino,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>eratque Judith sola in cubiculo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Porro Holofernes jacebat in lecto, nimia ebrietate sopitus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixitque Judith puellæ suæ ut staret foris ante cubiculum, et observaret.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Stetitque Judith ante lectum, orans cum lacrimis, et labiorum motu in silentio,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>dicens : Confirma me, Domine Deus Israël, et respice in hac hora ad opera manuum mearum, ut, sicut promisisti, Jerusalem civitatem tuam erigas : et hoc quod credens per te posse fieri cogitavi, perficiam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et cum hæc dixisset, accessit ad columnam quæ erat ad caput lectuli ejus, et pugionem ejus, qui in ea ligatus pendebat, exsolvit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cumque evaginasset illum, apprehendit comam capitis ejus, et ait : Confirma me, Domine Deus, in hac hora.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et percussit bis in cervicem ejus, et abscidit caput ejus, et abstulit conopeum ejus a columnis, et evolvit corpus ejus truncum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et post pusillum exivit, et tradidit caput Holofernis ancillæ suæ, et jussit ut mitteret illud in peram suam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et exierunt duæ, secundum consuetudinem suam, quasi ad orationem, et transierunt castra, et gyrantes vallem, venerunt ad portam civitatis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et dixit Judith a longe custodibus murorum : Aperite portas, quoniam nobiscum est Deus, qui fecit virtutem in Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et factum est cum audissent viri vocem ejus, vocaverunt presbyteros civitatis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et concurrerunt ad eam omnes, a minimo usque ad maximum : quoniam sperabant eam jam non esse venturam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et accendentes luminaria, congyraverunt circa eam universi : illa autem ascendens in eminentiorem locum, jussit fieri silentium. Cumque omnes tacuissent,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>dixit Judith : Laudate Dominum Deum nostrum, qui non deseruit sperantes in se,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et in me ancilla sua adimplevit misericordiam suam, quam promisit domui Israël : et interfecit in manu mea hostem populi sui hac nocte.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et proferens de pera caput Holofernis, ostendit illis, dicens : Ecce caput Holofernis principis militiæ Assyriorum, et ecce conopeum illius, in quo recumbebat in ebrietate sua, ubi per manum feminæ percussit illum Dominus Deus noster.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vivit autem ipse Dominus, quoniam custodivit me angelus ejus et hinc euntem, et ibi commorantem, et inde huc revertentem, et non permisit me Dominus ancillam suam coinquinari, sed sine pollutione peccati revocavit me vobis gaudentem in victoria sua, in evasione mea, et in liberatione vestra.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Confitemini illi omnes, quoniam bonus, quoniam in sæculum misericordia ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Universi autem adorantes Dominum, dixerunt ad eam : Benedixit te Dominus in virtute sua, quia per te ad nihilum redegit inimicos nostros.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Porro Ozias princeps populi Israël dixit ad eam : Benedicta es tu, filia, a Domino Deo excelso præ omnibus mulieribus super terram.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Benedictus Dominus, qui creavit cælum et terram, qui te direxit in vulnera capitis principis inimicorum nostrorum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>quia hodie nomen tuum ita magnificavit, ut non recedat laus tua de ore hominum qui memores fuerint virtutis Domini in æternum, pro quibus non pepercisti animæ tuæ propter angustias et tribulationem generis tui, sed subvenisti ruinæ ante conspectum Dei nostri.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et dixit omnis populus : Fiat, fiat.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Porro Achior vocatus venit, et dixit ei Judith : Deus Israël, cui tu testimonium dedisti quod ulciscatur se de inimicis suis, ipse caput omnium incredulorum incidit hac nocte in manu mea.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et ut probes quia ita est, ecce caput Holofernis, qui in contemptu superbiæ suæ Deum Israël contempsit, et tibi interitum minabatur, dicens : Cum captus fuerit populus Israël, gladio perforari præcipiam latera tua.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Videns autem Achior caput Holofernis, angustiatus præ pavore cecidit in faciem suam super terram, et æstuavit anima ejus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Postea vero quam resumpto spiritu recreatus est, procidit ad pedes ejus, et adoravit eam, et dixit :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Benedicta tu a Deo tuo in omni tabernaculo Jacob, quoniam in omni gente quæ audierit nomen tuum, magnificabitur super te Deus Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judith 12" class="inline-flex h-12 w-14 shrink-0 it ple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDT.13\",{\"bookId\":18,\"usfm\":\"JDT\",\"bookName\":\"Judith\",\"drName\":\"Judith\",\"chapter\":13,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And when it was grown late, his servants made haste to their lodgings, and Vagao shut the chamber doors, and went his way.\"},{\"verse\":2,\"text\":\"And they were all overcharged with wine.\"},{\"verse\":3,\"text\":\"And Judith was alone in the chamber.\"},{\"verse\":4,\"text\":\"But Holofernes lay on his bed, fast asleep, being exceedingly drunk.\"},{\"verse\":5,\"text\":\"And Judith spoke to her maid to stand without before the chamber, and to watch:\"},{\"verse\":6,\"text\":\"And Judith stood before the bed praying with tears, and the motion of her lips in silence,\"},{\"verse\":7,\"text\":\"Saying: Strengthen me, O Lord God of Israel, and in this hour look on the works of my hands, that as thou hast promised, thou mayst raise up Jerusalem thy city: and that I may bring to pass that which I have purposed, having a belief that it might be done by thee.\"},{\"verse\":8,\"text\":\"And when she had said this, she went to the pillar that was at his bed’s head, and loosed his sword that hung tied upon it.\"},{\"verse\":9,\"text\":\"And when she had drawn it out, she took him by the hair of his head, and said: Strengthen me, O Lord God, at this hour.\"},{\"verse\":10,\"text\":\"And she struck twice upon his neck, and cut off his head, and took off his canopy from the pillars, and rolled away his headless body.\"},{\"verse\":11,\"text\":\"And after a while she went out, and delivered the head of Holofernes to her maid, and bade her put it into her wallet.\"},{\"verse\":12,\"text\":\"And they two went out according to their custom, as it were to prayer, and they passed the camp, and having compassed the valley, they came to the gate of the city.\"},{\"verse\":13,\"text\":\"And Judith from afar off cried to the watchmen upon the walls: Open the gates for God is with us, who hath shewn his power in Israel.\"},{\"verse\":14,\"text\":\"And it came to pass, when the men had heard her voice, that they called the ancients of the city.\"},{\"verse\":15,\"text\":\"And all ran to meet her from the least to the greatest: for they now had no hopes that she would come.\"},{\"verse\":16,\"text\":\"And lighting up lights they all gathered round about her: and she went up to a higher place, and commanded silence to be made. And when all had held their peace,\"},{\"verse\":17,\"text\":\"Judith said: Praise ye the Lord our God, who hath not forsaken them that hope in him.\"},{\"verse\":18,\"text\":\"And by me his handmaid he hath fulfilled his mercy, which he promised to the house of Israel: and he hath killed the enemy of his people by my hand this night.\"},{\"verse\":19,\"text\":\"Then she brought forth the head of Holofernes out of the wallet, and shewed it them, saying: Behold the head of Holofernes the general of the army of the Assyrians, and behold his canopy, wherein he lay in his drunkenness, where the Lord our God slew him by the hand of a woman.\"},{\"verse\":20,\"text\":\"But as the same Lord liveth, his angel hath been my keeper both going hence, and abiding there, and returning from thence hither: and the Lord hath not suffered me his handmaid to be defiled, but hath brought me back to you without pollution of sin, rejoicing for his victory, for my escape, and for your deliverance.\"},{\"verse\":21,\"text\":\"Give all of you glory to him, because he is good, because his mercy endureth for ever.\"},{\"verse\":22,\"text\":\"And they all adored the Lord, and said to her: The Lord hath blessed thee by his power, because by thee he hath brought our enemies to nought.\"},{\"verse\":23,\"text\":\"And Ozias the prince of the people of Israel, said to her: Blessed art thou, O daughter, by the Lord the most high God, above all women upon the earth.\"},{\"verse\":24,\"text\":\"Blessed be the Lord who made heaven and earth, who hath directed thee to the cutting off the head of the prince of our enemies.\"},{\"verse\":25,\"text\":\"Because he hath so magnified thy name this day, that thy praise shall not depart out of the mouth of men who shall be mindful of the power of the Lord for ever, for that thou hast not spared thy life, by reason of the distress and tribulation of thy people, but hast prevented our ruin in the presence of our God.\"},{\"verse\":26,\"text\":\"And all the people said: So be it, so be it.\"},{\"verse\":27,\"text\":\"And Achior being called for came, and Judith said to him: The God of Israel, to whom thou gavest testimony, that he revengeth himself of his enemies, he hath cut off the head of all the unbelievers this night by my hand.\"},{\"verse\":28,\"text\":\"And that thou mayst find that it is so, behold the head of Holofernes, who in the contempt of his pride despised the God of Israel: and threatened them with death, saying: When the people of Israel shall be taken, I will command thy sides to be pierced with a sword.\"},{\"verse\":29,\"text\":\"Then Achior seeing the head of Holofernes, being seized with a great fear he fell on his face upon the earth, and his soul swooned away.\"},{\"verse\":30,\"text\":\"But after he had recovered his spirits he fell down at her feet, and reverenced her, and said:\"},{\"verse\":31,\"text\":\"Blessed art thou by thy God in every tabernacle of Jacob, for in every nation which shall hear thy name, the God of Israel shall be magnified on occasion of thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ut autem sero factum est, festinaverunt servi illius ad hospitia sua, et conclusit Vagao ostia cubiculi, et abiit.\"},{\"verse\":2,\"text\":\"Erant autem omnes fatigati a vino,\"},{\"verse\":3,\"text\":\"eratque Judith sola in cubiculo.\"},{\"verse\":4,\"text\":\"Porro Holofernes jacebat in lecto, nimia ebrietate sopitus.\"},{\"verse\":5,\"text\":\"Dixitque Judith puellæ suæ ut staret foris ante cubiculum, et observaret.\"},{\"verse\":6,\"text\":\"Stetitque Judith ante lectum, orans cum lacrimis, et labiorum motu in silentio,\"},{\"verse\":7,\"text\":\"dicens : Confirma me, Domine Deus Israël, et respice in hac hora ad opera manuum mearum, ut, sicut promisisti, Jerusalem civitatem tuam erigas : et hoc quod credens per te posse fieri cogitavi, perficiam.\"},{\"verse\":8,\"text\":\"Et cum hæc dixisset, accessit ad columnam quæ erat ad caput lectuli ejus, et pugionem ejus, qui in ea ligatus pendebat, exsolvit.\"},{\"verse\":9,\"text\":\"Cumque evaginasset illum, apprehendit comam capitis ejus, et ait : Confirma me, Domine Deus, in hac hora.\"},{\"verse\":10,\"text\":\"Et percussit bis in cervicem ejus, et abscidit caput ejus, et abstulit conopeum ejus a columnis, et evolvit corpus ejus truncum.\"},{\"verse\":11,\"text\":\"Et post pusillum exivit, et tradidit caput Holofernis ancillæ suæ, et jussit ut mitteret illud in peram suam.\"},{\"verse\":12,\"text\":\"Et exierunt duæ, secundum consuetudinem suam, quasi ad orationem, et transierunt castra, et gyrantes vallem, venerunt ad portam civitatis.\"},{\"verse\":13,\"text\":\"Et dixit Judith a longe custodibus murorum : Aperite portas, quoniam nobiscum est Deus, qui fecit virtutem in Israël.\"},{\"verse\":14,\"text\":\"Et factum est cum audissent viri vocem ejus, vocaverunt presbyteros civitatis.\"},{\"verse\":15,\"text\":\"Et concurrerunt ad eam omnes, a minimo usque ad maximum : quoniam sperabant eam jam non esse venturam.\"},{\"verse\":16,\"text\":\"Et accendentes luminaria, congyraverunt circa eam universi : illa autem ascendens in eminentiorem locum, jussit fieri silentium. Cumque omnes tacuissent,\"},{\"verse\":17,\"text\":\"dixit Judith : Laudate Dominum Deum nostrum, qui non deseruit sperantes in se,\"},{\"verse\":18,\"text\":\"et in me ancilla sua adimplevit misericordiam suam, quam promisit domui Israël : et interfecit in manu mea hostem populi sui hac nocte.\"},{\"verse\":19,\"text\":\"Et proferens de pera caput Holofernis, ostendit illis, dicens : Ecce caput Holofernis principis militiæ Assyriorum, et ecce conopeum illius, in quo recumbebat in ebrietate sua, ubi per manum feminæ percussit illum Dominus Deus noster.\"},{\"verse\":20,\"text\":\"Vivit autem ipse Dominus, quoniam custodivit me angelus ejus et hinc euntem, et ibi commorantem, et inde huc revertentem, et non permisit me Dominus ancillam suam coinquinari, sed sine pollutione peccati revocavit me vobis gaudentem in victoria sua, in evasione mea, et in liberatione vestra.\"},{\"verse\":21,\"text\":\"Confitemini illi omnes, quoniam bonus, quoniam in sæculum misericordia ejus.\"},{\"verse\":22,\"text\":\"Universi autem adorantes Dominum, dixerunt ad eam : Benedixit te Dominus in virtute sua, quia per te ad nihilum redegit inimicos nostros.\"},{\"verse\":23,\"text\":\"Porro Ozias princeps populi Israël dixit ad eam : Benedicta es tu, filia, a Domino Deo excelso præ omnibus mulieribus super terram.\"},{\"verse\":24,\"text\":\"Benedictus Dominus, qui creavit cælum et terram, qui te direxit in vulnera capitis principis inimicorum nostrorum :\"},{\"verse\":25,\"text\":\"quia hodie nomen tuum ita magnificavit, ut non recedat laus tua de ore hominum qui memores fuerint virtutis Domini in æternum, pro quibus non pepercisti animæ tuæ propter angustias et tribulationem generis tui, sed subvenisti ruinæ ante conspectum Dei nostri.\"},{\"verse\":26,\"text\":\"Et dixit omnis populus : Fiat, fiat.\"},{\"verse\":27,\"text\":\"Porro Achior vocatus venit, et dixit ei Judith : Deus Israël, cui tu testimonium dedisti quod ulciscatur se de inimicis suis, ipse caput omnium incredulorum incidit hac nocte in manu mea.\"},{\"verse\":28,\"text\":\"Et ut probes quia ita est, ecce caput Holofernis, qui in contemptu superbiæ suæ Deum Israël contempsit, et tibi interitum minabatur, dicens : Cum captus fuerit populus Israël, gladio perforari præcipiam latera tua.\"},{\"verse\":29,\"text\":\"Videns autem Achior caput Holofernis, angustiatus præ pavore cecidit in faciem suam super terram, et æstuavit anima ejus.\"},{\"verse\":30,\"text\":\"Postea vero quam resumpto spiritu recreatus est, procidit ad pedes ejus, et adoravit eam, et dixit :\"},{\"verse\":31,\"text\":\"Benedicta tu a Deo tuo in omni tabernaculo Jacob, quoniam in omni gente quæ audierit nomen tuum, magnificabitur super te Deus Israël.\"}],\"summary\":\"Judith cutteth off the head of Holofernes, and returneth to Bethulia.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":12,\"label\":\"Judith 12\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":14,\"label\":\"Judith 14\"}}]]\n"])</script></body></html>
