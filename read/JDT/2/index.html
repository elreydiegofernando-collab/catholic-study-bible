xt-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In the thirteenth year of the reign of Nabuchodonosor, the two and twentieth day of the first month, the word was given out in the house of Nabuchodonosor king of the Assyrians, that he would revenge himself.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he called all the ancients, and all the governors, and his officers of war, and communicated to them the secret of his counsel:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said that his thoughts were to bring all the earth under his empire.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when this saying pleased them all, Nabuchodonosor, the king, called Holofernes the general of his armies,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And said to him: Go out against all the kingdoms of the west, and against them especially that despised my commandment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thy eye shall not spare any kingdom, and all the strong cities thou shalt bring under my yoke.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then Holofernes called the captains, and officers of the power of the Assyrians: and he mustered men for the expedition, as the king commanded him, a hundred and twenty thousand fighting men on foot, and twelve thousand archers, horsemen.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he made all his warlike preparations to go before with a multitude of innumerable camels, with all provisions sufficient for the armies in abundance, and herds of oxen, and flocks of sheep, without number.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He appointed corn to be prepared out of all Syria in his passage.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But gold and silver he took out of the king’s house in great abundance.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he went forth he and all the army, with the chariots, and horsemen, and archers, who covered the face of the earth, like locusts.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when he had passed through the borders of the Assyrians, he came to the great mountains of Ange, which are on the left of Cilicia: and he went up to all their castles, and took all the strong places.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he took by assault the renowned city of Melothus, and pillaged all the children of Tharsis, and the children of Ismahel, who were over against the face of the desert, and on the south of the land of Cellon.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he passed over the Euphrates and came into Mesopotamia: and he forced all the stately cities that were there, from the torrent of Mambre, till one comes to the sea:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he took the borders thereof, from Cilicia to the coasts of Japheth, which are towards the south.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he carried away all the children of Madian, and stripped them of all their riches, and all that resisted him he slew with the edge of the sword.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And after these things he went down into the plains of Damascus in the days of the harvest, and he set all the corn on fire, and he caused all the trees and vineyards to be cut down.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the fear of them fell upon all the inhabitants of the land.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Anno tertiodecimo Nabuchodonosor regis, vigesima et secunda die mensis primi, factum est verbum in domo Nabuchodonosor regis Assyriorum ut defenderet se.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vocavitque omnes majores natu, omnesque duces et bellatores suos, et habuit cum eis mysterium consilii sui :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>dixitque cogitationem suam in eo esse, ut omnem terram suo subjugaret imperio.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quod dictum cum placuisset omnibus, vocavit Nabuchodonosor rex Holofernem principem militiæ suæ,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et dixit ei : Egredere adversus omne regnum occidentis, et contra eos præcipue, qui contempserunt imperium meum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non parcet oculus tuus ulli regno, omnemque urbem munitam subjugabis mihi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tunc Holofernes vocavit duces et magistratus virtutis Assyriorum, et dinumeravit viros in expeditionem sicut præcepit ei rex, centum viginti millia peditum pugnatorum, et equitum sagittariorum duodecim millia.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnemque expeditionem suam fecit præire in multitudine innumerabilium camelorum, cum his quæ exercitibus sufficerent copiose, boum quoque armenta, gregesque ovium, quorum non erat numerus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Frumentum ex omni Syria in transitu suo parari constituit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Aurum vero et argentum de domo regis assumpsit multum nimis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et profectus est ipse, et omnis exercitus cum quadrigis, et equitibus, et sagittariis : qui cooperuerunt faciem terræ sicut locustæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cumque pertransisset fines Assyriorum, venit ad magnos montes Ange, qui sunt a sinistro Ciliciæ : ascenditque omnia castella eorum, et obtinuit omnem munitionem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Effregit autem civitatem opinatissimam Melothi, prædavitque omnes filios Tharsis et filios Ismaël qui erant contra faciem deserti, et ad austrum terræ Cellon.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et transivit Euphraten, et venit in Mesopotamiam : et fregit omnes civitates excelsas quæ erant ibi, a torrente Mambre usquequo perveniatur ad mare :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et occupavit terminos ejus, a Cilicia usque ad fines Japheth qui sunt ad austrum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Abduxitque omnes filios Madian, et prædavit omnem locupletationem eorum, omnesque resistentes sibi occidit in ore gladii.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et post hæc descendit in campos Damasci in diebus messis, et succendit omnia sata, omnesque arbores, et vineas fecit incidi :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et cecidit timor illius super omnes inhabitantes terram.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judith 1" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/J ])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDT.2\",{\"bookId\":18,\"usfm\":\"JDT\",\"bookName\":\"Judith\",\"drName\":\"Judith\",\"chapter\":2,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"In the thirteenth year of the reign of Nabuchodonosor, the two and twentieth day of the first month, the word was given out in the house of Nabuchodonosor king of the Assyrians, that he would revenge himself.\"},{\"verse\":2,\"text\":\"And he called all the ancients, and all the governors, and his officers of war, and communicated to them the secret of his counsel:\"},{\"verse\":3,\"text\":\"And he said that his thoughts were to bring all the earth under his empire.\"},{\"verse\":4,\"text\":\"And when this saying pleased them all, Nabuchodonosor, the king, called Holofernes the general of his armies,\"},{\"verse\":5,\"text\":\"And said to him: Go out against all the kingdoms of the west, and against them especially that despised my commandment.\"},{\"verse\":6,\"text\":\"Thy eye shall not spare any kingdom, and all the strong cities thou shalt bring under my yoke.\"},{\"verse\":7,\"text\":\"Then Holofernes called the captains, and officers of the power of the Assyrians: and he mustered men for the expedition, as the king commanded him, a hundred and twenty thousand fighting men on foot, and twelve thousand archers, horsemen.\"},{\"verse\":8,\"text\":\"And he made all his warlike preparations to go before with a multitude of innumerable camels, with all provisions sufficient for the armies in abundance, and herds of oxen, and flocks of sheep, without number.\"},{\"verse\":9,\"text\":\"He appointed corn to be prepared out of all Syria in his passage.\"},{\"verse\":10,\"text\":\"But gold and silver he took out of the king’s house in great abundance.\"},{\"verse\":11,\"text\":\"And he went forth he and all the army, with the chariots, and horsemen, and archers, who covered the face of the earth, like locusts.\"},{\"verse\":12,\"text\":\"And when he had passed through the borders of the Assyrians, he came to the great mountains of Ange, which are on the left of Cilicia: and he went up to all their castles, and took all the strong places.\"},{\"verse\":13,\"text\":\"And he took by assault the renowned city of Melothus, and pillaged all the children of Tharsis, and the children of Ismahel, who were over against the face of the desert, and on the south of the land of Cellon.\"},{\"verse\":14,\"text\":\"And he passed over the Euphrates and came into Mesopotamia: and he forced all the stately cities that were there, from the torrent of Mambre, till one comes to the sea:\"},{\"verse\":15,\"text\":\"And he took the borders thereof, from Cilicia to the coasts of Japheth, which are towards the south.\"},{\"verse\":16,\"text\":\"And he carried away all the children of Madian, and stripped them of all their riches, and all that resisted him he slew with the edge of the sword.\"},{\"verse\":17,\"text\":\"And after these things he went down into the plains of Damascus in the days of the harvest, and he set all the corn on fire, and he caused all the trees and vineyards to be cut down.\"},{\"verse\":18,\"text\":\"And the fear of them fell upon all the inhabitants of the land.\"}],\"vul\":[{\"verse\":1,\"text\":\"Anno tertiodecimo Nabuchodonosor regis, vigesima et secunda die mensis primi, factum est verbum in domo Nabuchodonosor regis Assyriorum ut defenderet se.\"},{\"verse\":2,\"text\":\"Vocavitque omnes majores natu, omnesque duces et bellatores suos, et habuit cum eis mysterium consilii sui :\"},{\"verse\":3,\"text\":\"dixitque cogitationem suam in eo esse, ut omnem terram suo subjugaret imperio.\"},{\"verse\":4,\"text\":\"Quod dictum cum placuisset omnibus, vocavit Nabuchodonosor rex Holofernem principem militiæ suæ,\"},{\"verse\":5,\"text\":\"et dixit ei : Egredere adversus omne regnum occidentis, et contra eos præcipue, qui contempserunt imperium meum.\"},{\"verse\":6,\"text\":\"Non parcet oculus tuus ulli regno, omnemque urbem munitam subjugabis mihi.\"},{\"verse\":7,\"text\":\"Tunc Holofernes vocavit duces et magistratus virtutis Assyriorum, et dinumeravit viros in expeditionem sicut præcepit ei rex, centum viginti millia peditum pugnatorum, et equitum sagittariorum duodecim millia.\"},{\"verse\":8,\"text\":\"Omnemque expeditionem suam fecit præire in multitudine innumerabilium camelorum, cum his quæ exercitibus sufficerent copiose, boum quoque armenta, gregesque ovium, quorum non erat numerus.\"},{\"verse\":9,\"text\":\"Frumentum ex omni Syria in transitu suo parari constituit.\"},{\"verse\":10,\"text\":\"Aurum vero et argentum de domo regis assumpsit multum nimis.\"},{\"verse\":11,\"text\":\"Et profectus est ipse, et omnis exercitus cum quadrigis, et equitibus, et sagittariis : qui cooperuerunt faciem terræ sicut locustæ.\"},{\"verse\":12,\"text\":\"Cumque pertransisset fines Assyriorum, venit ad magnos montes Ange, qui sunt a sinistro Ciliciæ : ascenditque omnia castella eorum, et obtinuit omnem munitionem.\"},{\"verse\":13,\"text\":\"Effregit autem civitatem opinatissimam Melothi, prædavitque omnes filios Tharsis et filios Ismaël qui erant contra faciem deserti, et ad austrum terræ Cellon.\"},{\"verse\":14,\"text\":\"Et transivit Euphraten, et venit in Mesopotamiam : et fregit omnes civitates excelsas quæ erant ibi, a torrente Mambre usquequo perveniatur ad mare :\"},{\"verse\":15,\"text\":\"et occupavit terminos ejus, a Cilicia usque ad fines Japheth qui sunt ad austrum.\"},{\"verse\":16,\"text\":\"Abduxitque omnes filios Madian, et prædavit omnem locupletationem eorum, omnesque resistentes sibi occidit in ore gladii.\"},{\"verse\":17,\"text\":\"Et post hæc descendit in campos Damasci in diebus messis, et succendit omnia sata, omnesque arbores, et vineas fecit incidi :\"},{\"verse\":18,\"text\":\"et cecidit timor illius super omnes inhabitantes terram.\"}],\"summary\":\"Nabuchodonosor sendeth Holofernes to waste the countries of the west.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":1,\"label\":\"Judith 1\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":3,\"label\":\"Judith 3\"}}]]\n"])</script></body></html>
