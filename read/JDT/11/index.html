20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judith<!-- --> <span class="text-stone-500">11</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Judith’s speech to Holofernes.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Holofernes said to her: Be of good comfort, and fear not in thy heart: for I have never hurt a man that was willing to serve Nabuchodonosor the king.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And if thy people had not despised me, I would never have lifted up my spear against them.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But now tell me, for what cause hast thou left them, and why it hath pleased thee to come to us?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Judith said to him: Receive the words of thy handmaid, for if thou wilt follow the words of thy handmaid, the Lord will do with thee a perfect thing.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For as Nabuchodonosor the king of the earth liveth, and his power liveth which is in thee for chastising of all straying souls: not only men serve him through thee, but also the beasts of the field obey him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For the industry of thy mind is spoken of among all nations, and it is told through the whole world, that thou only art excellent, and mighty in all his kingdom, and thy discipline is cried up in all provinces.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>It is known also what Achior said, nor are we ignorant of what thou hast commanded to be done to him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For it is certain that our God is so offended with sins, that he hath sent word by his prophets to the people, that he will deliver them up for their sins.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And because the children of Israel know they have offended their God, thy dread is upon them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Moreover also a famine hath come upon them, and for drought of water they are already to be counted among the dead.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they have a design even to kill their cattle, and to drink the blood of them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the consecrated things of the Lord their God which God forbade them to touch, in corn, wine, and oil, these have they purposed to make use of, and they design to consume the things which they ought not to touch with their hands: therefore because they do these things, it is certain they will be given up to destruction.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And I thy handmaid knowing this, am fled from them, and the Lord hath sent me to tell thee these very things.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For I thy handmaid worship God even now that I am with thee, and thy handmaid will go out, and I will pray to God,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he will tell me when he will repay them for their sins, and I will come and tell thee, so that I may bring thee through the midst of Jerusalem, and thou shalt have all the people of Israel, as sheep that have no shepherd, and there shall not so much as one dog bark against thee:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Because these things are told me by the providence of God.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And because God is angry with them, I am sent to tell these very things to thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all these words pleased Holofernes, and his servants, and they admired her wisdom, and they said one to another:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>There is not such another woman upon earth in look, in beauty, and in sense of words.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Holofernes said to her: God hath done well who sent thee before the people, that thou mightest give them into our hands:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And because thy promise is good, if thy God shall do this for me, he shall also be my God, and thou shalt be great in the house of Nabuchodonosor, and thy name shall be renowned through all the earth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc Holofernes dixit ei : Æquo animo esto, et noli pavere in corde tuo : quoniam ego numquam nocui viro qui voluit servire Nabuchodonosor regi :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>populus autem tuus, si non contempsisset me, non levassem lanceam meam super eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Nunc autem dic mihi, qua ex causa recessisti ab illis, et placuit tibi ut venires ad nos ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dixit illi Judith : Sume verba ancillæ tuæ, quoniam si secutus fueris verba ancillæ tuæ, perfectam rem faciet Dominus tecum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Vivit enim Nabuchodonosor rex terræ, et vivit virtus ejus, quæ est in te ad correptionem omnium animarum errantium : quoniam non solum homines serviunt illi per te, sed et bestiæ agri obtemperant illi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nuntiatur enim animi tui industria universis gentibus, et indicatum est omni sæculo quoniam tu solus bonus et potens es in omni regno ejus : et disciplina tua omnibus provinciis prædicatur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nec hoc latet, quod locutus est Achior, nec illud ignoratur, quod ei jusseris evenire.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Constat enim Deum nostrum sic peccatis offensum, ut mandaverit per prophetas suos ad populum quod tradat eum pro peccatis suis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et quoniam sciunt se offendisse Deum suum filii Israël, tremor tuus super ipsos est.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Insuper etiam fames invasit eos, et ab ariditate aquæ jam inter mortuos computantur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Denique hoc ordinant, ut interficient pecora sua, et bibant sanguinem eorum :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et sancta Domini Dei sui, quæ præcepit Deus non contingi, in frumento, vino, et oleo, hæc cogitaverunt impendere, et volunt consumere quæ nec manibus deberent contingere : ergo quoniam hæc faciunt, certum est quod in perditionem dabuntur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quod ego ancilla tua cognoscens, fugi ab illis, et misit me Dominus hæc ipsa nuntiare tibi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego enim ancilla tua Deum colo, etiam nunc apud te : et exiet ancilla tua, et orabo Deum,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et dicet mihi quando eis reddat peccatum suum, et veniens nuntiabo tibi, ita ut ego adducam te per mediam Jerusalem, et habebis omnem populum Israël, sicut oves quibus non est pastor, et non latrabit vel unus canis contra te :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>quoniam hæc mihi dicta sunt per providentiam Dei,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et quoniam iratus est illis Deus, hæc ipsa missa sum nuntiare tibi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Placuerunt autem omnia verba hæc coram Holoferne, et coram pueris ejus, et mirabantur sapientiam ejus, et dicebant alter ad alterum :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non est talis mulier super terram in aspectu, in pulchritudine, et in sensu verborum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et dixit ad illam Holofernes : Benefecit Deus, qui misit te ante populum, ut des illum tu in manibus nostris :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et quoniam bona est promissio tua, si fecerit mihi hoc Deus tuus, erit et Deus meus, et tu in domo Nabuchodonosor magna eris, et nomen tuum nominabitur in universa terra.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:bor e for chastising of all straying souls: not only men serve him through thee, but also the beasts of the field obey him.\"},{\"verse\":6,\"text\":\"For the industry of thy mind is spoken of among all nations, and it is told through the whole world, that thou only art excellent, and mighty in all his kingdom, and thy discipline is cried up in all provinces.\"},{\"verse\":7,\"text\":\"It is known also what Achior said, nor are we ignorant of what thou hast commanded to be done to him.\"},{\"verse\":8,\"text\":\"For it is certain that our God is so offended with sins, that he hath sent word by his prophets to the people, that he will deliver them up for their sins.\"},{\"verse\":9,\"text\":\"And because the children of Israel know they have offended their God, thy dread is upon them.\"},{\"verse\":10,\"text\":\"Moreover also a famine hath come upon them, and for drought of water they are already to be counted among the dead.\"},{\"verse\":11,\"text\":\"And they have a design even to kill their cattle, and to drink the blood of them.\"},{\"verse\":12,\"text\":\"And the consecrated things of the Lord their God which God forbade them to touch, in corn, wine, and oil, these have they purposed to make use of, and they design to consume the things which they ought not to touch with their hands: therefore because they do these things, it is certain they will be given up to destruction.\"},{\"verse\":13,\"text\":\"And I thy handmaid knowing this, am fled from them, and the Lord hath sent me to tell thee these very things.\"},{\"verse\":14,\"text\":\"For I thy handmaid worship God even now that I am with thee, and thy handmaid will go out, and I will pray to God,\"},{\"verse\":15,\"text\":\"And he will tell me when he will repay them for their sins, and I will come and tell thee, so that I may bring thee through the midst of Jerusalem, and thou shalt have all the people of Israel, as sheep that have no shepherd, and there shall not so much as one dog bark against thee:\"},{\"verse\":16,\"text\":\"Because these things are told me by the providence of God.\"},{\"verse\":17,\"text\":\"And because God is angry with them, I am sent to tell these very things to thee.\"},{\"verse\":18,\"text\":\"And all these words pleased Holofernes, and his servants, and they admired her wisdom, and they said one to another:\"},{\"verse\":19,\"text\":\"There is not such another woman upon earth in look, in beauty, and in sense of words.\"},{\"verse\":20,\"text\":\"And Holofernes said to her: God hath done well who sent thee before the people, that thou mightest give them into our hands:\"},{\"verse\":21,\"text\":\"And because thy promise is good, if thy God shall do this for me, he shall also be my God, and thou shalt be great in the house of Nabuchodonosor, and thy name shall be renowned through all the earth.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc Holofernes dixit ei : Æquo animo esto, et noli pavere in corde tuo : quoniam ego numquam nocui viro qui voluit servire Nabuchodonosor regi :\"},{\"verse\":2,\"text\":\"populus autem tuus, si non contempsisset me, non levassem lanceam meam super eum.\"},{\"verse\":3,\"text\":\"Nunc autem dic mihi, qua ex causa recessisti ab illis, et placuit tibi ut venires ad nos ?\"},{\"verse\":4,\"text\":\"Et dixit illi Judith : Sume verba ancillæ tuæ, quoniam si secutus fueris verba ancillæ tuæ, perfectam rem faciet Dominus tecum.\"},{\"verse\":5,\"text\":\"Vivit enim Nabuchodonosor rex terræ, et vivit virtus ejus, quæ est in te ad correptionem omnium animarum errantium : quoniam non solum homines serviunt illi per te, sed et bestiæ agri obtemperant illi.\"},{\"verse\":6,\"text\":\"Nuntiatur enim animi tui industria universis gentibus, et indicatum est omni sæculo quoniam tu solus bonus et potens es in omni regno ejus : et disciplina tua omnibus provinciis prædicatur.\"},{\"verse\":7,\"text\":\"Nec hoc latet, quod locutus est Achior, nec illud ignoratur, quod ei jusseris evenire.\"},{\"verse\":8,\"text\":\"Constat enim Deum nostrum sic peccatis offensum, ut mandaverit per prophetas suos ad populum quod tradat eum pro peccatis suis.\"},{\"verse\":9,\"text\":\"Et quoniam sciunt se offendisse Deum suum filii Israël, tremor tuus super ipsos est.\"},{\"verse\":10,\"text\":\"Insuper etiam fames invasit eos, et ab ariditate aquæ jam inter mortuos computantur.\"},{\"verse\":11,\"text\":\"Denique hoc ordinant, ut interficient pecora sua, et bibant sanguinem eorum :\"},{\"verse\":12,\"text\":\"et sancta Domini Dei sui, quæ præcepit Deus non contingi, in frumento, vino, et oleo, hæc cogitaverunt impendere, et volunt consumere quæ nec manibus deberent contingere : ergo quoniam hæc faciunt, certum est quod in perditionem dabuntur.\"},{\"verse\":13,\"text\":\"Quod ego ancilla tua cognoscens, fugi ab illis, et misit me Dominus hæc ipsa nuntiare tibi.\"},{\"verse\":14,\"text\":\"Ego enim ancilla tua Deum colo, etiam nunc apud te : et exiet ancilla tua, et orabo Deum,\"},{\"verse\":15,\"text\":\"et dicet mihi quando eis reddat peccatum suum, et veniens nuntiabo tibi, ita ut ego adducam te per mediam Jerusalem, et habebis omnem populum Israël, sicut oves quibus non est pastor, et non latrabit vel unus canis contra te :\"},{\"verse\":16,\"text\":\"quoniam hæc mihi dicta sunt per providentiam Dei,\"},{\"verse\":17,\"text\":\"et quoniam iratus est illis Deus, hæc ipsa missa sum nuntiare tibi.\"},{\"verse\":18,\"text\":\"Placuerunt autem omnia verba hæc coram Holoferne, et coram pueris ejus, et mirabantur sapientiam ejus, et dicebant alter ad alterum :\"},{\"verse\":19,\"text\":\"Non est talis mulier super terram in aspectu, in pulchritudine, et in sensu verborum.\"},{\"verse\":20,\"text\":\"Et dixit ad illam Holofernes : Benefecit Deus, qui misit te ante populum, ut des illum tu in manibus nostris :\"},{\"verse\":21,\"text\":\"et quoniam bona est promissio tua, si fecerit mihi hoc Deus tuus, erit et Deus meus, et tu in domo Nabuchodonosor magna eris, et nomen tuum nominabitur in universa terra.\"}],\"summary\":\"Judith’s speech to Holofernes.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":10,\"label\":\"Judith 10\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":12,\"label\":\"Judith 12\"}}]]\n"])</script></body></html>
