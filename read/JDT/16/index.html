leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Judith sung this canticle to the Lord, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Begin ye to the Lord with timbrels, sing ye to the Lord with cymbals, tune unto him a new psalm, extol and call upon his name.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The Lord putteth an end to wars, the Lord is his name.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He hath set his camp in the midst of his people, to deliver us from the hand of all our enemies.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The Assyrian came out of the mountains from the north in the multitude of his strength: his multitude stopped up the torrents, and their horses covered the valleys.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He bragged that he would set my borders on fire, and kill my young men with the sword, to make my infants a prey, and my virgins captives.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But the almighty Lord hath struck him, and hath delivered him into the hands of a woman, and hath slain him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For their mighty one did not fall by young men, neither did the sons of Titan strike him, nor tall giants oppose themselves to him, but Judith the daughter of Merari weakened him with the beauty of her face.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For she put off her the garments of widowhood, and put on her the garments of joy, to give joy to the children of Israel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>She anointed her face with ointment, and bound up her locks with a crown, she took a new robe to deceive him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Her sandals ravished his eyes, her beauty made his soul her captive, with a sword she cut off his head.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The Persians quaked at her constancy, and the Medes at her boldness.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then the camp of the Assyrians howled, when my lowly ones appeared, parched with thirst.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The sons of the damsels have pierced them through, and they have killed them like children fleeing away: they perished in battle before the face of the Lord my God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Let us sing a hymn to the Lord, let us sing a new hymn to our God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>O Adonai, Lord, great art thou, and glorious in thy power, and no one can overcome thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let all thy creatures serve thee: because thou hast spoken, and they were made: thou didst send forth thy spirit, and they were created, and there is no one that can resist thy voice.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The mountains shall be moved from the foundations with the waters: the rocks shall melt as wax before thy face.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But they that fear thee, shall be great with thee in all things.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Woe be to the nation that riseth up against my people: for the Lord almighty will take revenge on them, in the day of judgment he will visit them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For he will give fire, and worms into their flesh, that they may burn, and may feel for ever.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And it came to pass after these things, that all the people, after the victory, came to Jerusalem to adore the Lord: and as soon as they were purified, they all offered holocausts, and vows, and their promises.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Judith offered for an anathema of oblivion all the arms of Holofernes, which the people gave her, and the canopy that she had taken away out of his chamber.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the people were joyful in the sight of the sanctuary, and for three months the joy of this victory was celebrated with Judith.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And after those days every man returned to his house, and Judith was made great in Bethulia, and she was most renowned in all the land of Israel.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And chastity was joined to her virtue, so that she knew no man all the days of her life, after the death of Manasses her husband.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And on festival days she came forth with great glory.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And she abode in her husband’s house a hundred and five years, and made her handmaid free, and she died, and was buried with her husband in Bethulia.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And all the people mourned for seven days.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And all the time of her life there was none that troubled Israel, nor many years after her death.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But the day of the festivity of this victory is received by the Hebrews in the number of holy days, and is religiously observed by the Jews from that time until this day.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc cantavit canticum hoc Domino Judith, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Incipite Domino in tympanis ; cantate Domino in cymbalis ; modulamini illi psalmum novum : exaltate, et invocate nomen ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dominus conterens bella, Dominus nomen est illi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui posuit castra sua in medio populi sui, ut eriperet nos de manu omnium inimicorum nostrorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Venit Assur ex montibus ab aquilone in multitudine fortitudinis suæ : cujus multitudo obturavit torrentes, et equi eorum cooperuerunt valles.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixit se incensurum fines meos, et juvenes meos occisurum gladio ; infantes meos dare in prædam, et virgines in captivitatem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dominus autem omnipotens nocuit eum, et tradidit eum in manus feminæ, et confodit eum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non enim cecidit potens eorum a juvenibus, nec filii Titan percusserunt eum, nec excelsi gigantes opposuerunt se illi : sed Judith filia Merari in specie faciei suæ dissolvit eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Exuit enim se vestimento viduitatis, et induit se vestimento lætitiæ in exultatione filiorum Israël.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Unxit faciem suam unguento, et colligavit cincinnos suos mitra ; accepit stolam novam ad decipiendum illum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sandalia ejus rapuerunt oculos ejus ; pulchritudo ejus captivam fecit animam ejus : amputavit pugione cervicem ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Horruerunt Persæ constantiam ejus, et Medi audaciam ejus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tunc ululaverunt castra Assyriorum, quando apparuerunt humiles mei, arescentes in siti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Filii puellarum compunxerunt eos, et sicut pueros fugientes occiderunt eos : perierunt in prælio a facie Domini Dei mei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hymnum cantemus Domino ; hymnum novum cantemus Deo nostro.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Adonai Domine, magnus es tu, et præclarus in virtute tua : et quem superare nemo potest.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tibi serviat omnis creatura tua, quia dixisti, et facta sunt ; misisti spiritum tuum, et creata sunt : et non est qui resistat voci tuæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Montes a fundamentis movebuntur cum aquis ; petræ, sicut cera, liquescent ante faciem tuam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui autem timent te, magni erunt apud te per omnia.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Væ genti insurgenti super genus meum : Dominus enim omnipotens vindicabit in eis ; in die judicii visitabit illos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dabit enim ignem et vermes in carnes eorum, ut urantur et sentiant usque in sempiternum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et factum est post hæc, omnis populus post victoriam venit in Jerusalem adorare Dominum : et mox ut purificati sunt, obtulerunt omnes holocausta, et vota, et repromissiones suas.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Porro Judith universa vasa bellica Holofernis, quæ dedit illi populus, et conopeum quod ipsa sustulerat de cubili ipsius, obtulit in anathema oblivionis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Erat autem populus jucundus secundum faciem sanctorum : et per tres menses gaudium hujus victoriæ celebratum est cum Judith.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Post dies autem illos, unusquisque rediit in domum suam : et Judith magna facta est in Bethulia, et præclarior erat universæ terræ Israël.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Erat enim virtuti castitas adjuncta, ita ut non cognosceret virum omnibus diebus vitæ suæ, ex quo defunctus est Manasses vir ejus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Erat autem, diebus festis, procedens cum magna gloria.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mansit autem in domo viri sui annos centum quinque, et dimisit abram suam liberam : et defuncta est ac sepulta cum viro suo in Bethulia.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Luxitque illam omnis populus diebus septem.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>In omni autem spatio vitæ ejus non fuit qui perturbaret Israël, et post mortem ejus annis multis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Dies autem victoriæ hujus festivitatis ab Hebræis in numero sanctorum dierum accipitur, et colitur a Judæis ex illo tempore usque in præsentem diem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EST/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Esther 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ormat-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDT.16\",{\"bookId\":18,\"usfm\":\"JDT\",\"bookName\":\"Judith\",\"drName\":\"Judith\",\"chapter\":16,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"Then Judith sung this canticle to the Lord, saying:\"},{\"verse\":2,\"text\":\"Begin ye to the Lord with timbrels, sing ye to the Lord with cymbals, tune unto him a new psalm, extol and call upon his name.\"},{\"verse\":3,\"text\":\"The Lord putteth an end to wars, the Lord is his name.\"},{\"verse\":4,\"text\":\"He hath set his camp in the midst of his people, to deliver us from the hand of all our enemies.\"},{\"verse\":5,\"text\":\"The Assyrian came out of the mountains from the north in the multitude of his strength: his multitude stopped up the torrents, and their horses covered the valleys.\"},{\"verse\":6,\"text\":\"He bragged that he would set my borders on fire, and kill my young men with the sword, to make my infants a prey, and my virgins captives.\"},{\"verse\":7,\"text\":\"But the almighty Lord hath struck him, and hath delivered him into the hands of a woman, and hath slain him.\"},{\"verse\":8,\"text\":\"For their mighty one did not fall by young men, neither did the sons of Titan strike him, nor tall giants oppose themselves to him, but Judith the daughter of Merari weakened him with the beauty of her face.\"},{\"verse\":9,\"text\":\"For she put off her the garments of widowhood, and put on her the garments of joy, to give joy to the children of Israel.\"},{\"verse\":10,\"text\":\"She anointed her face with ointment, and bound up her locks with a crown, she took a new robe to deceive him.\"},{\"verse\":11,\"text\":\"Her sandals ravished his eyes, her beauty made his soul her captive, with a sword she cut off his head.\"},{\"verse\":12,\"text\":\"The Persians quaked at her constancy, and the Medes at her boldness.\"},{\"verse\":13,\"text\":\"Then the camp of the Assyrians howled, when my lowly ones appeared, parched with thirst.\"},{\"verse\":14,\"text\":\"The sons of the damsels have pierced them through, and they have killed them like children fleeing away: they perished in battle before the face of the Lord my God.\"},{\"verse\":15,\"text\":\"Let us sing a hymn to the Lord, let us sing a new hymn to our God.\"},{\"verse\":16,\"text\":\"O Adonai, Lord, great art thou, and glorious in thy power, and no one can overcome thee.\"},{\"verse\":17,\"text\":\"Let all thy creatures serve thee: because thou hast spoken, and they were made: thou didst send forth thy spirit, and they were created, and there is no one that can resist thy voice.\"},{\"verse\":18,\"text\":\"The mountains shall be moved from the foundations with the waters: the rocks shall melt as wax before thy face.\"},{\"verse\":19,\"text\":\"But they that fear thee, shall be great with thee in all things.\"},{\"verse\":20,\"text\":\"Woe be to the nation that riseth up against my people: for the Lord almighty will take revenge on them, in the day of judgment he will visit them.\"},{\"verse\":21,\"text\":\"For he will give fire, and worms into their flesh, that they may burn, and may feel for ever.\"},{\"verse\":22,\"text\":\"And it came to pass after these things, that all the people, after the victory, came to Jerusalem to adore the Lord: and as soon as they were purified, they all offered holocausts, and vows, and their promises.\"},{\"verse\":23,\"text\":\"And Judith offered for an anathema of oblivion all the arms of Holofernes, which the people gave her, and the canopy that she had taken away out of his chamber.\"},{\"verse\":24,\"text\":\"And the people were joyful in the sight of the sanctuary, and for three months the joy of this victory was celebrated with Judith.\"},{\"verse\":25,\"text\":\"And after those days every man returned to his house, and Judith was made great in Bethulia, and she was most renowned in all the land of Israel.\"},{\"verse\":26,\"text\":\"And chastity was joined to her virtue, so that she knew no man all the days of her life, after the death of Manasses her husband.\"},{\"verse\":27,\"text\":\"And on festival days she came forth with great glory.\"},{\"verse\":28,\"text\":\"And she abode in her husband’s house a hundred and five years, and made her handmaid free, and she died, and was buried with her husband in Bethulia.\"},{\"verse\":29,\"text\":\"And all the people mourned for seven days.\"},{\"verse\":30,\"text\":\"And all the time of her life there was none that troubled Israel, nor many years after her death.\"},{\"verse\":31,\"text\":\"But the day of the festivity of this victory is received by the Hebrews in the number of holy days, and is religiously observed by the Jews from that time until this day.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc cantavit canticum hoc Domino Judith, dicens :\"},{\"verse\":2,\"text\":\"Incipite Domino in tympanis ; cantate Domino in cymbalis ; modulamini illi psalmum novum : exaltate, et invocate nomen ejus.\"},{\"verse\":3,\"text\":\"Dominus conterens bella, Dominus nomen est illi.\"},{\"verse\":4,\"text\":\"Qui posuit castra sua in medio populi sui, ut eriperet nos de manu omnium inimicorum nostrorum.\"},{\"verse\":5,\"text\":\"Venit Assur ex montibus ab aquilone in multitudine fortitudinis suæ : cujus multitudo obturavit torrentes, et equi eorum cooperuerunt valles.\"},{\"verse\":6,\"text\":\"Dixit se incensurum fines meos, et juvenes meos occisurum gladio ; infantes meos dare in prædam, et virgines in captivitatem.\"},{\"verse\":7,\"text\":\"Dominus autem omnipotens nocuit eum, et tradidit eum in manus feminæ, et confodit eum.\"},{\"verse\":8,\"text\":\"Non enim cecidit potens eorum a juvenibus, nec filii Titan percusserunt eum, nec excelsi gigantes opposuerunt se illi : sed Judith filia Merari in specie faciei suæ dissolvit eum.\"},{\"verse\":9,\"text\":\"Exuit enim se vestimento viduitatis, et induit se vestimento lætitiæ in exultatione filiorum Israël.\"},{\"verse\":10,\"text\":\"Unxit faciem suam unguento, et colligavit cincinnos suos mitra ; accepit stolam novam ad decipiendum illum.\"},{\"verse\":11,\"text\":\"Sandalia ejus rapuerunt oculos ejus ; pulchritudo ejus captivam fecit animam ejus : amputavit pugione cervicem ejus.\"},{\"verse\":12,\"text\":\"Horruerunt Persæ constantiam ejus, et Medi audaciam ejus.\"},{\"verse\":13,\"text\":\"Tunc ululaverunt castra Assyriorum, quando apparuerunt humiles mei, arescentes in siti.\"},{\"verse\":14,\"text\":\"Filii puellarum compunxerunt eos, et sicut pueros fugientes occiderunt eos : perierunt in prælio a facie Domini Dei mei.\"},{\"verse\":15,\"text\":\"Hymnum cantemus Domino ; hymnum novum cantemus Deo nostro.\"},{\"verse\":16,\"text\":\"Adonai Domine, magnus es tu, et præclarus in virtute tua : et quem superare nemo potest.\"},{\"verse\":17,\"text\":\"Tibi serviat omnis creatura tua, quia dixisti, et facta sunt ; misisti spiritum tuum, et creata sunt : et non est qui resistat voci tuæ.\"},{\"verse\":18,\"text\":\"Montes a fundamentis movebuntur cum aquis ; petræ, sicut cera, liquescent ante faciem tuam.\"},{\"verse\":19,\"text\":\"Qui autem timent te, magni erunt apud te per omnia.\"},{\"verse\":20,\"text\":\"Væ genti insurgenti super genus meum : Dominus enim omnipotens vindicabit in eis ; in die judicii visitabit illos.\"},{\"verse\":21,\"text\":\"Dabit enim ignem et vermes in carnes eorum, ut urantur et sentiant usque in sempiternum.\"},{\"verse\":22,\"text\":\"Et factum est post hæc, omnis populus post victoriam venit in Jerusalem adorare Dominum : et mox ut purificati sunt, obtulerunt omnes holocausta, et vota, et repromissiones suas.\"},{\"verse\":23,\"text\":\"Porro Judith universa vasa bellica Holofernis, quæ dedit illi populus, et conopeum quod ipsa sustulerat de cubili ipsius, obtulit in anathema oblivionis.\"},{\"verse\":24,\"text\":\"Erat autem populus jucundus secundum faciem sanctorum : et per tres menses gaudium hujus victoriæ celebratum est cum Judith.\"},{\"verse\":25,\"text\":\"Post dies autem illos, unusquisque rediit in domum suam : et Judith magna facta est in Bethulia, et præclarior erat universæ terræ Israël.\"},{\"verse\":26,\"text\":\"Erat enim virtuti castitas adjuncta, ita ut non cognosceret virum omnibus diebus vitæ suæ, ex quo defunctus est Manasses vir ejus.\"},{\"verse\":27,\"text\":\"Erat autem, diebus festis, procedens cum magna gloria.\"},{\"verse\":28,\"text\":\"Mansit autem in domo viri sui annos centum quinque, et dimisit abram suam liberam : et defuncta est ac sepulta cum viro suo in Bethulia.\"},{\"verse\":29,\"text\":\"Luxitque illam omnis populus diebus septem.\"},{\"verse\":30,\"text\":\"In omni autem spatio vitæ ejus non fuit qui perturbaret Israël, et post mortem ejus annis multis.\"},{\"verse\":31,\"text\":\"Dies autem victoriæ hujus festivitatis ab Hebræis in numero sanctorum dierum accipitur, et colitur a Judæis ex illo tempore usque in præsentem diem.\"}],\"summary\":\"The canticle of Judith: her virtuous life and death.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":15,\"label\":\"Judith 15\"},\"next\":{\"usfm\":\"EST\",\"chapter\":1,\"label\":\"Esther 1\"}}]]\n"])</script></body></html>
