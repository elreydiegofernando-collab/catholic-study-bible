ra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then he ordered that she should go in where his treasures were laid up, and bade her tarry there, and he appointed what should be given her from his own table.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Judith answered him and said: Now I cannot eat of these things which thou commandest to be given me, lest sin come upon me: but I will eat of the things which I have brought.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Holofernes said to her: If these things which thou hast brought with thee fail thee, what shall we do for thee?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Judith said: As thy soul liveth, my lord, thy handmaid shall not spend all these things till God do by my hand that which I have purposed. And his servants brought her into the tent which he had commanded.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when she was going in, she desired that she might have liberty to go out at night and before day to prayer, and to beseech the Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he commanded his chamberlains, that she might go out and in, to adore her God as she pleased, for three days.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And she went out in the nights into the valley of Bethulia, and washed herself in a fountain of water.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And as she came up, she prayed to the Lord the God of Israel, that he would direct her way to the deliverance of his people.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And going in, she remained pure in the tent, until she took her own meat in the evening.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And it came to pass on the fourth day, that Holofernes made a supper for his servants, and said to Vagao his eunuch: Go, and persuade that Hebrew woman, to consent of her own accord to dwell with me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For it is looked upon as shameful among the Assyrians, if a woman mock a man, by doing so as to pass free from him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then Vagao went in to Judith, and said: Let not my good maid be afraid to go in to my lord, that she may be honoured before his face, that she may eat with him and drink wine and be merry.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Judith answered him: Who am I, that I should gainsay my lord?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>All that shall be good and best before his eyes, I will do. And whatsoever shall please him, that shall be best to me all the days of my life.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And she arose and dressed herself out with her garments, and going in she stood before his face.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the heart of Holofernes was smitten, for he was burning with the desire of her.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Holofernes said to her: Drink now, and sit down and be merry; for thou hast found favour before me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Judith said: I will drink my lord, because my life is magnified this day above all my days.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And she took and ate and drank before him what her maid had prepared for her.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Holofernes was made merry on her occasion, and drank exceeding much wine, so much as he had never drunk in his life.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc jussit eam introire ubi repositi erant thesauri ejus, et jussit illic manere eam, et constituit quid daretur illi de convivio suo.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cui respondit Judith, et dixit : Nunc non potero manducare ex his quæ mihi præcipis tribui, ne veniat super me offensio : ex his autem quæ mihi detuli, manducabo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cui Holofernes ait : Si defecerint tibi ista, quæ tecum detulisti, quid faciemus tibi ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dixit Judith : Vivit anima tua, domine meus, quoniam non expendet omnia hæc ancilla tua, donec faciat Deus in manu mea hæc quæ cogitavi. Et induxerunt illam servi ejus in tabernaculum quod præceperat.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et petiit dum introiret, ut daretur ei copia nocte et ante lucem egrediendi foras ad orationem, et deprecandi Dominum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et præcepit cubiculariis suis ut sicut placeret illi, exiret et introiret ad adorandum Deum suum per triduum :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et exibat noctibus in vallem Bethuliæ, et baptizabat se in fonte aquæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ut ascendebat, orabat Dominum Deum Israël ut dirigeret viam ejus ad liberationem populi sui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et introiens, munda manebat in tabernaculo usque dum acciperet escam suam in vespere.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et factum est, in quarto die Holofernes fecit cœnam servis suis, et dixit ad Vagao eunuchum suum : Vade, et suade Hebræam illam ut sponte consentiat habitare mecum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fœdum est enim apud Assyrios, si femina irrideat virum agendo ut immunis ab eo transeat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tunc introivit Vagao ad Judith, et dixit : Non vereatur bona puella introire ad dominum meum, ut honorificetur ante faciem ejus, ut manducet cum eo, et bibat vinum in jucunditate.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cui Judith respondit : Quæ ego sum, ut contradicam domino meo ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>omne quod erit ante oculos ejus bonum et optimum, faciam. Quidquid autem illi placuerit, hoc mihi erit optimum omnibus diebus vitæ meæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et surrexit, et ornavit se vestimento suo, et ingressa stetit ante faciem ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cor autem Holofernes concussum est : erat enim ardens in concupiscentia ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et dixit ad eam Holofernes : Bibe nunc, et accumbe in jucunditate, quoniam invenisti gratiam coram me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et dixit Judith : Bibam, domine, quoniam magnificata est anima mea hodie præ omnibus diebus meis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et accepit, et manducavit et bibit coram ipso ea quæ paraverat illi ancilla ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et jucundus factus est Holofernes ad eam, bibitque vinum multum nimis, quantum numquam biberat in vita sua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 11</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/13/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 13</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->12<!-- --> of <!-- -->16<!-- --> · swipe left or \"},{\"verse\":7,\"text\":\"And she went out in the nights into the valley of Bethulia, and washed herself in a fountain of water.\"},{\"verse\":8,\"text\":\"And as she came up, she prayed to the Lord the God of Israel, that he would direct her way to the deliverance of his people.\"},{\"verse\":9,\"text\":\"And going in, she remained pure in the tent, until she took her own meat in the evening.\"},{\"verse\":10,\"text\":\"And it came to pass on the fourth day, that Holofernes made a supper for his servants, and said to Vagao his eunuch: Go, and persuade that Hebrew woman, to consent of her own accord to dwell with me.\"},{\"verse\":11,\"text\":\"For it is looked upon as shameful among the Assyrians, if a woman mock a man, by doing so as to pass free from him.\"},{\"verse\":12,\"text\":\"Then Vagao went in to Judith, and said: Let not my good maid be afraid to go in to my lord, that she may be honoured before his face, that she may eat with him and drink wine and be merry.\"},{\"verse\":13,\"text\":\"And Judith answered him: Who am I, that I should gainsay my lord?\"},{\"verse\":14,\"text\":\"All that shall be good and best before his eyes, I will do. And whatsoever shall please him, that shall be best to me all the days of my life.\"},{\"verse\":15,\"text\":\"And she arose and dressed herself out with her garments, and going in she stood before his face.\"},{\"verse\":16,\"text\":\"And the heart of Holofernes was smitten, for he was burning with the desire of her.\"},{\"verse\":17,\"text\":\"And Holofernes said to her: Drink now, and sit down and be merry; for thou hast found favour before me.\"},{\"verse\":18,\"text\":\"And Judith said: I will drink my lord, because my life is magnified this day above all my days.\"},{\"verse\":19,\"text\":\"And she took and ate and drank before him what her maid had prepared for her.\"},{\"verse\":20,\"text\":\"And Holofernes was made merry on her occasion, and drank exceeding much wine, so much as he had never drunk in his life.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc jussit eam introire ubi repositi erant thesauri ejus, et jussit illic manere eam, et constituit quid daretur illi de convivio suo.\"},{\"verse\":2,\"text\":\"Cui respondit Judith, et dixit : Nunc non potero manducare ex his quæ mihi præcipis tribui, ne veniat super me offensio : ex his autem quæ mihi detuli, manducabo.\"},{\"verse\":3,\"text\":\"Cui Holofernes ait : Si defecerint tibi ista, quæ tecum detulisti, quid faciemus tibi ?\"},{\"verse\":4,\"text\":\"Et dixit Judith : Vivit anima tua, domine meus, quoniam non expendet omnia hæc ancilla tua, donec faciat Deus in manu mea hæc quæ cogitavi. Et induxerunt illam servi ejus in tabernaculum quod præceperat.\"},{\"verse\":5,\"text\":\"Et petiit dum introiret, ut daretur ei copia nocte et ante lucem egrediendi foras ad orationem, et deprecandi Dominum.\"},{\"verse\":6,\"text\":\"Et præcepit cubiculariis suis ut sicut placeret illi, exiret et introiret ad adorandum Deum suum per triduum :\"},{\"verse\":7,\"text\":\"et exibat noctibus in vallem Bethuliæ, et baptizabat se in fonte aquæ.\"},{\"verse\":8,\"text\":\"Et ut ascendebat, orabat Dominum Deum Israël ut dirigeret viam ejus ad liberationem populi sui.\"},{\"verse\":9,\"text\":\"Et introiens, munda manebat in tabernaculo usque dum acciperet escam suam in vespere.\"},{\"verse\":10,\"text\":\"Et factum est, in quarto die Holofernes fecit cœnam servis suis, et dixit ad Vagao eunuchum suum : Vade, et suade Hebræam illam ut sponte consentiat habitare mecum.\"},{\"verse\":11,\"text\":\"Fœdum est enim apud Assyrios, si femina irrideat virum agendo ut immunis ab eo transeat.\"},{\"verse\":12,\"text\":\"Tunc introivit Vagao ad Judith, et dixit : Non vereatur bona puella introire ad dominum meum, ut honorificetur ante faciem ejus, ut manducet cum eo, et bibat vinum in jucunditate.\"},{\"verse\":13,\"text\":\"Cui Judith respondit : Quæ ego sum, ut contradicam domino meo ?\"},{\"verse\":14,\"text\":\"omne quod erit ante oculos ejus bonum et optimum, faciam. Quidquid autem illi placuerit, hoc mihi erit optimum omnibus diebus vitæ meæ.\"},{\"verse\":15,\"text\":\"Et surrexit, et ornavit se vestimento suo, et ingressa stetit ante faciem ejus.\"},{\"verse\":16,\"text\":\"Cor autem Holofernes concussum est : erat enim ardens in concupiscentia ejus.\"},{\"verse\":17,\"text\":\"Et dixit ad eam Holofernes : Bibe nunc, et accumbe in jucunditate, quoniam invenisti gratiam coram me.\"},{\"verse\":18,\"text\":\"Et dixit Judith : Bibam, domine, quoniam magnificata est anima mea hodie præ omnibus diebus meis.\"},{\"verse\":19,\"text\":\"Et accepit, et manducavit et bibit coram ipso ea quæ paraverat illi ancilla ejus.\"},{\"verse\":20,\"text\":\"Et jucundus factus est Holofernes ad eam, bibitque vinum multum nimis, quantum numquam biberat in vita sua.\"}],\"summary\":\"Judith goeth out in the night to pray: she is invited to a banquet with Holofernes.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":11,\"label\":\"Judith 11\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":13,\"label\":\"Judith 13\"}}]]\n"])</script></body></html>
