1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Judith<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JDT/">About <!-- -->Judith</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Achior gives Holofernes an account of the people of Israel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it was told Holofernes the general of the army of the Assyrians, that the children of Israel prepared themselves to resist, and had shut up the ways of the mountains.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he was transported with exceeding great fury and indignation, and he called all the princes of Moab and the leaders of Ammon.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said to them: Tell me what is this people that besetteth the mountains: or what are their cities, and of what sort, and how great: also what is their power, or what is their multitude: or who is the king over their warfare:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And why they above all that dwell in the east, have despised us, and have not come out to meet us, that they might receive us with peace?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Then Achior captain of all the children of Ammon answering, said; If thou vouchsafe, my lord, to hear, I will tell the truth in thy sight concerning this people, that dwelleth in the mountains, and there shall not a false word come out of my mouth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>This people is of the offspring of the Chaldeans.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>They dwelt first in Mesopotamia, because they would not follow the gods of their fathers, who were in the land of the Chaldeans.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wherefore forsaking the ceremonies of their fathers, which consisted in the worship of many gods,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They worshipped one God of heaven, who also commanded them to depart from thence, and to dwell in Charan. And when there was a famine over all the land, they went down into Egypt, and there for four hundred years were so multiplied, that the army of them could not be numbered.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when the king of Egypt oppressed them, and made slaves of them to labour in clay and brick, in the building of his cities, they cried to their Lord, and he struck the whole land of Egypt with divers plagues.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when the Egyptians had cast them out from them, and the plague had ceased from them, and they had a mind to take them again, and bring them back to their service,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The God of heaven opened the sea to them in their flight, so that the waters were made to stand firm as a wall on either side, and they walked through the bottom of the sea and passed it dry foot.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when an innumerable army of the Egyptians pursued after them in that place, they were so overwhelmed with the waters, that there was not one left, to tell what had happened to posterity.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>After they came out of the Red Sea, they abode in the deserts of mount Sina, in which never man could dwell, or son of man rested.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>There bitter fountains were made sweet for them to drink, and for forty years they received food from heaven.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Wheresoever they went in without bow and arrow, and without shield and sword, their God fought for them and overcame.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And there was no one that triumphed over this people, but when they departed from the worship of the Lord their God.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But as often as beside their own God, they worshipped any other, they were given to spoil and to the sword, and to reproach.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And as often as they were penitent for having revolted from the worship of their God, the God of heaven gave them power to resist.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>So they overthrew the king of the Chanaanites, and of the Jebusites, and of the Pherezites, and of the Hethites, and of the Hevites, and of the Amorrhites, and all the mighty ones in Hesebon, and they possessed their lands, and their cities:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And as long as they sinned not in the sight of their God, it was well with them: for their God hateth iniquity.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And even some years ago when they had revolted from the way which God had given them to walk therein, they were destroyed in battles by many nations and very many of them were led away captive into a strange land.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But of late returning to the Lord their God, from the different places wherein they were scattered, they are come together and are gone up into all these mountains, and possess Jerusalem again, where their holies are.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Now therefore, my lord, search if there be any iniquity of theirs in the sight of their God: let us go up to them, because their God will surely deliver them to thee, and they shall be brought under the yoke of thy power:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But if there be no offence of this people in the sight of their God, we cannot resist them because their God will defend them: and we shall be a reproach to the whole earth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And it came to pass, when Achior had ceased to speak these words, all the great men of Holofernes were angry, and they had a mind to kill him, saying to each other:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Who is this, that saith the children of Israel can resist king Nabuchodonosor, and his armies, men unarmed, and without force, and without skill in the art of war?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>That Achior therefore may know that he deceiveth us, let us go up into the mountains: and when the bravest of them shall be taken, then shall he with them be stabbed with the sword,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>That every nation may know that Nabuchodonosor is god of the earth, and besides him there is no other.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Nuntiatumque est Holoferni principi militiæ Assyriorum, quod filii Israël præpararent se ad resistendum, ac montium itinera conclusissent :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et furore nimio exarsit in iracundia magna, vocavitque omnes principes Moab et duces Ammon,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et dixit eis : Dicite mihi quis sit populus iste, qui montana obsidet : aut quæ, et quales, et quantæ sint civitates eorum : quæ etiam sit virtus eorum, aut quæ sit multitudo eorum, vel quis rex militiæ illorum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et quare præ omnibus qui habitant in oriente, isti contempserunt nos, et non exierunt obviam nobis ut susciperent nos cum pace ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tunc Achior dux omnium filiorum Ammon respondens, ait : Si digneris audire, domine mi, dicam veritatem in conspectu tuo de populo isto qui in montanis habitat, et non egredietur verbum falsum ex ore meo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Populus iste ex progenie Chaldæorum est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Hic primum in Mesopotamia habitavit, quoniam noluerunt sequi deos patrum suorum, qui erant in terra Chaldæorum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Deserentes itaque cæremonias patrum suorum, quæ in multitudine deorum erant,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>unum Deum cæli coluerunt, qui et præcepit eis ut exirent inde et habitarent in Charan. Cumque operuisset omnem terram fames, descenderunt in Ægyptum, illicque per quadringentos annos sic multiplicati sunt, ut dinumerari eorum non posset exercitus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque gravaret eos rex Ægypti, atque in ædificationibus urbium suarum in luto et latere subjugasset eos, clamaverunt ad Dominum suum, et percussit totam terram Ægypti plagis variis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cumque ejecissent eos Ægyptii a se, et cessasset plaga ab eis, et iterum eos vellent capere, et ad suum servitium revocare,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>fugientibus his, Deus cæli mare aperuit, ita ut hinc inde aquæ quasi murus solidarentur, et isti pede sicco fundum maris perambulando transirent.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In quo loco dum innumerabilis exercitus Ægyptiorum eos persequeretur, ita aquis coopertus est, ut non remaneret vel unus, qui factum posteris nuntiaret.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Egressi vero mare Rubrum, deserta Sina montis occupaverunt, in quibus numquam homo habitare potuit, vel filius hominis requievit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Illic fontes amari obdulcati sunt eis ad bibendum, et per annos quadraginta annonam de cælo consecuti sunt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ubicumque ingressi sunt sine arcu et sagitta, et absque scuto et gladio, Deus eorum pugnavit pro eis, et vicit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et non fuit qui insultaret populo isti, nisi quando recessit a cultu Domini Dei sui.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quotiescumque autem præter ipsum Deum suum, alterum coluerunt, dati sunt in prædam, et in gladium, et in opprobrium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quotiescumque autem pœnituerunt se recessisse a cultura Dei sui, dedit eis Deus cæli virtutem resistendi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Denique Chananæum regem, et Jebusæum, et Pherezæum, et Hethæum, et Hevæum, et Amorrhæum, et omnes potentes in Hesebon prostraverunt, et terras eorum et civitates eorum ipsi possederunt :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et usque dum non peccarent in conspectu Dei sui, erant cum illis bona : Deus enim illorum odit iniquitatem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nam et ante hos annos cum recessissent a via quam dederat illis Deus ut ambularent in ea, exterminati sunt præliis a multis nationibus, et plurimi eorum captivi abducti sunt in terram non suam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Nuper autem reversi ad Dominum Deum suum, ex dispersione qua dispersi fuerant, adunati sunt, et ascenderunt montana hæc omnia, et iterum possident Jerusalem, ubi sunt sancta eorum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nunc ergo mi domine, perquire si est aliqua iniquitas eorum in conspectu Dei eorum : ascendamus ad illos, quoniam tradens tradet illos Deus eorum tibi, et subjugati erunt sub jugo potentiæ tuæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Si vero non est offensio populi hujus coram Deo suo, non poterimus resistere illis, quoniam Deus eorum defendet illos : et erimus in opprobrium universæ terræ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et factum est, cum cessasset loqui Achior verba hæc, irati sunt omnes magnates Holofernis, et cogitabant interficere eum, dicentes ad alterutrum :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quis est iste, qui filios Israël posse dicat resistere regi Nabuchodonosor et exercitibus ejus, homines inermes, et sine virtute, et sine peritia artis pugnæ ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ut ergo agnoscat Achior quoniam fallit nos, ascendamus in montana : et cum capti fuerint potentes eorum, tunc cum eisdem gladio transverberabitur :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>ut sciat omnis gens quoniam Nabuchodonosor deus terræ est, et præter ipsum alius non est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a ar heir fathers, which consisted in the worship of many gods,\"},{\"verse\":9,\"text\":\"They worshipped one God of heaven, who also commanded them to depart from thence, and to dwell in Charan. And when there was a famine over all the land, they went down into Egypt, and there for four hundred years were so multiplied, that the army of them could not be numbered.\"},{\"verse\":10,\"text\":\"And when the king of Egypt oppressed them, and made slaves of them to labour in clay and brick, in the building of his cities, they cried to their Lord, and he struck the whole land of Egypt with divers plagues.\"},{\"verse\":11,\"text\":\"And when the Egyptians had cast them out from them, and the plague had ceased from them, and they had a mind to take them again, and bring them back to their service,\"},{\"verse\":12,\"text\":\"The God of heaven opened the sea to them in their flight, so that the waters were made to stand firm as a wall on either side, and they walked through the bottom of the sea and passed it dry foot.\"},{\"verse\":13,\"text\":\"And when an innumerable army of the Egyptians pursued after them in that place, they were so overwhelmed with the waters, that there was not one left, to tell what had happened to posterity.\"},{\"verse\":14,\"text\":\"After they came out of the Red Sea, they abode in the deserts of mount Sina, in which never man could dwell, or son of man rested.\"},{\"verse\":15,\"text\":\"There bitter fountains were made sweet for them to drink, and for forty years they received food from heaven.\"},{\"verse\":16,\"text\":\"Wheresoever they went in without bow and arrow, and without shield and sword, their God fought for them and overcame.\"},{\"verse\":17,\"text\":\"And there was no one that triumphed over this people, but when they departed from the worship of the Lord their God.\"},{\"verse\":18,\"text\":\"But as often as beside their own God, they worshipped any other, they were given to spoil and to the sword, and to reproach.\"},{\"verse\":19,\"text\":\"And as often as they were penitent for having revolted from the worship of their God, the God of heaven gave them power to resist.\"},{\"verse\":20,\"text\":\"So they overthrew the king of the Chanaanites, and of the Jebusites, and of the Pherezites, and of the Hethites, and of the Hevites, and of the Amorrhites, and all the mighty ones in Hesebon, and they possessed their lands, and their cities:\"},{\"verse\":21,\"text\":\"And as long as they sinned not in the sight of their God, it was well with them: for their God hateth iniquity.\"},{\"verse\":22,\"text\":\"And even some years ago when they had revolted from the way which God had given them to walk therein, they were destroyed in battles by many nations and very many of them were led away captive into a strange land.\"},{\"verse\":23,\"text\":\"But of late returning to the Lord their God, from the different places wherein they were scattered, they are come together and are gone up into all these mountains, and possess Jerusalem again, where their holies are.\"},{\"verse\":24,\"text\":\"Now therefore, my lord, search if there be any iniquity of theirs in the sight of their God: let us go up to them, because their God will surely deliver them to thee, and they shall be brought under the yoke of thy power:\"},{\"verse\":25,\"text\":\"But if there be no offence of this people in the sight of their God, we cannot resist them because their God will defend them: and we shall be a reproach to the whole earth.\"},{\"verse\":26,\"text\":\"And it came to pass, when Achior had ceased to speak these words, all the great men of Holofernes were angry, and they had a mind to kill him, saying to each other:\"},{\"verse\":27,\"text\":\"Who is this, that saith the children of Israel can resist king Nabuchodonosor, and his armies, men unarmed, and without force, and without skill in the art of war?\"},{\"verse\":28,\"text\":\"That Achior therefore may know that he deceiveth us, let us go up into the mountains: and when the bravest of them shall be taken, then shall he with them be stabbed with the sword,\"},{\"verse\":29,\"text\":\"That every nation may know that Nabuchodonosor is god of the earth, and besides him there is no other.\"}],\"vul\":[{\"verse\":1,\"text\":\"Nuntiatumque est Holoferni principi militiæ Assyriorum, quod filii Israël præpararent se ad resistendum, ac montium itinera conclusissent :\"},{\"verse\":2,\"text\":\"et furore nimio exarsit in iracundia magna, vocavitque omnes principes Moab et duces Ammon,\"},{\"verse\":3,\"text\":\"et dixit eis : Dicite mihi quis sit populus iste, qui montana obsidet : aut quæ, et quales, et quantæ sint civitates eorum : quæ etiam sit virtus eorum, aut quæ sit multitudo eorum, vel quis rex militiæ illorum :\"},{\"verse\":4,\"text\":\"et quare præ omnibus qui habitant in oriente, isti contempserunt nos, et non exierunt obviam nobis ut susciperent nos cum pace ?\"},{\"verse\":5,\"text\":\"Tunc Achior dux omnium filiorum Ammon respondens, ait : Si digneris audire, domine mi, dicam veritatem in conspectu tuo de populo isto qui in montanis habitat, et non egredietur verbum falsum ex ore meo.\"},{\"verse\":6,\"text\":\"Populus iste ex progenie Chaldæorum est.\"},{\"verse\":7,\"text\":\"Hic primum in Mesopotamia habitavit, quoniam noluerunt sequi deos patrum suorum, qui erant in terra Chaldæorum.\"},{\"verse\":8,\"text\":\"Deserentes itaque cæremonias patrum suorum, quæ in multitudine deorum erant,\"},{\"verse\":9,\"text\":\"unum Deum cæli coluerunt, qui et præcepit eis ut exirent inde et habitarent in Charan. Cumque operuisset omnem terram fames, descenderunt in Ægyptum, illicque per quadringentos annos sic multiplicati sunt, ut dinumerari eorum non posset exercitus.\"},{\"verse\":10,\"text\":\"Cumque gravaret eos rex Ægypti, atque in ædificationibus urbium suarum in luto et latere subjugasset eos, clamaverunt ad Dominum suum, et percussit totam terram Ægypti plagis variis.\"},{\"verse\":11,\"text\":\"Cumque ejecissent eos Ægyptii a se, et cessasset plaga ab eis, et iterum eos vellent capere, et ad suum servitium revocare,\"},{\"verse\":12,\"text\":\"fugientibus his, Deus cæli mare aperuit, ita ut hinc inde aquæ quasi murus solidarentur, et isti pede sicco fundum maris perambulando transirent.\"},{\"verse\":13,\"text\":\"In quo loco dum innumerabilis exercitus Ægyptiorum eos persequeretur, ita aquis coopertus est, ut non remaneret vel unus, qui factum posteris nuntiaret.\"},{\"verse\":14,\"text\":\"Egressi vero mare Rubrum, deserta Sina montis occupaverunt, in quibus numquam homo habitare potuit, vel filius hominis requievit.\"},{\"verse\":15,\"text\":\"Illic fontes amari obdulcati sunt eis ad bibendum, et per annos quadraginta annonam de cælo consecuti sunt.\"},{\"verse\":16,\"text\":\"Ubicumque ingressi sunt sine arcu et sagitta, et absque scuto et gladio, Deus eorum pugnavit pro eis, et vicit.\"},{\"verse\":17,\"text\":\"Et non fuit qui insultaret populo isti, nisi quando recessit a cultu Domini Dei sui.\"},{\"verse\":18,\"text\":\"Quotiescumque autem præter ipsum Deum suum, alterum coluerunt, dati sunt in prædam, et in gladium, et in opprobrium.\"},{\"verse\":19,\"text\":\"Quotiescumque autem pœnituerunt se recessisse a cultura Dei sui, dedit eis Deus cæli virtutem resistendi.\"},{\"verse\":20,\"text\":\"Denique Chananæum regem, et Jebusæum, et Pherezæum, et Hethæum, et Hevæum, et Amorrhæum, et omnes potentes in Hesebon prostraverunt, et terras eorum et civitates eorum ipsi possederunt :\"},{\"verse\":21,\"text\":\"et usque dum non peccarent in conspectu Dei sui, erant cum illis bona : Deus enim illorum odit iniquitatem.\"},{\"verse\":22,\"text\":\"Nam et ante hos annos cum recessissent a via quam dederat illis Deus ut ambularent in ea, exterminati sunt præliis a multis nationibus, et plurimi eorum captivi abducti sunt in terram non suam.\"},{\"verse\":23,\"text\":\"Nuper autem reversi ad Dominum Deum suum, ex dispersione qua dispersi fuerant, adunati sunt, et ascenderunt montana hæc omnia, et iterum possident Jerusalem, ubi sunt sancta eorum.\"},{\"verse\":24,\"text\":\"Nunc ergo mi domine, perquire si est aliqua iniquitas eorum in conspectu Dei eorum : ascendamus ad illos, quoniam tradens tradet illos Deus eorum tibi, et subjugati erunt sub jugo potentiæ tuæ.\"},{\"verse\":25,\"text\":\"Si vero non est offensio populi hujus coram Deo suo, non poterimus resistere illis, quoniam Deus eorum defendet illos : et erimus in opprobrium universæ terræ.\"},{\"verse\":26,\"text\":\"Et factum est, cum cessasset loqui Achior verba hæc, irati sunt omnes magnates Holofernis, et cogitabant interficere eum, dicentes ad alterutrum :\"},{\"verse\":27,\"text\":\"Quis est iste, qui filios Israël posse dicat resistere regi Nabuchodonosor et exercitibus ejus, homines inermes, et sine virtute, et sine peritia artis pugnæ ?\"},{\"verse\":28,\"text\":\"Ut ergo agnoscat Achior quoniam fallit nos, ascendamus in montana : et cum capti fuerint potentes eorum, tunc cum eisdem gladio transverberabitur :\"},{\"verse\":29,\"text\":\"ut sciat omnis gens quoniam Nabuchodonosor deus terræ est, et præter ipsum alius non est.\"}],\"summary\":\"Achior gives Holofernes an account of the people of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":4,\"label\":\"Judith 4\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":6,\"label\":\"Judith 6\"}}]]\n"])</script></body></html>
