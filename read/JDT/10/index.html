serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass, when she had ceased to cry to the Lord, that she rose from the place wherein she lay prostrate before the Lord.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And she called her maid, and going down into her house she took off her haircloth, and put away the garments of her widowhood,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And she washed her body, and anointed herself with the best ointment, and plaited the hair of her head, and put a bonnet upon her head, and clothed herself with the garments of her gladness, and put sandals on her feet, and took her bracelets, and lilies, and earlets, and rings, and adorned herself with all her ornaments.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the Lord also gave her more beauty: because all this dressing up did not proceed from sensuality, but from virtue: and therefore the Lord increased this her beauty, so that she appeared to all men’s eyes incomparably lovely.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And she gave to her maid a bottle of wine to carry, and a vessel of oil, and parched corn, and dry figs, and bread and cheese, and went out.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when they came to the gate of the city, they found Ozias, and the ancients of the city waiting.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when they saw her they were astonished, and admired her beauty exceedingly.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But they asked her no question, only they let her pass, saying: The God of our fathers give thee grace, and may he strengthen all the counsel of thy heart with his power, that Jerusalem may glory in thee, and thy name may be in the number of the holy and just.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And they that were there said, all with one voice: So be it, so be it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But Judith praying to the Lord, passed through the gates, she and her maid.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And it came to pass, when she went down the hill, about break of day, that the watchmen of the Assyrians met her, and stopped her, saying: Whence comest thou or whither goest thou?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And she answered: I am a daughter of the Hebrews, and I am fled from them, because I knew they would be made a prey to you, because they despised you, and would not of their own accord yield themselves, that they might find mercy in your sight.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For this reason I thought with myself, saying: I will go to the presence of the prince Holofernes, that I may tell him their secrets, and shew him by what way he may take them, without the loss of one man of his army.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when the men had heard her words, they beheld her face, and their eyes were amazed, for they wondered exceedingly at her beauty.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they said to her: Thou hast saved thy life by taking this resolution, to come down to our lord.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And be assured of this, that when thou shalt stand before him, he will treat thee well, and thou wilt be most acceptable to his heart. And they brought her to the tent of Holofernes, telling him of her.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when she was come into his presence, forthwith Holofernes was caught by his eyes.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And his officers said to him: Who can despise the people of the Hebrews, who have such beautiful women, that we should not think it worth our while for their sakes to fight against them?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Judith seeing Holofernes sitting under a canopy, which was woven of purple and gold, with emeralds and precious stones:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>After she had looked on his face, bowed down to him, prostrating herself to the ground. And the servants of Holofernes lifted her up, by the command of their master.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem, cum cessasset clamare ad Dominum, surrexit de loco in quo jacuerat prostrata ad Dominum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vocavitque abram suam, et descendens in domum suam, abstulit a se cilicium, et exuit se vestimentis viduitatis suæ,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et lavit corpus suum, et unxit se myro optimo, et discriminavit crinem capitis sui, et imposuit mitram super caput suum, et induit se vestimentis jucunditatis suæ, induitque sandalia pedibus suis, assumpsitque dextraliola, et lilia, et inaures, et annulos, et omnibus ornamentis suis ornavit se.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cui etiam Dominus contulit splendorem : quoniam omnis ista compositio non ex libidine, sed ex virtute pendebat : et ideo Dominus hanc in illam pulchritudinem ampliavit, ut incomparabili decore omnium oculis appareret.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Imposuit itaque abræ suæ ascoperam vini, et vas olei, et polentam, et palathas, et panes, et caseum, et profecta est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cumque venissent ad portam civitatis, invenerunt expectantem Oziam et presbyteros civitatis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui cum vidissent eam, stupentes mirati sunt nimis pulchritudinem ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nihil tamen interrogantes eam, dimiserunt transire, dicentes : Deus patrum nostrorum det tibi gratiam, et omne consilium tui cordis sua virtute corroboret, ut glorietur super te Jerusalem, et sit nomen tuum in numero sanctorum et justorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et dixerunt hi qui illic erant omnes una voce : Fiat, fiat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Judith vero orans Dominum, transivit per portas, ipsa et abra ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Factum est autem cum descenderet montem, circa ortum diei, occurrerunt ei exploratores Assyriorum, et tenuerunt eam, dicentes : Unde venis ? aut quo vadis ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quæ respondit : Filia sum Hebræorum, ideo ego fugi a facie eorum, quoniam futurum agnovi quod dentur vobis in deprædationem, pro eo quod contemnentes vos, noluerunt ultro tradere seipsos ut invenirent misericordiam in conspectu vestro.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hac de causa cogitavi mecum, dicens : Vadam ad faciem principis Holofernis, ut indicem illi secreta illorum, et ostendam illi quo aditu possit obtinere eos, ita ut non cadat vir unus de exercitu ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et cum audissent viri illi verba ejus, considerabant faciem ejus, et erat in oculis eorum stupor, quoniam pulchritudinem ejus mirabantur nimis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et dixerunt ad eam : Conservasti animam tuam, eo quod tale reperisti consilium, ut descenderes ad dominum nostrum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hoc autem scias, quoniam cum steteris in conspectu ejus, bene tibi faciet, et eris gratissima in corde ejus. Duxeruntque illam ad tabernaculum Holofernis, annuntiantes eam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cumque intrasset ante faciem ejus, statim captus est in suis oculis Holofernes.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dixeruntque ad eum satellites ejus : Quis contemnat populum Hebræorum, qui tam decoras mulieres habent, ut non pro his merito pugnare contra eos debeamus ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Videns itaque Judith Holofernem sedentem in conopeo, quod erat ex purpura, et auro, et smaragdo, et lapidibus pretiosis intextum,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et cum in faciem ejus intendisset, adoravit eum, prosternens se super terram. Et elevaverunt eam servi Holofernis, jubente domino suo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 9</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/11/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 11</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->10<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Judith 9" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></pa olic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JDT.10\",{\"bookId\":18,\"usfm\":\"JDT\",\"bookName\":\"Judith\",\"drName\":\"Judith\",\"chapter\":10,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass, when she had ceased to cry to the Lord, that she rose from the place wherein she lay prostrate before the Lord.\"},{\"verse\":2,\"text\":\"And she called her maid, and going down into her house she took off her haircloth, and put away the garments of her widowhood,\"},{\"verse\":3,\"text\":\"And she washed her body, and anointed herself with the best ointment, and plaited the hair of her head, and put a bonnet upon her head, and clothed herself with the garments of her gladness, and put sandals on her feet, and took her bracelets, and lilies, and earlets, and rings, and adorned herself with all her ornaments.\"},{\"verse\":4,\"text\":\"And the Lord also gave her more beauty: because all this dressing up did not proceed from sensuality, but from virtue: and therefore the Lord increased this her beauty, so that she appeared to all men’s eyes incomparably lovely.\"},{\"verse\":5,\"text\":\"And she gave to her maid a bottle of wine to carry, and a vessel of oil, and parched corn, and dry figs, and bread and cheese, and went out.\"},{\"verse\":6,\"text\":\"And when they came to the gate of the city, they found Ozias, and the ancients of the city waiting.\"},{\"verse\":7,\"text\":\"And when they saw her they were astonished, and admired her beauty exceedingly.\"},{\"verse\":8,\"text\":\"But they asked her no question, only they let her pass, saying: The God of our fathers give thee grace, and may he strengthen all the counsel of thy heart with his power, that Jerusalem may glory in thee, and thy name may be in the number of the holy and just.\"},{\"verse\":9,\"text\":\"And they that were there said, all with one voice: So be it, so be it.\"},{\"verse\":10,\"text\":\"But Judith praying to the Lord, passed through the gates, she and her maid.\"},{\"verse\":11,\"text\":\"And it came to pass, when she went down the hill, about break of day, that the watchmen of the Assyrians met her, and stopped her, saying: Whence comest thou or whither goest thou?\"},{\"verse\":12,\"text\":\"And she answered: I am a daughter of the Hebrews, and I am fled from them, because I knew they would be made a prey to you, because they despised you, and would not of their own accord yield themselves, that they might find mercy in your sight.\"},{\"verse\":13,\"text\":\"For this reason I thought with myself, saying: I will go to the presence of the prince Holofernes, that I may tell him their secrets, and shew him by what way he may take them, without the loss of one man of his army.\"},{\"verse\":14,\"text\":\"And when the men had heard her words, they beheld her face, and their eyes were amazed, for they wondered exceedingly at her beauty.\"},{\"verse\":15,\"text\":\"And they said to her: Thou hast saved thy life by taking this resolution, to come down to our lord.\"},{\"verse\":16,\"text\":\"And be assured of this, that when thou shalt stand before him, he will treat thee well, and thou wilt be most acceptable to his heart. And they brought her to the tent of Holofernes, telling him of her.\"},{\"verse\":17,\"text\":\"And when she was come into his presence, forthwith Holofernes was caught by his eyes.\"},{\"verse\":18,\"text\":\"And his officers said to him: Who can despise the people of the Hebrews, who have such beautiful women, that we should not think it worth our while for their sakes to fight against them?\"},{\"verse\":19,\"text\":\"And Judith seeing Holofernes sitting under a canopy, which was woven of purple and gold, with emeralds and precious stones:\"},{\"verse\":20,\"text\":\"After she had looked on his face, bowed down to him, prostrating herself to the ground. And the servants of Holofernes lifted her up, by the command of their master.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem, cum cessasset clamare ad Dominum, surrexit de loco in quo jacuerat prostrata ad Dominum.\"},{\"verse\":2,\"text\":\"Vocavitque abram suam, et descendens in domum suam, abstulit a se cilicium, et exuit se vestimentis viduitatis suæ,\"},{\"verse\":3,\"text\":\"et lavit corpus suum, et unxit se myro optimo, et discriminavit crinem capitis sui, et imposuit mitram super caput suum, et induit se vestimentis jucunditatis suæ, induitque sandalia pedibus suis, assumpsitque dextraliola, et lilia, et inaures, et annulos, et omnibus ornamentis suis ornavit se.\"},{\"verse\":4,\"text\":\"Cui etiam Dominus contulit splendorem : quoniam omnis ista compositio non ex libidine, sed ex virtute pendebat : et ideo Dominus hanc in illam pulchritudinem ampliavit, ut incomparabili decore omnium oculis appareret.\"},{\"verse\":5,\"text\":\"Imposuit itaque abræ suæ ascoperam vini, et vas olei, et polentam, et palathas, et panes, et caseum, et profecta est.\"},{\"verse\":6,\"text\":\"Cumque venissent ad portam civitatis, invenerunt expectantem Oziam et presbyteros civitatis.\"},{\"verse\":7,\"text\":\"Qui cum vidissent eam, stupentes mirati sunt nimis pulchritudinem ejus.\"},{\"verse\":8,\"text\":\"Nihil tamen interrogantes eam, dimiserunt transire, dicentes : Deus patrum nostrorum det tibi gratiam, et omne consilium tui cordis sua virtute corroboret, ut glorietur super te Jerusalem, et sit nomen tuum in numero sanctorum et justorum.\"},{\"verse\":9,\"text\":\"Et dixerunt hi qui illic erant omnes una voce : Fiat, fiat.\"},{\"verse\":10,\"text\":\"Judith vero orans Dominum, transivit per portas, ipsa et abra ejus.\"},{\"verse\":11,\"text\":\"Factum est autem cum descenderet montem, circa ortum diei, occurrerunt ei exploratores Assyriorum, et tenuerunt eam, dicentes : Unde venis ? aut quo vadis ?\"},{\"verse\":12,\"text\":\"Quæ respondit : Filia sum Hebræorum, ideo ego fugi a facie eorum, quoniam futurum agnovi quod dentur vobis in deprædationem, pro eo quod contemnentes vos, noluerunt ultro tradere seipsos ut invenirent misericordiam in conspectu vestro.\"},{\"verse\":13,\"text\":\"Hac de causa cogitavi mecum, dicens : Vadam ad faciem principis Holofernis, ut indicem illi secreta illorum, et ostendam illi quo aditu possit obtinere eos, ita ut non cadat vir unus de exercitu ejus.\"},{\"verse\":14,\"text\":\"Et cum audissent viri illi verba ejus, considerabant faciem ejus, et erat in oculis eorum stupor, quoniam pulchritudinem ejus mirabantur nimis.\"},{\"verse\":15,\"text\":\"Et dixerunt ad eam : Conservasti animam tuam, eo quod tale reperisti consilium, ut descenderes ad dominum nostrum.\"},{\"verse\":16,\"text\":\"Hoc autem scias, quoniam cum steteris in conspectu ejus, bene tibi faciet, et eris gratissima in corde ejus. Duxeruntque illam ad tabernaculum Holofernis, annuntiantes eam.\"},{\"verse\":17,\"text\":\"Cumque intrasset ante faciem ejus, statim captus est in suis oculis Holofernes.\"},{\"verse\":18,\"text\":\"Dixeruntque ad eum satellites ejus : Quis contemnat populum Hebræorum, qui tam decoras mulieres habent, ut non pro his merito pugnare contra eos debeamus ?\"},{\"verse\":19,\"text\":\"Videns itaque Judith Holofernem sedentem in conopeo, quod erat ex purpura, et auro, et smaragdo, et lapidibus pretiosis intextum,\"},{\"verse\":20,\"text\":\"et cum in faciem ejus intendisset, adoravit eum, prosternens se super terram. Et elevaverunt eam servi Holofernis, jubente domino suo.\"}],\"summary\":\"Judith goeth out towards the camp, and is taken, and brought to Holofernes.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":9,\"label\":\"Judith 9\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":11,\"label\":\"Judith 11\"}}]]\n"])</script></body></html>
