5rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But Holofernes on the next day gave orders to his army, to go up against Bethulia.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Now there were in his troops a hundred and twenty thousand footmen, and two and twenty thousand horsemen, besides the preparations of those men who had been taken, and who had been brought away out of the provinces and cities of all the youth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>All these prepared themselves together to fight against the children of Israel, and they came by the hillside to the top, which looketh toward Dothain, from the place which is called Belma, unto Chelmon, which is over against Esdrelon.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But the children of Israel, when they saw the multitude of them, prostrated themselves upon the ground, putting ashes upon their heads, praying with one accord, that the God of Israel would shew his mercy upon his people.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And taking their arms of war, they posted themselves at the places, which by a narrow pathway lead directly between the mountains, and they guarded them all day and night.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now Holofernes, in going round about, found that the fountain which supplied them with water, ran through an aqueduct without the city on the south side: and he commanded their aqueduct to be cut off.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nevertheless there were springs not far from the walls, out of which they were seen secretly to draw water, to refresh themselves a little rather than to drink their fill.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the children of Ammon and Moab came to Holofernes, saying: The children of Israel trust not in their spears, nor in their arrows, but the mountains are their defence, and the steep hills and precipices guard them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Wherefore that thou mayst overcome them without joining battle, set guards at the springs that they may not draw water out of them, and thou shalt destroy them without sword, or at least being wearied out they will yield up their city, which they suppose, because it is situate in the mountains, to be impregnable.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And these words pleased Holofernes, and his officers, and he placed all round about a hundred men at every spring.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when they had kept this watch for full twenty days, the cisterns, and the reserve of waters failed among all the inhabitants of Bethulia, so that there was not within the city, enough to satisfy them, no not for one day, for water was daily given out to the people by measure.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then all the men and women, young men, and children, gathering themselves together to Ozias, all together with one voice,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Said: God be judge between us and thee, for thou hast done evil against us, in that thou wouldst not speak peaceably with the Assyrians, and for this cause God hath sold us into their hands.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And therefore there is no one to help us, while we are cast down before their eyes in thirst, and sad destruction.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And now assemble ye all that are in the city, that we may of our own accord yield ourselves all up to the people of Holofernes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For it is better, that being captives we should live and bless the Lord, than that we should die, and be a reproach to all flesh, after we have seen our wives and our infants die before our eyes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>We call to witness this day heaven and earth, and the God of our fathers, who taketh vengeance upon us according to our sins, conjuring you to deliver now the city into the hand of the army of Holofernes, that our end may be short by the edge of the sword, which is made longer by the drought of thirst.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when they had said these things, there was great weeping and lamentation of all in the assembly, and for many hours with one voice they cried to God, saying:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>We have sinned with our fathers, we have done unjustly, we have committed iniquity:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Have thou mercy on us, because thou art good, or punish our iniquities by chastising us thyself, and deliver not them that trust in thee to a people that knoweth not thee,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That they may not say among the Gentiles: Where is their God?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And when being wearied with these cries, and tired with these weepings, they held their peace,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ozias rising up all in tears, said: Be of good courage, my brethren, and let us wait these five days for mercy from the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For perhaps he will put a stop to his indignation, and will give glory to his own name.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But if after five days be past there come no aid, we will do the things which you have spoken.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Holofernes autem altera die præcepit exercitibus suis ut ascenderent contra Bethuliam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Erant autem pedites bellatorum centum viginti millia, et equites viginti duo millia, præter præparationes virorum illorum quos occupaverat captivitas, et abducti fuerant de provinciis et urbibus universæ juventutis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Omnes paraverunt se pariter ad pugnam contra filios Israël, et venerunt per crepidinem montis usque ad apicem, qui respicit super Dothain, a loco qui dicitur Belma usque ad Chelmon, qui est contra Esdrelon.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Filii autem Israël, ut viderunt multitudinem illorum, prostraverunt se super terram, mittentes cinerem super capita sua, unanimes orantes ut Deus Israël misericordiam suam ostenderet super populum suum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et assumentes arma sua bellica, sederunt per loca quæ ad angusti itineris tramitem dirigunt inter montosa, et erant custodientes ea tota die et nocte.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Porro Holofernes, dum circuit per gyrum, reperit quod fons qui influebat, aquæductum illorum a parte australi extra civitatem dirigeret : et incidi præcepit aquæductum illorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Erant tamen non longe a muris fontes, ex quibus furtim videbantur haurire aquam ad refocillandum potius quam ad potandum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sed filii Ammon et Moab accesserunt ad Holofernem, dicentes : Filii Israël non in lancea nec in sagitta confidunt, sed montes defendunt illos, et muniunt illos colles in præcipitio constituti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ut ergo sine congressione pugnæ possis superare eos, pone custodes fontium, ut non hauriant aquam ex eis, et sine gladio interficies eos, vel certe fatigati tradent civitatem suam, quam putant in montibus positam superari non posse.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et placuerunt verba hæc coram Holoferne et coram satellitibus ejus, et constituit per gyrum centenarios per singulos fontes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cumque ista custodia per dies viginti fuisset expleta, defecerunt cisternæ et collectiones aquarum omnibus habitantibus Bethuliam, ita ut non esset intra civitatem unde satiarentur vel una die, quoniam ad mensuram dabatur populis aqua quotidie.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tunc ad Oziam congregati omnes viri feminæque, juvenes et parvuli, omnes simul una voce</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>dixerunt : Judicet Deus inter nos et te, quoniam fecisti in nos mala, nolens loqui pacifice cum Assyriis, et propter hoc vendidit nos Deus in manibus eorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ideo non est qui adjuvet, cum prosternamur ante oculos eorum in siti, et perditione magna.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et nunc congregate universos qui in civitate sunt, ut sponte tradamus nos omnes populo Holofernis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Melius est enim ut captivi benedicamus Dominum viventes, quam moriamur, et simus opprobrium omni carni, cum viderimus uxores nostras et infantes nostros mori ante oculos nostros.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Contestamur hodie cælum et terram, et Deum patrum nostrorum, qui ulciscitur nos secundum peccata nostra, ut jam tradatis civitatem in manu militiæ Holofernis, et sit finis noster brevis in ore gladii, qui longior efficitur in ariditate sitis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et cum hæc dixissent, factus est fletus et ululatus magnus in ecclesia ab omnibus, et per multas horas una voce clamaverunt ad Deum, dicentes :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Peccavimus cum patribus nostris : injuste egimus, iniquitatem fecimus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tu, quia pius es, miserere nostri, aut in tuo flagello vindica iniquitates nostras, et noli tradere confitentes te populo qui ignorat te,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut non dicant inter gentes : Ubi est Deus eorum ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et cum fatigati ex his clamoribus et his fletibus lassati siluissent,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>exsurgens Ozias infusus lacrimis, dixit : Æquo animo estote, fratres, et hos quinque dies expectemus a Domino misericordiam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Forsitan enim indignationem suam abscindet, et dabit gloriam nomini suo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Si autem transactis quinque diebus non venerit adjutorium, faciemus hæc verba quæ locuti estis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Judith 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JDT/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Judith 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x ain which supplied them with water, ran through an aqueduct without the city on the south side: and he commanded their aqueduct to be cut off.\"},{\"verse\":7,\"text\":\"Nevertheless there were springs not far from the walls, out of which they were seen secretly to draw water, to refresh themselves a little rather than to drink their fill.\"},{\"verse\":8,\"text\":\"But the children of Ammon and Moab came to Holofernes, saying: The children of Israel trust not in their spears, nor in their arrows, but the mountains are their defence, and the steep hills and precipices guard them.\"},{\"verse\":9,\"text\":\"Wherefore that thou mayst overcome them without joining battle, set guards at the springs that they may not draw water out of them, and thou shalt destroy them without sword, or at least being wearied out they will yield up their city, which they suppose, because it is situate in the mountains, to be impregnable.\"},{\"verse\":10,\"text\":\"And these words pleased Holofernes, and his officers, and he placed all round about a hundred men at every spring.\"},{\"verse\":11,\"text\":\"And when they had kept this watch for full twenty days, the cisterns, and the reserve of waters failed among all the inhabitants of Bethulia, so that there was not within the city, enough to satisfy them, no not for one day, for water was daily given out to the people by measure.\"},{\"verse\":12,\"text\":\"Then all the men and women, young men, and children, gathering themselves together to Ozias, all together with one voice,\"},{\"verse\":13,\"text\":\"Said: God be judge between us and thee, for thou hast done evil against us, in that thou wouldst not speak peaceably with the Assyrians, and for this cause God hath sold us into their hands.\"},{\"verse\":14,\"text\":\"And therefore there is no one to help us, while we are cast down before their eyes in thirst, and sad destruction.\"},{\"verse\":15,\"text\":\"And now assemble ye all that are in the city, that we may of our own accord yield ourselves all up to the people of Holofernes.\"},{\"verse\":16,\"text\":\"For it is better, that being captives we should live and bless the Lord, than that we should die, and be a reproach to all flesh, after we have seen our wives and our infants die before our eyes.\"},{\"verse\":17,\"text\":\"We call to witness this day heaven and earth, and the God of our fathers, who taketh vengeance upon us according to our sins, conjuring you to deliver now the city into the hand of the army of Holofernes, that our end may be short by the edge of the sword, which is made longer by the drought of thirst.\"},{\"verse\":18,\"text\":\"And when they had said these things, there was great weeping and lamentation of all in the assembly, and for many hours with one voice they cried to God, saying:\"},{\"verse\":19,\"text\":\"We have sinned with our fathers, we have done unjustly, we have committed iniquity:\"},{\"verse\":20,\"text\":\"Have thou mercy on us, because thou art good, or punish our iniquities by chastising us thyself, and deliver not them that trust in thee to a people that knoweth not thee,\"},{\"verse\":21,\"text\":\"That they may not say among the Gentiles: Where is their God?\"},{\"verse\":22,\"text\":\"And when being wearied with these cries, and tired with these weepings, they held their peace,\"},{\"verse\":23,\"text\":\"Ozias rising up all in tears, said: Be of good courage, my brethren, and let us wait these five days for mercy from the Lord.\"},{\"verse\":24,\"text\":\"For perhaps he will put a stop to his indignation, and will give glory to his own name.\"},{\"verse\":25,\"text\":\"But if after five days be past there come no aid, we will do the things which you have spoken.\"}],\"vul\":[{\"verse\":1,\"text\":\"Holofernes autem altera die præcepit exercitibus suis ut ascenderent contra Bethuliam.\"},{\"verse\":2,\"text\":\"Erant autem pedites bellatorum centum viginti millia, et equites viginti duo millia, præter præparationes virorum illorum quos occupaverat captivitas, et abducti fuerant de provinciis et urbibus universæ juventutis.\"},{\"verse\":3,\"text\":\"Omnes paraverunt se pariter ad pugnam contra filios Israël, et venerunt per crepidinem montis usque ad apicem, qui respicit super Dothain, a loco qui dicitur Belma usque ad Chelmon, qui est contra Esdrelon.\"},{\"verse\":4,\"text\":\"Filii autem Israël, ut viderunt multitudinem illorum, prostraverunt se super terram, mittentes cinerem super capita sua, unanimes orantes ut Deus Israël misericordiam suam ostenderet super populum suum.\"},{\"verse\":5,\"text\":\"Et assumentes arma sua bellica, sederunt per loca quæ ad angusti itineris tramitem dirigunt inter montosa, et erant custodientes ea tota die et nocte.\"},{\"verse\":6,\"text\":\"Porro Holofernes, dum circuit per gyrum, reperit quod fons qui influebat, aquæductum illorum a parte australi extra civitatem dirigeret : et incidi præcepit aquæductum illorum.\"},{\"verse\":7,\"text\":\"Erant tamen non longe a muris fontes, ex quibus furtim videbantur haurire aquam ad refocillandum potius quam ad potandum.\"},{\"verse\":8,\"text\":\"Sed filii Ammon et Moab accesserunt ad Holofernem, dicentes : Filii Israël non in lancea nec in sagitta confidunt, sed montes defendunt illos, et muniunt illos colles in præcipitio constituti.\"},{\"verse\":9,\"text\":\"Ut ergo sine congressione pugnæ possis superare eos, pone custodes fontium, ut non hauriant aquam ex eis, et sine gladio interficies eos, vel certe fatigati tradent civitatem suam, quam putant in montibus positam superari non posse.\"},{\"verse\":10,\"text\":\"Et placuerunt verba hæc coram Holoferne et coram satellitibus ejus, et constituit per gyrum centenarios per singulos fontes.\"},{\"verse\":11,\"text\":\"Cumque ista custodia per dies viginti fuisset expleta, defecerunt cisternæ et collectiones aquarum omnibus habitantibus Bethuliam, ita ut non esset intra civitatem unde satiarentur vel una die, quoniam ad mensuram dabatur populis aqua quotidie.\"},{\"verse\":12,\"text\":\"Tunc ad Oziam congregati omnes viri feminæque, juvenes et parvuli, omnes simul una voce\"},{\"verse\":13,\"text\":\"dixerunt : Judicet Deus inter nos et te, quoniam fecisti in nos mala, nolens loqui pacifice cum Assyriis, et propter hoc vendidit nos Deus in manibus eorum.\"},{\"verse\":14,\"text\":\"Et ideo non est qui adjuvet, cum prosternamur ante oculos eorum in siti, et perditione magna.\"},{\"verse\":15,\"text\":\"Et nunc congregate universos qui in civitate sunt, ut sponte tradamus nos omnes populo Holofernis.\"},{\"verse\":16,\"text\":\"Melius est enim ut captivi benedicamus Dominum viventes, quam moriamur, et simus opprobrium omni carni, cum viderimus uxores nostras et infantes nostros mori ante oculos nostros.\"},{\"verse\":17,\"text\":\"Contestamur hodie cælum et terram, et Deum patrum nostrorum, qui ulciscitur nos secundum peccata nostra, ut jam tradatis civitatem in manu militiæ Holofernis, et sit finis noster brevis in ore gladii, qui longior efficitur in ariditate sitis.\"},{\"verse\":18,\"text\":\"Et cum hæc dixissent, factus est fletus et ululatus magnus in ecclesia ab omnibus, et per multas horas una voce clamaverunt ad Deum, dicentes :\"},{\"verse\":19,\"text\":\"Peccavimus cum patribus nostris : injuste egimus, iniquitatem fecimus.\"},{\"verse\":20,\"text\":\"Tu, quia pius es, miserere nostri, aut in tuo flagello vindica iniquitates nostras, et noli tradere confitentes te populo qui ignorat te,\"},{\"verse\":21,\"text\":\"ut non dicant inter gentes : Ubi est Deus eorum ?\"},{\"verse\":22,\"text\":\"Et cum fatigati ex his clamoribus et his fletibus lassati siluissent,\"},{\"verse\":23,\"text\":\"exsurgens Ozias infusus lacrimis, dixit : Æquo animo estote, fratres, et hos quinque dies expectemus a Domino misericordiam.\"},{\"verse\":24,\"text\":\"Forsitan enim indignationem suam abscindet, et dabit gloriam nomini suo.\"},{\"verse\":25,\"text\":\"Si autem transactis quinque diebus non venerit adjutorium, faciemus hæc verba quæ locuti estis.\"}],\"summary\":\"Holofernes besiegeth Bethulia. The distress of the besieged.\",\"intro\":null,\"prev\":{\"usfm\":\"JDT\",\"chapter\":6,\"label\":\"Judith 6\"},\"next\":{\"usfm\":\"JDT\",\"chapter\":8,\"label\":\"Judith 8\"}}]]\n"])</script></body></html>
