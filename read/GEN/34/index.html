m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">34</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Dina is ravished, for which the Sichemites are destroyed.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Dina the daughter of Lia went out to see the women of that country.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when Sichem the son of Hemor the Hevite, the prince of that land, saw her, he was in love with her: and took her away, and lay with her, ravishing the virgin.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And his soul was fast knit unto her; and whereas she was sad, he comforted her with sweet words.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And going to Hemor his father, he said: Get me this damsel to wife.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But when Jacob had heard this, his sons being absent, and employed in feeding the cattle, he held his peace till they came back.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when Hemor the father of Sichem was come out to speak to Jacob,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Behold his sons came from the field: and hearing what had passed, they were exceeding angry, because he had done a foul thing in Israel, and committed an unlawful act, in ravishing Jacob’s daughter.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Hemor spoke to them: The soul of my son Sichem has a longing for your daughter: give her him to wife:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And let us contract marriages one with another: give us your daughters, and take you our daughters.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And dwell with us: the land is at your command, till, trade, and possess it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sichem also said to her father and to her brethren: Let me find favour in your sight, and whatsoever you shall appoint I will give:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Raise the dowry, and ask gifts, and I will gladly give what you shall demand: only give me this damsel to wife.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The sons of Jacob answered Sichem and his father deceitfully, being enraged at the deflowering of their sister:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>We cannot do what you demand, nor give our sister to one that is uncircumcised; which with us is unlawful and abominable.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But in this we may be allied with you, if you will be like us, and all the male sex among you be circumcised:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then will we mutually give and take your daughters, and ours; and we will dwell with you, and will be one people:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But if you will not be circumcised, we will take our daughter and depart.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Their offer pleased Hemor, and Sichem, his son:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the young man made no delay, but forthwith fulfilled what was required: for he loved the damsel exceedingly, and he was the greatest man in all his father’s house.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And going into the gate of the city, they spoke to the people:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>These men are peaceable, and are willing to dwell with us: let them trade in the land, and till it, which being large and wide wanteth men to till it: we shall take their daughters for wives, and we will give them ours.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>One thing there is for which so great a good is deferred: We must circumcise every male among us, following the manner of the nation.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And their substance, and cattle, and all that they possess, shall be ours; only in this let us condescend, and by dwelling together, we shall make one people.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they all agreed, and circumcised all the males.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And behold the third day, when the pain of the wound was greatest: two of the sons of Jacob, Simeon and Levi, the brothers of Dina, taking their swords, entered boldly into the city and slew all the men.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they killed also Hemor and Sichem, and took away their sister Dina out of Sichem’s house.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when they were gone out, the other sons of Jacob came upon the slain; and plundered the city in revenge of the rape.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they took their sheep, and their herds, and their asses, wasting all they had in their houses and in their fields.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And their children and wives they took captive.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And when they had boldly perpetrated these things, Jacob said to Simeon and Levi: You have troubled me, and made me hateful to the Chanaanites and Pherezites, the inhabitants of this land. We are few: they will gather themselves together and kill me; and both I, and my house shall be destroyed.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>They answered: Should they abuse our sister as a strumpet?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Egressa est autem Dina filia Liæ ut videret mulieres regionis illius.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quam cum vidisset Sichem filius Hemor Hevæi, princeps terræ illius, adamavit eam : et rapuit, et dormivit cum illa, vi opprimens virginem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et conglutinata est anima ejus cum ea, tristemque delinivit blanditiis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et pergens ad Hemor patrem suum : Accipe, inquit, mihi puellam hanc conjugem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quod cum audisset Jacob absentibus filiis, et in pastu pecorum occupatis, siluit donec redirent.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Egresso autem Hemor patre Sichem ut loqueretur ad Jacob,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ecce filii ejus veniebant de agro : auditoque quod acciderat, irati sunt valde, eo quod fœdam rem operatus esset in Israël et, violata filia Jacob, rem illicitam perpetrasset.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Locutus est itaque Hemor ad eos : Sichem filii mei adhæsit anima filiæ vestræ : date eam illi uxorem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et jungamus vicissim connubia : filias vestras tradite nobis, et filias nostras accipite,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et habitate nobiscum : terra in potestate vestra est : exercete, negotiamini, et possidete eam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sed et Sichem ad patrem et ad fratres ejus ait : Inveniam gratiam coram vobis : et quæcumque statueritis, dabo :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>augete dotem, et munera postulate, et libenter tribuam quod petieritis : tantum date mihi puellam hanc uxorem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Responderunt filii Jacob Sichem et patri ejus in dolo, sævientes ob stuprum sororis :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non possumus facere quod petitis, nec dare sororem nostram homini incircumciso : quod illicitum et nefarium est apud nos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sed in hoc valebimus fœderari, si volueritis esse similes nostri, et circumcidatur in vobis omne masculini sexus ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>tunc dabimus et accipiemus mutuo filias vestras ac nostras : et habitabimus vobiscum, erimusque unus populus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si autem circumcidi nolueritis, tollemus filiam nostram, et recedemus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Placuit oblatio eorum Hemor, et Sichem filio ejus,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>nec distulit adolescens quin statim quod petebatur expleret : amabat enim puellam valde, et ipse erat inclytus in omni domo patris sui.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ingressique portam urbis, locuti sunt ad populum :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Viri isti pacifici sunt, et volunt habitare nobiscum : negotientur in terra, et exerceant eam, quæ spatiosa et lata cultoribus indiget : filias eorum accipiemus uxores, et nostras illis dabimus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Unum est quo differtur tantum bonum : si circumcidamus masculos nostros, ritum gentis imitantes.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et substantia eorum, et pecora, et cuncta quæ possident, nostra erunt : tantum in hoc acquiescamus, et habitantes simul, unum efficiemus populum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Assensique sunt omnes, circumcisis cunctis maribus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ecce, die tertio, quando gravissimus vulnerum dolor est : arreptis duo filii Jacob, Simeon et Levi fratres Dinæ, gladiis, ingressi sunt urbem confidenter : interfectisque omnibus masculis,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Hemor et Sichem pariter necaverunt, tollentes Dinam de domo Sichem sororem suam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quibus egressis, irruerunt super occisos ceteri filii Jacob : et depopulati sunt urbem in ultionem stupri.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Oves eorum, et armenta, et asinos, cunctaque vastantes quæ in domibus et in agris erant,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>parvulos quoque eorum et uxores duxerunt captivas.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quibus patratis audacter, Jacob dixit ad Simeon et Levi : Turbastis me, et odiosum fecistis me Chananæis, et Pherezæis habitatoribus terræ hujus : nos pauci sumus ; illi congregati percutient me, et delebor ego, et domus mea.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Responderunt : Numquid ut scorto abuti debuere sorore nostra ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/33/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 33</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/35/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 35</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->34<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-in \",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"GEN.34\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":34,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And Dina the daughter of Lia went out to see the women of that country.\"},{\"verse\":2,\"text\":\"And when Sichem the son of Hemor the Hevite, the prince of that land, saw her, he was in love with her: and took her away, and lay with her, ravishing the virgin.\"},{\"verse\":3,\"text\":\"And his soul was fast knit unto her; and whereas she was sad, he comforted her with sweet words.\"},{\"verse\":4,\"text\":\"And going to Hemor his father, he said: Get me this damsel to wife.\"},{\"verse\":5,\"text\":\"But when Jacob had heard this, his sons being absent, and employed in feeding the cattle, he held his peace till they came back.\"},{\"verse\":6,\"text\":\"And when Hemor the father of Sichem was come out to speak to Jacob,\"},{\"verse\":7,\"text\":\"Behold his sons came from the field: and hearing what had passed, they were exceeding angry, because he had done a foul thing in Israel, and committed an unlawful act, in ravishing Jacob’s daughter.\"},{\"verse\":8,\"text\":\"And Hemor spoke to them: The soul of my son Sichem has a longing for your daughter: give her him to wife:\"},{\"verse\":9,\"text\":\"And let us contract marriages one with another: give us your daughters, and take you our daughters.\"},{\"verse\":10,\"text\":\"And dwell with us: the land is at your command, till, trade, and possess it.\"},{\"verse\":11,\"text\":\"Sichem also said to her father and to her brethren: Let me find favour in your sight, and whatsoever you shall appoint I will give:\"},{\"verse\":12,\"text\":\"Raise the dowry, and ask gifts, and I will gladly give what you shall demand: only give me this damsel to wife.\"},{\"verse\":13,\"text\":\"The sons of Jacob answered Sichem and his father deceitfully, being enraged at the deflowering of their sister:\"},{\"verse\":14,\"text\":\"We cannot do what you demand, nor give our sister to one that is uncircumcised; which with us is unlawful and abominable.\"},{\"verse\":15,\"text\":\"But in this we may be allied with you, if you will be like us, and all the male sex among you be circumcised:\"},{\"verse\":16,\"text\":\"Then will we mutually give and take your daughters, and ours; and we will dwell with you, and will be one people:\"},{\"verse\":17,\"text\":\"But if you will not be circumcised, we will take our daughter and depart.\"},{\"verse\":18,\"text\":\"Their offer pleased Hemor, and Sichem, his son:\"},{\"verse\":19,\"text\":\"And the young man made no delay, but forthwith fulfilled what was required: for he loved the damsel exceedingly, and he was the greatest man in all his father’s house.\"},{\"verse\":20,\"text\":\"And going into the gate of the city, they spoke to the people:\"},{\"verse\":21,\"text\":\"These men are peaceable, and are willing to dwell with us: let them trade in the land, and till it, which being large and wide wanteth men to till it: we shall take their daughters for wives, and we will give them ours.\"},{\"verse\":22,\"text\":\"One thing there is for which so great a good is deferred: We must circumcise every male among us, following the manner of the nation.\"},{\"verse\":23,\"text\":\"And their substance, and cattle, and all that they possess, shall be ours; only in this let us condescend, and by dwelling together, we shall make one people.\"},{\"verse\":24,\"text\":\"And they all agreed, and circumcised all the males.\"},{\"verse\":25,\"text\":\"And behold the third day, when the pain of the wound was greatest: two of the sons of Jacob, Simeon and Levi, the brothers of Dina, taking their swords, entered boldly into the city and slew all the men.\"},{\"verse\":26,\"text\":\"And they killed also Hemor and Sichem, and took away their sister Dina out of Sichem’s house.\"},{\"verse\":27,\"text\":\"And when they were gone out, the other sons of Jacob came upon the slain; and plundered the city in revenge of the rape.\"},{\"verse\":28,\"text\":\"And they took their sheep, and their herds, and their asses, wasting all they had in their houses and in their fields.\"},{\"verse\":29,\"text\":\"And their children and wives they took captive.\"},{\"verse\":30,\"text\":\"And when they had boldly perpetrated these things, Jacob said to Simeon and Levi: You have troubled me, and made me hateful to the Chanaanites and Pherezites, the inhabitants of this land. We are few: they will gather themselves together and kill me; and both I, and my house shall be destroyed.\"},{\"verse\":31,\"text\":\"They answered: Should they abuse our sister as a strumpet?\"}],\"vul\":[{\"verse\":1,\"text\":\"Egressa est autem Dina filia Liæ ut videret mulieres regionis illius.\"},{\"verse\":2,\"text\":\"Quam cum vidisset Sichem filius Hemor Hevæi, princeps terræ illius, adamavit eam : et rapuit, et dormivit cum illa, vi opprimens virginem.\"},{\"verse\":3,\"text\":\"Et conglutinata est anima ejus cum ea, tristemque delinivit blanditiis.\"},{\"verse\":4,\"text\":\"Et pergens ad Hemor patrem suum : Accipe, inquit, mihi puellam hanc conjugem.\"},{\"verse\":5,\"text\":\"Quod cum audisset Jacob absentibus filiis, et in pastu pecorum occupatis, siluit donec redirent.\"},{\"verse\":6,\"text\":\"Egresso autem Hemor patre Sichem ut loqueretur ad Jacob,\"},{\"verse\":7,\"text\":\"ecce filii ejus veniebant de agro : auditoque quod acciderat, irati sunt valde, eo quod fœdam rem operatus esset in Israël et, violata filia Jacob, rem illicitam perpetrasset.\"},{\"verse\":8,\"text\":\"Locutus est itaque Hemor ad eos : Sichem filii mei adhæsit anima filiæ vestræ : date eam illi uxorem :\"},{\"verse\":9,\"text\":\"et jungamus vicissim connubia : filias vestras tradite nobis, et filias nostras accipite,\"},{\"verse\":10,\"text\":\"et habitate nobiscum : terra in potestate vestra est : exercete, negotiamini, et possidete eam.\"},{\"verse\":11,\"text\":\"Sed et Sichem ad patrem et ad fratres ejus ait : Inveniam gratiam coram vobis : et quæcumque statueritis, dabo :\"},{\"verse\":12,\"text\":\"augete dotem, et munera postulate, et libenter tribuam quod petieritis : tantum date mihi puellam hanc uxorem.\"},{\"verse\":13,\"text\":\"Responderunt filii Jacob Sichem et patri ejus in dolo, sævientes ob stuprum sororis :\"},{\"verse\":14,\"text\":\"Non possumus facere quod petitis, nec dare sororem nostram homini incircumciso : quod illicitum et nefarium est apud nos.\"},{\"verse\":15,\"text\":\"Sed in hoc valebimus fœderari, si volueritis esse similes nostri, et circumcidatur in vobis omne masculini sexus ;\"},{\"verse\":16,\"text\":\"tunc dabimus et accipiemus mutuo filias vestras ac nostras : et habitabimus vobiscum, erimusque unus populus.\"},{\"verse\":17,\"text\":\"Si autem circumcidi nolueritis, tollemus filiam nostram, et recedemus.\"},{\"verse\":18,\"text\":\"Placuit oblatio eorum Hemor, et Sichem filio ejus,\"},{\"verse\":19,\"text\":\"nec distulit adolescens quin statim quod petebatur expleret : amabat enim puellam valde, et ipse erat inclytus in omni domo patris sui.\"},{\"verse\":20,\"text\":\"Ingressique portam urbis, locuti sunt ad populum :\"},{\"verse\":21,\"text\":\"Viri isti pacifici sunt, et volunt habitare nobiscum : negotientur in terra, et exerceant eam, quæ spatiosa et lata cultoribus indiget : filias eorum accipiemus uxores, et nostras illis dabimus.\"},{\"verse\":22,\"text\":\"Unum est quo differtur tantum bonum : si circumcidamus masculos nostros, ritum gentis imitantes.\"},{\"verse\":23,\"text\":\"Et substantia eorum, et pecora, et cuncta quæ possident, nostra erunt : tantum in hoc acquiescamus, et habitantes simul, unum efficiemus populum.\"},{\"verse\":24,\"text\":\"Assensique sunt omnes, circumcisis cunctis maribus.\"},{\"verse\":25,\"text\":\"Et ecce, die tertio, quando gravissimus vulnerum dolor est : arreptis duo filii Jacob, Simeon et Levi fratres Dinæ, gladiis, ingressi sunt urbem confidenter : interfectisque omnibus masculis,\"},{\"verse\":26,\"text\":\"Hemor et Sichem pariter necaverunt, tollentes Dinam de domo Sichem sororem suam.\"},{\"verse\":27,\"text\":\"Quibus egressis, irruerunt super occisos ceteri filii Jacob : et depopulati sunt urbem in ultionem stupri.\"},{\"verse\":28,\"text\":\"Oves eorum, et armenta, et asinos, cunctaque vastantes quæ in domibus et in agris erant,\"},{\"verse\":29,\"text\":\"parvulos quoque eorum et uxores duxerunt captivas.\"},{\"verse\":30,\"text\":\"Quibus patratis audacter, Jacob dixit ad Simeon et Levi : Turbastis me, et odiosum fecistis me Chananæis, et Pherezæis habitatoribus terræ hujus : nos pauci sumus ; illi congregati percutient me, et delebor ego, et domus mea.\"},{\"verse\":31,\"text\":\"Responderunt : Numquid ut scorto abuti debuere sorore nostra ?\"}],\"summary\":\"Dina is ravished, for which the Sichemites are destroyed.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":33,\"label\":\"Genesis 33\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":35,\"label\":\"Genesis 35\"}}]]\n"])</script></body></html>
