20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">3</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The serpent’s craft. The fall of our first parents. Their punishment. The promise of a Redeemer.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the serpent was more subtle than any of the beasts of the earth which the Lord God had made. And he said to the woman: Why hath God commanded you, that you should not eat of every tree of paradise?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the woman answered him, saying: Of the fruit of the trees that are in paradise we do eat:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But of the fruit of the tree which is in the midst of paradise, God hath commanded us that we should not eat; and that we should not touch it, lest perhaps we die.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the serpent said to the woman: No, you shall not die the death.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For God doth know that in what day soever you shall eat thereof, your eyes shall be opened: and you shall be as Gods, knowing good and evil.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the woman saw that the tree was good to eat, and fair to the eyes, and delightful to behold: and she took of the fruit thereof, and did eat, and gave to her husband, who did eat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the eyes of them both were opened: and when they perceived themselves to be naked, they sewed together fig leaves, and made themselves aprons.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when they heard the voice of the Lord God walking in paradise at the afternoon air, Adam and his wife hid themselves from the face of the Lord God, amidst the trees of paradise.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord God called Adam, and said to him: Where art thou?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he said: I heard thy voice in paradise; and I was afraid, because I was naked, and I hid myself.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he said to him: And who hath told thee that thou wast naked, but that thou hast eaten of the tree whereof I commanded thee that thou shouldst not eat?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Adam said: The woman, whom thou gavest me to be my companion, gave me of the tree, and I did eat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the Lord God said to the woman: Why hast thou done this? And she answered: The serpent deceived me, and I did eat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the Lord God said to the serpent: Because thou hast done this thing, thou art cursed among all cattle, and beasts of the earth: upon thy breast shalt thou go, and earth shalt thou eat all the days of thy life.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I will put enmities between thee and the woman, and thy seed and her seed: she shall crush thy head, and thou shalt lie in wait for her heel.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>To the woman also he said: I will multiply thy sorrows, and thy conceptions: in sorrow shalt thou bring forth children, and thou shalt be under thy husband’s power, and he shall have dominion over thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And to Adam he said: Because thou hast hearkened to the voice of thy wife, and hast eaten of the tree, whereof I commanded thee, that thou shouldst not eat, cursed is the earth in thy work: with labour and toil shalt thou eat thereof all the days of thy life.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thorns and thistles shall it bring forth to thee, and thou shalt eat the herbs of the earth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In the sweat of thy face shalt thou eat bread till thou return to the earth out of which thou wast taken: for dust thou art, and into dust thou shalt return.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Adam called the name of his wife Eve: because she was the mother of all the living.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Lord God made for Adam and his wife garments of skins, and clothed them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he said: Behold Adam is become as one of us, knowing good and evil: now therefore lest perhaps he put forth his hand and take also of the tree of life, and eat, and live for ever.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And the Lord God sent him out of the paradise of pleasure, to till the earth from which he was taken.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he cast out Adam: and placed before the paradise of pleasure Cherubims, and a flaming sword, turning every way, to keep the way of the tree of life.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sed et serpens erat callidior cunctis animantibus terræ quæ fecerat Dominus Deus. Qui dixit ad mulierem : Cur præcepit vobis Deus ut non comederetis de omni ligno paradisi ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cui respondit mulier : De fructu lignorum, quæ sunt in paradiso, vescimur :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>de fructu vero ligni quod est in medio paradisi, præcepit nobis Deus ne comederemus, et ne tangeremus illud, ne forte moriamur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixit autem serpens ad mulierem : Nequaquam morte moriemini.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Scit enim Deus quod in quocumque die comederitis ex eo, aperientur oculi vestri, et eritis sicut dii, scientes bonum et malum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vidit igitur mulier quod bonum esset lignum ad vescendum, et pulchrum oculis, aspectuque delectabile : et tulit de fructu illius, et comedit : deditque viro suo, qui comedit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et aperti sunt oculi amborum ; cumque cognovissent se esse nudos, consuerunt folia ficus, et fecerunt sibi perizomata.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et cum audissent vocem Domini Dei deambulantis in paradiso ad auram post meridiem, abscondit se Adam et uxor ejus a facie Domini Dei in medio ligni paradisi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Vocavitque Dominus Deus Adam, et dixit ei : Ubi es ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui ait : Vocem tuam audivi in paradiso, et timui, eo quod nudus essem, et abscondi me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cui dixit : Quis enim indicavit tibi quod nudus esses, nisi quod ex ligno de quo præceperam tibi ne comederes, comedisti ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixitque Adam : Mulier, quam dedisti mihi sociam, dedit mihi de ligno, et comedi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et dixit Dominus Deus ad mulierem : Quare hoc fecisti ? Quæ respondit : Serpens decepit me, et comedi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ait Dominus Deus ad serpentem : Quia fecisti hoc, maledictus es inter omnia animantia, et bestias terræ : super pectus tuum gradieris, et terram comedes cunctis diebus vitæ tuæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Inimicitias ponam inter te et mulierem, et semen tuum et semen illius : ipsa conteret caput tuum, et tu insidiaberis calcaneo ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mulieri quoque dixit : Multiplicabo ærumnas tuas, et conceptus tuos : in dolore paries filios, et sub viri potestate eris, et ipse dominabitur tui.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Adæ vero dixit : Quia audisti vocem uxoris tuæ, et comedisti de ligno, ex quo præceperam tibi ne comederes, maledicta terra in opere tuo : in laboribus comedes ex ea cunctis diebus vitæ tuæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Spinas et tribulos germinabit tibi, et comedes herbam terræ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In sudore vultus tui vesceris pane, donec revertaris in terram de qua sumptus es : quia pulvis es et in pulverem reverteris.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et vocavit Adam nomen uxoris suæ, Heva : eo quod mater esset cunctorum viventium.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fecit quoque Dominus Deus Adæ et uxori ejus tunicas pelliceas, et induit eos :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et ait : Ecce Adam quasi unus ex nobis factus est, sciens bonum et malum : nunc ergo ne forte mittat manum suam, et sumat etiam de ligno vitæ, et comedat, et vivat in æternum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et emisit eum Dominus Deus de paradiso voluptatis, ut operaretur terram de qua sumptus est.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ejecitque Adam : et collocavit ante paradisum voluptatis cherubim, et flammeum gladium, atque versatilem, ad custodiendam viam ligni vitæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Cha , amidst the trees of paradise.\"},{\"verse\":9,\"text\":\"And the Lord God called Adam, and said to him: Where art thou?\"},{\"verse\":10,\"text\":\"And he said: I heard thy voice in paradise; and I was afraid, because I was naked, and I hid myself.\"},{\"verse\":11,\"text\":\"And he said to him: And who hath told thee that thou wast naked, but that thou hast eaten of the tree whereof I commanded thee that thou shouldst not eat?\"},{\"verse\":12,\"text\":\"And Adam said: The woman, whom thou gavest me to be my companion, gave me of the tree, and I did eat.\"},{\"verse\":13,\"text\":\"And the Lord God said to the woman: Why hast thou done this? And she answered: The serpent deceived me, and I did eat.\"},{\"verse\":14,\"text\":\"And the Lord God said to the serpent: Because thou hast done this thing, thou art cursed among all cattle, and beasts of the earth: upon thy breast shalt thou go, and earth shalt thou eat all the days of thy life.\"},{\"verse\":15,\"text\":\"I will put enmities between thee and the woman, and thy seed and her seed: she shall crush thy head, and thou shalt lie in wait for her heel.\"},{\"verse\":16,\"text\":\"To the woman also he said: I will multiply thy sorrows, and thy conceptions: in sorrow shalt thou bring forth children, and thou shalt be under thy husband’s power, and he shall have dominion over thee.\"},{\"verse\":17,\"text\":\"And to Adam he said: Because thou hast hearkened to the voice of thy wife, and hast eaten of the tree, whereof I commanded thee, that thou shouldst not eat, cursed is the earth in thy work: with labour and toil shalt thou eat thereof all the days of thy life.\"},{\"verse\":18,\"text\":\"Thorns and thistles shall it bring forth to thee, and thou shalt eat the herbs of the earth.\"},{\"verse\":19,\"text\":\"In the sweat of thy face shalt thou eat bread till thou return to the earth out of which thou wast taken: for dust thou art, and into dust thou shalt return.\"},{\"verse\":20,\"text\":\"And Adam called the name of his wife Eve: because she was the mother of all the living.\"},{\"verse\":21,\"text\":\"And the Lord God made for Adam and his wife garments of skins, and clothed them.\"},{\"verse\":22,\"text\":\"And he said: Behold Adam is become as one of us, knowing good and evil: now therefore lest perhaps he put forth his hand and take also of the tree of life, and eat, and live for ever.\"},{\"verse\":23,\"text\":\"And the Lord God sent him out of the paradise of pleasure, to till the earth from which he was taken.\"},{\"verse\":24,\"text\":\"And he cast out Adam: and placed before the paradise of pleasure Cherubims, and a flaming sword, turning every way, to keep the way of the tree of life.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sed et serpens erat callidior cunctis animantibus terræ quæ fecerat Dominus Deus. Qui dixit ad mulierem : Cur præcepit vobis Deus ut non comederetis de omni ligno paradisi ?\"},{\"verse\":2,\"text\":\"Cui respondit mulier : De fructu lignorum, quæ sunt in paradiso, vescimur :\"},{\"verse\":3,\"text\":\"de fructu vero ligni quod est in medio paradisi, præcepit nobis Deus ne comederemus, et ne tangeremus illud, ne forte moriamur.\"},{\"verse\":4,\"text\":\"Dixit autem serpens ad mulierem : Nequaquam morte moriemini.\"},{\"verse\":5,\"text\":\"Scit enim Deus quod in quocumque die comederitis ex eo, aperientur oculi vestri, et eritis sicut dii, scientes bonum et malum.\"},{\"verse\":6,\"text\":\"Vidit igitur mulier quod bonum esset lignum ad vescendum, et pulchrum oculis, aspectuque delectabile : et tulit de fructu illius, et comedit : deditque viro suo, qui comedit.\"},{\"verse\":7,\"text\":\"Et aperti sunt oculi amborum ; cumque cognovissent se esse nudos, consuerunt folia ficus, et fecerunt sibi perizomata.\"},{\"verse\":8,\"text\":\"Et cum audissent vocem Domini Dei deambulantis in paradiso ad auram post meridiem, abscondit se Adam et uxor ejus a facie Domini Dei in medio ligni paradisi.\"},{\"verse\":9,\"text\":\"Vocavitque Dominus Deus Adam, et dixit ei : Ubi es ?\"},{\"verse\":10,\"text\":\"Qui ait : Vocem tuam audivi in paradiso, et timui, eo quod nudus essem, et abscondi me.\"},{\"verse\":11,\"text\":\"Cui dixit : Quis enim indicavit tibi quod nudus esses, nisi quod ex ligno de quo præceperam tibi ne comederes, comedisti ?\"},{\"verse\":12,\"text\":\"Dixitque Adam : Mulier, quam dedisti mihi sociam, dedit mihi de ligno, et comedi.\"},{\"verse\":13,\"text\":\"Et dixit Dominus Deus ad mulierem : Quare hoc fecisti ? Quæ respondit : Serpens decepit me, et comedi.\"},{\"verse\":14,\"text\":\"Et ait Dominus Deus ad serpentem : Quia fecisti hoc, maledictus es inter omnia animantia, et bestias terræ : super pectus tuum gradieris, et terram comedes cunctis diebus vitæ tuæ.\"},{\"verse\":15,\"text\":\"Inimicitias ponam inter te et mulierem, et semen tuum et semen illius : ipsa conteret caput tuum, et tu insidiaberis calcaneo ejus.\"},{\"verse\":16,\"text\":\"Mulieri quoque dixit : Multiplicabo ærumnas tuas, et conceptus tuos : in dolore paries filios, et sub viri potestate eris, et ipse dominabitur tui.\"},{\"verse\":17,\"text\":\"Adæ vero dixit : Quia audisti vocem uxoris tuæ, et comedisti de ligno, ex quo præceperam tibi ne comederes, maledicta terra in opere tuo : in laboribus comedes ex ea cunctis diebus vitæ tuæ.\"},{\"verse\":18,\"text\":\"Spinas et tribulos germinabit tibi, et comedes herbam terræ.\"},{\"verse\":19,\"text\":\"In sudore vultus tui vesceris pane, donec revertaris in terram de qua sumptus es : quia pulvis es et in pulverem reverteris.\"},{\"verse\":20,\"text\":\"Et vocavit Adam nomen uxoris suæ, Heva : eo quod mater esset cunctorum viventium.\"},{\"verse\":21,\"text\":\"Fecit quoque Dominus Deus Adæ et uxori ejus tunicas pelliceas, et induit eos :\"},{\"verse\":22,\"text\":\"et ait : Ecce Adam quasi unus ex nobis factus est, sciens bonum et malum : nunc ergo ne forte mittat manum suam, et sumat etiam de ligno vitæ, et comedat, et vivat in æternum.\"},{\"verse\":23,\"text\":\"Et emisit eum Dominus Deus de paradiso voluptatis, ut operaretur terram de qua sumptus est.\"},{\"verse\":24,\"text\":\"Ejecitque Adam : et collocavit ante paradisum voluptatis cherubim, et flammeum gladium, atque versatilem, ad custodiendam viam ligni vitæ.\"}],\"summary\":\"The serpent’s craft. The fall of our first parents. Their punishment. The promise of a Redeemer.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":2,\"label\":\"Genesis 2\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":4,\"label\":\"Genesis 4\"}}]]\n"])</script></body></html>
