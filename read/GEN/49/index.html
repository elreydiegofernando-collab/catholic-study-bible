-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">49</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob’s prophetical blessings of his twelve sons: his death.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jacob called his sons, and said to them: Gather yourselves together, that I may tell you the things that shall befall you in the last days.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Gather yourselves together, and hear, O ye sons of Jacob, hearken to Israel, your father:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ruben, my firstborn, thou art my strength, and the beginning of my sorrow; excelling in gifts, greater in command.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou art poured out as water, grow thou not; because thou wentest up to thy father’s bed, and didst defile his couch.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Simeon and Levi brethren: vessels of iniquity waging war.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Let not my soul go into their counsel, nor my glory be in their assembly: because in their fury they slew a man, and in their self-will they undermined a wall.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cursed be their fury, because it was stubborn: and their wrath, because it was cruel: I will divide them in Jacob, and will scatter them in Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Juda, thee shall thy brethren praise: thy hand shall be on the necks of thy enemies; the sons of thy father shall bow down to thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Juda is a lion’s whelp: to the prey, my son, thou art gone up: resting thou hast couched as a lion, and as a lioness, who shall rouse him?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The sceptre shall not be taken away from Juda, nor a ruler from his thigh, till he come that is to be sent, and he shall be the expectation of nations.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Tying his foal to the vineyard, and his ass, O my son, to the vine. He shall wash his robe in wine, and his garment in the blood of the grape.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>His eyes are more beautiful than wine, and his teeth whiter than milk.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Zabulon shall dwell on the seashore, and in the road of ships, reaching as far as Sidon.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Issachar shall be a strong ass, lying down between the borders.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He saw rest that it was good: and the land that it was excellent: and he bowed his shoulder to carry, and became a servant under tribute.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dan shall judge his people like another tribe in Israel.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let Dan be a snake in the way, a serpent in the path, that biteth the horse’s heels, that his rider may fall backward.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will look for thy salvation, O Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Gad, being girded, shall fight before him: and he himself shall be girded backward.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Aser, his bread shall be fat, and he shall yield dainties to kings.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nephthali, a hart let loose, and giving words of beauty.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Joseph is a growing son, a growing son and comely to behold: the daughters run to and fro upon the wall;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But they that held darts, provoked him, and quarrelled with him, and envied him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>His bow rested upon the strong, and the bands of his arms and his hands were loosed, by the hands of the mighty one of Jacob: thence he came forth a pastor, the stone of Israel.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The God of thy father shall be thy helper, and the Almighty shall bless thee with the blessings of heaven above, with the blessings of the deep that lieth beneath, with the blessings of the breasts and of the womb.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The blessings of thy father are strengthened with the blessings of his fathers: until the desire of the everlasting hills should come: may they be upon the head of Joseph, and upon the crown of the Nazarite among his brethren.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Benjamin a ravenous wolf, in the morning shall eat the prey, and in the evening shall divide the spoil.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>All these are the twelve tribes of Israel: these things their father spoke to them, and he blessed every one with their proper blessings.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he charged them, saying: I am now going to be gathered to my people: bury me with my fathers in the double cave, which is in the field of Ephron the Hethite,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Over against Mambre, in the land of Chanaan, which Abraham bought together with the field, of Ephron the Hethite, for a possession to bury in.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>There they buried him, and Sara his wife: there was Isaac buried with Rebecca, his wife: there also Lia doth lie buried.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when he had ended the commandments, wherewith he instructed his sons, he drew up his feet upon the bed, and died: and he was gathered to his people.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vocavit autem Jacob filios suos, et ait eis : Congregamini, ut annuntiem quæ ventura sunt vobis in diebus novissimis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Congregamini, et audite, filii Jacob, audite Israël patrem vestrum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ruben, primogenitus meus, tu fortitudo mea, et principium doloris mei ; prior in donis, major in imperio.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Effusus es sicut aqua, non crescas : quia ascendisti cubile patris tui, et maculasti stratum ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Simeon et Levi fratres vasa iniquitatis bellantia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In consilium eorum non veniat anima mea, et in cœtu illorum non sit gloria mea : quia in furore suo occiderunt virum, et in voluntate sua suffoderunt murum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Maledictus furor eorum, quia pertinax : et indignatio eorum, quia dura : dividam eos in Jacob, et dispergam eos in Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Juda, te laudabunt fratres tui : manus tua in cervicibus inimicorum tuorum, adorabunt te filii patris tui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Catulus leonis Juda : ad prædam, fili mi, ascendisti : requiescens accubuisti ut leo, et quasi leæna : quis suscitabit eum ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non auferetur sceptrum de Juda, et dux de femore ejus, donec veniat qui mittendus est, et ipse erit expectatio gentium.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ligans ad vineam pullum suum, et ad vitem, o fili mi, asinam suam, lavabit in vino stolam suam et in sanguine uvæ pallium suum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Pulchriores sunt oculi ejus vino, et dentes ejus lacte candidiores.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Zabulon in littore maris habitabit, et in statione navium pertingens usque ad Sidonem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Issachar asinus fortis accubans inter terminos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vidit requiem, quod esset bona et terram, quod optima : et supposuit humerum suum ad portandum, factusque est tributis serviens.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dan judicabit populum suum sicut et alia tribus in Israël.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fiat Dan coluber in via, cerastes in semita, mordens ungulas equi, ut cadat ascensor ejus retro.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Salutare tuum expectabo, Domine.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Gad, accinctus præliabitur ante eum : et ipse accingetur retrorsum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Aser, pinguis panis ejus, et præbebit delicias regibus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nephthali, cervus emissus, et dans eloquia pulchritudinis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Filius accrescens Joseph, filius accrescens et decorus aspectu : filiæ discurrerunt super murum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sed exasperaverunt eum et jurgati sunt, invideruntque illi habentes jacula.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Sedit in forti arcus ejus, et dissoluta sunt vincula brachiorum et manuum illius per manus potentis Jacob : inde pastor egressus est, lapis Israël.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Deus patris tui erit adjutor tuus, et omnipotens benedicet tibi benedictionibus cæli desuper, benedictionibus abyssi jacentis deorsum, benedictionibus uberum et vulvæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Benedictiones patris tui confortatæ sunt benedictionibus patrum ejus, donec veniret desiderium collium æternorum : fiant in capite Joseph, et in vertice Nazaræi inter fratres suos.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Benjamin lupus rapax, mane comedat prædam, et vespere dividet spolia.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Omnes hi in tribubus Israël duodecim : hæc locutus est eis pater suus, benedixitque singulis benedictionibus propriis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et præcepit eis, dicens : Ego congregor ad populum meum : sepelite me cum patribus meis in spelunca duplici quæ est in agro Ephron Hethæi,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>contra Mambre in terra Chanaan, quam emit Abraham cum agro ab Ephron Hethæo in possessionem sepulchri.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ibi sepelierunt eum, et Saram uxorem ejus : ibi sepultus est Isaac cum Rebecca conjuge sua : ibi et Lia condita jacet.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Finitisque mandatis quibus filios instruebat, collegit pedes suos super lectulum, et obiit : appositusque est ad populum suum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/48/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 48</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bi ",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"GEN.49\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":49,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And Jacob called his sons, and said to them: Gather yourselves together, that I may tell you the things that shall befall you in the last days.\"},{\"verse\":2,\"text\":\"Gather yourselves together, and hear, O ye sons of Jacob, hearken to Israel, your father:\"},{\"verse\":3,\"text\":\"Ruben, my firstborn, thou art my strength, and the beginning of my sorrow; excelling in gifts, greater in command.\"},{\"verse\":4,\"text\":\"Thou art poured out as water, grow thou not; because thou wentest up to thy father’s bed, and didst defile his couch.\"},{\"verse\":5,\"text\":\"Simeon and Levi brethren: vessels of iniquity waging war.\"},{\"verse\":6,\"text\":\"Let not my soul go into their counsel, nor my glory be in their assembly: because in their fury they slew a man, and in their self-will they undermined a wall.\"},{\"verse\":7,\"text\":\"Cursed be their fury, because it was stubborn: and their wrath, because it was cruel: I will divide them in Jacob, and will scatter them in Israel.\"},{\"verse\":8,\"text\":\"Juda, thee shall thy brethren praise: thy hand shall be on the necks of thy enemies; the sons of thy father shall bow down to thee.\"},{\"verse\":9,\"text\":\"Juda is a lion’s whelp: to the prey, my son, thou art gone up: resting thou hast couched as a lion, and as a lioness, who shall rouse him?\"},{\"verse\":10,\"text\":\"The sceptre shall not be taken away from Juda, nor a ruler from his thigh, till he come that is to be sent, and he shall be the expectation of nations.\"},{\"verse\":11,\"text\":\"Tying his foal to the vineyard, and his ass, O my son, to the vine. He shall wash his robe in wine, and his garment in the blood of the grape.\"},{\"verse\":12,\"text\":\"His eyes are more beautiful than wine, and his teeth whiter than milk.\"},{\"verse\":13,\"text\":\"Zabulon shall dwell on the seashore, and in the road of ships, reaching as far as Sidon.\"},{\"verse\":14,\"text\":\"Issachar shall be a strong ass, lying down between the borders.\"},{\"verse\":15,\"text\":\"He saw rest that it was good: and the land that it was excellent: and he bowed his shoulder to carry, and became a servant under tribute.\"},{\"verse\":16,\"text\":\"Dan shall judge his people like another tribe in Israel.\"},{\"verse\":17,\"text\":\"Let Dan be a snake in the way, a serpent in the path, that biteth the horse’s heels, that his rider may fall backward.\"},{\"verse\":18,\"text\":\"I will look for thy salvation, O Lord.\"},{\"verse\":19,\"text\":\"Gad, being girded, shall fight before him: and he himself shall be girded backward.\"},{\"verse\":20,\"text\":\"Aser, his bread shall be fat, and he shall yield dainties to kings.\"},{\"verse\":21,\"text\":\"Nephthali, a hart let loose, and giving words of beauty.\"},{\"verse\":22,\"text\":\"Joseph is a growing son, a growing son and comely to behold: the daughters run to and fro upon the wall;\"},{\"verse\":23,\"text\":\"But they that held darts, provoked him, and quarrelled with him, and envied him.\"},{\"verse\":24,\"text\":\"His bow rested upon the strong, and the bands of his arms and his hands were loosed, by the hands of the mighty one of Jacob: thence he came forth a pastor, the stone of Israel.\"},{\"verse\":25,\"text\":\"The God of thy father shall be thy helper, and the Almighty shall bless thee with the blessings of heaven above, with the blessings of the deep that lieth beneath, with the blessings of the breasts and of the womb.\"},{\"verse\":26,\"text\":\"The blessings of thy father are strengthened with the blessings of his fathers: until the desire of the everlasting hills should come: may they be upon the head of Joseph, and upon the crown of the Nazarite among his brethren.\"},{\"verse\":27,\"text\":\"Benjamin a ravenous wolf, in the morning shall eat the prey, and in the evening shall divide the spoil.\"},{\"verse\":28,\"text\":\"All these are the twelve tribes of Israel: these things their father spoke to them, and he blessed every one with their proper blessings.\"},{\"verse\":29,\"text\":\"And he charged them, saying: I am now going to be gathered to my people: bury me with my fathers in the double cave, which is in the field of Ephron the Hethite,\"},{\"verse\":30,\"text\":\"Over against Mambre, in the land of Chanaan, which Abraham bought together with the field, of Ephron the Hethite, for a possession to bury in.\"},{\"verse\":31,\"text\":\"There they buried him, and Sara his wife: there was Isaac buried with Rebecca, his wife: there also Lia doth lie buried.\"},{\"verse\":32,\"text\":\"And when he had ended the commandments, wherewith he instructed his sons, he drew up his feet upon the bed, and died: and he was gathered to his people.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vocavit autem Jacob filios suos, et ait eis : Congregamini, ut annuntiem quæ ventura sunt vobis in diebus novissimis.\"},{\"verse\":2,\"text\":\"Congregamini, et audite, filii Jacob, audite Israël patrem vestrum :\"},{\"verse\":3,\"text\":\"Ruben, primogenitus meus, tu fortitudo mea, et principium doloris mei ; prior in donis, major in imperio.\"},{\"verse\":4,\"text\":\"Effusus es sicut aqua, non crescas : quia ascendisti cubile patris tui, et maculasti stratum ejus.\"},{\"verse\":5,\"text\":\"Simeon et Levi fratres vasa iniquitatis bellantia.\"},{\"verse\":6,\"text\":\"In consilium eorum non veniat anima mea, et in cœtu illorum non sit gloria mea : quia in furore suo occiderunt virum, et in voluntate sua suffoderunt murum.\"},{\"verse\":7,\"text\":\"Maledictus furor eorum, quia pertinax : et indignatio eorum, quia dura : dividam eos in Jacob, et dispergam eos in Israël.\"},{\"verse\":8,\"text\":\"Juda, te laudabunt fratres tui : manus tua in cervicibus inimicorum tuorum, adorabunt te filii patris tui.\"},{\"verse\":9,\"text\":\"Catulus leonis Juda : ad prædam, fili mi, ascendisti : requiescens accubuisti ut leo, et quasi leæna : quis suscitabit eum ?\"},{\"verse\":10,\"text\":\"Non auferetur sceptrum de Juda, et dux de femore ejus, donec veniat qui mittendus est, et ipse erit expectatio gentium.\"},{\"verse\":11,\"text\":\"Ligans ad vineam pullum suum, et ad vitem, o fili mi, asinam suam, lavabit in vino stolam suam et in sanguine uvæ pallium suum.\"},{\"verse\":12,\"text\":\"Pulchriores sunt oculi ejus vino, et dentes ejus lacte candidiores.\"},{\"verse\":13,\"text\":\"Zabulon in littore maris habitabit, et in statione navium pertingens usque ad Sidonem.\"},{\"verse\":14,\"text\":\"Issachar asinus fortis accubans inter terminos.\"},{\"verse\":15,\"text\":\"Vidit requiem, quod esset bona et terram, quod optima : et supposuit humerum suum ad portandum, factusque est tributis serviens.\"},{\"verse\":16,\"text\":\"Dan judicabit populum suum sicut et alia tribus in Israël.\"},{\"verse\":17,\"text\":\"Fiat Dan coluber in via, cerastes in semita, mordens ungulas equi, ut cadat ascensor ejus retro.\"},{\"verse\":18,\"text\":\"Salutare tuum expectabo, Domine.\"},{\"verse\":19,\"text\":\"Gad, accinctus præliabitur ante eum : et ipse accingetur retrorsum.\"},{\"verse\":20,\"text\":\"Aser, pinguis panis ejus, et præbebit delicias regibus.\"},{\"verse\":21,\"text\":\"Nephthali, cervus emissus, et dans eloquia pulchritudinis.\"},{\"verse\":22,\"text\":\"Filius accrescens Joseph, filius accrescens et decorus aspectu : filiæ discurrerunt super murum.\"},{\"verse\":23,\"text\":\"Sed exasperaverunt eum et jurgati sunt, invideruntque illi habentes jacula.\"},{\"verse\":24,\"text\":\"Sedit in forti arcus ejus, et dissoluta sunt vincula brachiorum et manuum illius per manus potentis Jacob : inde pastor egressus est, lapis Israël.\"},{\"verse\":25,\"text\":\"Deus patris tui erit adjutor tuus, et omnipotens benedicet tibi benedictionibus cæli desuper, benedictionibus abyssi jacentis deorsum, benedictionibus uberum et vulvæ.\"},{\"verse\":26,\"text\":\"Benedictiones patris tui confortatæ sunt benedictionibus patrum ejus, donec veniret desiderium collium æternorum : fiant in capite Joseph, et in vertice Nazaræi inter fratres suos.\"},{\"verse\":27,\"text\":\"Benjamin lupus rapax, mane comedat prædam, et vespere dividet spolia.\"},{\"verse\":28,\"text\":\"Omnes hi in tribubus Israël duodecim : hæc locutus est eis pater suus, benedixitque singulis benedictionibus propriis.\"},{\"verse\":29,\"text\":\"Et præcepit eis, dicens : Ego congregor ad populum meum : sepelite me cum patribus meis in spelunca duplici quæ est in agro Ephron Hethæi,\"},{\"verse\":30,\"text\":\"contra Mambre in terra Chanaan, quam emit Abraham cum agro ab Ephron Hethæo in possessionem sepulchri.\"},{\"verse\":31,\"text\":\"Ibi sepelierunt eum, et Saram uxorem ejus : ibi sepultus est Isaac cum Rebecca conjuge sua : ibi et Lia condita jacet.\"},{\"verse\":32,\"text\":\"Finitisque mandatis quibus filios instruebat, collegit pedes suos super lectulum, et obiit : appositusque est ad populum suum.\"}],\"summary\":\"Jacob’s prophetical blessings of his twelve sons: his death.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":48,\"label\":\"Genesis 48\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":50,\"label\":\"Genesis 50\"}}]]\n"])</script></body></html>
