[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Man’s sin is the cause of the deluge. Noe is commanded to build the ark.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And after that men began to be multiplied upon the earth, and daughters were born to them,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The sons of God seeing the daughters of men, that they were fair, took to themselves wives of all which they chose.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And God said: My spirit shall not remain in man for ever, because he is flesh, and his days shall be a hundred and twenty years.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Now giants were upon the earth in those days. For after the sons of God went in to the daughters of men, and they brought forth children, these are the mighty men of old, men of renown.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And God seeing that the wickedness of men was great on the earth, and that all the thought of their heart was bent upon evil at all times,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>It repented him that he had made man on the earth. And being touched inwardly with sorrow of heart,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He said: I will destroy man, whom I have created, from the face of the earth, from man even to beasts, from the creeping thing even to the fowls of the air, for it repenteth me that I have made them.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But Noe found grace before the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>These are the generations of Noe: Noe was a just and perfect man in his generations, he walked with God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he begot three sons, Sem, Cham, and Japheth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the earth was corrupted before God, and was filled with iniquity.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when God had seen that the earth was corrupted (for all flesh had corrupted its way upon the earth),</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He said to Noe: The end of all flesh is come before me, the earth is filled with iniquity through them, and I will destroy them with the earth.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Make thee an ark of timber planks: thou shalt make little rooms in the ark, and thou shalt pitch it within and without.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thus shalt thou make it. The length of the ark shall be three hundred cubits: the breadth of it fifty cubits, and the height of it thirty cubits.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou shalt make a window in the ark, and in a cubit shalt thou finish the top of it: and the door of the ark thou shalt set in the side: with lower, middle chambers, and third stories shalt thou make it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Behold, I will bring the waters of a great flood upon the earth, to destroy all flesh, wherein is the breath of life under heaven. All things that are in the earth shall be consumed.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And I will establish my covenant with thee, and thou shalt enter into the ark, thou and thy sons, and thy wife, and the wives of thy sons with thee.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And of every living creature of all flesh, thou shalt bring two of a sort into the ark, that they may live with thee: of the male sex, and the female.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of fowls according to their kind, and of beasts in their kind, and of every thing that creepeth on the earth according to its kind: two of every sort shall go in with thee, that they may live.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thou shalt take unto thee of all food that may be eaten, and thou shalt lay it up with thee: and it shall be food for thee and them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Noe did all things which God commanded him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cumque cœpissent homines multiplicari super terram, et filias procreassent,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>videntes filii Dei filias hominum quod essent pulchræ, acceperunt sibi uxores ex omnibus, quas elegerant.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixitque Deus : Non permanebit spiritus meus in homine in æternum, quia caro est : eruntque dies illius centum viginti annorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Gigantes autem erant super terram in diebus illis : postquam enim ingressi sunt filii Dei ad filias hominum, illæque genuerunt, isti sunt potentes a sæculo viri famosi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Videns autem Deus quod multa malitia hominum esset in terra, et cuncta cogitatio cordis intenta esset ad malum omni tempore,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>pœnituit eum quod hominum fecisset in terra. Et tactus dolore cordis intrinsecus,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Delebo, inquit, hominem, quem creavi, a facie terræ, ab homine usque ad animantia, a reptili usque ad volucres cæli : pœnitet enim me fecisse eos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Noë vero invenit gratiam coram Domino.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæ sunt generationes Noë : Noë vir justus atque perfectus fuit in generationibus suis ; cum Deo ambulavit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et genuit tres filios, Sem, Cham et Japheth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Corrupta est autem terra coram Deo, et repleta est iniquitate.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cumque vidisset Deus terram esse corruptam (omnis quippe caro corruperat viam suam super terram),</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>dixit ad Noë : Finis universæ carnis venit coram me : repleta est terra iniquitate a facie eorum, et ego disperdam eos cum terra.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fac tibi arcam de lignis lævigatis ; mansiunculas in arca facies, et bitumine linies intrinsecus et extrinsecus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et sic facies eam : trecentorum cubitorum erit longitudo arcæ, quinquaginta cubitorum latitudo, et triginta cubitorum altitudo illius.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fenestram in arca facies, et in cubito consummabis summitatem ejus : ostium autem arcæ pones ex latere ; deorsum, cœnacula et tristega facies in ea.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ecce ego adducam aquas diluvii super terram, ut interficiam omnem carnem, in qua spiritus vitæ est subter cælum : universa quæ in terra sunt, consumentur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ponamque fœdus meum tecum : et ingredieris arcam tu et filii tui, uxor tua, et uxores filiorum tuorum tecum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et ex cunctis animantibus universæ carnis bina induces in arcam, ut vivant tecum : masculini sexus et feminini.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De volucribus juxta genus suum, et de jumentis in genere suo, et ex omni reptili terræ secundum genus suum : bina de omnibus ingredientur tecum, ut possint vivere.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Tolles igitur tecum ex omnibus escis, quæ mandi possunt, et comportabis apud te : et erunt tam tibi, quam illis in cibum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fecit igitur Noë omnia quæ præceperat illi Deus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide t "text\":\"And God said: My spirit shall not remain in man for ever, because he is flesh, and his days shall be a hundred and twenty years.\"},{\"verse\":4,\"text\":\"Now giants were upon the earth in those days. For after the sons of God went in to the daughters of men, and they brought forth children, these are the mighty men of old, men of renown.\"},{\"verse\":5,\"text\":\"And God seeing that the wickedness of men was great on the earth, and that all the thought of their heart was bent upon evil at all times,\"},{\"verse\":6,\"text\":\"It repented him that he had made man on the earth. And being touched inwardly with sorrow of heart,\"},{\"verse\":7,\"text\":\"He said: I will destroy man, whom I have created, from the face of the earth, from man even to beasts, from the creeping thing even to the fowls of the air, for it repenteth me that I have made them.\"},{\"verse\":8,\"text\":\"But Noe found grace before the Lord.\"},{\"verse\":9,\"text\":\"These are the generations of Noe: Noe was a just and perfect man in his generations, he walked with God.\"},{\"verse\":10,\"text\":\"And he begot three sons, Sem, Cham, and Japheth.\"},{\"verse\":11,\"text\":\"And the earth was corrupted before God, and was filled with iniquity.\"},{\"verse\":12,\"text\":\"And when God had seen that the earth was corrupted (for all flesh had corrupted its way upon the earth),\"},{\"verse\":13,\"text\":\"He said to Noe: The end of all flesh is come before me, the earth is filled with iniquity through them, and I will destroy them with the earth.\"},{\"verse\":14,\"text\":\"Make thee an ark of timber planks: thou shalt make little rooms in the ark, and thou shalt pitch it within and without.\"},{\"verse\":15,\"text\":\"And thus shalt thou make it. The length of the ark shall be three hundred cubits: the breadth of it fifty cubits, and the height of it thirty cubits.\"},{\"verse\":16,\"text\":\"Thou shalt make a window in the ark, and in a cubit shalt thou finish the top of it: and the door of the ark thou shalt set in the side: with lower, middle chambers, and third stories shalt thou make it.\"},{\"verse\":17,\"text\":\"Behold, I will bring the waters of a great flood upon the earth, to destroy all flesh, wherein is the breath of life under heaven. All things that are in the earth shall be consumed.\"},{\"verse\":18,\"text\":\"And I will establish my covenant with thee, and thou shalt enter into the ark, thou and thy sons, and thy wife, and the wives of thy sons with thee.\"},{\"verse\":19,\"text\":\"And of every living creature of all flesh, thou shalt bring two of a sort into the ark, that they may live with thee: of the male sex, and the female.\"},{\"verse\":20,\"text\":\"Of fowls according to their kind, and of beasts in their kind, and of every thing that creepeth on the earth according to its kind: two of every sort shall go in with thee, that they may live.\"},{\"verse\":21,\"text\":\"Thou shalt take unto thee of all food that may be eaten, and thou shalt lay it up with thee: and it shall be food for thee and them.\"},{\"verse\":22,\"text\":\"And Noe did all things which God commanded him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cumque cœpissent homines multiplicari super terram, et filias procreassent,\"},{\"verse\":2,\"text\":\"videntes filii Dei filias hominum quod essent pulchræ, acceperunt sibi uxores ex omnibus, quas elegerant.\"},{\"verse\":3,\"text\":\"Dixitque Deus : Non permanebit spiritus meus in homine in æternum, quia caro est : eruntque dies illius centum viginti annorum.\"},{\"verse\":4,\"text\":\"Gigantes autem erant super terram in diebus illis : postquam enim ingressi sunt filii Dei ad filias hominum, illæque genuerunt, isti sunt potentes a sæculo viri famosi.\"},{\"verse\":5,\"text\":\"Videns autem Deus quod multa malitia hominum esset in terra, et cuncta cogitatio cordis intenta esset ad malum omni tempore,\"},{\"verse\":6,\"text\":\"pœnituit eum quod hominum fecisset in terra. Et tactus dolore cordis intrinsecus,\"},{\"verse\":7,\"text\":\"Delebo, inquit, hominem, quem creavi, a facie terræ, ab homine usque ad animantia, a reptili usque ad volucres cæli : pœnitet enim me fecisse eos.\"},{\"verse\":8,\"text\":\"Noë vero invenit gratiam coram Domino.\"},{\"verse\":9,\"text\":\"Hæ sunt generationes Noë : Noë vir justus atque perfectus fuit in generationibus suis ; cum Deo ambulavit.\"},{\"verse\":10,\"text\":\"Et genuit tres filios, Sem, Cham et Japheth.\"},{\"verse\":11,\"text\":\"Corrupta est autem terra coram Deo, et repleta est iniquitate.\"},{\"verse\":12,\"text\":\"Cumque vidisset Deus terram esse corruptam (omnis quippe caro corruperat viam suam super terram),\"},{\"verse\":13,\"text\":\"dixit ad Noë : Finis universæ carnis venit coram me : repleta est terra iniquitate a facie eorum, et ego disperdam eos cum terra.\"},{\"verse\":14,\"text\":\"Fac tibi arcam de lignis lævigatis ; mansiunculas in arca facies, et bitumine linies intrinsecus et extrinsecus.\"},{\"verse\":15,\"text\":\"Et sic facies eam : trecentorum cubitorum erit longitudo arcæ, quinquaginta cubitorum latitudo, et triginta cubitorum altitudo illius.\"},{\"verse\":16,\"text\":\"Fenestram in arca facies, et in cubito consummabis summitatem ejus : ostium autem arcæ pones ex latere ; deorsum, cœnacula et tristega facies in ea.\"},{\"verse\":17,\"text\":\"Ecce ego adducam aquas diluvii super terram, ut interficiam omnem carnem, in qua spiritus vitæ est subter cælum : universa quæ in terra sunt, consumentur.\"},{\"verse\":18,\"text\":\"Ponamque fœdus meum tecum : et ingredieris arcam tu et filii tui, uxor tua, et uxores filiorum tuorum tecum.\"},{\"verse\":19,\"text\":\"Et ex cunctis animantibus universæ carnis bina induces in arcam, ut vivant tecum : masculini sexus et feminini.\"},{\"verse\":20,\"text\":\"De volucribus juxta genus suum, et de jumentis in genere suo, et ex omni reptili terræ secundum genus suum : bina de omnibus ingredientur tecum, ut possint vivere.\"},{\"verse\":21,\"text\":\"Tolles igitur tecum ex omnibus escis, quæ mandi possunt, et comportabis apud te : et erunt tam tibi, quam illis in cibum.\"},{\"verse\":22,\"text\":\"Fecit igitur Noë omnia quæ præceperat illi Deus.\"}],\"summary\":\"Man’s sin is the cause of the deluge. Noe is commanded to build the ark.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":5,\"label\":\"Genesis 5\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":7,\"label\":\"Genesis 7\"}}]]\n"])</script></body></html>
