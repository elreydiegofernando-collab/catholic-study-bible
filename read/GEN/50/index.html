m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">50</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The mourning for Jacob, and his interment. Joseph’s kindness towards his brethren. His death.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And when Joseph saw this, he fell upon his father’s face, weeping and kissing him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he commanded his servants, the physicians, to embalm his father.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And while they were fulfilling his commands, there passed forty days: for this was the manner with bodies that were embalmed, and Egypt mourned for him seventy days.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the time of the mourning being expired, Joseph spoke to the family of Pharao: If I have found favour in your sight, speak in the ears of Pharao:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For my father made me swear to him, saying: Behold I die; thou shalt bury me in my sepulchre which I have digged for myself in the land of Chanaan. So I will go up and bury my father, and return.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Pharao said to him: Go up and bury thy father according as he made thee swear.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>So he went up, and there went with him all the ancients of Pharao’s house, and all the elders of the land of Egypt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the house of Joseph with his brethren, except their children, and their flocks and herds, which they left in the land of Gessen.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He had also in his train chariots and horsemen: and it was a great company.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And they came to the threshing floor of Atad, which is situated beyond the Jordan: where celebrating the exequies with a great and vehement lamentation, they spent full seven days.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when the inhabitants of Chanaan saw this, they said: This is a great mourning to the Egyptians. And therefore the name of that place was called, The mourning of Egypt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>So the sons of Jacob did as he had commanded them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And carrying him into the land of Chanaan, they buried him in the double cave, which Abraham had bought together with the field for a possession of a burying place, of Ephron, the Hethite, over against Mambre.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Joseph returned into Egypt with his brethren, and all that were in his company, after he had buried his father.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Now he being dead, his brethren were afraid, and talked one with another: Lest perhaps he should remember the wrong he suffered, and requite us all the evil that we did to him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they sent a message to him, saying: Thy father commanded us before he died,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>That we should say thus much to thee from him: I beseech thee to forget the wickedness of thy brethren, and the sin and malice they practised against thee: we also pray thee, to forgive the servants of the God of thy father this wickedness. And when Joseph heard this, he wept.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And his brethren came to him; and worshipping prostrate on the ground, they said: We are thy servants.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he answered them: Fear not: can we resist the will of God?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>You thought evil against me: but God turned it into good, that he might exalt me, as at present you see, and might save many people.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fear not: I will feed you and your children. And he comforted them, and spoke gently and mildly.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he dwelt in Egypt with all his father’s house; and lived a hundred and ten years. And he saw the children of Ephraim to the third generation. The children also of Machir, the sons of Manasses, were born on Joseph’s knees.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>After which he told his brethren: God will visit you after my death, and will make you go up out of this land, to the land which he swore to Abraham, Isaac, and Jacob.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he made them swear to him, saying: God will visit you, carry my bones with you out of this place:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he died, being a hundred and ten years old. And being embalmed, he was laid in a coffin in Egypt.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quod cernens Joseph, ruit super faciem patris, flens et deosculans eum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Præcepitque servis suis medicis ut aromatibus condirent patrem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quibus jussa explentibus, transierunt quadraginta dies : iste quippe mos erat cadaverum conditorum : flevitque eum Ægyptus septuaginta diebus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et expleto planctus tempore, locutus est Joseph ad familiam Pharaonis : Si inveni gratiam in conspectu vestro, loquimini in auribus Pharaonis :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>eo quod pater meus adjuraverit me dicens : En morior : in sepulchro meo, quod fodi mihi in terra Chanaan, sepelies me. Ascendam igitur, et sepeliam patrem meum, ac revertar.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque ei Pharao : Ascende, et sepeli patrem tuum sicut adjuratus es.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quo ascendente, ierunt cum eo omnes senes domus Pharaonis, cunctique majores natu terræ Ægypti :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>domus Joseph cum fratribus suis, absque parvulis, et gregibus atque armentis, quæ dereliquerant in terra Gessen.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Habuit quoque in comitatu currus et equites : et facta est turba non modica.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Veneruntque ad Aream Atad, quæ sita est trans Jordanem : ubi celebrantes exequias planctu magno atque vehementi impleverunt septem dies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quod cum vidissent habitatores terræ Chanaan, dixerunt : Planctus magnus est iste Ægyptiis. Et idcirco vocatum est nomen loci illius, Planctus Ægypti.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Fecerunt ergo filii Jacob sicut præceperat eis :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et portantes eum in terram Chanaan, sepelierunt eum in spelunca duplici, quam emerat Abraham cum agro in possessionem sepulchri ab Ephron Hethæo, contra faciem Mambre.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Reversusque est Joseph in Ægyptum cum fratribus suis, et omni comitatu, sepulto patre.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quo mortuo, timentes fratres ejus, et mutuo colloquentes : Ne forte memor sit injuriæ quam passus est, et reddat nobis omne malum quod fecimus,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>mandaverunt ei dicentes : Pater tuus præcepit nobis antequam moreretur,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>ut hæc tibi verbis illius diceremus : Obsecro ut obliviscaris sceleris fratrum tuorum, et peccati atque malitiæ quam exercuerunt in te : nos quoque oramus ut servis Dei patris tui dimittas iniquitatem hanc. Quibus auditis flevit Joseph.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Veneruntque ad eum fratres sui : et proni adorantes in terram, dixerunt : Servi tui sumus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quibus ille respondit : Nolite timere : num Dei possumus resistere voluntati ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vos cogitastis de me malum : sed Deus vertit illud in bonum, ut exaltaret me, sicut in præsentiarum cernitis, et salvos faceret multos populos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nolite timere : ego pascam vos et parvulos vestros : consolatusque est eos, et blande ac leniter est locutus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et habitavit in Ægypto cum omni domo patris sui : vixitque centum decem annis. Et vidit Ephraim filios usque ad tertiam generationem. Filii quoque Machir filii Manasse nati sunt in genibus Joseph.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quibus transactis, locutus est fratribus suis : Post mortem meam Deus visitabit vos, et ascendere vos faciet de terra ista ad terram quam juravit Abraham, Isaac et Jacob.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Cumque adjurasset eos atque dixisset : Deus visitabit vos, asportate ossa mea vobiscum de loco isto :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>mortuus est, expletis centum decem vitæ suæ annis. Et conditus aromatibus, repositus est in loculo in Ægypto.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/49/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 49</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 sh ",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"GEN.50\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":50,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And when Joseph saw this, he fell upon his father’s face, weeping and kissing him.\"},{\"verse\":2,\"text\":\"And he commanded his servants, the physicians, to embalm his father.\"},{\"verse\":3,\"text\":\"And while they were fulfilling his commands, there passed forty days: for this was the manner with bodies that were embalmed, and Egypt mourned for him seventy days.\"},{\"verse\":4,\"text\":\"And the time of the mourning being expired, Joseph spoke to the family of Pharao: If I have found favour in your sight, speak in the ears of Pharao:\"},{\"verse\":5,\"text\":\"For my father made me swear to him, saying: Behold I die; thou shalt bury me in my sepulchre which I have digged for myself in the land of Chanaan. So I will go up and bury my father, and return.\"},{\"verse\":6,\"text\":\"And Pharao said to him: Go up and bury thy father according as he made thee swear.\"},{\"verse\":7,\"text\":\"So he went up, and there went with him all the ancients of Pharao’s house, and all the elders of the land of Egypt.\"},{\"verse\":8,\"text\":\"And the house of Joseph with his brethren, except their children, and their flocks and herds, which they left in the land of Gessen.\"},{\"verse\":9,\"text\":\"He had also in his train chariots and horsemen: and it was a great company.\"},{\"verse\":10,\"text\":\"And they came to the threshing floor of Atad, which is situated beyond the Jordan: where celebrating the exequies with a great and vehement lamentation, they spent full seven days.\"},{\"verse\":11,\"text\":\"And when the inhabitants of Chanaan saw this, they said: This is a great mourning to the Egyptians. And therefore the name of that place was called, The mourning of Egypt.\"},{\"verse\":12,\"text\":\"So the sons of Jacob did as he had commanded them.\"},{\"verse\":13,\"text\":\"And carrying him into the land of Chanaan, they buried him in the double cave, which Abraham had bought together with the field for a possession of a burying place, of Ephron, the Hethite, over against Mambre.\"},{\"verse\":14,\"text\":\"And Joseph returned into Egypt with his brethren, and all that were in his company, after he had buried his father.\"},{\"verse\":15,\"text\":\"Now he being dead, his brethren were afraid, and talked one with another: Lest perhaps he should remember the wrong he suffered, and requite us all the evil that we did to him.\"},{\"verse\":16,\"text\":\"And they sent a message to him, saying: Thy father commanded us before he died,\"},{\"verse\":17,\"text\":\"That we should say thus much to thee from him: I beseech thee to forget the wickedness of thy brethren, and the sin and malice they practised against thee: we also pray thee, to forgive the servants of the God of thy father this wickedness. And when Joseph heard this, he wept.\"},{\"verse\":18,\"text\":\"And his brethren came to him; and worshipping prostrate on the ground, they said: We are thy servants.\"},{\"verse\":19,\"text\":\"And he answered them: Fear not: can we resist the will of God?\"},{\"verse\":20,\"text\":\"You thought evil against me: but God turned it into good, that he might exalt me, as at present you see, and might save many people.\"},{\"verse\":21,\"text\":\"Fear not: I will feed you and your children. And he comforted them, and spoke gently and mildly.\"},{\"verse\":22,\"text\":\"And he dwelt in Egypt with all his father’s house; and lived a hundred and ten years. And he saw the children of Ephraim to the third generation. The children also of Machir, the sons of Manasses, were born on Joseph’s knees.\"},{\"verse\":23,\"text\":\"After which he told his brethren: God will visit you after my death, and will make you go up out of this land, to the land which he swore to Abraham, Isaac, and Jacob.\"},{\"verse\":24,\"text\":\"And he made them swear to him, saying: God will visit you, carry my bones with you out of this place:\"},{\"verse\":25,\"text\":\"And he died, being a hundred and ten years old. And being embalmed, he was laid in a coffin in Egypt.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quod cernens Joseph, ruit super faciem patris, flens et deosculans eum.\"},{\"verse\":2,\"text\":\"Præcepitque servis suis medicis ut aromatibus condirent patrem.\"},{\"verse\":3,\"text\":\"Quibus jussa explentibus, transierunt quadraginta dies : iste quippe mos erat cadaverum conditorum : flevitque eum Ægyptus septuaginta diebus.\"},{\"verse\":4,\"text\":\"Et expleto planctus tempore, locutus est Joseph ad familiam Pharaonis : Si inveni gratiam in conspectu vestro, loquimini in auribus Pharaonis :\"},{\"verse\":5,\"text\":\"eo quod pater meus adjuraverit me dicens : En morior : in sepulchro meo, quod fodi mihi in terra Chanaan, sepelies me. Ascendam igitur, et sepeliam patrem meum, ac revertar.\"},{\"verse\":6,\"text\":\"Dixitque ei Pharao : Ascende, et sepeli patrem tuum sicut adjuratus es.\"},{\"verse\":7,\"text\":\"Quo ascendente, ierunt cum eo omnes senes domus Pharaonis, cunctique majores natu terræ Ægypti :\"},{\"verse\":8,\"text\":\"domus Joseph cum fratribus suis, absque parvulis, et gregibus atque armentis, quæ dereliquerant in terra Gessen.\"},{\"verse\":9,\"text\":\"Habuit quoque in comitatu currus et equites : et facta est turba non modica.\"},{\"verse\":10,\"text\":\"Veneruntque ad Aream Atad, quæ sita est trans Jordanem : ubi celebrantes exequias planctu magno atque vehementi impleverunt septem dies.\"},{\"verse\":11,\"text\":\"Quod cum vidissent habitatores terræ Chanaan, dixerunt : Planctus magnus est iste Ægyptiis. Et idcirco vocatum est nomen loci illius, Planctus Ægypti.\"},{\"verse\":12,\"text\":\"Fecerunt ergo filii Jacob sicut præceperat eis :\"},{\"verse\":13,\"text\":\"et portantes eum in terram Chanaan, sepelierunt eum in spelunca duplici, quam emerat Abraham cum agro in possessionem sepulchri ab Ephron Hethæo, contra faciem Mambre.\"},{\"verse\":14,\"text\":\"Reversusque est Joseph in Ægyptum cum fratribus suis, et omni comitatu, sepulto patre.\"},{\"verse\":15,\"text\":\"Quo mortuo, timentes fratres ejus, et mutuo colloquentes : Ne forte memor sit injuriæ quam passus est, et reddat nobis omne malum quod fecimus,\"},{\"verse\":16,\"text\":\"mandaverunt ei dicentes : Pater tuus præcepit nobis antequam moreretur,\"},{\"verse\":17,\"text\":\"ut hæc tibi verbis illius diceremus : Obsecro ut obliviscaris sceleris fratrum tuorum, et peccati atque malitiæ quam exercuerunt in te : nos quoque oramus ut servis Dei patris tui dimittas iniquitatem hanc. Quibus auditis flevit Joseph.\"},{\"verse\":18,\"text\":\"Veneruntque ad eum fratres sui : et proni adorantes in terram, dixerunt : Servi tui sumus.\"},{\"verse\":19,\"text\":\"Quibus ille respondit : Nolite timere : num Dei possumus resistere voluntati ?\"},{\"verse\":20,\"text\":\"Vos cogitastis de me malum : sed Deus vertit illud in bonum, ut exaltaret me, sicut in præsentiarum cernitis, et salvos faceret multos populos.\"},{\"verse\":21,\"text\":\"Nolite timere : ego pascam vos et parvulos vestros : consolatusque est eos, et blande ac leniter est locutus.\"},{\"verse\":22,\"text\":\"Et habitavit in Ægypto cum omni domo patris sui : vixitque centum decem annis. Et vidit Ephraim filios usque ad tertiam generationem. Filii quoque Machir filii Manasse nati sunt in genibus Joseph.\"},{\"verse\":23,\"text\":\"Quibus transactis, locutus est fratribus suis : Post mortem meam Deus visitabit vos, et ascendere vos faciet de terra ista ad terram quam juravit Abraham, Isaac et Jacob.\"},{\"verse\":24,\"text\":\"Cumque adjurasset eos atque dixisset : Deus visitabit vos, asportate ossa mea vobiscum de loco isto :\"},{\"verse\":25,\"text\":\"mortuus est, expletis centum decem vitæ suæ annis. Et conditus aromatibus, repositus est in loculo in Ægypto.\"}],\"summary\":\"The mourning for Jacob, and his interment. Joseph’s kindness towards his brethren. His death.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":49,\"label\":\"Genesis 49\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":1,\"label\":\"Exodus 1\"}}]]\n"])</script></body></html>
