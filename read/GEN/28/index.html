-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">28</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob’s journey to Mesopotamia: his vision and vow.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Isaac called Jacob, and blessed him, and charged him, saying: Take not a wife of the stock of Chanaan:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But go, and take a journey to Mesopotamia of Syria, to the house of Bathuel, thy mother’s father, and take thee a wife thence of the daughters of Laban, thy uncle.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And God almighty bless thee, and make thee to increase and multiply thee: that thou mayst be a multitude of people.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And give the blessings of Araham to thee, and to thy seed after thee: that thou mayst possess the land of thy sojournment, which he promised to thy grandfather.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when Isaac had sent him away, he took his journey and went to Mesopotamia of Syria, to Laban, the son of Bathuel, the Syrian, brother to Rebecca, his mother.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Esau seeing that his father had blessed Jacob, and had sent him into Mesopotamia of Syria, to marry a wife thence; and that after the blessing he had charged him, saying: Thou shalt not take a wife of the daughters of Chanaan:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And that Jacob obeying his parents, was gone into Syria:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Experiencing also, that his father was not well pleased with the daughters of Chanaan:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He went to Ismael, and took to wife, besides them he had before, Maheleth, the daughter of Ismael, Abraham’s son, the sister of Nabajoth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But Jacob being departed from Bersabee, went on to Haran.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And when he was come to a certain place, and would rest in it after sunset, he took of the stones that lay there, and putting under his head, slept in the same place.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he saw in his sleep a ladder standing upon the earth, and the top thereof touching heaven: the angels also of God ascending and descending by it.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the Lord leaning upon the ladder saying to him: I am the Lord God of Abraham thy father, and the God of Isaac: The land, wherein thou sleepest, I will give to thee and to thy seed.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And thy seed shall be as the dust of the earth: thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and IN THEE and thy seed, all the tribes of the earth SHALL BE BLESSED.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I will be thy keeper whithersoever thou goest, and will bring thee back into this land: neither will I leave thee, till I shall have accomplished all that I have said.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when Jacob awaked out of sleep, he said: Indeed the Lord is in this place, and I knew it not.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And trembling, he said: How terrible is this place? this is no other but the house of God, and the gate of heaven.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Jacob arising in the morning, took the stone which he had laid under his head, and set it up for a title, pouring oil upon the top of it.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he called the name of the city Bethel, which before was called Luza.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he made a vow, saying: If God shall be with me, and shall keep me in the way, by which I walk, and shall give me bread to eat, and raiment to put on,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I shall return prosperously to my father’s house: the Lord shall be my God:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And this stone, which I have set up for a title, shall be called the house of God: and of all things that thou shalt give to me, I will offer tithes to thee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vocavit itaque Isaac Jacob, et benedixit eum, præcepitque ei dicens : Noli accipere conjugem de genere Chanaan :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sed vade, et proficiscere in Mesopotamiam Syriæ, ad domum Bathuel patris matris tuæ, et accipe tibi inde uxorem de filiabus Laban avunculi tui.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deus autem omnipotens benedicat tibi, et crescere te faciat, atque multiplicet, ut sis in turbas populorum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et det tibi benedictiones Abrahæ, et semini tuo post te : ut possideas terram peregrinationis tuæ, quam pollicitus est avo tuo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cumque dimisisset eum Isaac, profectus venit in Mesopotamiam Syriæ ad Laban filium Bathuel Syri, fratrem Rebeccæ matris suæ.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Videns autem Esau quod benedixisset pater suus Jacob, et misisset eum in Mesopotamiam Syriæ, ut inde uxorem duceret ; et quod post benedictionem præcepisset ei, dicens : Non accipies uxorem de filiabus Chanaan :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quodque obediens Jacob parentibus suis isset in Syriam :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>probans quoque quod non libenter aspiceret filias Chanaan pater suus :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>ivit ad Ismaëlem, et duxit uxorem absque iis, quas prius habebat, Maheleth filiam Ismaël filii Abraham, sororem Nabaioth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Igitur egressus Jacob de Bersabee, pergebat Haran.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cumque venisset ad quemdam locum, et vellet in eo requiescere post solis occubitum, tulit de lapidibus qui jacebant, et supponens capiti suo, dormivit in eodem loco.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Viditque in somnis scalam stantem super terram, et cacumen illius tangens cælum : angelos quoque Dei ascendentes et descendentes per eam,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et Dominum innixum scalæ dicentem sibi : Ego sum Dominus Deus Abraham patris tui, et Deus Isaac : terram, in qua dormis, tibi dabo et semini tuo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Eritque semen tuum quasi pulvis terræ : dilataberis ad occidentem, et orientem, et septentrionem, et meridiem : et benedicentur in te et in semine tuo cunctæ tribus terræ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ero custos tuus quocumque perrexeris, et reducam te in terram hanc : nec dimittam nisi complevero universa quæ dixi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cumque evigilasset Jacob de somno, ait : Vere Dominus est in loco isto, et ego nesciebam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Pavensque, Quam terribilis est, inquit, locus iste ! non est hic aliud nisi domus Dei, et porta cæli.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Surgens ergo Jacob mane, tulit lapidem quem supposuerat capiti suo, et erexit in titulum, fundens oleum desuper.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Appellavitque nomen urbis Bethel, quæ prius Luza vocabatur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vovit etiam votum, dicens : Si fuerit Deus mecum, et custodierit me in via, per quam ego ambulo, et dederit mihi panem ad vescendum, et vestimentum ad induendum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>reversusque fuero prospere ad domum patris mei : erit mihi Dominus in Deum,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et lapis iste, quem erexi in titulum, vocabitur Domus Dei : cunctorumque quæ dederis mihi, decimas offeram tibi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg- s\",\"drName\":\"Genesis\",\"chapter\":28,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And Isaac called Jacob, and blessed him, and charged him, saying: Take not a wife of the stock of Chanaan:\"},{\"verse\":2,\"text\":\"But go, and take a journey to Mesopotamia of Syria, to the house of Bathuel, thy mother’s father, and take thee a wife thence of the daughters of Laban, thy uncle.\"},{\"verse\":3,\"text\":\"And God almighty bless thee, and make thee to increase and multiply thee: that thou mayst be a multitude of people.\"},{\"verse\":4,\"text\":\"And give the blessings of Araham to thee, and to thy seed after thee: that thou mayst possess the land of thy sojournment, which he promised to thy grandfather.\"},{\"verse\":5,\"text\":\"And when Isaac had sent him away, he took his journey and went to Mesopotamia of Syria, to Laban, the son of Bathuel, the Syrian, brother to Rebecca, his mother.\"},{\"verse\":6,\"text\":\"And Esau seeing that his father had blessed Jacob, and had sent him into Mesopotamia of Syria, to marry a wife thence; and that after the blessing he had charged him, saying: Thou shalt not take a wife of the daughters of Chanaan:\"},{\"verse\":7,\"text\":\"And that Jacob obeying his parents, was gone into Syria:\"},{\"verse\":8,\"text\":\"Experiencing also, that his father was not well pleased with the daughters of Chanaan:\"},{\"verse\":9,\"text\":\"He went to Ismael, and took to wife, besides them he had before, Maheleth, the daughter of Ismael, Abraham’s son, the sister of Nabajoth.\"},{\"verse\":10,\"text\":\"But Jacob being departed from Bersabee, went on to Haran.\"},{\"verse\":11,\"text\":\"And when he was come to a certain place, and would rest in it after sunset, he took of the stones that lay there, and putting under his head, slept in the same place.\"},{\"verse\":12,\"text\":\"And he saw in his sleep a ladder standing upon the earth, and the top thereof touching heaven: the angels also of God ascending and descending by it.\"},{\"verse\":13,\"text\":\"And the Lord leaning upon the ladder saying to him: I am the Lord God of Abraham thy father, and the God of Isaac: The land, wherein thou sleepest, I will give to thee and to thy seed.\"},{\"verse\":14,\"text\":\"And thy seed shall be as the dust of the earth: thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and IN THEE and thy seed, all the tribes of the earth SHALL BE BLESSED.\"},{\"verse\":15,\"text\":\"And I will be thy keeper whithersoever thou goest, and will bring thee back into this land: neither will I leave thee, till I shall have accomplished all that I have said.\"},{\"verse\":16,\"text\":\"And when Jacob awaked out of sleep, he said: Indeed the Lord is in this place, and I knew it not.\"},{\"verse\":17,\"text\":\"And trembling, he said: How terrible is this place? this is no other but the house of God, and the gate of heaven.\"},{\"verse\":18,\"text\":\"And Jacob arising in the morning, took the stone which he had laid under his head, and set it up for a title, pouring oil upon the top of it.\"},{\"verse\":19,\"text\":\"And he called the name of the city Bethel, which before was called Luza.\"},{\"verse\":20,\"text\":\"And he made a vow, saying: If God shall be with me, and shall keep me in the way, by which I walk, and shall give me bread to eat, and raiment to put on,\"},{\"verse\":21,\"text\":\"And I shall return prosperously to my father’s house: the Lord shall be my God:\"},{\"verse\":22,\"text\":\"And this stone, which I have set up for a title, shall be called the house of God: and of all things that thou shalt give to me, I will offer tithes to thee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vocavit itaque Isaac Jacob, et benedixit eum, præcepitque ei dicens : Noli accipere conjugem de genere Chanaan :\"},{\"verse\":2,\"text\":\"sed vade, et proficiscere in Mesopotamiam Syriæ, ad domum Bathuel patris matris tuæ, et accipe tibi inde uxorem de filiabus Laban avunculi tui.\"},{\"verse\":3,\"text\":\"Deus autem omnipotens benedicat tibi, et crescere te faciat, atque multiplicet, ut sis in turbas populorum.\"},{\"verse\":4,\"text\":\"Et det tibi benedictiones Abrahæ, et semini tuo post te : ut possideas terram peregrinationis tuæ, quam pollicitus est avo tuo.\"},{\"verse\":5,\"text\":\"Cumque dimisisset eum Isaac, profectus venit in Mesopotamiam Syriæ ad Laban filium Bathuel Syri, fratrem Rebeccæ matris suæ.\"},{\"verse\":6,\"text\":\"Videns autem Esau quod benedixisset pater suus Jacob, et misisset eum in Mesopotamiam Syriæ, ut inde uxorem duceret ; et quod post benedictionem præcepisset ei, dicens : Non accipies uxorem de filiabus Chanaan :\"},{\"verse\":7,\"text\":\"quodque obediens Jacob parentibus suis isset in Syriam :\"},{\"verse\":8,\"text\":\"probans quoque quod non libenter aspiceret filias Chanaan pater suus :\"},{\"verse\":9,\"text\":\"ivit ad Ismaëlem, et duxit uxorem absque iis, quas prius habebat, Maheleth filiam Ismaël filii Abraham, sororem Nabaioth.\"},{\"verse\":10,\"text\":\"Igitur egressus Jacob de Bersabee, pergebat Haran.\"},{\"verse\":11,\"text\":\"Cumque venisset ad quemdam locum, et vellet in eo requiescere post solis occubitum, tulit de lapidibus qui jacebant, et supponens capiti suo, dormivit in eodem loco.\"},{\"verse\":12,\"text\":\"Viditque in somnis scalam stantem super terram, et cacumen illius tangens cælum : angelos quoque Dei ascendentes et descendentes per eam,\"},{\"verse\":13,\"text\":\"et Dominum innixum scalæ dicentem sibi : Ego sum Dominus Deus Abraham patris tui, et Deus Isaac : terram, in qua dormis, tibi dabo et semini tuo.\"},{\"verse\":14,\"text\":\"Eritque semen tuum quasi pulvis terræ : dilataberis ad occidentem, et orientem, et septentrionem, et meridiem : et benedicentur in te et in semine tuo cunctæ tribus terræ.\"},{\"verse\":15,\"text\":\"Et ero custos tuus quocumque perrexeris, et reducam te in terram hanc : nec dimittam nisi complevero universa quæ dixi.\"},{\"verse\":16,\"text\":\"Cumque evigilasset Jacob de somno, ait : Vere Dominus est in loco isto, et ego nesciebam.\"},{\"verse\":17,\"text\":\"Pavensque, Quam terribilis est, inquit, locus iste ! non est hic aliud nisi domus Dei, et porta cæli.\"},{\"verse\":18,\"text\":\"Surgens ergo Jacob mane, tulit lapidem quem supposuerat capiti suo, et erexit in titulum, fundens oleum desuper.\"},{\"verse\":19,\"text\":\"Appellavitque nomen urbis Bethel, quæ prius Luza vocabatur.\"},{\"verse\":20,\"text\":\"Vovit etiam votum, dicens : Si fuerit Deus mecum, et custodierit me in via, per quam ego ambulo, et dederit mihi panem ad vescendum, et vestimentum ad induendum,\"},{\"verse\":21,\"text\":\"reversusque fuero prospere ad domum patris mei : erit mihi Dominus in Deum,\"},{\"verse\":22,\"text\":\"et lapis iste, quem erexi in titulum, vocabitur Domus Dei : cunctorumque quæ dederis mihi, decimas offeram tibi.\"}],\"summary\":\"Jacob’s journey to Mesopotamia: his vision and vow.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":27,\"label\":\"Genesis 27\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":29,\"label\":\"Genesis 29\"}}]]\n"])</script></body></html>
