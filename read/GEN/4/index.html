[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The history of Cain and Abel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Adam knew Eve his wife; who conceived and brought forth Cain, saying: I have gotten a man through God.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And again she brought forth his brother Abel. And Abel was a shepherd, and Cain a husbandman.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And it came to pass after many days, that Cain offered, of the fruits of the earth, gifts to the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Abel also offered of the firstlings of his flock, and of their fat: and the Lord had respect to Abel, and to his offerings.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But to Cain and his offerings he had no respect: and Cain was exceeding angry, and his countenance fell.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Lord said to him: Why art thou angry? and why is thy countenance fallen?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If thou do well, shalt thou not receive? but if ill, shall not sin forthwith be present at the door? but the lust thereof shall be under thee, and thou shalt have dominion over it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Cain said to Abel his brother: Let us go forth abroad. And when they were in the field, Cain rose up against his brother Abel, and slew him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord said to Cain: Where is thy brother Abel? And he answered: I know not: am I my brother’s keeper?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he said to him: What hast thou done? the voice of thy brother’s blood crieth to me from the earth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now, therefore, cursed shalt thou be upon the earth, which hath opened her mouth and received the blood of thy brother at thy hand.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>When thou shalt till it, it shall not yield to thee its fruit: a fugitive and a vagabond shalt thou be upon the earth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Cain said to the Lord: My iniquity is greater than that I may deserve pardon.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Behold thou dost cast me out this day from the face of the earth, and from thy face I shall be hid, and I shall be a vagabond and a fugitive on the earth: every one, therefore, that findeth me, shall kill me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the Lord said to him: No, it shall not so be: but whosoever shall kill Cain, shall be punished sevenfold. And the Lord set a mark upon Cain, that whosoever found him should not kill him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Cain went out from the face of the Lord, and dwelt as a fugitive on the earth at the east side of Eden.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Cain knew his wife, and she conceived, and brought forth Henoch: and he built a city, and called the name thereof by the name of his son Henoch.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Henoch begot Irad, and Irad begot Maviael, and Maviael begot Mathusael, and Mathusael begot Lamech,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Who took two wives: the name of the one was Ada, and the name of the other Sella.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Ada brought forth Jabel: who was the father of such as dwell in tents, and of herdsmen.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And his brother’s name was Jubal: he was the father of them that play upon the harp and the organs.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sella also brought forth Tubalcain, who was a hammerer and artificer in every work of brass and iron. And the sister of Tubalcain was Noema.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Lamech said to his wives Ada and Sella: Hear my voice, ye wives of Lamech, hearken to my speech: for I have slain a man to the wounding of myself, and a stripling to my own bruising.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Sevenfold vengeance shall be taken for Cain: but for Lamech seventy times sevenfold.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Adam also knew his wife again: and she brought forth a son, and called his name Seth, saying: God hath given me another seed for Abel, whom Cain slew.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But to Seth also was born a son, whom he called Enos: this man began to call upon the name of the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Adam vero cognovit uxorem suam Hevam, quæ concepit et peperit Cain, dicens : Possedi hominem per Deum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Rursumque peperit fratrem ejus Abel. Fuit autem Abel pastor ovium, et Cain agricola.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Factum est autem post multos dies ut offerret Cain de fructibus terræ munera Domino.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Abel quoque obtulit de primogenitis gregis sui, et de adipibus eorum : et respexit Dominus ad Abel, et ad munera ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ad Cain vero, et ad munera illius non respexit : iratusque est Cain vehementer, et concidit vultus ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque Dominus ad eum : Quare iratus es ? et cur concidit facies tua ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>nonne si bene egeris, recipies : sin autem male, statim in foribus peccatum aderit ? sed sub te erit appetitus ejus, et tu dominaberis illius.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixitque Cain ad Abel fratrem suum : Egrediamur foras. Cumque essent in agro, consurrexit Cain adversus fratrem suum Abel, et interfecit eum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ait Dominus ad Cain : Ubi est Abel frater tuus ? Qui respondit : Nescio : num custos fratris mei sum ego ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixitque ad eum : Quid fecisti ? vox sanguinis fratris tui clamat ad me de terra.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nunc igitur maledictus eris super terram, quæ aperuit os suum, et suscepit sanguinem fratris tui de manu tua.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum operatus fueris eam, non dabit tibi fructus suos : vagus et profugus eris super terram.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixitque Cain ad Dominum : Major est iniquitas mea, quam ut veniam merear.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ecce ejicis me hodie a facie terræ, et a facie tua abscondar, et ero vagus et profugus in terra : omnis igitur qui invenerit me, occidet me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dixitque ei Dominus : Nequaquam ita fiet : sed omnis qui occiderit Cain, septuplum punietur. Posuitque Dominus Cain signum, ut non interficeret eum omnis qui invenisset eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Egressusque Cain a facie Domini, habitavit profugus in terra ad orientalem plagam Eden.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cognovit autem Cain uxorem suam, quæ concepit, et peperit Henoch : et ædificavit civitatem, vocavitque nomen ejus ex nomine filii sui, Henoch.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Porro Henoch genuit Irad, et Irad genuit Maviaël, et Maviaël genuit Mathusaël, et Mathusaël genuit Lamech.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui accepit duas uxores, nomen uni Ada, et nomen alteri Sella.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Genuitque Ada Jabel, qui fuit pater habitantium in tentoriis, atque pastorum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et nomen fratris ejus Jubal : ipse fuit pater canentium cithara et organo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sella quoque genuit Tubalcain, qui fuit malleator et faber in cuncta opera æris et ferri. Soror vero Tubalcain, Noëma.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dixitque Lamech uxoribus suis Adæ et Sellæ : Audite vocem meam, uxores Lamech ; auscultate sermonem meum : quoniam occidi virum in vulnus meum, et adolescentulum in livorem meum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Septuplum ultio dabitur de Cain : de Lamech vero septuagies septies.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Cognovit quoque adhuc Adam uxorem suam : et peperit filium, vocavitque nomen ejus Seth, dicens : Posuit mihi Deus semen aliud pro Abel, quem occidit Cain.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sed et Seth natus est filius, quem vocavit Enos : iste cœpit invocare nomen Domini.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentCo hou do well, shalt thou not receive? but if ill, shall not sin forthwith be present at the door? but the lust thereof shall be under thee, and thou shalt have dominion over it.\"},{\"verse\":8,\"text\":\"And Cain said to Abel his brother: Let us go forth abroad. And when they were in the field, Cain rose up against his brother Abel, and slew him.\"},{\"verse\":9,\"text\":\"And the Lord said to Cain: Where is thy brother Abel? And he answered: I know not: am I my brother’s keeper?\"},{\"verse\":10,\"text\":\"And he said to him: What hast thou done? the voice of thy brother’s blood crieth to me from the earth.\"},{\"verse\":11,\"text\":\"Now, therefore, cursed shalt thou be upon the earth, which hath opened her mouth and received the blood of thy brother at thy hand.\"},{\"verse\":12,\"text\":\"When thou shalt till it, it shall not yield to thee its fruit: a fugitive and a vagabond shalt thou be upon the earth.\"},{\"verse\":13,\"text\":\"And Cain said to the Lord: My iniquity is greater than that I may deserve pardon.\"},{\"verse\":14,\"text\":\"Behold thou dost cast me out this day from the face of the earth, and from thy face I shall be hid, and I shall be a vagabond and a fugitive on the earth: every one, therefore, that findeth me, shall kill me.\"},{\"verse\":15,\"text\":\"And the Lord said to him: No, it shall not so be: but whosoever shall kill Cain, shall be punished sevenfold. And the Lord set a mark upon Cain, that whosoever found him should not kill him.\"},{\"verse\":16,\"text\":\"And Cain went out from the face of the Lord, and dwelt as a fugitive on the earth at the east side of Eden.\"},{\"verse\":17,\"text\":\"And Cain knew his wife, and she conceived, and brought forth Henoch: and he built a city, and called the name thereof by the name of his son Henoch.\"},{\"verse\":18,\"text\":\"And Henoch begot Irad, and Irad begot Maviael, and Maviael begot Mathusael, and Mathusael begot Lamech,\"},{\"verse\":19,\"text\":\"Who took two wives: the name of the one was Ada, and the name of the other Sella.\"},{\"verse\":20,\"text\":\"And Ada brought forth Jabel: who was the father of such as dwell in tents, and of herdsmen.\"},{\"verse\":21,\"text\":\"And his brother’s name was Jubal: he was the father of them that play upon the harp and the organs.\"},{\"verse\":22,\"text\":\"Sella also brought forth Tubalcain, who was a hammerer and artificer in every work of brass and iron. And the sister of Tubalcain was Noema.\"},{\"verse\":23,\"text\":\"And Lamech said to his wives Ada and Sella: Hear my voice, ye wives of Lamech, hearken to my speech: for I have slain a man to the wounding of myself, and a stripling to my own bruising.\"},{\"verse\":24,\"text\":\"Sevenfold vengeance shall be taken for Cain: but for Lamech seventy times sevenfold.\"},{\"verse\":25,\"text\":\"Adam also knew his wife again: and she brought forth a son, and called his name Seth, saying: God hath given me another seed for Abel, whom Cain slew.\"},{\"verse\":26,\"text\":\"But to Seth also was born a son, whom he called Enos: this man began to call upon the name of the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Adam vero cognovit uxorem suam Hevam, quæ concepit et peperit Cain, dicens : Possedi hominem per Deum.\"},{\"verse\":2,\"text\":\"Rursumque peperit fratrem ejus Abel. Fuit autem Abel pastor ovium, et Cain agricola.\"},{\"verse\":3,\"text\":\"Factum est autem post multos dies ut offerret Cain de fructibus terræ munera Domino.\"},{\"verse\":4,\"text\":\"Abel quoque obtulit de primogenitis gregis sui, et de adipibus eorum : et respexit Dominus ad Abel, et ad munera ejus.\"},{\"verse\":5,\"text\":\"Ad Cain vero, et ad munera illius non respexit : iratusque est Cain vehementer, et concidit vultus ejus.\"},{\"verse\":6,\"text\":\"Dixitque Dominus ad eum : Quare iratus es ? et cur concidit facies tua ?\"},{\"verse\":7,\"text\":\"nonne si bene egeris, recipies : sin autem male, statim in foribus peccatum aderit ? sed sub te erit appetitus ejus, et tu dominaberis illius.\"},{\"verse\":8,\"text\":\"Dixitque Cain ad Abel fratrem suum : Egrediamur foras. Cumque essent in agro, consurrexit Cain adversus fratrem suum Abel, et interfecit eum.\"},{\"verse\":9,\"text\":\"Et ait Dominus ad Cain : Ubi est Abel frater tuus ? Qui respondit : Nescio : num custos fratris mei sum ego ?\"},{\"verse\":10,\"text\":\"Dixitque ad eum : Quid fecisti ? vox sanguinis fratris tui clamat ad me de terra.\"},{\"verse\":11,\"text\":\"Nunc igitur maledictus eris super terram, quæ aperuit os suum, et suscepit sanguinem fratris tui de manu tua.\"},{\"verse\":12,\"text\":\"Cum operatus fueris eam, non dabit tibi fructus suos : vagus et profugus eris super terram.\"},{\"verse\":13,\"text\":\"Dixitque Cain ad Dominum : Major est iniquitas mea, quam ut veniam merear.\"},{\"verse\":14,\"text\":\"Ecce ejicis me hodie a facie terræ, et a facie tua abscondar, et ero vagus et profugus in terra : omnis igitur qui invenerit me, occidet me.\"},{\"verse\":15,\"text\":\"Dixitque ei Dominus : Nequaquam ita fiet : sed omnis qui occiderit Cain, septuplum punietur. Posuitque Dominus Cain signum, ut non interficeret eum omnis qui invenisset eum.\"},{\"verse\":16,\"text\":\"Egressusque Cain a facie Domini, habitavit profugus in terra ad orientalem plagam Eden.\"},{\"verse\":17,\"text\":\"Cognovit autem Cain uxorem suam, quæ concepit, et peperit Henoch : et ædificavit civitatem, vocavitque nomen ejus ex nomine filii sui, Henoch.\"},{\"verse\":18,\"text\":\"Porro Henoch genuit Irad, et Irad genuit Maviaël, et Maviaël genuit Mathusaël, et Mathusaël genuit Lamech.\"},{\"verse\":19,\"text\":\"Qui accepit duas uxores, nomen uni Ada, et nomen alteri Sella.\"},{\"verse\":20,\"text\":\"Genuitque Ada Jabel, qui fuit pater habitantium in tentoriis, atque pastorum.\"},{\"verse\":21,\"text\":\"Et nomen fratris ejus Jubal : ipse fuit pater canentium cithara et organo.\"},{\"verse\":22,\"text\":\"Sella quoque genuit Tubalcain, qui fuit malleator et faber in cuncta opera æris et ferri. Soror vero Tubalcain, Noëma.\"},{\"verse\":23,\"text\":\"Dixitque Lamech uxoribus suis Adæ et Sellæ : Audite vocem meam, uxores Lamech ; auscultate sermonem meum : quoniam occidi virum in vulnus meum, et adolescentulum in livorem meum.\"},{\"verse\":24,\"text\":\"Septuplum ultio dabitur de Cain : de Lamech vero septuagies septies.\"},{\"verse\":25,\"text\":\"Cognovit quoque adhuc Adam uxorem suam : et peperit filium, vocavitque nomen ejus Seth, dicens : Posuit mihi Deus semen aliud pro Abel, quem occidit Cain.\"},{\"verse\":26,\"text\":\"Sed et Seth natus est filius, quem vocavit Enos : iste cœpit invocare nomen Domini.\"}],\"summary\":\"The history of Cain and Abel.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":3,\"label\":\"Genesis 3\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":5,\"label\":\"Genesis 5\"}}]]\n"])</script></body></html>
