-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">33</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob and Esau meet: Jacob goeth to Salem, where he raiseth an altar.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jacob lifting up his eyes, saw Esau coming, and with him four hundred men: and he divided the children of Lia and of Rachel, and of the two handmaids.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he put both the handmaids and their children foremost: and Lia and her children in the second place: and Rachel and Joseph last.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he went forward and bowed down with his face to the ground seven times, until his brother came near.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then Esau ran to meet his brother, and embraced him: and clasping him fast about the neck, and kissing him, wept.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And lifting up his eyes, he saw the women and their children, and said: What mean these? And do they belong to thee? He answered: They are the children which God hath given to me, thy servant.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then the handmaids and their children came near and bowed themselves.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Lia also, with her children, came near and bowed down in like manner; and last of all, Joseph and Rachel bowed down.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Esau said: What are the droves that I met? He answered: That I might find favour before my lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But he said: I have plenty, my brother, keep what is thine for thyself.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Jacob said: Do not so I beseech thee, but if I have found favour in thy eyes, receive a little present at my hands: for I have seen thy face, as if I should have seen the countenance of God: be gracious to me,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And take the blessing which I have brought thee, and which God hath given me, who giveth all things. He took it with much ado at his brother’s earnest pressing him,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And said: Let us go on together, and I will accompany thee in thy journey.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Jacob said: My lord, thou knowest that I have with me tender children, and sheep, and kine with young: which if I should cause to be overdriven, in one day all the flocks will die.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>May it please my lord to go before his servant: and I will follow softly after him, as I shall see my children to be able, until I come to my lord in Seir.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Esau answered: I beseech thee, that some of the people, at least, who are with me, may stay to accompany thee in the way. And he said: There is no necessity: I want nothing else but only to find favour, my lord, in thy sight.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So Esau returned that day, the way that he came, to Seir.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Jacob came to Socoth: where having built a house, and pitched tents, he called the name of the place Socoth, that is, Tents.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he passed over to Salem, a city of the Sichemites, which is in the land of Chanaan, after he returned from Mesopotamia of Syria: and he dwelt by the town.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he bought that part of the field, in which he pitched his tents, of the children of Hemor, the father of Sichem, for a hundred lambs.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And raising an altar there, he invoked upon it the most mighty God of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Elevans autem Jacob oculos suos, vidit venientem Esau, et cum eo quadringentos viros : divisitque filios Liæ et Rachel, ambarumque famularum :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et posuit utramque ancillam, et liberos earum, in principio : Liam vero, et filios ejus, in secundo loco : Rachel autem et Joseph novissimos.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ipse progrediens adoravit pronus in terram septies, donec appropinquaret frater ejus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Currens itaque Esau obviam fratri suo, amplexatus est eum : stringensque collum ejus, et osculans flevit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Levatisque oculis, vidit mulieres et parvulos earum, et ait : Quid sibi volunt isti ? et si ad te pertinent ? Respondit : Parvuli sunt quos donavit mihi Deus servo tuo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et appropinquantes ancillæ et filii earum, incurvati sunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Accessit quoque Lia cum pueris suis : et cum similiter adorassent, extremi Joseph et Rachel adoraverunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixitque Esau : Quænam sunt istæ turmæ quas obviam habui ? Respondit : Ut invenirem gratiam coram domino meo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>At ille ait : Habeo plurima, frater mi, sint tua tibi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dixitque Jacob : Noli ita, obsecro : sed si inveni gratiam in oculis tuis, accipe munusculum de manibus meis. Sic enim vidi faciem tuam, quasi viderim vultum Dei : esto mihi propitius,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et suscipe benedictionem quam attuli tibi, et quam donavit mihi Deus tribuens omnia. Vix fratre compellente, suscipiens,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ait : Gradiamur simul, eroque socius itineris tui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixitque Jacob : Nosti, domine mi, quod parvulos habeam teneros, et oves, et boves fœtas mecum : quas si plus in ambulando fecero laborare, morientur una die cuncti greges.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Præcedat dominus meus ante servum suum : et ego sequar paulatim vestigia ejus, sicut videro parvulos meos posse, donec veniam ad dominum meum in Seir.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Respondit Esau : Oro te, ut de populo qui mecum est, saltem socii remaneant viæ tuæ. Non est, inquit, necesse : hoc uno tantum indigeo, ut inveniam gratiam in conspectu tuo, domine mi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Reversus est itaque illo die Esau itinere quo venerat in Seir.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et Jacob venit in Socoth : ubi ædificata domo et fixis tentoriis appellavit nomen loci illius Socoth, id est, Tabernacula.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Transivitque in Salem urbem Sichimorum, quæ est in terra Chanaan, postquam reversus est de Mesopotamia Syriæ : et habitavit juxta oppidum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Emitque partem agri, in qua fixerat tabernacula, a filiis Hemor patris Sichem centum agnis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et erecto ibi altari, invocavit super illud fortissimum Deum Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/32/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 32</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/34/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 34</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" ar children came near and bowed themselves.\"},{\"verse\":7,\"text\":\"Lia also, with her children, came near and bowed down in like manner; and last of all, Joseph and Rachel bowed down.\"},{\"verse\":8,\"text\":\"And Esau said: What are the droves that I met? He answered: That I might find favour before my lord.\"},{\"verse\":9,\"text\":\"But he said: I have plenty, my brother, keep what is thine for thyself.\"},{\"verse\":10,\"text\":\"And Jacob said: Do not so I beseech thee, but if I have found favour in thy eyes, receive a little present at my hands: for I have seen thy face, as if I should have seen the countenance of God: be gracious to me,\"},{\"verse\":11,\"text\":\"And take the blessing which I have brought thee, and which God hath given me, who giveth all things. He took it with much ado at his brother’s earnest pressing him,\"},{\"verse\":12,\"text\":\"And said: Let us go on together, and I will accompany thee in thy journey.\"},{\"verse\":13,\"text\":\"And Jacob said: My lord, thou knowest that I have with me tender children, and sheep, and kine with young: which if I should cause to be overdriven, in one day all the flocks will die.\"},{\"verse\":14,\"text\":\"May it please my lord to go before his servant: and I will follow softly after him, as I shall see my children to be able, until I come to my lord in Seir.\"},{\"verse\":15,\"text\":\"Esau answered: I beseech thee, that some of the people, at least, who are with me, may stay to accompany thee in the way. And he said: There is no necessity: I want nothing else but only to find favour, my lord, in thy sight.\"},{\"verse\":16,\"text\":\"So Esau returned that day, the way that he came, to Seir.\"},{\"verse\":17,\"text\":\"And Jacob came to Socoth: where having built a house, and pitched tents, he called the name of the place Socoth, that is, Tents.\"},{\"verse\":18,\"text\":\"And he passed over to Salem, a city of the Sichemites, which is in the land of Chanaan, after he returned from Mesopotamia of Syria: and he dwelt by the town.\"},{\"verse\":19,\"text\":\"And he bought that part of the field, in which he pitched his tents, of the children of Hemor, the father of Sichem, for a hundred lambs.\"},{\"verse\":20,\"text\":\"And raising an altar there, he invoked upon it the most mighty God of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Elevans autem Jacob oculos suos, vidit venientem Esau, et cum eo quadringentos viros : divisitque filios Liæ et Rachel, ambarumque famularum :\"},{\"verse\":2,\"text\":\"et posuit utramque ancillam, et liberos earum, in principio : Liam vero, et filios ejus, in secundo loco : Rachel autem et Joseph novissimos.\"},{\"verse\":3,\"text\":\"Et ipse progrediens adoravit pronus in terram septies, donec appropinquaret frater ejus.\"},{\"verse\":4,\"text\":\"Currens itaque Esau obviam fratri suo, amplexatus est eum : stringensque collum ejus, et osculans flevit.\"},{\"verse\":5,\"text\":\"Levatisque oculis, vidit mulieres et parvulos earum, et ait : Quid sibi volunt isti ? et si ad te pertinent ? Respondit : Parvuli sunt quos donavit mihi Deus servo tuo.\"},{\"verse\":6,\"text\":\"Et appropinquantes ancillæ et filii earum, incurvati sunt.\"},{\"verse\":7,\"text\":\"Accessit quoque Lia cum pueris suis : et cum similiter adorassent, extremi Joseph et Rachel adoraverunt.\"},{\"verse\":8,\"text\":\"Dixitque Esau : Quænam sunt istæ turmæ quas obviam habui ? Respondit : Ut invenirem gratiam coram domino meo.\"},{\"verse\":9,\"text\":\"At ille ait : Habeo plurima, frater mi, sint tua tibi.\"},{\"verse\":10,\"text\":\"Dixitque Jacob : Noli ita, obsecro : sed si inveni gratiam in oculis tuis, accipe munusculum de manibus meis. Sic enim vidi faciem tuam, quasi viderim vultum Dei : esto mihi propitius,\"},{\"verse\":11,\"text\":\"et suscipe benedictionem quam attuli tibi, et quam donavit mihi Deus tribuens omnia. Vix fratre compellente, suscipiens,\"},{\"verse\":12,\"text\":\"ait : Gradiamur simul, eroque socius itineris tui.\"},{\"verse\":13,\"text\":\"Dixitque Jacob : Nosti, domine mi, quod parvulos habeam teneros, et oves, et boves fœtas mecum : quas si plus in ambulando fecero laborare, morientur una die cuncti greges.\"},{\"verse\":14,\"text\":\"Præcedat dominus meus ante servum suum : et ego sequar paulatim vestigia ejus, sicut videro parvulos meos posse, donec veniam ad dominum meum in Seir.\"},{\"verse\":15,\"text\":\"Respondit Esau : Oro te, ut de populo qui mecum est, saltem socii remaneant viæ tuæ. Non est, inquit, necesse : hoc uno tantum indigeo, ut inveniam gratiam in conspectu tuo, domine mi.\"},{\"verse\":16,\"text\":\"Reversus est itaque illo die Esau itinere quo venerat in Seir.\"},{\"verse\":17,\"text\":\"Et Jacob venit in Socoth : ubi ædificata domo et fixis tentoriis appellavit nomen loci illius Socoth, id est, Tabernacula.\"},{\"verse\":18,\"text\":\"Transivitque in Salem urbem Sichimorum, quæ est in terra Chanaan, postquam reversus est de Mesopotamia Syriæ : et habitavit juxta oppidum.\"},{\"verse\":19,\"text\":\"Emitque partem agri, in qua fixerat tabernacula, a filiis Hemor patris Sichem centum agnis.\"},{\"verse\":20,\"text\":\"Et erecto ibi altari, invocavit super illud fortissimum Deum Israël.\"}],\"summary\":\"Jacob and Esau meet: Jacob goeth to Salem, where he raiseth an altar.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":32,\"label\":\"Genesis 32\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":34,\"label\":\"Genesis 34\"}}]]\n"])</script></body></html>
