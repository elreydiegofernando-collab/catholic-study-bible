-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">21</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Isaac is born. Agar and Ismael are cast forth.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord visited Sara, as he had promised: and fulfilled what he had spoken.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And she conceived and bore a son in her old age, at the time that God had foretold her.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Abraham called the name of his son, whom Sara bore him, Isaac.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he circumcised him the eighth day, as God had commanded him,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>When he was a hundred years old: for at this age of his father, was Isaac born.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Sara said: God hath made a laughter for me: whosoever shall hear of it will laugh with me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And again she said: Who would believe that Abraham should hear that Sara gave suck to a son, whom she bore to him in his old age?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the child grew, and was weaned: and Abraham made a great feast on the day of his weaning.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when Sara had seen the son of Agar, the Egyptian, playing with Isaac, her son, she said to Abraham:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cast out this bondwoman and her son; for the son of the bondwoman shall not be heir with my son Isaac.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Abraham took this grievously for his son.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And God said to him: Let it not seem grievous to thee for the boy, and for thy bondwoman: in all that Sara hath said to thee, hearken to her voice: for in Isaac shall thy seed be called.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But I will make the son also of the bondwoman a great nation, because he is thy seed.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So Abraham rose up in the morning, and taking bread and a bottle of water, put it upon her shoulder, and delivered the boy, and sent her away. And she departed, and wandered in the wilderness of Bersabee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when the water in the bottle was spent, she cast the boy under one of the trees that were there.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And she went her way, and sat over against him a great way off, as far as a bow can carry, for she said: I will not see the boy die: and sitting over against, she lifted up her voice and wept.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And God heard the voice of the boy: and an angel of God called to Agar from heaven, saying: What art thou doing, Agar? fear not; for God hath heard the voice of the boy, from the place wherein he is.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Arise, take up the boy, and hold him by the hand, for I will make him a great nation.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And God opened her eyes: and she saw a well of water, and went and filled the bottle, and gave the boy to drink.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And God was with him: and he grew, and dwelt in the wilderness, and became a young man, an archer.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he dwelt in the wilderness of Pharan, and his mother took a wife for him out of the land of Egypt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>At the same time Abimelech, and Phicol the general of his army, said to Abraham: God is with thee in all that thou dost.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Swear therefore by God, that thou wilt not hurt me, nor my posterity, nor my stock: but according to the kindness that I have done to thee, thou shalt do to me, and to the land wherein thou hast lived a stranger.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Abraham said: I will swear.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he reproved Abimelech for a well of water, which his servants had taken away by force.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Abimelech answered: I knew not who did this thing: and thou didst not tell me, and I heard not of it till today.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Then Abraham took sheep and oxen, and gave them to Abimelech: and both of them made a league.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Abraham set apart seven ewelambs of the flock.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Abimelech said to him: What mean these seven ewelambs which thou hast set apart?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But he said: Thou shalt take seven ewelambs at my hand: that they may be a testimony for me, that I dug this well.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Therefore that place was called Bersabee; because there both of them did swear.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they made a league for the well of oath.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And Abimelech and Phicol, the general of his army, arose and returned to the land of the Palestines. But Abraham planted a grove in Bersabee, and there called upon the name of the Lord God eternal.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And he was a sojourner in the land of the Palestines many days.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Visitavit autem Dominus Saram, sicut promiserat : et implevit quæ locutus est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Concepitque et peperit filium in senectute sua, tempore quo prædixerat ei Deus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Vocavitque Abraham nomen filii sui, quem genuit ei Sara, Isaac :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et circumcidit eum octavo die, sicut præceperat ei Deus,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>cum centum esset annorum : hac quippe ætate patris, natus est Isaac.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque Sara : Risum fecit mihi Deus : quicumque audierit, corridebit mihi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Rursumque ait : Quis auditurus crederet Abraham quod Sara lactaret filium, quem peperit ei jam seni ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Crevit igitur puer, et ablactatus est : fecitque Abraham grande convivium in die ablactationis ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cumque vidisset Sara filium Agar Ægyptiæ ludentem cum Isaac filio suo, dixit ad Abraham :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ejice ancillam hanc, et filium ejus : non enim erit hæres filius ancillæ cum filio meo Isaac.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Dure accepit hoc Abraham pro filio suo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cui dixit Deus : Non tibi videatur asperum super puero, et super ancilla tua : omnia quæ dixerit tibi Sara, audi vocem ejus : quia in Isaac vocabitur tibi semen.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sed et filium ancillæ faciam in gentem magnam, quia semen tuum est.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Surrexit itaque Abraham mane, et tollens panem et utrem aquæ, imposuit scapulæ ejus, tradiditque puerum, et dimisit eam. Quæ cum abiisset, errabat in solitudine Bersabee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cumque consumpta esset aqua in utre, abjecit puerum subter unam arborum, quæ ibi erant.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et abiit, seditque e regione procul quantum potest arcus jacere : dixit enim : Non videbo morientem puerum : et sedens contra, levavit vocem suam et flevit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Exaudivit autem Deus vocem pueri : vocavitque angelus Dei Agar de cælo, dicens : Quid agis Agar ? noli timere : exaudivit enim Deus vocem pueri de loco in quo est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Surge, tolle puerum, et tene manum illius : quia in gentem magnam faciam eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Aperuitque oculos ejus Deus : quæ videns puteum aquæ, abiit, et implevit utrem, deditque puero bibere.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et fuit cum eo : qui crevit, et moratus est in solitudine, factusque est juvenis sagittarius.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Habitavitque in deserto Pharan, et accepit illi mater sua uxorem de terra Ægypti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Eodem tempore dixit Abimelech, et Phicol princeps exercitus ejus, ad Abraham : Deus tecum est in universis quæ agis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jura ergo per Deum, ne noceas mihi, et posteris meis, stirpique meæ : sed juxta misericordiam, quam feci tibi, facies mihi, et terræ in qua versatus es advena.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dixitque Abraham : Ego jurabo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et increpavit Abimelech propter puteum aquæ quem vi abstulerunt servi ejus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Responditque Abimelech : Nescivi quis fecerit hanc rem : sed et tu non indicasti mihi, et ego non audivi præter hodie.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Tulit itaque Abraham oves et boves, et dedit Abimelech : percusseruntque ambo fœdus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et statuit Abraham septem agnas gregis seorsum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Cui dixit Abimelech : Quid sibi volunt septem agnæ istæ, quas stare fecisti seorsum ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>At ille : Septem, inquit, agnas accipies de manu mea : ut sint mihi in testimonium, quoniam ego fodi puteum istum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Idcirco vocatus est locus ille Bersabee : quia ibi uterque juravit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et inierunt fœdus pro puteo juramenti.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Surrexit autem Abimelech, et Phicol princeps exercitus ejus, reversique sunt in terram Palæstinorum. Abraham vero plantavit nemus in Bersabee, et invocavit ibi nomen Domini Dei æterni.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et fuit colonus terræ Palæstinorum diebus multis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rou text\":\"When he was a hundred years old: for at this age of his father, was Isaac born.\"},{\"verse\":6,\"text\":\"And Sara said: God hath made a laughter for me: whosoever shall hear of it will laugh with me.\"},{\"verse\":7,\"text\":\"And again she said: Who would believe that Abraham should hear that Sara gave suck to a son, whom she bore to him in his old age?\"},{\"verse\":8,\"text\":\"And the child grew, and was weaned: and Abraham made a great feast on the day of his weaning.\"},{\"verse\":9,\"text\":\"And when Sara had seen the son of Agar, the Egyptian, playing with Isaac, her son, she said to Abraham:\"},{\"verse\":10,\"text\":\"Cast out this bondwoman and her son; for the son of the bondwoman shall not be heir with my son Isaac.\"},{\"verse\":11,\"text\":\"Abraham took this grievously for his son.\"},{\"verse\":12,\"text\":\"And God said to him: Let it not seem grievous to thee for the boy, and for thy bondwoman: in all that Sara hath said to thee, hearken to her voice: for in Isaac shall thy seed be called.\"},{\"verse\":13,\"text\":\"But I will make the son also of the bondwoman a great nation, because he is thy seed.\"},{\"verse\":14,\"text\":\"So Abraham rose up in the morning, and taking bread and a bottle of water, put it upon her shoulder, and delivered the boy, and sent her away. And she departed, and wandered in the wilderness of Bersabee.\"},{\"verse\":15,\"text\":\"And when the water in the bottle was spent, she cast the boy under one of the trees that were there.\"},{\"verse\":16,\"text\":\"And she went her way, and sat over against him a great way off, as far as a bow can carry, for she said: I will not see the boy die: and sitting over against, she lifted up her voice and wept.\"},{\"verse\":17,\"text\":\"And God heard the voice of the boy: and an angel of God called to Agar from heaven, saying: What art thou doing, Agar? fear not; for God hath heard the voice of the boy, from the place wherein he is.\"},{\"verse\":18,\"text\":\"Arise, take up the boy, and hold him by the hand, for I will make him a great nation.\"},{\"verse\":19,\"text\":\"And God opened her eyes: and she saw a well of water, and went and filled the bottle, and gave the boy to drink.\"},{\"verse\":20,\"text\":\"And God was with him: and he grew, and dwelt in the wilderness, and became a young man, an archer.\"},{\"verse\":21,\"text\":\"And he dwelt in the wilderness of Pharan, and his mother took a wife for him out of the land of Egypt.\"},{\"verse\":22,\"text\":\"At the same time Abimelech, and Phicol the general of his army, said to Abraham: God is with thee in all that thou dost.\"},{\"verse\":23,\"text\":\"Swear therefore by God, that thou wilt not hurt me, nor my posterity, nor my stock: but according to the kindness that I have done to thee, thou shalt do to me, and to the land wherein thou hast lived a stranger.\"},{\"verse\":24,\"text\":\"And Abraham said: I will swear.\"},{\"verse\":25,\"text\":\"And he reproved Abimelech for a well of water, which his servants had taken away by force.\"},{\"verse\":26,\"text\":\"And Abimelech answered: I knew not who did this thing: and thou didst not tell me, and I heard not of it till today.\"},{\"verse\":27,\"text\":\"Then Abraham took sheep and oxen, and gave them to Abimelech: and both of them made a league.\"},{\"verse\":28,\"text\":\"And Abraham set apart seven ewelambs of the flock.\"},{\"verse\":29,\"text\":\"And Abimelech said to him: What mean these seven ewelambs which thou hast set apart?\"},{\"verse\":30,\"text\":\"But he said: Thou shalt take seven ewelambs at my hand: that they may be a testimony for me, that I dug this well.\"},{\"verse\":31,\"text\":\"Therefore that place was called Bersabee; because there both of them did swear.\"},{\"verse\":32,\"text\":\"And they made a league for the well of oath.\"},{\"verse\":33,\"text\":\"And Abimelech and Phicol, the general of his army, arose and returned to the land of the Palestines. But Abraham planted a grove in Bersabee, and there called upon the name of the Lord God eternal.\"},{\"verse\":34,\"text\":\"And he was a sojourner in the land of the Palestines many days.\"}],\"vul\":[{\"verse\":1,\"text\":\"Visitavit autem Dominus Saram, sicut promiserat : et implevit quæ locutus est.\"},{\"verse\":2,\"text\":\"Concepitque et peperit filium in senectute sua, tempore quo prædixerat ei Deus.\"},{\"verse\":3,\"text\":\"Vocavitque Abraham nomen filii sui, quem genuit ei Sara, Isaac :\"},{\"verse\":4,\"text\":\"et circumcidit eum octavo die, sicut præceperat ei Deus,\"},{\"verse\":5,\"text\":\"cum centum esset annorum : hac quippe ætate patris, natus est Isaac.\"},{\"verse\":6,\"text\":\"Dixitque Sara : Risum fecit mihi Deus : quicumque audierit, corridebit mihi.\"},{\"verse\":7,\"text\":\"Rursumque ait : Quis auditurus crederet Abraham quod Sara lactaret filium, quem peperit ei jam seni ?\"},{\"verse\":8,\"text\":\"Crevit igitur puer, et ablactatus est : fecitque Abraham grande convivium in die ablactationis ejus.\"},{\"verse\":9,\"text\":\"Cumque vidisset Sara filium Agar Ægyptiæ ludentem cum Isaac filio suo, dixit ad Abraham :\"},{\"verse\":10,\"text\":\"Ejice ancillam hanc, et filium ejus : non enim erit hæres filius ancillæ cum filio meo Isaac.\"},{\"verse\":11,\"text\":\"Dure accepit hoc Abraham pro filio suo.\"},{\"verse\":12,\"text\":\"Cui dixit Deus : Non tibi videatur asperum super puero, et super ancilla tua : omnia quæ dixerit tibi Sara, audi vocem ejus : quia in Isaac vocabitur tibi semen.\"},{\"verse\":13,\"text\":\"Sed et filium ancillæ faciam in gentem magnam, quia semen tuum est.\"},{\"verse\":14,\"text\":\"Surrexit itaque Abraham mane, et tollens panem et utrem aquæ, imposuit scapulæ ejus, tradiditque puerum, et dimisit eam. Quæ cum abiisset, errabat in solitudine Bersabee.\"},{\"verse\":15,\"text\":\"Cumque consumpta esset aqua in utre, abjecit puerum subter unam arborum, quæ ibi erant.\"},{\"verse\":16,\"text\":\"Et abiit, seditque e regione procul quantum potest arcus jacere : dixit enim : Non videbo morientem puerum : et sedens contra, levavit vocem suam et flevit.\"},{\"verse\":17,\"text\":\"Exaudivit autem Deus vocem pueri : vocavitque angelus Dei Agar de cælo, dicens : Quid agis Agar ? noli timere : exaudivit enim Deus vocem pueri de loco in quo est.\"},{\"verse\":18,\"text\":\"Surge, tolle puerum, et tene manum illius : quia in gentem magnam faciam eum.\"},{\"verse\":19,\"text\":\"Aperuitque oculos ejus Deus : quæ videns puteum aquæ, abiit, et implevit utrem, deditque puero bibere.\"},{\"verse\":20,\"text\":\"Et fuit cum eo : qui crevit, et moratus est in solitudine, factusque est juvenis sagittarius.\"},{\"verse\":21,\"text\":\"Habitavitque in deserto Pharan, et accepit illi mater sua uxorem de terra Ægypti.\"},{\"verse\":22,\"text\":\"Eodem tempore dixit Abimelech, et Phicol princeps exercitus ejus, ad Abraham : Deus tecum est in universis quæ agis.\"},{\"verse\":23,\"text\":\"Jura ergo per Deum, ne noceas mihi, et posteris meis, stirpique meæ : sed juxta misericordiam, quam feci tibi, facies mihi, et terræ in qua versatus es advena.\"},{\"verse\":24,\"text\":\"Dixitque Abraham : Ego jurabo.\"},{\"verse\":25,\"text\":\"Et increpavit Abimelech propter puteum aquæ quem vi abstulerunt servi ejus.\"},{\"verse\":26,\"text\":\"Responditque Abimelech : Nescivi quis fecerit hanc rem : sed et tu non indicasti mihi, et ego non audivi præter hodie.\"},{\"verse\":27,\"text\":\"Tulit itaque Abraham oves et boves, et dedit Abimelech : percusseruntque ambo fœdus.\"},{\"verse\":28,\"text\":\"Et statuit Abraham septem agnas gregis seorsum.\"},{\"verse\":29,\"text\":\"Cui dixit Abimelech : Quid sibi volunt septem agnæ istæ, quas stare fecisti seorsum ?\"},{\"verse\":30,\"text\":\"At ille : Septem, inquit, agnas accipies de manu mea : ut sint mihi in testimonium, quoniam ego fodi puteum istum.\"},{\"verse\":31,\"text\":\"Idcirco vocatus est locus ille Bersabee : quia ibi uterque juravit.\"},{\"verse\":32,\"text\":\"Et inierunt fœdus pro puteo juramenti.\"},{\"verse\":33,\"text\":\"Surrexit autem Abimelech, et Phicol princeps exercitus ejus, reversique sunt in terram Palæstinorum. Abraham vero plantavit nemus in Bersabee, et invocavit ibi nomen Domini Dei æterni.\"},{\"verse\":34,\"text\":\"Et fuit colonus terræ Palæstinorum diebus multis.\"}],\"summary\":\"Isaac is born. Agar and Ismael are cast forth.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":20,\"label\":\"Genesis 20\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":22,\"label\":\"Genesis 22\"}}]]\n"])</script></body></html>
