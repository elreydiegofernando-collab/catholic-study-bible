tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">37</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Joseph’s dreams: he is sold by his brethren, and carried into Egypt.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jacob dwelt in the land of Chanaan, wherein his father sojourned.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And these are his generations: Joseph, when he was sixteen years old, was feeding the flock with his brethren, being but a boy: and he was with the sons of Bala and of Zelpha his father’s wives: and he accused his brethren to his father of a most wicked crime.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Now Israel loved Joseph above all his sons, because he had him in his old age: and he made him a coat of divers colours.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And his brethren seeing that he was loved by his father, more than all his sons, hated him, and could not speak peaceably to him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Now it fell out also that he told his brethren a dream, that he had dreamed: which occasioned them to hate him the more.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said to them: Hear my dream which I dreamed.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I thought we were binding sheaves in the field: and my sheaf arose as it were, and stood, and your sheaves standing about bowed down before my sheaf.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>His brethren answered: Shalt thou be our king? or shall we be subject to thy dominion? Therefore this matter of his dreams and words ministered nourishment to their envy and hatred.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He dreamed also another dream, which he told his brethren, saying: I saw in a dream, as it were the sun, and the moon, and eleven stars worshipping me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when he had told this to his father, and brethren, his father rebuked him and said: What meaneth this dream that thou hast dreamed? shall I and thy mother, and thy brethren worship thee upon the earth?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>His brethren therefore envied him: but his father considered the thing with himself.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when his brethren abode in Sechem, feeding their father’s flocks,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Israel said to him: Thy brethren feed the sheep in Sichem: come, I will send thee to them. And when he answered:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I am ready: he said to him: Go, and see if all things be well with thy brethren, and the cattle: and bring me word again what is doing. So being sent from the vale of Hebron, he came to Sichem:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And a man found him there wandering in the field, and asked what he sought.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But he answered: I seek my brethren, tell me where they feed the flocks.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the man said to him: They are departed from this place: for I heard them say: Let us go to Dothain. And Joseph went forward after his brethren, and found them in Dothain.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And when they saw him afar off, before he came nigh them, they thought to kill him:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And said one to another: Behold the dreamer cometh.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Come, let us kill him, and cast him into some old pit: and we will say: Some evil beast hath devoured him: and then it shall appear what his dreams avail him:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Ruben hearing this, endeavoured to deliver him out of their hands, and said:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Do not take away his life, nor shed his blood: but cast him into this pit, that is in the wilderness, and keep your hands harmless: now he said this, being desirous to deliver him out of their hands and to restore him to his father.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And as soon as he came to his brethren, they forthwith stript him of his outside coat, that was of divers colours:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And cast him into an old pit where there was not water.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And sitting down to eat bread, they saw some Ismaelites on their way coming from Galaad, with their camels, carrying spices, and balm, and myrrh to Egypt.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Juda said to his brethren: What will it profit us to kill our brother, and conceal his blood?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>It is better that he be sold to the Ismaelites, and that our hands be not defiled: for he is our brother and our flesh. His brethren agreed to his words.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And when the Madianite merchants passed by, they drew him out of the pit, and sold him to the Ismaelites, for twenty pieces of silver: and they led him into Egypt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Ruben returning to the pit, found not the boy:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And rending his garments he went to his brethren, and said: The boy doth not appear, and whither shall I go?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And they took his coat, and dipped it in the blood of a kid, which they had killed:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sending some to carry it to their father, and to say: This we have found: see whether it be thy son’s coat, or not.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the father acknowledging it, said: It is my son’s coat, an evil wild beast hath eaten him, a beast hath devoured Joseph.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And tearing his garments, he put on sackcloth, mourning for his son a long time.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And all his children being gathered together to comfort their father in his sorrow, he would not receive comfort, but said: I will go down to my son into hell, mourning. And whilst he continued weeping,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The Madianites sold Joseph in Egypt to Putiphar, an eunuch of Pharao, captain of the soldiers.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Habitavit autem Jacob in terra Chanaan, in qua pater suus peregrinatus est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et hæ sunt generationes ejus : Joseph cum sedecim esset annorum, pascebat gregem cum fratribus suis adhuc puer : et erat cum filiis Balæ et Zelphæ uxorum patris sui : accusavitque fratres suos apud patrem crimine pessimo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Israël autem diligebat Joseph super omnes filios suos, eo quod in senectute genuisset eum : fecitque ei tunicam polymitam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Videntes autem fratres ejus quod a patre plus cunctis filiis amaretur, oderant eum, nec poterant ei quidquam pacifice loqui.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Accidit quoque ut visum somnium referret fratribus suis : quæ causa majoris odii seminarium fuit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixitque ad eos : Audite somnium meum quod vidi :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>putabam nos ligare manipulos in agro : et quasi consurgere manipulum meum, et stare, vestrosque manipulos circumstantes adorare manipulum meum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Responderunt fratres ejus : Numquid rex noster eris ? aut subjiciemur ditioni tuæ ? Hæc ergo causa somniorum atque sermonum, invidiæ et odii fomitem ministravit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Aliud quoque vidit somnium, quod narrans fratribus, ait : Vidi per somnium, quasi solem, et lunam, et stellas undecim adorare me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quod cum patri suo, et fratribus retulisset, increpavit eum pater suus, et dixit : Quid sibi vult hoc somnium quod vidisti ? num ego et mater tua, et fratres tui adorabimus te super terram ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Invidebant ei igitur fratres sui : pater vero rem tacitus considerabat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cumque fratres illius in pascendis gregibus patris morarentur in Sichem,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>dixit ad eum Israël : Fratres tui pascunt oves in Sichimis : veni, mittam te ad eos. Quo respondente,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Præsto sum, ait ei : Vade, et vide si cuncta prospera sint erga fratres tuos, et pecora : et renuntia mihi quid agatur. Missus de valle Hebron, venit in Sichem :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>invenitque eum vir errantem in agro, et interrogavit quid quæreret.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>At ille respondit : Fratres meos quæro : indica mihi ubi pascant greges.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixitque ei vir : Recesserunt de loco isto : audivi autem eos dicentes : Eamus in Dothain. Perrexit ergo Joseph post fratres suos, et invenit eos in Dothain.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui cum vidissent eum procul, antequam accederet ad eos, cogitaverunt illum occidere :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et mutuo loquebantur : Ecce somniator venit :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>venite, occidamus eum, et mittamus in cisternam veterem : dicemusque : Fera pessima devoravit eum : et tunc apparebit quid illi prosint somnia sua.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Audiens autem hoc Ruben, nitebatur liberare eum de manibus eorum, et dicebat :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non interficiatis animam ejus, nec effundatis sanguinem : sed projicite eum in cisternam hanc, quæ est in solitudine, manusque vestras servate innoxias : hoc autem dicebat, volens eripere eum de manibus eorum, et reddere patri suo.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Confestim igitur ut pervenit ad fratres suos, nudaverunt eum tunica talari et polymita :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>miseruntque eum in cisternam veterem, quæ non habebat aquam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et sedentes ut comederent panem, viderunt Ismaëlitas viatores venire de Galaad, et camelos eorum portantes aromata, et resinam, et stacten in Ægyptum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dixit ergo Judas fratribus suis : Quid nobis prodest si occiderimus fratrem nostrum, et celaverimus sanguinem ipsius ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>melius est ut venundetur Ismaëlitis, et manus nostræ non polluantur : frater enim et caro nostra est. Acquieverunt fratres sermonibus illius.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et prætereuntibus Madianitis negotiatoribus, extrahentes eum de cisterna, vendiderunt eum Ismaëlitis, viginti argenteis : qui duxerunt eum in Ægyptum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Reversusque Ruben ad cisternam, non invenit puerum :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et scissis vestibus pergens ad fratres suos, ait : Puer non comparet, et ego quo ibo ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Tulerunt autem tunicam ejus, et in sanguine hædi, quem occiderant, tinxerunt :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>mittentes qui ferrent ad patrem, et dicerent : Hanc invenimus : vide utrum tunica filii tui sit, an non.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Quam cum agnovisset pater, ait : Tunica filii mei est : fera pessima comedit eum, bestia devoravit Joseph.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Scissisque vestibus, indutus est cilicio, lugens filium suum multo tempore.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Congregatis autem cunctis liberis ejus ut lenirent dolorem patris, noluit consolationem accipere, sed ait : Descendam ad filium meum lugens in infernum. Et illo perseverante in fletu,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Madianitæ vendiderunt Joseph in Ægypto Putiphari eunucho Pharaonis, magistro militum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/36/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span c is father’s wives: and he accused his brethren to his father of a most wicked crime.\"},{\"verse\":3,\"text\":\"Now Israel loved Joseph above all his sons, because he had him in his old age: and he made him a coat of divers colours.\"},{\"verse\":4,\"text\":\"And his brethren seeing that he was loved by his father, more than all his sons, hated him, and could not speak peaceably to him.\"},{\"verse\":5,\"text\":\"Now it fell out also that he told his brethren a dream, that he had dreamed: which occasioned them to hate him the more.\"},{\"verse\":6,\"text\":\"And he said to them: Hear my dream which I dreamed.\"},{\"verse\":7,\"text\":\"I thought we were binding sheaves in the field: and my sheaf arose as it were, and stood, and your sheaves standing about bowed down before my sheaf.\"},{\"verse\":8,\"text\":\"His brethren answered: Shalt thou be our king? or shall we be subject to thy dominion? Therefore this matter of his dreams and words ministered nourishment to their envy and hatred.\"},{\"verse\":9,\"text\":\"He dreamed also another dream, which he told his brethren, saying: I saw in a dream, as it were the sun, and the moon, and eleven stars worshipping me.\"},{\"verse\":10,\"text\":\"And when he had told this to his father, and brethren, his father rebuked him and said: What meaneth this dream that thou hast dreamed? shall I and thy mother, and thy brethren worship thee upon the earth?\"},{\"verse\":11,\"text\":\"His brethren therefore envied him: but his father considered the thing with himself.\"},{\"verse\":12,\"text\":\"And when his brethren abode in Sechem, feeding their father’s flocks,\"},{\"verse\":13,\"text\":\"Israel said to him: Thy brethren feed the sheep in Sichem: come, I will send thee to them. And when he answered:\"},{\"verse\":14,\"text\":\"I am ready: he said to him: Go, and see if all things be well with thy brethren, and the cattle: and bring me word again what is doing. So being sent from the vale of Hebron, he came to Sichem:\"},{\"verse\":15,\"text\":\"And a man found him there wandering in the field, and asked what he sought.\"},{\"verse\":16,\"text\":\"But he answered: I seek my brethren, tell me where they feed the flocks.\"},{\"verse\":17,\"text\":\"And the man said to him: They are departed from this place: for I heard them say: Let us go to Dothain. And Joseph went forward after his brethren, and found them in Dothain.\"},{\"verse\":18,\"text\":\"And when they saw him afar off, before he came nigh them, they thought to kill him:\"},{\"verse\":19,\"text\":\"And said one to another: Behold the dreamer cometh.\"},{\"verse\":20,\"text\":\"Come, let us kill him, and cast him into some old pit: and we will say: Some evil beast hath devoured him: and then it shall appear what his dreams avail him:\"},{\"verse\":21,\"text\":\"And Ruben hearing this, endeavoured to deliver him out of their hands, and said:\"},{\"verse\":22,\"text\":\"Do not take away his life, nor shed his blood: but cast him into this pit, that is in the wilderness, and keep your hands harmless: now he said this, being desirous to deliver him out of their hands and to restore him to his father.\"},{\"verse\":23,\"text\":\"And as soon as he came to his brethren, they forthwith stript him of his outside coat, that was of divers colours:\"},{\"verse\":24,\"text\":\"And cast him into an old pit where there was not water.\"},{\"verse\":25,\"text\":\"And sitting down to eat bread, they saw some Ismaelites on their way coming from Galaad, with their camels, carrying spices, and balm, and myrrh to Egypt.\"},{\"verse\":26,\"text\":\"And Juda said to his brethren: What will it profit us to kill our brother, and conceal his blood?\"},{\"verse\":27,\"text\":\"It is better that he be sold to the Ismaelites, and that our hands be not defiled: for he is our brother and our flesh. His brethren agreed to his words.\"},{\"verse\":28,\"text\":\"And when the Madianite merchants passed by, they drew him out of the pit, and sold him to the Ismaelites, for twenty pieces of silver: and they led him into Egypt.\"},{\"verse\":29,\"text\":\"And Ruben returning to the pit, found not the boy:\"},{\"verse\":30,\"text\":\"And rending his garments he went to his brethren, and said: The boy doth not appear, and whither shall I go?\"},{\"verse\":31,\"text\":\"And they took his coat, and dipped it in the blood of a kid, which they had killed:\"},{\"verse\":32,\"text\":\"Sending some to carry it to their father, and to say: This we have found: see whether it be thy son’s coat, or not.\"},{\"verse\":33,\"text\":\"And the father acknowledging it, said: It is my son’s coat, an evil wild beast hath eaten him, a beast hath devoured Joseph.\"},{\"verse\":34,\"text\":\"And tearing his garments, he put on sackcloth, mourning for his son a long time.\"},{\"verse\":35,\"text\":\"And all his children being gathered together to comfort their father in his sorrow, he would not receive comfort, but said: I will go down to my son into hell, mourning. And whilst he continued weeping,\"},{\"verse\":36,\"text\":\"The Madianites sold Joseph in Egypt to Putiphar, an eunuch of Pharao, captain of the soldiers.\"}],\"vul\":[{\"verse\":1,\"text\":\"Habitavit autem Jacob in terra Chanaan, in qua pater suus peregrinatus est.\"},{\"verse\":2,\"text\":\"Et hæ sunt generationes ejus : Joseph cum sedecim esset annorum, pascebat gregem cum fratribus suis adhuc puer : et erat cum filiis Balæ et Zelphæ uxorum patris sui : accusavitque fratres suos apud patrem crimine pessimo.\"},{\"verse\":3,\"text\":\"Israël autem diligebat Joseph super omnes filios suos, eo quod in senectute genuisset eum : fecitque ei tunicam polymitam.\"},{\"verse\":4,\"text\":\"Videntes autem fratres ejus quod a patre plus cunctis filiis amaretur, oderant eum, nec poterant ei quidquam pacifice loqui.\"},{\"verse\":5,\"text\":\"Accidit quoque ut visum somnium referret fratribus suis : quæ causa majoris odii seminarium fuit.\"},{\"verse\":6,\"text\":\"Dixitque ad eos : Audite somnium meum quod vidi :\"},{\"verse\":7,\"text\":\"putabam nos ligare manipulos in agro : et quasi consurgere manipulum meum, et stare, vestrosque manipulos circumstantes adorare manipulum meum.\"},{\"verse\":8,\"text\":\"Responderunt fratres ejus : Numquid rex noster eris ? aut subjiciemur ditioni tuæ ? Hæc ergo causa somniorum atque sermonum, invidiæ et odii fomitem ministravit.\"},{\"verse\":9,\"text\":\"Aliud quoque vidit somnium, quod narrans fratribus, ait : Vidi per somnium, quasi solem, et lunam, et stellas undecim adorare me.\"},{\"verse\":10,\"text\":\"Quod cum patri suo, et fratribus retulisset, increpavit eum pater suus, et dixit : Quid sibi vult hoc somnium quod vidisti ? num ego et mater tua, et fratres tui adorabimus te super terram ?\"},{\"verse\":11,\"text\":\"Invidebant ei igitur fratres sui : pater vero rem tacitus considerabat.\"},{\"verse\":12,\"text\":\"Cumque fratres illius in pascendis gregibus patris morarentur in Sichem,\"},{\"verse\":13,\"text\":\"dixit ad eum Israël : Fratres tui pascunt oves in Sichimis : veni, mittam te ad eos. Quo respondente,\"},{\"verse\":14,\"text\":\"Præsto sum, ait ei : Vade, et vide si cuncta prospera sint erga fratres tuos, et pecora : et renuntia mihi quid agatur. Missus de valle Hebron, venit in Sichem :\"},{\"verse\":15,\"text\":\"invenitque eum vir errantem in agro, et interrogavit quid quæreret.\"},{\"verse\":16,\"text\":\"At ille respondit : Fratres meos quæro : indica mihi ubi pascant greges.\"},{\"verse\":17,\"text\":\"Dixitque ei vir : Recesserunt de loco isto : audivi autem eos dicentes : Eamus in Dothain. Perrexit ergo Joseph post fratres suos, et invenit eos in Dothain.\"},{\"verse\":18,\"text\":\"Qui cum vidissent eum procul, antequam accederet ad eos, cogitaverunt illum occidere :\"},{\"verse\":19,\"text\":\"et mutuo loquebantur : Ecce somniator venit :\"},{\"verse\":20,\"text\":\"venite, occidamus eum, et mittamus in cisternam veterem : dicemusque : Fera pessima devoravit eum : et tunc apparebit quid illi prosint somnia sua.\"},{\"verse\":21,\"text\":\"Audiens autem hoc Ruben, nitebatur liberare eum de manibus eorum, et dicebat :\"},{\"verse\":22,\"text\":\"Non interficiatis animam ejus, nec effundatis sanguinem : sed projicite eum in cisternam hanc, quæ est in solitudine, manusque vestras servate innoxias : hoc autem dicebat, volens eripere eum de manibus eorum, et reddere patri suo.\"},{\"verse\":23,\"text\":\"Confestim igitur ut pervenit ad fratres suos, nudaverunt eum tunica talari et polymita :\"},{\"verse\":24,\"text\":\"miseruntque eum in cisternam veterem, quæ non habebat aquam.\"},{\"verse\":25,\"text\":\"Et sedentes ut comederent panem, viderunt Ismaëlitas viatores venire de Galaad, et camelos eorum portantes aromata, et resinam, et stacten in Ægyptum.\"},{\"verse\":26,\"text\":\"Dixit ergo Judas fratribus suis : Quid nobis prodest si occiderimus fratrem nostrum, et celaverimus sanguinem ipsius ?\"},{\"verse\":27,\"text\":\"melius est ut venundetur Ismaëlitis, et manus nostræ non polluantur : frater enim et caro nostra est. Acquieverunt fratres sermonibus illius.\"},{\"verse\":28,\"text\":\"Et prætereuntibus Madianitis negotiatoribus, extrahentes eum de cisterna, vendiderunt eum Ismaëlitis, viginti argenteis : qui duxerunt eum in Ægyptum.\"},{\"verse\":29,\"text\":\"Reversusque Ruben ad cisternam, non invenit puerum :\"},{\"verse\":30,\"text\":\"et scissis vestibus pergens ad fratres suos, ait : Puer non comparet, et ego quo ibo ?\"},{\"verse\":31,\"text\":\"Tulerunt autem tunicam ejus, et in sanguine hædi, quem occiderant, tinxerunt :\"},{\"verse\":32,\"text\":\"mittentes qui ferrent ad patrem, et dicerent : Hanc invenimus : vide utrum tunica filii tui sit, an non.\"},{\"verse\":33,\"text\":\"Quam cum agnovisset pater, ait : Tunica filii mei est : fera pessima comedit eum, bestia devoravit Joseph.\"},{\"verse\":34,\"text\":\"Scissisque vestibus, indutus est cilicio, lugens filium suum multo tempore.\"},{\"verse\":35,\"text\":\"Congregatis autem cunctis liberis ejus ut lenirent dolorem patris, noluit consolationem accipere, sed ait : Descendam ad filium meum lugens in infernum. Et illo perseverante in fletu,\"},{\"verse\":36,\"text\":\"Madianitæ vendiderunt Joseph in Ægypto Putiphari eunucho Pharaonis, magistro militum.\"}],\"summary\":\"Joseph’s dreams: he is sold by his brethren, and carried into Egypt.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":36,\"label\":\"Genesis 36\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":38,\"label\":\"Genesis 38\"}}]]\n"])</script></body></html>
