m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">16</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Abram marrieth Agar, who bringeth forth Ismael.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now Sarai, the wife of Abram, had brought forth no children: but having a handmaid, an Egyptian, named Agar,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>She said to her husband: Behold, the Lord hath restrained me from bearing: go in unto my handmaid, it may be I may have children of her at least. And when he agreed to her request,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>She took Agar the Egyptian her handmaid, ten years after they first dwelt in the land of Chanaan, and gave her to her husband to wife.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he went in to her. But she perceiving that she was with child, despised her mistress.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Sarai said to Abram: Thou dost unjustly with me: I gave my handmaid into thy bosom, and she perceiving herself to be with child, despiseth me. The Lord judge between me and thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Abram made answer, and said to her: Behold thy handmaid is in thy own hand, use her as it pleaseth thee. And when Sarai afflicted her, she ran away.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the angel of the Lord having found her, by a fountain of water in the wilderness, which is in the way to Sur in the desert,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He said to her: Agar, handmaid of Sarai, whence comest thou? and whither goest thou? And she answered: I flee from the face of Sarai, my mistress.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the angel of the Lord said to her: Return to thy mistress, and humble thyself under her hand.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And again he said: I will multiply thy seed exceedingly, and it shall not be numbered for multitude.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And again: Behold, said he, thou art with child, and thou shalt bring forth a son: and thou shalt call his name Ismael, because the Lord hath heard thy affliction.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He shall be a wild man: his hand will be against all men, and all men’s hands against him: and he shall pitch his tents over against all his brethren.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And she called the name of the Lord that spoke unto her: Thou the God who hast seen me. For she said: Verily, here have I seen the hinder parts of him that seeth me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Therefore she called that well, the well of him that liveth and seeth me. The same is between Cades and Barad.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Agar brought forth a son to Abram: who called his name Ismael.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Abram was four score and six years old when Agar brought him forth Ismael.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Igitur Sarai, uxor Abram, non genuerat liberos : sed habens ancillam ægyptiam nomine Agar,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>dixit marito suo : Ecce, conclusit me Dominus, ne parerem. Ingredere ad ancillam meam, si forte saltem ex illa suscipiam filios. Cumque ille acquiesceret deprecanti,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>tulit Agar ægyptiam ancillam suam post annos decem quam habitare cœperant in terra Chanaan : et dedit eam viro suo uxorem.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui ingressus est ad eam. At illa concepisse se videns, despexit dominam suam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixitque Sarai ad Abram : Inique agis contra me : ego dedi ancillam meam in sinum tuum, quæ videns quod conceperit, despectui me habet : judicet Dominus inter me et te.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cui respondens Abram : Ecce, ait, ancilla tua in manu tua est, utere ea ut libet. Affligente igitur eam Sarai, fugam iniit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cumque invenisset eam angelus Domini juxta fontem aquæ in solitudine, qui est in via Sur in deserto,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>dixit ad illam : Agar ancilla Sarai, unde venis ? et quo vadis ? Quæ respondit : A facie Sarai dominæ meæ ego fugio.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixitque ei angelus Domini : Revertere ad dominam tuam, et humiliare sub manu illius.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et rursum : Multiplicans, inquit, multiplicabo semen tuum, et non numerabitur præ multitudine.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ac deinceps : Ecce, ait, concepisti, et paries filium : vocabisque nomen ejus Ismaël, eo quod audierit Dominus afflictionem tuam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hic erit ferus homo : manus ejus contra omnes, et manus omnium contra eum : et e regione universorum fratrum suorum figet tabernacula.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vocavit autem nomen Domini qui loquebatur ad eam : Tu Deus qui vidisti me. Dixit enim : Profecto hic vidi posteriora videntis me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Propterea appellavit puteum illum Puteum viventis et videntis me. Ipse est inter Cades et Barad.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Peperitque Agar Abræ filium : qui vocavit nomen ejus Ismaël.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Octoginta et sex annorum erat Abram quando peperit ei Agar Ismaëlem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 17</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->16<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav a .\"},{\"verse\":9,\"text\":\"And the angel of the Lord said to her: Return to thy mistress, and humble thyself under her hand.\"},{\"verse\":10,\"text\":\"And again he said: I will multiply thy seed exceedingly, and it shall not be numbered for multitude.\"},{\"verse\":11,\"text\":\"And again: Behold, said he, thou art with child, and thou shalt bring forth a son: and thou shalt call his name Ismael, because the Lord hath heard thy affliction.\"},{\"verse\":12,\"text\":\"He shall be a wild man: his hand will be against all men, and all men’s hands against him: and he shall pitch his tents over against all his brethren.\"},{\"verse\":13,\"text\":\"And she called the name of the Lord that spoke unto her: Thou the God who hast seen me. For she said: Verily, here have I seen the hinder parts of him that seeth me.\"},{\"verse\":14,\"text\":\"Therefore she called that well, the well of him that liveth and seeth me. The same is between Cades and Barad.\"},{\"verse\":15,\"text\":\"And Agar brought forth a son to Abram: who called his name Ismael.\"},{\"verse\":16,\"text\":\"Abram was four score and six years old when Agar brought him forth Ismael.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur Sarai, uxor Abram, non genuerat liberos : sed habens ancillam ægyptiam nomine Agar,\"},{\"verse\":2,\"text\":\"dixit marito suo : Ecce, conclusit me Dominus, ne parerem. Ingredere ad ancillam meam, si forte saltem ex illa suscipiam filios. Cumque ille acquiesceret deprecanti,\"},{\"verse\":3,\"text\":\"tulit Agar ægyptiam ancillam suam post annos decem quam habitare cœperant in terra Chanaan : et dedit eam viro suo uxorem.\"},{\"verse\":4,\"text\":\"Qui ingressus est ad eam. At illa concepisse se videns, despexit dominam suam.\"},{\"verse\":5,\"text\":\"Dixitque Sarai ad Abram : Inique agis contra me : ego dedi ancillam meam in sinum tuum, quæ videns quod conceperit, despectui me habet : judicet Dominus inter me et te.\"},{\"verse\":6,\"text\":\"Cui respondens Abram : Ecce, ait, ancilla tua in manu tua est, utere ea ut libet. Affligente igitur eam Sarai, fugam iniit.\"},{\"verse\":7,\"text\":\"Cumque invenisset eam angelus Domini juxta fontem aquæ in solitudine, qui est in via Sur in deserto,\"},{\"verse\":8,\"text\":\"dixit ad illam : Agar ancilla Sarai, unde venis ? et quo vadis ? Quæ respondit : A facie Sarai dominæ meæ ego fugio.\"},{\"verse\":9,\"text\":\"Dixitque ei angelus Domini : Revertere ad dominam tuam, et humiliare sub manu illius.\"},{\"verse\":10,\"text\":\"Et rursum : Multiplicans, inquit, multiplicabo semen tuum, et non numerabitur præ multitudine.\"},{\"verse\":11,\"text\":\"Ac deinceps : Ecce, ait, concepisti, et paries filium : vocabisque nomen ejus Ismaël, eo quod audierit Dominus afflictionem tuam.\"},{\"verse\":12,\"text\":\"Hic erit ferus homo : manus ejus contra omnes, et manus omnium contra eum : et e regione universorum fratrum suorum figet tabernacula.\"},{\"verse\":13,\"text\":\"Vocavit autem nomen Domini qui loquebatur ad eam : Tu Deus qui vidisti me. Dixit enim : Profecto hic vidi posteriora videntis me.\"},{\"verse\":14,\"text\":\"Propterea appellavit puteum illum Puteum viventis et videntis me. Ipse est inter Cades et Barad.\"},{\"verse\":15,\"text\":\"Peperitque Agar Abræ filium : qui vocavit nomen ejus Ismaël.\"},{\"verse\":16,\"text\":\"Octoginta et sex annorum erat Abram quando peperit ei Agar Ismaëlem.\"}],\"summary\":\"Abram marrieth Agar, who bringeth forth Ismael.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":15,\"label\":\"Genesis 15\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":17,\"label\":\"Genesis 17\"}}]]\n"])</script></body></html>
