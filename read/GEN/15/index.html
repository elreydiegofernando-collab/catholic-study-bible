m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">15</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God promiseth seed to Abram. His faith, sacrifice and vision.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now when these things were done, the word of the Lord came to Abram by a vision, saying: Fear not, Abram, I am thy protector, and thy reward exceeding great.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Abram said: Lord God, what wilt thou give me? I shall go without children: and the son of the steward of my house is this Damascus Eliezer.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Abram added: But to me thou hast not given seed: and lo my servant born in my house, shall be my heir.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And immediately the word of the Lord came to him, saying: He shall not be thy heir: but he that shall come out of thy bowels, him shalt thou have for thy heir.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he brought him forth abroad, and said to him: Look up to heaven and number the stars if thou canst. And he said to him: So shall thy seed be.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Abram believed God, and it was reputed to him unto justice.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he said to him: I am the Lord who brought thee out from Ur of the Chaldees, to give thee this land, and that thou mightest possess it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But he said: Lord God, whereby may I know that I shall possess it?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord answered, and said: Take me a cow of three years old, and a she-goat of three years, and a ram of three years, a turtle also, and a pigeon.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he took all these, and divided them in the midst, and laid the two pieces of each one against the other: but the birds he divided not.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the fowls came down upon the carcasses, and Abram drove them away.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And when the sun was setting, a deep sleep fell upon Abram, and a great and darksome horror seized upon him.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And it was said unto him: Know thou beforehand that thy seed shall be a stranger in a land not their own, and they shall bring them under bondage, and afflict them four hundred years.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But I will judge the nation which they shall serve, and after this they shall come out with great substance.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou shalt go to thy fathers in peace, and be buried in a good old age.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But in the fourth generation they shall return hither: for as yet the iniquities of the Amorrhites are not at the full until this present time.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when the sun was set, there arose a dark mist, and there appeared a smoking furnace, and a lamp of fire passing between those divisions.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>That day God made a covenant with Abram, saying: To thy seed will I give this land, from the river to Egypt even to the great river Euphrates.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Cineans, and Cenezites, the Cedmonites,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the Hethites, and the Pherezites, the Raphaim also,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Amorrhites, and the Chanaanites, and the Gergesites, and the Jebusites.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>His itaque transactis, factus est sermo Domini ad Abram per visionem dicens : Noli timere, Abram : ego protector tuus sum, et merces tua magna nimis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dixitque Abram : Domine Deus, quid dabis mihi ? ego vadam absque liberis, et filius procuratoris domus meæ iste Damascus Eliezer.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Addiditque Abram : Mihi autem non dedisti semen, et ecce vernaculus meus, hæres meus erit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Statimque sermo Domini factus est ad eum, dicens : Non erit hic hæres tuus, sed qui egredietur de utero tuo, ipsum habebis hæredem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Eduxitque eum foras, et ait illi : Suspice cælum, et numera stellas, si potes. Et dixit ei : Sic erit semen tuum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Credidit Abram Deo, et reputatum est illi ad justitiam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixitque ad eum : Ego Dominus qui eduxi te de Ur Chaldæorum ut darem tibi terram istam, et possideres eam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>At ille ait : Domine Deus, unde scire possum quod possessurus sim eam ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et respondens Dominus : Sume, inquit, mihi vaccam triennem, et capram trimam, et arietem annorum trium, turturem quoque et columbam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui tollens universa hæc, divisit ea per medium, et utrasque partes contra se altrinsecus posuit ; aves autem non divisit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Descenderuntque volucres super cadavera, et abigebat eas Abram.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cumque sol occumberet, sopor irruit super Abram, et horror magnus et tenebrosus invasit eum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dictumque est ad eum : Scito prænoscens quod peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti, et affligent quadringentis annis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Verumtamen gentem, cui servituri sunt, ego judicabo : et post hæc egredientur cum magna substantia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tu autem ibis ad patres tuos in pace, sepultus in senectute bona.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Generatione autem quarta revertentur huc : necdum enim completæ sunt iniquitates Amorrhæorum usque ad præsens tempus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cum ergo occubuisset sol, facta est caligo tenebrosa, et apparuit clibanus fumans, et lampas ignis transiens inter divisiones illas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In illo die pepigit Dominus fœdus cum Abram, dicens : Semini tuo dabo terram hanc a fluvio Ægypti usque ad fluvium magnum Euphraten,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cinæos, et Cenezæos, Cedmonæos,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et Hethæos, et Pherezæos, Raphaim quoque,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et Amorrhæos, et Chananæos, et Gergesæos, et Jebusæos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/16/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 16</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->15<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Genesis 14" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-ston h([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"GEN.15\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":15,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"Now when these things were done, the word of the Lord came to Abram by a vision, saying: Fear not, Abram, I am thy protector, and thy reward exceeding great.\"},{\"verse\":2,\"text\":\"And Abram said: Lord God, what wilt thou give me? I shall go without children: and the son of the steward of my house is this Damascus Eliezer.\"},{\"verse\":3,\"text\":\"And Abram added: But to me thou hast not given seed: and lo my servant born in my house, shall be my heir.\"},{\"verse\":4,\"text\":\"And immediately the word of the Lord came to him, saying: He shall not be thy heir: but he that shall come out of thy bowels, him shalt thou have for thy heir.\"},{\"verse\":5,\"text\":\"And he brought him forth abroad, and said to him: Look up to heaven and number the stars if thou canst. And he said to him: So shall thy seed be.\"},{\"verse\":6,\"text\":\"Abram believed God, and it was reputed to him unto justice.\"},{\"verse\":7,\"text\":\"And he said to him: I am the Lord who brought thee out from Ur of the Chaldees, to give thee this land, and that thou mightest possess it.\"},{\"verse\":8,\"text\":\"But he said: Lord God, whereby may I know that I shall possess it?\"},{\"verse\":9,\"text\":\"And the Lord answered, and said: Take me a cow of three years old, and a she-goat of three years, and a ram of three years, a turtle also, and a pigeon.\"},{\"verse\":10,\"text\":\"And he took all these, and divided them in the midst, and laid the two pieces of each one against the other: but the birds he divided not.\"},{\"verse\":11,\"text\":\"And the fowls came down upon the carcasses, and Abram drove them away.\"},{\"verse\":12,\"text\":\"And when the sun was setting, a deep sleep fell upon Abram, and a great and darksome horror seized upon him.\"},{\"verse\":13,\"text\":\"And it was said unto him: Know thou beforehand that thy seed shall be a stranger in a land not their own, and they shall bring them under bondage, and afflict them four hundred years.\"},{\"verse\":14,\"text\":\"But I will judge the nation which they shall serve, and after this they shall come out with great substance.\"},{\"verse\":15,\"text\":\"And thou shalt go to thy fathers in peace, and be buried in a good old age.\"},{\"verse\":16,\"text\":\"But in the fourth generation they shall return hither: for as yet the iniquities of the Amorrhites are not at the full until this present time.\"},{\"verse\":17,\"text\":\"And when the sun was set, there arose a dark mist, and there appeared a smoking furnace, and a lamp of fire passing between those divisions.\"},{\"verse\":18,\"text\":\"That day God made a covenant with Abram, saying: To thy seed will I give this land, from the river to Egypt even to the great river Euphrates.\"},{\"verse\":19,\"text\":\"The Cineans, and Cenezites, the Cedmonites,\"},{\"verse\":20,\"text\":\"And the Hethites, and the Pherezites, the Raphaim also,\"},{\"verse\":21,\"text\":\"And the Amorrhites, and the Chanaanites, and the Gergesites, and the Jebusites.\"}],\"vul\":[{\"verse\":1,\"text\":\"His itaque transactis, factus est sermo Domini ad Abram per visionem dicens : Noli timere, Abram : ego protector tuus sum, et merces tua magna nimis.\"},{\"verse\":2,\"text\":\"Dixitque Abram : Domine Deus, quid dabis mihi ? ego vadam absque liberis, et filius procuratoris domus meæ iste Damascus Eliezer.\"},{\"verse\":3,\"text\":\"Addiditque Abram : Mihi autem non dedisti semen, et ecce vernaculus meus, hæres meus erit.\"},{\"verse\":4,\"text\":\"Statimque sermo Domini factus est ad eum, dicens : Non erit hic hæres tuus, sed qui egredietur de utero tuo, ipsum habebis hæredem.\"},{\"verse\":5,\"text\":\"Eduxitque eum foras, et ait illi : Suspice cælum, et numera stellas, si potes. Et dixit ei : Sic erit semen tuum.\"},{\"verse\":6,\"text\":\"Credidit Abram Deo, et reputatum est illi ad justitiam.\"},{\"verse\":7,\"text\":\"Dixitque ad eum : Ego Dominus qui eduxi te de Ur Chaldæorum ut darem tibi terram istam, et possideres eam.\"},{\"verse\":8,\"text\":\"At ille ait : Domine Deus, unde scire possum quod possessurus sim eam ?\"},{\"verse\":9,\"text\":\"Et respondens Dominus : Sume, inquit, mihi vaccam triennem, et capram trimam, et arietem annorum trium, turturem quoque et columbam.\"},{\"verse\":10,\"text\":\"Qui tollens universa hæc, divisit ea per medium, et utrasque partes contra se altrinsecus posuit ; aves autem non divisit.\"},{\"verse\":11,\"text\":\"Descenderuntque volucres super cadavera, et abigebat eas Abram.\"},{\"verse\":12,\"text\":\"Cumque sol occumberet, sopor irruit super Abram, et horror magnus et tenebrosus invasit eum.\"},{\"verse\":13,\"text\":\"Dictumque est ad eum : Scito prænoscens quod peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti, et affligent quadringentis annis.\"},{\"verse\":14,\"text\":\"Verumtamen gentem, cui servituri sunt, ego judicabo : et post hæc egredientur cum magna substantia.\"},{\"verse\":15,\"text\":\"Tu autem ibis ad patres tuos in pace, sepultus in senectute bona.\"},{\"verse\":16,\"text\":\"Generatione autem quarta revertentur huc : necdum enim completæ sunt iniquitates Amorrhæorum usque ad præsens tempus.\"},{\"verse\":17,\"text\":\"Cum ergo occubuisset sol, facta est caligo tenebrosa, et apparuit clibanus fumans, et lampas ignis transiens inter divisiones illas.\"},{\"verse\":18,\"text\":\"In illo die pepigit Dominus fœdus cum Abram, dicens : Semini tuo dabo terram hanc a fluvio Ægypti usque ad fluvium magnum Euphraten,\"},{\"verse\":19,\"text\":\"Cinæos, et Cenezæos, Cedmonæos,\"},{\"verse\":20,\"text\":\"et Hethæos, et Pherezæos, Raphaim quoque,\"},{\"verse\":21,\"text\":\"et Amorrhæos, et Chananæos, et Gergesæos, et Jebusæos.\"}],\"summary\":\"God promiseth seed to Abram. His faith, sacrifice and vision.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":14,\"label\":\"Genesis 14\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":16,\"label\":\"Genesis 16\"}}]]\n"])</script></body></html>
