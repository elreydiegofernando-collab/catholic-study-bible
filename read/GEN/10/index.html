-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The genealogy of the children of Noe, by whom the world was peopled after the flood.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>These are the generations of the sons of Noe: Sem, Cham, and Japheth: and unto them sons were born after the flood.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The sons of Japheth: Gomer, and Magog, and Madai, and Javan, and Thubal, and Mosoch, and Thiras.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the sons of Gomer: Ascenez and Riphath and Thogorma.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the sons of Javan: Elisa and Tharsis, Cetthim and Dodanim.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>By these were divided the islands of the Gentiles in their lands, every one according to his tongue and their families in their nations.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the Sons of Cham: Chus, and Mesram, and Phuth, and Chanaan.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the sons of Chus: Saba, and Hevila, and Sabatha, and Regma, and Sabatacha. The sons of Regma: Saba, and Dadan.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Now Chus begot Nemrod: he began to be mighty on the earth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he was a stout hunter before the Lord. Hence came a proverb: Even as Nemrod the stout hunter before the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the beginning of his kingdom was Babylon, and Arach, and Achad, and Chalanne in the land of Sennaar.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Out of that land came forth Assur, and built Ninive, and the streets of the city, and Chale.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Resen also between Ninive and Chale: this is the great city.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Mesraim begot Ludim, and Anamim and Laabim, Nephthuim.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Phetrusim, and Chasluim; of whom came forth the Philistines, and the Capthorim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Chanaan begot Sidon his firstborn, the Hethite,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the Jebusite, and the Amorrhite, and the Gergesite.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The Hevite and Aracite: the Sinite,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the Aradian, the Samarite, and the Hamathite: and afterwards the families of the Chanaanites were spread abroad.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the limits of Chanaan were from Sidon as one comes to Gerara even to Gaza, until thou enter Sodom and Gomorrha, and Adama, and Seboim even to Lesa.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>These are the children of Cham in their kindreds and tongues, and generations, and lands, and nations.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Of Sem also the father of all the children of Heber, the elder brother of Japheth, sons were born.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sons of Sem: Elam and Assur, and Arphaxad, and Lud, and Aram.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The sons of Aram: Us, and Hull, and Gether; and Mes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But Arphaxad begot Sale, of whom was born Heber.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And to Heber were born two sons: the name of the one was Phaleg, because in his days was the earth divided: and his brother’s name Jectan.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Which Jectan begot Elmodad, and Saleph, and Asarmoth, Jare,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Aduram, and Uzal, and Decla,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Ebal, and Abimael, Saba,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Ophir, and Hevila, and Jobab. All these were the sons of Jectan.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And their dwelling was from Messa as we go on as far as Sephar, a mountain in the east.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>These are the children of Sem according to their kindreds and tongues, and countries in their nations.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>These are the families of Noe, according to their people and nations. By these were the nations divided on the earth after the flood.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæ sunt generationes filiorum Noë, Sem, Cham et Japheth : natique sunt eis filii post diluvium.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Filii Japheth : Gomer, et Magog, et Madai, et Javan, et Thubal, et Mosoch, et Thiras.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Porro filii Gomer : Ascenez et Riphath et Thogorma.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Filii autem Javan : Elisa et Tharsis, Cetthim et Dodanim.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ab his divisæ sunt insulæ gentium in regionibus suis, unusquisque secundum linguam suam et familias suas in nationibus suis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Filii autem Cham : Chus, et Mesraim, et Phuth, et Chanaan.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Filii Chus : Saba, et Hevila, et Sabatha, et Regma, et Sabatacha. Filii Regma : Saba et Dadan.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Porro Chus genuit Nemrod : ipse cœpit esse potens in terra,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et erat robustus venator coram Domino. Ob hoc exivit proverbium : Quasi Nemrod robustus venator coram Domino.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fuit autem principium regni ejus Babylon, et Arach et Achad, et Chalanne, in terra Sennaar.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>De terra illa egressus est Assur, et ædificavit Niniven, et plateas civitatis, et Chale.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Resen quoque inter Niniven et Chale : hæc est civitas magna.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At vero Mesraim genuit Ludim, et Anamim et Laabim, Nephthuim,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et Phetrusim, et Chasluim : de quibus egressi sunt Philisthiim et Caphtorim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Chanaan autem genuit Sidonem primogenitum suum. Hethæum,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et Jebusæum, et Amorrhæum, Gergesæum,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hevæum, et Aracæum : Sinæum,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et Aradium, Samaræum, et Amathæum : et post hæc disseminati sunt populi Chananæorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Factique sunt termini Chanaan venientibus a Sidone Geraram usque Gazam, donec ingrediaris Sodomam et Gomorrham, et Adamam, et Seboim usque Lesa.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hi sunt filii Cham in cognationibus, et linguis, et generationibus, terrisque et gentibus suis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>De Sem quoque nati sunt, patre omnium filiorum Heber, fratre Japheth majore.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Filii Sem : Ælam, et Assur, et Arphaxad, et Lud, et Aram.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Filii Aram : Us, et Hul, et Gether, et Mes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>At vero Arphaxad genuit Sale, de quo ortus est Heber.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Natique sunt Heber filii duo : nomen uni Phaleg, eo quod in diebus ejus divisa sit terra : et nomen fratris ejus Jectan.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui Jectan genuit Elmodad, et Saleph, et Asarmoth, Jare,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et Aduram, et Uzal, et Decla,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et Ebal, et Abimaël, Saba,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et Ophir, et Hevila, et Jobab : omnes isti, filii Jectan.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et facta est habitatio eorum de Messa pergentibus usque Sephar montem orientalem.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Isti filii Sem secundum cognationes, et linguas, et regiones in gentibus suis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Hæ familiæ Noë juxta populos et nationes suas. Ab his divisæ sunt gentes in terra post diluvium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 9</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/11/"><span cl me\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"GEN.10\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":10,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"These are the generations of the sons of Noe: Sem, Cham, and Japheth: and unto them sons were born after the flood.\"},{\"verse\":2,\"text\":\"The sons of Japheth: Gomer, and Magog, and Madai, and Javan, and Thubal, and Mosoch, and Thiras.\"},{\"verse\":3,\"text\":\"And the sons of Gomer: Ascenez and Riphath and Thogorma.\"},{\"verse\":4,\"text\":\"And the sons of Javan: Elisa and Tharsis, Cetthim and Dodanim.\"},{\"verse\":5,\"text\":\"By these were divided the islands of the Gentiles in their lands, every one according to his tongue and their families in their nations.\"},{\"verse\":6,\"text\":\"And the Sons of Cham: Chus, and Mesram, and Phuth, and Chanaan.\"},{\"verse\":7,\"text\":\"And the sons of Chus: Saba, and Hevila, and Sabatha, and Regma, and Sabatacha. The sons of Regma: Saba, and Dadan.\"},{\"verse\":8,\"text\":\"Now Chus begot Nemrod: he began to be mighty on the earth.\"},{\"verse\":9,\"text\":\"And he was a stout hunter before the Lord. Hence came a proverb: Even as Nemrod the stout hunter before the Lord.\"},{\"verse\":10,\"text\":\"And the beginning of his kingdom was Babylon, and Arach, and Achad, and Chalanne in the land of Sennaar.\"},{\"verse\":11,\"text\":\"Out of that land came forth Assur, and built Ninive, and the streets of the city, and Chale.\"},{\"verse\":12,\"text\":\"Resen also between Ninive and Chale: this is the great city.\"},{\"verse\":13,\"text\":\"And Mesraim begot Ludim, and Anamim and Laabim, Nephthuim.\"},{\"verse\":14,\"text\":\"And Phetrusim, and Chasluim; of whom came forth the Philistines, and the Capthorim.\"},{\"verse\":15,\"text\":\"And Chanaan begot Sidon his firstborn, the Hethite,\"},{\"verse\":16,\"text\":\"And the Jebusite, and the Amorrhite, and the Gergesite.\"},{\"verse\":17,\"text\":\"The Hevite and Aracite: the Sinite,\"},{\"verse\":18,\"text\":\"And the Aradian, the Samarite, and the Hamathite: and afterwards the families of the Chanaanites were spread abroad.\"},{\"verse\":19,\"text\":\"And the limits of Chanaan were from Sidon as one comes to Gerara even to Gaza, until thou enter Sodom and Gomorrha, and Adama, and Seboim even to Lesa.\"},{\"verse\":20,\"text\":\"These are the children of Cham in their kindreds and tongues, and generations, and lands, and nations.\"},{\"verse\":21,\"text\":\"Of Sem also the father of all the children of Heber, the elder brother of Japheth, sons were born.\"},{\"verse\":22,\"text\":\"The sons of Sem: Elam and Assur, and Arphaxad, and Lud, and Aram.\"},{\"verse\":23,\"text\":\"The sons of Aram: Us, and Hull, and Gether; and Mes.\"},{\"verse\":24,\"text\":\"But Arphaxad begot Sale, of whom was born Heber.\"},{\"verse\":25,\"text\":\"And to Heber were born two sons: the name of the one was Phaleg, because in his days was the earth divided: and his brother’s name Jectan.\"},{\"verse\":26,\"text\":\"Which Jectan begot Elmodad, and Saleph, and Asarmoth, Jare,\"},{\"verse\":27,\"text\":\"And Aduram, and Uzal, and Decla,\"},{\"verse\":28,\"text\":\"And Ebal, and Abimael, Saba,\"},{\"verse\":29,\"text\":\"And Ophir, and Hevila, and Jobab. All these were the sons of Jectan.\"},{\"verse\":30,\"text\":\"And their dwelling was from Messa as we go on as far as Sephar, a mountain in the east.\"},{\"verse\":31,\"text\":\"These are the children of Sem according to their kindreds and tongues, and countries in their nations.\"},{\"verse\":32,\"text\":\"These are the families of Noe, according to their people and nations. By these were the nations divided on the earth after the flood.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæ sunt generationes filiorum Noë, Sem, Cham et Japheth : natique sunt eis filii post diluvium.\"},{\"verse\":2,\"text\":\"Filii Japheth : Gomer, et Magog, et Madai, et Javan, et Thubal, et Mosoch, et Thiras.\"},{\"verse\":3,\"text\":\"Porro filii Gomer : Ascenez et Riphath et Thogorma.\"},{\"verse\":4,\"text\":\"Filii autem Javan : Elisa et Tharsis, Cetthim et Dodanim.\"},{\"verse\":5,\"text\":\"Ab his divisæ sunt insulæ gentium in regionibus suis, unusquisque secundum linguam suam et familias suas in nationibus suis.\"},{\"verse\":6,\"text\":\"Filii autem Cham : Chus, et Mesraim, et Phuth, et Chanaan.\"},{\"verse\":7,\"text\":\"Filii Chus : Saba, et Hevila, et Sabatha, et Regma, et Sabatacha. Filii Regma : Saba et Dadan.\"},{\"verse\":8,\"text\":\"Porro Chus genuit Nemrod : ipse cœpit esse potens in terra,\"},{\"verse\":9,\"text\":\"et erat robustus venator coram Domino. Ob hoc exivit proverbium : Quasi Nemrod robustus venator coram Domino.\"},{\"verse\":10,\"text\":\"Fuit autem principium regni ejus Babylon, et Arach et Achad, et Chalanne, in terra Sennaar.\"},{\"verse\":11,\"text\":\"De terra illa egressus est Assur, et ædificavit Niniven, et plateas civitatis, et Chale.\"},{\"verse\":12,\"text\":\"Resen quoque inter Niniven et Chale : hæc est civitas magna.\"},{\"verse\":13,\"text\":\"At vero Mesraim genuit Ludim, et Anamim et Laabim, Nephthuim,\"},{\"verse\":14,\"text\":\"et Phetrusim, et Chasluim : de quibus egressi sunt Philisthiim et Caphtorim.\"},{\"verse\":15,\"text\":\"Chanaan autem genuit Sidonem primogenitum suum. Hethæum,\"},{\"verse\":16,\"text\":\"et Jebusæum, et Amorrhæum, Gergesæum,\"},{\"verse\":17,\"text\":\"Hevæum, et Aracæum : Sinæum,\"},{\"verse\":18,\"text\":\"et Aradium, Samaræum, et Amathæum : et post hæc disseminati sunt populi Chananæorum.\"},{\"verse\":19,\"text\":\"Factique sunt termini Chanaan venientibus a Sidone Geraram usque Gazam, donec ingrediaris Sodomam et Gomorrham, et Adamam, et Seboim usque Lesa.\"},{\"verse\":20,\"text\":\"Hi sunt filii Cham in cognationibus, et linguis, et generationibus, terrisque et gentibus suis.\"},{\"verse\":21,\"text\":\"De Sem quoque nati sunt, patre omnium filiorum Heber, fratre Japheth majore.\"},{\"verse\":22,\"text\":\"Filii Sem : Ælam, et Assur, et Arphaxad, et Lud, et Aram.\"},{\"verse\":23,\"text\":\"Filii Aram : Us, et Hul, et Gether, et Mes.\"},{\"verse\":24,\"text\":\"At vero Arphaxad genuit Sale, de quo ortus est Heber.\"},{\"verse\":25,\"text\":\"Natique sunt Heber filii duo : nomen uni Phaleg, eo quod in diebus ejus divisa sit terra : et nomen fratris ejus Jectan.\"},{\"verse\":26,\"text\":\"Qui Jectan genuit Elmodad, et Saleph, et Asarmoth, Jare,\"},{\"verse\":27,\"text\":\"et Aduram, et Uzal, et Decla,\"},{\"verse\":28,\"text\":\"et Ebal, et Abimaël, Saba,\"},{\"verse\":29,\"text\":\"et Ophir, et Hevila, et Jobab : omnes isti, filii Jectan.\"},{\"verse\":30,\"text\":\"Et facta est habitatio eorum de Messa pergentibus usque Sephar montem orientalem.\"},{\"verse\":31,\"text\":\"Isti filii Sem secundum cognationes, et linguas, et regiones in gentibus suis.\"},{\"verse\":32,\"text\":\"Hæ familiæ Noë juxta populos et nationes suas. Ab his divisæ sunt gentes in terra post diluvium.\"}],\"summary\":\"The genealogy of the children of Noe, by whom the world was peopled after the flood.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":9,\"label\":\"Genesis 9\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":11,\"label\":\"Genesis 11\"}}]]\n"])</script></body></html>
