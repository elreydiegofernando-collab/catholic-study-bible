-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">23</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Sara’s death and burial in the field bought of Ephron.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Sara lived a hundred and twenty-seven years.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And she died in the city of Arbee which is Hebron, in the land of Chanaan: and Abraham came to mourn and weep for her.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And after he rose up from the funeral obsequies, he spoke to the children of Heth, saying:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I am a stranger and sojourner among you: give me the right of a burying place with you, that I may bury my dead.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The children of Heth answered, saying:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>My lord, hear us, thou art a prince of God among us: bury thy dead in our principal sepulchres: and no man shall have power to hinder thee from burying thy dead in his sepulchre.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Abraham rose up, and bowed down to the people of the land, to wit, the children of Heth:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And said to them: If it please your soul that I should bury my dead, hear me, and intercede for me to Ephron the son of Seor.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>That he may give me the double cave, which he hath in the end of his field: For as much money as it is worth he shall give it me before you, for a possession of a burying place.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Now Ephron dwelt in the midst of the children of Heth. And Ephron made answer to Abraham in the hearing of all that went in at the gate of the city, saying:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Let it not be so, my lord, but do thou rather hearken to what I say: The field I deliver to thee, and the cave that is therein; in the presence of the children of my people, bury thy dead.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Abraham bowed down before the people of the land.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he spoke to Ephron, in the presence of the people: I beseech thee to hear me: I will give money for the field; take it, and so will I bury my dead in it.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Ephron answered:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My lord, hear me. The ground which thou desirest, is worth four hundred sicles of silver: this is the price between me and thee: but what is this? bury thy dead.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when Abraham had heard this, he weighed out the money that Ephron had asked, in the hearing of the children of Heth, four hundred sicles of silver, of common current money.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the field that before was Ephron’s, wherein was the double cave, looking towards Mambre, both it and the cave, and all the trees thereof, in all its limits round about,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Was made sure to Abraham for a possession, in the sight of the children of Heth, and of all that went in at the gate of his city.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And so Abraham buried Sara, his wife, in the double cave of the field, that looked towards Mambre, this is Hebron in the land of Chanaan.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the field was made sure to Abraham, and the cave that was in it, for a possession to bury in, by the children of Heth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vixit autem Sara centum viginti septem annis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et mortua est in civitate Arbee, quæ est Hebron, in terra Chanaan : venitque Abraham ut plangeret et fleret eam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cumque surrexisset ab officio funeris, locutus est ad filios Heth, dicens :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Advena sum et peregrinus apud vos : date mihi jus sepulchri vobiscum, ut sepeliam mortuum meum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Responderunt filii Heth, dicentes :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Audi nos, domine : princeps Dei es apud nos : in electis sepulchris nostris sepeli mortuum tuum, nullusque te prohibere poterit quin in monumento ejus sepelias mortuum tuum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Surrexit Abraham, et adoravit populum terræ, filios videlicet Heth :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>dixitque ad eos : Si placet animæ vestræ ut sepeliam mortuum meum, audite me, et intercedite pro me apud Ephron filium Seor :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>ut det mihi speluncam duplicem, quam habet in extrema parte agri sui : pecunia digna tradat eam mihi coram vobis in possessionem sepulchri.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Habitabat autem Ephron in medio filiorum Heth. Responditque Ephron ad Abraham, cunctis audientibus qui ingrediebantur portam civitatis illius, dicens :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nequaquam ita fiat, domine mi, sed tu magis ausculta quod loquor. Agrum trado tibi, et speluncam quæ in eo est, præsentibus filiis populi mei ; sepeli mortuum tuum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Adoravit Abraham coram populo terræ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et locutus est ad Ephron circumstante plebe : Quæso ut audias me : dabo pecuniam pro agro : suscipe eam, et sic sepeliam mortuum meum in eo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Responditque Ephron :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Domine mi, audi me : terra, quam postulas, quadringentis siclis argenti valet : istud est pretium inter me et te : sed quantum est hoc ? sepeli mortuum tuum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quod cum audisset Abraham, appendit pecuniam, quam Ephron postulaverat, audientibus filiis Heth, quadringentos siclos argenti probatæ monetæ publicæ.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Confirmatusque est ager quondam Ephronis, in quo erat spelunca duplex, respiciens Mambre, tam ipse, quam spelunca, et omnes arbores ejus in cunctis terminis ejus per circuitum,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Abrahæ in possessionem, videntibus filiis Heth, et cunctis qui intrabant portam civitatis illius.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Atque ita sepelivit Abraham Saram uxorem suam in spelunca agri duplici, quæ respiciebat Mambre. Hæc est Hebron in terra Chanaan.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et confirmatus est ager, et antrum quod erat in eo, Abrahæ in possessionem monumenti a filiis Heth.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 22</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/24/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 24</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->23<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-pape ],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"GEN.23\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":23,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And Sara lived a hundred and twenty-seven years.\"},{\"verse\":2,\"text\":\"And she died in the city of Arbee which is Hebron, in the land of Chanaan: and Abraham came to mourn and weep for her.\"},{\"verse\":3,\"text\":\"And after he rose up from the funeral obsequies, he spoke to the children of Heth, saying:\"},{\"verse\":4,\"text\":\"I am a stranger and sojourner among you: give me the right of a burying place with you, that I may bury my dead.\"},{\"verse\":5,\"text\":\"The children of Heth answered, saying:\"},{\"verse\":6,\"text\":\"My lord, hear us, thou art a prince of God among us: bury thy dead in our principal sepulchres: and no man shall have power to hinder thee from burying thy dead in his sepulchre.\"},{\"verse\":7,\"text\":\"Abraham rose up, and bowed down to the people of the land, to wit, the children of Heth:\"},{\"verse\":8,\"text\":\"And said to them: If it please your soul that I should bury my dead, hear me, and intercede for me to Ephron the son of Seor.\"},{\"verse\":9,\"text\":\"That he may give me the double cave, which he hath in the end of his field: For as much money as it is worth he shall give it me before you, for a possession of a burying place.\"},{\"verse\":10,\"text\":\"Now Ephron dwelt in the midst of the children of Heth. And Ephron made answer to Abraham in the hearing of all that went in at the gate of the city, saying:\"},{\"verse\":11,\"text\":\"Let it not be so, my lord, but do thou rather hearken to what I say: The field I deliver to thee, and the cave that is therein; in the presence of the children of my people, bury thy dead.\"},{\"verse\":12,\"text\":\"Abraham bowed down before the people of the land.\"},{\"verse\":13,\"text\":\"And he spoke to Ephron, in the presence of the people: I beseech thee to hear me: I will give money for the field; take it, and so will I bury my dead in it.\"},{\"verse\":14,\"text\":\"And Ephron answered:\"},{\"verse\":15,\"text\":\"My lord, hear me. The ground which thou desirest, is worth four hundred sicles of silver: this is the price between me and thee: but what is this? bury thy dead.\"},{\"verse\":16,\"text\":\"And when Abraham had heard this, he weighed out the money that Ephron had asked, in the hearing of the children of Heth, four hundred sicles of silver, of common current money.\"},{\"verse\":17,\"text\":\"And the field that before was Ephron’s, wherein was the double cave, looking towards Mambre, both it and the cave, and all the trees thereof, in all its limits round about,\"},{\"verse\":18,\"text\":\"Was made sure to Abraham for a possession, in the sight of the children of Heth, and of all that went in at the gate of his city.\"},{\"verse\":19,\"text\":\"And so Abraham buried Sara, his wife, in the double cave of the field, that looked towards Mambre, this is Hebron in the land of Chanaan.\"},{\"verse\":20,\"text\":\"And the field was made sure to Abraham, and the cave that was in it, for a possession to bury in, by the children of Heth.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vixit autem Sara centum viginti septem annis.\"},{\"verse\":2,\"text\":\"Et mortua est in civitate Arbee, quæ est Hebron, in terra Chanaan : venitque Abraham ut plangeret et fleret eam.\"},{\"verse\":3,\"text\":\"Cumque surrexisset ab officio funeris, locutus est ad filios Heth, dicens :\"},{\"verse\":4,\"text\":\"Advena sum et peregrinus apud vos : date mihi jus sepulchri vobiscum, ut sepeliam mortuum meum.\"},{\"verse\":5,\"text\":\"Responderunt filii Heth, dicentes :\"},{\"verse\":6,\"text\":\"Audi nos, domine : princeps Dei es apud nos : in electis sepulchris nostris sepeli mortuum tuum, nullusque te prohibere poterit quin in monumento ejus sepelias mortuum tuum.\"},{\"verse\":7,\"text\":\"Surrexit Abraham, et adoravit populum terræ, filios videlicet Heth :\"},{\"verse\":8,\"text\":\"dixitque ad eos : Si placet animæ vestræ ut sepeliam mortuum meum, audite me, et intercedite pro me apud Ephron filium Seor :\"},{\"verse\":9,\"text\":\"ut det mihi speluncam duplicem, quam habet in extrema parte agri sui : pecunia digna tradat eam mihi coram vobis in possessionem sepulchri.\"},{\"verse\":10,\"text\":\"Habitabat autem Ephron in medio filiorum Heth. Responditque Ephron ad Abraham, cunctis audientibus qui ingrediebantur portam civitatis illius, dicens :\"},{\"verse\":11,\"text\":\"Nequaquam ita fiat, domine mi, sed tu magis ausculta quod loquor. Agrum trado tibi, et speluncam quæ in eo est, præsentibus filiis populi mei ; sepeli mortuum tuum.\"},{\"verse\":12,\"text\":\"Adoravit Abraham coram populo terræ.\"},{\"verse\":13,\"text\":\"Et locutus est ad Ephron circumstante plebe : Quæso ut audias me : dabo pecuniam pro agro : suscipe eam, et sic sepeliam mortuum meum in eo.\"},{\"verse\":14,\"text\":\"Responditque Ephron :\"},{\"verse\":15,\"text\":\"Domine mi, audi me : terra, quam postulas, quadringentis siclis argenti valet : istud est pretium inter me et te : sed quantum est hoc ? sepeli mortuum tuum.\"},{\"verse\":16,\"text\":\"Quod cum audisset Abraham, appendit pecuniam, quam Ephron postulaverat, audientibus filiis Heth, quadringentos siclos argenti probatæ monetæ publicæ.\"},{\"verse\":17,\"text\":\"Confirmatusque est ager quondam Ephronis, in quo erat spelunca duplex, respiciens Mambre, tam ipse, quam spelunca, et omnes arbores ejus in cunctis terminis ejus per circuitum,\"},{\"verse\":18,\"text\":\"Abrahæ in possessionem, videntibus filiis Heth, et cunctis qui intrabant portam civitatis illius.\"},{\"verse\":19,\"text\":\"Atque ita sepelivit Abraham Saram uxorem suam in spelunca agri duplici, quæ respiciebat Mambre. Hæc est Hebron in terra Chanaan.\"},{\"verse\":20,\"text\":\"Et confirmatus est ager, et antrum quod erat in eo, Abrahæ in possessionem monumenti a filiis Heth.\"}],\"summary\":\"Sara’s death and burial in the field bought of Ephron.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":22,\"label\":\"Genesis 22\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":24,\"label\":\"Genesis 24\"}}]]\n"])</script></body></html>
