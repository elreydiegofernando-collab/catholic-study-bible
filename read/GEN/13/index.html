as very rich in possession of gold and silver.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he returned by the way, that he came, from the south to Bethel, to the place where before he had pitched his tent between Bethel and Hai,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In the place of the altar which he had made before, and there he called upon the name of the Lord.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But Lot also, who was with Abram, had flocks of sheep, and herds of beasts, and tents.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Neither was the land able to bear them, that they might dwell together: for their substance was great, and they could not dwell together.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Whereupon also there arose a strife between the herdsmen of Abram and of Lot. And at that time the Chanaanite and the Pherezite dwelled in that country.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Abram therefore said to Lot: Let there be no quarrel, I beseech thee, between me and thee, and between my herdsmen and thy herdsmen: for we are brethren.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Behold the whole land is before thee: depart from me, I pray thee: if thou wilt go to the left hand, I will take the right: if thou choose the right hand, I will pass to the left.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Lot lifting up his eyes, saw all the country about the Jordan, which was watered throughout, before the Lord destroyed Sodom and Gomorrha, as the paradise of the Lord, and like Egypt as one comes to Segor.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Lot chose to himself the country about the Jordan, and he departed from the east: and they were separated one brother from the other.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Abram dwelt in the land of Chanaan: and Lot abode in the towns, that were about the Jordan, and dwelt in Sodom.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the men of Sodom were very wicked, and sinners before the face of the Lord beyond measure.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the Lord said to Abram, after Lot was separated from him: Lift up thy eyes, and look from the place wherein thou now art, to the north and to the south, to the east and to the west.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>All the land which thou seest, I will give to thee, and to thy seed for ever.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And I will make thy seed as the dust of the earth: if any man be able to number the dust of the earth, he shall be able to number thy seed also.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Arise and walk through the land in the length, and the breadth thereof: for I will give it to thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>So Abram removing his tent, came, and dwelt by the vale of Mambre, which is in Hebron: and he built there an altar to the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ascendit ergo Abram de Ægypto, ipse et uxor ejus, et omnia quæ habebat, et Lot cum eo, ad australem plagam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Erat autem dives valde in possessione auri et argenti.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Reversusque est per iter, quo venerat, a meridie in Bethel, usque ad locum ubi prius fixerat tabernaculum inter Bethel et Hai,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>in loco altaris quod fecerat prius : et invocavit ibi nomen Domini.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sed et Lot qui erat cum Abram, fuerunt greges ovium, et armenta, et tabernacula.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nec poterat eos capere terra, ut habitarent simul : erat quippe substantia eorum multa, et nequibant habitare communiter.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Unde et facta est rixa inter pastores gregum Abram et Lot. Eo autem tempore Chananæus et Pherezæus habitabant in terra illa.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixit ergo Abram ad Lot : Ne quæso sit jurgium inter me et te, et inter pastores meos et pastores tuos : fratres enim sumus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ecce universa terra coram te est : recede a me, obsecro : si ad sinistram ieris, ego dexteram tenebo : si tu dexteram elegeris, ego ad sinistram pergam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Elevatis itaque Lot oculis, vidit omnem circa regionem Jordanis, quæ universa irrigabatur antequam subverteret Dominus Sodomam et Gomorrham, sicut paradisus Domini, et sicut Ægyptus venientibus in Segor.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Elegitque sibi Lot regionem circa Jordanem, et recessit ab oriente : divisique sunt alterutrum a fratre suo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Abram habitavit in terra Chanaan ; Lot vero moratus est in oppidis, quæ erant circa Jordanem, et habitavit in Sodomis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Homines autem Sodomitæ pessimi erant, et peccatores coram Domino nimis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dixitque Dominus ad Abram, postquam divisus est ab eo Lot : Leva oculos tuos et vide a loco, in quo nunc es, ad aquilonem et meridiem, ad orientem et occidentem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnem terram, quam conspicis, tibi dabo, et semini tuo usque in sempiternum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Faciamque semen tuum sicut pulverem terræ : si quis potest hominum numerare pulverem terræ, semen quoque tuum numerare poterit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Surge, et perambula terram in longitudine et in latitudine sua : quia tibi daturus sum eam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Movens igitur tabernaculum suum Abram, venit, et habitavit juxta convallem Mambre, quæ est in Hebron : ædificavitque ibi altare Domino.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span cl ce of the altar which he had made before, and there he called upon the name of the Lord.\"},{\"verse\":5,\"text\":\"But Lot also, who was with Abram, had flocks of sheep, and herds of beasts, and tents.\"},{\"verse\":6,\"text\":\"Neither was the land able to bear them, that they might dwell together: for their substance was great, and they could not dwell together.\"},{\"verse\":7,\"text\":\"Whereupon also there arose a strife between the herdsmen of Abram and of Lot. And at that time the Chanaanite and the Pherezite dwelled in that country.\"},{\"verse\":8,\"text\":\"Abram therefore said to Lot: Let there be no quarrel, I beseech thee, between me and thee, and between my herdsmen and thy herdsmen: for we are brethren.\"},{\"verse\":9,\"text\":\"Behold the whole land is before thee: depart from me, I pray thee: if thou wilt go to the left hand, I will take the right: if thou choose the right hand, I will pass to the left.\"},{\"verse\":10,\"text\":\"And Lot lifting up his eyes, saw all the country about the Jordan, which was watered throughout, before the Lord destroyed Sodom and Gomorrha, as the paradise of the Lord, and like Egypt as one comes to Segor.\"},{\"verse\":11,\"text\":\"And Lot chose to himself the country about the Jordan, and he departed from the east: and they were separated one brother from the other.\"},{\"verse\":12,\"text\":\"Abram dwelt in the land of Chanaan: and Lot abode in the towns, that were about the Jordan, and dwelt in Sodom.\"},{\"verse\":13,\"text\":\"And the men of Sodom were very wicked, and sinners before the face of the Lord beyond measure.\"},{\"verse\":14,\"text\":\"And the Lord said to Abram, after Lot was separated from him: Lift up thy eyes, and look from the place wherein thou now art, to the north and to the south, to the east and to the west.\"},{\"verse\":15,\"text\":\"All the land which thou seest, I will give to thee, and to thy seed for ever.\"},{\"verse\":16,\"text\":\"And I will make thy seed as the dust of the earth: if any man be able to number the dust of the earth, he shall be able to number thy seed also.\"},{\"verse\":17,\"text\":\"Arise and walk through the land in the length, and the breadth thereof: for I will give it to thee.\"},{\"verse\":18,\"text\":\"So Abram removing his tent, came, and dwelt by the vale of Mambre, which is in Hebron: and he built there an altar to the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ascendit ergo Abram de Ægypto, ipse et uxor ejus, et omnia quæ habebat, et Lot cum eo, ad australem plagam.\"},{\"verse\":2,\"text\":\"Erat autem dives valde in possessione auri et argenti.\"},{\"verse\":3,\"text\":\"Reversusque est per iter, quo venerat, a meridie in Bethel, usque ad locum ubi prius fixerat tabernaculum inter Bethel et Hai,\"},{\"verse\":4,\"text\":\"in loco altaris quod fecerat prius : et invocavit ibi nomen Domini.\"},{\"verse\":5,\"text\":\"Sed et Lot qui erat cum Abram, fuerunt greges ovium, et armenta, et tabernacula.\"},{\"verse\":6,\"text\":\"Nec poterat eos capere terra, ut habitarent simul : erat quippe substantia eorum multa, et nequibant habitare communiter.\"},{\"verse\":7,\"text\":\"Unde et facta est rixa inter pastores gregum Abram et Lot. Eo autem tempore Chananæus et Pherezæus habitabant in terra illa.\"},{\"verse\":8,\"text\":\"Dixit ergo Abram ad Lot : Ne quæso sit jurgium inter me et te, et inter pastores meos et pastores tuos : fratres enim sumus.\"},{\"verse\":9,\"text\":\"Ecce universa terra coram te est : recede a me, obsecro : si ad sinistram ieris, ego dexteram tenebo : si tu dexteram elegeris, ego ad sinistram pergam.\"},{\"verse\":10,\"text\":\"Elevatis itaque Lot oculis, vidit omnem circa regionem Jordanis, quæ universa irrigabatur antequam subverteret Dominus Sodomam et Gomorrham, sicut paradisus Domini, et sicut Ægyptus venientibus in Segor.\"},{\"verse\":11,\"text\":\"Elegitque sibi Lot regionem circa Jordanem, et recessit ab oriente : divisique sunt alterutrum a fratre suo.\"},{\"verse\":12,\"text\":\"Abram habitavit in terra Chanaan ; Lot vero moratus est in oppidis, quæ erant circa Jordanem, et habitavit in Sodomis.\"},{\"verse\":13,\"text\":\"Homines autem Sodomitæ pessimi erant, et peccatores coram Domino nimis.\"},{\"verse\":14,\"text\":\"Dixitque Dominus ad Abram, postquam divisus est ab eo Lot : Leva oculos tuos et vide a loco, in quo nunc es, ad aquilonem et meridiem, ad orientem et occidentem.\"},{\"verse\":15,\"text\":\"Omnem terram, quam conspicis, tibi dabo, et semini tuo usque in sempiternum.\"},{\"verse\":16,\"text\":\"Faciamque semen tuum sicut pulverem terræ : si quis potest hominum numerare pulverem terræ, semen quoque tuum numerare poterit.\"},{\"verse\":17,\"text\":\"Surge, et perambula terram in longitudine et in latitudine sua : quia tibi daturus sum eam.\"},{\"verse\":18,\"text\":\"Movens igitur tabernaculum suum Abram, venit, et habitavit juxta convallem Mambre, quæ est in Hebron : ædificavitque ibi altare Domino.\"}],\"summary\":\"Abram and Lot part from each other. God’s promise to Abram.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":12,\"label\":\"Genesis 12\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":14,\"label\":\"Genesis 14\"}}]]\n"])</script></body></html>
