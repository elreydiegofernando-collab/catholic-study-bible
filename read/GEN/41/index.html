<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Genesis 41 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">41</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Joseph interpreteth the two dreams of Pharao: he is made ruler over all Egypt.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After two years Pharao had a dream. He thought he stood by the river,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Out of which came up seven kine, very beautiful and fat: and they fed in marshy places.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Other seven also came up out of the river, ill-favoured, and lean fleshed: and they fed on the very bank of the river, in green places:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they devoured them, whose bodies were very beautiful and well conditioned. So Pharao awoke.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He slept again, and dreamed another dream: Seven ears of corn came up upon one stalk full and fair:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then seven other ears sprung up thin and blasted,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And devoured all the beauty of the former. Pharao awaked after his rest:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when morning was come, being struck with fear, he sent to all the interpreters of Egypt, and to all the wise men: and they being called for, he told them his dream, and there was not any one that could interpret it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then at length the chief butler remembering, said: I confess my sin:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The king being angry with his servants, commanded me and the chief baker to be cast into the prison of the captain of the soldiers.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Where in one night both of us dreamed a dream foreboding things to come.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>There was there a young man a Hebrew, servant to the same captain of the soldiers: to whom we told our dreams,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And we heard what afterwards the event of the thing proved to be so. For I was restored to my office: and he was hanged upon a gibbet.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Forthwith at the king’s command Joseph was brought out of the prison, and they shaved him: and changing his apparel brought him in to him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he said to him: I have dreamed dreams, and there is no one that can expound them: Now I have heard that thou art very wise at interpreting them:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Joseph answered: Without me, God shall give Pharao a prosperous answer.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>So Pharao told what he had dreamed: Methought I stood upon the bank of the river,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And seven kine came up out of the river, exceeding beautiful and full of flesh: and they grazed on green places in a marshy pasture.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And behold, there followed these, other seven kine, so very ill-favoured and lean, that I never saw the like in the land of Egypt:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they devoured and consumed the former,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And yet gave no mark of their being full: but were as lean and ill-favoured as before. I awoke, and then fell asleep again,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And dreamed a dream: Seven ears of corn grew up upon one stalk, full and very fair.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Other seven also thin and blasted, sprung of the stalk:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they devoured the beauty of the former: I told this dream to the conjecturers, and there is no man that can expound it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Joseph answered: The king’s dream is one: God hath shewn to Pharao what he is about to do.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The seven beautiful kine, and the seven full ears, are seven years of plenty: and both contain the same meaning of the dream.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the seven lean and thin kine that came up after them, and the seven thin ears that were blasted with the burning wind, are seven years of famine to come:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Which shall be fulfilled in this order.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Behold, there shall come seven years of great plenty in the whole land of Egypt:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>After which shall follow other seven years of so great scarcity, that all the abundance before shall be forgotten: for the famine shall consume all the land,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the greatness of the scarcity shall destroy the greatness of the plenty.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And for that thou didst see the second time a dream pertaining to the same thing: it is a token of the certainty, and that the word of God cometh to pass, and is fulfilled speedily.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Now therefore let the king provide a wise and industrious man, and make him ruler over the land of Egypt:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>That he may appoint overseers over all the countries: and gather into barns the fifth part of the fruits, during the seven fruitful years,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>That shall now presently ensue: and let all the corn be laid up, under Pharao’s hands, and be reserved in the cities.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And let it be in readiness, against the famine of seven years to come, which shall oppress Egypt, and the land shall not be consumed with scarcity.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>The counsel pleased Pharao, and all his servants.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he said to them: Can we find such another man, that is full of the spirit of God?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>He said therefore to Joseph: Seeing God hath shewn thee all that thou hast said, can I find one wiser and one like unto thee?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Thou shalt be over my house, and at the commandment of thy mouth all the people shall obey: only in the kingly throne will I be above thee.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And again Pharao said to Joseph: Behold, I have appointed thee over the whole land of Egypt.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And he took his ring from his own hand, and gave it into his hand: and he put upon him a robe of silk, and put a chain of gold about his neck.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And he made him go up into his second chariot, the crier proclaiming that all should bow their knee before him, and that they should know he was made governor over the whole land of Egypt.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the king said to Joseph: I am Pharao: without thy commandment no man shall move hand or foot in all the land of Egypt.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And he turned his name, and called him in the Egyptian tongue the saviour of the world. And he gave him to wife Aseneth, the daughter of Putiphare, priest of Heliopolis. Then Joseph went out to the land of Egypt.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>(Now he was thirty years old when he stood before king Pharao), and he went round all the countries of Egypt.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And the fruitfulness of the seven years came: and the corn being bound up into sheaves, was gathered together into the barns of Egypt.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And all the abundance of grain was laid up in every city.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And there was so great abundance of wheat, that it was equal to the sand of the sea, and the plenty exceeded measure.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And before the famine came, Joseph had two sons born: whom Aseneth, the daughter of Putiphare, priest of Heliopolis, bore unto him.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And he called the name of the firstborn Manasses, saying: God hath made me to forget all my labours, and my father’s house.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And he named the second Ephraim, saying: God hath made me to grow in the land of my poverty.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Now when the seven years of plenty that had been in Egypt were passed:</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>The seven years of scarcity, which Joseph had foretold, began to come: and the famine prevailed in the whole world, but there was bread in all the land of Egypt.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And when there also they began to be famished, the people cried to Pharao, for food. And he said to them: Go to Joseph: and do all that he shall say to you.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And the famine increased daily in all the land: and Joseph opened all the barns, and sold to the Egyptians: for the famine had oppressed them also.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And all provinces came into Egypt, to buy food, and to seek some relief of their want.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post duos annos vidit Pharao somnium. Putabat se stare super fluvium,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>de quo ascendebant septem boves, pulchræ et crassæ nimis : et pascebantur in locis palustribus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Aliæ quoque septem emergebant de flumine, fœdæ confectæque macie : et pascebantur in ipsa amnis ripa in locis virentibus :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>devoraveruntque eas, quarum mira species et habitudo corporum erat. Expergefactus Pharao,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>rursum dormivit, et vidit alterum somnium : septem spicæ pullulabant in culmo uno plenæ atque formosæ :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>aliæ quoque totidem spicæ tenues, et percussæ uredine oriebantur,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>devorantes omnium priorum pulchritudinem. Evigilans Pharao post quietem,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et facto mane, pavore perterritus, misit ad omnes conjectores Ægypti, cunctosque sapientes, et accersitis narravit somnium, nec erat qui interpretaretur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tunc demum reminiscens pincernarum magister, ait : Confiteor peccatum meum :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>iratus rex servis suis, me et magistrum pistorum retrudi jussit in carcerem principis militum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ubi una nocte uterque vidimus somnium præsagum futurorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Erat ibi puer hebræus, ejusdem ducis militum famulus : cui narrantes somnia,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>audivimus quidquid postea rei probavit eventus ; ego enim redditus sum officio meo, et ille suspensus est in cruce.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Protinus ad regis imperium eductum de carcere Joseph totonderunt : ac veste mutata obtulerunt ei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cui ille ait : Vidi somnia, nec est qui edisserat : quæ audivi te sapientissime conjicere.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Respondit Joseph : Absque me Deus respondebit prospera Pharaoni.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Narravit ergo Pharao quod viderat : Putabam me stare super ripam fluminis,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et septem boves de amne conscendere, pulchras nimis, et obesis carnibus : quæ in pastu paludis virecta carpebant.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et ecce, has sequebantur aliæ septem boves, in tantum deformes et macilentæ, ut numquam tales in terra Ægypti viderim :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quæ, devoratis et consumptis prioribus,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>nullum saturitatis dedere vestigium : sed simili macie et squalore torpebant. Evigilans, rursus sopore depressus,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>vidi somnium. Septem spicæ pullulabant in culmo uno plenæ atque pulcherrimæ.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Aliæ quoque septem tenues et percussæ uredine, oriebantur e stipula :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>quæ priorum pulchritudinem devoraverunt. Narravi conjectoribus somnium, et nemo est qui edisserat.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Respondit Joseph : Somnium regis unum est : quæ facturus est Deus, ostendit Pharaoni.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Septem boves pulchræ, et septem spicæ plenæ, septem ubertatis anni sunt : eamdemque vim somnii comprehendunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Septem quoque boves tenues atque macilentæ, quæ ascenderunt post eas, et septem spicæ tenues, et vento urente percussæ, septem anni venturæ sunt famis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Qui hoc ordine complebuntur :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>ecce septem anni venient fertilitatis magnæ in universa terra Ægypti,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>quos sequentur septem anni alii tantæ sterilitatis, ut oblivioni tradatur cuncta retro abundantia : consumptura est enim fames omnem terram,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et ubertatis magnitudinem perditura est inopiæ magnitudo.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quod autem vidisti secundo ad eamdem rem pertinens somnium : firmitatis indicium est, eo quod fiat sermo Dei, et velocius impleatur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Nunc ergo provideat rex virum sapientem et industrium, et præficiat eum terræ Ægypti :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>qui constituat præpositos per cunctas regiones : et quintam partem fructuum per septem annos fertilitatis,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>qui jam nunc futuri sunt, congreget in horrea : et omne frumentum sub Pharaonis potestate condatur, serveturque in urbibus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et præparetur futuræ septem annorum fami, quæ oppressura est Ægyptum, et non consumetur terra inopia.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Placuit Pharaoni consilium et cunctis ministris ejus :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>locutusque est ad eos : Num invenire poterimus talem virum, qui spiritu Dei plenus sit ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Dixit ergo ad Joseph : Quia ostendit tibi Deus omnia quæ locutus es, numquid sapientiorem et consimilem tui invenire potero ?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Tu eris super domum meam, et ad tui oris imperium cunctus populus obediet : uno tantum regni solio te præcedam.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Dixitque rursus Pharao ad Joseph : Ecce, constitui te super universam terram Ægypti.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Tulitque annulum de manu sua, et dedit eum in manu ejus : vestivitque eum stola byssina, et collo torquem auream circumposuit.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Fecitque eum ascendere super currum suum secundum, clamante præcone, ut omnes coram eo genu flecterent, et præpositum esse scirent universæ terræ Ægypti.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Dixit quoque rex ad Joseph : Ego sum Pharao : absque tuo imperio non movebit quisquam manum aut pedem in omni terra Ægypti.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Vertitque nomen ejus, et vocavit eum, lingua ægyptiaca, Salvatorem mundi. Deditque illi uxorem Aseneth filiam Putiphare sacerdotis Heliopoleos. Egressus est itaque Joseph ad terram Ægypti</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>(triginta autem annorum erat quando stetit in conspectu regis Pharaonis), et circuivit omnes regiones Ægypti.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Venitque fertilitas septem annorum : et in manipulos redactæ segetes congregatæ sunt in horrea Ægypti.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Omnis etiam frugum abundantia in singulis urbibus condita est.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Tantaque fuit abundantia tritici, ut arenæ maris coæquaretur, et copia mensuram excederet.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Nati sunt autem Joseph filii duo antequam veniret fames : quos peperit ei Aseneth filia Putiphare sacerdotis Heliopoleos.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Vocavitque nomen primogeniti Manasses, dicens : Oblivisci me fecit Deus omnium laborum meorum, et domus patris mei.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Nomen quoque secundi appellavit Ephraim, dicens : Crescere me fecit Deus in terra paupertatis meæ.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Igitur transactis septem ubertatis annis, qui fuerant in Ægypto,</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>cœperunt venire septem anni inopiæ, quos prædixerat Joseph : et in universo orbe fames prævaluit, in cuncta autem terra Ægypti panis erat.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Qua esuriente, clamavit populus ad Pharaonem, alimenta petens. Quibus ille respondit : Ite ad Joseph : et quidquid ipse vobis dixerit, facite.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Crescebat autem quotidie fames in omni terra : aperuitque Joseph universa horrea, et vendebat Ægyptiis : nam et illos oppresserat fames.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Omnesque provinciæ veniebant in Ægyptum, ut emerent escas, et malum inopiæ temperarent.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/40/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 40</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/42/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 42< ssOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"GEN.41\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":41,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"After two years Pharao had a dream. He thought he stood by the river,\"},{\"verse\":2,\"text\":\"Out of which came up seven kine, very beautiful and fat: and they fed in marshy places.\"},{\"verse\":3,\"text\":\"Other seven also came up out of the river, ill-favoured, and lean fleshed: and they fed on the very bank of the river, in green places:\"},{\"verse\":4,\"text\":\"And they devoured them, whose bodies were very beautiful and well conditioned. So Pharao awoke.\"},{\"verse\":5,\"text\":\"He slept again, and dreamed another dream: Seven ears of corn came up upon one stalk full and fair:\"},{\"verse\":6,\"text\":\"Then seven other ears sprung up thin and blasted,\"},{\"verse\":7,\"text\":\"And devoured all the beauty of the former. Pharao awaked after his rest:\"},{\"verse\":8,\"text\":\"And when morning was come, being struck with fear, he sent to all the interpreters of Egypt, and to all the wise men: and they being called for, he told them his dream, and there was not any one that could interpret it.\"},{\"verse\":9,\"text\":\"Then at length the chief butler remembering, said: I confess my sin:\"},{\"verse\":10,\"text\":\"The king being angry with his servants, commanded me and the chief baker to be cast into the prison of the captain of the soldiers.\"},{\"verse\":11,\"text\":\"Where in one night both of us dreamed a dream foreboding things to come.\"},{\"verse\":12,\"text\":\"There was there a young man a Hebrew, servant to the same captain of the soldiers: to whom we told our dreams,\"},{\"verse\":13,\"text\":\"And we heard what afterwards the event of the thing proved to be so. For I was restored to my office: and he was hanged upon a gibbet.\"},{\"verse\":14,\"text\":\"Forthwith at the king’s command Joseph was brought out of the prison, and they shaved him: and changing his apparel brought him in to him.\"},{\"verse\":15,\"text\":\"And he said to him: I have dreamed dreams, and there is no one that can expound them: Now I have heard that thou art very wise at interpreting them:\"},{\"verse\":16,\"text\":\"Joseph answered: Without me, God shall give Pharao a prosperous answer.\"},{\"verse\":17,\"text\":\"So Pharao told what he had dreamed: Methought I stood upon the bank of the river,\"},{\"verse\":18,\"text\":\"And seven kine came up out of the river, exceeding beautiful and full of flesh: and they grazed on green places in a marshy pasture.\"},{\"verse\":19,\"text\":\"And behold, there followed these, other seven kine, so very ill-favoured and lean, that I never saw the like in the land of Egypt:\"},{\"verse\":20,\"text\":\"And they devoured and consumed the former,\"},{\"verse\":21,\"text\":\"And yet gave no mark of their being full: but were as lean and ill-favoured as before. I awoke, and then fell asleep again,\"},{\"verse\":22,\"text\":\"And dreamed a dream: Seven ears of corn grew up upon one stalk, full and very fair.\"},{\"verse\":23,\"text\":\"Other seven also thin and blasted, sprung of the stalk:\"},{\"verse\":24,\"text\":\"And they devoured the beauty of the former: I told this dream to the conjecturers, and there is no man that can expound it.\"},{\"verse\":25,\"text\":\"Joseph answered: The king’s dream is one: God hath shewn to Pharao what he is about to do.\"},{\"verse\":26,\"text\":\"The seven beautiful kine, and the seven full ears, are seven years of plenty: and both contain the same meaning of the dream.\"},{\"verse\":27,\"text\":\"And the seven lean and thin kine that came up after them, and the seven thin ears that were blasted with the burning wind, are seven years of famine to come:\"},{\"verse\":28,\"text\":\"Which shall be fulfilled in this order.\"},{\"verse\":29,\"text\":\"Behold, there shall come seven years of great plenty in the whole land of Egypt:\"},{\"verse\":30,\"text\":\"After which shall follow other seven years of so great scarcity, that all the abundance before shall be forgotten: for the famine shall consume all the land,\"},{\"verse\":31,\"text\":\"And the greatness of the scarcity shall destroy the greatness of the plenty.\"},{\"verse\":32,\"text\":\"And for that thou didst see the second time a dream pertaining to the same thing: it is a token of the certainty, and that the word of God cometh to pass, and is fulfilled speedily.\"},{\"verse\":33,\"text\":\"Now therefore let the king provide a wise and industrious man, and make him ruler over the land of Egypt:\"},{\"verse\":34,\"text\":\"That he may appoint overseers over all the countries: and gather into barns the fifth part of the fruits, during the seven fruitful years,\"},{\"verse\":35,\"text\":\"That shall now presently ensue: and let all the corn be laid up, under Pharao’s hands, and be reserved in the cities.\"},{\"verse\":36,\"text\":\"And let it be in readiness, against the famine of seven years to come, which shall oppress Egypt, and the land shall not be consumed with scarcity.\"},{\"verse\":37,\"text\":\"The counsel pleased Pharao, and all his servants.\"},{\"verse\":38,\"text\":\"And he said to them: Can we find such another man, that is full of the spirit of God?\"},{\"verse\":39,\"text\":\"He said therefore to Joseph: Seeing God hath shewn thee all that thou hast said, can I find one wiser and one like unto thee?\"},{\"verse\":40,\"text\":\"Thou shalt be over my house, and at the commandment of thy mouth all the people shall obey: only in the kingly throne will I be above thee.\"},{\"verse\":41,\"text\":\"And again Pharao said to Joseph: Behold, I have appointed thee over the whole land of Egypt.\"},{\"verse\":42,\"text\":\"And he took his ring from his own hand, and gave it into his hand: and he put upon him a robe of silk, and put a chain of gold about his neck.\"},{\"verse\":43,\"text\":\"And he made him go up into his second chariot, the crier proclaiming that all should bow their knee before him, and that they should know he was made governor over the whole land of Egypt.\"},{\"verse\":44,\"text\":\"And the king said to Joseph: I am Pharao: without thy commandment no man shall move hand or foot in all the land of Egypt.\"},{\"verse\":45,\"text\":\"And he turned his name, and called him in the Egyptian tongue the saviour of the world. And he gave him to wife Aseneth, the daughter of Putiphare, priest of Heliopolis. Then Joseph went out to the land of Egypt.\"},{\"verse\":46,\"text\":\"(Now he was thirty years old when he stood before king Pharao), and he went round all the countries of Egypt.\"},{\"verse\":47,\"text\":\"And the fruitfulness of the seven years came: and the corn being bound up into sheaves, was gathered together into the barns of Egypt.\"},{\"verse\":48,\"text\":\"And all the abundance of grain was laid up in every city.\"},{\"verse\":49,\"text\":\"And there was so great abundance of wheat, that it was equal to the sand of the sea, and the plenty exceeded measure.\"},{\"verse\":50,\"text\":\"And before the famine came, Joseph had two sons born: whom Aseneth, the daughter of Putiphare, priest of Heliopolis, bore unto him.\"},{\"verse\":51,\"text\":\"And he called the name of the firstborn Manasses, saying: God hath made me to forget all my labours, and my father’s house.\"},{\"verse\":52,\"text\":\"And he named the second Ephraim, saying: God hath made me to grow in the land of my poverty.\"},{\"verse\":53,\"text\":\"Now when the seven years of plenty that had been in Egypt were passed:\"},{\"verse\":54,\"text\":\"The seven years of scarcity, which Joseph had foretold, began to come: and the famine prevailed in the whole world, but there was bread in all the land of Egypt.\"},{\"verse\":55,\"text\":\"And when there also they began to be famished, the people cried to Pharao, for food. And he said to them: Go to Joseph: and do all that he shall say to you.\"},{\"verse\":56,\"text\":\"And the famine increased daily in all the land: and Joseph opened all the barns, and sold to the Egyptians: for the famine had oppressed them also.\"},{\"verse\":57,\"text\":\"And all provinces came into Egypt, to buy food, and to seek some relief of their want.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post duos annos vidit Pharao somnium. Putabat se stare super fluvium,\"},{\"verse\":2,\"text\":\"de quo ascendebant septem boves, pulchræ et crassæ nimis : et pascebantur in locis palustribus.\"},{\"verse\":3,\"text\":\"Aliæ quoque septem emergebant de flumine, fœdæ confectæque macie : et pascebantur in ipsa amnis ripa in locis virentibus :\"},{\"verse\":4,\"text\":\"devoraveruntque eas, quarum mira species et habitudo corporum erat. Expergefactus Pharao,\"},{\"verse\":5,\"text\":\"rursum dormivit, et vidit alterum somnium : septem spicæ pullulabant in culmo uno plenæ atque formosæ :\"},{\"verse\":6,\"text\":\"aliæ quoque totidem spicæ tenues, et percussæ uredine oriebantur,\"},{\"verse\":7,\"text\":\"devorantes omnium priorum pulchritudinem. Evigilans Pharao post quietem,\"},{\"verse\":8,\"text\":\"et facto mane, pavore perterritus, misit ad omnes conjectores Ægypti, cunctosque sapientes, et accersitis narravit somnium, nec erat qui interpretaretur.\"},{\"verse\":9,\"text\":\"Tunc demum reminiscens pincernarum magister, ait : Confiteor peccatum meum :\"},{\"verse\":10,\"text\":\"iratus rex servis suis, me et magistrum pistorum retrudi jussit in carcerem principis militum :\"},{\"verse\":11,\"text\":\"ubi una nocte uterque vidimus somnium præsagum futurorum.\"},{\"verse\":12,\"text\":\"Erat ibi puer hebræus, ejusdem ducis militum famulus : cui narrantes somnia,\"},{\"verse\":13,\"text\":\"audivimus quidquid postea rei probavit eventus ; ego enim redditus sum officio meo, et ille suspensus est in cruce.\"},{\"verse\":14,\"text\":\"Protinus ad regis imperium eductum de carcere Joseph totonderunt : ac veste mutata obtulerunt ei.\"},{\"verse\":15,\"text\":\"Cui ille ait : Vidi somnia, nec est qui edisserat : quæ audivi te sapientissime conjicere.\"},{\"verse\":16,\"text\":\"Respondit Joseph : Absque me Deus respondebit prospera Pharaoni.\"},{\"verse\":17,\"text\":\"Narravit ergo Pharao quod viderat : Putabam me stare super ripam fluminis,\"},{\"verse\":18,\"text\":\"et septem boves de amne conscendere, pulchras nimis, et obesis carnibus : quæ in pastu paludis virecta carpebant.\"},{\"verse\":19,\"text\":\"Et ecce, has sequebantur aliæ septem boves, in tantum deformes et macilentæ, ut numquam tales in terra Ægypti viderim :\"},{\"verse\":20,\"text\":\"quæ, devoratis et consumptis prioribus,\"},{\"verse\":21,\"text\":\"nullum saturitatis dedere vestigium : sed simili macie et squalore torpebant. Evigilans, rursus sopore depressus,\"},{\"verse\":22,\"text\":\"vidi somnium. Septem spicæ pullulabant in culmo uno plenæ atque pulcherrimæ.\"},{\"verse\":23,\"text\":\"Aliæ quoque septem tenues et percussæ uredine, oriebantur e stipula :\"},{\"verse\":24,\"text\":\"quæ priorum pulchritudinem devoraverunt. Narravi conjectoribus somnium, et nemo est qui edisserat.\"},{\"verse\":25,\"text\":\"Respondit Joseph : Somnium regis unum est : quæ facturus est Deus, ostendit Pharaoni.\"},{\"verse\":26,\"text\":\"Septem boves pulchræ, et septem spicæ plenæ, septem ubertatis anni sunt : eamdemque vim somnii comprehendunt.\"},{\"verse\":27,\"text\":\"Septem quoque boves tenues atque macilentæ, quæ ascenderunt post eas, et septem spicæ tenues, et vento urente percussæ, septem anni venturæ sunt famis.\"},{\"verse\":28,\"text\":\"Qui hoc ordine complebuntur :\"},{\"verse\":29,\"text\":\"ecce septem anni venient fertilitatis magnæ in universa terra Ægypti,\"},{\"verse\":30,\"text\":\"quos sequentur septem anni alii tantæ sterilitatis, ut oblivioni tradatur cuncta retro abundantia : consumptura est enim fames omnem terram,\"},{\"verse\":31,\"text\":\"et ubertatis magnitudinem perditura est inopiæ magnitudo.\"},{\"verse\":32,\"text\":\"Quod autem vidisti secundo ad eamdem rem pertinens somnium : firmitatis indicium est, eo quod fiat sermo Dei, et velocius impleatur.\"},{\"verse\":33,\"text\":\"Nunc ergo provideat rex virum sapientem et industrium, et præficiat eum terræ Ægypti :\"},{\"verse\":34,\"text\":\"qui constituat præpositos per cunctas regiones : et quintam partem fructuum per septem annos fertilitatis,\"},{\"verse\":35,\"text\":\"qui jam nunc futuri sunt, congreget in horrea : et omne frumentum sub Pharaonis potestate condatur, serveturque in urbibus.\"},{\"verse\":36,\"text\":\"Et præparetur futuræ septem annorum fami, quæ oppressura est Ægyptum, et non consumetur terra inopia.\"},{\"verse\":37,\"text\":\"Placuit Pharaoni consilium et cunctis ministris ejus :\"},{\"verse\":38,\"text\":\"locutusque est ad eos : Num invenire poterimus talem virum, qui spiritu Dei plenus sit ?\"},{\"verse\":39,\"text\":\"Dixit ergo ad Joseph : Quia ostendit tibi Deus omnia quæ locutus es, numquid sapientiorem et consimilem tui invenire potero ?\"},{\"verse\":40,\"text\":\"Tu eris super domum meam, et ad tui oris imperium cunctus populus obediet : uno tantum regni solio te præcedam.\"},{\"verse\":41,\"text\":\"Dixitque rursus Pharao ad Joseph : Ecce, constitui te super universam terram Ægypti.\"},{\"verse\":42,\"text\":\"Tulitque annulum de manu sua, et dedit eum in manu ejus : vestivitque eum stola byssina, et collo torquem auream circumposuit.\"},{\"verse\":43,\"text\":\"Fecitque eum ascendere super currum suum secundum, clamante præcone, ut omnes coram eo genu flecterent, et præpositum esse scirent universæ terræ Ægypti.\"},{\"verse\":44,\"text\":\"Dixit quoque rex ad Joseph : Ego sum Pharao : absque tuo imperio non movebit quisquam manum aut pedem in omni terra Ægypti.\"},{\"verse\":45,\"text\":\"Vertitque nomen ejus, et vocavit eum, lingua ægyptiaca, Salvatorem mundi. Deditque illi uxorem Aseneth filiam Putiphare sacerdotis Heliopoleos. Egressus est itaque Joseph ad terram Ægypti\"},{\"verse\":46,\"text\":\"(triginta autem annorum erat quando stetit in conspectu regis Pharaonis), et circuivit omnes regiones Ægypti.\"},{\"verse\":47,\"text\":\"Venitque fertilitas septem annorum : et in manipulos redactæ segetes congregatæ sunt in horrea Ægypti.\"},{\"verse\":48,\"text\":\"Omnis etiam frugum abundantia in singulis urbibus condita est.\"},{\"verse\":49,\"text\":\"Tantaque fuit abundantia tritici, ut arenæ maris coæquaretur, et copia mensuram excederet.\"},{\"verse\":50,\"text\":\"Nati sunt autem Joseph filii duo antequam veniret fames : quos peperit ei Aseneth filia Putiphare sacerdotis Heliopoleos.\"},{\"verse\":51,\"text\":\"Vocavitque nomen primogeniti Manasses, dicens : Oblivisci me fecit Deus omnium laborum meorum, et domus patris mei.\"},{\"verse\":52,\"text\":\"Nomen quoque secundi appellavit Ephraim, dicens : Crescere me fecit Deus in terra paupertatis meæ.\"},{\"verse\":53,\"text\":\"Igitur transactis septem ubertatis annis, qui fuerant in Ægypto,\"},{\"verse\":54,\"text\":\"cœperunt venire septem anni inopiæ, quos prædixerat Joseph : et in universo orbe fames prævaluit, in cuncta autem terra Ægypti panis erat.\"},{\"verse\":55,\"text\":\"Qua esuriente, clamavit populus ad Pharaonem, alimenta petens. Quibus ille respondit : Ite ad Joseph : et quidquid ipse vobis dixerit, facite.\"},{\"verse\":56,\"text\":\"Crescebat autem quotidie fames in omni terra : aperuitque Joseph universa horrea, et vendebat Ægyptiis : nam et illos oppresserat fames.\"},{\"verse\":57,\"text\":\"Omnesque provinciæ veniebant in Ægyptum, ut emerent escas, et malum inopiæ temperarent.\"}],\"summary\":\"Joseph interpreteth the two dreams of Pharao: he is made ruler over all Egypt.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":40,\"label\":\"Genesis 40\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":42,\"label\":\"Genesis 42\"}}]]\n"])</script></body></html>
