-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">38</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The sons of Juda: the death of Her and Onan: the birth of Phares and Zara.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>At that time Juda went down from his brethren, and turned in to a certain Odollamite, named Hiras.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he saw there the daughter of a man of Chanaan, called Sue: and taking her to wife, he went in unto her.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And she conceived, and bore a son, and called his name Her.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And conceiving again, she bore a son, and called him Onan.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>She bore also a third: whom she called Sela. After whose birth, she ceased to bear any more.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Juda took a wife for Her, his first born, whose name was Thamar.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Her, the first born of Juda, was wicked in the sight of the Lord: and was slain by him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Juda, therefore, said to Onan his son: Go in to thy brother’s wife and marry her, that thou mayst raise seed to thy brother.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He knowing that the children should not be his, when he went in to his brother’s wife, he spilled his seed upon the ground, lest children should be born in his brother’s name.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And therefore the Lord slew him, because he did a detestable thing:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Wherefore Juda said to Thamar his daughter-in-law: Remain a widow in thy father’s house, till Sela my son grow up: for he was afraid lest he also might die, as his brethren did. She went her way, and dwelt in her father’s house.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And after many days were past: the daughter of Sue the wife of Juda died: and when he had taken comfort after his mourning, he went up to Thamnas, to the shearers of his sheep, he and Hiras the Odollamite, the shepherd of his flock.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And it was told Thamar that her father-in-law was come up to Thamnas to shear his sheep.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And she put off the garments of her widowhood, and took a veil: and changing her dress, sat in the cross way, that leadeth to Thamnas: because Sela was grown up, and she had not been married to him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>When Juda saw her, he thought she was a harlot: for she had covered her face, lest she should be known.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And going to her, he said: Suffer me to lie with thee: for he knew her not to be his daughter-in-law. And she answered: What wilt thou give me to enjoy my company?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He said: I will send thee a kid out of the flock. And when she said again: I will suffer what thou wilt, if thou give me a pledge, till thou send what thou promisest.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Juda said: What wilt thou have for a pledge? She answered: Thy ring and bracelet, and the staff which thou holdest in thy hand. The woman therefore at one copulation conceived.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And she arose and went her way: and putting off the apparel which she had taken, put on the garments of her widowhood.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Juda sent a kid by his shepherd, the Odollamite, that he might receive the pledge again, which he had given to the woman: but he, not finding her,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Asked the men of that place: Where is the woman that sat in the cross way? And when they all made answer: There was no harlot in this place,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He returned to Juda, and said to him: I have not found her; moreover, the men of that place said to me, that there never sat a harlot there.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Juda said: Let her take it to herself, surely she cannot charge us with a lie, I sent the kid which I promised: and thou didst not find her.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And behold, after three months, they told Juda, saying: Thamar, thy daughter-in-law, hath played the harlot, and she appeareth to have a big belly. And Juda said: Bring her out that she may be burnt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But when she was led to execution, she sent to her father in law, saying: By the man, to whom these things belong, I am with child. See whose ring, and bracelet, and staff this is.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But he acknowledging the gifts, said: She is juster than I: because I did not give her to Sela, my son. However he knew her no more.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And when she was ready to be brought to bed, there appeared twins in her womb: and in the very delivery of the infants, one put forth a hand, whereon the midwife tied a scarlet thread, saying:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>This shall come forth the first.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But he drawing back his hand, the other came forth: and the woman said: Why is the partition divided for thee? and therefore called his name Phares.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Afterwards his brother came out, on whose hand was the scarlet thread: and she called his name Zara.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Eodem tempore, descendens Judas a fratribus suis, divertit ad virum Odollamitem, nomine Hiram.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Viditque ibi filiam hominis Chananæi, vocabulo Sue : et accepta uxore, ingressus est ad eam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quæ concepit, et peperit filium, et vocavit nomen ejus Her.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Rursumque concepto fœtu, natum filium vocavit Onan.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Tertium quoque peperit : quem appellavit Sela ; quo nato, parere ultra cessavit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dedit autem Judas uxorem primogenito suo Her, nomine Thamar.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fuit quoque Her primogenitus Judæ nequam in conspectu Domini : et ab eo occisus est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dixit ergo Judas ad Onan filium suum : Ingredere uxorem fratris tui, et sociare illi, ut suscites semen fratri tuo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ille sciens non sibi nasci filios, introiens ad uxorem fratris sui, semen fundebat in terram, ne liberi fratris nomine nascerentur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et idcirco percussit eum Dominus, quod rem detestabilem faceret.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quam ob rem dixit Judas Thamar nurui suæ : Esto vidua in domo patris tui, donec crescat Sela filius meus : timebat enim ne et ipse moreretur, sicut fratres ejus. Quæ abiit, et habitavit in domo patris sui.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Evolutis autem multis diebus, mortua est filia Sue uxor Judæ : qui, post luctum consolatione suscepta, ascendebat ad tonsores ovium suarum, ipse et Hiras opilio gregis Odollamites, in Thamnas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nuntiatumque est Thamar quod socer illius ascenderet in Thamnas ad tondendas oves.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quæ, depositis viduitatis vestibus, assumpsit theristrum : et mutato habitu, sedit in bivio itineris, quod ducit Thamnam : eo quod crevisset Sela, et non eum accepisset maritum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quam cum vidisset Judas, suspicatus est esse meretricem : operuerat enim vultum suum, ne agnosceretur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ingrediensque ad eam, ait : Dimitte me ut coëam tecum : nesciebat enim quod nurus sua esset. Qua respondente : Quid dabis mihi ut fruaris concubitu meo ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>dixit : Mittam tibi hædum de gregibus. Rursumque illa dicente : Patiar quod vis, si dederis mihi arrhabonem, donec mittas quod polliceris.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ait Judas : Quid tibi vis pro arrhabone dari ? Respondit : Annulum tuum, et armillam, et baculum quem manu tenes. Ad unum igitur coitum mulier concepit,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et surgens abiit : depositoque habitu quem sumpserat, induta est viduitatis vestibus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Misit autem Judas hædum per pastorem suum Odollamitem, ut reciperet pignus quod dederat mulieri : qui cum non invenisset eam,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>interrogavit homines loci illius : Ubi est mulier quæ sedebat in bivio ? Respondentibus cunctis : Non fuit in loco ista meretrix.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Reversus est ad Judam, et dixit ei : Non inveni eam : sed et homines loci illius dixerunt mihi, numquam sedisse ibi scortum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ait Judas : Habeat sibi, certe mendacii arguere nos non potest, ego misi hædum quem promiseram : et tu non invenisti eam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ecce autem post tres menses nuntiaverunt Judæ, dicentes : Fornicata est Thamar nurus tua, et videtur uterus illius intumescere. Dixitque Judas : Producite eam ut comburatur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quæ cum duceretur ad pœnam, misit ad socerum suum, dicens : De viro, cujus hæc sunt, concepi : cognosce cujus sit annulus, et armilla, et baculus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui, agnitis muneribus, ait : Justior me est : quia non tradidi eam Sela filio meo. Attamen ultra non cognovit eam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Instante autem partu, apparuerunt gemini in utero : atque in ipsa effusione infantium unus protulit manum, in qua obstetrix ligavit coccinum, dicens :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Iste egredietur prior.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Illo vero retrahente manum, egressus est alter : dixitque mulier : Quare divisa est propter te maceria ? et ob hanc causam, vocavit nomen ejus Phares.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Postea egressus est frater ejus, in cujus manu erat coccinum : quem appellavit Zara.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/37/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 37</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-ston Sela. After whose birth, she ceased to bear any more.\"},{\"verse\":6,\"text\":\"And Juda took a wife for Her, his first born, whose name was Thamar.\"},{\"verse\":7,\"text\":\"And Her, the first born of Juda, was wicked in the sight of the Lord: and was slain by him.\"},{\"verse\":8,\"text\":\"Juda, therefore, said to Onan his son: Go in to thy brother’s wife and marry her, that thou mayst raise seed to thy brother.\"},{\"verse\":9,\"text\":\"He knowing that the children should not be his, when he went in to his brother’s wife, he spilled his seed upon the ground, lest children should be born in his brother’s name.\"},{\"verse\":10,\"text\":\"And therefore the Lord slew him, because he did a detestable thing:\"},{\"verse\":11,\"text\":\"Wherefore Juda said to Thamar his daughter-in-law: Remain a widow in thy father’s house, till Sela my son grow up: for he was afraid lest he also might die, as his brethren did. She went her way, and dwelt in her father’s house.\"},{\"verse\":12,\"text\":\"And after many days were past: the daughter of Sue the wife of Juda died: and when he had taken comfort after his mourning, he went up to Thamnas, to the shearers of his sheep, he and Hiras the Odollamite, the shepherd of his flock.\"},{\"verse\":13,\"text\":\"And it was told Thamar that her father-in-law was come up to Thamnas to shear his sheep.\"},{\"verse\":14,\"text\":\"And she put off the garments of her widowhood, and took a veil: and changing her dress, sat in the cross way, that leadeth to Thamnas: because Sela was grown up, and she had not been married to him.\"},{\"verse\":15,\"text\":\"When Juda saw her, he thought she was a harlot: for she had covered her face, lest she should be known.\"},{\"verse\":16,\"text\":\"And going to her, he said: Suffer me to lie with thee: for he knew her not to be his daughter-in-law. And she answered: What wilt thou give me to enjoy my company?\"},{\"verse\":17,\"text\":\"He said: I will send thee a kid out of the flock. And when she said again: I will suffer what thou wilt, if thou give me a pledge, till thou send what thou promisest.\"},{\"verse\":18,\"text\":\"Juda said: What wilt thou have for a pledge? She answered: Thy ring and bracelet, and the staff which thou holdest in thy hand. The woman therefore at one copulation conceived.\"},{\"verse\":19,\"text\":\"And she arose and went her way: and putting off the apparel which she had taken, put on the garments of her widowhood.\"},{\"verse\":20,\"text\":\"And Juda sent a kid by his shepherd, the Odollamite, that he might receive the pledge again, which he had given to the woman: but he, not finding her,\"},{\"verse\":21,\"text\":\"Asked the men of that place: Where is the woman that sat in the cross way? And when they all made answer: There was no harlot in this place,\"},{\"verse\":22,\"text\":\"He returned to Juda, and said to him: I have not found her; moreover, the men of that place said to me, that there never sat a harlot there.\"},{\"verse\":23,\"text\":\"Juda said: Let her take it to herself, surely she cannot charge us with a lie, I sent the kid which I promised: and thou didst not find her.\"},{\"verse\":24,\"text\":\"And behold, after three months, they told Juda, saying: Thamar, thy daughter-in-law, hath played the harlot, and she appeareth to have a big belly. And Juda said: Bring her out that she may be burnt.\"},{\"verse\":25,\"text\":\"But when she was led to execution, she sent to her father in law, saying: By the man, to whom these things belong, I am with child. See whose ring, and bracelet, and staff this is.\"},{\"verse\":26,\"text\":\"But he acknowledging the gifts, said: She is juster than I: because I did not give her to Sela, my son. However he knew her no more.\"},{\"verse\":27,\"text\":\"And when she was ready to be brought to bed, there appeared twins in her womb: and in the very delivery of the infants, one put forth a hand, whereon the midwife tied a scarlet thread, saying:\"},{\"verse\":28,\"text\":\"This shall come forth the first.\"},{\"verse\":29,\"text\":\"But he drawing back his hand, the other came forth: and the woman said: Why is the partition divided for thee? and therefore called his name Phares.\"},{\"verse\":30,\"text\":\"Afterwards his brother came out, on whose hand was the scarlet thread: and she called his name Zara.\"}],\"vul\":[{\"verse\":1,\"text\":\"Eodem tempore, descendens Judas a fratribus suis, divertit ad virum Odollamitem, nomine Hiram.\"},{\"verse\":2,\"text\":\"Viditque ibi filiam hominis Chananæi, vocabulo Sue : et accepta uxore, ingressus est ad eam.\"},{\"verse\":3,\"text\":\"Quæ concepit, et peperit filium, et vocavit nomen ejus Her.\"},{\"verse\":4,\"text\":\"Rursumque concepto fœtu, natum filium vocavit Onan.\"},{\"verse\":5,\"text\":\"Tertium quoque peperit : quem appellavit Sela ; quo nato, parere ultra cessavit.\"},{\"verse\":6,\"text\":\"Dedit autem Judas uxorem primogenito suo Her, nomine Thamar.\"},{\"verse\":7,\"text\":\"Fuit quoque Her primogenitus Judæ nequam in conspectu Domini : et ab eo occisus est.\"},{\"verse\":8,\"text\":\"Dixit ergo Judas ad Onan filium suum : Ingredere uxorem fratris tui, et sociare illi, ut suscites semen fratri tuo.\"},{\"verse\":9,\"text\":\"Ille sciens non sibi nasci filios, introiens ad uxorem fratris sui, semen fundebat in terram, ne liberi fratris nomine nascerentur.\"},{\"verse\":10,\"text\":\"Et idcirco percussit eum Dominus, quod rem detestabilem faceret.\"},{\"verse\":11,\"text\":\"Quam ob rem dixit Judas Thamar nurui suæ : Esto vidua in domo patris tui, donec crescat Sela filius meus : timebat enim ne et ipse moreretur, sicut fratres ejus. Quæ abiit, et habitavit in domo patris sui.\"},{\"verse\":12,\"text\":\"Evolutis autem multis diebus, mortua est filia Sue uxor Judæ : qui, post luctum consolatione suscepta, ascendebat ad tonsores ovium suarum, ipse et Hiras opilio gregis Odollamites, in Thamnas.\"},{\"verse\":13,\"text\":\"Nuntiatumque est Thamar quod socer illius ascenderet in Thamnas ad tondendas oves.\"},{\"verse\":14,\"text\":\"Quæ, depositis viduitatis vestibus, assumpsit theristrum : et mutato habitu, sedit in bivio itineris, quod ducit Thamnam : eo quod crevisset Sela, et non eum accepisset maritum.\"},{\"verse\":15,\"text\":\"Quam cum vidisset Judas, suspicatus est esse meretricem : operuerat enim vultum suum, ne agnosceretur.\"},{\"verse\":16,\"text\":\"Ingrediensque ad eam, ait : Dimitte me ut coëam tecum : nesciebat enim quod nurus sua esset. Qua respondente : Quid dabis mihi ut fruaris concubitu meo ?\"},{\"verse\":17,\"text\":\"dixit : Mittam tibi hædum de gregibus. Rursumque illa dicente : Patiar quod vis, si dederis mihi arrhabonem, donec mittas quod polliceris.\"},{\"verse\":18,\"text\":\"Ait Judas : Quid tibi vis pro arrhabone dari ? Respondit : Annulum tuum, et armillam, et baculum quem manu tenes. Ad unum igitur coitum mulier concepit,\"},{\"verse\":19,\"text\":\"et surgens abiit : depositoque habitu quem sumpserat, induta est viduitatis vestibus.\"},{\"verse\":20,\"text\":\"Misit autem Judas hædum per pastorem suum Odollamitem, ut reciperet pignus quod dederat mulieri : qui cum non invenisset eam,\"},{\"verse\":21,\"text\":\"interrogavit homines loci illius : Ubi est mulier quæ sedebat in bivio ? Respondentibus cunctis : Non fuit in loco ista meretrix.\"},{\"verse\":22,\"text\":\"Reversus est ad Judam, et dixit ei : Non inveni eam : sed et homines loci illius dixerunt mihi, numquam sedisse ibi scortum.\"},{\"verse\":23,\"text\":\"Ait Judas : Habeat sibi, certe mendacii arguere nos non potest, ego misi hædum quem promiseram : et tu non invenisti eam.\"},{\"verse\":24,\"text\":\"Ecce autem post tres menses nuntiaverunt Judæ, dicentes : Fornicata est Thamar nurus tua, et videtur uterus illius intumescere. Dixitque Judas : Producite eam ut comburatur.\"},{\"verse\":25,\"text\":\"Quæ cum duceretur ad pœnam, misit ad socerum suum, dicens : De viro, cujus hæc sunt, concepi : cognosce cujus sit annulus, et armilla, et baculus.\"},{\"verse\":26,\"text\":\"Qui, agnitis muneribus, ait : Justior me est : quia non tradidi eam Sela filio meo. Attamen ultra non cognovit eam.\"},{\"verse\":27,\"text\":\"Instante autem partu, apparuerunt gemini in utero : atque in ipsa effusione infantium unus protulit manum, in qua obstetrix ligavit coccinum, dicens :\"},{\"verse\":28,\"text\":\"Iste egredietur prior.\"},{\"verse\":29,\"text\":\"Illo vero retrahente manum, egressus est alter : dixitque mulier : Quare divisa est propter te maceria ? et ob hanc causam, vocavit nomen ejus Phares.\"},{\"verse\":30,\"text\":\"Postea egressus est frater ejus, in cujus manu erat coccinum : quem appellavit Zara.\"}],\"summary\":\"The sons of Juda: the death of Her and Onan: the birth of Phares and Zara.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":37,\"label\":\"Genesis 37\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":39,\"label\":\"Genesis 39\"}}]]\n"])</script></body></html>
