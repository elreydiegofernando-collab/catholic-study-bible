m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">32</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob’s vision of angels; his message and presents to Esau; his wrestling with an angel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Jacob also went on the journey he had begun: and the angels of God met him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when he saw them, he said: These are the camps of God, and he called the name of that place Mahanaim, that is, Camps.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he sent messengers before him to Esau, his brother, to the land of Seir, to the country of Edom:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he commanded them, saying: Thus shall ye speak to my lord Esau: Thus saith thy brother Jacob: I have sojourned with Laban, and have been with him until this day:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I have oxen, and asses, and sheep, and menservants, and womenservants: and now I send a message to my lord, that I may find favour in thy sight.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And the messengers returned to Jacob, saying: We came to Esau, thy brother, and behold he cometh with speed to meet thee with four hundred men.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then Jacob was greatly afraid; and in his fear divided the people that was with him, and the flocks, and the sheep, and the oxen, and the camels, into two companies,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Saying: If Esau come to one company, and destroy it, the other company that is left, shall escape.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Jacob said: O God of my father Abraham, and God of my father Isaac: O Lord who saidst to me, Return to thy land, and to the place of thy birth, and I will do well for thee.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I am not worthy of the least of all thy mercies, and of thy truth which thou hast fulfilled to thy servant. With my staff I passed over this Jordan; and now I return with two companies.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Deliver me from the hand of my brother Esau, for I am greatly afraid of him; lest perhaps he come, and kill the mother with the children.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou didst say, that thou wouldst do well by me, and multiply my seed like the sand of the sea, which cannot be numbered for multitude.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when he had slept there that night, he set apart, of the things which he had, presents for his brother Esau,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Two hundred she-goats, twenty he-goats, two hundred ewes, and twenty rams,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thirty milch camels with their colts, forty kine, and twenty bulls, twenty she-asses, and ten of their foals.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he sent them by the hands of his servants, every drove by itself, and he said to his servants: Go before me, and let there be a space between drove and drove.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he commanded the first, saying: If thou meet my brother Esau, and he ask thee: Whose art thou? or whither goest thou? or whose are these before thee?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thou shalt answer: Thy servant Jacob’s: he hath sent them as a present to my lord Esau; and he cometh after us.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In like manner he commanded the second, and the third, and all that followed the droves, saying: Speak ye the same words to Esau, when ye find him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And ye shall add: Thy servant Jacob himself also followeth after us; for he said: I will appease him with the presents that go before, and afterwards I will see him, perhaps he will be gracious to me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>So the presents went before him, but himself lodged that night in the camp.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And rising early, he took his two wives and his two handmaids, with his eleven sons, and passed over the ford of Jaboc.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And when all things were brought over that belonged to him,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He remained alone; and behold, a man wrestled with him till morning.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And when he saw that he could not overcome him, he touched the sinew of his thigh, and forthwith it shrank.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he said to him: Let me go, for it is break of day. He answered: I will not let thee go, except thou bless me.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he said: What is thy name? He answered: Jacob.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But he said: Thy name shall not be called Jacob, but Israel; for if thou hast been strong against God, how much more shalt thou prevail against men?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Jacob asked him: Tell me by what name art thou called? He answered: Why dost thou ask my name? And he blessed him in the same place.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Jacob called the name of the place Phanuel, saying: I have seen God face to face, and my soul has been saved.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And immediately the sun rose upon him, after he was past Phanuel; but he halted on his foot.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Therefore the children of Israel, unto this day, eat not the sinew, that shrank in Jacob’s thigh: because he touched the sinew of his thigh and it shrank.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Jacob quoque abiit itinere quo cœperat : fueruntque ei obviam angeli Dei.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quos cum vidisset, ait : Castra Dei sunt hæc : et appellavit nomen loci illius Mahanaim, id est, Castra.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Misit autem et nuntios ante se ad Esau fratrem suum in terram Seir, in regionem Edom :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>præcepitque eis, dicens : Sic loquimini domino meo Esau : Hæc dicit frater tuus Jacob : Apud Laban peregrinatus sum, et fui usque in præsentem diem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Habeo boves, et asinos, et oves, et servos, et ancillas : mittoque nunc legationem ad dominum meum, ut inveniam gratiam in conspectu tuo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Reversique sunt nuntii ad Jacob, dicentes : Venimus ad Esau fratrem tuum, et ecce properat tibi in occursum cum quadringentis viris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Timuit Jacob valde : et perterritus divisit populum qui secum erat, greges quoque et oves, et boves, et camelos, in duas turmas,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>dicens : Si venerit Esau ad unam turmam, et percusserit eam, alia turma, quæ relicta est, salvabitur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixitque Jacob : Deus patris mei Abraham, et Deus patris mei Isaac : Domine qui dixisti mihi : Revertere in terram tuam, et in locum nativitatis tuæ, et benefaciam tibi :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>minor sum cunctis miserationibus tuis, et veritate tua quam explevisti servo tuo. In baculo meo transivi Jordanem istum : et nunc cum duabus turmis regredior.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Erue me de manu fratris mei Esau, quia valde eum timeo : ne forte veniens percutiat matrem cum filiis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Tu locutus es quod benefaceres mihi, et dilatares semen meum sicut arenam maris, quæ præ multitudine numerari non potest.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cumque dormisset ibi nocte illa, separavit de his quæ habebat, munera Esau fratri suo,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>capras ducentas, hircos viginti, oves ducentas, et arietes viginti,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>camelos fœtas cum pullis suis triginta, vaccas quadraginta, et tauros viginti, asinas viginti et pullos earum decem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et misit per manus servorum suorum singulos seorsum greges, dixitque pueris suis : Antecedite me, et sit spatium inter gregem et gregem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et præcepit priori, dicens : Si obvium habueris fratrem meum Esau, et interrogaverit te : Cujus es ? aut, Quo vadis ? aut, Cujus sunt ista quæ sequeris ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>respondebis : Servi tui Jacob, munera misit domino meo Esau, ipse quoque post nos venit.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Similiter dedit mandata secundo, et tertio, et cunctis qui sequebantur greges, dicens : Iisdem verbis loquimini ad Esau cum inveneritis eum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et addetis : Ipse quoque servus tuus Jacob iter nostrum insequitur. Dixit enim : Placabo illum muneribus quæ præcedunt, et postea videbo illum : forsitan propitiabitur mihi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Præcesserunt itaque munera ante eum, ipse vero mansit nocte illa in castris.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cumque mature surrexisset, tulit duas uxores suas, et totidem famulas cum undecim filiis, et transivit vadum Jaboc.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Traductisque omnibus quæ ad se pertinebant,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>mansit solus : et ecce vir luctabatur cum eo usque mane.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui cum videret quod eum superare non posset, tetigit nervum femoris ejus, et statim emarcuit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dixitque ad eum : Dimitte me : jam enim ascendit aurora. Respondit : Non dimittam te, nisi benedixeris mihi.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ait ergo : Quod nomen est tibi ? Respondit : Jacob.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>At ille : Nequaquam, inquit, Jacob appellabitur nomen tuum, sed Israël : quoniam si contra Deum fortis fuisti, quanto magis contra homines prævalebis ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Interrogavit eum Jacob : Dic mihi, quo appellaris nomine ? Respondit : Cur quæris nomen meum ? Et benedixit ei in eodem loco.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Vocavitque Jacob nomen loci illius Phanuel, dicens : Vidi Deum facie ad faciem, et salva facta est anima mea.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ortusque est ei statim sol, postquam transgressus est Phanuel : ipse vero claudicabat pede.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quam ob causam non comedunt nervum filii Israël, qui emarcuit in femore Jacob, usque in præsentem diem : eo quod tetigerit nervum femoris ejus, et obstupuerit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/31/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span d with Laban, and have been with him until this day:\"},{\"verse\":5,\"text\":\"I have oxen, and asses, and sheep, and menservants, and womenservants: and now I send a message to my lord, that I may find favour in thy sight.\"},{\"verse\":6,\"text\":\"And the messengers returned to Jacob, saying: We came to Esau, thy brother, and behold he cometh with speed to meet thee with four hundred men.\"},{\"verse\":7,\"text\":\"Then Jacob was greatly afraid; and in his fear divided the people that was with him, and the flocks, and the sheep, and the oxen, and the camels, into two companies,\"},{\"verse\":8,\"text\":\"Saying: If Esau come to one company, and destroy it, the other company that is left, shall escape.\"},{\"verse\":9,\"text\":\"And Jacob said: O God of my father Abraham, and God of my father Isaac: O Lord who saidst to me, Return to thy land, and to the place of thy birth, and I will do well for thee.\"},{\"verse\":10,\"text\":\"I am not worthy of the least of all thy mercies, and of thy truth which thou hast fulfilled to thy servant. With my staff I passed over this Jordan; and now I return with two companies.\"},{\"verse\":11,\"text\":\"Deliver me from the hand of my brother Esau, for I am greatly afraid of him; lest perhaps he come, and kill the mother with the children.\"},{\"verse\":12,\"text\":\"Thou didst say, that thou wouldst do well by me, and multiply my seed like the sand of the sea, which cannot be numbered for multitude.\"},{\"verse\":13,\"text\":\"And when he had slept there that night, he set apart, of the things which he had, presents for his brother Esau,\"},{\"verse\":14,\"text\":\"Two hundred she-goats, twenty he-goats, two hundred ewes, and twenty rams,\"},{\"verse\":15,\"text\":\"Thirty milch camels with their colts, forty kine, and twenty bulls, twenty she-asses, and ten of their foals.\"},{\"verse\":16,\"text\":\"And he sent them by the hands of his servants, every drove by itself, and he said to his servants: Go before me, and let there be a space between drove and drove.\"},{\"verse\":17,\"text\":\"And he commanded the first, saying: If thou meet my brother Esau, and he ask thee: Whose art thou? or whither goest thou? or whose are these before thee?\"},{\"verse\":18,\"text\":\"Thou shalt answer: Thy servant Jacob’s: he hath sent them as a present to my lord Esau; and he cometh after us.\"},{\"verse\":19,\"text\":\"In like manner he commanded the second, and the third, and all that followed the droves, saying: Speak ye the same words to Esau, when ye find him.\"},{\"verse\":20,\"text\":\"And ye shall add: Thy servant Jacob himself also followeth after us; for he said: I will appease him with the presents that go before, and afterwards I will see him, perhaps he will be gracious to me.\"},{\"verse\":21,\"text\":\"So the presents went before him, but himself lodged that night in the camp.\"},{\"verse\":22,\"text\":\"And rising early, he took his two wives and his two handmaids, with his eleven sons, and passed over the ford of Jaboc.\"},{\"verse\":23,\"text\":\"And when all things were brought over that belonged to him,\"},{\"verse\":24,\"text\":\"He remained alone; and behold, a man wrestled with him till morning.\"},{\"verse\":25,\"text\":\"And when he saw that he could not overcome him, he touched the sinew of his thigh, and forthwith it shrank.\"},{\"verse\":26,\"text\":\"And he said to him: Let me go, for it is break of day. He answered: I will not let thee go, except thou bless me.\"},{\"verse\":27,\"text\":\"And he said: What is thy name? He answered: Jacob.\"},{\"verse\":28,\"text\":\"But he said: Thy name shall not be called Jacob, but Israel; for if thou hast been strong against God, how much more shalt thou prevail against men?\"},{\"verse\":29,\"text\":\"Jacob asked him: Tell me by what name art thou called? He answered: Why dost thou ask my name? And he blessed him in the same place.\"},{\"verse\":30,\"text\":\"And Jacob called the name of the place Phanuel, saying: I have seen God face to face, and my soul has been saved.\"},{\"verse\":31,\"text\":\"And immediately the sun rose upon him, after he was past Phanuel; but he halted on his foot.\"},{\"verse\":32,\"text\":\"Therefore the children of Israel, unto this day, eat not the sinew, that shrank in Jacob’s thigh: because he touched the sinew of his thigh and it shrank.\"}],\"vul\":[{\"verse\":1,\"text\":\"Jacob quoque abiit itinere quo cœperat : fueruntque ei obviam angeli Dei.\"},{\"verse\":2,\"text\":\"Quos cum vidisset, ait : Castra Dei sunt hæc : et appellavit nomen loci illius Mahanaim, id est, Castra.\"},{\"verse\":3,\"text\":\"Misit autem et nuntios ante se ad Esau fratrem suum in terram Seir, in regionem Edom :\"},{\"verse\":4,\"text\":\"præcepitque eis, dicens : Sic loquimini domino meo Esau : Hæc dicit frater tuus Jacob : Apud Laban peregrinatus sum, et fui usque in præsentem diem.\"},{\"verse\":5,\"text\":\"Habeo boves, et asinos, et oves, et servos, et ancillas : mittoque nunc legationem ad dominum meum, ut inveniam gratiam in conspectu tuo.\"},{\"verse\":6,\"text\":\"Reversique sunt nuntii ad Jacob, dicentes : Venimus ad Esau fratrem tuum, et ecce properat tibi in occursum cum quadringentis viris.\"},{\"verse\":7,\"text\":\"Timuit Jacob valde : et perterritus divisit populum qui secum erat, greges quoque et oves, et boves, et camelos, in duas turmas,\"},{\"verse\":8,\"text\":\"dicens : Si venerit Esau ad unam turmam, et percusserit eam, alia turma, quæ relicta est, salvabitur.\"},{\"verse\":9,\"text\":\"Dixitque Jacob : Deus patris mei Abraham, et Deus patris mei Isaac : Domine qui dixisti mihi : Revertere in terram tuam, et in locum nativitatis tuæ, et benefaciam tibi :\"},{\"verse\":10,\"text\":\"minor sum cunctis miserationibus tuis, et veritate tua quam explevisti servo tuo. In baculo meo transivi Jordanem istum : et nunc cum duabus turmis regredior.\"},{\"verse\":11,\"text\":\"Erue me de manu fratris mei Esau, quia valde eum timeo : ne forte veniens percutiat matrem cum filiis.\"},{\"verse\":12,\"text\":\"Tu locutus es quod benefaceres mihi, et dilatares semen meum sicut arenam maris, quæ præ multitudine numerari non potest.\"},{\"verse\":13,\"text\":\"Cumque dormisset ibi nocte illa, separavit de his quæ habebat, munera Esau fratri suo,\"},{\"verse\":14,\"text\":\"capras ducentas, hircos viginti, oves ducentas, et arietes viginti,\"},{\"verse\":15,\"text\":\"camelos fœtas cum pullis suis triginta, vaccas quadraginta, et tauros viginti, asinas viginti et pullos earum decem.\"},{\"verse\":16,\"text\":\"Et misit per manus servorum suorum singulos seorsum greges, dixitque pueris suis : Antecedite me, et sit spatium inter gregem et gregem.\"},{\"verse\":17,\"text\":\"Et præcepit priori, dicens : Si obvium habueris fratrem meum Esau, et interrogaverit te : Cujus es ? aut, Quo vadis ? aut, Cujus sunt ista quæ sequeris ?\"},{\"verse\":18,\"text\":\"respondebis : Servi tui Jacob, munera misit domino meo Esau, ipse quoque post nos venit.\"},{\"verse\":19,\"text\":\"Similiter dedit mandata secundo, et tertio, et cunctis qui sequebantur greges, dicens : Iisdem verbis loquimini ad Esau cum inveneritis eum.\"},{\"verse\":20,\"text\":\"Et addetis : Ipse quoque servus tuus Jacob iter nostrum insequitur. Dixit enim : Placabo illum muneribus quæ præcedunt, et postea videbo illum : forsitan propitiabitur mihi.\"},{\"verse\":21,\"text\":\"Præcesserunt itaque munera ante eum, ipse vero mansit nocte illa in castris.\"},{\"verse\":22,\"text\":\"Cumque mature surrexisset, tulit duas uxores suas, et totidem famulas cum undecim filiis, et transivit vadum Jaboc.\"},{\"verse\":23,\"text\":\"Traductisque omnibus quæ ad se pertinebant,\"},{\"verse\":24,\"text\":\"mansit solus : et ecce vir luctabatur cum eo usque mane.\"},{\"verse\":25,\"text\":\"Qui cum videret quod eum superare non posset, tetigit nervum femoris ejus, et statim emarcuit.\"},{\"verse\":26,\"text\":\"Dixitque ad eum : Dimitte me : jam enim ascendit aurora. Respondit : Non dimittam te, nisi benedixeris mihi.\"},{\"verse\":27,\"text\":\"Ait ergo : Quod nomen est tibi ? Respondit : Jacob.\"},{\"verse\":28,\"text\":\"At ille : Nequaquam, inquit, Jacob appellabitur nomen tuum, sed Israël : quoniam si contra Deum fortis fuisti, quanto magis contra homines prævalebis ?\"},{\"verse\":29,\"text\":\"Interrogavit eum Jacob : Dic mihi, quo appellaris nomine ? Respondit : Cur quæris nomen meum ? Et benedixit ei in eodem loco.\"},{\"verse\":30,\"text\":\"Vocavitque Jacob nomen loci illius Phanuel, dicens : Vidi Deum facie ad faciem, et salva facta est anima mea.\"},{\"verse\":31,\"text\":\"Ortusque est ei statim sol, postquam transgressus est Phanuel : ipse vero claudicabat pede.\"},{\"verse\":32,\"text\":\"Quam ob causam non comedunt nervum filii Israël, qui emarcuit in femore Jacob, usque in præsentem diem : eo quod tetigerit nervum femoris ejus, et obstupuerit.\"}],\"summary\":\"Jacob’s vision of angels; his message and presents to Esau; his wrestling with an angel.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":31,\"label\":\"Genesis 31\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":33,\"label\":\"Genesis 33\"}}]]\n"])</script></body></html>
