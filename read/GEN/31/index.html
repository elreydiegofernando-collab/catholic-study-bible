<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Genesis 31 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">31</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob’s departure: he is pursued and overtaken by Laban. They make a covenant.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But after that he had heard the words of the sons of Laban, saying: Jacob hath taken away all that was our father’s, and being enriched by his substance is become great.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And perceiving also, that Laban’s countenance was not towards him as yesterday and the other day.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Especially the Lord saying to him: Return into the land of thy fathers and to thy kindred, and I will be with thee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He sent, and called Rachel and Lia into the field, where he fed the flocks,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And said to them: I see your father’s countenance is not towards me as yesterday and the other day: but the God of my father hath been with me.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And you know that I have served your father to the uttermost of my power.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Yea your father hath also overreached me, and hath changed my wages ten times: and yet God hath not suffered him to hurt me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If at any time, he said: The speckled shall be thy wages: all the sheep brought forth speckled: but when he said on the contrary: Thou shalt take all the white one for thy wages: all the flocks brought forth white ones.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And God hath taken your father’s substance, and given it to me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For after the time came of the ewes conceiving, I lifted up my eyes, and saw in my sleep, that the males which leaped upon the females were of divers colours, and spotted, and speckled.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the angel of God said to me in my sleep: Jacob. And I answered: Here I am.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he said: Lift up thy eyes, and see that all the males leaping upon the females, are of divers colours, spotted and speckled. For I have seen all that Laban hath done to thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>I am the God of Bethel, where thou didst anoint the stone, and make a vow to me. Now therefore arise, and go out of this land, and return into thy native country.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Rachel and Lia answered: Have we any thing left among the goods and inheritance of our father’s house?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hath he not counted us as strangers, and sold us, and eaten up the price of us?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But God hath taken our father’s riches, and delivered them to us, and to our children: wherefore, do all that God hath commanded thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then Jacob rose up, and having set his children and wives upon camels, went his way.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he took all his substance, and flocks, and whatsoever he had gotten in Mesopotamia, and went forward to Isaac, his father, to the land of Chanaan.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>At that time Laban was gone to shear his sheep, and Rachel stole away her father’s idols.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Jacob would not confess to his father-in-law that he was flying away.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when he was gone, together with all that belonged to him, and having passed the river, was going on towards mount Galaad,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>It was told Laban on the third day, that Jacob fled.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he took his brethren with him, and pursued after him seven days; and overtook him in the mount of Galaad.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he saw in a dream God, saying to him: Take heed thou speak not any thing harshly against Jacob.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Now Jacob had pitched his tent in the mountain: and when he, with his brethren, had overtaken him, he pitched his tent in the same mount of Galaad.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he said to Jacob: Why hast thou done thus, to carry away, without my knowledge, my daughters as captives taken with the sword?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Why wouldst thou run away privately, and not acquaint me, that I might have brought thee on the way with joy, and with songs, and with timbrels, and with harps?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thou hast not suffered me to kiss my sons and daughters; thou hast done foolishly; and now indeed,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>It is in my power to return thee evil; but the God of your father said to me yesterday: Take heed thou speak not any thing harshly against Jacob.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Suppose thou didst desire to go to thy friends, and hadst a longing after thy father’s house: why hast thou stolen away my gods?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Jacob answered: That I departed unknown to thee, it was for fear lest thou wouldst take away thy daughters by force.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But, whereas, thou chargest me with theft: with whomsoever thou shalt find thy gods, let him be slain before our brethren. Search, and if thou find any of thy things with me, take them away. Now when he said this, he knew not that Rachel had stolen the idols.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>So Laban went into the tent of Jacob, and of Lia, and of both the handmaids, and found them not. And when he was entered into Rachel’s tent,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>She, in haste, hid the idols under the camel’s furniture, and sat upon them: and when he had searched all the tent, and found nothing,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>She said: Let not my lord be angry that I cannot rise up before thee, because it has now happened to me according to the custom of women. So his careful search was in vain.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And Jacob being angry, said in a chiding manner: For what fault of mine, and for what offence on my part hast thou so hotly pursued me,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And searched all my household stuff? What hast thou found of all the substance of thy house? lay it here before my brethren, and thy brethren, and let them judge between me and thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Have I, therefore, been with thee twenty years? thy ewes and goats were not barren, the rams of thy flocks I did not eat:</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Neither did I shew thee that which the beast had torn; I made good all the damage: whatsoever was lost by theft, thou didst exact it of me:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Day and night was I parched with heat, and with frost, and sleep departed from my eyes.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And in this manner have I served thee in thy house twenty years, fourteen for thy daughters, and six for thy flocks: thou hast changed also my wages ten times.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Unless the God of my father, Abraham, and the fear of Isaac, had stood by me, peradventure now thou hadst sent me away naked: God beheld my affliction and the labour of my hands, and rebuked thee yesterday.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Laban answered him: The daughters are mine, and the children, and thy flocks, and all things that thou seest are mine: what can I do to my children, and grandchildren?</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Come, therefore, let us enter into a league; that it may be for a testimony between me and thee.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And Jacob took a stone, and set it up for a title.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he said to his brethren: Bring hither stones. And they, gathering stones together, made a heap, and they ate upon it.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And Laban called it, The witness heap; and Jacob, The hillock of testimony: each of them according to the propriety of his language.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And Laban said: This heap shall be a witness between me and thee this day, and therefore the name thereof was called Galaad, that is, The witness heap.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>The Lord behold and judge between us, when we shall be gone one from the other.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>If thou afflict my daughters, and if thou bring in other wives over them: none is witness of our speech but God, who is present and beholdeth.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And he said again to Jacob: Behold this heap, and the stone which I have set up between me and thee,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Shall be a witness: this heap, I say, and the stone, be they for a testimony, if either I shall pass beyond it going towards thee, or thou shalt pass beyond it thinking harm to me.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>The God of Abraham, and the God of Nachor, the God of their father, judge between us. And Jacob swore by the fear of his father Isaac:</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And after he had offered sacrifices in the mountain, he called his brethren to eat bread. And when they had eaten, they lodged there:</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>But Laban arose in the night, and kissed his sons and daughters, and blessed them: and returned to his place.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Postquam autem audivit verba filiorum Laban dicentium : Tulit Jacob omnia quæ fuerunt patris nostri, et de illius facultate ditatus, factus est inclytus :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>animadvertit quoque faciem Laban, quod non esset erga se sicut heri et nudiustertius,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>maxime dicente sibi Domino : Revertere in terram patrum tuorum, et ad generationem tuam, eroque tecum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Misit, et vocavit Rachel et Liam in agrum, ubi pascebat greges,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>dixitque eis : Video faciem patris vestri quod non sit erga me sicut heri et nudiustertius : Deus autem patris mei fuit mecum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et ipsæ nostis quod totis viribus meis servierim patri vestro.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sed et pater vester circumvenit me et mutavit mercedem meam decem vicibus : et tamen non dimisit eum Deus ut noceret mihi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si quando dixit : Variæ erunt mercedes tuæ : pariebant omnes oves varios fœtus ; quando vero e contrario, ait : Alba quæque accipies pro mercede : omnes greges alba pepererunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Tulitque Deus substantiam patris vestri, et dedit mihi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Postquam enim conceptus ovium tempus advenerat, levavi oculos meos, et vidi in somnis ascendentes mares super feminas, varios et maculosos, et diversorum colorum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Dixitque angelus Dei ad me in somnis : Jacob ? Et ego respondi : Adsum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui ait : Leva oculos tuos, et vide universos masculos ascendentes super feminas, varios, maculosos, atque respersos. Vidi enim omnia quæ fecit tibi Laban.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ego sum Deus Bethel, ubi unxisti lapidem, et votum vovisti mihi. Nunc ergo surge, et egredere de terra hac, revertens in terram nativitatis tuæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Responderuntque Rachel et Lia : Numquid habemus residui quidquam in facultatibus et hæreditate domus patris nostri ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>nonne quasi alienas reputavit nos, et vendidit, comeditque pretium nostrum ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sed Deus tulit opes patris nostri, et eas tradidit nobis, ac filiis nostris : unde omnia quæ præcepit tibi Deus, fac.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Surrexit itaque Jacob, et impositis liberis ac conjugibus suis super camelos, abiit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tulitque omnem substantiam suam, et greges, et quidquid in Mesopotamia acquisierat, pergens ad Isaac patrem suum in terram Chanaan.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Eo tempore ierat Laban ad tondendas oves, et Rachel furata est idola patris sui.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Noluitque Jacob confiteri socero suo quod fugeret.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Cumque abiisset tam ipse quam omnia quæ juris sui erant, et amne transmisso pergeret contra montem Galaad,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>nuntiatum est Laban die tertio quod fugeret Jacob.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui, assumptis fratribus suis, persecutus est eum diebus septem : et comprehendit eum in monte Galaad.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Viditque in somnis dicentem sibi Deum : Cave ne quidquam aspere loquaris contra Jacob.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Jamque Jacob extenderat in monte tabernaculum : cumque ille consecutus fuisset eum cum fratribus suis, in eodem monte Galaad fixit tentorium.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et dixit ad Jacob : Quare ita egisti, ut clam me abigeres filias meas quasi captivas gladio ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>cur ignorante me fugere voluisti, nec indicare mihi, ut prosequerer te cum gaudio, et canticis, et tympanis, et citharis ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Non es passus ut oscularer filios meos et filias : stulte operatus es : et nunc quidem</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>valet manus mea reddere tibi malum : sed Deus patris vestri heri dixit mihi : Cave ne loquaris contra Jacob quidquam durius.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Esto, ad tuos ire cupiebas, et desiderio erat tibi domus patris tui : cur furatus es deos meos ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Respondit Jacob : Quod inscio te profectus sum, timui ne violenter auferres filias tuas.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quod autem furti me arguis : apud quemcumque inveneris deos tuos, necetur coram fratribus nostris : scrutare, quidquid tuorum apud me inveneris, et aufer. Hæc dicens, ignorabat quod Rachel furata esset idola.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Ingressus itaque Laban tabernaculum Jacob, et Liæ, et utriusque famulæ, non invenit. Cumque intrasset tentorium Rachelis,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>illa festinans abscondit idola subter stramenta cameli, et sedit desuper : scrutantique omne tentorium, et nihil invenienti,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>ait : Ne irascatur dominus meus quod coram te assurgere nequeo : quia juxta consuetudinem feminarum nunc accidit mihi : sic delusa sollicitudo quærentis est.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Tumensque Jacob, cum jurgio ait : Quam ob culpam meam, et ob quod peccatum meum sic exarsisti post me,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et scrutatus es omnem supellectilem meam ? quid invenisti de cuncta substantia domus tuæ ? pone hic coram fratribus meis, et fratribus tuis, et judicent inter me et te.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Idcirco viginti annis fui tecum ? oves tuæ et capræ steriles non fuerunt, arietes gregis tui non comedi :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>nec captum a bestia ostendi tibi, ego damnum omne reddebam : quidquid furto peribat, a me exigebas :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>die noctuque æstu urebar, et gelu, fugiebatque somnus ab oculis meis.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Sicque per viginti annos in domo tua servivi tibi, quatuordecim pro filiabus, et sex pro gregibus tuis : immutasti quoque mercedem meam decem vicibus.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Nisi Deus patris mei Abraham, et timor Isaac affuisset mihi, forsitan modo nudum me dimisisses : afflictionem meam et laborem manuum mearum respexit Deus, et arguit te heri.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Respondit ei Laban : Filiæ meæ et filii, et greges tui, et omnia quæ cernis, mea sunt : quid possum facere filiis et nepotibus meis ?</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Veni ergo, et ineamus fœdus, ut sit in testimonium inter me et te.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Tulit itaque Jacob lapidem, et erexit illum in titulum :</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>dixitque fratribus suis : Afferte lapides. Qui congregantes fecerunt tumulum, comederuntque super eum :</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>quem vocavit Laban Tumulum testis : et Jacob, Acervum testimonii, uterque juxta proprietatem linguæ suæ.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Dixitque Laban : Tumulus iste erit testis inter me et te hodie, et idcirco appellatum est nomen ejus Galaad, id est, Tumulus testis.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Intueatur et judicet Dominus inter nos quando recesserimus a nobis,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>si afflixeris filias meas, et si introduxeris alias uxores super eas : nullus sermonis nostri testis est absque Deo, qui præsens respicit.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Dixitque rursus ad Jacob : En tumulus hic, et lapis quem erexi inter me et te,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>testis erit : tumulus, inquam, iste et lapis sint in testimonium, si aut ego transiero illum pergens ad te, aut tu præterieris, malum mihi cogitans.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Deus Abraham, et Deus Nachor, judicet inter nos, Deus patris eorum. Juravit ergo Jacob per timorem patris sui Isaac :</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>immolatisque victimis in monte, vocavit fratres suos ut ederent panem. Qui cum comedissent, manserunt ibi :</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Laban vero de nocte consurgens, osculatus est filios, et filias suas, et benedixit illis : reversusque est in locum suum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/30/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 30</span></span></a><a c [\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"GEN.31\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":31,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"But after that he had heard the words of the sons of Laban, saying: Jacob hath taken away all that was our father’s, and being enriched by his substance is become great.\"},{\"verse\":2,\"text\":\"And perceiving also, that Laban’s countenance was not towards him as yesterday and the other day.\"},{\"verse\":3,\"text\":\"Especially the Lord saying to him: Return into the land of thy fathers and to thy kindred, and I will be with thee.\"},{\"verse\":4,\"text\":\"He sent, and called Rachel and Lia into the field, where he fed the flocks,\"},{\"verse\":5,\"text\":\"And said to them: I see your father’s countenance is not towards me as yesterday and the other day: but the God of my father hath been with me.\"},{\"verse\":6,\"text\":\"And you know that I have served your father to the uttermost of my power.\"},{\"verse\":7,\"text\":\"Yea your father hath also overreached me, and hath changed my wages ten times: and yet God hath not suffered him to hurt me.\"},{\"verse\":8,\"text\":\"If at any time, he said: The speckled shall be thy wages: all the sheep brought forth speckled: but when he said on the contrary: Thou shalt take all the white one for thy wages: all the flocks brought forth white ones.\"},{\"verse\":9,\"text\":\"And God hath taken your father’s substance, and given it to me.\"},{\"verse\":10,\"text\":\"For after the time came of the ewes conceiving, I lifted up my eyes, and saw in my sleep, that the males which leaped upon the females were of divers colours, and spotted, and speckled.\"},{\"verse\":11,\"text\":\"And the angel of God said to me in my sleep: Jacob. And I answered: Here I am.\"},{\"verse\":12,\"text\":\"And he said: Lift up thy eyes, and see that all the males leaping upon the females, are of divers colours, spotted and speckled. For I have seen all that Laban hath done to thee.\"},{\"verse\":13,\"text\":\"I am the God of Bethel, where thou didst anoint the stone, and make a vow to me. Now therefore arise, and go out of this land, and return into thy native country.\"},{\"verse\":14,\"text\":\"And Rachel and Lia answered: Have we any thing left among the goods and inheritance of our father’s house?\"},{\"verse\":15,\"text\":\"Hath he not counted us as strangers, and sold us, and eaten up the price of us?\"},{\"verse\":16,\"text\":\"But God hath taken our father’s riches, and delivered them to us, and to our children: wherefore, do all that God hath commanded thee.\"},{\"verse\":17,\"text\":\"Then Jacob rose up, and having set his children and wives upon camels, went his way.\"},{\"verse\":18,\"text\":\"And he took all his substance, and flocks, and whatsoever he had gotten in Mesopotamia, and went forward to Isaac, his father, to the land of Chanaan.\"},{\"verse\":19,\"text\":\"At that time Laban was gone to shear his sheep, and Rachel stole away her father’s idols.\"},{\"verse\":20,\"text\":\"And Jacob would not confess to his father-in-law that he was flying away.\"},{\"verse\":21,\"text\":\"And when he was gone, together with all that belonged to him, and having passed the river, was going on towards mount Galaad,\"},{\"verse\":22,\"text\":\"It was told Laban on the third day, that Jacob fled.\"},{\"verse\":23,\"text\":\"And he took his brethren with him, and pursued after him seven days; and overtook him in the mount of Galaad.\"},{\"verse\":24,\"text\":\"And he saw in a dream God, saying to him: Take heed thou speak not any thing harshly against Jacob.\"},{\"verse\":25,\"text\":\"Now Jacob had pitched his tent in the mountain: and when he, with his brethren, had overtaken him, he pitched his tent in the same mount of Galaad.\"},{\"verse\":26,\"text\":\"And he said to Jacob: Why hast thou done thus, to carry away, without my knowledge, my daughters as captives taken with the sword?\"},{\"verse\":27,\"text\":\"Why wouldst thou run away privately, and not acquaint me, that I might have brought thee on the way with joy, and with songs, and with timbrels, and with harps?\"},{\"verse\":28,\"text\":\"Thou hast not suffered me to kiss my sons and daughters; thou hast done foolishly; and now indeed,\"},{\"verse\":29,\"text\":\"It is in my power to return thee evil; but the God of your father said to me yesterday: Take heed thou speak not any thing harshly against Jacob.\"},{\"verse\":30,\"text\":\"Suppose thou didst desire to go to thy friends, and hadst a longing after thy father’s house: why hast thou stolen away my gods?\"},{\"verse\":31,\"text\":\"Jacob answered: That I departed unknown to thee, it was for fear lest thou wouldst take away thy daughters by force.\"},{\"verse\":32,\"text\":\"But, whereas, thou chargest me with theft: with whomsoever thou shalt find thy gods, let him be slain before our brethren. Search, and if thou find any of thy things with me, take them away. Now when he said this, he knew not that Rachel had stolen the idols.\"},{\"verse\":33,\"text\":\"So Laban went into the tent of Jacob, and of Lia, and of both the handmaids, and found them not. And when he was entered into Rachel’s tent,\"},{\"verse\":34,\"text\":\"She, in haste, hid the idols under the camel’s furniture, and sat upon them: and when he had searched all the tent, and found nothing,\"},{\"verse\":35,\"text\":\"She said: Let not my lord be angry that I cannot rise up before thee, because it has now happened to me according to the custom of women. So his careful search was in vain.\"},{\"verse\":36,\"text\":\"And Jacob being angry, said in a chiding manner: For what fault of mine, and for what offence on my part hast thou so hotly pursued me,\"},{\"verse\":37,\"text\":\"And searched all my household stuff? What hast thou found of all the substance of thy house? lay it here before my brethren, and thy brethren, and let them judge between me and thee.\"},{\"verse\":38,\"text\":\"Have I, therefore, been with thee twenty years? thy ewes and goats were not barren, the rams of thy flocks I did not eat:\"},{\"verse\":39,\"text\":\"Neither did I shew thee that which the beast had torn; I made good all the damage: whatsoever was lost by theft, thou didst exact it of me:\"},{\"verse\":40,\"text\":\"Day and night was I parched with heat, and with frost, and sleep departed from my eyes.\"},{\"verse\":41,\"text\":\"And in this manner have I served thee in thy house twenty years, fourteen for thy daughters, and six for thy flocks: thou hast changed also my wages ten times.\"},{\"verse\":42,\"text\":\"Unless the God of my father, Abraham, and the fear of Isaac, had stood by me, peradventure now thou hadst sent me away naked: God beheld my affliction and the labour of my hands, and rebuked thee yesterday.\"},{\"verse\":43,\"text\":\"Laban answered him: The daughters are mine, and the children, and thy flocks, and all things that thou seest are mine: what can I do to my children, and grandchildren?\"},{\"verse\":44,\"text\":\"Come, therefore, let us enter into a league; that it may be for a testimony between me and thee.\"},{\"verse\":45,\"text\":\"And Jacob took a stone, and set it up for a title.\"},{\"verse\":46,\"text\":\"And he said to his brethren: Bring hither stones. And they, gathering stones together, made a heap, and they ate upon it.\"},{\"verse\":47,\"text\":\"And Laban called it, The witness heap; and Jacob, The hillock of testimony: each of them according to the propriety of his language.\"},{\"verse\":48,\"text\":\"And Laban said: This heap shall be a witness between me and thee this day, and therefore the name thereof was called Galaad, that is, The witness heap.\"},{\"verse\":49,\"text\":\"The Lord behold and judge between us, when we shall be gone one from the other.\"},{\"verse\":50,\"text\":\"If thou afflict my daughters, and if thou bring in other wives over them: none is witness of our speech but God, who is present and beholdeth.\"},{\"verse\":51,\"text\":\"And he said again to Jacob: Behold this heap, and the stone which I have set up between me and thee,\"},{\"verse\":52,\"text\":\"Shall be a witness: this heap, I say, and the stone, be they for a testimony, if either I shall pass beyond it going towards thee, or thou shalt pass beyond it thinking harm to me.\"},{\"verse\":53,\"text\":\"The God of Abraham, and the God of Nachor, the God of their father, judge between us. And Jacob swore by the fear of his father Isaac:\"},{\"verse\":54,\"text\":\"And after he had offered sacrifices in the mountain, he called his brethren to eat bread. And when they had eaten, they lodged there:\"},{\"verse\":55,\"text\":\"But Laban arose in the night, and kissed his sons and daughters, and blessed them: and returned to his place.\"}],\"vul\":[{\"verse\":1,\"text\":\"Postquam autem audivit verba filiorum Laban dicentium : Tulit Jacob omnia quæ fuerunt patris nostri, et de illius facultate ditatus, factus est inclytus :\"},{\"verse\":2,\"text\":\"animadvertit quoque faciem Laban, quod non esset erga se sicut heri et nudiustertius,\"},{\"verse\":3,\"text\":\"maxime dicente sibi Domino : Revertere in terram patrum tuorum, et ad generationem tuam, eroque tecum.\"},{\"verse\":4,\"text\":\"Misit, et vocavit Rachel et Liam in agrum, ubi pascebat greges,\"},{\"verse\":5,\"text\":\"dixitque eis : Video faciem patris vestri quod non sit erga me sicut heri et nudiustertius : Deus autem patris mei fuit mecum.\"},{\"verse\":6,\"text\":\"Et ipsæ nostis quod totis viribus meis servierim patri vestro.\"},{\"verse\":7,\"text\":\"Sed et pater vester circumvenit me et mutavit mercedem meam decem vicibus : et tamen non dimisit eum Deus ut noceret mihi.\"},{\"verse\":8,\"text\":\"Si quando dixit : Variæ erunt mercedes tuæ : pariebant omnes oves varios fœtus ; quando vero e contrario, ait : Alba quæque accipies pro mercede : omnes greges alba pepererunt.\"},{\"verse\":9,\"text\":\"Tulitque Deus substantiam patris vestri, et dedit mihi.\"},{\"verse\":10,\"text\":\"Postquam enim conceptus ovium tempus advenerat, levavi oculos meos, et vidi in somnis ascendentes mares super feminas, varios et maculosos, et diversorum colorum.\"},{\"verse\":11,\"text\":\"Dixitque angelus Dei ad me in somnis : Jacob ? Et ego respondi : Adsum.\"},{\"verse\":12,\"text\":\"Qui ait : Leva oculos tuos, et vide universos masculos ascendentes super feminas, varios, maculosos, atque respersos. Vidi enim omnia quæ fecit tibi Laban.\"},{\"verse\":13,\"text\":\"Ego sum Deus Bethel, ubi unxisti lapidem, et votum vovisti mihi. Nunc ergo surge, et egredere de terra hac, revertens in terram nativitatis tuæ.\"},{\"verse\":14,\"text\":\"Responderuntque Rachel et Lia : Numquid habemus residui quidquam in facultatibus et hæreditate domus patris nostri ?\"},{\"verse\":15,\"text\":\"nonne quasi alienas reputavit nos, et vendidit, comeditque pretium nostrum ?\"},{\"verse\":16,\"text\":\"Sed Deus tulit opes patris nostri, et eas tradidit nobis, ac filiis nostris : unde omnia quæ præcepit tibi Deus, fac.\"},{\"verse\":17,\"text\":\"Surrexit itaque Jacob, et impositis liberis ac conjugibus suis super camelos, abiit.\"},{\"verse\":18,\"text\":\"Tulitque omnem substantiam suam, et greges, et quidquid in Mesopotamia acquisierat, pergens ad Isaac patrem suum in terram Chanaan.\"},{\"verse\":19,\"text\":\"Eo tempore ierat Laban ad tondendas oves, et Rachel furata est idola patris sui.\"},{\"verse\":20,\"text\":\"Noluitque Jacob confiteri socero suo quod fugeret.\"},{\"verse\":21,\"text\":\"Cumque abiisset tam ipse quam omnia quæ juris sui erant, et amne transmisso pergeret contra montem Galaad,\"},{\"verse\":22,\"text\":\"nuntiatum est Laban die tertio quod fugeret Jacob.\"},{\"verse\":23,\"text\":\"Qui, assumptis fratribus suis, persecutus est eum diebus septem : et comprehendit eum in monte Galaad.\"},{\"verse\":24,\"text\":\"Viditque in somnis dicentem sibi Deum : Cave ne quidquam aspere loquaris contra Jacob.\"},{\"verse\":25,\"text\":\"Jamque Jacob extenderat in monte tabernaculum : cumque ille consecutus fuisset eum cum fratribus suis, in eodem monte Galaad fixit tentorium.\"},{\"verse\":26,\"text\":\"Et dixit ad Jacob : Quare ita egisti, ut clam me abigeres filias meas quasi captivas gladio ?\"},{\"verse\":27,\"text\":\"cur ignorante me fugere voluisti, nec indicare mihi, ut prosequerer te cum gaudio, et canticis, et tympanis, et citharis ?\"},{\"verse\":28,\"text\":\"Non es passus ut oscularer filios meos et filias : stulte operatus es : et nunc quidem\"},{\"verse\":29,\"text\":\"valet manus mea reddere tibi malum : sed Deus patris vestri heri dixit mihi : Cave ne loquaris contra Jacob quidquam durius.\"},{\"verse\":30,\"text\":\"Esto, ad tuos ire cupiebas, et desiderio erat tibi domus patris tui : cur furatus es deos meos ?\"},{\"verse\":31,\"text\":\"Respondit Jacob : Quod inscio te profectus sum, timui ne violenter auferres filias tuas.\"},{\"verse\":32,\"text\":\"Quod autem furti me arguis : apud quemcumque inveneris deos tuos, necetur coram fratribus nostris : scrutare, quidquid tuorum apud me inveneris, et aufer. Hæc dicens, ignorabat quod Rachel furata esset idola.\"},{\"verse\":33,\"text\":\"Ingressus itaque Laban tabernaculum Jacob, et Liæ, et utriusque famulæ, non invenit. Cumque intrasset tentorium Rachelis,\"},{\"verse\":34,\"text\":\"illa festinans abscondit idola subter stramenta cameli, et sedit desuper : scrutantique omne tentorium, et nihil invenienti,\"},{\"verse\":35,\"text\":\"ait : Ne irascatur dominus meus quod coram te assurgere nequeo : quia juxta consuetudinem feminarum nunc accidit mihi : sic delusa sollicitudo quærentis est.\"},{\"verse\":36,\"text\":\"Tumensque Jacob, cum jurgio ait : Quam ob culpam meam, et ob quod peccatum meum sic exarsisti post me,\"},{\"verse\":37,\"text\":\"et scrutatus es omnem supellectilem meam ? quid invenisti de cuncta substantia domus tuæ ? pone hic coram fratribus meis, et fratribus tuis, et judicent inter me et te.\"},{\"verse\":38,\"text\":\"Idcirco viginti annis fui tecum ? oves tuæ et capræ steriles non fuerunt, arietes gregis tui non comedi :\"},{\"verse\":39,\"text\":\"nec captum a bestia ostendi tibi, ego damnum omne reddebam : quidquid furto peribat, a me exigebas :\"},{\"verse\":40,\"text\":\"die noctuque æstu urebar, et gelu, fugiebatque somnus ab oculis meis.\"},{\"verse\":41,\"text\":\"Sicque per viginti annos in domo tua servivi tibi, quatuordecim pro filiabus, et sex pro gregibus tuis : immutasti quoque mercedem meam decem vicibus.\"},{\"verse\":42,\"text\":\"Nisi Deus patris mei Abraham, et timor Isaac affuisset mihi, forsitan modo nudum me dimisisses : afflictionem meam et laborem manuum mearum respexit Deus, et arguit te heri.\"},{\"verse\":43,\"text\":\"Respondit ei Laban : Filiæ meæ et filii, et greges tui, et omnia quæ cernis, mea sunt : quid possum facere filiis et nepotibus meis ?\"},{\"verse\":44,\"text\":\"Veni ergo, et ineamus fœdus, ut sit in testimonium inter me et te.\"},{\"verse\":45,\"text\":\"Tulit itaque Jacob lapidem, et erexit illum in titulum :\"},{\"verse\":46,\"text\":\"dixitque fratribus suis : Afferte lapides. Qui congregantes fecerunt tumulum, comederuntque super eum :\"},{\"verse\":47,\"text\":\"quem vocavit Laban Tumulum testis : et Jacob, Acervum testimonii, uterque juxta proprietatem linguæ suæ.\"},{\"verse\":48,\"text\":\"Dixitque Laban : Tumulus iste erit testis inter me et te hodie, et idcirco appellatum est nomen ejus Galaad, id est, Tumulus testis.\"},{\"verse\":49,\"text\":\"Intueatur et judicet Dominus inter nos quando recesserimus a nobis,\"},{\"verse\":50,\"text\":\"si afflixeris filias meas, et si introduxeris alias uxores super eas : nullus sermonis nostri testis est absque Deo, qui præsens respicit.\"},{\"verse\":51,\"text\":\"Dixitque rursus ad Jacob : En tumulus hic, et lapis quem erexi inter me et te,\"},{\"verse\":52,\"text\":\"testis erit : tumulus, inquam, iste et lapis sint in testimonium, si aut ego transiero illum pergens ad te, aut tu præterieris, malum mihi cogitans.\"},{\"verse\":53,\"text\":\"Deus Abraham, et Deus Nachor, judicet inter nos, Deus patris eorum. Juravit ergo Jacob per timorem patris sui Isaac :\"},{\"verse\":54,\"text\":\"immolatisque victimis in monte, vocavit fratres suos ut ederent panem. Qui cum comedissent, manserunt ibi :\"},{\"verse\":55,\"text\":\"Laban vero de nocte consurgens, osculatus est filios, et filias suas, et benedixit illis : reversusque est in locum suum.\"}],\"summary\":\"Jacob’s departure: he is pursued and overtaken by Laban. They make a covenant.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":30,\"label\":\"Genesis 30\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":32,\"label\":\"Genesis 32\"}}]]\n"])</script></body></html>
