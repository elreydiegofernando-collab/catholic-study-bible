m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">11</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The tower of Babel. The confusion of tongues. The genealogy of Sem down to Abram.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the earth was of one tongue, and of the same speech.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when they removed from the east, they found a plain in the land of Sennaar, and dwelt in it.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And each one said to his neighbour: Come let us make brick, and bake them with fire. And they had brick instead of stones, and slime instead of mortar:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they said: Come, let us make a city and a tower, the top whereof may reach to heaven; and let us make our name famous before we be scattered abroad into all lands.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the Lord came down to see the city and the tower, which the children of Adam were building.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said: Behold, it is one people, and all have one tongue: and they have begun to do this, neither will they leave off from their designs, till they accomplish them in deed.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Come ye, therefore, let us go down, and there confound their tongue, that they may not understand one another’s speech.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And so the Lord scattered them from that place into all lands, and they ceased to build the city.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And therefore the name thereof was called Babel, because there the language of the whole earth was confounded: and from thence the Lord scattered them abroad upon the face of all countries.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>These are the generations of Sem: Sem was a hundred years old when he begot Arphaxad, two years after the flood.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Sem lived after he begot Arphaxad, five hundred years, and begot sons and daughters.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Arphaxad lived thirty-five years, and begot Sale.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Arphaxad lived after he begot Sale, three hundred and three years, and begot sons and daughters.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sale also lived thirty years, and begot Heber.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Sale lived after he begot Heber, four hundred and three years: and begot sons and daughters.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Heber lived thirty-four years, and begot Phaleg.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Heber lived after he begot Phaleg, four hundred and thirty years: and begot sons and daughters.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Phaleg also lived thirty years, and begot Reu.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Phaleg lived after he begot Reu, two hundred and nine years, and begot sons and daughters.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Reu lived thirty-two years, and begot Sarug.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Reu lived after he begot Sarug, two hundred and seven years, and begot sons and daughters.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Sarug lived thirty years, and begot Nachor.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Sarug lived after he begot Nachor, two hundred years, and begot sons and daughters.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Nachor lived nine and twenty years, and begot Thare.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Nachor lived after he begot Thare, a hundred and nineteen years, and begot sons and daughters.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Thare lived seventy years, and begot Abram, and Nachor, and Aran.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And these are the generations of Thare: Thare begot Abram, Nachor, and Aran. And Aran begot Lot.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Aran died before Thare his father, in the land of his nativity in Ur of the Chaldees.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Abram and Nachor married wives: the name of Abram’s wife was Sarai: and the name of Nachor’s wife, Melcha, the daughter of Aran, father of Melcha and father of Jescha.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Sarai was barren, and had no children.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Thare took Abram his son, and Lot the son of Aran, his son’s son, and Sarai his daughter in law, the wife of Abram his son, and brought them out of Ur of the Chaldees, to go into the land of Chanaan: and they came as far as Haran, and dwelt there.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the days of Thare were two hundred and five years, and he died in Haran.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem terra labii unius, et sermonum eorumdem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cumque proficiscerentur de oriente, invenerunt campum in terra Sennaar, et habitaverunt in eo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixitque alter ad proximum suum : Venite, faciamus lateres, et coquamus eos igni. Habueruntque lateres pro saxis, et bitumen pro cæmento :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et dixerunt : Venite, faciamus nobis civitatem et turrim, cujus culmen pertingat ad cælum : et celebremus nomen nostrum antequam dividamur in universas terras.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Descendit autem Dominus ut videret civitatem et turrim, quam ædificabant filii Adam,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et dixit : Ecce, unus est populus, et unum labium omnibus : cœperuntque hoc facere, nec desistent a cogitationibus suis, donec eas opere compleant.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venite igitur, descendamus, et confundamus ibi linguam eorum, ut non audiat unusquisque vocem proximi sui.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Atque ita divisit eos Dominus ex illo loco in universas terras, et cessaverunt ædificare civitatem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et idcirco vocatum est nomen ejus Babel, quia ibi confusum est labium universæ terræ : et inde dispersit eos Dominus super faciem cunctarum regionum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hæ sunt generationes Sem : Sem erat centum annorum quando genuit Arphaxad, biennio post diluvium.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Vixitque Sem, postquam genuit Arphaxad, quingentis annis : et genuit filios et filias.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Porro Arphaxad vixit triginta quinque annis, et genuit Sale.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vixitque Arphaxad, postquam genuit Sale, trecentis tribus annis : et genuit filios et filias.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sale quoque vixit triginta annis, et genuit Heber.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vixitque Sale, postquam genuit Heber, quadringentis tribus annis : et genuit filios et filias.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vixit autem Heber triginta quatuor annis, et genuit Phaleg.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et vixit Heber postquam genuit Phaleg, quadringentis triginta annis : et genuit filios et filias.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vixit quoque Phaleg triginta annis, et genuit Reu.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Vixitque Phaleg, postquam genuit Reu, ducentis novem annis : et genuit filios et filias.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vixit autem Reu triginta duobus annis, et genuit Sarug.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Vixit quoque Reu, postquam genuit Sarug, ducentis septem annis : et genuit filios et filias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vixit vero Sarug triginta annis, et genuit Nachor.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Vixitque Sarug, postquam genuit Nachor, ducentis annis : et genuit filios et filias.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Vixit autem Nachor viginti novem annis, et genuit Thare.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Vixitque Nachor, postquam genuit Thare, centum decem et novem annis : et genuit filios et filias.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vixitque Thare septuaginta annis, et genuit Abram, et Nachor, et Aran.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Hæ sunt autem generationes Thare : Thare genuit Abram, Nachor et Aran. Porro Aran genuit Lot.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mortuusque est Aran ante Thare patrem suum, in terra nativitatis suæ, in Ur Chaldæorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Duxerunt autem Abram et Nachor uxores : nomen uxoris Abram, Sarai : et nomen uxoris Nachor, Melcha filia Aran, patris Melchæ, et patris Jeschæ.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Erat autem Sarai sterilis, nec habebat liberos.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Tulit itaque Thare Abram filium suum, et Lot filium Aran, filium filii sui, et Sarai nurum suam, uxorem Abram filii sui, et eduxit eos de Ur Chaldæorum, ut irent in terram Chanaan : veneruntque usque Haran, et habitaverunt ibi.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et facti sunt dies Thare ducentorum quinque annorum, et mortuus est in Haran.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Genesis 10" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" clas sis\",\"drName\":\"Genesis\",\"chapter\":11,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"And the earth was of one tongue, and of the same speech.\"},{\"verse\":2,\"text\":\"And when they removed from the east, they found a plain in the land of Sennaar, and dwelt in it.\"},{\"verse\":3,\"text\":\"And each one said to his neighbour: Come let us make brick, and bake them with fire. And they had brick instead of stones, and slime instead of mortar:\"},{\"verse\":4,\"text\":\"And they said: Come, let us make a city and a tower, the top whereof may reach to heaven; and let us make our name famous before we be scattered abroad into all lands.\"},{\"verse\":5,\"text\":\"And the Lord came down to see the city and the tower, which the children of Adam were building.\"},{\"verse\":6,\"text\":\"And he said: Behold, it is one people, and all have one tongue: and they have begun to do this, neither will they leave off from their designs, till they accomplish them in deed.\"},{\"verse\":7,\"text\":\"Come ye, therefore, let us go down, and there confound their tongue, that they may not understand one another’s speech.\"},{\"verse\":8,\"text\":\"And so the Lord scattered them from that place into all lands, and they ceased to build the city.\"},{\"verse\":9,\"text\":\"And therefore the name thereof was called Babel, because there the language of the whole earth was confounded: and from thence the Lord scattered them abroad upon the face of all countries.\"},{\"verse\":10,\"text\":\"These are the generations of Sem: Sem was a hundred years old when he begot Arphaxad, two years after the flood.\"},{\"verse\":11,\"text\":\"And Sem lived after he begot Arphaxad, five hundred years, and begot sons and daughters.\"},{\"verse\":12,\"text\":\"And Arphaxad lived thirty-five years, and begot Sale.\"},{\"verse\":13,\"text\":\"And Arphaxad lived after he begot Sale, three hundred and three years, and begot sons and daughters.\"},{\"verse\":14,\"text\":\"Sale also lived thirty years, and begot Heber.\"},{\"verse\":15,\"text\":\"And Sale lived after he begot Heber, four hundred and three years: and begot sons and daughters.\"},{\"verse\":16,\"text\":\"And Heber lived thirty-four years, and begot Phaleg.\"},{\"verse\":17,\"text\":\"And Heber lived after he begot Phaleg, four hundred and thirty years: and begot sons and daughters.\"},{\"verse\":18,\"text\":\"Phaleg also lived thirty years, and begot Reu.\"},{\"verse\":19,\"text\":\"And Phaleg lived after he begot Reu, two hundred and nine years, and begot sons and daughters.\"},{\"verse\":20,\"text\":\"And Reu lived thirty-two years, and begot Sarug.\"},{\"verse\":21,\"text\":\"And Reu lived after he begot Sarug, two hundred and seven years, and begot sons and daughters.\"},{\"verse\":22,\"text\":\"And Sarug lived thirty years, and begot Nachor.\"},{\"verse\":23,\"text\":\"And Sarug lived after he begot Nachor, two hundred years, and begot sons and daughters.\"},{\"verse\":24,\"text\":\"And Nachor lived nine and twenty years, and begot Thare.\"},{\"verse\":25,\"text\":\"And Nachor lived after he begot Thare, a hundred and nineteen years, and begot sons and daughters.\"},{\"verse\":26,\"text\":\"And Thare lived seventy years, and begot Abram, and Nachor, and Aran.\"},{\"verse\":27,\"text\":\"And these are the generations of Thare: Thare begot Abram, Nachor, and Aran. And Aran begot Lot.\"},{\"verse\":28,\"text\":\"And Aran died before Thare his father, in the land of his nativity in Ur of the Chaldees.\"},{\"verse\":29,\"text\":\"And Abram and Nachor married wives: the name of Abram’s wife was Sarai: and the name of Nachor’s wife, Melcha, the daughter of Aran, father of Melcha and father of Jescha.\"},{\"verse\":30,\"text\":\"And Sarai was barren, and had no children.\"},{\"verse\":31,\"text\":\"And Thare took Abram his son, and Lot the son of Aran, his son’s son, and Sarai his daughter in law, the wife of Abram his son, and brought them out of Ur of the Chaldees, to go into the land of Chanaan: and they came as far as Haran, and dwelt there.\"},{\"verse\":32,\"text\":\"And the days of Thare were two hundred and five years, and he died in Haran.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem terra labii unius, et sermonum eorumdem.\"},{\"verse\":2,\"text\":\"Cumque proficiscerentur de oriente, invenerunt campum in terra Sennaar, et habitaverunt in eo.\"},{\"verse\":3,\"text\":\"Dixitque alter ad proximum suum : Venite, faciamus lateres, et coquamus eos igni. Habueruntque lateres pro saxis, et bitumen pro cæmento :\"},{\"verse\":4,\"text\":\"et dixerunt : Venite, faciamus nobis civitatem et turrim, cujus culmen pertingat ad cælum : et celebremus nomen nostrum antequam dividamur in universas terras.\"},{\"verse\":5,\"text\":\"Descendit autem Dominus ut videret civitatem et turrim, quam ædificabant filii Adam,\"},{\"verse\":6,\"text\":\"et dixit : Ecce, unus est populus, et unum labium omnibus : cœperuntque hoc facere, nec desistent a cogitationibus suis, donec eas opere compleant.\"},{\"verse\":7,\"text\":\"Venite igitur, descendamus, et confundamus ibi linguam eorum, ut non audiat unusquisque vocem proximi sui.\"},{\"verse\":8,\"text\":\"Atque ita divisit eos Dominus ex illo loco in universas terras, et cessaverunt ædificare civitatem.\"},{\"verse\":9,\"text\":\"Et idcirco vocatum est nomen ejus Babel, quia ibi confusum est labium universæ terræ : et inde dispersit eos Dominus super faciem cunctarum regionum.\"},{\"verse\":10,\"text\":\"Hæ sunt generationes Sem : Sem erat centum annorum quando genuit Arphaxad, biennio post diluvium.\"},{\"verse\":11,\"text\":\"Vixitque Sem, postquam genuit Arphaxad, quingentis annis : et genuit filios et filias.\"},{\"verse\":12,\"text\":\"Porro Arphaxad vixit triginta quinque annis, et genuit Sale.\"},{\"verse\":13,\"text\":\"Vixitque Arphaxad, postquam genuit Sale, trecentis tribus annis : et genuit filios et filias.\"},{\"verse\":14,\"text\":\"Sale quoque vixit triginta annis, et genuit Heber.\"},{\"verse\":15,\"text\":\"Vixitque Sale, postquam genuit Heber, quadringentis tribus annis : et genuit filios et filias.\"},{\"verse\":16,\"text\":\"Vixit autem Heber triginta quatuor annis, et genuit Phaleg.\"},{\"verse\":17,\"text\":\"Et vixit Heber postquam genuit Phaleg, quadringentis triginta annis : et genuit filios et filias.\"},{\"verse\":18,\"text\":\"Vixit quoque Phaleg triginta annis, et genuit Reu.\"},{\"verse\":19,\"text\":\"Vixitque Phaleg, postquam genuit Reu, ducentis novem annis : et genuit filios et filias.\"},{\"verse\":20,\"text\":\"Vixit autem Reu triginta duobus annis, et genuit Sarug.\"},{\"verse\":21,\"text\":\"Vixit quoque Reu, postquam genuit Sarug, ducentis septem annis : et genuit filios et filias.\"},{\"verse\":22,\"text\":\"Vixit vero Sarug triginta annis, et genuit Nachor.\"},{\"verse\":23,\"text\":\"Vixitque Sarug, postquam genuit Nachor, ducentis annis : et genuit filios et filias.\"},{\"verse\":24,\"text\":\"Vixit autem Nachor viginti novem annis, et genuit Thare.\"},{\"verse\":25,\"text\":\"Vixitque Nachor, postquam genuit Thare, centum decem et novem annis : et genuit filios et filias.\"},{\"verse\":26,\"text\":\"Vixitque Thare septuaginta annis, et genuit Abram, et Nachor, et Aran.\"},{\"verse\":27,\"text\":\"Hæ sunt autem generationes Thare : Thare genuit Abram, Nachor et Aran. Porro Aran genuit Lot.\"},{\"verse\":28,\"text\":\"Mortuusque est Aran ante Thare patrem suum, in terra nativitatis suæ, in Ur Chaldæorum.\"},{\"verse\":29,\"text\":\"Duxerunt autem Abram et Nachor uxores : nomen uxoris Abram, Sarai : et nomen uxoris Nachor, Melcha filia Aran, patris Melchæ, et patris Jeschæ.\"},{\"verse\":30,\"text\":\"Erat autem Sarai sterilis, nec habebat liberos.\"},{\"verse\":31,\"text\":\"Tulit itaque Thare Abram filium suum, et Lot filium Aran, filium filii sui, et Sarai nurum suam, uxorem Abram filii sui, et eduxit eos de Ur Chaldæorum, ut irent in terram Chanaan : veneruntque usque Haran, et habitaverunt ibi.\"},{\"verse\":32,\"text\":\"Et facti sunt dies Thare ducentorum quinque annorum, et mortuus est in Haran.\"}],\"summary\":\"The tower of Babel. The confusion of tongues. The genealogy of Sem down to Abram.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":10,\"label\":\"Genesis 10\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":12,\"label\":\"Genesis 12\"}}]]\n"])</script></body></html>
