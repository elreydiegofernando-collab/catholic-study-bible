-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">45</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Joseph maketh himself known to his brethren: and sendeth for his father.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Joseph could no longer refrain himself before many that stood by: whereupon he commanded that all should go out, and no stranger be present at their knowing one another.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he lifted up his voice with weeping, which the Egyptians, and all the house of Pharao heard.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said to his brethren: I am Joseph: Is my father yet living? His brethren could not answer him, being struck with exceeding great fear.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he said mildly to them: Come nearer to me. And when they were come near him, he said: I am Joseph, your brother, whom you sold into Egypt.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Be not afraid, and let it not seem to you a hard case that you sold me into these countries: for God sent me before you into Egypt for your preservation.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For it is two years since the famine began to be upon the land, and five years more remain, wherein there can be neither ploughing nor reaping.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And God sent me before, that you may be preserved upon the earth, and may have food to live.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Not by your counsel was I sent hither, but by the will of God: who hath made me as it were a father to Pharao, and lord of his whole house, and governor in all the land of Egypt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Make haste, and go ye up to my father, and say to him: Thus saith thy son Joseph: God hath made me lord of the whole land of Egypt; come down to me, linger not.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And thou shalt dwell in the land of Gessen: and thou shalt be near me, thou and thy sons, and thy sons’ sons, thy sheep, and thy herds, and all things that thou hast.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And there I will feed thee, (for there are yet five years of famine remaining) lest both thou perish, and thy house, and all things that thou hast.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Behold, your eyes, and the eyes of my brother Benjamin, see that it is my mouth that speaketh to you.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>You shall tell my father of all my glory, and all things that you have seen in Egypt: make haste and bring him to me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And falling upon the neck of his brother Benjamin, he embraced him and wept: and Benjamin in like manner wept also on his neck.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Joseph kissed all his brethren, and wept upon every one of them: after which they were emboldened to speak to him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And it was heard, and the fame was spread abroad in the king’s court: The brethren of Joseph are come; and Pharao with all his family was glad.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he spoke to Joseph that he should give orders to his brethren, saying: Load your beasts, and go into the land of Chanaan,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And bring away from thence your father and kindred, and come to me; and I will give you all the good things of Egypt, that you may eat the marrow of the land.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Give orders also that they take wagons out of the land of Egypt, for the carriage of their children and their wives; and say: Take up your father, and make haste to come with all speed:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And leave nothing of your household stuff; for all the riches of Egypt shall be yours.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the sons of Israel did as they were bid. And Joseph gave them wagons according to Pharao’s commandment: and provisions for the way.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He ordered also to be brought out for every one of them two robes: but to Benjamin he gave three hundred pieces of silver, with five robes of the best:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sending to his father as much money and raiment; adding besides, ten he-asses, to carry off all the riches of Egypt, and as many she-asses, carrying wheat and bread for the journey.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>So he sent away his brethren, and at their departing said to them: Be not angry in the way.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they went up out of Egypt, and came into the land of Chanaan, to their father Jacob.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they told him, saying: Joseph, thy son, is living; and he is ruler in all the land of Egypt. Which when Jacob heard, he awaked as it were out of a deep sleep, yet did not believe them.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>They, on the other side, told the whole order of the thing. And when he saw the wagons, and all that he had sent, his spirit revived,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said: It is enough for me if Joseph, my son, be yet living: I will go and see him before I die.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Non se poterat ultra cohibere Joseph multis coram astantibus : unde præcepit ut egrederentur cuncti foras, et nullus interesset alienus agnitioni mutuæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Elevavitque vocem cum fletu, quam audierunt Ægyptii, omnisque domus Pharaonis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dixit fratribus suis : Ego sum Joseph : adhuc pater meus vivit ? Non poterant respondere fratres nimio terrore perterriti.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ad quos ille clementer : Accedite, inquit, ad me. Et cum accessissent prope : Ego sum, ait, Joseph, frater vester, quem vendidistis in Ægyptum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nolite pavere, neque vobis durum esse videatur quod vendidistis me in his regionibus : pro salute enim vestra misit me Deus ante vos in Ægyptum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Biennium est enim quod cœpit fames esse in terra : et adhuc quinque anni restant, quibus nec arari poterit, nec meti.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Præmisitque me Deus ut reservemini super terram, et escas ad vivendum habere possitis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non vestro consilio, sed Dei voluntate huc missus sum : qui fecit me quasi patrem Pharaonis, et dominum universæ domus ejus, ac principem in omni terra Ægypti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Festinate, et ascendite ad patrem meum, et dicetis ei : Hæc mandat filius tuus Joseph : Deus fecit me dominum universæ terræ Ægypti : descende ad me, ne moreris,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et habitabis in terra Gessen : erisque juxta me tu, et filii tui, et filii filiorum tuorum, oves tuæ, et armenta tua, et universa quæ possides :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ibique te pascam (adhuc enim quinque anni residui sunt famis) ne et tu pereas, et domus tua, et omnia quæ possides.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>En oculi vestri, et oculi fratris mei Benjamin, vident quod os meum loquatur ad vos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nuntiate patri meo universam gloriam meam, et cuncta quæ vidistis in Ægypto : festinate, et adducite eum ad me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cumque amplexatus recidisset in collum Benjamin fratris sui, flevit : illo quoque similiter flente super collum ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Osculatusque est Joseph omnes fratres suos, et ploravit super singulos : post quæ ausi sunt loqui ad eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Auditumque est, et celebri sermone vulgatum in aula regis : Venerunt fratres Joseph : et gavisus est Pharao, atque omnis familia ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixitque ad Joseph ut imperaret fratribus suis, dicens : Onerantes jumenta, ite in terram Chanaan,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et tollite inde patrem vestrum et cognationem, et venite ad me : et ego dabo vobis omnia bona Ægypti, ut comedatis medullam terræ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Præcipe etiam ut tollant plaustra de terra Ægypti, ad subvectionem parvulorum suorum ac conjugum : et dicito : Tollite patrem vestrum, et properate quantocius venientes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Nec dimittatis quidquam de supellectili vestra : quia omnes opes Ægypti vestræ erunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Feceruntque filii Israël ut eis mandatum fuerat. Quibus dedit Joseph plaustra, secundum Pharaonis imperium, et cibaria in itinere.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Singulis quoque proferri jussit binas stolas : Benjamin vero dedit trecentos argenteos cum quinque stolis optimis :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>tantumdem pecuniæ et vestium mittens patri suo, addens et asinos decem, qui subveherent ex omnibus divitiis Ægypti, et totidem asinas, triticum in itinere, panesque portantes.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dimisit ergo fratres suos, et proficiscentibus ait : Ne irascamini in via.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui ascendentes ex Ægypto, venerunt in terram Chanaan ad patrem suum Jacob.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et nuntiaverunt ei, dicentes : Joseph filius tuus vivit : et ipse dominatur in omni terra Ægypti. Quo audito Jacob, quasi de gravi somno evigilans, tamen non credebat eis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Illi e contra referebant omnem ordinem rei. Cumque vidisset plaustra et universa quæ miserat, revixit spiritus ejus,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et ait : Sufficit mihi si adhuc Joseph filius meus vivit : vadam, et videbo illum antequam moriar.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/44/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 44</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/46/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 46</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->45<!-- --> of <!-- -->50<!-- --> · swipe left or rig pp-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"GEN.45\",{\"bookId\":1,\"usfm\":\"GEN\",\"bookName\":\"Genesis\",\"drName\":\"Genesis\",\"chapter\":45,\"totalChapters\":50,\"dra\":[{\"verse\":1,\"text\":\"Joseph could no longer refrain himself before many that stood by: whereupon he commanded that all should go out, and no stranger be present at their knowing one another.\"},{\"verse\":2,\"text\":\"And he lifted up his voice with weeping, which the Egyptians, and all the house of Pharao heard.\"},{\"verse\":3,\"text\":\"And he said to his brethren: I am Joseph: Is my father yet living? His brethren could not answer him, being struck with exceeding great fear.\"},{\"verse\":4,\"text\":\"And he said mildly to them: Come nearer to me. And when they were come near him, he said: I am Joseph, your brother, whom you sold into Egypt.\"},{\"verse\":5,\"text\":\"Be not afraid, and let it not seem to you a hard case that you sold me into these countries: for God sent me before you into Egypt for your preservation.\"},{\"verse\":6,\"text\":\"For it is two years since the famine began to be upon the land, and five years more remain, wherein there can be neither ploughing nor reaping.\"},{\"verse\":7,\"text\":\"And God sent me before, that you may be preserved upon the earth, and may have food to live.\"},{\"verse\":8,\"text\":\"Not by your counsel was I sent hither, but by the will of God: who hath made me as it were a father to Pharao, and lord of his whole house, and governor in all the land of Egypt.\"},{\"verse\":9,\"text\":\"Make haste, and go ye up to my father, and say to him: Thus saith thy son Joseph: God hath made me lord of the whole land of Egypt; come down to me, linger not.\"},{\"verse\":10,\"text\":\"And thou shalt dwell in the land of Gessen: and thou shalt be near me, thou and thy sons, and thy sons’ sons, thy sheep, and thy herds, and all things that thou hast.\"},{\"verse\":11,\"text\":\"And there I will feed thee, (for there are yet five years of famine remaining) lest both thou perish, and thy house, and all things that thou hast.\"},{\"verse\":12,\"text\":\"Behold, your eyes, and the eyes of my brother Benjamin, see that it is my mouth that speaketh to you.\"},{\"verse\":13,\"text\":\"You shall tell my father of all my glory, and all things that you have seen in Egypt: make haste and bring him to me.\"},{\"verse\":14,\"text\":\"And falling upon the neck of his brother Benjamin, he embraced him and wept: and Benjamin in like manner wept also on his neck.\"},{\"verse\":15,\"text\":\"And Joseph kissed all his brethren, and wept upon every one of them: after which they were emboldened to speak to him.\"},{\"verse\":16,\"text\":\"And it was heard, and the fame was spread abroad in the king’s court: The brethren of Joseph are come; and Pharao with all his family was glad.\"},{\"verse\":17,\"text\":\"And he spoke to Joseph that he should give orders to his brethren, saying: Load your beasts, and go into the land of Chanaan,\"},{\"verse\":18,\"text\":\"And bring away from thence your father and kindred, and come to me; and I will give you all the good things of Egypt, that you may eat the marrow of the land.\"},{\"verse\":19,\"text\":\"Give orders also that they take wagons out of the land of Egypt, for the carriage of their children and their wives; and say: Take up your father, and make haste to come with all speed:\"},{\"verse\":20,\"text\":\"And leave nothing of your household stuff; for all the riches of Egypt shall be yours.\"},{\"verse\":21,\"text\":\"And the sons of Israel did as they were bid. And Joseph gave them wagons according to Pharao’s commandment: and provisions for the way.\"},{\"verse\":22,\"text\":\"He ordered also to be brought out for every one of them two robes: but to Benjamin he gave three hundred pieces of silver, with five robes of the best:\"},{\"verse\":23,\"text\":\"Sending to his father as much money and raiment; adding besides, ten he-asses, to carry off all the riches of Egypt, and as many she-asses, carrying wheat and bread for the journey.\"},{\"verse\":24,\"text\":\"So he sent away his brethren, and at their departing said to them: Be not angry in the way.\"},{\"verse\":25,\"text\":\"And they went up out of Egypt, and came into the land of Chanaan, to their father Jacob.\"},{\"verse\":26,\"text\":\"And they told him, saying: Joseph, thy son, is living; and he is ruler in all the land of Egypt. Which when Jacob heard, he awaked as it were out of a deep sleep, yet did not believe them.\"},{\"verse\":27,\"text\":\"They, on the other side, told the whole order of the thing. And when he saw the wagons, and all that he had sent, his spirit revived,\"},{\"verse\":28,\"text\":\"And he said: It is enough for me if Joseph, my son, be yet living: I will go and see him before I die.\"}],\"vul\":[{\"verse\":1,\"text\":\"Non se poterat ultra cohibere Joseph multis coram astantibus : unde præcepit ut egrederentur cuncti foras, et nullus interesset alienus agnitioni mutuæ.\"},{\"verse\":2,\"text\":\"Elevavitque vocem cum fletu, quam audierunt Ægyptii, omnisque domus Pharaonis.\"},{\"verse\":3,\"text\":\"Et dixit fratribus suis : Ego sum Joseph : adhuc pater meus vivit ? Non poterant respondere fratres nimio terrore perterriti.\"},{\"verse\":4,\"text\":\"Ad quos ille clementer : Accedite, inquit, ad me. Et cum accessissent prope : Ego sum, ait, Joseph, frater vester, quem vendidistis in Ægyptum.\"},{\"verse\":5,\"text\":\"Nolite pavere, neque vobis durum esse videatur quod vendidistis me in his regionibus : pro salute enim vestra misit me Deus ante vos in Ægyptum.\"},{\"verse\":6,\"text\":\"Biennium est enim quod cœpit fames esse in terra : et adhuc quinque anni restant, quibus nec arari poterit, nec meti.\"},{\"verse\":7,\"text\":\"Præmisitque me Deus ut reservemini super terram, et escas ad vivendum habere possitis.\"},{\"verse\":8,\"text\":\"Non vestro consilio, sed Dei voluntate huc missus sum : qui fecit me quasi patrem Pharaonis, et dominum universæ domus ejus, ac principem in omni terra Ægypti.\"},{\"verse\":9,\"text\":\"Festinate, et ascendite ad patrem meum, et dicetis ei : Hæc mandat filius tuus Joseph : Deus fecit me dominum universæ terræ Ægypti : descende ad me, ne moreris,\"},{\"verse\":10,\"text\":\"et habitabis in terra Gessen : erisque juxta me tu, et filii tui, et filii filiorum tuorum, oves tuæ, et armenta tua, et universa quæ possides :\"},{\"verse\":11,\"text\":\"ibique te pascam (adhuc enim quinque anni residui sunt famis) ne et tu pereas, et domus tua, et omnia quæ possides.\"},{\"verse\":12,\"text\":\"En oculi vestri, et oculi fratris mei Benjamin, vident quod os meum loquatur ad vos.\"},{\"verse\":13,\"text\":\"Nuntiate patri meo universam gloriam meam, et cuncta quæ vidistis in Ægypto : festinate, et adducite eum ad me.\"},{\"verse\":14,\"text\":\"Cumque amplexatus recidisset in collum Benjamin fratris sui, flevit : illo quoque similiter flente super collum ejus.\"},{\"verse\":15,\"text\":\"Osculatusque est Joseph omnes fratres suos, et ploravit super singulos : post quæ ausi sunt loqui ad eum.\"},{\"verse\":16,\"text\":\"Auditumque est, et celebri sermone vulgatum in aula regis : Venerunt fratres Joseph : et gavisus est Pharao, atque omnis familia ejus.\"},{\"verse\":17,\"text\":\"Dixitque ad Joseph ut imperaret fratribus suis, dicens : Onerantes jumenta, ite in terram Chanaan,\"},{\"verse\":18,\"text\":\"et tollite inde patrem vestrum et cognationem, et venite ad me : et ego dabo vobis omnia bona Ægypti, ut comedatis medullam terræ.\"},{\"verse\":19,\"text\":\"Præcipe etiam ut tollant plaustra de terra Ægypti, ad subvectionem parvulorum suorum ac conjugum : et dicito : Tollite patrem vestrum, et properate quantocius venientes.\"},{\"verse\":20,\"text\":\"Nec dimittatis quidquam de supellectili vestra : quia omnes opes Ægypti vestræ erunt.\"},{\"verse\":21,\"text\":\"Feceruntque filii Israël ut eis mandatum fuerat. Quibus dedit Joseph plaustra, secundum Pharaonis imperium, et cibaria in itinere.\"},{\"verse\":22,\"text\":\"Singulis quoque proferri jussit binas stolas : Benjamin vero dedit trecentos argenteos cum quinque stolis optimis :\"},{\"verse\":23,\"text\":\"tantumdem pecuniæ et vestium mittens patri suo, addens et asinos decem, qui subveherent ex omnibus divitiis Ægypti, et totidem asinas, triticum in itinere, panesque portantes.\"},{\"verse\":24,\"text\":\"Dimisit ergo fratres suos, et proficiscentibus ait : Ne irascamini in via.\"},{\"verse\":25,\"text\":\"Qui ascendentes ex Ægypto, venerunt in terram Chanaan ad patrem suum Jacob.\"},{\"verse\":26,\"text\":\"Et nuntiaverunt ei, dicentes : Joseph filius tuus vivit : et ipse dominatur in omni terra Ægypti. Quo audito Jacob, quasi de gravi somno evigilans, tamen non credebat eis.\"},{\"verse\":27,\"text\":\"Illi e contra referebant omnem ordinem rei. Cumque vidisset plaustra et universa quæ miserat, revixit spiritus ejus,\"},{\"verse\":28,\"text\":\"et ait : Sufficit mihi si adhuc Joseph filius meus vivit : vadam, et videbo illum antequam moriar.\"}],\"summary\":\"Joseph maketh himself known to his brethren: and sendeth for his father.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":44,\"label\":\"Genesis 44\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":46,\"label\":\"Genesis 46\"}}]]\n"])</script></body></html>
