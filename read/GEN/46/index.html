tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">46</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Israel, warranted by a vision from God, goeth down into Egypt with all his family.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Israel taking his journey, with all that he had, came to the well of the oath, and killing victims there to the God of his father Isaac,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He heard him, by a vision in the night, calling him, and saying to him: Jacob, Jacob. And he answered him: Lo, here I am.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>God said to him: I am the most mighty God of thy father; fear not, go down into Egypt, for I will make a great nation of thee there.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I will go down with thee thither, and will bring thee back again from thence: Joseph also shall put his hands upon thy eyes.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Jacob rose up from the well of the oath: and his sons took him up, with their children and wives in the wagons, which Pharao had sent to carry the old man,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And all that he had in the land of Chanaan: and he came into Egypt with all his seed;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>His sons, and grandsons, daughters, and all his offspring together.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And these are the names of the children of Israel, that entered into Egypt, he and his children. His firstborn Ruben,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The sons of Ruben: Henoch and Phallu, and Hesron and Charmi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The sons of Simeon: Jamuel and Jamin and Ahod, and Jachin and Sohar, and Saul, the son of a woman of Chanaan.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The sons of Levi: Gerson and Caath, and Merari.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The sons of Juda: Her and Onan, and Sela, and Phares and Zara. And Her and Onan died in the land of Chanaan. And sons were born to Phares: Hesron and Hamul.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The sons of Issachar: Thola and Phua, and Job and Semron.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The sons of Zabulon: Sared, and Elon, and Jahelel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>These are the sons of Lia, whom she bore in Mesopotamia of Syria, with Dina, his daughter. All the souls of her sons and daughters, thirty-three.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The sons of Gad: Sephion and Haggi, and Suni and Esebon, and Heri and Arodi, and Areli.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The sons of Aser: Jamne and Jesua, and Jessuri and Beria, and Sara their sister. The sons of Beria: Heber and Melchiel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>These are the sons of Zelpha, whom Laban gave to Lia, his daughter. And these she bore to Jacob, sixteen souls.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The sons of Rachel, Jacob’s wife: Joseph and Benjamin.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And sons were born to Joseph, in the land of Egypt, whom Aseneth, the daughter of Putiphare, priest of Heliopolis, bore him: Manasses and Ephraim.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The sons of Benjamin: Bela and Bechor, and Asbel and Gera, and Naaman and Echi, and Ross and Mophim, and Ophim and Ared.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>These are the sons of Rachel, whom she bore to Jacob: all the souls, fourteen.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The sons of Dan: Husim.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The sons of Nephthali: Jaziel and Guni, and Jeser and Sallem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>These are the sons of Bala, whom Laban gave to Rachel, his daughter: and these she bore to Jacob: all the souls, seven.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>All the souls that went with Jacob into Egypt, and that came out of his thigh, besides his sons’ wives, sixty-six.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the sons of Joseph, that were born to him in the land of Egypt, two souls. All the souls of the house of Jacob, that entered into Egypt, were seventy.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he sent Juda before him to Joseph, to tell him; and that he should meet him in Gessen.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And when he was come thither, Joseph made ready his chariot, and went up to meet his father in the same place: and seeing him, he fell upon his neck, and embracing him, wept.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the father said to Joseph: Now shall I die with joy, because I have seen thy face, and leave thee alive.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Joseph said to his brethren, and to all his father’s house: I will go up, and will tell Pharao, and will say to him: My brethren, and my father’s house, that were in the land of Chanaan, are come to me:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And the men are shepherds, and their occupation is to feed cattle; their flocks, and herds, and all they have, they have brought with them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And when he shall call you, and shall say: What is your occupation?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>You shall answer: We, thy servants, are shepherds, from our infancy until now, both we and our fathers. And this you shall say, that you may dwell in the land of Gessen, because the Egyptians have all shepherds in abomination.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Profectusque Israël cum omnibus quæ habebat, venit ad Puteum juramenti : et mactatis ibi victimis Deo patris sui Isaac,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>audivit eum per visionem noctis vocantem se, et dicentem sibi : Jacob, Jacob. Cui respondit : Ecce adsum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ait illi Deus : Ego sum fortissimus Deus patris tui : noli timere, descende in Ægyptum, quia in gentem magnam faciam te ibi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ego descendam tecum illuc, et ego inde adducam te revertentem : Joseph quoque ponet manus suas super oculos tuos.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Surrexit autem Jacob a Puteo juramenti : tuleruntque eum filii cum parvulis et uxoribus suis in plaustris quæ miserat Pharao ad portandum senem,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et omnia quæ possederat in terra Chanaan : venitque in Ægyptum cum omni semine suo,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>filii ejus, et nepotes, filiæ, et cuncta simul progenies.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Hæc sunt autem nomina filiorum Israël, qui ingressi sunt in Ægyptum, ipse cum liberis suis. Primogenitus Ruben.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Filii Ruben : Henoch et Phallu et Hesron et Charmi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Filii Simeon : Jamuel et Jamin et Ahod, et Jachin et Sohar, et Saul filius Chanaanitidis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Filii Levi : Gerson et Caath et Merari.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Filii Juda : Her et Onan et Sela et Phares et Zara ; mortui sunt autem Her et Onan in terra Chanaan. Natique sunt filii Phares : Hesron et Hamul.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Filii Issachar : Thola et Phua et Job et Semron.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Filii Zabulon : Sared et Elon et Jahelel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hi filii Liæ quos genuit in Mesopotamia Syriæ cum Dina filia sua : omnes animæ filiorum ejus et filiarum, triginta tres.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Filii Gad : Sephion et Haggi et Suni et Esebon et Heri et Arodi et Areli.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Filii Aser : Jamne et Jesua et Jessui et Beria, Sara quoque soror eorum. Filii Beria : Heber et Melchiel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hi filii Zelphæ, quam dedit Laban Liæ filiæ suæ : et hos genuit Jacob sedecim animas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Filii Rachel uxoris Jacob : Joseph et Benjamin.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Natique sunt Joseph filii in terra Ægypti, quos genuit ei Aseneth filia Putiphare sacerdotis Heliopoleos : Manasses et Ephraim.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Filii Benjamin : Bela et Bechor et Asbel et Gera et Naaman et Echi et Ros et Mophim et Ophim et Ared.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hi filii Rachel quos genuit Jacob : omnes animæ, quatuordecim.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Filii Dan : Husim.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Filii Nephthali : Jasiel et Guni et Jeser et Sallem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hi filii Balæ, quam dedit Laban Racheli filiæ suæ : et hos genuit Jacob : omnes animæ, septem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cunctæ animæ, quæ ingressæ sunt cum Jacob in Ægyptum, et egressæ sunt de femore illius, absque uxoribus filiorum ejus, sexaginta sex.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Filii autem Joseph, qui nati sunt ei in terra Ægypti, animæ duæ. Omnes animæ domus Jacob, quæ ingressæ sunt in Ægyptum, fuere septuaginta.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Misit autem Judam ante se ad Joseph, ut nuntiaret ei, et occurreret in Gessen.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quo cum pervenisset, juncto Joseph curro suo, ascendit obviam patri suo ad eumdem locum : vidensque eum, irruit super collum ejus, et inter amplexus flevit.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Dixitque pater ad Joseph : Jam lætus moriar, quia vidi faciem tuam, et superstitem te relinquo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>At ille locutus est ad fratres suos, et ad omnem domum patris sui : Ascendam, et nuntiabo Pharaoni, dicamque ei : Fratres mei, et domus patris mei, qui erant in terra Chanaan, venerunt ad me :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et sunt viri pastores ovium, curamque habent alendorum gregum : pecora sua, et armenta, et omnia quæ habere potuerunt, adduxerunt secum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Cumque vocaverit vos, et dixerit : Quod est opus vestrum ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>respondebitis : Viri pastores sumus servi tui, ab infantia nostra usque in præsens, et nos et patres nostri. Hæc autem dicetis, ut habitare possitis in terra Gessen : quia detestantur Ægyptii omnes pastores ovium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/45/"><svg viewBox="0 0 24 24" fill="none" stroke="curre ael taking his journey, with all that he had, came to the well of the oath, and killing victims there to the God of his father Isaac,\"},{\"verse\":2,\"text\":\"He heard him, by a vision in the night, calling him, and saying to him: Jacob, Jacob. And he answered him: Lo, here I am.\"},{\"verse\":3,\"text\":\"God said to him: I am the most mighty God of thy father; fear not, go down into Egypt, for I will make a great nation of thee there.\"},{\"verse\":4,\"text\":\"I will go down with thee thither, and will bring thee back again from thence: Joseph also shall put his hands upon thy eyes.\"},{\"verse\":5,\"text\":\"And Jacob rose up from the well of the oath: and his sons took him up, with their children and wives in the wagons, which Pharao had sent to carry the old man,\"},{\"verse\":6,\"text\":\"And all that he had in the land of Chanaan: and he came into Egypt with all his seed;\"},{\"verse\":7,\"text\":\"His sons, and grandsons, daughters, and all his offspring together.\"},{\"verse\":8,\"text\":\"And these are the names of the children of Israel, that entered into Egypt, he and his children. His firstborn Ruben,\"},{\"verse\":9,\"text\":\"The sons of Ruben: Henoch and Phallu, and Hesron and Charmi.\"},{\"verse\":10,\"text\":\"The sons of Simeon: Jamuel and Jamin and Ahod, and Jachin and Sohar, and Saul, the son of a woman of Chanaan.\"},{\"verse\":11,\"text\":\"The sons of Levi: Gerson and Caath, and Merari.\"},{\"verse\":12,\"text\":\"The sons of Juda: Her and Onan, and Sela, and Phares and Zara. And Her and Onan died in the land of Chanaan. And sons were born to Phares: Hesron and Hamul.\"},{\"verse\":13,\"text\":\"The sons of Issachar: Thola and Phua, and Job and Semron.\"},{\"verse\":14,\"text\":\"The sons of Zabulon: Sared, and Elon, and Jahelel.\"},{\"verse\":15,\"text\":\"These are the sons of Lia, whom she bore in Mesopotamia of Syria, with Dina, his daughter. All the souls of her sons and daughters, thirty-three.\"},{\"verse\":16,\"text\":\"The sons of Gad: Sephion and Haggi, and Suni and Esebon, and Heri and Arodi, and Areli.\"},{\"verse\":17,\"text\":\"The sons of Aser: Jamne and Jesua, and Jessuri and Beria, and Sara their sister. The sons of Beria: Heber and Melchiel.\"},{\"verse\":18,\"text\":\"These are the sons of Zelpha, whom Laban gave to Lia, his daughter. And these she bore to Jacob, sixteen souls.\"},{\"verse\":19,\"text\":\"The sons of Rachel, Jacob’s wife: Joseph and Benjamin.\"},{\"verse\":20,\"text\":\"And sons were born to Joseph, in the land of Egypt, whom Aseneth, the daughter of Putiphare, priest of Heliopolis, bore him: Manasses and Ephraim.\"},{\"verse\":21,\"text\":\"The sons of Benjamin: Bela and Bechor, and Asbel and Gera, and Naaman and Echi, and Ross and Mophim, and Ophim and Ared.\"},{\"verse\":22,\"text\":\"These are the sons of Rachel, whom she bore to Jacob: all the souls, fourteen.\"},{\"verse\":23,\"text\":\"The sons of Dan: Husim.\"},{\"verse\":24,\"text\":\"The sons of Nephthali: Jaziel and Guni, and Jeser and Sallem.\"},{\"verse\":25,\"text\":\"These are the sons of Bala, whom Laban gave to Rachel, his daughter: and these she bore to Jacob: all the souls, seven.\"},{\"verse\":26,\"text\":\"All the souls that went with Jacob into Egypt, and that came out of his thigh, besides his sons’ wives, sixty-six.\"},{\"verse\":27,\"text\":\"And the sons of Joseph, that were born to him in the land of Egypt, two souls. All the souls of the house of Jacob, that entered into Egypt, were seventy.\"},{\"verse\":28,\"text\":\"And he sent Juda before him to Joseph, to tell him; and that he should meet him in Gessen.\"},{\"verse\":29,\"text\":\"And when he was come thither, Joseph made ready his chariot, and went up to meet his father in the same place: and seeing him, he fell upon his neck, and embracing him, wept.\"},{\"verse\":30,\"text\":\"And the father said to Joseph: Now shall I die with joy, because I have seen thy face, and leave thee alive.\"},{\"verse\":31,\"text\":\"And Joseph said to his brethren, and to all his father’s house: I will go up, and will tell Pharao, and will say to him: My brethren, and my father’s house, that were in the land of Chanaan, are come to me:\"},{\"verse\":32,\"text\":\"And the men are shepherds, and their occupation is to feed cattle; their flocks, and herds, and all they have, they have brought with them.\"},{\"verse\":33,\"text\":\"And when he shall call you, and shall say: What is your occupation?\"},{\"verse\":34,\"text\":\"You shall answer: We, thy servants, are shepherds, from our infancy until now, both we and our fathers. And this you shall say, that you may dwell in the land of Gessen, because the Egyptians have all shepherds in abomination.\"}],\"vul\":[{\"verse\":1,\"text\":\"Profectusque Israël cum omnibus quæ habebat, venit ad Puteum juramenti : et mactatis ibi victimis Deo patris sui Isaac,\"},{\"verse\":2,\"text\":\"audivit eum per visionem noctis vocantem se, et dicentem sibi : Jacob, Jacob. Cui respondit : Ecce adsum.\"},{\"verse\":3,\"text\":\"Ait illi Deus : Ego sum fortissimus Deus patris tui : noli timere, descende in Ægyptum, quia in gentem magnam faciam te ibi.\"},{\"verse\":4,\"text\":\"Ego descendam tecum illuc, et ego inde adducam te revertentem : Joseph quoque ponet manus suas super oculos tuos.\"},{\"verse\":5,\"text\":\"Surrexit autem Jacob a Puteo juramenti : tuleruntque eum filii cum parvulis et uxoribus suis in plaustris quæ miserat Pharao ad portandum senem,\"},{\"verse\":6,\"text\":\"et omnia quæ possederat in terra Chanaan : venitque in Ægyptum cum omni semine suo,\"},{\"verse\":7,\"text\":\"filii ejus, et nepotes, filiæ, et cuncta simul progenies.\"},{\"verse\":8,\"text\":\"Hæc sunt autem nomina filiorum Israël, qui ingressi sunt in Ægyptum, ipse cum liberis suis. Primogenitus Ruben.\"},{\"verse\":9,\"text\":\"Filii Ruben : Henoch et Phallu et Hesron et Charmi.\"},{\"verse\":10,\"text\":\"Filii Simeon : Jamuel et Jamin et Ahod, et Jachin et Sohar, et Saul filius Chanaanitidis.\"},{\"verse\":11,\"text\":\"Filii Levi : Gerson et Caath et Merari.\"},{\"verse\":12,\"text\":\"Filii Juda : Her et Onan et Sela et Phares et Zara ; mortui sunt autem Her et Onan in terra Chanaan. Natique sunt filii Phares : Hesron et Hamul.\"},{\"verse\":13,\"text\":\"Filii Issachar : Thola et Phua et Job et Semron.\"},{\"verse\":14,\"text\":\"Filii Zabulon : Sared et Elon et Jahelel.\"},{\"verse\":15,\"text\":\"Hi filii Liæ quos genuit in Mesopotamia Syriæ cum Dina filia sua : omnes animæ filiorum ejus et filiarum, triginta tres.\"},{\"verse\":16,\"text\":\"Filii Gad : Sephion et Haggi et Suni et Esebon et Heri et Arodi et Areli.\"},{\"verse\":17,\"text\":\"Filii Aser : Jamne et Jesua et Jessui et Beria, Sara quoque soror eorum. Filii Beria : Heber et Melchiel.\"},{\"verse\":18,\"text\":\"Hi filii Zelphæ, quam dedit Laban Liæ filiæ suæ : et hos genuit Jacob sedecim animas.\"},{\"verse\":19,\"text\":\"Filii Rachel uxoris Jacob : Joseph et Benjamin.\"},{\"verse\":20,\"text\":\"Natique sunt Joseph filii in terra Ægypti, quos genuit ei Aseneth filia Putiphare sacerdotis Heliopoleos : Manasses et Ephraim.\"},{\"verse\":21,\"text\":\"Filii Benjamin : Bela et Bechor et Asbel et Gera et Naaman et Echi et Ros et Mophim et Ophim et Ared.\"},{\"verse\":22,\"text\":\"Hi filii Rachel quos genuit Jacob : omnes animæ, quatuordecim.\"},{\"verse\":23,\"text\":\"Filii Dan : Husim.\"},{\"verse\":24,\"text\":\"Filii Nephthali : Jasiel et Guni et Jeser et Sallem.\"},{\"verse\":25,\"text\":\"Hi filii Balæ, quam dedit Laban Racheli filiæ suæ : et hos genuit Jacob : omnes animæ, septem.\"},{\"verse\":26,\"text\":\"Cunctæ animæ, quæ ingressæ sunt cum Jacob in Ægyptum, et egressæ sunt de femore illius, absque uxoribus filiorum ejus, sexaginta sex.\"},{\"verse\":27,\"text\":\"Filii autem Joseph, qui nati sunt ei in terra Ægypti, animæ duæ. Omnes animæ domus Jacob, quæ ingressæ sunt in Ægyptum, fuere septuaginta.\"},{\"verse\":28,\"text\":\"Misit autem Judam ante se ad Joseph, ut nuntiaret ei, et occurreret in Gessen.\"},{\"verse\":29,\"text\":\"Quo cum pervenisset, juncto Joseph curro suo, ascendit obviam patri suo ad eumdem locum : vidensque eum, irruit super collum ejus, et inter amplexus flevit.\"},{\"verse\":30,\"text\":\"Dixitque pater ad Joseph : Jam lætus moriar, quia vidi faciem tuam, et superstitem te relinquo.\"},{\"verse\":31,\"text\":\"At ille locutus est ad fratres suos, et ad omnem domum patris sui : Ascendam, et nuntiabo Pharaoni, dicamque ei : Fratres mei, et domus patris mei, qui erant in terra Chanaan, venerunt ad me :\"},{\"verse\":32,\"text\":\"et sunt viri pastores ovium, curamque habent alendorum gregum : pecora sua, et armenta, et omnia quæ habere potuerunt, adduxerunt secum.\"},{\"verse\":33,\"text\":\"Cumque vocaverit vos, et dixerit : Quod est opus vestrum ?\"},{\"verse\":34,\"text\":\"respondebitis : Viri pastores sumus servi tui, ab infantia nostra usque in præsens, et nos et patres nostri. Hæc autem dicetis, ut habitare possitis in terra Gessen : quia detestantur Ægyptii omnes pastores ovium.\"}],\"summary\":\"Israel, warranted by a vision from God, goeth down into Egypt with all his family.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":45,\"label\":\"Genesis 45\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":47,\"label\":\"Genesis 47\"}}]]\n"])</script></body></html>
