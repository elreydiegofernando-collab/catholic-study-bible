tholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">42</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/GEN/">About <!-- -->Genesis</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Jacob sendeth his ten sons to buy corn in Egypt. Their treatment by Joseph.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jacob hearing that food was sold in Egypt, said to his sons: Why are ye careless?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I have heard that wheat is sold in Egypt: Go ye down, and buy us necessaries, that we may live, and not be consumed with want.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>So the ten brethren of Joseph went down, to buy corn in Egypt:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Whilst Benjamin was kept at home by Jacob, who said to his brethren: Lest perhaps he take any harm in the journey.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they entered into the land of Egypt with others that went to buy. For the famine was in the land of Chanaan.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Joseph was governor in the land of Egypt, and corn was sold by his direction to the people. And when his brethren had bowed down to him,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he knew them, he spoke as it were to strangers, somewhat roughly, asking them: Whence came you? They answered: From the land of Chanaan, to buy necessaries of life.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And though he knew his brethren, he was not known by them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And remembering the dreams, which formerly he had dreamed, he said to them: You are spies. You are come to view the weaker parts of the land.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But they said: It is not so, my lord; but thy servants are come to buy food.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>We are all the sons of one man: we are come as peaceable men, neither do thy servants go about any evil.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he answered them: It is otherwise: you are come to consider the unfenced parts of this land.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But they said: We thy servants are twelve brethren, the sons of one man in the land of Chanaan: the youngest is with our father, the other is not living.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He saith, This is it that I said: You are spies.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I shall now presently try what you are: by the health of Pharao, you shall not depart hence, until your youngest brother come.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Send one of you to fetch him: and you shall be in prison, till what you have said be proved, whether it be true or false: or else by the health of Pharao you are spies.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>So he put them in prison three days.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the third day he brought them out of prison, and said: Do as I have said, and you shall live: for I fear God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If you be peaceable men, let one of your brethren be bound in prison: and go ye your ways, and carry the corn that you have bought, unto your houses.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And bring your youngest brother to me, that I may find your words to be true, and you may not die. They did as he had said.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they talked one to another: We deserve to suffer these things, because we have sinned against our brother, seeing the anguish of his soul, when he besought us, and we would not hear: therefore is this affliction come upon us.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Ruben, one of them, said: Did not I say to you: Do not sin against the boy; and you would not hear me? Behold his blood is required.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they knew not that Joseph understood, because he spoke to them by an interpreter.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he turned himself away a little while, and wept: and returning, he spoke to them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And taking Simeon, and binding him in their presence, he commanded his servants to fill their sacks with wheat, and to put every man’s money again in their sacks, and to give them besides provisions for the way: and they did so.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But they having loaded their asses with the corn went their way.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And one of them opening his sack, to give his beast provender in the inn, saw the money in the sack’s mouth,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And said to his brethren: My money is given me again; behold it is in the sack. And they were astonished, and troubled, and said to one another: What is this that God hath done unto us?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they came to Jacob their father in the land of Chanaan, and they told him all things that had befallen them, saying:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The lord of the land spoke roughly to us, and took us to be spies of the country.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And we answered him: We are peaceable men, and we mean no plot.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>We are twelve brethren born of one father: one is not living, the youngest is with our father in the land of Chanaan.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And he said to us: Hereby shall I know that you are peaceable men: Leave one of your brethren with me, and take ye necessary provision for your houses, and go your ways,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And bring your youngest brother to me, that I may know you are not spies: and you may receive this man again, that is kept in prison: and afterwards may have leave to buy what you will.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>When they had told this, they poured out their corn, and every man found his money tied in the mouth of his sack: and all being astonished together,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Their father Jacob said: You have made me to be without children: Joseph is not living, Simeon is kept in bonds, and Benjamin you will take away: all these evils are fallen upon me.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Ruben answered him: Kill my two sons, if I bring him not again to thee: deliver him into my hand, and I will restore him to thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But he said: My son shall not go down with you: his brother is dead, and he is left alone: if any mischief befall him in the land to which you go, you will bring down my grey hairs with sorrow to hell.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audiens autem Jacob quod alimenta venderentur in Ægypto, dixit filiis suis : Quare negligitis ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>audivi quod triticum venundetur in Ægypto : descendite, et emite nobis necessaria, ut possimus vivere, et non consumamur inopia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Descendentes igitur fratres Joseph decem, ut emerent frumenta in Ægypto,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Benjamin domi retento a Jacob, qui dixerat fratribus ejus : Ne forte in itinere quidquam patiatur mali :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ingressi sunt terram Ægypti cum aliis qui pergebant ad emendum. Erat autem fames in terra Chanaan.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et Joseph erat princeps in terra Ægypti, atque ad ejus nutum frumenta populis vendebantur. Cumque adorassent eum fratres sui,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et agnovisset eos, quasi ad alienos durius loquebatur, interrogans eos : Unde venistis ? Qui responderunt : De terra Chanaan, ut emamus victui necessaria.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et tamen fratres ipse cognoscens, non est cognitus ab eis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Recordatusque somniorum, quæ aliquando viderat, ait ad eos : Exploratores estis : ut videatis infirmiora terræ venistis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui dixerunt : Non est ita, domine, sed servi tui venerunt ut emerent cibos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Omnes filii unius viri sumus : pacifici venimus, nec quidquam famuli tui machinantur mali.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quibus ille respondit : Aliter est : immunita terræ hujus considerare venistis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At illi : Duodecim, inquiunt, servi tui, fratres sumus, filii viri unius in terra Chanaan : minimus cum patre nostro est, alius non est super.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hoc est, ait, quod locutus sum : exploratores estis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Jam nunc experimentum vestri capiam : per salutem Pharaonis non egrediemini hinc, donec veniat frater vester minimus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mittite ex vobis unum, et adducat eum : vos autem eritis in vinculis, donec probentur quæ dixistis utrum vera an falsa sint : alioquin per salutem Pharaonis exploratores estis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Tradidit ergo illos custodiæ tribus diebus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Die autem tertio eductis de carcere, ait : Facite quæ dixi, et vivetis : Deum enim timeo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Si pacifici estis, frater vester unus ligetur in carcere : vos autem abite, et ferte frumenta quæ emistis, in domos vestras,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et fratrem vestrum minimum ad me adducite, ut possim vestros probare sermones, et non moriamini. Fecerunt ut dixerat,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et locuti sunt ad invicem : Merito hæc patimur, quia peccavimus in fratrem nostrum, videntes angustiam animæ illius, dum deprecaretur nos, et non audivimus : idcirco venit super nos ista tribulatio.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>E quibus unus Ruben, ait : Numquid non dixi vobis : Nolite peccare in puerum : et non audistis me ? en sanguis ejus exquiritur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Nesciebant autem quod intelligeret Joseph, eo quod per interpretem loqueretur ad eos.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Avertitque se parumper, et flevit : et reversus locutus est ad eos.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Tollensque Simeon, et ligans illis præsentibus, jussit ministris ut implerent eorum saccos tritico, et reponerent pecunias singulorum in sacculis suis, datis supra cibariis in viam : qui fecerunt ita.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>At illi portantes frumenta in asinis suis, profecti sunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Apertoque unus sacco, ut daret jumento pabulum in diversorio, contemplatus pecuniam in ore sacculi,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>dixit fratribus suis : Reddita est mihi pecunia, en habetur in sacco. Et obstupefacti, turbatique, mutuo dixerunt : Quidnam est hoc quod fecit nobis Deus ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Veneruntque ad Jacob patrem suum in terram Chanaan, et narraverunt ei omnia quæ accidissent sibi, dicentes :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Locutus est nobis dominus terræ dure, et putavit nos exploratores esse provinciæ.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cui respondimus : Pacifici sumus, nec ullas molimur insidias.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Duodecim fratres uno patre geniti sumus : unus non est super, minimus cum patre nostro est in terra Chanaan.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Qui ait nobis : Sic probabo quod pacifici sitis : fratrem vestrum unum dimittite apud me, et cibaria domibus vestris necessaria sumite, et abite,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>fratremque vestrum minimum adducite ad me, ut sciam quod non sitis exploratores : et istum, qui tenetur in vinculis, recipere possitis : ac deinceps quæ vultis, emendi habeatis licentiam.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>His dictis, cum frumenta effunderent, singuli repererunt in ore saccorum ligatas pecunias, exterritisque simul omnibus,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>dixit pater Jacob : Absque liberis me esse fecistis : Joseph non est super, Simeon tenetur in vinculis, et Benjamin auferetis : in me hæc omnia mala reciderunt.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Cui respondit Ruben : Duos filios meos interfice, si non reduxero illum tibi : trade illum in manu mea, et ego eum tibi restituam.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>At ille : Non descendet, inquit, filius meus vobiscum : frater ejus mortuus est, et ipse solus remansit : si quid ei adversi acciderit in terra ad quam pergitis, deducetis canos meos cum dolore ad inferos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/41/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 41</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/43/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Genesis 43</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->42<!-- --> of <!-- -->50<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3">  servants are come to buy food.\"},{\"verse\":11,\"text\":\"We are all the sons of one man: we are come as peaceable men, neither do thy servants go about any evil.\"},{\"verse\":12,\"text\":\"And he answered them: It is otherwise: you are come to consider the unfenced parts of this land.\"},{\"verse\":13,\"text\":\"But they said: We thy servants are twelve brethren, the sons of one man in the land of Chanaan: the youngest is with our father, the other is not living.\"},{\"verse\":14,\"text\":\"He saith, This is it that I said: You are spies.\"},{\"verse\":15,\"text\":\"I shall now presently try what you are: by the health of Pharao, you shall not depart hence, until your youngest brother come.\"},{\"verse\":16,\"text\":\"Send one of you to fetch him: and you shall be in prison, till what you have said be proved, whether it be true or false: or else by the health of Pharao you are spies.\"},{\"verse\":17,\"text\":\"So he put them in prison three days.\"},{\"verse\":18,\"text\":\"And the third day he brought them out of prison, and said: Do as I have said, and you shall live: for I fear God.\"},{\"verse\":19,\"text\":\"If you be peaceable men, let one of your brethren be bound in prison: and go ye your ways, and carry the corn that you have bought, unto your houses.\"},{\"verse\":20,\"text\":\"And bring your youngest brother to me, that I may find your words to be true, and you may not die. They did as he had said.\"},{\"verse\":21,\"text\":\"And they talked one to another: We deserve to suffer these things, because we have sinned against our brother, seeing the anguish of his soul, when he besought us, and we would not hear: therefore is this affliction come upon us.\"},{\"verse\":22,\"text\":\"And Ruben, one of them, said: Did not I say to you: Do not sin against the boy; and you would not hear me? Behold his blood is required.\"},{\"verse\":23,\"text\":\"And they knew not that Joseph understood, because he spoke to them by an interpreter.\"},{\"verse\":24,\"text\":\"And he turned himself away a little while, and wept: and returning, he spoke to them.\"},{\"verse\":25,\"text\":\"And taking Simeon, and binding him in their presence, he commanded his servants to fill their sacks with wheat, and to put every man’s money again in their sacks, and to give them besides provisions for the way: and they did so.\"},{\"verse\":26,\"text\":\"But they having loaded their asses with the corn went their way.\"},{\"verse\":27,\"text\":\"And one of them opening his sack, to give his beast provender in the inn, saw the money in the sack’s mouth,\"},{\"verse\":28,\"text\":\"And said to his brethren: My money is given me again; behold it is in the sack. And they were astonished, and troubled, and said to one another: What is this that God hath done unto us?\"},{\"verse\":29,\"text\":\"And they came to Jacob their father in the land of Chanaan, and they told him all things that had befallen them, saying:\"},{\"verse\":30,\"text\":\"The lord of the land spoke roughly to us, and took us to be spies of the country.\"},{\"verse\":31,\"text\":\"And we answered him: We are peaceable men, and we mean no plot.\"},{\"verse\":32,\"text\":\"We are twelve brethren born of one father: one is not living, the youngest is with our father in the land of Chanaan.\"},{\"verse\":33,\"text\":\"And he said to us: Hereby shall I know that you are peaceable men: Leave one of your brethren with me, and take ye necessary provision for your houses, and go your ways,\"},{\"verse\":34,\"text\":\"And bring your youngest brother to me, that I may know you are not spies: and you may receive this man again, that is kept in prison: and afterwards may have leave to buy what you will.\"},{\"verse\":35,\"text\":\"When they had told this, they poured out their corn, and every man found his money tied in the mouth of his sack: and all being astonished together,\"},{\"verse\":36,\"text\":\"Their father Jacob said: You have made me to be without children: Joseph is not living, Simeon is kept in bonds, and Benjamin you will take away: all these evils are fallen upon me.\"},{\"verse\":37,\"text\":\"And Ruben answered him: Kill my two sons, if I bring him not again to thee: deliver him into my hand, and I will restore him to thee.\"},{\"verse\":38,\"text\":\"But he said: My son shall not go down with you: his brother is dead, and he is left alone: if any mischief befall him in the land to which you go, you will bring down my grey hairs with sorrow to hell.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audiens autem Jacob quod alimenta venderentur in Ægypto, dixit filiis suis : Quare negligitis ?\"},{\"verse\":2,\"text\":\"audivi quod triticum venundetur in Ægypto : descendite, et emite nobis necessaria, ut possimus vivere, et non consumamur inopia.\"},{\"verse\":3,\"text\":\"Descendentes igitur fratres Joseph decem, ut emerent frumenta in Ægypto,\"},{\"verse\":4,\"text\":\"Benjamin domi retento a Jacob, qui dixerat fratribus ejus : Ne forte in itinere quidquam patiatur mali :\"},{\"verse\":5,\"text\":\"ingressi sunt terram Ægypti cum aliis qui pergebant ad emendum. Erat autem fames in terra Chanaan.\"},{\"verse\":6,\"text\":\"Et Joseph erat princeps in terra Ægypti, atque ad ejus nutum frumenta populis vendebantur. Cumque adorassent eum fratres sui,\"},{\"verse\":7,\"text\":\"et agnovisset eos, quasi ad alienos durius loquebatur, interrogans eos : Unde venistis ? Qui responderunt : De terra Chanaan, ut emamus victui necessaria.\"},{\"verse\":8,\"text\":\"Et tamen fratres ipse cognoscens, non est cognitus ab eis.\"},{\"verse\":9,\"text\":\"Recordatusque somniorum, quæ aliquando viderat, ait ad eos : Exploratores estis : ut videatis infirmiora terræ venistis.\"},{\"verse\":10,\"text\":\"Qui dixerunt : Non est ita, domine, sed servi tui venerunt ut emerent cibos.\"},{\"verse\":11,\"text\":\"Omnes filii unius viri sumus : pacifici venimus, nec quidquam famuli tui machinantur mali.\"},{\"verse\":12,\"text\":\"Quibus ille respondit : Aliter est : immunita terræ hujus considerare venistis.\"},{\"verse\":13,\"text\":\"At illi : Duodecim, inquiunt, servi tui, fratres sumus, filii viri unius in terra Chanaan : minimus cum patre nostro est, alius non est super.\"},{\"verse\":14,\"text\":\"Hoc est, ait, quod locutus sum : exploratores estis.\"},{\"verse\":15,\"text\":\"Jam nunc experimentum vestri capiam : per salutem Pharaonis non egrediemini hinc, donec veniat frater vester minimus.\"},{\"verse\":16,\"text\":\"Mittite ex vobis unum, et adducat eum : vos autem eritis in vinculis, donec probentur quæ dixistis utrum vera an falsa sint : alioquin per salutem Pharaonis exploratores estis.\"},{\"verse\":17,\"text\":\"Tradidit ergo illos custodiæ tribus diebus.\"},{\"verse\":18,\"text\":\"Die autem tertio eductis de carcere, ait : Facite quæ dixi, et vivetis : Deum enim timeo.\"},{\"verse\":19,\"text\":\"Si pacifici estis, frater vester unus ligetur in carcere : vos autem abite, et ferte frumenta quæ emistis, in domos vestras,\"},{\"verse\":20,\"text\":\"et fratrem vestrum minimum ad me adducite, ut possim vestros probare sermones, et non moriamini. Fecerunt ut dixerat,\"},{\"verse\":21,\"text\":\"et locuti sunt ad invicem : Merito hæc patimur, quia peccavimus in fratrem nostrum, videntes angustiam animæ illius, dum deprecaretur nos, et non audivimus : idcirco venit super nos ista tribulatio.\"},{\"verse\":22,\"text\":\"E quibus unus Ruben, ait : Numquid non dixi vobis : Nolite peccare in puerum : et non audistis me ? en sanguis ejus exquiritur.\"},{\"verse\":23,\"text\":\"Nesciebant autem quod intelligeret Joseph, eo quod per interpretem loqueretur ad eos.\"},{\"verse\":24,\"text\":\"Avertitque se parumper, et flevit : et reversus locutus est ad eos.\"},{\"verse\":25,\"text\":\"Tollensque Simeon, et ligans illis præsentibus, jussit ministris ut implerent eorum saccos tritico, et reponerent pecunias singulorum in sacculis suis, datis supra cibariis in viam : qui fecerunt ita.\"},{\"verse\":26,\"text\":\"At illi portantes frumenta in asinis suis, profecti sunt.\"},{\"verse\":27,\"text\":\"Apertoque unus sacco, ut daret jumento pabulum in diversorio, contemplatus pecuniam in ore sacculi,\"},{\"verse\":28,\"text\":\"dixit fratribus suis : Reddita est mihi pecunia, en habetur in sacco. Et obstupefacti, turbatique, mutuo dixerunt : Quidnam est hoc quod fecit nobis Deus ?\"},{\"verse\":29,\"text\":\"Veneruntque ad Jacob patrem suum in terram Chanaan, et narraverunt ei omnia quæ accidissent sibi, dicentes :\"},{\"verse\":30,\"text\":\"Locutus est nobis dominus terræ dure, et putavit nos exploratores esse provinciæ.\"},{\"verse\":31,\"text\":\"Cui respondimus : Pacifici sumus, nec ullas molimur insidias.\"},{\"verse\":32,\"text\":\"Duodecim fratres uno patre geniti sumus : unus non est super, minimus cum patre nostro est in terra Chanaan.\"},{\"verse\":33,\"text\":\"Qui ait nobis : Sic probabo quod pacifici sitis : fratrem vestrum unum dimittite apud me, et cibaria domibus vestris necessaria sumite, et abite,\"},{\"verse\":34,\"text\":\"fratremque vestrum minimum adducite ad me, ut sciam quod non sitis exploratores : et istum, qui tenetur in vinculis, recipere possitis : ac deinceps quæ vultis, emendi habeatis licentiam.\"},{\"verse\":35,\"text\":\"His dictis, cum frumenta effunderent, singuli repererunt in ore saccorum ligatas pecunias, exterritisque simul omnibus,\"},{\"verse\":36,\"text\":\"dixit pater Jacob : Absque liberis me esse fecistis : Joseph non est super, Simeon tenetur in vinculis, et Benjamin auferetis : in me hæc omnia mala reciderunt.\"},{\"verse\":37,\"text\":\"Cui respondit Ruben : Duos filios meos interfice, si non reduxero illum tibi : trade illum in manu mea, et ego eum tibi restituam.\"},{\"verse\":38,\"text\":\"At ille : Non descendet, inquit, filius meus vobiscum : frater ejus mortuus est, et ipse solus remansit : si quid ei adversi acciderit in terra ad quam pergitis, deducetis canos meos cum dolore ad inferos.\"}],\"summary\":\"Jacob sendeth his ten sons to buy corn in Egypt. Their treatment by Joseph.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":41,\"label\":\"Genesis 41\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":43,\"label\":\"Genesis 43\"}}]]\n"])</script></body></html>
