20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">7</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Noe with his family go into the ark. The deluge overflows the earth.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord said to him: Go in, thou and all thy house, into the ark: for thee I have seen just before me in this generation.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Of all clean beasts take seven and seven, the male and the female.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But of the beasts that are unclean two and two, the male and the female. Of the fowls also of the air seven and seven, the male and the female: that seed may be saved upon the face of the whole earth.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For yet a while, and after seven days, I will rain upon the earth forty days and forty nights: and I will destroy every substance that I have made, from the face of the earth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Noe did all things which the Lord had commanded him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he was six hundred years old, when the waters of the flood overflowed the earth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Noe went in and his sons, his wife and the wives of his sons with him into the ark, because of the waters of the flood.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And of beasts clean and unclean, and of fowls, and of every thing that moveth upon the earth,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Two and two went in to Noe into the ark, male and female, as the Lord had commanded Noe.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And after the seven days were passed, the waters of the flood overflowed the earth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In the six hundredth year of the life of Noe, in the second month, in the seventeenth day of the month, all the fountains of the great deep were broken up, and the floodgates of heaven were opened:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the rain fell upon the earth forty days and forty nights.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In the selfsame day Noe, and Sem, and Cham, and Japheth, his sons: his wife, and the three wives of his sons with them, went into the ark.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>They and every beast according to its kind, and all the cattle in their kind, and every thing that moveth upon the earth, according to its kind, and every fowl according to its kind, all birds, and all that fly,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Went in to Noe into the ark, two and two of all flesh, wherein was the breath of life.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And they that went in, went in male and female of all flesh, as God had commanded him: and the Lord shut him in on the outside.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the flood was forty days upon the earth: and the waters increased, and lifted up the ark on high from the earth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For they overflowed exceedingly: and filled all on the face of the earth: and the ark was carried upon the waters.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the waters prevailed beyond measure upon the earth: and all the high mountains under the whole heaven were covered.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The water was fifteen cubits higher than the mountains which it covered.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And all flesh was destroyed that moved upon the earth, both of fowl and of cattle, and of beasts, and of all creeping things that creep upon the earth: and all men.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And all things wherein there is the breath of life on the earth, died.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he destroyed all the substance that was upon the earth, from man even to beast, and the creeping things and fowls of the air: and they were destroyed from the earth: and Noe only remained, and they that were with him in the ark.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the waters prevailed upon the earth a hundred and fifty days.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixitque Dominus ad eum : Ingredere tu et omnis domus tua in arcam : te enim vidi justum coram me in generatione hac.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ex omnibus animantibus mundis tolle septena et septena, masculum et feminam : de animantibus vero immundis duo et duo, masculum et feminam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sed et de volatilibus cæli septena et septena, masculum et feminam : ut salvetur semen super faciem universæ terræ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Adhuc enim, et post dies septem ego pluam super terram quadraginta diebus et quadraginta noctibus : et delebo omnem substantiam, quam feci, de superficie terræ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Fecit ergo Noë omnia quæ mandaverat ei Dominus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Eratque sexcentorum annorum quando diluvii aquæ inundaverunt super terram.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ingressus est Noë et filii ejus, uxor ejus et uxores filiorum ejus cum eo in arcam propter aquas diluvii.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>De animantibus quoque mundis et immundis, et de volucribus, et ex omni quod movetur super terram,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>duo et duo ingressa sunt ad Noë in arcam, masculus et femina, sicut præceperat Dominus Noë.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque transissent septem dies, aquæ diluvii inundaverunt super terram.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Anno sexcentesimo vitæ Noë, mense secundo, septimodecimo die mensis, rupti sunt omnes fontes abyssi magnæ, et cataractæ cæli apertæ sunt :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et facta est pluvia super terram quadraginta diebus et quadraginta noctibus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In articulo diei illius ingressus est Noë, et Sem, et Cham, et Japheth filii ejus ; uxor illius, et tres uxores filiorum ejus cum eis in arcam :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ipsi et omne animal secundum genus suum, universaque jumenta in genere suo, et omne quod movetur super terram in genere suo, cunctumque volatile secundum genus suum, universæ aves, omnesque volucres,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ingressæ sunt ad Noë in arcam, bina et bina ex omni carne, in qua erat spiritus vitæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et quæ ingressa sunt, masculus et femina ex omni carne introierunt, sicut præceperat ei Deus : et inclusit eum Dominus deforis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Factumque est diluvium quadraginta diebus super terram : et multiplicatæ sunt aquæ, et elevaverunt arcam in sublime a terra.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vehementer enim inundaverunt, et omnia repleverunt in superficie terræ : porro arca ferebatur super aquas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et aquæ prævaluerunt nimis super terram : opertique sunt omnes montes excelsi sub universo cælo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quindecim cubitis altior fuit aqua super montes, quos operuerat.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Consumptaque est omnis caro quæ movebatur super terram, volucrum, animantium, bestiarum, omniumque reptilium, quæ reptant super terram : universi homines,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et cuncta, in quibus spiraculum vitæ est in terra, mortua sunt.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et delevit omnem substantiam quæ erat super terram, ab homine usque ad pecus, tam reptile quam volucres cæli : et deleta sunt de terra. Remansit autem solus Noë, et qui cum eo erant in arca.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Obtinueruntque aquæ terram centum quinquaginta diebus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border- e seen just before me in this generation.\"},{\"verse\":2,\"text\":\"Of all clean beasts take seven and seven, the male and the female.\"},{\"verse\":3,\"text\":\"But of the beasts that are unclean two and two, the male and the female. Of the fowls also of the air seven and seven, the male and the female: that seed may be saved upon the face of the whole earth.\"},{\"verse\":4,\"text\":\"For yet a while, and after seven days, I will rain upon the earth forty days and forty nights: and I will destroy every substance that I have made, from the face of the earth.\"},{\"verse\":5,\"text\":\"And Noe did all things which the Lord had commanded him.\"},{\"verse\":6,\"text\":\"And he was six hundred years old, when the waters of the flood overflowed the earth.\"},{\"verse\":7,\"text\":\"And Noe went in and his sons, his wife and the wives of his sons with him into the ark, because of the waters of the flood.\"},{\"verse\":8,\"text\":\"And of beasts clean and unclean, and of fowls, and of every thing that moveth upon the earth,\"},{\"verse\":9,\"text\":\"Two and two went in to Noe into the ark, male and female, as the Lord had commanded Noe.\"},{\"verse\":10,\"text\":\"And after the seven days were passed, the waters of the flood overflowed the earth.\"},{\"verse\":11,\"text\":\"In the six hundredth year of the life of Noe, in the second month, in the seventeenth day of the month, all the fountains of the great deep were broken up, and the floodgates of heaven were opened:\"},{\"verse\":12,\"text\":\"And the rain fell upon the earth forty days and forty nights.\"},{\"verse\":13,\"text\":\"In the selfsame day Noe, and Sem, and Cham, and Japheth, his sons: his wife, and the three wives of his sons with them, went into the ark.\"},{\"verse\":14,\"text\":\"They and every beast according to its kind, and all the cattle in their kind, and every thing that moveth upon the earth, according to its kind, and every fowl according to its kind, all birds, and all that fly,\"},{\"verse\":15,\"text\":\"Went in to Noe into the ark, two and two of all flesh, wherein was the breath of life.\"},{\"verse\":16,\"text\":\"And they that went in, went in male and female of all flesh, as God had commanded him: and the Lord shut him in on the outside.\"},{\"verse\":17,\"text\":\"And the flood was forty days upon the earth: and the waters increased, and lifted up the ark on high from the earth.\"},{\"verse\":18,\"text\":\"For they overflowed exceedingly: and filled all on the face of the earth: and the ark was carried upon the waters.\"},{\"verse\":19,\"text\":\"And the waters prevailed beyond measure upon the earth: and all the high mountains under the whole heaven were covered.\"},{\"verse\":20,\"text\":\"The water was fifteen cubits higher than the mountains which it covered.\"},{\"verse\":21,\"text\":\"And all flesh was destroyed that moved upon the earth, both of fowl and of cattle, and of beasts, and of all creeping things that creep upon the earth: and all men.\"},{\"verse\":22,\"text\":\"And all things wherein there is the breath of life on the earth, died.\"},{\"verse\":23,\"text\":\"And he destroyed all the substance that was upon the earth, from man even to beast, and the creeping things and fowls of the air: and they were destroyed from the earth: and Noe only remained, and they that were with him in the ark.\"},{\"verse\":24,\"text\":\"And the waters prevailed upon the earth a hundred and fifty days.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixitque Dominus ad eum : Ingredere tu et omnis domus tua in arcam : te enim vidi justum coram me in generatione hac.\"},{\"verse\":2,\"text\":\"Ex omnibus animantibus mundis tolle septena et septena, masculum et feminam : de animantibus vero immundis duo et duo, masculum et feminam.\"},{\"verse\":3,\"text\":\"Sed et de volatilibus cæli septena et septena, masculum et feminam : ut salvetur semen super faciem universæ terræ.\"},{\"verse\":4,\"text\":\"Adhuc enim, et post dies septem ego pluam super terram quadraginta diebus et quadraginta noctibus : et delebo omnem substantiam, quam feci, de superficie terræ.\"},{\"verse\":5,\"text\":\"Fecit ergo Noë omnia quæ mandaverat ei Dominus.\"},{\"verse\":6,\"text\":\"Eratque sexcentorum annorum quando diluvii aquæ inundaverunt super terram.\"},{\"verse\":7,\"text\":\"Et ingressus est Noë et filii ejus, uxor ejus et uxores filiorum ejus cum eo in arcam propter aquas diluvii.\"},{\"verse\":8,\"text\":\"De animantibus quoque mundis et immundis, et de volucribus, et ex omni quod movetur super terram,\"},{\"verse\":9,\"text\":\"duo et duo ingressa sunt ad Noë in arcam, masculus et femina, sicut præceperat Dominus Noë.\"},{\"verse\":10,\"text\":\"Cumque transissent septem dies, aquæ diluvii inundaverunt super terram.\"},{\"verse\":11,\"text\":\"Anno sexcentesimo vitæ Noë, mense secundo, septimodecimo die mensis, rupti sunt omnes fontes abyssi magnæ, et cataractæ cæli apertæ sunt :\"},{\"verse\":12,\"text\":\"et facta est pluvia super terram quadraginta diebus et quadraginta noctibus.\"},{\"verse\":13,\"text\":\"In articulo diei illius ingressus est Noë, et Sem, et Cham, et Japheth filii ejus ; uxor illius, et tres uxores filiorum ejus cum eis in arcam :\"},{\"verse\":14,\"text\":\"ipsi et omne animal secundum genus suum, universaque jumenta in genere suo, et omne quod movetur super terram in genere suo, cunctumque volatile secundum genus suum, universæ aves, omnesque volucres,\"},{\"verse\":15,\"text\":\"ingressæ sunt ad Noë in arcam, bina et bina ex omni carne, in qua erat spiritus vitæ.\"},{\"verse\":16,\"text\":\"Et quæ ingressa sunt, masculus et femina ex omni carne introierunt, sicut præceperat ei Deus : et inclusit eum Dominus deforis.\"},{\"verse\":17,\"text\":\"Factumque est diluvium quadraginta diebus super terram : et multiplicatæ sunt aquæ, et elevaverunt arcam in sublime a terra.\"},{\"verse\":18,\"text\":\"Vehementer enim inundaverunt, et omnia repleverunt in superficie terræ : porro arca ferebatur super aquas.\"},{\"verse\":19,\"text\":\"Et aquæ prævaluerunt nimis super terram : opertique sunt omnes montes excelsi sub universo cælo.\"},{\"verse\":20,\"text\":\"Quindecim cubitis altior fuit aqua super montes, quos operuerat.\"},{\"verse\":21,\"text\":\"Consumptaque est omnis caro quæ movebatur super terram, volucrum, animantium, bestiarum, omniumque reptilium, quæ reptant super terram : universi homines,\"},{\"verse\":22,\"text\":\"et cuncta, in quibus spiraculum vitæ est in terra, mortua sunt.\"},{\"verse\":23,\"text\":\"Et delevit omnem substantiam quæ erat super terram, ab homine usque ad pecus, tam reptile quam volucres cæli : et deleta sunt de terra. Remansit autem solus Noë, et qui cum eo erant in arca.\"},{\"verse\":24,\"text\":\"Obtinueruntque aquæ terram centum quinquaginta diebus.\"}],\"summary\":\"Noe with his family go into the ark. The deluge overflows the earth.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":6,\"label\":\"Genesis 6\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":8,\"label\":\"Genesis 8\"}}]]\n"])</script></body></html>
