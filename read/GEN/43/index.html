/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Genesis<!-- --> <span class="text-stone-500">43</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The sons of Jacob go again into Egypt with Benjamin. They are entertained by Joseph.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>In the mean time the famine was heavy upon all the land.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when they had eaten up all the corn, which they had brought out of Egypt, Jacob said to his sons: Go again, and buy us a little food.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Juda answered: The man declared unto us with the attestation of an oath, saying: You shall not see my face, unless you bring your youngest brother with you.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>If therefore thou wilt send him with us, we will set out together, and will buy necessaries for thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But if thou wilt not, we will not go: for the man, as we have often said, declared unto us, saying: You shall not see my face without your youngest brother.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Israel said to them: You have done this for my misery, in that you told him you had also another brother.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But they answered: The man asked us in order concerning our kindred: if our father lived: if we had a brother: and we answered him regularly, according to what he demanded: could we know that he would say: Bring hither your brother with you?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Juda said to his father: Send the boy with me, that we may set forward, and may live: lest both we and our children perish.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I take the boy upon me, require him at my hand: unless I bring him again, and restore him to thee, I will be guilty of sin against thee for ever.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If delay had not been made, we had been here again the second time.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Then Israel said to them: If it must needs be so, do what you will: take of the best fruits of the land in your vessels, and carry down presents to the man, a little balm, and honey, and storax, myrrh, turpentine, and almonds.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And take with you double money, and carry back what you found in your sacks, lest perhaps it was done by mistake.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And take also your brother, and go to the man.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And may my almighty God make him favourable to you: and send back with you your brother, whom he keepeth, and this Benjamin: and as for me I shall be desolate without children.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So the men took the presents, and double money, and Benjamin: and went down into Egypt, and stood before Joseph.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when he had seen them, and Benjamin with them, he commanded the steward of his house, saying: Bring in the men into the house, and kill victims, and prepare a feast: because they shall eat with me at noon.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He did as he was commanded, and brought the men into the house.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they being much afraid, said there one to another: Because of the money, which we carried back the first time in our sacks, we are brought in: that he may bring upon us a false accusation, and by violence make slaves of us and our asses.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Wherefore, going up to the steward of the house, at the door,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>They said: Sir, we desire thee to hear us. We came down once before to buy food:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when we had bought, and were come to the inn, we opened our sacks, and found our money in the mouths of the sacks: which we have now brought again in the same weight.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And we have brought other money besides, to buy what we want: we cannot tell who put it in our bags.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But he answered: Peace be with you, fear not: your God, and the God of your father, hath given you treasure in your sacks. For the money, which you gave me, I have for good. And he brought Simeon out to them.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And having brought them into the house, he fetched water, and they washed their feet, and he gave provender to their asses.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But they made ready the presents, against Joseph came at noon: for they had heard that they should eat bread there.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then Joseph came in to his house, and they offered him the presents, holding them in their hands; and they bowed down with their face to the ground.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But he courteously saluting them again, asked them, saying: Is the old man your father in health, of whom you told me? Is he yet living?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they answered: Thy servant our father, is in health; he is yet living. And bowing themselves, they made obeisance to him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Joseph lifting up his eyes, saw Benjamin, his brother by the same mother, and said: Is this your young brother, of whom you told me? And he said: God be gracious to thee, my son.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And he made haste, because his heart was moved upon his brother, and tears gushed out: and going into his chamber, he wept.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And when he had washed his face, coming out again, he refrained himself, and said: Set bread on the table.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And when it was set on, for Joseph apart, and for his brethren apart, for the Egyptians also that ate with him apart, (for it is unlawful for the Egyptians to eat with the Hebrews, and they think such a feast profane):</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>They sat before him, the firstborn according to his birthright, and the youngest according to his age. And they wondered very much;</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Taking the messes which they received of him: and the greater mess came to Benjamin, so that it exceeded by five parts. And they drank, and were merry with him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Interim fames omnem terram vehementer premebat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Consumptisque cibis quos ex Ægypto detulerant, dixit Jacob ad filios suos : Revertimini, et emite nobis pauxillum escarum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Respondit Judas : Denuntiavit nobis vir ille sub attestatione jurisjurandi, dicens : Non videbitis faciem meam, nisi fratrem vestrum minimum adduxeritis vobiscum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si ergo vis eum mittere nobiscum, pergemus pariter, et ememus tibi necessaria :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>sin autem non vis, non ibimus : vir enim, ut sæpe diximus, denuntiavit nobis, dicens : Non videbitis faciem meam absque fratre vestro minimo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixit eis Israël : In meam hoc fecistis miseriam, ut indicaretis ei et alium habere vos fratrem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>At illi responderunt : Interrogavit nos homo per ordinem nostram progeniem : si pater viveret : si haberemus fratrem : et nos respondimus ei consequenter juxta id quod fuerat sciscitatus : numquid scire poteramus quod dicturus esset : Adducite fratrem vestrum vobiscum ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Judas quoque dixit patri suo : Mitte puerum mecum, ut proficiscamur, et possimus vivere : ne moriamur nos et parvuli nostri.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ego suscipio puerum : de manu mea require illum : nisi reduxero, et reddidero eum tibi, ero peccati reus in te omni tempore.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si non intercessisset dilatio, jam vice alter venissemus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Igitur Israël pater eorum dixit ad eos : Si sic necesse est, facite quod vultis : sumite de optimis terræ fructibus in vasis vestris, et deferte viro munera, modicum resinæ, et mellis, et storacis, stactes, et terebinthi, et amygdalarum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Pecuniam quoque duplicem ferte vobiscum : et illam, quam invenistis in sacculis, reportate, ne forte errore factum sit :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>sed et fratrem vestrum tollite, et ite ad virum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Deus autem meus omnipotens faciat vobis eum placabilem : et remittat vobiscum fratrem vestrum quem tenet, et hunc Benjamin : ego autem quasi orbatus absque liberis ero.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tulerunt ergo viri munera, et pecuniam duplicem, et Benjamin : descenderuntque in Ægyptum, et steterunt coram Joseph.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quos cum ille vidisset et Benjamin simul, præcepit dispensatori domus suæ, dicens : Introduc viros domum, et occide victimas, et instrue convivium : quoniam mecum sunt comesturi meridie.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fecit ille quod sibi fuerat imperatum, et introduxit viros domum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ibique exterriti, dixerunt mutuo : Propter pecuniam, quam retulimus prius in saccis nostris, introducti sumus : ut devolvat in nos calumniam, et violenter subjiciat servituti et nos, et asinos nostros.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quam ob rem in ipsis foribus accedentes ad dispensatorem domus,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>locuti sunt : Oramus, domine, ut audias nos. Jam ante descendimus ut emeremus escas :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quibus emptis, cum venissemus ad diversorium, aperuimus saccos nostros, et invenimus pecuniam in ore saccorum : quam nunc eodem pondere reportavimus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sed et aliud attulimus argentum, ut emamus quæ nobis necessaria sunt : non est in nostra conscientia quis posuerit eam in marsupiis nostris.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>At ille respondit : Pax vobiscum, nolite timere : Deus vester, et Deus patris vestri, dedit vobis thesauros in saccis vestris : nam pecuniam, quam dedistis mihi, probatam ego habeo. Eduxitque ad eos Simeon.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et introductis domum, attulit aquam, et laverunt pedes suos, deditque pabulum asinis eorum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Illi vero parabant munera, donec ingrederetur Joseph meridie : audierant enim quod ibi comesturi essent panem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Igitur ingressus est Joseph domum suam, obtuleruntque ei munera, tenentes in manibus suis : et adoraverunt proni in terram.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>At ille, clementer resalutatis eis, interrogavit eos, dicens : Salvusne est pater vester senex, de quo dixeratis mihi ? adhuc vivit ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Qui responderunt : Sospes est servus tuus pater noster, adhuc vivit. Et incurvati, adoraverunt eum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Attollens autem Joseph oculos, vidit Benjamin fratrem suum uterinum, et ait : Iste est frater vester parvulus, de quo dixeratis mihi ? Et rursum : Deus, inquit, misereatur tui, fili mi.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Festinavitque, quia commota fuerant viscera ejus super fratre suo, et erumpebant lacrimæ : et introiens cubiculum flevit.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Rursumque lota facie egressus, continuit se, et ait : Ponite panes.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quibus appositis, seorsum Joseph, et seorsum fratribus, Ægyptiis quoque qui vescebantur simul, seorsum (illicitum est enim Ægyptiis comedere cum Hebræis, et profanum putant hujuscemodi convivium)</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>sederunt coram eo, primogenitus juxta primogenita sua, et minimus juxta ætatem suam. Et mirabantur nimis,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sumptis partibus quas ab eo acceperant : majorque pars venit Benjamin, ita ut quinque partibus excederet. Biberuntque et inebriati sunt cum eo.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/GEN/42/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Genesis 42</span></span></a><a class="flex min-h-14 items-center justify-end ga s we have often said, declared unto us, saying: You shall not see my face without your youngest brother.\"},{\"verse\":6,\"text\":\"Israel said to them: You have done this for my misery, in that you told him you had also another brother.\"},{\"verse\":7,\"text\":\"But they answered: The man asked us in order concerning our kindred: if our father lived: if we had a brother: and we answered him regularly, according to what he demanded: could we know that he would say: Bring hither your brother with you?\"},{\"verse\":8,\"text\":\"And Juda said to his father: Send the boy with me, that we may set forward, and may live: lest both we and our children perish.\"},{\"verse\":9,\"text\":\"I take the boy upon me, require him at my hand: unless I bring him again, and restore him to thee, I will be guilty of sin against thee for ever.\"},{\"verse\":10,\"text\":\"If delay had not been made, we had been here again the second time.\"},{\"verse\":11,\"text\":\"Then Israel said to them: If it must needs be so, do what you will: take of the best fruits of the land in your vessels, and carry down presents to the man, a little balm, and honey, and storax, myrrh, turpentine, and almonds.\"},{\"verse\":12,\"text\":\"And take with you double money, and carry back what you found in your sacks, lest perhaps it was done by mistake.\"},{\"verse\":13,\"text\":\"And take also your brother, and go to the man.\"},{\"verse\":14,\"text\":\"And may my almighty God make him favourable to you: and send back with you your brother, whom he keepeth, and this Benjamin: and as for me I shall be desolate without children.\"},{\"verse\":15,\"text\":\"So the men took the presents, and double money, and Benjamin: and went down into Egypt, and stood before Joseph.\"},{\"verse\":16,\"text\":\"And when he had seen them, and Benjamin with them, he commanded the steward of his house, saying: Bring in the men into the house, and kill victims, and prepare a feast: because they shall eat with me at noon.\"},{\"verse\":17,\"text\":\"He did as he was commanded, and brought the men into the house.\"},{\"verse\":18,\"text\":\"And they being much afraid, said there one to another: Because of the money, which we carried back the first time in our sacks, we are brought in: that he may bring upon us a false accusation, and by violence make slaves of us and our asses.\"},{\"verse\":19,\"text\":\"Wherefore, going up to the steward of the house, at the door,\"},{\"verse\":20,\"text\":\"They said: Sir, we desire thee to hear us. We came down once before to buy food:\"},{\"verse\":21,\"text\":\"And when we had bought, and were come to the inn, we opened our sacks, and found our money in the mouths of the sacks: which we have now brought again in the same weight.\"},{\"verse\":22,\"text\":\"And we have brought other money besides, to buy what we want: we cannot tell who put it in our bags.\"},{\"verse\":23,\"text\":\"But he answered: Peace be with you, fear not: your God, and the God of your father, hath given you treasure in your sacks. For the money, which you gave me, I have for good. And he brought Simeon out to them.\"},{\"verse\":24,\"text\":\"And having brought them into the house, he fetched water, and they washed their feet, and he gave provender to their asses.\"},{\"verse\":25,\"text\":\"But they made ready the presents, against Joseph came at noon: for they had heard that they should eat bread there.\"},{\"verse\":26,\"text\":\"Then Joseph came in to his house, and they offered him the presents, holding them in their hands; and they bowed down with their face to the ground.\"},{\"verse\":27,\"text\":\"But he courteously saluting them again, asked them, saying: Is the old man your father in health, of whom you told me? Is he yet living?\"},{\"verse\":28,\"text\":\"And they answered: Thy servant our father, is in health; he is yet living. And bowing themselves, they made obeisance to him.\"},{\"verse\":29,\"text\":\"And Joseph lifting up his eyes, saw Benjamin, his brother by the same mother, and said: Is this your young brother, of whom you told me? And he said: God be gracious to thee, my son.\"},{\"verse\":30,\"text\":\"And he made haste, because his heart was moved upon his brother, and tears gushed out: and going into his chamber, he wept.\"},{\"verse\":31,\"text\":\"And when he had washed his face, coming out again, he refrained himself, and said: Set bread on the table.\"},{\"verse\":32,\"text\":\"And when it was set on, for Joseph apart, and for his brethren apart, for the Egyptians also that ate with him apart, (for it is unlawful for the Egyptians to eat with the Hebrews, and they think such a feast profane):\"},{\"verse\":33,\"text\":\"They sat before him, the firstborn according to his birthright, and the youngest according to his age. And they wondered very much;\"},{\"verse\":34,\"text\":\"Taking the messes which they received of him: and the greater mess came to Benjamin, so that it exceeded by five parts. And they drank, and were merry with him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Interim fames omnem terram vehementer premebat.\"},{\"verse\":2,\"text\":\"Consumptisque cibis quos ex Ægypto detulerant, dixit Jacob ad filios suos : Revertimini, et emite nobis pauxillum escarum.\"},{\"verse\":3,\"text\":\"Respondit Judas : Denuntiavit nobis vir ille sub attestatione jurisjurandi, dicens : Non videbitis faciem meam, nisi fratrem vestrum minimum adduxeritis vobiscum.\"},{\"verse\":4,\"text\":\"Si ergo vis eum mittere nobiscum, pergemus pariter, et ememus tibi necessaria :\"},{\"verse\":5,\"text\":\"sin autem non vis, non ibimus : vir enim, ut sæpe diximus, denuntiavit nobis, dicens : Non videbitis faciem meam absque fratre vestro minimo.\"},{\"verse\":6,\"text\":\"Dixit eis Israël : In meam hoc fecistis miseriam, ut indicaretis ei et alium habere vos fratrem.\"},{\"verse\":7,\"text\":\"At illi responderunt : Interrogavit nos homo per ordinem nostram progeniem : si pater viveret : si haberemus fratrem : et nos respondimus ei consequenter juxta id quod fuerat sciscitatus : numquid scire poteramus quod dicturus esset : Adducite fratrem vestrum vobiscum ?\"},{\"verse\":8,\"text\":\"Judas quoque dixit patri suo : Mitte puerum mecum, ut proficiscamur, et possimus vivere : ne moriamur nos et parvuli nostri.\"},{\"verse\":9,\"text\":\"Ego suscipio puerum : de manu mea require illum : nisi reduxero, et reddidero eum tibi, ero peccati reus in te omni tempore.\"},{\"verse\":10,\"text\":\"Si non intercessisset dilatio, jam vice alter venissemus.\"},{\"verse\":11,\"text\":\"Igitur Israël pater eorum dixit ad eos : Si sic necesse est, facite quod vultis : sumite de optimis terræ fructibus in vasis vestris, et deferte viro munera, modicum resinæ, et mellis, et storacis, stactes, et terebinthi, et amygdalarum.\"},{\"verse\":12,\"text\":\"Pecuniam quoque duplicem ferte vobiscum : et illam, quam invenistis in sacculis, reportate, ne forte errore factum sit :\"},{\"verse\":13,\"text\":\"sed et fratrem vestrum tollite, et ite ad virum.\"},{\"verse\":14,\"text\":\"Deus autem meus omnipotens faciat vobis eum placabilem : et remittat vobiscum fratrem vestrum quem tenet, et hunc Benjamin : ego autem quasi orbatus absque liberis ero.\"},{\"verse\":15,\"text\":\"Tulerunt ergo viri munera, et pecuniam duplicem, et Benjamin : descenderuntque in Ægyptum, et steterunt coram Joseph.\"},{\"verse\":16,\"text\":\"Quos cum ille vidisset et Benjamin simul, præcepit dispensatori domus suæ, dicens : Introduc viros domum, et occide victimas, et instrue convivium : quoniam mecum sunt comesturi meridie.\"},{\"verse\":17,\"text\":\"Fecit ille quod sibi fuerat imperatum, et introduxit viros domum.\"},{\"verse\":18,\"text\":\"Ibique exterriti, dixerunt mutuo : Propter pecuniam, quam retulimus prius in saccis nostris, introducti sumus : ut devolvat in nos calumniam, et violenter subjiciat servituti et nos, et asinos nostros.\"},{\"verse\":19,\"text\":\"Quam ob rem in ipsis foribus accedentes ad dispensatorem domus,\"},{\"verse\":20,\"text\":\"locuti sunt : Oramus, domine, ut audias nos. Jam ante descendimus ut emeremus escas :\"},{\"verse\":21,\"text\":\"quibus emptis, cum venissemus ad diversorium, aperuimus saccos nostros, et invenimus pecuniam in ore saccorum : quam nunc eodem pondere reportavimus.\"},{\"verse\":22,\"text\":\"Sed et aliud attulimus argentum, ut emamus quæ nobis necessaria sunt : non est in nostra conscientia quis posuerit eam in marsupiis nostris.\"},{\"verse\":23,\"text\":\"At ille respondit : Pax vobiscum, nolite timere : Deus vester, et Deus patris vestri, dedit vobis thesauros in saccis vestris : nam pecuniam, quam dedistis mihi, probatam ego habeo. Eduxitque ad eos Simeon.\"},{\"verse\":24,\"text\":\"Et introductis domum, attulit aquam, et laverunt pedes suos, deditque pabulum asinis eorum.\"},{\"verse\":25,\"text\":\"Illi vero parabant munera, donec ingrederetur Joseph meridie : audierant enim quod ibi comesturi essent panem.\"},{\"verse\":26,\"text\":\"Igitur ingressus est Joseph domum suam, obtuleruntque ei munera, tenentes in manibus suis : et adoraverunt proni in terram.\"},{\"verse\":27,\"text\":\"At ille, clementer resalutatis eis, interrogavit eos, dicens : Salvusne est pater vester senex, de quo dixeratis mihi ? adhuc vivit ?\"},{\"verse\":28,\"text\":\"Qui responderunt : Sospes est servus tuus pater noster, adhuc vivit. Et incurvati, adoraverunt eum.\"},{\"verse\":29,\"text\":\"Attollens autem Joseph oculos, vidit Benjamin fratrem suum uterinum, et ait : Iste est frater vester parvulus, de quo dixeratis mihi ? Et rursum : Deus, inquit, misereatur tui, fili mi.\"},{\"verse\":30,\"text\":\"Festinavitque, quia commota fuerant viscera ejus super fratre suo, et erumpebant lacrimæ : et introiens cubiculum flevit.\"},{\"verse\":31,\"text\":\"Rursumque lota facie egressus, continuit se, et ait : Ponite panes.\"},{\"verse\":32,\"text\":\"Quibus appositis, seorsum Joseph, et seorsum fratribus, Ægyptiis quoque qui vescebantur simul, seorsum (illicitum est enim Ægyptiis comedere cum Hebræis, et profanum putant hujuscemodi convivium)\"},{\"verse\":33,\"text\":\"sederunt coram eo, primogenitus juxta primogenita sua, et minimus juxta ætatem suam. Et mirabantur nimis,\"},{\"verse\":34,\"text\":\"sumptis partibus quas ab eo acceperant : majorque pars venit Benjamin, ita ut quinque partibus excederet. Biberuntque et inebriati sunt cum eo.\"}],\"summary\":\"The sons of Jacob go again into Egypt with Benjamin. They are entertained by Joseph.\",\"intro\":null,\"prev\":{\"usfm\":\"GEN\",\"chapter\":42,\"label\":\"Genesis 42\"},\"next\":{\"usfm\":\"GEN\",\"chapter\":44,\"label\":\"Genesis 44\"}}]]\n"])</script></body></html>
