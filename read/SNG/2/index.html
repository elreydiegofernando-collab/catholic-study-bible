h d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Song of Songs<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->Canticle of Canticles</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ caresses his spouse: he invites her to him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I am the flower of the field, and the lily of the valleys.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>As the lily among thorns, so is my love among the daughters.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>As the apple tree among the trees of the woods, so is my beloved among the sons. I sat down under his shadow, whom I desired: and his fruit was sweet to my palate.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He brought me into the cellar of wine, he set in order charity in me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Stay me up with flowers, compass me about with apples: because I languish with love.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>His left hand is under my head, and his right hand shall embrace me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I adjure you, O ye daughters of Jerusalem, by the roes, and the harts of the fields, that you stir not up, nor make the beloved to awake, till she please.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The voice of my beloved, behold he cometh leaping upon the mountains, skipping over the hills.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>My beloved is like a roe, or a young hart. Behold he standeth behind our wall, looking through the windows, looking through the lattices.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Behold my beloved speaketh to me: Arise, make haste, my love, my dove, my beautiful one, and come.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For winter is now past, the rain is over and gone.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The flowers have appeared in our land, the time of pruning is come: the voice of the turtle is heard in our land:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The fig tree hath put forth her green figs: the vines in flower yield their sweet smell. Arise, my love, my beautiful one, and come:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>My dove in the clefts of the rock, in the hollow places of the wall, shew me thy face, let thy voice sound in my ears: for thy voice is sweet, and thy face comely.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Catch us the little foxes that destroy the vines: for our vineyard hath flourished.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>My beloved to me, and I to him who feedeth among the lilies,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Till the day break, and the shadows retire. Return: be like, my beloved, to a roe, or to a young hart upon the mountains of Bether.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ego flos campi, et lilium convallium.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sponsus Sicut lilium inter spinas, sic amica mea inter filias.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sponsa Sicut malus inter ligna silvarum, sic dilectus meus inter filios. Sub umbra illius quem desideraveram sedi, et fructus ejus dulcis gutturi meo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Introduxit me in cellam vinariam ; ordinavit in me caritatem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Fulcite me floribus, stipate me malis, quia amore langueo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Læva ejus sub capite meo, et dextera illius amplexabitur me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sponsus Adjuro vos, filiæ Jerusalem, per capreas cervosque camporum, ne suscitetis, neque evigilare faciatis dilectam, quoadusque ipsa velit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sponsa Vox dilecti mei ; ecce iste venit, saliens in montibus, transiliens colles.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Similis est dilectus meus capreæ, hinnuloque cervorum. En ipse stat post parietem nostrum, respiciens per fenestras, prospiciens per cancellos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>En dilectus meus loquitur mihi. Sponsus Surge, propera, amica mea, columba mea, formosa mea, et veni :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>jam enim hiems transiit ; imber abiit, et recessit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Flores apparuerunt in terra nostra ; tempus putationis advenit : vox turturis audita est in terra nostra ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>ficus protulit grossos suos ; vineæ florentes dederunt odorem suum. Surge, amica mea, speciosa mea, et veni :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>columba mea, in foraminibus petræ, in caverna maceriæ, ostende mihi faciem tuam, sonet vox tua in auribus meis : vox enim tua dulcis, et facies tua decora.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sponsa Capite nobis vulpes parvulas quæ demoliuntur vineas : nam vinea nostra floruit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dilectus meus mihi, et ego illi, qui pascitur inter lilia,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>donec aspiret dies, et inclinentur umbræ. Revertere ; similis esto, dilecte mi, capreæ, hinnuloque cervorum super montes Bether.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SNG/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Song of Songs 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/SNG/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Song of Songs 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->8<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-ce tudy-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"SNG.2\",{\"bookId\":24,\"usfm\":\"SNG\",\"bookName\":\"Song of Songs\",\"drName\":\"Canticle of Canticles\",\"chapter\":2,\"totalChapters\":8,\"dra\":[{\"verse\":1,\"text\":\"I am the flower of the field, and the lily of the valleys.\"},{\"verse\":2,\"text\":\"As the lily among thorns, so is my love among the daughters.\"},{\"verse\":3,\"text\":\"As the apple tree among the trees of the woods, so is my beloved among the sons. I sat down under his shadow, whom I desired: and his fruit was sweet to my palate.\"},{\"verse\":4,\"text\":\"He brought me into the cellar of wine, he set in order charity in me.\"},{\"verse\":5,\"text\":\"Stay me up with flowers, compass me about with apples: because I languish with love.\"},{\"verse\":6,\"text\":\"His left hand is under my head, and his right hand shall embrace me.\"},{\"verse\":7,\"text\":\"I adjure you, O ye daughters of Jerusalem, by the roes, and the harts of the fields, that you stir not up, nor make the beloved to awake, till she please.\"},{\"verse\":8,\"text\":\"The voice of my beloved, behold he cometh leaping upon the mountains, skipping over the hills.\"},{\"verse\":9,\"text\":\"My beloved is like a roe, or a young hart. Behold he standeth behind our wall, looking through the windows, looking through the lattices.\"},{\"verse\":10,\"text\":\"Behold my beloved speaketh to me: Arise, make haste, my love, my dove, my beautiful one, and come.\"},{\"verse\":11,\"text\":\"For winter is now past, the rain is over and gone.\"},{\"verse\":12,\"text\":\"The flowers have appeared in our land, the time of pruning is come: the voice of the turtle is heard in our land:\"},{\"verse\":13,\"text\":\"The fig tree hath put forth her green figs: the vines in flower yield their sweet smell. Arise, my love, my beautiful one, and come:\"},{\"verse\":14,\"text\":\"My dove in the clefts of the rock, in the hollow places of the wall, shew me thy face, let thy voice sound in my ears: for thy voice is sweet, and thy face comely.\"},{\"verse\":15,\"text\":\"Catch us the little foxes that destroy the vines: for our vineyard hath flourished.\"},{\"verse\":16,\"text\":\"My beloved to me, and I to him who feedeth among the lilies,\"},{\"verse\":17,\"text\":\"Till the day break, and the shadows retire. Return: be like, my beloved, to a roe, or to a young hart upon the mountains of Bether.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ego flos campi, et lilium convallium.\"},{\"verse\":2,\"text\":\"Sponsus Sicut lilium inter spinas, sic amica mea inter filias.\"},{\"verse\":3,\"text\":\"Sponsa Sicut malus inter ligna silvarum, sic dilectus meus inter filios. Sub umbra illius quem desideraveram sedi, et fructus ejus dulcis gutturi meo.\"},{\"verse\":4,\"text\":\"Introduxit me in cellam vinariam ; ordinavit in me caritatem.\"},{\"verse\":5,\"text\":\"Fulcite me floribus, stipate me malis, quia amore langueo.\"},{\"verse\":6,\"text\":\"Læva ejus sub capite meo, et dextera illius amplexabitur me.\"},{\"verse\":7,\"text\":\"Sponsus Adjuro vos, filiæ Jerusalem, per capreas cervosque camporum, ne suscitetis, neque evigilare faciatis dilectam, quoadusque ipsa velit.\"},{\"verse\":8,\"text\":\"Sponsa Vox dilecti mei ; ecce iste venit, saliens in montibus, transiliens colles.\"},{\"verse\":9,\"text\":\"Similis est dilectus meus capreæ, hinnuloque cervorum. En ipse stat post parietem nostrum, respiciens per fenestras, prospiciens per cancellos.\"},{\"verse\":10,\"text\":\"En dilectus meus loquitur mihi. Sponsus Surge, propera, amica mea, columba mea, formosa mea, et veni :\"},{\"verse\":11,\"text\":\"jam enim hiems transiit ; imber abiit, et recessit.\"},{\"verse\":12,\"text\":\"Flores apparuerunt in terra nostra ; tempus putationis advenit : vox turturis audita est in terra nostra ;\"},{\"verse\":13,\"text\":\"ficus protulit grossos suos ; vineæ florentes dederunt odorem suum. Surge, amica mea, speciosa mea, et veni :\"},{\"verse\":14,\"text\":\"columba mea, in foraminibus petræ, in caverna maceriæ, ostende mihi faciem tuam, sonet vox tua in auribus meis : vox enim tua dulcis, et facies tua decora.\"},{\"verse\":15,\"text\":\"Sponsa Capite nobis vulpes parvulas quæ demoliuntur vineas : nam vinea nostra floruit.\"},{\"verse\":16,\"text\":\"Dilectus meus mihi, et ego illi, qui pascitur inter lilia,\"},{\"verse\":17,\"text\":\"donec aspiret dies, et inclinentur umbræ. Revertere ; similis esto, dilecte mi, capreæ, hinnuloque cervorum super montes Bether.\"}],\"summary\":\"Christ caresses his spouse: he invites her to him.\",\"intro\":null,\"prev\":{\"usfm\":\"SNG\",\"chapter\":1,\"label\":\"Song of Songs 1\"},\"next\":{\"usfm\":\"SNG\",\"chapter\":3,\"label\":\"Song of Songs 3\"}}]]\n"])</script></body></html>
