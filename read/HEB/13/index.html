ned angels.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Remember them that are in bands, as if you were bound with them: and them that labour, as being yourselves also in the body.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Marriage honourable in all, and the bed undefiled. For fornicators and adulterers God will judge.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Let your manners be without covetousness, contented with such things as you have. For he hath said: I will not leave thee: neither will I forsake thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>So that we may confidently say: The Lord is my helper: I will not fear what man shall do to me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Remember your prelates who have spoken the word of God to you: whose faith follow, considering the end of their conversation,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Jesus Christ, yesterday, and today: and the same for ever.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Be not led away with various and strange doctrines. For it is best that the heart be established with grace, not with meats: which have not profited those that walk in them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>We have an altar whereof they have no power to eat who serve the tabernacle.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For the bodies of those beasts whose blood is brought into the holies by the high priest for sin are burned without the camp.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wherefore Jesus also, that he might sanctify the people by his own blood, suffered without the gate.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let us go forth therefore to him without the camp, bearing his reproach.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For, we have not here a lasting city: but we seek one that is to come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>By him therefore let us offer the sacrifice of praise always to God, that is to say, the fruit of lips confessing to his name.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And do not forget to do good and to impart: for by such sacrifices God’s favour is obtained.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Obey your prelates and be subject to them. For they watch as being to render an account of your souls: that they may do this with joy and not with grief. For this is not expedient for you.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Pray for us. For we trust we have a good conscience, being willing to behave ourselves well in all things.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I beseech you the more to do this, that I may be restored to you the sooner.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And may the God of peace, who brought again from the dead the great pastor of the sheep, our Lord Jesus Christ, in the blood of the everlasting testament,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fit you in all goodness, that you may do his will; doing in you that which is well pleasing in his sight, through Jesus Christ, to whom is glory for ever and ever. Amen.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And I beseech you, brethren, that you suffer this word of consolation. For I have written to you in a few words.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Know ye that our brother Timothy is set at liberty: with whom (if he come shortly) I will see you.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Salute all your prelates and all the saints. The brethren from Italy salute you.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Grace be with you all. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Caritas fraternitatis maneat in vobis,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et hospitalitatem nolite oblivisci : per hanc enim latuerunt quidam, angelis hospitio receptis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Mementote vinctorum, tamquam simul vincti : et laborantium, tamquam et ipsi in corpore morantes.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Honorabile connubium in omnibus, et thorus immaculatus. Fornicatores enim, et adulteros judicabit Deus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sint mores sine avaritia, contenti præsentibus : ipse enim dixit : Non te deseram, neque derelinquam :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>ita ut confidenter dicamus : Dominus mihi adjutor : non timebo quid faciat mihi homo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Mementote præpositorum vestrorum, qui vobis locuti sunt verbum Dei : quorum intuentes exitum conversationis, imitamini fidem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Jesus Christus heri, et hodie : ipse et in sæcula.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Doctrinis variis et peregrinis nolite abduci. Optimum est enim gratia stabilire cor, non escis : quæ non profuerunt ambulantibus in eis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Habemus altare, de quo edere non habent potestatem, qui tabernaculo deserviunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quorum enim animalium infertur sanguis pro peccato in Sancta per pontificem, horum corpora cremantur extra castra.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Propter quod et Jesus, ut sanctificaret per suum sanguinem populum, extra portam passus est.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Exeamus igitur ad eum extra castra, improperium ejus portantes.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non enim habemus hic manentem civitatem, sed futuram inquirimus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Per ipsum ergo offeramus hostiam laudis semper Deo, id est, fructum labiorum confitentium nomini ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Beneficentiæ autem et communionis nolite oblivisci : talibus enim hostiis promeretur Deus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Obedite præpositis vestris, et subjacete eis. Ipsi enim pervigilant quasi rationem pro animabus vestris reddituri, ut cum gaudio hoc faciant, et non gementes : hoc enim non expedit vobis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Orate pro nobis : confidimus enim quia bonam conscientiam habemus in omnibus bene volentes conversari.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Amplius autem deprecor vos hoc facere, quo celerius restituar vobis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Deus autem pacis, qui eduxit de mortuis pastorem magnum ovium, in sanguine testamenti æterni, Dominum nostrum Jesum Christum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>aptet vos in omni bono, ut faciatis ejus voluntatem : faciens in vobis quod placeat coram se per Jesum Christum : cui est gloria in sæcula sæculorum. Amen.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Rogo autem vos fratres, ut sufferatis verbum solatii. Etenim perpaucis scripsi vobis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cognoscite fratrem nostrum Timotheum dimissum : cum quo (si celerius venerit) videbo vos.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Salutate omnes præpositos vestros, et omnes sanctos. Salutant vos de Italia fratres.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Gratia cum omnibus vobis. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span \",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"HEB.13\",{\"bookId\":65,\"usfm\":\"HEB\",\"bookName\":\"Hebrews\",\"drName\":\"Hebrews\",\"chapter\":13,\"totalChapters\":13,\"dra\":[{\"verse\":1,\"text\":\"Let the charity of the brotherhood abide in you.\"},{\"verse\":2,\"text\":\"And hospitality do not forget: for by this some, being not aware of it, have entertained angels.\"},{\"verse\":3,\"text\":\"Remember them that are in bands, as if you were bound with them: and them that labour, as being yourselves also in the body.\"},{\"verse\":4,\"text\":\"Marriage honourable in all, and the bed undefiled. For fornicators and adulterers God will judge.\"},{\"verse\":5,\"text\":\"Let your manners be without covetousness, contented with such things as you have. For he hath said: I will not leave thee: neither will I forsake thee.\"},{\"verse\":6,\"text\":\"So that we may confidently say: The Lord is my helper: I will not fear what man shall do to me.\"},{\"verse\":7,\"text\":\"Remember your prelates who have spoken the word of God to you: whose faith follow, considering the end of their conversation,\"},{\"verse\":8,\"text\":\"Jesus Christ, yesterday, and today: and the same for ever.\"},{\"verse\":9,\"text\":\"Be not led away with various and strange doctrines. For it is best that the heart be established with grace, not with meats: which have not profited those that walk in them.\"},{\"verse\":10,\"text\":\"We have an altar whereof they have no power to eat who serve the tabernacle.\"},{\"verse\":11,\"text\":\"For the bodies of those beasts whose blood is brought into the holies by the high priest for sin are burned without the camp.\"},{\"verse\":12,\"text\":\"Wherefore Jesus also, that he might sanctify the people by his own blood, suffered without the gate.\"},{\"verse\":13,\"text\":\"Let us go forth therefore to him without the camp, bearing his reproach.\"},{\"verse\":14,\"text\":\"For, we have not here a lasting city: but we seek one that is to come.\"},{\"verse\":15,\"text\":\"By him therefore let us offer the sacrifice of praise always to God, that is to say, the fruit of lips confessing to his name.\"},{\"verse\":16,\"text\":\"And do not forget to do good and to impart: for by such sacrifices God’s favour is obtained.\"},{\"verse\":17,\"text\":\"Obey your prelates and be subject to them. For they watch as being to render an account of your souls: that they may do this with joy and not with grief. For this is not expedient for you.\"},{\"verse\":18,\"text\":\"Pray for us. For we trust we have a good conscience, being willing to behave ourselves well in all things.\"},{\"verse\":19,\"text\":\"And I beseech you the more to do this, that I may be restored to you the sooner.\"},{\"verse\":20,\"text\":\"And may the God of peace, who brought again from the dead the great pastor of the sheep, our Lord Jesus Christ, in the blood of the everlasting testament,\"},{\"verse\":21,\"text\":\"Fit you in all goodness, that you may do his will; doing in you that which is well pleasing in his sight, through Jesus Christ, to whom is glory for ever and ever. Amen.\"},{\"verse\":22,\"text\":\"And I beseech you, brethren, that you suffer this word of consolation. For I have written to you in a few words.\"},{\"verse\":23,\"text\":\"Know ye that our brother Timothy is set at liberty: with whom (if he come shortly) I will see you.\"},{\"verse\":24,\"text\":\"Salute all your prelates and all the saints. The brethren from Italy salute you.\"},{\"verse\":25,\"text\":\"Grace be with you all. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Caritas fraternitatis maneat in vobis,\"},{\"verse\":2,\"text\":\"et hospitalitatem nolite oblivisci : per hanc enim latuerunt quidam, angelis hospitio receptis.\"},{\"verse\":3,\"text\":\"Mementote vinctorum, tamquam simul vincti : et laborantium, tamquam et ipsi in corpore morantes.\"},{\"verse\":4,\"text\":\"Honorabile connubium in omnibus, et thorus immaculatus. Fornicatores enim, et adulteros judicabit Deus.\"},{\"verse\":5,\"text\":\"Sint mores sine avaritia, contenti præsentibus : ipse enim dixit : Non te deseram, neque derelinquam :\"},{\"verse\":6,\"text\":\"ita ut confidenter dicamus : Dominus mihi adjutor : non timebo quid faciat mihi homo.\"},{\"verse\":7,\"text\":\"Mementote præpositorum vestrorum, qui vobis locuti sunt verbum Dei : quorum intuentes exitum conversationis, imitamini fidem.\"},{\"verse\":8,\"text\":\"Jesus Christus heri, et hodie : ipse et in sæcula.\"},{\"verse\":9,\"text\":\"Doctrinis variis et peregrinis nolite abduci. Optimum est enim gratia stabilire cor, non escis : quæ non profuerunt ambulantibus in eis.\"},{\"verse\":10,\"text\":\"Habemus altare, de quo edere non habent potestatem, qui tabernaculo deserviunt.\"},{\"verse\":11,\"text\":\"Quorum enim animalium infertur sanguis pro peccato in Sancta per pontificem, horum corpora cremantur extra castra.\"},{\"verse\":12,\"text\":\"Propter quod et Jesus, ut sanctificaret per suum sanguinem populum, extra portam passus est.\"},{\"verse\":13,\"text\":\"Exeamus igitur ad eum extra castra, improperium ejus portantes.\"},{\"verse\":14,\"text\":\"Non enim habemus hic manentem civitatem, sed futuram inquirimus.\"},{\"verse\":15,\"text\":\"Per ipsum ergo offeramus hostiam laudis semper Deo, id est, fructum labiorum confitentium nomini ejus.\"},{\"verse\":16,\"text\":\"Beneficentiæ autem et communionis nolite oblivisci : talibus enim hostiis promeretur Deus.\"},{\"verse\":17,\"text\":\"Obedite præpositis vestris, et subjacete eis. Ipsi enim pervigilant quasi rationem pro animabus vestris reddituri, ut cum gaudio hoc faciant, et non gementes : hoc enim non expedit vobis.\"},{\"verse\":18,\"text\":\"Orate pro nobis : confidimus enim quia bonam conscientiam habemus in omnibus bene volentes conversari.\"},{\"verse\":19,\"text\":\"Amplius autem deprecor vos hoc facere, quo celerius restituar vobis.\"},{\"verse\":20,\"text\":\"Deus autem pacis, qui eduxit de mortuis pastorem magnum ovium, in sanguine testamenti æterni, Dominum nostrum Jesum Christum,\"},{\"verse\":21,\"text\":\"aptet vos in omni bono, ut faciatis ejus voluntatem : faciens in vobis quod placeat coram se per Jesum Christum : cui est gloria in sæcula sæculorum. Amen.\"},{\"verse\":22,\"text\":\"Rogo autem vos fratres, ut sufferatis verbum solatii. Etenim perpaucis scripsi vobis.\"},{\"verse\":23,\"text\":\"Cognoscite fratrem nostrum Timotheum dimissum : cum quo (si celerius venerit) videbo vos.\"},{\"verse\":24,\"text\":\"Salutate omnes præpositos vestros, et omnes sanctos. Salutant vos de Italia fratres.\"},{\"verse\":25,\"text\":\"Gratia cum omnibus vobis. Amen.\"}],\"summary\":\"Divers admonitions and exhortations.\",\"intro\":null,\"prev\":{\"usfm\":\"HEB\",\"chapter\":12,\"label\":\"Hebrews 12\"},\"next\":{\"usfm\":\"JAS\",\"chapter\":1,\"label\":\"James 1\"}}]]\n"])</script></body></html>
