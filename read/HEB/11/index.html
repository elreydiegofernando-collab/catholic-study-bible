/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hebrews<!-- --> <span class="text-stone-500">11</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">What faith is. Its wonderful fruits and efficacy demonstrated in the fathers.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now, faith is the substance of things to be hoped for, the evidence of things that appear not.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For by this the ancients obtained a testimony.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>By faith we understand that the world was framed by the word of God: that from invisible things visible things might be made.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>By faith Abel offered to God a sacrifice exceeding that of Cain, by which he obtained a testimony that he was just, God giving testimony to his gifts. And by it he being dead yet speaketh.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>By faith Henoch was translated that he should not see death: and he was not found because God had translated him. For before his translation he had testimony that he pleased God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But without faith it is impossible to please God. For he that cometh to God must believe that he is: and is a rewarder to them that seek him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>By faith Noe, having received an answer concerning those things which as yet were not seen, moved with fear, framed the ark for the saving of his house: by the which he condemned the world and was instituted heir of the justice which is by faith.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>By faith he that is called Abraham obeyed to go out into a place which he was to receive for an inheritance. And he went out, not knowing whither he went.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>By faith he abode in the land of promise, as in a strange country, dwelling in cottages, with Isaac and Jacob, the co-heirs of the same promise.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For he looked for a city that hath foundations: whose builder and maker is God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>By faith also Sara herself, being barren, received strength to conceive seed, even past the time of age: because she believed that he was faithful who had promised,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For which cause there sprung even from one (and him as good as dead) as the stars of heaven in multitude and as the sand which is by the sea shore innumerable.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>All these died according to faith, not having received the promises but beholding them afar off and saluting them and confessing that they are pilgrims and strangers on the earth.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For they that say these things do signify that they seek a country.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And truly, if they had been mindful of that from whence they came out, they had doubtless, time to return.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But now they desire a better, that is to say, a heavenly country. Therefore, God is not ashamed to be called their God: for he hath prepared for them a city.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>By faith Abraham, when he was tried, offered Isaac: and he that had received the promises offered up his only begotten son,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>(To whom it was said: In Isaac shall thy seed be called:)</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Accounting that God is able to raise up even from the dead. Whereupon also he received him for a parable.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>By faith also of things to come Isaac blessed Jacob and Esau.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>By faith Jacob, dying, blessed each of the sons of Joseph and adored the top of his rod.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>By faith Joseph, when he was dying, made mention of the going out of the children of Israel and gave commandment concerning his bones.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>By faith Moses, when he was born, was hid three months by his parents: because they saw he was a comely babe, and they feared not the king’s edict.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>By faith Moses, when he was grown up, denied himself to be the son of Pharao’s daughter:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Rather choosing to be afflicted with the people of God than to have the pleasure of sin for a time:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Esteeming the reproach of Christ greater riches than the treasure of the Egyptians. For he looked unto the reward.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>By faith he left Egypt, not fearing the fierceness of the king: for he endured, as seeing him that is invisible.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>By faith he celebrated the pasch and the shedding of the blood: that he who destroyed the firstborn might not touch them.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>By faith they passed through the Red Sea, as by dry land: which the Egyptians attempting, were swallowed up.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>By faith the walls of Jericho fell down, by the going round them seven days.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>By faith Rahab the harlot perished not with the unbelievers, receiving the spies with peace.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And what shall I yet say? For the time would fail me to tell of Gedeon, Barac, Samson, Jephthe, David, Samuel, and the prophets:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who by faith conquered kingdoms, wrought justice, obtained promises, stopped the mouths of lions,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quenched the violence of fire, escaped the edge of the sword, recovered strength from weakness, became valiant in battle, put to flight the armies of foreigners.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Women received their dead raised to life again. But others were racked, not accepting deliverance, that they might find a better resurrection.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And others had trial of mockeries and stripes: moreover also of bands and prisons.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>They were stoned, they were cut asunder, they were tempted, they were put to death by the sword, they wandered about in sheepskins, in goatskins, being in want, distressed, afflicted:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Of whom the world was not worthy: wandering in deserts, in mountains and in dens and in caves of the earth.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And all these, being approved by the testimony of faith, received not the promise:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>God providing some better thing for us, that they should not be perfected without us.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Est autem fides sperandarum substantia rerum, argumentum non apparentium.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In hac enim testimonium consecuti sunt senes.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Fide intelligimus aptata esse sæcula verbo Dei : ut ex invisibilibus visibilia fierent.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Fide plurimam hostiam Abel, quam Cain, obtulit Deo, per quam testimonium consecutus est esse justus, testimonium perhibente muneribus ejus Deo, et per illam defunctus adhuc loquitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Fide Henoch translatus est ne videret mortem, et non inveniebatur, quia transtulit illum Deus : ante translationem enim testimonium habuit placuisse Deo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sine fide autem impossibile est placere Deo. Credere enim oportet accedentem ad Deum quia est, et inquirentibus se remunerator sit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fide Noë responso accepto de iis quæ adhuc non videbantur, metuens aptavit arcam in salutem domus suæ, per quam damnavit mundum : et justitiæ, quæ per fidem est, hæres est institutus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Fide qui vocatur Abraham obedivit in locum exire, quem accepturus erat in hæreditatem : et exiit, nesciens quo iret.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Fide demoratus est in terra repromissionis, tamquam in aliena, in casulis habitando cum Isaac et Jacob cohæredibus repromissionis ejusdem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Exspectabat enim fundamenta habentem civitatem : cujus artifex et conditor Deus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Fide et ipsa Sara sterilis virtutem in conceptionem seminis accepit, etiam præter tempus ætatis : quoniam fidelem credidit esse eum qui repromiserat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Propter quod et ab uno orti sunt (et hoc emortuo) tamquam sidera cæli in multitudinem, et sicut arena, quæ est ad oram maris, innumerabilis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Juxta fidem defuncti sunt omnes isti, non acceptis repromissionibus, sed a longe eas aspicientes, et salutantes, et confitentes quia peregrini et hospites sunt super terram.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui enim hæc dicunt, significant se patriam inquirere.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et si quidem ipsius meminissent de qua exierunt, habebant utique tempus revertendi :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>nunc autem meliorem appetunt, id est, cælestem. Ideo non confunditur Deus vocari Deus eorum : paravit enim illis civitatem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Fide obtulit Abraham Isaac, cum tentaretur, et unigenitum offerebat, qui susceperat repromissiones :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ad quem dictum est : Quia in Isaac vocabitur tibi semen :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>arbitrans quia et a mortuis suscitare potens est Deus : unde eum et in parabolam accepit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Fide et de futuris benedixit Isaac Jacob et Esau.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fide Jacob, moriens, singulos filiorum Joseph benedixit : et adoravit fastigium virgæ ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fide Joseph, moriens, de profectione filiorum Israël memoratus est, et de ossibus suis mandavit.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Fide Moyses, natus, occultatus est mensibus tribus a parentibus suis, eo quod vidissent elegantem infantem, et non timuerunt regis edictum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Fide Moyses grandis factus negavit se esse filium filiæ Pharaonis,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>magis eligens affligi cum populo Dei, quam temporalis peccati habere jucunditatem,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>majores divitias æstimans thesauro Ægyptiorum, improperium Christi : aspiciebat enim in remunerationem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Fide reliquit Ægyptum, non veritus animositatem regis : invisibilem enim tamquam videns sustinuit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Fide celebravit Pascha, et sanguinis effusionem : ne qui vastabat primitiva, tangeret eos.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Fide transierunt mare Rubrum tamquam per aridam terram : quod experti Ægyptii, devorati sunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Fide muri Jericho corruerunt, circuitu dierum septem.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Fide Rahab meretrix non periit cum incredulis, excipiens exploratores cum pace.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et quid adhuc dicam ? deficiet enim me tempus enarrantem de Gedeon, Barac, Samson, Jephte, David, Samuel, et prophetis :</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>qui per fidem vicerunt regna, operati sunt justitiam, adepti sunt repromissiones, obturaverunt ora leonum,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>extinxerunt impetum ignis, effugerunt aciem gladii, convaluerunt de infirmitate, fortes facti sunt in bello, castra verterunt exterorum :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>acceperunt mulieres de resurrectione mortuos suos : alii autem distenti sunt non suscipientes redemptionem ut meliorem invenirent resurrectionem.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Alii vero ludibria, et verbera experti, insuper et vincula, et carceres :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>lapidati sunt, secti sunt, tentati sunt, in occisione gladii mortui sunt, circuierunt in melotis, in pellibus caprinis, egentes, angustiati, afflicti :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>quibus dignus non erat mundus : in solitudinibus errantes, in montibus, in speluncis, et in cavernis terræ.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et hi omnes testimonio fidei probati, non acceperunt repromissionem,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Deo pro nobis melius aliquid providente, ut non sine nobis consummarentur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hebrews 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hebrews 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a tkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"HEB.11\",{\"bookId\":65,\"usfm\":\"HEB\",\"bookName\":\"Hebrews\",\"drName\":\"Hebrews\",\"chapter\":11,\"totalChapters\":13,\"dra\":[{\"verse\":1,\"text\":\"Now, faith is the substance of things to be hoped for, the evidence of things that appear not.\"},{\"verse\":2,\"text\":\"For by this the ancients obtained a testimony.\"},{\"verse\":3,\"text\":\"By faith we understand that the world was framed by the word of God: that from invisible things visible things might be made.\"},{\"verse\":4,\"text\":\"By faith Abel offered to God a sacrifice exceeding that of Cain, by which he obtained a testimony that he was just, God giving testimony to his gifts. And by it he being dead yet speaketh.\"},{\"verse\":5,\"text\":\"By faith Henoch was translated that he should not see death: and he was not found because God had translated him. For before his translation he had testimony that he pleased God.\"},{\"verse\":6,\"text\":\"But without faith it is impossible to please God. For he that cometh to God must believe that he is: and is a rewarder to them that seek him.\"},{\"verse\":7,\"text\":\"By faith Noe, having received an answer concerning those things which as yet were not seen, moved with fear, framed the ark for the saving of his house: by the which he condemned the world and was instituted heir of the justice which is by faith.\"},{\"verse\":8,\"text\":\"By faith he that is called Abraham obeyed to go out into a place which he was to receive for an inheritance. And he went out, not knowing whither he went.\"},{\"verse\":9,\"text\":\"By faith he abode in the land of promise, as in a strange country, dwelling in cottages, with Isaac and Jacob, the co-heirs of the same promise.\"},{\"verse\":10,\"text\":\"For he looked for a city that hath foundations: whose builder and maker is God.\"},{\"verse\":11,\"text\":\"By faith also Sara herself, being barren, received strength to conceive seed, even past the time of age: because she believed that he was faithful who had promised,\"},{\"verse\":12,\"text\":\"For which cause there sprung even from one (and him as good as dead) as the stars of heaven in multitude and as the sand which is by the sea shore innumerable.\"},{\"verse\":13,\"text\":\"All these died according to faith, not having received the promises but beholding them afar off and saluting them and confessing that they are pilgrims and strangers on the earth.\"},{\"verse\":14,\"text\":\"For they that say these things do signify that they seek a country.\"},{\"verse\":15,\"text\":\"And truly, if they had been mindful of that from whence they came out, they had doubtless, time to return.\"},{\"verse\":16,\"text\":\"But now they desire a better, that is to say, a heavenly country. Therefore, God is not ashamed to be called their God: for he hath prepared for them a city.\"},{\"verse\":17,\"text\":\"By faith Abraham, when he was tried, offered Isaac: and he that had received the promises offered up his only begotten son,\"},{\"verse\":18,\"text\":\"(To whom it was said: In Isaac shall thy seed be called:)\"},{\"verse\":19,\"text\":\"Accounting that God is able to raise up even from the dead. Whereupon also he received him for a parable.\"},{\"verse\":20,\"text\":\"By faith also of things to come Isaac blessed Jacob and Esau.\"},{\"verse\":21,\"text\":\"By faith Jacob, dying, blessed each of the sons of Joseph and adored the top of his rod.\"},{\"verse\":22,\"text\":\"By faith Joseph, when he was dying, made mention of the going out of the children of Israel and gave commandment concerning his bones.\"},{\"verse\":23,\"text\":\"By faith Moses, when he was born, was hid three months by his parents: because they saw he was a comely babe, and they feared not the king’s edict.\"},{\"verse\":24,\"text\":\"By faith Moses, when he was grown up, denied himself to be the son of Pharao’s daughter:\"},{\"verse\":25,\"text\":\"Rather choosing to be afflicted with the people of God than to have the pleasure of sin for a time:\"},{\"verse\":26,\"text\":\"Esteeming the reproach of Christ greater riches than the treasure of the Egyptians. For he looked unto the reward.\"},{\"verse\":27,\"text\":\"By faith he left Egypt, not fearing the fierceness of the king: for he endured, as seeing him that is invisible.\"},{\"verse\":28,\"text\":\"By faith he celebrated the pasch and the shedding of the blood: that he who destroyed the firstborn might not touch them.\"},{\"verse\":29,\"text\":\"By faith they passed through the Red Sea, as by dry land: which the Egyptians attempting, were swallowed up.\"},{\"verse\":30,\"text\":\"By faith the walls of Jericho fell down, by the going round them seven days.\"},{\"verse\":31,\"text\":\"By faith Rahab the harlot perished not with the unbelievers, receiving the spies with peace.\"},{\"verse\":32,\"text\":\"And what shall I yet say? For the time would fail me to tell of Gedeon, Barac, Samson, Jephthe, David, Samuel, and the prophets:\"},{\"verse\":33,\"text\":\"Who by faith conquered kingdoms, wrought justice, obtained promises, stopped the mouths of lions,\"},{\"verse\":34,\"text\":\"Quenched the violence of fire, escaped the edge of the sword, recovered strength from weakness, became valiant in battle, put to flight the armies of foreigners.\"},{\"verse\":35,\"text\":\"Women received their dead raised to life again. But others were racked, not accepting deliverance, that they might find a better resurrection.\"},{\"verse\":36,\"text\":\"And others had trial of mockeries and stripes: moreover also of bands and prisons.\"},{\"verse\":37,\"text\":\"They were stoned, they were cut asunder, they were tempted, they were put to death by the sword, they wandered about in sheepskins, in goatskins, being in want, distressed, afflicted:\"},{\"verse\":38,\"text\":\"Of whom the world was not worthy: wandering in deserts, in mountains and in dens and in caves of the earth.\"},{\"verse\":39,\"text\":\"And all these, being approved by the testimony of faith, received not the promise:\"},{\"verse\":40,\"text\":\"God providing some better thing for us, that they should not be perfected without us.\"}],\"vul\":[{\"verse\":1,\"text\":\"Est autem fides sperandarum substantia rerum, argumentum non apparentium.\"},{\"verse\":2,\"text\":\"In hac enim testimonium consecuti sunt senes.\"},{\"verse\":3,\"text\":\"Fide intelligimus aptata esse sæcula verbo Dei : ut ex invisibilibus visibilia fierent.\"},{\"verse\":4,\"text\":\"Fide plurimam hostiam Abel, quam Cain, obtulit Deo, per quam testimonium consecutus est esse justus, testimonium perhibente muneribus ejus Deo, et per illam defunctus adhuc loquitur.\"},{\"verse\":5,\"text\":\"Fide Henoch translatus est ne videret mortem, et non inveniebatur, quia transtulit illum Deus : ante translationem enim testimonium habuit placuisse Deo.\"},{\"verse\":6,\"text\":\"Sine fide autem impossibile est placere Deo. Credere enim oportet accedentem ad Deum quia est, et inquirentibus se remunerator sit.\"},{\"verse\":7,\"text\":\"Fide Noë responso accepto de iis quæ adhuc non videbantur, metuens aptavit arcam in salutem domus suæ, per quam damnavit mundum : et justitiæ, quæ per fidem est, hæres est institutus.\"},{\"verse\":8,\"text\":\"Fide qui vocatur Abraham obedivit in locum exire, quem accepturus erat in hæreditatem : et exiit, nesciens quo iret.\"},{\"verse\":9,\"text\":\"Fide demoratus est in terra repromissionis, tamquam in aliena, in casulis habitando cum Isaac et Jacob cohæredibus repromissionis ejusdem.\"},{\"verse\":10,\"text\":\"Exspectabat enim fundamenta habentem civitatem : cujus artifex et conditor Deus.\"},{\"verse\":11,\"text\":\"Fide et ipsa Sara sterilis virtutem in conceptionem seminis accepit, etiam præter tempus ætatis : quoniam fidelem credidit esse eum qui repromiserat.\"},{\"verse\":12,\"text\":\"Propter quod et ab uno orti sunt (et hoc emortuo) tamquam sidera cæli in multitudinem, et sicut arena, quæ est ad oram maris, innumerabilis.\"},{\"verse\":13,\"text\":\"Juxta fidem defuncti sunt omnes isti, non acceptis repromissionibus, sed a longe eas aspicientes, et salutantes, et confitentes quia peregrini et hospites sunt super terram.\"},{\"verse\":14,\"text\":\"Qui enim hæc dicunt, significant se patriam inquirere.\"},{\"verse\":15,\"text\":\"Et si quidem ipsius meminissent de qua exierunt, habebant utique tempus revertendi :\"},{\"verse\":16,\"text\":\"nunc autem meliorem appetunt, id est, cælestem. Ideo non confunditur Deus vocari Deus eorum : paravit enim illis civitatem.\"},{\"verse\":17,\"text\":\"Fide obtulit Abraham Isaac, cum tentaretur, et unigenitum offerebat, qui susceperat repromissiones :\"},{\"verse\":18,\"text\":\"ad quem dictum est : Quia in Isaac vocabitur tibi semen :\"},{\"verse\":19,\"text\":\"arbitrans quia et a mortuis suscitare potens est Deus : unde eum et in parabolam accepit.\"},{\"verse\":20,\"text\":\"Fide et de futuris benedixit Isaac Jacob et Esau.\"},{\"verse\":21,\"text\":\"Fide Jacob, moriens, singulos filiorum Joseph benedixit : et adoravit fastigium virgæ ejus.\"},{\"verse\":22,\"text\":\"Fide Joseph, moriens, de profectione filiorum Israël memoratus est, et de ossibus suis mandavit.\"},{\"verse\":23,\"text\":\"Fide Moyses, natus, occultatus est mensibus tribus a parentibus suis, eo quod vidissent elegantem infantem, et non timuerunt regis edictum.\"},{\"verse\":24,\"text\":\"Fide Moyses grandis factus negavit se esse filium filiæ Pharaonis,\"},{\"verse\":25,\"text\":\"magis eligens affligi cum populo Dei, quam temporalis peccati habere jucunditatem,\"},{\"verse\":26,\"text\":\"majores divitias æstimans thesauro Ægyptiorum, improperium Christi : aspiciebat enim in remunerationem.\"},{\"verse\":27,\"text\":\"Fide reliquit Ægyptum, non veritus animositatem regis : invisibilem enim tamquam videns sustinuit.\"},{\"verse\":28,\"text\":\"Fide celebravit Pascha, et sanguinis effusionem : ne qui vastabat primitiva, tangeret eos.\"},{\"verse\":29,\"text\":\"Fide transierunt mare Rubrum tamquam per aridam terram : quod experti Ægyptii, devorati sunt.\"},{\"verse\":30,\"text\":\"Fide muri Jericho corruerunt, circuitu dierum septem.\"},{\"verse\":31,\"text\":\"Fide Rahab meretrix non periit cum incredulis, excipiens exploratores cum pace.\"},{\"verse\":32,\"text\":\"Et quid adhuc dicam ? deficiet enim me tempus enarrantem de Gedeon, Barac, Samson, Jephte, David, Samuel, et prophetis :\"},{\"verse\":33,\"text\":\"qui per fidem vicerunt regna, operati sunt justitiam, adepti sunt repromissiones, obturaverunt ora leonum,\"},{\"verse\":34,\"text\":\"extinxerunt impetum ignis, effugerunt aciem gladii, convaluerunt de infirmitate, fortes facti sunt in bello, castra verterunt exterorum :\"},{\"verse\":35,\"text\":\"acceperunt mulieres de resurrectione mortuos suos : alii autem distenti sunt non suscipientes redemptionem ut meliorem invenirent resurrectionem.\"},{\"verse\":36,\"text\":\"Alii vero ludibria, et verbera experti, insuper et vincula, et carceres :\"},{\"verse\":37,\"text\":\"lapidati sunt, secti sunt, tentati sunt, in occisione gladii mortui sunt, circuierunt in melotis, in pellibus caprinis, egentes, angustiati, afflicti :\"},{\"verse\":38,\"text\":\"quibus dignus non erat mundus : in solitudinibus errantes, in montibus, in speluncis, et in cavernis terræ.\"},{\"verse\":39,\"text\":\"Et hi omnes testimonio fidei probati, non acceperunt repromissionem,\"},{\"verse\":40,\"text\":\"Deo pro nobis melius aliquid providente, ut non sine nobis consummarentur.\"}],\"summary\":\"What faith is. Its wonderful fruits and efficacy demonstrated in the fathers.\",\"intro\":null,\"prev\":{\"usfm\":\"HEB\",\"chapter\":10,\"label\":\"Hebrews 10\"},\"next\":{\"usfm\":\"HEB\",\"chapter\":12,\"label\":\"Hebrews 12\"}}]]\n"])</script></body></html>
