[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hebrews<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/HEB/">About <!-- -->Hebrews</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The sacrifices of the law were far inferior to that of Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>The former indeed had also justifications of divine service and a worldly sanctuary.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For there was a tabernacle made the first, wherein were the candlesticks and the table and the setting forth of loaves, which is called the Holy.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And after the second veil, the tabernacle which is called the Holy of Holies:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Having a golden censer and the ark of the testament covered about on every part with gold, in which was a golden pot that had manna and the rod of Aaron that had blossomed and the tables of the testament.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And over it were the cherubims of glory overshadowing the propitiatory: of which it is not needful to speak now particularly.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now these things being thus ordered, into the first tabernacle, the priests indeed always entered, accomplishing the offices of sacrifices.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But into the second, the high priest alone, once a year: not without blood, which he offereth for his own and the people’s ignorance:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Holy Ghost signifying this: That the way into the Holies was not yet made manifest, whilst the former tabernacle was yet standing.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Which is a parable of the time present: according to which gifts and sacrifices are offered, which cannot, as to the conscience, make him perfect that serveth, only in meats and in drinks,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And divers washings and justices of the flesh laid on them until the time of correction.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But Christ, being come an high priest of the good things to come, by a greater and more perfect tabernacle, not made with hand, that is, not of this creation:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Neither by the blood of goats or of calves, but by his own blood, entered once into the Holies, having obtained eternal redemption.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For if the blood of goats and of oxen, and the ashes of an heifer, being sprinkled, sanctify such as are defiled, to the cleansing of the flesh:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>How much more shall the blood of Christ, who by the Holy Ghost offered himself unspotted unto God, cleanse our conscience from dead works, to serve the living God?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And therefore he is the mediator of the new testament: that by means of his death for the redemption of those transgressions which were under the former testament, they that are called may receive the promise of eternal inheritance.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For where there is a testament the death of the testator must of necessity come in.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For a testament is of force after men are dead: otherwise it is as yet of no strength, whilst the testator liveth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Whereupon neither was the first indeed dedicated without blood.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For when every commandment of the law had been read by Moses to all the people, he took the blood of calves and goats, with water, and scarlet wool and hyssop, and sprinkled both the book itself and all the people.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Saying: This is the blood of the testament which God hath enjoined unto you.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The tabernacle also and all the vessels of the ministry, in like manner, he sprinkled with blood.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And almost all things, according to the law, are cleansed with blood: and without shedding of blood there is no remission.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>It is necessary therefore that the patterns of heavenly things should be cleansed with these: but the heavenly things themselves with better sacrifices than these.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For Jesus is not entered into the Holies made with hands, the patterns of the true: but into Heaven itself, that he may appear now in the presence of God for us.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Nor yet that he should offer himself often, as the high priest entereth into the Holies every year with the blood of others:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For then he ought to have suffered often from the beginning of the world. But now once, at the end of ages, he hath appeared for the destruction of sin by the sacrifice of himself.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And as it is appointed unto men once to die, and after this the judgment:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>So also Christ was offered once to exhaust the sins of many. The second time he shall appear without sin to them that expect him unto salvation.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Habuit quidem et prius justificationes culturæ, et Sanctum sæculare.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tabernaculum enim factum est primum, in quo erant candelabra, et mensa, et propositio panum, quæ dicitur Sancta.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Post velamentum autem secundum, tabernaculum, quod dicitur Sancta sanctorum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>aureum habens thuribulum, et arcam testamenti circumtectam ex omni parte auro, in qua urna aurea habens manna, et virga Aaron, quæ fronduerat, et tabulæ testamenti,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>superque eam erant cherubim gloriæ obumbrantia propitiatorium : de quibus non est modo dicendum per singula.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>His vero ita compositis, in priori quidem tabernaculo semper introibant sacerdotes, sacrificiorum officia consummantes :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>in secundo autem semel in anno solus pontifex non sine sanguine, quem offert pro sua et populi ignorantia :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>hoc significante Spiritu Sancto, nondum propalatam esse sanctorum viam, adhuc priore tabernaculo habente statum :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>quæ parabola est temporis instantis : juxta quam munera, et hostiæ offeruntur, quæ non possunt juxta conscientiam perfectum facere servientem, solummodo in cibis, et in potibus,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et variis baptismatibus, et justitiis carnis usque ad tempus correctionis impositis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Christus autem assistens pontifex futurorum bonorum, per amplius et perfectius tabernaculum, non manufactum, id est, non hujus creationis :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>neque per sanguinem hircorum aut vitulorum, sed per proprium sanguinem introivit semel in Sancta, æterna redemptione inventa.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Si enim sanguis hircorum et taurorum, et cinis vitulæ aspersus inquinatos sanctificat ad emundationem carnis :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>quanto magis sanguis Christi, qui per Spiritum Sanctum semetipsum obtulit immaculatum Deo, emundabit conscientiam nostram ab operibus mortuis, ad serviendum Deo viventi ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ideo novi testamenti mediator est : ut morte intercedente, in redemptionem earum prævaricationum, quæ erant sub priori testamento, repromissionem accipiant qui vocati sunt æternæ hæreditatis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ubi enim testamentum est, mors necesse est intercedat testatoris.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Testamentum enim in mortuis confirmatum est : alioquin nondum valet, dum vivit qui testatus est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Unde nec primum quidem sine sanguine dedicatum est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Lecto enim omni mandato legis a Moyse universo populo, accipiens sanguinem vitulorum et hircorum cum aqua, et lana coccinea, et hyssopo, ipsum quoque librum, et omnem populum aspersit,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>dicens : Hic sanguis testamenti, quod mandavit ad vos Deus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Etiam tabernaculum et omnia vasa ministerii sanguine similiter aspersit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et omnia pene in sanguine secundum legem mundantur : et sine sanguinis effusione non fit remissio.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Necesse est ergo exemplaria quidem cælestium his mundari : ipsa autem cælestia melioribus hostiis quam istis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Non enim in manufacta Sancta Jesus introivit exemplaria verorum : sed in ipsum cælum, ut appareat nunc vultui Dei pro nobis :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>neque ut sæpe offerat semetipsum, quemadmodum pontifex intrat in Sancta per singulos annos in sanguine alieno :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>alioquin oportebat eum frequenter pati ab origine mundi : nunc autem semel in consummatione sæculorum, ad destitutionem peccati, per hostiam suam apparuit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et quemadmodum statutum est hominibus semel mori, post hoc autem judicium :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>sic et Christus semel oblatus est ad multorum exhaurienda peccata : secundo sine peccato apparebit exspectantibus se, in salutem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hebrews 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hebrews 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Hebr ces are offered, which cannot, as to the conscience, make him perfect that serveth, only in meats and in drinks,\"},{\"verse\":10,\"text\":\"And divers washings and justices of the flesh laid on them until the time of correction.\"},{\"verse\":11,\"text\":\"But Christ, being come an high priest of the good things to come, by a greater and more perfect tabernacle, not made with hand, that is, not of this creation:\"},{\"verse\":12,\"text\":\"Neither by the blood of goats or of calves, but by his own blood, entered once into the Holies, having obtained eternal redemption.\"},{\"verse\":13,\"text\":\"For if the blood of goats and of oxen, and the ashes of an heifer, being sprinkled, sanctify such as are defiled, to the cleansing of the flesh:\"},{\"verse\":14,\"text\":\"How much more shall the blood of Christ, who by the Holy Ghost offered himself unspotted unto God, cleanse our conscience from dead works, to serve the living God?\"},{\"verse\":15,\"text\":\"And therefore he is the mediator of the new testament: that by means of his death for the redemption of those transgressions which were under the former testament, they that are called may receive the promise of eternal inheritance.\"},{\"verse\":16,\"text\":\"For where there is a testament the death of the testator must of necessity come in.\"},{\"verse\":17,\"text\":\"For a testament is of force after men are dead: otherwise it is as yet of no strength, whilst the testator liveth.\"},{\"verse\":18,\"text\":\"Whereupon neither was the first indeed dedicated without blood.\"},{\"verse\":19,\"text\":\"For when every commandment of the law had been read by Moses to all the people, he took the blood of calves and goats, with water, and scarlet wool and hyssop, and sprinkled both the book itself and all the people.\"},{\"verse\":20,\"text\":\"Saying: This is the blood of the testament which God hath enjoined unto you.\"},{\"verse\":21,\"text\":\"The tabernacle also and all the vessels of the ministry, in like manner, he sprinkled with blood.\"},{\"verse\":22,\"text\":\"And almost all things, according to the law, are cleansed with blood: and without shedding of blood there is no remission.\"},{\"verse\":23,\"text\":\"It is necessary therefore that the patterns of heavenly things should be cleansed with these: but the heavenly things themselves with better sacrifices than these.\"},{\"verse\":24,\"text\":\"For Jesus is not entered into the Holies made with hands, the patterns of the true: but into Heaven itself, that he may appear now in the presence of God for us.\"},{\"verse\":25,\"text\":\"Nor yet that he should offer himself often, as the high priest entereth into the Holies every year with the blood of others:\"},{\"verse\":26,\"text\":\"For then he ought to have suffered often from the beginning of the world. But now once, at the end of ages, he hath appeared for the destruction of sin by the sacrifice of himself.\"},{\"verse\":27,\"text\":\"And as it is appointed unto men once to die, and after this the judgment:\"},{\"verse\":28,\"text\":\"So also Christ was offered once to exhaust the sins of many. The second time he shall appear without sin to them that expect him unto salvation.\"}],\"vul\":[{\"verse\":1,\"text\":\"Habuit quidem et prius justificationes culturæ, et Sanctum sæculare.\"},{\"verse\":2,\"text\":\"Tabernaculum enim factum est primum, in quo erant candelabra, et mensa, et propositio panum, quæ dicitur Sancta.\"},{\"verse\":3,\"text\":\"Post velamentum autem secundum, tabernaculum, quod dicitur Sancta sanctorum :\"},{\"verse\":4,\"text\":\"aureum habens thuribulum, et arcam testamenti circumtectam ex omni parte auro, in qua urna aurea habens manna, et virga Aaron, quæ fronduerat, et tabulæ testamenti,\"},{\"verse\":5,\"text\":\"superque eam erant cherubim gloriæ obumbrantia propitiatorium : de quibus non est modo dicendum per singula.\"},{\"verse\":6,\"text\":\"His vero ita compositis, in priori quidem tabernaculo semper introibant sacerdotes, sacrificiorum officia consummantes :\"},{\"verse\":7,\"text\":\"in secundo autem semel in anno solus pontifex non sine sanguine, quem offert pro sua et populi ignorantia :\"},{\"verse\":8,\"text\":\"hoc significante Spiritu Sancto, nondum propalatam esse sanctorum viam, adhuc priore tabernaculo habente statum :\"},{\"verse\":9,\"text\":\"quæ parabola est temporis instantis : juxta quam munera, et hostiæ offeruntur, quæ non possunt juxta conscientiam perfectum facere servientem, solummodo in cibis, et in potibus,\"},{\"verse\":10,\"text\":\"et variis baptismatibus, et justitiis carnis usque ad tempus correctionis impositis.\"},{\"verse\":11,\"text\":\"Christus autem assistens pontifex futurorum bonorum, per amplius et perfectius tabernaculum, non manufactum, id est, non hujus creationis :\"},{\"verse\":12,\"text\":\"neque per sanguinem hircorum aut vitulorum, sed per proprium sanguinem introivit semel in Sancta, æterna redemptione inventa.\"},{\"verse\":13,\"text\":\"Si enim sanguis hircorum et taurorum, et cinis vitulæ aspersus inquinatos sanctificat ad emundationem carnis :\"},{\"verse\":14,\"text\":\"quanto magis sanguis Christi, qui per Spiritum Sanctum semetipsum obtulit immaculatum Deo, emundabit conscientiam nostram ab operibus mortuis, ad serviendum Deo viventi ?\"},{\"verse\":15,\"text\":\"Et ideo novi testamenti mediator est : ut morte intercedente, in redemptionem earum prævaricationum, quæ erant sub priori testamento, repromissionem accipiant qui vocati sunt æternæ hæreditatis.\"},{\"verse\":16,\"text\":\"Ubi enim testamentum est, mors necesse est intercedat testatoris.\"},{\"verse\":17,\"text\":\"Testamentum enim in mortuis confirmatum est : alioquin nondum valet, dum vivit qui testatus est.\"},{\"verse\":18,\"text\":\"Unde nec primum quidem sine sanguine dedicatum est.\"},{\"verse\":19,\"text\":\"Lecto enim omni mandato legis a Moyse universo populo, accipiens sanguinem vitulorum et hircorum cum aqua, et lana coccinea, et hyssopo, ipsum quoque librum, et omnem populum aspersit,\"},{\"verse\":20,\"text\":\"dicens : Hic sanguis testamenti, quod mandavit ad vos Deus.\"},{\"verse\":21,\"text\":\"Etiam tabernaculum et omnia vasa ministerii sanguine similiter aspersit.\"},{\"verse\":22,\"text\":\"Et omnia pene in sanguine secundum legem mundantur : et sine sanguinis effusione non fit remissio.\"},{\"verse\":23,\"text\":\"Necesse est ergo exemplaria quidem cælestium his mundari : ipsa autem cælestia melioribus hostiis quam istis.\"},{\"verse\":24,\"text\":\"Non enim in manufacta Sancta Jesus introivit exemplaria verorum : sed in ipsum cælum, ut appareat nunc vultui Dei pro nobis :\"},{\"verse\":25,\"text\":\"neque ut sæpe offerat semetipsum, quemadmodum pontifex intrat in Sancta per singulos annos in sanguine alieno :\"},{\"verse\":26,\"text\":\"alioquin oportebat eum frequenter pati ab origine mundi : nunc autem semel in consummatione sæculorum, ad destitutionem peccati, per hostiam suam apparuit.\"},{\"verse\":27,\"text\":\"Et quemadmodum statutum est hominibus semel mori, post hoc autem judicium :\"},{\"verse\":28,\"text\":\"sic et Christus semel oblatus est ad multorum exhaurienda peccata : secundo sine peccato apparebit exspectantibus se, in salutem.\"}],\"summary\":\"The sacrifices of the law were far inferior to that of Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"HEB\",\"chapter\":8,\"label\":\"Hebrews 8\"},\"next\":{\"usfm\":\"HEB\",\"chapter\":10,\"label\":\"Hebrews 10\"}}]]\n"])</script></body></html>
