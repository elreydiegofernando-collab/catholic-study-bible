wards God,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Of the doctrine of baptisms and imposition of hands, and of the resurrection of the dead, and of eternal judgment.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And this will we do, if God permit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For it is impossible for those who were once illuminated, have tasted also the heavenly gift and were made partakers of the Holy Ghost,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Have moreover tasted the good word of God and the powers of the world to come,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And are fallen away: to be renewed again to penance, crucifying again to themselves the Son of God and making him a mockery.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For the earth, that drinketh in the rain which cometh often upon it and bringeth forth herbs meet for them by whom it is tilled, receiveth blessing from God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But that which bringeth forth thorns and briers is reprobate and very near unto a curse: whose end is to be burnt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But, my dearly beloved, we trust better things of you, and nearer to salvation; though we speak thus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For God is not unjust, that he should forget your work and the love which you have shewn in his name, you who have ministered and do minister to the saints.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And we desire that every one of you shew forth the same carefulness to the accomplishing of hope unto the end:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>That you become not slothful, but followers of them who through faith and patience shall inherit the promises.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For God making promise to Abraham, because he had no one greater by whom he might swear, swore by himself,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Saying: Unless blessing I shall bless thee and multiplying I shall multiply thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And so patiently enduring he obtained the promise.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For men swear by one greater than themselves: and an oath for confirmation is the end of all their controversy.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Wherein God, meaning more abundantly to shew to the heirs of the promise the immutability of his counsel, interposed an oath:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>That by two immutable things in which it is impossible for God to lie, we may have the strongest comfort, we who have fled for refuge to hold fast the hope set before us.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Which we have as an anchor of the soul, sure and firm, and which entereth in even within the veil:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Where the forerunner Jesus is entered for us, made a high priest for ever according to the order of Melchisedech.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quapropter intermittentes inchoationis Christi sermonem, ad perfectiora feramur, non rursum jacientes fundamentum pœnitentiæ ab operibus mortuis, et fidei ad Deum,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>baptismatum doctrinæ, impositionis quoque manuum, ac resurrectionis mortuorum, et judicii æterni.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et hoc faciemus, si quidem permiserit Deus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Impossibile est enim eos qui semel sunt illuminati, gustaverunt etiam donum cæleste, et participes facti sunt Spiritus Sancti,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>gustaverunt nihilominus bonum Dei verbum, virtutesque sæculi venturi,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et prolapsi sunt ; rursus renovari ad pœnitentiam, rursum crucifigentes sibimetipsis Filium Dei, et ostentui habentes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Terra enim sæpe venientem super se bibens imbrem, et generans herbam opportunam illis, a quibus colitur, accipit benedictionem a Deo :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>proferens autem spinas ac tribulos, reproba est, et maledicto proxima : cujus consummatio in combustionem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Confidimus autem de vobis dilectissimi meliora, et viciniora saluti : tametsi ita loquimur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non enim injustus Deus, ut obliviscatur operis vestri, et dilectionis, quam ostendistis in nomine ipsius, qui ministrastis sanctis, et ministratis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cupimus autem unumquemque vestrum eamdem ostentare sollicitudinem ad expletionem spei usque in finem :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ut non segnes efficiamini, verum imitatores eorum, qui fide, et patientia hæreditabunt promissiones.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Abrahæ namque promittens Deus, quoniam neminem habuit, per quem juraret, majorem, juravit per semetipsum,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>dicens : Nisi benedicens benedicam te, et multiplicans multiplicabo te.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et sic longanimiter ferens, adeptus est repromissionem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Homines enim per majorem sui jurant : et omnis controversiæ eorum finis, ad confirmationem, est juramentum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In quo abundantius volens Deus ostendere pollicitationis hæredibus, immobilitatem consilii sui, interposuit jusjurandum :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ut per duas res immobiles, quibus impossibile est mentiri Deum, fortissimum solatium habeamus, qui confugimus ad tenendam propositam spem,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>quam sicut anchoram habemus animæ tutam ac firmam, et incedentem usque ad interiora velaminis,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ubi præcursor pro nobis introivit Jesus, secundum ordinem Melchisedech pontifex factus in æternum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hebrews 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hebrews 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Hebrews 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6-6 6-6"></pa ra\":[{\"verse\":1,\"text\":\"Wherefore, leaving the word of the beginning of Christ, let us go on to things more perfect: not laying again the foundation of penance from dead works and of faith towards God,\"},{\"verse\":2,\"text\":\"Of the doctrine of baptisms and imposition of hands, and of the resurrection of the dead, and of eternal judgment.\"},{\"verse\":3,\"text\":\"And this will we do, if God permit.\"},{\"verse\":4,\"text\":\"For it is impossible for those who were once illuminated, have tasted also the heavenly gift and were made partakers of the Holy Ghost,\"},{\"verse\":5,\"text\":\"Have moreover tasted the good word of God and the powers of the world to come,\"},{\"verse\":6,\"text\":\"And are fallen away: to be renewed again to penance, crucifying again to themselves the Son of God and making him a mockery.\"},{\"verse\":7,\"text\":\"For the earth, that drinketh in the rain which cometh often upon it and bringeth forth herbs meet for them by whom it is tilled, receiveth blessing from God.\"},{\"verse\":8,\"text\":\"But that which bringeth forth thorns and briers is reprobate and very near unto a curse: whose end is to be burnt.\"},{\"verse\":9,\"text\":\"But, my dearly beloved, we trust better things of you, and nearer to salvation; though we speak thus.\"},{\"verse\":10,\"text\":\"For God is not unjust, that he should forget your work and the love which you have shewn in his name, you who have ministered and do minister to the saints.\"},{\"verse\":11,\"text\":\"And we desire that every one of you shew forth the same carefulness to the accomplishing of hope unto the end:\"},{\"verse\":12,\"text\":\"That you become not slothful, but followers of them who through faith and patience shall inherit the promises.\"},{\"verse\":13,\"text\":\"For God making promise to Abraham, because he had no one greater by whom he might swear, swore by himself,\"},{\"verse\":14,\"text\":\"Saying: Unless blessing I shall bless thee and multiplying I shall multiply thee.\"},{\"verse\":15,\"text\":\"And so patiently enduring he obtained the promise.\"},{\"verse\":16,\"text\":\"For men swear by one greater than themselves: and an oath for confirmation is the end of all their controversy.\"},{\"verse\":17,\"text\":\"Wherein God, meaning more abundantly to shew to the heirs of the promise the immutability of his counsel, interposed an oath:\"},{\"verse\":18,\"text\":\"That by two immutable things in which it is impossible for God to lie, we may have the strongest comfort, we who have fled for refuge to hold fast the hope set before us.\"},{\"verse\":19,\"text\":\"Which we have as an anchor of the soul, sure and firm, and which entereth in even within the veil:\"},{\"verse\":20,\"text\":\"Where the forerunner Jesus is entered for us, made a high priest for ever according to the order of Melchisedech.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quapropter intermittentes inchoationis Christi sermonem, ad perfectiora feramur, non rursum jacientes fundamentum pœnitentiæ ab operibus mortuis, et fidei ad Deum,\"},{\"verse\":2,\"text\":\"baptismatum doctrinæ, impositionis quoque manuum, ac resurrectionis mortuorum, et judicii æterni.\"},{\"verse\":3,\"text\":\"Et hoc faciemus, si quidem permiserit Deus.\"},{\"verse\":4,\"text\":\"Impossibile est enim eos qui semel sunt illuminati, gustaverunt etiam donum cæleste, et participes facti sunt Spiritus Sancti,\"},{\"verse\":5,\"text\":\"gustaverunt nihilominus bonum Dei verbum, virtutesque sæculi venturi,\"},{\"verse\":6,\"text\":\"et prolapsi sunt ; rursus renovari ad pœnitentiam, rursum crucifigentes sibimetipsis Filium Dei, et ostentui habentes.\"},{\"verse\":7,\"text\":\"Terra enim sæpe venientem super se bibens imbrem, et generans herbam opportunam illis, a quibus colitur, accipit benedictionem a Deo :\"},{\"verse\":8,\"text\":\"proferens autem spinas ac tribulos, reproba est, et maledicto proxima : cujus consummatio in combustionem.\"},{\"verse\":9,\"text\":\"Confidimus autem de vobis dilectissimi meliora, et viciniora saluti : tametsi ita loquimur.\"},{\"verse\":10,\"text\":\"Non enim injustus Deus, ut obliviscatur operis vestri, et dilectionis, quam ostendistis in nomine ipsius, qui ministrastis sanctis, et ministratis.\"},{\"verse\":11,\"text\":\"Cupimus autem unumquemque vestrum eamdem ostentare sollicitudinem ad expletionem spei usque in finem :\"},{\"verse\":12,\"text\":\"ut non segnes efficiamini, verum imitatores eorum, qui fide, et patientia hæreditabunt promissiones.\"},{\"verse\":13,\"text\":\"Abrahæ namque promittens Deus, quoniam neminem habuit, per quem juraret, majorem, juravit per semetipsum,\"},{\"verse\":14,\"text\":\"dicens : Nisi benedicens benedicam te, et multiplicans multiplicabo te.\"},{\"verse\":15,\"text\":\"Et sic longanimiter ferens, adeptus est repromissionem.\"},{\"verse\":16,\"text\":\"Homines enim per majorem sui jurant : et omnis controversiæ eorum finis, ad confirmationem, est juramentum.\"},{\"verse\":17,\"text\":\"In quo abundantius volens Deus ostendere pollicitationis hæredibus, immobilitatem consilii sui, interposuit jusjurandum :\"},{\"verse\":18,\"text\":\"ut per duas res immobiles, quibus impossibile est mentiri Deum, fortissimum solatium habeamus, qui confugimus ad tenendam propositam spem,\"},{\"verse\":19,\"text\":\"quam sicut anchoram habemus animæ tutam ac firmam, et incedentem usque ad interiora velaminis,\"},{\"verse\":20,\"text\":\"ubi præcursor pro nobis introivit Jesus, secundum ordinem Melchisedech pontifex factus in æternum.\"}],\"summary\":\"He warns them of the danger of falling by apostasy and exhorts them to patience and perseverance.\",\"intro\":null,\"prev\":{\"usfm\":\"HEB\",\"chapter\":5,\"label\":\"Hebrews 5\"},\"next\":{\"usfm\":\"HEB\",\"chapter\":7,\"label\":\"Hebrews 7\"}}]]\n"])</script></body></html>
