[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Hebrews<!-- --> <span class="text-stone-500">8</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/HEB/">About <!-- -->Hebrews</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">More of the excellence of the priesthood of Christ and of the New Testament.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now of the things which we have spoken, this is the sum: We have such an high priest who is set on the right hand of the throne of majesty in the heavens,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A minister of the holies and of the true tabernacle, which the Lord hath pitched, and not man.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For every high priest is appointed to offer gifts and sacrifices: wherefore it is necessary that he also should have some thing to offer.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>If then he were on earth, he would not be a priest: seeing that there would be others to offer gifts according to the law.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Who serve unto the example and shadow of heavenly things. As it was answered to Moses, when he was to finish the tabernacle: See (saith he) that thou make all things according to the pattern which was shewn thee on the mount.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But now he hath obtained a better ministry, by how much also he is a mediator of a better testament which is established on better promises.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For if that former had been faultless, there should not indeed a place have been sought for a second.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For, finding fault with them, he saith: Behold the days shall come, saith the Lord: and I will perfect, unto the house of Israel and unto the house of Juda, a new testament:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Not according to the testament which I made to their fathers, on the day when I took them by the hand to lead them out of the land of Egypt: because they continued not in my testament: and I regarded them not, saith the Lord.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For this is the testament which I will make to the house of Israel after those days, saith the Lord: I will give my laws into their mind: and in their heart will I write them. And I will be their God: and they shall be my people.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they shall not teach every man his neighbour and every man his brother, saying: Know the Lord. For all shall know me, from the least to the greatest of them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Because I will be merciful to their iniquities: and their sins I will remember no more.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Now in saying a new, he hath made the former old. And that which decayeth and groweth old is near its end.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Capitulum autem super ea quæ dicuntur : Talem habemus pontificem, qui consedit in dextera sedis magnitudinis in cælis,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sanctorum minister, et tabernaculi veri, quod fixit Dominus, et non homo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Omnis enim pontifex ad offerendum munera, et hostias constituitur : unde necesse est et hunc habere aliquid, quod offerat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si ergo esset super terram, nec esset sacerdos : cum essent qui offerent secundum legem munera,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>qui exemplari, et umbræ deserviunt cælestium. Sicut responsum est Moysi, cum consummaret tabernaculum : Vide (inquit) omnia facito secundum exemplar, quod tibi ostensum est in monte.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nunc autem melius sortitus est ministerium, quanto et melioris testamenti mediator est, quod in melioribus repromissionibus sancitum est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nam si illud prius culpa vacasset, non utique secundi locus inquireretur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Vituperans enim eos dicit : Ecce dies venient, dicit Dominus : et consummabo super domum Israël, et super domum Juda, testamentum novum,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>non secundum testamentum quod feci patribus eorum in die qua apprehendi manum eorum ut educerem illos de terra Ægypti : quoniam ipsi non permanserunt in testamento meo : et ego neglexi eos, dicit Dominus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quia hoc est testamentum quod disponam domui Israël post dies illos, dicit Dominus : dando leges meas in mentem eorum, et in corde eorum superscribam eas : et ero eis in Deum, et ipsi erunt mihi in populum :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et non docebit unusquisque proximum suum, et unusquisque fratrem suum, dicens : Cognosce Dominum : quoniam omnes scient me a minore usque ad majorem eorum :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quia propitius ero iniquitatibus eorum, et peccatorum eorum jam non memorabor.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dicendo autem novum : veteravit prius. Quod autem antiquatur, et senescit, prope interitum est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Hebrews 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HEB/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Hebrews 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->8<!-- --> of <!-- -->13<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Hebrews 7" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active: ype\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"HEB.8\",{\"bookId\":65,\"usfm\":\"HEB\",\"bookName\":\"Hebrews\",\"drName\":\"Hebrews\",\"chapter\":8,\"totalChapters\":13,\"dra\":[{\"verse\":1,\"text\":\"Now of the things which we have spoken, this is the sum: We have such an high priest who is set on the right hand of the throne of majesty in the heavens,\"},{\"verse\":2,\"text\":\"A minister of the holies and of the true tabernacle, which the Lord hath pitched, and not man.\"},{\"verse\":3,\"text\":\"For every high priest is appointed to offer gifts and sacrifices: wherefore it is necessary that he also should have some thing to offer.\"},{\"verse\":4,\"text\":\"If then he were on earth, he would not be a priest: seeing that there would be others to offer gifts according to the law.\"},{\"verse\":5,\"text\":\"Who serve unto the example and shadow of heavenly things. As it was answered to Moses, when he was to finish the tabernacle: See (saith he) that thou make all things according to the pattern which was shewn thee on the mount.\"},{\"verse\":6,\"text\":\"But now he hath obtained a better ministry, by how much also he is a mediator of a better testament which is established on better promises.\"},{\"verse\":7,\"text\":\"For if that former had been faultless, there should not indeed a place have been sought for a second.\"},{\"verse\":8,\"text\":\"For, finding fault with them, he saith: Behold the days shall come, saith the Lord: and I will perfect, unto the house of Israel and unto the house of Juda, a new testament:\"},{\"verse\":9,\"text\":\"Not according to the testament which I made to their fathers, on the day when I took them by the hand to lead them out of the land of Egypt: because they continued not in my testament: and I regarded them not, saith the Lord.\"},{\"verse\":10,\"text\":\"For this is the testament which I will make to the house of Israel after those days, saith the Lord: I will give my laws into their mind: and in their heart will I write them. And I will be their God: and they shall be my people.\"},{\"verse\":11,\"text\":\"And they shall not teach every man his neighbour and every man his brother, saying: Know the Lord. For all shall know me, from the least to the greatest of them.\"},{\"verse\":12,\"text\":\"Because I will be merciful to their iniquities: and their sins I will remember no more.\"},{\"verse\":13,\"text\":\"Now in saying a new, he hath made the former old. And that which decayeth and groweth old is near its end.\"}],\"vul\":[{\"verse\":1,\"text\":\"Capitulum autem super ea quæ dicuntur : Talem habemus pontificem, qui consedit in dextera sedis magnitudinis in cælis,\"},{\"verse\":2,\"text\":\"sanctorum minister, et tabernaculi veri, quod fixit Dominus, et non homo.\"},{\"verse\":3,\"text\":\"Omnis enim pontifex ad offerendum munera, et hostias constituitur : unde necesse est et hunc habere aliquid, quod offerat.\"},{\"verse\":4,\"text\":\"Si ergo esset super terram, nec esset sacerdos : cum essent qui offerent secundum legem munera,\"},{\"verse\":5,\"text\":\"qui exemplari, et umbræ deserviunt cælestium. Sicut responsum est Moysi, cum consummaret tabernaculum : Vide (inquit) omnia facito secundum exemplar, quod tibi ostensum est in monte.\"},{\"verse\":6,\"text\":\"Nunc autem melius sortitus est ministerium, quanto et melioris testamenti mediator est, quod in melioribus repromissionibus sancitum est.\"},{\"verse\":7,\"text\":\"Nam si illud prius culpa vacasset, non utique secundi locus inquireretur.\"},{\"verse\":8,\"text\":\"Vituperans enim eos dicit : Ecce dies venient, dicit Dominus : et consummabo super domum Israël, et super domum Juda, testamentum novum,\"},{\"verse\":9,\"text\":\"non secundum testamentum quod feci patribus eorum in die qua apprehendi manum eorum ut educerem illos de terra Ægypti : quoniam ipsi non permanserunt in testamento meo : et ego neglexi eos, dicit Dominus.\"},{\"verse\":10,\"text\":\"Quia hoc est testamentum quod disponam domui Israël post dies illos, dicit Dominus : dando leges meas in mentem eorum, et in corde eorum superscribam eas : et ero eis in Deum, et ipsi erunt mihi in populum :\"},{\"verse\":11,\"text\":\"et non docebit unusquisque proximum suum, et unusquisque fratrem suum, dicens : Cognosce Dominum : quoniam omnes scient me a minore usque ad majorem eorum :\"},{\"verse\":12,\"text\":\"quia propitius ero iniquitatibus eorum, et peccatorum eorum jam non memorabor.\"},{\"verse\":13,\"text\":\"Dicendo autem novum : veteravit prius. Quod autem antiquatur, et senescit, prope interitum est.\"}],\"summary\":\"More of the excellence of the priesthood of Christ and of the New Testament.\",\"intro\":null,\"prev\":{\"usfm\":\"HEB\",\"chapter\":7,\"label\":\"Hebrews 7\"},\"next\":{\"usfm\":\"HEB\",\"chapter\":9,\"label\":\"Hebrews 9\"}}]]\n"])</script></body></html>
