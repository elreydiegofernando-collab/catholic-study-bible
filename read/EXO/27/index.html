button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And there shall be horns at the four corners of the same: and thou shalt cover it with brass.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And thou shalt make for the uses thereof pans to receive the ashes, and tongs and fleshhooks, and firepans: all its vessels thou shalt make of brass.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And a grate of brass in manner of a net; at the four corners of which, shall be four rings of brass,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Which thou shalt put under the hearth of the altar: and the grate shall be even to the midst of the altar.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thou shalt make also two bars for the altar, of setim wood, which thou shalt cover with plates of brass:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And thou shalt draw them through rings, and they shall be on both sides of the altar to carry it.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Thou shalt not make it solid, but empty and hollow in the inside, as it was shewn thee in the mount.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou shalt make also the court of the tabernacle, in the south side whereof southward there shall be hangings of fine twisted linen of a hundred cubits long for one side.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And twenty pillars with as many sockets of brass, the heads of which, with their engraving, shall be of silver.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In like manner also on the north side there shall be hangings of a hundred cubits long, twenty pillars, and as many sockets of brass, and their heads with their engraving of silver.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But in the breadth of the court, that looketh to the west, there shall be hangings of fifty cubits, and ten pillars, and as many sockets.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In that breadth also of the court, which looketh to the east, there shall be fifty cubits.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In which there shall be for one side, hangings of fifteen cubits, and three pillars, and as many sockets.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And in the other side, there shall be hangings of fifteen cubits, with three pillars, and as many sockets.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And in the entrance of the court there shall be made a hanging of twenty cubits of violet and purple, and scarlet twice dyed, and fine twisted linen, with embroidered work: it shall have four pillars, with as many sockets.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>All the pillars of the court round about shall be garnished with plates of silver, silver heads, and sockets of brass.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In length the court shall take up a hundred cubits, in breadth fifty, the height shall be of five cubits, and it shall be made of fine twisted linen, and shall have sockets of brass.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>All the vessels of the tabernacle for all uses and ceremonies, and the pins both of it and of the court, thou shalt make of brass.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Command the children of Israel that they bring thee the purest oil of the olives, and beaten with a pestle: that a lamp may burn always,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In the tabernacle of the testimony, without the veil that hangs before the testimony. And Aaron and his sons shall order it, that it may give light before the Lord until the morning. It shall be a perpetual observance throughout their successions among the children of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Facies et altare de lignis setim, quod habebit quinque cubitus in longitudine, et totidem in latitudine, id est, quadrum, et tres cubitos in altitudine.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cornua autem per quatuor angulos ex ipso erunt : et operies illud ære.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Faciesque in usus ejus lebetes ad suscipiendos cineres, et forcipes atque fuscinulas, et ignium receptacula ; omnia vasa ex ære fabricabis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Craticulamque in modum retis æneam : per cujus quatuor angulos erunt quatuor annuli ænei.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quos pones subter arulam altaris : eritque craticula usque ad altaris medium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Facies et vectes altaris de lignis setim duos, quos operies laminis æneis :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et induces per circulos, eruntque ex utroque latere altaris ad portandum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non solidum, sed inane et cavum intrinsecus facies illud, sicut tibi in monte monstratum est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Facies et atrium tabernaculi, in cujus australi plaga contra meridiem erunt tentoria de bysso retorta : centum cubitos unum latus tenebit in longitudine.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et columnas viginti cum basibus totidem æneis, quæ capita cum cælaturis suis habebunt argentea.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Similiter et in latere aquilonis per longum erunt tentoria centum cubitorum, columnæ viginti, et bases æneæ ejusdem numeri, et capita earum cum cælaturis suis argentea.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In latitudine vero atrii, quod respicit ad occidentem, erunt tentoria per quinquaginta cubitos, et columnæ decem, basesque totidem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In ea quoque atrii latitudine, quæ respicit ad orientem, quinquaginta cubiti erunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>In quibus quindecim cubitorum tentoria lateri uno deputabuntur, columnæque tres et bases totidem :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et in latere altero erunt tentoria cubitos obtinentia quindecim, columnæ tres, et bases totidem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In introitu vero atrii fiet tentorium cubitorum viginti ex hyacintho et purpura, coccoque bis tincto, et bysso retorta, opere plumarii : columnas habebit quatuor, cum basibus totidem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Omnes columnæ atrii per circuitum vestitæ erunt argenteis laminis, capitibus argenteis, et basibus æneis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In longitudine occupabit atrium cubitos centum, in latitudine quinquaginta, altitudo quinque cubitorum erit : fietque de bysso retorta, et habebit bases æneas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cuncta vasa tabernaculi in omnes usus et cæremonias, tam paxillos ejus quam atrii, ex ære facies.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Præcipe filiis Israël ut afferant tibi oleum de arboribus olivarum purissimum, piloque contusum, ut ardeat lucerna semper</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>in tabernaculo testimonii, extra velum quod oppansum est testimonio. Et collocabunt eam Aaron et filii ejus, ut usque mane luceat coram Domino. Perpetuus erit cultus per successiones eorum a filiis Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 26</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/28/"><span class="min-w-0"><span class= cover with plates of brass:\"},{\"verse\":7,\"text\":\"And thou shalt draw them through rings, and they shall be on both sides of the altar to carry it.\"},{\"verse\":8,\"text\":\"Thou shalt not make it solid, but empty and hollow in the inside, as it was shewn thee in the mount.\"},{\"verse\":9,\"text\":\"Thou shalt make also the court of the tabernacle, in the south side whereof southward there shall be hangings of fine twisted linen of a hundred cubits long for one side.\"},{\"verse\":10,\"text\":\"And twenty pillars with as many sockets of brass, the heads of which, with their engraving, shall be of silver.\"},{\"verse\":11,\"text\":\"In like manner also on the north side there shall be hangings of a hundred cubits long, twenty pillars, and as many sockets of brass, and their heads with their engraving of silver.\"},{\"verse\":12,\"text\":\"But in the breadth of the court, that looketh to the west, there shall be hangings of fifty cubits, and ten pillars, and as many sockets.\"},{\"verse\":13,\"text\":\"In that breadth also of the court, which looketh to the east, there shall be fifty cubits.\"},{\"verse\":14,\"text\":\"In which there shall be for one side, hangings of fifteen cubits, and three pillars, and as many sockets.\"},{\"verse\":15,\"text\":\"And in the other side, there shall be hangings of fifteen cubits, with three pillars, and as many sockets.\"},{\"verse\":16,\"text\":\"And in the entrance of the court there shall be made a hanging of twenty cubits of violet and purple, and scarlet twice dyed, and fine twisted linen, with embroidered work: it shall have four pillars, with as many sockets.\"},{\"verse\":17,\"text\":\"All the pillars of the court round about shall be garnished with plates of silver, silver heads, and sockets of brass.\"},{\"verse\":18,\"text\":\"In length the court shall take up a hundred cubits, in breadth fifty, the height shall be of five cubits, and it shall be made of fine twisted linen, and shall have sockets of brass.\"},{\"verse\":19,\"text\":\"All the vessels of the tabernacle for all uses and ceremonies, and the pins both of it and of the court, thou shalt make of brass.\"},{\"verse\":20,\"text\":\"Command the children of Israel that they bring thee the purest oil of the olives, and beaten with a pestle: that a lamp may burn always,\"},{\"verse\":21,\"text\":\"In the tabernacle of the testimony, without the veil that hangs before the testimony. And Aaron and his sons shall order it, that it may give light before the Lord until the morning. It shall be a perpetual observance throughout their successions among the children of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Facies et altare de lignis setim, quod habebit quinque cubitus in longitudine, et totidem in latitudine, id est, quadrum, et tres cubitos in altitudine.\"},{\"verse\":2,\"text\":\"Cornua autem per quatuor angulos ex ipso erunt : et operies illud ære.\"},{\"verse\":3,\"text\":\"Faciesque in usus ejus lebetes ad suscipiendos cineres, et forcipes atque fuscinulas, et ignium receptacula ; omnia vasa ex ære fabricabis.\"},{\"verse\":4,\"text\":\"Craticulamque in modum retis æneam : per cujus quatuor angulos erunt quatuor annuli ænei.\"},{\"verse\":5,\"text\":\"Quos pones subter arulam altaris : eritque craticula usque ad altaris medium.\"},{\"verse\":6,\"text\":\"Facies et vectes altaris de lignis setim duos, quos operies laminis æneis :\"},{\"verse\":7,\"text\":\"et induces per circulos, eruntque ex utroque latere altaris ad portandum.\"},{\"verse\":8,\"text\":\"Non solidum, sed inane et cavum intrinsecus facies illud, sicut tibi in monte monstratum est.\"},{\"verse\":9,\"text\":\"Facies et atrium tabernaculi, in cujus australi plaga contra meridiem erunt tentoria de bysso retorta : centum cubitos unum latus tenebit in longitudine.\"},{\"verse\":10,\"text\":\"Et columnas viginti cum basibus totidem æneis, quæ capita cum cælaturis suis habebunt argentea.\"},{\"verse\":11,\"text\":\"Similiter et in latere aquilonis per longum erunt tentoria centum cubitorum, columnæ viginti, et bases æneæ ejusdem numeri, et capita earum cum cælaturis suis argentea.\"},{\"verse\":12,\"text\":\"In latitudine vero atrii, quod respicit ad occidentem, erunt tentoria per quinquaginta cubitos, et columnæ decem, basesque totidem.\"},{\"verse\":13,\"text\":\"In ea quoque atrii latitudine, quæ respicit ad orientem, quinquaginta cubiti erunt.\"},{\"verse\":14,\"text\":\"In quibus quindecim cubitorum tentoria lateri uno deputabuntur, columnæque tres et bases totidem :\"},{\"verse\":15,\"text\":\"et in latere altero erunt tentoria cubitos obtinentia quindecim, columnæ tres, et bases totidem.\"},{\"verse\":16,\"text\":\"In introitu vero atrii fiet tentorium cubitorum viginti ex hyacintho et purpura, coccoque bis tincto, et bysso retorta, opere plumarii : columnas habebit quatuor, cum basibus totidem.\"},{\"verse\":17,\"text\":\"Omnes columnæ atrii per circuitum vestitæ erunt argenteis laminis, capitibus argenteis, et basibus æneis.\"},{\"verse\":18,\"text\":\"In longitudine occupabit atrium cubitos centum, in latitudine quinquaginta, altitudo quinque cubitorum erit : fietque de bysso retorta, et habebit bases æneas.\"},{\"verse\":19,\"text\":\"Cuncta vasa tabernaculi in omnes usus et cæremonias, tam paxillos ejus quam atrii, ex ære facies.\"},{\"verse\":20,\"text\":\"Præcipe filiis Israël ut afferant tibi oleum de arboribus olivarum purissimum, piloque contusum, ut ardeat lucerna semper\"},{\"verse\":21,\"text\":\"in tabernaculo testimonii, extra velum quod oppansum est testimonio. Et collocabunt eam Aaron et filii ejus, ut usque mane luceat coram Domino. Perpetuus erit cultus per successiones eorum a filiis Israël.\"}],\"summary\":\"The altar; and the court of the tabernacle with its hangings and pillars. Provision of oil for lamps.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":26,\"label\":\"Exodus 26\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":28,\"label\":\"Exodus 28\"}}]]\n"])</script></body></html>
