1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EXO/">About <!-- -->Exodus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God appeareth to Moses in a bush, and sendeth him to deliver Israel.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now Moses fed the sheep of Jethro, his father in law, the priest of Madian: and he drove the flock to the inner parts of the desert, and came to the mountain of God, Horeb.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Lord appeared to him in a flame of fire out of the midst of a bush: and he saw that the bush was on fire, and was not burnt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Moses said: I will go, and see this great sight, why the bush is not burnt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when the Lord saw that he went forward to see, he called to him out of the midst of the bush. and said: Moses, Moses. And he answered: Here I am.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he said: Come not nigh hither, put off the shoes from thy feet; for the place, whereon thou standest, is holy ground.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said: I am the God of thy father, the God of Abraham, the God of Isaac, and the God of Jacob. Moses hid his face: for he durst not look at God.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the Lord said to him: I have seen the affliction of my people in Egypt, and I have heard their cry because of the rigour of them that are over the works;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And knowing their sorrow, I am come down to deliver them out of the hands of the Egyptians, and to bring them out of that land into a good and spacious land, into a land that floweth with milk and honey, to the places of the Chanaanite, and Hethite, and Amorrhite, and Pherezite, and Hevite, and Jebusite.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For the cry of the children of Israel is come unto me: and I have seen their affliction, wherewith they are oppressed by the Egyptians.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But come, and I will send thee to Pharao, that thou mayst bring forth my people, the children of Israel, out of Egypt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Moses said to God: Who am I that I should go to Pharao, and should bring forth the children of Israel out of Egypt?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he said to him: I will be with thee; and this thou shalt have for a sign that I have sent thee: When thou shalt have brought my people out of Egypt, thou shalt offer sacrifice to God upon this mountain.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Moses said to God: Lo, I shall go to the children of Israel, and say to them: The God of your fathers hath sent me to you. If they shall say to me: What is his name? What shall I say to them?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>God said to Moses: I AM WHO AM. He said: Thus shalt thou say to the children of Israel: HE WHO IS, hath sent me to you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And God said again to Moses: Thus shalt thou say to the children of Israel: The Lord God of your fathers the God of Abraham, the God of Isaac, and the God of Jacob hath sent me to you; this is my name for ever, and this is my memorial unto all generations.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Go and gather together the ancients of Israel, and thou shalt say to them: The Lord God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared to me, saying: Visiting I have visited you; and I have seen all that hath befallen you in Egypt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And I have said the word to bring you forth out of the affliction of Egypt, into the land of the Chanaanite, and Hethite, and Amorrhite, and Pherezite, and Hevite, and Jebusite, to a land that floweth with milk and honey.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they shall hear thy voice; and thou shalt go in, thou and the ancients of Israel, to the king of Egypt, and thou shalt say to him: The Lord God of the Hebrews hath called us; we will go three days’ journey into the wilderness, to sacrifice unto the Lord our God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But I know that the king of Egypt will not let you go, but by a mighty hand.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For I will stretch forth my hand, and will strike Egypt with all my wonders which I will do in the midst of them: after these he will let you go.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And I will give favour to this people, in the sight of the Egyptians: and when you go forth, you shall not depart empty:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But every woman shall ask of her neighbour, and of her that is in her house, vessels of silver and of gold, and raiment: and you shall put them on your sons and daughters, and shall spoil Egypt.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Moyses autem pascebat oves Jethro soceri sui sacerdotis Madian : cumque minasset gregem ad interiora deserti, venit ad montem Dei Horeb.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Apparuitque ei Dominus in flamma ignis de medio rubi : et videbat quod rubus arderet, et non combureretur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixit ergo Moyses : Vadam, et videbo visionem hanc magnam, quare non comburatur rubus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cernens autem Dominus quod pergeret ad videndum, vocavit eum de medio rubi, et ait : Moyses, Moyses. Qui respondit : Adsum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>At ille : Ne appropies, inquit, huc : solve calceamentum de pedibus tuis : locus enim, in quo stas, terra sancta est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et ait : Ego sum Deus patris tui, Deus Abraham, Deus Isaac et Deus Jacob. Abscondit Moyses faciem suam : non enim audebat aspicere contra Deum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cui ait Dominus : Vidi afflictionem populi mei in Ægypto, et clamorem ejus audivi propter duritiam eorum qui præsunt operibus :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et sciens dolorem ejus, descendi ut liberem eum de manibus Ægyptiorum, et educam de terra illa in terram bonam, et spatiosam, in terram quæ fluit lacte et melle, ad loca Chananæi et Hethæi, et Amorrhæi, et Pherezæi, et Hevæi, et Jebusæi.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Clamor ergo filiorum Israël venit ad me : vidique afflictionem eorum, qua ab Ægyptiis opprimuntur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sed veni, et mittam te ad Pharaonem, ut educas populum meum, filios Israël, de Ægypto.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Dixitque Moyses ad Deum : Quis sum ego ut vadam ad Pharaonem, et educam filios Israël de Ægypto ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui dixit ei : Ego ero tecum : et hoc habebis signum, quod miserim te : cum eduxeris populum meum de Ægypto, immolabis Deo super montem istum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ait Moyses ad Deum : Ecce ego vadam ad filios Israël, et dicam eis : Deus patrum vestrorum misit me ad vos. Si dixerint mihi : Quod est nomen ejus ? quid dicam eis ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dixit Deus ad Moysen : Ego sum qui sum. Ait : Sic dices filiis Israël : Qui est, misit me ad vos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dixitque iterum Deus ad Moysen : Hæc dices filiis Israël : Dominus Deus patrum vestrorum, Deus Abraham, Deus Isaac et Deus Jacob, misit me ad vos : hoc nomen mihi est in æternum, et hoc memoriale meum in generationem et generationem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vade, et congrega seniores Israël, et dices ad eos : Dominus Deus patrum vestrorum apparuit mihi, Deus Abraham, Deus Isaac et Deus Jacob, dicens : Visitans visitavi vos : et vidi omnia quæ acciderunt vobis in Ægypto.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et dixi ut educam vos de afflictione Ægypti in terram Chananæi, et Hethæi, et Amorrhæi, et Pherezæi, et Hevæi, et Jebusæi, ad terram fluentem lacte et melle.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et audient vocem tuam : ingredierisque tu, et seniores Israël, ad regem Ægypti, et dices ad eum : Dominus Deus Hebræorum vocavit nos : ibimus viam trium dierum in solitudinem, ut immolemus Domino Deo nostro.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sed ego scio quod non dimittet vos rex Ægypti ut eatis nisi per manum validam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Extendam enim manum meam, et percutiam Ægyptum in cunctis mirabilibus meis, quæ facturus sum in medio eorum : post hæc dimittet vos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Daboque gratiam populo huic coram Ægyptiis : et cum egrediemini, non exibitis vacui :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>sed postulabit mulier a vicina sua et ab hospita sua, vasa argentea et aurea, ac vestes : ponetisque eas super filios et filias vestras, et spoliabitis Ægyptum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exo ":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"EXO.3\",{\"bookId\":2,\"usfm\":\"EXO\",\"bookName\":\"Exodus\",\"drName\":\"Exodus\",\"chapter\":3,\"totalChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"Now Moses fed the sheep of Jethro, his father in law, the priest of Madian: and he drove the flock to the inner parts of the desert, and came to the mountain of God, Horeb.\"},{\"verse\":2,\"text\":\"And the Lord appeared to him in a flame of fire out of the midst of a bush: and he saw that the bush was on fire, and was not burnt.\"},{\"verse\":3,\"text\":\"And Moses said: I will go, and see this great sight, why the bush is not burnt.\"},{\"verse\":4,\"text\":\"And when the Lord saw that he went forward to see, he called to him out of the midst of the bush. and said: Moses, Moses. And he answered: Here I am.\"},{\"verse\":5,\"text\":\"And he said: Come not nigh hither, put off the shoes from thy feet; for the place, whereon thou standest, is holy ground.\"},{\"verse\":6,\"text\":\"And he said: I am the God of thy father, the God of Abraham, the God of Isaac, and the God of Jacob. Moses hid his face: for he durst not look at God.\"},{\"verse\":7,\"text\":\"And the Lord said to him: I have seen the affliction of my people in Egypt, and I have heard their cry because of the rigour of them that are over the works;\"},{\"verse\":8,\"text\":\"And knowing their sorrow, I am come down to deliver them out of the hands of the Egyptians, and to bring them out of that land into a good and spacious land, into a land that floweth with milk and honey, to the places of the Chanaanite, and Hethite, and Amorrhite, and Pherezite, and Hevite, and Jebusite.\"},{\"verse\":9,\"text\":\"For the cry of the children of Israel is come unto me: and I have seen their affliction, wherewith they are oppressed by the Egyptians.\"},{\"verse\":10,\"text\":\"But come, and I will send thee to Pharao, that thou mayst bring forth my people, the children of Israel, out of Egypt.\"},{\"verse\":11,\"text\":\"And Moses said to God: Who am I that I should go to Pharao, and should bring forth the children of Israel out of Egypt?\"},{\"verse\":12,\"text\":\"And he said to him: I will be with thee; and this thou shalt have for a sign that I have sent thee: When thou shalt have brought my people out of Egypt, thou shalt offer sacrifice to God upon this mountain.\"},{\"verse\":13,\"text\":\"Moses said to God: Lo, I shall go to the children of Israel, and say to them: The God of your fathers hath sent me to you. If they shall say to me: What is his name? What shall I say to them?\"},{\"verse\":14,\"text\":\"God said to Moses: I AM WHO AM. He said: Thus shalt thou say to the children of Israel: HE WHO IS, hath sent me to you.\"},{\"verse\":15,\"text\":\"And God said again to Moses: Thus shalt thou say to the children of Israel: The Lord God of your fathers the God of Abraham, the God of Isaac, and the God of Jacob hath sent me to you; this is my name for ever, and this is my memorial unto all generations.\"},{\"verse\":16,\"text\":\"Go and gather together the ancients of Israel, and thou shalt say to them: The Lord God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared to me, saying: Visiting I have visited you; and I have seen all that hath befallen you in Egypt.\"},{\"verse\":17,\"text\":\"And I have said the word to bring you forth out of the affliction of Egypt, into the land of the Chanaanite, and Hethite, and Amorrhite, and Pherezite, and Hevite, and Jebusite, to a land that floweth with milk and honey.\"},{\"verse\":18,\"text\":\"And they shall hear thy voice; and thou shalt go in, thou and the ancients of Israel, to the king of Egypt, and thou shalt say to him: The Lord God of the Hebrews hath called us; we will go three days’ journey into the wilderness, to sacrifice unto the Lord our God.\"},{\"verse\":19,\"text\":\"But I know that the king of Egypt will not let you go, but by a mighty hand.\"},{\"verse\":20,\"text\":\"For I will stretch forth my hand, and will strike Egypt with all my wonders which I will do in the midst of them: after these he will let you go.\"},{\"verse\":21,\"text\":\"And I will give favour to this people, in the sight of the Egyptians: and when you go forth, you shall not depart empty:\"},{\"verse\":22,\"text\":\"But every woman shall ask of her neighbour, and of her that is in her house, vessels of silver and of gold, and raiment: and you shall put them on your sons and daughters, and shall spoil Egypt.\"}],\"vul\":[{\"verse\":1,\"text\":\"Moyses autem pascebat oves Jethro soceri sui sacerdotis Madian : cumque minasset gregem ad interiora deserti, venit ad montem Dei Horeb.\"},{\"verse\":2,\"text\":\"Apparuitque ei Dominus in flamma ignis de medio rubi : et videbat quod rubus arderet, et non combureretur.\"},{\"verse\":3,\"text\":\"Dixit ergo Moyses : Vadam, et videbo visionem hanc magnam, quare non comburatur rubus.\"},{\"verse\":4,\"text\":\"Cernens autem Dominus quod pergeret ad videndum, vocavit eum de medio rubi, et ait : Moyses, Moyses. Qui respondit : Adsum.\"},{\"verse\":5,\"text\":\"At ille : Ne appropies, inquit, huc : solve calceamentum de pedibus tuis : locus enim, in quo stas, terra sancta est.\"},{\"verse\":6,\"text\":\"Et ait : Ego sum Deus patris tui, Deus Abraham, Deus Isaac et Deus Jacob. Abscondit Moyses faciem suam : non enim audebat aspicere contra Deum.\"},{\"verse\":7,\"text\":\"Cui ait Dominus : Vidi afflictionem populi mei in Ægypto, et clamorem ejus audivi propter duritiam eorum qui præsunt operibus :\"},{\"verse\":8,\"text\":\"et sciens dolorem ejus, descendi ut liberem eum de manibus Ægyptiorum, et educam de terra illa in terram bonam, et spatiosam, in terram quæ fluit lacte et melle, ad loca Chananæi et Hethæi, et Amorrhæi, et Pherezæi, et Hevæi, et Jebusæi.\"},{\"verse\":9,\"text\":\"Clamor ergo filiorum Israël venit ad me : vidique afflictionem eorum, qua ab Ægyptiis opprimuntur.\"},{\"verse\":10,\"text\":\"Sed veni, et mittam te ad Pharaonem, ut educas populum meum, filios Israël, de Ægypto.\"},{\"verse\":11,\"text\":\"Dixitque Moyses ad Deum : Quis sum ego ut vadam ad Pharaonem, et educam filios Israël de Ægypto ?\"},{\"verse\":12,\"text\":\"Qui dixit ei : Ego ero tecum : et hoc habebis signum, quod miserim te : cum eduxeris populum meum de Ægypto, immolabis Deo super montem istum.\"},{\"verse\":13,\"text\":\"Ait Moyses ad Deum : Ecce ego vadam ad filios Israël, et dicam eis : Deus patrum vestrorum misit me ad vos. Si dixerint mihi : Quod est nomen ejus ? quid dicam eis ?\"},{\"verse\":14,\"text\":\"Dixit Deus ad Moysen : Ego sum qui sum. Ait : Sic dices filiis Israël : Qui est, misit me ad vos.\"},{\"verse\":15,\"text\":\"Dixitque iterum Deus ad Moysen : Hæc dices filiis Israël : Dominus Deus patrum vestrorum, Deus Abraham, Deus Isaac et Deus Jacob, misit me ad vos : hoc nomen mihi est in æternum, et hoc memoriale meum in generationem et generationem.\"},{\"verse\":16,\"text\":\"Vade, et congrega seniores Israël, et dices ad eos : Dominus Deus patrum vestrorum apparuit mihi, Deus Abraham, Deus Isaac et Deus Jacob, dicens : Visitans visitavi vos : et vidi omnia quæ acciderunt vobis in Ægypto.\"},{\"verse\":17,\"text\":\"Et dixi ut educam vos de afflictione Ægypti in terram Chananæi, et Hethæi, et Amorrhæi, et Pherezæi, et Hevæi, et Jebusæi, ad terram fluentem lacte et melle.\"},{\"verse\":18,\"text\":\"Et audient vocem tuam : ingredierisque tu, et seniores Israël, ad regem Ægypti, et dices ad eum : Dominus Deus Hebræorum vocavit nos : ibimus viam trium dierum in solitudinem, ut immolemus Domino Deo nostro.\"},{\"verse\":19,\"text\":\"Sed ego scio quod non dimittet vos rex Ægypti ut eatis nisi per manum validam.\"},{\"verse\":20,\"text\":\"Extendam enim manum meam, et percutiam Ægyptum in cunctis mirabilibus meis, quæ facturus sum in medio eorum : post hæc dimittet vos.\"},{\"verse\":21,\"text\":\"Daboque gratiam populo huic coram Ægyptiis : et cum egrediemini, non exibitis vacui :\"},{\"verse\":22,\"text\":\"sed postulabit mulier a vicina sua et ab hospita sua, vasa argentea et aurea, ac vestes : ponetisque eas super filios et filias vestras, et spoliabitis Ægyptum.\"}],\"summary\":\"God appeareth to Moses in a bush, and sendeth him to deliver Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":2,\"label\":\"Exodus 2\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":4,\"label\":\"Exodus 4\"}}]]\n"])</script></body></html>
