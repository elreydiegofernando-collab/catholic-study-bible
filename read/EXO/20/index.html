="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Thou shalt not have strange gods before me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou shalt not make to thyself a graven thing, nor the likeness of any thing that is in heaven above, or in the earth beneath, nor of those things that are in the waters under the earth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thou shalt not adore them, nor serve them: I am the Lord thy God, mighty, jealous, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And shewing mercy unto thousands to them that love me, and keep my commandments.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that shall take the name of the Lord his God in vain.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Remember that thou keep holy the sabbath day.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Six days shalt thou labour, and shalt do all thy works.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But on the seventh day is the sabbath of the Lord thy God: thou shalt do no work on it, thou nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thy beast, nor the stranger that is within thy gates.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For in six days the Lord made heaven and earth, and the sea, and all things that are in them, and rested on the seventh day: therefore the Lord blessed the seventh day, and sanctified it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Honour thy father and thy mother, that thou mayst be longlived upon the land which the Lord thy God will give thee.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt not kill.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt not commit adultery.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou shalt not steal.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou shalt not bear false witness against thy neighbour.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou shalt not covet thy neighbour’s house; neither shalt thou desire his wife, nor his servant, nor his handmaid, nor his ox, nor his ass, nor any thing that is his.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And all the people saw the voices and the flames, and the sound of the trumpet, and the mount smoking; and being terrified and struck with fear, they stood afar off,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Saying to Moses: Speak thou to us, and we will hear: let not the Lord speak to us, lest we die.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Moses said to the people: Fear not; for God is come to prove you, and that the dread of him might be in you, and you should not sin.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the people stood afar off. But Moses went to the dark cloud wherein God was.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the Lord said to Moses: Thus shalt thou say to the children of Israel: You have seen that I have spoken to you from heaven.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>You shall not make gods of silver, nor shall you make to yourselves gods of gold.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>You shall make an altar of earth unto me, and you shall offer upon it your holocausts and peace offerings, your sheep and oxen, in every place where the memory of my name shall be: I will come to thee, and will bless thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And if thou make an altar of stone unto me, thou shalt not build it of hewn stones; for if thou lift up a tool upon it, it shall be defiled.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt not go up by steps unto my altar, lest thy nakedness be discovered.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus cunctos sermones hos :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ego sum Dominus Deus tuus, qui eduxi te de terra Ægypti, de domo servitutis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non habebis deos alienos coram me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non facies tibi sculptile, neque omnem similitudinem quæ est in cælo desuper, et quæ in terra deorsum, nec eorum quæ sunt in aquis sub terra.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non adorabis ea, neque coles : ego sum Dominus Deus tuus fortis, zelotes, visitans iniquitatem patrum in filios, in tertiam et quartam generationem eorum qui oderunt me :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et faciens misericordiam in millia his qui diligunt me, et custodiunt præcepta mea.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non assumes nomen Domini Dei tui in vanum : nec enim habebit insontem Dominus eum qui assumpserit nomen Domini Dei sui frustra.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Memento ut diem sabbati sanctifices.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sex diebus operaberis, et facies omnia opera tua.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Septimo autem die sabbatum Domini Dei tui est : non facies omne opus in eo, tu, et filius tuus et filia tua, servus tuus et ancilla tua, jumentum tuum, et advena qui est intra portas tuas.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sex enim diebus fecit Dominus cælum et terram, et mare, et omnia quæ in eis sunt, et requievit in die septimo : idcirco benedixit Dominus diei sabbati, et sanctificavit eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Honora patrem tuum et matrem tuam, ut sis longævus super terram, quam Dominus Deus tuus dabit tibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non occides.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Non mœchaberis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non furtum facies.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non loqueris contra proximum tuum falsum testimonium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non concupisces domum proximi tui, nec desiderabis uxorem ejus, non servum, non ancillam, non bovem, non asinum, nec omnia quæ illius sunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cunctus autem populus videbat voces et lampades, et sonitum buccinæ, montemque fumantem : et perterriti ac pavore concussi, steterunt procul,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>dicentes Moysi : Loquere tu nobis, et audiemus : non loquatur nobis Dominus, ne forte moriamur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et ait Moyses ad populum : Nolite timere : ut enim probaret vos venit Deus, et ut terror illius esset in vobis, et non peccaretis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Stetitque populus de longe. Moyses autem accessit ad caliginem in qua erat Deus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dixit præterea Dominus ad Moysen : Hæc dices filiis Israël : Vos vidistis quod de cælo locutus sim vobis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Non facietis deos argenteos, nec deos aureos facietis vobis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Altare de terra facietis mihi, et offeretis super eo holocausta et pacifica vestra, oves vestras et boves in omni loco in quo memoria fuerit nominis mei : veniam ad te, et benedicam tibi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quod si altare lapideum feceris mihi, non ædificabis illud de sectis lapidibus : si enim levaveris cultrum super eo, polluetur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non ascendes per gradus ad altare meum, ne reveletur turpitudo tua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" a\":[{\"verse\":1,\"text\":\"And the Lord spoke all these words:\"},{\"verse\":2,\"text\":\"I am the Lord thy God, who brought thee out of the land of Egypt, out of the house of bondage.\"},{\"verse\":3,\"text\":\"Thou shalt not have strange gods before me.\"},{\"verse\":4,\"text\":\"Thou shalt not make to thyself a graven thing, nor the likeness of any thing that is in heaven above, or in the earth beneath, nor of those things that are in the waters under the earth.\"},{\"verse\":5,\"text\":\"Thou shalt not adore them, nor serve them: I am the Lord thy God, mighty, jealous, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me:\"},{\"verse\":6,\"text\":\"And shewing mercy unto thousands to them that love me, and keep my commandments.\"},{\"verse\":7,\"text\":\"Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that shall take the name of the Lord his God in vain.\"},{\"verse\":8,\"text\":\"Remember that thou keep holy the sabbath day.\"},{\"verse\":9,\"text\":\"Six days shalt thou labour, and shalt do all thy works.\"},{\"verse\":10,\"text\":\"But on the seventh day is the sabbath of the Lord thy God: thou shalt do no work on it, thou nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thy beast, nor the stranger that is within thy gates.\"},{\"verse\":11,\"text\":\"For in six days the Lord made heaven and earth, and the sea, and all things that are in them, and rested on the seventh day: therefore the Lord blessed the seventh day, and sanctified it.\"},{\"verse\":12,\"text\":\"Honour thy father and thy mother, that thou mayst be longlived upon the land which the Lord thy God will give thee.\"},{\"verse\":13,\"text\":\"Thou shalt not kill.\"},{\"verse\":14,\"text\":\"Thou shalt not commit adultery.\"},{\"verse\":15,\"text\":\"Thou shalt not steal.\"},{\"verse\":16,\"text\":\"Thou shalt not bear false witness against thy neighbour.\"},{\"verse\":17,\"text\":\"Thou shalt not covet thy neighbour’s house; neither shalt thou desire his wife, nor his servant, nor his handmaid, nor his ox, nor his ass, nor any thing that is his.\"},{\"verse\":18,\"text\":\"And all the people saw the voices and the flames, and the sound of the trumpet, and the mount smoking; and being terrified and struck with fear, they stood afar off,\"},{\"verse\":19,\"text\":\"Saying to Moses: Speak thou to us, and we will hear: let not the Lord speak to us, lest we die.\"},{\"verse\":20,\"text\":\"And Moses said to the people: Fear not; for God is come to prove you, and that the dread of him might be in you, and you should not sin.\"},{\"verse\":21,\"text\":\"And the people stood afar off. But Moses went to the dark cloud wherein God was.\"},{\"verse\":22,\"text\":\"And the Lord said to Moses: Thus shalt thou say to the children of Israel: You have seen that I have spoken to you from heaven.\"},{\"verse\":23,\"text\":\"You shall not make gods of silver, nor shall you make to yourselves gods of gold.\"},{\"verse\":24,\"text\":\"You shall make an altar of earth unto me, and you shall offer upon it your holocausts and peace offerings, your sheep and oxen, in every place where the memory of my name shall be: I will come to thee, and will bless thee.\"},{\"verse\":25,\"text\":\"And if thou make an altar of stone unto me, thou shalt not build it of hewn stones; for if thou lift up a tool upon it, it shall be defiled.\"},{\"verse\":26,\"text\":\"Thou shalt not go up by steps unto my altar, lest thy nakedness be discovered.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus cunctos sermones hos :\"},{\"verse\":2,\"text\":\"Ego sum Dominus Deus tuus, qui eduxi te de terra Ægypti, de domo servitutis.\"},{\"verse\":3,\"text\":\"Non habebis deos alienos coram me.\"},{\"verse\":4,\"text\":\"Non facies tibi sculptile, neque omnem similitudinem quæ est in cælo desuper, et quæ in terra deorsum, nec eorum quæ sunt in aquis sub terra.\"},{\"verse\":5,\"text\":\"Non adorabis ea, neque coles : ego sum Dominus Deus tuus fortis, zelotes, visitans iniquitatem patrum in filios, in tertiam et quartam generationem eorum qui oderunt me :\"},{\"verse\":6,\"text\":\"et faciens misericordiam in millia his qui diligunt me, et custodiunt præcepta mea.\"},{\"verse\":7,\"text\":\"Non assumes nomen Domini Dei tui in vanum : nec enim habebit insontem Dominus eum qui assumpserit nomen Domini Dei sui frustra.\"},{\"verse\":8,\"text\":\"Memento ut diem sabbati sanctifices.\"},{\"verse\":9,\"text\":\"Sex diebus operaberis, et facies omnia opera tua.\"},{\"verse\":10,\"text\":\"Septimo autem die sabbatum Domini Dei tui est : non facies omne opus in eo, tu, et filius tuus et filia tua, servus tuus et ancilla tua, jumentum tuum, et advena qui est intra portas tuas.\"},{\"verse\":11,\"text\":\"Sex enim diebus fecit Dominus cælum et terram, et mare, et omnia quæ in eis sunt, et requievit in die septimo : idcirco benedixit Dominus diei sabbati, et sanctificavit eum.\"},{\"verse\":12,\"text\":\"Honora patrem tuum et matrem tuam, ut sis longævus super terram, quam Dominus Deus tuus dabit tibi.\"},{\"verse\":13,\"text\":\"Non occides.\"},{\"verse\":14,\"text\":\"Non mœchaberis.\"},{\"verse\":15,\"text\":\"Non furtum facies.\"},{\"verse\":16,\"text\":\"Non loqueris contra proximum tuum falsum testimonium.\"},{\"verse\":17,\"text\":\"Non concupisces domum proximi tui, nec desiderabis uxorem ejus, non servum, non ancillam, non bovem, non asinum, nec omnia quæ illius sunt.\"},{\"verse\":18,\"text\":\"Cunctus autem populus videbat voces et lampades, et sonitum buccinæ, montemque fumantem : et perterriti ac pavore concussi, steterunt procul,\"},{\"verse\":19,\"text\":\"dicentes Moysi : Loquere tu nobis, et audiemus : non loquatur nobis Dominus, ne forte moriamur.\"},{\"verse\":20,\"text\":\"Et ait Moyses ad populum : Nolite timere : ut enim probaret vos venit Deus, et ut terror illius esset in vobis, et non peccaretis.\"},{\"verse\":21,\"text\":\"Stetitque populus de longe. Moyses autem accessit ad caliginem in qua erat Deus.\"},{\"verse\":22,\"text\":\"Dixit præterea Dominus ad Moysen : Hæc dices filiis Israël : Vos vidistis quod de cælo locutus sim vobis.\"},{\"verse\":23,\"text\":\"Non facietis deos argenteos, nec deos aureos facietis vobis.\"},{\"verse\":24,\"text\":\"Altare de terra facietis mihi, et offeretis super eo holocausta et pacifica vestra, oves vestras et boves in omni loco in quo memoria fuerit nominis mei : veniam ad te, et benedicam tibi.\"},{\"verse\":25,\"text\":\"Quod si altare lapideum feceris mihi, non ædificabis illud de sectis lapidibus : si enim levaveris cultrum super eo, polluetur.\"},{\"verse\":26,\"text\":\"Non ascendes per gradus ad altare meum, ne reveletur turpitudo tua.\"}],\"summary\":\"The ten commandments.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":19,\"label\":\"Exodus 19\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":21,\"label\":\"Exodus 21\"}}]]\n"])</script></body></html>
