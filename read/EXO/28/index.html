><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">28</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The holy vestments for Aaron and his sons.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Take unto thee also Aaron thy brother with his sons, from among the children of Israel, that they may minister to me in the priest’s office: Aaron, Nadab, and Abiu, Eleazar, and Ithamar.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And thou shalt make a holy vesture for Aaron, thy brother, for glory and for beauty.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And thou shalt speak to all the wise of heart, whom I have filled with the spirit of wisdom, that they may make Aaron’s vestments, in which he being consecrated, may minister to me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And these shall be the vestments that they shall make: A rational and an ephod, a tunic and a strait linen garment, a mitre and a girdle. They shall make the holy vestments for thy brother Aaron and his sons, that they may do the office of priesthood unto me.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they shall take gold, and violet, and purple, and scarlet twice dyed, and fine linen.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they shall make the ephod of gold, and violet, and purple, and scarlet twice dyed, and fine twisted linen, embroidered with divers colours.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>It shall have the two edges joined in the top on both sides, that they may be closed together.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The very workmanship also, and all the variety of the work, shall be of gold, and violet, and purple, and scarlet twice dyed, and fine twisted linen.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And thou shalt take two onyx stones, and shalt grave on them the names of the children of Israel:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Six names on one stone, and the other six on the other, according to the order of their birth.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>With the work of an engraver, and the graving of a jeweller, thou shalt engrave them with the names of the children of Israel, set in gold and compassed about:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And thou shalt put them in both sides of the ephod, a memorial for the children of Israel. And Aaron shall bear their names before the Lord upon both shoulders, for a remembrance.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt make also hooks of gold.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And two little chains of the purest gold, linked one to another, which thou shalt put into the hooks.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou shalt make the rational of judgment with embroidered work of divers colours, according to the workmanship of the ephod, of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>It shall be four square and doubled: it shall be the measure of a span both in length and in breadth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And thou shalt set in it four rows of stones . In the first row shall be a sardius stone, and a topaz, and an emerald:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In the second a carbuncle, a sapphire, and a jasper:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In the third a ligurius, an agate, and an amethyst:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In the fourth a chrysolite, an onyx, and a beryl. They shall be set in gold by their rows.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they shall have the names of the children of Israel: with twelve names shall they be engraved, each stone with the name of one according to the twelve tribes.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And thou shalt make on the rational chains, linked one to another, of the purest gold:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And two rings of gold, which thou shalt put in the two ends at the top of the rational.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the golden chains thou shalt join to the rings, that are in the ends thereof.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And the ends of the chains themselves, thou shalt join together with two hooks, on both sides of the ephod, which is towards the rational.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt make also two rings of gold, which thou shalt put in the top parts of the rational, in the borders that are over against the ephod, and look towards the back parts thereof.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Moreover also other two rings of gold, which are to be set on each side of the ephod beneath, that looketh towards the nether joining, that the rational may be fitted with the ephod,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And may be fastened by the rings thereof unto the rings of the ephod with a violet fillet, that the joining artificially wrought may continue, and the rational and the ephod may not be loosed one from the other.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Aaron shall bear the names of the children of Israel in the rational of judgment upon his breast, when he shall enter into the sanctuary, a memorial before the Lord for ever.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And thou shalt put in the rational of judgment doctrine and truth, which shall be on Aaron’s breast, when he shall go in before the Lord: and he shall bear the judgment of the children of Israel on his breast, in the sight of the Lord always.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And thou shalt make the tunic of the ephod all of violet,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In the midst whereof above shall be a hole for the head, and a border round about it woven, as is wont to be made in the outmost parts of garments, that it may not easily be broken.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And beneath at the feet of the same tunic, round about, thou shalt make as it were pomegranates, of violet, and purple, and scarlet twice dyed, with little bells set between:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>So that there shall be a golden bell and a pomegranate, and again another golden bell and a pomegranate.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Aaron shall be vested with it in the office of his ministry, that the sound may be heard, when he goeth in and cometh out of the sanctuary, in the sight of the Lord, and that he may not die.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Thou shalt make also a plate of the purest gold: wherein thou shalt grave with engraver’s work, Holy to the Lord.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And thou shalt tie it with a violet fillet, and it shall be upon the mitre,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Hanging over the forehead of the high priest. And Aaron shall bear the iniquities of those things, which the children of Israel have offered and sanctified, in all their gifts and offerings. And the plate shall be always on his forehead, that the Lord may be well pleased with them.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And thou shalt gird the tunic with fine linen, and thou shalt make a fine linen mitre, and a girdle of embroidered work.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Moreover, for the sons of Aaron thou shalt prepare linen tunics, and girdles and mitres for glory and beauty:</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And with all these things thou shalt vest Aaron thy brother, and his sons with him. And thou shalt consecrate the hands of them all, and shalt sanctify them, that they may do the office of priesthood unto me.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Thou shalt make also linen breeches, to cover the flesh of their nakedness, from the reins to the thighs:</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And Aaron and his sons shall use them when they shall go into the tabernacle of the testimony, or when they approach to the altar to minister in the sanctuary, lest being guilty of iniquity they die. It shall be a law for ever to Aaron, and to his seed after him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Applica quoque ad te Aaron fratrem tuum cum filiis suis de medio filiorum Israël, ut sacerdotio fungantur mihi : Aaron, Nadab, et Abiu, Eleazar, et Ithamar.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Faciesque vestem sanctam Aaron fratri tuo in gloriam et decorem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et loqueris cunctis sapientibus corde quos replevi spiritu prudentiæ, ut faciant vestes Aaron, in quibus sanctificatus ministret mihi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Hæc autem erunt vestimenta quæ faciet : rationale et superhumerale, tunicam et lineam strictam, cidarim et balteum. Facient vestimenta sancta fratri tuo Aaron et filiis ejus, ut sacerdotio fungantur mihi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Accipientque aurum, et hyacinthum, et purpuram, coccumque bis tinctum, et byssum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Facient autem superhumerale de auro et hyacintho et purpura, coccoque bis tincto, et bysso retorta, opere polymito.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Duas oras junctas habebit in utroque latere summitatum, ut in unum redeant.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ipsa quoque textura et cuncta operis varietas erit ex auro et hyacintho, et purpura, coccoque bis tincto, et bysso retorta.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sumesque duos lapides onychinos, et sculpes in eis nomina filiorum Israël :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>sex nomina in lapide uno, et sex reliqua in altero, juxta ordinem nativitatis eorum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Opere sculptoris et cælatura gemmarii, sculpes eos nominibus filiorum Israël, inclusos auro atque circumdatos :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et pones in utroque latere superhumeralis, memoriale filiis Israël. Portabitque Aaron nomina eorum coram Domino super utrumque humerum, ob recordationem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Facies et uncinos ex auro,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et duas catenulas ex auro purissimo sibi invicem cohærentes, quas inseres uncinis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Rationale quoque judicii facies opere polymito juxta texturam superhumeralis, ex auro, hyacintho, et purpura, coccoque bis tincto, et bysso retorta.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quadrangulum erit et duplex : mensuram palmi habebit tam in longitudine quam in latitudine.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ponesque in eo quatuor ordines lapidum : in primo versu erit lapis sardius, et topazius, et smaragdus :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>in secundo carbunculus, sapphirus, et jaspis :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>in tertio ligurius, achates, et amethystus :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>in quarto chrysolithus, onychinus, et beryllus. Inclusi auro erunt per ordines suos.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Habebuntque nomina filiorum Israël : duodecim nominibus cælabuntur, singuli lapides nominibus singulorum per duodecim tribus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Facies in rationali catenas sibi invicem cohærentes ex auro purissimo,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et duos annulos aureos, quos pones in utraque rationalis summitate :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>catenasque aureas junges annulis, qui sunt in marginibus ejus,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et ipsarum catenarum extrema duobus copulabis uncinis in utroque latere superhumeralis quod rationale respicit.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Facies et duos annulos aureos, quos pones in summitatibus rationalis, in oris, quæ e regione sunt superhumeralis, et posteriora ejus aspiciunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Necnon et alios duos annulos aureos, qui ponendi sunt in utroque latere superhumeralis deorsum, quod respicit contra faciem juncturæ inferioris, ut aptari possit cum superhumerali,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et stringatur rationale annulis suis cum annulis superhumeralis vitta hyacinthina, ut maneat junctura fabrefacta, et a se invicem rationale et superhumerale nequeant separari.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Portabitque Aaron nomina filiorum Israël in rationali judicii super pectus suum, quando ingredietur Sanctuarium, memoriale coram Domino in æternum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Pones autem in rationali judicii Doctrinam et Veritatem, quæ erunt in pectore Aaron, quando ingredietur coram Domino : et gestabit judicium filiorum Israël in pectore suo, in conspectu Domini semper.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Facies et tunicam superhumeralis totam hyacinthinam,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>in cujus medio supra erit capitium, et ora per gyrum ejus textilis, sicut fieri solet in extremis vestium partibus, ne facile rumpatur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Deorsum vero, ad pedes ejusdem tunicæ, per circuitum, quasi mala punica facies, ex hyacintho, et purpura, et cocco bis tincto, mistis in medio tintinnabulis,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>ita ut tintinnabulum sit aureum et malum punicum : rursumque tintinnabulum aliud aureum et malum punicum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et vestietur ea Aaron in officio ministerii, ut audiatur sonitus quando ingreditur et egreditur sanctuarium in conspectu Domini, et non moriatur.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Facies et laminam de auro purissimo, in qua sculpes opere cælatoris, Sanctum Domino.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Ligabisque eam vitta hyacinthina, et erit super tiaram,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>imminens fronti pontificis. Portabitque Aaron iniquitates eorum, quæ obtulerunt et sanctificaverunt filii Israël, in cunctis muneribus et donariis suis. Erit autem lamina semper in fronte ejus, ut placatus sit eis Dominus.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Stringesque tunicam bysso, et tiaram byssinam facies, et balteum opere plumarii.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Porro filiis Aaron tunicas lineas parabis et balteos ac tiaras in gloriam et decorem :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>vestiesque his omnibus Aaron fratrem tuum et filios ejus cum eo. Et cunctorum consecrabis manus, sanctificabisque illos, ut sacerdotio fungantur mihi.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Facies et feminalia linea, ut operiant carnem turpitudinis suæ, a renibus usque ad femora :</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>et utentur eis Aaron et filii ejus quando ingredientur tabernaculum testimonii, vel quando appropinquant ad altare ut ministrent in sanctuario, ne iniquitatis rei moriantur. Legitimum sempiternum erit Aaron, et semini ejus post eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/27/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 27</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/29/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 29</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 the two edges joined in the top on both sides, that they may be closed together.\"},{\"verse\":8,\"text\":\"The very workmanship also, and all the variety of the work, shall be of gold, and violet, and purple, and scarlet twice dyed, and fine twisted linen.\"},{\"verse\":9,\"text\":\"And thou shalt take two onyx stones, and shalt grave on them the names of the children of Israel:\"},{\"verse\":10,\"text\":\"Six names on one stone, and the other six on the other, according to the order of their birth.\"},{\"verse\":11,\"text\":\"With the work of an engraver, and the graving of a jeweller, thou shalt engrave them with the names of the children of Israel, set in gold and compassed about:\"},{\"verse\":12,\"text\":\"And thou shalt put them in both sides of the ephod, a memorial for the children of Israel. And Aaron shall bear their names before the Lord upon both shoulders, for a remembrance.\"},{\"verse\":13,\"text\":\"Thou shalt make also hooks of gold.\"},{\"verse\":14,\"text\":\"And two little chains of the purest gold, linked one to another, which thou shalt put into the hooks.\"},{\"verse\":15,\"text\":\"And thou shalt make the rational of judgment with embroidered work of divers colours, according to the workmanship of the ephod, of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen.\"},{\"verse\":16,\"text\":\"It shall be four square and doubled: it shall be the measure of a span both in length and in breadth.\"},{\"verse\":17,\"text\":\"And thou shalt set in it four rows of stones . In the first row shall be a sardius stone, and a topaz, and an emerald:\"},{\"verse\":18,\"text\":\"In the second a carbuncle, a sapphire, and a jasper:\"},{\"verse\":19,\"text\":\"In the third a ligurius, an agate, and an amethyst:\"},{\"verse\":20,\"text\":\"In the fourth a chrysolite, an onyx, and a beryl. They shall be set in gold by their rows.\"},{\"verse\":21,\"text\":\"And they shall have the names of the children of Israel: with twelve names shall they be engraved, each stone with the name of one according to the twelve tribes.\"},{\"verse\":22,\"text\":\"And thou shalt make on the rational chains, linked one to another, of the purest gold:\"},{\"verse\":23,\"text\":\"And two rings of gold, which thou shalt put in the two ends at the top of the rational.\"},{\"verse\":24,\"text\":\"And the golden chains thou shalt join to the rings, that are in the ends thereof.\"},{\"verse\":25,\"text\":\"And the ends of the chains themselves, thou shalt join together with two hooks, on both sides of the ephod, which is towards the rational.\"},{\"verse\":26,\"text\":\"Thou shalt make also two rings of gold, which thou shalt put in the top parts of the rational, in the borders that are over against the ephod, and look towards the back parts thereof.\"},{\"verse\":27,\"text\":\"Moreover also other two rings of gold, which are to be set on each side of the ephod beneath, that looketh towards the nether joining, that the rational may be fitted with the ephod,\"},{\"verse\":28,\"text\":\"And may be fastened by the rings thereof unto the rings of the ephod with a violet fillet, that the joining artificially wrought may continue, and the rational and the ephod may not be loosed one from the other.\"},{\"verse\":29,\"text\":\"And Aaron shall bear the names of the children of Israel in the rational of judgment upon his breast, when he shall enter into the sanctuary, a memorial before the Lord for ever.\"},{\"verse\":30,\"text\":\"And thou shalt put in the rational of judgment doctrine and truth, which shall be on Aaron’s breast, when he shall go in before the Lord: and he shall bear the judgment of the children of Israel on his breast, in the sight of the Lord always.\"},{\"verse\":31,\"text\":\"And thou shalt make the tunic of the ephod all of violet,\"},{\"verse\":32,\"text\":\"In the midst whereof above shall be a hole for the head, and a border round about it woven, as is wont to be made in the outmost parts of garments, that it may not easily be broken.\"},{\"verse\":33,\"text\":\"And beneath at the feet of the same tunic, round about, thou shalt make as it were pomegranates, of violet, and purple, and scarlet twice dyed, with little bells set between:\"},{\"verse\":34,\"text\":\"So that there shall be a golden bell and a pomegranate, and again another golden bell and a pomegranate.\"},{\"verse\":35,\"text\":\"And Aaron shall be vested with it in the office of his ministry, that the sound may be heard, when he goeth in and cometh out of the sanctuary, in the sight of the Lord, and that he may not die.\"},{\"verse\":36,\"text\":\"Thou shalt make also a plate of the purest gold: wherein thou shalt grave with engraver’s work, Holy to the Lord.\"},{\"verse\":37,\"text\":\"And thou shalt tie it with a violet fillet, and it shall be upon the mitre,\"},{\"verse\":38,\"text\":\"Hanging over the forehead of the high priest. And Aaron shall bear the iniquities of those things, which the children of Israel have offered and sanctified, in all their gifts and offerings. And the plate shall be always on his forehead, that the Lord may be well pleased with them.\"},{\"verse\":39,\"text\":\"And thou shalt gird the tunic with fine linen, and thou shalt make a fine linen mitre, and a girdle of embroidered work.\"},{\"verse\":40,\"text\":\"Moreover, for the sons of Aaron thou shalt prepare linen tunics, and girdles and mitres for glory and beauty:\"},{\"verse\":41,\"text\":\"And with all these things thou shalt vest Aaron thy brother, and his sons with him. And thou shalt consecrate the hands of them all, and shalt sanctify them, that they may do the office of priesthood unto me.\"},{\"verse\":42,\"text\":\"Thou shalt make also linen breeches, to cover the flesh of their nakedness, from the reins to the thighs:\"},{\"verse\":43,\"text\":\"And Aaron and his sons shall use them when they shall go into the tabernacle of the testimony, or when they approach to the altar to minister in the sanctuary, lest being guilty of iniquity they die. It shall be a law for ever to Aaron, and to his seed after him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Applica quoque ad te Aaron fratrem tuum cum filiis suis de medio filiorum Israël, ut sacerdotio fungantur mihi : Aaron, Nadab, et Abiu, Eleazar, et Ithamar.\"},{\"verse\":2,\"text\":\"Faciesque vestem sanctam Aaron fratri tuo in gloriam et decorem.\"},{\"verse\":3,\"text\":\"Et loqueris cunctis sapientibus corde quos replevi spiritu prudentiæ, ut faciant vestes Aaron, in quibus sanctificatus ministret mihi.\"},{\"verse\":4,\"text\":\"Hæc autem erunt vestimenta quæ faciet : rationale et superhumerale, tunicam et lineam strictam, cidarim et balteum. Facient vestimenta sancta fratri tuo Aaron et filiis ejus, ut sacerdotio fungantur mihi.\"},{\"verse\":5,\"text\":\"Accipientque aurum, et hyacinthum, et purpuram, coccumque bis tinctum, et byssum.\"},{\"verse\":6,\"text\":\"Facient autem superhumerale de auro et hyacintho et purpura, coccoque bis tincto, et bysso retorta, opere polymito.\"},{\"verse\":7,\"text\":\"Duas oras junctas habebit in utroque latere summitatum, ut in unum redeant.\"},{\"verse\":8,\"text\":\"Ipsa quoque textura et cuncta operis varietas erit ex auro et hyacintho, et purpura, coccoque bis tincto, et bysso retorta.\"},{\"verse\":9,\"text\":\"Sumesque duos lapides onychinos, et sculpes in eis nomina filiorum Israël :\"},{\"verse\":10,\"text\":\"sex nomina in lapide uno, et sex reliqua in altero, juxta ordinem nativitatis eorum.\"},{\"verse\":11,\"text\":\"Opere sculptoris et cælatura gemmarii, sculpes eos nominibus filiorum Israël, inclusos auro atque circumdatos :\"},{\"verse\":12,\"text\":\"et pones in utroque latere superhumeralis, memoriale filiis Israël. Portabitque Aaron nomina eorum coram Domino super utrumque humerum, ob recordationem.\"},{\"verse\":13,\"text\":\"Facies et uncinos ex auro,\"},{\"verse\":14,\"text\":\"et duas catenulas ex auro purissimo sibi invicem cohærentes, quas inseres uncinis.\"},{\"verse\":15,\"text\":\"Rationale quoque judicii facies opere polymito juxta texturam superhumeralis, ex auro, hyacintho, et purpura, coccoque bis tincto, et bysso retorta.\"},{\"verse\":16,\"text\":\"Quadrangulum erit et duplex : mensuram palmi habebit tam in longitudine quam in latitudine.\"},{\"verse\":17,\"text\":\"Ponesque in eo quatuor ordines lapidum : in primo versu erit lapis sardius, et topazius, et smaragdus :\"},{\"verse\":18,\"text\":\"in secundo carbunculus, sapphirus, et jaspis :\"},{\"verse\":19,\"text\":\"in tertio ligurius, achates, et amethystus :\"},{\"verse\":20,\"text\":\"in quarto chrysolithus, onychinus, et beryllus. Inclusi auro erunt per ordines suos.\"},{\"verse\":21,\"text\":\"Habebuntque nomina filiorum Israël : duodecim nominibus cælabuntur, singuli lapides nominibus singulorum per duodecim tribus.\"},{\"verse\":22,\"text\":\"Facies in rationali catenas sibi invicem cohærentes ex auro purissimo,\"},{\"verse\":23,\"text\":\"et duos annulos aureos, quos pones in utraque rationalis summitate :\"},{\"verse\":24,\"text\":\"catenasque aureas junges annulis, qui sunt in marginibus ejus,\"},{\"verse\":25,\"text\":\"et ipsarum catenarum extrema duobus copulabis uncinis in utroque latere superhumeralis quod rationale respicit.\"},{\"verse\":26,\"text\":\"Facies et duos annulos aureos, quos pones in summitatibus rationalis, in oris, quæ e regione sunt superhumeralis, et posteriora ejus aspiciunt.\"},{\"verse\":27,\"text\":\"Necnon et alios duos annulos aureos, qui ponendi sunt in utroque latere superhumeralis deorsum, quod respicit contra faciem juncturæ inferioris, ut aptari possit cum superhumerali,\"},{\"verse\":28,\"text\":\"et stringatur rationale annulis suis cum annulis superhumeralis vitta hyacinthina, ut maneat junctura fabrefacta, et a se invicem rationale et superhumerale nequeant separari.\"},{\"verse\":29,\"text\":\"Portabitque Aaron nomina filiorum Israël in rationali judicii super pectus suum, quando ingredietur Sanctuarium, memoriale coram Domino in æternum.\"},{\"verse\":30,\"text\":\"Pones autem in rationali judicii Doctrinam et Veritatem, quæ erunt in pectore Aaron, quando ingredietur coram Domino : et gestabit judicium filiorum Israël in pectore suo, in conspectu Domini semper.\"},{\"verse\":31,\"text\":\"Facies et tunicam superhumeralis totam hyacinthinam,\"},{\"verse\":32,\"text\":\"in cujus medio supra erit capitium, et ora per gyrum ejus textilis, sicut fieri solet in extremis vestium partibus, ne facile rumpatur.\"},{\"verse\":33,\"text\":\"Deorsum vero, ad pedes ejusdem tunicæ, per circuitum, quasi mala punica facies, ex hyacintho, et purpura, et cocco bis tincto, mistis in medio tintinnabulis,\"},{\"verse\":34,\"text\":\"ita ut tintinnabulum sit aureum et malum punicum : rursumque tintinnabulum aliud aureum et malum punicum.\"},{\"verse\":35,\"text\":\"Et vestietur ea Aaron in officio ministerii, ut audiatur sonitus quando ingreditur et egreditur sanctuarium in conspectu Domini, et non moriatur.\"},{\"verse\":36,\"text\":\"Facies et laminam de auro purissimo, in qua sculpes opere cælatoris, Sanctum Domino.\"},{\"verse\":37,\"text\":\"Ligabisque eam vitta hyacinthina, et erit super tiaram,\"},{\"verse\":38,\"text\":\"imminens fronti pontificis. Portabitque Aaron iniquitates eorum, quæ obtulerunt et sanctificaverunt filii Israël, in cunctis muneribus et donariis suis. Erit autem lamina semper in fronte ejus, ut placatus sit eis Dominus.\"},{\"verse\":39,\"text\":\"Stringesque tunicam bysso, et tiaram byssinam facies, et balteum opere plumarii.\"},{\"verse\":40,\"text\":\"Porro filiis Aaron tunicas lineas parabis et balteos ac tiaras in gloriam et decorem :\"},{\"verse\":41,\"text\":\"vestiesque his omnibus Aaron fratrem tuum et filios ejus cum eo. Et cunctorum consecrabis manus, sanctificabisque illos, ut sacerdotio fungantur mihi.\"},{\"verse\":42,\"text\":\"Facies et feminalia linea, ut operiant carnem turpitudinis suæ, a renibus usque ad femora :\"},{\"verse\":43,\"text\":\"et utentur eis Aaron et filii ejus quando ingredientur tabernaculum testimonii, vel quando appropinquant ad altare ut ministrent in sanctuario, ne iniquitatis rei moriantur. Legitimum sempiternum erit Aaron, et semini ejus post eum.\"}],\"summary\":\"The holy vestments for Aaron and his sons.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":27,\"label\":\"Exodus 27\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":29,\"label\":\"Exodus 29\"}}]]\n"])</script></body></html>
