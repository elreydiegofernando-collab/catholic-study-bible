ly-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The first month, the first day of the month, thou shalt set up the tabernacle of the testimony,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And shalt put the ark in it, and shalt let down the veil before it:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou shalt bring in the table, and set upon it the things that are commanded according to the rite. The candlestick shall stand with its lamps,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the altar of gold, whereon the incense is burnt before the ark of the testimony. Thou shalt put the hanging in the entry of the tabernacle,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And before it the altar of holocaust.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The laver between the altar and the tabernacle, and thou shalt fill it with water.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And thou shalt encompass the court with hangings, and the entry thereof.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And thou shalt take the oil of unction and anoint the tabernacle with its vessels, that they may be sanctified:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The altar of holocaust and all its vessels:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The laver with its foot: thou shalt consecrate all with the oil of unction, that they may be most holy.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And thou shalt bring Aaron and his sons to the door of the tabernacle of the testimony, and having washed them with water,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt put on them the holy vestments, that they may minister to me, and that the unction of them may prosper to an everlasting priesthood.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Moses did all that the Lord had commanded.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So in the first month of the second year, the first day of the month, the tabernacle was set up.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Moses reared it up, and placed the boards and the sockets and the bars, and set up the pillars,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And spread the roof over the tabernacle, putting over it a cover, as the Lord had commanded.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he put the testimony in the ark, thrusting bars underneath, and the oracle above.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And when he had brought the ark into the tabernacle, he drew the veil before it to fulfil the commandment of the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he set the table in the tabernacle of the testimony, at the north side, without the veil,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Setting there in order the loaves of proposition, as the Lord had commanded Moses.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He set the candlestick also in the tabernacle of the testimony, over against the table on the south side,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Placing the lamps in order, according to the precept of the Lord.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He set also the altar of gold under the roof of the testimony, over against the veil,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And burnt upon it the incense of spices, as the Lord had commanded Moses.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he put also the hanging in the entry of the tabernacle of the testimony,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the altar of holocaust in the entry of the testimony, offering the holocaust, and the sacrifices upon it, as the Lord had commanded.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he set the laver between the tabernacle of the testimony and the altar, filling it with water.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Moses and Aaron, and his sons, washed their hands and feet,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>When they went into the tabernacle of the covenant, and went to the altar, as the Lord had commanded Moses.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>He set up also the court round about the tabernacle and the altar, drawing the hanging in the entry thereof. After all things were perfected,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The cloud covered the tabernacle of the testimony, and the glory of the Lord filled it.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Neither could Moses go into the tabernacle of the covenant, the cloud covering all things, and the majesty of the Lord shining, for the cloud had covered all.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>If at any time the cloud removed from the tabernacle, the children of Israel went forward by their troops:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If it hung over, they remained in the same place.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For the cloud of the Lord hung over the tabernacle by day, and a fire by night, in the sight of all the children of Israel throughout all their mansions.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Mense primo, prima die mensis, eriges tabernaculum testimonii,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et pones in eo arcam, dimittesque ante illam velum :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et illata mensa, pones super eam quæ rite præcepta sunt. Candelabrum stabit cum lucernis suis,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et altare aureum, in quo adoletur incensum, coram arca testimonii. Tentorium in introitu tabernaculi pones,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et ante illud altare holocausti :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>labrum inter altare et tabernaculum, quod implebis aqua.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Circumdabisque atrium tentoriis, et ingressum ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et assumpto unctionis oleo unges tabernaculum cum vasis suis, ut sanctificentur :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>altare holocausti et omnia vasa ejus,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>labrum cum basi sua : omnia unctionis oleo consecrabis, ut sint Sancta sanctorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Applicabisque Aaron et filios ejus ad fores tabernaculi testimonii, et lotos aqua</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>indues sanctis vestibus, ut ministrent mihi, et unctio eorum in sacerdotium sempiternum proficiat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fecitque Moyses omnia quæ præceperat Dominus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Igitur mense primo anni secundi, prima die mensis, collocatum est tabernaculum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Erexitque Moyses illud, et posuit tabulas ac bases et vectes, statuitque columnas,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>et expandit tectum super tabernaculum, imposito desuper operimento, sicut Dominus imperaverat.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Posuit et testimonium in arca, subditis infra vectibus, et oraculum desuper.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cumque intulisset arcam in tabernaculum, appendit ante eam velum ut expleret Domini jussionem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Posuit et mensam in tabernaculo testimonii ad plagam septentrionalem extra velum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ordinatis coram propositionis panibus, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Posuit et candelabrum in tabernaculo testimonii e regione mensæ in parte australi,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>locatis per ordinem lucernis, juxta præceptum Domini.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Posuit et altare aureum sub tecto testimonii contra velum,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et adolevit super eo incensum aromatum, sicut jusserat Dominus Moysi.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Posuit et tentorium in introitu tabernaculi testimonii,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et altare holocausti in vestibulo testimonii, offerens in eo holocaustum, et sacrificia, ut Dominus imperaverat.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Labrum quoque statuit inter tabernaculum testimonii et altare, implens illud aqua.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Laveruntque Moyses et Aaron ac filii ejus manus suas et pedes,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>cum ingrederentur tectum fœderis, et accederent ad altare, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Erexit et atrium per gyrum tabernaculi et altaris, ducto in introitu ejus tentorio. Postquam omnia perfecta sunt,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>operuit nubes tabernaculum testimonii, et gloria Domini implevit illud.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Nec poterat Moyses ingredi tectum fœderis, nube operiente omnia, et majestate Domini coruscante, quia cuncta nubes operuerat.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Siquando nubes tabernaculum deserebat, proficiscebantur filii Israël per turmas suas :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>si pendebat desuper, manebant in eodem loco.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Nubes quippe Domini incubabat per diem tabernaculo, et ignis in nocte, videntibus cunctis populis Israël per cunctas mansiones suas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/39/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 39</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LEV/1/"><span class="min-w-0"><span class="block text-xs uppercase \"verse\":6,\"text\":\"And before it the altar of holocaust.\"},{\"verse\":7,\"text\":\"The laver between the altar and the tabernacle, and thou shalt fill it with water.\"},{\"verse\":8,\"text\":\"And thou shalt encompass the court with hangings, and the entry thereof.\"},{\"verse\":9,\"text\":\"And thou shalt take the oil of unction and anoint the tabernacle with its vessels, that they may be sanctified:\"},{\"verse\":10,\"text\":\"The altar of holocaust and all its vessels:\"},{\"verse\":11,\"text\":\"The laver with its foot: thou shalt consecrate all with the oil of unction, that they may be most holy.\"},{\"verse\":12,\"text\":\"And thou shalt bring Aaron and his sons to the door of the tabernacle of the testimony, and having washed them with water,\"},{\"verse\":13,\"text\":\"Thou shalt put on them the holy vestments, that they may minister to me, and that the unction of them may prosper to an everlasting priesthood.\"},{\"verse\":14,\"text\":\"And Moses did all that the Lord had commanded.\"},{\"verse\":15,\"text\":\"So in the first month of the second year, the first day of the month, the tabernacle was set up.\"},{\"verse\":16,\"text\":\"And Moses reared it up, and placed the boards and the sockets and the bars, and set up the pillars,\"},{\"verse\":17,\"text\":\"And spread the roof over the tabernacle, putting over it a cover, as the Lord had commanded.\"},{\"verse\":18,\"text\":\"And he put the testimony in the ark, thrusting bars underneath, and the oracle above.\"},{\"verse\":19,\"text\":\"And when he had brought the ark into the tabernacle, he drew the veil before it to fulfil the commandment of the Lord.\"},{\"verse\":20,\"text\":\"And he set the table in the tabernacle of the testimony, at the north side, without the veil,\"},{\"verse\":21,\"text\":\"Setting there in order the loaves of proposition, as the Lord had commanded Moses.\"},{\"verse\":22,\"text\":\"He set the candlestick also in the tabernacle of the testimony, over against the table on the south side,\"},{\"verse\":23,\"text\":\"Placing the lamps in order, according to the precept of the Lord.\"},{\"verse\":24,\"text\":\"He set also the altar of gold under the roof of the testimony, over against the veil,\"},{\"verse\":25,\"text\":\"And burnt upon it the incense of spices, as the Lord had commanded Moses.\"},{\"verse\":26,\"text\":\"And he put also the hanging in the entry of the tabernacle of the testimony,\"},{\"verse\":27,\"text\":\"And the altar of holocaust in the entry of the testimony, offering the holocaust, and the sacrifices upon it, as the Lord had commanded.\"},{\"verse\":28,\"text\":\"And he set the laver between the tabernacle of the testimony and the altar, filling it with water.\"},{\"verse\":29,\"text\":\"And Moses and Aaron, and his sons, washed their hands and feet,\"},{\"verse\":30,\"text\":\"When they went into the tabernacle of the covenant, and went to the altar, as the Lord had commanded Moses.\"},{\"verse\":31,\"text\":\"He set up also the court round about the tabernacle and the altar, drawing the hanging in the entry thereof. After all things were perfected,\"},{\"verse\":32,\"text\":\"The cloud covered the tabernacle of the testimony, and the glory of the Lord filled it.\"},{\"verse\":33,\"text\":\"Neither could Moses go into the tabernacle of the covenant, the cloud covering all things, and the majesty of the Lord shining, for the cloud had covered all.\"},{\"verse\":34,\"text\":\"If at any time the cloud removed from the tabernacle, the children of Israel went forward by their troops:\"},{\"verse\":35,\"text\":\"If it hung over, they remained in the same place.\"},{\"verse\":36,\"text\":\"For the cloud of the Lord hung over the tabernacle by day, and a fire by night, in the sight of all the children of Israel throughout all their mansions.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Mense primo, prima die mensis, eriges tabernaculum testimonii,\"},{\"verse\":3,\"text\":\"et pones in eo arcam, dimittesque ante illam velum :\"},{\"verse\":4,\"text\":\"et illata mensa, pones super eam quæ rite præcepta sunt. Candelabrum stabit cum lucernis suis,\"},{\"verse\":5,\"text\":\"et altare aureum, in quo adoletur incensum, coram arca testimonii. Tentorium in introitu tabernaculi pones,\"},{\"verse\":6,\"text\":\"et ante illud altare holocausti :\"},{\"verse\":7,\"text\":\"labrum inter altare et tabernaculum, quod implebis aqua.\"},{\"verse\":8,\"text\":\"Circumdabisque atrium tentoriis, et ingressum ejus.\"},{\"verse\":9,\"text\":\"Et assumpto unctionis oleo unges tabernaculum cum vasis suis, ut sanctificentur :\"},{\"verse\":10,\"text\":\"altare holocausti et omnia vasa ejus,\"},{\"verse\":11,\"text\":\"labrum cum basi sua : omnia unctionis oleo consecrabis, ut sint Sancta sanctorum.\"},{\"verse\":12,\"text\":\"Applicabisque Aaron et filios ejus ad fores tabernaculi testimonii, et lotos aqua\"},{\"verse\":13,\"text\":\"indues sanctis vestibus, ut ministrent mihi, et unctio eorum in sacerdotium sempiternum proficiat.\"},{\"verse\":14,\"text\":\"Fecitque Moyses omnia quæ præceperat Dominus.\"},{\"verse\":15,\"text\":\"Igitur mense primo anni secundi, prima die mensis, collocatum est tabernaculum.\"},{\"verse\":16,\"text\":\"Erexitque Moyses illud, et posuit tabulas ac bases et vectes, statuitque columnas,\"},{\"verse\":17,\"text\":\"et expandit tectum super tabernaculum, imposito desuper operimento, sicut Dominus imperaverat.\"},{\"verse\":18,\"text\":\"Posuit et testimonium in arca, subditis infra vectibus, et oraculum desuper.\"},{\"verse\":19,\"text\":\"Cumque intulisset arcam in tabernaculum, appendit ante eam velum ut expleret Domini jussionem.\"},{\"verse\":20,\"text\":\"Posuit et mensam in tabernaculo testimonii ad plagam septentrionalem extra velum,\"},{\"verse\":21,\"text\":\"ordinatis coram propositionis panibus, sicut præceperat Dominus Moysi.\"},{\"verse\":22,\"text\":\"Posuit et candelabrum in tabernaculo testimonii e regione mensæ in parte australi,\"},{\"verse\":23,\"text\":\"locatis per ordinem lucernis, juxta præceptum Domini.\"},{\"verse\":24,\"text\":\"Posuit et altare aureum sub tecto testimonii contra velum,\"},{\"verse\":25,\"text\":\"et adolevit super eo incensum aromatum, sicut jusserat Dominus Moysi.\"},{\"verse\":26,\"text\":\"Posuit et tentorium in introitu tabernaculi testimonii,\"},{\"verse\":27,\"text\":\"et altare holocausti in vestibulo testimonii, offerens in eo holocaustum, et sacrificia, ut Dominus imperaverat.\"},{\"verse\":28,\"text\":\"Labrum quoque statuit inter tabernaculum testimonii et altare, implens illud aqua.\"},{\"verse\":29,\"text\":\"Laveruntque Moyses et Aaron ac filii ejus manus suas et pedes,\"},{\"verse\":30,\"text\":\"cum ingrederentur tectum fœderis, et accederent ad altare, sicut præceperat Dominus Moysi.\"},{\"verse\":31,\"text\":\"Erexit et atrium per gyrum tabernaculi et altaris, ducto in introitu ejus tentorio. Postquam omnia perfecta sunt,\"},{\"verse\":32,\"text\":\"operuit nubes tabernaculum testimonii, et gloria Domini implevit illud.\"},{\"verse\":33,\"text\":\"Nec poterat Moyses ingredi tectum fœderis, nube operiente omnia, et majestate Domini coruscante, quia cuncta nubes operuerat.\"},{\"verse\":34,\"text\":\"Siquando nubes tabernaculum deserebat, proficiscebantur filii Israël per turmas suas :\"},{\"verse\":35,\"text\":\"si pendebat desuper, manebant in eodem loco.\"},{\"verse\":36,\"text\":\"Nubes quippe Domini incubabat per diem tabernaculo, et ignis in nocte, videntibus cunctis populis Israël per cunctas mansiones suas.\"}],\"summary\":\"The tabernacle is commanded to be set up and anointed. God filleth it with his majesty.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":39,\"label\":\"Exodus 39\"},\"next\":{\"usfm\":\"LEV\",\"chapter\":1,\"label\":\"Leviticus 1\"}}]]\n"])</script></body></html>
