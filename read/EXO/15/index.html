[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Moses and the children of Israel sung this canticle to the Lord, and said: Let us sing to the Lord: for he is gloriously magnified, the horse and the rider he hath thrown into the sea.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The Lord is my strength and my praise, and he is become salvation to me: he is my God, and I will glorify him: the God of my father, and I will exalt him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The Lord is as a man of war, Almighty is his name.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Pharao’s chariots and his army he hath cast into the sea: his chosen captains are drowned in the Red Sea.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The depths have covered them, they are sunk to the bottom like a stone.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thy right hand, O Lord, is magnified in strength: thy right hand, O Lord, hath slain the enemy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And in the multitude of thy glory thou hast put down thy adversaries: thou hast sent thy wrath, which hath devoured them like stubble.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And with the blast of thy anger the waters were gathered together: the flowing water stood, the depths were gathered together in the midst of the sea.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The enemy said: I will pursue and overtake, I will divide the spoils, my soul shall have its fill: I will draw my sword, my hand shall slay them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thy wind blew and the sea covered them: they sunk as lead in the mighty waters.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Who is like to thee, among the strong, O Lord? who is like to thee, glorious in holiness, terrible and praise-worthy, doing wonders?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Thou stretchedst forth thy hand, and the earth swallowed them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In thy mercy thou hast been a leader to the people which thou hast redeemed: and in thy strength thou hast carried them to thy holy habitation.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nations rose up, and were angry: sorrows took hold on the inhabitants of Philisthiim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then were the princes of Edom troubled, trembling seized on the stout men of Moab: all the inhabitants of Chanaan became stiff.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let fear and dread fall upon them, in the greatness of thy arm: let them become immoveable as a stone, until thy people, O Lord, pass by: until this thy people pass by, which thou hast possessed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou shalt bring them in, and plant them in the mountain of thy inheritance, in thy most firm habitation, which thou hast made, O Lord; thy sanctuary, O Lord, which thy hands have established.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Lord shall reign for ever and ever.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For Pharao went in on horseback with his chariots and horsemen into the sea: and the Lord brought back upon them the waters of the sea: but the children of Israel walked on dry ground in the midst thereof.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>So Mary the prophetess, the sister of Aaron, took a timbrel in her hand: and all the women went forth after her with timbrels and with dances.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And she began the song to them, saying: Let us sing to the Lord, for he is gloriously magnified, the horse and his rider he hath thrown into the sea.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Moses brought Israel from the Red Sea, and they went forth into the wilderness of Sur: and they marched three days through the wilderness, and found no water.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they came into Mara, and they could not drink the waters of Mara because they were bitter: whereupon he gave a name also agreeable to the place, calling it Mara, that is, bitterness.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And the people murmured against Moses, saying: What shall we drink?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But he cried to the Lord, and he shewed him a tree, which when he had cast into the waters, they were turned into sweetness. There he appointed him ordinances, and judgments, and there he proved him,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Saying: If thou wilt hear the voice of the Lord thy God, and do what is right before him, and obey his commandments, and keep all his precepts, none of the evils that I laid upon Egypt, will I bring upon thee: for I am the Lord thy healer.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the children of Israel came into Elim, where there were twelve fountains of water, and seventy palm trees: and they encamped by the waters.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc cecinit Moyses et filii Israël carmen hoc Domino, et dixerunt : Cantemus Domino : gloriose enim magnificatus est, equum et ascensorem dejecit in mare.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fortitudo mea, et laus mea Dominus, et factus est mihi in salutem : iste Deus meus, et glorificabo eum : Deus patris mei, et exaltabo eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dominus quasi vir pugnator, Omnipotens nomen ejus,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>currus Pharaonis et exercitum ejus projecit in mare : electi principes ejus submersi sunt in mari Rubro.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Abyssi operuerunt eos ; descenderunt in profundum quasi lapis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dextera tua, Domine, magnificata est in fortitudine : dextera tua, Domine, percussit inimicum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et in multitudine gloriæ tuæ deposuisti adversarios tuos : misisti iram tuam, quæ devoravit eos sicut stipulam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et in spiritu furoris tui congregatæ sunt aquæ : stetit unda fluens, congregata sunt abyssi in medio mari.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixit inimicus : Persequar et comprehendam, dividam spolia, implebitur anima mea : evaginabo gladium meum, interficiet eos manus mea.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Flavit spiritus tuus, et operuit eos mare : submersi sunt quasi plumbum in aquis vehementibus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quis similis tui in fortibus, Domine ? quis similis tui, magnificus in sanctitate, terribilis atque laudabilis, faciens mirabilia ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Extendisti manum tuam, et devoravit eos terra.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dux fuisti in misericordia tua populo quem redemisti : et portasti eum in fortitudine tua, ad habitaculum sanctum tuum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ascenderunt populi, et irati sunt : dolores obtinuerunt habitatores Philisthiim.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tunc conturbati sunt principes Edom, robustos Moab obtinuit tremor : obriguerunt omnes habitatores Chanaan.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Irruat super eos formido et pavor, in magnitudine brachii tui : fiant immobiles quasi lapis, donec pertranseat populus tuus, Domine, donec pertranseat populus tuus iste, quem possedisti.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Introduces eos, et plantabis in monte hæreditatis tuæ, firmissimo habitaculo tuo quod operatus es, Domine : sanctuarium tuum, Domine, quod firmaverunt manus tuæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dominus regnabit in æternum et ultra.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ingressus est enim eques Pharao cum curribus et equitibus ejus in mare : et reduxit super eos Dominus aquas maris : filii autem Israël ambulaverunt per siccum in medio ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Sumpsit ergo Maria prophetissa, soror Aaron, tympanum in manu sua : egressæque sunt omnes mulieres post eam cum tympanis et choris,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quibus præcinebat, dicens : Cantemus Domino, gloriose enim magnificatus est : equum et ascensorem ejus dejecit in mare.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tulit autem Moyses Israël de mari Rubro, et egressi sunt in desertum Sur : ambulaveruntque tribus diebus per solitudinem, et non inveniebant aquam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et venerunt in Mara, nec poterant bibere aquas de Mara, eo quod essent amaræ : unde et congruum loco nomen imposuit, vocans illum Mara, id est, amaritudinem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et murmuravit populus contra Moysen, dicens : Quid bibemus ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>At ille clamavit ad Dominum, qui ostendit ei lignum : quod cum misisset in aquas, in dulcedinem versæ sunt : ibi constituit ei præcepta, atque judicia, et ibi tentavit eum,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>dicens : Si audieris vocem Domini Dei tui, et quod rectum est coram eo feceris, et obedieris mandatis ejus, custodierisque omnia præcepta illius, cunctum languorem, quem posui in Ægypto, non inducam super te : ego enim Dominus sanator tuus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Venerunt autem in Elim filii Israël, ubi erant duodecim fontes aquarum, et septuaginta palmæ : et castrametati sunt juxta aquas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/16/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 16</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->15<!-- --> of <!-- -->40<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Exodus 14" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/14/"><svg viewBox="0 0 24 24" fill="none" stroke= :I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"EXO.15\",{\"bookId\":2,\"usfm\":\"EXO\",\"bookName\":\"Exodus\",\"drName\":\"Exodus\",\"chapter\":15,\"totalChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"Then Moses and the children of Israel sung this canticle to the Lord, and said: Let us sing to the Lord: for he is gloriously magnified, the horse and the rider he hath thrown into the sea.\"},{\"verse\":2,\"text\":\"The Lord is my strength and my praise, and he is become salvation to me: he is my God, and I will glorify him: the God of my father, and I will exalt him.\"},{\"verse\":3,\"text\":\"The Lord is as a man of war, Almighty is his name.\"},{\"verse\":4,\"text\":\"Pharao’s chariots and his army he hath cast into the sea: his chosen captains are drowned in the Red Sea.\"},{\"verse\":5,\"text\":\"The depths have covered them, they are sunk to the bottom like a stone.\"},{\"verse\":6,\"text\":\"Thy right hand, O Lord, is magnified in strength: thy right hand, O Lord, hath slain the enemy.\"},{\"verse\":7,\"text\":\"And in the multitude of thy glory thou hast put down thy adversaries: thou hast sent thy wrath, which hath devoured them like stubble.\"},{\"verse\":8,\"text\":\"And with the blast of thy anger the waters were gathered together: the flowing water stood, the depths were gathered together in the midst of the sea.\"},{\"verse\":9,\"text\":\"The enemy said: I will pursue and overtake, I will divide the spoils, my soul shall have its fill: I will draw my sword, my hand shall slay them.\"},{\"verse\":10,\"text\":\"Thy wind blew and the sea covered them: they sunk as lead in the mighty waters.\"},{\"verse\":11,\"text\":\"Who is like to thee, among the strong, O Lord? who is like to thee, glorious in holiness, terrible and praise-worthy, doing wonders?\"},{\"verse\":12,\"text\":\"Thou stretchedst forth thy hand, and the earth swallowed them.\"},{\"verse\":13,\"text\":\"In thy mercy thou hast been a leader to the people which thou hast redeemed: and in thy strength thou hast carried them to thy holy habitation.\"},{\"verse\":14,\"text\":\"Nations rose up, and were angry: sorrows took hold on the inhabitants of Philisthiim.\"},{\"verse\":15,\"text\":\"Then were the princes of Edom troubled, trembling seized on the stout men of Moab: all the inhabitants of Chanaan became stiff.\"},{\"verse\":16,\"text\":\"Let fear and dread fall upon them, in the greatness of thy arm: let them become immoveable as a stone, until thy people, O Lord, pass by: until this thy people pass by, which thou hast possessed.\"},{\"verse\":17,\"text\":\"Thou shalt bring them in, and plant them in the mountain of thy inheritance, in thy most firm habitation, which thou hast made, O Lord; thy sanctuary, O Lord, which thy hands have established.\"},{\"verse\":18,\"text\":\"The Lord shall reign for ever and ever.\"},{\"verse\":19,\"text\":\"For Pharao went in on horseback with his chariots and horsemen into the sea: and the Lord brought back upon them the waters of the sea: but the children of Israel walked on dry ground in the midst thereof.\"},{\"verse\":20,\"text\":\"So Mary the prophetess, the sister of Aaron, took a timbrel in her hand: and all the women went forth after her with timbrels and with dances.\"},{\"verse\":21,\"text\":\"And she began the song to them, saying: Let us sing to the Lord, for he is gloriously magnified, the horse and his rider he hath thrown into the sea.\"},{\"verse\":22,\"text\":\"And Moses brought Israel from the Red Sea, and they went forth into the wilderness of Sur: and they marched three days through the wilderness, and found no water.\"},{\"verse\":23,\"text\":\"And they came into Mara, and they could not drink the waters of Mara because they were bitter: whereupon he gave a name also agreeable to the place, calling it Mara, that is, bitterness.\"},{\"verse\":24,\"text\":\"And the people murmured against Moses, saying: What shall we drink?\"},{\"verse\":25,\"text\":\"But he cried to the Lord, and he shewed him a tree, which when he had cast into the waters, they were turned into sweetness. There he appointed him ordinances, and judgments, and there he proved him,\"},{\"verse\":26,\"text\":\"Saying: If thou wilt hear the voice of the Lord thy God, and do what is right before him, and obey his commandments, and keep all his precepts, none of the evils that I laid upon Egypt, will I bring upon thee: for I am the Lord thy healer.\"},{\"verse\":27,\"text\":\"And the children of Israel came into Elim, where there were twelve fountains of water, and seventy palm trees: and they encamped by the waters.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc cecinit Moyses et filii Israël carmen hoc Domino, et dixerunt : Cantemus Domino : gloriose enim magnificatus est, equum et ascensorem dejecit in mare.\"},{\"verse\":2,\"text\":\"Fortitudo mea, et laus mea Dominus, et factus est mihi in salutem : iste Deus meus, et glorificabo eum : Deus patris mei, et exaltabo eum.\"},{\"verse\":3,\"text\":\"Dominus quasi vir pugnator, Omnipotens nomen ejus,\"},{\"verse\":4,\"text\":\"currus Pharaonis et exercitum ejus projecit in mare : electi principes ejus submersi sunt in mari Rubro.\"},{\"verse\":5,\"text\":\"Abyssi operuerunt eos ; descenderunt in profundum quasi lapis.\"},{\"verse\":6,\"text\":\"Dextera tua, Domine, magnificata est in fortitudine : dextera tua, Domine, percussit inimicum.\"},{\"verse\":7,\"text\":\"Et in multitudine gloriæ tuæ deposuisti adversarios tuos : misisti iram tuam, quæ devoravit eos sicut stipulam.\"},{\"verse\":8,\"text\":\"Et in spiritu furoris tui congregatæ sunt aquæ : stetit unda fluens, congregata sunt abyssi in medio mari.\"},{\"verse\":9,\"text\":\"Dixit inimicus : Persequar et comprehendam, dividam spolia, implebitur anima mea : evaginabo gladium meum, interficiet eos manus mea.\"},{\"verse\":10,\"text\":\"Flavit spiritus tuus, et operuit eos mare : submersi sunt quasi plumbum in aquis vehementibus.\"},{\"verse\":11,\"text\":\"Quis similis tui in fortibus, Domine ? quis similis tui, magnificus in sanctitate, terribilis atque laudabilis, faciens mirabilia ?\"},{\"verse\":12,\"text\":\"Extendisti manum tuam, et devoravit eos terra.\"},{\"verse\":13,\"text\":\"Dux fuisti in misericordia tua populo quem redemisti : et portasti eum in fortitudine tua, ad habitaculum sanctum tuum.\"},{\"verse\":14,\"text\":\"Ascenderunt populi, et irati sunt : dolores obtinuerunt habitatores Philisthiim.\"},{\"verse\":15,\"text\":\"Tunc conturbati sunt principes Edom, robustos Moab obtinuit tremor : obriguerunt omnes habitatores Chanaan.\"},{\"verse\":16,\"text\":\"Irruat super eos formido et pavor, in magnitudine brachii tui : fiant immobiles quasi lapis, donec pertranseat populus tuus, Domine, donec pertranseat populus tuus iste, quem possedisti.\"},{\"verse\":17,\"text\":\"Introduces eos, et plantabis in monte hæreditatis tuæ, firmissimo habitaculo tuo quod operatus es, Domine : sanctuarium tuum, Domine, quod firmaverunt manus tuæ.\"},{\"verse\":18,\"text\":\"Dominus regnabit in æternum et ultra.\"},{\"verse\":19,\"text\":\"Ingressus est enim eques Pharao cum curribus et equitibus ejus in mare : et reduxit super eos Dominus aquas maris : filii autem Israël ambulaverunt per siccum in medio ejus.\"},{\"verse\":20,\"text\":\"Sumpsit ergo Maria prophetissa, soror Aaron, tympanum in manu sua : egressæque sunt omnes mulieres post eam cum tympanis et choris,\"},{\"verse\":21,\"text\":\"quibus præcinebat, dicens : Cantemus Domino, gloriose enim magnificatus est : equum et ascensorem ejus dejecit in mare.\"},{\"verse\":22,\"text\":\"Tulit autem Moyses Israël de mari Rubro, et egressi sunt in desertum Sur : ambulaveruntque tribus diebus per solitudinem, et non inveniebant aquam.\"},{\"verse\":23,\"text\":\"Et venerunt in Mara, nec poterant bibere aquas de Mara, eo quod essent amaræ : unde et congruum loco nomen imposuit, vocans illum Mara, id est, amaritudinem.\"},{\"verse\":24,\"text\":\"Et murmuravit populus contra Moysen, dicens : Quid bibemus ?\"},{\"verse\":25,\"text\":\"At ille clamavit ad Dominum, qui ostendit ei lignum : quod cum misisset in aquas, in dulcedinem versæ sunt : ibi constituit ei præcepta, atque judicia, et ibi tentavit eum,\"},{\"verse\":26,\"text\":\"dicens : Si audieris vocem Domini Dei tui, et quod rectum est coram eo feceris, et obedieris mandatis ejus, custodierisque omnia præcepta illius, cunctum languorem, quem posui in Ægypto, non inducam super te : ego enim Dominus sanator tuus.\"},{\"verse\":27,\"text\":\"Venerunt autem in Elim filii Israël, ubi erant duodecim fontes aquarum, et septuaginta palmæ : et castrametati sunt juxta aquas.\"}],\"summary\":\"The canticle of Moses. The bitter waters of Mara are made sweet.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":14,\"label\":\"Exodus 14\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":16,\"label\":\"Exodus 16\"}}]]\n"])</script></body></html>
