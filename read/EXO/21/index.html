><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">21</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Laws relating to Justice.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>These are the judgments which thou shalt set before them.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>If thou buy a Hebrew servant, six years shall he serve thee; in the seventh he shall go out free for nothing.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>With what raiment he came in, with the like let him go out: if having a wife, his wife also shall go out with him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But if his master gave him a wife, and she hath borne sons and daughters; the woman and her children shall be her master’s: but he himself shall go out with his raiment.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And if the servant shall say: I love my master and my wife and children, I will not go out free:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>His master shall bring him to the gods, and he shall be set to the door and the posts, and he shall bore his ear through with an awl: and he shall be his servant for ever.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If any man sell his daughter to be a servant, she shall not go out as bondwomen are wont to go out.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>If she displease the eyes of her master to whom she was delivered, he shall let her go: but he shall have no power to sell her to a foreign nation, if he despise her.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But if he have betrothed her to his son, he shall deal with her after the manner of daughters.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And if he take another wife for him, he shall provide her a marriage, and raiment, neither shall he refuse the price of her chastity.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If he do not these three things, she shall go out free without money.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He that striketh a man with a will to kill him, shall be put to death.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But he that did not lie in wait for him, but God delivered him into his hands: I will appoint thee a place to which he must flee.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If a man kill his neighbour on set purpose, and by lying in wait for him: thou shalt take him away from my altar that he may die.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He that striketh his father or mother, shall be put to death.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that shall steal a man, and sell him, being convicted of the guilt, shall be put to death.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He that curseth his father or mother, shall die the death.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If men quarrel, and the one strike his neighbour with a stone, or with his fist, and he die not, but keepeth his bed:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>If he rise again and walk abroad upon his staff, he that struck him shall be quit, yet so that he make restitution for his work, and for his expenses upon the physicians.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that striketh his bondman, or bondwoman, with a rod, and they die under his hands, shall be guilty of the crime.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But if the party remain alive a day or two, he shall not be subject to the punishment, because it is his money.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If men quarrel, and one strike a woman with child and she miscarry indeed, but live herself: he shall be answerable for so much damage as the woman’s husband shall require, and as arbiters shall award.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But if her death ensue thereupon, he shall render life for life,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Eye for eye, tooth for tooth, hand for hand, foot for foot,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Burning for burning, wound for wound, stripe for stripe.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>If any man strike the eye of his manservant or maidservant, and leave them but one eye, he shall let them go free for the eye which he put out.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Also if he strike out a tooth of his manservant or maidservant, he shall in like manner make them free.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>If an ox gore a man or a woman, and they die, he shall be stoned: and his flesh shall not be eaten, but the owner of the ox shall be quit.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But if the ox was wont to push with his horn yesterday, and the day before, and they warned his master, and he did not shut him up, and he shall kill a man or a woman: then the ox shall be stoned, and his owner also shall be put to death.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And if they set a price upon him, he shall give for his life whatsoever is laid upon him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>If he have gored a son, or a daughter, he shall fall under the like sentence.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>If he assault a bondman or bondwoman, he shall give thirty sicles of silver to their master, and the ox shall be stoned.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>If a man open a pit, and dig one, and cover it not, and an ox or an ass fall into it,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The owner of the pit shall pay the price of the beasts: and that which is dead shall be his own.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If one man’s ox gore another man’s ox, and he die: they shall sell the live ox, and shall divide the price, and the carcass of that which died they shall part between them:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But if he knew that his ox was wont to push yesterday, and the day before, and his master did not keep him in; he shall pay ox for ox, and shall take the whole carcass.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc sunt judicia quæ propones eis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Si emeris servum hebræum, sex annis serviet tibi : in septimo egredietur liber gratis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cum quali veste intraverit, cum tali exeat : si habens uxorem, et uxor egredietur simul.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sin autem dominus dederit illi uxorem, et pepererit filios et filias : mulier et liberi ejus erunt domini sui, ipse vero exibit cum vestitu suo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quod si dixerit servus : Diligo dominum meum et uxorem ac liberos ; non egrediar liber :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>offeret eum dominus diis, et applicabitur ad ostium et postes, perforabitque aurem ejus subula : et erit ei servus in sæculum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si quis vendiderit filiam suam in famulam, non egredietur sicut ancillæ exire consueverunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Si displicuerit oculis domini sui cui tradita fuerat, dimittet eam : populo autem alieno vendendi non habebit potestatem, si spreverit eam.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sin autem filio suo desponderit eam, juxta morem filiarum faciet illi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quod si alteram ei acceperit, providebit puellæ nuptias, et vestimenta, et pretium pudicitiæ non negabit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si tria ista non fecerit, egredietur gratis absque pecunia.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui percusserit hominem volens occidere, morte moriatur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui autem non est insidiatus, sed Deus illum tradidit in manus ejus, constituam tibi locum in quem fugere debeat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si quis per industriam occiderit proximum suum, et per insidias : ab altari meo evelles eum, ut moriatur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui percusserit patrem suum aut matrem, morte moriatur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui furatus fuerit hominem, et vendiderit eum, convictus noxæ, morte moriatur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui maledixerit patri suo, vel matri, morte moriatur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si rixati fuerint viri, et percusserit alter proximum suum lapide vel pugno, et ille mortuus non fuerit, sed jacuerit in lectulo :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>si surrexerit, et ambulaverit foris super baculum suum, innocens erit qui percusserit, ita tamen ut operas ejus et impensas in medicos restituat.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui percusserit servum suum, vel ancillam virga, et mortui fuerint in manibus ejus, criminis reus erit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sin autem uno die vel duobus supervixerit, non subjacebit pœnæ, quia pecunia illius est.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si rixati fuerint viri, et percusserit quis mulierem prægnantem, et abortivum quidem fecerit, sed ipsa vixerit : subjacebit damno quantum maritus mulieris expetierit, et arbitri judicaverint.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sin autem mors ejus fuerit subsecuta, reddet animam pro anima,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>oculum pro oculo, dentem pro dente, manum pro manu, pedem pro pede,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>adustionem pro adustione, vulnus pro vulnere, livorem pro livore.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Si percusserit quispiam oculum servi sui aut ancillæ, et luscos eos fecerit, dimittet eos liberos pro oculo quem eruit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dentem quoque si excusserit servo vel ancillæ suæ, similiter dimittet eos liberos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Si bos cornu percusserit virum aut mulierem, et mortui fuerint, lapidibus obruetur : et non comedentur carnes ejus, dominus quoque bovis innocens erit.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quod si bos cornupeta fuerit ab heri et nudiustertius, et contestati sunt dominum ejus, nec recluserit eum, occideritque virum aut mulierem : et bos lapidibus obruetur, et dominum ejus occident.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quod si pretium fuerit ei impositum, dabit pro anima sua quidquid fuerit postulatus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Filium quoque et filiam si cornu percusserit, simili sententiæ subjacebit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Si servum ancillamque invaserit, triginta siclos argenti domino dabit, bos vero lapidibus opprimetur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Si quis aperuerit cisternam, et foderit, et non operuerit eam, cecideritque bos aut asinus in eam,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>reddet dominus cisternæ pretium jumentorum : quod autem mortuum est, ipsius erit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Si bos alienus bovem alterius vulneraverit, et ille mortuus fuerit : vendent bovem vivum, et divident pretium, cadaver autem mortui inter se dispertient.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Sin autem sciebat quod bos cornupeta esset ab heri et nudiustertius, et non custodivit eum dominus suus : reddet bovem pro bove, et cadaver integrum accipiet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/22/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 22</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->21<!-- --> of <!-- -->40<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Exodus 20" cla ype\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"EXO.21\",{\"bookId\":2,\"usfm\":\"EXO\",\"bookName\":\"Exodus\",\"drName\":\"Exodus\",\"chapter\":21,\"totalChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"These are the judgments which thou shalt set before them.\"},{\"verse\":2,\"text\":\"If thou buy a Hebrew servant, six years shall he serve thee; in the seventh he shall go out free for nothing.\"},{\"verse\":3,\"text\":\"With what raiment he came in, with the like let him go out: if having a wife, his wife also shall go out with him.\"},{\"verse\":4,\"text\":\"But if his master gave him a wife, and she hath borne sons and daughters; the woman and her children shall be her master’s: but he himself shall go out with his raiment.\"},{\"verse\":5,\"text\":\"And if the servant shall say: I love my master and my wife and children, I will not go out free:\"},{\"verse\":6,\"text\":\"His master shall bring him to the gods, and he shall be set to the door and the posts, and he shall bore his ear through with an awl: and he shall be his servant for ever.\"},{\"verse\":7,\"text\":\"If any man sell his daughter to be a servant, she shall not go out as bondwomen are wont to go out.\"},{\"verse\":8,\"text\":\"If she displease the eyes of her master to whom she was delivered, he shall let her go: but he shall have no power to sell her to a foreign nation, if he despise her.\"},{\"verse\":9,\"text\":\"But if he have betrothed her to his son, he shall deal with her after the manner of daughters.\"},{\"verse\":10,\"text\":\"And if he take another wife for him, he shall provide her a marriage, and raiment, neither shall he refuse the price of her chastity.\"},{\"verse\":11,\"text\":\"If he do not these three things, she shall go out free without money.\"},{\"verse\":12,\"text\":\"He that striketh a man with a will to kill him, shall be put to death.\"},{\"verse\":13,\"text\":\"But he that did not lie in wait for him, but God delivered him into his hands: I will appoint thee a place to which he must flee.\"},{\"verse\":14,\"text\":\"If a man kill his neighbour on set purpose, and by lying in wait for him: thou shalt take him away from my altar that he may die.\"},{\"verse\":15,\"text\":\"He that striketh his father or mother, shall be put to death.\"},{\"verse\":16,\"text\":\"He that shall steal a man, and sell him, being convicted of the guilt, shall be put to death.\"},{\"verse\":17,\"text\":\"He that curseth his father or mother, shall die the death.\"},{\"verse\":18,\"text\":\"If men quarrel, and the one strike his neighbour with a stone, or with his fist, and he die not, but keepeth his bed:\"},{\"verse\":19,\"text\":\"If he rise again and walk abroad upon his staff, he that struck him shall be quit, yet so that he make restitution for his work, and for his expenses upon the physicians.\"},{\"verse\":20,\"text\":\"He that striketh his bondman, or bondwoman, with a rod, and they die under his hands, shall be guilty of the crime.\"},{\"verse\":21,\"text\":\"But if the party remain alive a day or two, he shall not be subject to the punishment, because it is his money.\"},{\"verse\":22,\"text\":\"If men quarrel, and one strike a woman with child and she miscarry indeed, but live herself: he shall be answerable for so much damage as the woman’s husband shall require, and as arbiters shall award.\"},{\"verse\":23,\"text\":\"But if her death ensue thereupon, he shall render life for life,\"},{\"verse\":24,\"text\":\"Eye for eye, tooth for tooth, hand for hand, foot for foot,\"},{\"verse\":25,\"text\":\"Burning for burning, wound for wound, stripe for stripe.\"},{\"verse\":26,\"text\":\"If any man strike the eye of his manservant or maidservant, and leave them but one eye, he shall let them go free for the eye which he put out.\"},{\"verse\":27,\"text\":\"Also if he strike out a tooth of his manservant or maidservant, he shall in like manner make them free.\"},{\"verse\":28,\"text\":\"If an ox gore a man or a woman, and they die, he shall be stoned: and his flesh shall not be eaten, but the owner of the ox shall be quit.\"},{\"verse\":29,\"text\":\"But if the ox was wont to push with his horn yesterday, and the day before, and they warned his master, and he did not shut him up, and he shall kill a man or a woman: then the ox shall be stoned, and his owner also shall be put to death.\"},{\"verse\":30,\"text\":\"And if they set a price upon him, he shall give for his life whatsoever is laid upon him.\"},{\"verse\":31,\"text\":\"If he have gored a son, or a daughter, he shall fall under the like sentence.\"},{\"verse\":32,\"text\":\"If he assault a bondman or bondwoman, he shall give thirty sicles of silver to their master, and the ox shall be stoned.\"},{\"verse\":33,\"text\":\"If a man open a pit, and dig one, and cover it not, and an ox or an ass fall into it,\"},{\"verse\":34,\"text\":\"The owner of the pit shall pay the price of the beasts: and that which is dead shall be his own.\"},{\"verse\":35,\"text\":\"If one man’s ox gore another man’s ox, and he die: they shall sell the live ox, and shall divide the price, and the carcass of that which died they shall part between them:\"},{\"verse\":36,\"text\":\"But if he knew that his ox was wont to push yesterday, and the day before, and his master did not keep him in; he shall pay ox for ox, and shall take the whole carcass.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc sunt judicia quæ propones eis.\"},{\"verse\":2,\"text\":\"Si emeris servum hebræum, sex annis serviet tibi : in septimo egredietur liber gratis.\"},{\"verse\":3,\"text\":\"Cum quali veste intraverit, cum tali exeat : si habens uxorem, et uxor egredietur simul.\"},{\"verse\":4,\"text\":\"Sin autem dominus dederit illi uxorem, et pepererit filios et filias : mulier et liberi ejus erunt domini sui, ipse vero exibit cum vestitu suo.\"},{\"verse\":5,\"text\":\"Quod si dixerit servus : Diligo dominum meum et uxorem ac liberos ; non egrediar liber :\"},{\"verse\":6,\"text\":\"offeret eum dominus diis, et applicabitur ad ostium et postes, perforabitque aurem ejus subula : et erit ei servus in sæculum.\"},{\"verse\":7,\"text\":\"Si quis vendiderit filiam suam in famulam, non egredietur sicut ancillæ exire consueverunt.\"},{\"verse\":8,\"text\":\"Si displicuerit oculis domini sui cui tradita fuerat, dimittet eam : populo autem alieno vendendi non habebit potestatem, si spreverit eam.\"},{\"verse\":9,\"text\":\"Sin autem filio suo desponderit eam, juxta morem filiarum faciet illi.\"},{\"verse\":10,\"text\":\"Quod si alteram ei acceperit, providebit puellæ nuptias, et vestimenta, et pretium pudicitiæ non negabit.\"},{\"verse\":11,\"text\":\"Si tria ista non fecerit, egredietur gratis absque pecunia.\"},{\"verse\":12,\"text\":\"Qui percusserit hominem volens occidere, morte moriatur.\"},{\"verse\":13,\"text\":\"Qui autem non est insidiatus, sed Deus illum tradidit in manus ejus, constituam tibi locum in quem fugere debeat.\"},{\"verse\":14,\"text\":\"Si quis per industriam occiderit proximum suum, et per insidias : ab altari meo evelles eum, ut moriatur.\"},{\"verse\":15,\"text\":\"Qui percusserit patrem suum aut matrem, morte moriatur.\"},{\"verse\":16,\"text\":\"Qui furatus fuerit hominem, et vendiderit eum, convictus noxæ, morte moriatur.\"},{\"verse\":17,\"text\":\"Qui maledixerit patri suo, vel matri, morte moriatur.\"},{\"verse\":18,\"text\":\"Si rixati fuerint viri, et percusserit alter proximum suum lapide vel pugno, et ille mortuus non fuerit, sed jacuerit in lectulo :\"},{\"verse\":19,\"text\":\"si surrexerit, et ambulaverit foris super baculum suum, innocens erit qui percusserit, ita tamen ut operas ejus et impensas in medicos restituat.\"},{\"verse\":20,\"text\":\"Qui percusserit servum suum, vel ancillam virga, et mortui fuerint in manibus ejus, criminis reus erit.\"},{\"verse\":21,\"text\":\"Sin autem uno die vel duobus supervixerit, non subjacebit pœnæ, quia pecunia illius est.\"},{\"verse\":22,\"text\":\"Si rixati fuerint viri, et percusserit quis mulierem prægnantem, et abortivum quidem fecerit, sed ipsa vixerit : subjacebit damno quantum maritus mulieris expetierit, et arbitri judicaverint.\"},{\"verse\":23,\"text\":\"Sin autem mors ejus fuerit subsecuta, reddet animam pro anima,\"},{\"verse\":24,\"text\":\"oculum pro oculo, dentem pro dente, manum pro manu, pedem pro pede,\"},{\"verse\":25,\"text\":\"adustionem pro adustione, vulnus pro vulnere, livorem pro livore.\"},{\"verse\":26,\"text\":\"Si percusserit quispiam oculum servi sui aut ancillæ, et luscos eos fecerit, dimittet eos liberos pro oculo quem eruit.\"},{\"verse\":27,\"text\":\"Dentem quoque si excusserit servo vel ancillæ suæ, similiter dimittet eos liberos.\"},{\"verse\":28,\"text\":\"Si bos cornu percusserit virum aut mulierem, et mortui fuerint, lapidibus obruetur : et non comedentur carnes ejus, dominus quoque bovis innocens erit.\"},{\"verse\":29,\"text\":\"Quod si bos cornupeta fuerit ab heri et nudiustertius, et contestati sunt dominum ejus, nec recluserit eum, occideritque virum aut mulierem : et bos lapidibus obruetur, et dominum ejus occident.\"},{\"verse\":30,\"text\":\"Quod si pretium fuerit ei impositum, dabit pro anima sua quidquid fuerit postulatus.\"},{\"verse\":31,\"text\":\"Filium quoque et filiam si cornu percusserit, simili sententiæ subjacebit.\"},{\"verse\":32,\"text\":\"Si servum ancillamque invaserit, triginta siclos argenti domino dabit, bos vero lapidibus opprimetur.\"},{\"verse\":33,\"text\":\"Si quis aperuerit cisternam, et foderit, et non operuerit eam, cecideritque bos aut asinus in eam,\"},{\"verse\":34,\"text\":\"reddet dominus cisternæ pretium jumentorum : quod autem mortuum est, ipsius erit.\"},{\"verse\":35,\"text\":\"Si bos alienus bovem alterius vulneraverit, et ille mortuus fuerit : vendent bovem vivum, et divident pretium, cadaver autem mortui inter se dispertient.\"},{\"verse\":36,\"text\":\"Sin autem sciebat quod bos cornupeta esset ab heri et nudiustertius, et non custodivit eum dominus suus : reddet bovem pro bove, et cadaver integrum accipiet.\"}],\"summary\":\"Laws relating to Justice.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":20,\"label\":\"Exodus 20\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":22,\"label\":\"Exodus 22\"}}]]\n"])</script></body></html>
