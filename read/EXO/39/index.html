><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">39</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">All the ornaments of Aaron and his sons are made. And the whole work of the tabernacle is finished.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And he made, of violet and purple, scarlet and fine linen, the vestments for Aaron to wear when he ministered in the holy places, as the Lord commanded Moses.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>So he made an ephod of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>With embroidered work, and he cut thin plates of gold, and drew them small into threads, that they might be twisted with the woof of the foresaid colours,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And two borders coupled one to the other in the top on either side,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And a girdle of the same colours, as the Lord had commanded Moses.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He prepared also two onyx stones, fast set and closed in gold, and graven, by the art of a lapidary, with the names of the children of Israel:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he set them in the sides of the ephod, for a memorial of the children of Israel, as the Lord had commanded Moses.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He made also a rational with embroidered work, according to the work of the ephod, of gold, violet, purple, and scarlet twice dyed, and fine twisted linen:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Foursquare, double, of the measure of a span.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he set four rows of precious stones in it. In the first row was a sardius, a topaz, an emerald.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In the second, a carbuncle, a sapphire, and a jasper.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In the third, a ligurius, an agate, and an amethyst.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In the fourth, a chrysolite, an onyx, and a beryl, set and enclosed in gold by their rows.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the twelve stones, were engraved with the names of the twelve tribes of Israel, each one with its several name.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>They made also in the rational little chains, linked one to another, of the purest gold,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And two hooks, and as many rings of gold. And they set the rings on either side of the rational,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>On which rings the two golden chains should hang, which they put into the hooks that stood out in the corners of the ephod.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>These both before and behind so answered one another, that the ephod and the rational were bound together,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Being fastened to the girdle, and strongly coupled with rings, which a violet fillet joined, lest they should flag loose, and be moved one from the other, as the Lord commanded Moses.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>They made also the tunic of the ephod all of violet,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And a hole for the head in the upper part at the middle, and a woven border round about the hole:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And beneath at the feet pomegranates of violet, purple, scarlet, and fine twisted linen:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And little bells of the purest gold, which they put between the pomegranates at the bottom of the tunic round about:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>To wit, a bell of gold, and a pomegranate, wherewith the high priest went adorned, when he discharged his ministry, as the Lord had commanded Moses.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>They made also fine linen tunics with woven work for Aaron and his sons:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And mitres with their little crowns of fine linen:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And linen breeches of fine linen:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And a girdle of fine twisted linen, violet, purple, and scarlet twice dyed, of embroidery work, as the Lord had commanded Moses.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>They made also the plate of sacred veneration of the purest gold, and they wrote on it with the engraving of a lapidary: The Holy of the Lord:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And they fastened it to the mitre with a violet fillet, as the Lord had commanded Moses.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>So all the work of the tabernacle and of the roof of the testimony was finished: and the children of Israel did all things which the Lord had commanded Moses.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they offered the tabernacle, and the roof, and the whole furniture, the rings, the boards, the bars, the pillars and their sockets,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The cover of rams’ skins dyed red, and the other cover of violet skins,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The veil, the ark, the bars, the propitiatory,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The table, with the vessels thereof, and the loaves of proposition:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The candlestick, the lamps, and the furniture of them, with the oil:</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>The altar of gold, and the ointment, and the incense of spices:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And the hanging in the entry of the tabernacle:</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>The altar of brass, the grate, the bars, and all the vessels thereof: the laver, with the foot thereof: the hangings of the court, and the pillars, with their sockets:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The hanging in the entry of the court, and the little cords, and the pins thereof. Nothing was wanting of the vessels, that were commanded to be made for the ministry of the tabernacle, and for the roof of the covenant.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The vestments also, which the priests, to wit, Aaron and his sons, use in the sanctuary,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The children of Israel offered, as the Lord had commanded.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And when Moses saw all things finished, he blessed them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>De hyacintho vero et purpura, vermiculo ac bysso, fecit vestes, quibus indueretur Aaron quando ministrabat in sanctis, sicut præcepit Dominus Moysi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fecit igitur superhumerale de auro, hyacintho, et purpura, coccoque bis tincto, et bysso retorta,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>opere polymitario : inciditque bracteas aureas, et extenuavit in fila, ut possent torqueri cum priorum colorum subtegmine,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>duasque oras sibi invicem copulatas in utroque latere summitatum,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et balteum ex eisdem coloribus, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Paravit et duos lapides onychinos, astrictos et inclusos auro, et sculptos arte gemmaria nominibus filiorum Israël :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>posuitque eos in lateribus superhumeralis in monimentum filiorum Israël, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Fecit et rationale opere polymito juxta opus superhumeralis, ex auro, hyacintho, purpura, coccoque bis tincto, et bysso retorta :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>quadrangulum, duplex, mensuræ palmi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et posuit in eo gemmarum ordines quatuor. In primo versu erat sardius, topazius, smaragdus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In secundo, carbunculus, sapphirus, et jaspis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In tertio, ligurius, achates, et amethystus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In quarto, chrysolithus, onychinus, et beryllus, circumdati et inclusi auro per ordines suos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ipsique lapides duodecim sculpti erant nominibus duodecim tribuum Israël, singuli per nomina singulorum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fecerunt in rationali et catenulas sibi invicem cohærentes, de auro purissimo :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et duos uncinos, totidemque annulos aureos. Porro annulos posuerunt in utroque latere rationalis,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>e quibus penderent duæ catenæ aureæ, quas inseruerunt uncinis, qui in superhumeralis angulis eminebant.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hæc et ante et retro ita conveniebant sibi, ut superhumerale et rationale mutuo necterentur,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>stricta ad balteum et annulis fortius copulata, quos jungebat vitta hyacinthina, ne laxa fluerent, et a se invicem moverentur, sicut præcepit Dominus Moysi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Feceruntque quoque tunicam superhumeralis totam hyacinthinam,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>et capitium in superiori parte contra medium, oramque per gyrum capitii textilem :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>deorsum autem ad pedes mala punica ex hyacintho, purpura, vermiculo, ac bysso retorta :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et tintinnabula de auro purissimo, quæ posuerunt inter malogranata, in extrema parte tunicæ per gyrum :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>tintinnabulum autem aureum, et malum punicum, quibus ornatus incedebat pontifex quando ministerio fungebatur, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Fecerunt et tunicas byssinas opere textili Aaron et filiis ejus :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et mitras cum coronulis suis ex bysso :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>feminalia quoque linea, byssina :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>cingulum vero de bysso retorta, hyacintho, purpura, ac vermiculo bis tincto, arte plumaria, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Fecerunt et laminam sacræ venerationis de auro purissimo, scripseruntque in ea opere gemmario, Sanctum Domini :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et strinxerunt eam cum mitra vitta hyacinthina, sicut præceperat Dominus Moysi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Perfectum est igitur omne opus tabernaculi et tecti testimonii : feceruntque filii Israël cuncta quæ præceperat Dominus Moysi.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et obtulerunt tabernaculum et tectum et universam supellectilem, annulos, tabulas, vectes, columnas ac bases,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>opertorium de pellibus arietum rubricatis, et aliud operimentum de janthinis pellibus,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>velum ; arcam, vectes, propitiatorium,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>mensam cum vasis suis et propositionis panibus ;</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>candelabrum, lucernas, et utensilia earum cum oleo ;</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>altare aureum, et unguentum, et thymiama ex aromatibus,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et tentorium in introitu tabernaculi ;</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>altare æneum, retiaculum, vectes, et vasa ejus omnia ; labrum cum basi sua ; tentoria atrii, et columnas cum basibus suis ;</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>tentorium in introitu atrii, funiculosque illius et paxillos. Nihil ex vasis defuit, quæ in ministerium tabernaculi, et in tectum fœderis jussa sunt fieri.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Vestes quoque, quibus sacerdotes utuntur in sanctuario, Aaron scilicet et filii ejus,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>obtulerunt filii Israël, sicut præceperat Dominus.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Quæ postquam Moyses cuncta vidit completa, benedixit eis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/38/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 38</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/40/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 40</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->39<!-- --> of <!-- -->40<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Exodus 38" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/38/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m otalChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"And he made, of violet and purple, scarlet and fine linen, the vestments for Aaron to wear when he ministered in the holy places, as the Lord commanded Moses.\"},{\"verse\":2,\"text\":\"So he made an ephod of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen,\"},{\"verse\":3,\"text\":\"With embroidered work, and he cut thin plates of gold, and drew them small into threads, that they might be twisted with the woof of the foresaid colours,\"},{\"verse\":4,\"text\":\"And two borders coupled one to the other in the top on either side,\"},{\"verse\":5,\"text\":\"And a girdle of the same colours, as the Lord had commanded Moses.\"},{\"verse\":6,\"text\":\"He prepared also two onyx stones, fast set and closed in gold, and graven, by the art of a lapidary, with the names of the children of Israel:\"},{\"verse\":7,\"text\":\"And he set them in the sides of the ephod, for a memorial of the children of Israel, as the Lord had commanded Moses.\"},{\"verse\":8,\"text\":\"He made also a rational with embroidered work, according to the work of the ephod, of gold, violet, purple, and scarlet twice dyed, and fine twisted linen:\"},{\"verse\":9,\"text\":\"Foursquare, double, of the measure of a span.\"},{\"verse\":10,\"text\":\"And he set four rows of precious stones in it. In the first row was a sardius, a topaz, an emerald.\"},{\"verse\":11,\"text\":\"In the second, a carbuncle, a sapphire, and a jasper.\"},{\"verse\":12,\"text\":\"In the third, a ligurius, an agate, and an amethyst.\"},{\"verse\":13,\"text\":\"In the fourth, a chrysolite, an onyx, and a beryl, set and enclosed in gold by their rows.\"},{\"verse\":14,\"text\":\"And the twelve stones, were engraved with the names of the twelve tribes of Israel, each one with its several name.\"},{\"verse\":15,\"text\":\"They made also in the rational little chains, linked one to another, of the purest gold,\"},{\"verse\":16,\"text\":\"And two hooks, and as many rings of gold. And they set the rings on either side of the rational,\"},{\"verse\":17,\"text\":\"On which rings the two golden chains should hang, which they put into the hooks that stood out in the corners of the ephod.\"},{\"verse\":18,\"text\":\"These both before and behind so answered one another, that the ephod and the rational were bound together,\"},{\"verse\":19,\"text\":\"Being fastened to the girdle, and strongly coupled with rings, which a violet fillet joined, lest they should flag loose, and be moved one from the other, as the Lord commanded Moses.\"},{\"verse\":20,\"text\":\"They made also the tunic of the ephod all of violet,\"},{\"verse\":21,\"text\":\"And a hole for the head in the upper part at the middle, and a woven border round about the hole:\"},{\"verse\":22,\"text\":\"And beneath at the feet pomegranates of violet, purple, scarlet, and fine twisted linen:\"},{\"verse\":23,\"text\":\"And little bells of the purest gold, which they put between the pomegranates at the bottom of the tunic round about:\"},{\"verse\":24,\"text\":\"To wit, a bell of gold, and a pomegranate, wherewith the high priest went adorned, when he discharged his ministry, as the Lord had commanded Moses.\"},{\"verse\":25,\"text\":\"They made also fine linen tunics with woven work for Aaron and his sons:\"},{\"verse\":26,\"text\":\"And mitres with their little crowns of fine linen:\"},{\"verse\":27,\"text\":\"And linen breeches of fine linen:\"},{\"verse\":28,\"text\":\"And a girdle of fine twisted linen, violet, purple, and scarlet twice dyed, of embroidery work, as the Lord had commanded Moses.\"},{\"verse\":29,\"text\":\"They made also the plate of sacred veneration of the purest gold, and they wrote on it with the engraving of a lapidary: The Holy of the Lord:\"},{\"verse\":30,\"text\":\"And they fastened it to the mitre with a violet fillet, as the Lord had commanded Moses.\"},{\"verse\":31,\"text\":\"So all the work of the tabernacle and of the roof of the testimony was finished: and the children of Israel did all things which the Lord had commanded Moses.\"},{\"verse\":32,\"text\":\"And they offered the tabernacle, and the roof, and the whole furniture, the rings, the boards, the bars, the pillars and their sockets,\"},{\"verse\":33,\"text\":\"The cover of rams’ skins dyed red, and the other cover of violet skins,\"},{\"verse\":34,\"text\":\"The veil, the ark, the bars, the propitiatory,\"},{\"verse\":35,\"text\":\"The table, with the vessels thereof, and the loaves of proposition:\"},{\"verse\":36,\"text\":\"The candlestick, the lamps, and the furniture of them, with the oil:\"},{\"verse\":37,\"text\":\"The altar of gold, and the ointment, and the incense of spices:\"},{\"verse\":38,\"text\":\"And the hanging in the entry of the tabernacle:\"},{\"verse\":39,\"text\":\"The altar of brass, the grate, the bars, and all the vessels thereof: the laver, with the foot thereof: the hangings of the court, and the pillars, with their sockets:\"},{\"verse\":40,\"text\":\"The hanging in the entry of the court, and the little cords, and the pins thereof. Nothing was wanting of the vessels, that were commanded to be made for the ministry of the tabernacle, and for the roof of the covenant.\"},{\"verse\":41,\"text\":\"The vestments also, which the priests, to wit, Aaron and his sons, use in the sanctuary,\"},{\"verse\":42,\"text\":\"The children of Israel offered, as the Lord had commanded.\"},{\"verse\":43,\"text\":\"And when Moses saw all things finished, he blessed them.\"}],\"vul\":[{\"verse\":1,\"text\":\"De hyacintho vero et purpura, vermiculo ac bysso, fecit vestes, quibus indueretur Aaron quando ministrabat in sanctis, sicut præcepit Dominus Moysi.\"},{\"verse\":2,\"text\":\"Fecit igitur superhumerale de auro, hyacintho, et purpura, coccoque bis tincto, et bysso retorta,\"},{\"verse\":3,\"text\":\"opere polymitario : inciditque bracteas aureas, et extenuavit in fila, ut possent torqueri cum priorum colorum subtegmine,\"},{\"verse\":4,\"text\":\"duasque oras sibi invicem copulatas in utroque latere summitatum,\"},{\"verse\":5,\"text\":\"et balteum ex eisdem coloribus, sicut præceperat Dominus Moysi.\"},{\"verse\":6,\"text\":\"Paravit et duos lapides onychinos, astrictos et inclusos auro, et sculptos arte gemmaria nominibus filiorum Israël :\"},{\"verse\":7,\"text\":\"posuitque eos in lateribus superhumeralis in monimentum filiorum Israël, sicut præceperat Dominus Moysi.\"},{\"verse\":8,\"text\":\"Fecit et rationale opere polymito juxta opus superhumeralis, ex auro, hyacintho, purpura, coccoque bis tincto, et bysso retorta :\"},{\"verse\":9,\"text\":\"quadrangulum, duplex, mensuræ palmi.\"},{\"verse\":10,\"text\":\"Et posuit in eo gemmarum ordines quatuor. In primo versu erat sardius, topazius, smaragdus.\"},{\"verse\":11,\"text\":\"In secundo, carbunculus, sapphirus, et jaspis.\"},{\"verse\":12,\"text\":\"In tertio, ligurius, achates, et amethystus.\"},{\"verse\":13,\"text\":\"In quarto, chrysolithus, onychinus, et beryllus, circumdati et inclusi auro per ordines suos.\"},{\"verse\":14,\"text\":\"Ipsique lapides duodecim sculpti erant nominibus duodecim tribuum Israël, singuli per nomina singulorum.\"},{\"verse\":15,\"text\":\"Fecerunt in rationali et catenulas sibi invicem cohærentes, de auro purissimo :\"},{\"verse\":16,\"text\":\"et duos uncinos, totidemque annulos aureos. Porro annulos posuerunt in utroque latere rationalis,\"},{\"verse\":17,\"text\":\"e quibus penderent duæ catenæ aureæ, quas inseruerunt uncinis, qui in superhumeralis angulis eminebant.\"},{\"verse\":18,\"text\":\"Hæc et ante et retro ita conveniebant sibi, ut superhumerale et rationale mutuo necterentur,\"},{\"verse\":19,\"text\":\"stricta ad balteum et annulis fortius copulata, quos jungebat vitta hyacinthina, ne laxa fluerent, et a se invicem moverentur, sicut præcepit Dominus Moysi.\"},{\"verse\":20,\"text\":\"Feceruntque quoque tunicam superhumeralis totam hyacinthinam,\"},{\"verse\":21,\"text\":\"et capitium in superiori parte contra medium, oramque per gyrum capitii textilem :\"},{\"verse\":22,\"text\":\"deorsum autem ad pedes mala punica ex hyacintho, purpura, vermiculo, ac bysso retorta :\"},{\"verse\":23,\"text\":\"et tintinnabula de auro purissimo, quæ posuerunt inter malogranata, in extrema parte tunicæ per gyrum :\"},{\"verse\":24,\"text\":\"tintinnabulum autem aureum, et malum punicum, quibus ornatus incedebat pontifex quando ministerio fungebatur, sicut præceperat Dominus Moysi.\"},{\"verse\":25,\"text\":\"Fecerunt et tunicas byssinas opere textili Aaron et filiis ejus :\"},{\"verse\":26,\"text\":\"et mitras cum coronulis suis ex bysso :\"},{\"verse\":27,\"text\":\"feminalia quoque linea, byssina :\"},{\"verse\":28,\"text\":\"cingulum vero de bysso retorta, hyacintho, purpura, ac vermiculo bis tincto, arte plumaria, sicut præceperat Dominus Moysi.\"},{\"verse\":29,\"text\":\"Fecerunt et laminam sacræ venerationis de auro purissimo, scripseruntque in ea opere gemmario, Sanctum Domini :\"},{\"verse\":30,\"text\":\"et strinxerunt eam cum mitra vitta hyacinthina, sicut præceperat Dominus Moysi.\"},{\"verse\":31,\"text\":\"Perfectum est igitur omne opus tabernaculi et tecti testimonii : feceruntque filii Israël cuncta quæ præceperat Dominus Moysi.\"},{\"verse\":32,\"text\":\"Et obtulerunt tabernaculum et tectum et universam supellectilem, annulos, tabulas, vectes, columnas ac bases,\"},{\"verse\":33,\"text\":\"opertorium de pellibus arietum rubricatis, et aliud operimentum de janthinis pellibus,\"},{\"verse\":34,\"text\":\"velum ; arcam, vectes, propitiatorium,\"},{\"verse\":35,\"text\":\"mensam cum vasis suis et propositionis panibus ;\"},{\"verse\":36,\"text\":\"candelabrum, lucernas, et utensilia earum cum oleo ;\"},{\"verse\":37,\"text\":\"altare aureum, et unguentum, et thymiama ex aromatibus,\"},{\"verse\":38,\"text\":\"et tentorium in introitu tabernaculi ;\"},{\"verse\":39,\"text\":\"altare æneum, retiaculum, vectes, et vasa ejus omnia ; labrum cum basi sua ; tentoria atrii, et columnas cum basibus suis ;\"},{\"verse\":40,\"text\":\"tentorium in introitu atrii, funiculosque illius et paxillos. Nihil ex vasis defuit, quæ in ministerium tabernaculi, et in tectum fœderis jussa sunt fieri.\"},{\"verse\":41,\"text\":\"Vestes quoque, quibus sacerdotes utuntur in sanctuario, Aaron scilicet et filii ejus,\"},{\"verse\":42,\"text\":\"obtulerunt filii Israël, sicut præceperat Dominus.\"},{\"verse\":43,\"text\":\"Quæ postquam Moyses cuncta vidit completa, benedixit eis.\"}],\"summary\":\"All the ornaments of Aaron and his sons are made. And the whole work of the tabernacle is finished.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":38,\"label\":\"Exodus 38\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":40,\"label\":\"Exodus 40\"}}]]\n"])</script></body></html>
