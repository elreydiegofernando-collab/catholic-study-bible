holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">26</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EXO/">About <!-- -->Exodus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The form of the tabernacle with its appurtenances.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And thou shalt make the tabernacle in this manner: Thou shalt make ten curtains of fine twisted linen, and violet and purple, and scarlet twice dyed, diversified with embroidery.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The length of one curtain shall be twenty-eight cubits; the breadth shall be four cubits. All the curtains shall be of one measure.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Five curtains shall be joined one to another, and the other five shall be coupled together in like manner.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Thou shalt make loops of violet in the sides and tops of the curtains, that they may be joined one to another.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Every curtain shall have fifty loops on both sides, so set on, that one loop may be against another loop, and one may be fitted to the other.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Thou shalt make also fifty rings of gold, wherewith the veils of the curtains are to be joined, that it may be made one tabernacle.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Thou shalt make also eleven curtains of goats’ hair, to cover the top of the tabernacle.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The length of one hair-curtain shall be thirty cubits; and the breadth, four: the measure of all the curtains shall be equal.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Five of which thou shalt couple by themselves, and the six others thou shalt couple one to another, so as to double the sixth curtain in the front of the roof.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou shalt make also fifty loops in the edge of one curtain, that it may be joined with the other: and fifty loops in the edge of the other curtain, that it may be coupled with its fellow.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Thou shalt make also fifty buckles of brass, wherewith the loops may be joined, that of all there may be made one covering.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And that which shall remain of the curtains, that are prepared for the roof, to wit, one curtain that is over and above, with the half thereof thou shalt cover the back parts of the tabernacle.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And there shall hang down a cubit on the one side, and another on the other side, which is over and above in the length of the curtains, fencing both sides of the tabernacle.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt make also another cover to the roof of rams’ skins dyed red: and over that again another cover of violet coloured skins.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou shalt make also the boards of the tabernacle standing upright of setim wood.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let every one of them be ten cubits in length, and in breadth one cubit and a half.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In the sides of the boards shall be made two mortises, whereby one board may be joined to another board: and after this manner shall all the boards be prepared.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Of which twenty shall be in the south side southward.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For which thou shalt cast forty sockets of silver, that under every board may be put two sockets at the two corners.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In the second side also of the tabernacle that looketh to the north, there shall be twenty boards,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Having forty sockets of silver, two sockets shall be put under each board.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But on the west side of the tabernacle thou shalt make six boards.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And again other two which shall be erected in the corners at the back of the tabernacle.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they shall be joined together from beneath unto the top, and one joint shall hold them all. The like joining shall be observed for the two boards also that are to be put in the corners.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they shall be in all eight boards, and their silver sockets sixteen, reckoning two sockets for each board.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt make also five bars of setim wood, to hold together the boards on one side of the tabernacle.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And five others on the other side, and as many at the west side:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they shall be put along by the midst of the boards, from one end to the other.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The boards also themselves thou shalt overlay with gold, and shalt cast rings of gold to be set upon them, for places for the bars to hold together the boardwork: which bars thou shalt cover with plates of gold.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And thou shalt rear up the tabernacle according to the pattern that was shewn thee in the mount.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Thou shalt make also a veil of violet, and purple, and scarlet twice dyed, and fine twisted linen, wrought with embroidered work and goodly variety:</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And thou shalt hang it up before four pillars of setim wood, which themselves also shall be overlaid with gold, and shall have heads of gold, but sockets of silver.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And the veil shall be hanged on with rings, and within it thou shalt put the ark of the testimony, and the sanctuary and the holy of the holies shall be divided with it.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And thou shalt set the propitiatory upon the ark of the testimony, in the holy of holies.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the table without the veil, and over against the table the candlestick in the south side of the tabernacle: for the table shall stand in the north side.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Thou shalt make also a hanging in the entrance of the tabernacle of violet, and purple, and scarlet twice dyed, and fine twisted linen with embroidered work.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And thou shalt overlay with gold five pillars of setim wood, before which the hanging shall be drawn: their heads shall be of gold, and the sockets of brass.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tabernaculum vero ita facies : decem cortinas de bysso retorta, et hyacintho, ac purpura, coccoque bis tincto, variatas opere plumario facies.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Longitudo cortinæ unius habebit viginti octo cubitos : latitudo, quatuor cubitorum erit. Unius mensuræ fient universa tentoria.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quinque cortinæ sibi jungentur mutuo, et aliæ quinque nexu simili cohærebunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ansulas hyacinthinas in lateribus ac summitatibus facies cortinarum, ut possint invicem copulari.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quinquagenas ansulas cortina habebit in utraque parte, ita insertas ut ansa contra ansam veniat, et altera alteri possit aptari.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Facies et quinquaginta circulos aureos quibus cortinarum vela jungenda sunt, ut unum tabernaculum fiat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Facies et saga cilicina undecim, ad operiendum tectum tabernaculi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Longitudo sagi unius habebit triginta cubitos, et latitudo, quatuor : æqua erit mensura sagorum omnium.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>E quibus quinque junges seorsum, et sex sibi mutuo copulabis, ita ut sextum sagum in fronte tecti duplices.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Facies et quinquaginta ansas in ora sagi unius, ut conjungi cum altero queat, et quinquaginta ansas in ora sagi alterius, ut cum altero copuletur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Facies et quinquaginta fibulas æneas quibus jungantur ansæ, ut unum ex omnibus operimentum fiat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quod autem superfuerit in sagis quæ parantur tecto, id est unum sagum quod amplius est, ex medietate ejus operies posteriora tabernaculi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et cubitus ex una parte pendebit, et alter ex altera qui plus est in sagorum longitudine, utrumque latus tabernaculi protegens.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Facies et operimentum aliud tecto de pellibus arietum rubricatis : et super hoc rursum aliud operimentum de janthinis pellibus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Facies et tabulas stantes tabernaculi de lignis setim,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>quæ singulæ denos cubitos in longitudine habeant, et in latitudine singulos ac semissem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In lateribus tabulæ, duæ incastraturæ fient, quibus tabula alteri tabulæ connectatur : atque in hunc modum cunctæ tabulæ parabuntur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quarum viginti erunt in latere meridiano quod vergit ad austrum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quibus quadraginta bases argenteas fundes, ut binæ bases singulis tabulis per duos angulos subjiciantur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In latere quoque secundo tabernaculi quod vergit ad aquilonem, viginti tabulæ erunt,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quadraginta habentes bases argenteas, binæ bases singulis tabulis supponentur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ad occidentalem vero plagam tabernaculi facies sex tabulas,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et rursum alias duas quæ in angulis erigantur post tergum tabernaculi.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Eruntque conjunctæ a deorsum usque sursum, et una omnes compago retinebit. Duabus quoque tabulis quæ in angulis ponendæ sunt, similis junctura servabitur.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et erunt simul tabulæ octo, bases earum argenteæ sedecim, duabus basibus per unam tabulam supputatis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Facies et vectes de lignis setim quinque ad continendas tabulas in uno latere tabernaculi,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et quinque alios in altero, et ejusdem numeri ad occidentalem plagam :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui mittentur per medias tabulas a summo usque ad summum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ipsas quoque tabulas deaurabis, et fundes in eis annulos aureos per quos vectes tabulata contineant : quos operies laminis aureis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et eriges tabernaculum juxta exemplar quod tibi in monte monstratum est.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Facies et velum de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumario et pulchra varietate contextum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>quod appendes ante quatuor columnas de lignis setim, quæ ipsæ quidem deauratæ erunt, et habebunt capita aurea, sed bases argenteas.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Inseretur autem velum per circulos, intra quod pones arcam testimonii, quo et sanctuarium, et sanctuarii sanctuaria dividentur.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Pones et propitiatorium super arcam testimonii in Sancto sanctorum,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>mensamque extra velum, et contra mensam candelabrum in latere tabernaculi meridiano : mensa enim stabit in parte aquilonis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Facies et tentorium in introitu tabernaculi de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumarii.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et quinque columnas deaurabis lignorum setim, ante quas ducetur tentorium : quarum erunt capita aurea, et bases æneæ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/25/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h- nen, and violet and purple, and scarlet twice dyed, diversified with embroidery.\"},{\"verse\":2,\"text\":\"The length of one curtain shall be twenty-eight cubits; the breadth shall be four cubits. All the curtains shall be of one measure.\"},{\"verse\":3,\"text\":\"Five curtains shall be joined one to another, and the other five shall be coupled together in like manner.\"},{\"verse\":4,\"text\":\"Thou shalt make loops of violet in the sides and tops of the curtains, that they may be joined one to another.\"},{\"verse\":5,\"text\":\"Every curtain shall have fifty loops on both sides, so set on, that one loop may be against another loop, and one may be fitted to the other.\"},{\"verse\":6,\"text\":\"Thou shalt make also fifty rings of gold, wherewith the veils of the curtains are to be joined, that it may be made one tabernacle.\"},{\"verse\":7,\"text\":\"Thou shalt make also eleven curtains of goats’ hair, to cover the top of the tabernacle.\"},{\"verse\":8,\"text\":\"The length of one hair-curtain shall be thirty cubits; and the breadth, four: the measure of all the curtains shall be equal.\"},{\"verse\":9,\"text\":\"Five of which thou shalt couple by themselves, and the six others thou shalt couple one to another, so as to double the sixth curtain in the front of the roof.\"},{\"verse\":10,\"text\":\"Thou shalt make also fifty loops in the edge of one curtain, that it may be joined with the other: and fifty loops in the edge of the other curtain, that it may be coupled with its fellow.\"},{\"verse\":11,\"text\":\"Thou shalt make also fifty buckles of brass, wherewith the loops may be joined, that of all there may be made one covering.\"},{\"verse\":12,\"text\":\"And that which shall remain of the curtains, that are prepared for the roof, to wit, one curtain that is over and above, with the half thereof thou shalt cover the back parts of the tabernacle.\"},{\"verse\":13,\"text\":\"And there shall hang down a cubit on the one side, and another on the other side, which is over and above in the length of the curtains, fencing both sides of the tabernacle.\"},{\"verse\":14,\"text\":\"Thou shalt make also another cover to the roof of rams’ skins dyed red: and over that again another cover of violet coloured skins.\"},{\"verse\":15,\"text\":\"Thou shalt make also the boards of the tabernacle standing upright of setim wood.\"},{\"verse\":16,\"text\":\"Let every one of them be ten cubits in length, and in breadth one cubit and a half.\"},{\"verse\":17,\"text\":\"In the sides of the boards shall be made two mortises, whereby one board may be joined to another board: and after this manner shall all the boards be prepared.\"},{\"verse\":18,\"text\":\"Of which twenty shall be in the south side southward.\"},{\"verse\":19,\"text\":\"For which thou shalt cast forty sockets of silver, that under every board may be put two sockets at the two corners.\"},{\"verse\":20,\"text\":\"In the second side also of the tabernacle that looketh to the north, there shall be twenty boards,\"},{\"verse\":21,\"text\":\"Having forty sockets of silver, two sockets shall be put under each board.\"},{\"verse\":22,\"text\":\"But on the west side of the tabernacle thou shalt make six boards.\"},{\"verse\":23,\"text\":\"And again other two which shall be erected in the corners at the back of the tabernacle.\"},{\"verse\":24,\"text\":\"And they shall be joined together from beneath unto the top, and one joint shall hold them all. The like joining shall be observed for the two boards also that are to be put in the corners.\"},{\"verse\":25,\"text\":\"And they shall be in all eight boards, and their silver sockets sixteen, reckoning two sockets for each board.\"},{\"verse\":26,\"text\":\"Thou shalt make also five bars of setim wood, to hold together the boards on one side of the tabernacle.\"},{\"verse\":27,\"text\":\"And five others on the other side, and as many at the west side:\"},{\"verse\":28,\"text\":\"And they shall be put along by the midst of the boards, from one end to the other.\"},{\"verse\":29,\"text\":\"The boards also themselves thou shalt overlay with gold, and shalt cast rings of gold to be set upon them, for places for the bars to hold together the boardwork: which bars thou shalt cover with plates of gold.\"},{\"verse\":30,\"text\":\"And thou shalt rear up the tabernacle according to the pattern that was shewn thee in the mount.\"},{\"verse\":31,\"text\":\"Thou shalt make also a veil of violet, and purple, and scarlet twice dyed, and fine twisted linen, wrought with embroidered work and goodly variety:\"},{\"verse\":32,\"text\":\"And thou shalt hang it up before four pillars of setim wood, which themselves also shall be overlaid with gold, and shall have heads of gold, but sockets of silver.\"},{\"verse\":33,\"text\":\"And the veil shall be hanged on with rings, and within it thou shalt put the ark of the testimony, and the sanctuary and the holy of the holies shall be divided with it.\"},{\"verse\":34,\"text\":\"And thou shalt set the propitiatory upon the ark of the testimony, in the holy of holies.\"},{\"verse\":35,\"text\":\"And the table without the veil, and over against the table the candlestick in the south side of the tabernacle: for the table shall stand in the north side.\"},{\"verse\":36,\"text\":\"Thou shalt make also a hanging in the entrance of the tabernacle of violet, and purple, and scarlet twice dyed, and fine twisted linen with embroidered work.\"},{\"verse\":37,\"text\":\"And thou shalt overlay with gold five pillars of setim wood, before which the hanging shall be drawn: their heads shall be of gold, and the sockets of brass.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tabernaculum vero ita facies : decem cortinas de bysso retorta, et hyacintho, ac purpura, coccoque bis tincto, variatas opere plumario facies.\"},{\"verse\":2,\"text\":\"Longitudo cortinæ unius habebit viginti octo cubitos : latitudo, quatuor cubitorum erit. Unius mensuræ fient universa tentoria.\"},{\"verse\":3,\"text\":\"Quinque cortinæ sibi jungentur mutuo, et aliæ quinque nexu simili cohærebunt.\"},{\"verse\":4,\"text\":\"Ansulas hyacinthinas in lateribus ac summitatibus facies cortinarum, ut possint invicem copulari.\"},{\"verse\":5,\"text\":\"Quinquagenas ansulas cortina habebit in utraque parte, ita insertas ut ansa contra ansam veniat, et altera alteri possit aptari.\"},{\"verse\":6,\"text\":\"Facies et quinquaginta circulos aureos quibus cortinarum vela jungenda sunt, ut unum tabernaculum fiat.\"},{\"verse\":7,\"text\":\"Facies et saga cilicina undecim, ad operiendum tectum tabernaculi.\"},{\"verse\":8,\"text\":\"Longitudo sagi unius habebit triginta cubitos, et latitudo, quatuor : æqua erit mensura sagorum omnium.\"},{\"verse\":9,\"text\":\"E quibus quinque junges seorsum, et sex sibi mutuo copulabis, ita ut sextum sagum in fronte tecti duplices.\"},{\"verse\":10,\"text\":\"Facies et quinquaginta ansas in ora sagi unius, ut conjungi cum altero queat, et quinquaginta ansas in ora sagi alterius, ut cum altero copuletur.\"},{\"verse\":11,\"text\":\"Facies et quinquaginta fibulas æneas quibus jungantur ansæ, ut unum ex omnibus operimentum fiat.\"},{\"verse\":12,\"text\":\"Quod autem superfuerit in sagis quæ parantur tecto, id est unum sagum quod amplius est, ex medietate ejus operies posteriora tabernaculi.\"},{\"verse\":13,\"text\":\"Et cubitus ex una parte pendebit, et alter ex altera qui plus est in sagorum longitudine, utrumque latus tabernaculi protegens.\"},{\"verse\":14,\"text\":\"Facies et operimentum aliud tecto de pellibus arietum rubricatis : et super hoc rursum aliud operimentum de janthinis pellibus.\"},{\"verse\":15,\"text\":\"Facies et tabulas stantes tabernaculi de lignis setim,\"},{\"verse\":16,\"text\":\"quæ singulæ denos cubitos in longitudine habeant, et in latitudine singulos ac semissem.\"},{\"verse\":17,\"text\":\"In lateribus tabulæ, duæ incastraturæ fient, quibus tabula alteri tabulæ connectatur : atque in hunc modum cunctæ tabulæ parabuntur.\"},{\"verse\":18,\"text\":\"Quarum viginti erunt in latere meridiano quod vergit ad austrum.\"},{\"verse\":19,\"text\":\"Quibus quadraginta bases argenteas fundes, ut binæ bases singulis tabulis per duos angulos subjiciantur.\"},{\"verse\":20,\"text\":\"In latere quoque secundo tabernaculi quod vergit ad aquilonem, viginti tabulæ erunt,\"},{\"verse\":21,\"text\":\"quadraginta habentes bases argenteas, binæ bases singulis tabulis supponentur.\"},{\"verse\":22,\"text\":\"Ad occidentalem vero plagam tabernaculi facies sex tabulas,\"},{\"verse\":23,\"text\":\"et rursum alias duas quæ in angulis erigantur post tergum tabernaculi.\"},{\"verse\":24,\"text\":\"Eruntque conjunctæ a deorsum usque sursum, et una omnes compago retinebit. Duabus quoque tabulis quæ in angulis ponendæ sunt, similis junctura servabitur.\"},{\"verse\":25,\"text\":\"Et erunt simul tabulæ octo, bases earum argenteæ sedecim, duabus basibus per unam tabulam supputatis.\"},{\"verse\":26,\"text\":\"Facies et vectes de lignis setim quinque ad continendas tabulas in uno latere tabernaculi,\"},{\"verse\":27,\"text\":\"et quinque alios in altero, et ejusdem numeri ad occidentalem plagam :\"},{\"verse\":28,\"text\":\"qui mittentur per medias tabulas a summo usque ad summum.\"},{\"verse\":29,\"text\":\"Ipsas quoque tabulas deaurabis, et fundes in eis annulos aureos per quos vectes tabulata contineant : quos operies laminis aureis.\"},{\"verse\":30,\"text\":\"Et eriges tabernaculum juxta exemplar quod tibi in monte monstratum est.\"},{\"verse\":31,\"text\":\"Facies et velum de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumario et pulchra varietate contextum :\"},{\"verse\":32,\"text\":\"quod appendes ante quatuor columnas de lignis setim, quæ ipsæ quidem deauratæ erunt, et habebunt capita aurea, sed bases argenteas.\"},{\"verse\":33,\"text\":\"Inseretur autem velum per circulos, intra quod pones arcam testimonii, quo et sanctuarium, et sanctuarii sanctuaria dividentur.\"},{\"verse\":34,\"text\":\"Pones et propitiatorium super arcam testimonii in Sancto sanctorum,\"},{\"verse\":35,\"text\":\"mensamque extra velum, et contra mensam candelabrum in latere tabernaculi meridiano : mensa enim stabit in parte aquilonis.\"},{\"verse\":36,\"text\":\"Facies et tentorium in introitu tabernaculi de hyacintho, et purpura, coccoque bis tincto, et bysso retorta, opere plumarii.\"},{\"verse\":37,\"text\":\"Et quinque columnas deaurabis lignorum setim, ante quas ducetur tentorium : quarum erunt capita aurea, et bases æneæ.\"}],\"summary\":\"The form of the tabernacle with its appurtenances.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":25,\"label\":\"Exodus 25\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":27,\"label\":\"Exodus 27\"}}]]\n"])</script></body></html>
