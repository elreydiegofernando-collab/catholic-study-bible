holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EXO/">About <!-- -->Exodus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The people murmur for want of meat: God giveth them quails and manna.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And they set forward from Elim, and all the multitude of the children of Israel came into the desert of Sin, which is between Elim and Sinai: the fifteenth day of the second month, after they came out of the land of Egypt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And all the congregation of the children of Israel murmured against Moses and Aaron in the wilderness.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the children of Israel said to them: Would to God we had died by the hand of the Lord in the land of Egypt, when we sat over the fleshpots, and ate bread to the full: Why have you brought us into this desert, that you might destroy all the multitude with famine?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the Lord said to Moses: Behold I will rain bread from heaven for you; let the people go forth, and gather what is sufficient for every day: that I may prove them whether they will walk in my law, or not.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But the sixth day let them provide for to bring in: and let it be double to that they were wont to gather every day.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Moses and Aaron said to the children of Israel In the evening you shall know that the Lord hath brought you forth out of the land of Egypt:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And in the morning you shall see the glory of the Lord: for he hath heard your murmuring against the Lord: but as for us, what are we, that you mutter against us?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Moses said: In the evening the Lord will give you flesh to eat, and in the morning bread to the full: for he hath heard your murmurings, with which you have murmured against him, for what are we? your murmuring is not against us, but against the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Moses also said to Aaron: Say to the whole congregation of the children of Israel: Come before the Lord; for he hath heard your murmuring.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And when Aaron spoke to all the assembly of the children of Israel, they looked towards the wilderness; and behold the glory of the Lord appeared in a cloud.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I have heard the murmuring of the children of Israel, say to them: In the evening you shall eat flesh, and in the morning you shall have your fill of bread; and you shall know that I am the Lord your God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>So it came to pass in the evening, that quails coming up, covered the camp: and in the morning a dew lay round about the camp.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when it had covered the face of the earth, it appeared in the wilderness small, and as it were beaten with a pestle, like unto the hoar frost on the ground.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when the children of Israel saw it, they said one to another: Manhu! which signifieth: What is this! for they knew not what it was. And Moses said to them: This is the bread which the Lord hath given you to eat.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>This is the word that the Lord hath commanded: Let every one gather of it as much as is enough to eat; a gomor for every man, according to the number of your souls that dwell in a tent, so shall you take of it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the children of Israel did so: and they gathered, one more, another less.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they measured by the measure of a gomor: neither had he more that had gathered more; nor did he find less that had provided less: but every one had gathered, according to what they were able to eat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Moses said to them: Let no man leave thereof till the morning.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they hearkened not to him, but some of them left until the morning, and it began to be full of worms, and it putrified, and Moses was angry with them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Now every one of them gathered in the morning, as much as might suffice to eat: and after the sun grew hot, it melted.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But on the sixth day they gathered twice as much, that is, two gomors every man: and all the rulers of the multitude came, and told Moses.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he said to them: This is what the Lord hath spoken: To morrow is the rest of the sabbath sanctified to the Lord. Whatsoever work is to be done, do it; and the meats that are to be dressed, dress them; and whatsoever shall remain, lay it up until the morning.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they did so as Moses had commanded, and it did not putrify, neither was there worm found in it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Moses said: Eat it to day, because it is the sabbath of the Lord: to day it shall not be found in the field.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Gather it six days; but on the seventh day is the sabbath of the Lord, therefore it shall not be found.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the seventh day came; and some of the people going forth to gather, found none.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And the Lord said to Moses: How long will you refuse to keep my commandments, and my law?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>See that the Lord hath given you the sabbath, and for this reason on the sixth day he giveth you a double provision: let each man stay at home, and let none go forth out of his place the seventh day.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the people kept the sabbath on the seventh day.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the house of Israel called the name thereof Manna: and it was like coriander seed, white, and the taste thereof like to flour with honey.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And Moses said: This is the word which the Lord hath commanded: Fill a gomor of it, and let it be kept unto generations to come hereafter; that they may know the bread, wherewith I fed you in the wilderness when you were brought forth out of the land of Egypt.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And Moses said to Aaron: Take a vessel, and put manna into it, as much as a gomor can hold; and lay it up before the Lord, to keep unto your generations,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>As the Lord commanded Moses. And Aaron put it in the tabernacle to be kept.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the children of Israel ate manna forty years, till they came to a habitable land: with this meat were they fed, until they reached the borders of the land of Chanaan.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Now a gomor is the tenth part of an ephi.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Profectique sunt de Elim, et venit omnis multitudo filiorum Israël in desertum Sin, quod est inter Elim et Sinai, quintodecimo die mensis secundi, postquam egressi sunt de terra Ægypti.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et murmuravit omnis congregatio filiorum Israël contra Moysen et Aaron in solitudine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixeruntque filii Israël ad eos : Utinam mortui essemus per manum Domini in terra Ægypti, quando sedebamus super ollas carnium, et comedebamus panem in saturitate : cur eduxistis nos in desertum istud, ut occideretis omnem multitudinem fame ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixit autem Dominus ad Moysen : Ecce ego pluam vobis panes de cælo : egrediatur populus, et colligat quæ sufficiunt per singulos dies : ut tentem eum utrum ambulet in lege mea, an non.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Die autem sexto parent quod inferant : et sit duplum quam colligere solebant per singulos dies.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixeruntque Moyses et Aaron ad omnes filios Israël : Vespere scietis quod Dominus eduxerit vos de terra Ægypti,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et mane videbitis gloriam Domini : audivit enim murmur vestrum contra Dominum : nos vero quid sumus, quia mussitastis contra nos ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ait Moyses : Dabit vobis Dominus vespere carnes edere, et mane panes in saturitate : eo quod audierit murmurationes vestras quibus murmurati estis contra eum : nos enim quid sumus ? nec contra nos est murmur vestrum, sed contra Dominum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dixit quoque Moyses ad Aaron : Dic universæ congregationi filiorum Israël : Accedite coram Domino : audivit enim murmur vestrum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cumque loqueretur Aaron ad omnem cœtum filiorum Israël, respexerunt ad solitudinem : et ecce gloria Domini apparuit in nube.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Locutus est autem Dominus ad Moysen, dicens :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Audivi murmurationes filiorum Israël. Loquere ad eos : Vespere comedetis carnes, et mane saturabimini panibus : scietisque quod ego sum Dominus Deus vester.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Factum est ergo vespere, et ascendens coturnix, cooperuit castra : mane quoque ros jacuit per circuitum castrorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cumque operuisset superficiem terræ, apparuit in solitudine minutum, et quasi pilo tusum in similitudinem pruinæ super terram.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quod cum vidissent filii Israël, dixerunt ad invicem : Manhu ? quod significat : Quid est hoc ? ignorabant enim quid esset. Quibus ait Moyses : Iste est panis quem Dominus dedit vobis ad vescendum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hic est sermo, quem præcepit Dominus : Colligat unusquisque ex eo quantum sufficit ad vescendum : gomor per singula capita, juxta numerum animarum vestrarum quæ habitant in tabernaculo sic tolletis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Feceruntque ita filii Israël : et collegerunt, alius plus, alius minus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et mensi sunt ad mensuram gomor : nec qui plus collegerat, habuit amplius : nec qui minus paraverat, reperit minus : sed singuli juxta id quod edere poterant, congregaverunt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dixitque Moyses ad eos : Nullus relinquat ex eo in mane.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui non audierunt eum, sed dimiserunt quidam ex eis usque mane, et scatere cœpit vermibus, atque computruit : et iratus est contra eos Moyses.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Colligebant autem mane singuli, quantum sufficere poterat ad vescendum : cumque incaluisset sol, liquefiebat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In die autem sexta collegerunt cibos duplices, id est, duo gomor per singulos homines : venerunt autem omnes principes multitudinis, et narraverunt Moysi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui ait eis : Hoc est quod locutus est Dominus : Requies sabbati sanctificata est Domino cras : quodcumque operandum est, facite, et quæ coquenda sunt coquite : quidquid autem reliquum fuerit, reponite usque in mane.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Feceruntque ita ut præceperat Moyses, et non computruit, neque vermis inventus est in eo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixitque Moyses : Comedite illud hodie, quia sabbatum est Domini : non invenietur hodie in agro.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sex diebus colligite : in die autem septimo sabbatum est Domini, idcirco non invenietur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Venitque septima dies : et egressi de populo ut colligerent, non invenerunt.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dixit autem Dominus ad Moysen : Usquequo non vultis custodire mandata mea et legem meam ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>videte quod Dominus dederit vobis sabbatum, et propter hoc die sexta tribuit vobis cibos duplices : maneat unusquisque apud semetipsum ; nullus egrediatur de loco suo die septimo.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et sabbatizavit populus die septimo.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Appellavitque domus Israël nomen ejus Man : quod erat quasi semen coriandri album, gustusque ejus quasi similæ cum melle.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Dixit autem Moyses : Iste est sermo, quem præcepit Dominus : Imple gomor ex eo, et custodiatur in futuras retro generationes : ut noverint panem, quo alui vos in solitudine, quando educti estis de terra Ægypti.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dixitque Moyses ad Aaron : Sume vas unum, et mitte ibi man, quantum potest capere gomor, et repone coram Domino ad servandum in generationes vestras,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sicut præcepit Dominus Moysi. Posuitque illud Aaron in tabernaculo reservandum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Filii autem Israël comederunt man quadraginta annis, donec venirent in terram habitabilem : hoc cibo aliti sunt, usquequo tangerent fines terræ Chanaan.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Gomor autem decima pars est ephi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 17</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ther what is sufficient for every day: that I may prove them whether they will walk in my law, or not.\"},{\"verse\":5,\"text\":\"But the sixth day let them provide for to bring in: and let it be double to that they were wont to gather every day.\"},{\"verse\":6,\"text\":\"And Moses and Aaron said to the children of Israel In the evening you shall know that the Lord hath brought you forth out of the land of Egypt:\"},{\"verse\":7,\"text\":\"And in the morning you shall see the glory of the Lord: for he hath heard your murmuring against the Lord: but as for us, what are we, that you mutter against us?\"},{\"verse\":8,\"text\":\"And Moses said: In the evening the Lord will give you flesh to eat, and in the morning bread to the full: for he hath heard your murmurings, with which you have murmured against him, for what are we? your murmuring is not against us, but against the Lord.\"},{\"verse\":9,\"text\":\"Moses also said to Aaron: Say to the whole congregation of the children of Israel: Come before the Lord; for he hath heard your murmuring.\"},{\"verse\":10,\"text\":\"And when Aaron spoke to all the assembly of the children of Israel, they looked towards the wilderness; and behold the glory of the Lord appeared in a cloud.\"},{\"verse\":11,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":12,\"text\":\"I have heard the murmuring of the children of Israel, say to them: In the evening you shall eat flesh, and in the morning you shall have your fill of bread; and you shall know that I am the Lord your God.\"},{\"verse\":13,\"text\":\"So it came to pass in the evening, that quails coming up, covered the camp: and in the morning a dew lay round about the camp.\"},{\"verse\":14,\"text\":\"And when it had covered the face of the earth, it appeared in the wilderness small, and as it were beaten with a pestle, like unto the hoar frost on the ground.\"},{\"verse\":15,\"text\":\"And when the children of Israel saw it, they said one to another: Manhu! which signifieth: What is this! for they knew not what it was. And Moses said to them: This is the bread which the Lord hath given you to eat.\"},{\"verse\":16,\"text\":\"This is the word that the Lord hath commanded: Let every one gather of it as much as is enough to eat; a gomor for every man, according to the number of your souls that dwell in a tent, so shall you take of it.\"},{\"verse\":17,\"text\":\"And the children of Israel did so: and they gathered, one more, another less.\"},{\"verse\":18,\"text\":\"And they measured by the measure of a gomor: neither had he more that had gathered more; nor did he find less that had provided less: but every one had gathered, according to what they were able to eat.\"},{\"verse\":19,\"text\":\"And Moses said to them: Let no man leave thereof till the morning.\"},{\"verse\":20,\"text\":\"And they hearkened not to him, but some of them left until the morning, and it began to be full of worms, and it putrified, and Moses was angry with them.\"},{\"verse\":21,\"text\":\"Now every one of them gathered in the morning, as much as might suffice to eat: and after the sun grew hot, it melted.\"},{\"verse\":22,\"text\":\"But on the sixth day they gathered twice as much, that is, two gomors every man: and all the rulers of the multitude came, and told Moses.\"},{\"verse\":23,\"text\":\"And he said to them: This is what the Lord hath spoken: To morrow is the rest of the sabbath sanctified to the Lord. Whatsoever work is to be done, do it; and the meats that are to be dressed, dress them; and whatsoever shall remain, lay it up until the morning.\"},{\"verse\":24,\"text\":\"And they did so as Moses had commanded, and it did not putrify, neither was there worm found in it.\"},{\"verse\":25,\"text\":\"And Moses said: Eat it to day, because it is the sabbath of the Lord: to day it shall not be found in the field.\"},{\"verse\":26,\"text\":\"Gather it six days; but on the seventh day is the sabbath of the Lord, therefore it shall not be found.\"},{\"verse\":27,\"text\":\"And the seventh day came; and some of the people going forth to gather, found none.\"},{\"verse\":28,\"text\":\"And the Lord said to Moses: How long will you refuse to keep my commandments, and my law?\"},{\"verse\":29,\"text\":\"See that the Lord hath given you the sabbath, and for this reason on the sixth day he giveth you a double provision: let each man stay at home, and let none go forth out of his place the seventh day.\"},{\"verse\":30,\"text\":\"And the people kept the sabbath on the seventh day.\"},{\"verse\":31,\"text\":\"And the house of Israel called the name thereof Manna: and it was like coriander seed, white, and the taste thereof like to flour with honey.\"},{\"verse\":32,\"text\":\"And Moses said: This is the word which the Lord hath commanded: Fill a gomor of it, and let it be kept unto generations to come hereafter; that they may know the bread, wherewith I fed you in the wilderness when you were brought forth out of the land of Egypt.\"},{\"verse\":33,\"text\":\"And Moses said to Aaron: Take a vessel, and put manna into it, as much as a gomor can hold; and lay it up before the Lord, to keep unto your generations,\"},{\"verse\":34,\"text\":\"As the Lord commanded Moses. And Aaron put it in the tabernacle to be kept.\"},{\"verse\":35,\"text\":\"And the children of Israel ate manna forty years, till they came to a habitable land: with this meat were they fed, until they reached the borders of the land of Chanaan.\"},{\"verse\":36,\"text\":\"Now a gomor is the tenth part of an ephi.\"}],\"vul\":[{\"verse\":1,\"text\":\"Profectique sunt de Elim, et venit omnis multitudo filiorum Israël in desertum Sin, quod est inter Elim et Sinai, quintodecimo die mensis secundi, postquam egressi sunt de terra Ægypti.\"},{\"verse\":2,\"text\":\"Et murmuravit omnis congregatio filiorum Israël contra Moysen et Aaron in solitudine.\"},{\"verse\":3,\"text\":\"Dixeruntque filii Israël ad eos : Utinam mortui essemus per manum Domini in terra Ægypti, quando sedebamus super ollas carnium, et comedebamus panem in saturitate : cur eduxistis nos in desertum istud, ut occideretis omnem multitudinem fame ?\"},{\"verse\":4,\"text\":\"Dixit autem Dominus ad Moysen : Ecce ego pluam vobis panes de cælo : egrediatur populus, et colligat quæ sufficiunt per singulos dies : ut tentem eum utrum ambulet in lege mea, an non.\"},{\"verse\":5,\"text\":\"Die autem sexto parent quod inferant : et sit duplum quam colligere solebant per singulos dies.\"},{\"verse\":6,\"text\":\"Dixeruntque Moyses et Aaron ad omnes filios Israël : Vespere scietis quod Dominus eduxerit vos de terra Ægypti,\"},{\"verse\":7,\"text\":\"et mane videbitis gloriam Domini : audivit enim murmur vestrum contra Dominum : nos vero quid sumus, quia mussitastis contra nos ?\"},{\"verse\":8,\"text\":\"Et ait Moyses : Dabit vobis Dominus vespere carnes edere, et mane panes in saturitate : eo quod audierit murmurationes vestras quibus murmurati estis contra eum : nos enim quid sumus ? nec contra nos est murmur vestrum, sed contra Dominum.\"},{\"verse\":9,\"text\":\"Dixit quoque Moyses ad Aaron : Dic universæ congregationi filiorum Israël : Accedite coram Domino : audivit enim murmur vestrum.\"},{\"verse\":10,\"text\":\"Cumque loqueretur Aaron ad omnem cœtum filiorum Israël, respexerunt ad solitudinem : et ecce gloria Domini apparuit in nube.\"},{\"verse\":11,\"text\":\"Locutus est autem Dominus ad Moysen, dicens :\"},{\"verse\":12,\"text\":\"Audivi murmurationes filiorum Israël. Loquere ad eos : Vespere comedetis carnes, et mane saturabimini panibus : scietisque quod ego sum Dominus Deus vester.\"},{\"verse\":13,\"text\":\"Factum est ergo vespere, et ascendens coturnix, cooperuit castra : mane quoque ros jacuit per circuitum castrorum.\"},{\"verse\":14,\"text\":\"Cumque operuisset superficiem terræ, apparuit in solitudine minutum, et quasi pilo tusum in similitudinem pruinæ super terram.\"},{\"verse\":15,\"text\":\"Quod cum vidissent filii Israël, dixerunt ad invicem : Manhu ? quod significat : Quid est hoc ? ignorabant enim quid esset. Quibus ait Moyses : Iste est panis quem Dominus dedit vobis ad vescendum.\"},{\"verse\":16,\"text\":\"Hic est sermo, quem præcepit Dominus : Colligat unusquisque ex eo quantum sufficit ad vescendum : gomor per singula capita, juxta numerum animarum vestrarum quæ habitant in tabernaculo sic tolletis.\"},{\"verse\":17,\"text\":\"Feceruntque ita filii Israël : et collegerunt, alius plus, alius minus.\"},{\"verse\":18,\"text\":\"Et mensi sunt ad mensuram gomor : nec qui plus collegerat, habuit amplius : nec qui minus paraverat, reperit minus : sed singuli juxta id quod edere poterant, congregaverunt.\"},{\"verse\":19,\"text\":\"Dixitque Moyses ad eos : Nullus relinquat ex eo in mane.\"},{\"verse\":20,\"text\":\"Qui non audierunt eum, sed dimiserunt quidam ex eis usque mane, et scatere cœpit vermibus, atque computruit : et iratus est contra eos Moyses.\"},{\"verse\":21,\"text\":\"Colligebant autem mane singuli, quantum sufficere poterat ad vescendum : cumque incaluisset sol, liquefiebat.\"},{\"verse\":22,\"text\":\"In die autem sexta collegerunt cibos duplices, id est, duo gomor per singulos homines : venerunt autem omnes principes multitudinis, et narraverunt Moysi.\"},{\"verse\":23,\"text\":\"Qui ait eis : Hoc est quod locutus est Dominus : Requies sabbati sanctificata est Domino cras : quodcumque operandum est, facite, et quæ coquenda sunt coquite : quidquid autem reliquum fuerit, reponite usque in mane.\"},{\"verse\":24,\"text\":\"Feceruntque ita ut præceperat Moyses, et non computruit, neque vermis inventus est in eo.\"},{\"verse\":25,\"text\":\"Dixitque Moyses : Comedite illud hodie, quia sabbatum est Domini : non invenietur hodie in agro.\"},{\"verse\":26,\"text\":\"Sex diebus colligite : in die autem septimo sabbatum est Domini, idcirco non invenietur.\"},{\"verse\":27,\"text\":\"Venitque septima dies : et egressi de populo ut colligerent, non invenerunt.\"},{\"verse\":28,\"text\":\"Dixit autem Dominus ad Moysen : Usquequo non vultis custodire mandata mea et legem meam ?\"},{\"verse\":29,\"text\":\"videte quod Dominus dederit vobis sabbatum, et propter hoc die sexta tribuit vobis cibos duplices : maneat unusquisque apud semetipsum ; nullus egrediatur de loco suo die septimo.\"},{\"verse\":30,\"text\":\"Et sabbatizavit populus die septimo.\"},{\"verse\":31,\"text\":\"Appellavitque domus Israël nomen ejus Man : quod erat quasi semen coriandri album, gustusque ejus quasi similæ cum melle.\"},{\"verse\":32,\"text\":\"Dixit autem Moyses : Iste est sermo, quem præcepit Dominus : Imple gomor ex eo, et custodiatur in futuras retro generationes : ut noverint panem, quo alui vos in solitudine, quando educti estis de terra Ægypti.\"},{\"verse\":33,\"text\":\"Dixitque Moyses ad Aaron : Sume vas unum, et mitte ibi man, quantum potest capere gomor, et repone coram Domino ad servandum in generationes vestras,\"},{\"verse\":34,\"text\":\"sicut præcepit Dominus Moysi. Posuitque illud Aaron in tabernaculo reservandum.\"},{\"verse\":35,\"text\":\"Filii autem Israël comederunt man quadraginta annis, donec venirent in terram habitabilem : hoc cibo aliti sunt, usquequo tangerent fines terræ Chanaan.\"},{\"verse\":36,\"text\":\"Gomor autem decima pars est ephi.\"}],\"summary\":\"The people murmur for want of meat: God giveth them quails and manna.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":15,\"label\":\"Exodus 15\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":17,\"label\":\"Exodus 17\"}}]]\n"])</script></body></html>
