ssed="false" class="verse"><sup>2</sup>Therefore thou shalt tell all the people, that every man ask of his friend, and every woman of her neighbour, vessels of silver and of gold.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the Lord will give favour to his people in the sight of the Egyptians. And Moses was a very great man in the land of Egypt, in the sight of Pharao’s servants, and of all the people.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he said: Thus saith the Lord: At midnight I will enter into Egypt:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And every firstborn in the land of the Egyptians shall die, from the firstborn of Pharao who sitteth on his throne, even to the firstborn of the handmaid that is at the mill, and all the firstborn of beasts.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And there shall be a great cry in all the land of Egypt, such as neither hath been before, nor shall be hereafter.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But with all the children of Israel there shall not a dog make the least noise, from man even to beast; that you may know how wonderful a difference the Lord maketh between the Egyptians and Israel.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And all these thy servants shall come down to me, and shall worship me, saying: Go forth thou, and all the people that is under thee: after that we will go out.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he went out from Pharao exceeding angry. But the Lord said to Moses: Pharao will not hear you, that many signs may be done in the land of Egypt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Moses and Aaron did all the wonders that are written, before Pharao. And the Lord hardened Pharao’s heart, neither did he let the children of Israel go out of his land.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et dixit Dominus ad Moysen : Adhuc una plaga tangam Pharaonem et Ægyptum, et post hæc dimittet vos, et exire compellet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dices ergo omni plebi ut postulet vir ab amico suo, et mulier a vicina sua, vasa argentea et aurea.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dabit autem Dominus gratiam populo suo coram Ægyptiis. Fuitque Moyses vir magnus valde in terra Ægypti coram servis Pharaonis et omni populo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et ait : Hæc dicit Dominus : Media nocte egrediar in Ægyptum :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et morietur omne primogenitum in terra Ægyptiorum, a primogenito Pharaonis, qui sedet in solio ejus, usque ad primogenitum ancillæ quæ est ad molam, et omnia primogenita jumentorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Eritque clamor magnus in universa terra Ægypti, qualis nec ante fuit, nec postea futurus est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Apud omnes autem filios Israël non mutiet canis ab homine usque ad pecus : ut sciatis quanto miraculo dividat Dominus Ægyptios et Israël.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Descendentque omnes servi tui isti ad me, et adorabunt me, dicentes : Egredere tu, et omnis populus qui subjectus est tibi : post hæc egrediemur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et exivit a Pharaone iratus nimis. Dixit autem Dominus ad Moysen : Non audiet vos Pharao ut multa signa fiant in terra Ægypti.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Moyses autem et Aaron fecerunt omnia ostenta, quæ scripta sunt, coram Pharaone. Et induravit Dominus cor Pharaonis, nec dimisit filios Israël de terra sua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 12</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->11<!-- --> of <!-- -->40<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom out from Pharao exceeding angry. But the Lord said to Moses: Pharao will not hear you, that many signs may be done in the land of Egypt.\"},{\"verse\":10,\"text\":\"And Moses and Aaron did all the wonders that are written, before Pharao. And the Lord hardened Pharao’s heart, neither did he let the children of Israel go out of his land.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et dixit Dominus ad Moysen : Adhuc una plaga tangam Pharaonem et Ægyptum, et post hæc dimittet vos, et exire compellet.\"},{\"verse\":2,\"text\":\"Dices ergo omni plebi ut postulet vir ab amico suo, et mulier a vicina sua, vasa argentea et aurea.\"},{\"verse\":3,\"text\":\"Dabit autem Dominus gratiam populo suo coram Ægyptiis. Fuitque Moyses vir magnus valde in terra Ægypti coram servis Pharaonis et omni populo.\"},{\"verse\":4,\"text\":\"Et ait : Hæc dicit Dominus : Media nocte egrediar in Ægyptum :\"},{\"verse\":5,\"text\":\"et morietur omne primogenitum in terra Ægyptiorum, a primogenito Pharaonis, qui sedet in solio ejus, usque ad primogenitum ancillæ quæ est ad molam, et omnia primogenita jumentorum.\"},{\"verse\":6,\"text\":\"Eritque clamor magnus in universa terra Ægypti, qualis nec ante fuit, nec postea futurus est.\"},{\"verse\":7,\"text\":\"Apud omnes autem filios Israël non mutiet canis ab homine usque ad pecus : ut sciatis quanto miraculo dividat Dominus Ægyptios et Israël.\"},{\"verse\":8,\"text\":\"Descendentque omnes servi tui isti ad me, et adorabunt me, dicentes : Egredere tu, et omnis populus qui subjectus est tibi : post hæc egrediemur.\"},{\"verse\":9,\"text\":\"Et exivit a Pharaone iratus nimis. Dixit autem Dominus ad Moysen : Non audiet vos Pharao ut multa signa fiant in terra Ægypti.\"},{\"verse\":10,\"text\":\"Moyses autem et Aaron fecerunt omnia ostenta, quæ scripta sunt, coram Pharaone. Et induravit Dominus cor Pharaonis, nec dimisit filios Israël de terra sua.\"}],\"summary\":\"Pharao and his people are threatened with the death of their firstborn.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":10,\"label\":\"Exodus 10\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":12,\"label\":\"Exodus 12\"}}]]\n"])</script></body></html>
