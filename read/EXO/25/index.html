holic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">25</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EXO/">About <!-- -->Exodus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Offerings prescribed for making the tabernacle, the ark, the candlestick, etc.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Speak to the children of Israel, that they bring firstfruits to me: of every man that offereth of his own accord, you shall take them.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And these are the things you must take: Gold, and silver, and brass,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Violet and purple, and scarlet twice dyed, and fine linen, and goats’ hair,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And rams’ skins dyed red, and violet skins, and setim wood:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Oil to make lights: spices for ointment, and for sweetsmelling incense:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Onyx stones, and precious stones to adorn the ephod and the rational.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they shall make me a sanctuary, and I will dwell in the midst of them:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>According to all the likeness of the tabernacle which I will shew thee, and of all the vessels for the service thereof: and thus you shall make it:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Frame an ark of setim wood, the length whereof shall be of two cubits and a half; the breadth, a cubit and a half; the height, likewise, a cubit and a half.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And thou shalt overlay it with the purest gold, within and without; and over it thou shalt make a golden crown round about:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And four golden rings, which thou shalt put at the four corners of the ark: let two rings be on the one side, and two on the other.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou shalt make bars also of setim wood, and shalt overlay them with gold.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And thou shalt put them in through the rings that are in the sides of the ark, that it may be carried on them:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they shall be always in the rings, neither shall they at any time be drawn out of them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And thou shalt put in the ark the testimony which I will give thee.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thou shalt make also a propitiatory of the purest gold: the length thereof shall be two cubits and a half, and the breadth a cubit and a half.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thou shalt make also two cherubims of beaten gold, on the two sides of the oracle.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let one cherub be on the one side, and the other on the other.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Let them cover both sides of the propitiatory, spreading their wings, and covering the oracle, and let them look one towards the other, their faces being turned towards the propitiatory wherewith the ark is to be covered.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In which thou shalt put the testimony that I will give thee.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Thence will I give orders, and will speak to thee over the propitiatory, and from the midst of the two cherubims, which shall be upon the ark of the testimony, all things which I will command the children of Israel by thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Thou shalt make a table also of setim wood, of two cubits in length, and a cubit in breadth, and a cubit and a half in height.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And thou shalt overlay it with the purest gold: and thou shalt make to it a golden ledge round about.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And to the ledge itself a polished crown, four inches high; and over the same another little golden crown.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Thou shalt prepare also four golden rings, and shalt put them in the four corners of the same table, over each foot.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Under the crown shall the golden rings be, that the bars may be put through them, and the table may be carried.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The bars also themselves thou shalt make of setim wood, and shalt overlay them with gold, to bear up the table.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Thou shalt prepare also dishes, and bowls, censers, and cups, wherein the libations are to be offered, of the purest gold.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And thou shalt set upon the table loaves of proposition in my sight always.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Thou shalt make also a candlestick of beaten work, of the finest gold, the shaft thereof, and the branches, the cups, and the bowls, and the lilies going forth from it.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Six branches shall come out of the sides, three out of one side, and three out of the other.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Three cups as it were nuts to every branch, and a bowl withal, and a lily: and three cups likewise of the fashion of nuts in the other branch, and a bowl withal, and a lily. Such shall be the work of the six branches, that are to come out from the shaft:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And in the candlestick itself shall be four cups in the manner of a nut, and at every one bowls and lilies.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Bowls under two branches in three places, which together make six, coming forth out of one shaft.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And both the bowls and the branches shall be of the same beaten work of the purest gold.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Thou shalt make also seven lamps, and shalt set them upon the candlestick, to give light over against.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>The snuffers also, and where the snuffings shall be put out, shall be made of the purest gold.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>The whole weight of the candlestick, with all the furniture thereof, shall be a talent of the purest gold.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Look, and make it according to the pattern that was shewn thee in the mount.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Loquere filiis Israël, ut tollant mihi primitias : ab omni homine qui offeret ultroneus, accipietis eas.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hæc sunt autem quæ accipere debeatis : aurum, et argentum, et æs,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>hyacinthum et purpuram, coccumque bis tinctum, et byssum, pilos caprarum,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et pelles arietum rubricatas, pellesque janthinas, et ligna setim :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>oleum ad luminaria concinnanda : aromata in unguentum, et thymiamata boni odoris :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>lapides onychinos, et gemmas ad ornandum ephod, ac rationale.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Facientque mihi sanctuarium, et habitabo in medio eorum :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>juxta omnem similitudinem tabernaculi quod ostendam tibi, et omnium vasorum in cultum ejus. Sicque facietis illud :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>arcam de lignis setim compingite, cujus longitudo habeat duos et semis cubitos : latitudo, cubitum et dimidium : altitudo, cubitum similiter ac semissem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et deaurabis eam auro mundissimo intus et foris : faciesque supra, coronam auream per circuitum :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et quatuor circulos aureos, quos pones per quatuor arcæ angulos : duo circuli sint in latere uno, et duo in altero.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Facies quoque vectes de lignis setim, et operies eos auro.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Inducesque per circulos qui sunt in arcæ lateribus, ut portetur in eis :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>qui semper erunt in circulis, nec umquam extrahentur ab eis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ponesque in arca testificationem quam dabo tibi.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Facies et propitiatorium de auro mundissimo : duos cubitos et dimidium tenebit longitudo ejus, et cubitum ac semissem latitudo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Duos quoque cherubim aureos et productiles facies, ex utraque parte oraculi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cherub unus sit in latere uno, et alter in altero.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Utrumque latus propitiatorii tegant expandentes alas, et operientes oraculum, respiciantque se mutuo versis vultibus in propitiatorium quo operienda est arca,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>in qua pones testimonium quod dabo tibi.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Inde præcipiam, et loquar ad te supra propitiatorium, ac de medio duorum cherubim, qui erunt super arcam testimonii, cuncta quæ mandabo per te filiis Israël.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Facies et mensam de lignis setim, habentem duos cubitos longitudinis, et in latitudine cubitum, et in altitudine cubitum et semissem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et inaurabis eam auro purissimo : faciesque illi labium aureum per circuitum,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et ipsi labio coronam interrasilem altam quatuor digitis : et super illam, alteram coronam aureolam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quatuor quoque circulos aureos præparabis, et pones eis in quatuor angulis ejusdem mensæ per singulos pedes.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Subter coronam erunt circuli aurei, ut mittantur vectes per eos, et possit mensa portari.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ipsos quoque vectes facies de lignis setim, et circumdabis auro ad subvehendam mensam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Parabis et acetabula, ac phialas, thuribula, et cyathos, in quibus offerenda sunt libamina, ex auro purissimo.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et pones super mensam panes propositionis in conspectu meo semper.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Facies et candelabrum ductile de auro mundissimo, hastile ejus, et calamos, scyphos, et sphærulas, ac lilia ex ipso procedentia.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Sex calami egredientur de lateribus, tres ex uno latere, et tres ex altero.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Tres scyphi quasi in nucis modum per calamos singulos, sphærulaque simul, et lilium : et tres similiter scyphi instar nucis in calamo altero, sphærulaque simul et lilium. Hoc erit opus sex calamorum, qui producendi sunt de hastili :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>in ipso autem candelabro erunt quatuor scyphi in nucis modum, sphærulæque per singulos, et lilia.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Sphærulæ sub duobus calamis per tria loca, qui simul sex fiunt procedentes de hastili uno.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et sphærulæ igitur et calami ex ipso erunt, universa ductilia de auro purissimo.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Facies et lucernas septem, et pones eas super candelabrum, ut luceant ex adverso.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Emunctoria quoque, et ubi quæ emuncta sunt extinguantur, fiant de auro purissimo.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Omne pondus candelabri cum universis vasis suis habebit talentum auri purissimi.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Inspice, et fac secundum exemplar quod tibi in monte monstratum est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/24/"><svg viewBox="0 0 24 24" fill="none" stroke="curr oke to Moses, saying:\"},{\"verse\":2,\"text\":\"Speak to the children of Israel, that they bring firstfruits to me: of every man that offereth of his own accord, you shall take them.\"},{\"verse\":3,\"text\":\"And these are the things you must take: Gold, and silver, and brass,\"},{\"verse\":4,\"text\":\"Violet and purple, and scarlet twice dyed, and fine linen, and goats’ hair,\"},{\"verse\":5,\"text\":\"And rams’ skins dyed red, and violet skins, and setim wood:\"},{\"verse\":6,\"text\":\"Oil to make lights: spices for ointment, and for sweetsmelling incense:\"},{\"verse\":7,\"text\":\"Onyx stones, and precious stones to adorn the ephod and the rational.\"},{\"verse\":8,\"text\":\"And they shall make me a sanctuary, and I will dwell in the midst of them:\"},{\"verse\":9,\"text\":\"According to all the likeness of the tabernacle which I will shew thee, and of all the vessels for the service thereof: and thus you shall make it:\"},{\"verse\":10,\"text\":\"Frame an ark of setim wood, the length whereof shall be of two cubits and a half; the breadth, a cubit and a half; the height, likewise, a cubit and a half.\"},{\"verse\":11,\"text\":\"And thou shalt overlay it with the purest gold, within and without; and over it thou shalt make a golden crown round about:\"},{\"verse\":12,\"text\":\"And four golden rings, which thou shalt put at the four corners of the ark: let two rings be on the one side, and two on the other.\"},{\"verse\":13,\"text\":\"Thou shalt make bars also of setim wood, and shalt overlay them with gold.\"},{\"verse\":14,\"text\":\"And thou shalt put them in through the rings that are in the sides of the ark, that it may be carried on them:\"},{\"verse\":15,\"text\":\"And they shall be always in the rings, neither shall they at any time be drawn out of them.\"},{\"verse\":16,\"text\":\"And thou shalt put in the ark the testimony which I will give thee.\"},{\"verse\":17,\"text\":\"Thou shalt make also a propitiatory of the purest gold: the length thereof shall be two cubits and a half, and the breadth a cubit and a half.\"},{\"verse\":18,\"text\":\"Thou shalt make also two cherubims of beaten gold, on the two sides of the oracle.\"},{\"verse\":19,\"text\":\"Let one cherub be on the one side, and the other on the other.\"},{\"verse\":20,\"text\":\"Let them cover both sides of the propitiatory, spreading their wings, and covering the oracle, and let them look one towards the other, their faces being turned towards the propitiatory wherewith the ark is to be covered.\"},{\"verse\":21,\"text\":\"In which thou shalt put the testimony that I will give thee.\"},{\"verse\":22,\"text\":\"Thence will I give orders, and will speak to thee over the propitiatory, and from the midst of the two cherubims, which shall be upon the ark of the testimony, all things which I will command the children of Israel by thee.\"},{\"verse\":23,\"text\":\"Thou shalt make a table also of setim wood, of two cubits in length, and a cubit in breadth, and a cubit and a half in height.\"},{\"verse\":24,\"text\":\"And thou shalt overlay it with the purest gold: and thou shalt make to it a golden ledge round about.\"},{\"verse\":25,\"text\":\"And to the ledge itself a polished crown, four inches high; and over the same another little golden crown.\"},{\"verse\":26,\"text\":\"Thou shalt prepare also four golden rings, and shalt put them in the four corners of the same table, over each foot.\"},{\"verse\":27,\"text\":\"Under the crown shall the golden rings be, that the bars may be put through them, and the table may be carried.\"},{\"verse\":28,\"text\":\"The bars also themselves thou shalt make of setim wood, and shalt overlay them with gold, to bear up the table.\"},{\"verse\":29,\"text\":\"Thou shalt prepare also dishes, and bowls, censers, and cups, wherein the libations are to be offered, of the purest gold.\"},{\"verse\":30,\"text\":\"And thou shalt set upon the table loaves of proposition in my sight always.\"},{\"verse\":31,\"text\":\"Thou shalt make also a candlestick of beaten work, of the finest gold, the shaft thereof, and the branches, the cups, and the bowls, and the lilies going forth from it.\"},{\"verse\":32,\"text\":\"Six branches shall come out of the sides, three out of one side, and three out of the other.\"},{\"verse\":33,\"text\":\"Three cups as it were nuts to every branch, and a bowl withal, and a lily: and three cups likewise of the fashion of nuts in the other branch, and a bowl withal, and a lily. Such shall be the work of the six branches, that are to come out from the shaft:\"},{\"verse\":34,\"text\":\"And in the candlestick itself shall be four cups in the manner of a nut, and at every one bowls and lilies.\"},{\"verse\":35,\"text\":\"Bowls under two branches in three places, which together make six, coming forth out of one shaft.\"},{\"verse\":36,\"text\":\"And both the bowls and the branches shall be of the same beaten work of the purest gold.\"},{\"verse\":37,\"text\":\"Thou shalt make also seven lamps, and shalt set them upon the candlestick, to give light over against.\"},{\"verse\":38,\"text\":\"The snuffers also, and where the snuffings shall be put out, shall be made of the purest gold.\"},{\"verse\":39,\"text\":\"The whole weight of the candlestick, with all the furniture thereof, shall be a talent of the purest gold.\"},{\"verse\":40,\"text\":\"Look, and make it according to the pattern that was shewn thee in the mount.\"}],\"vul\":[{\"verse\":1,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":2,\"text\":\"Loquere filiis Israël, ut tollant mihi primitias : ab omni homine qui offeret ultroneus, accipietis eas.\"},{\"verse\":3,\"text\":\"Hæc sunt autem quæ accipere debeatis : aurum, et argentum, et æs,\"},{\"verse\":4,\"text\":\"hyacinthum et purpuram, coccumque bis tinctum, et byssum, pilos caprarum,\"},{\"verse\":5,\"text\":\"et pelles arietum rubricatas, pellesque janthinas, et ligna setim :\"},{\"verse\":6,\"text\":\"oleum ad luminaria concinnanda : aromata in unguentum, et thymiamata boni odoris :\"},{\"verse\":7,\"text\":\"lapides onychinos, et gemmas ad ornandum ephod, ac rationale.\"},{\"verse\":8,\"text\":\"Facientque mihi sanctuarium, et habitabo in medio eorum :\"},{\"verse\":9,\"text\":\"juxta omnem similitudinem tabernaculi quod ostendam tibi, et omnium vasorum in cultum ejus. Sicque facietis illud :\"},{\"verse\":10,\"text\":\"arcam de lignis setim compingite, cujus longitudo habeat duos et semis cubitos : latitudo, cubitum et dimidium : altitudo, cubitum similiter ac semissem.\"},{\"verse\":11,\"text\":\"Et deaurabis eam auro mundissimo intus et foris : faciesque supra, coronam auream per circuitum :\"},{\"verse\":12,\"text\":\"et quatuor circulos aureos, quos pones per quatuor arcæ angulos : duo circuli sint in latere uno, et duo in altero.\"},{\"verse\":13,\"text\":\"Facies quoque vectes de lignis setim, et operies eos auro.\"},{\"verse\":14,\"text\":\"Inducesque per circulos qui sunt in arcæ lateribus, ut portetur in eis :\"},{\"verse\":15,\"text\":\"qui semper erunt in circulis, nec umquam extrahentur ab eis.\"},{\"verse\":16,\"text\":\"Ponesque in arca testificationem quam dabo tibi.\"},{\"verse\":17,\"text\":\"Facies et propitiatorium de auro mundissimo : duos cubitos et dimidium tenebit longitudo ejus, et cubitum ac semissem latitudo.\"},{\"verse\":18,\"text\":\"Duos quoque cherubim aureos et productiles facies, ex utraque parte oraculi.\"},{\"verse\":19,\"text\":\"Cherub unus sit in latere uno, et alter in altero.\"},{\"verse\":20,\"text\":\"Utrumque latus propitiatorii tegant expandentes alas, et operientes oraculum, respiciantque se mutuo versis vultibus in propitiatorium quo operienda est arca,\"},{\"verse\":21,\"text\":\"in qua pones testimonium quod dabo tibi.\"},{\"verse\":22,\"text\":\"Inde præcipiam, et loquar ad te supra propitiatorium, ac de medio duorum cherubim, qui erunt super arcam testimonii, cuncta quæ mandabo per te filiis Israël.\"},{\"verse\":23,\"text\":\"Facies et mensam de lignis setim, habentem duos cubitos longitudinis, et in latitudine cubitum, et in altitudine cubitum et semissem.\"},{\"verse\":24,\"text\":\"Et inaurabis eam auro purissimo : faciesque illi labium aureum per circuitum,\"},{\"verse\":25,\"text\":\"et ipsi labio coronam interrasilem altam quatuor digitis : et super illam, alteram coronam aureolam.\"},{\"verse\":26,\"text\":\"Quatuor quoque circulos aureos præparabis, et pones eis in quatuor angulis ejusdem mensæ per singulos pedes.\"},{\"verse\":27,\"text\":\"Subter coronam erunt circuli aurei, ut mittantur vectes per eos, et possit mensa portari.\"},{\"verse\":28,\"text\":\"Ipsos quoque vectes facies de lignis setim, et circumdabis auro ad subvehendam mensam.\"},{\"verse\":29,\"text\":\"Parabis et acetabula, ac phialas, thuribula, et cyathos, in quibus offerenda sunt libamina, ex auro purissimo.\"},{\"verse\":30,\"text\":\"Et pones super mensam panes propositionis in conspectu meo semper.\"},{\"verse\":31,\"text\":\"Facies et candelabrum ductile de auro mundissimo, hastile ejus, et calamos, scyphos, et sphærulas, ac lilia ex ipso procedentia.\"},{\"verse\":32,\"text\":\"Sex calami egredientur de lateribus, tres ex uno latere, et tres ex altero.\"},{\"verse\":33,\"text\":\"Tres scyphi quasi in nucis modum per calamos singulos, sphærulaque simul, et lilium : et tres similiter scyphi instar nucis in calamo altero, sphærulaque simul et lilium. Hoc erit opus sex calamorum, qui producendi sunt de hastili :\"},{\"verse\":34,\"text\":\"in ipso autem candelabro erunt quatuor scyphi in nucis modum, sphærulæque per singulos, et lilia.\"},{\"verse\":35,\"text\":\"Sphærulæ sub duobus calamis per tria loca, qui simul sex fiunt procedentes de hastili uno.\"},{\"verse\":36,\"text\":\"Et sphærulæ igitur et calami ex ipso erunt, universa ductilia de auro purissimo.\"},{\"verse\":37,\"text\":\"Facies et lucernas septem, et pones eas super candelabrum, ut luceant ex adverso.\"},{\"verse\":38,\"text\":\"Emunctoria quoque, et ubi quæ emuncta sunt extinguantur, fiant de auro purissimo.\"},{\"verse\":39,\"text\":\"Omne pondus candelabri cum universis vasis suis habebit talentum auri purissimi.\"},{\"verse\":40,\"text\":\"Inspice, et fac secundum exemplar quod tibi in monte monstratum est.\"}],\"summary\":\"Offerings prescribed for making the tabernacle, the ark, the candlestick, etc.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":24,\"label\":\"Exodus 24\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":26,\"label\":\"Exodus 26\"}}]]\n"])</script></body></html>
