<button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He took Sephora, the wife of Moses, whom he had sent back:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And her two sons, of whom one was called Gersam: his father saying, I have been a stranger in a foreign country.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And the other Eliezer: For the God of my father, said he, is my helper, and hath delivered me from the sword of Pharao.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Jethro, the kinsman of Moses, came with his sons, and his wife to Moses into the desert, where he was camped by the mountain of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he sent word to Moses, saying: I Jethro, thy kinsman, come to thee, and thy wife, and thy two sons with her.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he went out to meet his kinsman, and worshipped and kissed him: and they saluted one another with words of peace. And when he was come into the tent,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Moses told his kinsman all that the Lord had done to Pharao, and the Egyptians in favour of Israel: and all the labour which had befallen them in the journey, and that the Lord had delivered them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Jethro rejoiced for all the good things that the Lord had done to Israel, because he had delivered them out of the hands of the Egyptians.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he said: Blessed is the Lord, who hath delivered you out of the hand of Pharao, and out of the hand of Egypt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now I know, that the Lord is great above all gods; because he hath delivered his people out of the hand of the Egyptians, who dealt proudly against them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>So Jethro, the kinsman of Moses, offered holocausts and sacrifices to God: and Aaron and all the ancients of Israel came, to eat bread with him before God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the next day Moses sat to judge the people, who stood by Moses from morning until night.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when his kinsman had seen all things that he did among the people, he said: What is it that thou dost among the people? Why sittest thou alone, and all the people wait from morning till night?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Moses answered him: The people come to me to seek the judgment of God?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when any controversy falleth out among them, they come to me to judge between them, and to shew the precepts of God, and his laws.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But he said: The thing thou dost is not good.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thou art spent with foolish labour, both thou, and this people that is with thee; the business is above thy strength, thou alone canst not bear it.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But hear my words and counsels, and God shall be with thee. Be thou to the people in those things that pertain to God, to bring their words to him:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And to shew the people the ceremonies, and the manner of worshipping; and the way wherein they ought to walk, and the work that they ought to do.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And provide out of all the people able men, such as fear God, in whom there is truth, and that hate avarice, and appoint of them rulers of thousands, and of hundreds, and of fifties, and of tens,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Who may judge the people at all times: and when any great matter soever shall fall out, let them refer it to thee, and let them judge the lesser matters only: that so it may be lighter for thee, the burden being shared out unto others.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If thou dost this, thou shalt fulfil the commandment of God, and shalt be able to bear his precepts: and all this people shall return to their places with peace.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And when Moses heard this, he did all things that he had suggested unto him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And choosing able men out of all Israel, he appointed them rulers of the people, rulers over thousands, and over hundreds, and over fifties, and over tens.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they judged the people at all times: and whatsoever was of greater difficulty they referred to him, and they judged the easier cases only.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he let his kinsman depart: and he returned and went into his own country.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Cumque audisset Jethro, sacerdos Madian, cognatus Moysi, omnia quæ fecerat Deus Moysi, et Israëli populo suo, et quod eduxisset Dominus Israël de Ægypto,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>tulit Sephoram uxorem Moysi quam remiserat,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et duos filios ejus : quorum unus vocabatur Gersam, dicente patre : Advena fui in terra aliena ;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>alter vero Eliezer : Deus enim, ait, patris mei adjutor meus, et eruit me de gladio Pharaonis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Venit ergo Jethro cognatus Moysi, et filii ejus, et uxor ejus ad Moysen in desertum, ubi erat castrametatus juxta montem Dei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et mandavit Moysi, dicens : Ego Jethro cognatus tuus venio ad te, et uxor tua, et duo filii cum ea.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui egressus in occursum cognati sui, adoravit, et osculatus est eum : salutaveruntque se mutuo verbis pacificis. Cumque intrasset tabernaculum,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>narravit Moyses cognato suo cuncta quæ fecerat Dominus Pharaoni et Ægyptiis propter Israël : universumque laborem, qui accidisset eis in itinere, et quod liberaverat eos Dominus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Lætatusque est Jethro super omnibus bonis, quæ fecerat Dominus Israëli, eo quod eruisset eum de manu Ægyptiorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et ait : Benedictus Dominus, qui liberavit vos de manu Ægyptiorum, et de manu Pharaonis ; qui eruit populum suum de manu Ægypti.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Nunc cognovi, quia magnus Dominus super omnes deos : eo quod superbe egerint contra illos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Obtulit ergo Jethro cognatus Moysi holocausta et hostias Deo : veneruntque Aaron et omnes seniores Israël, ut comederent panem cum eo coram Deo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Altera autem die sedit Moyses ut judicaret populum, qui assistebat Moysi a mane usque ad vesperam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quod cum vidisset cognatus ejus, omnia scilicet quæ agebat in populo, ait : Quid est hoc quod facis in plebe ? cur solus sedes, et omnis populus præstolatur de mane usque ad vesperam ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cui respondit Moyses : Venit ad me populus quærens sententiam Dei :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>cumque acciderit eis aliqua disceptatio, veniunt ad me ut judicem inter eos, et ostendam præcepta Dei, et leges ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>At ille : Non bonam, inquit, rem facis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Stulto labore consumeris et tu, et populus iste qui tecum est : ultra vires tuas est negotium ; solus illud non poteris sustinere.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sed audi verba mea atque consilia, et erit Deus tecum. Esto tu populo in his quæ ad Deum pertinent, ut referas quæ dicuntur ad eum :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>ostendasque populo cæremonias et ritum colendi, viamque per quam ingredi debeant, et opus quod facere debeant.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Provide autem de omni plebe viros potentes, et timentes Deum, in quibus sit veritas, et qui oderint avaritiam, et constitue ex eis tribunos, et centuriones, et quinquagenarios, et decanos,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>qui judicent populum omni tempore : quidquid autem majus fuerit, referant ad te, et ipsi minora tantummodo judicent : leviusque sit tibi, partito in alios onere.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si hoc feceris, implebis imperium Dei, et præcepta ejus poteris sustentare : et omnis hic populus revertetur ad loca sua cum pace.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quibus auditis, Moyses fecit omnia quæ ille suggesserat.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et electis viris strenuis de cuncto Israël, constituit eos principes populi, tribunos, et centuriones, et quinquagenarios, et decanos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui judicabant plebem omni tempore : quidquid autem gravius erat, referebant ad eum, faciliora tantummodo judicantes.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dimisitque cognatum suum : qui reversus abiit in terram suam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/17/"><svg viewBox="0 0 24 24" fill="none" st took Sephora, the wife of Moses, whom he had sent back:\"},{\"verse\":3,\"text\":\"And her two sons, of whom one was called Gersam: his father saying, I have been a stranger in a foreign country.\"},{\"verse\":4,\"text\":\"And the other Eliezer: For the God of my father, said he, is my helper, and hath delivered me from the sword of Pharao.\"},{\"verse\":5,\"text\":\"And Jethro, the kinsman of Moses, came with his sons, and his wife to Moses into the desert, where he was camped by the mountain of God.\"},{\"verse\":6,\"text\":\"And he sent word to Moses, saying: I Jethro, thy kinsman, come to thee, and thy wife, and thy two sons with her.\"},{\"verse\":7,\"text\":\"And he went out to meet his kinsman, and worshipped and kissed him: and they saluted one another with words of peace. And when he was come into the tent,\"},{\"verse\":8,\"text\":\"Moses told his kinsman all that the Lord had done to Pharao, and the Egyptians in favour of Israel: and all the labour which had befallen them in the journey, and that the Lord had delivered them.\"},{\"verse\":9,\"text\":\"And Jethro rejoiced for all the good things that the Lord had done to Israel, because he had delivered them out of the hands of the Egyptians.\"},{\"verse\":10,\"text\":\"And he said: Blessed is the Lord, who hath delivered you out of the hand of Pharao, and out of the hand of Egypt.\"},{\"verse\":11,\"text\":\"Now I know, that the Lord is great above all gods; because he hath delivered his people out of the hand of the Egyptians, who dealt proudly against them.\"},{\"verse\":12,\"text\":\"So Jethro, the kinsman of Moses, offered holocausts and sacrifices to God: and Aaron and all the ancients of Israel came, to eat bread with him before God.\"},{\"verse\":13,\"text\":\"And the next day Moses sat to judge the people, who stood by Moses from morning until night.\"},{\"verse\":14,\"text\":\"And when his kinsman had seen all things that he did among the people, he said: What is it that thou dost among the people? Why sittest thou alone, and all the people wait from morning till night?\"},{\"verse\":15,\"text\":\"And Moses answered him: The people come to me to seek the judgment of God?\"},{\"verse\":16,\"text\":\"And when any controversy falleth out among them, they come to me to judge between them, and to shew the precepts of God, and his laws.\"},{\"verse\":17,\"text\":\"But he said: The thing thou dost is not good.\"},{\"verse\":18,\"text\":\"Thou art spent with foolish labour, both thou, and this people that is with thee; the business is above thy strength, thou alone canst not bear it.\"},{\"verse\":19,\"text\":\"But hear my words and counsels, and God shall be with thee. Be thou to the people in those things that pertain to God, to bring their words to him:\"},{\"verse\":20,\"text\":\"And to shew the people the ceremonies, and the manner of worshipping; and the way wherein they ought to walk, and the work that they ought to do.\"},{\"verse\":21,\"text\":\"And provide out of all the people able men, such as fear God, in whom there is truth, and that hate avarice, and appoint of them rulers of thousands, and of hundreds, and of fifties, and of tens,\"},{\"verse\":22,\"text\":\"Who may judge the people at all times: and when any great matter soever shall fall out, let them refer it to thee, and let them judge the lesser matters only: that so it may be lighter for thee, the burden being shared out unto others.\"},{\"verse\":23,\"text\":\"If thou dost this, thou shalt fulfil the commandment of God, and shalt be able to bear his precepts: and all this people shall return to their places with peace.\"},{\"verse\":24,\"text\":\"And when Moses heard this, he did all things that he had suggested unto him.\"},{\"verse\":25,\"text\":\"And choosing able men out of all Israel, he appointed them rulers of the people, rulers over thousands, and over hundreds, and over fifties, and over tens.\"},{\"verse\":26,\"text\":\"And they judged the people at all times: and whatsoever was of greater difficulty they referred to him, and they judged the easier cases only.\"},{\"verse\":27,\"text\":\"And he let his kinsman depart: and he returned and went into his own country.\"}],\"vul\":[{\"verse\":1,\"text\":\"Cumque audisset Jethro, sacerdos Madian, cognatus Moysi, omnia quæ fecerat Deus Moysi, et Israëli populo suo, et quod eduxisset Dominus Israël de Ægypto,\"},{\"verse\":2,\"text\":\"tulit Sephoram uxorem Moysi quam remiserat,\"},{\"verse\":3,\"text\":\"et duos filios ejus : quorum unus vocabatur Gersam, dicente patre : Advena fui in terra aliena ;\"},{\"verse\":4,\"text\":\"alter vero Eliezer : Deus enim, ait, patris mei adjutor meus, et eruit me de gladio Pharaonis.\"},{\"verse\":5,\"text\":\"Venit ergo Jethro cognatus Moysi, et filii ejus, et uxor ejus ad Moysen in desertum, ubi erat castrametatus juxta montem Dei.\"},{\"verse\":6,\"text\":\"Et mandavit Moysi, dicens : Ego Jethro cognatus tuus venio ad te, et uxor tua, et duo filii cum ea.\"},{\"verse\":7,\"text\":\"Qui egressus in occursum cognati sui, adoravit, et osculatus est eum : salutaveruntque se mutuo verbis pacificis. Cumque intrasset tabernaculum,\"},{\"verse\":8,\"text\":\"narravit Moyses cognato suo cuncta quæ fecerat Dominus Pharaoni et Ægyptiis propter Israël : universumque laborem, qui accidisset eis in itinere, et quod liberaverat eos Dominus.\"},{\"verse\":9,\"text\":\"Lætatusque est Jethro super omnibus bonis, quæ fecerat Dominus Israëli, eo quod eruisset eum de manu Ægyptiorum.\"},{\"verse\":10,\"text\":\"Et ait : Benedictus Dominus, qui liberavit vos de manu Ægyptiorum, et de manu Pharaonis ; qui eruit populum suum de manu Ægypti.\"},{\"verse\":11,\"text\":\"Nunc cognovi, quia magnus Dominus super omnes deos : eo quod superbe egerint contra illos.\"},{\"verse\":12,\"text\":\"Obtulit ergo Jethro cognatus Moysi holocausta et hostias Deo : veneruntque Aaron et omnes seniores Israël, ut comederent panem cum eo coram Deo.\"},{\"verse\":13,\"text\":\"Altera autem die sedit Moyses ut judicaret populum, qui assistebat Moysi a mane usque ad vesperam.\"},{\"verse\":14,\"text\":\"Quod cum vidisset cognatus ejus, omnia scilicet quæ agebat in populo, ait : Quid est hoc quod facis in plebe ? cur solus sedes, et omnis populus præstolatur de mane usque ad vesperam ?\"},{\"verse\":15,\"text\":\"Cui respondit Moyses : Venit ad me populus quærens sententiam Dei :\"},{\"verse\":16,\"text\":\"cumque acciderit eis aliqua disceptatio, veniunt ad me ut judicem inter eos, et ostendam præcepta Dei, et leges ejus.\"},{\"verse\":17,\"text\":\"At ille : Non bonam, inquit, rem facis.\"},{\"verse\":18,\"text\":\"Stulto labore consumeris et tu, et populus iste qui tecum est : ultra vires tuas est negotium ; solus illud non poteris sustinere.\"},{\"verse\":19,\"text\":\"Sed audi verba mea atque consilia, et erit Deus tecum. Esto tu populo in his quæ ad Deum pertinent, ut referas quæ dicuntur ad eum :\"},{\"verse\":20,\"text\":\"ostendasque populo cæremonias et ritum colendi, viamque per quam ingredi debeant, et opus quod facere debeant.\"},{\"verse\":21,\"text\":\"Provide autem de omni plebe viros potentes, et timentes Deum, in quibus sit veritas, et qui oderint avaritiam, et constitue ex eis tribunos, et centuriones, et quinquagenarios, et decanos,\"},{\"verse\":22,\"text\":\"qui judicent populum omni tempore : quidquid autem majus fuerit, referant ad te, et ipsi minora tantummodo judicent : leviusque sit tibi, partito in alios onere.\"},{\"verse\":23,\"text\":\"Si hoc feceris, implebis imperium Dei, et præcepta ejus poteris sustentare : et omnis hic populus revertetur ad loca sua cum pace.\"},{\"verse\":24,\"text\":\"Quibus auditis, Moyses fecit omnia quæ ille suggesserat.\"},{\"verse\":25,\"text\":\"Et electis viris strenuis de cuncto Israël, constituit eos principes populi, tribunos, et centuriones, et quinquagenarios, et decanos.\"},{\"verse\":26,\"text\":\"Qui judicabant plebem omni tempore : quidquid autem gravius erat, referebant ad eum, faciliora tantummodo judicantes.\"},{\"verse\":27,\"text\":\"Dimisitque cognatum suum : qui reversus abiit in terram suam.\"}],\"summary\":\"Jethro bringeth to Moses his wife and children. His counsel.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":17,\"label\":\"Exodus 17\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":19,\"label\":\"Exodus 19\"}}]]\n"])</script></body></html>
