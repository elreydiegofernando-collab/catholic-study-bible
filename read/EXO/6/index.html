"only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord said to Moses: Now thou shalt see what I will do to Pharao: for by a mighty hand shall he let them go, and with a strong hand shall he cast them out of his land.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Lord spoke to Moses, saying: I am the Lord</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>That appeared to Abraham, to Isaac, and to Jacob, by the name of God Almighty: and my name ADONAI I did not shew them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And I made a covenant with them, to give them the land of Chanaan, the land of their pilgrimage wherein they were strangers.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>I have heard the groaning of the children of Israel, wherewith the Egyptians have oppressed them: and I have remembered my covenant.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Therefore say to the children of Israel: I am the Lord who will bring you out from the work-prison of the Egyptians, and will deliver you from bondage: and redeem you with a high arm, and great judgments.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I will take you to myself for my people, I will be your God: and you shall know that I am the Lord your God, who brought you out from the work-prison of the Egyptians:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And brought you into the land, concerning which I lifted up my hand to give it to Abraham, Isaac, and Jacob: and I will give it you to possess: I am the Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Moses told all this to the children of Israel: but they did not hearken to him, for anguish of spirit, and most painful work.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the Lord spoke to Moses, saying:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Go in, and speak to Pharao king of Egypt, that he let the children of Israel go out of his land.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Moses answered before the Lord: Behold the children of Israel do not hearken to me: and how will Pharao hear me, especially as I am of uncircumcised lips?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the Lord spoke to Moses and Aaron, and he gave them a charge unto the children of Israel, and unto Pharao the king of Egypt, that they should bring forth the children of Israel out of the land of Egypt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>These are the heads of their houses by their families. The sons of Ruben the firstborn of Israel: Henoch and Phallu, Hesron and Charmi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>These are the kindreds of Ruben. The sons of Simeon, Jamuel and Jamin, and Ahod, and Jachin, and Soar, and Saul the son of a Chanaanitess: these are the families of Simeon.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And these are the names of the sons of Levi by their kindreds: Gerson, and Caath, and Merari. And the years of the life of Levi were a hundred and thirty-seven.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The sons of Gerson: Lobni and Semei, by their kindreds.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The sons of Caath: Amram, and Isaar, and Hebron and Oziel. And the years of Caath’s life, were a hundred and thirty-three.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The sons of Merari: Moholi and Musi. These are the kindreds of Levi by their families.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Amram took to wife Jochabed his aunt by the father’s side: and she bore him Aaron and Moses. And the years of Amram’s life, were a hundred and thirty-seven.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The sons also of Isaar: Core, and Nepheg, and Zechri.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sons also of Oziel: Mizael, and Elizaphan, and Sethri.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Aaron took to wife Elizabeth the daughter of Aminadab, sister of Nahason, who bore him Nadab, and Abiu, and Eleazar, and Ithamar.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The sons also of Core: Aser, and Elcana, and Abiasaph. These are the kindreds of the Corites.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But Eleazar the son of Aaron took a wife of the daughters of Phutiel: and she bore him Phinees. These are the heads of the Levitical families by their kindreds.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>These are Aaron and Moses, whom the Lord commanded to bring forth the children of Israel out of the land of Egypt by their companies.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>These are they that speak to Pharao, king of Egypt, in order to bring out the children of Israel from Egypt: these are that Moses and Aaron,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In the day when the Lord spoke to Moses in the land of Egypt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the Lord spoke to Moses, saying: I am the Lord; speak thou to Pharao, king of Egypt, all that I say to thee.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Moses said before the Lord: Lo I am of uncircumcised lips, how will Pharao hear me?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixitque Dominus ad Moysen : Nunc videbis quæ facturus sim Pharaoni : per manum enim fortem dimittet eos, et in manu robusta ejiciet illos de terra sua.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Locutusque est Dominus ad Moysen dicens : Ego Dominus</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>qui apparui Abraham, Isaac et Jacob in Deo omnipotente : et nomen meum Adonai non indicavi eis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Pepigique fœdus cum eis, ut darem eis terram Chanaan, terram peregrinationis eorum, in qua fuerunt advenæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ego audivi gemitum filiorum Israël, quo Ægyptii oppresserunt eos : et recordatus sum pacti mei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ideo dic filiis Israël : Ego Dominus qui educam vos de ergastulo Ægyptiorum, et eruam de servitute, ac redimam in brachio excelso et judiciis magnis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et assumam vos mihi in populum, et ero vester Deus : et scietis quod ego sum Dominus Deus vester qui eduxerim vos de ergastulo Ægyptiorum,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et induxerim in terram, super quam levavi manum meam ut darem eam Abraham, Isaac et Jacob : daboque illam vobis possidendam. Ego Dominus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Narravit ergo Moyses omnia filiis Israël : qui non acquieverunt ei propter angustiam spiritus, et opus durissimum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Locutusque est Dominus ad Moysen, dicens :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ingredere, et loquere ad Pharaonem regem Ægypti, ut dimittat filios Israël de terra sua.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Respondit Moyses coram Domino : Ecce filii Israël non audiunt me : et quomodo audiet Pharao, præsertim cum incircumcisus sim labiis ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Locutusque est Dominus ad Moysen et Aaron, et dedit mandatum ad filios Israël, et ad Pharaonem regem Ægypti ut educerent filios Israël de terra Ægypti.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Isti sunt principes domorum per familias suas. Filii Ruben primogeniti Israëlis : Henoch et Phallu, Hesron et Charmi :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>hæ cognationes Ruben. Filii Simeon : Jamuel, et Jamin, et Ahod, et Jachin, et Soar, et Saul filius Chananitidis : hæ progenies Simeon.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et hæc nomina filiorum Levi per cognationes suas : Gerson, et Caath, et Merari. Anni autem vitæ Levi fuerunt centum triginta septem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Filii Gerson : Lobni et Semei, per cognationes suas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Filii Caath : Amram, et Isaar, et Hebron, et Oziel ; anni quoque vitæ Caath, centum triginta tres.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Filii Merari : Moholi et Musi : hæ cognationes Levi per familias suas.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Accepit autem Amram uxorem Jochabed patruelem suam : quæ peperit ei Aaron et Moysen. Fueruntque anni vitæ Amram, centum triginta septem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Filii quoque Isaar : Core, et Nepheg, et Zechri.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Filii quoque Oziel : Misaël, et Elisaphan, et Sethri.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Accepit autem Aaron uxorem Elisabeth filiam Aminadab, sororem Nahason, quæ peperit ei Nadab, et Abiu, et Eleazar, et Ithamar.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Filii quoque Core : Aser, et Elcana, et Abiasaph : hæ sunt cognationes Coritarum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>At vero Eleazar filius Aaron accepit uxorem de filiabus Phutiel : quæ peperit ei Phinees. Hi sunt principes familiarum Leviticarum per cognationes suas.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Iste est Aaron et Moyses, quibus præcepit Dominus ut educerent filios Israël de terra Ægypti per turmas suas.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Hi sunt, qui loquuntur ad Pharaonem regem Ægypti, ut educant filios Israël de Ægypto : iste est Moyses et Aaron,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>in die qua locutus est Dominus ad Moysen, in terra Ægypti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et locutus est Dominus ad Moysen, dicens : Ego Dominus : loquere ad Pharaonem regem Ægypti, omnia quæ ego loquor tibi.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ait Moyses coram Domino : En incircumcisus labiis sum, quomodo audiet me Pharao ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Exodus 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EXO/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Exodus 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->40<!-- --> · swipe left or right to turn the page</p></article>< \"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"EXO.6\",{\"bookId\":2,\"usfm\":\"EXO\",\"bookName\":\"Exodus\",\"drName\":\"Exodus\",\"chapter\":6,\"totalChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"And the Lord said to Moses: Now thou shalt see what I will do to Pharao: for by a mighty hand shall he let them go, and with a strong hand shall he cast them out of his land.\"},{\"verse\":2,\"text\":\"And the Lord spoke to Moses, saying: I am the Lord\"},{\"verse\":3,\"text\":\"That appeared to Abraham, to Isaac, and to Jacob, by the name of God Almighty: and my name ADONAI I did not shew them.\"},{\"verse\":4,\"text\":\"And I made a covenant with them, to give them the land of Chanaan, the land of their pilgrimage wherein they were strangers.\"},{\"verse\":5,\"text\":\"I have heard the groaning of the children of Israel, wherewith the Egyptians have oppressed them: and I have remembered my covenant.\"},{\"verse\":6,\"text\":\"Therefore say to the children of Israel: I am the Lord who will bring you out from the work-prison of the Egyptians, and will deliver you from bondage: and redeem you with a high arm, and great judgments.\"},{\"verse\":7,\"text\":\"And I will take you to myself for my people, I will be your God: and you shall know that I am the Lord your God, who brought you out from the work-prison of the Egyptians:\"},{\"verse\":8,\"text\":\"And brought you into the land, concerning which I lifted up my hand to give it to Abraham, Isaac, and Jacob: and I will give it you to possess: I am the Lord.\"},{\"verse\":9,\"text\":\"And Moses told all this to the children of Israel: but they did not hearken to him, for anguish of spirit, and most painful work.\"},{\"verse\":10,\"text\":\"And the Lord spoke to Moses, saying:\"},{\"verse\":11,\"text\":\"Go in, and speak to Pharao king of Egypt, that he let the children of Israel go out of his land.\"},{\"verse\":12,\"text\":\"Moses answered before the Lord: Behold the children of Israel do not hearken to me: and how will Pharao hear me, especially as I am of uncircumcised lips?\"},{\"verse\":13,\"text\":\"And the Lord spoke to Moses and Aaron, and he gave them a charge unto the children of Israel, and unto Pharao the king of Egypt, that they should bring forth the children of Israel out of the land of Egypt.\"},{\"verse\":14,\"text\":\"These are the heads of their houses by their families. The sons of Ruben the firstborn of Israel: Henoch and Phallu, Hesron and Charmi.\"},{\"verse\":15,\"text\":\"These are the kindreds of Ruben. The sons of Simeon, Jamuel and Jamin, and Ahod, and Jachin, and Soar, and Saul the son of a Chanaanitess: these are the families of Simeon.\"},{\"verse\":16,\"text\":\"And these are the names of the sons of Levi by their kindreds: Gerson, and Caath, and Merari. And the years of the life of Levi were a hundred and thirty-seven.\"},{\"verse\":17,\"text\":\"The sons of Gerson: Lobni and Semei, by their kindreds.\"},{\"verse\":18,\"text\":\"The sons of Caath: Amram, and Isaar, and Hebron and Oziel. And the years of Caath’s life, were a hundred and thirty-three.\"},{\"verse\":19,\"text\":\"The sons of Merari: Moholi and Musi. These are the kindreds of Levi by their families.\"},{\"verse\":20,\"text\":\"And Amram took to wife Jochabed his aunt by the father’s side: and she bore him Aaron and Moses. And the years of Amram’s life, were a hundred and thirty-seven.\"},{\"verse\":21,\"text\":\"The sons also of Isaar: Core, and Nepheg, and Zechri.\"},{\"verse\":22,\"text\":\"The sons also of Oziel: Mizael, and Elizaphan, and Sethri.\"},{\"verse\":23,\"text\":\"And Aaron took to wife Elizabeth the daughter of Aminadab, sister of Nahason, who bore him Nadab, and Abiu, and Eleazar, and Ithamar.\"},{\"verse\":24,\"text\":\"The sons also of Core: Aser, and Elcana, and Abiasaph. These are the kindreds of the Corites.\"},{\"verse\":25,\"text\":\"But Eleazar the son of Aaron took a wife of the daughters of Phutiel: and she bore him Phinees. These are the heads of the Levitical families by their kindreds.\"},{\"verse\":26,\"text\":\"These are Aaron and Moses, whom the Lord commanded to bring forth the children of Israel out of the land of Egypt by their companies.\"},{\"verse\":27,\"text\":\"These are they that speak to Pharao, king of Egypt, in order to bring out the children of Israel from Egypt: these are that Moses and Aaron,\"},{\"verse\":28,\"text\":\"In the day when the Lord spoke to Moses in the land of Egypt.\"},{\"verse\":29,\"text\":\"And the Lord spoke to Moses, saying: I am the Lord; speak thou to Pharao, king of Egypt, all that I say to thee.\"},{\"verse\":30,\"text\":\"And Moses said before the Lord: Lo I am of uncircumcised lips, how will Pharao hear me?\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixitque Dominus ad Moysen : Nunc videbis quæ facturus sim Pharaoni : per manum enim fortem dimittet eos, et in manu robusta ejiciet illos de terra sua.\"},{\"verse\":2,\"text\":\"Locutusque est Dominus ad Moysen dicens : Ego Dominus\"},{\"verse\":3,\"text\":\"qui apparui Abraham, Isaac et Jacob in Deo omnipotente : et nomen meum Adonai non indicavi eis.\"},{\"verse\":4,\"text\":\"Pepigique fœdus cum eis, ut darem eis terram Chanaan, terram peregrinationis eorum, in qua fuerunt advenæ.\"},{\"verse\":5,\"text\":\"Ego audivi gemitum filiorum Israël, quo Ægyptii oppresserunt eos : et recordatus sum pacti mei.\"},{\"verse\":6,\"text\":\"Ideo dic filiis Israël : Ego Dominus qui educam vos de ergastulo Ægyptiorum, et eruam de servitute, ac redimam in brachio excelso et judiciis magnis.\"},{\"verse\":7,\"text\":\"Et assumam vos mihi in populum, et ero vester Deus : et scietis quod ego sum Dominus Deus vester qui eduxerim vos de ergastulo Ægyptiorum,\"},{\"verse\":8,\"text\":\"et induxerim in terram, super quam levavi manum meam ut darem eam Abraham, Isaac et Jacob : daboque illam vobis possidendam. Ego Dominus.\"},{\"verse\":9,\"text\":\"Narravit ergo Moyses omnia filiis Israël : qui non acquieverunt ei propter angustiam spiritus, et opus durissimum.\"},{\"verse\":10,\"text\":\"Locutusque est Dominus ad Moysen, dicens :\"},{\"verse\":11,\"text\":\"Ingredere, et loquere ad Pharaonem regem Ægypti, ut dimittat filios Israël de terra sua.\"},{\"verse\":12,\"text\":\"Respondit Moyses coram Domino : Ecce filii Israël non audiunt me : et quomodo audiet Pharao, præsertim cum incircumcisus sim labiis ?\"},{\"verse\":13,\"text\":\"Locutusque est Dominus ad Moysen et Aaron, et dedit mandatum ad filios Israël, et ad Pharaonem regem Ægypti ut educerent filios Israël de terra Ægypti.\"},{\"verse\":14,\"text\":\"Isti sunt principes domorum per familias suas. Filii Ruben primogeniti Israëlis : Henoch et Phallu, Hesron et Charmi :\"},{\"verse\":15,\"text\":\"hæ cognationes Ruben. Filii Simeon : Jamuel, et Jamin, et Ahod, et Jachin, et Soar, et Saul filius Chananitidis : hæ progenies Simeon.\"},{\"verse\":16,\"text\":\"Et hæc nomina filiorum Levi per cognationes suas : Gerson, et Caath, et Merari. Anni autem vitæ Levi fuerunt centum triginta septem.\"},{\"verse\":17,\"text\":\"Filii Gerson : Lobni et Semei, per cognationes suas.\"},{\"verse\":18,\"text\":\"Filii Caath : Amram, et Isaar, et Hebron, et Oziel ; anni quoque vitæ Caath, centum triginta tres.\"},{\"verse\":19,\"text\":\"Filii Merari : Moholi et Musi : hæ cognationes Levi per familias suas.\"},{\"verse\":20,\"text\":\"Accepit autem Amram uxorem Jochabed patruelem suam : quæ peperit ei Aaron et Moysen. Fueruntque anni vitæ Amram, centum triginta septem.\"},{\"verse\":21,\"text\":\"Filii quoque Isaar : Core, et Nepheg, et Zechri.\"},{\"verse\":22,\"text\":\"Filii quoque Oziel : Misaël, et Elisaphan, et Sethri.\"},{\"verse\":23,\"text\":\"Accepit autem Aaron uxorem Elisabeth filiam Aminadab, sororem Nahason, quæ peperit ei Nadab, et Abiu, et Eleazar, et Ithamar.\"},{\"verse\":24,\"text\":\"Filii quoque Core : Aser, et Elcana, et Abiasaph : hæ sunt cognationes Coritarum.\"},{\"verse\":25,\"text\":\"At vero Eleazar filius Aaron accepit uxorem de filiabus Phutiel : quæ peperit ei Phinees. Hi sunt principes familiarum Leviticarum per cognationes suas.\"},{\"verse\":26,\"text\":\"Iste est Aaron et Moyses, quibus præcepit Dominus ut educerent filios Israël de terra Ægypti per turmas suas.\"},{\"verse\":27,\"text\":\"Hi sunt, qui loquuntur ad Pharaonem regem Ægypti, ut educant filios Israël de Ægypto : iste est Moyses et Aaron,\"},{\"verse\":28,\"text\":\"in die qua locutus est Dominus ad Moysen, in terra Ægypti.\"},{\"verse\":29,\"text\":\"Et locutus est Dominus ad Moysen, dicens : Ego Dominus : loquere ad Pharaonem regem Ægypti, omnia quæ ego loquor tibi.\"},{\"verse\":30,\"text\":\"Et ait Moyses coram Domino : En incircumcisus labiis sum, quomodo audiet me Pharao ?\"}],\"summary\":\"God reneweth his promise. The genealogies of Ruben, Simon and Levi, down to Moses and Aaron.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":5,\"label\":\"Exodus 5\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":7,\"label\":\"Exodus 7\"}}]]\n"])</script></body></html>
