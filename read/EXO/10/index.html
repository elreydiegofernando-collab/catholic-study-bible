[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Exodus<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EXO/">About <!-- -->Exodus</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The eighth plague of the locusts. The ninth, of darkness: Pharao is still hardened.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the Lord said to Moses: Go in to Pharao; for I have hardened his heart, and the heart of his servants: that I may work these my signs in him,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And thou mayst tell in the ears of thy sons, and of thy grandsons, how often I have plagued the Egyptians, and wrought my signs amongst them: and you may know that I am the Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Therefore Moses and Aaron went in to Pharao, and said to him: Thus saith the Lord God of the Hebrews: How long refusest thou to submit to me? let my people go, to sacrifice to me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But if thou resist, and wilt not let them go, behold I will bring in to-morrow the locusts into thy coasts;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>To cover the face of the earth, that nothing thereof may appear, but that which the hail hath left may be eaten: for they shall feed upon all the trees that spring in the fields.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And they shall fill thy houses, and the houses of thy servants, and of all the Egyptians: such a number as thy fathers have not seen, nor thy grandfathers, from the time they were first upon the earth, until this present day. And he turned himself away, and went forth from Pharao.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Pharao’s servants said to him: How long shall we endure this scandal? Iet the men go to sacrifice to the Lord their God. Dost thou not see that Egypt is undone?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they called back Moses, and Aaron, to Pharao; and he said to them: Go, sacrifice to the Lord your God: who are they that shall go?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Moses said: We will go with our young and old, with our sons and daughters, with our sheep and herds: for it is the solemnity of the Lord our God.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Pharao answered: So be the Lord with you, as I shall let you and your children go: who can doubt but that you intend some great evil?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>It shall not be so, but go ye men only, and sacrifice to the Lord: for this yourselves also desired. And immediately they were cast out from Pharao’s presence.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the Lord said to Moses: Stretch forth thy hand upon the land of Egypt unto the locust, that it come upon it, and devour every herb that is left after the hail.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Moses stretched forth his rod upon the land of Egypt: and the Lord brought a burning wind all that day, and night; and when it was morning, the burning wind raised the locusts.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they came up over the whole land of Egypt; and rested in all the coasts of the Egyptians, innumerable, the like as had not been before that time, nor shall be hereafter.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they covered the whole face of the earth, wasting all things. And the grass of the earth was devoured, and what fruits soever were on the trees, which the hail had left; and there remained not any thing that was green on the trees, or in the herbs of the earth, in all Egypt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Wherefore Pharao in haste called Moses and Aaron, and said to them: I have sinned against the Lord your God, and against you.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But now forgive me my sin this time also, and pray to the Lord your God, that he take away from me this death.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And Moses going forth from the presence of Pharao, prayed to the Lord:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he made a very strong wind to blow from the west, and it took the locusts and cast them into the Red Sea: there remained not so much as one in all the coasts of Egypt.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the Lord hardened Pharao’s heart, neither did he let the children of Israel go.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the Lord said to Moses: Stretch out thy hand towards heaven: and may there be darkness upon the land of Egypt so thick that it may be felt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And Moses stretched forth his hand towards heaven: and there came horrible darkness in all the land of Egypt for three days.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>No man saw his brother, nor moved himself out of the place where he was: but wheresoever the children of Israel dwelt, there was light.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Pharao called Moses and Aaron, and said to them: Go, sacrifice to the Lord: let your sheep only, and herds remain, let your children go with you.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Moses said: Thou shalt give us also sacrifices and burnt-offerings, to the Lord our God.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>All the flocks shall go with us; there shall not a hoof remain of them: for they are necessary for the service of the Lord our God: especially as we know not what must be offered, till we come to the very place.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And the Lord hardened Pharao’s heart, and he would not let them go.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And Pharao said to Moses: Get thee from me, and beware thou see not my face any more: in what day soever thou shalt come in my sight, thou shalt die.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Moses answered: So shall it be as thou hast spoken, I will not see thy face anymore.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et dixit Dominus ad Moysen : Ingredere ad Pharaonem : ego enim induravi cor ejus, et servorum illius, ut faciam signa mea hæc in eo :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et narres in auribus filii tui, et nepotum tuorum, quoties contriverim Ægyptios, et signa mea fecerim in eis : et sciatis quia ego Dominus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Introierunt ergo Moyses et Aaron ad Pharaonem, et dixerunt ei : Hæc dicit Dominus Deus Hebræorum : Usquequo non vis subjici mihi ? dimitte populum meum, ut sacrificet mihi.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sin autem resistis, et non vis dimittere eum : ecce ego inducam cras locustam in fines tuos :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quæ operiat superficiem terræ, ne quidquam ejus appareat, sed comedatur quod residuum fuerit grandini : corrodet enim omnia ligna quæ germinant in agris.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et implebunt domos tuas, et servorum tuorum, et omnium Ægyptiorum, quantam non viderunt patres tui, et avi, ex quo orti sunt super terram, usque in præsentem diem. Avertitque se, et egressus est a Pharaone.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixerunt autem servi Pharaonis ad eum : Usquequo patiemur hoc scandalum ? dimitte homines, ut sacrificent Domino Deo suo ; nonne vides quod perierit Ægyptus ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Revocaveruntque Moysen et Aaron ad Pharaonem : qui dixit eis : Ite, sacrificate Domino Deo vestro : quinam sunt qui ituri sunt ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ait Moyses : Cum parvulis nostris, et senioribus pergemus, cum filiis et filiabus, cum ovibus et armentis : est enim solemnitas Domini Dei nostri.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et respondit Pharao : Sic Dominus sit vobiscum, quomodo ego dimittam vos, et parvulos vestros, cui dubium est quod pessime cogitetis ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>non fiet ita, sed ite tantum viri, et sacrificate Domino : hoc enim et ipsi petistis. Statimque ejecti sunt de conspectu Pharaonis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixit autem Dominus ad Moysen : Extende manum tuam super terram Ægypti ad locustam, ut ascendat super eam, et devoret omnem herbam quæ residua fuerit grandini.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et extendit Moyses virgam super terram Ægypti : et Dominus induxit ventum urentem tota die illa et nocte : et mane facto, ventus urens levavit locustas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quæ ascenderunt super universam terram Ægypti : et sederunt in cunctis finibus Ægyptiorum innumerabiles, quales ante illud tempus non fuerant, nec postea futuræ sunt.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Operueruntque universam superficiem terræ, vastantes omnia. Devorata est igitur herba terræ, et quidquid pomorum in arboribus fuit, quæ grando dimiserat : nihilque omnino virens relictum est in lignis et in herbis terræ, in cuncta Ægypto.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quam ob rem festinus Pharao vocavit Moysen et Aaron, et dixit eis : Peccavi in Dominum Deum vestrum, et in vos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sed nunc dimittite peccatum mihi etiam hac vice, et rogate Dominum Deum vestrum, ut auferat a me mortem istam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Egressusque Moyses de conspectu Pharaonis, oravit Dominum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui flare fecit ventum ab occidente vehementissimum, et arreptam locustam projecit in mare Rubrum : non remansit ne una quidem in cunctis finibus Ægypti.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et induravit Dominus cor Pharaonis, nec dimisit filios Israël.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dixit autem Dominus ad Moysen : Extende manum tuam in cælum : et sint tenebræ super terram Ægypti tam densæ, ut palpari queant.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Extenditque Moyses manum in cælum : et factæ sunt tenebræ horribiles in universa terra Ægypti tribus diebus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Nemo vidit fratrem suum, nec movit se de loco in quo erat : ubicumque autem habitabant filii Israël, lux erat.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Vocavitque Pharao Moysen et Aaron, et dixit eis : Ite, sacrificate Domino : oves tantum vestræ et armenta remaneant, parvuli vestri eant vobiscum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ait Moyses : Hostias quoque et holocausta dabis nobis, quæ offeramus Domino Deo nostro.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cuncti greges pergent nobiscum ; non remanebit ex eis ungula : quæ necessaria sunt in cultum Domini Dei nostri : præsertim cum ignoremus quid debeat immolari, donec ad ipsum locum perveniamus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Induravit autem Dominus cor Pharaonis, et noluit dimittere eos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dixitque Pharao ad Moysen : Recede a me, et cave ne ultra videas faciem meam : quocumque die apparueris mihi, morieris.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Respondit Moyses : Ita fiet ut locutus es : non videbo ultra faciem tuam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study- talChapters\":40,\"dra\":[{\"verse\":1,\"text\":\"And the Lord said to Moses: Go in to Pharao; for I have hardened his heart, and the heart of his servants: that I may work these my signs in him,\"},{\"verse\":2,\"text\":\"And thou mayst tell in the ears of thy sons, and of thy grandsons, how often I have plagued the Egyptians, and wrought my signs amongst them: and you may know that I am the Lord.\"},{\"verse\":3,\"text\":\"Therefore Moses and Aaron went in to Pharao, and said to him: Thus saith the Lord God of the Hebrews: How long refusest thou to submit to me? let my people go, to sacrifice to me.\"},{\"verse\":4,\"text\":\"But if thou resist, and wilt not let them go, behold I will bring in to-morrow the locusts into thy coasts;\"},{\"verse\":5,\"text\":\"To cover the face of the earth, that nothing thereof may appear, but that which the hail hath left may be eaten: for they shall feed upon all the trees that spring in the fields.\"},{\"verse\":6,\"text\":\"And they shall fill thy houses, and the houses of thy servants, and of all the Egyptians: such a number as thy fathers have not seen, nor thy grandfathers, from the time they were first upon the earth, until this present day. And he turned himself away, and went forth from Pharao.\"},{\"verse\":7,\"text\":\"And Pharao’s servants said to him: How long shall we endure this scandal? Iet the men go to sacrifice to the Lord their God. Dost thou not see that Egypt is undone?\"},{\"verse\":8,\"text\":\"And they called back Moses, and Aaron, to Pharao; and he said to them: Go, sacrifice to the Lord your God: who are they that shall go?\"},{\"verse\":9,\"text\":\"Moses said: We will go with our young and old, with our sons and daughters, with our sheep and herds: for it is the solemnity of the Lord our God.\"},{\"verse\":10,\"text\":\"And Pharao answered: So be the Lord with you, as I shall let you and your children go: who can doubt but that you intend some great evil?\"},{\"verse\":11,\"text\":\"It shall not be so, but go ye men only, and sacrifice to the Lord: for this yourselves also desired. And immediately they were cast out from Pharao’s presence.\"},{\"verse\":12,\"text\":\"And the Lord said to Moses: Stretch forth thy hand upon the land of Egypt unto the locust, that it come upon it, and devour every herb that is left after the hail.\"},{\"verse\":13,\"text\":\"And Moses stretched forth his rod upon the land of Egypt: and the Lord brought a burning wind all that day, and night; and when it was morning, the burning wind raised the locusts.\"},{\"verse\":14,\"text\":\"And they came up over the whole land of Egypt; and rested in all the coasts of the Egyptians, innumerable, the like as had not been before that time, nor shall be hereafter.\"},{\"verse\":15,\"text\":\"And they covered the whole face of the earth, wasting all things. And the grass of the earth was devoured, and what fruits soever were on the trees, which the hail had left; and there remained not any thing that was green on the trees, or in the herbs of the earth, in all Egypt.\"},{\"verse\":16,\"text\":\"Wherefore Pharao in haste called Moses and Aaron, and said to them: I have sinned against the Lord your God, and against you.\"},{\"verse\":17,\"text\":\"But now forgive me my sin this time also, and pray to the Lord your God, that he take away from me this death.\"},{\"verse\":18,\"text\":\"And Moses going forth from the presence of Pharao, prayed to the Lord:\"},{\"verse\":19,\"text\":\"And he made a very strong wind to blow from the west, and it took the locusts and cast them into the Red Sea: there remained not so much as one in all the coasts of Egypt.\"},{\"verse\":20,\"text\":\"And the Lord hardened Pharao’s heart, neither did he let the children of Israel go.\"},{\"verse\":21,\"text\":\"And the Lord said to Moses: Stretch out thy hand towards heaven: and may there be darkness upon the land of Egypt so thick that it may be felt.\"},{\"verse\":22,\"text\":\"And Moses stretched forth his hand towards heaven: and there came horrible darkness in all the land of Egypt for three days.\"},{\"verse\":23,\"text\":\"No man saw his brother, nor moved himself out of the place where he was: but wheresoever the children of Israel dwelt, there was light.\"},{\"verse\":24,\"text\":\"And Pharao called Moses and Aaron, and said to them: Go, sacrifice to the Lord: let your sheep only, and herds remain, let your children go with you.\"},{\"verse\":25,\"text\":\"Moses said: Thou shalt give us also sacrifices and burnt-offerings, to the Lord our God.\"},{\"verse\":26,\"text\":\"All the flocks shall go with us; there shall not a hoof remain of them: for they are necessary for the service of the Lord our God: especially as we know not what must be offered, till we come to the very place.\"},{\"verse\":27,\"text\":\"And the Lord hardened Pharao’s heart, and he would not let them go.\"},{\"verse\":28,\"text\":\"And Pharao said to Moses: Get thee from me, and beware thou see not my face any more: in what day soever thou shalt come in my sight, thou shalt die.\"},{\"verse\":29,\"text\":\"Moses answered: So shall it be as thou hast spoken, I will not see thy face anymore.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et dixit Dominus ad Moysen : Ingredere ad Pharaonem : ego enim induravi cor ejus, et servorum illius, ut faciam signa mea hæc in eo :\"},{\"verse\":2,\"text\":\"et narres in auribus filii tui, et nepotum tuorum, quoties contriverim Ægyptios, et signa mea fecerim in eis : et sciatis quia ego Dominus.\"},{\"verse\":3,\"text\":\"Introierunt ergo Moyses et Aaron ad Pharaonem, et dixerunt ei : Hæc dicit Dominus Deus Hebræorum : Usquequo non vis subjici mihi ? dimitte populum meum, ut sacrificet mihi.\"},{\"verse\":4,\"text\":\"Sin autem resistis, et non vis dimittere eum : ecce ego inducam cras locustam in fines tuos :\"},{\"verse\":5,\"text\":\"quæ operiat superficiem terræ, ne quidquam ejus appareat, sed comedatur quod residuum fuerit grandini : corrodet enim omnia ligna quæ germinant in agris.\"},{\"verse\":6,\"text\":\"Et implebunt domos tuas, et servorum tuorum, et omnium Ægyptiorum, quantam non viderunt patres tui, et avi, ex quo orti sunt super terram, usque in præsentem diem. Avertitque se, et egressus est a Pharaone.\"},{\"verse\":7,\"text\":\"Dixerunt autem servi Pharaonis ad eum : Usquequo patiemur hoc scandalum ? dimitte homines, ut sacrificent Domino Deo suo ; nonne vides quod perierit Ægyptus ?\"},{\"verse\":8,\"text\":\"Revocaveruntque Moysen et Aaron ad Pharaonem : qui dixit eis : Ite, sacrificate Domino Deo vestro : quinam sunt qui ituri sunt ?\"},{\"verse\":9,\"text\":\"Ait Moyses : Cum parvulis nostris, et senioribus pergemus, cum filiis et filiabus, cum ovibus et armentis : est enim solemnitas Domini Dei nostri.\"},{\"verse\":10,\"text\":\"Et respondit Pharao : Sic Dominus sit vobiscum, quomodo ego dimittam vos, et parvulos vestros, cui dubium est quod pessime cogitetis ?\"},{\"verse\":11,\"text\":\"non fiet ita, sed ite tantum viri, et sacrificate Domino : hoc enim et ipsi petistis. Statimque ejecti sunt de conspectu Pharaonis.\"},{\"verse\":12,\"text\":\"Dixit autem Dominus ad Moysen : Extende manum tuam super terram Ægypti ad locustam, ut ascendat super eam, et devoret omnem herbam quæ residua fuerit grandini.\"},{\"verse\":13,\"text\":\"Et extendit Moyses virgam super terram Ægypti : et Dominus induxit ventum urentem tota die illa et nocte : et mane facto, ventus urens levavit locustas.\"},{\"verse\":14,\"text\":\"Quæ ascenderunt super universam terram Ægypti : et sederunt in cunctis finibus Ægyptiorum innumerabiles, quales ante illud tempus non fuerant, nec postea futuræ sunt.\"},{\"verse\":15,\"text\":\"Operueruntque universam superficiem terræ, vastantes omnia. Devorata est igitur herba terræ, et quidquid pomorum in arboribus fuit, quæ grando dimiserat : nihilque omnino virens relictum est in lignis et in herbis terræ, in cuncta Ægypto.\"},{\"verse\":16,\"text\":\"Quam ob rem festinus Pharao vocavit Moysen et Aaron, et dixit eis : Peccavi in Dominum Deum vestrum, et in vos.\"},{\"verse\":17,\"text\":\"Sed nunc dimittite peccatum mihi etiam hac vice, et rogate Dominum Deum vestrum, ut auferat a me mortem istam.\"},{\"verse\":18,\"text\":\"Egressusque Moyses de conspectu Pharaonis, oravit Dominum.\"},{\"verse\":19,\"text\":\"Qui flare fecit ventum ab occidente vehementissimum, et arreptam locustam projecit in mare Rubrum : non remansit ne una quidem in cunctis finibus Ægypti.\"},{\"verse\":20,\"text\":\"Et induravit Dominus cor Pharaonis, nec dimisit filios Israël.\"},{\"verse\":21,\"text\":\"Dixit autem Dominus ad Moysen : Extende manum tuam in cælum : et sint tenebræ super terram Ægypti tam densæ, ut palpari queant.\"},{\"verse\":22,\"text\":\"Extenditque Moyses manum in cælum : et factæ sunt tenebræ horribiles in universa terra Ægypti tribus diebus.\"},{\"verse\":23,\"text\":\"Nemo vidit fratrem suum, nec movit se de loco in quo erat : ubicumque autem habitabant filii Israël, lux erat.\"},{\"verse\":24,\"text\":\"Vocavitque Pharao Moysen et Aaron, et dixit eis : Ite, sacrificate Domino : oves tantum vestræ et armenta remaneant, parvuli vestri eant vobiscum.\"},{\"verse\":25,\"text\":\"Ait Moyses : Hostias quoque et holocausta dabis nobis, quæ offeramus Domino Deo nostro.\"},{\"verse\":26,\"text\":\"Cuncti greges pergent nobiscum ; non remanebit ex eis ungula : quæ necessaria sunt in cultum Domini Dei nostri : præsertim cum ignoremus quid debeat immolari, donec ad ipsum locum perveniamus.\"},{\"verse\":27,\"text\":\"Induravit autem Dominus cor Pharaonis, et noluit dimittere eos.\"},{\"verse\":28,\"text\":\"Dixitque Pharao ad Moysen : Recede a me, et cave ne ultra videas faciem meam : quocumque die apparueris mihi, morieris.\"},{\"verse\":29,\"text\":\"Respondit Moyses : Ita fiet ut locutus es : non videbo ultra faciem tuam.\"}],\"summary\":\"The eighth plague of the locusts. The ninth, of darkness: Pharao is still hardened.\",\"intro\":null,\"prev\":{\"usfm\":\"EXO\",\"chapter\":9,\"label\":\"Exodus 9\"},\"next\":{\"usfm\":\"EXO\",\"chapter\":11,\"label\":\"Exodus 11\"}}]]\n"])</script></body></html>
