s="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dearly beloved, believe not every spirit, but try the spirits if they be of God: because many false prophets are gone out into the world.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>By this is the spirit of God known. Every spirit which confesseth that Jesus Christ is come in the flesh is of God:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And every spirit that dissolveth Jesus is not of God. And this is Antichrist, of whom you have heard that he cometh: and he is now already in the world.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>You are of God, little children, and have overcome him. Because greater is he that is in you, than he that is in the world.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>They are of the world. Therefore of the world they speak: and the world heareth them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>We are of God. He that knoweth God heareth us. He that is not of God heareth us not. By this we know the spirit of truth and the spirit of error.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dearly beloved, let us love one another: for charity is of God. And every one that loveth is born of God and knoweth God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that loveth not knoweth not God: for God is charity.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>By this hath the charity of God appeared towards us, because God hath sent his only begotten Son into the world, that we may live by him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In this is charity: not as though we had loved God, but because he hath first loved us, and sent his Son to be a propitiation for our sins.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My dearest, if God hath so loved us, we also ought to love one another.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>No man hath seen God at any time. If we love one another, God abideth in us: and his charity is perfected in us.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In this we know that we abide in him, and he in us: because he hath given us of his spirit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And we have seen and do testify that the Father hath sent his Son to be the Saviour of the world.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Whosoever shall confess that Jesus is the Son of God, God abideth in him, and he in God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And we have known and have believed the charity which God hath to us. God is charity: and he that abideth in charity abideth in God, and God in him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In this is the charity of God perfected with us, that we may have confidence in the day of judgment: because as he is, we also are in this world.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Fear is not in charity: but perfect charity casteth out fear, because fear hath pain. And he that feareth is not perfected in charity.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let us therefore love God: because God first hath loved us.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>If any man say: I love God, and hateth his brother; he is a liar. For he that loveth not his brother whom he seeth, how can he love God whom he seeth not?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And this commandment we have from God, that he who loveth God love also his brother.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Carissimi, nolite omni spiritui credere, sed probate spiritus si ex Deo sint : quoniam multi pseudoprophetæ exierunt in mundum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In hoc cognoscitur Spiritus Dei : omnis spiritus qui confitetur Jesum Christum in carne venisse, ex Deo est :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et omnis spiritus qui solvit Jesum, ex Deo non est, et hic est antichristus, de quo audistis quoniam venit, et nunc jam in mundo est.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Vos ex Deo estis filioli, et vicistis eum, quoniam major est qui in vobis est, quam qui in mundo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ipsi de mundo sunt : ideo de mundo loquuntur, et mundus eos audit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nos ex Deo sumus. Qui novit Deum, audit nos ; qui non est ex Deo, non audit nos : in hoc cognoscimus Spiritum veritatis, et spiritum erroris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Carissimi, diligamus nos invicem : quia caritas ex Deo est. Et omnis qui diligit, ex Deo natus est, et cognoscit Deum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui non diligit, non novit Deum : quoniam Deus caritas est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In hoc apparuit caritas Dei in nobis, quoniam Filium suum unigenitum misit Deus in mundum, ut vivamus per eum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In hoc est caritas : non quasi nos dilexerimus Deum, sed quoniam ipse prior dilexit nos, et misit Filium suum propitiationem pro peccatis nostris.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Carissimi, si sic Deus dilexit nos : et nos debemus alterutrum diligere.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deum nemo vidit umquam. Si diligamus invicem, Deus in nobis manet, et caritas ejus in nobis perfecta est.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>In hoc cognoscimus quoniam in eo manemus, et ipse in nobis : quoniam de Spiritu suo dedit nobis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et nos vidimus, et testificamur quoniam Pater misit Filium suum Salvatorem mundi.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quisquis confessus fuerit quoniam Jesus est Filius Dei, Deus in eo manet, et ipse in Deo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et nos cognovimus, et credidimus caritati, quam habet Deus in nobis. Deus caritas est : et qui manet in caritate, in Deo manet, et Deus in eo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In hoc perfecta est caritas Dei nobiscum, ut fiduciam habeamus in die judicii : quia sicut ille est, et nos sumus in hoc mundo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Timor non est in caritate : sed perfecta caritas foras mittit timorem, quoniam timor pœnam habet : qui autem timet, non est perfectus in caritate.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Nos ergo diligamus Deum, quoniam Deus prior dilexit nos.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si quis dixerit : Quoniam diligo Deum, et fratrem suum oderit, mendax est. Qui enim non diligit fratrem suum quem vidit, Deum, quem non vidit, quomodo potest diligere ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et hoc mandatum habemus a Deo : ut qui diligit Deum, diligat et fratrem suum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1JN/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 John 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1JN/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 John 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class  another: for charity is of God. And every one that loveth is born of God and knoweth God.\"},{\"verse\":8,\"text\":\"He that loveth not knoweth not God: for God is charity.\"},{\"verse\":9,\"text\":\"By this hath the charity of God appeared towards us, because God hath sent his only begotten Son into the world, that we may live by him.\"},{\"verse\":10,\"text\":\"In this is charity: not as though we had loved God, but because he hath first loved us, and sent his Son to be a propitiation for our sins.\"},{\"verse\":11,\"text\":\"My dearest, if God hath so loved us, we also ought to love one another.\"},{\"verse\":12,\"text\":\"No man hath seen God at any time. If we love one another, God abideth in us: and his charity is perfected in us.\"},{\"verse\":13,\"text\":\"In this we know that we abide in him, and he in us: because he hath given us of his spirit.\"},{\"verse\":14,\"text\":\"And we have seen and do testify that the Father hath sent his Son to be the Saviour of the world.\"},{\"verse\":15,\"text\":\"Whosoever shall confess that Jesus is the Son of God, God abideth in him, and he in God.\"},{\"verse\":16,\"text\":\"And we have known and have believed the charity which God hath to us. God is charity: and he that abideth in charity abideth in God, and God in him.\"},{\"verse\":17,\"text\":\"In this is the charity of God perfected with us, that we may have confidence in the day of judgment: because as he is, we also are in this world.\"},{\"verse\":18,\"text\":\"Fear is not in charity: but perfect charity casteth out fear, because fear hath pain. And he that feareth is not perfected in charity.\"},{\"verse\":19,\"text\":\"Let us therefore love God: because God first hath loved us.\"},{\"verse\":20,\"text\":\"If any man say: I love God, and hateth his brother; he is a liar. For he that loveth not his brother whom he seeth, how can he love God whom he seeth not?\"},{\"verse\":21,\"text\":\"And this commandment we have from God, that he who loveth God love also his brother.\"}],\"vul\":[{\"verse\":1,\"text\":\"Carissimi, nolite omni spiritui credere, sed probate spiritus si ex Deo sint : quoniam multi pseudoprophetæ exierunt in mundum.\"},{\"verse\":2,\"text\":\"In hoc cognoscitur Spiritus Dei : omnis spiritus qui confitetur Jesum Christum in carne venisse, ex Deo est :\"},{\"verse\":3,\"text\":\"et omnis spiritus qui solvit Jesum, ex Deo non est, et hic est antichristus, de quo audistis quoniam venit, et nunc jam in mundo est.\"},{\"verse\":4,\"text\":\"Vos ex Deo estis filioli, et vicistis eum, quoniam major est qui in vobis est, quam qui in mundo.\"},{\"verse\":5,\"text\":\"Ipsi de mundo sunt : ideo de mundo loquuntur, et mundus eos audit.\"},{\"verse\":6,\"text\":\"Nos ex Deo sumus. Qui novit Deum, audit nos ; qui non est ex Deo, non audit nos : in hoc cognoscimus Spiritum veritatis, et spiritum erroris.\"},{\"verse\":7,\"text\":\"Carissimi, diligamus nos invicem : quia caritas ex Deo est. Et omnis qui diligit, ex Deo natus est, et cognoscit Deum.\"},{\"verse\":8,\"text\":\"Qui non diligit, non novit Deum : quoniam Deus caritas est.\"},{\"verse\":9,\"text\":\"In hoc apparuit caritas Dei in nobis, quoniam Filium suum unigenitum misit Deus in mundum, ut vivamus per eum.\"},{\"verse\":10,\"text\":\"In hoc est caritas : non quasi nos dilexerimus Deum, sed quoniam ipse prior dilexit nos, et misit Filium suum propitiationem pro peccatis nostris.\"},{\"verse\":11,\"text\":\"Carissimi, si sic Deus dilexit nos : et nos debemus alterutrum diligere.\"},{\"verse\":12,\"text\":\"Deum nemo vidit umquam. Si diligamus invicem, Deus in nobis manet, et caritas ejus in nobis perfecta est.\"},{\"verse\":13,\"text\":\"In hoc cognoscimus quoniam in eo manemus, et ipse in nobis : quoniam de Spiritu suo dedit nobis.\"},{\"verse\":14,\"text\":\"Et nos vidimus, et testificamur quoniam Pater misit Filium suum Salvatorem mundi.\"},{\"verse\":15,\"text\":\"Quisquis confessus fuerit quoniam Jesus est Filius Dei, Deus in eo manet, et ipse in Deo.\"},{\"verse\":16,\"text\":\"Et nos cognovimus, et credidimus caritati, quam habet Deus in nobis. Deus caritas est : et qui manet in caritate, in Deo manet, et Deus in eo.\"},{\"verse\":17,\"text\":\"In hoc perfecta est caritas Dei nobiscum, ut fiduciam habeamus in die judicii : quia sicut ille est, et nos sumus in hoc mundo.\"},{\"verse\":18,\"text\":\"Timor non est in caritate : sed perfecta caritas foras mittit timorem, quoniam timor pœnam habet : qui autem timet, non est perfectus in caritate.\"},{\"verse\":19,\"text\":\"Nos ergo diligamus Deum, quoniam Deus prior dilexit nos.\"},{\"verse\":20,\"text\":\"Si quis dixerit : Quoniam diligo Deum, et fratrem suum oderit, mendax est. Qui enim non diligit fratrem suum quem vidit, Deum, quem non vidit, quomodo potest diligere ?\"},{\"verse\":21,\"text\":\"Et hoc mandatum habemus a Deo : ut qui diligit Deum, diligat et fratrem suum.\"}],\"summary\":\"What spirits are of God, and what are not. We must love one another, because God has loved us.\",\"intro\":null,\"prev\":{\"usfm\":\"1JN\",\"chapter\":3,\"label\":\"1 John 3\"},\"next\":{\"usfm\":\"1JN\",\"chapter\":5,\"label\":\"1 John 5\"}}]]\n"])</script></body></html>
