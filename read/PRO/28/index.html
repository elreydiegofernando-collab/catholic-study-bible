lion, shall be without dread.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For the sins of the land many are the princes thereof: and for the wisdom of a man, and the knowledge of those things that are said, the life of the prince shall be prolonged.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A poor man that oppresseth the poor, is like a violent shower, which bringeth a famine.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They that forsake the law, praise the wicked man: they that keep it, are incensed against him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Evil men think not on judgment: but they that seek after the Lord, take notice of all things.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Better is the poor man walking in his simplicity, than the rich in crooked ways.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that keepeth the law, is a wise son: but he that feedeth gluttons, shameth his father.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that heapeth together riches by usury and loan, gathereth them for him that will be bountiful to the poor.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that turneth away his ears from hearing the law, his prayer shall be an abomination.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He that deceiveth the just in a wicked way, shall fall in his own destruction: and the upright shall possess his goods.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The rich man seemeth to himself wise: but the poor man that is prudent shall search him out.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In the joy of the just there is great glory: when the wicked reign, men are ruined.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that hideth his sins, shall not prosper: but he that shall confess, and forsake them, shall obtain mercy.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Blessed is the man that is always fearful: but he that is hardened in mind shall fall into evil.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>As a roaring lion, and a hungry bear, so is a wicked prince over the poor people.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A prince void of prudence shall oppress many by calumny: but he that hateth covetousness, shall prolong his days.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>A man that doth violence to the blood of a person, if he flee even to the pit, no man will stay him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He that walketh uprightly, shall be saved: he that is perverse in his ways, shall fall at once.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He that tilleth his ground, shall be filled with bread: but he that followeth idleness, shall be filled with poverty.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>A faithful man shall be much praised: but he that maketh haste to be rich, shall not be innocent.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that hath respect to a person in judgment, doth not well: such a man even for a morsel of bread forsaketh the truth.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A man that maketh haste to be rich, and envieth others, is ignorant that poverty shall come upon him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He that rebuketh a man, shall afterward find favour with him, more than he that by a flattering tongue deceiveth him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He that stealeth any thing from his father, or from his mother: and saith, This is no sin, is the partner of a murderer.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He that boasteth and puffeth up himself, stirreth up quarrels: but he that trusteth in the Lord, shall be healed.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He that trusteth in his own heart, is a fool: but he that walketh wisely, he shall be saved.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He that giveth to the poor shall not want: he that despiseth his entreaty, shall suffer indigence.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>When the wicked rise up, men shall hide themselves: when they perish, the just shall be multiplied.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fugit impius nemine persequente ; justus autem, quasi leo confidens, absque terrore erit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Propter peccata terræ multi principes ejus ; et propter hominis sapientiam, et horum scientiam quæ dicuntur, vita ducis longior erit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Vir pauper calumnians pauperes similis est imbri vehementi in quo paratur fames.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Qui derelinquunt legem laudant impium ; qui custodiunt, succenduntur contra eum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Viri mali non cogitant judicium ; qui autem inquirunt Dominum animadvertunt omnia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Melior est pauper ambulans in simplicitate sua quam dives in pravis itineribus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui custodit legem filius sapiens est ; qui autem comessatores pascit confundit patrem suum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui coacervat divitias usuris et fœnore, liberali in pauperes congregat eas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui declinat aures suas ne audiat legem, oratio ejus erit execrabilis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui decipit justos in via mala, in interitu suo corruet, et simplices possidebunt bona ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sapiens sibi videtur vir dives ; pauper autem prudens scrutabitur eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In exsultatione justorum multa gloria est ; regnantibus impiis, ruinæ hominum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui abscondit scelera sua non dirigetur ; qui autem confessus fuerit et reliquerit ea, misericordiam consequetur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Beatus homo qui semper est pavidus ; qui vero mentis est duræ corruet in malum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Leo rugiens et ursus esuriens, princeps impius super populum pauperem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dux indigens prudentia multos opprimet per calumniam ; qui autem odit avaritiam, longi fient dies ejus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hominem qui calumniatur animæ sanguinem, si usque ad lacum fugerit, nemo sustinet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui ambulat simpliciter salvus erit ; qui perversis graditur viis concidet semel.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui operatur terram suam satiabitur panibus ; qui autem sectatur otium replebitur egestate.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vir fidelis multum laudabitur ; qui autem festinat ditari non erit innocens.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui cognoscit in judicio faciem non bene facit ; iste et pro buccella panis deserit veritatem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vir qui festinat ditari, et aliis invidet, ignorat quod egestas superveniet ei.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui corripit hominem gratiam postea inveniet apud eum, magis quam ille qui per linguæ blandimenta decipit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui subtrahit aliquid a patre suo et a matre, et dicit hoc non esse peccatum, particeps homicidæ est.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui se jactat et dilatat, jurgia concitat ; qui vero sperat in Domino sanabitur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui confidit in corde suo stultus est ; qui autem graditur sapienter, ipse salvabitur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui dat pauperi non indigebit ; qui despicit deprecantem sustinebit penuriam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Cum surrexerint impii, abscondentur homines ; cum illi perierint, multiplicabuntur justi.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/27/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 27</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/29/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 29</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->28<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t borde text\":\"He that deceiveth the just in a wicked way, shall fall in his own destruction: and the upright shall possess his goods.\"},{\"verse\":11,\"text\":\"The rich man seemeth to himself wise: but the poor man that is prudent shall search him out.\"},{\"verse\":12,\"text\":\"In the joy of the just there is great glory: when the wicked reign, men are ruined.\"},{\"verse\":13,\"text\":\"He that hideth his sins, shall not prosper: but he that shall confess, and forsake them, shall obtain mercy.\"},{\"verse\":14,\"text\":\"Blessed is the man that is always fearful: but he that is hardened in mind shall fall into evil.\"},{\"verse\":15,\"text\":\"As a roaring lion, and a hungry bear, so is a wicked prince over the poor people.\"},{\"verse\":16,\"text\":\"A prince void of prudence shall oppress many by calumny: but he that hateth covetousness, shall prolong his days.\"},{\"verse\":17,\"text\":\"A man that doth violence to the blood of a person, if he flee even to the pit, no man will stay him.\"},{\"verse\":18,\"text\":\"He that walketh uprightly, shall be saved: he that is perverse in his ways, shall fall at once.\"},{\"verse\":19,\"text\":\"He that tilleth his ground, shall be filled with bread: but he that followeth idleness, shall be filled with poverty.\"},{\"verse\":20,\"text\":\"A faithful man shall be much praised: but he that maketh haste to be rich, shall not be innocent.\"},{\"verse\":21,\"text\":\"He that hath respect to a person in judgment, doth not well: such a man even for a morsel of bread forsaketh the truth.\"},{\"verse\":22,\"text\":\"A man that maketh haste to be rich, and envieth others, is ignorant that poverty shall come upon him.\"},{\"verse\":23,\"text\":\"He that rebuketh a man, shall afterward find favour with him, more than he that by a flattering tongue deceiveth him.\"},{\"verse\":24,\"text\":\"He that stealeth any thing from his father, or from his mother: and saith, This is no sin, is the partner of a murderer.\"},{\"verse\":25,\"text\":\"He that boasteth and puffeth up himself, stirreth up quarrels: but he that trusteth in the Lord, shall be healed.\"},{\"verse\":26,\"text\":\"He that trusteth in his own heart, is a fool: but he that walketh wisely, he shall be saved.\"},{\"verse\":27,\"text\":\"He that giveth to the poor shall not want: he that despiseth his entreaty, shall suffer indigence.\"},{\"verse\":28,\"text\":\"When the wicked rise up, men shall hide themselves: when they perish, the just shall be multiplied.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fugit impius nemine persequente ; justus autem, quasi leo confidens, absque terrore erit.\"},{\"verse\":2,\"text\":\"Propter peccata terræ multi principes ejus ; et propter hominis sapientiam, et horum scientiam quæ dicuntur, vita ducis longior erit.\"},{\"verse\":3,\"text\":\"Vir pauper calumnians pauperes similis est imbri vehementi in quo paratur fames.\"},{\"verse\":4,\"text\":\"Qui derelinquunt legem laudant impium ; qui custodiunt, succenduntur contra eum.\"},{\"verse\":5,\"text\":\"Viri mali non cogitant judicium ; qui autem inquirunt Dominum animadvertunt omnia.\"},{\"verse\":6,\"text\":\"Melior est pauper ambulans in simplicitate sua quam dives in pravis itineribus.\"},{\"verse\":7,\"text\":\"Qui custodit legem filius sapiens est ; qui autem comessatores pascit confundit patrem suum.\"},{\"verse\":8,\"text\":\"Qui coacervat divitias usuris et fœnore, liberali in pauperes congregat eas.\"},{\"verse\":9,\"text\":\"Qui declinat aures suas ne audiat legem, oratio ejus erit execrabilis.\"},{\"verse\":10,\"text\":\"Qui decipit justos in via mala, in interitu suo corruet, et simplices possidebunt bona ejus.\"},{\"verse\":11,\"text\":\"Sapiens sibi videtur vir dives ; pauper autem prudens scrutabitur eum.\"},{\"verse\":12,\"text\":\"In exsultatione justorum multa gloria est ; regnantibus impiis, ruinæ hominum.\"},{\"verse\":13,\"text\":\"Qui abscondit scelera sua non dirigetur ; qui autem confessus fuerit et reliquerit ea, misericordiam consequetur.\"},{\"verse\":14,\"text\":\"Beatus homo qui semper est pavidus ; qui vero mentis est duræ corruet in malum.\"},{\"verse\":15,\"text\":\"Leo rugiens et ursus esuriens, princeps impius super populum pauperem.\"},{\"verse\":16,\"text\":\"Dux indigens prudentia multos opprimet per calumniam ; qui autem odit avaritiam, longi fient dies ejus.\"},{\"verse\":17,\"text\":\"Hominem qui calumniatur animæ sanguinem, si usque ad lacum fugerit, nemo sustinet.\"},{\"verse\":18,\"text\":\"Qui ambulat simpliciter salvus erit ; qui perversis graditur viis concidet semel.\"},{\"verse\":19,\"text\":\"Qui operatur terram suam satiabitur panibus ; qui autem sectatur otium replebitur egestate.\"},{\"verse\":20,\"text\":\"Vir fidelis multum laudabitur ; qui autem festinat ditari non erit innocens.\"},{\"verse\":21,\"text\":\"Qui cognoscit in judicio faciem non bene facit ; iste et pro buccella panis deserit veritatem.\"},{\"verse\":22,\"text\":\"Vir qui festinat ditari, et aliis invidet, ignorat quod egestas superveniet ei.\"},{\"verse\":23,\"text\":\"Qui corripit hominem gratiam postea inveniet apud eum, magis quam ille qui per linguæ blandimenta decipit.\"},{\"verse\":24,\"text\":\"Qui subtrahit aliquid a patre suo et a matre, et dicit hoc non esse peccatum, particeps homicidæ est.\"},{\"verse\":25,\"text\":\"Qui se jactat et dilatat, jurgia concitat ; qui vero sperat in Domino sanabitur.\"},{\"verse\":26,\"text\":\"Qui confidit in corde suo stultus est ; qui autem graditur sapienter, ipse salvabitur.\"},{\"verse\":27,\"text\":\"Qui dat pauperi non indigebit ; qui despicit deprecantem sustinebit penuriam.\"},{\"verse\":28,\"text\":\"Cum surrexerint impii, abscondentur homines ; cum illi perierint, multiplicabuntur justi.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":27,\"label\":\"Proverbs 27\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":29,\"label\":\"Proverbs 29\"}}]]\n"])</script></body></html>
