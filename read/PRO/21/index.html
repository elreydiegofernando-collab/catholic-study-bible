f the Lord: whithersoever he will, he shall turn it.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Every way of a man seemeth right to himself: but the Lord weigheth the hearts.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To do mercy and judgment, pleaseth the Lord more than victims.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Haughtiness of the eyes is the enlarging of the heart: the lamp of the wicked is sin.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The thoughts of the industrious always bring forth abundance: but every sluggard is always in want.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He that gathereth treasures by a lying tongue, is vain and foolish, and shall stumble upon the snares of death.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The robberies of the wicked shall be their downfall, because they would not do judgment.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The perverse way of a man is strange: but as for him that is pure, his work is right.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>It is better to sit in a corner of the housetop, than with a brawling woman, and in a common house.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The soul of the wicked desireth evil, he will not have pity on his neighbour.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>When a pestilent man is punished, the little one will be wiser: and if he follow the wise, he will receive knowledge.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The just considereth seriously the house of the wicked, that he may withdraw the wicked from evil.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that stoppeth his ear against the cry of the poor, shall also cry himself, and shall not be heard.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>A secret present quencheth anger: and a gift in the bosom, the greatest wrath.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>It is joy to the just to do judgment: and dread to them that work iniquity.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A man that shall wander out of the way of doctrine, shall abide in the company of the giants.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He that loveth good cheer, shall be in want: he that loveth wine, and fat things, shall not be rich.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The wicked is delivered up for the just: and the unjust for the righteous.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>It is better to dwell in a wilderness, than with a quarrelsome and passionate woman.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>There is a treasure to be desired, and oil in the dwelling of the just: and the foolish man shall spend it.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that followeth justice and mercy, shall find life, justice, and glory.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The wise man hath scaled the city of the strong, and hath cast down the strength of the confidence thereof.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He that keepeth his mouth and his tongue, keepeth his soul from distress.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The proud and the arrogant is called ignorant, who in anger worketh pride.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Desires kill the slothful: for his hands have refused to work at all.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He longeth and desireth all the day: but he that is just, will give, and will not cease.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The sacrifices of the wicked are abominable, because they are offered of wickedness.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>A lying witness shall perish: an obedient man shall speak of victory.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The wicked man impudently hardeneth his face: but he that is righteous, correcteth his way.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>There is no wisdom, there is no prudence, there is no counsel against the Lord.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The horse is prepared for the day of battle: but the Lord giveth safety.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sicut divisiones aquarum, ita cor regis in manu Domini : quocumque voluerit, inclinabit illud.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Omnis via viri recta sibi videtur : appendit autem corda Dominus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Facere misericordiam et judicium magis placet Domino quam victimæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Exaltatio oculorum est dilatatio cordis ; lucerna impiorum peccatum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cogitationes robusti semper in abundantia ; omnis autem piger semper in egestate est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui congregat thesauros lingua mendacii vanus et excors est, et impingetur ad laqueos mortis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Rapinæ impiorum detrahent eos, quia noluerunt facere judicium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Perversa via viri aliena est ; qui autem mundus est, rectum opus ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Melius est sedere in angulo domatis, quam cum muliere litigiosa, et in domo communi.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Anima impii desiderat malum : non miserebitur proximo suo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mulctato pestilente, sapientior erit parvulus, et si sectetur sapientem, sumet scientiam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Excogitat justus de domo impii, ut detrahat impios a malo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui obturat aurem suam ad clamorem pauperis, et ipse clamabit, et non exaudietur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Munus absconditum extinguit iras, et donum in sinu indignationem maximam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gaudium justo est facere judicium, et pavor operantibus iniquitatem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Vir qui erraverit a via doctrinæ in cœtu gigantum commorabitur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui diligit epulas in egestate erit ; qui amat vinum et pinguia non ditabitur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Pro justo datur impius, et pro rectis iniquus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Melius est habitare in terra deserta quam cum muliere rixosa et iracunda.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Thesaurus desiderabilis, et oleum in habitaculo justi : et imprudens homo dissipabit illud.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui sequitur justitiam et misericordiam inveniet vitam, justitiam, et gloriam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Civitatem fortium ascendit sapiens, et destruxit robur fiduciæ ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui custodit os suum et linguam suam custodit ab angustiis animam suam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Superbus et arrogans vocatur indoctus, qui in ira operatur superbiam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Desideria occidunt pigrum : noluerunt enim quidquam manus ejus operari.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Tota die concupiscit et desiderat ; qui autem justus est, tribuet, et non cessabit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Hostiæ impiorum abominabiles, quia offeruntur ex scelere.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Testis mendax peribit ; vir obediens loquetur victoriam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vir impius procaciter obfirmat vultum suum ; qui autem rectus est corrigit viam suam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Non est sapientia, non est prudentia, non est consilium contra Dominum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Equus paratur ad diem belli ; Dominus autem salutem tribuit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/22/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 22</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-c ,\"text\":\"It is better to sit in a corner of the housetop, than with a brawling woman, and in a common house.\"},{\"verse\":10,\"text\":\"The soul of the wicked desireth evil, he will not have pity on his neighbour.\"},{\"verse\":11,\"text\":\"When a pestilent man is punished, the little one will be wiser: and if he follow the wise, he will receive knowledge.\"},{\"verse\":12,\"text\":\"The just considereth seriously the house of the wicked, that he may withdraw the wicked from evil.\"},{\"verse\":13,\"text\":\"He that stoppeth his ear against the cry of the poor, shall also cry himself, and shall not be heard.\"},{\"verse\":14,\"text\":\"A secret present quencheth anger: and a gift in the bosom, the greatest wrath.\"},{\"verse\":15,\"text\":\"It is joy to the just to do judgment: and dread to them that work iniquity.\"},{\"verse\":16,\"text\":\"A man that shall wander out of the way of doctrine, shall abide in the company of the giants.\"},{\"verse\":17,\"text\":\"He that loveth good cheer, shall be in want: he that loveth wine, and fat things, shall not be rich.\"},{\"verse\":18,\"text\":\"The wicked is delivered up for the just: and the unjust for the righteous.\"},{\"verse\":19,\"text\":\"It is better to dwell in a wilderness, than with a quarrelsome and passionate woman.\"},{\"verse\":20,\"text\":\"There is a treasure to be desired, and oil in the dwelling of the just: and the foolish man shall spend it.\"},{\"verse\":21,\"text\":\"He that followeth justice and mercy, shall find life, justice, and glory.\"},{\"verse\":22,\"text\":\"The wise man hath scaled the city of the strong, and hath cast down the strength of the confidence thereof.\"},{\"verse\":23,\"text\":\"He that keepeth his mouth and his tongue, keepeth his soul from distress.\"},{\"verse\":24,\"text\":\"The proud and the arrogant is called ignorant, who in anger worketh pride.\"},{\"verse\":25,\"text\":\"Desires kill the slothful: for his hands have refused to work at all.\"},{\"verse\":26,\"text\":\"He longeth and desireth all the day: but he that is just, will give, and will not cease.\"},{\"verse\":27,\"text\":\"The sacrifices of the wicked are abominable, because they are offered of wickedness.\"},{\"verse\":28,\"text\":\"A lying witness shall perish: an obedient man shall speak of victory.\"},{\"verse\":29,\"text\":\"The wicked man impudently hardeneth his face: but he that is righteous, correcteth his way.\"},{\"verse\":30,\"text\":\"There is no wisdom, there is no prudence, there is no counsel against the Lord.\"},{\"verse\":31,\"text\":\"The horse is prepared for the day of battle: but the Lord giveth safety.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sicut divisiones aquarum, ita cor regis in manu Domini : quocumque voluerit, inclinabit illud.\"},{\"verse\":2,\"text\":\"Omnis via viri recta sibi videtur : appendit autem corda Dominus.\"},{\"verse\":3,\"text\":\"Facere misericordiam et judicium magis placet Domino quam victimæ.\"},{\"verse\":4,\"text\":\"Exaltatio oculorum est dilatatio cordis ; lucerna impiorum peccatum.\"},{\"verse\":5,\"text\":\"Cogitationes robusti semper in abundantia ; omnis autem piger semper in egestate est.\"},{\"verse\":6,\"text\":\"Qui congregat thesauros lingua mendacii vanus et excors est, et impingetur ad laqueos mortis.\"},{\"verse\":7,\"text\":\"Rapinæ impiorum detrahent eos, quia noluerunt facere judicium.\"},{\"verse\":8,\"text\":\"Perversa via viri aliena est ; qui autem mundus est, rectum opus ejus.\"},{\"verse\":9,\"text\":\"Melius est sedere in angulo domatis, quam cum muliere litigiosa, et in domo communi.\"},{\"verse\":10,\"text\":\"Anima impii desiderat malum : non miserebitur proximo suo.\"},{\"verse\":11,\"text\":\"Mulctato pestilente, sapientior erit parvulus, et si sectetur sapientem, sumet scientiam.\"},{\"verse\":12,\"text\":\"Excogitat justus de domo impii, ut detrahat impios a malo.\"},{\"verse\":13,\"text\":\"Qui obturat aurem suam ad clamorem pauperis, et ipse clamabit, et non exaudietur.\"},{\"verse\":14,\"text\":\"Munus absconditum extinguit iras, et donum in sinu indignationem maximam.\"},{\"verse\":15,\"text\":\"Gaudium justo est facere judicium, et pavor operantibus iniquitatem.\"},{\"verse\":16,\"text\":\"Vir qui erraverit a via doctrinæ in cœtu gigantum commorabitur.\"},{\"verse\":17,\"text\":\"Qui diligit epulas in egestate erit ; qui amat vinum et pinguia non ditabitur.\"},{\"verse\":18,\"text\":\"Pro justo datur impius, et pro rectis iniquus.\"},{\"verse\":19,\"text\":\"Melius est habitare in terra deserta quam cum muliere rixosa et iracunda.\"},{\"verse\":20,\"text\":\"Thesaurus desiderabilis, et oleum in habitaculo justi : et imprudens homo dissipabit illud.\"},{\"verse\":21,\"text\":\"Qui sequitur justitiam et misericordiam inveniet vitam, justitiam, et gloriam.\"},{\"verse\":22,\"text\":\"Civitatem fortium ascendit sapiens, et destruxit robur fiduciæ ejus.\"},{\"verse\":23,\"text\":\"Qui custodit os suum et linguam suam custodit ab angustiis animam suam.\"},{\"verse\":24,\"text\":\"Superbus et arrogans vocatur indoctus, qui in ira operatur superbiam.\"},{\"verse\":25,\"text\":\"Desideria occidunt pigrum : noluerunt enim quidquam manus ejus operari.\"},{\"verse\":26,\"text\":\"Tota die concupiscit et desiderat ; qui autem justus est, tribuet, et non cessabit.\"},{\"verse\":27,\"text\":\"Hostiæ impiorum abominabiles, quia offeruntur ex scelere.\"},{\"verse\":28,\"text\":\"Testis mendax peribit ; vir obediens loquetur victoriam.\"},{\"verse\":29,\"text\":\"Vir impius procaciter obfirmat vultum suum ; qui autem rectus est corrigit viam suam.\"},{\"verse\":30,\"text\":\"Non est sapientia, non est prudentia, non est consilium contra Dominum.\"},{\"verse\":31,\"text\":\"Equus paratur ad diem belli ; Dominus autem salutem tribuit.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":20,\"label\":\"Proverbs 20\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":22,\"label\":\"Proverbs 22\"}}]]\n"])</script></body></html>
