-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PRO/">About <!-- -->Proverbs</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">An exhortation to the practice of virtue.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>My son, forget not my law, and let thy heart keep my commandments.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For they shall add to thee length of days, and years of life, and peace.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let not mercy and truth leave thee, put them about thy neck, and write them in the tables of thy heart.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And thou shalt find grace, and good understanding before God and men.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Have confidence in the Lord with all thy heart, and lean not upon thy own prudence.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In all thy ways think on him, and he will direct thy steps.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Be not wise in thy own conceit: fear God, and depart from evil:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For it shall be health to thy navel, and moistening to thy bones.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Honour the Lord with thy substance, and give him of the first of all thy fruits;</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And thy barns shall be filled with abundance, and thy presses shall run over with wine.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>My son, reject not the correction of the Lord: and do not faint when thou art chastised by him:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For whom the Lord loveth, he chastiseth: and as a father in the son he pleaseth himself.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Blessed is the man that findeth wisdom, and is rich in prudence:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The purchasing thereof is better than the merchandise of silver, and her fruit than the chief and purest gold:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>She is more precious than all riches: and all the things that are desired, are not to be compared to her.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Length of days is in her right hand, and in her left hand riches and glory.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Her ways are beautiful ways, and all her paths are peaceable.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>She is a tree of life to them that lay hold on her: and he that shall retain her is blessed.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Lord by wisdom hath founded the earth, hath established the heavens by prudence.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>By his wisdom the depths have broken out, and the clouds grow thick with dew.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>My son, let not these things depart from thy eyes: keep the law and counsel:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And there shall be life to thy soul, and grace to thy mouth.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Then shalt thou walk confidently in thy way, and thy foot shall not stumble:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>If thou sleep, thou shalt not fear: thou shalt rest, and thy sleep shall be sweet.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Be not afraid of sudden fear, nor of the power of the wicked falling upon thee.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For the Lord will be at thy side, and will keep thy foot that thou be not taken.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Do not withhold him from doing good, who is able: if thou art able, do good thyself also.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Say not to thy friend: Go, and come again: and to morrow I will give to thee: when thou canst give at present.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Practise not evil against thy friend, when he hath confidence in thee.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Strive not against a man without cause, when he hath done thee no evil.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Envy not the unjust man, and do not follow his ways.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>For every mocker is an abomination to the Lord, and his communication is with the simple.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Want is from the Lord in the house of the wicked: but the habitations of the just shall be blessed.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>He shall scorn the scorners, and to the meek he will give grace.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The wise shall possess glory: the promotion of fools is disgrace.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fili mi, ne obliviscaris legis meæ, et præcepta mea cor tuum custodiat :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>longitudinem enim dierum, et annos vitæ, et pacem, apponent tibi.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Misericordia et veritas te non deserant ; circumda eas gutturi tuo, et describe in tabulis cordis tui :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et invenies gratiam, et disciplinam bonam, coram Deo et hominibus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Habe fiduciam in Domino ex toto corde tuo, et ne innitaris prudentiæ tuæ.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In omnibus viis tuis cogita illum, et ipse diriget gressus tuos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Ne sis sapiens apud temetipsum ; time Deum, et recede a malo :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>sanitas quippe erit umbilico tuo, et irrigatio ossium tuorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Honora Dominum de tua substantia, et de primitiis omnium frugum tuarum da ei :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et implebuntur horrea tua saturitate, et vino torcularia tua redundabunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Disciplinam Domini, fili mi, ne abjicias, nec deficias cum ab eo corriperis :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quem enim diligit Dominus, corripit, et quasi pater in filio complacet sibi.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Beatus homo qui invenit sapientiam, et qui affluit prudentia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Melior est acquisitio ejus negotiatione argenti, et auri primi et purissimi fructus ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Pretiosior est cunctis opibus, et omnia quæ desiderantur huic non valent comparari.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Longitudo dierum in dextera ejus, et in sinistra illius divitiæ et gloria.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Viæ ejus viæ pulchræ, et omnes semitæ illius pacificæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Lignum vitæ est his qui apprehenderint eam, et qui tenuerit eam beatus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dominus sapientia fundavit terram ; stabilivit cælos prudentia.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Sapientia illius eruperunt abyssi, et nubes rore concrescunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Fili mi, ne effluant hæc ab oculis tuis. Custodi legem atque consilium,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et erit vita animæ tuæ, et gratia faucibus tuis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Tunc ambulabis fiducialiter in via tua, et pes tuus non impinget.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Si dormieris, non timebis ; quiesces, et suavis erit somnus tuus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ne paveas repentino terrore, et irruentes tibi potentias impiorum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dominus enim erit in latere tuo, et custodiet pedem tuum, ne capiaris.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Noli prohibere benefacere eum qui potest : si vales, et ipse benefac.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ne dicas amico tuo : Vade, et revertere : cras dabo tibi : cum statim possis dare.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ne moliaris amico tuo malum, cum ille in te habeat fiduciam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ne contendas adversus hominem frustra, cum ipse tibi nihil mali fecerit.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ne æmuleris hominem injustum, nec imiteris vias ejus :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>quia abominatio Domini est omnis illusor, et cum simplicibus sermocinatio ejus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Egestas a Domino in domo impii ; habitacula autem justorum benedicentur.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Ipse deludet illusores, et mansuetis dabit gratiam.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Gloriam sapientes possidebunt ; stultorum exaltatio ignominia.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-1 erReader\"]\na:[[\"$\",\"$L18\",\"PRO.3\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":3,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"My son, forget not my law, and let thy heart keep my commandments.\"},{\"verse\":2,\"text\":\"For they shall add to thee length of days, and years of life, and peace.\"},{\"verse\":3,\"text\":\"Let not mercy and truth leave thee, put them about thy neck, and write them in the tables of thy heart.\"},{\"verse\":4,\"text\":\"And thou shalt find grace, and good understanding before God and men.\"},{\"verse\":5,\"text\":\"Have confidence in the Lord with all thy heart, and lean not upon thy own prudence.\"},{\"verse\":6,\"text\":\"In all thy ways think on him, and he will direct thy steps.\"},{\"verse\":7,\"text\":\"Be not wise in thy own conceit: fear God, and depart from evil:\"},{\"verse\":8,\"text\":\"For it shall be health to thy navel, and moistening to thy bones.\"},{\"verse\":9,\"text\":\"Honour the Lord with thy substance, and give him of the first of all thy fruits;\"},{\"verse\":10,\"text\":\"And thy barns shall be filled with abundance, and thy presses shall run over with wine.\"},{\"verse\":11,\"text\":\"My son, reject not the correction of the Lord: and do not faint when thou art chastised by him:\"},{\"verse\":12,\"text\":\"For whom the Lord loveth, he chastiseth: and as a father in the son he pleaseth himself.\"},{\"verse\":13,\"text\":\"Blessed is the man that findeth wisdom, and is rich in prudence:\"},{\"verse\":14,\"text\":\"The purchasing thereof is better than the merchandise of silver, and her fruit than the chief and purest gold:\"},{\"verse\":15,\"text\":\"She is more precious than all riches: and all the things that are desired, are not to be compared to her.\"},{\"verse\":16,\"text\":\"Length of days is in her right hand, and in her left hand riches and glory.\"},{\"verse\":17,\"text\":\"Her ways are beautiful ways, and all her paths are peaceable.\"},{\"verse\":18,\"text\":\"She is a tree of life to them that lay hold on her: and he that shall retain her is blessed.\"},{\"verse\":19,\"text\":\"The Lord by wisdom hath founded the earth, hath established the heavens by prudence.\"},{\"verse\":20,\"text\":\"By his wisdom the depths have broken out, and the clouds grow thick with dew.\"},{\"verse\":21,\"text\":\"My son, let not these things depart from thy eyes: keep the law and counsel:\"},{\"verse\":22,\"text\":\"And there shall be life to thy soul, and grace to thy mouth.\"},{\"verse\":23,\"text\":\"Then shalt thou walk confidently in thy way, and thy foot shall not stumble:\"},{\"verse\":24,\"text\":\"If thou sleep, thou shalt not fear: thou shalt rest, and thy sleep shall be sweet.\"},{\"verse\":25,\"text\":\"Be not afraid of sudden fear, nor of the power of the wicked falling upon thee.\"},{\"verse\":26,\"text\":\"For the Lord will be at thy side, and will keep thy foot that thou be not taken.\"},{\"verse\":27,\"text\":\"Do not withhold him from doing good, who is able: if thou art able, do good thyself also.\"},{\"verse\":28,\"text\":\"Say not to thy friend: Go, and come again: and to morrow I will give to thee: when thou canst give at present.\"},{\"verse\":29,\"text\":\"Practise not evil against thy friend, when he hath confidence in thee.\"},{\"verse\":30,\"text\":\"Strive not against a man without cause, when he hath done thee no evil.\"},{\"verse\":31,\"text\":\"Envy not the unjust man, and do not follow his ways.\"},{\"verse\":32,\"text\":\"For every mocker is an abomination to the Lord, and his communication is with the simple.\"},{\"verse\":33,\"text\":\"Want is from the Lord in the house of the wicked: but the habitations of the just shall be blessed.\"},{\"verse\":34,\"text\":\"He shall scorn the scorners, and to the meek he will give grace.\"},{\"verse\":35,\"text\":\"The wise shall possess glory: the promotion of fools is disgrace.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fili mi, ne obliviscaris legis meæ, et præcepta mea cor tuum custodiat :\"},{\"verse\":2,\"text\":\"longitudinem enim dierum, et annos vitæ, et pacem, apponent tibi.\"},{\"verse\":3,\"text\":\"Misericordia et veritas te non deserant ; circumda eas gutturi tuo, et describe in tabulis cordis tui :\"},{\"verse\":4,\"text\":\"et invenies gratiam, et disciplinam bonam, coram Deo et hominibus.\"},{\"verse\":5,\"text\":\"Habe fiduciam in Domino ex toto corde tuo, et ne innitaris prudentiæ tuæ.\"},{\"verse\":6,\"text\":\"In omnibus viis tuis cogita illum, et ipse diriget gressus tuos.\"},{\"verse\":7,\"text\":\"Ne sis sapiens apud temetipsum ; time Deum, et recede a malo :\"},{\"verse\":8,\"text\":\"sanitas quippe erit umbilico tuo, et irrigatio ossium tuorum.\"},{\"verse\":9,\"text\":\"Honora Dominum de tua substantia, et de primitiis omnium frugum tuarum da ei :\"},{\"verse\":10,\"text\":\"et implebuntur horrea tua saturitate, et vino torcularia tua redundabunt.\"},{\"verse\":11,\"text\":\"Disciplinam Domini, fili mi, ne abjicias, nec deficias cum ab eo corriperis :\"},{\"verse\":12,\"text\":\"quem enim diligit Dominus, corripit, et quasi pater in filio complacet sibi.\"},{\"verse\":13,\"text\":\"Beatus homo qui invenit sapientiam, et qui affluit prudentia.\"},{\"verse\":14,\"text\":\"Melior est acquisitio ejus negotiatione argenti, et auri primi et purissimi fructus ejus.\"},{\"verse\":15,\"text\":\"Pretiosior est cunctis opibus, et omnia quæ desiderantur huic non valent comparari.\"},{\"verse\":16,\"text\":\"Longitudo dierum in dextera ejus, et in sinistra illius divitiæ et gloria.\"},{\"verse\":17,\"text\":\"Viæ ejus viæ pulchræ, et omnes semitæ illius pacificæ.\"},{\"verse\":18,\"text\":\"Lignum vitæ est his qui apprehenderint eam, et qui tenuerit eam beatus.\"},{\"verse\":19,\"text\":\"Dominus sapientia fundavit terram ; stabilivit cælos prudentia.\"},{\"verse\":20,\"text\":\"Sapientia illius eruperunt abyssi, et nubes rore concrescunt.\"},{\"verse\":21,\"text\":\"Fili mi, ne effluant hæc ab oculis tuis. Custodi legem atque consilium,\"},{\"verse\":22,\"text\":\"et erit vita animæ tuæ, et gratia faucibus tuis.\"},{\"verse\":23,\"text\":\"Tunc ambulabis fiducialiter in via tua, et pes tuus non impinget.\"},{\"verse\":24,\"text\":\"Si dormieris, non timebis ; quiesces, et suavis erit somnus tuus.\"},{\"verse\":25,\"text\":\"Ne paveas repentino terrore, et irruentes tibi potentias impiorum.\"},{\"verse\":26,\"text\":\"Dominus enim erit in latere tuo, et custodiet pedem tuum, ne capiaris.\"},{\"verse\":27,\"text\":\"Noli prohibere benefacere eum qui potest : si vales, et ipse benefac.\"},{\"verse\":28,\"text\":\"Ne dicas amico tuo : Vade, et revertere : cras dabo tibi : cum statim possis dare.\"},{\"verse\":29,\"text\":\"Ne moliaris amico tuo malum, cum ille in te habeat fiduciam.\"},{\"verse\":30,\"text\":\"Ne contendas adversus hominem frustra, cum ipse tibi nihil mali fecerit.\"},{\"verse\":31,\"text\":\"Ne æmuleris hominem injustum, nec imiteris vias ejus :\"},{\"verse\":32,\"text\":\"quia abominatio Domini est omnis illusor, et cum simplicibus sermocinatio ejus.\"},{\"verse\":33,\"text\":\"Egestas a Domino in domo impii ; habitacula autem justorum benedicentur.\"},{\"verse\":34,\"text\":\"Ipse deludet illusores, et mansuetis dabit gratiam.\"},{\"verse\":35,\"text\":\"Gloriam sapientes possidebunt ; stultorum exaltatio ignominia.\"}],\"summary\":\"An exhortation to the practice of virtue.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":2,\"label\":\"Proverbs 2\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":4,\"label\":\"Proverbs 4\"}}]]\n"])</script></body></html>
