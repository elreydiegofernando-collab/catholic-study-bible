l suddenly be destroyed: and health shall not follow him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>When just men increase, the people shall rejoice: when the wicked shall bear rule, the people shall mourn.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A man that loveth wisdom, rejoiceth his father: but he that maintaineth harlots, shall squander away his substance.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>A just king setteth up the land: a covetous man shall destroy it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A man that speaketh to his friend with flattering and dissembling words, spreadeth a net for his feet.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A snare shall entangle the wicked man when he sinneth: and the just shall praise and rejoice.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The just taketh notice of the cause of the poor: the wicked is void of knowledge.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Corrupt men bring a city to ruin: but wise men turn away wrath.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>If a wise man contend with a fool, whether he be angry, or laugh, he shall find no rest.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Bloodthirsty men hate the upright: but just men seek his soul.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>A fool uttereth all his mind: a wise man deferreth, and keepeth it till afterwards.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A prince that gladly heareth lying words, hath all his servants wicked.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The poor man and the creditor have met one another: the Lord is the enlightener of them both.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The king that judgeth the poor in truth, his throne shall be established for ever.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The rod and reproof give wisdom: but the child that is left to his own will, bringeth his mother to shame.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>When the wicked are multiplied, crimes shall be multiplied: but the just shall see their downfall.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Instruct thy son and he shall refresh thee, and shall give delight to thy soul.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>When prophecy shall fail, the people shall be scattered abroad: but he that keepeth the law, is blessed.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A slave will not be corrected by words: because he understandeth what thou sayest, and will not answer.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hast thou seen a man hasty to speak? folly is rather to be looked for, than his amendment.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that nourisheth his servant delicately from his childhood, afterwards shall find him stubborn.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A passionate man provoketh quarrels: and he that is easily stirred up to wrath, shall be more prone to sin.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Humiliation followeth the proud: and glory shall uphold the humble of spirit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He that is partaker with a thief, hateth his own soul: he heareth one putting him to his oath, and discovereth not.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He that feareth man shall quickly fall: he that trusteth in the Lord, shall be set on high.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Many seek the face of the prince: but the judgment of every one cometh forth from the Lord.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The just abhor a wicked man: and the wicked loathe them that are in the right way. The son that keepeth the word, shall be free from destruction.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Viro qui corripientem dura cervice contemnit, repentinus ei superveniet interitus, et eum sanitas non sequetur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In multiplicatione justorum lætabitur vulgus ; cum impii sumpserint principatum, gemet populus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Vir qui amat sapientiam lætificat patrem suum ; qui autem nutrit scorta perdet substantiam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Rex justus erigit terram ; vir avarus destruet eam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Homo qui blandis fictisque sermonibus loquitur amico suo rete expandit gressibus ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Peccantem virum iniquum involvet laqueus, et justus laudabit atque gaudebit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Novit justus causam pauperum ; impius ignorat scientiam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Homines pestilentes dissipant civitatem ; sapientes vero avertunt furorem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Vir sapiens si cum stulto contenderit, sive irascatur, sive rideat, non inveniet requiem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Viri sanguinum oderunt simplicem ; justi autem quærunt animam ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Totum spiritum suum profert stultus ; sapiens differt, et reservat in posterum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Princeps qui libenter audit verba mendacii, omnes ministros habet impios.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Pauper et creditor obviaverunt sibi : utriusque illuminator est Dominus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Rex qui judicat in veritate pauperes, thronus ejus in æternum firmabitur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Virga atque correptio tribuit sapientiam ; puer autem qui dimittitur voluntati suæ confundit matrem suam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In multiplicatione impiorum multiplicabuntur scelera, et justi ruinas eorum videbunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Erudi filium tuum, et refrigerabit te, et dabit delicias animæ tuæ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cum prophetia defecerit, dissipabitur populus ; qui vero custodit legem beatus est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Servus verbis non potest erudiri, quia quod dicis intelligit, et respondere contemnit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vidisti hominem velocem ad loquendum ? stultitia magis speranda est quam illius correptio.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui delicate a pueritia nutrit servum suum postea sentiet eum contumacem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vir iracundus provocat rixas, et qui ad indignandum facilis est erit ad peccandum proclivior.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Superbum sequitur humilitas, et humilem spiritu suscipiet gloria.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui cum fure participat odit animam suam ; adjurantem audit, et non indicat.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui timet hominem cito corruet ; qui sperat in Domino sublevabitur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Multi requirunt faciem principis, et judicium a Domino egreditur singulorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Abominantur justi virum impium, et abominantur impii eos qui in recta sunt via. Verbum custodiens filius extra perditionem erit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study bs\",\"chapter\":29,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"The man that with a stiff neck despiseth him that reproveth him, shall suddenly be destroyed: and health shall not follow him.\"},{\"verse\":2,\"text\":\"When just men increase, the people shall rejoice: when the wicked shall bear rule, the people shall mourn.\"},{\"verse\":3,\"text\":\"A man that loveth wisdom, rejoiceth his father: but he that maintaineth harlots, shall squander away his substance.\"},{\"verse\":4,\"text\":\"A just king setteth up the land: a covetous man shall destroy it.\"},{\"verse\":5,\"text\":\"A man that speaketh to his friend with flattering and dissembling words, spreadeth a net for his feet.\"},{\"verse\":6,\"text\":\"A snare shall entangle the wicked man when he sinneth: and the just shall praise and rejoice.\"},{\"verse\":7,\"text\":\"The just taketh notice of the cause of the poor: the wicked is void of knowledge.\"},{\"verse\":8,\"text\":\"Corrupt men bring a city to ruin: but wise men turn away wrath.\"},{\"verse\":9,\"text\":\"If a wise man contend with a fool, whether he be angry, or laugh, he shall find no rest.\"},{\"verse\":10,\"text\":\"Bloodthirsty men hate the upright: but just men seek his soul.\"},{\"verse\":11,\"text\":\"A fool uttereth all his mind: a wise man deferreth, and keepeth it till afterwards.\"},{\"verse\":12,\"text\":\"A prince that gladly heareth lying words, hath all his servants wicked.\"},{\"verse\":13,\"text\":\"The poor man and the creditor have met one another: the Lord is the enlightener of them both.\"},{\"verse\":14,\"text\":\"The king that judgeth the poor in truth, his throne shall be established for ever.\"},{\"verse\":15,\"text\":\"The rod and reproof give wisdom: but the child that is left to his own will, bringeth his mother to shame.\"},{\"verse\":16,\"text\":\"When the wicked are multiplied, crimes shall be multiplied: but the just shall see their downfall.\"},{\"verse\":17,\"text\":\"Instruct thy son and he shall refresh thee, and shall give delight to thy soul.\"},{\"verse\":18,\"text\":\"When prophecy shall fail, the people shall be scattered abroad: but he that keepeth the law, is blessed.\"},{\"verse\":19,\"text\":\"A slave will not be corrected by words: because he understandeth what thou sayest, and will not answer.\"},{\"verse\":20,\"text\":\"Hast thou seen a man hasty to speak? folly is rather to be looked for, than his amendment.\"},{\"verse\":21,\"text\":\"He that nourisheth his servant delicately from his childhood, afterwards shall find him stubborn.\"},{\"verse\":22,\"text\":\"A passionate man provoketh quarrels: and he that is easily stirred up to wrath, shall be more prone to sin.\"},{\"verse\":23,\"text\":\"Humiliation followeth the proud: and glory shall uphold the humble of spirit.\"},{\"verse\":24,\"text\":\"He that is partaker with a thief, hateth his own soul: he heareth one putting him to his oath, and discovereth not.\"},{\"verse\":25,\"text\":\"He that feareth man shall quickly fall: he that trusteth in the Lord, shall be set on high.\"},{\"verse\":26,\"text\":\"Many seek the face of the prince: but the judgment of every one cometh forth from the Lord.\"},{\"verse\":27,\"text\":\"The just abhor a wicked man: and the wicked loathe them that are in the right way. The son that keepeth the word, shall be free from destruction.\"}],\"vul\":[{\"verse\":1,\"text\":\"Viro qui corripientem dura cervice contemnit, repentinus ei superveniet interitus, et eum sanitas non sequetur.\"},{\"verse\":2,\"text\":\"In multiplicatione justorum lætabitur vulgus ; cum impii sumpserint principatum, gemet populus.\"},{\"verse\":3,\"text\":\"Vir qui amat sapientiam lætificat patrem suum ; qui autem nutrit scorta perdet substantiam.\"},{\"verse\":4,\"text\":\"Rex justus erigit terram ; vir avarus destruet eam.\"},{\"verse\":5,\"text\":\"Homo qui blandis fictisque sermonibus loquitur amico suo rete expandit gressibus ejus.\"},{\"verse\":6,\"text\":\"Peccantem virum iniquum involvet laqueus, et justus laudabit atque gaudebit.\"},{\"verse\":7,\"text\":\"Novit justus causam pauperum ; impius ignorat scientiam.\"},{\"verse\":8,\"text\":\"Homines pestilentes dissipant civitatem ; sapientes vero avertunt furorem.\"},{\"verse\":9,\"text\":\"Vir sapiens si cum stulto contenderit, sive irascatur, sive rideat, non inveniet requiem.\"},{\"verse\":10,\"text\":\"Viri sanguinum oderunt simplicem ; justi autem quærunt animam ejus.\"},{\"verse\":11,\"text\":\"Totum spiritum suum profert stultus ; sapiens differt, et reservat in posterum.\"},{\"verse\":12,\"text\":\"Princeps qui libenter audit verba mendacii, omnes ministros habet impios.\"},{\"verse\":13,\"text\":\"Pauper et creditor obviaverunt sibi : utriusque illuminator est Dominus.\"},{\"verse\":14,\"text\":\"Rex qui judicat in veritate pauperes, thronus ejus in æternum firmabitur.\"},{\"verse\":15,\"text\":\"Virga atque correptio tribuit sapientiam ; puer autem qui dimittitur voluntati suæ confundit matrem suam.\"},{\"verse\":16,\"text\":\"In multiplicatione impiorum multiplicabuntur scelera, et justi ruinas eorum videbunt.\"},{\"verse\":17,\"text\":\"Erudi filium tuum, et refrigerabit te, et dabit delicias animæ tuæ.\"},{\"verse\":18,\"text\":\"Cum prophetia defecerit, dissipabitur populus ; qui vero custodit legem beatus est.\"},{\"verse\":19,\"text\":\"Servus verbis non potest erudiri, quia quod dicis intelligit, et respondere contemnit.\"},{\"verse\":20,\"text\":\"Vidisti hominem velocem ad loquendum ? stultitia magis speranda est quam illius correptio.\"},{\"verse\":21,\"text\":\"Qui delicate a pueritia nutrit servum suum postea sentiet eum contumacem.\"},{\"verse\":22,\"text\":\"Vir iracundus provocat rixas, et qui ad indignandum facilis est erit ad peccandum proclivior.\"},{\"verse\":23,\"text\":\"Superbum sequitur humilitas, et humilem spiritu suscipiet gloria.\"},{\"verse\":24,\"text\":\"Qui cum fure participat odit animam suam ; adjurantem audit, et non indicat.\"},{\"verse\":25,\"text\":\"Qui timet hominem cito corruet ; qui sperat in Domino sublevabitur.\"},{\"verse\":26,\"text\":\"Multi requirunt faciem principis, et judicium a Domino egreditur singulorum.\"},{\"verse\":27,\"text\":\"Abominantur justi virum impium, et abominantur impii eos qui in recta sunt via. Verbum custodiens filius extra perditionem erit.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":28,\"label\":\"Proverbs 28\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":30,\"label\":\"Proverbs 30\"}}]]\n"])</script></body></html>
