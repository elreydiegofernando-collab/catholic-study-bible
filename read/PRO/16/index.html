the tongue.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>All the ways of a man are open to his eyes: the Lord is the weigher of spirits.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Lay open thy works to the Lord: and thy thoughts shall be directed.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The Lord hath made all things for himself: the wicked also for the evil day.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Every proud man is an abomination to the Lord: though hand should be joined to hand, he is not innocent. The beginning of a good way is to do justice: and this is more acceptable with God, than to offer sacrifices.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>By mercy and truth iniquity is redeemed; and by the fear of the Lord men depart from evil.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>When the ways of man shall please the Lord, he will convert even his enemies to peace.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Better is a little with justice, than great revenues with iniquity.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The heart of man disposeth his way: but the Lord must direct his steps.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Divination is in the lips of the king, his mouth shall not err in judgment.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Weight and balance are judgments of the Lord: and his work all the weights of the bag.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They that act wickedly are abominable to the king: for the throne is established by justice.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Just lips are the delight of kings: he that speaketh right things shall be loved.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The wrath of a king is as messengers of death: and the wise man will pacify it.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In the cheerfulness of the king’s countenance is life: and his clemency is like the latter rain.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Get wisdom, because it is better than gold: and purchase prudence, for it is more precious than silver.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The path of the just departeth from evils: he that keepeth his soul keepeth his way.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Pride goeth before destruction: and the spirit is lifted up before a fall.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>It is better to be humbled with the meek, than to divide spoils with the proud.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The learned in word shall find good things: and he that trusteth in the Lord is blessed.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The wise in heart shall be called prudent: and he that is sweet in words, shall attain to greater things.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Knowledge is a fountain of life to him that possesseth it: the instruction of fools is foolishness.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The heart of the wise shall instruct his mouth: and shall add grace to his lips.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Well ordered words are as a honeycomb: sweet to the soul, and health to the bones.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>There is a way that seemeth to a man right: and the ends thereof lead to death.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The soul of him that laboureth, laboureth for himself, because his mouth hath obliged him to it.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The wicked man diggeth evil, and in his lips is a burning fire.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>A perverse man stirreth up quarrels: and one full of words separateth princes.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>An unjust man allureth his friend: and leadeth him into a way that is not good.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>He that with fixed eyes deviseth wicked things, biting his lips, bringeth evil to pass.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Old age is a crown of dignity, when it is found in the ways of justice.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The patient man is better than the valiant: and he that ruleth his spirit, than he that taketh cities.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Lots are cast into the lap, but they are disposed of by the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hominis est animam præparare, et Domini gubernare linguam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Omnes viæ hominis patent oculis ejus ; spirituum ponderator est Dominus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Revela Domino opera tua, et dirigentur cogitationes tuæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Universa propter semetipsum operatus est Dominus ; impium quoque ad diem malum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Abominatio Domini est omnis arrogans ; etiamsi manus ad manum fuerit, non est innocens. Initium viæ bonæ facere justitiam ; accepta est autem apud Deum magis quam immolare hostias.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Misericordia et veritate redimitur iniquitas, et in timore Domini declinatur a malo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Cum placuerint Domino viæ hominis, inimicos quoque ejus convertet ad pacem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Melius est parum cum justitia quam multi fructus cum iniquitate.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cor hominis disponit viam suam, sed Domini est dirigere gressus ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Divinatio in labiis regis ; in judicio non errabit os ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Pondus et statera judicia Domini sunt, et opera ejus omnes lapides sacculi.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Abominabiles regi qui agunt impie, quoniam justitia firmatur solium.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Voluntas regum labia justa ; qui recta loquitur diligetur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Indignatio regis nuntii mortis, et vir sapiens placabit eam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In hilaritate vultus regis vita, et clementia ejus quasi imber serotinus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Posside sapientiam, quia auro melior est, et acquire prudentiam, quia pretiosior est argento.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Semita justorum declinat mala ; custos animæ suæ servat viam suam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Contritionem præcedit superbia, et ante ruinam exaltatur spiritus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Melius est humiliari cum mitibus quam dividere spolia cum superbis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Eruditus in verbo reperiet bona, et qui sperat in Domino beatus est.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui sapiens est corde appellabitur prudens, et qui dulcis eloquio majora percipiet.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Fons vitæ eruditio possidentis ; doctrina stultorum fatuitas.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cor sapientis erudiet os ejus, et labiis ejus addet gratiam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Favus mellis composita verba ; dulcedo animæ sanitas ossium.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Est via quæ videtur homini recta, et novissima ejus ducunt ad mortem.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Anima laborantis laborat sibi, quia compulit eum os suum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Vir impius fodit malum, et in labiis ejus ignis ardescit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Homo perversus suscitat lites, et verbosus separat principes.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vir iniquus lactat amicum suum, et ducit eum per viam non bonam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Qui attonitis oculis cogitat prava, mordens labia sua perficit malum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Corona dignitatis senectus, quæ in viis justitiæ reperietur.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Melior est patiens viro forti, et qui dominatur animo suo expugnatore urbium.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Sortes mittuntur in sinum, sed a Domino temperantur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 15</span></span></a> ,[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PRO.16\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":16,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"It is the part of man to prepare the soul: and of the Lord to govern the tongue.\"},{\"verse\":2,\"text\":\"All the ways of a man are open to his eyes: the Lord is the weigher of spirits.\"},{\"verse\":3,\"text\":\"Lay open thy works to the Lord: and thy thoughts shall be directed.\"},{\"verse\":4,\"text\":\"The Lord hath made all things for himself: the wicked also for the evil day.\"},{\"verse\":5,\"text\":\"Every proud man is an abomination to the Lord: though hand should be joined to hand, he is not innocent. The beginning of a good way is to do justice: and this is more acceptable with God, than to offer sacrifices.\"},{\"verse\":6,\"text\":\"By mercy and truth iniquity is redeemed; and by the fear of the Lord men depart from evil.\"},{\"verse\":7,\"text\":\"When the ways of man shall please the Lord, he will convert even his enemies to peace.\"},{\"verse\":8,\"text\":\"Better is a little with justice, than great revenues with iniquity.\"},{\"verse\":9,\"text\":\"The heart of man disposeth his way: but the Lord must direct his steps.\"},{\"verse\":10,\"text\":\"Divination is in the lips of the king, his mouth shall not err in judgment.\"},{\"verse\":11,\"text\":\"Weight and balance are judgments of the Lord: and his work all the weights of the bag.\"},{\"verse\":12,\"text\":\"They that act wickedly are abominable to the king: for the throne is established by justice.\"},{\"verse\":13,\"text\":\"Just lips are the delight of kings: he that speaketh right things shall be loved.\"},{\"verse\":14,\"text\":\"The wrath of a king is as messengers of death: and the wise man will pacify it.\"},{\"verse\":15,\"text\":\"In the cheerfulness of the king’s countenance is life: and his clemency is like the latter rain.\"},{\"verse\":16,\"text\":\"Get wisdom, because it is better than gold: and purchase prudence, for it is more precious than silver.\"},{\"verse\":17,\"text\":\"The path of the just departeth from evils: he that keepeth his soul keepeth his way.\"},{\"verse\":18,\"text\":\"Pride goeth before destruction: and the spirit is lifted up before a fall.\"},{\"verse\":19,\"text\":\"It is better to be humbled with the meek, than to divide spoils with the proud.\"},{\"verse\":20,\"text\":\"The learned in word shall find good things: and he that trusteth in the Lord is blessed.\"},{\"verse\":21,\"text\":\"The wise in heart shall be called prudent: and he that is sweet in words, shall attain to greater things.\"},{\"verse\":22,\"text\":\"Knowledge is a fountain of life to him that possesseth it: the instruction of fools is foolishness.\"},{\"verse\":23,\"text\":\"The heart of the wise shall instruct his mouth: and shall add grace to his lips.\"},{\"verse\":24,\"text\":\"Well ordered words are as a honeycomb: sweet to the soul, and health to the bones.\"},{\"verse\":25,\"text\":\"There is a way that seemeth to a man right: and the ends thereof lead to death.\"},{\"verse\":26,\"text\":\"The soul of him that laboureth, laboureth for himself, because his mouth hath obliged him to it.\"},{\"verse\":27,\"text\":\"The wicked man diggeth evil, and in his lips is a burning fire.\"},{\"verse\":28,\"text\":\"A perverse man stirreth up quarrels: and one full of words separateth princes.\"},{\"verse\":29,\"text\":\"An unjust man allureth his friend: and leadeth him into a way that is not good.\"},{\"verse\":30,\"text\":\"He that with fixed eyes deviseth wicked things, biting his lips, bringeth evil to pass.\"},{\"verse\":31,\"text\":\"Old age is a crown of dignity, when it is found in the ways of justice.\"},{\"verse\":32,\"text\":\"The patient man is better than the valiant: and he that ruleth his spirit, than he that taketh cities.\"},{\"verse\":33,\"text\":\"Lots are cast into the lap, but they are disposed of by the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hominis est animam præparare, et Domini gubernare linguam.\"},{\"verse\":2,\"text\":\"Omnes viæ hominis patent oculis ejus ; spirituum ponderator est Dominus.\"},{\"verse\":3,\"text\":\"Revela Domino opera tua, et dirigentur cogitationes tuæ.\"},{\"verse\":4,\"text\":\"Universa propter semetipsum operatus est Dominus ; impium quoque ad diem malum.\"},{\"verse\":5,\"text\":\"Abominatio Domini est omnis arrogans ; etiamsi manus ad manum fuerit, non est innocens. Initium viæ bonæ facere justitiam ; accepta est autem apud Deum magis quam immolare hostias.\"},{\"verse\":6,\"text\":\"Misericordia et veritate redimitur iniquitas, et in timore Domini declinatur a malo.\"},{\"verse\":7,\"text\":\"Cum placuerint Domino viæ hominis, inimicos quoque ejus convertet ad pacem.\"},{\"verse\":8,\"text\":\"Melius est parum cum justitia quam multi fructus cum iniquitate.\"},{\"verse\":9,\"text\":\"Cor hominis disponit viam suam, sed Domini est dirigere gressus ejus.\"},{\"verse\":10,\"text\":\"Divinatio in labiis regis ; in judicio non errabit os ejus.\"},{\"verse\":11,\"text\":\"Pondus et statera judicia Domini sunt, et opera ejus omnes lapides sacculi.\"},{\"verse\":12,\"text\":\"Abominabiles regi qui agunt impie, quoniam justitia firmatur solium.\"},{\"verse\":13,\"text\":\"Voluntas regum labia justa ; qui recta loquitur diligetur.\"},{\"verse\":14,\"text\":\"Indignatio regis nuntii mortis, et vir sapiens placabit eam.\"},{\"verse\":15,\"text\":\"In hilaritate vultus regis vita, et clementia ejus quasi imber serotinus.\"},{\"verse\":16,\"text\":\"Posside sapientiam, quia auro melior est, et acquire prudentiam, quia pretiosior est argento.\"},{\"verse\":17,\"text\":\"Semita justorum declinat mala ; custos animæ suæ servat viam suam.\"},{\"verse\":18,\"text\":\"Contritionem præcedit superbia, et ante ruinam exaltatur spiritus.\"},{\"verse\":19,\"text\":\"Melius est humiliari cum mitibus quam dividere spolia cum superbis.\"},{\"verse\":20,\"text\":\"Eruditus in verbo reperiet bona, et qui sperat in Domino beatus est.\"},{\"verse\":21,\"text\":\"Qui sapiens est corde appellabitur prudens, et qui dulcis eloquio majora percipiet.\"},{\"verse\":22,\"text\":\"Fons vitæ eruditio possidentis ; doctrina stultorum fatuitas.\"},{\"verse\":23,\"text\":\"Cor sapientis erudiet os ejus, et labiis ejus addet gratiam.\"},{\"verse\":24,\"text\":\"Favus mellis composita verba ; dulcedo animæ sanitas ossium.\"},{\"verse\":25,\"text\":\"Est via quæ videtur homini recta, et novissima ejus ducunt ad mortem.\"},{\"verse\":26,\"text\":\"Anima laborantis laborat sibi, quia compulit eum os suum.\"},{\"verse\":27,\"text\":\"Vir impius fodit malum, et in labiis ejus ignis ardescit.\"},{\"verse\":28,\"text\":\"Homo perversus suscitat lites, et verbosus separat principes.\"},{\"verse\":29,\"text\":\"Vir iniquus lactat amicum suum, et ducit eum per viam non bonam.\"},{\"verse\":30,\"text\":\"Qui attonitis oculis cogitat prava, mordens labia sua perficit malum.\"},{\"verse\":31,\"text\":\"Corona dignitatis senectus, quæ in viis justitiæ reperietur.\"},{\"verse\":32,\"text\":\"Melior est patiens viro forti, et qui dominatur animo suo expugnatore urbium.\"},{\"verse\":33,\"text\":\"Sortes mittuntur in sinum, sed a Domino temperantur.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":15,\"label\":\"Proverbs 15\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":17,\"label\":\"Proverbs 17\"}}]]\n"])</script></body></html>
