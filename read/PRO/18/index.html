all ever be subject to reproach.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A fool receiveth not the words of prudence: unless thou say those things which are in his heart.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The wicked man, when he is come into the depth of sins, contemneth: but ignominy and reproach follow him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Words from the mouth of a man are as deep water: and the fountain of wisdom is an overflowing stream.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>It is not good to accept the person of the wicked, to decline from the truth of judgment.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The lips of a fool intermeddle with strife: and his mouth provoketh quarrels.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The mouth of a fool is his destruction: and his lips are the ruin of his soul.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The words of the double tongued are as if they were harmless: and they reach even to the inner parts of the bowels. Fear casteth down the slothful: and the souls of the effeminate shall be hungry.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that is loose and slack in his work, is the brother of him that wasteth his own works.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The name of the Lord is a strong tower: the just runneth to it, and shall be exalted.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The substance of the rich man is the city of his strength, and as a strong wall compassing him about.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Before destruction, the heart of a man is exalted: and before he be glorified, it is humbled.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that answereth before he heareth, sheweth himself to be a fool, and worthy of confusion.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The spirit of a man upholdeth his infirmity: but a spirit that is easily angered, who can bear?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>A wise heart shall acquire knowledge: and the ear of the wise seeketh instruction.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A man’s gift enlargeth his way, and maketh him room before princes.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The just is first accuser of himself: his friend cometh, and shall search him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The lot suppresseth contentions, and determineth even between the mighty.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A brother that is helped by his brother, is like a strong city: and judgments are like the bars of cities.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of the fruit of a man’s mouth shall his belly be satisfied: and the offspring of his lips shall fill him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Death and life are in the power of the tongue: they that love it, shall eat the fruits thereof.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He that hath found a good wife, hath found a good thing, and shall receive a pleasure from the Lord. He that driveth away a good wife, driveth away a good thing: but he that keepeth an adulteress, is foolish and wicked.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The poor will speak with supplications, and the rich will speak roughly.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>A man amiable in society, shall be more friendly than a brother.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Occasiones quærit qui vult recedere ab amico : omni tempore erit exprobrabilis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Non recipit stultus verba prudentiæ, nisi ea dixeris quæ versantur in corde ejus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Impius, cum in profundum venerit peccatorum, contemnit ; sed sequitur eum ignominia et opprobrium.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Aqua profunda verba ex ore viri, et torrens redundans fons sapientiæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Accipere personam impii non est bonum, ut declines a veritate judicii.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Labia stulti miscent se rixis, et os ejus jurgia provocat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Os stulti contritio ejus, et labia ipsius ruina animæ ejus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Verba bilinguis quasi simplicia, et ipsa perveniunt usque ad interiora ventris. Pigrum dejicit timor ; animæ autem effeminatorum esurient.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui mollis et dissolutus est in opere suo frater est sua opera dissipantis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Turris fortissima nomen Domini ; ad ipsum currit justus, et exaltabitur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Substantia divitis urbs roboris ejus, et quasi murus validus circumdans eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Antequam conteratur, exaltatur cor hominis, et antequam glorificetur, humiliatur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui prius respondet quam audiat, stultum se esse demonstrat, et confusione dignum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Spiritus viri sustentat imbecillitatem suam ; spiritum vero ad irascendum facilem quis poterit sustinere ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cor prudens possidebit scientiam, et auris sapientium quærit doctrinam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Donum hominis dilatat viam ejus, et ante principes spatium ei facit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Justus prior est accusator sui : venit amicus ejus, et investigabit eum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Contradictiones comprimit sors, et inter potentes quoque dijudicat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Frater qui adjuvatur a fratre quasi civitas firma, et judicia quasi vectes urbium.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>De fructu oris viri replebitur venter ejus, et genimina labiorum ipsius saturabunt eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Mors et vita in manu linguæ ; qui diligunt eam comedent fructus ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Qui invenit mulierem bonam invenit bonum, et hauriet jucunditatem a Domino. Qui expellit mulierem bonam expellit bonum ; qui autem tenet adulteram stultus est et impius.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cum obsecrationibus loquetur pauper, et dives effabitur rigide.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Vir amabilis ad societatem magis amicus erit quam frater.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 17</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/19/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 19</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg they reach even to the inner parts of the bowels. Fear casteth down the slothful: and the souls of the effeminate shall be hungry.\"},{\"verse\":9,\"text\":\"He that is loose and slack in his work, is the brother of him that wasteth his own works.\"},{\"verse\":10,\"text\":\"The name of the Lord is a strong tower: the just runneth to it, and shall be exalted.\"},{\"verse\":11,\"text\":\"The substance of the rich man is the city of his strength, and as a strong wall compassing him about.\"},{\"verse\":12,\"text\":\"Before destruction, the heart of a man is exalted: and before he be glorified, it is humbled.\"},{\"verse\":13,\"text\":\"He that answereth before he heareth, sheweth himself to be a fool, and worthy of confusion.\"},{\"verse\":14,\"text\":\"The spirit of a man upholdeth his infirmity: but a spirit that is easily angered, who can bear?\"},{\"verse\":15,\"text\":\"A wise heart shall acquire knowledge: and the ear of the wise seeketh instruction.\"},{\"verse\":16,\"text\":\"A man’s gift enlargeth his way, and maketh him room before princes.\"},{\"verse\":17,\"text\":\"The just is first accuser of himself: his friend cometh, and shall search him.\"},{\"verse\":18,\"text\":\"The lot suppresseth contentions, and determineth even between the mighty.\"},{\"verse\":19,\"text\":\"A brother that is helped by his brother, is like a strong city: and judgments are like the bars of cities.\"},{\"verse\":20,\"text\":\"Of the fruit of a man’s mouth shall his belly be satisfied: and the offspring of his lips shall fill him.\"},{\"verse\":21,\"text\":\"Death and life are in the power of the tongue: they that love it, shall eat the fruits thereof.\"},{\"verse\":22,\"text\":\"He that hath found a good wife, hath found a good thing, and shall receive a pleasure from the Lord. He that driveth away a good wife, driveth away a good thing: but he that keepeth an adulteress, is foolish and wicked.\"},{\"verse\":23,\"text\":\"The poor will speak with supplications, and the rich will speak roughly.\"},{\"verse\":24,\"text\":\"A man amiable in society, shall be more friendly than a brother.\"}],\"vul\":[{\"verse\":1,\"text\":\"Occasiones quærit qui vult recedere ab amico : omni tempore erit exprobrabilis.\"},{\"verse\":2,\"text\":\"Non recipit stultus verba prudentiæ, nisi ea dixeris quæ versantur in corde ejus.\"},{\"verse\":3,\"text\":\"Impius, cum in profundum venerit peccatorum, contemnit ; sed sequitur eum ignominia et opprobrium.\"},{\"verse\":4,\"text\":\"Aqua profunda verba ex ore viri, et torrens redundans fons sapientiæ.\"},{\"verse\":5,\"text\":\"Accipere personam impii non est bonum, ut declines a veritate judicii.\"},{\"verse\":6,\"text\":\"Labia stulti miscent se rixis, et os ejus jurgia provocat.\"},{\"verse\":7,\"text\":\"Os stulti contritio ejus, et labia ipsius ruina animæ ejus.\"},{\"verse\":8,\"text\":\"Verba bilinguis quasi simplicia, et ipsa perveniunt usque ad interiora ventris. Pigrum dejicit timor ; animæ autem effeminatorum esurient.\"},{\"verse\":9,\"text\":\"Qui mollis et dissolutus est in opere suo frater est sua opera dissipantis.\"},{\"verse\":10,\"text\":\"Turris fortissima nomen Domini ; ad ipsum currit justus, et exaltabitur.\"},{\"verse\":11,\"text\":\"Substantia divitis urbs roboris ejus, et quasi murus validus circumdans eum.\"},{\"verse\":12,\"text\":\"Antequam conteratur, exaltatur cor hominis, et antequam glorificetur, humiliatur.\"},{\"verse\":13,\"text\":\"Qui prius respondet quam audiat, stultum se esse demonstrat, et confusione dignum.\"},{\"verse\":14,\"text\":\"Spiritus viri sustentat imbecillitatem suam ; spiritum vero ad irascendum facilem quis poterit sustinere ?\"},{\"verse\":15,\"text\":\"Cor prudens possidebit scientiam, et auris sapientium quærit doctrinam.\"},{\"verse\":16,\"text\":\"Donum hominis dilatat viam ejus, et ante principes spatium ei facit.\"},{\"verse\":17,\"text\":\"Justus prior est accusator sui : venit amicus ejus, et investigabit eum.\"},{\"verse\":18,\"text\":\"Contradictiones comprimit sors, et inter potentes quoque dijudicat.\"},{\"verse\":19,\"text\":\"Frater qui adjuvatur a fratre quasi civitas firma, et judicia quasi vectes urbium.\"},{\"verse\":20,\"text\":\"De fructu oris viri replebitur venter ejus, et genimina labiorum ipsius saturabunt eum.\"},{\"verse\":21,\"text\":\"Mors et vita in manu linguæ ; qui diligunt eam comedent fructus ejus.\"},{\"verse\":22,\"text\":\"Qui invenit mulierem bonam invenit bonum, et hauriet jucunditatem a Domino. Qui expellit mulierem bonam expellit bonum ; qui autem tenet adulteram stultus est et impius.\"},{\"verse\":23,\"text\":\"Cum obsecrationibus loquetur pauper, et dives effabitur rigide.\"},{\"verse\":24,\"text\":\"Vir amabilis ad societatem magis amicus erit quam frater.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":17,\"label\":\"Proverbs 17\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":19,\"label\":\"Proverbs 19\"}}]]\n"])</script></body></html>
