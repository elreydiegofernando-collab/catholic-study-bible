ood and the evil.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>A peaceable tongue is a tree of life: but that which is immoderate, shall crush the spirit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A fool laugheth at the instruction of his father: but he that regardeth reproofs shall become prudent. In abundant justice there is the greatest strength: but the devices of the wicked shall be rooted out.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The house of the just is very much strength: and in the fruits of the wicked is trouble.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The lips of the wise shall disperse knowledge: the heart of fools shall be unlike.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The victims of the wicked are abominable to the Lord: the vows of the just are acceptable.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The way of the wicked is an abomination to the Lord: he that followeth justice is beloved by him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Instruction is grievous to him that forsaketh the way of life: he that hateth reproof shall die.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hell and destruction are before the Lord: how much more the hearts of the children of men?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A corrupt man loveth not one that reproveth him: nor will he go to the wise.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>A glad heart maketh a cheerful countenance: but by grief of mind the spirit is cast down.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The heart of the wise seeketh instruction: and the mouth of fools feedeth on foolishness.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>All the days of the poor are evil: a secure mind is like a continual feast.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Better is a little with the fear of the Lord, than great treasures without content.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>It is better to be invited to herbs with love, than to a fatted calf with hatred.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A passionate man stirreth up strifes: he that is patient appeaseth those that are stirred up.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The way of the slothful is as a hedge of thorns: the way of the just is without offence.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>A wise son maketh a father joyful: but the foolish man despiseth his mother.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Folly is joy to the fool: and the wise man maketh straight his steps.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Designs are brought to nothing where there is no counsel: but where there are many counsellors, they are established.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>A man rejoiceth in the sentence of his mouth: and a word in due time is best.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The path of life is above for the wise, that he may decline from the lowest hell.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The Lord will destroy the house of the proud: and will strengthen the borders of the widow.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Evil thoughts are an abomination to the Lord: and pure words most beautiful shall be confirmed by him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He that is greedy of gain troubleth his own house: but he that hateth bribes shall live. By mercy and faith sins are purged away: and by the fear of the Lord every one declineth from evil.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The mind of the just studieth obedience: the mouth of the wicked overfloweth with evils.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The Lord is far from the wicked: and he will hear the prayers of the just.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The light of the eyes rejoiceth the soul: a good name maketh the bones fat.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The ear that heareth the reproofs of life, shall abide in the midst of the wise.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>He that rejecteth instruction, despiseth his own soul: but he that yieldeth to reproof, possesseth understanding.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The fear of the Lord is the lesson of wisdom: and humility goeth before glory.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Responsio mollis frangit iram ; sermo durus suscitat furorem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Lingua sapientium ornat scientiam ; os fatuorum ebullit stultitiam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In omni loco, oculi Domini contemplantur bonos et malos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Lingua placabilis lignum vitæ ; quæ autem immoderata est conteret spiritum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Stultus irridet disciplinam patris sui ; qui autem custodit increpationes astutior fiet. In abundanti justitia virtus maxima est : cogitationes autem impiorum eradicabuntur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Domus justi plurima fortitudo, et in fructibus impii conturbatio.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Labia sapientium disseminabunt scientiam ; cor stultorum dissimile erit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Victimæ impiorum abominabiles Domino ; vota justorum placabilia.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Abominatio est Domino via impii ; qui sequitur justitiam diligitur ab eo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Doctrina mala deserenti viam vitæ ; qui increpationes odit, morietur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Infernus et perditio coram Domino ; quanto magis corda filiorum hominum !</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Non amat pestilens eum qui se corripit, nec ad sapientes graditur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cor gaudens exhilarat faciem ; in mœrore animi dejicitur spiritus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cor sapientis quærit doctrinam, et os stultorum pascitur imperitia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnes dies pauperis, mali ; secura mens quasi juge convivium.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Melius est parum cum timore Domini, quam thesauri magni et insatiabiles.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Melius est vocari ad olera cum caritate, quam ad vitulum saginatum cum odio.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Vir iracundus provocat rixas ; qui patiens est mitigat suscitatas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Iter pigrorum quasi sepes spinarum ; via justorum absque offendiculo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Filius sapiens lætificat patrem, et stultus homo despicit matrem suam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Stultitia gaudium stulto, et vir prudens dirigit gressus suos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dissipantur cogitationes ubi non est consilium ; ubi vero sunt plures consiliarii, confirmantur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Lætatur homo in sententia oris sui, et sermo opportunus est optimus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Semita vitæ super eruditum, ut declinet de inferno novissimo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Domum superborum demolietur Dominus, et firmos faciet terminos viduæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Abominatio Domini cogitationes malæ, et purus sermo pulcherrimus firmabitur ab eo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Conturbat domum suam qui sectatur avaritiam ; qui autem odit munera, vivet. Per misericordiam et fidem purgantur peccata : per timorem autem Domini declinat omnis a malo.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mens justi meditatur obedientiam ; os impiorum redundat malis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Longe est Dominus ab impiis, et orationes justorum exaudiet.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Lux oculorum lætificat animam ; fama bona impinguat ossa.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Auris quæ audit increpationes vitæ in medio sapientium commorabitur.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Qui abjicit disciplinam despicit animam suam ; qui autem acquiescit increpationibus possessor est cordis.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Timor Domini disciplina sapientiæ, et gloriam præcedit humilitas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif tex  In abundant justice there is the greatest strength: but the devices of the wicked shall be rooted out.\"},{\"verse\":6,\"text\":\"The house of the just is very much strength: and in the fruits of the wicked is trouble.\"},{\"verse\":7,\"text\":\"The lips of the wise shall disperse knowledge: the heart of fools shall be unlike.\"},{\"verse\":8,\"text\":\"The victims of the wicked are abominable to the Lord: the vows of the just are acceptable.\"},{\"verse\":9,\"text\":\"The way of the wicked is an abomination to the Lord: he that followeth justice is beloved by him.\"},{\"verse\":10,\"text\":\"Instruction is grievous to him that forsaketh the way of life: he that hateth reproof shall die.\"},{\"verse\":11,\"text\":\"Hell and destruction are before the Lord: how much more the hearts of the children of men?\"},{\"verse\":12,\"text\":\"A corrupt man loveth not one that reproveth him: nor will he go to the wise.\"},{\"verse\":13,\"text\":\"A glad heart maketh a cheerful countenance: but by grief of mind the spirit is cast down.\"},{\"verse\":14,\"text\":\"The heart of the wise seeketh instruction: and the mouth of fools feedeth on foolishness.\"},{\"verse\":15,\"text\":\"All the days of the poor are evil: a secure mind is like a continual feast.\"},{\"verse\":16,\"text\":\"Better is a little with the fear of the Lord, than great treasures without content.\"},{\"verse\":17,\"text\":\"It is better to be invited to herbs with love, than to a fatted calf with hatred.\"},{\"verse\":18,\"text\":\"A passionate man stirreth up strifes: he that is patient appeaseth those that are stirred up.\"},{\"verse\":19,\"text\":\"The way of the slothful is as a hedge of thorns: the way of the just is without offence.\"},{\"verse\":20,\"text\":\"A wise son maketh a father joyful: but the foolish man despiseth his mother.\"},{\"verse\":21,\"text\":\"Folly is joy to the fool: and the wise man maketh straight his steps.\"},{\"verse\":22,\"text\":\"Designs are brought to nothing where there is no counsel: but where there are many counsellors, they are established.\"},{\"verse\":23,\"text\":\"A man rejoiceth in the sentence of his mouth: and a word in due time is best.\"},{\"verse\":24,\"text\":\"The path of life is above for the wise, that he may decline from the lowest hell.\"},{\"verse\":25,\"text\":\"The Lord will destroy the house of the proud: and will strengthen the borders of the widow.\"},{\"verse\":26,\"text\":\"Evil thoughts are an abomination to the Lord: and pure words most beautiful shall be confirmed by him.\"},{\"verse\":27,\"text\":\"He that is greedy of gain troubleth his own house: but he that hateth bribes shall live. By mercy and faith sins are purged away: and by the fear of the Lord every one declineth from evil.\"},{\"verse\":28,\"text\":\"The mind of the just studieth obedience: the mouth of the wicked overfloweth with evils.\"},{\"verse\":29,\"text\":\"The Lord is far from the wicked: and he will hear the prayers of the just.\"},{\"verse\":30,\"text\":\"The light of the eyes rejoiceth the soul: a good name maketh the bones fat.\"},{\"verse\":31,\"text\":\"The ear that heareth the reproofs of life, shall abide in the midst of the wise.\"},{\"verse\":32,\"text\":\"He that rejecteth instruction, despiseth his own soul: but he that yieldeth to reproof, possesseth understanding.\"},{\"verse\":33,\"text\":\"The fear of the Lord is the lesson of wisdom: and humility goeth before glory.\"}],\"vul\":[{\"verse\":1,\"text\":\"Responsio mollis frangit iram ; sermo durus suscitat furorem.\"},{\"verse\":2,\"text\":\"Lingua sapientium ornat scientiam ; os fatuorum ebullit stultitiam.\"},{\"verse\":3,\"text\":\"In omni loco, oculi Domini contemplantur bonos et malos.\"},{\"verse\":4,\"text\":\"Lingua placabilis lignum vitæ ; quæ autem immoderata est conteret spiritum.\"},{\"verse\":5,\"text\":\"Stultus irridet disciplinam patris sui ; qui autem custodit increpationes astutior fiet. In abundanti justitia virtus maxima est : cogitationes autem impiorum eradicabuntur.\"},{\"verse\":6,\"text\":\"Domus justi plurima fortitudo, et in fructibus impii conturbatio.\"},{\"verse\":7,\"text\":\"Labia sapientium disseminabunt scientiam ; cor stultorum dissimile erit.\"},{\"verse\":8,\"text\":\"Victimæ impiorum abominabiles Domino ; vota justorum placabilia.\"},{\"verse\":9,\"text\":\"Abominatio est Domino via impii ; qui sequitur justitiam diligitur ab eo.\"},{\"verse\":10,\"text\":\"Doctrina mala deserenti viam vitæ ; qui increpationes odit, morietur.\"},{\"verse\":11,\"text\":\"Infernus et perditio coram Domino ; quanto magis corda filiorum hominum !\"},{\"verse\":12,\"text\":\"Non amat pestilens eum qui se corripit, nec ad sapientes graditur.\"},{\"verse\":13,\"text\":\"Cor gaudens exhilarat faciem ; in mœrore animi dejicitur spiritus.\"},{\"verse\":14,\"text\":\"Cor sapientis quærit doctrinam, et os stultorum pascitur imperitia.\"},{\"verse\":15,\"text\":\"Omnes dies pauperis, mali ; secura mens quasi juge convivium.\"},{\"verse\":16,\"text\":\"Melius est parum cum timore Domini, quam thesauri magni et insatiabiles.\"},{\"verse\":17,\"text\":\"Melius est vocari ad olera cum caritate, quam ad vitulum saginatum cum odio.\"},{\"verse\":18,\"text\":\"Vir iracundus provocat rixas ; qui patiens est mitigat suscitatas.\"},{\"verse\":19,\"text\":\"Iter pigrorum quasi sepes spinarum ; via justorum absque offendiculo.\"},{\"verse\":20,\"text\":\"Filius sapiens lætificat patrem, et stultus homo despicit matrem suam.\"},{\"verse\":21,\"text\":\"Stultitia gaudium stulto, et vir prudens dirigit gressus suos.\"},{\"verse\":22,\"text\":\"Dissipantur cogitationes ubi non est consilium ; ubi vero sunt plures consiliarii, confirmantur.\"},{\"verse\":23,\"text\":\"Lætatur homo in sententia oris sui, et sermo opportunus est optimus.\"},{\"verse\":24,\"text\":\"Semita vitæ super eruditum, ut declinet de inferno novissimo.\"},{\"verse\":25,\"text\":\"Domum superborum demolietur Dominus, et firmos faciet terminos viduæ.\"},{\"verse\":26,\"text\":\"Abominatio Domini cogitationes malæ, et purus sermo pulcherrimus firmabitur ab eo.\"},{\"verse\":27,\"text\":\"Conturbat domum suam qui sectatur avaritiam ; qui autem odit munera, vivet. Per misericordiam et fidem purgantur peccata : per timorem autem Domini declinat omnis a malo.\"},{\"verse\":28,\"text\":\"Mens justi meditatur obedientiam ; os impiorum redundat malis.\"},{\"verse\":29,\"text\":\"Longe est Dominus ab impiis, et orationes justorum exaudiet.\"},{\"verse\":30,\"text\":\"Lux oculorum lætificat animam ; fama bona impinguat ossa.\"},{\"verse\":31,\"text\":\"Auris quæ audit increpationes vitæ in medio sapientium commorabitur.\"},{\"verse\":32,\"text\":\"Qui abjicit disciplinam despicit animam suam ; qui autem acquiescit increpationibus possessor est cordis.\"},{\"verse\":33,\"text\":\"Timor Domini disciplina sapientiæ, et gloriam præcedit humilitas.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":14,\"label\":\"Proverbs 14\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":16,\"label\":\"Proverbs 16\"}}]]\n"])</script></body></html>
