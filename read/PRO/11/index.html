ght is his will.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Where pride is, there also shall be reproach: but where humility is, there also is wisdom.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The simplicity of the just shall guide them: and the deceitfulness of the wicked shall destroy them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Riches shall not profit in the day of revenge: but justice shall deliver from death.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The justice of the upright shall make his way prosperous: and the wicked man shall fall by his own wickedness.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The justice of the righteous shall deliver them: and the unjust shall be caught in their own snares.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>When the wicked man is dead, there shall be no hope any more: and the expectation of the solicitous shall perish.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The just is delivered out of distress: and the wicked shall be given up for him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The dissembler with his mouth deceiveth his friend: but the just shall be delivered by knowledge.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>When it goeth well with the just, the city shall rejoice: and when the wicked perish, there shall be praise.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>By the blessing of the just the city shall be exalted: and by the mouth of the wicked it shall be overthrown.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He that despiseth his friend, is mean of heart: but the wise man will hold his peace.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that walketh deceitfully, revealeth secrets: but he that is faithful, concealeth the thing committed to him by his friend.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Where there is no governor, the people shall fall: but there is safety where there is much counsel.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He shall be afflicted with evil, that is surety for a stranger: but he that is aware of snares, shall be secure.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A gracious woman shall find glory: and the strong shall have riches.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>A merciful man doth good to his own soul: but he that is cruel casteth off even his own kindred.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The wicked maketh an unsteady work: but to him that soweth justice, there is a faithful reward.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Clemency prepareth life: and the pursuing of evil things, death.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>A perverse heart is abominable to the Lord: and his will is in them that walk sincerely.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hand in hand the evil man shall not be innocent: but the seed of the just shall be saved.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A golden ring in a swine’s snout, a woman fair and foolish.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The desire of the just is all good, the expectation of the wicked is indignation.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Some distribute their own goods, and grow richer: others take away what is not their own, and are always in want.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The soul that blesseth, shall be made fat: and he that inebriateth, shall be inebriated also himself.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He that hideth up corn, shall be cursed among the people: but a blessing upon the head of them that sell.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Well doth he rise early who seeketh good things; but he that seeketh after evil things, shall be oppressed by them.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He that trusteth in his riches shall fall: but the just shall spring up as a green leaf.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He that troubleth his own house, shall inherit the winds: and the fool shall serve the wise.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The fruit of the just man is a tree of life: and he that gaineth souls is wise.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>If the just man receive in the earth, how much more the wicked and the sinner.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Statera dolosa abominatio est apud Dominum, et pondus æquum voluntas ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ubi fuerit superbia, ibi erit et contumelia ; ubi autem est humilitas, ibi et sapientia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Simplicitas justorum diriget eos, et supplantatio perversorum vastabit illos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Non proderunt divitiæ in die ultionis ; justitia autem liberabit a morte.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Justitia simplicis diriget viam ejus, et in impietate sua corruet impius.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Justitia rectorum liberabit eos, et in insidiis suis capientur iniqui.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Mortuo homine impio, nulla erit ultra spes, et exspectatio sollicitorum peribit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Justus de angustia liberatus est, et tradetur impius pro eo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Simulator ore decipit amicum suum ; justi autem liberabuntur scientia.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In bonis justorum exsultabit civitas, et in perditione impiorum erit laudatio.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Benedictione justorum exaltabitur civitas, et ore impiorum subvertetur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Qui despicit amicum suum indigens corde est ; vir autem prudens tacebit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui ambulat fraudulenter, revelat arcana ; qui autem fidelis est animi, celat amici commissum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ubi non est gubernator, populus corruet ; salus autem, ubi multa consilia.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Affligetur malo qui fidem facit pro extraneo ; qui autem cavet laqueos securus erit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mulier gratiosa inveniet gloriam, et robusti habebunt divitias.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Benefacit animæ suæ vir misericors ; qui autem crudelis est, etiam propinquos abjicit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Impius facit opus instabile, seminanti autem justitiam merces fidelis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Clementia præparat vitam, et sectatio malorum mortem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Abominabile Domino cor pravum, et voluntas ejus in iis qui simpliciter ambulant.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Manus in manu non erit innocens malus ; semen autem justorum salvabitur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Circulus aureus in naribus suis, mulier pulchra et fatua.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Desiderium justorum omne bonum est ; præstolatio impiorum furor.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Alii dividunt propria, et ditiores fiunt ; alii rapiunt non sua, et semper in egestate sunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Anima quæ benedicit impinguabitur, et qui inebriat, ipse quoque inebriabitur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui abscondit frumenta maledicetur in populis ; benedictio autem super caput vendentium.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Bene consurgit diluculo qui quærit bona ; qui autem investigator malorum est, opprimetur ab eis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Qui confidit in divitiis suis corruet : justi autem quasi virens folium germinabunt.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Qui conturbat domum suam possidebit ventos, et qui stultus est serviet sapienti.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Fructus justi lignum vitæ, et qui suscipit animas sapiens est.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si justus in terra recipit, quanto magis impius et peccator !</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/12/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block tru m: and the unjust shall be caught in their own snares.\"},{\"verse\":7,\"text\":\"When the wicked man is dead, there shall be no hope any more: and the expectation of the solicitous shall perish.\"},{\"verse\":8,\"text\":\"The just is delivered out of distress: and the wicked shall be given up for him.\"},{\"verse\":9,\"text\":\"The dissembler with his mouth deceiveth his friend: but the just shall be delivered by knowledge.\"},{\"verse\":10,\"text\":\"When it goeth well with the just, the city shall rejoice: and when the wicked perish, there shall be praise.\"},{\"verse\":11,\"text\":\"By the blessing of the just the city shall be exalted: and by the mouth of the wicked it shall be overthrown.\"},{\"verse\":12,\"text\":\"He that despiseth his friend, is mean of heart: but the wise man will hold his peace.\"},{\"verse\":13,\"text\":\"He that walketh deceitfully, revealeth secrets: but he that is faithful, concealeth the thing committed to him by his friend.\"},{\"verse\":14,\"text\":\"Where there is no governor, the people shall fall: but there is safety where there is much counsel.\"},{\"verse\":15,\"text\":\"He shall be afflicted with evil, that is surety for a stranger: but he that is aware of snares, shall be secure.\"},{\"verse\":16,\"text\":\"A gracious woman shall find glory: and the strong shall have riches.\"},{\"verse\":17,\"text\":\"A merciful man doth good to his own soul: but he that is cruel casteth off even his own kindred.\"},{\"verse\":18,\"text\":\"The wicked maketh an unsteady work: but to him that soweth justice, there is a faithful reward.\"},{\"verse\":19,\"text\":\"Clemency prepareth life: and the pursuing of evil things, death.\"},{\"verse\":20,\"text\":\"A perverse heart is abominable to the Lord: and his will is in them that walk sincerely.\"},{\"verse\":21,\"text\":\"Hand in hand the evil man shall not be innocent: but the seed of the just shall be saved.\"},{\"verse\":22,\"text\":\"A golden ring in a swine’s snout, a woman fair and foolish.\"},{\"verse\":23,\"text\":\"The desire of the just is all good, the expectation of the wicked is indignation.\"},{\"verse\":24,\"text\":\"Some distribute their own goods, and grow richer: others take away what is not their own, and are always in want.\"},{\"verse\":25,\"text\":\"The soul that blesseth, shall be made fat: and he that inebriateth, shall be inebriated also himself.\"},{\"verse\":26,\"text\":\"He that hideth up corn, shall be cursed among the people: but a blessing upon the head of them that sell.\"},{\"verse\":27,\"text\":\"Well doth he rise early who seeketh good things; but he that seeketh after evil things, shall be oppressed by them.\"},{\"verse\":28,\"text\":\"He that trusteth in his riches shall fall: but the just shall spring up as a green leaf.\"},{\"verse\":29,\"text\":\"He that troubleth his own house, shall inherit the winds: and the fool shall serve the wise.\"},{\"verse\":30,\"text\":\"The fruit of the just man is a tree of life: and he that gaineth souls is wise.\"},{\"verse\":31,\"text\":\"If the just man receive in the earth, how much more the wicked and the sinner.\"}],\"vul\":[{\"verse\":1,\"text\":\"Statera dolosa abominatio est apud Dominum, et pondus æquum voluntas ejus.\"},{\"verse\":2,\"text\":\"Ubi fuerit superbia, ibi erit et contumelia ; ubi autem est humilitas, ibi et sapientia.\"},{\"verse\":3,\"text\":\"Simplicitas justorum diriget eos, et supplantatio perversorum vastabit illos.\"},{\"verse\":4,\"text\":\"Non proderunt divitiæ in die ultionis ; justitia autem liberabit a morte.\"},{\"verse\":5,\"text\":\"Justitia simplicis diriget viam ejus, et in impietate sua corruet impius.\"},{\"verse\":6,\"text\":\"Justitia rectorum liberabit eos, et in insidiis suis capientur iniqui.\"},{\"verse\":7,\"text\":\"Mortuo homine impio, nulla erit ultra spes, et exspectatio sollicitorum peribit.\"},{\"verse\":8,\"text\":\"Justus de angustia liberatus est, et tradetur impius pro eo.\"},{\"verse\":9,\"text\":\"Simulator ore decipit amicum suum ; justi autem liberabuntur scientia.\"},{\"verse\":10,\"text\":\"In bonis justorum exsultabit civitas, et in perditione impiorum erit laudatio.\"},{\"verse\":11,\"text\":\"Benedictione justorum exaltabitur civitas, et ore impiorum subvertetur.\"},{\"verse\":12,\"text\":\"Qui despicit amicum suum indigens corde est ; vir autem prudens tacebit.\"},{\"verse\":13,\"text\":\"Qui ambulat fraudulenter, revelat arcana ; qui autem fidelis est animi, celat amici commissum.\"},{\"verse\":14,\"text\":\"Ubi non est gubernator, populus corruet ; salus autem, ubi multa consilia.\"},{\"verse\":15,\"text\":\"Affligetur malo qui fidem facit pro extraneo ; qui autem cavet laqueos securus erit.\"},{\"verse\":16,\"text\":\"Mulier gratiosa inveniet gloriam, et robusti habebunt divitias.\"},{\"verse\":17,\"text\":\"Benefacit animæ suæ vir misericors ; qui autem crudelis est, etiam propinquos abjicit.\"},{\"verse\":18,\"text\":\"Impius facit opus instabile, seminanti autem justitiam merces fidelis.\"},{\"verse\":19,\"text\":\"Clementia præparat vitam, et sectatio malorum mortem.\"},{\"verse\":20,\"text\":\"Abominabile Domino cor pravum, et voluntas ejus in iis qui simpliciter ambulant.\"},{\"verse\":21,\"text\":\"Manus in manu non erit innocens malus ; semen autem justorum salvabitur.\"},{\"verse\":22,\"text\":\"Circulus aureus in naribus suis, mulier pulchra et fatua.\"},{\"verse\":23,\"text\":\"Desiderium justorum omne bonum est ; præstolatio impiorum furor.\"},{\"verse\":24,\"text\":\"Alii dividunt propria, et ditiores fiunt ; alii rapiunt non sua, et semper in egestate sunt.\"},{\"verse\":25,\"text\":\"Anima quæ benedicit impinguabitur, et qui inebriat, ipse quoque inebriabitur.\"},{\"verse\":26,\"text\":\"Qui abscondit frumenta maledicetur in populis ; benedictio autem super caput vendentium.\"},{\"verse\":27,\"text\":\"Bene consurgit diluculo qui quærit bona ; qui autem investigator malorum est, opprimetur ab eis.\"},{\"verse\":28,\"text\":\"Qui confidit in divitiis suis corruet : justi autem quasi virens folium germinabunt.\"},{\"verse\":29,\"text\":\"Qui conturbat domum suam possidebit ventos, et qui stultus est serviet sapienti.\"},{\"verse\":30,\"text\":\"Fructus justi lignum vitæ, et qui suscipit animas sapiens est.\"},{\"verse\":31,\"text\":\"Si justus in terra recipit, quanto magis impius et peccator !\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":10,\"label\":\"Proverbs 10\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":12,\"label\":\"Proverbs 12\"}}]]\n"])</script></body></html>
