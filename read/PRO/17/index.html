rife.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A wise servant shall rule over foolish sons, and shall divide the inheritance among the brethren.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>As silver is tried by fire, and gold in the furnace: so the Lord trieth the hearts.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The evil man obeyeth an unjust tongue: and the deceitful hearkeneth to lying lips.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He that despiseth the poor, reproacheth his maker: and he that rejoiceth at another man’s ruin, shall not be unpunished.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Children’s children are the crown of old men: and the glory of children are their fathers.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Eloquent words do not become a fool, nor lying lips a prince.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The expectation of him that expecteth is a most acceptable jewel: whithersoever he turneth himself, he understandeth wisely.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that concealeth a transgression, seeketh friendships: he that repeateth it again, separateth friends.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>A reproof availeth more with a wise man, than a hundred stripes with a fool.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>An evil man always seeketh quarrels: but a cruel angel shall be sent against him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>It is better to meet a bear robbed of her whelps, than a fool trusting in his own folly.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He that rendereth evil for good, evil shall not depart from his house.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The beginning of quarrels is as when one letteth out water: and before he suffereth reproach, he forsaketh judgment.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He that justifieth the wicked, and he that condemneth the just, both are abominable before God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>What doth it avail a fool to have riches, seeing he cannot buy wisdom? He that maketh his house high, seeketh a downfall: and he that refuseth to learn, shall fall into evils.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He that is a friend loveth at all times: and a brother is proved in distress.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A foolish man will clap hands, when he is surety for his friend.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He that studieth discords, loveth quarrels: and he that exalteth his door, seeketh ruin.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that is of a perverse heart, shall not find good: and he that perverteth his tongue, shall fall into evil.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A fool is born to his own disgrace: and even his father shall not rejoice in a fool.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>A joyful mind maketh age flourishing: a sorrowful spirit drieth up the bones.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The wicked man taketh gifts out of the bosom, that he may pervert the paths of judgment.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Wisdom shineth in the face of the wise: the eyes of fools are in the ends of the earth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>A foolish son is the anger of the father: and the sorrow of the mother that bore him.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>It is no good thing to do hurt to the just: nor to strike the prince, who judgeth right.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He that setteth bounds to his words, is knowing and wise: and the man of understanding is of a precious spirit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Even a fool, if he will hold his peace, shall be counted wise: and if he close his lips, a man of understanding.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Melior est buccella sicca cum gaudio quam domus plena victimis cum jurgio.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Servus sapiens dominabitur filiis stultis, et inter fratres hæreditatem dividet.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sicut igne probatur argentum et aurum camino, ita corda probat Dominus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Malus obedit linguæ iniquæ, et fallax obtemperat labiis mendacibus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Qui despicit pauperem exprobrat factori ejus, et qui ruina lætatur alterius non erit impunitus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Corona senum filii filiorum, et gloria filiorum patres eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non decent stultum verba composita, nec principem labium mentiens.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Gemma gratissima exspectatio præstolantis ; quocumque se vertit, prudenter intelligit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui celat delictum quærit amicitias ; qui altero sermone repetit, separat fœderatos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Plus proficit correptio apud prudentem, quam centum plagæ apud stultum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Semper jurgia quærit malus : angelus autem crudelis mittetur contra eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Expedit magis ursæ occurrere raptis fœtibus, quam fatuo confidenti in stultitia sua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui reddit mala pro bonis, non recedet malum de domo ejus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui dimittit aquam caput est jurgiorum, et antequam patiatur contumeliam judicium deserit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui justificat impium, et qui condemnat justum, abominabilis est uterque apud Deum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Quid prodest stulto habere divitias, cum sapientiam emere non possit ? Qui altum facit domum suam quærit ruinam, et qui evitat discere incidet in mala.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Omni tempore diligit qui amicus est, et frater in angustiis comprobatur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Stultus homo plaudet manibus, cum spoponderit pro amico suo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Qui meditatur discordias diligit rixas, et qui exaltat ostium quærit ruinam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui perversi cordis est non inveniet bonum, et qui vertit linguam incidet in malum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Natus est stultus in ignominiam suam ; sed nec pater in fatuo lætabitur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Animus gaudens ætatem floridam facit ; spiritus tristis exsiccat ossa.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Munera de sinu impius accipit, ut pervertat semitas judicii.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>In facie prudentis lucet sapientia ; oculi stultorum in finibus terræ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ira patris filius stultus, et dolor matris quæ genuit eum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Non est bonum damnum inferre justo, nec percutere principem qui recta judicat.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui moderatur sermones suos doctus et prudens est, et pretiosi spiritus vir eruditus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Stultus quoque, si tacuerit, sapiens reputabitur, et si compresserit labia sua, intelligens.</butt ic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PRO.17\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":17,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Better is a dry morsel with joy, than a house full of victims with strife.\"},{\"verse\":2,\"text\":\"A wise servant shall rule over foolish sons, and shall divide the inheritance among the brethren.\"},{\"verse\":3,\"text\":\"As silver is tried by fire, and gold in the furnace: so the Lord trieth the hearts.\"},{\"verse\":4,\"text\":\"The evil man obeyeth an unjust tongue: and the deceitful hearkeneth to lying lips.\"},{\"verse\":5,\"text\":\"He that despiseth the poor, reproacheth his maker: and he that rejoiceth at another man’s ruin, shall not be unpunished.\"},{\"verse\":6,\"text\":\"Children’s children are the crown of old men: and the glory of children are their fathers.\"},{\"verse\":7,\"text\":\"Eloquent words do not become a fool, nor lying lips a prince.\"},{\"verse\":8,\"text\":\"The expectation of him that expecteth is a most acceptable jewel: whithersoever he turneth himself, he understandeth wisely.\"},{\"verse\":9,\"text\":\"He that concealeth a transgression, seeketh friendships: he that repeateth it again, separateth friends.\"},{\"verse\":10,\"text\":\"A reproof availeth more with a wise man, than a hundred stripes with a fool.\"},{\"verse\":11,\"text\":\"An evil man always seeketh quarrels: but a cruel angel shall be sent against him.\"},{\"verse\":12,\"text\":\"It is better to meet a bear robbed of her whelps, than a fool trusting in his own folly.\"},{\"verse\":13,\"text\":\"He that rendereth evil for good, evil shall not depart from his house.\"},{\"verse\":14,\"text\":\"The beginning of quarrels is as when one letteth out water: and before he suffereth reproach, he forsaketh judgment.\"},{\"verse\":15,\"text\":\"He that justifieth the wicked, and he that condemneth the just, both are abominable before God.\"},{\"verse\":16,\"text\":\"What doth it avail a fool to have riches, seeing he cannot buy wisdom? He that maketh his house high, seeketh a downfall: and he that refuseth to learn, shall fall into evils.\"},{\"verse\":17,\"text\":\"He that is a friend loveth at all times: and a brother is proved in distress.\"},{\"verse\":18,\"text\":\"A foolish man will clap hands, when he is surety for his friend.\"},{\"verse\":19,\"text\":\"He that studieth discords, loveth quarrels: and he that exalteth his door, seeketh ruin.\"},{\"verse\":20,\"text\":\"He that is of a perverse heart, shall not find good: and he that perverteth his tongue, shall fall into evil.\"},{\"verse\":21,\"text\":\"A fool is born to his own disgrace: and even his father shall not rejoice in a fool.\"},{\"verse\":22,\"text\":\"A joyful mind maketh age flourishing: a sorrowful spirit drieth up the bones.\"},{\"verse\":23,\"text\":\"The wicked man taketh gifts out of the bosom, that he may pervert the paths of judgment.\"},{\"verse\":24,\"text\":\"Wisdom shineth in the face of the wise: the eyes of fools are in the ends of the earth.\"},{\"verse\":25,\"text\":\"A foolish son is the anger of the father: and the sorrow of the mother that bore him.\"},{\"verse\":26,\"text\":\"It is no good thing to do hurt to the just: nor to strike the prince, who judgeth right.\"},{\"verse\":27,\"text\":\"He that setteth bounds to his words, is knowing and wise: and the man of understanding is of a precious spirit.\"},{\"verse\":28,\"text\":\"Even a fool, if he will hold his peace, shall be counted wise: and if he close his lips, a man of understanding.\"}],\"vul\":[{\"verse\":1,\"text\":\"Melior est buccella sicca cum gaudio quam domus plena victimis cum jurgio.\"},{\"verse\":2,\"text\":\"Servus sapiens dominabitur filiis stultis, et inter fratres hæreditatem dividet.\"},{\"verse\":3,\"text\":\"Sicut igne probatur argentum et aurum camino, ita corda probat Dominus.\"},{\"verse\":4,\"text\":\"Malus obedit linguæ iniquæ, et fallax obtemperat labiis mendacibus.\"},{\"verse\":5,\"text\":\"Qui despicit pauperem exprobrat factori ejus, et qui ruina lætatur alterius non erit impunitus.\"},{\"verse\":6,\"text\":\"Corona senum filii filiorum, et gloria filiorum patres eorum.\"},{\"verse\":7,\"text\":\"Non decent stultum verba composita, nec principem labium mentiens.\"},{\"verse\":8,\"text\":\"Gemma gratissima exspectatio præstolantis ; quocumque se vertit, prudenter intelligit.\"},{\"verse\":9,\"text\":\"Qui celat delictum quærit amicitias ; qui altero sermone repetit, separat fœderatos.\"},{\"verse\":10,\"text\":\"Plus proficit correptio apud prudentem, quam centum plagæ apud stultum.\"},{\"verse\":11,\"text\":\"Semper jurgia quærit malus : angelus autem crudelis mittetur contra eum.\"},{\"verse\":12,\"text\":\"Expedit magis ursæ occurrere raptis fœtibus, quam fatuo confidenti in stultitia sua.\"},{\"verse\":13,\"text\":\"Qui reddit mala pro bonis, non recedet malum de domo ejus.\"},{\"verse\":14,\"text\":\"Qui dimittit aquam caput est jurgiorum, et antequam patiatur contumeliam judicium deserit.\"},{\"verse\":15,\"text\":\"Qui justificat impium, et qui condemnat justum, abominabilis est uterque apud Deum.\"},{\"verse\":16,\"text\":\"Quid prodest stulto habere divitias, cum sapientiam emere non possit ? Qui altum facit domum suam quærit ruinam, et qui evitat discere incidet in mala.\"},{\"verse\":17,\"text\":\"Omni tempore diligit qui amicus est, et frater in angustiis comprobatur.\"},{\"verse\":18,\"text\":\"Stultus homo plaudet manibus, cum spoponderit pro amico suo.\"},{\"verse\":19,\"text\":\"Qui meditatur discordias diligit rixas, et qui exaltat ostium quærit ruinam.\"},{\"verse\":20,\"text\":\"Qui perversi cordis est non inveniet bonum, et qui vertit linguam incidet in malum.\"},{\"verse\":21,\"text\":\"Natus est stultus in ignominiam suam ; sed nec pater in fatuo lætabitur.\"},{\"verse\":22,\"text\":\"Animus gaudens ætatem floridam facit ; spiritus tristis exsiccat ossa.\"},{\"verse\":23,\"text\":\"Munera de sinu impius accipit, ut pervertat semitas judicii.\"},{\"verse\":24,\"text\":\"In facie prudentis lucet sapientia ; oculi stultorum in finibus terræ.\"},{\"verse\":25,\"text\":\"Ira patris filius stultus, et dolor matris quæ genuit eum.\"},{\"verse\":26,\"text\":\"Non est bonum damnum inferre justo, nec percutere principem qui recta judicat.\"},{\"verse\":27,\"text\":\"Qui moderatur sermones suos doctus et prudens est, et pretiosi spiritus vir eruditus.\"},{\"verse\":28,\"text\":\"Stultus quoque, si tacuerit, sapiens reputabitur, et si compresserit labia sua, intelligens.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":16,\"label\":\"Proverbs 16\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":18,\"label\":\"Proverbs 18\"}}]]\n"])</script></body></html>
