er, heareth not when he is reproved.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Of the fruit of his own mouth shall a man be filled with good things: but the soul of transgressors is wicked.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He that keepeth his mouth keepeth his soul: but he that hath no guard on his speech shall meet with evils.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The sluggard willeth, and willeth not: but the soul of them that work, shall be made fat.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The just shall hate a lying word: but the wicked confoundeth, and shall be confounded.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Justice keepeth the way of the innocent: but wickedness overthroweth the sinner.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>One is as it were rich, when he hath nothing and another is as it were poor, when he hath great riches.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The ransom of a man’s life are his riches: but he that is poor, beareth not reprehension.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The light of the just giveth joy: but the lamp of the wicked shall be put out.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Among the proud there are always contentions: but they that do all things with counsel, are ruled by wisdom.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Substance got in haste shall be diminished: but that which by little and little is gathered with the hand, shall increase.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hope that is deferred afflicteth the soul: desire when it cometh, is a tree of life.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Whosoever speaketh ill of any thing, bindeth himself for the time to come: but he that feareth the commandment, shall dwell in peace. Deceitful souls go astray in sins: the just are merciful, and shew mercy.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The law of the wise is a fountain of life, that he may decline from the ruin of death.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Good instruction shall give grace: in the way of scorners is a deep pit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The prudent man doth all things with counsel: but he that is a fool, layeth open his folly.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The messenger of the wicked shall fall into mischief: but a faithful ambassador is health.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Poverty and shame to him that refuseth instruction: but he that yieldeth to reproof shall be glorified.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The desire that is accomplished, delighteth the soul: fools hate them that flee from evil things.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that walketh with the wise, shall be wise: a friend of fools shall become like to them.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Evil pursueth sinners: and to the just good shall be repaid.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The good man leaveth heirs, sons, and grandsons: and the substance of the sinner is kept for the just.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Much food is in the tillage of fathers: but for others it is gathered without judgment.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He that spareth the rod, hateth his son: but he that loveth him, correcteth him betimes.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The just eateth and filleth his soul: but the belly of the wicked is never to be filled.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Filius sapiens doctrina patris ; qui autem illusor est non audit cum arguitur.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>De fructu oris sui homo satiabitur bonis : anima autem prævaricatorum iniqua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Qui custodit os suum custodit animam suam ; qui autem inconsideratus est ad loquendum, sentiet mala.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Vult et non vult piger ; anima autem operantium impinguabitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Verbum mendax justus detestabitur ; impius autem confundit, et confundetur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Justitia custodit innocentis viam, impietas autem peccatorem supplantat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Est quasi dives, cum nihil habeat, et est quasi pauper, cum in multis divitiis sit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Redemptio animæ viri divitiæ suæ ; qui autem pauper est, increpationem non sustinet.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Lux justorum lætificat : lucerna autem impiorum extinguetur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Inter superbos semper jurgia sunt ; qui autem agunt omnia cum consilio, reguntur sapientia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Substantia festinata minuetur ; quæ autem paulatim colligitur manu, multiplicabitur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Spes quæ differtur affligit animam ; lignum vitæ desiderium veniens.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Qui detrahit alicui rei, ipse se in futurum obligat ; qui autem timet præceptum, in pace versabitur. Animæ dolosæ errant in peccatis : justi autem misericordes sunt, et miserantur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Lex sapientis fons vitæ, ut declinet a ruina mortis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Doctrina bona dabit gratiam ; in itinere contemptorum vorago.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Astutus omnia agit cum consilio ; qui autem fatuus est aperit stultitiam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Nuntius impii cadet in malum ; legatus autem fidelis, sanitas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Egestas et ignominia ei qui deserit disciplinam ; qui autem acquiescit arguenti glorificabitur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Desiderium si compleatur delectat animam ; detestantur stulti eos qui fugiunt mala.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui cum sapientibus graditur sapiens erit ; amicus stultorum similis efficietur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Peccatores persequitur malum, et justis retribuentur bona.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Bonus reliquit hæredes filios et nepotes, et custoditur justo substantia peccatoris.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Multi cibi in novalibus patrum, et aliis congregantur absque judicio.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui parcit virgæ odit filium suum ; qui autem diligit illum instanter erudit.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Justus comedit et replet animam suam ; venter autem impiorum insaturabilis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500"> :6,\"text\":\"Justice keepeth the way of the innocent: but wickedness overthroweth the sinner.\"},{\"verse\":7,\"text\":\"One is as it were rich, when he hath nothing and another is as it were poor, when he hath great riches.\"},{\"verse\":8,\"text\":\"The ransom of a man’s life are his riches: but he that is poor, beareth not reprehension.\"},{\"verse\":9,\"text\":\"The light of the just giveth joy: but the lamp of the wicked shall be put out.\"},{\"verse\":10,\"text\":\"Among the proud there are always contentions: but they that do all things with counsel, are ruled by wisdom.\"},{\"verse\":11,\"text\":\"Substance got in haste shall be diminished: but that which by little and little is gathered with the hand, shall increase.\"},{\"verse\":12,\"text\":\"Hope that is deferred afflicteth the soul: desire when it cometh, is a tree of life.\"},{\"verse\":13,\"text\":\"Whosoever speaketh ill of any thing, bindeth himself for the time to come: but he that feareth the commandment, shall dwell in peace. Deceitful souls go astray in sins: the just are merciful, and shew mercy.\"},{\"verse\":14,\"text\":\"The law of the wise is a fountain of life, that he may decline from the ruin of death.\"},{\"verse\":15,\"text\":\"Good instruction shall give grace: in the way of scorners is a deep pit.\"},{\"verse\":16,\"text\":\"The prudent man doth all things with counsel: but he that is a fool, layeth open his folly.\"},{\"verse\":17,\"text\":\"The messenger of the wicked shall fall into mischief: but a faithful ambassador is health.\"},{\"verse\":18,\"text\":\"Poverty and shame to him that refuseth instruction: but he that yieldeth to reproof shall be glorified.\"},{\"verse\":19,\"text\":\"The desire that is accomplished, delighteth the soul: fools hate them that flee from evil things.\"},{\"verse\":20,\"text\":\"He that walketh with the wise, shall be wise: a friend of fools shall become like to them.\"},{\"verse\":21,\"text\":\"Evil pursueth sinners: and to the just good shall be repaid.\"},{\"verse\":22,\"text\":\"The good man leaveth heirs, sons, and grandsons: and the substance of the sinner is kept for the just.\"},{\"verse\":23,\"text\":\"Much food is in the tillage of fathers: but for others it is gathered without judgment.\"},{\"verse\":24,\"text\":\"He that spareth the rod, hateth his son: but he that loveth him, correcteth him betimes.\"},{\"verse\":25,\"text\":\"The just eateth and filleth his soul: but the belly of the wicked is never to be filled.\"}],\"vul\":[{\"verse\":1,\"text\":\"Filius sapiens doctrina patris ; qui autem illusor est non audit cum arguitur.\"},{\"verse\":2,\"text\":\"De fructu oris sui homo satiabitur bonis : anima autem prævaricatorum iniqua.\"},{\"verse\":3,\"text\":\"Qui custodit os suum custodit animam suam ; qui autem inconsideratus est ad loquendum, sentiet mala.\"},{\"verse\":4,\"text\":\"Vult et non vult piger ; anima autem operantium impinguabitur.\"},{\"verse\":5,\"text\":\"Verbum mendax justus detestabitur ; impius autem confundit, et confundetur.\"},{\"verse\":6,\"text\":\"Justitia custodit innocentis viam, impietas autem peccatorem supplantat.\"},{\"verse\":7,\"text\":\"Est quasi dives, cum nihil habeat, et est quasi pauper, cum in multis divitiis sit.\"},{\"verse\":8,\"text\":\"Redemptio animæ viri divitiæ suæ ; qui autem pauper est, increpationem non sustinet.\"},{\"verse\":9,\"text\":\"Lux justorum lætificat : lucerna autem impiorum extinguetur.\"},{\"verse\":10,\"text\":\"Inter superbos semper jurgia sunt ; qui autem agunt omnia cum consilio, reguntur sapientia.\"},{\"verse\":11,\"text\":\"Substantia festinata minuetur ; quæ autem paulatim colligitur manu, multiplicabitur.\"},{\"verse\":12,\"text\":\"Spes quæ differtur affligit animam ; lignum vitæ desiderium veniens.\"},{\"verse\":13,\"text\":\"Qui detrahit alicui rei, ipse se in futurum obligat ; qui autem timet præceptum, in pace versabitur. Animæ dolosæ errant in peccatis : justi autem misericordes sunt, et miserantur.\"},{\"verse\":14,\"text\":\"Lex sapientis fons vitæ, ut declinet a ruina mortis.\"},{\"verse\":15,\"text\":\"Doctrina bona dabit gratiam ; in itinere contemptorum vorago.\"},{\"verse\":16,\"text\":\"Astutus omnia agit cum consilio ; qui autem fatuus est aperit stultitiam.\"},{\"verse\":17,\"text\":\"Nuntius impii cadet in malum ; legatus autem fidelis, sanitas.\"},{\"verse\":18,\"text\":\"Egestas et ignominia ei qui deserit disciplinam ; qui autem acquiescit arguenti glorificabitur.\"},{\"verse\":19,\"text\":\"Desiderium si compleatur delectat animam ; detestantur stulti eos qui fugiunt mala.\"},{\"verse\":20,\"text\":\"Qui cum sapientibus graditur sapiens erit ; amicus stultorum similis efficietur.\"},{\"verse\":21,\"text\":\"Peccatores persequitur malum, et justis retribuentur bona.\"},{\"verse\":22,\"text\":\"Bonus reliquit hæredes filios et nepotes, et custoditur justo substantia peccatoris.\"},{\"verse\":23,\"text\":\"Multi cibi in novalibus patrum, et aliis congregantur absque judicio.\"},{\"verse\":24,\"text\":\"Qui parcit virgæ odit filium suum ; qui autem diligit illum instanter erudit.\"},{\"verse\":25,\"text\":\"Justus comedit et replet animam suam ; venter autem impiorum insaturabilis.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":12,\"label\":\"Proverbs 12\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":14,\"label\":\"Proverbs 14\"}}]]\n"])</script></body></html>
