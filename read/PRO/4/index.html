-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PRO/">About <!-- -->Proverbs</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A further exhortation to seek after wisdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hear, ye children, the instruction of a father, and attend, that you may know prudence.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>I will give you a good gift, forsake not my law.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For I also was my father’s son, tender, and as an only son in the sight of my mother:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he taught me, and said: Let thy heart receive my words, keep my commandments, and thou shalt live.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Get wisdom, get prudence: forget not, neither decline from the words of my mouth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Forsake her not, and she shall keep thee: love her, and she shall preserve thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The beginning of wisdom, get wisdom, and with all thy possession purchase prudence.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Take hold on her, and she shall exalt thee: thou shalt be glorified by her, when thou shalt embrace her.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>She shall give to thy head increase of graces, and protect thee with a noble crown.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hear, O my son, and receive my words, that years of life may be multiplied to thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I will shew thee the way of wisdom, I will lead thee by the paths of equity:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Which when thou shalt have entered, thy steps shall not be straitened, and when thou runnest, thou shalt not meet a stumblingblock.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Take hold on instruction, leave it not: keep it, because it is thy life.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Be not delighted in the paths of the wicked, neither let the way of evil men please thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Flee from it, pass not by it: go aside, and forsake it.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For they sleep not, except they have done evil: and their sleep is taken away unless they have made some to fall.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>They eat the bread of wickedness, and drink the wine of iniquity.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But the path of the just, as a shining light, goeth forwards, and increaseth even to perfect day.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The way of the wicked is darksome: they know not where they fall.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>My son, hearken to my words, and incline thy ear to my sayings.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Let them not depart from thy eyes, keep them in the midst of thy heart:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For they are life to those that find them, and health to all flesh.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>With all watchfulness keep thy heart, because life issueth out from it.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Remove from thee a froward mouth, and let detracting lips be far from thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let thy eyes look straight on, and let thy eyelids go before thy steps.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Make straight the path for thy feet, and all thy ways shall be established.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Decline not to the right hand, nor to the left: turn away thy foot from evil. For the Lord knoweth the ways that are on the right hand: but those are perverse which are on the left hand. But he will make thy courses straight, he will bring forward thy ways in peace.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audite, filii, disciplinam patris, et attendite ut sciatis prudentiam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Donum bonum tribuam vobis : legem meam ne derelinquatis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Nam et ego filius fui patris mei, tenellus et unigenitus coram matre mea.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et docebat me, atque dicebat : Suscipiat verba mea cor tuum ; custodi præcepta mea, et vives.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Posside sapientiam, posside prudentiam : ne obliviscaris, neque declines a verbis oris mei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ne dimittas eam, et custodiet te : dilige eam, et conservabit te.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Principium sapientiæ : posside sapientiam, et in omni possessione tua acquire prudentiam.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Arripe illam, et exaltabit te ; glorificaberis ab ea cum eam fueris amplexatus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dabit capiti tuo augmenta gratiarum, et corona inclyta proteget te.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Audi, fili mi, et suscipe verba mea, ut multiplicentur tibi anni vitæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Viam sapientiæ monstrabo tibi ; ducam te per semitas æquitatis :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quas cum ingressus fueris, non arctabuntur gressus tui, et currens non habebis offendiculum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tene disciplinam, ne dimittas eam ; custodi illam, quia ipsa est vita tua.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ne delecteris in semitis impiorum, nec tibi placeat malorum via.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fuge ab ea, nec transeas per illam ; declina, et desere eam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non enim dormiunt nisi malefecerint, et rapitur somnus ab eis nisi supplantaverint.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Comedunt panem impietatis, et vinum iniquitatis bibunt.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Justorum autem semita quasi lux splendens procedit, et crescit usque ad perfectam diem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Via impiorum tenebrosa ; nesciunt ubi corruant.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Fili mi, ausculta sermones meos, et ad eloquia mea inclina aurem tuam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ne recedant ab oculis tuis : custodi ea in medio cordis tui :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>vita enim sunt invenientibus ea, et universæ carni sanitas.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Omni custodia serva cor tuum, quia ex ipso vita procedit.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Remove a te os pravum, et detrahentia labia sint procul a te.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Oculi tui recta videant, et palpebræ tuæ præcedant gressus tuos.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dirige semitam pedibus tuis, et omnes viæ tuæ stabilientur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ne declines ad dexteram neque ad sinistram ; averte pedem tuum a malo : vias enim quæ a dextris sunt novit Dominus : perversæ vero sunt quæ a sinistris sunt. Ipse autem rectos faciet cursus tuos, itinera autem tua in pace producet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 \":2,\"text\":\"I will give you a good gift, forsake not my law.\"},{\"verse\":3,\"text\":\"For I also was my father’s son, tender, and as an only son in the sight of my mother:\"},{\"verse\":4,\"text\":\"And he taught me, and said: Let thy heart receive my words, keep my commandments, and thou shalt live.\"},{\"verse\":5,\"text\":\"Get wisdom, get prudence: forget not, neither decline from the words of my mouth.\"},{\"verse\":6,\"text\":\"Forsake her not, and she shall keep thee: love her, and she shall preserve thee.\"},{\"verse\":7,\"text\":\"The beginning of wisdom, get wisdom, and with all thy possession purchase prudence.\"},{\"verse\":8,\"text\":\"Take hold on her, and she shall exalt thee: thou shalt be glorified by her, when thou shalt embrace her.\"},{\"verse\":9,\"text\":\"She shall give to thy head increase of graces, and protect thee with a noble crown.\"},{\"verse\":10,\"text\":\"Hear, O my son, and receive my words, that years of life may be multiplied to thee.\"},{\"verse\":11,\"text\":\"I will shew thee the way of wisdom, I will lead thee by the paths of equity:\"},{\"verse\":12,\"text\":\"Which when thou shalt have entered, thy steps shall not be straitened, and when thou runnest, thou shalt not meet a stumblingblock.\"},{\"verse\":13,\"text\":\"Take hold on instruction, leave it not: keep it, because it is thy life.\"},{\"verse\":14,\"text\":\"Be not delighted in the paths of the wicked, neither let the way of evil men please thee.\"},{\"verse\":15,\"text\":\"Flee from it, pass not by it: go aside, and forsake it.\"},{\"verse\":16,\"text\":\"For they sleep not, except they have done evil: and their sleep is taken away unless they have made some to fall.\"},{\"verse\":17,\"text\":\"They eat the bread of wickedness, and drink the wine of iniquity.\"},{\"verse\":18,\"text\":\"But the path of the just, as a shining light, goeth forwards, and increaseth even to perfect day.\"},{\"verse\":19,\"text\":\"The way of the wicked is darksome: they know not where they fall.\"},{\"verse\":20,\"text\":\"My son, hearken to my words, and incline thy ear to my sayings.\"},{\"verse\":21,\"text\":\"Let them not depart from thy eyes, keep them in the midst of thy heart:\"},{\"verse\":22,\"text\":\"For they are life to those that find them, and health to all flesh.\"},{\"verse\":23,\"text\":\"With all watchfulness keep thy heart, because life issueth out from it.\"},{\"verse\":24,\"text\":\"Remove from thee a froward mouth, and let detracting lips be far from thee.\"},{\"verse\":25,\"text\":\"Let thy eyes look straight on, and let thy eyelids go before thy steps.\"},{\"verse\":26,\"text\":\"Make straight the path for thy feet, and all thy ways shall be established.\"},{\"verse\":27,\"text\":\"Decline not to the right hand, nor to the left: turn away thy foot from evil. For the Lord knoweth the ways that are on the right hand: but those are perverse which are on the left hand. But he will make thy courses straight, he will bring forward thy ways in peace.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audite, filii, disciplinam patris, et attendite ut sciatis prudentiam.\"},{\"verse\":2,\"text\":\"Donum bonum tribuam vobis : legem meam ne derelinquatis.\"},{\"verse\":3,\"text\":\"Nam et ego filius fui patris mei, tenellus et unigenitus coram matre mea.\"},{\"verse\":4,\"text\":\"Et docebat me, atque dicebat : Suscipiat verba mea cor tuum ; custodi præcepta mea, et vives.\"},{\"verse\":5,\"text\":\"Posside sapientiam, posside prudentiam : ne obliviscaris, neque declines a verbis oris mei.\"},{\"verse\":6,\"text\":\"Ne dimittas eam, et custodiet te : dilige eam, et conservabit te.\"},{\"verse\":7,\"text\":\"Principium sapientiæ : posside sapientiam, et in omni possessione tua acquire prudentiam.\"},{\"verse\":8,\"text\":\"Arripe illam, et exaltabit te ; glorificaberis ab ea cum eam fueris amplexatus.\"},{\"verse\":9,\"text\":\"Dabit capiti tuo augmenta gratiarum, et corona inclyta proteget te.\"},{\"verse\":10,\"text\":\"Audi, fili mi, et suscipe verba mea, ut multiplicentur tibi anni vitæ.\"},{\"verse\":11,\"text\":\"Viam sapientiæ monstrabo tibi ; ducam te per semitas æquitatis :\"},{\"verse\":12,\"text\":\"quas cum ingressus fueris, non arctabuntur gressus tui, et currens non habebis offendiculum.\"},{\"verse\":13,\"text\":\"Tene disciplinam, ne dimittas eam ; custodi illam, quia ipsa est vita tua.\"},{\"verse\":14,\"text\":\"Ne delecteris in semitis impiorum, nec tibi placeat malorum via.\"},{\"verse\":15,\"text\":\"Fuge ab ea, nec transeas per illam ; declina, et desere eam.\"},{\"verse\":16,\"text\":\"Non enim dormiunt nisi malefecerint, et rapitur somnus ab eis nisi supplantaverint.\"},{\"verse\":17,\"text\":\"Comedunt panem impietatis, et vinum iniquitatis bibunt.\"},{\"verse\":18,\"text\":\"Justorum autem semita quasi lux splendens procedit, et crescit usque ad perfectam diem.\"},{\"verse\":19,\"text\":\"Via impiorum tenebrosa ; nesciunt ubi corruant.\"},{\"verse\":20,\"text\":\"Fili mi, ausculta sermones meos, et ad eloquia mea inclina aurem tuam.\"},{\"verse\":21,\"text\":\"Ne recedant ab oculis tuis : custodi ea in medio cordis tui :\"},{\"verse\":22,\"text\":\"vita enim sunt invenientibus ea, et universæ carni sanitas.\"},{\"verse\":23,\"text\":\"Omni custodia serva cor tuum, quia ex ipso vita procedit.\"},{\"verse\":24,\"text\":\"Remove a te os pravum, et detrahentia labia sint procul a te.\"},{\"verse\":25,\"text\":\"Oculi tui recta videant, et palpebræ tuæ præcedant gressus tuos.\"},{\"verse\":26,\"text\":\"Dirige semitam pedibus tuis, et omnes viæ tuæ stabilientur.\"},{\"verse\":27,\"text\":\"Ne declines ad dexteram neque ad sinistram ; averte pedem tuum a malo : vias enim quæ a dextris sunt novit Dominus : perversæ vero sunt quæ a sinistris sunt. Ipse autem rectos faciet cursus tuos, itinera autem tua in pace producet.\"}],\"summary\":\"A further exhortation to seek after wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":3,\"label\":\"Proverbs 3\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":5,\"label\":\"Proverbs 5\"}}]]\n"])</script></body></html>
