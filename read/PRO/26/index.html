fool.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>As a bird flying to other places, and a sparrow going here or there: so a curse uttered without cause shall come upon a man.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A whip for a horse, and a snaffle for an ass, and a rod for the back of fools.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Answer not a fool according to his folly, lest thou be made like him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Answer a fool according to his folly, lest he imagine himself to be wise.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He that sendeth words by a foolish messenger, is lame of feet and drinketh iniquity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>As a lame man hath fair legs in vain: so a parable is unseemly in the mouth of fools.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>As he that casteth a stone into the heap of Mercury: so is he that giveth honour to a fool.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>As if a thorn should grow in the hand of a drunkard: so is a parable in the mouth of fools.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Judgment determineth causes: and he that putteth a fool to silence, appeaseth anger.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As a dog that returneth to his vomit, so is the fool that repeateth his folly.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hast thou seen a man wise in his own conceit? there shall be more hope of a fool than of him.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The slothful man saith: There is a lion in the way, and a lioness in the roads.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>As the door turneth upon its hinges, so doth the slothful upon his bed.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The slothful hideth his hand under his armpit, and it grieveth him to turn it to his mouth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The sluggard is wiser in his own conceit, than seven men that speak sentences.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>As he that taketh a dog by the ears, so is he that passeth by in anger, and meddleth with another man’s quarrel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>As he is guilty that shooteth arrows, and lances unto death.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>So is the man that hurteth his friend deceitfully: and when he is taken, saith: I did it in jest.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>When the wood faileth, the fire shall go out: and when the talebearer is taken away, contentions shall cease.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>As coals are to burning coals, and wood to fire, so an angry man stirreth up strife.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The words of a talebearer are as it were simple, but they reach to the innermost parts of the belly.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Swelling lips joined with a corrupt heart, are like an earthen vessel adorned with silver dross.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>An enemy is known by his lips, when in his heart he entertaineth deceit.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>When he shall speak low, trust him not: because there are seven mischiefs in his heart.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He that covereth hatred deceitfully, his malice shall be laid open in the public assembly.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He that diggeth a pit, shall fall into it: and he that rolleth a stone, it shall return to him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>A deceitful tongue loveth not truth: and a slippery mouth worketh ruin.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quomodo nix in æstate, et pluviæ in messe, sic indecens est stulto gloria.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sicut avis ad alia transvolans, et passer quolibet vadens, sic maledictum frustra prolatum in quempiam superveniet.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Flagellum equo, et camus asino, et virga in dorso imprudentium.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ne respondeas stulto juxta stultitiam suam, ne efficiaris ei similis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Responde stulto juxta stultitiam suam, ne sibi sapiens esse videatur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Claudus pedibus, et iniquitatem bibens, qui mittit verba per nuntium stultum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quomodo pulchras frustra habet claudus tibias, sic indecens est in ore stultorum parabola.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sicut qui mittit lapidem in acervum Mercurii, ita qui tribuit insipienti honorem.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quomodo si spina nascatur in manu temulenti, sic parabola in ore stultorum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Judicium determinat causas, et qui imponit stulto silentium iras mitigat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sicut canis qui revertitur ad vomitum suum, sic imprudens qui iterat stultitiam suam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Vidisti hominem sapientem sibi videri ? magis illo spem habebit insipiens.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dicit piger : Leo est in via, et leæna in itineribus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sicut ostium vertitur in cardine suo, ita piger in lectulo suo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Abscondit piger manum sub ascella sua, et laborat si ad os suum eam converterit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sapientior sibi piger videtur septem viris loquentibus sententias.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sicut qui apprehendit auribus canem, sic qui transit impatiens et commiscetur rixæ alterius.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sicut noxius est qui mittit sagittas et lanceas in mortem,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>ita vir fraudulenter nocet amico suo, et cum fuerit deprehensus dicit : Ludens feci.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cum defecerint ligna extinguetur ignis, et susurrone subtracto, jurgia conquiescent.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sicut carbones ad prunas, et ligna ad ignem, sic homo iracundus suscitat rixas.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Verba susurronis quasi simplicia, et ipsa perveniunt ad intima ventris.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quomodo si argento sordido ornare velis vas fictile, sic labia tumentia cum pessimo corde sociata.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Labiis suis intelligitur inimicus, cum in corde tractaverit dolos.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quando submiserit vocem suam, ne credideris ei, quoniam septem nequitiæ sunt in corde illius.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui operit odium fraudulenter, revelabitur malitia ejus in consilio.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Qui fodit foveam incidet in eam, et qui volvit lapidem revertetur ad eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Lingua fallax non amat veritatem, et os lubricum operatur ruinas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-10 bs\",\"drName\":\"Proverbs\",\"chapter\":26,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"As snow in summer, and rain in harvest, so glory is not seemly for a fool.\"},{\"verse\":2,\"text\":\"As a bird flying to other places, and a sparrow going here or there: so a curse uttered without cause shall come upon a man.\"},{\"verse\":3,\"text\":\"A whip for a horse, and a snaffle for an ass, and a rod for the back of fools.\"},{\"verse\":4,\"text\":\"Answer not a fool according to his folly, lest thou be made like him.\"},{\"verse\":5,\"text\":\"Answer a fool according to his folly, lest he imagine himself to be wise.\"},{\"verse\":6,\"text\":\"He that sendeth words by a foolish messenger, is lame of feet and drinketh iniquity.\"},{\"verse\":7,\"text\":\"As a lame man hath fair legs in vain: so a parable is unseemly in the mouth of fools.\"},{\"verse\":8,\"text\":\"As he that casteth a stone into the heap of Mercury: so is he that giveth honour to a fool.\"},{\"verse\":9,\"text\":\"As if a thorn should grow in the hand of a drunkard: so is a parable in the mouth of fools.\"},{\"verse\":10,\"text\":\"Judgment determineth causes: and he that putteth a fool to silence, appeaseth anger.\"},{\"verse\":11,\"text\":\"As a dog that returneth to his vomit, so is the fool that repeateth his folly.\"},{\"verse\":12,\"text\":\"Hast thou seen a man wise in his own conceit? there shall be more hope of a fool than of him.\"},{\"verse\":13,\"text\":\"The slothful man saith: There is a lion in the way, and a lioness in the roads.\"},{\"verse\":14,\"text\":\"As the door turneth upon its hinges, so doth the slothful upon his bed.\"},{\"verse\":15,\"text\":\"The slothful hideth his hand under his armpit, and it grieveth him to turn it to his mouth.\"},{\"verse\":16,\"text\":\"The sluggard is wiser in his own conceit, than seven men that speak sentences.\"},{\"verse\":17,\"text\":\"As he that taketh a dog by the ears, so is he that passeth by in anger, and meddleth with another man’s quarrel.\"},{\"verse\":18,\"text\":\"As he is guilty that shooteth arrows, and lances unto death.\"},{\"verse\":19,\"text\":\"So is the man that hurteth his friend deceitfully: and when he is taken, saith: I did it in jest.\"},{\"verse\":20,\"text\":\"When the wood faileth, the fire shall go out: and when the talebearer is taken away, contentions shall cease.\"},{\"verse\":21,\"text\":\"As coals are to burning coals, and wood to fire, so an angry man stirreth up strife.\"},{\"verse\":22,\"text\":\"The words of a talebearer are as it were simple, but they reach to the innermost parts of the belly.\"},{\"verse\":23,\"text\":\"Swelling lips joined with a corrupt heart, are like an earthen vessel adorned with silver dross.\"},{\"verse\":24,\"text\":\"An enemy is known by his lips, when in his heart he entertaineth deceit.\"},{\"verse\":25,\"text\":\"When he shall speak low, trust him not: because there are seven mischiefs in his heart.\"},{\"verse\":26,\"text\":\"He that covereth hatred deceitfully, his malice shall be laid open in the public assembly.\"},{\"verse\":27,\"text\":\"He that diggeth a pit, shall fall into it: and he that rolleth a stone, it shall return to him.\"},{\"verse\":28,\"text\":\"A deceitful tongue loveth not truth: and a slippery mouth worketh ruin.\"}],\"vul\":[{\"verse\":1,\"text\":\"Quomodo nix in æstate, et pluviæ in messe, sic indecens est stulto gloria.\"},{\"verse\":2,\"text\":\"Sicut avis ad alia transvolans, et passer quolibet vadens, sic maledictum frustra prolatum in quempiam superveniet.\"},{\"verse\":3,\"text\":\"Flagellum equo, et camus asino, et virga in dorso imprudentium.\"},{\"verse\":4,\"text\":\"Ne respondeas stulto juxta stultitiam suam, ne efficiaris ei similis.\"},{\"verse\":5,\"text\":\"Responde stulto juxta stultitiam suam, ne sibi sapiens esse videatur.\"},{\"verse\":6,\"text\":\"Claudus pedibus, et iniquitatem bibens, qui mittit verba per nuntium stultum.\"},{\"verse\":7,\"text\":\"Quomodo pulchras frustra habet claudus tibias, sic indecens est in ore stultorum parabola.\"},{\"verse\":8,\"text\":\"Sicut qui mittit lapidem in acervum Mercurii, ita qui tribuit insipienti honorem.\"},{\"verse\":9,\"text\":\"Quomodo si spina nascatur in manu temulenti, sic parabola in ore stultorum.\"},{\"verse\":10,\"text\":\"Judicium determinat causas, et qui imponit stulto silentium iras mitigat.\"},{\"verse\":11,\"text\":\"Sicut canis qui revertitur ad vomitum suum, sic imprudens qui iterat stultitiam suam.\"},{\"verse\":12,\"text\":\"Vidisti hominem sapientem sibi videri ? magis illo spem habebit insipiens.\"},{\"verse\":13,\"text\":\"Dicit piger : Leo est in via, et leæna in itineribus.\"},{\"verse\":14,\"text\":\"Sicut ostium vertitur in cardine suo, ita piger in lectulo suo.\"},{\"verse\":15,\"text\":\"Abscondit piger manum sub ascella sua, et laborat si ad os suum eam converterit.\"},{\"verse\":16,\"text\":\"Sapientior sibi piger videtur septem viris loquentibus sententias.\"},{\"verse\":17,\"text\":\"Sicut qui apprehendit auribus canem, sic qui transit impatiens et commiscetur rixæ alterius.\"},{\"verse\":18,\"text\":\"Sicut noxius est qui mittit sagittas et lanceas in mortem,\"},{\"verse\":19,\"text\":\"ita vir fraudulenter nocet amico suo, et cum fuerit deprehensus dicit : Ludens feci.\"},{\"verse\":20,\"text\":\"Cum defecerint ligna extinguetur ignis, et susurrone subtracto, jurgia conquiescent.\"},{\"verse\":21,\"text\":\"Sicut carbones ad prunas, et ligna ad ignem, sic homo iracundus suscitat rixas.\"},{\"verse\":22,\"text\":\"Verba susurronis quasi simplicia, et ipsa perveniunt ad intima ventris.\"},{\"verse\":23,\"text\":\"Quomodo si argento sordido ornare velis vas fictile, sic labia tumentia cum pessimo corde sociata.\"},{\"verse\":24,\"text\":\"Labiis suis intelligitur inimicus, cum in corde tractaverit dolos.\"},{\"verse\":25,\"text\":\"Quando submiserit vocem suam, ne credideris ei, quoniam septem nequitiæ sunt in corde illius.\"},{\"verse\":26,\"text\":\"Qui operit odium fraudulenter, revelabitur malitia ejus in consilio.\"},{\"verse\":27,\"text\":\"Qui fodit foveam incidet in eam, et qui volvit lapidem revertetur ad eum.\"},{\"verse\":28,\"text\":\"Lingua fallax non amat veritatem, et os lubricum operatur ruinas.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":25,\"label\":\"Proverbs 25\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":27,\"label\":\"Proverbs 27\"}}]]\n"])</script></body></html>
