dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>My son, keep my words, and lay up my precepts with thee. Son,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Keep my commandments, and thou shalt live: and my law as the apple of thy eye:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Bind it upon thy fingers, write it upon the tables of thy heart.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Say to wisdom: Thou art my sister: and call prudence thy friend,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>That she may keep thee from the woman that is not thine, and from the stranger who sweeteneth her words.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For I looked out of the window of my house through the lattice,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And I see little ones, I behold a foolish young man,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Who passeth through the street by the corner, and goeth nigh the way of her house,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In the dark when it grows late, in the darkness and obscurity of the night.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And behold a woman meeteth him in harlot’s attire, prepared to deceive souls: talkative and wandering,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Not bearing to be quiet, not able to abide still at home,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now abroad, now in the streets, now lying in wait near the corners.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And catching the young man, she kisseth him, and with an impudent face, flattereth, saying:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I vowed victims for prosperity, this day I have paid my vows.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Therefore I am come out to meet thee, desirous to see thee, and I have found thee.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I have woven my bed with cords, I have covered it with painted tapestry, brought from Egypt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I have perfumed my bed with myrrh, aloes, and cinnamon.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Come, let us be inebriated with the breasts, and let us enjoy the desired embraces, till the day appear.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For my husband is not at home, he is gone a very long journey.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He took with him a bag of money: he will return home the day of the full moon.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>She entangled him with many words, and drew him away with the flattery of her lips.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Immediately he followeth her as an ox led to be a victim, and as a lamb playing the wanton, and not knowing that he is drawn like a fool to bonds,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Till the arrow pierce his liver: as if a bird should make haste to the snare, and knoweth not that his life is in danger.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Now, therefore, my son, hear me, and attend to the words of my mouth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let not thy mind be drawn away in her ways: neither be thou deceived with her paths.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For she hath cast down many wounded, and the strongest have been slain by her.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Her house is the way to hell, reaching even to the inner chambers of death.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fili mi, custodi sermones meos, et præcepta mea reconde tibi. Fili,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>serva mandata mea, et vives ; et legem meam quasi pupillam oculi tui :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>liga eam in digitis tuis, scribe illam in tabulis cordis tui.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dic sapientiæ : Soror mea es, et prudentiam voca amicam tuam :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ut custodiant te a muliere extranea, et ab aliena quæ verba sua dulcia facit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>De fenestra enim domus meæ per cancellos prospexi,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et video parvulos ; considero vecordem juvenem,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui transit per plateam juxta angulum et prope viam domus illius graditur :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>in obscuro, advesperascente die, in noctis tenebris et caligine.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et ecce occurrit illi mulier ornatu meretricio, præparata ad capiendas animas : garrula et vaga,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>quietis impatiens, nec valens in domo consistere pedibus suis ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>nunc foris, nunc in plateis, nunc juxta angulos insidians.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Apprehensumque deosculatur juvenem, et procaci vultu blanditur, dicens :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Victimas pro salute vovi ; hodie reddidi vota mea :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>idcirco egressa sum in occursum tuum, desiderans te videre, et reperi.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Intexui funibus lectulum meum ; stravi tapetibus pictis ex Ægypto :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>aspersi cubile meum myrrha, et aloë, et cinnamomo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Veni, inebriemur uberibus, et fruamur cupitis amplexibus donec illucescat dies.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non est enim vir in domo sua : abiit via longissima :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sacculum pecuniæ secum tulit ; in die plenæ lunæ reversurus est in domum suam.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Irretivit eum multis sermonibus, et blanditiis labiorum protraxit illum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Statim eam sequitur quasi bos ductus ad victimam, et quasi agnus lasciviens, et ignorans quod ad vincula stultus trahatur :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>donec transfigat sagitta jecur ejus, velut si avis festinet ad laqueum, et nescit quod de periculo animæ illius agitur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nunc ergo, fili mi, audi me, et attende verbis oris mei.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ne abstrahatur in viis illius mens tua, neque decipiaris semitis ejus ;</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>multos enim vulneratos dejecit, et fortissimi quique interfecti sunt ab ea.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Viæ inferi domus ejus, penetrantes in interiora mortis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-sto hine, and from the stranger who sweeteneth her words.\"},{\"verse\":6,\"text\":\"For I looked out of the window of my house through the lattice,\"},{\"verse\":7,\"text\":\"And I see little ones, I behold a foolish young man,\"},{\"verse\":8,\"text\":\"Who passeth through the street by the corner, and goeth nigh the way of her house,\"},{\"verse\":9,\"text\":\"In the dark when it grows late, in the darkness and obscurity of the night.\"},{\"verse\":10,\"text\":\"And behold a woman meeteth him in harlot’s attire, prepared to deceive souls: talkative and wandering,\"},{\"verse\":11,\"text\":\"Not bearing to be quiet, not able to abide still at home,\"},{\"verse\":12,\"text\":\"Now abroad, now in the streets, now lying in wait near the corners.\"},{\"verse\":13,\"text\":\"And catching the young man, she kisseth him, and with an impudent face, flattereth, saying:\"},{\"verse\":14,\"text\":\"I vowed victims for prosperity, this day I have paid my vows.\"},{\"verse\":15,\"text\":\"Therefore I am come out to meet thee, desirous to see thee, and I have found thee.\"},{\"verse\":16,\"text\":\"I have woven my bed with cords, I have covered it with painted tapestry, brought from Egypt.\"},{\"verse\":17,\"text\":\"I have perfumed my bed with myrrh, aloes, and cinnamon.\"},{\"verse\":18,\"text\":\"Come, let us be inebriated with the breasts, and let us enjoy the desired embraces, till the day appear.\"},{\"verse\":19,\"text\":\"For my husband is not at home, he is gone a very long journey.\"},{\"verse\":20,\"text\":\"He took with him a bag of money: he will return home the day of the full moon.\"},{\"verse\":21,\"text\":\"She entangled him with many words, and drew him away with the flattery of her lips.\"},{\"verse\":22,\"text\":\"Immediately he followeth her as an ox led to be a victim, and as a lamb playing the wanton, and not knowing that he is drawn like a fool to bonds,\"},{\"verse\":23,\"text\":\"Till the arrow pierce his liver: as if a bird should make haste to the snare, and knoweth not that his life is in danger.\"},{\"verse\":24,\"text\":\"Now, therefore, my son, hear me, and attend to the words of my mouth.\"},{\"verse\":25,\"text\":\"Let not thy mind be drawn away in her ways: neither be thou deceived with her paths.\"},{\"verse\":26,\"text\":\"For she hath cast down many wounded, and the strongest have been slain by her.\"},{\"verse\":27,\"text\":\"Her house is the way to hell, reaching even to the inner chambers of death.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fili mi, custodi sermones meos, et præcepta mea reconde tibi. Fili,\"},{\"verse\":2,\"text\":\"serva mandata mea, et vives ; et legem meam quasi pupillam oculi tui :\"},{\"verse\":3,\"text\":\"liga eam in digitis tuis, scribe illam in tabulis cordis tui.\"},{\"verse\":4,\"text\":\"Dic sapientiæ : Soror mea es, et prudentiam voca amicam tuam :\"},{\"verse\":5,\"text\":\"ut custodiant te a muliere extranea, et ab aliena quæ verba sua dulcia facit.\"},{\"verse\":6,\"text\":\"De fenestra enim domus meæ per cancellos prospexi,\"},{\"verse\":7,\"text\":\"et video parvulos ; considero vecordem juvenem,\"},{\"verse\":8,\"text\":\"qui transit per plateam juxta angulum et prope viam domus illius graditur :\"},{\"verse\":9,\"text\":\"in obscuro, advesperascente die, in noctis tenebris et caligine.\"},{\"verse\":10,\"text\":\"Et ecce occurrit illi mulier ornatu meretricio, præparata ad capiendas animas : garrula et vaga,\"},{\"verse\":11,\"text\":\"quietis impatiens, nec valens in domo consistere pedibus suis ;\"},{\"verse\":12,\"text\":\"nunc foris, nunc in plateis, nunc juxta angulos insidians.\"},{\"verse\":13,\"text\":\"Apprehensumque deosculatur juvenem, et procaci vultu blanditur, dicens :\"},{\"verse\":14,\"text\":\"Victimas pro salute vovi ; hodie reddidi vota mea :\"},{\"verse\":15,\"text\":\"idcirco egressa sum in occursum tuum, desiderans te videre, et reperi.\"},{\"verse\":16,\"text\":\"Intexui funibus lectulum meum ; stravi tapetibus pictis ex Ægypto :\"},{\"verse\":17,\"text\":\"aspersi cubile meum myrrha, et aloë, et cinnamomo.\"},{\"verse\":18,\"text\":\"Veni, inebriemur uberibus, et fruamur cupitis amplexibus donec illucescat dies.\"},{\"verse\":19,\"text\":\"Non est enim vir in domo sua : abiit via longissima :\"},{\"verse\":20,\"text\":\"sacculum pecuniæ secum tulit ; in die plenæ lunæ reversurus est in domum suam.\"},{\"verse\":21,\"text\":\"Irretivit eum multis sermonibus, et blanditiis labiorum protraxit illum.\"},{\"verse\":22,\"text\":\"Statim eam sequitur quasi bos ductus ad victimam, et quasi agnus lasciviens, et ignorans quod ad vincula stultus trahatur :\"},{\"verse\":23,\"text\":\"donec transfigat sagitta jecur ejus, velut si avis festinet ad laqueum, et nescit quod de periculo animæ illius agitur.\"},{\"verse\":24,\"text\":\"Nunc ergo, fili mi, audi me, et attende verbis oris mei.\"},{\"verse\":25,\"text\":\"Ne abstrahatur in viis illius mens tua, neque decipiaris semitis ejus ;\"},{\"verse\":26,\"text\":\"multos enim vulneratos dejecit, et fortissimi quique interfecti sunt ab ea.\"},{\"verse\":27,\"text\":\"Viæ inferi domus ejus, penetrantes in interiora mortis.\"}],\"summary\":\"The love of wisdom is the best preservative from being led astray by temptation.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":6,\"label\":\"Proverbs 6\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":8,\"label\":\"Proverbs 8\"}}]]\n"])</script></body></html>
