rse"><sup>3</sup>It is an honour for a man to separate himself from quarrels: but all fools are meddling with reproaches.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Because of the cold the sluggard would not plough: he shall beg therefore in the summer, and it shall not be given him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Counsel in the heart of a man is like deep water: but a wise man will draw it out.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Many men are called merciful: but who shall find a faithful man?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The just that walketh in his simplicity, shall leave behind him blessed children.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The king, that sitteth on the throne of judgment, scattereth away all evil with his look.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Who can say: My heart is clean, I am pure from sin?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Diverse weights and diverse measures, both are abominable before God.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>By his inclinations a child is known, if his works be clean and right.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The hearing ear, and the seeing eye, the Lord hath made them both.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Love not sleep, lest poverty oppress thee: open thy eyes, and be filled with bread.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>It is naught, it is naught, saith every buyer: and when he is gone away, then he will boast.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>There is gold and a multitude of jewels: but the lips of knowledge are a precious vessel.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Take away the garment of him that is surety for a stranger, and take a pledge from him for strangers.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The bread of lying is sweet to a man: but afterwards his mouth shall be filled with gravel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Designs are strengthened by counsels: and wars are to be managed by governments.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Meddle not with him that revealeth secrets, and walketh deceitfully, and openeth wide his lips.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He that curseth his father, and mother, his lamp shall be put out in the midst of darkness.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The inheritance gotten hastily in the beginning, in the end shall be without a blessing.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Say not: I will return evil: wait for the Lord, and he will deliver thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Diverse weights are an abomination before the Lord: a deceitful balance is not good.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The steps of men are guided by the Lord: but who is the man that can understand his own way?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>It is ruin to a man to devour holy ones, and after vows to retract.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A wise king scattereth the wicked, and bringeth over them the wheel.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The spirit of a man is the lamp of the Lord, which searcheth all the hidden things of the bowels.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Mercy and truth preserve the king, and his throne is strengthened by clemency.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The joy of young men is their strength: and the dignity of old men, their grey hairs.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The blueness of a wound shall wipe away evils: and stripes in the more inward parts of the belly.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Luxuriosa res vinum, et tumultuosa ebrietas : quicumque his delectatur non erit sapiens.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Sicut rugitus leonis, ita et terror regis : qui provocat eum peccat in animam suam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Honor est homini qui separat se a contentionibus ; omnes autem stulti miscentur contumeliis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Propter frigus piger arare noluit ; mendicabit ergo æstate, et non dabitur illi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sicut aqua profunda, sic consilium in corde viri ; sed homo sapiens exhauriet illud.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Multi homines misericordes vocantur ; virum autem fidelem quis inveniet ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Justus qui ambulat in simplicitate sua beatos post se filios derelinquet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Rex qui sedet in solio judicii dissipat omne malum intuitu suo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quis potest dicere : Mundum est cor meum ; purus sum a peccato ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pondus et pondus, mensura et mensura : utrumque abominabile est apud Deum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ex studiis suis intelligitur puer, si munda et recta sint opera ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Aurem audientem, et oculum videntem : Dominus fecit utrumque.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Noli diligere somnum, ne te egestas opprimat : aperi oculos tuos, et saturare panibus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Malum est, malum est, dicit omnis emptor ; et cum recesserit, tunc gloriabitur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Est aurum et multitudo gemmarum, et vas pretiosum labia scientiæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tolle vestimentum ejus qui fidejussor extitit alieni, et pro extraneis aufer pignus ab eo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Suavis est homini panis mendacii, et postea implebitur os ejus calculo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Cogitationes consiliis roborantur, et gubernaculis tractanda sunt bella.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ei qui revelat mysteria, et ambulat fraudulenter, et dilatat labia sua, ne commiscearis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Qui maledicit patri suo et matri, extinguetur lucerna ejus in mediis tenebris :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>hæreditas ad quam festinatur in principio, in novissimo benedictione carebit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ne dicas : Reddam malum : exspecta Dominum, et liberabit te.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Abominatio est apud Dominum pondus et pondus ; statera dolosa non est bona.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>A Domino diriguntur gressus viri : quis autem hominum intelligere potest viam suam ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Ruina est homini devorare sanctos, et post vota retractare.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dissipat impios rex sapiens, et incurvat super eos fornicem.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Lucerna Domini spiraculum hominis, quæ investigat omnia secreta ventris.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Misericordia et veritas custodiunt regem, et roboratur clementia thronus ejus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Exsultatio juvenum fortitudo eorum, et dignitas senum canities.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Livor vulneris absterget mala, et plagæ in secretioribus ventris.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->20<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 19" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColo "$\",\"$L17\",\"PRO.20\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":20,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Wine is a luxurious thing, and drunkenness riotous: whosoever is delighted therewith, shall not be wise.\"},{\"verse\":2,\"text\":\"As the roaring of a lion, so also is the dread of a king: he that provoketh him, sinneth against his own soul.\"},{\"verse\":3,\"text\":\"It is an honour for a man to separate himself from quarrels: but all fools are meddling with reproaches.\"},{\"verse\":4,\"text\":\"Because of the cold the sluggard would not plough: he shall beg therefore in the summer, and it shall not be given him.\"},{\"verse\":5,\"text\":\"Counsel in the heart of a man is like deep water: but a wise man will draw it out.\"},{\"verse\":6,\"text\":\"Many men are called merciful: but who shall find a faithful man?\"},{\"verse\":7,\"text\":\"The just that walketh in his simplicity, shall leave behind him blessed children.\"},{\"verse\":8,\"text\":\"The king, that sitteth on the throne of judgment, scattereth away all evil with his look.\"},{\"verse\":9,\"text\":\"Who can say: My heart is clean, I am pure from sin?\"},{\"verse\":10,\"text\":\"Diverse weights and diverse measures, both are abominable before God.\"},{\"verse\":11,\"text\":\"By his inclinations a child is known, if his works be clean and right.\"},{\"verse\":12,\"text\":\"The hearing ear, and the seeing eye, the Lord hath made them both.\"},{\"verse\":13,\"text\":\"Love not sleep, lest poverty oppress thee: open thy eyes, and be filled with bread.\"},{\"verse\":14,\"text\":\"It is naught, it is naught, saith every buyer: and when he is gone away, then he will boast.\"},{\"verse\":15,\"text\":\"There is gold and a multitude of jewels: but the lips of knowledge are a precious vessel.\"},{\"verse\":16,\"text\":\"Take away the garment of him that is surety for a stranger, and take a pledge from him for strangers.\"},{\"verse\":17,\"text\":\"The bread of lying is sweet to a man: but afterwards his mouth shall be filled with gravel.\"},{\"verse\":18,\"text\":\"Designs are strengthened by counsels: and wars are to be managed by governments.\"},{\"verse\":19,\"text\":\"Meddle not with him that revealeth secrets, and walketh deceitfully, and openeth wide his lips.\"},{\"verse\":20,\"text\":\"He that curseth his father, and mother, his lamp shall be put out in the midst of darkness.\"},{\"verse\":21,\"text\":\"The inheritance gotten hastily in the beginning, in the end shall be without a blessing.\"},{\"verse\":22,\"text\":\"Say not: I will return evil: wait for the Lord, and he will deliver thee.\"},{\"verse\":23,\"text\":\"Diverse weights are an abomination before the Lord: a deceitful balance is not good.\"},{\"verse\":24,\"text\":\"The steps of men are guided by the Lord: but who is the man that can understand his own way?\"},{\"verse\":25,\"text\":\"It is ruin to a man to devour holy ones, and after vows to retract.\"},{\"verse\":26,\"text\":\"A wise king scattereth the wicked, and bringeth over them the wheel.\"},{\"verse\":27,\"text\":\"The spirit of a man is the lamp of the Lord, which searcheth all the hidden things of the bowels.\"},{\"verse\":28,\"text\":\"Mercy and truth preserve the king, and his throne is strengthened by clemency.\"},{\"verse\":29,\"text\":\"The joy of young men is their strength: and the dignity of old men, their grey hairs.\"},{\"verse\":30,\"text\":\"The blueness of a wound shall wipe away evils: and stripes in the more inward parts of the belly.\"}],\"vul\":[{\"verse\":1,\"text\":\"Luxuriosa res vinum, et tumultuosa ebrietas : quicumque his delectatur non erit sapiens.\"},{\"verse\":2,\"text\":\"Sicut rugitus leonis, ita et terror regis : qui provocat eum peccat in animam suam.\"},{\"verse\":3,\"text\":\"Honor est homini qui separat se a contentionibus ; omnes autem stulti miscentur contumeliis.\"},{\"verse\":4,\"text\":\"Propter frigus piger arare noluit ; mendicabit ergo æstate, et non dabitur illi.\"},{\"verse\":5,\"text\":\"Sicut aqua profunda, sic consilium in corde viri ; sed homo sapiens exhauriet illud.\"},{\"verse\":6,\"text\":\"Multi homines misericordes vocantur ; virum autem fidelem quis inveniet ?\"},{\"verse\":7,\"text\":\"Justus qui ambulat in simplicitate sua beatos post se filios derelinquet.\"},{\"verse\":8,\"text\":\"Rex qui sedet in solio judicii dissipat omne malum intuitu suo.\"},{\"verse\":9,\"text\":\"Quis potest dicere : Mundum est cor meum ; purus sum a peccato ?\"},{\"verse\":10,\"text\":\"Pondus et pondus, mensura et mensura : utrumque abominabile est apud Deum.\"},{\"verse\":11,\"text\":\"Ex studiis suis intelligitur puer, si munda et recta sint opera ejus.\"},{\"verse\":12,\"text\":\"Aurem audientem, et oculum videntem : Dominus fecit utrumque.\"},{\"verse\":13,\"text\":\"Noli diligere somnum, ne te egestas opprimat : aperi oculos tuos, et saturare panibus.\"},{\"verse\":14,\"text\":\"Malum est, malum est, dicit omnis emptor ; et cum recesserit, tunc gloriabitur.\"},{\"verse\":15,\"text\":\"Est aurum et multitudo gemmarum, et vas pretiosum labia scientiæ.\"},{\"verse\":16,\"text\":\"Tolle vestimentum ejus qui fidejussor extitit alieni, et pro extraneis aufer pignus ab eo.\"},{\"verse\":17,\"text\":\"Suavis est homini panis mendacii, et postea implebitur os ejus calculo.\"},{\"verse\":18,\"text\":\"Cogitationes consiliis roborantur, et gubernaculis tractanda sunt bella.\"},{\"verse\":19,\"text\":\"Ei qui revelat mysteria, et ambulat fraudulenter, et dilatat labia sua, ne commiscearis.\"},{\"verse\":20,\"text\":\"Qui maledicit patri suo et matri, extinguetur lucerna ejus in mediis tenebris :\"},{\"verse\":21,\"text\":\"hæreditas ad quam festinatur in principio, in novissimo benedictione carebit.\"},{\"verse\":22,\"text\":\"Ne dicas : Reddam malum : exspecta Dominum, et liberabit te.\"},{\"verse\":23,\"text\":\"Abominatio est apud Dominum pondus et pondus ; statera dolosa non est bona.\"},{\"verse\":24,\"text\":\"A Domino diriguntur gressus viri : quis autem hominum intelligere potest viam suam ?\"},{\"verse\":25,\"text\":\"Ruina est homini devorare sanctos, et post vota retractare.\"},{\"verse\":26,\"text\":\"Dissipat impios rex sapiens, et incurvat super eos fornicem.\"},{\"verse\":27,\"text\":\"Lucerna Domini spiraculum hominis, quæ investigat omnia secreta ventris.\"},{\"verse\":28,\"text\":\"Misericordia et veritas custodiunt regem, et roboratur clementia thronus ejus.\"},{\"verse\":29,\"text\":\"Exsultatio juvenum fortitudo eorum, et dignitas senum canities.\"},{\"verse\":30,\"text\":\"Livor vulneris absterget mala, et plagæ in secretioribus ventris.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":19,\"label\":\"Proverbs 19\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":21,\"label\":\"Proverbs 21\"}}]]\n"])</script></body></html>
