her hands that also which is built.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He that walketh in the right way, and feareth God, is despised by him that goeth by an infamous way.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In the mouth of a fool is the rod of pride: but the lips of the wise preserve them.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Where there are no oxen, the crib is empty: but where there is much corn, there the strength of the ox is manifest.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A faithful witness will not lie: but a deceitful witness uttereth a lie.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A scorner seeketh wisdom, and findeth it not: the learning of the wise is easy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Go against a foolish man, and he knoweth not the lips of prudence.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The wisdom of a discreet man is to understand his way: and the imprudence of fools erreth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>A fool will laugh at sin, but among the just grace shall abide.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The heart that knoweth the bitterness of his own soul, in his joy the stranger shall not intermeddle.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The house of the wicked shall be destroyed: but the tabernacles of the just shall flourish.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>There is a way which seemeth just to a man: but the ends thereof lead to death.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Laughter shall be mingled with sorrow, and mourning taketh hold of the ends of joy.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>A fool shall be filled with his own ways, and the good man shall be above him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The innocent believeth every word: the discreet man considereth his steps. No good shall come to the deceitful son: but the wise servant shall prosper in his dealings, and his way shall be made straight.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A wise man feareth, and declineth from evil: the fool leapeth over, and is confident.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The impatient man shall work folly: and the crafty man is hateful.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The childish shall possess folly, and the prudent shall look for knowledge.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The evil shall fall down before the good: and the wicked before the gates of the just.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The poor man shall be hateful even to his own neighbour: but the friends of the rich are many.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that despiseth his neighbour, sinneth: but he that sheweth mercy to the poor, shall be blessed. He that believeth in the Lord, loveth mercy.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>They err that work evil: but mercy and truth prepare good things.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>In much work there shall be abundance: but where there are many words, there is oftentimes want.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The crown of the wise, is their riches: the folly of fools, imprudence.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>A faithful witness delivereth souls: and the double dealer uttereth lies.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In the fear of the Lord is confidence of strength, and there shall be hope for his children.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The fear of the Lord is a fountain of life, to decline from the ruin of death.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In the multitude of people is the dignity of the king: and in the small number of the people the dishonour of the prince.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He that is patient, is governed with much wisdom: but he that is impatient, exalteth his folly.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Soundness of heart is the life of the flesh: but envy is the rottenness of the bones.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>He that oppresseth the poor, upbraideth his maker: but he that hath pity on the poor, honoureth him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The wicked man shall be driven out in his wickedness: but the just hath hope in his death.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In the heart of the prudent resteth wisdom, and it shall instruct all the ignorant.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Justice exalteth a nation: but sin maketh nations miserable.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>A wise servant is acceptable to the king: he that is good for nothing shall feel his anger.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sapiens mulier ædificat domum suam ; insipiens exstructam quoque manibus destruet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ambulans recto itinere, et timens Deum, despicitur ab eo qui infami graditur via.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In ore stulti virga superbiæ ; labia autem sapientium custodiunt eos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ubi non sunt boves, præsepe vacuum est ; ubi autem plurimæ segetes, ibi manifesta est fortitudo bovis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Testis fidelis non mentitur ; profert autem mendacium dolosus testis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quærit derisor sapientiam, et non invenit ; doctrina prudentium facilis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Vade contra virum stultum, et nescit labia prudentiæ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sapientia callidi est intelligere viam suam, et imprudentia stultorum errans.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Stultus illudet peccatum, et inter justos morabitur gratia.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cor quod novit amaritudinem animæ suæ, in gaudio ejus non miscebitur extraneus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Domus impiorum delebitur : tabernacula vero justorum germinabunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Est via quæ videtur homini justa, novissima autem ejus deducunt ad mortem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Risus dolore miscebitur, et extrema gaudii luctus occupat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Viis suis replebitur stultus, et super eum erit vir bonus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Innocens credit omni verbo ; astutus considerat gressus suos. Filio doloso nihil erit boni ; servo autem sapienti prosperi erunt actus, et dirigetur via ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sapiens timet, et declinat a malo ; stultus transilit, et confidit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Impatiens operabitur stultitiam, et vir versutus odiosus est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Possidebunt parvuli stultitiam, et exspectabunt astuti scientiam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Jacebunt mali ante bonos, et impii ante portas justorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Etiam proximo suo pauper odiosus erit : amici vero divitum multi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui despicit proximum suum peccat ; qui autem miseretur pauperis beatus erit. Qui credit in Domino misericordiam diligit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Errant qui operantur malum ; misericordia et veritas præparant bona.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>In omni opere erit abundantia ; ubi autem verba sunt plurima, ibi frequenter egestas.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Corona sapientium divitiæ eorum ; fatuitas stultorum imprudentia.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Liberat animas testis fidelis, et profert mendacia versipellis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In timore Domini fiducia fortitudinis, et filiis ejus erit spes.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Timor Domini fons vitæ, ut declinent a ruina mortis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In multitudine populi dignitas regis, et in paucitate plebis ignominia principis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Qui patiens est multa gubernatur prudentia ; qui autem impatiens est exaltat stultitiam suam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Vita carnium sanitas cordis ; putredo ossium invidia.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Qui calumniatur egentem exprobrat factori ejus ; honorat autem eum qui miseretur pauperis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In malitia sua expelletur impius : sperat autem justus in morte sua.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In corde prudentis requiescit sapientia, et indoctos quosque erudiet.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Justitia elevat gentem ; miseros autem facit populos peccatum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Acceptus est regi minister intelligens ; iracundiam ejus inutilis sustinebit.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->14<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 13" class="inline-flex h-12 w-14 shrink-0 items-center just ch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PRO.14\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":14,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"A wise woman buildeth her house: but the foolish will pull down with her hands that also which is built.\"},{\"verse\":2,\"text\":\"He that walketh in the right way, and feareth God, is despised by him that goeth by an infamous way.\"},{\"verse\":3,\"text\":\"In the mouth of a fool is the rod of pride: but the lips of the wise preserve them.\"},{\"verse\":4,\"text\":\"Where there are no oxen, the crib is empty: but where there is much corn, there the strength of the ox is manifest.\"},{\"verse\":5,\"text\":\"A faithful witness will not lie: but a deceitful witness uttereth a lie.\"},{\"verse\":6,\"text\":\"A scorner seeketh wisdom, and findeth it not: the learning of the wise is easy.\"},{\"verse\":7,\"text\":\"Go against a foolish man, and he knoweth not the lips of prudence.\"},{\"verse\":8,\"text\":\"The wisdom of a discreet man is to understand his way: and the imprudence of fools erreth.\"},{\"verse\":9,\"text\":\"A fool will laugh at sin, but among the just grace shall abide.\"},{\"verse\":10,\"text\":\"The heart that knoweth the bitterness of his own soul, in his joy the stranger shall not intermeddle.\"},{\"verse\":11,\"text\":\"The house of the wicked shall be destroyed: but the tabernacles of the just shall flourish.\"},{\"verse\":12,\"text\":\"There is a way which seemeth just to a man: but the ends thereof lead to death.\"},{\"verse\":13,\"text\":\"Laughter shall be mingled with sorrow, and mourning taketh hold of the ends of joy.\"},{\"verse\":14,\"text\":\"A fool shall be filled with his own ways, and the good man shall be above him.\"},{\"verse\":15,\"text\":\"The innocent believeth every word: the discreet man considereth his steps. No good shall come to the deceitful son: but the wise servant shall prosper in his dealings, and his way shall be made straight.\"},{\"verse\":16,\"text\":\"A wise man feareth, and declineth from evil: the fool leapeth over, and is confident.\"},{\"verse\":17,\"text\":\"The impatient man shall work folly: and the crafty man is hateful.\"},{\"verse\":18,\"text\":\"The childish shall possess folly, and the prudent shall look for knowledge.\"},{\"verse\":19,\"text\":\"The evil shall fall down before the good: and the wicked before the gates of the just.\"},{\"verse\":20,\"text\":\"The poor man shall be hateful even to his own neighbour: but the friends of the rich are many.\"},{\"verse\":21,\"text\":\"He that despiseth his neighbour, sinneth: but he that sheweth mercy to the poor, shall be blessed. He that believeth in the Lord, loveth mercy.\"},{\"verse\":22,\"text\":\"They err that work evil: but mercy and truth prepare good things.\"},{\"verse\":23,\"text\":\"In much work there shall be abundance: but where there are many words, there is oftentimes want.\"},{\"verse\":24,\"text\":\"The crown of the wise, is their riches: the folly of fools, imprudence.\"},{\"verse\":25,\"text\":\"A faithful witness delivereth souls: and the double dealer uttereth lies.\"},{\"verse\":26,\"text\":\"In the fear of the Lord is confidence of strength, and there shall be hope for his children.\"},{\"verse\":27,\"text\":\"The fear of the Lord is a fountain of life, to decline from the ruin of death.\"},{\"verse\":28,\"text\":\"In the multitude of people is the dignity of the king: and in the small number of the people the dishonour of the prince.\"},{\"verse\":29,\"text\":\"He that is patient, is governed with much wisdom: but he that is impatient, exalteth his folly.\"},{\"verse\":30,\"text\":\"Soundness of heart is the life of the flesh: but envy is the rottenness of the bones.\"},{\"verse\":31,\"text\":\"He that oppresseth the poor, upbraideth his maker: but he that hath pity on the poor, honoureth him.\"},{\"verse\":32,\"text\":\"The wicked man shall be driven out in his wickedness: but the just hath hope in his death.\"},{\"verse\":33,\"text\":\"In the heart of the prudent resteth wisdom, and it shall instruct all the ignorant.\"},{\"verse\":34,\"text\":\"Justice exalteth a nation: but sin maketh nations miserable.\"},{\"verse\":35,\"text\":\"A wise servant is acceptable to the king: he that is good for nothing shall feel his anger.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sapiens mulier ædificat domum suam ; insipiens exstructam quoque manibus destruet.\"},{\"verse\":2,\"text\":\"Ambulans recto itinere, et timens Deum, despicitur ab eo qui infami graditur via.\"},{\"verse\":3,\"text\":\"In ore stulti virga superbiæ ; labia autem sapientium custodiunt eos.\"},{\"verse\":4,\"text\":\"Ubi non sunt boves, præsepe vacuum est ; ubi autem plurimæ segetes, ibi manifesta est fortitudo bovis.\"},{\"verse\":5,\"text\":\"Testis fidelis non mentitur ; profert autem mendacium dolosus testis.\"},{\"verse\":6,\"text\":\"Quærit derisor sapientiam, et non invenit ; doctrina prudentium facilis.\"},{\"verse\":7,\"text\":\"Vade contra virum stultum, et nescit labia prudentiæ.\"},{\"verse\":8,\"text\":\"Sapientia callidi est intelligere viam suam, et imprudentia stultorum errans.\"},{\"verse\":9,\"text\":\"Stultus illudet peccatum, et inter justos morabitur gratia.\"},{\"verse\":10,\"text\":\"Cor quod novit amaritudinem animæ suæ, in gaudio ejus non miscebitur extraneus.\"},{\"verse\":11,\"text\":\"Domus impiorum delebitur : tabernacula vero justorum germinabunt.\"},{\"verse\":12,\"text\":\"Est via quæ videtur homini justa, novissima autem ejus deducunt ad mortem.\"},{\"verse\":13,\"text\":\"Risus dolore miscebitur, et extrema gaudii luctus occupat.\"},{\"verse\":14,\"text\":\"Viis suis replebitur stultus, et super eum erit vir bonus.\"},{\"verse\":15,\"text\":\"Innocens credit omni verbo ; astutus considerat gressus suos. Filio doloso nihil erit boni ; servo autem sapienti prosperi erunt actus, et dirigetur via ejus.\"},{\"verse\":16,\"text\":\"Sapiens timet, et declinat a malo ; stultus transilit, et confidit.\"},{\"verse\":17,\"text\":\"Impatiens operabitur stultitiam, et vir versutus odiosus est.\"},{\"verse\":18,\"text\":\"Possidebunt parvuli stultitiam, et exspectabunt astuti scientiam.\"},{\"verse\":19,\"text\":\"Jacebunt mali ante bonos, et impii ante portas justorum.\"},{\"verse\":20,\"text\":\"Etiam proximo suo pauper odiosus erit : amici vero divitum multi.\"},{\"verse\":21,\"text\":\"Qui despicit proximum suum peccat ; qui autem miseretur pauperis beatus erit. Qui credit in Domino misericordiam diligit.\"},{\"verse\":22,\"text\":\"Errant qui operantur malum ; misericordia et veritas præparant bona.\"},{\"verse\":23,\"text\":\"In omni opere erit abundantia ; ubi autem verba sunt plurima, ibi frequenter egestas.\"},{\"verse\":24,\"text\":\"Corona sapientium divitiæ eorum ; fatuitas stultorum imprudentia.\"},{\"verse\":25,\"text\":\"Liberat animas testis fidelis, et profert mendacia versipellis.\"},{\"verse\":26,\"text\":\"In timore Domini fiducia fortitudinis, et filiis ejus erit spes.\"},{\"verse\":27,\"text\":\"Timor Domini fons vitæ, ut declinent a ruina mortis.\"},{\"verse\":28,\"text\":\"In multitudine populi dignitas regis, et in paucitate plebis ignominia principis.\"},{\"verse\":29,\"text\":\"Qui patiens est multa gubernatur prudentia ; qui autem impatiens est exaltat stultitiam suam.\"},{\"verse\":30,\"text\":\"Vita carnium sanitas cordis ; putredo ossium invidia.\"},{\"verse\":31,\"text\":\"Qui calumniatur egentem exprobrat factori ejus ; honorat autem eum qui miseretur pauperis.\"},{\"verse\":32,\"text\":\"In malitia sua expelletur impius : sperat autem justus in morte sua.\"},{\"verse\":33,\"text\":\"In corde prudentis requiescit sapientia, et indoctos quosque erudiet.\"},{\"verse\":34,\"text\":\"Justitia elevat gentem ; miseros autem facit populos peccatum.\"},{\"verse\":35,\"text\":\"Acceptus est regi minister intelligens ; iracundiam ejus inutilis sustinebit.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":13,\"label\":\"Proverbs 13\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":15,\"label\":\"Proverbs 15\"}}]]\n"])</script></body></html>
