may preserve instruction. Mind not the deceit of a woman.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For the lips of a harlot are like a honeycomb dropping, and her throat is smoother than oil.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But her end is bitter as wormwood, and sharp as a two-edged sword.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Her feet go down into death, and her steps go in as far as hell.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>They walk not by the path of life, her steps are wandering, and unaccountable.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now, therefore, my son, hear me, and depart not from the words of my mouth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Remove thy way far from her, and come not nigh the doors of her house.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Give not thy honour to strangers, and thy years to the cruel.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lest strangers be filled with thy strength, and thy labours be in another man’s house,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And thou mourn at the last, when thou shalt have spent thy flesh and thy body, and say;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Why have I hated instruction, and my heart consented not to reproof,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And have not heard the voice of them that taught me, and have not inclined my ear to masters?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I have almost been in all evil, in the midst of the church and of the congregation.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Drink water out of thy own cistern, and the streams of thy own well:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let thy fountains be conveyed abroad, and in the streets divide thy waters.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Keep them to thyself alone, neither let strangers be partakers with thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Let thy vein be blessed, and rejoice with the wife of thy youth:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let her be thy dearest hind, and most agreeable fawn: let her breasts inebriate thee at all times: be thou delighted continually with her love.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Why art thou seduced, my son, by a strange woman, and art cherished in the bosom of another?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The Lord beholdeth the ways of man, and considereth all his steps.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>His own iniquities catch the wicked, and he is fast bound with the ropes of his own sins.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>He shall die, because he hath not received instruction, and in the multitude of his folly he shall be deceived.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fili mi, attende ad sapientiam meam, et prudentiæ meæ inclina aurem tuam :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ut custodias cogitationes, et disciplinam labia tua conservent. Ne attendas fallaciæ mulieris ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>favus enim distillans labia meretricis, et nitidius oleo guttur ejus :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>novissima autem illius amara quasi absinthium, et acuta quasi gladius biceps.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Pedes ejus descendunt in mortem, et ad inferos gressus illius penetrant.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Per semitam vitæ non ambulant ; vagi sunt gressus ejus et investigabiles.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nunc ergo fili mi, audi me, et ne recedas a verbis oris mei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Longe fac ab ea viam tuam, et ne appropinques foribus domus ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ne des alienis honorem tuum, et annos tuos crudeli :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ne forte implentur extranei viribus tuis, et labores tui sint in domo aliena,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et gemas in novissimis, quando consumpseris carnes tuas et corpus tuum, et dicas :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cur detestatus sum disciplinam, et increpationibus non acquievit cor meum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>nec audivi vocem docentium me, et magistris non inclinavi aurem meam ?</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>pene fui in omni malo, in medio ecclesiæ et synagogæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Bibe aquam de cisterna tua, et fluenta putei tui ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>deriventur fontes tui foras, et in plateis aquas tuas divide.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Habeto eas solus, nec sint alieni participes tui.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sit vena tua benedicta, et lætare cum muliere adolescentiæ tuæ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cerva carissima, et gratissimus hinnulus : ubera ejus inebrient te in omni tempore ; in amore ejus delectare jugiter.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quare seduceris, fili mi, ab aliena, et foveris in sinu alterius ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Respicit Dominus vias hominis, et omnes gressus ejus considerat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Iniquitates suas capiunt impium, et funibus peccatorum suorum constringitur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ipse morietur, quia non habuit disciplinam, et in multitudine stultitiæ suæ decipietur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="roun d her throat is smoother than oil.\"},{\"verse\":4,\"text\":\"But her end is bitter as wormwood, and sharp as a two-edged sword.\"},{\"verse\":5,\"text\":\"Her feet go down into death, and her steps go in as far as hell.\"},{\"verse\":6,\"text\":\"They walk not by the path of life, her steps are wandering, and unaccountable.\"},{\"verse\":7,\"text\":\"Now, therefore, my son, hear me, and depart not from the words of my mouth.\"},{\"verse\":8,\"text\":\"Remove thy way far from her, and come not nigh the doors of her house.\"},{\"verse\":9,\"text\":\"Give not thy honour to strangers, and thy years to the cruel.\"},{\"verse\":10,\"text\":\"Lest strangers be filled with thy strength, and thy labours be in another man’s house,\"},{\"verse\":11,\"text\":\"And thou mourn at the last, when thou shalt have spent thy flesh and thy body, and say;\"},{\"verse\":12,\"text\":\"Why have I hated instruction, and my heart consented not to reproof,\"},{\"verse\":13,\"text\":\"And have not heard the voice of them that taught me, and have not inclined my ear to masters?\"},{\"verse\":14,\"text\":\"I have almost been in all evil, in the midst of the church and of the congregation.\"},{\"verse\":15,\"text\":\"Drink water out of thy own cistern, and the streams of thy own well:\"},{\"verse\":16,\"text\":\"Let thy fountains be conveyed abroad, and in the streets divide thy waters.\"},{\"verse\":17,\"text\":\"Keep them to thyself alone, neither let strangers be partakers with thee.\"},{\"verse\":18,\"text\":\"Let thy vein be blessed, and rejoice with the wife of thy youth:\"},{\"verse\":19,\"text\":\"Let her be thy dearest hind, and most agreeable fawn: let her breasts inebriate thee at all times: be thou delighted continually with her love.\"},{\"verse\":20,\"text\":\"Why art thou seduced, my son, by a strange woman, and art cherished in the bosom of another?\"},{\"verse\":21,\"text\":\"The Lord beholdeth the ways of man, and considereth all his steps.\"},{\"verse\":22,\"text\":\"His own iniquities catch the wicked, and he is fast bound with the ropes of his own sins.\"},{\"verse\":23,\"text\":\"He shall die, because he hath not received instruction, and in the multitude of his folly he shall be deceived.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fili mi, attende ad sapientiam meam, et prudentiæ meæ inclina aurem tuam :\"},{\"verse\":2,\"text\":\"ut custodias cogitationes, et disciplinam labia tua conservent. Ne attendas fallaciæ mulieris ;\"},{\"verse\":3,\"text\":\"favus enim distillans labia meretricis, et nitidius oleo guttur ejus :\"},{\"verse\":4,\"text\":\"novissima autem illius amara quasi absinthium, et acuta quasi gladius biceps.\"},{\"verse\":5,\"text\":\"Pedes ejus descendunt in mortem, et ad inferos gressus illius penetrant.\"},{\"verse\":6,\"text\":\"Per semitam vitæ non ambulant ; vagi sunt gressus ejus et investigabiles.\"},{\"verse\":7,\"text\":\"Nunc ergo fili mi, audi me, et ne recedas a verbis oris mei.\"},{\"verse\":8,\"text\":\"Longe fac ab ea viam tuam, et ne appropinques foribus domus ejus.\"},{\"verse\":9,\"text\":\"Ne des alienis honorem tuum, et annos tuos crudeli :\"},{\"verse\":10,\"text\":\"ne forte implentur extranei viribus tuis, et labores tui sint in domo aliena,\"},{\"verse\":11,\"text\":\"et gemas in novissimis, quando consumpseris carnes tuas et corpus tuum, et dicas :\"},{\"verse\":12,\"text\":\"Cur detestatus sum disciplinam, et increpationibus non acquievit cor meum,\"},{\"verse\":13,\"text\":\"nec audivi vocem docentium me, et magistris non inclinavi aurem meam ?\"},{\"verse\":14,\"text\":\"pene fui in omni malo, in medio ecclesiæ et synagogæ.\"},{\"verse\":15,\"text\":\"Bibe aquam de cisterna tua, et fluenta putei tui ;\"},{\"verse\":16,\"text\":\"deriventur fontes tui foras, et in plateis aquas tuas divide.\"},{\"verse\":17,\"text\":\"Habeto eas solus, nec sint alieni participes tui.\"},{\"verse\":18,\"text\":\"Sit vena tua benedicta, et lætare cum muliere adolescentiæ tuæ.\"},{\"verse\":19,\"text\":\"Cerva carissima, et gratissimus hinnulus : ubera ejus inebrient te in omni tempore ; in amore ejus delectare jugiter.\"},{\"verse\":20,\"text\":\"Quare seduceris, fili mi, ab aliena, et foveris in sinu alterius ?\"},{\"verse\":21,\"text\":\"Respicit Dominus vias hominis, et omnes gressus ejus considerat.\"},{\"verse\":22,\"text\":\"Iniquitates suas capiunt impium, et funibus peccatorum suorum constringitur.\"},{\"verse\":23,\"text\":\"Ipse morietur, quia non habuit disciplinam, et in multitudine stultitiæ suæ decipietur.\"}],\"summary\":\"An exhortation to fly unlawful lust, and the occasions of it.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":4,\"label\":\"Proverbs 4\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":6,\"label\":\"Proverbs 6\"}}]]\n"])</script></body></html>
