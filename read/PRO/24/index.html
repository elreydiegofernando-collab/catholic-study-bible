><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Because their mind studieth robberies, and their lips speak deceits.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>By wisdom the house shall be built, and by prudence it shall be strengthened.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>By instruction the storerooms shall be filled with all precious and most beautiful wealth.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>A wise man is strong: and a knowing man, stout and valiant.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Because war is managed by due ordering: and there shall be safety where there are many counsels.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Wisdom is too high for a fool; in the gate he shall not open his mouth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that deviseth to do evils, shall be called a fool.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The thought of a fool is sin: and the detractor is the abomination of men.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If thou lose hope, being weary in the day of distress, thy strength shall be diminished.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Deliver them that are led to death: and those that are drawn to death, forbear not to deliver.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If thou say: I have not strength enough: he that seeth into the heart, he understandeth, and nothing deceiveth the keeper of thy soul, and he shall render to a man according to his works.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Eat honey, my son, because it is good, and the honeycomb most sweet to thy throat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So also is the doctrine of wisdom to thy soul: which when thou hast found, thou shalt have hope in the end, and thy hope shall not perish.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Lie not in wait, nor seek after wickedness in the house of the just, nor spoil his rest.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For a just man shall fall seven times, and shall rise again: but the wicked shall fall down into evil.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>When thy enemy shall fall, be not glad, and in his ruin let not thy heart rejoice:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Lest the Lord see, and it displease him, and he turn away his wrath from him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Contend not with the wicked, nor seek to be like the ungodly.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For evil men have no hope of things to come, and the lamp of the wicked shall be put out.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>My son, fear the Lord, and the king: and have nothing to do with detractors.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For their destruction shall rise suddenly: and who knoweth the ruin of both?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>These things also to the wise: It is not good to have respect to persons in judgment.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>They that say to the wicked man: Thou art just: shall be cursed by the people, and the tribes shall abhor them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>They that rebuke him shall be praised: and a blessing shall come upon them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He shall kiss the lips, who answereth right words.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Prepare thy work without, and diligently till thy ground: that afterward thou mayst build thy house.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Be not witness without cause against thy neighbour: and deceive not any man with thy lips.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Say not: I will do to him as he hath done to me: I will render to every one according to his work.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I passed by the field of the slothful man, and by the vineyard of the foolish man:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And behold it was all filled with nettles, and thorns had covered the face thereof, and the stone wall was broken down.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Which when I had seen, I laid it up in my heart, and by the example I received instruction.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Thou wilt sleep a little, said I, thou wilt slumber a little, thou wilt fold thy hands a little to rest.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And poverty shall come to thee as a runner, and beggary as an armed man.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ne æmuleris viros malos, nec desideres esse cum eis :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>quia rapinas meditatur mens eorum, et fraudes labia eorum loquuntur.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sapientia ædificabitur domus, et prudentia roborabitur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In doctrina replebuntur cellaria, universa substantia pretiosa et pulcherrima.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Vir sapiens fortis est, et vir doctus robustus et validus :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>quia cum dispositione initur bellum, et erit salus ubi multa consilia sunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Excelsa stulto sapientia ; in porta non aperiet os suum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui cogitat mala facere stultus vocabitur :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>cogitatio stulti peccatum est, et abominatio hominum detractor.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si desperaveris lassus in die angustiæ, imminuetur fortitudo tua.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Erue eos qui ducuntur ad mortem, et qui trahuntur ad interitum, liberare ne cesses.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si dixeris : Vires non suppetunt ; qui inspector est cordis ipse intelligit : et servatorem animæ tuæ nihil fallit, reddetque homini juxta opera sua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Comede, fili mi, mel, quia bonum est, et favum dulcissimum gutturi tuo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sic et doctrina sapientiæ animæ tuæ : quam cum inveneris, habebis in novissimis spem, et spes tua non peribit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ne insidieris, et quæras impietatem in domo justi, neque vastes requiem ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Septies enim cadet justus, et resurget : impii autem corruent in malum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Cum ceciderit inimicus tuus ne gaudeas, et in ruina ejus ne exsultet cor tuum :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ne forte videat Dominus, et displiceat ei, et auferat ab eo iram suam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ne contendas cum pessimis, nec æmuleris impios :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quoniam non habent futurorum spem mali, et lucerna impiorum extinguetur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Time Dominum, fili mi, et regem, et cum detractoribus non commiscearis :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>quoniam repente consurget perditio eorum, et ruinam utriusque quis novit ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Hæc quoque sapientibus. Cognoscere personam in judicio non est bonum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui dicunt impio : Justus es : maledicent eis populi, et detestabuntur eos tribus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Qui arguunt eum laudabuntur, et super ipsos veniet benedictio.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Labia deosculabitur qui recta verba respondet.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Præpara foris opus tuum, et diligenter exerce agrum tuum, ut postea ædifices domum tuam.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ne sis testis frustra contra proximum tuum, nec lactes quemquam labiis tuis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ne dicas : Quomodo fecit mihi, sic faciam ei ; reddam unicuique secundum opus suum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Per agrum hominis pigri transivi, et per vineam viri stulti :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et ecce totum repleverant urticæ, et operuerant superficiem ejus spinæ, et maceria lapidum destructa erat.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quod cum vidissem, posui in corde meo, et exemplo didici disciplinam.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Parum, inquam, dormies, modicum dormitabis ; pauxillum manus conseres ut quiescas :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et veniet tibi quasi cursor egestas, et mendicitas quasi vir armatus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hove "usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":24,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Seek not to be like evil men, neither desire to be with them:\"},{\"verse\":2,\"text\":\"Because their mind studieth robberies, and their lips speak deceits.\"},{\"verse\":3,\"text\":\"By wisdom the house shall be built, and by prudence it shall be strengthened.\"},{\"verse\":4,\"text\":\"By instruction the storerooms shall be filled with all precious and most beautiful wealth.\"},{\"verse\":5,\"text\":\"A wise man is strong: and a knowing man, stout and valiant.\"},{\"verse\":6,\"text\":\"Because war is managed by due ordering: and there shall be safety where there are many counsels.\"},{\"verse\":7,\"text\":\"Wisdom is too high for a fool; in the gate he shall not open his mouth.\"},{\"verse\":8,\"text\":\"He that deviseth to do evils, shall be called a fool.\"},{\"verse\":9,\"text\":\"The thought of a fool is sin: and the detractor is the abomination of men.\"},{\"verse\":10,\"text\":\"If thou lose hope, being weary in the day of distress, thy strength shall be diminished.\"},{\"verse\":11,\"text\":\"Deliver them that are led to death: and those that are drawn to death, forbear not to deliver.\"},{\"verse\":12,\"text\":\"If thou say: I have not strength enough: he that seeth into the heart, he understandeth, and nothing deceiveth the keeper of thy soul, and he shall render to a man according to his works.\"},{\"verse\":13,\"text\":\"Eat honey, my son, because it is good, and the honeycomb most sweet to thy throat.\"},{\"verse\":14,\"text\":\"So also is the doctrine of wisdom to thy soul: which when thou hast found, thou shalt have hope in the end, and thy hope shall not perish.\"},{\"verse\":15,\"text\":\"Lie not in wait, nor seek after wickedness in the house of the just, nor spoil his rest.\"},{\"verse\":16,\"text\":\"For a just man shall fall seven times, and shall rise again: but the wicked shall fall down into evil.\"},{\"verse\":17,\"text\":\"When thy enemy shall fall, be not glad, and in his ruin let not thy heart rejoice:\"},{\"verse\":18,\"text\":\"Lest the Lord see, and it displease him, and he turn away his wrath from him.\"},{\"verse\":19,\"text\":\"Contend not with the wicked, nor seek to be like the ungodly.\"},{\"verse\":20,\"text\":\"For evil men have no hope of things to come, and the lamp of the wicked shall be put out.\"},{\"verse\":21,\"text\":\"My son, fear the Lord, and the king: and have nothing to do with detractors.\"},{\"verse\":22,\"text\":\"For their destruction shall rise suddenly: and who knoweth the ruin of both?\"},{\"verse\":23,\"text\":\"These things also to the wise: It is not good to have respect to persons in judgment.\"},{\"verse\":24,\"text\":\"They that say to the wicked man: Thou art just: shall be cursed by the people, and the tribes shall abhor them.\"},{\"verse\":25,\"text\":\"They that rebuke him shall be praised: and a blessing shall come upon them.\"},{\"verse\":26,\"text\":\"He shall kiss the lips, who answereth right words.\"},{\"verse\":27,\"text\":\"Prepare thy work without, and diligently till thy ground: that afterward thou mayst build thy house.\"},{\"verse\":28,\"text\":\"Be not witness without cause against thy neighbour: and deceive not any man with thy lips.\"},{\"verse\":29,\"text\":\"Say not: I will do to him as he hath done to me: I will render to every one according to his work.\"},{\"verse\":30,\"text\":\"I passed by the field of the slothful man, and by the vineyard of the foolish man:\"},{\"verse\":31,\"text\":\"And behold it was all filled with nettles, and thorns had covered the face thereof, and the stone wall was broken down.\"},{\"verse\":32,\"text\":\"Which when I had seen, I laid it up in my heart, and by the example I received instruction.\"},{\"verse\":33,\"text\":\"Thou wilt sleep a little, said I, thou wilt slumber a little, thou wilt fold thy hands a little to rest.\"},{\"verse\":34,\"text\":\"And poverty shall come to thee as a runner, and beggary as an armed man.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ne æmuleris viros malos, nec desideres esse cum eis :\"},{\"verse\":2,\"text\":\"quia rapinas meditatur mens eorum, et fraudes labia eorum loquuntur.\"},{\"verse\":3,\"text\":\"Sapientia ædificabitur domus, et prudentia roborabitur.\"},{\"verse\":4,\"text\":\"In doctrina replebuntur cellaria, universa substantia pretiosa et pulcherrima.\"},{\"verse\":5,\"text\":\"Vir sapiens fortis est, et vir doctus robustus et validus :\"},{\"verse\":6,\"text\":\"quia cum dispositione initur bellum, et erit salus ubi multa consilia sunt.\"},{\"verse\":7,\"text\":\"Excelsa stulto sapientia ; in porta non aperiet os suum.\"},{\"verse\":8,\"text\":\"Qui cogitat mala facere stultus vocabitur :\"},{\"verse\":9,\"text\":\"cogitatio stulti peccatum est, et abominatio hominum detractor.\"},{\"verse\":10,\"text\":\"Si desperaveris lassus in die angustiæ, imminuetur fortitudo tua.\"},{\"verse\":11,\"text\":\"Erue eos qui ducuntur ad mortem, et qui trahuntur ad interitum, liberare ne cesses.\"},{\"verse\":12,\"text\":\"Si dixeris : Vires non suppetunt ; qui inspector est cordis ipse intelligit : et servatorem animæ tuæ nihil fallit, reddetque homini juxta opera sua.\"},{\"verse\":13,\"text\":\"Comede, fili mi, mel, quia bonum est, et favum dulcissimum gutturi tuo.\"},{\"verse\":14,\"text\":\"Sic et doctrina sapientiæ animæ tuæ : quam cum inveneris, habebis in novissimis spem, et spes tua non peribit.\"},{\"verse\":15,\"text\":\"Ne insidieris, et quæras impietatem in domo justi, neque vastes requiem ejus.\"},{\"verse\":16,\"text\":\"Septies enim cadet justus, et resurget : impii autem corruent in malum.\"},{\"verse\":17,\"text\":\"Cum ceciderit inimicus tuus ne gaudeas, et in ruina ejus ne exsultet cor tuum :\"},{\"verse\":18,\"text\":\"ne forte videat Dominus, et displiceat ei, et auferat ab eo iram suam.\"},{\"verse\":19,\"text\":\"Ne contendas cum pessimis, nec æmuleris impios :\"},{\"verse\":20,\"text\":\"quoniam non habent futurorum spem mali, et lucerna impiorum extinguetur.\"},{\"verse\":21,\"text\":\"Time Dominum, fili mi, et regem, et cum detractoribus non commiscearis :\"},{\"verse\":22,\"text\":\"quoniam repente consurget perditio eorum, et ruinam utriusque quis novit ?\"},{\"verse\":23,\"text\":\"Hæc quoque sapientibus. Cognoscere personam in judicio non est bonum.\"},{\"verse\":24,\"text\":\"Qui dicunt impio : Justus es : maledicent eis populi, et detestabuntur eos tribus.\"},{\"verse\":25,\"text\":\"Qui arguunt eum laudabuntur, et super ipsos veniet benedictio.\"},{\"verse\":26,\"text\":\"Labia deosculabitur qui recta verba respondet.\"},{\"verse\":27,\"text\":\"Præpara foris opus tuum, et diligenter exerce agrum tuum, ut postea ædifices domum tuam.\"},{\"verse\":28,\"text\":\"Ne sis testis frustra contra proximum tuum, nec lactes quemquam labiis tuis.\"},{\"verse\":29,\"text\":\"Ne dicas : Quomodo fecit mihi, sic faciam ei ; reddam unicuique secundum opus suum.\"},{\"verse\":30,\"text\":\"Per agrum hominis pigri transivi, et per vineam viri stulti :\"},{\"verse\":31,\"text\":\"et ecce totum repleverant urticæ, et operuerant superficiem ejus spinæ, et maceria lapidum destructa erat.\"},{\"verse\":32,\"text\":\"Quod cum vidissem, posui in corde meo, et exemplo didici disciplinam.\"},{\"verse\":33,\"text\":\"Parum, inquam, dormies, modicum dormitabis ; pauxillum manus conseres ut quiescas :\"},{\"verse\":34,\"text\":\"et veniet tibi quasi cursor egestas, et mendicitas quasi vir armatus.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":23,\"label\":\"Proverbs 23\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":25,\"label\":\"Proverbs 25\"}}]]\n"])</script></body></html>
