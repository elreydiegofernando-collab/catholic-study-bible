m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">8</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The preaching of wisdom. Her excellence.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Doth not wisdom cry aloud, and prudence put forth her voice?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Standing in the top of the highest places by the way, in the midst of the paths,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Beside the gates of the city, in the very doors she speaketh, saying:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O ye men, to you I call, and my voice is to the sons of men.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>O little ones understand subtlety, and ye unwise, take notice.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hear, for I will speak of great things: and my lips shall be opened to preach right things.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>My mouth shall meditate truth, and my lips shall hate wickedness.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>All my words are just, there is nothing wicked, nor perverse in them.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They are right to them that understand, and just to them that find knowledge.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Receive my instruction, and not money: choose knowledge rather than gold.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For wisdom is better than all the most precious things: and whatsoever may be desired cannot be compared to it.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I, wisdom, dwell in counsel, and am present in learned thoughts.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The fear of the Lord hateth evil; I hate arrogance, and pride, and every wicked way, and a mouth with a double tongue.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Counsel and equity is mine, prudence is mine, strength is mine.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>By me kings reign, and lawgivers decree just things.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>By me princes rule, and the mighty decree justice.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>I love them that love me: and they that in the morning early watch for me, shall find me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>With me are riches and glory, glorious riches and justice.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For my fruit is better than gold and the precious stone, and my blossoms than choice silver.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>I walk in the way of justice, in the midst of the paths of judgment,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That I may enrich them that love me, and may fill their treasures.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The Lord possessed me in the beginning of his ways, before he made any thing from the beginning.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I was set up from eternity, and of old, before the earth was made.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The depths were not as yet, and I was already conceived, neither had the fountains of waters as yet sprung out.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The mountains, with their huge bulk, had not as yet been established: before the hills, I was brought forth:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He had not yet made the earth, nor the rivers, nor the poles of the world.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>When he prepared the heavens, I was present: when with a certain law, and compass, he enclosed the depths:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>When he established the sky above, and poised the fountains of waters:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>When he compassed the sea with its bounds, and set a law to the waters that they should not pass their limits: when he balanced the foundations of the earth;</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I was with him forming all things: and was delighted every day, playing before him at all times;</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Playing in the world: and my delights were to be with the children of men.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Now, therefore, ye children, hear me: blessed are they that keep my ways.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hear instruction, and be wise, and refuse it not.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Blessed is the man that heareth me, and that watcheth daily at my gates, and waiteth at the posts of my doors.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>He that shall find me, shall find life, and shall have salvation from the Lord.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But he that shall sin against me shall hurt his own soul. All that hate me love death.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Numquid non sapientia clamitat, et prudentia dat vocem suam ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In summis excelsisque verticibus supra viam, in mediis semitis stans,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>juxta portas civitatis, in ipsis foribus loquitur, dicens :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>O viri, ad vos clamito, et vox mea ad filios hominum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Intelligite, parvuli, astutiam, et insipientes, animadvertite.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Audite, quoniam de rebus magnis locutura sum, et aperientur labia mea ut recta prædicent.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Veritatem meditabitur guttur meum, et labia mea detestabuntur impium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Justi sunt omnes sermones mei : non est in eis pravum quid, neque perversum ;</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>recti sunt intelligentibus, et æqui invenientibus scientiam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Accipite disciplinam meam, et non pecuniam ; doctrinam magis quam aurum eligite :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>melior est enim sapientia cunctis pretiosissimis, et omne desiderabile ei non potest comparari.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ego sapientia, habito in consilio, et eruditis intersum cogitationibus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Timor Domini odit malum : arrogantiam, et superbiam, et viam pravam, et os bilingue, detestor.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Meum est consilium et æquitas ; mea est prudentia, mea est fortitudo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Per me reges regnant, et legum conditores justa decernunt ;</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>per me principes imperant, et potentes decernunt justitiam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ego diligentes me diligo, et qui mane vigilant ad me, invenient me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Mecum sunt divitiæ et gloria, opes superbæ et justitia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Melior est enim fructus meus auro et lapide pretioso, et genimina mea argento electo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In viis justitiæ ambulo, in medio semitarum judicii :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut ditem diligentes me, et thesauros eorum repleam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dominus possedit me in initio viarum suarum antequam quidquam faceret a principio.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ab æterno ordinata sum, et ex antiquis antequam terra fieret.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nondum erant abyssi, et ego jam concepta eram : necdum fontes aquarum eruperant,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>necdum montes gravi mole constiterant : ante colles ego parturiebar.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Adhuc terram non fecerat, et flumina, et cardines orbis terræ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quando præparabat cælos, aderam ; quando certa lege et gyro vallabat abyssos ;</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>quando æthera firmabat sursum, et librabat fontes aquarum ;</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>quando circumdabat mari terminum suum, et legem ponebat aquis, ne transirent fines suos ; quando appendebat fundamenta terræ :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>cum eo eram, cuncta componens. Et delectabar per singulos dies, ludens coram eo omni tempore,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>ludens in orbe terrarum ; et deliciæ meæ esse cum filiis hominum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Nunc ergo, filii, audite me : beati qui custodiunt vias meas.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Audite disciplinam, et estote sapientes, et nolite abjicere eam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Beatus homo qui audit me, et qui vigilat ad fores meas quotidie, et observat ad postes ostii mei.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Qui me invenerit, inveniet vitam, et hauriet salutem a Domino.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Qui autem in me peccaverit, lædet animam suam ; omnes qui me oderunt diligunt mortem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/9/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 9</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->8<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 7" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":8,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Doth not wisdom cry aloud, and prudence put forth her voice?\"},{\"verse\":2,\"text\":\"Standing in the top of the highest places by the way, in the midst of the paths,\"},{\"verse\":3,\"text\":\"Beside the gates of the city, in the very doors she speaketh, saying:\"},{\"verse\":4,\"text\":\"O ye men, to you I call, and my voice is to the sons of men.\"},{\"verse\":5,\"text\":\"O little ones understand subtlety, and ye unwise, take notice.\"},{\"verse\":6,\"text\":\"Hear, for I will speak of great things: and my lips shall be opened to preach right things.\"},{\"verse\":7,\"text\":\"My mouth shall meditate truth, and my lips shall hate wickedness.\"},{\"verse\":8,\"text\":\"All my words are just, there is nothing wicked, nor perverse in them.\"},{\"verse\":9,\"text\":\"They are right to them that understand, and just to them that find knowledge.\"},{\"verse\":10,\"text\":\"Receive my instruction, and not money: choose knowledge rather than gold.\"},{\"verse\":11,\"text\":\"For wisdom is better than all the most precious things: and whatsoever may be desired cannot be compared to it.\"},{\"verse\":12,\"text\":\"I, wisdom, dwell in counsel, and am present in learned thoughts.\"},{\"verse\":13,\"text\":\"The fear of the Lord hateth evil; I hate arrogance, and pride, and every wicked way, and a mouth with a double tongue.\"},{\"verse\":14,\"text\":\"Counsel and equity is mine, prudence is mine, strength is mine.\"},{\"verse\":15,\"text\":\"By me kings reign, and lawgivers decree just things.\"},{\"verse\":16,\"text\":\"By me princes rule, and the mighty decree justice.\"},{\"verse\":17,\"text\":\"I love them that love me: and they that in the morning early watch for me, shall find me.\"},{\"verse\":18,\"text\":\"With me are riches and glory, glorious riches and justice.\"},{\"verse\":19,\"text\":\"For my fruit is better than gold and the precious stone, and my blossoms than choice silver.\"},{\"verse\":20,\"text\":\"I walk in the way of justice, in the midst of the paths of judgment,\"},{\"verse\":21,\"text\":\"That I may enrich them that love me, and may fill their treasures.\"},{\"verse\":22,\"text\":\"The Lord possessed me in the beginning of his ways, before he made any thing from the beginning.\"},{\"verse\":23,\"text\":\"I was set up from eternity, and of old, before the earth was made.\"},{\"verse\":24,\"text\":\"The depths were not as yet, and I was already conceived, neither had the fountains of waters as yet sprung out.\"},{\"verse\":25,\"text\":\"The mountains, with their huge bulk, had not as yet been established: before the hills, I was brought forth:\"},{\"verse\":26,\"text\":\"He had not yet made the earth, nor the rivers, nor the poles of the world.\"},{\"verse\":27,\"text\":\"When he prepared the heavens, I was present: when with a certain law, and compass, he enclosed the depths:\"},{\"verse\":28,\"text\":\"When he established the sky above, and poised the fountains of waters:\"},{\"verse\":29,\"text\":\"When he compassed the sea with its bounds, and set a law to the waters that they should not pass their limits: when he balanced the foundations of the earth;\"},{\"verse\":30,\"text\":\"I was with him forming all things: and was delighted every day, playing before him at all times;\"},{\"verse\":31,\"text\":\"Playing in the world: and my delights were to be with the children of men.\"},{\"verse\":32,\"text\":\"Now, therefore, ye children, hear me: blessed are they that keep my ways.\"},{\"verse\":33,\"text\":\"Hear instruction, and be wise, and refuse it not.\"},{\"verse\":34,\"text\":\"Blessed is the man that heareth me, and that watcheth daily at my gates, and waiteth at the posts of my doors.\"},{\"verse\":35,\"text\":\"He that shall find me, shall find life, and shall have salvation from the Lord.\"},{\"verse\":36,\"text\":\"But he that shall sin against me shall hurt his own soul. All that hate me love death.\"}],\"vul\":[{\"verse\":1,\"text\":\"Numquid non sapientia clamitat, et prudentia dat vocem suam ?\"},{\"verse\":2,\"text\":\"In summis excelsisque verticibus supra viam, in mediis semitis stans,\"},{\"verse\":3,\"text\":\"juxta portas civitatis, in ipsis foribus loquitur, dicens :\"},{\"verse\":4,\"text\":\"O viri, ad vos clamito, et vox mea ad filios hominum.\"},{\"verse\":5,\"text\":\"Intelligite, parvuli, astutiam, et insipientes, animadvertite.\"},{\"verse\":6,\"text\":\"Audite, quoniam de rebus magnis locutura sum, et aperientur labia mea ut recta prædicent.\"},{\"verse\":7,\"text\":\"Veritatem meditabitur guttur meum, et labia mea detestabuntur impium.\"},{\"verse\":8,\"text\":\"Justi sunt omnes sermones mei : non est in eis pravum quid, neque perversum ;\"},{\"verse\":9,\"text\":\"recti sunt intelligentibus, et æqui invenientibus scientiam.\"},{\"verse\":10,\"text\":\"Accipite disciplinam meam, et non pecuniam ; doctrinam magis quam aurum eligite :\"},{\"verse\":11,\"text\":\"melior est enim sapientia cunctis pretiosissimis, et omne desiderabile ei non potest comparari.\"},{\"verse\":12,\"text\":\"Ego sapientia, habito in consilio, et eruditis intersum cogitationibus.\"},{\"verse\":13,\"text\":\"Timor Domini odit malum : arrogantiam, et superbiam, et viam pravam, et os bilingue, detestor.\"},{\"verse\":14,\"text\":\"Meum est consilium et æquitas ; mea est prudentia, mea est fortitudo.\"},{\"verse\":15,\"text\":\"Per me reges regnant, et legum conditores justa decernunt ;\"},{\"verse\":16,\"text\":\"per me principes imperant, et potentes decernunt justitiam.\"},{\"verse\":17,\"text\":\"Ego diligentes me diligo, et qui mane vigilant ad me, invenient me.\"},{\"verse\":18,\"text\":\"Mecum sunt divitiæ et gloria, opes superbæ et justitia.\"},{\"verse\":19,\"text\":\"Melior est enim fructus meus auro et lapide pretioso, et genimina mea argento electo.\"},{\"verse\":20,\"text\":\"In viis justitiæ ambulo, in medio semitarum judicii :\"},{\"verse\":21,\"text\":\"ut ditem diligentes me, et thesauros eorum repleam.\"},{\"verse\":22,\"text\":\"Dominus possedit me in initio viarum suarum antequam quidquam faceret a principio.\"},{\"verse\":23,\"text\":\"Ab æterno ordinata sum, et ex antiquis antequam terra fieret.\"},{\"verse\":24,\"text\":\"Nondum erant abyssi, et ego jam concepta eram : necdum fontes aquarum eruperant,\"},{\"verse\":25,\"text\":\"necdum montes gravi mole constiterant : ante colles ego parturiebar.\"},{\"verse\":26,\"text\":\"Adhuc terram non fecerat, et flumina, et cardines orbis terræ.\"},{\"verse\":27,\"text\":\"Quando præparabat cælos, aderam ; quando certa lege et gyro vallabat abyssos ;\"},{\"verse\":28,\"text\":\"quando æthera firmabat sursum, et librabat fontes aquarum ;\"},{\"verse\":29,\"text\":\"quando circumdabat mari terminum suum, et legem ponebat aquis, ne transirent fines suos ; quando appendebat fundamenta terræ :\"},{\"verse\":30,\"text\":\"cum eo eram, cuncta componens. Et delectabar per singulos dies, ludens coram eo omni tempore,\"},{\"verse\":31,\"text\":\"ludens in orbe terrarum ; et deliciæ meæ esse cum filiis hominum.\"},{\"verse\":32,\"text\":\"Nunc ergo, filii, audite me : beati qui custodiunt vias meas.\"},{\"verse\":33,\"text\":\"Audite disciplinam, et estote sapientes, et nolite abjicere eam.\"},{\"verse\":34,\"text\":\"Beatus homo qui audit me, et qui vigilat ad fores meas quotidie, et observat ad postes ostii mei.\"},{\"verse\":35,\"text\":\"Qui me invenerit, inveniet vitam, et hauriet salutem a Domino.\"},{\"verse\":36,\"text\":\"Qui autem in me peccaverit, lædet animam suam ; omnes qui me oderunt diligunt mortem.\"}],\"summary\":\"The preaching of wisdom. Her excellence.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":7,\"label\":\"Proverbs 7\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":9,\"label\":\"Proverbs 9\"}}]]\n"])</script></body></html>
