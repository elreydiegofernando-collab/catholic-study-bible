"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">27</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Boast not for to morrow, for thou knowest not what the day to come may bring forth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Let another praise thee, and not thy own mouth: a stranger, and not thy own lips.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>A stone is heavy, and sand weighty: but the anger of a fool is heavier than them both.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Anger hath no mercy: nor fury, when it breaketh forth: and who can bear the violence of one provoked?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Open rebuke is better than hidden love.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Better are the wounds of a friend, than the deceitful kisses of an enemy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>A soul that is full shall tread upon the honeycomb: and a soul that is hungry shall take even bitter for sweet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>As a bird that wandereth from her nest, so is a man that leaveth his place.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ointment and perfumes rejoice the heart: and the good counsels of a friend are sweet to the soul.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thy own friend, and thy father’s friend, forsake not: and go not into thy brother’s house in the day of thy affliction. Better is a neighbour that is near than a brother afar off.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Study wisdom, my son, and make my heart joyful, that thou mayst give an answer to him that reproacheth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The prudent man seeing evil hideth himself: little ones passing on have suffered losses.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Take away his garment that hath been surety for a stranger: and take from him a pledge for strangers.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He that blesseth his neighbour with a loud voice, rising in the night, shall be like to him that curseth.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Roofs dropping through in a cold day, and a contentious woman are alike.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that retaineth her, is as he that would hold the wind, and shall call the oil of his right hand.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Iron sharpeneth iron, so a man sharpeneth the countenance of his friend.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He that keepeth the fig tree, shall eat the fruit thereof: and he that is the keeper of his master, shall be glorified.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>As the faces of them that look therein, shine in the water, so the hearts of men are laid open to the wise.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hell and destruction are never filled: so the eyes of men are never satisfied.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>As silver is tried in the fining-pot, and gold in the furnace: so a man is tried by the mouth of him that praiseth. The heart of the wicked seeketh after evils, but the righteous heart seeketh after knowledge.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Though thou shouldst bray a fool in the mortar, as when a pestle striketh upon sodden barley, his folly would not be taken from him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Be diligent to know the countenance of thy cattle, and consider thy own flocks:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For thou shalt not always have power: but a crown shall be given to generation and generation.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The meadows are open, and the green herbs have appeared, and the hay is gathered out of the mountains.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Lambs are for thy clothing: and kids for the price of the field.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Let the milk of the goats be enough for thy food, and for the necessities of thy house, and for maintenance for thy handmaids.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ne glorieris in crastinum, ignorans quid superventura pariat dies.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Laudet te alienus, et non os tuum ; extraneus, et non labia tua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Grave est saxum, et onerosa arena, sed ira stulti utroque gravior.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ira non habet misericordiam nec erumpens furor, et impetum concitati ferre quis poterit ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Melior est manifesta correptio quam amor absconditus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Meliora sunt vulnera diligentis quam fraudulenta oscula odientis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Anima saturata calcabit favum, et anima esuriens etiam amarum pro dulci sumet.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sicut avis transmigrans de nido suo, sic vir qui derelinquit locum suum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Unguento et variis odoribus delectatur cor, et bonis amici consiliis anima dulcoratur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Amicum tuum et amicum patris tui ne dimiseris, et domum fratris tui ne ingrediaris in die afflictionis tuæ. Melior est vicinus juxta quam frater procul.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Stude sapientiæ, fili mi, et lætifica cor meum, ut possis exprobranti respondere sermonem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Astutus videns malum, absconditus est : parvuli transeuntes sustinuerunt dispendia.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tolle vestimentum ejus qui spopondit pro extraneo, et pro alienis aufer ei pignus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Qui benedicit proximo suo voce grandi, de nocte consurgens maledicenti similis erit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Tecta perstillantia in die frigoris et litigiosa mulier comparantur.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui retinet eam quasi qui ventum teneat, et oleum dexteræ suæ vocabit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ferrum ferro exacuitur, et homo exacuit faciem amici sui.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui servat ficum comedet fructus ejus, et qui custos est domini sui glorificabitur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quomodo in aquis resplendent vultus prospicientium, sic corda hominum manifesta sunt prudentibus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Infernus et perditio numquam implentur : similiter et oculi hominum insatiabiles.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Quomodo probatur in conflatorio argentum et in fornace aurum, sic probatur homo ore laudantis. Cor iniqui inquirit mala, cor autem rectum inquirit scientiam.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si contuderis stultum in pila quasi ptisanas feriente desuper pilo, non auferetur ab eo stultitia ejus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Diligenter agnosce vultum pecoris tui, tuosque greges considera :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>non enim habebis jugiter potestatem, sed corona tribuetur in generationem et generationem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Aperta sunt prata, et apparuerunt herbæ virentes, et collecta sunt fœna de montibus.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Agni ad vestimentum tuum, et hædi ad agri pretium.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sufficiat tibi lac caprarum in cibos tuos, et in necessaria domus tuæ, et ad victum ancillis tuis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/26/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke a fool is heavier than them both.\"},{\"verse\":4,\"text\":\"Anger hath no mercy: nor fury, when it breaketh forth: and who can bear the violence of one provoked?\"},{\"verse\":5,\"text\":\"Open rebuke is better than hidden love.\"},{\"verse\":6,\"text\":\"Better are the wounds of a friend, than the deceitful kisses of an enemy.\"},{\"verse\":7,\"text\":\"A soul that is full shall tread upon the honeycomb: and a soul that is hungry shall take even bitter for sweet.\"},{\"verse\":8,\"text\":\"As a bird that wandereth from her nest, so is a man that leaveth his place.\"},{\"verse\":9,\"text\":\"Ointment and perfumes rejoice the heart: and the good counsels of a friend are sweet to the soul.\"},{\"verse\":10,\"text\":\"Thy own friend, and thy father’s friend, forsake not: and go not into thy brother’s house in the day of thy affliction. Better is a neighbour that is near than a brother afar off.\"},{\"verse\":11,\"text\":\"Study wisdom, my son, and make my heart joyful, that thou mayst give an answer to him that reproacheth.\"},{\"verse\":12,\"text\":\"The prudent man seeing evil hideth himself: little ones passing on have suffered losses.\"},{\"verse\":13,\"text\":\"Take away his garment that hath been surety for a stranger: and take from him a pledge for strangers.\"},{\"verse\":14,\"text\":\"He that blesseth his neighbour with a loud voice, rising in the night, shall be like to him that curseth.\"},{\"verse\":15,\"text\":\"Roofs dropping through in a cold day, and a contentious woman are alike.\"},{\"verse\":16,\"text\":\"He that retaineth her, is as he that would hold the wind, and shall call the oil of his right hand.\"},{\"verse\":17,\"text\":\"Iron sharpeneth iron, so a man sharpeneth the countenance of his friend.\"},{\"verse\":18,\"text\":\"He that keepeth the fig tree, shall eat the fruit thereof: and he that is the keeper of his master, shall be glorified.\"},{\"verse\":19,\"text\":\"As the faces of them that look therein, shine in the water, so the hearts of men are laid open to the wise.\"},{\"verse\":20,\"text\":\"Hell and destruction are never filled: so the eyes of men are never satisfied.\"},{\"verse\":21,\"text\":\"As silver is tried in the fining-pot, and gold in the furnace: so a man is tried by the mouth of him that praiseth. The heart of the wicked seeketh after evils, but the righteous heart seeketh after knowledge.\"},{\"verse\":22,\"text\":\"Though thou shouldst bray a fool in the mortar, as when a pestle striketh upon sodden barley, his folly would not be taken from him.\"},{\"verse\":23,\"text\":\"Be diligent to know the countenance of thy cattle, and consider thy own flocks:\"},{\"verse\":24,\"text\":\"For thou shalt not always have power: but a crown shall be given to generation and generation.\"},{\"verse\":25,\"text\":\"The meadows are open, and the green herbs have appeared, and the hay is gathered out of the mountains.\"},{\"verse\":26,\"text\":\"Lambs are for thy clothing: and kids for the price of the field.\"},{\"verse\":27,\"text\":\"Let the milk of the goats be enough for thy food, and for the necessities of thy house, and for maintenance for thy handmaids.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ne glorieris in crastinum, ignorans quid superventura pariat dies.\"},{\"verse\":2,\"text\":\"Laudet te alienus, et non os tuum ; extraneus, et non labia tua.\"},{\"verse\":3,\"text\":\"Grave est saxum, et onerosa arena, sed ira stulti utroque gravior.\"},{\"verse\":4,\"text\":\"Ira non habet misericordiam nec erumpens furor, et impetum concitati ferre quis poterit ?\"},{\"verse\":5,\"text\":\"Melior est manifesta correptio quam amor absconditus.\"},{\"verse\":6,\"text\":\"Meliora sunt vulnera diligentis quam fraudulenta oscula odientis.\"},{\"verse\":7,\"text\":\"Anima saturata calcabit favum, et anima esuriens etiam amarum pro dulci sumet.\"},{\"verse\":8,\"text\":\"Sicut avis transmigrans de nido suo, sic vir qui derelinquit locum suum.\"},{\"verse\":9,\"text\":\"Unguento et variis odoribus delectatur cor, et bonis amici consiliis anima dulcoratur.\"},{\"verse\":10,\"text\":\"Amicum tuum et amicum patris tui ne dimiseris, et domum fratris tui ne ingrediaris in die afflictionis tuæ. Melior est vicinus juxta quam frater procul.\"},{\"verse\":11,\"text\":\"Stude sapientiæ, fili mi, et lætifica cor meum, ut possis exprobranti respondere sermonem.\"},{\"verse\":12,\"text\":\"Astutus videns malum, absconditus est : parvuli transeuntes sustinuerunt dispendia.\"},{\"verse\":13,\"text\":\"Tolle vestimentum ejus qui spopondit pro extraneo, et pro alienis aufer ei pignus.\"},{\"verse\":14,\"text\":\"Qui benedicit proximo suo voce grandi, de nocte consurgens maledicenti similis erit.\"},{\"verse\":15,\"text\":\"Tecta perstillantia in die frigoris et litigiosa mulier comparantur.\"},{\"verse\":16,\"text\":\"Qui retinet eam quasi qui ventum teneat, et oleum dexteræ suæ vocabit.\"},{\"verse\":17,\"text\":\"Ferrum ferro exacuitur, et homo exacuit faciem amici sui.\"},{\"verse\":18,\"text\":\"Qui servat ficum comedet fructus ejus, et qui custos est domini sui glorificabitur.\"},{\"verse\":19,\"text\":\"Quomodo in aquis resplendent vultus prospicientium, sic corda hominum manifesta sunt prudentibus.\"},{\"verse\":20,\"text\":\"Infernus et perditio numquam implentur : similiter et oculi hominum insatiabiles.\"},{\"verse\":21,\"text\":\"Quomodo probatur in conflatorio argentum et in fornace aurum, sic probatur homo ore laudantis. Cor iniqui inquirit mala, cor autem rectum inquirit scientiam.\"},{\"verse\":22,\"text\":\"Si contuderis stultum in pila quasi ptisanas feriente desuper pilo, non auferetur ab eo stultitia ejus.\"},{\"verse\":23,\"text\":\"Diligenter agnosce vultum pecoris tui, tuosque greges considera :\"},{\"verse\":24,\"text\":\"non enim habebis jugiter potestatem, sed corona tribuetur in generationem et generationem.\"},{\"verse\":25,\"text\":\"Aperta sunt prata, et apparuerunt herbæ virentes, et collecta sunt fœna de montibus.\"},{\"verse\":26,\"text\":\"Agni ad vestimentum tuum, et hædi ad agri pretium.\"},{\"verse\":27,\"text\":\"Sufficiat tibi lac caprarum in cibos tuos, et in necessaria domus tuæ, et ad victum ancillis tuis.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":26,\"label\":\"Proverbs 26\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":28,\"label\":\"Proverbs 28\"}}]]\n"])</script></body></html>
