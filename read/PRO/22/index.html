"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">22</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>A good name is better than great riches: and good favour is above silver and gold.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The rich and poor have met one another: the Lord is the maker of them both.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The prudent man saw the evil, and hid himself: the simple passed on, and suffered loss.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The fruit of humility is the fear of the Lord, riches and glory and life.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Arms and swords are in the way of the perverse: but he that keepeth his own soul, departeth far from them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>It is a proverb: A young man according to his way, even when he is old, he will not depart from it.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The rich ruleth over the poor: and the borrower is servant to him that lendeth.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that soweth iniquity, shall reap evils, and with the rod of his anger he shall be consumed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that is inclined to mercy, shall be blessed: for of his bread he hath given to the poor. He that maketh presents, shall purchase victory and honour: but he carrieth away the souls of the receivers.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cast out the scoffer, and contention shall go out with him, and quarrels and reproaches shall cease.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He that loveth cleanness of heart, for the grace of his lips shall have the king for his friend.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The eyes of the Lord preserve knowledge: and the words of the unjust are overthrown.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The slothful man saith: There is a lion without, I shall be slain in the midst of the streets.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The mouth of a strange woman is a deep pit: he whom the Lord is angry with, shall fall into it.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Folly is bound up in the heart of a child, and the rod of correction shall drive it away.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that oppresseth the poor, to increase his own riches, shall himself give to one that is richer, and shall be in need.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Incline thy ear, and hear the words of the wise: and apply thy heart to my doctrine:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Which shall be beautiful for thee, if thou keep it in thy bowels, and it shall flow in thy lips:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>That thy trust may be in the Lord, wherefore I have also shewn it to thee this day.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Behold I have described it to thee three manner of ways, in thoughts and knowledge:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That I might shew thee the certainty, and the words of truth, to answer out of these to them that sent thee.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Do no violence to the poor, because he is poor: and do not oppress the needy in the gate:</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Because the Lord will judge his cause: and will afflict them that have afflicted his soul.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Be not a friend to an angry man, and do not walk with a furious man:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Lest perhaps thou learn his ways, and take scandal to thy soul.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Be not with them that fasten down their hands, and that offer themselves sureties for debts:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For if thou have not wherewith to restore, what cause is there that he should take the covering from thy bed?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Pass not beyond the ancient bounds which thy fathers have set.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Hast thou seen a man swift in his work? he shall stand before kings, and shall not be before those that are obscure.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Melius est nomen bonum quam divitiæ multæ ; super argentum et aurum gratia bona.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dives et pauper obviaverunt sibi : utriusque operator est Dominus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Callidus vidit malum, et abscondit se ; innocens pertransiit, et afflictus est damno.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Finis modestiæ timor Domini, divitiæ, et gloria, et vita.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Arma et gladii in via perversi ; custos autem animæ suæ longe recedit ab eis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Proverbium est : adolescens juxta viam suam ; etiam cum senuerit, non recedet ab ea.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dives pauperibus imperat, et qui accipit mutuum servus est fœnerantis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui seminat iniquitatem metet mala, et virga iræ suæ consummabitur.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui pronus est ad misericordiam benedicetur : de panibus enim suis dedit pauperi. Victoriam et honorem acquiret qui dat munera ; animam autem aufert accipientium.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ejice derisorem, et exibit cum eo jurgium, cessabuntque causæ et contumeliæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui diligit cordis munditiam, propter gratiam labiorum suorum habebit amicum regem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Oculi Domini custodiunt scientiam, et supplantantur verba iniqui.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dicit piger : Leo est foris ; in medio platearum occidendus sum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Fovea profunda os alienæ : cui iratus est Dominus, incidet in eam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Stultitia colligata est in corde pueri, et virga disciplinæ fugabit eam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui calumniatur pauperem ut augeat divitias suas, dabit ipse ditiori, et egebit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Inclina aurem tuam, et audi verba sapientium : appone autem cor ad doctrinam meam,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quæ pulchra erit tibi cum servaveris eam in ventre tuo, et redundabit in labiis tuis :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>ut sit in Domino fiducia tua, unde et ostendi eam tibi hodie.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Ecce descripsi eam tibi tripliciter, in cogitationibus et scientia :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut ostenderem tibi firmitatem et eloquia veritatis, respondere ex his illis qui miserunt te.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Non facias violentiam pauperi quia pauper est, neque conteras egenum in porta :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quia judicabit Dominus causam ejus, et configet eos qui confixerunt animam ejus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Noli esse amicus homini iracundo, neque ambules cum viro furioso :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ne forte discas semitas ejus, et sumas scandalum animæ tuæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Noli esse cum his qui defigunt manus suas, et qui vades se offerunt pro debitis :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>si enim non habes unde restituas, quid causæ est ut tollat operimentum de cubili tuo ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ne transgrediaris terminos antiquos, quos posuerunt patres tui.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vidisti virum velocem in opere suo ? coram regibus stabit, nec erit ante ignobiles.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 21</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/23/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 23</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->22<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 21" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" s 2\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":22,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"A good name is better than great riches: and good favour is above silver and gold.\"},{\"verse\":2,\"text\":\"The rich and poor have met one another: the Lord is the maker of them both.\"},{\"verse\":3,\"text\":\"The prudent man saw the evil, and hid himself: the simple passed on, and suffered loss.\"},{\"verse\":4,\"text\":\"The fruit of humility is the fear of the Lord, riches and glory and life.\"},{\"verse\":5,\"text\":\"Arms and swords are in the way of the perverse: but he that keepeth his own soul, departeth far from them.\"},{\"verse\":6,\"text\":\"It is a proverb: A young man according to his way, even when he is old, he will not depart from it.\"},{\"verse\":7,\"text\":\"The rich ruleth over the poor: and the borrower is servant to him that lendeth.\"},{\"verse\":8,\"text\":\"He that soweth iniquity, shall reap evils, and with the rod of his anger he shall be consumed.\"},{\"verse\":9,\"text\":\"He that is inclined to mercy, shall be blessed: for of his bread he hath given to the poor. He that maketh presents, shall purchase victory and honour: but he carrieth away the souls of the receivers.\"},{\"verse\":10,\"text\":\"Cast out the scoffer, and contention shall go out with him, and quarrels and reproaches shall cease.\"},{\"verse\":11,\"text\":\"He that loveth cleanness of heart, for the grace of his lips shall have the king for his friend.\"},{\"verse\":12,\"text\":\"The eyes of the Lord preserve knowledge: and the words of the unjust are overthrown.\"},{\"verse\":13,\"text\":\"The slothful man saith: There is a lion without, I shall be slain in the midst of the streets.\"},{\"verse\":14,\"text\":\"The mouth of a strange woman is a deep pit: he whom the Lord is angry with, shall fall into it.\"},{\"verse\":15,\"text\":\"Folly is bound up in the heart of a child, and the rod of correction shall drive it away.\"},{\"verse\":16,\"text\":\"He that oppresseth the poor, to increase his own riches, shall himself give to one that is richer, and shall be in need.\"},{\"verse\":17,\"text\":\"Incline thy ear, and hear the words of the wise: and apply thy heart to my doctrine:\"},{\"verse\":18,\"text\":\"Which shall be beautiful for thee, if thou keep it in thy bowels, and it shall flow in thy lips:\"},{\"verse\":19,\"text\":\"That thy trust may be in the Lord, wherefore I have also shewn it to thee this day.\"},{\"verse\":20,\"text\":\"Behold I have described it to thee three manner of ways, in thoughts and knowledge:\"},{\"verse\":21,\"text\":\"That I might shew thee the certainty, and the words of truth, to answer out of these to them that sent thee.\"},{\"verse\":22,\"text\":\"Do no violence to the poor, because he is poor: and do not oppress the needy in the gate:\"},{\"verse\":23,\"text\":\"Because the Lord will judge his cause: and will afflict them that have afflicted his soul.\"},{\"verse\":24,\"text\":\"Be not a friend to an angry man, and do not walk with a furious man:\"},{\"verse\":25,\"text\":\"Lest perhaps thou learn his ways, and take scandal to thy soul.\"},{\"verse\":26,\"text\":\"Be not with them that fasten down their hands, and that offer themselves sureties for debts:\"},{\"verse\":27,\"text\":\"For if thou have not wherewith to restore, what cause is there that he should take the covering from thy bed?\"},{\"verse\":28,\"text\":\"Pass not beyond the ancient bounds which thy fathers have set.\"},{\"verse\":29,\"text\":\"Hast thou seen a man swift in his work? he shall stand before kings, and shall not be before those that are obscure.\"}],\"vul\":[{\"verse\":1,\"text\":\"Melius est nomen bonum quam divitiæ multæ ; super argentum et aurum gratia bona.\"},{\"verse\":2,\"text\":\"Dives et pauper obviaverunt sibi : utriusque operator est Dominus.\"},{\"verse\":3,\"text\":\"Callidus vidit malum, et abscondit se ; innocens pertransiit, et afflictus est damno.\"},{\"verse\":4,\"text\":\"Finis modestiæ timor Domini, divitiæ, et gloria, et vita.\"},{\"verse\":5,\"text\":\"Arma et gladii in via perversi ; custos autem animæ suæ longe recedit ab eis.\"},{\"verse\":6,\"text\":\"Proverbium est : adolescens juxta viam suam ; etiam cum senuerit, non recedet ab ea.\"},{\"verse\":7,\"text\":\"Dives pauperibus imperat, et qui accipit mutuum servus est fœnerantis.\"},{\"verse\":8,\"text\":\"Qui seminat iniquitatem metet mala, et virga iræ suæ consummabitur.\"},{\"verse\":9,\"text\":\"Qui pronus est ad misericordiam benedicetur : de panibus enim suis dedit pauperi. Victoriam et honorem acquiret qui dat munera ; animam autem aufert accipientium.\"},{\"verse\":10,\"text\":\"Ejice derisorem, et exibit cum eo jurgium, cessabuntque causæ et contumeliæ.\"},{\"verse\":11,\"text\":\"Qui diligit cordis munditiam, propter gratiam labiorum suorum habebit amicum regem.\"},{\"verse\":12,\"text\":\"Oculi Domini custodiunt scientiam, et supplantantur verba iniqui.\"},{\"verse\":13,\"text\":\"Dicit piger : Leo est foris ; in medio platearum occidendus sum.\"},{\"verse\":14,\"text\":\"Fovea profunda os alienæ : cui iratus est Dominus, incidet in eam.\"},{\"verse\":15,\"text\":\"Stultitia colligata est in corde pueri, et virga disciplinæ fugabit eam.\"},{\"verse\":16,\"text\":\"Qui calumniatur pauperem ut augeat divitias suas, dabit ipse ditiori, et egebit.\"},{\"verse\":17,\"text\":\"Inclina aurem tuam, et audi verba sapientium : appone autem cor ad doctrinam meam,\"},{\"verse\":18,\"text\":\"quæ pulchra erit tibi cum servaveris eam in ventre tuo, et redundabit in labiis tuis :\"},{\"verse\":19,\"text\":\"ut sit in Domino fiducia tua, unde et ostendi eam tibi hodie.\"},{\"verse\":20,\"text\":\"Ecce descripsi eam tibi tripliciter, in cogitationibus et scientia :\"},{\"verse\":21,\"text\":\"ut ostenderem tibi firmitatem et eloquia veritatis, respondere ex his illis qui miserunt te.\"},{\"verse\":22,\"text\":\"Non facias violentiam pauperi quia pauper est, neque conteras egenum in porta :\"},{\"verse\":23,\"text\":\"quia judicabit Dominus causam ejus, et configet eos qui confixerunt animam ejus.\"},{\"verse\":24,\"text\":\"Noli esse amicus homini iracundo, neque ambules cum viro furioso :\"},{\"verse\":25,\"text\":\"ne forte discas semitas ejus, et sumas scandalum animæ tuæ.\"},{\"verse\":26,\"text\":\"Noli esse cum his qui defigunt manus suas, et qui vades se offerunt pro debitis :\"},{\"verse\":27,\"text\":\"si enim non habes unde restituas, quid causæ est ut tollat operimentum de cubili tuo ?\"},{\"verse\":28,\"text\":\"Ne transgrediaris terminos antiquos, quos posuerunt patres tui.\"},{\"verse\":29,\"text\":\"Vidisti virum velocem in opere suo ? coram regibus stabit, nec erit ante ignobiles.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":21,\"label\":\"Proverbs 21\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":23,\"label\":\"Proverbs 23\"}}]]\n"])</script></body></html>
