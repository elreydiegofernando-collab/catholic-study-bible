"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">23</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>When thou shalt sit to eat with a prince, consider diligently what is set before thy face:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And put a knife to thy throat, if it be so that thou have thy soul in thy own power.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Be not desirous of his meats, in which is the bread of deceit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Labour not to be rich: but set bounds to thy prudence.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Lift not up thy eyes to riches which thou canst not have: because they shall make themselves wings like those of an eagle, and shall fly towards heaven.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Eat not with an envious man, and desire not his meats:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Because, like a soothsayer, and diviner, he thinketh that which he knoweth not. Eat and drink, will he say to thee: and his mind is not with thee.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The meats which thou hadst eaten, thou shalt vomit up: and shalt loose thy beautiful words.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Speak not in the ears of fools: because they will despise the instruction of thy speech.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Touch not the bounds of little ones: and enter not into the field of the fatherless:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For their near kinsman is strong: and he will judge their cause against thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Let thy heart apply itself to instruction and thy ears to words of knowledge.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Withhold not correction from a child: for if thou strike him with the rod, he shall not die.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou shalt beat him with the rod, and deliver his soul from hell.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>My son, if thy mind be wise, my heart shall rejoice with thee:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And my reins shall rejoice, when thy lips shall speak what is right.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let not thy heart envy sinners: but be thou in the fear of the Lord all the day long:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Because thou shalt have hope in the latter end, and thy expectation shall not be taken away.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hear thou, my son, and be wise: and guide thy mind in the way.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Be not in the feasts of great drinkers, nor in their revellings, who contribute flesh to eat:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Because they that give themselves to drinking, and that club together, shall be consumed: and drowsiness shall be clothed with rags.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hearken to thy father, that begot thee: and despise not thy mother when she is old.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Buy truth, and do not sell wisdom, and instruction, and understanding.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The father of the just rejoiceth greatly: he that hath begotten a wise son, shall have joy in him.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let thy father and thy mother be joyful, and let her rejoice that bore thee.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>My son, give me thy heart: and let thy eyes keep my ways.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For a harlot is a deep ditch: and a strange woman is a narrow pit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>She lieth in wait in the way as a robber, and him whom she shall see unwary, she will kill.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Who hath woe? whose father hath woe? who hath contentions? who falls into pits? who hath wounds without cause? who hath redness of eyes?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Surely they that pass their time in wine, and study to drink off their cups.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Look not upon the wine when it is yellow, when the colour thereof shineth in the glass: it goeth in pleasantly,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But in the end, it will bite like a snake, and will spread abroad poison like a basilisk.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Thy eyes shall behold strange women, and thy heart shall utter perverse things.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And thou shalt be as one sleeping in the midst of the sea, and as a pilot fast asleep when the stern is lost.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And thou shalt say: They have beaten me, but I was not sensible of pain: they drew me, and I felt not: when shall I awake and find wine again?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quando sederis ut comedas cum principe, diligenter attende quæ apposita sunt ante faciem tuam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et statue cultrum in gutture tuo : si tamen habes in potestate animam tuam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ne desideres de cibis ejus, in quo est panis mendacii.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Noli laborare ut diteris, sed prudentiæ tuæ pone modum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ne erigas oculos tuos ad opes quas non potes habere, quia facient sibi pennas quasi aquilæ, et volabunt in cælum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ne comedas cum homine invido, et ne desideres cibos ejus :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quoniam in similitudinem arioli et conjectoris æstimat quod ignorat. Comede et bibe, dicet tibi ; et mens ejus non est tecum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cibos quos comederas evomes, et perdes pulchros sermones tuos.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In auribus insipientium ne loquaris, qui despicient doctrinam eloquii tui.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ne attingas parvulorum terminos, et agrum pupillorum ne introëas :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>propinquus enim illorum fortis est, et ipse judicabit contra te causam illorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Ingrediatur ad doctrinam cor tuum, et aures tuæ ad verba scientiæ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Noli subtrahere a puero disciplinam : si enim percusseris eum virga, non morietur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tu virga percuties eum, et animam ejus de inferno liberabis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fili mi, si sapiens fuerit animus tuus, gaudebit tecum cor meum :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et exsultabunt renes mei, cum locuta fuerint rectum labia tua.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non æmuletur cor tuum peccatores, sed in timore Domini esto tota die :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quia habebis spem in novissimo, et præstolatio tua non auferetur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Audi, fili mi, et esto sapiens, et dirige in via animum tuum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Noli esse in conviviis potatorum, nec in comessationibus eorum qui carnes ad vescendum conferunt :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quia vacantes potibus et dantes symbola consumentur, et vestietur pannis dormitatio.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Audi patrem tuum, qui genuit te, et ne contemnas cum senuerit mater tua.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Veritatem eme, et noli vendere sapientiam, et doctrinam, et intelligentiam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Exsultat gaudio pater justi ; qui sapientem genuit, lætabitur in eo.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Gaudeat pater tuus et mater tua, et exsultet quæ genuit te.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Præbe, fili mi, cor tuum mihi, et oculi tui vias meas custodiant.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Fovea enim profunda est meretrix, et puteus angustus aliena.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Insidiatur in via quasi latro, et quos incautos viderit, interficiet.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Cui væ ? cujus patri væ ? cui rixæ ? cui foveæ ? cui sine causa vulnera ? cui suffusio oculorum ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>nonne his qui commorantur in vino, et student calicibus epotandis ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ne intuearis vinum quando flavescit, cum splenduerit in vitro color ejus : ingreditur blande,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>sed in novissimo mordebit ut coluber, et sicut regulus venena diffundet.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Oculi tui videbunt extraneas, et cor tuum loquetur perversa.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et eris sicut dormiens in medio mari, et quasi sopitus gubernator, amisso clavo.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et dices : Verberaverunt me, sed non dolui ; traxerunt me, et ego non sensi. Quando evigilabo, et rursus vina reperiam ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 22</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/24/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 24</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->23<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 22" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/22/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m15 18-6 23,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"When thou shalt sit to eat with a prince, consider diligently what is set before thy face:\"},{\"verse\":2,\"text\":\"And put a knife to thy throat, if it be so that thou have thy soul in thy own power.\"},{\"verse\":3,\"text\":\"Be not desirous of his meats, in which is the bread of deceit.\"},{\"verse\":4,\"text\":\"Labour not to be rich: but set bounds to thy prudence.\"},{\"verse\":5,\"text\":\"Lift not up thy eyes to riches which thou canst not have: because they shall make themselves wings like those of an eagle, and shall fly towards heaven.\"},{\"verse\":6,\"text\":\"Eat not with an envious man, and desire not his meats:\"},{\"verse\":7,\"text\":\"Because, like a soothsayer, and diviner, he thinketh that which he knoweth not. Eat and drink, will he say to thee: and his mind is not with thee.\"},{\"verse\":8,\"text\":\"The meats which thou hadst eaten, thou shalt vomit up: and shalt loose thy beautiful words.\"},{\"verse\":9,\"text\":\"Speak not in the ears of fools: because they will despise the instruction of thy speech.\"},{\"verse\":10,\"text\":\"Touch not the bounds of little ones: and enter not into the field of the fatherless:\"},{\"verse\":11,\"text\":\"For their near kinsman is strong: and he will judge their cause against thee.\"},{\"verse\":12,\"text\":\"Let thy heart apply itself to instruction and thy ears to words of knowledge.\"},{\"verse\":13,\"text\":\"Withhold not correction from a child: for if thou strike him with the rod, he shall not die.\"},{\"verse\":14,\"text\":\"Thou shalt beat him with the rod, and deliver his soul from hell.\"},{\"verse\":15,\"text\":\"My son, if thy mind be wise, my heart shall rejoice with thee:\"},{\"verse\":16,\"text\":\"And my reins shall rejoice, when thy lips shall speak what is right.\"},{\"verse\":17,\"text\":\"Let not thy heart envy sinners: but be thou in the fear of the Lord all the day long:\"},{\"verse\":18,\"text\":\"Because thou shalt have hope in the latter end, and thy expectation shall not be taken away.\"},{\"verse\":19,\"text\":\"Hear thou, my son, and be wise: and guide thy mind in the way.\"},{\"verse\":20,\"text\":\"Be not in the feasts of great drinkers, nor in their revellings, who contribute flesh to eat:\"},{\"verse\":21,\"text\":\"Because they that give themselves to drinking, and that club together, shall be consumed: and drowsiness shall be clothed with rags.\"},{\"verse\":22,\"text\":\"Hearken to thy father, that begot thee: and despise not thy mother when she is old.\"},{\"verse\":23,\"text\":\"Buy truth, and do not sell wisdom, and instruction, and understanding.\"},{\"verse\":24,\"text\":\"The father of the just rejoiceth greatly: he that hath begotten a wise son, shall have joy in him.\"},{\"verse\":25,\"text\":\"Let thy father and thy mother be joyful, and let her rejoice that bore thee.\"},{\"verse\":26,\"text\":\"My son, give me thy heart: and let thy eyes keep my ways.\"},{\"verse\":27,\"text\":\"For a harlot is a deep ditch: and a strange woman is a narrow pit.\"},{\"verse\":28,\"text\":\"She lieth in wait in the way as a robber, and him whom she shall see unwary, she will kill.\"},{\"verse\":29,\"text\":\"Who hath woe? whose father hath woe? who hath contentions? who falls into pits? who hath wounds without cause? who hath redness of eyes?\"},{\"verse\":30,\"text\":\"Surely they that pass their time in wine, and study to drink off their cups.\"},{\"verse\":31,\"text\":\"Look not upon the wine when it is yellow, when the colour thereof shineth in the glass: it goeth in pleasantly,\"},{\"verse\":32,\"text\":\"But in the end, it will bite like a snake, and will spread abroad poison like a basilisk.\"},{\"verse\":33,\"text\":\"Thy eyes shall behold strange women, and thy heart shall utter perverse things.\"},{\"verse\":34,\"text\":\"And thou shalt be as one sleeping in the midst of the sea, and as a pilot fast asleep when the stern is lost.\"},{\"verse\":35,\"text\":\"And thou shalt say: They have beaten me, but I was not sensible of pain: they drew me, and I felt not: when shall I awake and find wine again?\"}],\"vul\":[{\"verse\":1,\"text\":\"Quando sederis ut comedas cum principe, diligenter attende quæ apposita sunt ante faciem tuam.\"},{\"verse\":2,\"text\":\"Et statue cultrum in gutture tuo : si tamen habes in potestate animam tuam.\"},{\"verse\":3,\"text\":\"Ne desideres de cibis ejus, in quo est panis mendacii.\"},{\"verse\":4,\"text\":\"Noli laborare ut diteris, sed prudentiæ tuæ pone modum.\"},{\"verse\":5,\"text\":\"Ne erigas oculos tuos ad opes quas non potes habere, quia facient sibi pennas quasi aquilæ, et volabunt in cælum.\"},{\"verse\":6,\"text\":\"Ne comedas cum homine invido, et ne desideres cibos ejus :\"},{\"verse\":7,\"text\":\"quoniam in similitudinem arioli et conjectoris æstimat quod ignorat. Comede et bibe, dicet tibi ; et mens ejus non est tecum.\"},{\"verse\":8,\"text\":\"Cibos quos comederas evomes, et perdes pulchros sermones tuos.\"},{\"verse\":9,\"text\":\"In auribus insipientium ne loquaris, qui despicient doctrinam eloquii tui.\"},{\"verse\":10,\"text\":\"Ne attingas parvulorum terminos, et agrum pupillorum ne introëas :\"},{\"verse\":11,\"text\":\"propinquus enim illorum fortis est, et ipse judicabit contra te causam illorum.\"},{\"verse\":12,\"text\":\"Ingrediatur ad doctrinam cor tuum, et aures tuæ ad verba scientiæ.\"},{\"verse\":13,\"text\":\"Noli subtrahere a puero disciplinam : si enim percusseris eum virga, non morietur.\"},{\"verse\":14,\"text\":\"Tu virga percuties eum, et animam ejus de inferno liberabis.\"},{\"verse\":15,\"text\":\"Fili mi, si sapiens fuerit animus tuus, gaudebit tecum cor meum :\"},{\"verse\":16,\"text\":\"et exsultabunt renes mei, cum locuta fuerint rectum labia tua.\"},{\"verse\":17,\"text\":\"Non æmuletur cor tuum peccatores, sed in timore Domini esto tota die :\"},{\"verse\":18,\"text\":\"quia habebis spem in novissimo, et præstolatio tua non auferetur.\"},{\"verse\":19,\"text\":\"Audi, fili mi, et esto sapiens, et dirige in via animum tuum.\"},{\"verse\":20,\"text\":\"Noli esse in conviviis potatorum, nec in comessationibus eorum qui carnes ad vescendum conferunt :\"},{\"verse\":21,\"text\":\"quia vacantes potibus et dantes symbola consumentur, et vestietur pannis dormitatio.\"},{\"verse\":22,\"text\":\"Audi patrem tuum, qui genuit te, et ne contemnas cum senuerit mater tua.\"},{\"verse\":23,\"text\":\"Veritatem eme, et noli vendere sapientiam, et doctrinam, et intelligentiam.\"},{\"verse\":24,\"text\":\"Exsultat gaudio pater justi ; qui sapientem genuit, lætabitur in eo.\"},{\"verse\":25,\"text\":\"Gaudeat pater tuus et mater tua, et exsultet quæ genuit te.\"},{\"verse\":26,\"text\":\"Præbe, fili mi, cor tuum mihi, et oculi tui vias meas custodiant.\"},{\"verse\":27,\"text\":\"Fovea enim profunda est meretrix, et puteus angustus aliena.\"},{\"verse\":28,\"text\":\"Insidiatur in via quasi latro, et quos incautos viderit, interficiet.\"},{\"verse\":29,\"text\":\"Cui væ ? cujus patri væ ? cui rixæ ? cui foveæ ? cui sine causa vulnera ? cui suffusio oculorum ?\"},{\"verse\":30,\"text\":\"nonne his qui commorantur in vino, et student calicibus epotandis ?\"},{\"verse\":31,\"text\":\"Ne intuearis vinum quando flavescit, cum splenduerit in vitro color ejus : ingreditur blande,\"},{\"verse\":32,\"text\":\"sed in novissimo mordebit ut coluber, et sicut regulus venena diffundet.\"},{\"verse\":33,\"text\":\"Oculi tui videbunt extraneas, et cor tuum loquetur perversa.\"},{\"verse\":34,\"text\":\"Et eris sicut dormiens in medio mari, et quasi sopitus gubernator, amisso clavo.\"},{\"verse\":35,\"text\":\"Et dices : Verberaverunt me, sed non dolui ; traxerunt me, et ego non sensi. Quando evigilabo, et rursus vina reperiam ?\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":22,\"label\":\"Proverbs 22\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":24,\"label\":\"Proverbs 24\"}}]]\n"])</script></body></html>
