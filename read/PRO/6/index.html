-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PRO/">About <!-- -->Proverbs</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Documents on several heads.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>My son, if thou be surety for thy friend, thou hast engaged fast thy hand to a stranger,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Thou art ensnared with the words of thy mouth, and caught with thy own words.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Do, therefore, my son, what I say, and deliver thyself: because thou art fallen into the hand of thy neighbour. Run about, make haste, stir up thy friend:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Give not sleep to thy eyes, neither let thy eyelids slumber.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Deliver thyself as a doe from the hand, and as a bird from the hand of the fowler.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Go to the ant, O sluggard, and consider her ways, and learn wisdom:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Which, although she hath no guide, nor master, nor captain,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Provideth her meat for herself in the summer, and gathereth her food in the harvest.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>How long wilt thou sleep, O sluggard? when wilt thou arise out of thy sleep?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Thou wilt sleep a little, thou wilt slumber a little, thou wilt fold thy hands a little to sleep:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And want shall come upon thee, as a traveller, and poverty as a man armed. But if thou be diligent, thy harvest shall come as a fountain, and want shall flee far from thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>A man that is an apostate, an unprofitable man, walketh with a perverse mouth,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He winketh with the eyes, presseth with the foot, speaketh with the finger.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>With a wicked heart he deviseth evil, and at all times he soweth discord.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>To such a one his destruction shall presently come, and he shall suddenly be destroyed, and shall no longer have any remedy.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Six things there are, which the Lord hateth, and the seventh his soul detesteth:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Haughty eyes, a lying tongue, hands that shed innocent blood,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A heart that deviseth wicked plots, feet that are swift to run into mischief,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A deceitful witness that uttereth lies, and him that soweth discord among brethren.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>My son, keep the commandments of thy father, and forsake not the law of thy mother.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Bind them in thy heart continually, and put them about thy neck.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>When thou walkest, let them go with thee: when thou sleepest, let them keep thee, and when thou awakest, talk with them.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Because the commandment is a lamp, and the law a light, and reproofs of instruction are the way of life:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>That they may keep thee from the evil woman, and from the flattering tongue of the stranger.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Let not thy heart covet her beauty, be not caught with her winks:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For the price of a harlot is scarce one loaf: but the woman catcheth the precious soul of a man.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Can a man hide fire in his bosom, and his garments not burn?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Or can he walk upon hot coals, and his feet not be burnt?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>So he that goeth in to his neighbour’s wife, shall not be clean when he shall touch her.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The fault is not so great when a man hath stolen: for he stealeth to fill his hungry soul:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And if he be taken, he shall restore sevenfold, and shall give up all the substance of his house.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But he that is an adulterer, for the folly of his heart shall destroy his own soul:</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He gathereth to himself shame and dishonour, and his reproach shall not be blotted out:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Because the jealousy and rage of the husband will not spare in the day of revenge,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Nor will he yield to any man’s prayers, nor will he accept for satisfaction ever so many gifts.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fili mi, si spoponderis pro amico tuo, defixisti apud extraneum manum tuam :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>illaqueatus es verbis oris tui, et captus propriis sermonibus.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Fac ergo quod dico, fili mi, et temetipsum libera, quia incidisti in manum proximi tui. Discurre, festina, suscita amicum tuum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ne dederis somnum oculis tuis, nec dormitent palpebræ tuæ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Eruere quasi damula de manu, et quasi avis de manu aucupis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Vade ad formicam, o piger, et considera vias ejus, et disce sapientiam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Quæ cum non habeat ducem, nec præceptorem, nec principem,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>parat in æstate cibum sibi, et congregat in messe quod comedat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Usquequo, piger, dormies ? quando consurges e somno tuo ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Paululum dormies, paululum dormitabis, paululum conseres manus ut dormias ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et veniet tibi quasi viator egestas, et pauperies quasi vir armatus. Si vero impiger fueris, veniet ut fons messis tua, et egestas longe fugiet a te.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Homo apostata, vir inutilis, graditur ore perverso ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>annuit oculis, terit pede, digito loquitur,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>pravo corde machinatur malum, et omni tempore jurgia seminat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Huic extemplo veniet perditio sua, et subito conteretur, nec habebit ultra medicinam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sex sunt quæ odit Dominus, et septimum detestatur anima ejus :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>oculos sublimes, linguam mendacem, manus effundentes innoxium sanguinem,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>cor machinans cogitationes pessimas, pedes veloces ad currendum in malum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>proferentem mendacia testem fallacem, et eum qui seminat inter fratres discordias.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Conserva, fili mi, præcepta patris tui, et ne dimittas legem matris tuæ.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Liga ea in corde tuo jugiter, et circumda gutturi tuo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cum ambulaveris, gradiantur tecum ; cum dormieris, custodiant te : et evigilans loquere cum eis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quia mandatum lucerna est, et lex lux, et via vitæ increpatio disciplinæ :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>ut custodiant te a muliere mala, et a blanda lingua extraneæ.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Non concupiscat pulchritudinem ejus cor tuum, nec capiaris nutibus illius :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>pretium enim scorti vix est unius panis, mulier autem viri pretiosam animam capit.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Numquid potest homo abscondere ignem in sinu suo, ut vestimenta illius non ardeant ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>aut ambulare super prunas, ut non comburantur plantæ ejus ?</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>sic qui ingreditur ad mulierem proximi sui, non erit mundus cum tetigerit eam.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Non grandis est culpa cum quis furatus fuerit : furatur enim ut esurientem impleat animam ;</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>deprehensus quoque reddet septuplum, et omnem substantiam domus suæ tradet.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Qui autem adulter est, propter cordis inopiam perdet animam suam ;</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>turpitudinem et ignominiam congregat sibi, et opprobrium illius non delebitur :</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>quia zelus et furor viri non parcet in die vindictæ,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>nec acquiescet cujusquam precibus, nec suscipiet pro redemptione dona plurima.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-c ref\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PRO.6\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":6,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"My son, if thou be surety for thy friend, thou hast engaged fast thy hand to a stranger,\"},{\"verse\":2,\"text\":\"Thou art ensnared with the words of thy mouth, and caught with thy own words.\"},{\"verse\":3,\"text\":\"Do, therefore, my son, what I say, and deliver thyself: because thou art fallen into the hand of thy neighbour. Run about, make haste, stir up thy friend:\"},{\"verse\":4,\"text\":\"Give not sleep to thy eyes, neither let thy eyelids slumber.\"},{\"verse\":5,\"text\":\"Deliver thyself as a doe from the hand, and as a bird from the hand of the fowler.\"},{\"verse\":6,\"text\":\"Go to the ant, O sluggard, and consider her ways, and learn wisdom:\"},{\"verse\":7,\"text\":\"Which, although she hath no guide, nor master, nor captain,\"},{\"verse\":8,\"text\":\"Provideth her meat for herself in the summer, and gathereth her food in the harvest.\"},{\"verse\":9,\"text\":\"How long wilt thou sleep, O sluggard? when wilt thou arise out of thy sleep?\"},{\"verse\":10,\"text\":\"Thou wilt sleep a little, thou wilt slumber a little, thou wilt fold thy hands a little to sleep:\"},{\"verse\":11,\"text\":\"And want shall come upon thee, as a traveller, and poverty as a man armed. But if thou be diligent, thy harvest shall come as a fountain, and want shall flee far from thee.\"},{\"verse\":12,\"text\":\"A man that is an apostate, an unprofitable man, walketh with a perverse mouth,\"},{\"verse\":13,\"text\":\"He winketh with the eyes, presseth with the foot, speaketh with the finger.\"},{\"verse\":14,\"text\":\"With a wicked heart he deviseth evil, and at all times he soweth discord.\"},{\"verse\":15,\"text\":\"To such a one his destruction shall presently come, and he shall suddenly be destroyed, and shall no longer have any remedy.\"},{\"verse\":16,\"text\":\"Six things there are, which the Lord hateth, and the seventh his soul detesteth:\"},{\"verse\":17,\"text\":\"Haughty eyes, a lying tongue, hands that shed innocent blood,\"},{\"verse\":18,\"text\":\"A heart that deviseth wicked plots, feet that are swift to run into mischief,\"},{\"verse\":19,\"text\":\"A deceitful witness that uttereth lies, and him that soweth discord among brethren.\"},{\"verse\":20,\"text\":\"My son, keep the commandments of thy father, and forsake not the law of thy mother.\"},{\"verse\":21,\"text\":\"Bind them in thy heart continually, and put them about thy neck.\"},{\"verse\":22,\"text\":\"When thou walkest, let them go with thee: when thou sleepest, let them keep thee, and when thou awakest, talk with them.\"},{\"verse\":23,\"text\":\"Because the commandment is a lamp, and the law a light, and reproofs of instruction are the way of life:\"},{\"verse\":24,\"text\":\"That they may keep thee from the evil woman, and from the flattering tongue of the stranger.\"},{\"verse\":25,\"text\":\"Let not thy heart covet her beauty, be not caught with her winks:\"},{\"verse\":26,\"text\":\"For the price of a harlot is scarce one loaf: but the woman catcheth the precious soul of a man.\"},{\"verse\":27,\"text\":\"Can a man hide fire in his bosom, and his garments not burn?\"},{\"verse\":28,\"text\":\"Or can he walk upon hot coals, and his feet not be burnt?\"},{\"verse\":29,\"text\":\"So he that goeth in to his neighbour’s wife, shall not be clean when he shall touch her.\"},{\"verse\":30,\"text\":\"The fault is not so great when a man hath stolen: for he stealeth to fill his hungry soul:\"},{\"verse\":31,\"text\":\"And if he be taken, he shall restore sevenfold, and shall give up all the substance of his house.\"},{\"verse\":32,\"text\":\"But he that is an adulterer, for the folly of his heart shall destroy his own soul:\"},{\"verse\":33,\"text\":\"He gathereth to himself shame and dishonour, and his reproach shall not be blotted out:\"},{\"verse\":34,\"text\":\"Because the jealousy and rage of the husband will not spare in the day of revenge,\"},{\"verse\":35,\"text\":\"Nor will he yield to any man’s prayers, nor will he accept for satisfaction ever so many gifts.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fili mi, si spoponderis pro amico tuo, defixisti apud extraneum manum tuam :\"},{\"verse\":2,\"text\":\"illaqueatus es verbis oris tui, et captus propriis sermonibus.\"},{\"verse\":3,\"text\":\"Fac ergo quod dico, fili mi, et temetipsum libera, quia incidisti in manum proximi tui. Discurre, festina, suscita amicum tuum.\"},{\"verse\":4,\"text\":\"Ne dederis somnum oculis tuis, nec dormitent palpebræ tuæ.\"},{\"verse\":5,\"text\":\"Eruere quasi damula de manu, et quasi avis de manu aucupis.\"},{\"verse\":6,\"text\":\"Vade ad formicam, o piger, et considera vias ejus, et disce sapientiam.\"},{\"verse\":7,\"text\":\"Quæ cum non habeat ducem, nec præceptorem, nec principem,\"},{\"verse\":8,\"text\":\"parat in æstate cibum sibi, et congregat in messe quod comedat.\"},{\"verse\":9,\"text\":\"Usquequo, piger, dormies ? quando consurges e somno tuo ?\"},{\"verse\":10,\"text\":\"Paululum dormies, paululum dormitabis, paululum conseres manus ut dormias ;\"},{\"verse\":11,\"text\":\"et veniet tibi quasi viator egestas, et pauperies quasi vir armatus. Si vero impiger fueris, veniet ut fons messis tua, et egestas longe fugiet a te.\"},{\"verse\":12,\"text\":\"Homo apostata, vir inutilis, graditur ore perverso ;\"},{\"verse\":13,\"text\":\"annuit oculis, terit pede, digito loquitur,\"},{\"verse\":14,\"text\":\"pravo corde machinatur malum, et omni tempore jurgia seminat.\"},{\"verse\":15,\"text\":\"Huic extemplo veniet perditio sua, et subito conteretur, nec habebit ultra medicinam.\"},{\"verse\":16,\"text\":\"Sex sunt quæ odit Dominus, et septimum detestatur anima ejus :\"},{\"verse\":17,\"text\":\"oculos sublimes, linguam mendacem, manus effundentes innoxium sanguinem,\"},{\"verse\":18,\"text\":\"cor machinans cogitationes pessimas, pedes veloces ad currendum in malum,\"},{\"verse\":19,\"text\":\"proferentem mendacia testem fallacem, et eum qui seminat inter fratres discordias.\"},{\"verse\":20,\"text\":\"Conserva, fili mi, præcepta patris tui, et ne dimittas legem matris tuæ.\"},{\"verse\":21,\"text\":\"Liga ea in corde tuo jugiter, et circumda gutturi tuo.\"},{\"verse\":22,\"text\":\"Cum ambulaveris, gradiantur tecum ; cum dormieris, custodiant te : et evigilans loquere cum eis.\"},{\"verse\":23,\"text\":\"Quia mandatum lucerna est, et lex lux, et via vitæ increpatio disciplinæ :\"},{\"verse\":24,\"text\":\"ut custodiant te a muliere mala, et a blanda lingua extraneæ.\"},{\"verse\":25,\"text\":\"Non concupiscat pulchritudinem ejus cor tuum, nec capiaris nutibus illius :\"},{\"verse\":26,\"text\":\"pretium enim scorti vix est unius panis, mulier autem viri pretiosam animam capit.\"},{\"verse\":27,\"text\":\"Numquid potest homo abscondere ignem in sinu suo, ut vestimenta illius non ardeant ?\"},{\"verse\":28,\"text\":\"aut ambulare super prunas, ut non comburantur plantæ ejus ?\"},{\"verse\":29,\"text\":\"sic qui ingreditur ad mulierem proximi sui, non erit mundus cum tetigerit eam.\"},{\"verse\":30,\"text\":\"Non grandis est culpa cum quis furatus fuerit : furatur enim ut esurientem impleat animam ;\"},{\"verse\":31,\"text\":\"deprehensus quoque reddet septuplum, et omnem substantiam domus suæ tradet.\"},{\"verse\":32,\"text\":\"Qui autem adulter est, propter cordis inopiam perdet animam suam ;\"},{\"verse\":33,\"text\":\"turpitudinem et ignominiam congregat sibi, et opprobrium illius non delebitur :\"},{\"verse\":34,\"text\":\"quia zelus et furor viri non parcet in die vindictæ,\"},{\"verse\":35,\"text\":\"nec acquiescet cujusquam precibus, nec suscipiet pro redemptione dona plurima.\"}],\"summary\":\"Documents on several heads.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":5,\"label\":\"Proverbs 5\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":7,\"label\":\"Proverbs 7\"}}]]\n"])</script></body></html>
