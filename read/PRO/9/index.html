-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/PRO/">About <!-- -->Proverbs</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Wisdom invites all to her feast. Folly calls another way.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Wisdom hath built herself a house, she hath hewn her out seven pillars.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>She hath slain her victims, mingled her wine, and set forth her table.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>She hath sent her maids to invite to the tower, and to the walls of the city:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Whosoever is a little one, let him come to me. And to the unwise she said:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Come, eat my bread, and drink the wine which I have mingled for you.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Forsake childishness, and live, and walk by the ways of prudence.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He that teacheth a scorner, doth an injury to himself; and he that rebuketh a wicked man, getteth himself a blot.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Rebuke not a scorner, lest he hate thee. Rebuke a wise man, and he will love thee.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Give an occasion to a wise man, and wisdom shall be added to him. Teach a just man, and he shall make haste to receive it.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The fear of the Lord is the beginning of wisdom: and the knowledge of the holy is prudence.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For by me shall thy days be multiplied, and years of life shall be added to thee.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If thou be wise, thou shalt be so to thyself: and if a scorner, thou alone shalt bear the evil.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>A foolish woman and clamorous, and full of allurements, and knowing nothing at all,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sat at the door of her house, upon a seat, in a high place of the city,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>To call them that pass by the way, and go on their journey:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that is a little one, let him turn to me. And to the fool she said:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Stolen waters are sweeter, and hidden bread is more pleasant.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he did not know that giants are there, and that her guests are in the depths of hell.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sapientia ædificavit sibi domum : excidit columnas septem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Immolavit victimas suas, miscuit vinum, et proposuit mensam suam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Misit ancillas suas ut vocarent ad arcem et ad mœnia civitatis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si quis est parvulus, veniat ad me. Et insipientibus locuta est :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Venite, comedite panem meum, et bibite vinum quod miscui vobis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Relinquite infantiam, et vivite, et ambulate per vias prudentiæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui erudit derisorem, ipse injuriam sibi facit, et qui arguit impium, sibi maculam generat.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Noli arguere derisorem, ne oderit te : argue sapientem, et diliget te.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Da sapienti occasionem, et addetur ei sapientia ; doce justum, et festinabit accipere.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Principium sapientiæ timor Domini, et scientia sanctorum prudentia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Per me enim multiplicabuntur dies tui, et addentur tibi anni vitæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si sapiens fueris, tibimetipsi eris ; si autem illusor, solus portabis malum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Mulier stulta et clamosa, plenaque illecebris, et nihil omnino sciens,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>sedit in foribus domus suæ, super sellam in excelso urbis loco,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ut vocaret transeuntes per viam, et pergentes itinere suo :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui est parvulus declinet ad me. Et vecordi locuta est :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Aquæ furtivæ dulciores sunt, et panis absconditus suavior.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et ignoravit quod ibi sint gigantes, et in profundis inferni convivæ ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/10/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 10</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->9<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 8" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-stud ,\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"PRO.9\",{\"bookId\":22,\"usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":9,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"Wisdom hath built herself a house, she hath hewn her out seven pillars.\"},{\"verse\":2,\"text\":\"She hath slain her victims, mingled her wine, and set forth her table.\"},{\"verse\":3,\"text\":\"She hath sent her maids to invite to the tower, and to the walls of the city:\"},{\"verse\":4,\"text\":\"Whosoever is a little one, let him come to me. And to the unwise she said:\"},{\"verse\":5,\"text\":\"Come, eat my bread, and drink the wine which I have mingled for you.\"},{\"verse\":6,\"text\":\"Forsake childishness, and live, and walk by the ways of prudence.\"},{\"verse\":7,\"text\":\"He that teacheth a scorner, doth an injury to himself; and he that rebuketh a wicked man, getteth himself a blot.\"},{\"verse\":8,\"text\":\"Rebuke not a scorner, lest he hate thee. Rebuke a wise man, and he will love thee.\"},{\"verse\":9,\"text\":\"Give an occasion to a wise man, and wisdom shall be added to him. Teach a just man, and he shall make haste to receive it.\"},{\"verse\":10,\"text\":\"The fear of the Lord is the beginning of wisdom: and the knowledge of the holy is prudence.\"},{\"verse\":11,\"text\":\"For by me shall thy days be multiplied, and years of life shall be added to thee.\"},{\"verse\":12,\"text\":\"If thou be wise, thou shalt be so to thyself: and if a scorner, thou alone shalt bear the evil.\"},{\"verse\":13,\"text\":\"A foolish woman and clamorous, and full of allurements, and knowing nothing at all,\"},{\"verse\":14,\"text\":\"Sat at the door of her house, upon a seat, in a high place of the city,\"},{\"verse\":15,\"text\":\"To call them that pass by the way, and go on their journey:\"},{\"verse\":16,\"text\":\"He that is a little one, let him turn to me. And to the fool she said:\"},{\"verse\":17,\"text\":\"Stolen waters are sweeter, and hidden bread is more pleasant.\"},{\"verse\":18,\"text\":\"And he did not know that giants are there, and that her guests are in the depths of hell.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sapientia ædificavit sibi domum : excidit columnas septem.\"},{\"verse\":2,\"text\":\"Immolavit victimas suas, miscuit vinum, et proposuit mensam suam.\"},{\"verse\":3,\"text\":\"Misit ancillas suas ut vocarent ad arcem et ad mœnia civitatis.\"},{\"verse\":4,\"text\":\"Si quis est parvulus, veniat ad me. Et insipientibus locuta est :\"},{\"verse\":5,\"text\":\"Venite, comedite panem meum, et bibite vinum quod miscui vobis.\"},{\"verse\":6,\"text\":\"Relinquite infantiam, et vivite, et ambulate per vias prudentiæ.\"},{\"verse\":7,\"text\":\"Qui erudit derisorem, ipse injuriam sibi facit, et qui arguit impium, sibi maculam generat.\"},{\"verse\":8,\"text\":\"Noli arguere derisorem, ne oderit te : argue sapientem, et diliget te.\"},{\"verse\":9,\"text\":\"Da sapienti occasionem, et addetur ei sapientia ; doce justum, et festinabit accipere.\"},{\"verse\":10,\"text\":\"Principium sapientiæ timor Domini, et scientia sanctorum prudentia.\"},{\"verse\":11,\"text\":\"Per me enim multiplicabuntur dies tui, et addentur tibi anni vitæ.\"},{\"verse\":12,\"text\":\"Si sapiens fueris, tibimetipsi eris ; si autem illusor, solus portabis malum.\"},{\"verse\":13,\"text\":\"Mulier stulta et clamosa, plenaque illecebris, et nihil omnino sciens,\"},{\"verse\":14,\"text\":\"sedit in foribus domus suæ, super sellam in excelso urbis loco,\"},{\"verse\":15,\"text\":\"ut vocaret transeuntes per viam, et pergentes itinere suo :\"},{\"verse\":16,\"text\":\"Qui est parvulus declinet ad me. Et vecordi locuta est :\"},{\"verse\":17,\"text\":\"Aquæ furtivæ dulciores sunt, et panis absconditus suavior.\"},{\"verse\":18,\"text\":\"Et ignoravit quod ibi sint gigantes, et in profundis inferni convivæ ejus.\"}],\"summary\":\"Wisdom invites all to her feast. Folly calls another way.\",\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":8,\"label\":\"Proverbs 8\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":10,\"label\":\"Proverbs 10\"}}]]\n"])</script></body></html>
