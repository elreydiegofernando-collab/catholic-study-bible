"m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Proverbs<!-- --> <span class="text-stone-500">12</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>He that loveth correction, loveth knowledge: but he that hateth reproof, is foolish.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>He that is good, shall draw grace from the Lord: but he that trusteth in his own devices, doth wickedly.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Man shall not be strengthened by wickedness: and the root of the just shall not be moved.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>A diligent woman is a crown to her husband: and she that doth things worthy of confusion, is as rottenness in his bones.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The thoughts of the just are judgments: and the counsels of the wicked are deceitful.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The words of the wicked lie in wait for blood: the mouth of the just shall deliver them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Turn the wicked, and they shall not be: but the house of the just shall stand firm.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>A man shall be known by his learning: but he that is vain and foolish, shall be exposed to contempt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Better is the poor man that provideth for himself, than he that is glorious and wanteth bread.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The just regardeth the lives of his beasts: but the bowels of the wicked are cruel.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He that tilleth his land shall be satisfied with bread: but he that pursueth idleness is very foolish. He that is delighted in passing his time over wine, leaveth a reproach in his strong holds.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The desire of the wicked is the fortification of evil men: but the root of the just shall prosper.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For the sins of the lips ruin draweth nigh to the evil man: but the just shall escape out of distress.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>By the fruit of his own mouth shall a man be filled with good things, and according to the works of his hands it shall be repaid him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The way of a fool is right in his own eyes: but he that is wise hearkeneth unto counsels.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A fool immediately sheweth his anger: but he that dissembleth injuries is wise.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He that speaketh that which he knoweth, sheweth forth justice: but he that lieth, is a deceitful witness.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>There is that promiseth, and is pricked as it were with a sword of conscience: but the tongue of the wise is health.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The lip of truth shall be steadfast for ever: but he that is a hasty witness, frameth a lying tongue.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Deceit is in the heart of them that think evil things: but joy followeth them that take counsels of peace.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Whatsoever shall befall the just man, shall not make him sad: but the wicked shall be filled with mischief.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Lying lips are an abomination to the Lord: but they that deal faithfully, please him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>A cautious man concealeth knowledge: and the heart of fools publisheth folly.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The hand of the valiant shall bear rule: but that which is slothful shall be under tribute.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Grief in the heart of a man shall bring him low, but with a good word he shall be made glad.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>He that neglecteth a loss for the sake of a friend, is just: but the way of the wicked shall deceive them.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The deceitful man shall not find gain: but the substance of a just man shall be precious gold.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In the path of justice is life: but the bye-way leadeth to death.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Qui diligit disciplinam diligit scientiam ; qui autem odit increpationes insipiens est.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui bonus est hauriet gratiam a Domino ; qui autem confidit in cogitationibus suis impie agit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non roborabitur homo ex impietate, et radix justorum non commovebitur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Mulier diligens corona est viro suo ; et putredo in ossibus ejus, quæ confusione res dignas gerit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cogitationes justorum judicia, et consilia impiorum fraudulenta.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Verba impiorum insidiantur sanguini ; os justorum liberabit eos.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Verte impios, et non erunt ; domus autem justorum permanebit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Doctrina sua noscetur vir ; qui autem vanus et excors est patebit contemptui.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Melior est pauper et sufficiens sibi quam gloriosus et indigens pane.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Novit justus jumentorum suorum animas ; viscera autem impiorum crudelia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui operatur terram suam satiabitur panibus ; qui autem sectatur otium stultissimus est. Qui suavis est in vini demorationibus, in suis munitionibus relinquit contumeliam.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Desiderium impii munimentum est pessimorum ; radix autem justorum proficiet.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Propter peccata labiorum ruina proximat malo ; effugiet autem justus de angustia.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>De fructu oris sui unusquisque replebitur bonis, et juxta opera manuum suarum retribuetur ei.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Via stulti recta in oculis ejus ; qui autem sapiens est audit consilia.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fatuus statim indicat iram suam ; qui autem dissimulat injuriam callidus est.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Qui quod novit loquitur, index justitiæ est ; qui autem mentitur, testis est fraudulentus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Est qui promittit, et quasi gladio pungitur conscientiæ : lingua autem sapientium sanitas est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Labium veritatis firmum erit in perpetuum ; qui autem testis est repentinus, concinnat linguam mendacii.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dolus in corde cogitantium mala ; qui autem pacis ineunt consilia, sequitur eos gaudium.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Non contristabit justum quidquid ei acciderit : impii autem replebuntur malo.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Abominatio est Domino labia mendacia ; qui autem fideliter agunt placent ei.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Homo versatus celat scientiam, et cor insipientium provocat stultitiam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Manus fortium dominabitur ; quæ autem remissa est, tributis serviet.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Mœror in corde viri humiliabit illum, et sermone bono lætificabitur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui negligit damnum propter amicum, justus est ; iter autem impiorum decipiet eos.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Non inveniet fraudulentus lucrum, et substantia hominis erit auri pretium.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>In semita justitiæ vita ; iter autem devium ducit ad mortem.</button></div><nav class="mt-8 grid grid-cols-2 2,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"He that loveth correction, loveth knowledge: but he that hateth reproof, is foolish.\"},{\"verse\":2,\"text\":\"He that is good, shall draw grace from the Lord: but he that trusteth in his own devices, doth wickedly.\"},{\"verse\":3,\"text\":\"Man shall not be strengthened by wickedness: and the root of the just shall not be moved.\"},{\"verse\":4,\"text\":\"A diligent woman is a crown to her husband: and she that doth things worthy of confusion, is as rottenness in his bones.\"},{\"verse\":5,\"text\":\"The thoughts of the just are judgments: and the counsels of the wicked are deceitful.\"},{\"verse\":6,\"text\":\"The words of the wicked lie in wait for blood: the mouth of the just shall deliver them.\"},{\"verse\":7,\"text\":\"Turn the wicked, and they shall not be: but the house of the just shall stand firm.\"},{\"verse\":8,\"text\":\"A man shall be known by his learning: but he that is vain and foolish, shall be exposed to contempt.\"},{\"verse\":9,\"text\":\"Better is the poor man that provideth for himself, than he that is glorious and wanteth bread.\"},{\"verse\":10,\"text\":\"The just regardeth the lives of his beasts: but the bowels of the wicked are cruel.\"},{\"verse\":11,\"text\":\"He that tilleth his land shall be satisfied with bread: but he that pursueth idleness is very foolish. He that is delighted in passing his time over wine, leaveth a reproach in his strong holds.\"},{\"verse\":12,\"text\":\"The desire of the wicked is the fortification of evil men: but the root of the just shall prosper.\"},{\"verse\":13,\"text\":\"For the sins of the lips ruin draweth nigh to the evil man: but the just shall escape out of distress.\"},{\"verse\":14,\"text\":\"By the fruit of his own mouth shall a man be filled with good things, and according to the works of his hands it shall be repaid him.\"},{\"verse\":15,\"text\":\"The way of a fool is right in his own eyes: but he that is wise hearkeneth unto counsels.\"},{\"verse\":16,\"text\":\"A fool immediately sheweth his anger: but he that dissembleth injuries is wise.\"},{\"verse\":17,\"text\":\"He that speaketh that which he knoweth, sheweth forth justice: but he that lieth, is a deceitful witness.\"},{\"verse\":18,\"text\":\"There is that promiseth, and is pricked as it were with a sword of conscience: but the tongue of the wise is health.\"},{\"verse\":19,\"text\":\"The lip of truth shall be steadfast for ever: but he that is a hasty witness, frameth a lying tongue.\"},{\"verse\":20,\"text\":\"Deceit is in the heart of them that think evil things: but joy followeth them that take counsels of peace.\"},{\"verse\":21,\"text\":\"Whatsoever shall befall the just man, shall not make him sad: but the wicked shall be filled with mischief.\"},{\"verse\":22,\"text\":\"Lying lips are an abomination to the Lord: but they that deal faithfully, please him.\"},{\"verse\":23,\"text\":\"A cautious man concealeth knowledge: and the heart of fools publisheth folly.\"},{\"verse\":24,\"text\":\"The hand of the valiant shall bear rule: but that which is slothful shall be under tribute.\"},{\"verse\":25,\"text\":\"Grief in the heart of a man shall bring him low, but with a good word he shall be made glad.\"},{\"verse\":26,\"text\":\"He that neglecteth a loss for the sake of a friend, is just: but the way of the wicked shall deceive them.\"},{\"verse\":27,\"text\":\"The deceitful man shall not find gain: but the substance of a just man shall be precious gold.\"},{\"verse\":28,\"text\":\"In the path of justice is life: but the bye-way leadeth to death.\"}],\"vul\":[{\"verse\":1,\"text\":\"Qui diligit disciplinam diligit scientiam ; qui autem odit increpationes insipiens est.\"},{\"verse\":2,\"text\":\"Qui bonus est hauriet gratiam a Domino ; qui autem confidit in cogitationibus suis impie agit.\"},{\"verse\":3,\"text\":\"Non roborabitur homo ex impietate, et radix justorum non commovebitur.\"},{\"verse\":4,\"text\":\"Mulier diligens corona est viro suo ; et putredo in ossibus ejus, quæ confusione res dignas gerit.\"},{\"verse\":5,\"text\":\"Cogitationes justorum judicia, et consilia impiorum fraudulenta.\"},{\"verse\":6,\"text\":\"Verba impiorum insidiantur sanguini ; os justorum liberabit eos.\"},{\"verse\":7,\"text\":\"Verte impios, et non erunt ; domus autem justorum permanebit.\"},{\"verse\":8,\"text\":\"Doctrina sua noscetur vir ; qui autem vanus et excors est patebit contemptui.\"},{\"verse\":9,\"text\":\"Melior est pauper et sufficiens sibi quam gloriosus et indigens pane.\"},{\"verse\":10,\"text\":\"Novit justus jumentorum suorum animas ; viscera autem impiorum crudelia.\"},{\"verse\":11,\"text\":\"Qui operatur terram suam satiabitur panibus ; qui autem sectatur otium stultissimus est. Qui suavis est in vini demorationibus, in suis munitionibus relinquit contumeliam.\"},{\"verse\":12,\"text\":\"Desiderium impii munimentum est pessimorum ; radix autem justorum proficiet.\"},{\"verse\":13,\"text\":\"Propter peccata labiorum ruina proximat malo ; effugiet autem justus de angustia.\"},{\"verse\":14,\"text\":\"De fructu oris sui unusquisque replebitur bonis, et juxta opera manuum suarum retribuetur ei.\"},{\"verse\":15,\"text\":\"Via stulti recta in oculis ejus ; qui autem sapiens est audit consilia.\"},{\"verse\":16,\"text\":\"Fatuus statim indicat iram suam ; qui autem dissimulat injuriam callidus est.\"},{\"verse\":17,\"text\":\"Qui quod novit loquitur, index justitiæ est ; qui autem mentitur, testis est fraudulentus.\"},{\"verse\":18,\"text\":\"Est qui promittit, et quasi gladio pungitur conscientiæ : lingua autem sapientium sanitas est.\"},{\"verse\":19,\"text\":\"Labium veritatis firmum erit in perpetuum ; qui autem testis est repentinus, concinnat linguam mendacii.\"},{\"verse\":20,\"text\":\"Dolus in corde cogitantium mala ; qui autem pacis ineunt consilia, sequitur eos gaudium.\"},{\"verse\":21,\"text\":\"Non contristabit justum quidquid ei acciderit : impii autem replebuntur malo.\"},{\"verse\":22,\"text\":\"Abominatio est Domino labia mendacia ; qui autem fideliter agunt placent ei.\"},{\"verse\":23,\"text\":\"Homo versatus celat scientiam, et cor insipientium provocat stultitiam.\"},{\"verse\":24,\"text\":\"Manus fortium dominabitur ; quæ autem remissa est, tributis serviet.\"},{\"verse\":25,\"text\":\"Mœror in corde viri humiliabit illum, et sermone bono lætificabitur.\"},{\"verse\":26,\"text\":\"Qui negligit damnum propter amicum, justus est ; iter autem impiorum decipiet eos.\"},{\"verse\":27,\"text\":\"Non inveniet fraudulentus lucrum, et substantia hominis erit auri pretium.\"},{\"verse\":28,\"text\":\"In semita justitiæ vita ; iter autem devium ducit ad mortem.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":11,\"label\":\"Proverbs 11\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":13,\"label\":\"Proverbs 13\"}}]]\n"])</script></body></html>
