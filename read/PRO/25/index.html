and the earth beneath, and the heart of kings is unsearchable.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Take away the rust from silver, and there shall come forth a most pure vessel:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Take away wickedness from the face of the king, and his throne shall be established with justice.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Appear not glorious before the king, and stand not in the place of great men.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For it is better that it should be said to thee: Come up hither; than that thou shouldst be humbled before the prince.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The things which thy eyes have seen, utter not hastily in a quarrel: lest afterward thou mayst not be able to make amends, when thou hast dishonoured thy friend.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Treat thy cause with thy friend, and discover not the secret to a stranger:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Lest he insult over thee, when he hath heard it, and cease not to upbraid thee. Grace and friendship deliver a man: keep these for thyself, lest thou fall under reproach.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>To speak a word in due time, is like apples of gold on beds of silver.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>As an earring of gold and a bright pearl, so is he that reproveth the wise, and the obedient ear.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>As the cold of snow in the time of harvest, so is a faithful messenger to him that sent him, for he refresheth his soul.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>As clouds, and wind, when no rain followeth, so is the man that boasteth, and doth not fulfil his promises.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>By patience a prince shall be appeased, and a soft tongue shall break hardness.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou hast found honey, eat what is sufficient for thee, lest being glutted therewith thou vomit it up.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Withdraw thy foot from the house of thy neighbour, lest having his fill he hate thee.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>A man that beareth false witness against his neighbour, is like a dart and a sword and a sharp arrow.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To trust in an unfaithful man in the time of trouble, is like a rotten tooth, and weary foot,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And one that looseth his garment in cold weather. As vinegar upon nitre, so is he that singeth songs to a very evil heart. As a moth doth by a garment, and a worm by the wood: so the sadness of a man consumeth the heart.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>If thy enemy be hungry, give him to eat: if he thirst, give him water to drink:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For thou shalt heap hot coals upon his head, and the Lord will reward thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The north wind driveth away rain, as doth a sad countenance a backbiting tongue.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>It is better to sit in a corner of the housetop: than with a brawling woman, and in a common house.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>As cold water to a thirsty soul, so are good tidings from a far country.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>A just man falling down before the wicked, is as a fountain troubled with the foot and a corrupted spring.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>As it is not good for a man to eat much honey, so he that is a searcher of majesty shall be overwhelmed by glory.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>As a city that lieth open and is not compassed with walls, so is a man that cannot refrain his own spirit in speaking.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæ quoque parabolæ Salomonis, quas transtulerunt viri Ezechiæ regis Juda.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Gloria Dei est celare verbum, et gloria regum investigare sermonem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Cælum sursum, et terra deorsum, et cor regum inscrutabile.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Aufer rubiginem de argento, et egredietur vas purissimum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Aufer impietatem de vultu regis, et firmabitur justitia thronus ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ne gloriosus appareas coram rege, et in loco magnorum ne steteris.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Melius est enim ut dicatur tibi : Ascende huc, quam ut humilieris coram principe.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quæ viderunt oculi tui ne proferas in jurgio cito, ne postea emendare non possis, cum dehonestaveris amicum tuum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Causam tuam tracta cum amico tuo, et secretum extraneo ne reveles :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>ne forte insultet tibi cum audierit, et exprobrare non cesset. Gratia et amicitia liberant : quas tibi serva, ne exprobrabilis fias.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Mala aurea in lectis argenteis, qui loquitur verbum in tempore suo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Inauris aurea, et margaritum fulgens, qui arguit sapientem et aurem obedientem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sicut frigus nivis in die messis, ita legatus fidelis ei qui misit eum : animam ipsius requiescere facit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nubes, et ventus, et pluviæ non sequentes, vir gloriosus et promissa non complens.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Patientia lenietur princeps, et lingua mollis confringet duritiam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Mel invenisti : comede quod sufficit tibi, ne forte satiatus evomas illud.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Subtrahe pedem tuum de domo proximi tui, nequando satiatus oderit te.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Jaculum, et gladius, et sagitta acuta, homo qui loquitur contra proximum suum falsum testimonium.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dens putridus, et pes lassus, qui sperat super infideli in die angustiæ,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et amittit pallium in die frigoris. Acetum in nitro, qui cantat carmina cordi pessimo. Sicut tinea vestimento, et vermis ligno, ita tristitia viri nocet cordi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Si esurierit inimicus tuus, ciba illum ; si sitierit, da ei aquam bibere :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>prunas enim congregabis super caput ejus, et Dominus reddet tibi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ventus aquilo dissipat pluvias, et facies tristis linguam detrahentem.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Melius est sedere in angulo domatis quam cum muliere litigiosa et in domo communi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Aqua frigida animæ sitienti, et nuntius bonus de terra longinqua.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Fons turbatus pede et vena corrupta, justus cadens coram impio.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sicut qui mel multum comedit non est ei bonum, sic qui scrutator est majestatis opprimetur a gloria.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Sicut urbs patens et absque murorum ambitu, ita vir qui non potest in loquendo cohibere spiritum suum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/24/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Proverbs 24</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/26/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Proverbs 26</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->25<!-- --> of <!-- -->31<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Proverbs 24" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/PRO/24/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" usfm\":\"PRO\",\"bookName\":\"Proverbs\",\"drName\":\"Proverbs\",\"chapter\":25,\"totalChapters\":31,\"dra\":[{\"verse\":1,\"text\":\"These are also parables of Solomon, which the men of Ezechias, king of Juda, copied out.\"},{\"verse\":2,\"text\":\"It is the glory of God to conceal the word, and the glory of kings to search out the speech.\"},{\"verse\":3,\"text\":\"The heaven above and the earth beneath, and the heart of kings is unsearchable.\"},{\"verse\":4,\"text\":\"Take away the rust from silver, and there shall come forth a most pure vessel:\"},{\"verse\":5,\"text\":\"Take away wickedness from the face of the king, and his throne shall be established with justice.\"},{\"verse\":6,\"text\":\"Appear not glorious before the king, and stand not in the place of great men.\"},{\"verse\":7,\"text\":\"For it is better that it should be said to thee: Come up hither; than that thou shouldst be humbled before the prince.\"},{\"verse\":8,\"text\":\"The things which thy eyes have seen, utter not hastily in a quarrel: lest afterward thou mayst not be able to make amends, when thou hast dishonoured thy friend.\"},{\"verse\":9,\"text\":\"Treat thy cause with thy friend, and discover not the secret to a stranger:\"},{\"verse\":10,\"text\":\"Lest he insult over thee, when he hath heard it, and cease not to upbraid thee. Grace and friendship deliver a man: keep these for thyself, lest thou fall under reproach.\"},{\"verse\":11,\"text\":\"To speak a word in due time, is like apples of gold on beds of silver.\"},{\"verse\":12,\"text\":\"As an earring of gold and a bright pearl, so is he that reproveth the wise, and the obedient ear.\"},{\"verse\":13,\"text\":\"As the cold of snow in the time of harvest, so is a faithful messenger to him that sent him, for he refresheth his soul.\"},{\"verse\":14,\"text\":\"As clouds, and wind, when no rain followeth, so is the man that boasteth, and doth not fulfil his promises.\"},{\"verse\":15,\"text\":\"By patience a prince shall be appeased, and a soft tongue shall break hardness.\"},{\"verse\":16,\"text\":\"Thou hast found honey, eat what is sufficient for thee, lest being glutted therewith thou vomit it up.\"},{\"verse\":17,\"text\":\"Withdraw thy foot from the house of thy neighbour, lest having his fill he hate thee.\"},{\"verse\":18,\"text\":\"A man that beareth false witness against his neighbour, is like a dart and a sword and a sharp arrow.\"},{\"verse\":19,\"text\":\"To trust in an unfaithful man in the time of trouble, is like a rotten tooth, and weary foot,\"},{\"verse\":20,\"text\":\"And one that looseth his garment in cold weather. As vinegar upon nitre, so is he that singeth songs to a very evil heart. As a moth doth by a garment, and a worm by the wood: so the sadness of a man consumeth the heart.\"},{\"verse\":21,\"text\":\"If thy enemy be hungry, give him to eat: if he thirst, give him water to drink:\"},{\"verse\":22,\"text\":\"For thou shalt heap hot coals upon his head, and the Lord will reward thee.\"},{\"verse\":23,\"text\":\"The north wind driveth away rain, as doth a sad countenance a backbiting tongue.\"},{\"verse\":24,\"text\":\"It is better to sit in a corner of the housetop: than with a brawling woman, and in a common house.\"},{\"verse\":25,\"text\":\"As cold water to a thirsty soul, so are good tidings from a far country.\"},{\"verse\":26,\"text\":\"A just man falling down before the wicked, is as a fountain troubled with the foot and a corrupted spring.\"},{\"verse\":27,\"text\":\"As it is not good for a man to eat much honey, so he that is a searcher of majesty shall be overwhelmed by glory.\"},{\"verse\":28,\"text\":\"As a city that lieth open and is not compassed with walls, so is a man that cannot refrain his own spirit in speaking.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæ quoque parabolæ Salomonis, quas transtulerunt viri Ezechiæ regis Juda.\"},{\"verse\":2,\"text\":\"Gloria Dei est celare verbum, et gloria regum investigare sermonem.\"},{\"verse\":3,\"text\":\"Cælum sursum, et terra deorsum, et cor regum inscrutabile.\"},{\"verse\":4,\"text\":\"Aufer rubiginem de argento, et egredietur vas purissimum.\"},{\"verse\":5,\"text\":\"Aufer impietatem de vultu regis, et firmabitur justitia thronus ejus.\"},{\"verse\":6,\"text\":\"Ne gloriosus appareas coram rege, et in loco magnorum ne steteris.\"},{\"verse\":7,\"text\":\"Melius est enim ut dicatur tibi : Ascende huc, quam ut humilieris coram principe.\"},{\"verse\":8,\"text\":\"Quæ viderunt oculi tui ne proferas in jurgio cito, ne postea emendare non possis, cum dehonestaveris amicum tuum.\"},{\"verse\":9,\"text\":\"Causam tuam tracta cum amico tuo, et secretum extraneo ne reveles :\"},{\"verse\":10,\"text\":\"ne forte insultet tibi cum audierit, et exprobrare non cesset. Gratia et amicitia liberant : quas tibi serva, ne exprobrabilis fias.\"},{\"verse\":11,\"text\":\"Mala aurea in lectis argenteis, qui loquitur verbum in tempore suo.\"},{\"verse\":12,\"text\":\"Inauris aurea, et margaritum fulgens, qui arguit sapientem et aurem obedientem.\"},{\"verse\":13,\"text\":\"Sicut frigus nivis in die messis, ita legatus fidelis ei qui misit eum : animam ipsius requiescere facit.\"},{\"verse\":14,\"text\":\"Nubes, et ventus, et pluviæ non sequentes, vir gloriosus et promissa non complens.\"},{\"verse\":15,\"text\":\"Patientia lenietur princeps, et lingua mollis confringet duritiam.\"},{\"verse\":16,\"text\":\"Mel invenisti : comede quod sufficit tibi, ne forte satiatus evomas illud.\"},{\"verse\":17,\"text\":\"Subtrahe pedem tuum de domo proximi tui, nequando satiatus oderit te.\"},{\"verse\":18,\"text\":\"Jaculum, et gladius, et sagitta acuta, homo qui loquitur contra proximum suum falsum testimonium.\"},{\"verse\":19,\"text\":\"Dens putridus, et pes lassus, qui sperat super infideli in die angustiæ,\"},{\"verse\":20,\"text\":\"et amittit pallium in die frigoris. Acetum in nitro, qui cantat carmina cordi pessimo. Sicut tinea vestimento, et vermis ligno, ita tristitia viri nocet cordi.\"},{\"verse\":21,\"text\":\"Si esurierit inimicus tuus, ciba illum ; si sitierit, da ei aquam bibere :\"},{\"verse\":22,\"text\":\"prunas enim congregabis super caput ejus, et Dominus reddet tibi.\"},{\"verse\":23,\"text\":\"Ventus aquilo dissipat pluvias, et facies tristis linguam detrahentem.\"},{\"verse\":24,\"text\":\"Melius est sedere in angulo domatis quam cum muliere litigiosa et in domo communi.\"},{\"verse\":25,\"text\":\"Aqua frigida animæ sitienti, et nuntius bonus de terra longinqua.\"},{\"verse\":26,\"text\":\"Fons turbatus pede et vena corrupta, justus cadens coram impio.\"},{\"verse\":27,\"text\":\"Sicut qui mel multum comedit non est ei bonum, sic qui scrutator est majestatis opprimetur a gloria.\"},{\"verse\":28,\"text\":\"Sicut urbs patens et absque murorum ambitu, ita vir qui non potest in loquendo cohibere spiritum suum.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"PRO\",\"chapter\":24,\"label\":\"Proverbs 24\"},\"next\":{\"usfm\":\"PRO\",\"chapter\":26,\"label\":\"Proverbs 26\"}}]]\n"])</script></body></html>
