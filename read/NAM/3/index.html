.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Nahum<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/NAM/">About <!-- -->Nahum</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The miserable destruction of Ninive.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Woe to thee, O city of blood, all full of lies and violence: rapine shall not depart from thee.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The noise of the whip, and the noise of the rattling of the wheels, and of the neighing horse; and of the running chariot, and of the horsemen coming up,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And of the shining sword, and of the glittering spear, and of a multitude slain, and of a grievous destruction: and there is no end of carcasses, and they shall fall down on their dead bodies.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Because of the multitude of the fornications of the harlot that was beautiful and agreeable, and that made use of witchcraft, that sold nations through her fornications, and families through her witchcrafts.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Behold I come against thee, saith the Lord of hosts: and I will discover thy shame to thy face, and will shew thy nakedness to the nations, and thy shame to kingdoms.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And I will cast abominations upon thee, and will disgrace thee, and will make an example of thee.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And it shall come to pass that every one that shall see thee, shall flee from thee, and shall say: Ninive is laid waste: who shall bemoan thee? whence shall I seek a comforter for thee?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Art thou better than the populous Alexandria, that dwelleth among the rivers? waters are round about it: the sea is its riches: the waters are its walls.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ethiopia and Egypt were the strength thereof, and there is no end: Africa and the Libyans were thy helpers.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Yet she also was removed and carried into captivity: her young children were dashed in pieces at the top of every street, and they cast lots upon her nobles, and all her great men were bound in fetters.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore thou also shalt be made drunk, and shalt be despised: and thou shalt seek help from the enemies.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>All thy strong holds shall be like fig trees with their green figs: if they be shaken, they shall fall into the mouth of the eater.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Behold thy people in the midst of thee are women: the gates of thy land shall be set wide open to thy enemies, the fire shall devour thy bars.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Draw thee water for the siege, build up thy bulwarks: go into the clay, and tread, work it and make brick.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>There shall the fire devour thee: thou shalt perish by the sword, it shall devour thee like the bruchus: assemble together like the bruchus, make thyself many like the locust.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thou hast multiplied thy merchandises above the stars of heaven: the bruchus hath spread himself and flown away.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thy guards are like the locusts: and thy little ones like the locusts of locusts which swarm on the hedges in the day of cold: the sun arose, and they flew away, and their place was not known where they were.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Thy shepherds have slumbered, O king of Assyria, thy princes shall be buried: thy people are hid in the mountains, and there is none to gather them.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thy destruction is not hidden, thy wound is grievous: all that have heard the fame of thee, have clapped their hands over thee: for upon whom hath not thy wickedness passed continually?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Væ civitas sanguinum, universa mendacii dilaceratione plena ! non recedet a te rapina.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vox flagelli, et vox impetus rotæ, et equi frementis, et quadrigæ ferventis, et equitis ascendentis,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et micantis gladii, et fulgurantis hastæ, et multitudinis interfectæ, et gravis ruinæ ; nec est finis cadaverum, et corruent in corporibus suis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Propter multitudinem fornicationum meretricis speciosæ, et gratæ, et habentis maleficia, quæ vendidit gentes in fornicationibus suis, et familias in maleficiis suis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ecce ego ad te, dicit Dominus exercituum, et revelabo pudenda tua in facie tua ; et ostendam gentibus nuditatem tuam, et regnis ignominiam tuam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et projiciam super te abominationes, et contumeliis te afficiam, et ponam te in exemplum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et erit : omnis qui viderit te resiliet a te, et dicet : Vastata est Ninive. Quis commovebit super te caput ? unde quæram consolatorem tibi ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Numquid melior es Alexandria populorum, quæ habitat in fluminibus ? aquæ in circuitu ejus ; cujus divitiæ, mare ; aquæ, muri ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Æthiopia fortitudo ejus, et Ægyptus, et non est finis ; Africa et Libyes fuerunt in auxilio tuo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Sed et ipsa in transmigrationem ducta est in captivitatem : parvuli ejus elisi sunt in capite omnium viarum, et super inclytos ejus miserunt sortem, et omnes optimates ejus confixi sunt in compedibus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et tu ergo inebriaberis, et eris despecta : et tu quæres auxilium ab inimico.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Omnes munitiones tuæ sicut ficus cum grossis suis : si concussæ fuerint, cadent in os comedentis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ecce populus tuus mulieres in medio tui : inimicis tuis adapertione pandentur portæ terræ tuæ, devorabit ignis vectes tuos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Aquam propter obsidionem hauri tibi : exstrue munitiones tuas, intra in lutum, et calca, subigens tene laterem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ibi comedet te ignis, peribis gladio, devorabit te ut bruchus : congregare ut bruchus, multiplicare ut locusta.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Plures fecisti negotiationes tuas quam stellæ sint cæli ; bruchus expansus est, et avolavit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Custodes tui quasi locustæ, et parvuli tui quasi locustæ locustarum, quæ considunt in sepibus in die frigoris : sol ortus est, et avolaverunt, et non est cognitus locus earum ubi fuerint.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dormitaverunt pastores tui, rex Assur, sepelientur principes tui : latitavit populus tuus in montibus, et non est qui congreget.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Non est obscura contritio tua ; pessima est plaga tua. Omnes qui audierunt auditionem tuam compresserunt manum super te : quia super quem non transiit malitia tua semper ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/NAM/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Nahum 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HAB/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Habakkuk 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor ndex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"NAM.3\",{\"bookId\":39,\"usfm\":\"NAM\",\"bookName\":\"Nahum\",\"drName\":\"Nahum\",\"chapter\":3,\"totalChapters\":3,\"dra\":[{\"verse\":1,\"text\":\"Woe to thee, O city of blood, all full of lies and violence: rapine shall not depart from thee.\"},{\"verse\":2,\"text\":\"The noise of the whip, and the noise of the rattling of the wheels, and of the neighing horse; and of the running chariot, and of the horsemen coming up,\"},{\"verse\":3,\"text\":\"And of the shining sword, and of the glittering spear, and of a multitude slain, and of a grievous destruction: and there is no end of carcasses, and they shall fall down on their dead bodies.\"},{\"verse\":4,\"text\":\"Because of the multitude of the fornications of the harlot that was beautiful and agreeable, and that made use of witchcraft, that sold nations through her fornications, and families through her witchcrafts.\"},{\"verse\":5,\"text\":\"Behold I come against thee, saith the Lord of hosts: and I will discover thy shame to thy face, and will shew thy nakedness to the nations, and thy shame to kingdoms.\"},{\"verse\":6,\"text\":\"And I will cast abominations upon thee, and will disgrace thee, and will make an example of thee.\"},{\"verse\":7,\"text\":\"And it shall come to pass that every one that shall see thee, shall flee from thee, and shall say: Ninive is laid waste: who shall bemoan thee? whence shall I seek a comforter for thee?\"},{\"verse\":8,\"text\":\"Art thou better than the populous Alexandria, that dwelleth among the rivers? waters are round about it: the sea is its riches: the waters are its walls.\"},{\"verse\":9,\"text\":\"Ethiopia and Egypt were the strength thereof, and there is no end: Africa and the Libyans were thy helpers.\"},{\"verse\":10,\"text\":\"Yet she also was removed and carried into captivity: her young children were dashed in pieces at the top of every street, and they cast lots upon her nobles, and all her great men were bound in fetters.\"},{\"verse\":11,\"text\":\"Therefore thou also shalt be made drunk, and shalt be despised: and thou shalt seek help from the enemies.\"},{\"verse\":12,\"text\":\"All thy strong holds shall be like fig trees with their green figs: if they be shaken, they shall fall into the mouth of the eater.\"},{\"verse\":13,\"text\":\"Behold thy people in the midst of thee are women: the gates of thy land shall be set wide open to thy enemies, the fire shall devour thy bars.\"},{\"verse\":14,\"text\":\"Draw thee water for the siege, build up thy bulwarks: go into the clay, and tread, work it and make brick.\"},{\"verse\":15,\"text\":\"There shall the fire devour thee: thou shalt perish by the sword, it shall devour thee like the bruchus: assemble together like the bruchus, make thyself many like the locust.\"},{\"verse\":16,\"text\":\"Thou hast multiplied thy merchandises above the stars of heaven: the bruchus hath spread himself and flown away.\"},{\"verse\":17,\"text\":\"Thy guards are like the locusts: and thy little ones like the locusts of locusts which swarm on the hedges in the day of cold: the sun arose, and they flew away, and their place was not known where they were.\"},{\"verse\":18,\"text\":\"Thy shepherds have slumbered, O king of Assyria, thy princes shall be buried: thy people are hid in the mountains, and there is none to gather them.\"},{\"verse\":19,\"text\":\"Thy destruction is not hidden, thy wound is grievous: all that have heard the fame of thee, have clapped their hands over thee: for upon whom hath not thy wickedness passed continually?\"}],\"vul\":[{\"verse\":1,\"text\":\"Væ civitas sanguinum, universa mendacii dilaceratione plena ! non recedet a te rapina.\"},{\"verse\":2,\"text\":\"Vox flagelli, et vox impetus rotæ, et equi frementis, et quadrigæ ferventis, et equitis ascendentis,\"},{\"verse\":3,\"text\":\"et micantis gladii, et fulgurantis hastæ, et multitudinis interfectæ, et gravis ruinæ ; nec est finis cadaverum, et corruent in corporibus suis.\"},{\"verse\":4,\"text\":\"Propter multitudinem fornicationum meretricis speciosæ, et gratæ, et habentis maleficia, quæ vendidit gentes in fornicationibus suis, et familias in maleficiis suis.\"},{\"verse\":5,\"text\":\"Ecce ego ad te, dicit Dominus exercituum, et revelabo pudenda tua in facie tua ; et ostendam gentibus nuditatem tuam, et regnis ignominiam tuam.\"},{\"verse\":6,\"text\":\"Et projiciam super te abominationes, et contumeliis te afficiam, et ponam te in exemplum.\"},{\"verse\":7,\"text\":\"Et erit : omnis qui viderit te resiliet a te, et dicet : Vastata est Ninive. Quis commovebit super te caput ? unde quæram consolatorem tibi ?\"},{\"verse\":8,\"text\":\"Numquid melior es Alexandria populorum, quæ habitat in fluminibus ? aquæ in circuitu ejus ; cujus divitiæ, mare ; aquæ, muri ejus.\"},{\"verse\":9,\"text\":\"Æthiopia fortitudo ejus, et Ægyptus, et non est finis ; Africa et Libyes fuerunt in auxilio tuo.\"},{\"verse\":10,\"text\":\"Sed et ipsa in transmigrationem ducta est in captivitatem : parvuli ejus elisi sunt in capite omnium viarum, et super inclytos ejus miserunt sortem, et omnes optimates ejus confixi sunt in compedibus.\"},{\"verse\":11,\"text\":\"Et tu ergo inebriaberis, et eris despecta : et tu quæres auxilium ab inimico.\"},{\"verse\":12,\"text\":\"Omnes munitiones tuæ sicut ficus cum grossis suis : si concussæ fuerint, cadent in os comedentis.\"},{\"verse\":13,\"text\":\"Ecce populus tuus mulieres in medio tui : inimicis tuis adapertione pandentur portæ terræ tuæ, devorabit ignis vectes tuos.\"},{\"verse\":14,\"text\":\"Aquam propter obsidionem hauri tibi : exstrue munitiones tuas, intra in lutum, et calca, subigens tene laterem.\"},{\"verse\":15,\"text\":\"Ibi comedet te ignis, peribis gladio, devorabit te ut bruchus : congregare ut bruchus, multiplicare ut locusta.\"},{\"verse\":16,\"text\":\"Plures fecisti negotiationes tuas quam stellæ sint cæli ; bruchus expansus est, et avolavit.\"},{\"verse\":17,\"text\":\"Custodes tui quasi locustæ, et parvuli tui quasi locustæ locustarum, quæ considunt in sepibus in die frigoris : sol ortus est, et avolaverunt, et non est cognitus locus earum ubi fuerint.\"},{\"verse\":18,\"text\":\"Dormitaverunt pastores tui, rex Assur, sepelientur principes tui : latitavit populus tuus in montibus, et non est qui congreget.\"},{\"verse\":19,\"text\":\"Non est obscura contritio tua ; pessima est plaga tua. Omnes qui audierunt auditionem tuam compresserunt manum super te : quia super quem non transiit malitia tua semper ?\"}],\"summary\":\"The miserable destruction of Ninive.\",\"intro\":null,\"prev\":{\"usfm\":\"NAM\",\"chapter\":2,\"label\":\"Nahum 2\"},\"next\":{\"usfm\":\"HAB\",\"chapter\":1,\"label\":\"Habakkuk 1\"}}]]\n"])</script></body></html>
