 type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I beseech you therefore, brethren, by the mercy of God, that you present your bodies a living sacrifice, holy, pleasing unto God, your reasonable service.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And be not conformed to this world: but be reformed in the newness of your mind, that you may prove what is the good and the acceptable and the perfect will of God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For I say, by the grace that is given me, to all that are among you, not to be more wise than it behoveth to be wise, but to be wise unto sobriety and according as God hath divided to every one the measure of faith.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For as in one body we have many members, but all the members have not the same office:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>So we, being many, are one body in Christ; and every one members one of another:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And having different gifts, according to the grace that is given us, either prophecy, to be used according to the rule of faith;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Or ministry, in ministering; or he that teacheth, in doctrine;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that exhorteth, in exhorting; he that giveth, with simplicity; he that ruleth, with carefulness; he that sheweth mercy, with cheerfulness.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Let love be without dissimulation. Hating that which is evil, cleaving to that which is good,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Loving one another with the charity of brotherhood: with honour preventing one another.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In carefulness not slothful. In spirit fervent. Serving the Lord.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Rejoicing in hope. Patient in tribulation. Instant in prayer.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Communicating to the necessities of the saints. Pursuing hospitality.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Bless them that persecute you: bless, and curse not.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Rejoice with them that rejoice: weep with them that weep.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Being of one mind one towards another. Not minding high things, but consenting to the humble. Be not wise in your own conceits.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>To no man rendering evil for evil. Providing good things, not only in the sight of God but also in the sight of all men.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>If it be possible, as much as is in you, have peace with all men.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Revenge not yourselves, my dearly beloved; but give place unto wrath, for it is written: Revenge is mine, I will repay, saith the Lord.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But if thy enemy be hungry, give him to eat; if he thirst, give him to drink. For, doing this, thou shalt heap coals of fire upon his head.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Be not overcome by evil: but overcome evil by good.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Obsecro itaque vos fratres per misericordiam Dei, ut exhibeatis corpora vestra hostiam viventem, sanctam, Deo placentem, rationabile obsequium vestrum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et nolite conformari huic sæculo, sed reformamini in novitate sensus vestri : ut probetis quæ sit voluntas Dei bona, et beneplacens, et perfecta.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dico enim per gratiam quæ data est mihi, omnibus qui sunt inter vos, non plus sapere quam oportet sapere, sed sapere ad sobrietatem : et unicuique sicut Deus divisit mensuram fidei.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sicut enim in uno corpore multa membra habemus, omnia autem membra non eumdem actum habent :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ita multi unum corpus sumus in Christo, singuli autem alter alterius membra.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Habentes autem donationes secundum gratiam, quæ data est nobis, differentes : sive prophetiam secundum rationem fidei,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>sive ministerium in ministrando, sive qui docet in doctrina,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>qui exhortatur in exhortando, qui tribuit in simplicitate, qui præest in sollicitudine, qui miseretur in hilaritate.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dilectio sine simulatione : odientes malum, adhærentes bono :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>caritate fraternitatis invicem diligentes : honore invicem prævenientes :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>sollicitudine non pigri : spiritu ferventes : Domino servientes :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>spe gaudentes : in tribulatione patientes : orationi instantes :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>necessitatibus sanctorum communicantes : hospitalitatem sectantes.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Benedicite persequentibus vos : benedicite, et nolite maledicere.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gaudere cum gaudentibus, flere cum flentibus :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>idipsum invicem sentientes : non alta sapientes, sed humilibus consentientes. Nolite esse prudentes apud vosmetipsos :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>nulli malum pro malo reddentes : providentes bona non tantum coram Deo, sed etiam coram omnibus hominibus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si fieri potest, quod ex vobis est, cum omnibus hominibus pacem habentes :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>non vosmetipsos defendentes carissimi, sed date locum iræ. Scriptum est enim : Mihi vindicta : ego retribuam, dicit Dominus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Sed si esurierit inimicus tuus, ciba illum : si sitit, potum da illi : hoc enim faciens, carbones ignis congeres super caput ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Noli vinci a malo, sed vince in bono malum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Romans 11</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/13/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Romans 13</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->12<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Romans 11" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic- \",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ROM.12\",{\"bookId\":52,\"usfm\":\"ROM\",\"bookName\":\"Romans\",\"drName\":\"Romans\",\"chapter\":12,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"I beseech you therefore, brethren, by the mercy of God, that you present your bodies a living sacrifice, holy, pleasing unto God, your reasonable service.\"},{\"verse\":2,\"text\":\"And be not conformed to this world: but be reformed in the newness of your mind, that you may prove what is the good and the acceptable and the perfect will of God.\"},{\"verse\":3,\"text\":\"For I say, by the grace that is given me, to all that are among you, not to be more wise than it behoveth to be wise, but to be wise unto sobriety and according as God hath divided to every one the measure of faith.\"},{\"verse\":4,\"text\":\"For as in one body we have many members, but all the members have not the same office:\"},{\"verse\":5,\"text\":\"So we, being many, are one body in Christ; and every one members one of another:\"},{\"verse\":6,\"text\":\"And having different gifts, according to the grace that is given us, either prophecy, to be used according to the rule of faith;\"},{\"verse\":7,\"text\":\"Or ministry, in ministering; or he that teacheth, in doctrine;\"},{\"verse\":8,\"text\":\"He that exhorteth, in exhorting; he that giveth, with simplicity; he that ruleth, with carefulness; he that sheweth mercy, with cheerfulness.\"},{\"verse\":9,\"text\":\"Let love be without dissimulation. Hating that which is evil, cleaving to that which is good,\"},{\"verse\":10,\"text\":\"Loving one another with the charity of brotherhood: with honour preventing one another.\"},{\"verse\":11,\"text\":\"In carefulness not slothful. In spirit fervent. Serving the Lord.\"},{\"verse\":12,\"text\":\"Rejoicing in hope. Patient in tribulation. Instant in prayer.\"},{\"verse\":13,\"text\":\"Communicating to the necessities of the saints. Pursuing hospitality.\"},{\"verse\":14,\"text\":\"Bless them that persecute you: bless, and curse not.\"},{\"verse\":15,\"text\":\"Rejoice with them that rejoice: weep with them that weep.\"},{\"verse\":16,\"text\":\"Being of one mind one towards another. Not minding high things, but consenting to the humble. Be not wise in your own conceits.\"},{\"verse\":17,\"text\":\"To no man rendering evil for evil. Providing good things, not only in the sight of God but also in the sight of all men.\"},{\"verse\":18,\"text\":\"If it be possible, as much as is in you, have peace with all men.\"},{\"verse\":19,\"text\":\"Revenge not yourselves, my dearly beloved; but give place unto wrath, for it is written: Revenge is mine, I will repay, saith the Lord.\"},{\"verse\":20,\"text\":\"But if thy enemy be hungry, give him to eat; if he thirst, give him to drink. For, doing this, thou shalt heap coals of fire upon his head.\"},{\"verse\":21,\"text\":\"Be not overcome by evil: but overcome evil by good.\"}],\"vul\":[{\"verse\":1,\"text\":\"Obsecro itaque vos fratres per misericordiam Dei, ut exhibeatis corpora vestra hostiam viventem, sanctam, Deo placentem, rationabile obsequium vestrum.\"},{\"verse\":2,\"text\":\"Et nolite conformari huic sæculo, sed reformamini in novitate sensus vestri : ut probetis quæ sit voluntas Dei bona, et beneplacens, et perfecta.\"},{\"verse\":3,\"text\":\"Dico enim per gratiam quæ data est mihi, omnibus qui sunt inter vos, non plus sapere quam oportet sapere, sed sapere ad sobrietatem : et unicuique sicut Deus divisit mensuram fidei.\"},{\"verse\":4,\"text\":\"Sicut enim in uno corpore multa membra habemus, omnia autem membra non eumdem actum habent :\"},{\"verse\":5,\"text\":\"ita multi unum corpus sumus in Christo, singuli autem alter alterius membra.\"},{\"verse\":6,\"text\":\"Habentes autem donationes secundum gratiam, quæ data est nobis, differentes : sive prophetiam secundum rationem fidei,\"},{\"verse\":7,\"text\":\"sive ministerium in ministrando, sive qui docet in doctrina,\"},{\"verse\":8,\"text\":\"qui exhortatur in exhortando, qui tribuit in simplicitate, qui præest in sollicitudine, qui miseretur in hilaritate.\"},{\"verse\":9,\"text\":\"Dilectio sine simulatione : odientes malum, adhærentes bono :\"},{\"verse\":10,\"text\":\"caritate fraternitatis invicem diligentes : honore invicem prævenientes :\"},{\"verse\":11,\"text\":\"sollicitudine non pigri : spiritu ferventes : Domino servientes :\"},{\"verse\":12,\"text\":\"spe gaudentes : in tribulatione patientes : orationi instantes :\"},{\"verse\":13,\"text\":\"necessitatibus sanctorum communicantes : hospitalitatem sectantes.\"},{\"verse\":14,\"text\":\"Benedicite persequentibus vos : benedicite, et nolite maledicere.\"},{\"verse\":15,\"text\":\"Gaudere cum gaudentibus, flere cum flentibus :\"},{\"verse\":16,\"text\":\"idipsum invicem sentientes : non alta sapientes, sed humilibus consentientes. Nolite esse prudentes apud vosmetipsos :\"},{\"verse\":17,\"text\":\"nulli malum pro malo reddentes : providentes bona non tantum coram Deo, sed etiam coram omnibus hominibus.\"},{\"verse\":18,\"text\":\"Si fieri potest, quod ex vobis est, cum omnibus hominibus pacem habentes :\"},{\"verse\":19,\"text\":\"non vosmetipsos defendentes carissimi, sed date locum iræ. Scriptum est enim : Mihi vindicta : ego retribuam, dicit Dominus.\"},{\"verse\":20,\"text\":\"Sed si esurierit inimicus tuus, ciba illum : si sitit, potum da illi : hoc enim faciens, carbones ignis congeres super caput ejus.\"},{\"verse\":21,\"text\":\"Noli vinci a malo, sed vince in bono malum.\"}],\"summary\":\"Lessons of Christian virtues.\",\"intro\":null,\"prev\":{\"usfm\":\"ROM\",\"chapter\":11,\"label\":\"Romans 11\"},\"next\":{\"usfm\":\"ROM\",\"chapter\":13,\"label\":\"Romans 13\"}}]]\n"])</script></body></html>
