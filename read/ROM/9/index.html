1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Romans<!-- --> <span class="text-stone-500">9</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ROM/">About <!-- -->Romans</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The apostle’s concern for the Jews. God’s election is free and not confined to their nation.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I speak the truth in Christ: I lie not, my conscience bearing me witness in the Holy Ghost:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>That I have great sadness and continual sorrow in my heart.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For I wished myself to be an anathema from Christ, for my brethren: who are my kinsmen according to the flesh:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who are Israelites: to whom belongeth the adoption as of children and the glory and the testament and the giving of the law and the service of God and the promises:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Whose are the fathers and of whom is Christ, according to the flesh, who is over all things, God blessed for ever. Amen.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Not as though the word of God hath miscarried. For all are not Israelites that are of Israel.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Neither are all they that are the seed of Abraham, children: but in Isaac shall thy seed be called.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>That is to say, not they that are the children of the flesh are the children of God: but they that are the children of the promise are accounted for the seed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For this is the word of promise: According to this time will I come. And Sara shall have a son.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And not only she. But when Rebecca also had conceived at once of Isaac our father.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For when the children were not yet born, nor had done any good or evil (that the purpose of God according to election might stand):</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Not of works, but of him that calleth, it was said to her: The elder shall serve the younger.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>As it is written: Jacob I have loved: but Esau I have hated.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>What shall we say then? Is there injustice with God? God forbid!</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For he saith to Moses: I will have mercy on whom I will have mercy. And I will shew mercy to whom I will shew mercy.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So then it is not of him that willeth, nor of him that runneth, but of God that sheweth mercy.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the scripture saith to Pharao: To this purpose have I raised thee, that I may shew my power in thee and that my name may be declared throughout all the earth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Therefore he hath mercy on whom he will. And whom he will, he hardeneth.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Thou wilt say therefore to me: Why doth he then find fault? For who resisteth his will?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>O man, who art thou that repliest against God? Shall the thing formed say to him that formed it: Why hast thou made me thus?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Or hath not the potter power over the clay, of the same lump, to make one vessel unto honour and another unto dishonour?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>What if God, willing to shew his wrath and to make his power known, endured with much patience vessels of wrath, fitted for destruction,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>That he might shew the riches of his glory on the vessels of mercy which he hath prepared unto glory?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Even us, whom also he hath called, not only of the Jews but also of the Gentiles.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>As in Osee he saith: I will call that which was not my people, my people; and her that was not beloved, beloved; and her that had not obtained mercy; one that hath obtained mercy.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And it shalt be in the place where it was said unto them: you are not my people; there they shall be called the sons of the living God.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And Isaias cried out concerning Israel: If the number of the children of Israel be as the sand of the sea, a remnant shall be saved.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For he shall finish his word and cut it short in justice: because a short word shall the Lord make upon the earth.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And as Isaias foretold: Unless the Lord of Sabbaoth had left us a seed, we had been made as Sodom and we had been like unto Gomorrha.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>What then shall we say? That the Gentiles who followed not after justice have attained to justice, even the justice that is of faith.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But Israel, by following after the law of justice, is not come unto the law of justice.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Why so? Because they sought it not by faith, but as it were of works. For they stumbled at the stumblingstone.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>As it is written: Behold I lay in Sion a stumbling-stone and a rock of scandal. And whosoever believeth in him shall not be confounded.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Veritatem dico in Christo, non mentior : testimonium mihi perhibente conscientia mea in Spiritu Sancto :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>quoniam tristitia mihi magna est, et continuus dolor cordi meo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Optabam enim ego ipse anathema esse a Christo pro fratribus meis, qui sunt cognati mei secundum carnem,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>qui sunt Israëlitæ, quorum adoptio est filiorum, et gloria, et testamentum, et legislatio, et obsequium, et promissa :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quorum patres, et ex quibus est Christus secundum carnem, qui est super omnia Deus benedictus in sæcula. Amen.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Non autem quod exciderit verbum Dei. Non enim omnes qui ex Israël sunt, ii sunt Israëlitæ :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>neque qui semen sunt Abrahæ, omnes filii : sed in Isaac vocabitur tibi semen :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>id est, non qui filii carnis, hi filii Dei : sed qui filii sunt promissionis, æstimantur in semine.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Promissionis enim verbum hoc est : Secundum hoc tempus veniam : et erit Saræ filius.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non solum autem illa : sed et Rebecca ex uno concubitu habens, Isaac patris nostri.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cum enim nondum nati fuissent, aut aliquid boni egissent, aut mali (ut secundum electionem propositum Dei maneret),</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>non ex operibus, sed ex vocante dictum est ei quia major serviet minori,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>sicut scriptum est : Jacob dilexi, Esau autem odio habui.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quid ergo dicemus ? numquid iniquitas apud Deum ? Absit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Moysi enim dicit : Miserebor cujus misereor : et misericordiam præstabo cujus miserebor.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Igitur non volentis, neque currentis, sed miserentis est Dei.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dicit enim Scriptura Pharaoni : Quia in hoc ipsum excitavi te, ut ostendam in te virtutem meam : et ut annuntietur nomen meum in universa terra.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ergo cujus vult miseretur, et quem vult indurat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dicis itaque mihi : Quid adhuc queritur ? voluntati enim ejus quis resistit ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>O homo, tu quis es, qui respondeas Deo ? numquid dicit figmentum ei qui se finxit : Quid me fecisti sic ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>an non habet potestatem figulus luti ex eadem massa facere aliud quidem vas in honorem, aliud vero in contumeliam ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod si Deus volens ostendere iram, et notum facere potentiam suam, sustinuit in multa patientia vasa iræ, apta in interitum,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>ut ostenderet divitias gloriæ suæ in vasa misericordiæ, quæ præparavit in gloriam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quos et vocavit nos non solum ex Judæis, sed etiam in gentibus,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>sicut in Osee dicit : Vocabo non plebem meam, plebem meam : et non dilectam, dilectam : et non misericordiam consecutam, misericordiam consecutam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et erit : in loco, ubi dictum est eis : Non plebs mea vos : ibi vocabuntur filii Dei vivi.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Isaias autem clamat pro Israël : Si fuerit numerus filiorum Israël tamquam arena maris, reliquiæ salvæ fient.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Verbum enim consummans, et abbrevians in æquitate : quia verbum breviatum faciet Dominus super terram :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et sicut prædixit Isaias : Nisi Dominus Sabaoth reliquisset nobis semen, sicut Sodoma facti essemus, et sicut Gomorrha similes fuissemus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quid ergo dicemus ? Quod gentes, quæ non sectabantur justitiam, apprehenderunt justitiam : justitiam autem, quæ ex fide est.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Israël vero sectando legem justitiæ, in legem justitiæ non pervenit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Quare ? Quia non ex fide, sed quasi ex operibus : offenderunt enim in lapidem offensionis,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>sicut scriptum est : Ecce pono in Sion lapidem offensionis, et petram scandali : et omnis qui credit in eum, non confundetur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/8/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Romans 8</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/ca "text\":\"Whose are the fathers and of whom is Christ, according to the flesh, who is over all things, God blessed for ever. Amen.\"},{\"verse\":6,\"text\":\"Not as though the word of God hath miscarried. For all are not Israelites that are of Israel.\"},{\"verse\":7,\"text\":\"Neither are all they that are the seed of Abraham, children: but in Isaac shall thy seed be called.\"},{\"verse\":8,\"text\":\"That is to say, not they that are the children of the flesh are the children of God: but they that are the children of the promise are accounted for the seed.\"},{\"verse\":9,\"text\":\"For this is the word of promise: According to this time will I come. And Sara shall have a son.\"},{\"verse\":10,\"text\":\"And not only she. But when Rebecca also had conceived at once of Isaac our father.\"},{\"verse\":11,\"text\":\"For when the children were not yet born, nor had done any good or evil (that the purpose of God according to election might stand):\"},{\"verse\":12,\"text\":\"Not of works, but of him that calleth, it was said to her: The elder shall serve the younger.\"},{\"verse\":13,\"text\":\"As it is written: Jacob I have loved: but Esau I have hated.\"},{\"verse\":14,\"text\":\"What shall we say then? Is there injustice with God? God forbid!\"},{\"verse\":15,\"text\":\"For he saith to Moses: I will have mercy on whom I will have mercy. And I will shew mercy to whom I will shew mercy.\"},{\"verse\":16,\"text\":\"So then it is not of him that willeth, nor of him that runneth, but of God that sheweth mercy.\"},{\"verse\":17,\"text\":\"For the scripture saith to Pharao: To this purpose have I raised thee, that I may shew my power in thee and that my name may be declared throughout all the earth.\"},{\"verse\":18,\"text\":\"Therefore he hath mercy on whom he will. And whom he will, he hardeneth.\"},{\"verse\":19,\"text\":\"Thou wilt say therefore to me: Why doth he then find fault? For who resisteth his will?\"},{\"verse\":20,\"text\":\"O man, who art thou that repliest against God? Shall the thing formed say to him that formed it: Why hast thou made me thus?\"},{\"verse\":21,\"text\":\"Or hath not the potter power over the clay, of the same lump, to make one vessel unto honour and another unto dishonour?\"},{\"verse\":22,\"text\":\"What if God, willing to shew his wrath and to make his power known, endured with much patience vessels of wrath, fitted for destruction,\"},{\"verse\":23,\"text\":\"That he might shew the riches of his glory on the vessels of mercy which he hath prepared unto glory?\"},{\"verse\":24,\"text\":\"Even us, whom also he hath called, not only of the Jews but also of the Gentiles.\"},{\"verse\":25,\"text\":\"As in Osee he saith: I will call that which was not my people, my people; and her that was not beloved, beloved; and her that had not obtained mercy; one that hath obtained mercy.\"},{\"verse\":26,\"text\":\"And it shalt be in the place where it was said unto them: you are not my people; there they shall be called the sons of the living God.\"},{\"verse\":27,\"text\":\"And Isaias cried out concerning Israel: If the number of the children of Israel be as the sand of the sea, a remnant shall be saved.\"},{\"verse\":28,\"text\":\"For he shall finish his word and cut it short in justice: because a short word shall the Lord make upon the earth.\"},{\"verse\":29,\"text\":\"And as Isaias foretold: Unless the Lord of Sabbaoth had left us a seed, we had been made as Sodom and we had been like unto Gomorrha.\"},{\"verse\":30,\"text\":\"What then shall we say? That the Gentiles who followed not after justice have attained to justice, even the justice that is of faith.\"},{\"verse\":31,\"text\":\"But Israel, by following after the law of justice, is not come unto the law of justice.\"},{\"verse\":32,\"text\":\"Why so? Because they sought it not by faith, but as it were of works. For they stumbled at the stumblingstone.\"},{\"verse\":33,\"text\":\"As it is written: Behold I lay in Sion a stumbling-stone and a rock of scandal. And whosoever believeth in him shall not be confounded.\"}],\"vul\":[{\"verse\":1,\"text\":\"Veritatem dico in Christo, non mentior : testimonium mihi perhibente conscientia mea in Spiritu Sancto :\"},{\"verse\":2,\"text\":\"quoniam tristitia mihi magna est, et continuus dolor cordi meo.\"},{\"verse\":3,\"text\":\"Optabam enim ego ipse anathema esse a Christo pro fratribus meis, qui sunt cognati mei secundum carnem,\"},{\"verse\":4,\"text\":\"qui sunt Israëlitæ, quorum adoptio est filiorum, et gloria, et testamentum, et legislatio, et obsequium, et promissa :\"},{\"verse\":5,\"text\":\"quorum patres, et ex quibus est Christus secundum carnem, qui est super omnia Deus benedictus in sæcula. Amen.\"},{\"verse\":6,\"text\":\"Non autem quod exciderit verbum Dei. Non enim omnes qui ex Israël sunt, ii sunt Israëlitæ :\"},{\"verse\":7,\"text\":\"neque qui semen sunt Abrahæ, omnes filii : sed in Isaac vocabitur tibi semen :\"},{\"verse\":8,\"text\":\"id est, non qui filii carnis, hi filii Dei : sed qui filii sunt promissionis, æstimantur in semine.\"},{\"verse\":9,\"text\":\"Promissionis enim verbum hoc est : Secundum hoc tempus veniam : et erit Saræ filius.\"},{\"verse\":10,\"text\":\"Non solum autem illa : sed et Rebecca ex uno concubitu habens, Isaac patris nostri.\"},{\"verse\":11,\"text\":\"Cum enim nondum nati fuissent, aut aliquid boni egissent, aut mali (ut secundum electionem propositum Dei maneret),\"},{\"verse\":12,\"text\":\"non ex operibus, sed ex vocante dictum est ei quia major serviet minori,\"},{\"verse\":13,\"text\":\"sicut scriptum est : Jacob dilexi, Esau autem odio habui.\"},{\"verse\":14,\"text\":\"Quid ergo dicemus ? numquid iniquitas apud Deum ? Absit.\"},{\"verse\":15,\"text\":\"Moysi enim dicit : Miserebor cujus misereor : et misericordiam præstabo cujus miserebor.\"},{\"verse\":16,\"text\":\"Igitur non volentis, neque currentis, sed miserentis est Dei.\"},{\"verse\":17,\"text\":\"Dicit enim Scriptura Pharaoni : Quia in hoc ipsum excitavi te, ut ostendam in te virtutem meam : et ut annuntietur nomen meum in universa terra.\"},{\"verse\":18,\"text\":\"Ergo cujus vult miseretur, et quem vult indurat.\"},{\"verse\":19,\"text\":\"Dicis itaque mihi : Quid adhuc queritur ? voluntati enim ejus quis resistit ?\"},{\"verse\":20,\"text\":\"O homo, tu quis es, qui respondeas Deo ? numquid dicit figmentum ei qui se finxit : Quid me fecisti sic ?\"},{\"verse\":21,\"text\":\"an non habet potestatem figulus luti ex eadem massa facere aliud quidem vas in honorem, aliud vero in contumeliam ?\"},{\"verse\":22,\"text\":\"Quod si Deus volens ostendere iram, et notum facere potentiam suam, sustinuit in multa patientia vasa iræ, apta in interitum,\"},{\"verse\":23,\"text\":\"ut ostenderet divitias gloriæ suæ in vasa misericordiæ, quæ præparavit in gloriam.\"},{\"verse\":24,\"text\":\"Quos et vocavit nos non solum ex Judæis, sed etiam in gentibus,\"},{\"verse\":25,\"text\":\"sicut in Osee dicit : Vocabo non plebem meam, plebem meam : et non dilectam, dilectam : et non misericordiam consecutam, misericordiam consecutam.\"},{\"verse\":26,\"text\":\"Et erit : in loco, ubi dictum est eis : Non plebs mea vos : ibi vocabuntur filii Dei vivi.\"},{\"verse\":27,\"text\":\"Isaias autem clamat pro Israël : Si fuerit numerus filiorum Israël tamquam arena maris, reliquiæ salvæ fient.\"},{\"verse\":28,\"text\":\"Verbum enim consummans, et abbrevians in æquitate : quia verbum breviatum faciet Dominus super terram :\"},{\"verse\":29,\"text\":\"et sicut prædixit Isaias : Nisi Dominus Sabaoth reliquisset nobis semen, sicut Sodoma facti essemus, et sicut Gomorrha similes fuissemus.\"},{\"verse\":30,\"text\":\"Quid ergo dicemus ? Quod gentes, quæ non sectabantur justitiam, apprehenderunt justitiam : justitiam autem, quæ ex fide est.\"},{\"verse\":31,\"text\":\"Israël vero sectando legem justitiæ, in legem justitiæ non pervenit.\"},{\"verse\":32,\"text\":\"Quare ? Quia non ex fide, sed quasi ex operibus : offenderunt enim in lapidem offensionis,\"},{\"verse\":33,\"text\":\"sicut scriptum est : Ecce pono in Sion lapidem offensionis, et petram scandali : et omnis qui credit in eum, non confundetur.\"}],\"summary\":\"The apostle’s concern for the Jews. God’s election is free and not confined to their nation.\",\"intro\":null,\"prev\":{\"usfm\":\"ROM\",\"chapter\":8,\"label\":\"Romans 8\"},\"next\":{\"usfm\":\"ROM\",\"chapter\":10,\"label\":\"Romans 10\"}}]]\n"])</script></body></html>
