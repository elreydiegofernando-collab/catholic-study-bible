font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now him that is weak in faith, take unto you: not in disputes about thoughts.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For one believeth that he may eat all things: but he that is weak, let him eat herbs.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let not him that eateth despise him that eateth not: and he that eateth not, let him not judge him that eateth. For God hath taken him to him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Who art thou that judgest another man’s servant? To his own lord he standeth or falleth. And he shall stand: for God is able to make him stand.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For one judgeth between day and day: and another judgeth every day. Let every man abound in his own sense.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He that regardeth the day regardeth it unto the Lord. And he that eateth eateth to the Lord: for he giveth thanks to God. And he that eateth not, to the Lord he eateth not and giveth thanks to God.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For none of us liveth to himself: and no man dieth to himself.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For whether we live, we live unto the Lord: or whether we die, we die unto the Lord. Therefore, whether we live or whether we die, we are the Lord’s.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For to this end Christ died and rose again: that he might be Lord both of the dead and of the living.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But thou, why judgest thou thy brother? Or thou, why dost thou despise thy brother? For we shall all stand before the judgment seat of Christ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For it is written: As I live, saith the Lord, every knee shall bow to me and every tongue shall confess to God.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Therefore every one of us shall render account to God for himself.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let us not therefore judge one another any more. But judge this rather, that you put not a stumblingblock or a scandal in your brother’s way.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I know, and am confident in the Lord Jesus, that nothing is unclean of itself: but to him that esteemeth any thing to be unclean, to him it is unclean.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For if, because of thy meat, thy brother be grieved, thou walkest not now according to charity. Destroy not him with thy meat, for whom Christ died.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Let not then our good be evil spoken of.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the kingdom of God is not meat and drink: but justice and peace and joy in the Holy Ghost.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For he that in this serveth Christ pleaseth God and is approved of men.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Therefore, let us follow after the things that are of peace and keep the things that are of edification, one towards another.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Destroy not the work of God for meat. All things indeed are clean: but it is evil for that man who eateth with offence.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>It is good not to eat flesh and not to drink wine: nor any thing whereby thy brother is offended or scandalized or made weak.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hast thou faith? Have it to thyself before God. Blessed is he that condemneth not himself in that which he alloweth.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But he that discerneth, if he eat, is condemned; because not of faith. For all that is not of faith is sin.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Infirmum autem in fide assumite, non in disceptationibus cogitationum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Alius enim credit se manducare omnia : qui autem infirmus est, olus manducet.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Is qui manducat, non manducantem non spernat : et qui non manducat, manducantem non judicet : Deus enim illum assumpsit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Tu quis es, qui judicas alienum servum ? domino suo stat, aut cadit : stabit autem : potens est enim Deus statuere illum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Nam alius judicat diem inter diem : alius autem judicat omnem diem : unusquisque in suo sensu abundet.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Qui sapit diem, Domino sapit, et qui manducat, Domino manducat : gratias enim agit Deo. Et qui non manducat, Domino non manducat, et gratias agit Deo.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nemo enim nostrum sibi vivit, et nemo sibi moritur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sive enim vivemus, Domino vivimus : sive morimur, Domino morimur. Sive ergo vivimus, sive morimur, Domini sumus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>In hoc enim Christus mortuus est, et resurrexit : ut et mortuorum et vivorum dominetur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Tu autem quid judicas fratrem tuum ? aut tu quare spernis fratrem tuum ? omnes enim stabimus ante tribunal Christi.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Scriptum est enim : Vivo ego, dicit Dominus, quoniam mihi flectetur omne genu : et omnis lingua confitebitur Deo.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Itaque unusquisque nostrum pro se rationem reddet Deo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non ergo amplius invicem judicemus : sed hoc judicate magis, ne ponatis offendiculum fratri, vel scandalum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Scio, et confido in Domino Jesu, quia nihil commune per ipsum, nisi ei qui existimat quid commune esset, illi commune est.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si enim propter cibum frater tuus contristatur, jam non secundum caritatem ambulas. Noli cibo tuo illum perdere, pro quo Christus mortuus est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Non ergo blasphemetur bonum nostrum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non est enim regnum Dei esca et potus : sed justitia, et pax, et gaudium in Spiritu Sancto :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>qui enim in hoc servit Christo, placet Deo, et probatus est hominibus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Itaque quæ pacis sunt, sectemur : et quæ ædificationis sunt, in invicem custodiamus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Noli propter escam destruere opus Dei, omnia quidem sunt munda : sed malum est homini, qui per offendiculum manducat.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Bonum est non manducare carnem, et non bibere vinum, neque in quo frater tuus offenditur, aut scandalizatur, aut infirmatur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tu fidem habes ? penes temetipsum habe coram Deo. Beatus qui non judicat semetipsum in eo quod probat.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Qui autem discernit, si manducaverit, damnatus est : quia non ex fide. Omne autem, quod non est ex fide, peccatum est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">R ateth. For God hath taken him to him.\"},{\"verse\":4,\"text\":\"Who art thou that judgest another man’s servant? To his own lord he standeth or falleth. And he shall stand: for God is able to make him stand.\"},{\"verse\":5,\"text\":\"For one judgeth between day and day: and another judgeth every day. Let every man abound in his own sense.\"},{\"verse\":6,\"text\":\"He that regardeth the day regardeth it unto the Lord. And he that eateth eateth to the Lord: for he giveth thanks to God. And he that eateth not, to the Lord he eateth not and giveth thanks to God.\"},{\"verse\":7,\"text\":\"For none of us liveth to himself: and no man dieth to himself.\"},{\"verse\":8,\"text\":\"For whether we live, we live unto the Lord: or whether we die, we die unto the Lord. Therefore, whether we live or whether we die, we are the Lord’s.\"},{\"verse\":9,\"text\":\"For to this end Christ died and rose again: that he might be Lord both of the dead and of the living.\"},{\"verse\":10,\"text\":\"But thou, why judgest thou thy brother? Or thou, why dost thou despise thy brother? For we shall all stand before the judgment seat of Christ.\"},{\"verse\":11,\"text\":\"For it is written: As I live, saith the Lord, every knee shall bow to me and every tongue shall confess to God.\"},{\"verse\":12,\"text\":\"Therefore every one of us shall render account to God for himself.\"},{\"verse\":13,\"text\":\"Let us not therefore judge one another any more. But judge this rather, that you put not a stumblingblock or a scandal in your brother’s way.\"},{\"verse\":14,\"text\":\"I know, and am confident in the Lord Jesus, that nothing is unclean of itself: but to him that esteemeth any thing to be unclean, to him it is unclean.\"},{\"verse\":15,\"text\":\"For if, because of thy meat, thy brother be grieved, thou walkest not now according to charity. Destroy not him with thy meat, for whom Christ died.\"},{\"verse\":16,\"text\":\"Let not then our good be evil spoken of.\"},{\"verse\":17,\"text\":\"For the kingdom of God is not meat and drink: but justice and peace and joy in the Holy Ghost.\"},{\"verse\":18,\"text\":\"For he that in this serveth Christ pleaseth God and is approved of men.\"},{\"verse\":19,\"text\":\"Therefore, let us follow after the things that are of peace and keep the things that are of edification, one towards another.\"},{\"verse\":20,\"text\":\"Destroy not the work of God for meat. All things indeed are clean: but it is evil for that man who eateth with offence.\"},{\"verse\":21,\"text\":\"It is good not to eat flesh and not to drink wine: nor any thing whereby thy brother is offended or scandalized or made weak.\"},{\"verse\":22,\"text\":\"Hast thou faith? Have it to thyself before God. Blessed is he that condemneth not himself in that which he alloweth.\"},{\"verse\":23,\"text\":\"But he that discerneth, if he eat, is condemned; because not of faith. For all that is not of faith is sin.\"}],\"vul\":[{\"verse\":1,\"text\":\"Infirmum autem in fide assumite, non in disceptationibus cogitationum.\"},{\"verse\":2,\"text\":\"Alius enim credit se manducare omnia : qui autem infirmus est, olus manducet.\"},{\"verse\":3,\"text\":\"Is qui manducat, non manducantem non spernat : et qui non manducat, manducantem non judicet : Deus enim illum assumpsit.\"},{\"verse\":4,\"text\":\"Tu quis es, qui judicas alienum servum ? domino suo stat, aut cadit : stabit autem : potens est enim Deus statuere illum.\"},{\"verse\":5,\"text\":\"Nam alius judicat diem inter diem : alius autem judicat omnem diem : unusquisque in suo sensu abundet.\"},{\"verse\":6,\"text\":\"Qui sapit diem, Domino sapit, et qui manducat, Domino manducat : gratias enim agit Deo. Et qui non manducat, Domino non manducat, et gratias agit Deo.\"},{\"verse\":7,\"text\":\"Nemo enim nostrum sibi vivit, et nemo sibi moritur.\"},{\"verse\":8,\"text\":\"Sive enim vivemus, Domino vivimus : sive morimur, Domino morimur. Sive ergo vivimus, sive morimur, Domini sumus.\"},{\"verse\":9,\"text\":\"In hoc enim Christus mortuus est, et resurrexit : ut et mortuorum et vivorum dominetur.\"},{\"verse\":10,\"text\":\"Tu autem quid judicas fratrem tuum ? aut tu quare spernis fratrem tuum ? omnes enim stabimus ante tribunal Christi.\"},{\"verse\":11,\"text\":\"Scriptum est enim : Vivo ego, dicit Dominus, quoniam mihi flectetur omne genu : et omnis lingua confitebitur Deo.\"},{\"verse\":12,\"text\":\"Itaque unusquisque nostrum pro se rationem reddet Deo.\"},{\"verse\":13,\"text\":\"Non ergo amplius invicem judicemus : sed hoc judicate magis, ne ponatis offendiculum fratri, vel scandalum.\"},{\"verse\":14,\"text\":\"Scio, et confido in Domino Jesu, quia nihil commune per ipsum, nisi ei qui existimat quid commune esset, illi commune est.\"},{\"verse\":15,\"text\":\"Si enim propter cibum frater tuus contristatur, jam non secundum caritatem ambulas. Noli cibo tuo illum perdere, pro quo Christus mortuus est.\"},{\"verse\":16,\"text\":\"Non ergo blasphemetur bonum nostrum.\"},{\"verse\":17,\"text\":\"Non est enim regnum Dei esca et potus : sed justitia, et pax, et gaudium in Spiritu Sancto :\"},{\"verse\":18,\"text\":\"qui enim in hoc servit Christo, placet Deo, et probatus est hominibus.\"},{\"verse\":19,\"text\":\"Itaque quæ pacis sunt, sectemur : et quæ ædificationis sunt, in invicem custodiamus.\"},{\"verse\":20,\"text\":\"Noli propter escam destruere opus Dei, omnia quidem sunt munda : sed malum est homini, qui per offendiculum manducat.\"},{\"verse\":21,\"text\":\"Bonum est non manducare carnem, et non bibere vinum, neque in quo frater tuus offenditur, aut scandalizatur, aut infirmatur.\"},{\"verse\":22,\"text\":\"Tu fidem habes ? penes temetipsum habe coram Deo. Beatus qui non judicat semetipsum in eo quod probat.\"},{\"verse\":23,\"text\":\"Qui autem discernit, si manducaverit, damnatus est : quia non ex fide. Omne autem, quod non est ex fide, peccatum est.\"}],\"summary\":\"The strong must bear with the weak. Cautions against judging and giving scandal.\",\"intro\":null,\"prev\":{\"usfm\":\"ROM\",\"chapter\":13,\"label\":\"Romans 13\"},\"next\":{\"usfm\":\"ROM\",\"chapter\":15,\"label\":\"Romans 15\"}}]]\n"])</script></body></html>
