[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Romans<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ROM/">About <!-- -->Romans</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Lessons of obedience to superiors and mutual charity.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Let every soul be subject to higher powers. For there is no power but from God: and those that are, are ordained of God.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Therefore, he that resisteth the power resisteth the ordinance of God. And they that resist purchase to themselves damnation.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For princes are not a terror to the good work, but to the evil. Wilt thou then not be afraid of the power? Do that which is good: and thou shalt have praise from the same.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For he is God’s minister to thee, for good. But if thou do that which is evil, fear: for he beareth not the sword in vain. For he is God’s minister: an avenger to execute wrath upon him that doth evil.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Wherefore be subject of necessity: not only for wrath, but also for conscience’ sake.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For therefore also you pay tribute. For they are the ministers of God, serving unto this purpose.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Render therefore to all men their dues. Tribute, to whom tribute is due: custom, to whom custom: fear, to whom fear: honour, to whom honour.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Owe no man any thing, but to love one another. For he that loveth his neighbour hath fulfilled the law.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For: Thou shalt not commit adultery: Thou shalt not kill: Thou shalt not steal: Thou shalt not bear false witness: Thou shalt not covet. And if there be any other commandment, it is comprised in this word: Thou shalt love thy neighbour as thyself.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The love of our neighbour worketh no evil. Love therefore is the fulfilling of the law.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And that, knowing the season, that it is now the hour for us to rise from sleep. For now our salvation is nearer than when we believed.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The night is passed And the day is at hand. Let us, therefore cast off the works of darkness and put on the armour of light.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let us walk honestly, as in the day: not in rioting and drunkenness, not in chambering and impurities, not in contention and envy.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But put ye on the Lord Jesus Christ: and make not provision for the flesh in its concupiscences.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Omnis anima potestatibus sublimioribus subdita sit : non est enim potestas nisi a Deo : quæ autem sunt, a Deo ordinatæ sunt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Itaque qui resistit potestati, Dei ordinationi resistit. Qui autem resistunt, ipsi sibi damnationem acquirunt :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>nam principes non sunt timori boni operis, sed mali. Vis autem non timere potestatem ? Bonum fac : et habebis laudem ex illa :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dei enim minister est tibi in bonum. Si autem malum feceris, time : non enim sine causa gladium portat. Dei enim minister est : vindex in iram ei qui malum agit.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ideo necessitate subditi estote non solum propter iram, sed etiam propter conscientiam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ideo enim et tributa præstatis : ministri enim Dei sunt, in hoc ipsum servientes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Reddite ergo omnibus debita : cui tributum, tributum : cui vectigal, vectigal : cui timorem, timorem : cui honorem, honorem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Nemini quidquam debeatis, nisi ut invicem diligatis : qui enim diligit proximum, legem implevit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nam : Non adulterabis : non occides : non furaberis : non falsum testimonium dices : non concupisces : et si quod est aliud mandatum, in hoc verbo instauratur : diliges proximum tuum sicut teipsum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dilectio proximi malum non operatur. Plenitudo ergo legis est dilectio.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et hoc scientes tempus : quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Nox præcessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sicut in die honeste ambulemus : non in comessationibus, et ebrietatibus, non in cubilibus, et impudicitiis, non in contentione, et æmulatione :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>sed induimini Dominum Jesum Christum, et carnis curam ne feceritis in desideriis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Romans 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Romans 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->16<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Romans 12" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:b ",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"ROM.13\",{\"bookId\":52,\"usfm\":\"ROM\",\"bookName\":\"Romans\",\"drName\":\"Romans\",\"chapter\":13,\"totalChapters\":16,\"dra\":[{\"verse\":1,\"text\":\"Let every soul be subject to higher powers. For there is no power but from God: and those that are, are ordained of God.\"},{\"verse\":2,\"text\":\"Therefore, he that resisteth the power resisteth the ordinance of God. And they that resist purchase to themselves damnation.\"},{\"verse\":3,\"text\":\"For princes are not a terror to the good work, but to the evil. Wilt thou then not be afraid of the power? Do that which is good: and thou shalt have praise from the same.\"},{\"verse\":4,\"text\":\"For he is God’s minister to thee, for good. But if thou do that which is evil, fear: for he beareth not the sword in vain. For he is God’s minister: an avenger to execute wrath upon him that doth evil.\"},{\"verse\":5,\"text\":\"Wherefore be subject of necessity: not only for wrath, but also for conscience’ sake.\"},{\"verse\":6,\"text\":\"For therefore also you pay tribute. For they are the ministers of God, serving unto this purpose.\"},{\"verse\":7,\"text\":\"Render therefore to all men their dues. Tribute, to whom tribute is due: custom, to whom custom: fear, to whom fear: honour, to whom honour.\"},{\"verse\":8,\"text\":\"Owe no man any thing, but to love one another. For he that loveth his neighbour hath fulfilled the law.\"},{\"verse\":9,\"text\":\"For: Thou shalt not commit adultery: Thou shalt not kill: Thou shalt not steal: Thou shalt not bear false witness: Thou shalt not covet. And if there be any other commandment, it is comprised in this word: Thou shalt love thy neighbour as thyself.\"},{\"verse\":10,\"text\":\"The love of our neighbour worketh no evil. Love therefore is the fulfilling of the law.\"},{\"verse\":11,\"text\":\"And that, knowing the season, that it is now the hour for us to rise from sleep. For now our salvation is nearer than when we believed.\"},{\"verse\":12,\"text\":\"The night is passed And the day is at hand. Let us, therefore cast off the works of darkness and put on the armour of light.\"},{\"verse\":13,\"text\":\"Let us walk honestly, as in the day: not in rioting and drunkenness, not in chambering and impurities, not in contention and envy.\"},{\"verse\":14,\"text\":\"But put ye on the Lord Jesus Christ: and make not provision for the flesh in its concupiscences.\"}],\"vul\":[{\"verse\":1,\"text\":\"Omnis anima potestatibus sublimioribus subdita sit : non est enim potestas nisi a Deo : quæ autem sunt, a Deo ordinatæ sunt.\"},{\"verse\":2,\"text\":\"Itaque qui resistit potestati, Dei ordinationi resistit. Qui autem resistunt, ipsi sibi damnationem acquirunt :\"},{\"verse\":3,\"text\":\"nam principes non sunt timori boni operis, sed mali. Vis autem non timere potestatem ? Bonum fac : et habebis laudem ex illa :\"},{\"verse\":4,\"text\":\"Dei enim minister est tibi in bonum. Si autem malum feceris, time : non enim sine causa gladium portat. Dei enim minister est : vindex in iram ei qui malum agit.\"},{\"verse\":5,\"text\":\"Ideo necessitate subditi estote non solum propter iram, sed etiam propter conscientiam.\"},{\"verse\":6,\"text\":\"Ideo enim et tributa præstatis : ministri enim Dei sunt, in hoc ipsum servientes.\"},{\"verse\":7,\"text\":\"Reddite ergo omnibus debita : cui tributum, tributum : cui vectigal, vectigal : cui timorem, timorem : cui honorem, honorem.\"},{\"verse\":8,\"text\":\"Nemini quidquam debeatis, nisi ut invicem diligatis : qui enim diligit proximum, legem implevit.\"},{\"verse\":9,\"text\":\"Nam : Non adulterabis : non occides : non furaberis : non falsum testimonium dices : non concupisces : et si quod est aliud mandatum, in hoc verbo instauratur : diliges proximum tuum sicut teipsum.\"},{\"verse\":10,\"text\":\"Dilectio proximi malum non operatur. Plenitudo ergo legis est dilectio.\"},{\"verse\":11,\"text\":\"Et hoc scientes tempus : quia hora est jam nos de somno surgere. Nunc enim propior est nostra salus, quam cum credidimus.\"},{\"verse\":12,\"text\":\"Nox præcessit, dies autem appropinquavit. Abjiciamus ergo opera tenebrarum, et induamur arma lucis.\"},{\"verse\":13,\"text\":\"Sicut in die honeste ambulemus : non in comessationibus, et ebrietatibus, non in cubilibus, et impudicitiis, non in contentione, et æmulatione :\"},{\"verse\":14,\"text\":\"sed induimini Dominum Jesum Christum, et carnis curam ne feceritis in desideriis.\"}],\"summary\":\"Lessons of obedience to superiors and mutual charity.\",\"intro\":null,\"prev\":{\"usfm\":\"ROM\",\"chapter\":12,\"label\":\"Romans 12\"},\"next\":{\"usfm\":\"ROM\",\"chapter\":14,\"label\":\"Romans 14\"}}]]\n"])</script></body></html>
