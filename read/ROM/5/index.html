1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Romans<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ROM/">About <!-- -->Romans</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The grounds we have for hope in Christ. Sin and death came by Adam, grace and life by Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Being justified therefore by faith, let us have peace with God, through our Lord Jesus Christ:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>By whom also we have access through faith into this grace wherein we stand: and glory in the hope of the glory of the sons of God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And not only so: but we glory also in tribulations, knowing that tribulation worketh patience;</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And patience trial; and trial hope;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And hope confoundeth not: because the charity of God is poured forth in our hearts, by the Holy Ghost who is given to us.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For why did Christ, when as yet we were weak, according to the time, die for the ungodly?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For scarce for a just man will one die: yet perhaps for a good man some one would dare to die.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But God commendeth his charity towards us: because when as yet we were sinners according to the time.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Christ died for us. Much more therefore, being now justified by his blood, shall we be saved from wrath through him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For if, when we were enemies, we were reconciled to God by the death of his Son: much more, being reconciled, shall we be saved by his life.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And not only so: but also we glory in God, through our Lord Jesus Christ, by whom we have now received reconciliation.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wherefore as by one man sin entered into this world and by sin death: and so death passed upon all men, in whom all have sinned.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For until the law sin was in the world: but sin was not imputed, when the law was not.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But death reigned from Adam unto Moses, even over them also who have not sinned, after the similitude of the transgression of Adam, who is a figure of him who was to come.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But not as the offence, so also the gift. For if by the offence of one, many died: much more the grace of God and the gift, by the grace of one man, Jesus Christ, hath abounded unto many.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And not as it was by one sin, so also is the gift. For judgment indeed was by one unto condemnation: but grace is of many offences unto justification.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For if by one man’s offence death reigned through one; much more they who receive abundance of grace and of the gift and of justice shall reign in life through one, Jesus Christ.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Therefore, as by the offence of one, unto all men to condemnation: so also by the justice of one, unto all men to justification of life.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For as by the disobedience of one man, many were made sinners: so also by the obedience of one, many shall be made just.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Now the law entered in that sin might abound. And where sin abounded, grace did more abound.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That as sin hath reigned to death: so also grace might reign by justice unto life everlasting, through Jesus Christ our Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Justificati ergo ex fide, pacem habeamus ad Deum per Dominum nostrum Jesum Christum :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>per quem et habemus accessum per fidem in gratiam istam, in qua stamus, et gloriamur in spe gloriæ filiorum Dei.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non solum autem, sed et gloriamur in tribulationibus : scientes quod tribulatio patientiam operatur :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>patientia autem probationem, probatio vero spem,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>spes autem non confundit : quia caritas Dei diffusa est in cordibus nostris per Spiritum Sanctum, qui datus est nobis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ut quid enim Christus, cum adhuc infirmi essemus, secundum tempus, pro impiis mortuus est ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>vix enim pro justo quis moritur : nam pro bono forsitan quis audeat mori.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Commendat autem caritatem suam Deus in nobis : quoniam cum adhuc peccatores essemus, secundum tempus,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Christus pro nobis mortuus est : multo igitur magis nunc justificati in sanguine ipsius, salvi erimus ab ira per ipsum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si enim cum inimici essemus, reconciliati sumus Deo per mortem filii ejus : multo magis reconciliati, salvi erimus in vita ipsius.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non solum autem : sed et gloriamur in Deo per Dominum nostrum Jesum Christum, per quem nunc reconciliationem accepimus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Propterea sicut per unum hominem peccatum in hunc mundum intravit, et per peccatum mors, et ita in omnes homines mors pertransiit, in quo omnes peccaverunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Usque ad legem enim peccatum erat in mundo : peccatum autem non imputabatur, cum lex non esset.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sed regnavit mors ab Adam usque ad Moysen etiam in eos qui non peccaverunt in similitudinem prævaricationis Adæ, qui est forma futuri.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sed non sicut delictum, ita et donum : si enim unius delicto multi mortui sunt : multo magis gratia Dei et donum in gratia unius hominis Jesu Christi in plures abundavit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et non sicut per unum peccatum, ita et donum. Nam judicium quidem ex uno in condemnationem : gratia autem ex multis delictis in justificationem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si enim unius delicto mors regnavit per unum : multo magis abundantiam gratiæ, et donationis, et justitiæ accipientes, in vita regnabunt per unum Jesum Christum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Igitur sicut per unius delictum in omnes homines in condemnationem : sic et per unius justitiam in omnes homines in justificationem vitæ.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Sicut enim per inobedientiam unius hominis, peccatores constituti sunt multi : ita et per unius obeditionem, justi constituentur multi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Lex autem subintravit ut abundaret delictum. Ubi autem abundavit delictum, superabundavit gratia :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut sicut regnavit peccatum in mortem : ita et gratia regnet per justitiam in vitam æternam, per Jesum Christum Dominum nostrum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Romans 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ROM/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Ne  weak, according to the time, die for the ungodly?\"},{\"verse\":7,\"text\":\"For scarce for a just man will one die: yet perhaps for a good man some one would dare to die.\"},{\"verse\":8,\"text\":\"But God commendeth his charity towards us: because when as yet we were sinners according to the time.\"},{\"verse\":9,\"text\":\"Christ died for us. Much more therefore, being now justified by his blood, shall we be saved from wrath through him.\"},{\"verse\":10,\"text\":\"For if, when we were enemies, we were reconciled to God by the death of his Son: much more, being reconciled, shall we be saved by his life.\"},{\"verse\":11,\"text\":\"And not only so: but also we glory in God, through our Lord Jesus Christ, by whom we have now received reconciliation.\"},{\"verse\":12,\"text\":\"Wherefore as by one man sin entered into this world and by sin death: and so death passed upon all men, in whom all have sinned.\"},{\"verse\":13,\"text\":\"For until the law sin was in the world: but sin was not imputed, when the law was not.\"},{\"verse\":14,\"text\":\"But death reigned from Adam unto Moses, even over them also who have not sinned, after the similitude of the transgression of Adam, who is a figure of him who was to come.\"},{\"verse\":15,\"text\":\"But not as the offence, so also the gift. For if by the offence of one, many died: much more the grace of God and the gift, by the grace of one man, Jesus Christ, hath abounded unto many.\"},{\"verse\":16,\"text\":\"And not as it was by one sin, so also is the gift. For judgment indeed was by one unto condemnation: but grace is of many offences unto justification.\"},{\"verse\":17,\"text\":\"For if by one man’s offence death reigned through one; much more they who receive abundance of grace and of the gift and of justice shall reign in life through one, Jesus Christ.\"},{\"verse\":18,\"text\":\"Therefore, as by the offence of one, unto all men to condemnation: so also by the justice of one, unto all men to justification of life.\"},{\"verse\":19,\"text\":\"For as by the disobedience of one man, many were made sinners: so also by the obedience of one, many shall be made just.\"},{\"verse\":20,\"text\":\"Now the law entered in that sin might abound. And where sin abounded, grace did more abound.\"},{\"verse\":21,\"text\":\"That as sin hath reigned to death: so also grace might reign by justice unto life everlasting, through Jesus Christ our Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Justificati ergo ex fide, pacem habeamus ad Deum per Dominum nostrum Jesum Christum :\"},{\"verse\":2,\"text\":\"per quem et habemus accessum per fidem in gratiam istam, in qua stamus, et gloriamur in spe gloriæ filiorum Dei.\"},{\"verse\":3,\"text\":\"Non solum autem, sed et gloriamur in tribulationibus : scientes quod tribulatio patientiam operatur :\"},{\"verse\":4,\"text\":\"patientia autem probationem, probatio vero spem,\"},{\"verse\":5,\"text\":\"spes autem non confundit : quia caritas Dei diffusa est in cordibus nostris per Spiritum Sanctum, qui datus est nobis.\"},{\"verse\":6,\"text\":\"Ut quid enim Christus, cum adhuc infirmi essemus, secundum tempus, pro impiis mortuus est ?\"},{\"verse\":7,\"text\":\"vix enim pro justo quis moritur : nam pro bono forsitan quis audeat mori.\"},{\"verse\":8,\"text\":\"Commendat autem caritatem suam Deus in nobis : quoniam cum adhuc peccatores essemus, secundum tempus,\"},{\"verse\":9,\"text\":\"Christus pro nobis mortuus est : multo igitur magis nunc justificati in sanguine ipsius, salvi erimus ab ira per ipsum.\"},{\"verse\":10,\"text\":\"Si enim cum inimici essemus, reconciliati sumus Deo per mortem filii ejus : multo magis reconciliati, salvi erimus in vita ipsius.\"},{\"verse\":11,\"text\":\"Non solum autem : sed et gloriamur in Deo per Dominum nostrum Jesum Christum, per quem nunc reconciliationem accepimus.\"},{\"verse\":12,\"text\":\"Propterea sicut per unum hominem peccatum in hunc mundum intravit, et per peccatum mors, et ita in omnes homines mors pertransiit, in quo omnes peccaverunt.\"},{\"verse\":13,\"text\":\"Usque ad legem enim peccatum erat in mundo : peccatum autem non imputabatur, cum lex non esset.\"},{\"verse\":14,\"text\":\"Sed regnavit mors ab Adam usque ad Moysen etiam in eos qui non peccaverunt in similitudinem prævaricationis Adæ, qui est forma futuri.\"},{\"verse\":15,\"text\":\"Sed non sicut delictum, ita et donum : si enim unius delicto multi mortui sunt : multo magis gratia Dei et donum in gratia unius hominis Jesu Christi in plures abundavit.\"},{\"verse\":16,\"text\":\"Et non sicut per unum peccatum, ita et donum. Nam judicium quidem ex uno in condemnationem : gratia autem ex multis delictis in justificationem.\"},{\"verse\":17,\"text\":\"Si enim unius delicto mors regnavit per unum : multo magis abundantiam gratiæ, et donationis, et justitiæ accipientes, in vita regnabunt per unum Jesum Christum.\"},{\"verse\":18,\"text\":\"Igitur sicut per unius delictum in omnes homines in condemnationem : sic et per unius justitiam in omnes homines in justificationem vitæ.\"},{\"verse\":19,\"text\":\"Sicut enim per inobedientiam unius hominis, peccatores constituti sunt multi : ita et per unius obeditionem, justi constituentur multi.\"},{\"verse\":20,\"text\":\"Lex autem subintravit ut abundaret delictum. Ubi autem abundavit delictum, superabundavit gratia :\"},{\"verse\":21,\"text\":\"ut sicut regnavit peccatum in mortem : ita et gratia regnet per justitiam in vitam æternam, per Jesum Christum Dominum nostrum.\"}],\"summary\":\"The grounds we have for hope in Christ. Sin and death came by Adam, grace and life by Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"ROM\",\"chapter\":4,\"label\":\"Romans 4\"},\"next\":{\"usfm\":\"ROM\",\"chapter\":6,\"label\":\"Romans 6\"}}]]\n"])</script></body></html>
