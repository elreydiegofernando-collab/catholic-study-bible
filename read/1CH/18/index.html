f the hands of the Philistines,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he defeated Moab, and the Moabites were made David’s servants, and brought him gifts.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>At that time David defeated also Adarezer king of Soba of the land of Hemath, when he went to extend his dominions as far as the river Euphrates.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen, and he houghed all the chariot horses, only a hundred chariots, which he reserved for himself.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the Syrians of Damascus came also to help Adarezer king of Soba: and David slew of them likewise two and twenty thousand men.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he put a garrison in Damascus, that Syria also should serve him, and bring gifts. And the Lord assisted him in all things to which he went.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And David took the golden quivers which the servants of Adarezer had, and he brought them to Jerusalem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Likewise out of Thebath and Chun, cities of Adarezer, he brought very much brass, of which Solomon made the brazen sea, and the pillars, and the vessels of brass.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now when Thou king of Hemath heard that David had defeated all the army of Adarezer king of Soba,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He sent Adoram his son to king David to desire peace of him, and to congratulate him that he had defeated and overthrown Adarezer: for Thou was an enemy to Adarezer.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And all the vessels of gold, and silver and brass king David consecrated to the Lord, with the silver and gold which he had taken from all the nations, as well from Edom, and from Moab, and from the sons of Ammon, as from the Philistines, and from Amalec.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Abisai the son of Sarvia slew of the Edomites in the vale of the saltpits, eighteen thousand:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he put a garrison in Edom, that Edom should serve David: and the Lord preserved David in all things to which he went.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>So David reigned over all Israel, and executed judgment and justice among all his people.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And Joab the son of Sarvia was over the army, and Josaphat the son of Ahilud recorder.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Sadoc the son of Achitob, and Achimelech the son of Abiathar, were the priests: and Susa, scribe.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And Banaias the son of Joiada was over the bands of the Cerethi, and the Phelethi: and the sons of David were chief about the king.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem post hæc, ut percuteret David Philisthiim, et humiliaret eos, et tolleret Geth et filias ejus de manu Philisthiim,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>percuteretque Moab, et fierent Moabitæ servi David, offerentes ei munera.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Eo tempore percussit David etiam Adarezer regem Soba regionis Hemath, quando perrexit ut dilataret imperium suum usque ad flumen Euphraten.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Cepit ergo David mille quadrigas ejus, et septem millia equitum, ac viginti millia virorum peditum, subnervavitque omnes equos curruum, exceptis centum quadrigis, quas reservavit sibi.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Supervenit autem et Syrus Damascenus, ut auxilium præberet Adarezer regi Soba : sed et hujus percussit David viginti duo millia virorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et posuit milites in Damasco, ut Syria quoque serviret sibi, et offerret munera. Adjuvitque eum Dominus in cunctis ad quæ perrexerat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tulit quoque David pharetras aureas, quas habuerant servi Adarezer, et attulit eas in Jerusalem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Necnon de Thebath et Chun urbibus Adarezer æris plurimum, de quo fecit Salomon mare æneum, et columnas, et vasa ænea.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quod cum audisset Thou rex Hemath, percussisse videlicet David omnem exercitum Adarezer regis Soba,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>misit Adoram filium suum ad regem David, ut postularet ab eo pacem, et congratularetur ei quod percussisset et expugnasset Adarezer : adversarius quippe erat Thou Adarezer.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sed et omnia vasa aurea, et argentea, et ænea consecravit David rex Domino, cum argento et auro quod tulerat ex universis gentibus, tam de Idumæa, et Moab, et filiis Ammon, quam de Philisthiim et Amalec.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Abisai vero filius Sarviæ percussit Edom in valle Salinarum, decem et octo millia :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et constituit in Edom præsidium, ut serviret Idumæa David : salvavitque Dominus David in cunctis ad quæ perrexerat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Regnavit ergo David super universum Israël, et faciebat judicium atque justitiam cuncto populo suo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Porro Joab filius Sarviæ erat super exercitum, et Josaphat filius Ahilud a commentariis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sadoc autem filius Achitob, et Ahimelech filius Abiathar, sacerdotes : et Susa, scriba :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Banaias quoque filius Jojadæ super legiones Cerethi et Phelethi : porro filii David, primi ad manum regis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CH/17/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="bloc book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1CH.18\",{\"bookId\":13,\"usfm\":\"1CH\",\"bookName\":\"1 Chronicles\",\"drName\":\"1 Paralipomenon\",\"chapter\":18,\"totalChapters\":29,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass after this, that David defeated the Philistines, and humbled them, and took away Geth, and her daughters out of the hands of the Philistines,\"},{\"verse\":2,\"text\":\"And he defeated Moab, and the Moabites were made David’s servants, and brought him gifts.\"},{\"verse\":3,\"text\":\"At that time David defeated also Adarezer king of Soba of the land of Hemath, when he went to extend his dominions as far as the river Euphrates.\"},{\"verse\":4,\"text\":\"And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen, and he houghed all the chariot horses, only a hundred chariots, which he reserved for himself.\"},{\"verse\":5,\"text\":\"And the Syrians of Damascus came also to help Adarezer king of Soba: and David slew of them likewise two and twenty thousand men.\"},{\"verse\":6,\"text\":\"And he put a garrison in Damascus, that Syria also should serve him, and bring gifts. And the Lord assisted him in all things to which he went.\"},{\"verse\":7,\"text\":\"And David took the golden quivers which the servants of Adarezer had, and he brought them to Jerusalem.\"},{\"verse\":8,\"text\":\"Likewise out of Thebath and Chun, cities of Adarezer, he brought very much brass, of which Solomon made the brazen sea, and the pillars, and the vessels of brass.\"},{\"verse\":9,\"text\":\"Now when Thou king of Hemath heard that David had defeated all the army of Adarezer king of Soba,\"},{\"verse\":10,\"text\":\"He sent Adoram his son to king David to desire peace of him, and to congratulate him that he had defeated and overthrown Adarezer: for Thou was an enemy to Adarezer.\"},{\"verse\":11,\"text\":\"And all the vessels of gold, and silver and brass king David consecrated to the Lord, with the silver and gold which he had taken from all the nations, as well from Edom, and from Moab, and from the sons of Ammon, as from the Philistines, and from Amalec.\"},{\"verse\":12,\"text\":\"And Abisai the son of Sarvia slew of the Edomites in the vale of the saltpits, eighteen thousand:\"},{\"verse\":13,\"text\":\"And he put a garrison in Edom, that Edom should serve David: and the Lord preserved David in all things to which he went.\"},{\"verse\":14,\"text\":\"So David reigned over all Israel, and executed judgment and justice among all his people.\"},{\"verse\":15,\"text\":\"And Joab the son of Sarvia was over the army, and Josaphat the son of Ahilud recorder.\"},{\"verse\":16,\"text\":\"And Sadoc the son of Achitob, and Achimelech the son of Abiathar, were the priests: and Susa, scribe.\"},{\"verse\":17,\"text\":\"And Banaias the son of Joiada was over the bands of the Cerethi, and the Phelethi: and the sons of David were chief about the king.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem post hæc, ut percuteret David Philisthiim, et humiliaret eos, et tolleret Geth et filias ejus de manu Philisthiim,\"},{\"verse\":2,\"text\":\"percuteretque Moab, et fierent Moabitæ servi David, offerentes ei munera.\"},{\"verse\":3,\"text\":\"Eo tempore percussit David etiam Adarezer regem Soba regionis Hemath, quando perrexit ut dilataret imperium suum usque ad flumen Euphraten.\"},{\"verse\":4,\"text\":\"Cepit ergo David mille quadrigas ejus, et septem millia equitum, ac viginti millia virorum peditum, subnervavitque omnes equos curruum, exceptis centum quadrigis, quas reservavit sibi.\"},{\"verse\":5,\"text\":\"Supervenit autem et Syrus Damascenus, ut auxilium præberet Adarezer regi Soba : sed et hujus percussit David viginti duo millia virorum.\"},{\"verse\":6,\"text\":\"Et posuit milites in Damasco, ut Syria quoque serviret sibi, et offerret munera. Adjuvitque eum Dominus in cunctis ad quæ perrexerat.\"},{\"verse\":7,\"text\":\"Tulit quoque David pharetras aureas, quas habuerant servi Adarezer, et attulit eas in Jerusalem.\"},{\"verse\":8,\"text\":\"Necnon de Thebath et Chun urbibus Adarezer æris plurimum, de quo fecit Salomon mare æneum, et columnas, et vasa ænea.\"},{\"verse\":9,\"text\":\"Quod cum audisset Thou rex Hemath, percussisse videlicet David omnem exercitum Adarezer regis Soba,\"},{\"verse\":10,\"text\":\"misit Adoram filium suum ad regem David, ut postularet ab eo pacem, et congratularetur ei quod percussisset et expugnasset Adarezer : adversarius quippe erat Thou Adarezer.\"},{\"verse\":11,\"text\":\"Sed et omnia vasa aurea, et argentea, et ænea consecravit David rex Domino, cum argento et auro quod tulerat ex universis gentibus, tam de Idumæa, et Moab, et filiis Ammon, quam de Philisthiim et Amalec.\"},{\"verse\":12,\"text\":\"Abisai vero filius Sarviæ percussit Edom in valle Salinarum, decem et octo millia :\"},{\"verse\":13,\"text\":\"et constituit in Edom præsidium, ut serviret Idumæa David : salvavitque Dominus David in cunctis ad quæ perrexerat.\"},{\"verse\":14,\"text\":\"Regnavit ergo David super universum Israël, et faciebat judicium atque justitiam cuncto populo suo.\"},{\"verse\":15,\"text\":\"Porro Joab filius Sarviæ erat super exercitum, et Josaphat filius Ahilud a commentariis :\"},{\"verse\":16,\"text\":\"Sadoc autem filius Achitob, et Ahimelech filius Abiathar, sacerdotes : et Susa, scriba :\"},{\"verse\":17,\"text\":\"Banaias quoque filius Jojadæ super legiones Cerethi et Phelethi : porro filii David, primi ad manum regis.\"}],\"summary\":\"David’s victories. His chief officers.\",\"intro\":null,\"prev\":{\"usfm\":\"1CH\",\"chapter\":17,\"label\":\"1 Chronicles 17\"},\"next\":{\"usfm\":\"1CH\",\"chapter\":19,\"label\":\"1 Chronicles 19\"}}]]\n"])</script></body></html>
