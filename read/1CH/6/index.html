d="false" class="verse"><sup>2</sup>The sons of Caath: Amram, Isaar, Hebron, and Oziel.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The children of Amram: Aaron, Moses, and Mary. The sons of Aaron: Nadab and Abiu, Eleazar and Ithamar.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Eleazar begot Phinees, and Phinees begot Abisue,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Abisue begot Bocci, and Bocci begot Ozi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ozi begot Zaraias, and Zaraias begot Maraioth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Maraioth begot Amarias, and Amarias begot Achitob.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Achitob begot Sadoc, and Sadoc begot Achimaas.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Achimaas begot Azarias, Azarias begot Johanan,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Johanan begot Azarias. This is he that executed the priestly office in the house which Solomon built in Jerusalem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Azarias begot Amarias, and Amarias begot Achitob.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Achitob begot Sadoc, and Sadoc begot Sellum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sellum begot Helcias, and Helcias begot Azarias,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Azarias begot Saraias, and Saraias begot Josedec.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Now Josedec went out, when the Lord carried away Juda, and Jerusalem, by the hands of Nabuchodonosor.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>So the sons of Levi were Gerson, Caath, and Merari.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And these are the names of the sons of Gerson: Lobni and Semei.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The sons of Caath: Amram, and Isaar, and Hebron, and Oziel.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The sons of Merari: Moholi and Musi. And these are the kindreds of Levi according to their families.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Of Gerson: Lobni his son, Jahath his son, Zamma his son,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Joah his son, Addo his son, Zara his son, Jethrai his son.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The sons of Caath, Aminadab his son, Core his son, Asir his son,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Elcana his son, Abiasaph his son, Asir his son,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Thahath his son, Uriel his son, Ozias his son, Saul his son.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The sons of Elcana: Amasai, and Achimoth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And Elcana. The sons of Elcana: Sophai his son, Nahath his son,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Eliab his son, Jeroham his son, Elcana his son.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The sons of Samuel: the firstborn Vasseni, and Abia.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And the sons of Merari, Moholi: Lobni his son, Semei his son, Oza his son,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sammaa his son, Haggia his son, Asaia his son.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>These are they, whom David set over the singing men of the house of the Lord, after that the ark was placed.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they ministered before the tabernacle of the testimony, with singing, until Solomon built the house of the Lord in Jerusalem, and they stood according to their order in the ministry.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And these are they that stood with their sons, of the sons of Caath, Hemam a singer, the son of Joel, the son of Sammuel,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The son of Elcana, the son of Jeroham, the son of Eliel, the son of Thohu,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The son of Suph, the son of Elcana, the son of Mahath, the son of Amasai,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The son of Elcana, the son of Johel, the son of Azarias, the son of Sophonias,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>The son of Thahath, the son of Asir, the son of Abiasaph, the son of Core,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>The son of Isaar, the son of Caath, the son of Levi, the son of Israel.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And his brother Asaph, who stood on his right hand, Asaph the son of Barachias, the son of Samaa.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The son of Michael, the son of Basaia, the son of Melchia.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The son of Athanai, the son of Zara, the son of Adaia.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The son of Ethan, the son of Zamma, the son of Semei.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>The son of Jeth, the son of Gerson, the son of Levi.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And the sons of Merari their brethren, on the left hand, Ethan the son of Cusi, the son of Abdi, the son of Meloch,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>The son of Hasabia, the son of Amasai, the son of Helcias,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>The son of Amasai, the son of Boni, the son of Somer,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>The son of Moholi, the son of Musi, the son of Merari, the son of Levi.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Their brethren also the Levites, who were appointed for all the ministry of the tabernacle of the house of the Lord.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>But Aaron and his sons offered burnt offerings upon the altar of holocausts, and upon the altar of incense, for every work of the holy of holies: and to pray for Israel according to all that Moses the servant of God had commanded.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And these are the sons of Aaron: Eleazar his son, Phinees his son, Abisue his son,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Bocci his son, Ozi his son, Zarahia his son,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Meraioth his son, Amarias his son, Achitob his son,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Sadoc his son, Achimaas his son.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And these are their dwelling places by the towns and confines, to wit, of the sons of Aaron, of the families of the Caathites: for they fell to them by lot.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And they gave them Hebron in the land of Juda, and the suburbs thereof round about:</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>But the fields of the city, and the villages to Caleb son of Jephone.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And to the sons of Aaron they gave the cities for refuge Hebron, and Lobna, and the suburbs thereof,</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>And Jether and Esthemo, with their suburbs, and Helon, and Dabir with their suburbs:</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Asan also, and Bethsames, with their suburbs.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And out of the tribe of Benjamin: Gabee and its suburbs, Almath with its suburbs, Anathoth also with its suburbs: all their cities throughout their families were thirteen.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And to the sons of Caath that remained of their kindred they gave out of the half tribe of Manasses ten cities in possession.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And to the sons of Gerson by their families out of the tribe of Issachar, and out of the tribe of Aser, and out of the tribe of Nephtali, and out of the tribe of Manasses in Basan, thirteen cities.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>And to the sons of Merari by their families out of the tribe of Ruben, and out of the tribe of Gad, and out of the tribe of Zabulon, they gave by lot twelve cities.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>And the children of Israel gave to the Levites the cities, and their suburbs.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And they gave them by lot, out of the tribe of the sons of Juda, and out of the tribe of the sons of Simeon, and out of the tribe of the sons of Benjamin, these cities which they called by their names.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>And to them that were of the kindred of the sons of Caath, and the cities in their borders were of the tribe of Ephraim.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>And they gave the cities of refuge Sichem with its suburbs in mount Ephraim, and Gazer with its suburbs,</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Jecmaan also with its suburbs, and Beth-horon in like manner,</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Helon also with its suburbs, and Gethremmon in like manner,</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>And out of the half tribe of Manasses, Aner and its suburbs, Baalam and its suburbs, to wit, to them that were left of the family of the sons of Caath.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>And to the sons of Gersom, out of the kindred of the half tribe of Manasses, Gaulon, in Basan, and its suburbs, and Astharoth with its suburbs.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>Out of the tribe of Issachar, Cedes and its suburbs, and Dabereth with its suburbs;</button><button type="button" data-verse="73" aria-pressed="false" class="verse"><sup>73</sup>Ramoth also and its suburbs, and Anem with its suburbs.</button><button type="button" data-verse="74" aria-pressed="false" class="verse"><sup>74</sup>And out of the tribe of Aser: Masal with its suburbs, and Abdon in like manner;</button><button type="button" data-verse="75" aria-pressed="false" class="verse"><sup>75</sup>Hucac also and its suburbs, and Rohol with its suburbs.</button><button type="button" data-verse="76" aria-pressed="false" class="verse"><sup>76</sup>And out of the tribe of Nephtali, Cedes in Galilee and its suburbs, Hamon with its suburbs, and Cariathaim, and its suburbs.</button><button type="button" data-verse="77" aria-pressed="false" class="verse"><sup>77</sup>And to the sons of Merari that remained: out of the tribe of Zabulon, Remmono and its suburbs, and Thabor with its suburbs.</button><button type="button" data-verse="78" aria-pressed="false" class="verse"><sup>78</sup>Beyond the Jordan also over against Jericho, on the east side of the Jordan, out of the tribe of Ruben, Bosor in the wilderness with its suburbs, and Jassa with its suburbs;</button><button type="button" data-verse="79" aria-pressed="false" class="verse"><sup>79</sup>Cademoth also and its suburbs, and Mephaath with its suburbs;</button><button type="button" data-verse="80" aria-pressed="false" class="verse"><sup>80</sup>Moreover also out of the tribe of Gad, Ramoth in Galaad and its suburbs, and Manaim with its suburbs;</button><button type="button" data-verse="81" aria-pressed="false" class="verse"><sup>81</sup>Hesebon also with its suburbs, and Jazer with its suburbs.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Filii Levi : Gerson, Caath, et Merari.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Filii Caath : Amram, Isaar, Hebron, et Oziel.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Filii Amram : Aaron, Moyses, et Maria. Filii Aaron : Nadab et Abiu, Eleazar, et Ithamar.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Eleazar genuit Phinees, et Phinees genuit Abisue.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Abisue vero genuit Bocci, et Bocci genuit Ozi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ozi genuit Zaraiam, et Zaraias genuit Meraioth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Porro Meraioth genuit Amariam, et Amarias genuit Achitob.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Achitob genuit Sadoc, et Sadoc genuit Achimaas,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Achimaas genuit Azariam, Azarias genuit Johanan,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Johanan genuit Azariam : ipse est qui sacerdotio functus est in domo quam ædificavit Salomon in Jerusalem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Genuit autem Azarias Amariam, et Amarias genuit Achitob,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Achitob genuit Sadoc, et Sadoc genuit Sellum,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sellum genuit Helciam, et Helcias genuit Azariam,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Azarias genuit Saraiam, et Saraias genuit Josedec.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Porro Josedec egressus est, quando transtulit Dominus Judam et Jerusalem per manus Nabuchodonosor.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Filii ergo Levi : Gersom, Caath, et Merari.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et hæc nomina filiorum Gersom : Lobni, et Semei.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Filii Caath : Amram, et Isaar, et Hebron, et Oziel.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Filii Merari : Moholi et Musi. Hæ autem cognationes Levi secundum familias eorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Gersom : Lobni filius ejus, Jahath filius ejus, Zamma filius ejus,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Joah filius ejus, Addo filius ejus, Zara filius ejus, Jethrai filius ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Filii Caath : Aminadab filius ejus, Core filius ejus, Asir filius ejus,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Elcana filius ejus, Abiasaph filius ejus, Asir filius ejus,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Thahath filius ejus, Uriel filius ejus, Ozias filius ejus, Saul filius ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Filii Elcana, Amasai et Achimoth</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et Elcana. Filii Elcana : Sophai filius ejus, Nahath filius ejus,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Eliab filius ejus, Jeroham filius ejus, Elcana filius ejus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Filii Samuel : primogenitus Vasseni, et Abia.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Filii autem Merari, Moholi : Lobni filius ejus, Semei filius ejus, Oza filius ejus,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sammaa filius ejus, Haggia filius ejus, Asaia filius ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Isti sunt quos constituit David super cantores domus Domini, ex quo collocata est arca :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et ministrabant coram tabernaculo testimonii, canentes donec ædificaret Salomon domum Domini in Jerusalem : stabant autem juxta ordinem suum in ministerio.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hi vero sunt qui assistebant cum filiis suis, de filiis Caath, Hemam cantor filius Johel, filii Samuel,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>filii Elcana, filii Jeroham, filii Eliel, filii Thohu,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>filii Suph, filii Elcana, filii Mahath, filii Amasai,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>filii Elcana, filii Johel, filii Azariæ, filii Sophoniæ,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>filii Thahath, filii Asir, filii Abiasaph, filii Core,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>filii Isaar, filii Caath, filii Levi, filii Israël.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et frater ejus Asaph, qui stabat a dextris ejus, Asaph filius Barachiæ, filii Samaa,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>filii Michaël, filii Basaiæ, filii Melchiæ,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>filii Athanai, filii Zara, filii Adaia,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>filii Ethan, filii Zamma, filii Semei,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>filii Jeth, filii Gersom, filii Levi.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Filii autem Merari fratres eorum, ad sinistram, Ethan filius Cusi, filii Abdi, filii Maloch,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>filii Hasabiæ, filii Amasiæ, filii Helciæ,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>filii Amasai, filii Boni, filii Somer,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>filii Moholi, filii Musi, filii Merari, filii Levi.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Fratres quoque eorum Levitæ, qui ordinati sunt in cunctum ministerium tabernaculi domus Domini.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Aaron vero et filii ejus adolebant incensum super altare holocausti, et super altare thymiamatis, in omne opus Sancti sanctorum : et ut precarentur pro Israël juxta omnia quæ præceperat Moyses servus Dei.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Hi sunt autem filii Aaron : Eleazar filius ejus, Phinees filius ejus, Abisue filius ejus,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Bocci filius ejus, Ozi filius ejus, Zarahia filius ejus,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Meraioth filius ejus, Amarias filius ejus, Achitob filius ejus,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Sadoc filius ejus, Achimaas filius ejus.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Et hæc habitacula eorum per vicos atque confinia, filiorum scilicet Aaron, juxta cognationes Caathitarum : ipsis enim sorte contigerant.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Dederunt igitur eis Hebron in terra Juda, et suburbana ejus per circuitum :</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>agros autem civitatis, et villas, Caleb filio Jephone.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Porro filiis Aaron dederunt civitates ad confugiendum Hebron, et Lobna, et suburbana ejus,</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Jether quoque, et Esthemo cum suburbanis suis, sed et Helon, et Dabir cum suburbanis suis,</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Asan quoque, et Bethsemes, et suburbana earum.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>De tribu autem Benjamin, Gabee et suburbana ejus, et Almath cum suburbanis suis, Anathoth quoque cum suburbanis suis : omnes civitates, tredecim, per cognationes suas.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Filiis autem Caath residuis de cognatione sua dederunt ex dimidia tribu Manasse in possessionem urbes decem.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Porro filiis Gersom per cognationes suas de tribu Issachar, et de tribu Aser, et de tribu Nephthali, et de tribu Manasse in Basan, urbes tredecim.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Filiis autem Merari per cognationes suas de tribu Ruben, et de tribu Gad, et de tribu Zabulon, dederunt sorte civitates duodecim.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Dederunt quoque filii Israël Levitis civitates, et suburbana earum :</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>dederuntque per sortem, ex tribu filiorum Juda, et ex tribu filiorum Simeon, et ex tribu filiorum Benjamin urbes has, quas vocaverunt nominibus suis,</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>et his, qui erant de cognatione filiorum Caath, fueruntque civitates in terminis eorum de tribu Ephraim.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Dederunt ergo eis urbes ad confugiendum, Sichem cum suburbanis suis in monte Ephraim, et Gazer cum suburbanis suis,</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Jecmaam quoque cum suburbanis suis, et Bethoron similiter,</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>necnon et Helon cum suburbanis suis, et Gethremmon in eumdem modum.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Porro ex dimidia tribu Manasse, Aner et suburbana ejus, Balaam et suburbana ejus : his videlicet, qui de cognatione filiorum Caath reliqui erant.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>Filiis autem Gersom de cognatione dimidiæ tribus Manasse, Gaulon in Basan, et suburbana ejus, et Astaroth cum suburbanis suis.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>De tribu Issachar, Cedes et suburbanis suis, et Dabereth cum suburbanis suis,</button><button type="button" data-verse="73" aria-pressed="false" class="verse"><sup>73</sup>Ramoth quoque et suburbana ejus, et Anem cum suburbanis suis.</button><button type="button" data-verse="74" aria-pressed="false" class="verse"><sup>74</sup>De tribu vero Aser : Masal cum suburbanis suis, et Abdon similiter,</button><button type="button" data-verse="75" aria-pressed="false" class="verse"><sup>75</sup>Hucac quoque et suburbana ejus, et Rohob cum suburbanis suis.</button><button type="button" data-verse="76" aria-pressed="false" class="verse"><sup>76</sup>Porro de tribu Nephthali, Cedes in Galilæa et suburbana ejus, Hamon cum suburbanis suis, et Cariathaim et suburbana ejus.</button><button type="button" data-verse="77" aria-pressed="false" class="verse"><sup>77</sup>Filiis autem Merari residuis : de tribu Zabulon, Remmono et suburbana ejus, et Thabor cum suburbanis sus :</button><button type="button" data-verse="78" aria-pressed="false" class="verse"><sup>78</sup>trans Jordanem quoque ex adverso Jericho contra orientem Jordanis, de tribu Ruben, Bosor in solitudine cum suburbanis suis, et Jassa cum suburbanis suis,</button><button type="button" data-verse="79" aria-pressed="false" class="verse"><sup>79</sup>Cademoth quoque et suburbana ejus, et Mephaat cum suburbanis suis.</button><button type="button" data-verse="80" aria-pressed="false" class="verse"><sup>80</sup>Necnon et de tribu Gad, Ramoth in Galaad et suburbana ejus, et Manaim cum suburbanis suis,</button><button type="button" data-verse="81" aria-pressed="false" class="verse"><sup>81</sup>sed et Hesebon cum suburbanis suis, et Jezer cum suburbanis suis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CH/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Chronicles 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CH/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 Chronicles 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->29<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 1 Chronicles 5" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholi \",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1CH.6\",{\"bookId\":13,\"usfm\":\"1CH\",\"bookName\":\"1 Chronicles\",\"drName\":\"1 Paralipomenon\",\"chapter\":6,\"totalChapters\":29,\"dra\":[{\"verse\":1,\"text\":\"The sons of Levi were Gerson, Caath, and Merari.\"},{\"verse\":2,\"text\":\"The sons of Caath: Amram, Isaar, Hebron, and Oziel.\"},{\"verse\":3,\"text\":\"The children of Amram: Aaron, Moses, and Mary. The sons of Aaron: Nadab and Abiu, Eleazar and Ithamar.\"},{\"verse\":4,\"text\":\"Eleazar begot Phinees, and Phinees begot Abisue,\"},{\"verse\":5,\"text\":\"And Abisue begot Bocci, and Bocci begot Ozi.\"},{\"verse\":6,\"text\":\"Ozi begot Zaraias, and Zaraias begot Maraioth.\"},{\"verse\":7,\"text\":\"And Maraioth begot Amarias, and Amarias begot Achitob.\"},{\"verse\":8,\"text\":\"Achitob begot Sadoc, and Sadoc begot Achimaas.\"},{\"verse\":9,\"text\":\"Achimaas begot Azarias, Azarias begot Johanan,\"},{\"verse\":10,\"text\":\"Johanan begot Azarias. This is he that executed the priestly office in the house which Solomon built in Jerusalem.\"},{\"verse\":11,\"text\":\"And Azarias begot Amarias, and Amarias begot Achitob.\"},{\"verse\":12,\"text\":\"And Achitob begot Sadoc, and Sadoc begot Sellum,\"},{\"verse\":13,\"text\":\"Sellum begot Helcias, and Helcias begot Azarias,\"},{\"verse\":14,\"text\":\"Azarias begot Saraias, and Saraias begot Josedec.\"},{\"verse\":15,\"text\":\"Now Josedec went out, when the Lord carried away Juda, and Jerusalem, by the hands of Nabuchodonosor.\"},{\"verse\":16,\"text\":\"So the sons of Levi were Gerson, Caath, and Merari.\"},{\"verse\":17,\"text\":\"And these are the names of the sons of Gerson: Lobni and Semei.\"},{\"verse\":18,\"text\":\"The sons of Caath: Amram, and Isaar, and Hebron, and Oziel.\"},{\"verse\":19,\"text\":\"The sons of Merari: Moholi and Musi. And these are the kindreds of Levi according to their families.\"},{\"verse\":20,\"text\":\"Of Gerson: Lobni his son, Jahath his son, Zamma his son,\"},{\"verse\":21,\"text\":\"Joah his son, Addo his son, Zara his son, Jethrai his son.\"},{\"verse\":22,\"text\":\"The sons of Caath, Aminadab his son, Core his son, Asir his son,\"},{\"verse\":23,\"text\":\"Elcana his son, Abiasaph his son, Asir his son,\"},{\"verse\":24,\"text\":\"Thahath his son, Uriel his son, Ozias his son, Saul his son.\"},{\"verse\":25,\"text\":\"The sons of Elcana: Amasai, and Achimoth.\"},{\"verse\":26,\"text\":\"And Elcana. The sons of Elcana: Sophai his son, Nahath his son,\"},{\"verse\":27,\"text\":\"Eliab his son, Jeroham his son, Elcana his son.\"},{\"verse\":28,\"text\":\"The sons of Samuel: the firstborn Vasseni, and Abia.\"},{\"verse\":29,\"text\":\"And the sons of Merari, Moholi: Lobni his son, Semei his son, Oza his son,\"},{\"verse\":30,\"text\":\"Sammaa his son, Haggia his son, Asaia his son.\"},{\"verse\":31,\"text\":\"These are they, whom David set over the singing men of the house of the Lord, after that the ark was placed.\"},{\"verse\":32,\"text\":\"And they ministered before the tabernacle of the testimony, with singing, until Solomon built the house of the Lord in Jerusalem, and they stood according to their order in the ministry.\"},{\"verse\":33,\"text\":\"And these are they that stood with their sons, of the sons of Caath, Hemam a singer, the son of Joel, the son of Sammuel,\"},{\"verse\":34,\"text\":\"The son of Elcana, the son of Jeroham, the son of Eliel, the son of Thohu,\"},{\"verse\":35,\"text\":\"The son of Suph, the son of Elcana, the son of Mahath, the son of Amasai,\"},{\"verse\":36,\"text\":\"The son of Elcana, the son of Johel, the son of Azarias, the son of Sophonias,\"},{\"verse\":37,\"text\":\"The son of Thahath, the son of Asir, the son of Abiasaph, the son of Core,\"},{\"verse\":38,\"text\":\"The son of Isaar, the son of Caath, the son of Levi, the son of Israel.\"},{\"verse\":39,\"text\":\"And his brother Asaph, who stood on his right hand, Asaph the son of Barachias, the son of Samaa.\"},{\"verse\":40,\"text\":\"The son of Michael, the son of Basaia, the son of Melchia.\"},{\"verse\":41,\"text\":\"The son of Athanai, the son of Zara, the son of Adaia.\"},{\"verse\":42,\"text\":\"The son of Ethan, the son of Zamma, the son of Semei.\"},{\"verse\":43,\"text\":\"The son of Jeth, the son of Gerson, the son of Levi.\"},{\"verse\":44,\"text\":\"And the sons of Merari their brethren, on the left hand, Ethan the son of Cusi, the son of Abdi, the son of Meloch,\"},{\"verse\":45,\"text\":\"The son of Hasabia, the son of Amasai, the son of Helcias,\"},{\"verse\":46,\"text\":\"The son of Amasai, the son of Boni, the son of Somer,\"},{\"verse\":47,\"text\":\"The son of Moholi, the son of Musi, the son of Merari, the son of Levi.\"},{\"verse\":48,\"text\":\"Their brethren also the Levites, who were appointed for all the ministry of the tabernacle of the house of the Lord.\"},{\"verse\":49,\"text\":\"But Aaron and his sons offered burnt offerings upon the altar of holocausts, and upon the altar of incense, for every work of the holy of holies: and to pray for Israel according to all that Moses the servant of God had commanded.\"},{\"verse\":50,\"text\":\"And these are the sons of Aaron: Eleazar his son, Phinees his son, Abisue his son,\"},{\"verse\":51,\"text\":\"Bocci his son, Ozi his son, Zarahia his son,\"},{\"verse\":52,\"text\":\"Meraioth his son, Amarias his son, Achitob his son,\"},{\"verse\":53,\"text\":\"Sadoc his son, Achimaas his son.\"},{\"verse\":54,\"text\":\"And these are their dwelling places by the towns and confines, to wit, of the sons of Aaron, of the families of the Caathites: for they fell to them by lot.\"},{\"verse\":55,\"text\":\"And they gave them Hebron in the land of Juda, and the suburbs thereof round about:\"},{\"verse\":56,\"text\":\"But the fields of the city, and the villages to Caleb son of Jephone.\"},{\"verse\":57,\"text\":\"And to the sons of Aaron they gave the cities for refuge Hebron, and Lobna, and the suburbs thereof,\"},{\"verse\":58,\"text\":\"And Jether and Esthemo, with their suburbs, and Helon, and Dabir with their suburbs:\"},{\"verse\":59,\"text\":\"Asan also, and Bethsames, with their suburbs.\"},{\"verse\":60,\"text\":\"And out of the tribe of Benjamin: Gabee and its suburbs, Almath with its suburbs, Anathoth also with its suburbs: all their cities throughout their families were thirteen.\"},{\"verse\":61,\"text\":\"And to the sons of Caath that remained of their kindred they gave out of the half tribe of Manasses ten cities in possession.\"},{\"verse\":62,\"text\":\"And to the sons of Gerson by their families out of the tribe of Issachar, and out of the tribe of Aser, and out of the tribe of Nephtali, and out of the tribe of Manasses in Basan, thirteen cities.\"},{\"verse\":63,\"text\":\"And to the sons of Merari by their families out of the tribe of Ruben, and out of the tribe of Gad, and out of the tribe of Zabulon, they gave by lot twelve cities.\"},{\"verse\":64,\"text\":\"And the children of Israel gave to the Levites the cities, and their suburbs.\"},{\"verse\":65,\"text\":\"And they gave them by lot, out of the tribe of the sons of Juda, and out of the tribe of the sons of Simeon, and out of the tribe of the sons of Benjamin, these cities which they called by their names.\"},{\"verse\":66,\"text\":\"And to them that were of the kindred of the sons of Caath, and the cities in their borders were of the tribe of Ephraim.\"},{\"verse\":67,\"text\":\"And they gave the cities of refuge Sichem with its suburbs in mount Ephraim, and Gazer with its suburbs,\"},{\"verse\":68,\"text\":\"Jecmaan also with its suburbs, and Beth-horon in like manner,\"},{\"verse\":69,\"text\":\"Helon also with its suburbs, and Gethremmon in like manner,\"},{\"verse\":70,\"text\":\"And out of the half tribe of Manasses, Aner and its suburbs, Baalam and its suburbs, to wit, to them that were left of the family of the sons of Caath.\"},{\"verse\":71,\"text\":\"And to the sons of Gersom, out of the kindred of the half tribe of Manasses, Gaulon, in Basan, and its suburbs, and Astharoth with its suburbs.\"},{\"verse\":72,\"text\":\"Out of the tribe of Issachar, Cedes and its suburbs, and Dabereth with its suburbs;\"},{\"verse\":73,\"text\":\"Ramoth also and its suburbs, and Anem with its suburbs.\"},{\"verse\":74,\"text\":\"And out of the tribe of Aser: Masal with its suburbs, and Abdon in like manner;\"},{\"verse\":75,\"text\":\"Hucac also and its suburbs, and Rohol with its suburbs.\"},{\"verse\":76,\"text\":\"And out of the tribe of Nephtali, Cedes in Galilee and its suburbs, Hamon with its suburbs, and Cariathaim, and its suburbs.\"},{\"verse\":77,\"text\":\"And to the sons of Merari that remained: out of the tribe of Zabulon, Remmono and its suburbs, and Thabor with its suburbs.\"},{\"verse\":78,\"text\":\"Beyond the Jordan also over against Jericho, on the east side of the Jordan, out of the tribe of Ruben, Bosor in the wilderness with its suburbs, and Jassa with its suburbs;\"},{\"verse\":79,\"text\":\"Cademoth also and its suburbs, and Mephaath with its suburbs;\"},{\"verse\":80,\"text\":\"Moreover also out of the tribe of Gad, Ramoth in Galaad and its suburbs, and Manaim with its suburbs;\"},{\"verse\":81,\"text\":\"Hesebon also with its suburbs, and Jazer with its suburbs.\"}],\"vul\":[{\"verse\":1,\"text\":\"Filii Levi : Gerson, Caath, et Merari.\"},{\"verse\":2,\"text\":\"Filii Caath : Amram, Isaar, Hebron, et Oziel.\"},{\"verse\":3,\"text\":\"Filii Amram : Aaron, Moyses, et Maria. Filii Aaron : Nadab et Abiu, Eleazar, et Ithamar.\"},{\"verse\":4,\"text\":\"Eleazar genuit Phinees, et Phinees genuit Abisue.\"},{\"verse\":5,\"text\":\"Abisue vero genuit Bocci, et Bocci genuit Ozi.\"},{\"verse\":6,\"text\":\"Ozi genuit Zaraiam, et Zaraias genuit Meraioth.\"},{\"verse\":7,\"text\":\"Porro Meraioth genuit Amariam, et Amarias genuit Achitob.\"},{\"verse\":8,\"text\":\"Achitob genuit Sadoc, et Sadoc genuit Achimaas,\"},{\"verse\":9,\"text\":\"Achimaas genuit Azariam, Azarias genuit Johanan,\"},{\"verse\":10,\"text\":\"Johanan genuit Azariam : ipse est qui sacerdotio functus est in domo quam ædificavit Salomon in Jerusalem.\"},{\"verse\":11,\"text\":\"Genuit autem Azarias Amariam, et Amarias genuit Achitob,\"},{\"verse\":12,\"text\":\"Achitob genuit Sadoc, et Sadoc genuit Sellum,\"},{\"verse\":13,\"text\":\"Sellum genuit Helciam, et Helcias genuit Azariam,\"},{\"verse\":14,\"text\":\"Azarias genuit Saraiam, et Saraias genuit Josedec.\"},{\"verse\":15,\"text\":\"Porro Josedec egressus est, quando transtulit Dominus Judam et Jerusalem per manus Nabuchodonosor.\"},{\"verse\":16,\"text\":\"Filii ergo Levi : Gersom, Caath, et Merari.\"},{\"verse\":17,\"text\":\"Et hæc nomina filiorum Gersom : Lobni, et Semei.\"},{\"verse\":18,\"text\":\"Filii Caath : Amram, et Isaar, et Hebron, et Oziel.\"},{\"verse\":19,\"text\":\"Filii Merari : Moholi et Musi. Hæ autem cognationes Levi secundum familias eorum.\"},{\"verse\":20,\"text\":\"Gersom : Lobni filius ejus, Jahath filius ejus, Zamma filius ejus,\"},{\"verse\":21,\"text\":\"Joah filius ejus, Addo filius ejus, Zara filius ejus, Jethrai filius ejus.\"},{\"verse\":22,\"text\":\"Filii Caath : Aminadab filius ejus, Core filius ejus, Asir filius ejus,\"},{\"verse\":23,\"text\":\"Elcana filius ejus, Abiasaph filius ejus, Asir filius ejus,\"},{\"verse\":24,\"text\":\"Thahath filius ejus, Uriel filius ejus, Ozias filius ejus, Saul filius ejus.\"},{\"verse\":25,\"text\":\"Filii Elcana, Amasai et Achimoth\"},{\"verse\":26,\"text\":\"et Elcana. Filii Elcana : Sophai filius ejus, Nahath filius ejus,\"},{\"verse\":27,\"text\":\"Eliab filius ejus, Jeroham filius ejus, Elcana filius ejus.\"},{\"verse\":28,\"text\":\"Filii Samuel : primogenitus Vasseni, et Abia.\"},{\"verse\":29,\"text\":\"Filii autem Merari, Moholi : Lobni filius ejus, Semei filius ejus, Oza filius ejus,\"},{\"verse\":30,\"text\":\"Sammaa filius ejus, Haggia filius ejus, Asaia filius ejus.\"},{\"verse\":31,\"text\":\"Isti sunt quos constituit David super cantores domus Domini, ex quo collocata est arca :\"},{\"verse\":32,\"text\":\"et ministrabant coram tabernaculo testimonii, canentes donec ædificaret Salomon domum Domini in Jerusalem : stabant autem juxta ordinem suum in ministerio.\"},{\"verse\":33,\"text\":\"Hi vero sunt qui assistebant cum filiis suis, de filiis Caath, Hemam cantor filius Johel, filii Samuel,\"},{\"verse\":34,\"text\":\"filii Elcana, filii Jeroham, filii Eliel, filii Thohu,\"},{\"verse\":35,\"text\":\"filii Suph, filii Elcana, filii Mahath, filii Amasai,\"},{\"verse\":36,\"text\":\"filii Elcana, filii Johel, filii Azariæ, filii Sophoniæ,\"},{\"verse\":37,\"text\":\"filii Thahath, filii Asir, filii Abiasaph, filii Core,\"},{\"verse\":38,\"text\":\"filii Isaar, filii Caath, filii Levi, filii Israël.\"},{\"verse\":39,\"text\":\"Et frater ejus Asaph, qui stabat a dextris ejus, Asaph filius Barachiæ, filii Samaa,\"},{\"verse\":40,\"text\":\"filii Michaël, filii Basaiæ, filii Melchiæ,\"},{\"verse\":41,\"text\":\"filii Athanai, filii Zara, filii Adaia,\"},{\"verse\":42,\"text\":\"filii Ethan, filii Zamma, filii Semei,\"},{\"verse\":43,\"text\":\"filii Jeth, filii Gersom, filii Levi.\"},{\"verse\":44,\"text\":\"Filii autem Merari fratres eorum, ad sinistram, Ethan filius Cusi, filii Abdi, filii Maloch,\"},{\"verse\":45,\"text\":\"filii Hasabiæ, filii Amasiæ, filii Helciæ,\"},{\"verse\":46,\"text\":\"filii Amasai, filii Boni, filii Somer,\"},{\"verse\":47,\"text\":\"filii Moholi, filii Musi, filii Merari, filii Levi.\"},{\"verse\":48,\"text\":\"Fratres quoque eorum Levitæ, qui ordinati sunt in cunctum ministerium tabernaculi domus Domini.\"},{\"verse\":49,\"text\":\"Aaron vero et filii ejus adolebant incensum super altare holocausti, et super altare thymiamatis, in omne opus Sancti sanctorum : et ut precarentur pro Israël juxta omnia quæ præceperat Moyses servus Dei.\"},{\"verse\":50,\"text\":\"Hi sunt autem filii Aaron : Eleazar filius ejus, Phinees filius ejus, Abisue filius ejus,\"},{\"verse\":51,\"text\":\"Bocci filius ejus, Ozi filius ejus, Zarahia filius ejus,\"},{\"verse\":52,\"text\":\"Meraioth filius ejus, Amarias filius ejus, Achitob filius ejus,\"},{\"verse\":53,\"text\":\"Sadoc filius ejus, Achimaas filius ejus.\"},{\"verse\":54,\"text\":\"Et hæc habitacula eorum per vicos atque confinia, filiorum scilicet Aaron, juxta cognationes Caathitarum : ipsis enim sorte contigerant.\"},{\"verse\":55,\"text\":\"Dederunt igitur eis Hebron in terra Juda, et suburbana ejus per circuitum :\"},{\"verse\":56,\"text\":\"agros autem civitatis, et villas, Caleb filio Jephone.\"},{\"verse\":57,\"text\":\"Porro filiis Aaron dederunt civitates ad confugiendum Hebron, et Lobna, et suburbana ejus,\"},{\"verse\":58,\"text\":\"Jether quoque, et Esthemo cum suburbanis suis, sed et Helon, et Dabir cum suburbanis suis,\"},{\"verse\":59,\"text\":\"Asan quoque, et Bethsemes, et suburbana earum.\"},{\"verse\":60,\"text\":\"De tribu autem Benjamin, Gabee et suburbana ejus, et Almath cum suburbanis suis, Anathoth quoque cum suburbanis suis : omnes civitates, tredecim, per cognationes suas.\"},{\"verse\":61,\"text\":\"Filiis autem Caath residuis de cognatione sua dederunt ex dimidia tribu Manasse in possessionem urbes decem.\"},{\"verse\":62,\"text\":\"Porro filiis Gersom per cognationes suas de tribu Issachar, et de tribu Aser, et de tribu Nephthali, et de tribu Manasse in Basan, urbes tredecim.\"},{\"verse\":63,\"text\":\"Filiis autem Merari per cognationes suas de tribu Ruben, et de tribu Gad, et de tribu Zabulon, dederunt sorte civitates duodecim.\"},{\"verse\":64,\"text\":\"Dederunt quoque filii Israël Levitis civitates, et suburbana earum :\"},{\"verse\":65,\"text\":\"dederuntque per sortem, ex tribu filiorum Juda, et ex tribu filiorum Simeon, et ex tribu filiorum Benjamin urbes has, quas vocaverunt nominibus suis,\"},{\"verse\":66,\"text\":\"et his, qui erant de cognatione filiorum Caath, fueruntque civitates in terminis eorum de tribu Ephraim.\"},{\"verse\":67,\"text\":\"Dederunt ergo eis urbes ad confugiendum, Sichem cum suburbanis suis in monte Ephraim, et Gazer cum suburbanis suis,\"},{\"verse\":68,\"text\":\"Jecmaam quoque cum suburbanis suis, et Bethoron similiter,\"},{\"verse\":69,\"text\":\"necnon et Helon cum suburbanis suis, et Gethremmon in eumdem modum.\"},{\"verse\":70,\"text\":\"Porro ex dimidia tribu Manasse, Aner et suburbana ejus, Balaam et suburbana ejus : his videlicet, qui de cognatione filiorum Caath reliqui erant.\"},{\"verse\":71,\"text\":\"Filiis autem Gersom de cognatione dimidiæ tribus Manasse, Gaulon in Basan, et suburbana ejus, et Astaroth cum suburbanis suis.\"},{\"verse\":72,\"text\":\"De tribu Issachar, Cedes et suburbanis suis, et Dabereth cum suburbanis suis,\"},{\"verse\":73,\"text\":\"Ramoth quoque et suburbana ejus, et Anem cum suburbanis suis.\"},{\"verse\":74,\"text\":\"De tribu vero Aser : Masal cum suburbanis suis, et Abdon similiter,\"},{\"verse\":75,\"text\":\"Hucac quoque et suburbana ejus, et Rohob cum suburbanis suis.\"},{\"verse\":76,\"text\":\"Porro de tribu Nephthali, Cedes in Galilæa et suburbana ejus, Hamon cum suburbanis suis, et Cariathaim et suburbana ejus.\"},{\"verse\":77,\"text\":\"Filiis autem Merari residuis : de tribu Zabulon, Remmono et suburbana ejus, et Thabor cum suburbanis sus :\"},{\"verse\":78,\"text\":\"trans Jordanem quoque ex adverso Jericho contra orientem Jordanis, de tribu Ruben, Bosor in solitudine cum suburbanis suis, et Jassa cum suburbanis suis,\"},{\"verse\":79,\"text\":\"Cademoth quoque et suburbana ejus, et Mephaat cum suburbanis suis.\"},{\"verse\":80,\"text\":\"Necnon et de tribu Gad, Ramoth in Galaad et suburbana ejus, et Manaim cum suburbanis suis,\"},{\"verse\":81,\"text\":\"sed et Hesebon cum suburbanis suis, et Jezer cum suburbanis suis.\"}],\"summary\":\"The genealogies of Levi, and of Aaron: the cities of the Levites.\",\"intro\":null,\"prev\":{\"usfm\":\"1CH\",\"chapter\":5,\"label\":\"1 Chronicles 5\"},\"next\":{\"usfm\":\"1CH\",\"chapter\":7,\"label\":\"1 Chronicles 7\"}}]]\n"])</script></body></html>
