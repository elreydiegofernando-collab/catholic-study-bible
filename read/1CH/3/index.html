 of Abigail the Carmelitess.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The third Absalom the son of Maacha the daughter of Tolmai king of Gessur, the fourth Adonias the son of Aggith,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The fifth Saphatias of Abital, the sixth Jethrahem of Egla his wife.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>So six sons were born to him in Hebron, where he reigned seven years and six months. And in Jerusalem he reigned three and thirty years.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And these sons were born to him in Jerusalem: Simmaa, and Sobab, and Nathan, and Solomon, four of Bethsabee the daughter of Ammiel.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Jebaar also and Elisama,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And Eliphaleth, and Noge, and Nepheg, and Japhia,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Elisama, and Eliada, and Elipheleth, nine:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>All these the sons of David, beside the sons of the concubines: and they had a sister Thamar.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Solomon’s son was Roboam: whose son Abia begot Asa. And his son was Josaphat,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The father of Joram: and Joram begot Ochozias, of whom was born Joas:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And his son Amasias begot Azarias. And Joathan the son of Azarias</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Begot Achaz, the father of Ezechias, of whom was born Manasses.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Manasses begot Amon the father of Josias.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the sons of Josias were, the firstborn Johanan, the second Joakim, the third Sedecias, the fourth Sellum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Of Joakim was born Jechonias, and Sedecias.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The sons of Jechonias were Asir, Salathiel,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Melchiram, Phadaia, Senneser and Jecemia, Sama, and Nadabia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Of Phadaia were born Zorobabel and Semei. Zorobabel begot Mosollam, Hananias, and Salomith their sister:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hasaba also, and Ohol, and Barachias, and Hasadias, Josabhesed, five.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the son of Hananias was Phaltias the father of Jeseias, whose son was Raphaia. And his son was Arnan, of whom was born Obdia, whose son was Sechenias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The son of Sechenias was Semeia, whose sons were Hattus, and Jegaal, and Baria, and Naaria, and Saphat, six in number.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The sons of Naaria, Elioenai, and Ezechias, and Ezricam, three.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The sons of Elioenai, Oduia, and Eliasub, and Pheleia, and Accub, and Johanan, and Dalaia, and Anani, seven.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>David vero hos habuit filios, qui ei nati sunt in Hebron : primogenitum Amnon ex Achinoam Jezrahelitide, secundum Daniel de Abigail Carmelitide,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>tertium Absalom filium Maacha filiæ Tholmai regis Gessur, quartum Adoniam filium Aggith,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>quintum Saphathiam ex Abital, sextum Jethraham de Egla uxore sua.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sex ergo nati sunt ei in Hebron, ubi regnavit septem annis et sex mensibus. Triginta autem et tribus annis regnavit in Jerusalem.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Porro in Jerusalem nati sunt ei filii, Simmaa, et Sobab, et Nathan, et Salomon, quatuor de Bethsabee filia Ammiel :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Jebaar quoque et Elisama,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et Eliphaleth, et Noge, et Nepheg, et Japhia,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>necnon Elisama, et Eliada, et Elipheleth, novem :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>omnes hi, filii David absque filiis concubinarum : habueruntque sororem Thamar.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Filius autem Salomonis, Roboam : cujus Abia filius genuit Asa. De hoc quoque natus est Josaphat,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>pater Joram : qui Joram genuit Ochoziam, ex quo ortus est Joas :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et hujus Amasias filius genuit Azariam. Porro Azariæ filius Joatham</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>procreavit Achaz patrem Ezechiæ, de quo natus est Manasses.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Sed et Manasses genuit Amon patrem Josiæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Filii autem Josiæ fuerunt : primogenitus Johanan, secundus Joakim, tertius Sedecias, quartus Sellum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>De Joakim natus est Jechonias, et Sedecias.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Filii Jechoniæ fuerunt : Asir, Salathiel,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Melchiram, Phadaia, Senneser, et Jecemia, Sama, et Nadabia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>De Phadaia orti sunt Zorobabel et Semei. Zorobabel genuit Mosollam, Hananiam, et Salomith sororem eorum :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hasaban quoque, et Ohol, et Barachian, et Hasadian, Josabhesed, quinque.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Filius autem Hananiæ, Phaltias pater Jeseiæ, cujus filius Raphaia : hujus quoque filius, Arnan, de quo natus est Obdia, cujus filius fuit Sechenias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Filius Secheniæ, Semeia : cujus filii Hattus, et Jegaal, et Baria, et Naaria, et Saphat, sex numero.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Filius Naariæ, Elioënai, et Ezechias, et Ezricam, tres.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Filii Elioënai, Oduia, et Eliasub, et Pheleia, et Accub, et Johanan, et Dalaia, et Anani, septem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CH/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">1 Chronicles 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/1CH/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">1 Chronicles 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->29<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 1 Chronicles 2" class="inline-flex h-12 w-14 shrink-0 it ,[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"1CH.3\",{\"bookId\":13,\"usfm\":\"1CH\",\"bookName\":\"1 Chronicles\",\"drName\":\"1 Paralipomenon\",\"chapter\":3,\"totalChapters\":29,\"dra\":[{\"verse\":1,\"text\":\"Now these were the sons of David that were born to him in Hebron: the firstborn Amnon of Achinoam the Jezrahelitess, the second Daniel of Abigail the Carmelitess.\"},{\"verse\":2,\"text\":\"The third Absalom the son of Maacha the daughter of Tolmai king of Gessur, the fourth Adonias the son of Aggith,\"},{\"verse\":3,\"text\":\"The fifth Saphatias of Abital, the sixth Jethrahem of Egla his wife.\"},{\"verse\":4,\"text\":\"So six sons were born to him in Hebron, where he reigned seven years and six months. And in Jerusalem he reigned three and thirty years.\"},{\"verse\":5,\"text\":\"And these sons were born to him in Jerusalem: Simmaa, and Sobab, and Nathan, and Solomon, four of Bethsabee the daughter of Ammiel.\"},{\"verse\":6,\"text\":\"Jebaar also and Elisama,\"},{\"verse\":7,\"text\":\"And Eliphaleth, and Noge, and Nepheg, and Japhia,\"},{\"verse\":8,\"text\":\"And Elisama, and Eliada, and Elipheleth, nine:\"},{\"verse\":9,\"text\":\"All these the sons of David, beside the sons of the concubines: and they had a sister Thamar.\"},{\"verse\":10,\"text\":\"And Solomon’s son was Roboam: whose son Abia begot Asa. And his son was Josaphat,\"},{\"verse\":11,\"text\":\"The father of Joram: and Joram begot Ochozias, of whom was born Joas:\"},{\"verse\":12,\"text\":\"And his son Amasias begot Azarias. And Joathan the son of Azarias\"},{\"verse\":13,\"text\":\"Begot Achaz, the father of Ezechias, of whom was born Manasses.\"},{\"verse\":14,\"text\":\"And Manasses begot Amon the father of Josias.\"},{\"verse\":15,\"text\":\"And the sons of Josias were, the firstborn Johanan, the second Joakim, the third Sedecias, the fourth Sellum.\"},{\"verse\":16,\"text\":\"Of Joakim was born Jechonias, and Sedecias.\"},{\"verse\":17,\"text\":\"The sons of Jechonias were Asir, Salathiel,\"},{\"verse\":18,\"text\":\"Melchiram, Phadaia, Senneser and Jecemia, Sama, and Nadabia.\"},{\"verse\":19,\"text\":\"Of Phadaia were born Zorobabel and Semei. Zorobabel begot Mosollam, Hananias, and Salomith their sister:\"},{\"verse\":20,\"text\":\"Hasaba also, and Ohol, and Barachias, and Hasadias, Josabhesed, five.\"},{\"verse\":21,\"text\":\"And the son of Hananias was Phaltias the father of Jeseias, whose son was Raphaia. And his son was Arnan, of whom was born Obdia, whose son was Sechenias.\"},{\"verse\":22,\"text\":\"The son of Sechenias was Semeia, whose sons were Hattus, and Jegaal, and Baria, and Naaria, and Saphat, six in number.\"},{\"verse\":23,\"text\":\"The sons of Naaria, Elioenai, and Ezechias, and Ezricam, three.\"},{\"verse\":24,\"text\":\"The sons of Elioenai, Oduia, and Eliasub, and Pheleia, and Accub, and Johanan, and Dalaia, and Anani, seven.\"}],\"vul\":[{\"verse\":1,\"text\":\"David vero hos habuit filios, qui ei nati sunt in Hebron : primogenitum Amnon ex Achinoam Jezrahelitide, secundum Daniel de Abigail Carmelitide,\"},{\"verse\":2,\"text\":\"tertium Absalom filium Maacha filiæ Tholmai regis Gessur, quartum Adoniam filium Aggith,\"},{\"verse\":3,\"text\":\"quintum Saphathiam ex Abital, sextum Jethraham de Egla uxore sua.\"},{\"verse\":4,\"text\":\"Sex ergo nati sunt ei in Hebron, ubi regnavit septem annis et sex mensibus. Triginta autem et tribus annis regnavit in Jerusalem.\"},{\"verse\":5,\"text\":\"Porro in Jerusalem nati sunt ei filii, Simmaa, et Sobab, et Nathan, et Salomon, quatuor de Bethsabee filia Ammiel :\"},{\"verse\":6,\"text\":\"Jebaar quoque et Elisama,\"},{\"verse\":7,\"text\":\"et Eliphaleth, et Noge, et Nepheg, et Japhia,\"},{\"verse\":8,\"text\":\"necnon Elisama, et Eliada, et Elipheleth, novem :\"},{\"verse\":9,\"text\":\"omnes hi, filii David absque filiis concubinarum : habueruntque sororem Thamar.\"},{\"verse\":10,\"text\":\"Filius autem Salomonis, Roboam : cujus Abia filius genuit Asa. De hoc quoque natus est Josaphat,\"},{\"verse\":11,\"text\":\"pater Joram : qui Joram genuit Ochoziam, ex quo ortus est Joas :\"},{\"verse\":12,\"text\":\"et hujus Amasias filius genuit Azariam. Porro Azariæ filius Joatham\"},{\"verse\":13,\"text\":\"procreavit Achaz patrem Ezechiæ, de quo natus est Manasses.\"},{\"verse\":14,\"text\":\"Sed et Manasses genuit Amon patrem Josiæ.\"},{\"verse\":15,\"text\":\"Filii autem Josiæ fuerunt : primogenitus Johanan, secundus Joakim, tertius Sedecias, quartus Sellum.\"},{\"verse\":16,\"text\":\"De Joakim natus est Jechonias, et Sedecias.\"},{\"verse\":17,\"text\":\"Filii Jechoniæ fuerunt : Asir, Salathiel,\"},{\"verse\":18,\"text\":\"Melchiram, Phadaia, Senneser, et Jecemia, Sama, et Nadabia.\"},{\"verse\":19,\"text\":\"De Phadaia orti sunt Zorobabel et Semei. Zorobabel genuit Mosollam, Hananiam, et Salomith sororem eorum :\"},{\"verse\":20,\"text\":\"Hasaban quoque, et Ohol, et Barachian, et Hasadian, Josabhesed, quinque.\"},{\"verse\":21,\"text\":\"Filius autem Hananiæ, Phaltias pater Jeseiæ, cujus filius Raphaia : hujus quoque filius, Arnan, de quo natus est Obdia, cujus filius fuit Sechenias.\"},{\"verse\":22,\"text\":\"Filius Secheniæ, Semeia : cujus filii Hattus, et Jegaal, et Baria, et Naaria, et Saphat, sex numero.\"},{\"verse\":23,\"text\":\"Filius Naariæ, Elioënai, et Ezechias, et Ezricam, tres.\"},{\"verse\":24,\"text\":\"Filii Elioënai, Oduia, et Eliasub, et Pheleia, et Accub, et Johanan, et Dalaia, et Anani, septem.\"}],\"summary\":\"The genealogy of the house of David.\",\"intro\":null,\"prev\":{\"usfm\":\"1CH\",\"chapter\":2,\"label\":\"1 Chronicles 2\"},\"next\":{\"usfm\":\"1CH\",\"chapter\":4,\"label\":\"1 Chronicles 4\"}}]]\n"])</script></body></html>
