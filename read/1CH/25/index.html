="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Moreover David and the chief officers of the army separated for the ministry the sons of Asaph, and of Heman, and of Idithun: to prophesy with harps, and with psalteries, and with cymbals according to their number serving in their appointed office.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Of the sons of Asaph: Zacchur, and Joseph, and Nathania, and Asarela, sons of Asaph: under the hand of Asaph prophesying near the king.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And of Idithun: the sons of Idithun, Godolias, Sori, Jeseias, and Hasabias, and Mathathias, six, under the hand of their father Idithun, who prophesied with a harp to give thanks and to praise the Lord.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Of Heman also: the sons of Heman, Bocciau, Mathaniau, Oziel, Subuel, and Jerimoth, Hananias, Hanani, Eliatha, Geddelthi, and Romemthiezer, and Jesbacassa, Mellothi, Othir, Mahazioth:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>All these were the sons of Heman the seer of the king in the words of God, to lift up the horn: and God gave to Heman fourteen sons and three daughters.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>All these under their father’s hand were distributed to sing in the temple of the Lord, with cymbals, and psalteries and harps, for the service of the house of the Lord near the king: to wit, Asaph, and Idithun, and Heman.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the number of them with their brethren, that taught the song of the Lord, all the teachers, were two hundred and eighty-eight.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they cast lots by their courses, the elder equally with the younger, the learned and the unlearned together.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the first lot came forth to Joseph, who was of Asaph. The second to Godolias, to him and his sons, and his brethren twelve.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The third to Zachur, to his sons and his brethren twelve.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The fourth to Isari, to his sons and his brethren twelve.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The fifth to Nathania, to his sons and his brethren twelve.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The sixth to Bocciau, to his sons and his brethren twelve.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The seventh to Isreela, to his sons and his brethren twelve.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The eighth to Jesaia, to his sons and his brethren twelve.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The ninth to Mathanaias, to his sons and his brethren twelve.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The tenth to Semeias, to his sons and his brethren twelve.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The eleventh to Azareel, to his sons and his brethren twelve.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The twelfth to Hasabia, to his sons and his brethren twelve.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The thirteenth to Subael, to his sons and his brethren twelve.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The fourteenth to Mathathias, to his sons and his brethren twelve.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The fifteenth to Jerimoth, to his sons and his brethren twelve.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The sixteenth to Hananias, to his sons and his brethren twelve.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The seventeenth to Jesbacassa, to his sons and his brethren twelve.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The eighteenth to Hanani, to his sons and his brethren twelve.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The nineteenth to Mellothi, to his sons and his brethren twelve.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The twentieth to Eliatha, to his sons and his brethren twelve.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The one and twentieth to Othir, to his sons and his brethren twelve.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The two and twentieth to Geddelthi, to his sons and his brethren twelve.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The three and twentieth to Mahazioth, to his sons and his brethren twelve.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The four and twentieth to Romemthiezer, to his sons and his brethren twelve.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button typ ording to their number serving in their appointed office.\"},{\"verse\":2,\"text\":\"Of the sons of Asaph: Zacchur, and Joseph, and Nathania, and Asarela, sons of Asaph: under the hand of Asaph prophesying near the king.\"},{\"verse\":3,\"text\":\"And of Idithun: the sons of Idithun, Godolias, Sori, Jeseias, and Hasabias, and Mathathias, six, under the hand of their father Idithun, who prophesied with a harp to give thanks and to praise the Lord.\"},{\"verse\":4,\"text\":\"Of Heman also: the sons of Heman, Bocciau, Mathaniau, Oziel, Subuel, and Jerimoth, Hananias, Hanani, Eliatha, Geddelthi, and Romemthiezer, and Jesbacassa, Mellothi, Othir, Mahazioth:\"},{\"verse\":5,\"text\":\"All these were the sons of Heman the seer of the king in the words of God, to lift up the horn: and God gave to Heman fourteen sons and three daughters.\"},{\"verse\":6,\"text\":\"All these under their father’s hand were distributed to sing in the temple of the Lord, with cymbals, and psalteries and harps, for the service of the house of the Lord near the king: to wit, Asaph, and Idithun, and Heman.\"},{\"verse\":7,\"text\":\"And the number of them with their brethren, that taught the song of the Lord, all the teachers, were two hundred and eighty-eight.\"},{\"verse\":8,\"text\":\"And they cast lots by their courses, the elder equally with the younger, the learned and the unlearned together.\"},{\"verse\":9,\"text\":\"And the first lot came forth to Joseph, who was of Asaph. The second to Godolias, to him and his sons, and his brethren twelve.\"},{\"verse\":10,\"text\":\"The third to Zachur, to his sons and his brethren twelve.\"},{\"verse\":11,\"text\":\"The fourth to Isari, to his sons and his brethren twelve.\"},{\"verse\":12,\"text\":\"The fifth to Nathania, to his sons and his brethren twelve.\"},{\"verse\":13,\"text\":\"The sixth to Bocciau, to his sons and his brethren twelve.\"},{\"verse\":14,\"text\":\"The seventh to Isreela, to his sons and his brethren twelve.\"},{\"verse\":15,\"text\":\"The eighth to Jesaia, to his sons and his brethren twelve.\"},{\"verse\":16,\"text\":\"The ninth to Mathanaias, to his sons and his brethren twelve.\"},{\"verse\":17,\"text\":\"The tenth to Semeias, to his sons and his brethren twelve.\"},{\"verse\":18,\"text\":\"The eleventh to Azareel, to his sons and his brethren twelve.\"},{\"verse\":19,\"text\":\"The twelfth to Hasabia, to his sons and his brethren twelve.\"},{\"verse\":20,\"text\":\"The thirteenth to Subael, to his sons and his brethren twelve.\"},{\"verse\":21,\"text\":\"The fourteenth to Mathathias, to his sons and his brethren twelve.\"},{\"verse\":22,\"text\":\"The fifteenth to Jerimoth, to his sons and his brethren twelve.\"},{\"verse\":23,\"text\":\"The sixteenth to Hananias, to his sons and his brethren twelve.\"},{\"verse\":24,\"text\":\"The seventeenth to Jesbacassa, to his sons and his brethren twelve.\"},{\"verse\":25,\"text\":\"The eighteenth to Hanani, to his sons and his brethren twelve.\"},{\"verse\":26,\"text\":\"The nineteenth to Mellothi, to his sons and his brethren twelve.\"},{\"verse\":27,\"text\":\"The twentieth to Eliatha, to his sons and his brethren twelve.\"},{\"verse\":28,\"text\":\"The one and twentieth to Othir, to his sons and his brethren twelve.\"},{\"verse\":29,\"text\":\"The two and twentieth to Geddelthi, to his sons and his brethren twelve.\"},{\"verse\":30,\"text\":\"The three and twentieth to Mahazioth, to his sons and his brethren twelve.\"},{\"verse\":31,\"text\":\"The four and twentieth to Romemthiezer, to his sons and his brethren twelve.\"}],\"vul\":[{\"verse\":1,\"text\":\"Igitur David et magistratus exercitus segregaverunt in ministerium filios Asaph, et Heman, et Idithun, qui prophetarent in citharis, et psalteriis, et cymbalis secundum numerum suum, dedicato sibi officio servientes.\"},{\"verse\":2,\"text\":\"De filiis Asaph : Zachur, et Joseph, et Nathania, et Asarela, filii Asaph : sub manu Asaph prophetantis juxta regem.\"},{\"verse\":3,\"text\":\"Porro Idithun : filii Idithun, Godolias, Sori, Jeseias, et Hasabias, et Mathathias, sex, sub manu patris sui Idithun, qui in cithara prophetabat super confitentes et laudantes Dominum.\"},{\"verse\":4,\"text\":\"Heman quoque : filii Heman, Bocciau, Mathaniau, Oziel, Subuel, et Jerimoth, Hananias, Hanani, Eliatha, Geddelthi, et Romemthiezer, et Jesbacassa, Mellothi, Othir, Mahazioth :\"},{\"verse\":5,\"text\":\"omnes isti filii Heman videntis regis in sermonibus Dei, ut exaltaret cornu : deditque Deus Heman filios quatuordecim, et filias tres.\"},{\"verse\":6,\"text\":\"Universi sub manu patris sui ad cantandum in templo Domini distributi erant, in cymbalis, et psalteriis, et citharis, in ministeria domus Domini juxta regem : Asaph videlicet, et Idithun, et Heman.\"},{\"verse\":7,\"text\":\"Fuit autem numerus eorum cum fratribus suis, qui erudiebant canticum Domini, cuncti doctores, ducenti octoginta octo.\"},{\"verse\":8,\"text\":\"Miseruntque sortes per vices suas, ex æquo tam major quam minor, doctus pariter et indoctus.\"},{\"verse\":9,\"text\":\"Egressaque est sors prima Joseph, qui erat de Asaph. Secunda Godoliæ, ipsi et filiis ejus, et fratribus ejus duodecim.\"},{\"verse\":10,\"text\":\"Tertia Zachur, filiis et fratribus ejus duodecim.\"},{\"verse\":11,\"text\":\"Quarta Isari, filiis et fratribus ejus duodecim.\"},{\"verse\":12,\"text\":\"Quinta Nathaniæ, filiis et fratribus ejus duodecim.\"},{\"verse\":13,\"text\":\"Sexta Bocciau, filiis et fratribus ejus duodecim.\"},{\"verse\":14,\"text\":\"Septima Isreela, filiis et fratribus ejus duodecim.\"},{\"verse\":15,\"text\":\"Octava Jesaiæ, filiis et fratribus ejus duodecim.\"},{\"verse\":16,\"text\":\"Nona Mathaniæ, filiis et fratribus ejus duodecim.\"},{\"verse\":17,\"text\":\"Decima Semeiæ, filiis et fratribus ejus duodecim.\"},{\"verse\":18,\"text\":\"Undecima Azareel, filiis et fratribus ejus duodecim.\"},{\"verse\":19,\"text\":\"Duodecima Hasabiæ, filiis et fratribus ejus duodecim.\"},{\"verse\":20,\"text\":\"Tertiadecima Subaël, filiis et fratribus ejus duodecim.\"},{\"verse\":21,\"text\":\"Quartadecima Mathathiæ, filiis et fratribus ejus duodecim.\"},{\"verse\":22,\"text\":\"Quintadecima Jerimoth, filiis et fratribus ejus duodecim.\"},{\"verse\":23,\"text\":\"Sextadecima Hananiæ, filiis et fratribus ejus duodecim.\"},{\"verse\":24,\"text\":\"Septimadecima Jesbacassæ, filiis et fratribus ejus duodecim.\"},{\"verse\":25,\"text\":\"Octavadecima Hanani, filiis et fratribus ejus duodecim.\"},{\"verse\":26,\"text\":\"Nonadecima Mellothi, filiis et fratribus ejus duodecim.\"},{\"verse\":27,\"text\":\"Vigesima Eliatha, filiis et fratribus ejus duodecim.\"},{\"verse\":28,\"text\":\"Vigesima prima Othir, filiis et fratribus ejus duodecim.\"},{\"verse\":29,\"text\":\"Vigesima secunda Geddelthi, filiis et fratribus ejus duodecim.\"},{\"verse\":30,\"text\":\"Vigesima tertia Mahazioth, filiis et fratribus ejus duodecim.\"},{\"verse\":31,\"text\":\"Vigesima quarta Romemthiezer, filiis et fratribus ejus duodecim.\"}],\"summary\":\"The number and divisions of the musicians.\",\"intro\":null,\"prev\":{\"usfm\":\"1CH\",\"chapter\":24,\"label\":\"1 Chronicles 24\"},\"next\":{\"usfm\":\"1CH\",\"chapter\":26,\"label\":\"1 Chronicles 26\"}}]]\n"])</script></body></html>
