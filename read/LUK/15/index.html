 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">15</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parables of the lost sheep and of the prodigal son.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the publicans and sinners drew near unto him to hear him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the Pharisees and the scribes murmured, saying: This man receiveth sinners and eateth with them.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he spoke to them this parable, saying:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>What man of you that hath an hundred sheep, and if he shall lose one of them, doth he not leave the ninety-nine in the desert and go after that which was lost, until he find it?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when he hath found it, lay it upon his shoulders, rejoicing?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And coming home, call together his friends and neighbours, saying to them: Rejoice with me, because I have found my sheep that was lost?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I say to you that even so there shall be joy in heaven upon one sinner that doth penance, more than upon ninety-nine just who need not penance.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Or what woman having ten groats, if she lose one groat, doth not light a candle and sweep the house and seek diligently until she find it?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when she hath found it, call together her friends and neighbours, saying: Rejoice with me, because I have found the groat which I had lost.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>So I say to you, there shall be joy before the angels of God upon one sinner doing penance.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he said: A certain man had two sons.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the younger of them said to his father: Father, give me the portion of substance that falleth to me. And he divided unto them his substance.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And not many days after, the younger son, gathering all together, went abroad into a far country: and there wasted his substance, living riotously.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And after he had spent all, there came a mighty famine in that country: and he began to be in want.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he went and cleaved to one of the citizens of that country. And he sent him into his farm to feed swine.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he would fain have filled his belly with the husks the swine did eat: and no man gave unto him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And returning to himself, he said: How many hired servants in my father’s house abound with bread, and I here perish with hunger!</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will arise and will go to my father and say to him: Father, I have sinned against heaven and before thee.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I am not worthy to be called thy son: make me as one of thy hired servants.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And rising up, he came to his father. And when he was yet a great way off, his father saw him and was moved with compassion and running to him fell upon his neck and kissed him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the son said to him: Father: I have sinned against heaven and before thee I am not now worthy to be called thy son.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the father said to his servants: Bring forth quickly the first robe and put it on him: and put a ring on his hand and shoes on his feet.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And bring hither the fatted calf, and kill it: and let us eat and make merry:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Because this my son was dead and is come to life again, was lost and is found. And they began to be merry.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Now his elder son was in the field and when he came and drew nigh to the house, he heard music and dancing.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And he called one of the servants, and asked what these things meant.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he said to him: Thy brother is come and thy father hath killed the fatted calf, because he hath received him safe.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he was angry and would not go in. His father therefore coming out began to entreat him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And he answering, said to his father: Behold, for so many years do I serve thee and I have never transgressed thy commandment: and yet thou hast never given me a kid to make merry with my friends.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But as soon as this thy son is come, who hath devoured his substance with harlots, thou hast killed for him the fatted calf.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But he said to him: Son, thou art always with me; and all I have is thine.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But it was fit that we should make merry and be glad: for this thy brother was dead and is come to life again; he was lost, and is found.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erant autem appropinquantes ei publicani, et peccatores ut audirent illum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et murmurabant pharisæi, et scribæ, dicentes : Quia hic peccatores recipit, et manducat cum illis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ait ad illos parabolam istam dicens :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quis ex vobis homo, qui habet centum oves, et si perdiderit unam ex illis, nonne dimittit nonaginta novem in deserto, et vadit ad illam quæ perierat, donec inveniat eam ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et cum invenerit eam, imponit in humeros suos gaudens :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et veniens domum convocat amicos et vicinos, dicens illis : Congratulamini mihi, quia inveni ovem meam, quæ perierat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dico vobis quod ita gaudium erit in cælo super uno peccatore pœnitentiam agente, quam super nonaginta novem justis, qui non indigent pœnitentia.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Aut quæ mulier habens drachmas decem, si perdiderit drachmam unam, nonne accendit lucernam, et everrit domum, et quærit diligenter, donec inveniat ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et cum invenerit convocat amicas et vicinas, dicens : Congratulamini mihi, quia inveni drachmam quam perdideram.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ita, dico vobis, gaudium erit coram angelis Dei super uno peccatore pœnitentiam agente.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ait autem : Homo quidam habuit duos filios :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et dixit adolescentior ex illis patri : Pater, da mihi portionem substantiæ, quæ me contingit. Et divisit illis substantiam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et non post multos dies, congregatis omnibus, adolescentior filius peregre profectus est in regionem longinquam, et ibi dissipavit substantiam suam vivendo luxuriose.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et postquam omnia consummasset, facta est fames valida in regione illa, et ipse cœpit egere.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et abiit, et adhæsit uni civium regionis illius : et misit illum in villam suam ut pasceret porcos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et cupiebat implere ventrem suum de siliquis, quas porci manducabant : et nemo illi dabat.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>In se autem reversus, dixit : Quanti mercenarii in domo patris mei abundant panibus, ego autem hic fame pereo !</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>surgam, et ibo ad patrem meum, et dicam ei : Pater, peccavi in cælum, et coram te :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>jam non sum dignus vocari filius tuus : fac me sicut unum de mercenariis tuis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et surgens venit ad patrem suum. Cum autem adhuc longe esset, vidit illum pater ipsius, et misericordia motus est, et accurrens cecidit super collum ejus, et osculatus est eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dixitque ei filius : Pater, peccavi in cælum, et coram te : jam non sum dignus vocari filius tuus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dixit autem pater ad servos suos : Cito proferte stolam primam, et induite illum, et date annulum in manum ejus, et calceamenta in pedes ejus :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et adducite vitulum saginatum, et occidite, et manducemus, et epulemur :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>quia hic filius meus mortuus erat, et revixit : perierat, et inventus est. Et cœperunt epulari.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Erat autem filius ejus senior in agro : et cum veniret, et appropinquaret domui, audivit symphoniam et chorum :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et vocavit unum de servis, et interrogavit quid hæc essent.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Isque dixit illi : Frater tuus venit, et occidit pater tuus vitulum saginatum, quia salvum illum recepit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Indignatus est autem, et nolebat introire. Pater ergo illius egressus, cœpit rogare illum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>At ille respondens, dixit patri suo : Ecce tot annis servio tibi, et numquam mandatum tuum præterivi : et numquam dedisti mihi hædum ut cum amicis meis epularer.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Sed postquam filius tuus hic, qui devoravit substantiam suam cum meretricibus, venit, occidisti illi vitulum saginatum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>At ipse dixit illi : Fili, tu semper mecum es, et omnia mea tua sunt :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>epulari autem, et gaudere oportebat, quia frater tuus hic mortuus erat, et revixit ; perierat, et inventus est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/14/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 14</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/16/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 16</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class e, because I have found the groat which I had lost.\"},{\"verse\":10,\"text\":\"So I say to you, there shall be joy before the angels of God upon one sinner doing penance.\"},{\"verse\":11,\"text\":\"And he said: A certain man had two sons.\"},{\"verse\":12,\"text\":\"And the younger of them said to his father: Father, give me the portion of substance that falleth to me. And he divided unto them his substance.\"},{\"verse\":13,\"text\":\"And not many days after, the younger son, gathering all together, went abroad into a far country: and there wasted his substance, living riotously.\"},{\"verse\":14,\"text\":\"And after he had spent all, there came a mighty famine in that country: and he began to be in want.\"},{\"verse\":15,\"text\":\"And he went and cleaved to one of the citizens of that country. And he sent him into his farm to feed swine.\"},{\"verse\":16,\"text\":\"And he would fain have filled his belly with the husks the swine did eat: and no man gave unto him.\"},{\"verse\":17,\"text\":\"And returning to himself, he said: How many hired servants in my father’s house abound with bread, and I here perish with hunger!\"},{\"verse\":18,\"text\":\"I will arise and will go to my father and say to him: Father, I have sinned against heaven and before thee.\"},{\"verse\":19,\"text\":\"I am not worthy to be called thy son: make me as one of thy hired servants.\"},{\"verse\":20,\"text\":\"And rising up, he came to his father. And when he was yet a great way off, his father saw him and was moved with compassion and running to him fell upon his neck and kissed him.\"},{\"verse\":21,\"text\":\"And the son said to him: Father: I have sinned against heaven and before thee I am not now worthy to be called thy son.\"},{\"verse\":22,\"text\":\"And the father said to his servants: Bring forth quickly the first robe and put it on him: and put a ring on his hand and shoes on his feet.\"},{\"verse\":23,\"text\":\"And bring hither the fatted calf, and kill it: and let us eat and make merry:\"},{\"verse\":24,\"text\":\"Because this my son was dead and is come to life again, was lost and is found. And they began to be merry.\"},{\"verse\":25,\"text\":\"Now his elder son was in the field and when he came and drew nigh to the house, he heard music and dancing.\"},{\"verse\":26,\"text\":\"And he called one of the servants, and asked what these things meant.\"},{\"verse\":27,\"text\":\"And he said to him: Thy brother is come and thy father hath killed the fatted calf, because he hath received him safe.\"},{\"verse\":28,\"text\":\"And he was angry and would not go in. His father therefore coming out began to entreat him.\"},{\"verse\":29,\"text\":\"And he answering, said to his father: Behold, for so many years do I serve thee and I have never transgressed thy commandment: and yet thou hast never given me a kid to make merry with my friends.\"},{\"verse\":30,\"text\":\"But as soon as this thy son is come, who hath devoured his substance with harlots, thou hast killed for him the fatted calf.\"},{\"verse\":31,\"text\":\"But he said to him: Son, thou art always with me; and all I have is thine.\"},{\"verse\":32,\"text\":\"But it was fit that we should make merry and be glad: for this thy brother was dead and is come to life again; he was lost, and is found.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erant autem appropinquantes ei publicani, et peccatores ut audirent illum.\"},{\"verse\":2,\"text\":\"Et murmurabant pharisæi, et scribæ, dicentes : Quia hic peccatores recipit, et manducat cum illis.\"},{\"verse\":3,\"text\":\"Et ait ad illos parabolam istam dicens :\"},{\"verse\":4,\"text\":\"Quis ex vobis homo, qui habet centum oves, et si perdiderit unam ex illis, nonne dimittit nonaginta novem in deserto, et vadit ad illam quæ perierat, donec inveniat eam ?\"},{\"verse\":5,\"text\":\"Et cum invenerit eam, imponit in humeros suos gaudens :\"},{\"verse\":6,\"text\":\"et veniens domum convocat amicos et vicinos, dicens illis : Congratulamini mihi, quia inveni ovem meam, quæ perierat.\"},{\"verse\":7,\"text\":\"Dico vobis quod ita gaudium erit in cælo super uno peccatore pœnitentiam agente, quam super nonaginta novem justis, qui non indigent pœnitentia.\"},{\"verse\":8,\"text\":\"Aut quæ mulier habens drachmas decem, si perdiderit drachmam unam, nonne accendit lucernam, et everrit domum, et quærit diligenter, donec inveniat ?\"},{\"verse\":9,\"text\":\"Et cum invenerit convocat amicas et vicinas, dicens : Congratulamini mihi, quia inveni drachmam quam perdideram.\"},{\"verse\":10,\"text\":\"Ita, dico vobis, gaudium erit coram angelis Dei super uno peccatore pœnitentiam agente.\"},{\"verse\":11,\"text\":\"Ait autem : Homo quidam habuit duos filios :\"},{\"verse\":12,\"text\":\"et dixit adolescentior ex illis patri : Pater, da mihi portionem substantiæ, quæ me contingit. Et divisit illis substantiam.\"},{\"verse\":13,\"text\":\"Et non post multos dies, congregatis omnibus, adolescentior filius peregre profectus est in regionem longinquam, et ibi dissipavit substantiam suam vivendo luxuriose.\"},{\"verse\":14,\"text\":\"Et postquam omnia consummasset, facta est fames valida in regione illa, et ipse cœpit egere.\"},{\"verse\":15,\"text\":\"Et abiit, et adhæsit uni civium regionis illius : et misit illum in villam suam ut pasceret porcos.\"},{\"verse\":16,\"text\":\"Et cupiebat implere ventrem suum de siliquis, quas porci manducabant : et nemo illi dabat.\"},{\"verse\":17,\"text\":\"In se autem reversus, dixit : Quanti mercenarii in domo patris mei abundant panibus, ego autem hic fame pereo !\"},{\"verse\":18,\"text\":\"surgam, et ibo ad patrem meum, et dicam ei : Pater, peccavi in cælum, et coram te :\"},{\"verse\":19,\"text\":\"jam non sum dignus vocari filius tuus : fac me sicut unum de mercenariis tuis.\"},{\"verse\":20,\"text\":\"Et surgens venit ad patrem suum. Cum autem adhuc longe esset, vidit illum pater ipsius, et misericordia motus est, et accurrens cecidit super collum ejus, et osculatus est eum.\"},{\"verse\":21,\"text\":\"Dixitque ei filius : Pater, peccavi in cælum, et coram te : jam non sum dignus vocari filius tuus.\"},{\"verse\":22,\"text\":\"Dixit autem pater ad servos suos : Cito proferte stolam primam, et induite illum, et date annulum in manum ejus, et calceamenta in pedes ejus :\"},{\"verse\":23,\"text\":\"et adducite vitulum saginatum, et occidite, et manducemus, et epulemur :\"},{\"verse\":24,\"text\":\"quia hic filius meus mortuus erat, et revixit : perierat, et inventus est. Et cœperunt epulari.\"},{\"verse\":25,\"text\":\"Erat autem filius ejus senior in agro : et cum veniret, et appropinquaret domui, audivit symphoniam et chorum :\"},{\"verse\":26,\"text\":\"et vocavit unum de servis, et interrogavit quid hæc essent.\"},{\"verse\":27,\"text\":\"Isque dixit illi : Frater tuus venit, et occidit pater tuus vitulum saginatum, quia salvum illum recepit.\"},{\"verse\":28,\"text\":\"Indignatus est autem, et nolebat introire. Pater ergo illius egressus, cœpit rogare illum.\"},{\"verse\":29,\"text\":\"At ille respondens, dixit patri suo : Ecce tot annis servio tibi, et numquam mandatum tuum præterivi : et numquam dedisti mihi hædum ut cum amicis meis epularer.\"},{\"verse\":30,\"text\":\"Sed postquam filius tuus hic, qui devoravit substantiam suam cum meretricibus, venit, occidisti illi vitulum saginatum.\"},{\"verse\":31,\"text\":\"At ipse dixit illi : Fili, tu semper mecum es, et omnia mea tua sunt :\"},{\"verse\":32,\"text\":\"epulari autem, et gaudere oportebat, quia frater tuus hic mortuus erat, et revixit ; perierat, et inventus est.\"}],\"summary\":\"The parables of the lost sheep and of the prodigal son.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":14,\"label\":\"Luke 14\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":16,\"label\":\"Luke 16\"}}]]\n"])</script></body></html>
