<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 22 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">22</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The treason of Judas. The last supper. The first part of the history of the passion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the feast of unleavened bread, which is called the pasch, was at hand.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the chief priests and the scribes sought how they might put Jesus to death: but they feared the people.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Satan entered into Judas, who was surnamed Iscariot, one of the twelve.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he went and discoursed with the chief priests and the magistrates, how he might betray him to them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they were glad and covenanted to give him money.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he promised. And he sought opportunity to betray him in the absence of the multitude.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the day of the unleavened bread came, on which it was necessary that the pasch should be killed.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And he sent Peter and John, saying: Go, and prepare for us the pasch, that we may eat.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But they said: Where wilt thou that we prepare?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he said to them: Behold, as you go into the city, there shall meet you a man carrying a pitcher of water: follow him into the house where he entereth in.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And you shall say to the goodman of the house: The master saith to thee: Where is the guest chamber, where I may eat the pasch with my disciples?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And he will shew you a large dining room, furnished. And there prepare.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And they going, found as he had said to them and made ready the pasch.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And when the hour was come, he sat down: and the twelve apostles with him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he said to them: With desire I have desired to eat this pasch with you, before I suffer.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For I say to you that from this time I will not eat it, till it be fulfilled in the kingdom of God.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And having taken the chalice, he gave thanks and said: Take and divide it among you.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For I say to you that I will not drink of the fruit of the vine, till the kingdom of God come.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And taking bread, he gave thanks and brake and gave to them, saying: This is my body, which is given for you. Do this for a commemoration of me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In like manner, the chalice also, after he had supped, saying: This is the chalice, the new testament in my blood, which shall be shed for you.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But yet behold: the hand of him that betrayeth me is with me on the table.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the Son of man indeed goeth, according to that which is determined: but yet, woe to that man by whom he shall be betrayed.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And they began to inquire among themselves, which of them it was that should do this thing.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And there was also a strife amongst them, which of them should seem to be the greater.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he said to them: The kings of the Gentiles lord it over them; and they that have power over them are called beneficent.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But you not so: but he that is the greater among you, let him become as the younger: and he that is the leader, as he that serveth.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For which is greater, he that sitteth at table or he that serveth? Is not he that sitteth at table? But I am in the midst of you, as he that serveth.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And you are they who have continued with me in my temptations:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And I dispose to you, as my Father hath disposed to me, a kingdom;</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>That you may eat and drink at my table, in my kingdom: and may sit upon thrones, judging the twelve tribes of Israel.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the Lord said: Simon, Simon, behold Satan hath desired to have you, that he may sift you as wheat.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But I have prayed for thee, that thy faith fail not: and thou, being once converted, confirm thy brethren.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who said to him: Lord, I am ready to go with thee, both into prison and to death.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And he said: I say to thee, Peter, the cock shall not crow this day, till thou thrice deniest that thou knowest me. And he said to them:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>When I sent you without purse and scrip and shoes, did you want anything?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But they said: Nothing. Then said he unto them: But now he that hath a purse, let him take it, and likewise a scrip: and he that hath not, let him sell his coat and buy a sword.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>For I say to you that this that is written must yet be fulfilled in me. And with the wicked was he reckoned. For the things concerning me have an end.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But they said: Lord, behold, here are two swords. And he said to them: It is enough.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And going out, he went, according to his custom, to the Mount of Olives. And his disciples also followed him.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when he was come to the place, he said to them: Pray, lest ye enter into temptation.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And he was withdrawn away from them a stone’s cast. And kneeling down, he prayed.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed the longer.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And his sweat became as drops of blood, trickling down upon the ground.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And when he rose up from prayer and was come to the disciples, he found them sleeping for sorrow.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he said to them: Why sleep you? Arise: pray: lest you enter into temptation.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>As he was yet speaking, behold a multitude; and he that was called Judas, one of the twelve, went before them and drew near to Jesus, for to kiss him.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And Jesus said to him: Judas, dost thou betray the Son of man with a kiss?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And they that were about him, seeing what would follow, said to him: Lord, shall we strike with the sword?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And one of them struck the servant of the high priest and cut off his right ear.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>But Jesus answering, said: Suffer ye thus far. And when he had touched his ear, he healed him.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And Jesus said to the chief priests and magistrates of the temple and the ancients, that were come unto him: Are ye come out, as it were against a thief, with swords and clubs?</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>When I was daily with you in the temple, you did not stretch forth your hands against me: but this is your hour and the power of darkness.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And apprehending him, they led him to the high priest’s house. But Peter followed afar off.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And when they had kindled a fire in the midst of the hall and were sitting about it, Peter was in the midst of them.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Whom when a certain servant maid had seen sitting at the light and had earnestly beheld him, she said: This man also was with him.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>But he denied him, saying: Woman, I know him not.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>And after a little while, another seeing him, said: Thou also art one of them. But Peter said: O man, I am not.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And after the space, as it were of one hour, another certain man affirmed, saying: Of a truth, this man was also with him: for he is also a Galilean.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And Peter said: Man, I know not what thou sayest. And immediately, as he was yet speaking, the cock crew.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And the Lord turning looked on Peter. And Peter remembered the word of the Lord, as he had said: Before the cock crow, thou shalt deny me thrice.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>And Peter going out, wept bitterly.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>And the men that held him mocked him and struck him.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>And they blindfolded him and smote his face. And they asked him saying: Prophesy: Who is it that struck thee?</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>And blaspheming, many other things they said against him.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>And as soon as it was day, the ancients of the people and the chief priests and scribes came together. And they brought him into their council saying: If thou be the Christ, tell us.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>And he saith to them: If I shall tell you, you will not believe me.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>And if I shall also ask you, you will not answer me, nor let me go.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>But hereafter the Son of man shall be sitting on the right hand of the power of God.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Then said they all: Art thou then the Son of God? Who said: You say that I am.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>And they said: What need we any further testimony? For we ourselves have heard it from his own mouth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Appropinquabat autem dies festus azymorum, qui dicitur Pascha :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et quærebant principes sacerdotum, et scribæ, quomodo Jesum interficerent : timebant vero plebem.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Intravit autem Satanas in Judam, qui cognominabatur Iscariotes, unum de duodecim :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>et abiit, et locutus est cum principibus sacerdotum, et magistratibus, quemadmodum illum traderet eis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et gavisi sunt, et pacti sunt pecuniam illi dare.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et spopondit, et quærebat opportunitatem ut traderet illum sine turbis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venit autem dies azymorum, in qua necesse erat occidi pascha.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et misit Petrum et Joannem, dicens : Euntes parate nobis pascha, ut manducemus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>At illi dixerunt : Ubi vis paremus ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et dixit ad eos : Ecce introëuntibus vobis in civitatem occurret vobis homo quidam amphoram aquæ portans : sequimini eum in domum, in quam intrat,</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et dicetis patrifamilias domus : Dicit tibi Magister : Ubi est diversorium, ubi pascha cum discipulis meis manducem ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et ipse ostendet vobis cœnaculum magnum stratum, et ibi parate.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Euntes autem invenerunt sicut dixit illis, et paraverunt pascha.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et cum facta esset hora, discubuit, et duodecim apostoli cum eo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ait illis : Desiderio desideravi hoc pascha manducare vobiscum, antequam patiar.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dico enim vobis, quia ex hoc non manducabo illud, donec impleatur in regno Dei.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et accepto calice gratias egit, et dixit : Accipite, et dividite inter vos.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dico enim vobis quod non bibam de generatione vitis donec regnum Dei veniat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et accepto pane gratias egit, et fregit, et dedit eis, dicens : Hoc est corpus meum, quod pro vobis datur : hoc facite in meam commemorationem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Similiter et calicem, postquam cœnavit, dicens : Hic est calix novum testamentum in sanguine meo, qui pro vobis fundetur.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Verumtamen ecce manus tradentis me, mecum est in mensa.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et quidem Filius hominis, secundum quod definitum est, vadit : verumtamen væ homini illi per quem tradetur.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ipsi cœperunt quærere inter se quis esset ex eis qui hoc facturus esset.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Facta est autem et contentio inter eos, quis eorum videretur esse major.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixit autem eis : Reges gentium dominantur eorum : et qui potestatem habent super eos, benefici vocantur.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Vos autem non sic : sed qui major est in vobis, fiat sicut minor : et qui præcessor est, sicut ministrator.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nam quis major est, qui recumbit, an qui ministrat ? nonne qui recumbit ? Ego autem in medio vestrum sum, sicut qui ministrat :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>vos autem estis, qui permansistis mecum in tentationibus meis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et ego dispono vobis sicut disposuit mihi Pater meus regnum,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>ut edatis et bibatis super mensam meam in regno meo, et sedeatis super thronos judicantes duodecim tribus Israël.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ait autem Dominus : Simon, Simon, ecce Satanas expetivit vos ut cribraret sicut triticum :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>ego autem rogavi pro te ut non deficiat fides tua : et tu aliquando conversus, confirma fratres tuos.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Qui dixit ei : Domine, tecum paratus sum et in carcerem et in mortem ire.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>At ille dixit : Dico tibi, Petre, non cantabit hodie gallus, donec ter abneges nosse me. Et dixit eis :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Quando misi vos sine sacculo, et pera, et calceamentis, numquid aliquid defuit vobis ?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>At illi dixerunt : Nihil. Dixit ergo eis : Sed nunc qui habet sacculum, tollat ; similiter et peram : et qui non habet, vendat tunicam suam et emat gladium.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Dico enim vobis, quoniam adhuc hoc quod scriptum est, oportet impleri in me : Et cum iniquis deputatus est. Etenim ea quæ sunt de me finem habent.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>At illi dixerunt : Domine, ecce duo gladii hic. At ille dixit eis : Satis est.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et egressus ibat secundum consuetudinem in monte Olivarum. Secuti sunt autem illum et discipuli.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et cum pervenisset ad locum, dixit illis : Orate ne intretis in tentationem.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et ipse avulsus est ab eis quantum jactus est lapidis : et positis genibus orabat,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>dicens : Pater, si vis, transfer calicem istum a me : verumtamen non mea voluntas, sed tua fiat.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Apparuit autem illi angelus de cælo, confortans eum. Et factus in agonia, prolixius orabat.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et factus est sudor ejus sicut guttæ sanguinis decurrentis in terram.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et cum surrexisset ab oratione et venisset ad discipulos suos, invenit eos dormientes præ tristitia.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Et ait illis : Quid dormitis ? surgite, orate, ne intretis in tentationem.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Adhuc eo loquente, ecce turba : et qui vocabatur Judas, unus de duodecim, antecedebat eos, et appropinquavit Jesu ut oscularetur eum.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Jesus autem dixit illi : Juda, osculo Filium hominis tradis ?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Videntes autem hi qui circa ipsum erant, quod futurum erat, dixerunt ei : Domine, si percutimus in gladio ?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Et percussit unus ex illis servum principis sacerdotum, et amputavit auriculam ejus dexteram.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Respondens autem Jesus, ait : Sinite usque huc. Et cum tetigisset auriculam ejus, sanavit eum.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Dixit autem Jesus ad eos qui venerant ad se principes sacerdotum, et magistratus templi, et seniores : Quasi ad latronem existis cum gladiis et fustibus ?</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Cum quotidie vobiscum fuerim in templo, non extendistis manus in me : sed hæc est hora vestra, et potestas tenebrarum.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Comprehendentes autem eum, duxerunt ad domum principis sacerdotum : Petrus vero sequebatur a longe.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Accenso autem igne in medio atrii et circumsedentibus illis, erat Petrus in medio eorum.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Quem cum vidisset ancilla quædam sedentem ad lumen, et eum fuisset intuita, dixit : Et hic cum illo erat.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>At ille negavit eum, dicens : Mulier, non novi illum.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Et post pusillum alius videns eum, dixit : Et tu de illis es. Petrus vero ait : O homo, non sum.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Et intervallo facto quasi horæ unius, alius quidam affirmabat, dicens : Vere et hic cum illo erat : nam et Galilæus est.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Et ait Petrus : Homo, nescio quid dicis. Et continuo, adhuc illo loquente, cantavit gallus.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Et conversus Dominus respexit Petrum, et recordatus est Petrus verbi Domini, sicut dixerat : Quia priusquam gallus cantet, ter me negabis.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Et egressus foras Petrus flevit amare.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Et viri qui tenebant illum, illudebant ei, cædentes.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Et velaverunt eum, et percutiebant faciem ejus : et interrogabant eum, dicentes : Prophetiza, quis est, qui te percussit ?</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Et alia multa blasphemantes dicebant in eum.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Et ut factus est dies, convenerunt seniores plebis, et principes sacerdotum, et scribæ, et duxerunt illum in concilium suum, dicentes : Si tu es Christus, dic nobis.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Et ait illis : Si vobis dixero, non credetis mihi :</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>si autem et interrogavero, non respondebitis mihi, neque dimittetis.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Ex hoc autem erit Filius hominis sedens a dextris virtutis Dei.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Dixerunt autem omnes : Tu ergo es Filius Dei ? Qui ait : Vos dicitis, quia ego sum.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>At illi dixerunt : Quid adhuc desideramus testimonium ? ipsi enim audivimus de ore ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/21/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 21</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/23/"><span class="min-w-0"><span class="block text- ink\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LUK.22\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":22,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"Now the feast of unleavened bread, which is called the pasch, was at hand.\"},{\"verse\":2,\"text\":\"And the chief priests and the scribes sought how they might put Jesus to death: but they feared the people.\"},{\"verse\":3,\"text\":\"And Satan entered into Judas, who was surnamed Iscariot, one of the twelve.\"},{\"verse\":4,\"text\":\"And he went and discoursed with the chief priests and the magistrates, how he might betray him to them.\"},{\"verse\":5,\"text\":\"And they were glad and covenanted to give him money.\"},{\"verse\":6,\"text\":\"And he promised. And he sought opportunity to betray him in the absence of the multitude.\"},{\"verse\":7,\"text\":\"And the day of the unleavened bread came, on which it was necessary that the pasch should be killed.\"},{\"verse\":8,\"text\":\"And he sent Peter and John, saying: Go, and prepare for us the pasch, that we may eat.\"},{\"verse\":9,\"text\":\"But they said: Where wilt thou that we prepare?\"},{\"verse\":10,\"text\":\"And he said to them: Behold, as you go into the city, there shall meet you a man carrying a pitcher of water: follow him into the house where he entereth in.\"},{\"verse\":11,\"text\":\"And you shall say to the goodman of the house: The master saith to thee: Where is the guest chamber, where I may eat the pasch with my disciples?\"},{\"verse\":12,\"text\":\"And he will shew you a large dining room, furnished. And there prepare.\"},{\"verse\":13,\"text\":\"And they going, found as he had said to them and made ready the pasch.\"},{\"verse\":14,\"text\":\"And when the hour was come, he sat down: and the twelve apostles with him.\"},{\"verse\":15,\"text\":\"And he said to them: With desire I have desired to eat this pasch with you, before I suffer.\"},{\"verse\":16,\"text\":\"For I say to you that from this time I will not eat it, till it be fulfilled in the kingdom of God.\"},{\"verse\":17,\"text\":\"And having taken the chalice, he gave thanks and said: Take and divide it among you.\"},{\"verse\":18,\"text\":\"For I say to you that I will not drink of the fruit of the vine, till the kingdom of God come.\"},{\"verse\":19,\"text\":\"And taking bread, he gave thanks and brake and gave to them, saying: This is my body, which is given for you. Do this for a commemoration of me.\"},{\"verse\":20,\"text\":\"In like manner, the chalice also, after he had supped, saying: This is the chalice, the new testament in my blood, which shall be shed for you.\"},{\"verse\":21,\"text\":\"But yet behold: the hand of him that betrayeth me is with me on the table.\"},{\"verse\":22,\"text\":\"And the Son of man indeed goeth, according to that which is determined: but yet, woe to that man by whom he shall be betrayed.\"},{\"verse\":23,\"text\":\"And they began to inquire among themselves, which of them it was that should do this thing.\"},{\"verse\":24,\"text\":\"And there was also a strife amongst them, which of them should seem to be the greater.\"},{\"verse\":25,\"text\":\"And he said to them: The kings of the Gentiles lord it over them; and they that have power over them are called beneficent.\"},{\"verse\":26,\"text\":\"But you not so: but he that is the greater among you, let him become as the younger: and he that is the leader, as he that serveth.\"},{\"verse\":27,\"text\":\"For which is greater, he that sitteth at table or he that serveth? Is not he that sitteth at table? But I am in the midst of you, as he that serveth.\"},{\"verse\":28,\"text\":\"And you are they who have continued with me in my temptations:\"},{\"verse\":29,\"text\":\"And I dispose to you, as my Father hath disposed to me, a kingdom;\"},{\"verse\":30,\"text\":\"That you may eat and drink at my table, in my kingdom: and may sit upon thrones, judging the twelve tribes of Israel.\"},{\"verse\":31,\"text\":\"And the Lord said: Simon, Simon, behold Satan hath desired to have you, that he may sift you as wheat.\"},{\"verse\":32,\"text\":\"But I have prayed for thee, that thy faith fail not: and thou, being once converted, confirm thy brethren.\"},{\"verse\":33,\"text\":\"Who said to him: Lord, I am ready to go with thee, both into prison and to death.\"},{\"verse\":34,\"text\":\"And he said: I say to thee, Peter, the cock shall not crow this day, till thou thrice deniest that thou knowest me. And he said to them:\"},{\"verse\":35,\"text\":\"When I sent you without purse and scrip and shoes, did you want anything?\"},{\"verse\":36,\"text\":\"But they said: Nothing. Then said he unto them: But now he that hath a purse, let him take it, and likewise a scrip: and he that hath not, let him sell his coat and buy a sword.\"},{\"verse\":37,\"text\":\"For I say to you that this that is written must yet be fulfilled in me. And with the wicked was he reckoned. For the things concerning me have an end.\"},{\"verse\":38,\"text\":\"But they said: Lord, behold, here are two swords. And he said to them: It is enough.\"},{\"verse\":39,\"text\":\"And going out, he went, according to his custom, to the Mount of Olives. And his disciples also followed him.\"},{\"verse\":40,\"text\":\"And when he was come to the place, he said to them: Pray, lest ye enter into temptation.\"},{\"verse\":41,\"text\":\"And he was withdrawn away from them a stone’s cast. And kneeling down, he prayed.\"},{\"verse\":42,\"text\":\"Saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done.\"},{\"verse\":43,\"text\":\"And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed the longer.\"},{\"verse\":44,\"text\":\"And his sweat became as drops of blood, trickling down upon the ground.\"},{\"verse\":45,\"text\":\"And when he rose up from prayer and was come to the disciples, he found them sleeping for sorrow.\"},{\"verse\":46,\"text\":\"And he said to them: Why sleep you? Arise: pray: lest you enter into temptation.\"},{\"verse\":47,\"text\":\"As he was yet speaking, behold a multitude; and he that was called Judas, one of the twelve, went before them and drew near to Jesus, for to kiss him.\"},{\"verse\":48,\"text\":\"And Jesus said to him: Judas, dost thou betray the Son of man with a kiss?\"},{\"verse\":49,\"text\":\"And they that were about him, seeing what would follow, said to him: Lord, shall we strike with the sword?\"},{\"verse\":50,\"text\":\"And one of them struck the servant of the high priest and cut off his right ear.\"},{\"verse\":51,\"text\":\"But Jesus answering, said: Suffer ye thus far. And when he had touched his ear, he healed him.\"},{\"verse\":52,\"text\":\"And Jesus said to the chief priests and magistrates of the temple and the ancients, that were come unto him: Are ye come out, as it were against a thief, with swords and clubs?\"},{\"verse\":53,\"text\":\"When I was daily with you in the temple, you did not stretch forth your hands against me: but this is your hour and the power of darkness.\"},{\"verse\":54,\"text\":\"And apprehending him, they led him to the high priest’s house. But Peter followed afar off.\"},{\"verse\":55,\"text\":\"And when they had kindled a fire in the midst of the hall and were sitting about it, Peter was in the midst of them.\"},{\"verse\":56,\"text\":\"Whom when a certain servant maid had seen sitting at the light and had earnestly beheld him, she said: This man also was with him.\"},{\"verse\":57,\"text\":\"But he denied him, saying: Woman, I know him not.\"},{\"verse\":58,\"text\":\"And after a little while, another seeing him, said: Thou also art one of them. But Peter said: O man, I am not.\"},{\"verse\":59,\"text\":\"And after the space, as it were of one hour, another certain man affirmed, saying: Of a truth, this man was also with him: for he is also a Galilean.\"},{\"verse\":60,\"text\":\"And Peter said: Man, I know not what thou sayest. And immediately, as he was yet speaking, the cock crew.\"},{\"verse\":61,\"text\":\"And the Lord turning looked on Peter. And Peter remembered the word of the Lord, as he had said: Before the cock crow, thou shalt deny me thrice.\"},{\"verse\":62,\"text\":\"And Peter going out, wept bitterly.\"},{\"verse\":63,\"text\":\"And the men that held him mocked him and struck him.\"},{\"verse\":64,\"text\":\"And they blindfolded him and smote his face. And they asked him saying: Prophesy: Who is it that struck thee?\"},{\"verse\":65,\"text\":\"And blaspheming, many other things they said against him.\"},{\"verse\":66,\"text\":\"And as soon as it was day, the ancients of the people and the chief priests and scribes came together. And they brought him into their council saying: If thou be the Christ, tell us.\"},{\"verse\":67,\"text\":\"And he saith to them: If I shall tell you, you will not believe me.\"},{\"verse\":68,\"text\":\"And if I shall also ask you, you will not answer me, nor let me go.\"},{\"verse\":69,\"text\":\"But hereafter the Son of man shall be sitting on the right hand of the power of God.\"},{\"verse\":70,\"text\":\"Then said they all: Art thou then the Son of God? Who said: You say that I am.\"},{\"verse\":71,\"text\":\"And they said: What need we any further testimony? For we ourselves have heard it from his own mouth.\"}],\"vul\":[{\"verse\":1,\"text\":\"Appropinquabat autem dies festus azymorum, qui dicitur Pascha :\"},{\"verse\":2,\"text\":\"et quærebant principes sacerdotum, et scribæ, quomodo Jesum interficerent : timebant vero plebem.\"},{\"verse\":3,\"text\":\"Intravit autem Satanas in Judam, qui cognominabatur Iscariotes, unum de duodecim :\"},{\"verse\":4,\"text\":\"et abiit, et locutus est cum principibus sacerdotum, et magistratibus, quemadmodum illum traderet eis.\"},{\"verse\":5,\"text\":\"Et gavisi sunt, et pacti sunt pecuniam illi dare.\"},{\"verse\":6,\"text\":\"Et spopondit, et quærebat opportunitatem ut traderet illum sine turbis.\"},{\"verse\":7,\"text\":\"Venit autem dies azymorum, in qua necesse erat occidi pascha.\"},{\"verse\":8,\"text\":\"Et misit Petrum et Joannem, dicens : Euntes parate nobis pascha, ut manducemus.\"},{\"verse\":9,\"text\":\"At illi dixerunt : Ubi vis paremus ?\"},{\"verse\":10,\"text\":\"Et dixit ad eos : Ecce introëuntibus vobis in civitatem occurret vobis homo quidam amphoram aquæ portans : sequimini eum in domum, in quam intrat,\"},{\"verse\":11,\"text\":\"et dicetis patrifamilias domus : Dicit tibi Magister : Ubi est diversorium, ubi pascha cum discipulis meis manducem ?\"},{\"verse\":12,\"text\":\"Et ipse ostendet vobis cœnaculum magnum stratum, et ibi parate.\"},{\"verse\":13,\"text\":\"Euntes autem invenerunt sicut dixit illis, et paraverunt pascha.\"},{\"verse\":14,\"text\":\"Et cum facta esset hora, discubuit, et duodecim apostoli cum eo.\"},{\"verse\":15,\"text\":\"Et ait illis : Desiderio desideravi hoc pascha manducare vobiscum, antequam patiar.\"},{\"verse\":16,\"text\":\"Dico enim vobis, quia ex hoc non manducabo illud, donec impleatur in regno Dei.\"},{\"verse\":17,\"text\":\"Et accepto calice gratias egit, et dixit : Accipite, et dividite inter vos.\"},{\"verse\":18,\"text\":\"Dico enim vobis quod non bibam de generatione vitis donec regnum Dei veniat.\"},{\"verse\":19,\"text\":\"Et accepto pane gratias egit, et fregit, et dedit eis, dicens : Hoc est corpus meum, quod pro vobis datur : hoc facite in meam commemorationem.\"},{\"verse\":20,\"text\":\"Similiter et calicem, postquam cœnavit, dicens : Hic est calix novum testamentum in sanguine meo, qui pro vobis fundetur.\"},{\"verse\":21,\"text\":\"Verumtamen ecce manus tradentis me, mecum est in mensa.\"},{\"verse\":22,\"text\":\"Et quidem Filius hominis, secundum quod definitum est, vadit : verumtamen væ homini illi per quem tradetur.\"},{\"verse\":23,\"text\":\"Et ipsi cœperunt quærere inter se quis esset ex eis qui hoc facturus esset.\"},{\"verse\":24,\"text\":\"Facta est autem et contentio inter eos, quis eorum videretur esse major.\"},{\"verse\":25,\"text\":\"Dixit autem eis : Reges gentium dominantur eorum : et qui potestatem habent super eos, benefici vocantur.\"},{\"verse\":26,\"text\":\"Vos autem non sic : sed qui major est in vobis, fiat sicut minor : et qui præcessor est, sicut ministrator.\"},{\"verse\":27,\"text\":\"Nam quis major est, qui recumbit, an qui ministrat ? nonne qui recumbit ? Ego autem in medio vestrum sum, sicut qui ministrat :\"},{\"verse\":28,\"text\":\"vos autem estis, qui permansistis mecum in tentationibus meis.\"},{\"verse\":29,\"text\":\"Et ego dispono vobis sicut disposuit mihi Pater meus regnum,\"},{\"verse\":30,\"text\":\"ut edatis et bibatis super mensam meam in regno meo, et sedeatis super thronos judicantes duodecim tribus Israël.\"},{\"verse\":31,\"text\":\"Ait autem Dominus : Simon, Simon, ecce Satanas expetivit vos ut cribraret sicut triticum :\"},{\"verse\":32,\"text\":\"ego autem rogavi pro te ut non deficiat fides tua : et tu aliquando conversus, confirma fratres tuos.\"},{\"verse\":33,\"text\":\"Qui dixit ei : Domine, tecum paratus sum et in carcerem et in mortem ire.\"},{\"verse\":34,\"text\":\"At ille dixit : Dico tibi, Petre, non cantabit hodie gallus, donec ter abneges nosse me. Et dixit eis :\"},{\"verse\":35,\"text\":\"Quando misi vos sine sacculo, et pera, et calceamentis, numquid aliquid defuit vobis ?\"},{\"verse\":36,\"text\":\"At illi dixerunt : Nihil. Dixit ergo eis : Sed nunc qui habet sacculum, tollat ; similiter et peram : et qui non habet, vendat tunicam suam et emat gladium.\"},{\"verse\":37,\"text\":\"Dico enim vobis, quoniam adhuc hoc quod scriptum est, oportet impleri in me : Et cum iniquis deputatus est. Etenim ea quæ sunt de me finem habent.\"},{\"verse\":38,\"text\":\"At illi dixerunt : Domine, ecce duo gladii hic. At ille dixit eis : Satis est.\"},{\"verse\":39,\"text\":\"Et egressus ibat secundum consuetudinem in monte Olivarum. Secuti sunt autem illum et discipuli.\"},{\"verse\":40,\"text\":\"Et cum pervenisset ad locum, dixit illis : Orate ne intretis in tentationem.\"},{\"verse\":41,\"text\":\"Et ipse avulsus est ab eis quantum jactus est lapidis : et positis genibus orabat,\"},{\"verse\":42,\"text\":\"dicens : Pater, si vis, transfer calicem istum a me : verumtamen non mea voluntas, sed tua fiat.\"},{\"verse\":43,\"text\":\"Apparuit autem illi angelus de cælo, confortans eum. Et factus in agonia, prolixius orabat.\"},{\"verse\":44,\"text\":\"Et factus est sudor ejus sicut guttæ sanguinis decurrentis in terram.\"},{\"verse\":45,\"text\":\"Et cum surrexisset ab oratione et venisset ad discipulos suos, invenit eos dormientes præ tristitia.\"},{\"verse\":46,\"text\":\"Et ait illis : Quid dormitis ? surgite, orate, ne intretis in tentationem.\"},{\"verse\":47,\"text\":\"Adhuc eo loquente, ecce turba : et qui vocabatur Judas, unus de duodecim, antecedebat eos, et appropinquavit Jesu ut oscularetur eum.\"},{\"verse\":48,\"text\":\"Jesus autem dixit illi : Juda, osculo Filium hominis tradis ?\"},{\"verse\":49,\"text\":\"Videntes autem hi qui circa ipsum erant, quod futurum erat, dixerunt ei : Domine, si percutimus in gladio ?\"},{\"verse\":50,\"text\":\"Et percussit unus ex illis servum principis sacerdotum, et amputavit auriculam ejus dexteram.\"},{\"verse\":51,\"text\":\"Respondens autem Jesus, ait : Sinite usque huc. Et cum tetigisset auriculam ejus, sanavit eum.\"},{\"verse\":52,\"text\":\"Dixit autem Jesus ad eos qui venerant ad se principes sacerdotum, et magistratus templi, et seniores : Quasi ad latronem existis cum gladiis et fustibus ?\"},{\"verse\":53,\"text\":\"Cum quotidie vobiscum fuerim in templo, non extendistis manus in me : sed hæc est hora vestra, et potestas tenebrarum.\"},{\"verse\":54,\"text\":\"Comprehendentes autem eum, duxerunt ad domum principis sacerdotum : Petrus vero sequebatur a longe.\"},{\"verse\":55,\"text\":\"Accenso autem igne in medio atrii et circumsedentibus illis, erat Petrus in medio eorum.\"},{\"verse\":56,\"text\":\"Quem cum vidisset ancilla quædam sedentem ad lumen, et eum fuisset intuita, dixit : Et hic cum illo erat.\"},{\"verse\":57,\"text\":\"At ille negavit eum, dicens : Mulier, non novi illum.\"},{\"verse\":58,\"text\":\"Et post pusillum alius videns eum, dixit : Et tu de illis es. Petrus vero ait : O homo, non sum.\"},{\"verse\":59,\"text\":\"Et intervallo facto quasi horæ unius, alius quidam affirmabat, dicens : Vere et hic cum illo erat : nam et Galilæus est.\"},{\"verse\":60,\"text\":\"Et ait Petrus : Homo, nescio quid dicis. Et continuo, adhuc illo loquente, cantavit gallus.\"},{\"verse\":61,\"text\":\"Et conversus Dominus respexit Petrum, et recordatus est Petrus verbi Domini, sicut dixerat : Quia priusquam gallus cantet, ter me negabis.\"},{\"verse\":62,\"text\":\"Et egressus foras Petrus flevit amare.\"},{\"verse\":63,\"text\":\"Et viri qui tenebant illum, illudebant ei, cædentes.\"},{\"verse\":64,\"text\":\"Et velaverunt eum, et percutiebant faciem ejus : et interrogabant eum, dicentes : Prophetiza, quis est, qui te percussit ?\"},{\"verse\":65,\"text\":\"Et alia multa blasphemantes dicebant in eum.\"},{\"verse\":66,\"text\":\"Et ut factus est dies, convenerunt seniores plebis, et principes sacerdotum, et scribæ, et duxerunt illum in concilium suum, dicentes : Si tu es Christus, dic nobis.\"},{\"verse\":67,\"text\":\"Et ait illis : Si vobis dixero, non credetis mihi :\"},{\"verse\":68,\"text\":\"si autem et interrogavero, non respondebitis mihi, neque dimittetis.\"},{\"verse\":69,\"text\":\"Ex hoc autem erit Filius hominis sedens a dextris virtutis Dei.\"},{\"verse\":70,\"text\":\"Dixerunt autem omnes : Tu ergo es Filius Dei ? Qui ait : Vos dicitis, quia ego sum.\"},{\"verse\":71,\"text\":\"At illi dixerunt : Quid adhuc desideramus testimonium ? ipsi enim audivimus de ore ejus.\"}],\"summary\":\"The treason of Judas. The last supper. The first part of the history of the passion.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":21,\"label\":\"Luke 21\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":23,\"label\":\"Luke 23\"}}]]\n"])</script></body></html>
