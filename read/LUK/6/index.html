<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 6 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">6</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ excuses his disciples. He cures upon the sabbath day, chooses the twelve and makes a sermon to them.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass on the second first sabbath that, as he went through the corn fields, his disciples plucked the ears and did eat, rubbing them in their hands.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And some of the Pharisees said to them: Why do you that which is not lawful on the sabbath days?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Jesus answering them, said: Have you not read so much as this, what David did, when himself was hungry and they that were with him:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>How he went into the house of God and took and ate the bread of proposition and gave to them that were with him, which is not lawful to eat but only for the priests?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And he said to them: The Son of man is Lord also of the sabbath.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And it came to pass also, on another sabbath, that he entered into the synagogue and taught. And there was a man whose right hand was withered.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the scribes and Pharisees watched if he would heal on the sabbath: that they might find an accusation against him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But he knew their thoughts and said to the man who had the withered hand: Arise and stand forth in the midst. And rising he stood forth.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then Jesus said to them: I ask you, if it be lawful on the sabbath days to do good or to do evil? To save life or to destroy?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And looking round about on them all, he said to the man: Stretch forth thy hand. And he stretched it forth. And his hand was restored.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And they were filled with madness: and they talked one with another, what they might do to Jesus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And it came to pass in those days, that he went out into a mountain to pray: and he passed the whole night in the prayer of God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And when day was come, he called unto him his disciples: and he chose twelve of them (whom also he named apostles):</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Simon, whom he surnamed Peter, and Andrew his brother, James and John, Philip and Bartholomew,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Matthew and Thomas, James the son of Alpheus, and Simon who is called Zelotes,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And Jude the brother of James, and Judas Iscariot, who was the traitor.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And coming down with them, he stood in a plain place: and the company of his disciples and a very great multitude of people from all Judea and Jerusalem and the sea coast, both of Tyre and Sidon,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Who were come to hear him and to be healed of their diseases. And they that were troubled with unclean spirits were cured.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And all the multitude sought to touch him: for virtue went out from him and healed all.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he, lifting up his eyes on his disciples, said: Blessed are ye poor: for yours is the kingdom of God.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Blessed are ye that hunger now: for you shall be filled. Blessed are ye that weep now: for you shall laugh.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Blessed shall you be when men shall hate you, and when they shall separate you and shall reproach you and cast out your name as evil, for the Son of man’s sake.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Be glad in that day and rejoice: for behold, your reward is great in heaven, For according to these things did their fathers to the prophets.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But woe to you that are rich: for you have your consolation.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Woe to you that are filled: for you shall hunger. Woe to you that now laugh: for you shall mourn and weep.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Woe to you when men shall bless you: for according to these things did their fathers to the false prophets.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But I say to you that hear: Love your enemies. Do good to them that hate you.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Bless them that curse you and pray for them that calumniate you.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And to him that striketh thee on the one cheek, offer also the other. And him that taketh away from thee thy cloak, forbid not to take thy coat also.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Give to every one that asketh thee: and of him that taketh away thy goods, ask them not again.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And as you would that men should do to you, do you also to them in like manner.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And if you love them that love you, what thanks are to you? For sinners also love those that love them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And if you do good to them who do good to you, what thanks are to you? For sinners also do this.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And if you lend to them of whom you hope to receive, what thanks are to you? For sinners also lend to sinners, for to receive as much.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But love ye your enemies: do good, and lend, hoping for nothing thereby: and your reward shall be great, and you shall be the sons of the Highest. For he is kind to the unthankful and to the evil.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Be ye therefore merciful, as your Father also is merciful.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Judge not: and you shall not be judged. Condemn not: and you shall not be condemned. Forgive: and you shall be forgiven.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Give: and it shall be given to you: good measure and pressed down and shaken together and running over shall they give into your bosom. For with the same measure that you shall mete withal, it shall be measured to you again.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And he spoke also to them a similitude: Can the blind lead the blind? Do they not both fall into the ditch?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The disciple is not above his master: but every one shall be perfect, if he be as his master.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And why seest thou the mote in thy brother’s eye: but the beam that is in thy own eye thou considerest not?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Or how canst thou say to thy brother: Brother, let me pull the mote out of thy eye, when thou thyself seest not the beam in thy own eye? Hypocrite, cast first the beam out of thy own eye: and then shalt thou see clearly to take out the mote from thy brother’s eye.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>For there is no good tree that bringeth forth evil fruit: nor an evil tree that bringeth forth good fruit.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>For every tree is known by its fruit. For men do not gather figs from thorns: nor from a bramble bush do they gather the grape.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>A good man out of the good treasure of his heart bringeth forth that which is good: and an evil man out of the evil treasure bringeth forth that which is evil. For out of the abundance of the heart the mouth speaketh.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And why call you me, Lord, Lord; and do not the things which I say?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Every one that cometh to me and heareth my words and doth them, I will shew you to whom he is like.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>He is like to a man building a house, who digged deep and laid the foundation upon a rock. And when a flood came, the stream beat vehemently upon that house: and it could not shake it: for it was founded on a rock.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>But he that heareth and doth not is like to a man building his house upon the earth without a foundation: against which the stream beat vehemently. And immediately it fell: and the ruin of that house was great.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem in sabbato secundo, primo, cum transiret per sata, vellebant discipuli ejus spicas, et manducabant confricantes manibus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quidam autem pharisæorum, dicebant illis : Quid facitis quod non licet in sabbatis ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et respondens Jesus ad eos, dixit : Nec hoc legistis quod fecit David, cum esurisset ipse, et qui cum illo erant ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quomodo intravit in domum Dei, et panes propositionis sumpsit, et manducavit, et dedit his qui cum ipso erant : quos non licet manducare nisi tantum sacerdotibus ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et dicebat illis : Quia dominus est Filius hominis etiam sabbati.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Factum est autem in alio sabbato, ut intraret in synagogam, et doceret. Et erat ibi homo, et manus ejus dextra erat arida.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Observabant autem scribæ et pharisæi si in sabbato curaret, ut invenirent unde accusarent eum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Ipse vero sciebat cogitationes eorum : et ait homini qui habebat manum aridam : Surge, et sta in medium. Et surgens stetit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ait autem ad illos Jesus : Interrogo vos si licet sabbatis benefacere, an male : animam salvam facere, an perdere ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et circumspectis omnibus dixit homini : Extende manum tuam. Et extendit : et restituta est manus ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ipsi autem repleti sunt insipientia, et colloquebantur ad invicem, quidnam facerent Jesu.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Factum est autem in illis diebus, exiit in montem orare, et erat pernoctans in oratione Dei.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et cum dies factus esset, vocavit discipulos suos : et elegit duodecim ex ipsis (quos et apostolos nominavit) :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Simonem, quem cognominavit Petrum, et Andream fratrem ejus, Jacobum, et Joannem, Philippum, et Bartholomæum,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Matthæum, et Thomam, Jacobum Alphæi, et Simonem, qui vocatur Zelotes,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et Judam Jacobi, et Judam Iscariotem, qui fuit proditor.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et descendens cum illis, stetit in loco campestri, et turba discipulorum ejus, et multitudo copiosa plebis ab omni Judæa, et Jerusalem, et maritima, et Tyri, et Sidonis,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>qui venerant ut audirent eum, et sanarentur a languoribus suis. Et qui vexabantur a spiritibus immundis, curabantur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et omnis turba quærebat eum tangere : quia virtus de illo exibat, et sanabat omnes.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et ipse elevatis oculis in discipulis suis, dicebat : Beati pauperes, quia vestrum est regnum Dei.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Beati qui nunc esuritis, quia saturabimini. Beati qui nunc fletis, quia ridebitis.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Beati eritis cum vos oderint homines, et cum separaverint vos, et exprobraverint, et ejicerint nomen vestrum tamquam malum propter Filium hominis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Gaudete in illa die, et exsultate : ecce enim merces vestra multa est in cælo : secundum hæc enim faciebant prophetis patres eorum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Verumtamen væ vobis divitibus, quia habetis consolationem vestram.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Væ vobis, qui saturati estis : quia esurietis. Væ vobis, qui ridetis nunc : quia lugebitis et flebitis.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Væ cum benedixerint vobis homines : secundum hæc enim faciebant pseudoprophetis patres eorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sed vobis dico, qui auditis : diligite inimicos vestros, benefacite his qui oderunt vos.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Benedicite maledicentibus vobis, et orate pro calumniantibus vos.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et qui te percutit in maxillam, præbe et alteram. Et ab eo qui aufert tibi vestimentum, etiam tunicam noli prohibere.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Omni autem petenti te, tribue : et qui aufert quæ tua sunt, ne repetas.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et prout vultis ut faciant vobis homines, et vos facite illis similiter.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et si diligitis eos qui vos diligunt, quæ vobis est gratia ? nam et peccatores diligentes se diligunt.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et si benefeceritis his qui vobis benefaciunt, quæ vobis est gratia ? siquidem et peccatores hoc faciunt.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et si mutuum dederitis his a quibus speratis recipere, quæ gratia est vobis ? nam et peccatores peccatoribus fœnerantur, ut recipiant æqualia.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Verumtamen diligite inimicos vestros : benefacite, et mutuum date, nihil inde sperantes : et erit merces vestra multa, et eritis filii Altissimi, quia ipse benignus est super ingratos et malos.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Estote ergo misericordes sicut et Pater vester misericors est.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Nolite judicare, et non judicabimini : nolite condemnare, et non condemnabimini. Dimitte, et dimittemini.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Date, et dabitur vobis : mensuram bonam, et confertam, et coagitatam, et supereffluentem dabunt in sinum vestrum. Eadem quippe mensura, qua mensi fueritis, remetietur vobis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Dicebat autem illis et similitudinem : Numquid potest cæcus cæcum ducere ? nonne ambo in foveam cadunt ?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Non est discipulus super magistrum : perfectus autem omnis erit, si sit sicut magister ejus.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Quid autem vides festucam in oculo fratris tui, trabem autem, quæ in oculo tuo est, non consideras ?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>aut quomodo potes dicere fratri tuo : Frater, sine ejiciam festucam de oculo tuo : ipse in oculo tuo trabem non videns ? Hypocrita, ejice primum trabem de oculo tuo : et tunc perspicies ut educas festucam de oculo fratris tui.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Non est enim arbor bona, quæ facit fructus malos : neque arbor mala, faciens fructum bonum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Unaquæque enim arbor de fructu suo cognoscitur. Neque enim de spinis colligunt ficus : neque de rubo vindemiant uvam.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Bonus homo de bono thesauro cordis sui profert bonum : et malus homo de malo thesauro profert malum. Ex abundantia enim cordis os loquitur.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Quid autem vocatis me Domine, Domine : et non facitis quæ dico ?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Omnis qui venit ad me, et audit sermones meos, et facit eos, ostendam vobis cui similis sit :</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>similis est homini ædificanti domum, qui fodit in altum, et posuit fundamentum super petram : inundatione autem facta, illisum est flumen domui illi, et non potuit eam movere : fundata enim erat super petram.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Qui autem audit, et non facit, similis est homini ædificanti domum suam super terram sine fundamento : in quam illisus est fluvius, et continuo cecidit : et facta est ruina domus illius magna.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></a bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LUK.6\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":6,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass on the second first sabbath that, as he went through the corn fields, his disciples plucked the ears and did eat, rubbing them in their hands.\"},{\"verse\":2,\"text\":\"And some of the Pharisees said to them: Why do you that which is not lawful on the sabbath days?\"},{\"verse\":3,\"text\":\"And Jesus answering them, said: Have you not read so much as this, what David did, when himself was hungry and they that were with him:\"},{\"verse\":4,\"text\":\"How he went into the house of God and took and ate the bread of proposition and gave to them that were with him, which is not lawful to eat but only for the priests?\"},{\"verse\":5,\"text\":\"And he said to them: The Son of man is Lord also of the sabbath.\"},{\"verse\":6,\"text\":\"And it came to pass also, on another sabbath, that he entered into the synagogue and taught. And there was a man whose right hand was withered.\"},{\"verse\":7,\"text\":\"And the scribes and Pharisees watched if he would heal on the sabbath: that they might find an accusation against him.\"},{\"verse\":8,\"text\":\"But he knew their thoughts and said to the man who had the withered hand: Arise and stand forth in the midst. And rising he stood forth.\"},{\"verse\":9,\"text\":\"Then Jesus said to them: I ask you, if it be lawful on the sabbath days to do good or to do evil? To save life or to destroy?\"},{\"verse\":10,\"text\":\"And looking round about on them all, he said to the man: Stretch forth thy hand. And he stretched it forth. And his hand was restored.\"},{\"verse\":11,\"text\":\"And they were filled with madness: and they talked one with another, what they might do to Jesus.\"},{\"verse\":12,\"text\":\"And it came to pass in those days, that he went out into a mountain to pray: and he passed the whole night in the prayer of God.\"},{\"verse\":13,\"text\":\"And when day was come, he called unto him his disciples: and he chose twelve of them (whom also he named apostles):\"},{\"verse\":14,\"text\":\"Simon, whom he surnamed Peter, and Andrew his brother, James and John, Philip and Bartholomew,\"},{\"verse\":15,\"text\":\"Matthew and Thomas, James the son of Alpheus, and Simon who is called Zelotes,\"},{\"verse\":16,\"text\":\"And Jude the brother of James, and Judas Iscariot, who was the traitor.\"},{\"verse\":17,\"text\":\"And coming down with them, he stood in a plain place: and the company of his disciples and a very great multitude of people from all Judea and Jerusalem and the sea coast, both of Tyre and Sidon,\"},{\"verse\":18,\"text\":\"Who were come to hear him and to be healed of their diseases. And they that were troubled with unclean spirits were cured.\"},{\"verse\":19,\"text\":\"And all the multitude sought to touch him: for virtue went out from him and healed all.\"},{\"verse\":20,\"text\":\"And he, lifting up his eyes on his disciples, said: Blessed are ye poor: for yours is the kingdom of God.\"},{\"verse\":21,\"text\":\"Blessed are ye that hunger now: for you shall be filled. Blessed are ye that weep now: for you shall laugh.\"},{\"verse\":22,\"text\":\"Blessed shall you be when men shall hate you, and when they shall separate you and shall reproach you and cast out your name as evil, for the Son of man’s sake.\"},{\"verse\":23,\"text\":\"Be glad in that day and rejoice: for behold, your reward is great in heaven, For according to these things did their fathers to the prophets.\"},{\"verse\":24,\"text\":\"But woe to you that are rich: for you have your consolation.\"},{\"verse\":25,\"text\":\"Woe to you that are filled: for you shall hunger. Woe to you that now laugh: for you shall mourn and weep.\"},{\"verse\":26,\"text\":\"Woe to you when men shall bless you: for according to these things did their fathers to the false prophets.\"},{\"verse\":27,\"text\":\"But I say to you that hear: Love your enemies. Do good to them that hate you.\"},{\"verse\":28,\"text\":\"Bless them that curse you and pray for them that calumniate you.\"},{\"verse\":29,\"text\":\"And to him that striketh thee on the one cheek, offer also the other. And him that taketh away from thee thy cloak, forbid not to take thy coat also.\"},{\"verse\":30,\"text\":\"Give to every one that asketh thee: and of him that taketh away thy goods, ask them not again.\"},{\"verse\":31,\"text\":\"And as you would that men should do to you, do you also to them in like manner.\"},{\"verse\":32,\"text\":\"And if you love them that love you, what thanks are to you? For sinners also love those that love them.\"},{\"verse\":33,\"text\":\"And if you do good to them who do good to you, what thanks are to you? For sinners also do this.\"},{\"verse\":34,\"text\":\"And if you lend to them of whom you hope to receive, what thanks are to you? For sinners also lend to sinners, for to receive as much.\"},{\"verse\":35,\"text\":\"But love ye your enemies: do good, and lend, hoping for nothing thereby: and your reward shall be great, and you shall be the sons of the Highest. For he is kind to the unthankful and to the evil.\"},{\"verse\":36,\"text\":\"Be ye therefore merciful, as your Father also is merciful.\"},{\"verse\":37,\"text\":\"Judge not: and you shall not be judged. Condemn not: and you shall not be condemned. Forgive: and you shall be forgiven.\"},{\"verse\":38,\"text\":\"Give: and it shall be given to you: good measure and pressed down and shaken together and running over shall they give into your bosom. For with the same measure that you shall mete withal, it shall be measured to you again.\"},{\"verse\":39,\"text\":\"And he spoke also to them a similitude: Can the blind lead the blind? Do they not both fall into the ditch?\"},{\"verse\":40,\"text\":\"The disciple is not above his master: but every one shall be perfect, if he be as his master.\"},{\"verse\":41,\"text\":\"And why seest thou the mote in thy brother’s eye: but the beam that is in thy own eye thou considerest not?\"},{\"verse\":42,\"text\":\"Or how canst thou say to thy brother: Brother, let me pull the mote out of thy eye, when thou thyself seest not the beam in thy own eye? Hypocrite, cast first the beam out of thy own eye: and then shalt thou see clearly to take out the mote from thy brother’s eye.\"},{\"verse\":43,\"text\":\"For there is no good tree that bringeth forth evil fruit: nor an evil tree that bringeth forth good fruit.\"},{\"verse\":44,\"text\":\"For every tree is known by its fruit. For men do not gather figs from thorns: nor from a bramble bush do they gather the grape.\"},{\"verse\":45,\"text\":\"A good man out of the good treasure of his heart bringeth forth that which is good: and an evil man out of the evil treasure bringeth forth that which is evil. For out of the abundance of the heart the mouth speaketh.\"},{\"verse\":46,\"text\":\"And why call you me, Lord, Lord; and do not the things which I say?\"},{\"verse\":47,\"text\":\"Every one that cometh to me and heareth my words and doth them, I will shew you to whom he is like.\"},{\"verse\":48,\"text\":\"He is like to a man building a house, who digged deep and laid the foundation upon a rock. And when a flood came, the stream beat vehemently upon that house: and it could not shake it: for it was founded on a rock.\"},{\"verse\":49,\"text\":\"But he that heareth and doth not is like to a man building his house upon the earth without a foundation: against which the stream beat vehemently. And immediately it fell: and the ruin of that house was great.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem in sabbato secundo, primo, cum transiret per sata, vellebant discipuli ejus spicas, et manducabant confricantes manibus.\"},{\"verse\":2,\"text\":\"Quidam autem pharisæorum, dicebant illis : Quid facitis quod non licet in sabbatis ?\"},{\"verse\":3,\"text\":\"Et respondens Jesus ad eos, dixit : Nec hoc legistis quod fecit David, cum esurisset ipse, et qui cum illo erant ?\"},{\"verse\":4,\"text\":\"quomodo intravit in domum Dei, et panes propositionis sumpsit, et manducavit, et dedit his qui cum ipso erant : quos non licet manducare nisi tantum sacerdotibus ?\"},{\"verse\":5,\"text\":\"Et dicebat illis : Quia dominus est Filius hominis etiam sabbati.\"},{\"verse\":6,\"text\":\"Factum est autem in alio sabbato, ut intraret in synagogam, et doceret. Et erat ibi homo, et manus ejus dextra erat arida.\"},{\"verse\":7,\"text\":\"Observabant autem scribæ et pharisæi si in sabbato curaret, ut invenirent unde accusarent eum.\"},{\"verse\":8,\"text\":\"Ipse vero sciebat cogitationes eorum : et ait homini qui habebat manum aridam : Surge, et sta in medium. Et surgens stetit.\"},{\"verse\":9,\"text\":\"Ait autem ad illos Jesus : Interrogo vos si licet sabbatis benefacere, an male : animam salvam facere, an perdere ?\"},{\"verse\":10,\"text\":\"Et circumspectis omnibus dixit homini : Extende manum tuam. Et extendit : et restituta est manus ejus.\"},{\"verse\":11,\"text\":\"Ipsi autem repleti sunt insipientia, et colloquebantur ad invicem, quidnam facerent Jesu.\"},{\"verse\":12,\"text\":\"Factum est autem in illis diebus, exiit in montem orare, et erat pernoctans in oratione Dei.\"},{\"verse\":13,\"text\":\"Et cum dies factus esset, vocavit discipulos suos : et elegit duodecim ex ipsis (quos et apostolos nominavit) :\"},{\"verse\":14,\"text\":\"Simonem, quem cognominavit Petrum, et Andream fratrem ejus, Jacobum, et Joannem, Philippum, et Bartholomæum,\"},{\"verse\":15,\"text\":\"Matthæum, et Thomam, Jacobum Alphæi, et Simonem, qui vocatur Zelotes,\"},{\"verse\":16,\"text\":\"et Judam Jacobi, et Judam Iscariotem, qui fuit proditor.\"},{\"verse\":17,\"text\":\"Et descendens cum illis, stetit in loco campestri, et turba discipulorum ejus, et multitudo copiosa plebis ab omni Judæa, et Jerusalem, et maritima, et Tyri, et Sidonis,\"},{\"verse\":18,\"text\":\"qui venerant ut audirent eum, et sanarentur a languoribus suis. Et qui vexabantur a spiritibus immundis, curabantur.\"},{\"verse\":19,\"text\":\"Et omnis turba quærebat eum tangere : quia virtus de illo exibat, et sanabat omnes.\"},{\"verse\":20,\"text\":\"Et ipse elevatis oculis in discipulis suis, dicebat : Beati pauperes, quia vestrum est regnum Dei.\"},{\"verse\":21,\"text\":\"Beati qui nunc esuritis, quia saturabimini. Beati qui nunc fletis, quia ridebitis.\"},{\"verse\":22,\"text\":\"Beati eritis cum vos oderint homines, et cum separaverint vos, et exprobraverint, et ejicerint nomen vestrum tamquam malum propter Filium hominis.\"},{\"verse\":23,\"text\":\"Gaudete in illa die, et exsultate : ecce enim merces vestra multa est in cælo : secundum hæc enim faciebant prophetis patres eorum.\"},{\"verse\":24,\"text\":\"Verumtamen væ vobis divitibus, quia habetis consolationem vestram.\"},{\"verse\":25,\"text\":\"Væ vobis, qui saturati estis : quia esurietis. Væ vobis, qui ridetis nunc : quia lugebitis et flebitis.\"},{\"verse\":26,\"text\":\"Væ cum benedixerint vobis homines : secundum hæc enim faciebant pseudoprophetis patres eorum.\"},{\"verse\":27,\"text\":\"Sed vobis dico, qui auditis : diligite inimicos vestros, benefacite his qui oderunt vos.\"},{\"verse\":28,\"text\":\"Benedicite maledicentibus vobis, et orate pro calumniantibus vos.\"},{\"verse\":29,\"text\":\"Et qui te percutit in maxillam, præbe et alteram. Et ab eo qui aufert tibi vestimentum, etiam tunicam noli prohibere.\"},{\"verse\":30,\"text\":\"Omni autem petenti te, tribue : et qui aufert quæ tua sunt, ne repetas.\"},{\"verse\":31,\"text\":\"Et prout vultis ut faciant vobis homines, et vos facite illis similiter.\"},{\"verse\":32,\"text\":\"Et si diligitis eos qui vos diligunt, quæ vobis est gratia ? nam et peccatores diligentes se diligunt.\"},{\"verse\":33,\"text\":\"Et si benefeceritis his qui vobis benefaciunt, quæ vobis est gratia ? siquidem et peccatores hoc faciunt.\"},{\"verse\":34,\"text\":\"Et si mutuum dederitis his a quibus speratis recipere, quæ gratia est vobis ? nam et peccatores peccatoribus fœnerantur, ut recipiant æqualia.\"},{\"verse\":35,\"text\":\"Verumtamen diligite inimicos vestros : benefacite, et mutuum date, nihil inde sperantes : et erit merces vestra multa, et eritis filii Altissimi, quia ipse benignus est super ingratos et malos.\"},{\"verse\":36,\"text\":\"Estote ergo misericordes sicut et Pater vester misericors est.\"},{\"verse\":37,\"text\":\"Nolite judicare, et non judicabimini : nolite condemnare, et non condemnabimini. Dimitte, et dimittemini.\"},{\"verse\":38,\"text\":\"Date, et dabitur vobis : mensuram bonam, et confertam, et coagitatam, et supereffluentem dabunt in sinum vestrum. Eadem quippe mensura, qua mensi fueritis, remetietur vobis.\"},{\"verse\":39,\"text\":\"Dicebat autem illis et similitudinem : Numquid potest cæcus cæcum ducere ? nonne ambo in foveam cadunt ?\"},{\"verse\":40,\"text\":\"Non est discipulus super magistrum : perfectus autem omnis erit, si sit sicut magister ejus.\"},{\"verse\":41,\"text\":\"Quid autem vides festucam in oculo fratris tui, trabem autem, quæ in oculo tuo est, non consideras ?\"},{\"verse\":42,\"text\":\"aut quomodo potes dicere fratri tuo : Frater, sine ejiciam festucam de oculo tuo : ipse in oculo tuo trabem non videns ? Hypocrita, ejice primum trabem de oculo tuo : et tunc perspicies ut educas festucam de oculo fratris tui.\"},{\"verse\":43,\"text\":\"Non est enim arbor bona, quæ facit fructus malos : neque arbor mala, faciens fructum bonum.\"},{\"verse\":44,\"text\":\"Unaquæque enim arbor de fructu suo cognoscitur. Neque enim de spinis colligunt ficus : neque de rubo vindemiant uvam.\"},{\"verse\":45,\"text\":\"Bonus homo de bono thesauro cordis sui profert bonum : et malus homo de malo thesauro profert malum. Ex abundantia enim cordis os loquitur.\"},{\"verse\":46,\"text\":\"Quid autem vocatis me Domine, Domine : et non facitis quæ dico ?\"},{\"verse\":47,\"text\":\"Omnis qui venit ad me, et audit sermones meos, et facit eos, ostendam vobis cui similis sit :\"},{\"verse\":48,\"text\":\"similis est homini ædificanti domum, qui fodit in altum, et posuit fundamentum super petram : inundatione autem facta, illisum est flumen domui illi, et non potuit eam movere : fundata enim erat super petram.\"},{\"verse\":49,\"text\":\"Qui autem audit, et non facit, similis est homini ædificanti domum suam super terram sine fundamento : in quam illisus est fluvius, et continuo cecidit : et facta est ruina domus illius magna.\"}],\"summary\":\"Christ excuses his disciples. He cures upon the sabbath day, chooses the twelve and makes a sermon to them.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":5,\"label\":\"Luke 5\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":7,\"label\":\"Luke 7\"}}]]\n"])</script></body></html>
