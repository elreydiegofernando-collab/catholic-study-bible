<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 23 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">23</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The continuation of the history of the passion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the whole multitude of them, rising up, led him to Pilate.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they began to accuse him, saying: We have found this man perverting our nation and forbidding to give tribute to Caesar and saying that he is Christ the king.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Pilate asked him, saying: Art thou the king of the Jews? But he answering, said: Thou sayest it.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Pilate said to the chief priests and to the multitudes: I find no cause in this man.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But they were more earnest, saying: He stirreth up the people, teaching throughout all Judea, beginning from Galilee to this place.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But Pilate hearing Galilee, asked if the man were of Galilee?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when he understood that he was of Herod’s jurisdiction, he sent him away to Herod, who was also himself at Jerusalem in those days.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Herod seeing Jesus, was very glad: for he was desirous of a long time to see him, because he had heard many things of him; and he hoped to see some sign wrought by him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he questioned him in many words. But he answered him nothing.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the chief priests and the scribes stood by, earnestly accusing him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And Herod with his army set him at nought and mocked him, putting on him a white garment: and sent him back to Pilate.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Herod and Pilate were made friends, that same day: for before they were enemies one to another.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Pilate, calling together the chief priests and the magistrates and the people,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Said to them: You have presented unto me this man as one that perverteth the people. And behold I, having examined him before you, find no cause in this man, in those things wherein you accuse him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>No, nor Herod neither. For, I sent you to him: and behold, nothing worthy of death is done to him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I will chastise him therefore and release him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Now of necessity he was to release unto them one upon the feast day.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But the whole multitude together cried out, saying: Away with this man, and release unto us Barabbas:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Who, for a certain sedition made in the city and for a murder, was cast into prison.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Pilate again spoke to them, desiring to release Jesus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But they cried again, saying: Crucify him, Crucify him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he said to them the third time: Why, what evil hath this man done? I find no cause of death in him. I will chastise him therefore and let him go.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But they were instant with loud voices, requiring that he might be crucified. And their voices prevailed.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And Pilate gave sentence that it should be as they required.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he released unto them him who for murder and sedition had been cast into prison, whom they had desired. But Jesus he delivered up to their will.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And as they led him away, they laid hold of one Simon of Cyrene, coming from the country; and they laid the cross on him to carry after Jesus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And there followed him a great multitude of people and of women, who bewailed and lamented him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>But Jesus turning to them, said: Daughters of Jerusalem, weep not over me; but weep for yourselves and for your children.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For behold, the days shall come, wherein they will say: Blessed are the barren and the wombs that have not borne and the paps that have not given suck.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Then shall they begin to say to the mountains: Fall upon us. And to the hills: Cover us.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For if in the green wood they do these things, what shall be done in the dry?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And there were also two other malefactors led with him to be put to death.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And when they were come to the place which is called Calvary, they crucified him there: and the robbers, one on the right hand, and the other on the left.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And Jesus said: Father, forgive them, for they know not what they do. But they, dividing his garments, cast lots.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the people stood beholding. And the rulers with them derided him, saying: He saved others: let him save himself, if he be Christ, the elect of God.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And the soldiers also mocked him, coming to him and offering him vinegar,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And saying: If thou be the king of the Jews, save thyself.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And there was also a superscription written over him in letters of Greek and Latin and Hebrew THIS IS THE KING OF THE JEWS.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And one of those robbers who were hanged blasphemed him, saying: If thou be Christ, save thyself and us.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But the other answering, rebuked him, saying: Neither dost thou fear God, seeing; thou art under the same condemnation?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And we indeed justly: for we receive the due reward of our deeds. But this man hath done no evil.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And he said to Jesus: Lord, remember me when thou shalt come into thy kingdom.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And Jesus said to him: Amen I say to thee: This day thou shalt be with me in paradise.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And it was almost the sixth hour: and there was darkness over all the earth until the ninth hour.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And the sun was darkened, and the veil of the temple was rent in the midst.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And Jesus crying with a loud voice, said: Father, into thy hands I commend my spirit. And saying this, he gave up the ghost.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Now, the centurion, seeing what was done, glorified God, saying: Indeed this was a just man.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And all the multitude of them that were come together to that sight and saw the things that were done returned, striking their breasts.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And all his acquaintance and the women that had followed him from Galilee stood afar off, beholding these things.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And behold there was a man named Joseph who was a counsellor, a good and a just man,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>(The same had not consented to their counsel and doings) of Arimathea, a city of Judea: who also himself looked for the kingdom of God.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>This man went to Pilate and begged the body of Jesus.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And taking him down, he wrapped him in fine linen and laid him in a sepulchre that was hewed in stone, wherein never yet any man had been laid.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And it was the day of the Parasceve: and the sabbath drew on.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And the women that were come with him from Galilee, following after, saw the sepulchre and how his body was laid.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>And returning, they prepared spices and ointments: and on the sabbath day they rested, according to the commandment.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et surgens omnis multitudo eorum, duxerunt illum ad Pilatum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cœperunt autem illum accusare, dicentes : Hunc invenimus subvertentem gentem nostram, et prohibentem tributa dare Cæsari, et dicentem se Christum regem esse.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Pilatus autem interrogavit eum, dicens : Tu es rex Judæorum ? At ille respondens ait : Tu dicis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ait autem Pilatus ad principes sacerdotum et turbas : Nihil invenio causæ in hoc homine.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>At illi invalescebant, dicentes : Commovet populum docens per universam Judæam, incipiens a Galilæa usque huc.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Pilatus autem audiens Galilæam, interrogavit si homo Galilæus esset.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et ut cognovit quod de Herodis potestate esset, remisit eum ad Herodem, qui et ipse Jerosolymis erat illis diebus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Herodes autem viso Jesu, gavisus est valde. Erat enim cupiens ex multo tempore videre eum, eo quod audierat multa de eo, et sperabat signum aliquod videre ab eo fieri.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Interrogabat autem eum multis sermonibus. At ipse nihil illi respondebat.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Stabant autem principes sacerdotum et scribæ constanter accusantes eum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sprevit autem illum Herodes cum exercitu suo : et illusit indutum veste alba, et remisit ad Pilatum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et facti sunt amici Herodes et Pilatus in ipsa die : nam antea inimici erant ad invicem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Pilatus autem, convocatis principibus sacerdotum, et magistratibus, et plebe,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>dixit ad illos : Obtulistis mihi hunc hominem, quasi avertentem populum, et ecce ego coram vobis interrogans, nullam causam inveni in homine isto ex his in quibus eum accusatis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sed neque Herodes : nam remisi vos ad illum, et ecce nihil dignum morte actum est ei.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Emendatum ergo illum dimittam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Necesse autem habebat dimittere eis per diem festum unum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Exclamavit autem simul universa turba, dicens : Tolle hunc, et dimitte nobis Barabbam :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>qui erat propter seditionem quamdam factam in civitate et homicidium missus in carcerem.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Iterum autem Pilatus locutus est ad eos, volens dimittere Jesum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At illi succlamabant, dicentes : Crucifige, crucifige eum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ille autem tertio dixit ad illos : Quid enim mali fecit iste ? nullam causam mortis invenio in eo : corripiam ergo illum et dimittam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>At illi instabant vocibus magnis postulantes ut crucifigeretur : et invalescebant voces eorum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et Pilatus adjudicavit fieri petitionem eorum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dimisit autem illis eum qui propter homicidium et seditionem missus fuerat in carcerem, quem petebant : Jesum vero tradidit voluntati eorum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et cum ducerent eum, apprehenderunt Simonem quemdam Cyrenensem venientem de villa : et imposuerunt illi crucem portare post Jesum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sequebatur autem illum multa turba populi et mulierum, quæ plangebant et lamentabantur eum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Conversus autem ad illas Jesus, dixit : Filiæ Jerusalem, nolite flere super me, sed super vos ipsas flete et super filios vestros.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quoniam ecce venient dies in quibus dicent : Beatæ steriles, et ventres qui non genuerunt, et ubera quæ non lactaverunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Tunc incipient dicere montibus : Cadite super nos ; et collibus : Operite nos.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Quia si in viridi ligno hæc faciunt, in arido quid fiet ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ducebantur autem et alii duo nequam cum eo, ut interficerentur.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et postquam venerunt in locum qui vocatur Calvariæ, ibi crucifixerunt eum : et latrones, unum a dextris, et alterum a sinistris.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jesus autem dicebat : Pater, dimitte illis : non enim sciunt quid faciunt. Dividentes vero vestimenta ejus, miserunt sortes.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et stabat populus spectans, et deridebant eum principes cum eis, dicentes : Alios salvos fecit, se salvum faciat, si hic est Christus Dei electus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Illudebant autem ei et milites accedentes, et acetum offerentes ei,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et dicentes : Si tu es rex Judæorum, salvum te fac.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Erat autem et superscriptio scripta super eum litteris græcis, et latinis, et hebraicis : Hic est rex Judæorum.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Unus autem de his, qui pendebant, latronibus, blasphemabat eum, dicens : Si tu es Christus, salvum fac temetipsum et nos.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Respondens autem alter increpabat eum, dicens : Neque tu times Deum, quod in eadem damnatione es.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et nos quidem juste, nam digna factis recipimus : hic vero nihil mali gessit.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et dicebat ad Jesum : Domine, memento mei cum veneris in regnum tuum.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et dixit illi Jesus : Amen dico tibi : hodie mecum eris in paradiso.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Erat autem fere hora sexta, et tenebræ factæ sunt in universam terram usque ad horam nonam.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et obscuratus est sol, et velum templi scissum est medium.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Et clamans voce magna Jesus ait : Pater, in manus tuas commendo spiritum meum. Et hæc dicens, expiravit.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Videns autem centurio quod factum fuerat, glorificavit Deum, dicens : Vere hic homo justus erat.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Et omnis turba eorum, qui simul aderant ad spectaculum istud, et videbant quæ fiebant, percutientes pectora sua revertebantur.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Stabant autem omnes noti ejus a longe, et mulieres, quæ secutæ eum erant a Galilæa, hæc videntes.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Et ecce vir nomine Joseph, qui erat decurio, vir bonus et justus :</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>hic non consenserat consilio, et actibus eorum : ab Arimathæa civitate Judææ, qui exspectabat et ipse regnum Dei :</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>hic accessit ad Pilatum et petiit corpus Jesu :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>et depositum involvit sindone, et posuit eum in monumento exciso, in quo nondum quisquam positus fuerat.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Et dies erat parasceves, et sabbatum illucescebat.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Subsecutæ autem mulieres, quæ cum eo venerant de Galilæa, viderunt monumentum, et quemadmodum positum erat corpus ejus.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Et revertentes paraverunt aromata, et unguenta : et sabbato quidem siluerunt secundum mandatum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/22/"><svg viewBox="0 0 24 24" fill="none" stroke="cur , rising up, led him to Pilate.\"},{\"verse\":2,\"text\":\"And they began to accuse him, saying: We have found this man perverting our nation and forbidding to give tribute to Caesar and saying that he is Christ the king.\"},{\"verse\":3,\"text\":\"And Pilate asked him, saying: Art thou the king of the Jews? But he answering, said: Thou sayest it.\"},{\"verse\":4,\"text\":\"And Pilate said to the chief priests and to the multitudes: I find no cause in this man.\"},{\"verse\":5,\"text\":\"But they were more earnest, saying: He stirreth up the people, teaching throughout all Judea, beginning from Galilee to this place.\"},{\"verse\":6,\"text\":\"But Pilate hearing Galilee, asked if the man were of Galilee?\"},{\"verse\":7,\"text\":\"And when he understood that he was of Herod’s jurisdiction, he sent him away to Herod, who was also himself at Jerusalem in those days.\"},{\"verse\":8,\"text\":\"And Herod seeing Jesus, was very glad: for he was desirous of a long time to see him, because he had heard many things of him; and he hoped to see some sign wrought by him.\"},{\"verse\":9,\"text\":\"And he questioned him in many words. But he answered him nothing.\"},{\"verse\":10,\"text\":\"And the chief priests and the scribes stood by, earnestly accusing him.\"},{\"verse\":11,\"text\":\"And Herod with his army set him at nought and mocked him, putting on him a white garment: and sent him back to Pilate.\"},{\"verse\":12,\"text\":\"And Herod and Pilate were made friends, that same day: for before they were enemies one to another.\"},{\"verse\":13,\"text\":\"And Pilate, calling together the chief priests and the magistrates and the people,\"},{\"verse\":14,\"text\":\"Said to them: You have presented unto me this man as one that perverteth the people. And behold I, having examined him before you, find no cause in this man, in those things wherein you accuse him.\"},{\"verse\":15,\"text\":\"No, nor Herod neither. For, I sent you to him: and behold, nothing worthy of death is done to him.\"},{\"verse\":16,\"text\":\"I will chastise him therefore and release him.\"},{\"verse\":17,\"text\":\"Now of necessity he was to release unto them one upon the feast day.\"},{\"verse\":18,\"text\":\"But the whole multitude together cried out, saying: Away with this man, and release unto us Barabbas:\"},{\"verse\":19,\"text\":\"Who, for a certain sedition made in the city and for a murder, was cast into prison.\"},{\"verse\":20,\"text\":\"And Pilate again spoke to them, desiring to release Jesus.\"},{\"verse\":21,\"text\":\"But they cried again, saying: Crucify him, Crucify him.\"},{\"verse\":22,\"text\":\"And he said to them the third time: Why, what evil hath this man done? I find no cause of death in him. I will chastise him therefore and let him go.\"},{\"verse\":23,\"text\":\"But they were instant with loud voices, requiring that he might be crucified. And their voices prevailed.\"},{\"verse\":24,\"text\":\"And Pilate gave sentence that it should be as they required.\"},{\"verse\":25,\"text\":\"And he released unto them him who for murder and sedition had been cast into prison, whom they had desired. But Jesus he delivered up to their will.\"},{\"verse\":26,\"text\":\"And as they led him away, they laid hold of one Simon of Cyrene, coming from the country; and they laid the cross on him to carry after Jesus.\"},{\"verse\":27,\"text\":\"And there followed him a great multitude of people and of women, who bewailed and lamented him.\"},{\"verse\":28,\"text\":\"But Jesus turning to them, said: Daughters of Jerusalem, weep not over me; but weep for yourselves and for your children.\"},{\"verse\":29,\"text\":\"For behold, the days shall come, wherein they will say: Blessed are the barren and the wombs that have not borne and the paps that have not given suck.\"},{\"verse\":30,\"text\":\"Then shall they begin to say to the mountains: Fall upon us. And to the hills: Cover us.\"},{\"verse\":31,\"text\":\"For if in the green wood they do these things, what shall be done in the dry?\"},{\"verse\":32,\"text\":\"And there were also two other malefactors led with him to be put to death.\"},{\"verse\":33,\"text\":\"And when they were come to the place which is called Calvary, they crucified him there: and the robbers, one on the right hand, and the other on the left.\"},{\"verse\":34,\"text\":\"And Jesus said: Father, forgive them, for they know not what they do. But they, dividing his garments, cast lots.\"},{\"verse\":35,\"text\":\"And the people stood beholding. And the rulers with them derided him, saying: He saved others: let him save himself, if he be Christ, the elect of God.\"},{\"verse\":36,\"text\":\"And the soldiers also mocked him, coming to him and offering him vinegar,\"},{\"verse\":37,\"text\":\"And saying: If thou be the king of the Jews, save thyself.\"},{\"verse\":38,\"text\":\"And there was also a superscription written over him in letters of Greek and Latin and Hebrew THIS IS THE KING OF THE JEWS.\"},{\"verse\":39,\"text\":\"And one of those robbers who were hanged blasphemed him, saying: If thou be Christ, save thyself and us.\"},{\"verse\":40,\"text\":\"But the other answering, rebuked him, saying: Neither dost thou fear God, seeing; thou art under the same condemnation?\"},{\"verse\":41,\"text\":\"And we indeed justly: for we receive the due reward of our deeds. But this man hath done no evil.\"},{\"verse\":42,\"text\":\"And he said to Jesus: Lord, remember me when thou shalt come into thy kingdom.\"},{\"verse\":43,\"text\":\"And Jesus said to him: Amen I say to thee: This day thou shalt be with me in paradise.\"},{\"verse\":44,\"text\":\"And it was almost the sixth hour: and there was darkness over all the earth until the ninth hour.\"},{\"verse\":45,\"text\":\"And the sun was darkened, and the veil of the temple was rent in the midst.\"},{\"verse\":46,\"text\":\"And Jesus crying with a loud voice, said: Father, into thy hands I commend my spirit. And saying this, he gave up the ghost.\"},{\"verse\":47,\"text\":\"Now, the centurion, seeing what was done, glorified God, saying: Indeed this was a just man.\"},{\"verse\":48,\"text\":\"And all the multitude of them that were come together to that sight and saw the things that were done returned, striking their breasts.\"},{\"verse\":49,\"text\":\"And all his acquaintance and the women that had followed him from Galilee stood afar off, beholding these things.\"},{\"verse\":50,\"text\":\"And behold there was a man named Joseph who was a counsellor, a good and a just man,\"},{\"verse\":51,\"text\":\"(The same had not consented to their counsel and doings) of Arimathea, a city of Judea: who also himself looked for the kingdom of God.\"},{\"verse\":52,\"text\":\"This man went to Pilate and begged the body of Jesus.\"},{\"verse\":53,\"text\":\"And taking him down, he wrapped him in fine linen and laid him in a sepulchre that was hewed in stone, wherein never yet any man had been laid.\"},{\"verse\":54,\"text\":\"And it was the day of the Parasceve: and the sabbath drew on.\"},{\"verse\":55,\"text\":\"And the women that were come with him from Galilee, following after, saw the sepulchre and how his body was laid.\"},{\"verse\":56,\"text\":\"And returning, they prepared spices and ointments: and on the sabbath day they rested, according to the commandment.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et surgens omnis multitudo eorum, duxerunt illum ad Pilatum.\"},{\"verse\":2,\"text\":\"Cœperunt autem illum accusare, dicentes : Hunc invenimus subvertentem gentem nostram, et prohibentem tributa dare Cæsari, et dicentem se Christum regem esse.\"},{\"verse\":3,\"text\":\"Pilatus autem interrogavit eum, dicens : Tu es rex Judæorum ? At ille respondens ait : Tu dicis.\"},{\"verse\":4,\"text\":\"Ait autem Pilatus ad principes sacerdotum et turbas : Nihil invenio causæ in hoc homine.\"},{\"verse\":5,\"text\":\"At illi invalescebant, dicentes : Commovet populum docens per universam Judæam, incipiens a Galilæa usque huc.\"},{\"verse\":6,\"text\":\"Pilatus autem audiens Galilæam, interrogavit si homo Galilæus esset.\"},{\"verse\":7,\"text\":\"Et ut cognovit quod de Herodis potestate esset, remisit eum ad Herodem, qui et ipse Jerosolymis erat illis diebus.\"},{\"verse\":8,\"text\":\"Herodes autem viso Jesu, gavisus est valde. Erat enim cupiens ex multo tempore videre eum, eo quod audierat multa de eo, et sperabat signum aliquod videre ab eo fieri.\"},{\"verse\":9,\"text\":\"Interrogabat autem eum multis sermonibus. At ipse nihil illi respondebat.\"},{\"verse\":10,\"text\":\"Stabant autem principes sacerdotum et scribæ constanter accusantes eum.\"},{\"verse\":11,\"text\":\"Sprevit autem illum Herodes cum exercitu suo : et illusit indutum veste alba, et remisit ad Pilatum.\"},{\"verse\":12,\"text\":\"Et facti sunt amici Herodes et Pilatus in ipsa die : nam antea inimici erant ad invicem.\"},{\"verse\":13,\"text\":\"Pilatus autem, convocatis principibus sacerdotum, et magistratibus, et plebe,\"},{\"verse\":14,\"text\":\"dixit ad illos : Obtulistis mihi hunc hominem, quasi avertentem populum, et ecce ego coram vobis interrogans, nullam causam inveni in homine isto ex his in quibus eum accusatis.\"},{\"verse\":15,\"text\":\"Sed neque Herodes : nam remisi vos ad illum, et ecce nihil dignum morte actum est ei.\"},{\"verse\":16,\"text\":\"Emendatum ergo illum dimittam.\"},{\"verse\":17,\"text\":\"Necesse autem habebat dimittere eis per diem festum unum.\"},{\"verse\":18,\"text\":\"Exclamavit autem simul universa turba, dicens : Tolle hunc, et dimitte nobis Barabbam :\"},{\"verse\":19,\"text\":\"qui erat propter seditionem quamdam factam in civitate et homicidium missus in carcerem.\"},{\"verse\":20,\"text\":\"Iterum autem Pilatus locutus est ad eos, volens dimittere Jesum.\"},{\"verse\":21,\"text\":\"At illi succlamabant, dicentes : Crucifige, crucifige eum.\"},{\"verse\":22,\"text\":\"Ille autem tertio dixit ad illos : Quid enim mali fecit iste ? nullam causam mortis invenio in eo : corripiam ergo illum et dimittam.\"},{\"verse\":23,\"text\":\"At illi instabant vocibus magnis postulantes ut crucifigeretur : et invalescebant voces eorum.\"},{\"verse\":24,\"text\":\"Et Pilatus adjudicavit fieri petitionem eorum.\"},{\"verse\":25,\"text\":\"Dimisit autem illis eum qui propter homicidium et seditionem missus fuerat in carcerem, quem petebant : Jesum vero tradidit voluntati eorum.\"},{\"verse\":26,\"text\":\"Et cum ducerent eum, apprehenderunt Simonem quemdam Cyrenensem venientem de villa : et imposuerunt illi crucem portare post Jesum.\"},{\"verse\":27,\"text\":\"Sequebatur autem illum multa turba populi et mulierum, quæ plangebant et lamentabantur eum.\"},{\"verse\":28,\"text\":\"Conversus autem ad illas Jesus, dixit : Filiæ Jerusalem, nolite flere super me, sed super vos ipsas flete et super filios vestros.\"},{\"verse\":29,\"text\":\"Quoniam ecce venient dies in quibus dicent : Beatæ steriles, et ventres qui non genuerunt, et ubera quæ non lactaverunt.\"},{\"verse\":30,\"text\":\"Tunc incipient dicere montibus : Cadite super nos ; et collibus : Operite nos.\"},{\"verse\":31,\"text\":\"Quia si in viridi ligno hæc faciunt, in arido quid fiet ?\"},{\"verse\":32,\"text\":\"Ducebantur autem et alii duo nequam cum eo, ut interficerentur.\"},{\"verse\":33,\"text\":\"Et postquam venerunt in locum qui vocatur Calvariæ, ibi crucifixerunt eum : et latrones, unum a dextris, et alterum a sinistris.\"},{\"verse\":34,\"text\":\"Jesus autem dicebat : Pater, dimitte illis : non enim sciunt quid faciunt. Dividentes vero vestimenta ejus, miserunt sortes.\"},{\"verse\":35,\"text\":\"Et stabat populus spectans, et deridebant eum principes cum eis, dicentes : Alios salvos fecit, se salvum faciat, si hic est Christus Dei electus.\"},{\"verse\":36,\"text\":\"Illudebant autem ei et milites accedentes, et acetum offerentes ei,\"},{\"verse\":37,\"text\":\"et dicentes : Si tu es rex Judæorum, salvum te fac.\"},{\"verse\":38,\"text\":\"Erat autem et superscriptio scripta super eum litteris græcis, et latinis, et hebraicis : Hic est rex Judæorum.\"},{\"verse\":39,\"text\":\"Unus autem de his, qui pendebant, latronibus, blasphemabat eum, dicens : Si tu es Christus, salvum fac temetipsum et nos.\"},{\"verse\":40,\"text\":\"Respondens autem alter increpabat eum, dicens : Neque tu times Deum, quod in eadem damnatione es.\"},{\"verse\":41,\"text\":\"Et nos quidem juste, nam digna factis recipimus : hic vero nihil mali gessit.\"},{\"verse\":42,\"text\":\"Et dicebat ad Jesum : Domine, memento mei cum veneris in regnum tuum.\"},{\"verse\":43,\"text\":\"Et dixit illi Jesus : Amen dico tibi : hodie mecum eris in paradiso.\"},{\"verse\":44,\"text\":\"Erat autem fere hora sexta, et tenebræ factæ sunt in universam terram usque ad horam nonam.\"},{\"verse\":45,\"text\":\"Et obscuratus est sol, et velum templi scissum est medium.\"},{\"verse\":46,\"text\":\"Et clamans voce magna Jesus ait : Pater, in manus tuas commendo spiritum meum. Et hæc dicens, expiravit.\"},{\"verse\":47,\"text\":\"Videns autem centurio quod factum fuerat, glorificavit Deum, dicens : Vere hic homo justus erat.\"},{\"verse\":48,\"text\":\"Et omnis turba eorum, qui simul aderant ad spectaculum istud, et videbant quæ fiebant, percutientes pectora sua revertebantur.\"},{\"verse\":49,\"text\":\"Stabant autem omnes noti ejus a longe, et mulieres, quæ secutæ eum erant a Galilæa, hæc videntes.\"},{\"verse\":50,\"text\":\"Et ecce vir nomine Joseph, qui erat decurio, vir bonus et justus :\"},{\"verse\":51,\"text\":\"hic non consenserat consilio, et actibus eorum : ab Arimathæa civitate Judææ, qui exspectabat et ipse regnum Dei :\"},{\"verse\":52,\"text\":\"hic accessit ad Pilatum et petiit corpus Jesu :\"},{\"verse\":53,\"text\":\"et depositum involvit sindone, et posuit eum in monumento exciso, in quo nondum quisquam positus fuerat.\"},{\"verse\":54,\"text\":\"Et dies erat parasceves, et sabbatum illucescebat.\"},{\"verse\":55,\"text\":\"Subsecutæ autem mulieres, quæ cum eo venerant de Galilæa, viderunt monumentum, et quemadmodum positum erat corpus ejus.\"},{\"verse\":56,\"text\":\"Et revertentes paraverunt aromata, et unguenta : et sabbato quidem siluerunt secundum mandatum.\"}],\"summary\":\"The continuation of the history of the passion.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":22,\"label\":\"Luke 22\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":24,\"label\":\"Luke 24\"}}]]\n"])</script></body></html>
