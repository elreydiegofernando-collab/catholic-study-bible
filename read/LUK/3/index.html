35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">John’s mission and preaching. Christ is baptized by him.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judea, and Herod being tetrarch of Galilee, and Philip his brother tetrarch of Iturea and the country of Trachonitis, and Lysanias tetrarch of Abilina:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Under the high priests Annas and Caiphas: the word of the Lord was made unto John, the son of Zachary, in the desert.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he came into all the country about the Jordan, preaching the baptism of penance for the remission of sins.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>As it was written in the book of the sayings of Isaias the prophet: A voice of one crying in the wilderness: Prepare ye the way of the Lord, make straight his paths.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Every valley shall be filled and every mountain and hill shall be brought low: and the crooked shall be made straight, and the rough ways plain.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And all flesh shall see the salvation of God.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>He said therefore to the multitudes that went forth to be baptized by him: Ye offspring of vipers, who hath shewed you to flee from the wrath to come?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Bring forth therefore fruits worthy of penance: and do not begin to say, We have Abraham for our father. For I say unto you that God is able of these stones, to raise up children to Abraham.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For now the axe is laid to the root of the trees. Every tree therefore that bringeth not forth good fruit shall be cut down and cast into the fire.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the people asked him, saying: What then shall we do?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he answering, said to them: He that hath two coats, let him give to him that hath none; and he that hath meat, let him do in like manner.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And the publicans also came to be baptized and said to him: Master, what shall we do?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But he said to them: Do nothing more than that which is appointed you.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the soldiers also asked him, saying: And what shall we do? And he said to them: Do violence to no man, neither calumniate any man; and be content with your pay.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And as the people were of opinion, and all were thinking in their hearts of John, that perhaps he might be the Christ:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>John answered, saying unto all: I indeed baptize you with water: but there shall come one mightier than I, the latchet of whose shoes I am not worthy to loose. He shall baptize you with the Holy Ghost and with fire;</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Whose fan is in his hand: and he will purge his floor and will gather the wheat into his barn: but the chaff he will burn with unquenchable fire.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And many other things exhorting did he preach to the people.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But Herod the tetrarch, when he was reproved by him for Herodias, his brother’s wife, and for all the evils which Herod had done:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He added this also above all and shut up John in prison.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Now it came to pass, when all the people were baptized, that Jesus also being baptized and praying, heaven was opened.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the Holy Ghost descended in a bodily shape, as a dove, upon him. And a voice came from heaven: Thou art my beloved Son. In thee I am well pleased.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Jesus himself was beginning about the age of thirty years: being (as it was supposed) the son of Joseph, who was of Heli, who was of Mathat,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Who was of Levi, who was of Melchi, who was of Janne, who was of Joseph,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Who was of Mathathias, who was of Amos, who was of Nahum, who was of Hesli, who was of Nagge,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Who was of Mahath, who was of Mathathias, who was of Semei, who was of Joseph, who was of Juda,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Who was of Joanna, who was of Reza, who was of Zorobabel, who was of Salathiel, who was of Neri,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Who was of Melchi, who was of Addi, who was of Cosan, who was of Helmadan, who was of Her,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Who was of Jesus, who was of Eliezer, who was of Jorim, who was of Mathat, who was of Levi,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Who was of Simeon, who was of Judas, who was of Joseph, who was of Jona, who was of Eliakim,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Who was of Melea, who was of Menna, who was of Mathatha, who was of Nathan, who was of David,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Who was of Jesse, who was of Obed, who was of Booz, who was of Salmon, who was of Naasson,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Who was of Aminadab, who was of Aram, who was of Esron, who was of Phares, who was of Judas,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Who was of Jacob, who was of Isaac, who was of Abraham, who was of Thare, who was of Nachor,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Who was of Sarug, who was of Ragau, who was of Phaleg, who was of Heber, who was of Sale,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Who was of Cainan, who was of Arphaxad, who was of Sem, who was of Noe, who was of Lamech,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Who was of Mathusale, who was of Henoch, who was of Jared, who was of Malaleel, who was of Cainan,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Who was of Henos, who was of Seth, who was of Adam, who was of God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Anno autem quintodecimo imperii Tiberii Cæsaris, procurante Pontio Pilato Judæam, tetrarcha autem Galilææ Herode, Philippo autem fratre ejus tetrarcha Iturææ, et Trachonitidis regionis, et Lysania Abilinæ tetrarcha,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sub principibus sacerdotum Anna et Caipha : factum est verbum Domini super Joannem, Zachariæ filium, in deserto.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et venit in omnem regionem Jordanis, prædicans baptismum pœnitentiæ in remissionem peccatorum,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>sicut scriptum est in libro sermonum Isaiæ prophetæ : Vox clamantis in deserto : Parate viam Domini ; rectas facite semitas ejus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>omnis vallis implebitur, et omnis mons, et collis humiliabitur : et erunt prava in directa, et aspera in vias planas :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et videbit omnis caro salutare Dei.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dicebat ergo ad turbas quæ exibant ut baptizarentur ab ipso : Genimina viperarum, quis ostendit vobis fugere a ventura ira ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Facite ergo fructus dignos pœnitentiæ, et ne cœperitis dicere : Patrem habemus Abraham. Dico enim vobis quia potens est Deus de lapidibus istis suscitare filios Abrahæ.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Jam enim securis ad radicem arborum posita est. Omnis ergo arbor non faciens fructum bonum, excidetur, et in ignem mittetur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et interrogabant eum turbæ, dicentes : Quid ergo faciemus ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Respondens autem dicebat illis : Qui habet duas tunicas, det non habenti : et qui habet escas, similiter faciat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Venerunt autem et publicani ut baptizarentur, et dixerunt ad illum : Magister, quid faciemus ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>At ille dixit ad eos : Nihil amplius, quam quod constitutum est vobis, faciatis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Interrogabant autem eum et milites, dicentes : Quid faciemus et nos ? Et ait illis : Neminem concutiatis, neque calumniam faciatis : et contenti estote stipendiis vestris.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Existimante autem populo, et cogitantibus omnibus in cordibus suis de Joanne, ne forte ipse esset Christus,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>respondit Joannes, dicens omnibus : Ego quidem aqua baptizo vos : veniet autem fortior me, cujus non sum dignus solvere corrigiam calceamentorum ejus : ipse vos baptizabit in Spiritu Sancto et igni :</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>cujus ventilabrum in manu ejus, et purgabit aream suam, et congregabit triticum in horreum suum, paleas autem comburet igni inextinguibili.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Multa quidem et alia exhortans evangelizabat populo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Herodes autem tetrarcha cum corriperetur ab illo de Herodiade uxore fratris sui, et de omnibus malis quæ fecit Herodes,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>adjecit et hoc super omnia, et inclusit Joannem in carcere.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Factum est autem cum baptizaretur omnis populus, et Jesu baptizato, et orante, apertum est cælum :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>et descendit Spiritus Sanctus corporali specie sicut columba in ipsum : et vox de cælo facta est : Tu es filius meus dilectus, in te complacui mihi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ipse Jesus erat incipiens quasi annorum triginta, ut putabatur, filius Joseph, qui fuit Heli, qui fuit Mathat,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>qui fuit Levi, qui fuit Melchi, qui fuit Janne, qui fuit Joseph,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>qui fuit Mathathiæ, qui fuit Amos, qui fuit Nahum, qui fuit Hesli, qui fuit Nagge,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>qui fuit Mahath, qui fuit Mathathiæ, qui fuit Semei, qui fuit Joseph, qui fuit Juda,</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>qui fuit Joanna, qui fuit Resa, qui fuit Zorobabel, qui fuit Salathiel, qui fuit Neri,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui fuit Melchi, qui fuit Addi, qui fuit Cosan, qui fuit Elmadan, qui fuit Her,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>qui fuit Jesu, qui fuit Eliezer, qui fuit Jorim, qui fuit Mathat, qui fuit Levi,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>qui fuit Simeon, qui fuit Juda, qui fuit Joseph, qui fuit Jona, qui fuit Eliakim,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>qui fuit Melea, qui fuit Menna, qui fuit Mathatha, qui fuit Natham, qui fuit David,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>qui fuit Jesse, qui fuit Obed, qui fuit Booz, qui fuit Salmon, qui fuit Naasson,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>qui fuit Aminadab, qui fuit Aram, qui fuit Esron, qui fuit Phares, qui fuit Judæ,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>qui fuit Jacob, qui fuit Isaac, qui fuit Abrahæ, qui fuit Thare, qui fuit Nachor,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>qui fuit Sarug, qui fuit Ragau, qui fuit Phaleg, qui fuit Heber, qui fuit Sale,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>qui fuit Cainan, qui fuit Arphaxad, qui fuit Sem, qui fuit Noë, qui fuit Lamech,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>qui fuit Methusale, qui fuit Henoch, qui fuit Jared, qui fuit Malaleel, qui fuit Cainan,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>qui fuit Henos, qui fuit Seth, qui fuit Adam, qui fuit Dei.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-sto h priests Annas and Caiphas: the word of the Lord was made unto John, the son of Zachary, in the desert.\"},{\"verse\":3,\"text\":\"And he came into all the country about the Jordan, preaching the baptism of penance for the remission of sins.\"},{\"verse\":4,\"text\":\"As it was written in the book of the sayings of Isaias the prophet: A voice of one crying in the wilderness: Prepare ye the way of the Lord, make straight his paths.\"},{\"verse\":5,\"text\":\"Every valley shall be filled and every mountain and hill shall be brought low: and the crooked shall be made straight, and the rough ways plain.\"},{\"verse\":6,\"text\":\"And all flesh shall see the salvation of God.\"},{\"verse\":7,\"text\":\"He said therefore to the multitudes that went forth to be baptized by him: Ye offspring of vipers, who hath shewed you to flee from the wrath to come?\"},{\"verse\":8,\"text\":\"Bring forth therefore fruits worthy of penance: and do not begin to say, We have Abraham for our father. For I say unto you that God is able of these stones, to raise up children to Abraham.\"},{\"verse\":9,\"text\":\"For now the axe is laid to the root of the trees. Every tree therefore that bringeth not forth good fruit shall be cut down and cast into the fire.\"},{\"verse\":10,\"text\":\"And the people asked him, saying: What then shall we do?\"},{\"verse\":11,\"text\":\"And he answering, said to them: He that hath two coats, let him give to him that hath none; and he that hath meat, let him do in like manner.\"},{\"verse\":12,\"text\":\"And the publicans also came to be baptized and said to him: Master, what shall we do?\"},{\"verse\":13,\"text\":\"But he said to them: Do nothing more than that which is appointed you.\"},{\"verse\":14,\"text\":\"And the soldiers also asked him, saying: And what shall we do? And he said to them: Do violence to no man, neither calumniate any man; and be content with your pay.\"},{\"verse\":15,\"text\":\"And as the people were of opinion, and all were thinking in their hearts of John, that perhaps he might be the Christ:\"},{\"verse\":16,\"text\":\"John answered, saying unto all: I indeed baptize you with water: but there shall come one mightier than I, the latchet of whose shoes I am not worthy to loose. He shall baptize you with the Holy Ghost and with fire;\"},{\"verse\":17,\"text\":\"Whose fan is in his hand: and he will purge his floor and will gather the wheat into his barn: but the chaff he will burn with unquenchable fire.\"},{\"verse\":18,\"text\":\"And many other things exhorting did he preach to the people.\"},{\"verse\":19,\"text\":\"But Herod the tetrarch, when he was reproved by him for Herodias, his brother’s wife, and for all the evils which Herod had done:\"},{\"verse\":20,\"text\":\"He added this also above all and shut up John in prison.\"},{\"verse\":21,\"text\":\"Now it came to pass, when all the people were baptized, that Jesus also being baptized and praying, heaven was opened.\"},{\"verse\":22,\"text\":\"And the Holy Ghost descended in a bodily shape, as a dove, upon him. And a voice came from heaven: Thou art my beloved Son. In thee I am well pleased.\"},{\"verse\":23,\"text\":\"And Jesus himself was beginning about the age of thirty years: being (as it was supposed) the son of Joseph, who was of Heli, who was of Mathat,\"},{\"verse\":24,\"text\":\"Who was of Levi, who was of Melchi, who was of Janne, who was of Joseph,\"},{\"verse\":25,\"text\":\"Who was of Mathathias, who was of Amos, who was of Nahum, who was of Hesli, who was of Nagge,\"},{\"verse\":26,\"text\":\"Who was of Mahath, who was of Mathathias, who was of Semei, who was of Joseph, who was of Juda,\"},{\"verse\":27,\"text\":\"Who was of Joanna, who was of Reza, who was of Zorobabel, who was of Salathiel, who was of Neri,\"},{\"verse\":28,\"text\":\"Who was of Melchi, who was of Addi, who was of Cosan, who was of Helmadan, who was of Her,\"},{\"verse\":29,\"text\":\"Who was of Jesus, who was of Eliezer, who was of Jorim, who was of Mathat, who was of Levi,\"},{\"verse\":30,\"text\":\"Who was of Simeon, who was of Judas, who was of Joseph, who was of Jona, who was of Eliakim,\"},{\"verse\":31,\"text\":\"Who was of Melea, who was of Menna, who was of Mathatha, who was of Nathan, who was of David,\"},{\"verse\":32,\"text\":\"Who was of Jesse, who was of Obed, who was of Booz, who was of Salmon, who was of Naasson,\"},{\"verse\":33,\"text\":\"Who was of Aminadab, who was of Aram, who was of Esron, who was of Phares, who was of Judas,\"},{\"verse\":34,\"text\":\"Who was of Jacob, who was of Isaac, who was of Abraham, who was of Thare, who was of Nachor,\"},{\"verse\":35,\"text\":\"Who was of Sarug, who was of Ragau, who was of Phaleg, who was of Heber, who was of Sale,\"},{\"verse\":36,\"text\":\"Who was of Cainan, who was of Arphaxad, who was of Sem, who was of Noe, who was of Lamech,\"},{\"verse\":37,\"text\":\"Who was of Mathusale, who was of Henoch, who was of Jared, who was of Malaleel, who was of Cainan,\"},{\"verse\":38,\"text\":\"Who was of Henos, who was of Seth, who was of Adam, who was of God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Anno autem quintodecimo imperii Tiberii Cæsaris, procurante Pontio Pilato Judæam, tetrarcha autem Galilææ Herode, Philippo autem fratre ejus tetrarcha Iturææ, et Trachonitidis regionis, et Lysania Abilinæ tetrarcha,\"},{\"verse\":2,\"text\":\"sub principibus sacerdotum Anna et Caipha : factum est verbum Domini super Joannem, Zachariæ filium, in deserto.\"},{\"verse\":3,\"text\":\"Et venit in omnem regionem Jordanis, prædicans baptismum pœnitentiæ in remissionem peccatorum,\"},{\"verse\":4,\"text\":\"sicut scriptum est in libro sermonum Isaiæ prophetæ : Vox clamantis in deserto : Parate viam Domini ; rectas facite semitas ejus :\"},{\"verse\":5,\"text\":\"omnis vallis implebitur, et omnis mons, et collis humiliabitur : et erunt prava in directa, et aspera in vias planas :\"},{\"verse\":6,\"text\":\"et videbit omnis caro salutare Dei.\"},{\"verse\":7,\"text\":\"Dicebat ergo ad turbas quæ exibant ut baptizarentur ab ipso : Genimina viperarum, quis ostendit vobis fugere a ventura ira ?\"},{\"verse\":8,\"text\":\"Facite ergo fructus dignos pœnitentiæ, et ne cœperitis dicere : Patrem habemus Abraham. Dico enim vobis quia potens est Deus de lapidibus istis suscitare filios Abrahæ.\"},{\"verse\":9,\"text\":\"Jam enim securis ad radicem arborum posita est. Omnis ergo arbor non faciens fructum bonum, excidetur, et in ignem mittetur.\"},{\"verse\":10,\"text\":\"Et interrogabant eum turbæ, dicentes : Quid ergo faciemus ?\"},{\"verse\":11,\"text\":\"Respondens autem dicebat illis : Qui habet duas tunicas, det non habenti : et qui habet escas, similiter faciat.\"},{\"verse\":12,\"text\":\"Venerunt autem et publicani ut baptizarentur, et dixerunt ad illum : Magister, quid faciemus ?\"},{\"verse\":13,\"text\":\"At ille dixit ad eos : Nihil amplius, quam quod constitutum est vobis, faciatis.\"},{\"verse\":14,\"text\":\"Interrogabant autem eum et milites, dicentes : Quid faciemus et nos ? Et ait illis : Neminem concutiatis, neque calumniam faciatis : et contenti estote stipendiis vestris.\"},{\"verse\":15,\"text\":\"Existimante autem populo, et cogitantibus omnibus in cordibus suis de Joanne, ne forte ipse esset Christus,\"},{\"verse\":16,\"text\":\"respondit Joannes, dicens omnibus : Ego quidem aqua baptizo vos : veniet autem fortior me, cujus non sum dignus solvere corrigiam calceamentorum ejus : ipse vos baptizabit in Spiritu Sancto et igni :\"},{\"verse\":17,\"text\":\"cujus ventilabrum in manu ejus, et purgabit aream suam, et congregabit triticum in horreum suum, paleas autem comburet igni inextinguibili.\"},{\"verse\":18,\"text\":\"Multa quidem et alia exhortans evangelizabat populo.\"},{\"verse\":19,\"text\":\"Herodes autem tetrarcha cum corriperetur ab illo de Herodiade uxore fratris sui, et de omnibus malis quæ fecit Herodes,\"},{\"verse\":20,\"text\":\"adjecit et hoc super omnia, et inclusit Joannem in carcere.\"},{\"verse\":21,\"text\":\"Factum est autem cum baptizaretur omnis populus, et Jesu baptizato, et orante, apertum est cælum :\"},{\"verse\":22,\"text\":\"et descendit Spiritus Sanctus corporali specie sicut columba in ipsum : et vox de cælo facta est : Tu es filius meus dilectus, in te complacui mihi.\"},{\"verse\":23,\"text\":\"Et ipse Jesus erat incipiens quasi annorum triginta, ut putabatur, filius Joseph, qui fuit Heli, qui fuit Mathat,\"},{\"verse\":24,\"text\":\"qui fuit Levi, qui fuit Melchi, qui fuit Janne, qui fuit Joseph,\"},{\"verse\":25,\"text\":\"qui fuit Mathathiæ, qui fuit Amos, qui fuit Nahum, qui fuit Hesli, qui fuit Nagge,\"},{\"verse\":26,\"text\":\"qui fuit Mahath, qui fuit Mathathiæ, qui fuit Semei, qui fuit Joseph, qui fuit Juda,\"},{\"verse\":27,\"text\":\"qui fuit Joanna, qui fuit Resa, qui fuit Zorobabel, qui fuit Salathiel, qui fuit Neri,\"},{\"verse\":28,\"text\":\"qui fuit Melchi, qui fuit Addi, qui fuit Cosan, qui fuit Elmadan, qui fuit Her,\"},{\"verse\":29,\"text\":\"qui fuit Jesu, qui fuit Eliezer, qui fuit Jorim, qui fuit Mathat, qui fuit Levi,\"},{\"verse\":30,\"text\":\"qui fuit Simeon, qui fuit Juda, qui fuit Joseph, qui fuit Jona, qui fuit Eliakim,\"},{\"verse\":31,\"text\":\"qui fuit Melea, qui fuit Menna, qui fuit Mathatha, qui fuit Natham, qui fuit David,\"},{\"verse\":32,\"text\":\"qui fuit Jesse, qui fuit Obed, qui fuit Booz, qui fuit Salmon, qui fuit Naasson,\"},{\"verse\":33,\"text\":\"qui fuit Aminadab, qui fuit Aram, qui fuit Esron, qui fuit Phares, qui fuit Judæ,\"},{\"verse\":34,\"text\":\"qui fuit Jacob, qui fuit Isaac, qui fuit Abrahæ, qui fuit Thare, qui fuit Nachor,\"},{\"verse\":35,\"text\":\"qui fuit Sarug, qui fuit Ragau, qui fuit Phaleg, qui fuit Heber, qui fuit Sale,\"},{\"verse\":36,\"text\":\"qui fuit Cainan, qui fuit Arphaxad, qui fuit Sem, qui fuit Noë, qui fuit Lamech,\"},{\"verse\":37,\"text\":\"qui fuit Methusale, qui fuit Henoch, qui fuit Jared, qui fuit Malaleel, qui fuit Cainan,\"},{\"verse\":38,\"text\":\"qui fuit Henos, qui fuit Seth, qui fuit Adam, qui fuit Dei.\"}],\"summary\":\"John’s mission and preaching. Christ is baptized by him.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":2,\"label\":\"Luke 2\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":4,\"label\":\"Luke 4\"}}]]\n"])</script></body></html>
