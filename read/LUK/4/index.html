<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 4 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s fasting and temptation. He is persecuted in Nazareth. His miracles in Capharnaum.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jesus being full of the Holy Ghost, returned from the Jordan and was led by the spirit into the desert,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For the space of forty days, and was tempted by the devil. And he ate nothing in those days. And when they were ended, he was hungry.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the devil said to him: If thou be the Son of God, say to this stone that it be made bread.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Jesus answered him: It is written that Man liveth not by bread alone, but by every word of God.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And the devil led him into a high mountain and shewed him all the kingdoms of the world in a moment of time.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he said to him: To thee will I give all this power and the glory of them. For to me they are delivered: and to whom I will, I give them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If thou therefore wilt adore before me, all shall be thine.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Jesus answering said to him. It is written: Thou shalt adore the Lord thy God, and him only shalt thou serve.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he brought him to Jerusalem and set him on a pinnacle of the temple and said to him: If thou be the Son of God, cast thyself from hence.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For it is written that He hath given his angels charge over thee that they keep thee.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And that in their hands they shall bear thee up, lest perhaps thou dash thy foot against a stone.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And Jesus answering, said to him: It is said: Thou shalt not tempt the Lord thy God.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And all the temptation being ended, the devil departed from him for a time.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Jesus returned in the power of the spirit, into Galilee: and the fame of him went out through the whole country.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he taught in their synagogues and was magnified by all.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he came to Nazareth, where he was brought up: and he went into the synagogue, according to his custom, on the sabbath day: and he rose up to read.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the book of Isaias the prophet was delivered unto him. And as he unfolded the book, he found the place where it was written:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The spirit of the Lord is upon me. Wherefore he hath anointed me to preach the gospel to the poor, he hath sent me to heal the contrite of heart,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To preach deliverance to the captives and sight to the blind, to set at liberty them that are bruised, to preach the acceptable year of the Lord and the day of reward.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when he had folded the book, he restored it to the minister and sat down. And the eyes of all in the synagogue were fixed on him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he began to say to them: This day is fulfilled this scripture in your ears.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And all gave testimony to him. And they wondered at the words of grace that proceeded from his mouth. And they said: Is not this the son of Joseph?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he said to them: Doubtless you will say to me this similitude: Physician, heal thyself. As great things as we have heard done in Capharnaum, do also here in thy own country.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he said: Amen I say to you that no prophet is accepted in his own country.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In truth I say to you, there were many widows in the days of Elias in Israel, when heaven was shut up three years and six months, when there was a great famine throughout all the earth.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And to none of them was Elias sent, but to Sarepta of Sidon, to a widow woman.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And there were many lepers in Israel in the time of Eliseus the prophet: and none of them was cleansed but Naaman the Syrian.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And all they in the synagogue, hearing these things, were filled with anger.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they rose up and thrust him out of the city: and they brought him to the brow of the hill whereon their city was built, that they might cast him down headlong.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But he passing through the midst of them, went his way.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And he went down into Capharnaum, a city of Galilee: and there he taught them on the sabbath days.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they were astonished at his doctrine: for his speech was with power.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And in the synagogue there was a man who had an unclean devil: and he cried out with a loud voice,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Saying: Let us alone. What have we to do with thee, Jesus of Nazareth? Art thou come to destroy us? I know thee who thou art, the holy one of God.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Jesus rebuked him, saying: Hold thy peace and go out of him. And when the devil had thrown him into the midst, he went out of him and hurt him not at all.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And there came fear upon all; and they talked among themselves, saying: What word is this, for with authority and power he commandeth the unclean spirits, and they go out?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And the fame of him was published into every place of the country.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Jesus rising up out of the synagogue, went into Simon’s house. And Simon’s wife’s mother was taken with a great fever: and they besought him for her.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And standing over her, he commanded the fever: and it left her. And immediately rising, she ministered to them.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when the sun was down, all they that had any sick with divers diseases brought them to him. But he, laying his hands on every one of them, healed them.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And devils went out from many, crying out and saying: Thou art the son of God. And rebuking them he suffered them not to speak; for they knew that he was Christ.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And when it was day, going out he went into a desert place: and the multitudes sought him, and came unto him. And they stayed him that he should not depart from them.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>To whom he said: To other cities also I must preach the kingdom of God: for therefore am I sent.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he was preaching in the synagogues of Galilee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Jesus autem plenus Spiritu Sancto regressus est a Jordane : et agebatur a Spiritu in desertum</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>diebus quadraginta, et tentabatur a diabolo. Et nihil manducavit in diebus illis : et consummatis illis esuriit.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixit autem illi diabolus : Si Filius Dei es, dic lapidi huic ut panis fiat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et respondit ad illum Jesus : Scriptum est : Quia non in solo pane vivit homo, sed in omni verbo Dei.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et duxit illum diabolus in montem excelsum, et ostendit illi omnia regna orbis terræ in momento temporis,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et ait illi : Tibi dabo potestatem hanc universam, et gloriam illorum : quia mihi tradita sunt, et cui volo do illa.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Tu ergo si adoraveris coram me, erunt tua omnia.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et respondens Jesus, dixit illi : Scriptum est : Dominum Deum tuum adorabis, et illi soli servies.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et duxit illum in Jerusalem, et statuit eum super pinnam templi, et dixit illi : Si Filius Dei es, mitte te hinc deorsum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Scriptum est enim quod angelis suis mandavit de te, ut conservent te :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et quia in manibus tollent te, ne forte offendas ad lapidem pedem tuum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et respondens Jesus, ait illi : Dictum est : Non tentabis Dominum Deum tuum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et consummata omni tentatione, diabolus recessit ab illo, usque ad tempus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et regressus est Jesus in virtute Spiritus in Galilæam, et fama exiit per universam regionem de illo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ipse docebat in synagogis eorum, et magnificabatur ab omnibus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et venit Nazareth, ubi erat nutritus, et intravit secundum consuetudinem suam die sabbati in synagogam, et surrexit legere.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et traditus est illi liber Isaiæ prophetæ. Et ut revolvit librum, invenit locum ubi scriptum erat :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Spiritus Domini super me : propter quod unxit me, evangelizare pauperibus misit me, sanare contritos corde,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>prædicare captivis remissionem, et cæcis visum, dimittere confractos in remissionem, prædicare annum Domini acceptum et diem retributionis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et cum plicuisset librum, reddit ministro, et sedit. Et omnium in synagoga oculi erant intendentes in eum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Cœpit autem dicere ad illos : Quia hodie impleta est hæc scriptura in auribus vestris.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et omnes testimonium illi dabant : et mirabantur in verbis gratiæ, quæ procedebant de ore ipsius, et dicebant : Nonne hic est filius Joseph ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ait illis : Utique dicetis mihi hanc similitudinem : Medice cura teipsum : quanta audivimus facta in Capharnaum, fac et hic in patria tua.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ait autem : Amen dico vobis, quia nemo propheta acceptus est in patria sua.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>In veritate dico vobis, multæ viduæ erant in diebus Eliæ in Israël, quando clausum est cælum annis tribus et mensibus sex, cum facta esset fames magna in omni terra :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et ad nullam illarum missus est Elias, nisi in Sarepta Sidoniæ, ad mulierem viduam.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et multi leprosi erant in Israël sub Eliseo propheta : et nemo eorum mundatus est nisi Naaman Syrus.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et repleti sunt omnes in synagoga ira, hæc audientes.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et surrexerunt, et ejecerunt illum extra civitatem : et duxerunt illum usque ad supercilium montis, super quem civitas illorum erat ædificata, ut præcipitarent eum.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ipse autem transiens per medium illorum, ibat.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et descendit in Capharnaum civitatem Galilææ, ibique docebat illos sabbatis.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et stupebant in doctrina ejus, quia in potestate erat sermo ipsius.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et in synagoga erat homo habens dæmonium immundum, et exclamavit voce magna,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>dicens : Sine, quid nobis et tibi, Jesu Nazarene ? venisti perdere nos ? scio te quis sis, Sanctus Dei.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et increpavit illum Jesus, dicens : Obmutesce, et exi ab eo. Et cum projecisset illum dæmonium in medium, exiit ab illo, nihilque illum nocuit.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et factus est pavor in omnibus, et colloquebantur ad invicem, dicentes : Quod est hoc verbum, quia in potestate et virtute imperat immundis spiritibus, et exeunt ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et divulgabatur fama de illo in omnem locum regionis.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Surgens autem Jesus de synagoga, introivit in domum Simonis. Socrus autem Simonis tenebatur magnis febribus : et rogaverunt illum pro ea.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et stans super illam imperavit febri : et dimisit illam. Et continuo surgens, ministrabat illis.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Cum autem sol occidisset, omnes qui habebant infirmos variis languoribus, ducebant illos ad eum. At ille singulis manus imponens, curabat eos.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Exibant autem dæmonia a multis clamantia, et dicentia : Quia tu es Filius Dei : et increpans non sinebat ea loqui : quia sciebant ipsum esse Christum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Facta autem die egressus ibat in desertum locum, et turbæ requirebant eum, et venerunt usque ad ipsum : et detinebant illum ne discederet ab eis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Quibus ille ait : Quia et aliis civitatibus oportet me evangelizare regnum Dei : quia ideo missus sum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et erat prædicans in synagogis Galilææ.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Luke 3" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-h /44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LUK.4\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":4,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And Jesus being full of the Holy Ghost, returned from the Jordan and was led by the spirit into the desert,\"},{\"verse\":2,\"text\":\"For the space of forty days, and was tempted by the devil. And he ate nothing in those days. And when they were ended, he was hungry.\"},{\"verse\":3,\"text\":\"And the devil said to him: If thou be the Son of God, say to this stone that it be made bread.\"},{\"verse\":4,\"text\":\"And Jesus answered him: It is written that Man liveth not by bread alone, but by every word of God.\"},{\"verse\":5,\"text\":\"And the devil led him into a high mountain and shewed him all the kingdoms of the world in a moment of time.\"},{\"verse\":6,\"text\":\"And he said to him: To thee will I give all this power and the glory of them. For to me they are delivered: and to whom I will, I give them.\"},{\"verse\":7,\"text\":\"If thou therefore wilt adore before me, all shall be thine.\"},{\"verse\":8,\"text\":\"And Jesus answering said to him. It is written: Thou shalt adore the Lord thy God, and him only shalt thou serve.\"},{\"verse\":9,\"text\":\"And he brought him to Jerusalem and set him on a pinnacle of the temple and said to him: If thou be the Son of God, cast thyself from hence.\"},{\"verse\":10,\"text\":\"For it is written that He hath given his angels charge over thee that they keep thee.\"},{\"verse\":11,\"text\":\"And that in their hands they shall bear thee up, lest perhaps thou dash thy foot against a stone.\"},{\"verse\":12,\"text\":\"And Jesus answering, said to him: It is said: Thou shalt not tempt the Lord thy God.\"},{\"verse\":13,\"text\":\"And all the temptation being ended, the devil departed from him for a time.\"},{\"verse\":14,\"text\":\"And Jesus returned in the power of the spirit, into Galilee: and the fame of him went out through the whole country.\"},{\"verse\":15,\"text\":\"And he taught in their synagogues and was magnified by all.\"},{\"verse\":16,\"text\":\"And he came to Nazareth, where he was brought up: and he went into the synagogue, according to his custom, on the sabbath day: and he rose up to read.\"},{\"verse\":17,\"text\":\"And the book of Isaias the prophet was delivered unto him. And as he unfolded the book, he found the place where it was written:\"},{\"verse\":18,\"text\":\"The spirit of the Lord is upon me. Wherefore he hath anointed me to preach the gospel to the poor, he hath sent me to heal the contrite of heart,\"},{\"verse\":19,\"text\":\"To preach deliverance to the captives and sight to the blind, to set at liberty them that are bruised, to preach the acceptable year of the Lord and the day of reward.\"},{\"verse\":20,\"text\":\"And when he had folded the book, he restored it to the minister and sat down. And the eyes of all in the synagogue were fixed on him.\"},{\"verse\":21,\"text\":\"And he began to say to them: This day is fulfilled this scripture in your ears.\"},{\"verse\":22,\"text\":\"And all gave testimony to him. And they wondered at the words of grace that proceeded from his mouth. And they said: Is not this the son of Joseph?\"},{\"verse\":23,\"text\":\"And he said to them: Doubtless you will say to me this similitude: Physician, heal thyself. As great things as we have heard done in Capharnaum, do also here in thy own country.\"},{\"verse\":24,\"text\":\"And he said: Amen I say to you that no prophet is accepted in his own country.\"},{\"verse\":25,\"text\":\"In truth I say to you, there were many widows in the days of Elias in Israel, when heaven was shut up three years and six months, when there was a great famine throughout all the earth.\"},{\"verse\":26,\"text\":\"And to none of them was Elias sent, but to Sarepta of Sidon, to a widow woman.\"},{\"verse\":27,\"text\":\"And there were many lepers in Israel in the time of Eliseus the prophet: and none of them was cleansed but Naaman the Syrian.\"},{\"verse\":28,\"text\":\"And all they in the synagogue, hearing these things, were filled with anger.\"},{\"verse\":29,\"text\":\"And they rose up and thrust him out of the city: and they brought him to the brow of the hill whereon their city was built, that they might cast him down headlong.\"},{\"verse\":30,\"text\":\"But he passing through the midst of them, went his way.\"},{\"verse\":31,\"text\":\"And he went down into Capharnaum, a city of Galilee: and there he taught them on the sabbath days.\"},{\"verse\":32,\"text\":\"And they were astonished at his doctrine: for his speech was with power.\"},{\"verse\":33,\"text\":\"And in the synagogue there was a man who had an unclean devil: and he cried out with a loud voice,\"},{\"verse\":34,\"text\":\"Saying: Let us alone. What have we to do with thee, Jesus of Nazareth? Art thou come to destroy us? I know thee who thou art, the holy one of God.\"},{\"verse\":35,\"text\":\"And Jesus rebuked him, saying: Hold thy peace and go out of him. And when the devil had thrown him into the midst, he went out of him and hurt him not at all.\"},{\"verse\":36,\"text\":\"And there came fear upon all; and they talked among themselves, saying: What word is this, for with authority and power he commandeth the unclean spirits, and they go out?\"},{\"verse\":37,\"text\":\"And the fame of him was published into every place of the country.\"},{\"verse\":38,\"text\":\"And Jesus rising up out of the synagogue, went into Simon’s house. And Simon’s wife’s mother was taken with a great fever: and they besought him for her.\"},{\"verse\":39,\"text\":\"And standing over her, he commanded the fever: and it left her. And immediately rising, she ministered to them.\"},{\"verse\":40,\"text\":\"And when the sun was down, all they that had any sick with divers diseases brought them to him. But he, laying his hands on every one of them, healed them.\"},{\"verse\":41,\"text\":\"And devils went out from many, crying out and saying: Thou art the son of God. And rebuking them he suffered them not to speak; for they knew that he was Christ.\"},{\"verse\":42,\"text\":\"And when it was day, going out he went into a desert place: and the multitudes sought him, and came unto him. And they stayed him that he should not depart from them.\"},{\"verse\":43,\"text\":\"To whom he said: To other cities also I must preach the kingdom of God: for therefore am I sent.\"},{\"verse\":44,\"text\":\"And he was preaching in the synagogues of Galilee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Jesus autem plenus Spiritu Sancto regressus est a Jordane : et agebatur a Spiritu in desertum\"},{\"verse\":2,\"text\":\"diebus quadraginta, et tentabatur a diabolo. Et nihil manducavit in diebus illis : et consummatis illis esuriit.\"},{\"verse\":3,\"text\":\"Dixit autem illi diabolus : Si Filius Dei es, dic lapidi huic ut panis fiat.\"},{\"verse\":4,\"text\":\"Et respondit ad illum Jesus : Scriptum est : Quia non in solo pane vivit homo, sed in omni verbo Dei.\"},{\"verse\":5,\"text\":\"Et duxit illum diabolus in montem excelsum, et ostendit illi omnia regna orbis terræ in momento temporis,\"},{\"verse\":6,\"text\":\"et ait illi : Tibi dabo potestatem hanc universam, et gloriam illorum : quia mihi tradita sunt, et cui volo do illa.\"},{\"verse\":7,\"text\":\"Tu ergo si adoraveris coram me, erunt tua omnia.\"},{\"verse\":8,\"text\":\"Et respondens Jesus, dixit illi : Scriptum est : Dominum Deum tuum adorabis, et illi soli servies.\"},{\"verse\":9,\"text\":\"Et duxit illum in Jerusalem, et statuit eum super pinnam templi, et dixit illi : Si Filius Dei es, mitte te hinc deorsum.\"},{\"verse\":10,\"text\":\"Scriptum est enim quod angelis suis mandavit de te, ut conservent te :\"},{\"verse\":11,\"text\":\"et quia in manibus tollent te, ne forte offendas ad lapidem pedem tuum.\"},{\"verse\":12,\"text\":\"Et respondens Jesus, ait illi : Dictum est : Non tentabis Dominum Deum tuum.\"},{\"verse\":13,\"text\":\"Et consummata omni tentatione, diabolus recessit ab illo, usque ad tempus.\"},{\"verse\":14,\"text\":\"Et regressus est Jesus in virtute Spiritus in Galilæam, et fama exiit per universam regionem de illo.\"},{\"verse\":15,\"text\":\"Et ipse docebat in synagogis eorum, et magnificabatur ab omnibus.\"},{\"verse\":16,\"text\":\"Et venit Nazareth, ubi erat nutritus, et intravit secundum consuetudinem suam die sabbati in synagogam, et surrexit legere.\"},{\"verse\":17,\"text\":\"Et traditus est illi liber Isaiæ prophetæ. Et ut revolvit librum, invenit locum ubi scriptum erat :\"},{\"verse\":18,\"text\":\"Spiritus Domini super me : propter quod unxit me, evangelizare pauperibus misit me, sanare contritos corde,\"},{\"verse\":19,\"text\":\"prædicare captivis remissionem, et cæcis visum, dimittere confractos in remissionem, prædicare annum Domini acceptum et diem retributionis.\"},{\"verse\":20,\"text\":\"Et cum plicuisset librum, reddit ministro, et sedit. Et omnium in synagoga oculi erant intendentes in eum.\"},{\"verse\":21,\"text\":\"Cœpit autem dicere ad illos : Quia hodie impleta est hæc scriptura in auribus vestris.\"},{\"verse\":22,\"text\":\"Et omnes testimonium illi dabant : et mirabantur in verbis gratiæ, quæ procedebant de ore ipsius, et dicebant : Nonne hic est filius Joseph ?\"},{\"verse\":23,\"text\":\"Et ait illis : Utique dicetis mihi hanc similitudinem : Medice cura teipsum : quanta audivimus facta in Capharnaum, fac et hic in patria tua.\"},{\"verse\":24,\"text\":\"Ait autem : Amen dico vobis, quia nemo propheta acceptus est in patria sua.\"},{\"verse\":25,\"text\":\"In veritate dico vobis, multæ viduæ erant in diebus Eliæ in Israël, quando clausum est cælum annis tribus et mensibus sex, cum facta esset fames magna in omni terra :\"},{\"verse\":26,\"text\":\"et ad nullam illarum missus est Elias, nisi in Sarepta Sidoniæ, ad mulierem viduam.\"},{\"verse\":27,\"text\":\"Et multi leprosi erant in Israël sub Eliseo propheta : et nemo eorum mundatus est nisi Naaman Syrus.\"},{\"verse\":28,\"text\":\"Et repleti sunt omnes in synagoga ira, hæc audientes.\"},{\"verse\":29,\"text\":\"Et surrexerunt, et ejecerunt illum extra civitatem : et duxerunt illum usque ad supercilium montis, super quem civitas illorum erat ædificata, ut præcipitarent eum.\"},{\"verse\":30,\"text\":\"Ipse autem transiens per medium illorum, ibat.\"},{\"verse\":31,\"text\":\"Et descendit in Capharnaum civitatem Galilææ, ibique docebat illos sabbatis.\"},{\"verse\":32,\"text\":\"Et stupebant in doctrina ejus, quia in potestate erat sermo ipsius.\"},{\"verse\":33,\"text\":\"Et in synagoga erat homo habens dæmonium immundum, et exclamavit voce magna,\"},{\"verse\":34,\"text\":\"dicens : Sine, quid nobis et tibi, Jesu Nazarene ? venisti perdere nos ? scio te quis sis, Sanctus Dei.\"},{\"verse\":35,\"text\":\"Et increpavit illum Jesus, dicens : Obmutesce, et exi ab eo. Et cum projecisset illum dæmonium in medium, exiit ab illo, nihilque illum nocuit.\"},{\"verse\":36,\"text\":\"Et factus est pavor in omnibus, et colloquebantur ad invicem, dicentes : Quod est hoc verbum, quia in potestate et virtute imperat immundis spiritibus, et exeunt ?\"},{\"verse\":37,\"text\":\"Et divulgabatur fama de illo in omnem locum regionis.\"},{\"verse\":38,\"text\":\"Surgens autem Jesus de synagoga, introivit in domum Simonis. Socrus autem Simonis tenebatur magnis febribus : et rogaverunt illum pro ea.\"},{\"verse\":39,\"text\":\"Et stans super illam imperavit febri : et dimisit illam. Et continuo surgens, ministrabat illis.\"},{\"verse\":40,\"text\":\"Cum autem sol occidisset, omnes qui habebant infirmos variis languoribus, ducebant illos ad eum. At ille singulis manus imponens, curabat eos.\"},{\"verse\":41,\"text\":\"Exibant autem dæmonia a multis clamantia, et dicentia : Quia tu es Filius Dei : et increpans non sinebat ea loqui : quia sciebant ipsum esse Christum.\"},{\"verse\":42,\"text\":\"Facta autem die egressus ibat in desertum locum, et turbæ requirebant eum, et venerunt usque ad ipsum : et detinebant illum ne discederet ab eis.\"},{\"verse\":43,\"text\":\"Quibus ille ait : Quia et aliis civitatibus oportet me evangelizare regnum Dei : quia ideo missus sum.\"},{\"verse\":44,\"text\":\"Et erat prædicans in synagogis Galilææ.\"}],\"summary\":\"Christ’s fasting and temptation. He is persecuted in Nazareth. His miracles in Capharnaum.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":3,\"label\":\"Luke 3\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":5,\"label\":\"Luke 5\"}}]]\n"])</script></body></html>
