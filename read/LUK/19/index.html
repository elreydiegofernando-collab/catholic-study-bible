<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 19 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">19</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Zacheus entertains Christ. The parable of the pounds. Christ rides upon an ass and weeps over Jerusalem.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And entering he walked through Jericho.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And behold, there was a man named Zacheus, who was the chief of the publicans: and he was rich.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he sought to see Jesus who he was: and he could not for the crowd, because he was low of stature.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And running before, he climbed up into a sycamore tree, that he might see him: for he was to pass that way.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when Jesus was come to the place, looking up, he saw him and said to him: Zacheus, make haste and come down: for this day I must abide in thy house.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he made haste and came down and received him with joy.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And when all saw it, they murmured, saying, that he was gone to be a guest with a man that was a sinner.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But Zacheus standing, said to the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have wronged any man of any thing, I restore him fourfold.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Jesus said to him: This day is salvation come to this house, because he also is a son of Abraham.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For the Son of man is come to seek and to save that which was lost.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>As they were hearing these things, he added and spoke a parable, because he was nigh to Jerusalem and because they thought that the kingdom of God should immediately be manifested.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>He said therefore: a certain nobleman went into a far country, to receive for himself a kingdom and to return.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And calling his ten servants, he gave them ten pounds and said to them: Trade till I come.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But his citizens hated him and they sent an embassage after him, saying: We will not have this man to reign over us.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it came to pass that he returned, having received the kingdom: and he commanded his servants to be called, to whom he had given the money, that he might know how much every man had gained by trading,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the first came saying: Lord, thy pound hath gained ten pounds.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he said to him: Well done, thou good servant, because thou hast been faithful in a little, thou shalt have power over ten cities.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the second came, saying: Lord, thy pound hath gained five pounds.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And he said to him: Be thou also over five cities.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And another came, saying: Lord, behold here is thy pound, which I have kept laid up in a napkin.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For I feared thee, because thou art an austere man: thou takest up what thou didst not lay down: and thou reapest that which thou didst not sow.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>He saith to him: Out of thy own mouth I judge thee, thou wicked servant. Thou knewest that I was an austere man, taking up what I laid not down and reaping that which I did not sow.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And why then didst thou not give my money into the bank, that at my coming I might have exacted it with usury?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he said to them that stood by: Take the pound away from him and give it to him that hath ten pounds.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they said to him: Lord, he hath ten pounds.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But I say to you that to every one that hath shall be given, and he shall abound: and from him that hath not, even that which he hath shall be taken from him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But as for those my enemies, who would not have me reign over them, bring them hither and kill them before me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And having said these things, he went before, going up to Jerusalem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And it came to pass, when he was come nigh to Bethphage and Bethania, unto the mount called Olivet, he sent two of his disciples,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Saying: Go into the town which is over against you, at your entering into which you shall find the colt of an ass tied, on which no man ever hath sitten: loose him and bring him hither.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And if any man shall ask you: Why do you loose him? You shall say thus unto him: Because the Lord hath need of his service.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they that were sent went their way and found the colt standing, as he had said unto them.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And as they were loosing the colt, the owners thereof said to them: Why loose you the colt?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But they said: Because the Lord hath need of him.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And they brought him to Jesus. And casting their garments on the colt, they set Jesus thereon.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And as he went, they spread their clothes underneath in the way.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And when he was now coming near the descent of Mount Olivet, the whole multitude of his disciples began with joy to praise God with a loud voice, for all the mighty works they had seen,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Saying: Blessed be the king who cometh in the name of the Lord! Peace in heaven and glory on high!</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And some of the Pharisees, from amongst the multitude, said to him: Master, rebuke thy disciples.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>To whom he said: I say to you that if these shall hold their peace, the stones will cry out.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And when he drew near, seeing the city, he wept over it, saying:</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>If thou also hadst known, and that in this thy day, the things that are to thy peace: but now they are hidden from thy eyes.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>For the days shall come upon thee: and thy enemies shall cast a trench about thee and compass thee round and straiten thee on every side,</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And beat thee flat to the ground, and thy children who are in thee. And they shall not leave in thee a stone upon a stone: because thou hast not known the time of thy visitation.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And entering into the temple, he began to cast out them that sold therein and them that bought.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Saying to them: It is written: My house is the house of prayer. But you have made it a den of thieves.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And he was teaching daily in the temple. And the chief priests and the scribes and the rulers of the people sought to destroy him.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And they found not what to do to him: for all the people were very attentive to hear him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et ingressus perambulabat Jericho.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et ecce vir nomine Zachæus : et hic princeps erat publicanorum, et ipse dives :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et quærebat videre Jesum, quis esset : et non poterat præ turba, quia statura pusillus erat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et præcurrens ascendit in arborem sycomorum ut videret eum : quia inde erat transiturus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et cum venisset ad locum, suspiciens Jesus vidit illum, et dixit ad eum : Zachæe, festinans descende : quia hodie in domo tua oportet me manere.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et festinans descendit, et excepit illum gaudens.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et cum viderent omnes, murmurabant, dicentes quod ad hominem peccatorem divertisset.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Stans autem Zachæus, dixit ad Dominum : Ecce dimidium bonorum meorum, Domine, do pauperibus : et si quid aliquem defraudavi, reddo quadruplum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ait Jesus ad eum : Quia hodie salus domui huic facta est : eo quod et ipse filius sit Abrahæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Venit enim Filius hominis quærere, et salvum facere quod perierat.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hæc illis audientibus adjiciens, dixit parabolam, eo quod esset prope Jerusalem : et quia existimarent quod confestim regnum Dei manifestaretur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixit ergo : Homo quidam nobilis abiit in regionem longinquam accipere sibi regnum, et reverti.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vocatis autem decem servis suis, dedit eis decem mnas, et ait ad illos : Negotiamini dum venio.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cives autem ejus oderant eum : et miserunt legationem post illum, dicentes : Nolumus hunc regnare super nos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et factum est ut rediret accepto regno : et jussit vocari servos, quibus dedit pecuniam, ut sciret quantum quisque negotiatus esset.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Venit autem primus dicens : Domine, mna tua decem mnas acquisivit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et ait illi : Euge bone serve, quia in modico fuisti fidelis, eris potestatem habens super decem civitates.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et alter venit, dicens : Domine, mna tua fecit quinque mnas.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et huic ait : Et tu esto super quinque civitates.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et alter venit, dicens : Domine, ecce mna tua, quam habui repositam in sudario :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>timui enim te, quia homo austerus es : tollis quod non posuisti, et metis quod non seminasti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dicit ei : De ore tuo te judico, serve nequam. Sciebas quod ego homo austerus sum, tollens quod non posui, et metens quod non seminavi :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et quare non dedisti pecuniam meam ad mensam, ut ego veniens cum usuris utique exegissem illam ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et astantibus dixit : Auferte ab illo mnam, et date illi qui decem mnas habet.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et dixerunt ei : Domine, habet decem mnas.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dico autem vobis, quia omni habenti dabitur, et abundabit : ab eo autem qui non habet, et quod habet auferetur ab eo.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Verumtamen inimicos meos illos, qui noluerunt me regnare super se, adducite huc : et interficite ante me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et his dictis, præcedebat ascendens Jerosolymam.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et factum est, cum appropinquasset ad Bethphage et Bethaniam, ad montem qui vocatur Oliveti, misit duos discipulos suos,</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>dicens : Ite in castellum quod contra est : in quod introëuntes, invenietis pullum asinæ alligatum, cui nemo umquam hominum sedit : solvite illum, et adducite.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et si quis vos interrogaverit : Quare solvitis ? sic dicetis ei : Quia Dominus operam ejus desiderat.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Abierunt autem qui missi erant : et invenerunt, sicut dixit illis, stantem pullum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Solventibus autem illis pullum, dixerunt domini ejus ad illos : Quid solvitis pullum ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>At illi dixerunt : Quia Dominus eum necessarium habet.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et duxerunt illum ad Jesum. Et jactantes vestimenta sua supra pullum, imposuerunt Jesum.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Eunte autem illo, substernebant vestimenta sua in via :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et cum appropinquaret jam ad descensum montis Oliveti, cœperunt omnes turbæ discipulorum gaudentes laudare Deum voce magna super omnibus, quas viderant, virtutibus,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>dicentes : Benedictus, qui venit rex in nomine Domini : pax in cælo, et gloria in excelsis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et quidam pharisæorum de turbis dixerunt ad illum : Magister, increpa discipulos tuos.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Quibus ipse ait : Dico vobis, quia si hi tacuerint, lapides clamabunt.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et ut appropinquavit, videns civitatem flevit super illam, dicens :</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Quia si cognovisses et tu, et quidem in hac die tua, quæ ad pacem tibi : nunc autem abscondita sunt ab oculis tuis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Quia venient dies in te : et circumdabunt te inimici tui vallo, et circumdabunt te : et coangustabunt te undique :</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>et ad terram prosternent te, et filios tuos, qui in te sunt, et non relinquent in te lapidem super lapidem : eo quod non cognoveris tempus visitationis tuæ.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et ingressus in templum, cœpit ejicere vendentes in illo, et ementes,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>dicens illis : Scriptum est : Quia domus mea domus orationis est : vos autem fecistis illam speluncam latronum.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Et erat docens quotidie in templo. Principes autem sacerdotum, et scribæ, et princeps plebis quærebant illum perdere :</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>et non inveniebant quid facerent illi. Omnis enim populus suspensus erat, audiens illum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/20/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 20</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->19<!-- --> of <!-- - [\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LUK.19\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":19,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And entering he walked through Jericho.\"},{\"verse\":2,\"text\":\"And behold, there was a man named Zacheus, who was the chief of the publicans: and he was rich.\"},{\"verse\":3,\"text\":\"And he sought to see Jesus who he was: and he could not for the crowd, because he was low of stature.\"},{\"verse\":4,\"text\":\"And running before, he climbed up into a sycamore tree, that he might see him: for he was to pass that way.\"},{\"verse\":5,\"text\":\"And when Jesus was come to the place, looking up, he saw him and said to him: Zacheus, make haste and come down: for this day I must abide in thy house.\"},{\"verse\":6,\"text\":\"And he made haste and came down and received him with joy.\"},{\"verse\":7,\"text\":\"And when all saw it, they murmured, saying, that he was gone to be a guest with a man that was a sinner.\"},{\"verse\":8,\"text\":\"But Zacheus standing, said to the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have wronged any man of any thing, I restore him fourfold.\"},{\"verse\":9,\"text\":\"Jesus said to him: This day is salvation come to this house, because he also is a son of Abraham.\"},{\"verse\":10,\"text\":\"For the Son of man is come to seek and to save that which was lost.\"},{\"verse\":11,\"text\":\"As they were hearing these things, he added and spoke a parable, because he was nigh to Jerusalem and because they thought that the kingdom of God should immediately be manifested.\"},{\"verse\":12,\"text\":\"He said therefore: a certain nobleman went into a far country, to receive for himself a kingdom and to return.\"},{\"verse\":13,\"text\":\"And calling his ten servants, he gave them ten pounds and said to them: Trade till I come.\"},{\"verse\":14,\"text\":\"But his citizens hated him and they sent an embassage after him, saying: We will not have this man to reign over us.\"},{\"verse\":15,\"text\":\"And it came to pass that he returned, having received the kingdom: and he commanded his servants to be called, to whom he had given the money, that he might know how much every man had gained by trading,\"},{\"verse\":16,\"text\":\"And the first came saying: Lord, thy pound hath gained ten pounds.\"},{\"verse\":17,\"text\":\"And he said to him: Well done, thou good servant, because thou hast been faithful in a little, thou shalt have power over ten cities.\"},{\"verse\":18,\"text\":\"And the second came, saying: Lord, thy pound hath gained five pounds.\"},{\"verse\":19,\"text\":\"And he said to him: Be thou also over five cities.\"},{\"verse\":20,\"text\":\"And another came, saying: Lord, behold here is thy pound, which I have kept laid up in a napkin.\"},{\"verse\":21,\"text\":\"For I feared thee, because thou art an austere man: thou takest up what thou didst not lay down: and thou reapest that which thou didst not sow.\"},{\"verse\":22,\"text\":\"He saith to him: Out of thy own mouth I judge thee, thou wicked servant. Thou knewest that I was an austere man, taking up what I laid not down and reaping that which I did not sow.\"},{\"verse\":23,\"text\":\"And why then didst thou not give my money into the bank, that at my coming I might have exacted it with usury?\"},{\"verse\":24,\"text\":\"And he said to them that stood by: Take the pound away from him and give it to him that hath ten pounds.\"},{\"verse\":25,\"text\":\"And they said to him: Lord, he hath ten pounds.\"},{\"verse\":26,\"text\":\"But I say to you that to every one that hath shall be given, and he shall abound: and from him that hath not, even that which he hath shall be taken from him.\"},{\"verse\":27,\"text\":\"But as for those my enemies, who would not have me reign over them, bring them hither and kill them before me.\"},{\"verse\":28,\"text\":\"And having said these things, he went before, going up to Jerusalem.\"},{\"verse\":29,\"text\":\"And it came to pass, when he was come nigh to Bethphage and Bethania, unto the mount called Olivet, he sent two of his disciples,\"},{\"verse\":30,\"text\":\"Saying: Go into the town which is over against you, at your entering into which you shall find the colt of an ass tied, on which no man ever hath sitten: loose him and bring him hither.\"},{\"verse\":31,\"text\":\"And if any man shall ask you: Why do you loose him? You shall say thus unto him: Because the Lord hath need of his service.\"},{\"verse\":32,\"text\":\"And they that were sent went their way and found the colt standing, as he had said unto them.\"},{\"verse\":33,\"text\":\"And as they were loosing the colt, the owners thereof said to them: Why loose you the colt?\"},{\"verse\":34,\"text\":\"But they said: Because the Lord hath need of him.\"},{\"verse\":35,\"text\":\"And they brought him to Jesus. And casting their garments on the colt, they set Jesus thereon.\"},{\"verse\":36,\"text\":\"And as he went, they spread their clothes underneath in the way.\"},{\"verse\":37,\"text\":\"And when he was now coming near the descent of Mount Olivet, the whole multitude of his disciples began with joy to praise God with a loud voice, for all the mighty works they had seen,\"},{\"verse\":38,\"text\":\"Saying: Blessed be the king who cometh in the name of the Lord! Peace in heaven and glory on high!\"},{\"verse\":39,\"text\":\"And some of the Pharisees, from amongst the multitude, said to him: Master, rebuke thy disciples.\"},{\"verse\":40,\"text\":\"To whom he said: I say to you that if these shall hold their peace, the stones will cry out.\"},{\"verse\":41,\"text\":\"And when he drew near, seeing the city, he wept over it, saying:\"},{\"verse\":42,\"text\":\"If thou also hadst known, and that in this thy day, the things that are to thy peace: but now they are hidden from thy eyes.\"},{\"verse\":43,\"text\":\"For the days shall come upon thee: and thy enemies shall cast a trench about thee and compass thee round and straiten thee on every side,\"},{\"verse\":44,\"text\":\"And beat thee flat to the ground, and thy children who are in thee. And they shall not leave in thee a stone upon a stone: because thou hast not known the time of thy visitation.\"},{\"verse\":45,\"text\":\"And entering into the temple, he began to cast out them that sold therein and them that bought.\"},{\"verse\":46,\"text\":\"Saying to them: It is written: My house is the house of prayer. But you have made it a den of thieves.\"},{\"verse\":47,\"text\":\"And he was teaching daily in the temple. And the chief priests and the scribes and the rulers of the people sought to destroy him.\"},{\"verse\":48,\"text\":\"And they found not what to do to him: for all the people were very attentive to hear him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et ingressus perambulabat Jericho.\"},{\"verse\":2,\"text\":\"Et ecce vir nomine Zachæus : et hic princeps erat publicanorum, et ipse dives :\"},{\"verse\":3,\"text\":\"et quærebat videre Jesum, quis esset : et non poterat præ turba, quia statura pusillus erat.\"},{\"verse\":4,\"text\":\"Et præcurrens ascendit in arborem sycomorum ut videret eum : quia inde erat transiturus.\"},{\"verse\":5,\"text\":\"Et cum venisset ad locum, suspiciens Jesus vidit illum, et dixit ad eum : Zachæe, festinans descende : quia hodie in domo tua oportet me manere.\"},{\"verse\":6,\"text\":\"Et festinans descendit, et excepit illum gaudens.\"},{\"verse\":7,\"text\":\"Et cum viderent omnes, murmurabant, dicentes quod ad hominem peccatorem divertisset.\"},{\"verse\":8,\"text\":\"Stans autem Zachæus, dixit ad Dominum : Ecce dimidium bonorum meorum, Domine, do pauperibus : et si quid aliquem defraudavi, reddo quadruplum.\"},{\"verse\":9,\"text\":\"Ait Jesus ad eum : Quia hodie salus domui huic facta est : eo quod et ipse filius sit Abrahæ.\"},{\"verse\":10,\"text\":\"Venit enim Filius hominis quærere, et salvum facere quod perierat.\"},{\"verse\":11,\"text\":\"Hæc illis audientibus adjiciens, dixit parabolam, eo quod esset prope Jerusalem : et quia existimarent quod confestim regnum Dei manifestaretur.\"},{\"verse\":12,\"text\":\"Dixit ergo : Homo quidam nobilis abiit in regionem longinquam accipere sibi regnum, et reverti.\"},{\"verse\":13,\"text\":\"Vocatis autem decem servis suis, dedit eis decem mnas, et ait ad illos : Negotiamini dum venio.\"},{\"verse\":14,\"text\":\"Cives autem ejus oderant eum : et miserunt legationem post illum, dicentes : Nolumus hunc regnare super nos.\"},{\"verse\":15,\"text\":\"Et factum est ut rediret accepto regno : et jussit vocari servos, quibus dedit pecuniam, ut sciret quantum quisque negotiatus esset.\"},{\"verse\":16,\"text\":\"Venit autem primus dicens : Domine, mna tua decem mnas acquisivit.\"},{\"verse\":17,\"text\":\"Et ait illi : Euge bone serve, quia in modico fuisti fidelis, eris potestatem habens super decem civitates.\"},{\"verse\":18,\"text\":\"Et alter venit, dicens : Domine, mna tua fecit quinque mnas.\"},{\"verse\":19,\"text\":\"Et huic ait : Et tu esto super quinque civitates.\"},{\"verse\":20,\"text\":\"Et alter venit, dicens : Domine, ecce mna tua, quam habui repositam in sudario :\"},{\"verse\":21,\"text\":\"timui enim te, quia homo austerus es : tollis quod non posuisti, et metis quod non seminasti.\"},{\"verse\":22,\"text\":\"Dicit ei : De ore tuo te judico, serve nequam. Sciebas quod ego homo austerus sum, tollens quod non posui, et metens quod non seminavi :\"},{\"verse\":23,\"text\":\"et quare non dedisti pecuniam meam ad mensam, ut ego veniens cum usuris utique exegissem illam ?\"},{\"verse\":24,\"text\":\"Et astantibus dixit : Auferte ab illo mnam, et date illi qui decem mnas habet.\"},{\"verse\":25,\"text\":\"Et dixerunt ei : Domine, habet decem mnas.\"},{\"verse\":26,\"text\":\"Dico autem vobis, quia omni habenti dabitur, et abundabit : ab eo autem qui non habet, et quod habet auferetur ab eo.\"},{\"verse\":27,\"text\":\"Verumtamen inimicos meos illos, qui noluerunt me regnare super se, adducite huc : et interficite ante me.\"},{\"verse\":28,\"text\":\"Et his dictis, præcedebat ascendens Jerosolymam.\"},{\"verse\":29,\"text\":\"Et factum est, cum appropinquasset ad Bethphage et Bethaniam, ad montem qui vocatur Oliveti, misit duos discipulos suos,\"},{\"verse\":30,\"text\":\"dicens : Ite in castellum quod contra est : in quod introëuntes, invenietis pullum asinæ alligatum, cui nemo umquam hominum sedit : solvite illum, et adducite.\"},{\"verse\":31,\"text\":\"Et si quis vos interrogaverit : Quare solvitis ? sic dicetis ei : Quia Dominus operam ejus desiderat.\"},{\"verse\":32,\"text\":\"Abierunt autem qui missi erant : et invenerunt, sicut dixit illis, stantem pullum.\"},{\"verse\":33,\"text\":\"Solventibus autem illis pullum, dixerunt domini ejus ad illos : Quid solvitis pullum ?\"},{\"verse\":34,\"text\":\"At illi dixerunt : Quia Dominus eum necessarium habet.\"},{\"verse\":35,\"text\":\"Et duxerunt illum ad Jesum. Et jactantes vestimenta sua supra pullum, imposuerunt Jesum.\"},{\"verse\":36,\"text\":\"Eunte autem illo, substernebant vestimenta sua in via :\"},{\"verse\":37,\"text\":\"et cum appropinquaret jam ad descensum montis Oliveti, cœperunt omnes turbæ discipulorum gaudentes laudare Deum voce magna super omnibus, quas viderant, virtutibus,\"},{\"verse\":38,\"text\":\"dicentes : Benedictus, qui venit rex in nomine Domini : pax in cælo, et gloria in excelsis.\"},{\"verse\":39,\"text\":\"Et quidam pharisæorum de turbis dixerunt ad illum : Magister, increpa discipulos tuos.\"},{\"verse\":40,\"text\":\"Quibus ipse ait : Dico vobis, quia si hi tacuerint, lapides clamabunt.\"},{\"verse\":41,\"text\":\"Et ut appropinquavit, videns civitatem flevit super illam, dicens :\"},{\"verse\":42,\"text\":\"Quia si cognovisses et tu, et quidem in hac die tua, quæ ad pacem tibi : nunc autem abscondita sunt ab oculis tuis.\"},{\"verse\":43,\"text\":\"Quia venient dies in te : et circumdabunt te inimici tui vallo, et circumdabunt te : et coangustabunt te undique :\"},{\"verse\":44,\"text\":\"et ad terram prosternent te, et filios tuos, qui in te sunt, et non relinquent in te lapidem super lapidem : eo quod non cognoveris tempus visitationis tuæ.\"},{\"verse\":45,\"text\":\"Et ingressus in templum, cœpit ejicere vendentes in illo, et ementes,\"},{\"verse\":46,\"text\":\"dicens illis : Scriptum est : Quia domus mea domus orationis est : vos autem fecistis illam speluncam latronum.\"},{\"verse\":47,\"text\":\"Et erat docens quotidie in templo. Principes autem sacerdotum, et scribæ, et princeps plebis quærebant illum perdere :\"},{\"verse\":48,\"text\":\"et non inveniebant quid facerent illi. Omnis enim populus suspensus erat, audiens illum.\"}],\"summary\":\"Zacheus entertains Christ. The parable of the pounds. Christ rides upon an ass and weeps over Jerusalem.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":18,\"label\":\"Luke 18\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":20,\"label\":\"Luke 20\"}}]]\n"])</script></body></html>
