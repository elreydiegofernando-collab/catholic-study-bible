 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">16</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parable of the unjust steward and of the rich man and Lazarus.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And he said also to his disciples: There was a certain rich man who had a steward: and the same was accused unto him, that he had wasted his goods.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he called him and said to him: How is it that I hear this of thee? Give an account of thy stewardship: for now thou canst be steward no longer.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the steward said within himself: What shall I do, because my lord taketh away from me the stewardship? To dig I am not able; to beg I am ashamed.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I know what I will do, that when I shall be removed from the stewardship, they may receive me into their houses.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Therefore, calling together every one of his lord’s debtors, he said to the first: How much dost thou owe my lord?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But he said: An hundred barrels of oil. And he said to him: Take thy bill and sit down quickly and write fifty.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then he said to another: And how much dost thou owe? Who said: An hundred quarters of wheat. He said to him: Take thy bill and write eighty.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And the lord commended the unjust steward, forasmuch as he had done wisely: for the children of this world are wiser in their generation than the children of light.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And I say to you: Make unto you friends of the mammon of iniquity: that when you shall fail, they may receive you into everlasting dwellings.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He that is faithful in that which is least is faithful also in that which is greater: and he that is unjust in that which is little is unjust also in that which is greater.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If then you have not been faithful in the unjust mammon, who will trust you with that which is the true?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And if you have not been faithful in that which is another’s, who will give you that which is your own?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>No servant can serve two masters: for either he will hate the one and love the other: or he will hold to the one and despise the other. You cannot serve God and mammon.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now the Pharisees, who were covetous, heard all these things: and they derided him.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And he said to them: you are they who justify yourselves before men, but God knoweth your hearts. For that which is high to men is an abomination before God.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The law and the prophets were until John. From that time the kingdom of God is preached: and every one useth violence towards it.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And it is easier for heaven and earth to pass than one tittle of the law to fall.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Every one that putteth away his wife and marrieth another committeth adultery: and he that marrieth her that is put away from her husband committeth adultery.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>There was a certain rich man who was clothed in purple and fine linen and feasted sumptuously every day.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And there was a certain beggar, named Lazarus, who lay at his gate, full of sores,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Desiring to be filled with the crumbs that fell from the rich man’s table. And no one did give him: moreover the dogs came and licked his sores.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And it came to pass that the beggar died and was carried by the angels into Abraham’s bosom. And the rich man also died: and he was buried in hell.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And lifting up his eyes when he was in torments, he saw Abraham afar off and Lazarus in his bosom:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And he cried and said: Father Abraham, have mercy on me and send Lazarus, that he may dip the tip of his finger in water to cool my tongue: for I am tormented in this flame.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And Abraham said to him: Son, remember that thou didst receive good things in thy lifetime, and likewise Lazarus evil things: but now he is comforted and thou art tormented.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And besides all this, between us and you, there is fixed a great chaos: so that they who would pass from hence to you cannot, nor from thence come hither.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he said: Then, father, I beseech thee that thou wouldst send him to my father’s house, for I have five brethren,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>That he may testify unto them, lest they also come into this place of torments.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Abraham said to him: They have Moses and the prophets. Let them hear them.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But he said: No, father Abraham: but if one went to them from the dead, they will do penance.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And he said to him: If they hear not Moses and the prophets, neither will they believe, if one rise again from the dead.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dicebat autem et ad discipulos suos : Homo quidam erat dives, qui habebat villicum : et hic diffamatus est apud illum quasi dissipasset bona ipsius.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et vocavit illum, et ait illi : Quid hoc audio de te ? redde rationem villicationis tuæ : jam enim non poteris villicare.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ait autem villicus intra se : Quid faciam, quia dominus meus aufert a me villicationem ? Fodere non valeo, mendicare erubesco.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Scio quid faciam, ut, cum amotus fuero a villicatione, recipiant me in domos suas.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Convocatis itaque singulis debitoribus domini sui, dicebat primo : Quantum debes domino meo ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>At ille dixit : Centum cados olei. Dixitque illi : Accipe cautionem tuam : et sede cito, scribe quinquaginta.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Deinde alii dixit : Tu vero quantum debes ? Qui ait : Centum coros tritici. Ait illi : Accipe litteras tuas, et scribe octoginta.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et laudavit dominus villicum iniquitatis, quia prudenter fecisset : quia filii hujus sæculi prudentiores filiis lucis in generatione sua sunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ego vobis dico : facite vobis amicos de mammona iniquitatis : ut, cum defeceritis, recipiant vos in æterna tabernacula.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui fidelis est in minimo, et in majori fidelis est : et qui in modico iniquus est, et in majori iniquus est.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si ergo in iniquo mammona fideles non fuistis quod verum est, quis credet vobis ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et si in alieno fideles non fuistis, quod vestrum est, quis dabit vobis ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nemo servus potest duobus dominis servire : aut enim unum odiet, et alterum diliget : aut uni adhærebit, et alterum contemnet. Non potestis Deo servire et mammonæ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Audiebant autem omnia hæc pharisæi, qui erant avari : et deridebant illum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ait illis : Vos estis qui justificatis vos coram hominibus : Deus autem novit corda vestra : quia quod hominibus altum est, abominatio est ante Deum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Lex et prophetæ usque ad Joannem : ex eo regnum Dei evangelizatur, et omnis in illud vim facit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Facilius est autem cælum et terram præterire, quam de lege unum apicem cadere.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omnis qui dimittit uxorem suam et alteram ducit, mœchatur : et qui dimissam a viro ducit, mœchatur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Homo quidam erat dives, qui induebatur purpura et bysso, et epulabatur quotidie splendide.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et erat quidam mendicus, nomine Lazarus, qui jacebat ad januam ejus, ulceribus plenus,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>cupiens saturari de micis quæ cadebant de mensa divitis, et nemo illi dabat : sed et canes veniebant, et lingebant ulcera ejus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Factum est autem ut moreretur mendicus, et portaretur ab angelis in sinum Abrahæ. Mortuus est autem et dives, et sepultus est in inferno.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Elevans autem oculos suos, cum esset in tormentis, vidit Abraham a longe, et Lazarum in sinu ejus :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et ipse clamans dixit : Pater Abraham, miserere mei, et mitte Lazarum ut intingat extremum digiti sui in aquam, ut refrigeret linguam meam, quia crucior in hac flamma.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et dixit illi Abraham : Fili, recordare quia recepisti bona in vita tua, et Lazarus similiter mala : nunc autem hic consolatur, tu vero cruciaris :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et in his omnibus inter nos et vos chaos magnum firmatum est : ut hi qui volunt hinc transire ad vos, non possint, neque inde huc transmeare.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et ait : Rogo ergo te, pater, ut mittas eum in domum patris mei :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>habeo enim quinque fratres : ut testetur illis, ne et ipsi veniant in hunc locum tormentorum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et ait illi Abraham : Habent Moysen et prophetas : audiant illos.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>At ille dixit : Non, pater Abraham : sed si quis ex mortuis ierit ad eos, pœnitentiam agent.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Ait autem illi : Si Moysen et prophetas non audiunt, neque si quis ex mortuis resurrexerit, credent.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/17/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text- se\":7,\"text\":\"Then he said to another: And how much dost thou owe? Who said: An hundred quarters of wheat. He said to him: Take thy bill and write eighty.\"},{\"verse\":8,\"text\":\"And the lord commended the unjust steward, forasmuch as he had done wisely: for the children of this world are wiser in their generation than the children of light.\"},{\"verse\":9,\"text\":\"And I say to you: Make unto you friends of the mammon of iniquity: that when you shall fail, they may receive you into everlasting dwellings.\"},{\"verse\":10,\"text\":\"He that is faithful in that which is least is faithful also in that which is greater: and he that is unjust in that which is little is unjust also in that which is greater.\"},{\"verse\":11,\"text\":\"If then you have not been faithful in the unjust mammon, who will trust you with that which is the true?\"},{\"verse\":12,\"text\":\"And if you have not been faithful in that which is another’s, who will give you that which is your own?\"},{\"verse\":13,\"text\":\"No servant can serve two masters: for either he will hate the one and love the other: or he will hold to the one and despise the other. You cannot serve God and mammon.\"},{\"verse\":14,\"text\":\"Now the Pharisees, who were covetous, heard all these things: and they derided him.\"},{\"verse\":15,\"text\":\"And he said to them: you are they who justify yourselves before men, but God knoweth your hearts. For that which is high to men is an abomination before God.\"},{\"verse\":16,\"text\":\"The law and the prophets were until John. From that time the kingdom of God is preached: and every one useth violence towards it.\"},{\"verse\":17,\"text\":\"And it is easier for heaven and earth to pass than one tittle of the law to fall.\"},{\"verse\":18,\"text\":\"Every one that putteth away his wife and marrieth another committeth adultery: and he that marrieth her that is put away from her husband committeth adultery.\"},{\"verse\":19,\"text\":\"There was a certain rich man who was clothed in purple and fine linen and feasted sumptuously every day.\"},{\"verse\":20,\"text\":\"And there was a certain beggar, named Lazarus, who lay at his gate, full of sores,\"},{\"verse\":21,\"text\":\"Desiring to be filled with the crumbs that fell from the rich man’s table. And no one did give him: moreover the dogs came and licked his sores.\"},{\"verse\":22,\"text\":\"And it came to pass that the beggar died and was carried by the angels into Abraham’s bosom. And the rich man also died: and he was buried in hell.\"},{\"verse\":23,\"text\":\"And lifting up his eyes when he was in torments, he saw Abraham afar off and Lazarus in his bosom:\"},{\"verse\":24,\"text\":\"And he cried and said: Father Abraham, have mercy on me and send Lazarus, that he may dip the tip of his finger in water to cool my tongue: for I am tormented in this flame.\"},{\"verse\":25,\"text\":\"And Abraham said to him: Son, remember that thou didst receive good things in thy lifetime, and likewise Lazarus evil things: but now he is comforted and thou art tormented.\"},{\"verse\":26,\"text\":\"And besides all this, between us and you, there is fixed a great chaos: so that they who would pass from hence to you cannot, nor from thence come hither.\"},{\"verse\":27,\"text\":\"And he said: Then, father, I beseech thee that thou wouldst send him to my father’s house, for I have five brethren,\"},{\"verse\":28,\"text\":\"That he may testify unto them, lest they also come into this place of torments.\"},{\"verse\":29,\"text\":\"And Abraham said to him: They have Moses and the prophets. Let them hear them.\"},{\"verse\":30,\"text\":\"But he said: No, father Abraham: but if one went to them from the dead, they will do penance.\"},{\"verse\":31,\"text\":\"And he said to him: If they hear not Moses and the prophets, neither will they believe, if one rise again from the dead.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dicebat autem et ad discipulos suos : Homo quidam erat dives, qui habebat villicum : et hic diffamatus est apud illum quasi dissipasset bona ipsius.\"},{\"verse\":2,\"text\":\"Et vocavit illum, et ait illi : Quid hoc audio de te ? redde rationem villicationis tuæ : jam enim non poteris villicare.\"},{\"verse\":3,\"text\":\"Ait autem villicus intra se : Quid faciam, quia dominus meus aufert a me villicationem ? Fodere non valeo, mendicare erubesco.\"},{\"verse\":4,\"text\":\"Scio quid faciam, ut, cum amotus fuero a villicatione, recipiant me in domos suas.\"},{\"verse\":5,\"text\":\"Convocatis itaque singulis debitoribus domini sui, dicebat primo : Quantum debes domino meo ?\"},{\"verse\":6,\"text\":\"At ille dixit : Centum cados olei. Dixitque illi : Accipe cautionem tuam : et sede cito, scribe quinquaginta.\"},{\"verse\":7,\"text\":\"Deinde alii dixit : Tu vero quantum debes ? Qui ait : Centum coros tritici. Ait illi : Accipe litteras tuas, et scribe octoginta.\"},{\"verse\":8,\"text\":\"Et laudavit dominus villicum iniquitatis, quia prudenter fecisset : quia filii hujus sæculi prudentiores filiis lucis in generatione sua sunt.\"},{\"verse\":9,\"text\":\"Et ego vobis dico : facite vobis amicos de mammona iniquitatis : ut, cum defeceritis, recipiant vos in æterna tabernacula.\"},{\"verse\":10,\"text\":\"Qui fidelis est in minimo, et in majori fidelis est : et qui in modico iniquus est, et in majori iniquus est.\"},{\"verse\":11,\"text\":\"Si ergo in iniquo mammona fideles non fuistis quod verum est, quis credet vobis ?\"},{\"verse\":12,\"text\":\"Et si in alieno fideles non fuistis, quod vestrum est, quis dabit vobis ?\"},{\"verse\":13,\"text\":\"Nemo servus potest duobus dominis servire : aut enim unum odiet, et alterum diliget : aut uni adhærebit, et alterum contemnet. Non potestis Deo servire et mammonæ.\"},{\"verse\":14,\"text\":\"Audiebant autem omnia hæc pharisæi, qui erant avari : et deridebant illum.\"},{\"verse\":15,\"text\":\"Et ait illis : Vos estis qui justificatis vos coram hominibus : Deus autem novit corda vestra : quia quod hominibus altum est, abominatio est ante Deum.\"},{\"verse\":16,\"text\":\"Lex et prophetæ usque ad Joannem : ex eo regnum Dei evangelizatur, et omnis in illud vim facit.\"},{\"verse\":17,\"text\":\"Facilius est autem cælum et terram præterire, quam de lege unum apicem cadere.\"},{\"verse\":18,\"text\":\"Omnis qui dimittit uxorem suam et alteram ducit, mœchatur : et qui dimissam a viro ducit, mœchatur.\"},{\"verse\":19,\"text\":\"Homo quidam erat dives, qui induebatur purpura et bysso, et epulabatur quotidie splendide.\"},{\"verse\":20,\"text\":\"Et erat quidam mendicus, nomine Lazarus, qui jacebat ad januam ejus, ulceribus plenus,\"},{\"verse\":21,\"text\":\"cupiens saturari de micis quæ cadebant de mensa divitis, et nemo illi dabat : sed et canes veniebant, et lingebant ulcera ejus.\"},{\"verse\":22,\"text\":\"Factum est autem ut moreretur mendicus, et portaretur ab angelis in sinum Abrahæ. Mortuus est autem et dives, et sepultus est in inferno.\"},{\"verse\":23,\"text\":\"Elevans autem oculos suos, cum esset in tormentis, vidit Abraham a longe, et Lazarum in sinu ejus :\"},{\"verse\":24,\"text\":\"et ipse clamans dixit : Pater Abraham, miserere mei, et mitte Lazarum ut intingat extremum digiti sui in aquam, ut refrigeret linguam meam, quia crucior in hac flamma.\"},{\"verse\":25,\"text\":\"Et dixit illi Abraham : Fili, recordare quia recepisti bona in vita tua, et Lazarus similiter mala : nunc autem hic consolatur, tu vero cruciaris :\"},{\"verse\":26,\"text\":\"et in his omnibus inter nos et vos chaos magnum firmatum est : ut hi qui volunt hinc transire ad vos, non possint, neque inde huc transmeare.\"},{\"verse\":27,\"text\":\"Et ait : Rogo ergo te, pater, ut mittas eum in domum patris mei :\"},{\"verse\":28,\"text\":\"habeo enim quinque fratres : ut testetur illis, ne et ipsi veniant in hunc locum tormentorum.\"},{\"verse\":29,\"text\":\"Et ait illi Abraham : Habent Moysen et prophetas : audiant illos.\"},{\"verse\":30,\"text\":\"At ille dixit : Non, pater Abraham : sed si quis ex mortuis ierit ad eos, pœnitentiam agent.\"},{\"verse\":31,\"text\":\"Ait autem illi : Si Moysen et prophetas non audiunt, neque si quis ex mortuis resurrexerit, credent.\"}],\"summary\":\"The parable of the unjust steward and of the rich man and Lazarus.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":15,\"label\":\"Luke 15\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":17,\"label\":\"Luke 17\"}}]]\n"])</script></body></html>
