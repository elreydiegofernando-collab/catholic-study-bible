<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 24 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">24</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s resurrection and manifestation of himself to his disciples.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And on the first day of the week, very early in the morning, they came to the sepulchre, bringing the spices which they had prepared.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they found the stone rolled back from the sepulchre.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And going in, they found not the body of the Lord Jesus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And it came to pass, as they were astonished in their mind at this, behold, two men stood by them, in shining apparel.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And as they were afraid and bowed down their countenance towards the ground, they said unto them: Why seek you the living with the dead?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He is not here, but is risen. Remember how he spoke unto you, when he was yet in Galilee,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Saying: The Son of man must be delivered into the hands of sinful men and be crucified and the third day rise again.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And they remembered his words.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And going back from the sepulchre, they told all these things to the eleven and to all the rest.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And it was Mary Magdalen and Joanna and Mary of James and the other women that were with them, who told these things to the apostles.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And these words seemed to them as idle tales: and they did not believe them.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But Peter rising up, ran to the sepulchre and, stooping down, he saw the linen cloths laid by themselves: and went away wondering in himself at that which was come to pass.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And behold, two of them went, the same day, to a town which was sixty furlongs from Jerusalem, named Emmaus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And they talked together of all these things which had happened.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And it came to pass that while they talked and reasoned with themselves, Jesus himself also, drawing near, went with them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But their eyes were held, that they should not know him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And he said to them: What are these discourses that you hold one with another as you walk and are sad?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And the one of them, whose name was Cleophas, answering, said to him: Art thou only a stranger in Jerusalem, and hast not known the things that have been done there in these days?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>To whom he said: What things? And they said: Concerning Jesus of Nazareth, who was a prophet, mighty in work and word before God and all the people.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And how our chief priests and princes delivered him to be condemned to death and crucified him.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But we hoped that it was he that should have redeemed Israel. And now besides all this, to-day is the third day since these things were done.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Yea and certain women also of our company affrighted us who, before it was light, were at the sepulchre,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And not finding his body, came, saying that they had also seen a vision of angels, who say that he is alive.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And some of our people went to the sepulchre and found it so as the women had said: but him they found not.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Then he said to them: O foolish and slow of heart to believe in all things, Which the prophets have spoken.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Ought not Christ to have suffered these things and so, to enter into his glory?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And beginning at Moses and all the prophets, he expounded to them in all the scriptures the things that were concerning him.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And they drew nigh to the town whither they were going: and he made as though he would go farther.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But they constrained him, saying: Stay with us, because it is towards evening and the day is now far spent. And he went in with them.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And it came to pass, whilst he was at table with them, he took bread and blessed and brake and gave to them.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And their eyes were opened: and they knew him. And he vanished out of their sight.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they said one to the other: Was not our heart burning within us, whilst he spoke in the way and opened to us the scriptures?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And rising up, the same hour, they went back to Jerusalem: and they found the eleven gathered together, and those that were with them,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Saying: The Lord is risen indeed and hath appeared to Simon.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And they told what things were done in the way: and how they knew him in the breaking of bread.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Now, whilst they were speaking these things, Jesus stood in the midst of them and saith to them: Peace be to you. It is I: Fear not.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But they being troubled and frightened, supposed that they saw a spirit.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he said to them: Why are you troubled, and why do thoughts arise in your hearts?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>See my hands and feet, that it is I myself. Handle, and see: for a spirit hath not flesh and bones, as you see me to have.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And when he had said this, he shewed them his hands and feet.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>But while they yet believed not and wondered for joy, he said: Have you here any thing to eat?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And they offered him a piece of a broiled fish and a honeycomb.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And when he had eaten before them, taking the remains, he gave to them.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And he said to them: These are the words which I spoke to you while I was yet with you, that all things must needs be fulfilled which are written in the law of Moses and in the prophets and in the psalms, concerning me.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Then he opened their understanding, that they might understand the scriptures.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And he said to them: Thus it is written, and thus it behoved Christ to suffer and to rise again from the dead, the third day:</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And that penance and remission of sins should be preached in his name, unto all nations, beginning at Jerusalem.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And you are witnesses of these things.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And I send the promise of my Father upon you: but stay you in the city till you be endued with power from on high.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And he led them out as far as Bethania: and lifting up his hands, he blessed them.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And it came to pass, whilst he blessed them, he departed from them and was carried up to heaven.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And they adoring went back into Jerusalem with great joy.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And they were always in the temple, praising and blessing God. Amen.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Una autem sabbati valde diluculo venerunt ad monumentum, portantes quæ paraverant aromata :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et invenerunt lapidem revolutum a monumento.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ingressæ non invenerunt corpus Domini Jesu.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et factum est, dum mente consternatæ essent de isto, ecce duo viri steterunt secus illas in veste fulgenti.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cum timerent autem, et declinarent vultum in terram, dixerunt ad illas : Quid quæritis viventem cum mortuis ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>non est hic, sed surrexit : recordamini qualiter locutus est vobis, cum adhuc in Galilæa esset,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>dicens : Quia oportet Filium hominis tradi in manus hominum peccatorum, et crucifigi, et die tertia resurgere.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et recordatæ sunt verborum ejus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et regressæ a monumento nuntiaverunt hæc omnia illis undecim, et ceteris omnibus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Erat autem Maria Magdalene, et Joanna, et Maria Jacobi, et ceteræ quæ cum eis erant, quæ dicebant ad apostolos hæc.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et visa sunt ante illos sicut deliramentum verba ista, et non crediderunt illis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Petrus autem surgens cucurrit ad monumentum : et procumbens vidit linteamina sola posita, et abiit secum mirans quod factum fuerat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et ecce duo ex illis ibant ipsa die in castellum, quod erat in spatio stadiorum sexaginta ab Jerusalem, nomine Emmaus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ipsi loquebantur ad invicem de his omnibus quæ acciderant.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et factum est, dum fabularentur, et secum quærerent : et ipse Jesus appropinquans ibat cum illis :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>oculi autem illorum tenebantur ne eum agnoscerent.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et ait ad illos : Qui sunt hi sermones, quos confertis ad invicem ambulantes, et estis tristes ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et respondens unus, cui nomen Cleophas, dixit ei : Tu solus peregrinus es in Jerusalem, et non cognovisti quæ facta sunt in illa his diebus ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quibus ille dixit : Quæ ? Et dixerunt : De Jesu Nazareno, qui fuit vir propheta, potens in opere et sermone coram Deo et omni populo :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et quomodo eum tradiderunt summi sacerdotes et principes nostri in damnationem mortis, et crucifixerunt eum :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>nos autem sperabamus quia ipse esset redempturus Israël : et nunc super hæc omnia, tertia dies est hodie quod hæc facta sunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sed et mulieres quædam ex nostris terruerunt nos, quæ ante lucem fuerunt ad monumentum,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et non invento corpore ejus, venerunt, dicentes se etiam visionem angelorum vidisse, qui dicunt eum vivere.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et abierunt quidam ex nostris ad monumentum : et ita invenerunt sicut mulieres dixerunt, ipsum vero non invenerunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ipse dixit ad eos : O stulti, et tardi corde ad credendum in omnibus quæ locuti sunt prophetæ !</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Nonne hæc oportuit pati Christum, et ita intrare in gloriam suam ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et incipiens a Moyse, et omnibus prophetis, interpretabatur illis in omnibus scripturis quæ de ipso erant.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et appropinquaverunt castello quo ibant : et ipse se finxit longius ire.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et coëgerunt illum, dicentes : Mane nobiscum, quoniam advesperascit, et inclinata est jam dies. Et intravit cum illis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et factum est, dum recumberet cum eis, accepit panem, et benedixit, ac fregit, et porrigebat illis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et aperti sunt oculi eorum, et cognoverunt eum : et ipse evanuit ex oculis eorum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et dixerunt ad invicem : Nonne cor nostrum ardens erat in nobis dum loqueretur in via, et aperiret nobis Scripturas ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et surgentes eadem hora regressi sunt in Jerusalem : et invenerunt congregatos undecim, et eos qui cum illis erant,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>dicentes : Quod surrexit Dominus vere, et apparuit Simoni.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et ipsi narrabant quæ gesta erant in via, et quomodo cognoverunt eum in fractione panis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Dum autem hæc loquuntur, stetit Jesus in medio eorum, et dicit eis : Pax vobis : ego sum, nolite timere.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Conturbati vero et conterriti, existimabant se spiritum videre.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et dixit eis : Quid turbati estis, et cogitationes ascendunt in corda vestra ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>videte manus meas, et pedes, quia ego ipse sum ; palpate et videte, quia spiritus carnem et ossa non habet, sicut me videtis habere.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et cum hoc dixisset, ostendit eis manus et pedes.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Adhuc autem illis non credentibus, et mirantibus præ gaudio, dixit : Habetis hic aliquid quod manducetur ?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>At illi obtulerunt ei partem piscis assi et favum mellis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et cum manducasset coram eis, sumens reliquias dedit eis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et dixit ad eos : Hæc sunt verba quæ locutus sum ad vos cum adhuc essem vobiscum, quoniam necesse est impleri omnia quæ scripta sunt in lege Moysi, et prophetis, et Psalmis de me.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Tunc aperuit illis sensum ut intelligerent Scripturas,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>et dixit eis : Quoniam sic scriptum est, et sic oportebat Christum pati, et resurgere a mortuis tertia die :</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>et prædicari in nomine ejus pœnitentiam, et remissionem peccatorum in omnes gentes, incipientibus ab Jerosolyma.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Vos autem testes estis horum.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Et ego mitto promissum Patris mei in vos ; vos autem sedete in civitate, quoadusque induamini virtute ex alto.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Eduxit autem eos foras in Bethaniam, et elevatis manibus suis benedixit eis.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Et factum est, dum benediceret illis, recessit ab eis, et ferebatur in cælum.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Et ipsi adorantes regressi sunt in Jerusalem cum gaudio magno :</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>et erant semper in templo, laudantes et benedicentes Deum. Amen.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/23/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 23</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->24<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Luke 23" class="i ",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LUK.24\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":24,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And on the first day of the week, very early in the morning, they came to the sepulchre, bringing the spices which they had prepared.\"},{\"verse\":2,\"text\":\"And they found the stone rolled back from the sepulchre.\"},{\"verse\":3,\"text\":\"And going in, they found not the body of the Lord Jesus.\"},{\"verse\":4,\"text\":\"And it came to pass, as they were astonished in their mind at this, behold, two men stood by them, in shining apparel.\"},{\"verse\":5,\"text\":\"And as they were afraid and bowed down their countenance towards the ground, they said unto them: Why seek you the living with the dead?\"},{\"verse\":6,\"text\":\"He is not here, but is risen. Remember how he spoke unto you, when he was yet in Galilee,\"},{\"verse\":7,\"text\":\"Saying: The Son of man must be delivered into the hands of sinful men and be crucified and the third day rise again.\"},{\"verse\":8,\"text\":\"And they remembered his words.\"},{\"verse\":9,\"text\":\"And going back from the sepulchre, they told all these things to the eleven and to all the rest.\"},{\"verse\":10,\"text\":\"And it was Mary Magdalen and Joanna and Mary of James and the other women that were with them, who told these things to the apostles.\"},{\"verse\":11,\"text\":\"And these words seemed to them as idle tales: and they did not believe them.\"},{\"verse\":12,\"text\":\"But Peter rising up, ran to the sepulchre and, stooping down, he saw the linen cloths laid by themselves: and went away wondering in himself at that which was come to pass.\"},{\"verse\":13,\"text\":\"And behold, two of them went, the same day, to a town which was sixty furlongs from Jerusalem, named Emmaus.\"},{\"verse\":14,\"text\":\"And they talked together of all these things which had happened.\"},{\"verse\":15,\"text\":\"And it came to pass that while they talked and reasoned with themselves, Jesus himself also, drawing near, went with them.\"},{\"verse\":16,\"text\":\"But their eyes were held, that they should not know him.\"},{\"verse\":17,\"text\":\"And he said to them: What are these discourses that you hold one with another as you walk and are sad?\"},{\"verse\":18,\"text\":\"And the one of them, whose name was Cleophas, answering, said to him: Art thou only a stranger in Jerusalem, and hast not known the things that have been done there in these days?\"},{\"verse\":19,\"text\":\"To whom he said: What things? And they said: Concerning Jesus of Nazareth, who was a prophet, mighty in work and word before God and all the people.\"},{\"verse\":20,\"text\":\"And how our chief priests and princes delivered him to be condemned to death and crucified him.\"},{\"verse\":21,\"text\":\"But we hoped that it was he that should have redeemed Israel. And now besides all this, to-day is the third day since these things were done.\"},{\"verse\":22,\"text\":\"Yea and certain women also of our company affrighted us who, before it was light, were at the sepulchre,\"},{\"verse\":23,\"text\":\"And not finding his body, came, saying that they had also seen a vision of angels, who say that he is alive.\"},{\"verse\":24,\"text\":\"And some of our people went to the sepulchre and found it so as the women had said: but him they found not.\"},{\"verse\":25,\"text\":\"Then he said to them: O foolish and slow of heart to believe in all things, Which the prophets have spoken.\"},{\"verse\":26,\"text\":\"Ought not Christ to have suffered these things and so, to enter into his glory?\"},{\"verse\":27,\"text\":\"And beginning at Moses and all the prophets, he expounded to them in all the scriptures the things that were concerning him.\"},{\"verse\":28,\"text\":\"And they drew nigh to the town whither they were going: and he made as though he would go farther.\"},{\"verse\":29,\"text\":\"But they constrained him, saying: Stay with us, because it is towards evening and the day is now far spent. And he went in with them.\"},{\"verse\":30,\"text\":\"And it came to pass, whilst he was at table with them, he took bread and blessed and brake and gave to them.\"},{\"verse\":31,\"text\":\"And their eyes were opened: and they knew him. And he vanished out of their sight.\"},{\"verse\":32,\"text\":\"And they said one to the other: Was not our heart burning within us, whilst he spoke in the way and opened to us the scriptures?\"},{\"verse\":33,\"text\":\"And rising up, the same hour, they went back to Jerusalem: and they found the eleven gathered together, and those that were with them,\"},{\"verse\":34,\"text\":\"Saying: The Lord is risen indeed and hath appeared to Simon.\"},{\"verse\":35,\"text\":\"And they told what things were done in the way: and how they knew him in the breaking of bread.\"},{\"verse\":36,\"text\":\"Now, whilst they were speaking these things, Jesus stood in the midst of them and saith to them: Peace be to you. It is I: Fear not.\"},{\"verse\":37,\"text\":\"But they being troubled and frightened, supposed that they saw a spirit.\"},{\"verse\":38,\"text\":\"And he said to them: Why are you troubled, and why do thoughts arise in your hearts?\"},{\"verse\":39,\"text\":\"See my hands and feet, that it is I myself. Handle, and see: for a spirit hath not flesh and bones, as you see me to have.\"},{\"verse\":40,\"text\":\"And when he had said this, he shewed them his hands and feet.\"},{\"verse\":41,\"text\":\"But while they yet believed not and wondered for joy, he said: Have you here any thing to eat?\"},{\"verse\":42,\"text\":\"And they offered him a piece of a broiled fish and a honeycomb.\"},{\"verse\":43,\"text\":\"And when he had eaten before them, taking the remains, he gave to them.\"},{\"verse\":44,\"text\":\"And he said to them: These are the words which I spoke to you while I was yet with you, that all things must needs be fulfilled which are written in the law of Moses and in the prophets and in the psalms, concerning me.\"},{\"verse\":45,\"text\":\"Then he opened their understanding, that they might understand the scriptures.\"},{\"verse\":46,\"text\":\"And he said to them: Thus it is written, and thus it behoved Christ to suffer and to rise again from the dead, the third day:\"},{\"verse\":47,\"text\":\"And that penance and remission of sins should be preached in his name, unto all nations, beginning at Jerusalem.\"},{\"verse\":48,\"text\":\"And you are witnesses of these things.\"},{\"verse\":49,\"text\":\"And I send the promise of my Father upon you: but stay you in the city till you be endued with power from on high.\"},{\"verse\":50,\"text\":\"And he led them out as far as Bethania: and lifting up his hands, he blessed them.\"},{\"verse\":51,\"text\":\"And it came to pass, whilst he blessed them, he departed from them and was carried up to heaven.\"},{\"verse\":52,\"text\":\"And they adoring went back into Jerusalem with great joy.\"},{\"verse\":53,\"text\":\"And they were always in the temple, praising and blessing God. Amen.\"}],\"vul\":[{\"verse\":1,\"text\":\"Una autem sabbati valde diluculo venerunt ad monumentum, portantes quæ paraverant aromata :\"},{\"verse\":2,\"text\":\"et invenerunt lapidem revolutum a monumento.\"},{\"verse\":3,\"text\":\"Et ingressæ non invenerunt corpus Domini Jesu.\"},{\"verse\":4,\"text\":\"Et factum est, dum mente consternatæ essent de isto, ecce duo viri steterunt secus illas in veste fulgenti.\"},{\"verse\":5,\"text\":\"Cum timerent autem, et declinarent vultum in terram, dixerunt ad illas : Quid quæritis viventem cum mortuis ?\"},{\"verse\":6,\"text\":\"non est hic, sed surrexit : recordamini qualiter locutus est vobis, cum adhuc in Galilæa esset,\"},{\"verse\":7,\"text\":\"dicens : Quia oportet Filium hominis tradi in manus hominum peccatorum, et crucifigi, et die tertia resurgere.\"},{\"verse\":8,\"text\":\"Et recordatæ sunt verborum ejus.\"},{\"verse\":9,\"text\":\"Et regressæ a monumento nuntiaverunt hæc omnia illis undecim, et ceteris omnibus.\"},{\"verse\":10,\"text\":\"Erat autem Maria Magdalene, et Joanna, et Maria Jacobi, et ceteræ quæ cum eis erant, quæ dicebant ad apostolos hæc.\"},{\"verse\":11,\"text\":\"Et visa sunt ante illos sicut deliramentum verba ista, et non crediderunt illis.\"},{\"verse\":12,\"text\":\"Petrus autem surgens cucurrit ad monumentum : et procumbens vidit linteamina sola posita, et abiit secum mirans quod factum fuerat.\"},{\"verse\":13,\"text\":\"Et ecce duo ex illis ibant ipsa die in castellum, quod erat in spatio stadiorum sexaginta ab Jerusalem, nomine Emmaus.\"},{\"verse\":14,\"text\":\"Et ipsi loquebantur ad invicem de his omnibus quæ acciderant.\"},{\"verse\":15,\"text\":\"Et factum est, dum fabularentur, et secum quærerent : et ipse Jesus appropinquans ibat cum illis :\"},{\"verse\":16,\"text\":\"oculi autem illorum tenebantur ne eum agnoscerent.\"},{\"verse\":17,\"text\":\"Et ait ad illos : Qui sunt hi sermones, quos confertis ad invicem ambulantes, et estis tristes ?\"},{\"verse\":18,\"text\":\"Et respondens unus, cui nomen Cleophas, dixit ei : Tu solus peregrinus es in Jerusalem, et non cognovisti quæ facta sunt in illa his diebus ?\"},{\"verse\":19,\"text\":\"Quibus ille dixit : Quæ ? Et dixerunt : De Jesu Nazareno, qui fuit vir propheta, potens in opere et sermone coram Deo et omni populo :\"},{\"verse\":20,\"text\":\"et quomodo eum tradiderunt summi sacerdotes et principes nostri in damnationem mortis, et crucifixerunt eum :\"},{\"verse\":21,\"text\":\"nos autem sperabamus quia ipse esset redempturus Israël : et nunc super hæc omnia, tertia dies est hodie quod hæc facta sunt.\"},{\"verse\":22,\"text\":\"Sed et mulieres quædam ex nostris terruerunt nos, quæ ante lucem fuerunt ad monumentum,\"},{\"verse\":23,\"text\":\"et non invento corpore ejus, venerunt, dicentes se etiam visionem angelorum vidisse, qui dicunt eum vivere.\"},{\"verse\":24,\"text\":\"Et abierunt quidam ex nostris ad monumentum : et ita invenerunt sicut mulieres dixerunt, ipsum vero non invenerunt.\"},{\"verse\":25,\"text\":\"Et ipse dixit ad eos : O stulti, et tardi corde ad credendum in omnibus quæ locuti sunt prophetæ !\"},{\"verse\":26,\"text\":\"Nonne hæc oportuit pati Christum, et ita intrare in gloriam suam ?\"},{\"verse\":27,\"text\":\"Et incipiens a Moyse, et omnibus prophetis, interpretabatur illis in omnibus scripturis quæ de ipso erant.\"},{\"verse\":28,\"text\":\"Et appropinquaverunt castello quo ibant : et ipse se finxit longius ire.\"},{\"verse\":29,\"text\":\"Et coëgerunt illum, dicentes : Mane nobiscum, quoniam advesperascit, et inclinata est jam dies. Et intravit cum illis.\"},{\"verse\":30,\"text\":\"Et factum est, dum recumberet cum eis, accepit panem, et benedixit, ac fregit, et porrigebat illis.\"},{\"verse\":31,\"text\":\"Et aperti sunt oculi eorum, et cognoverunt eum : et ipse evanuit ex oculis eorum.\"},{\"verse\":32,\"text\":\"Et dixerunt ad invicem : Nonne cor nostrum ardens erat in nobis dum loqueretur in via, et aperiret nobis Scripturas ?\"},{\"verse\":33,\"text\":\"Et surgentes eadem hora regressi sunt in Jerusalem : et invenerunt congregatos undecim, et eos qui cum illis erant,\"},{\"verse\":34,\"text\":\"dicentes : Quod surrexit Dominus vere, et apparuit Simoni.\"},{\"verse\":35,\"text\":\"Et ipsi narrabant quæ gesta erant in via, et quomodo cognoverunt eum in fractione panis.\"},{\"verse\":36,\"text\":\"Dum autem hæc loquuntur, stetit Jesus in medio eorum, et dicit eis : Pax vobis : ego sum, nolite timere.\"},{\"verse\":37,\"text\":\"Conturbati vero et conterriti, existimabant se spiritum videre.\"},{\"verse\":38,\"text\":\"Et dixit eis : Quid turbati estis, et cogitationes ascendunt in corda vestra ?\"},{\"verse\":39,\"text\":\"videte manus meas, et pedes, quia ego ipse sum ; palpate et videte, quia spiritus carnem et ossa non habet, sicut me videtis habere.\"},{\"verse\":40,\"text\":\"Et cum hoc dixisset, ostendit eis manus et pedes.\"},{\"verse\":41,\"text\":\"Adhuc autem illis non credentibus, et mirantibus præ gaudio, dixit : Habetis hic aliquid quod manducetur ?\"},{\"verse\":42,\"text\":\"At illi obtulerunt ei partem piscis assi et favum mellis.\"},{\"verse\":43,\"text\":\"Et cum manducasset coram eis, sumens reliquias dedit eis.\"},{\"verse\":44,\"text\":\"Et dixit ad eos : Hæc sunt verba quæ locutus sum ad vos cum adhuc essem vobiscum, quoniam necesse est impleri omnia quæ scripta sunt in lege Moysi, et prophetis, et Psalmis de me.\"},{\"verse\":45,\"text\":\"Tunc aperuit illis sensum ut intelligerent Scripturas,\"},{\"verse\":46,\"text\":\"et dixit eis : Quoniam sic scriptum est, et sic oportebat Christum pati, et resurgere a mortuis tertia die :\"},{\"verse\":47,\"text\":\"et prædicari in nomine ejus pœnitentiam, et remissionem peccatorum in omnes gentes, incipientibus ab Jerosolyma.\"},{\"verse\":48,\"text\":\"Vos autem testes estis horum.\"},{\"verse\":49,\"text\":\"Et ego mitto promissum Patris mei in vos ; vos autem sedete in civitate, quoadusque induamini virtute ex alto.\"},{\"verse\":50,\"text\":\"Eduxit autem eos foras in Bethaniam, et elevatis manibus suis benedixit eis.\"},{\"verse\":51,\"text\":\"Et factum est, dum benediceret illis, recessit ab eis, et ferebatur in cælum.\"},{\"verse\":52,\"text\":\"Et ipsi adorantes regressi sunt in Jerusalem cum gaudio magno :\"},{\"verse\":53,\"text\":\"et erant semper in templo, laudantes et benedicentes Deum. Amen.\"}],\"summary\":\"Christ’s resurrection and manifestation of himself to his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":23,\"label\":\"Luke 23\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":1,\"label\":\"John 1\"}}]]\n"])</script></body></html>
