meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">13</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The necessity of penance. The barren fig tree. The cure of the infirm woman. The journey to Jerusalem.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And there were present, at that very time, some that told him of the Galileans, whose blood Pilate had mingled with their sacrifices.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he answering, said to them: Think you that these Galileans were sinners above all the men of Galilee, because they suffered such things?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>No, I say to you: but unless you shall do penance, you shall all likewise perish.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Or those eighteen upon whom the tower fell in Siloe and slew them: think you that they also were debtors above all the men that dwelt in Jerusalem?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>No, I say to you: but except you do penance, you shall all likewise perish.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He spoke also this parable: A certain man had a fig tree planted in his vineyard: and he came seeking fruit on it and found none.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And he said to the dresser of the vineyard: Behold, for these three years I come seeking fruit on this fig tree and I find none. Cut it down therefore. Why cumbereth it the ground?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But he answering, said to him: Lord, let it alone this year also, until I dig about it and dung it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And if happily it bear fruit: but if not, then after that thou shalt cut it down.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And he was teaching in their synagogue on their sabbath.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And behold there was a woman who had a spirit of infirmity eighteen years. And she was bowed together: neither could she look upwards at all.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Whom when Jesus saw, he called her unto him and said to her: Woman, thou art delivered from thy infirmity.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And he laid his hands upon her: and immediately she was made straight and glorified God.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the ruler of the synagogue being angry that Jesus had healed on the sabbath answering, said to the multitude: Six days there are wherein you ought to work. In them therefore come and be healed: and not on the sabbath day.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the Lord answering him, said: Ye hypocrites, doth not every one of you, on the sabbath day, loose his ox or his ass from the manger and lead them to water?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And ought not this daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And when he said these things, all his adversaries were ashamed: and all the people rejoiced for all the things that were gloriously done by him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He said therefore: To what is the kingdom of God like, and whereunto shall I resemble it?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>It is like to a grain of mustard seed, which a man took and cast into his garden: and it grew and became a great tree, and the birds of the air lodged in the branches thereof.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And again he said: Whereunto shall I esteem the kingdom of God to be like?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>It is like to leaven, which a woman took and hid in three measures of meal, till the whole was leavened.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And he went through the cities and towns teaching and making his journey to Jerusalem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And a certain man said to him: Lord, are they few that are saved? But he said to them:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Strive to enter by the narrow gate: for many, I say to you, shall seek to enter and shall not be able.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But when the master of the house shall be gone in and shall shut the door, you shall begin to stand without; and knock at the door, saying: Lord, open to us. And he answering, shall say to you: I know you not, whence you are.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Then you shall begin to say: We have eaten and drunk in thy presence: and thou hast taught in our streets.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he shall say to you: I know you not, whence you are. Depart from me, all ye workers of iniquity.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>There shall be weeping and gnashing of teeth; when you shall see Abraham and Isaac and Jacob and all the prophets, in the kingdom of God: and you yourselves thrust out.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And there shall come from the east and the west and the north and the south: and shall sit down in the kingdom of God.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And behold, they are last that shall be first: and they are first that shall be last.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The same day, there came some of the Pharisees, saying to him: Depart, and get thee hence, for Herod hath a mind to kill thee.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And he said to them: Go and tell that fox: Behold, I cast out devils and do cures, to-day and to-morrow, and the third day I am consummated.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Nevertheless, I must walk to-day and to-morrow and the day following, because it cannot be that a prophet perish, out of Jerusalem.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jerusalem, Jerusalem, that killest the prophets; and stonest them that are sent to thee, how often would I have gathered thy children as the bird doth her brood under her wings, and thou wouldest not?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Behold your house shall be left to you desolate. And I say to you that you shall not see me till the time come when you shall say: Blessed is he that cometh in the name of the Lord.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Aderant autem quidam ipso in tempore, nuntiantes illi de Galilæis, quorum sanguinem Pilatus miscuit cum sacrificiis eorum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et respondens dixit illis : Putatis quod hi Galilæi præ omnibus Galilæis peccatores fuerint, quia talia passi sunt ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Non, dico vobis : sed nisi pœnitentiam habueritis, omnes similiter peribitis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sicut illi decem et octo, supra quos cecidit turris in Siloë, et occidit eos : putatis quia et ipsi debitores fuerint præter omnes homines habitantes in Jerusalem ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Non, dico vobis : sed si pœnitentiam non egeritis, omnes similiter peribitis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dicebat autem et hanc similitudinem : Arborem fici habebat quidam plantatam in vinea sua, et venit quærens fructum in illa, et non invenit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixit autem ad cultorem vineæ : Ecce anni tres sunt ex quo venio quærens fructum in ficulnea hac, et non invenio : succide ergo illam : ut quid etiam terram occupat ?</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>At ille respondens, dicit illi : Domine dimitte illam et hoc anno, usque dum fodiam circa illam, et mittam stercora,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et siquidem fecerit fructum : sin autem, in futurum succides eam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Erat autem docens in synagoga eorum sabbatis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et ecce mulier, quæ habebat spiritum infirmitatis annis decem et octo : et erat inclinata, nec omnino poterat sursum respicere.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quam cum videret Jesus, vocavit eam ad se, et ait illi : Mulier, dimissa es ab infirmitate tua.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et imposuit illi manus, et confestim erecta est, et glorificabat Deum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Respondens autem archisynagogus, indignans quia sabbato curasset Jesus, dicebat turbæ : Sex dies sunt in quibus oportet operari : in his ergo venite, et curamini, et non in die sabbati.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Respondens autem ad illum Dominus, dixit : Hypocritæ, unusquisque vestrum sabbato non solvit bovem suum, aut asinum a præsepio, et ducit adaquare ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hanc autem filiam Abrahæ, quam alligavit Satanas, ecce decem et octo annis, non oportuit solvi a vinculo isto die sabbati ?</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et cum hæc diceret, erubescebant omnes adversarii ejus : et omnis populus gaudebat in universis, quæ gloriose fiebant ab eo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dicebat ergo : Cui simile est regnum Dei, et cui simile æstimabo illud ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Simile est grano sinapis, quod acceptum homo misit in hortum suum, et crevit, et factum est in arborem magnam : et volucres cæli requieverunt in ramis ejus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et iterum dixit : Cui simile æstimabo regnum Dei ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Simile est fermento, quod acceptum mulier abscondit in farinæ sata tria, donec fermentaretur totum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et ibat per civitates et castella, docens, et iter faciens in Jerusalem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ait autem illi quidam : Domine, si pauci sunt, qui salvantur ? Ipse autem dixit ad illos :</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Contendite intrare per angustam portam : quia multi, dico vobis, quærent intrare, et non poterunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Cum autem intraverit paterfamilias, et clauserit ostium, incipietis foris stare, et pulsare ostium, dicentes : Domine, aperi nobis : et respondens dicet vobis : Nescio vos unde sitis :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>tunc incipietis dicere : Manducavimus coram te, et bibimus, et in plateis nostris docuisti.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et dicet vobis : Nescio vos unde sitis : discedite a me omnes operarii iniquitatis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ibi erit fletus et stridor dentium : cum videritis Abraham, et Isaac, et Jacob, et omnes prophetas in regno Dei, vos autem expelli foras.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et venient ab oriente, et occidente, et aquilone, et austro, et accumbent in regno Dei.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ecce sunt novissimi qui erunt primi, et sunt primi qui erunt novissimi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In ipsa die accesserunt quidam pharisæorum, dicentes illi : Exi, et vade hinc : quia Herodes vult te occidere.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et ait illis : Ite, et dicite vulpi illi : Ecce ejicio dæmonia, et sanitates perficio hodie, et cras, et tertia die consummor.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Verumtamen oportet me hodie et cras et sequenti die ambulare : quia non capit prophetam perire extra Jerusalem.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jerusalem, Jerusalem, quæ occidis prophetas, et lapidas eos qui mittuntur ad te, quoties volui congregare filios tuos quemadmodum avis nidum suum sub pennis, et noluisti ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Ecce relinquetur vobis domus vestra deserta. Dico autem vobis, quia non videbitis me donec veniat cum dicetis : Benedictus qui venit in nomine Domini.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6">< until I dig about it and dung it.\"},{\"verse\":9,\"text\":\"And if happily it bear fruit: but if not, then after that thou shalt cut it down.\"},{\"verse\":10,\"text\":\"And he was teaching in their synagogue on their sabbath.\"},{\"verse\":11,\"text\":\"And behold there was a woman who had a spirit of infirmity eighteen years. And she was bowed together: neither could she look upwards at all.\"},{\"verse\":12,\"text\":\"Whom when Jesus saw, he called her unto him and said to her: Woman, thou art delivered from thy infirmity.\"},{\"verse\":13,\"text\":\"And he laid his hands upon her: and immediately she was made straight and glorified God.\"},{\"verse\":14,\"text\":\"And the ruler of the synagogue being angry that Jesus had healed on the sabbath answering, said to the multitude: Six days there are wherein you ought to work. In them therefore come and be healed: and not on the sabbath day.\"},{\"verse\":15,\"text\":\"And the Lord answering him, said: Ye hypocrites, doth not every one of you, on the sabbath day, loose his ox or his ass from the manger and lead them to water?\"},{\"verse\":16,\"text\":\"And ought not this daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?\"},{\"verse\":17,\"text\":\"And when he said these things, all his adversaries were ashamed: and all the people rejoiced for all the things that were gloriously done by him.\"},{\"verse\":18,\"text\":\"He said therefore: To what is the kingdom of God like, and whereunto shall I resemble it?\"},{\"verse\":19,\"text\":\"It is like to a grain of mustard seed, which a man took and cast into his garden: and it grew and became a great tree, and the birds of the air lodged in the branches thereof.\"},{\"verse\":20,\"text\":\"And again he said: Whereunto shall I esteem the kingdom of God to be like?\"},{\"verse\":21,\"text\":\"It is like to leaven, which a woman took and hid in three measures of meal, till the whole was leavened.\"},{\"verse\":22,\"text\":\"And he went through the cities and towns teaching and making his journey to Jerusalem.\"},{\"verse\":23,\"text\":\"And a certain man said to him: Lord, are they few that are saved? But he said to them:\"},{\"verse\":24,\"text\":\"Strive to enter by the narrow gate: for many, I say to you, shall seek to enter and shall not be able.\"},{\"verse\":25,\"text\":\"But when the master of the house shall be gone in and shall shut the door, you shall begin to stand without; and knock at the door, saying: Lord, open to us. And he answering, shall say to you: I know you not, whence you are.\"},{\"verse\":26,\"text\":\"Then you shall begin to say: We have eaten and drunk in thy presence: and thou hast taught in our streets.\"},{\"verse\":27,\"text\":\"And he shall say to you: I know you not, whence you are. Depart from me, all ye workers of iniquity.\"},{\"verse\":28,\"text\":\"There shall be weeping and gnashing of teeth; when you shall see Abraham and Isaac and Jacob and all the prophets, in the kingdom of God: and you yourselves thrust out.\"},{\"verse\":29,\"text\":\"And there shall come from the east and the west and the north and the south: and shall sit down in the kingdom of God.\"},{\"verse\":30,\"text\":\"And behold, they are last that shall be first: and they are first that shall be last.\"},{\"verse\":31,\"text\":\"The same day, there came some of the Pharisees, saying to him: Depart, and get thee hence, for Herod hath a mind to kill thee.\"},{\"verse\":32,\"text\":\"And he said to them: Go and tell that fox: Behold, I cast out devils and do cures, to-day and to-morrow, and the third day I am consummated.\"},{\"verse\":33,\"text\":\"Nevertheless, I must walk to-day and to-morrow and the day following, because it cannot be that a prophet perish, out of Jerusalem.\"},{\"verse\":34,\"text\":\"Jerusalem, Jerusalem, that killest the prophets; and stonest them that are sent to thee, how often would I have gathered thy children as the bird doth her brood under her wings, and thou wouldest not?\"},{\"verse\":35,\"text\":\"Behold your house shall be left to you desolate. And I say to you that you shall not see me till the time come when you shall say: Blessed is he that cometh in the name of the Lord.\"}],\"vul\":[{\"verse\":1,\"text\":\"Aderant autem quidam ipso in tempore, nuntiantes illi de Galilæis, quorum sanguinem Pilatus miscuit cum sacrificiis eorum.\"},{\"verse\":2,\"text\":\"Et respondens dixit illis : Putatis quod hi Galilæi præ omnibus Galilæis peccatores fuerint, quia talia passi sunt ?\"},{\"verse\":3,\"text\":\"Non, dico vobis : sed nisi pœnitentiam habueritis, omnes similiter peribitis.\"},{\"verse\":4,\"text\":\"Sicut illi decem et octo, supra quos cecidit turris in Siloë, et occidit eos : putatis quia et ipsi debitores fuerint præter omnes homines habitantes in Jerusalem ?\"},{\"verse\":5,\"text\":\"Non, dico vobis : sed si pœnitentiam non egeritis, omnes similiter peribitis.\"},{\"verse\":6,\"text\":\"Dicebat autem et hanc similitudinem : Arborem fici habebat quidam plantatam in vinea sua, et venit quærens fructum in illa, et non invenit.\"},{\"verse\":7,\"text\":\"Dixit autem ad cultorem vineæ : Ecce anni tres sunt ex quo venio quærens fructum in ficulnea hac, et non invenio : succide ergo illam : ut quid etiam terram occupat ?\"},{\"verse\":8,\"text\":\"At ille respondens, dicit illi : Domine dimitte illam et hoc anno, usque dum fodiam circa illam, et mittam stercora,\"},{\"verse\":9,\"text\":\"et siquidem fecerit fructum : sin autem, in futurum succides eam.\"},{\"verse\":10,\"text\":\"Erat autem docens in synagoga eorum sabbatis.\"},{\"verse\":11,\"text\":\"Et ecce mulier, quæ habebat spiritum infirmitatis annis decem et octo : et erat inclinata, nec omnino poterat sursum respicere.\"},{\"verse\":12,\"text\":\"Quam cum videret Jesus, vocavit eam ad se, et ait illi : Mulier, dimissa es ab infirmitate tua.\"},{\"verse\":13,\"text\":\"Et imposuit illi manus, et confestim erecta est, et glorificabat Deum.\"},{\"verse\":14,\"text\":\"Respondens autem archisynagogus, indignans quia sabbato curasset Jesus, dicebat turbæ : Sex dies sunt in quibus oportet operari : in his ergo venite, et curamini, et non in die sabbati.\"},{\"verse\":15,\"text\":\"Respondens autem ad illum Dominus, dixit : Hypocritæ, unusquisque vestrum sabbato non solvit bovem suum, aut asinum a præsepio, et ducit adaquare ?\"},{\"verse\":16,\"text\":\"Hanc autem filiam Abrahæ, quam alligavit Satanas, ecce decem et octo annis, non oportuit solvi a vinculo isto die sabbati ?\"},{\"verse\":17,\"text\":\"Et cum hæc diceret, erubescebant omnes adversarii ejus : et omnis populus gaudebat in universis, quæ gloriose fiebant ab eo.\"},{\"verse\":18,\"text\":\"Dicebat ergo : Cui simile est regnum Dei, et cui simile æstimabo illud ?\"},{\"verse\":19,\"text\":\"Simile est grano sinapis, quod acceptum homo misit in hortum suum, et crevit, et factum est in arborem magnam : et volucres cæli requieverunt in ramis ejus.\"},{\"verse\":20,\"text\":\"Et iterum dixit : Cui simile æstimabo regnum Dei ?\"},{\"verse\":21,\"text\":\"Simile est fermento, quod acceptum mulier abscondit in farinæ sata tria, donec fermentaretur totum.\"},{\"verse\":22,\"text\":\"Et ibat per civitates et castella, docens, et iter faciens in Jerusalem.\"},{\"verse\":23,\"text\":\"Ait autem illi quidam : Domine, si pauci sunt, qui salvantur ? Ipse autem dixit ad illos :\"},{\"verse\":24,\"text\":\"Contendite intrare per angustam portam : quia multi, dico vobis, quærent intrare, et non poterunt.\"},{\"verse\":25,\"text\":\"Cum autem intraverit paterfamilias, et clauserit ostium, incipietis foris stare, et pulsare ostium, dicentes : Domine, aperi nobis : et respondens dicet vobis : Nescio vos unde sitis :\"},{\"verse\":26,\"text\":\"tunc incipietis dicere : Manducavimus coram te, et bibimus, et in plateis nostris docuisti.\"},{\"verse\":27,\"text\":\"Et dicet vobis : Nescio vos unde sitis : discedite a me omnes operarii iniquitatis.\"},{\"verse\":28,\"text\":\"Ibi erit fletus et stridor dentium : cum videritis Abraham, et Isaac, et Jacob, et omnes prophetas in regno Dei, vos autem expelli foras.\"},{\"verse\":29,\"text\":\"Et venient ab oriente, et occidente, et aquilone, et austro, et accumbent in regno Dei.\"},{\"verse\":30,\"text\":\"Et ecce sunt novissimi qui erunt primi, et sunt primi qui erunt novissimi.\"},{\"verse\":31,\"text\":\"In ipsa die accesserunt quidam pharisæorum, dicentes illi : Exi, et vade hinc : quia Herodes vult te occidere.\"},{\"verse\":32,\"text\":\"Et ait illis : Ite, et dicite vulpi illi : Ecce ejicio dæmonia, et sanitates perficio hodie, et cras, et tertia die consummor.\"},{\"verse\":33,\"text\":\"Verumtamen oportet me hodie et cras et sequenti die ambulare : quia non capit prophetam perire extra Jerusalem.\"},{\"verse\":34,\"text\":\"Jerusalem, Jerusalem, quæ occidis prophetas, et lapidas eos qui mittuntur ad te, quoties volui congregare filios tuos quemadmodum avis nidum suum sub pennis, et noluisti ?\"},{\"verse\":35,\"text\":\"Ecce relinquetur vobis domus vestra deserta. Dico autem vobis, quia non videbitis me donec veniat cum dicetis : Benedictus qui venit in nomine Domini.\"}],\"summary\":\"The necessity of penance. The barren fig tree. The cure of the infirm woman. The journey to Jerusalem.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":12,\"label\":\"Luke 12\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":14,\"label\":\"Luke 14\"}}]]\n"])</script></body></html>
