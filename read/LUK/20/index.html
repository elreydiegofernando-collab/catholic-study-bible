<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 20 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">20</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The parable of the husbandmen. Of paying tribute to Caesar and of the resurrection of the dead.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass that on one of the days, as he was teaching the people in the temple and preaching the gospel, the chief priests and the scribes, with the ancients, met together,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And spoke to him, saying: Tell us, by what authority dost thou these things? Or, who is he that hath given thee this authority?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And Jesus answering, said to them: I will also ask you one thing. Answer me:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The baptism of John, was it from heaven, or of men?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But they thought within themselves, saying: If we shall say, From heaven: he will say: Why then did you not believe in him?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But if we say, of men: the whole people will stone us. For they are persuaded that John was a prophet.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And they answered that they knew not whence it was.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Jesus said to them: Neither do I tell you by what authority I do these things.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he began to speak to the people this parable: A certain man planted a vineyard and let it out to husbandmen: and he was abroad for a long time.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And at the season he sent a servant to the husbandmen, that they should give him of the fruit of the vineyard. Who, beating him, sent him away empty.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And again he sent another servant. But they beat him also and, treating him reproachfully, sent him away empty.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And again he sent the third: and they wounded him also and cast him out.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Then the lord of the vineyard said: What shall I do? I will send my beloved son. It may be, when they see him, they will reverence him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Whom, when the husbandmen saw, they thought within themselves, saying: This is the heir. Let us kill him, that the inheritance may be ours.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>So casting him out of the vineyard, they killed him. What therefore will the lord of the vineyard do to them?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He will come and will destroy these husbandmen and will give the vineyard to others. Which they hearing, said to him: God forbid.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But he looking on them, said: What is this then that is written, The stone, which the builders rejected, the same is become the head of the corner?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Whosoever shall fall upon that stone shall be bruised: and upon whomsoever it shall fall, it will grind him to powder.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the chief priests and the scribes sought to lay hands on him the same hour: but they feared the people, for they knew that he spoke this parable to them.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And being upon the watch, they sent spies, who should feign themselves just, that they might take hold of him in his words, that they might deliver him up to the authority and power of the governor.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And they asked him, saying: Master, we know that thou speakest and teachest rightly: and thou dost not respect any person, but teachest the way of God in truth.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Is it lawful for us to give tribute to Caesar, or no?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But he, considering their guile, said to them: Why tempt you me?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Shew me a penny. Whose image and inscription hath it? They answering, said to him: Caesar’s.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And he said to them: Render therefore to Caesar the things, that are Caesar’s: and to God the things that are God’s.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they could not reprehend his word before the people: and wondering at his answer, they held their peace.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And there came to him some of the Sadducees, who deny that there is any resurrection: and they asked him,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Saying: Master, Moses wrote unto us: If any man’s brother die, having a wife, and he leave no children, that his brother should take her to wife and raise up seed unto his brother.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>There were therefore seven brethren: and the first took a wife and died without children.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And the next took her to wife: and he also died childless.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And the third took her. And in like manner, all the seven: and they left no children and died.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Last of all the woman died also.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In the resurrection therefore, whose wife of them shall she be? For all the seven had her to wife.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And Jesus said to them: The children of this world marry and are given in marriage:</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But they that shall be accounted worthy of that world and of the resurrection from the dead shall neither be married nor take wives.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Neither can they die any more for they are equal to the angels and are the children of God, being the children of the resurrection.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Now that the dead rise again, Moses also shewed at the bush, when he called the Lord: The God of Abraham and the God of Isaac and the God of Jacob.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>For he is not the God of the dead, but of the living: for all live to him.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And some of the scribes answering, said to him: Master, thou hast said well.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And after that they durst not ask him any more questions.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>But he said to them: How say they that Christ is the son of David?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And David himself saith in the book of Psalms: The Lord said to my Lord, sit thou on my right hand,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Till I make thy enemies thy footstool.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>David then calleth him Lord. And how is he his son?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And in the hearing of all the people, he said to his disciples:</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Beware of the scribes, who desire to walk in long robes and love salutations in the market place and the first chairs in the synagogues and the chief rooms at feasts:</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Who devour the houses of widows, feigning long prayer. These shall receive greater damnation.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et factum est in una dierum, docente illo populum in templo, et evangelizante, convenerunt principes sacerdotum, et scribæ cum senioribus,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et aiunt dicentes ad illum : Dic nobis in qua potestate hæc facis ? aut quis est qui dedit tibi hanc potestatem ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Respondens autem Jesus, dixit ad illos : Interrogabo vos et ego unum verbum. Respondete mihi :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>baptismus Joannis de cælo erat, an ex hominibus ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>At illi cogitabant intra se, dicentes : Quia si dixerimus : De cælo, dicet : Quare ergo non credidistis illi ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si autem dixerimus : Ex hominibus, plebs universa lapidabit nos : certi sunt enim Joannem prophetam esse.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et responderunt se nescire unde esset.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et Jesus ait illis : Neque ego dico vobis in qua potestate hæc facio.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cœpit autem dicere ad plebem parabolam hanc : Homo plantavit vineam, et locavit eam colonis : et ipse peregre fuit multis temporibus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et in tempore misit ad cultores servum, ut de fructu vineæ darent illi. Qui cæsum dimiserunt eum inanem.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et addidit alterum servum mittere. Illi autem hunc quoque cædentes, et afficientes contumelia, dimiserunt inanem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et addidit tertium mittere : qui et illum vulnerantes ejecerunt.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixit autem dominus vineæ : Quid faciam ? Mittam filium meum dilectum : forsitan, cum hunc viderint, verebuntur.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quem cum vidissent coloni, cogitaverunt intra se, dicentes : Hic est hæres, occidamus illum, ut nostra fiat hæreditas.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ejectum illum extra vineam, occiderunt. Quid ergo faciet illis dominus vineæ ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>veniet, et perdet colonos istos, et dabit vineam aliis. Quo audito, dixerunt illi : Absit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ille autem aspiciens eos, ait : Quid est ergo hoc quod scriptum est : Lapidem quem reprobaverunt ædificantes, hic factus est in caput anguli ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Omnis qui ceciderit super illum lapidem, conquassabitur : super quem autem ceciderit, comminuet illum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et quærebant principes sacerdotum et scribæ mittere in illum manus illa hora, et timuerunt populum : cognoverunt enim quod ad ipsos dixerit similitudinem hanc.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et observantes miserunt insidiatores, qui se justos simularent, ut caperent eum in sermone, ut traderent illum principatui, et potestati præsidis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et interrogaverunt eum, dicentes : Magister, scimus quia recte dicis et doces : et non accipis personam, sed viam Dei in veritate doces.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Licet nobis tributum dare Cæsari, an non ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Considerans autem dolum illorum, dixit ad eos : Quid me tentatis ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>ostendite mihi denarium. Cujus habet imaginem et inscriptionem ? Respondentes dixerunt ei : Cæsaris.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ait illis : Reddite ergo quæ sunt Cæsaris, Cæsari : et quæ sunt Dei, Deo.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et non potuerunt verbum ejus reprehendere coram plebe : et mirati in responso ejus, tacuerunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Accesserunt autem quidam sadducæorum, qui negant esse resurrectionem, et interrogaverunt eum,</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>dicentes : Magister, Moyses scripsit nobis : Si frater alicujus mortuus fuerit habens uxorem, et hic sine liberis fuerit, ut accipiat eam frater ejus uxorem, et suscitet semen fratri suo.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Septem ergo fratres erant : et primus accepit uxorem, et mortuus est sine filiis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et sequens accepit illam, et ipse mortuus est sine filio.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et tertius accepit illam. Similiter et omnes septem, et non reliquerunt semen, et mortui sunt.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Novissime omnium mortua est et mulier.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>In resurrectione ergo, cujus eorum erit uxor ? siquidem septem habuerunt eam uxorem.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et ait illis Jesus : Filii hujus sæculi nubunt, et traduntur ad nuptias :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>illi vero qui digni habebuntur sæculo illo, et resurrectione ex mortuis, neque nubent, neque ducent uxores :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>neque enim ultra mori potuerunt : æquales enim angelis sunt, et filii sunt Dei, cum sint filii resurrectionis.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Quia vero resurgant mortui, et Moyses ostendit secus rubum, sicut dicit Dominum, Deum Abraham, et Deum Isaac, et Deum Jacob.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Deus autem non est mortuorum, sed vivorum : omnes enim vivunt ei.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Respondentes autem quidam scribarum, dixerunt ei : Magister, bene dixisti.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et amplius non audebant eum quidquam interrogare.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Dixit autem ad illos : Quomodo dicunt Christum filium esse David ?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>et ipse David dicit in libro Psalmorum : Dixit Dominus Domino meo : sede a dextris meis,</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>donec ponam inimicos tuos scabellum pedum tuorum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>David ergo Dominum illum vocat : et quomodo filius ejus est ?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Audiente autem omni populo, dixit discipulis suis :</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Attendite a scribis, qui volunt ambulare in stolis, et amant salutationes in foro, et primas cathedras in synagogis, et primos discubitus in conviviis,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>qui devorant domos viduarum, simulantes longam orationem : hi accipient damnationem majorem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/21/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 21</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->20<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Luke 19" $\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"LUK.20\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":20,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass that on one of the days, as he was teaching the people in the temple and preaching the gospel, the chief priests and the scribes, with the ancients, met together,\"},{\"verse\":2,\"text\":\"And spoke to him, saying: Tell us, by what authority dost thou these things? Or, who is he that hath given thee this authority?\"},{\"verse\":3,\"text\":\"And Jesus answering, said to them: I will also ask you one thing. Answer me:\"},{\"verse\":4,\"text\":\"The baptism of John, was it from heaven, or of men?\"},{\"verse\":5,\"text\":\"But they thought within themselves, saying: If we shall say, From heaven: he will say: Why then did you not believe in him?\"},{\"verse\":6,\"text\":\"But if we say, of men: the whole people will stone us. For they are persuaded that John was a prophet.\"},{\"verse\":7,\"text\":\"And they answered that they knew not whence it was.\"},{\"verse\":8,\"text\":\"And Jesus said to them: Neither do I tell you by what authority I do these things.\"},{\"verse\":9,\"text\":\"And he began to speak to the people this parable: A certain man planted a vineyard and let it out to husbandmen: and he was abroad for a long time.\"},{\"verse\":10,\"text\":\"And at the season he sent a servant to the husbandmen, that they should give him of the fruit of the vineyard. Who, beating him, sent him away empty.\"},{\"verse\":11,\"text\":\"And again he sent another servant. But they beat him also and, treating him reproachfully, sent him away empty.\"},{\"verse\":12,\"text\":\"And again he sent the third: and they wounded him also and cast him out.\"},{\"verse\":13,\"text\":\"Then the lord of the vineyard said: What shall I do? I will send my beloved son. It may be, when they see him, they will reverence him.\"},{\"verse\":14,\"text\":\"Whom, when the husbandmen saw, they thought within themselves, saying: This is the heir. Let us kill him, that the inheritance may be ours.\"},{\"verse\":15,\"text\":\"So casting him out of the vineyard, they killed him. What therefore will the lord of the vineyard do to them?\"},{\"verse\":16,\"text\":\"He will come and will destroy these husbandmen and will give the vineyard to others. Which they hearing, said to him: God forbid.\"},{\"verse\":17,\"text\":\"But he looking on them, said: What is this then that is written, The stone, which the builders rejected, the same is become the head of the corner?\"},{\"verse\":18,\"text\":\"Whosoever shall fall upon that stone shall be bruised: and upon whomsoever it shall fall, it will grind him to powder.\"},{\"verse\":19,\"text\":\"And the chief priests and the scribes sought to lay hands on him the same hour: but they feared the people, for they knew that he spoke this parable to them.\"},{\"verse\":20,\"text\":\"And being upon the watch, they sent spies, who should feign themselves just, that they might take hold of him in his words, that they might deliver him up to the authority and power of the governor.\"},{\"verse\":21,\"text\":\"And they asked him, saying: Master, we know that thou speakest and teachest rightly: and thou dost not respect any person, but teachest the way of God in truth.\"},{\"verse\":22,\"text\":\"Is it lawful for us to give tribute to Caesar, or no?\"},{\"verse\":23,\"text\":\"But he, considering their guile, said to them: Why tempt you me?\"},{\"verse\":24,\"text\":\"Shew me a penny. Whose image and inscription hath it? They answering, said to him: Caesar’s.\"},{\"verse\":25,\"text\":\"And he said to them: Render therefore to Caesar the things, that are Caesar’s: and to God the things that are God’s.\"},{\"verse\":26,\"text\":\"And they could not reprehend his word before the people: and wondering at his answer, they held their peace.\"},{\"verse\":27,\"text\":\"And there came to him some of the Sadducees, who deny that there is any resurrection: and they asked him,\"},{\"verse\":28,\"text\":\"Saying: Master, Moses wrote unto us: If any man’s brother die, having a wife, and he leave no children, that his brother should take her to wife and raise up seed unto his brother.\"},{\"verse\":29,\"text\":\"There were therefore seven brethren: and the first took a wife and died without children.\"},{\"verse\":30,\"text\":\"And the next took her to wife: and he also died childless.\"},{\"verse\":31,\"text\":\"And the third took her. And in like manner, all the seven: and they left no children and died.\"},{\"verse\":32,\"text\":\"Last of all the woman died also.\"},{\"verse\":33,\"text\":\"In the resurrection therefore, whose wife of them shall she be? For all the seven had her to wife.\"},{\"verse\":34,\"text\":\"And Jesus said to them: The children of this world marry and are given in marriage:\"},{\"verse\":35,\"text\":\"But they that shall be accounted worthy of that world and of the resurrection from the dead shall neither be married nor take wives.\"},{\"verse\":36,\"text\":\"Neither can they die any more for they are equal to the angels and are the children of God, being the children of the resurrection.\"},{\"verse\":37,\"text\":\"Now that the dead rise again, Moses also shewed at the bush, when he called the Lord: The God of Abraham and the God of Isaac and the God of Jacob.\"},{\"verse\":38,\"text\":\"For he is not the God of the dead, but of the living: for all live to him.\"},{\"verse\":39,\"text\":\"And some of the scribes answering, said to him: Master, thou hast said well.\"},{\"verse\":40,\"text\":\"And after that they durst not ask him any more questions.\"},{\"verse\":41,\"text\":\"But he said to them: How say they that Christ is the son of David?\"},{\"verse\":42,\"text\":\"And David himself saith in the book of Psalms: The Lord said to my Lord, sit thou on my right hand,\"},{\"verse\":43,\"text\":\"Till I make thy enemies thy footstool.\"},{\"verse\":44,\"text\":\"David then calleth him Lord. And how is he his son?\"},{\"verse\":45,\"text\":\"And in the hearing of all the people, he said to his disciples:\"},{\"verse\":46,\"text\":\"Beware of the scribes, who desire to walk in long robes and love salutations in the market place and the first chairs in the synagogues and the chief rooms at feasts:\"},{\"verse\":47,\"text\":\"Who devour the houses of widows, feigning long prayer. These shall receive greater damnation.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et factum est in una dierum, docente illo populum in templo, et evangelizante, convenerunt principes sacerdotum, et scribæ cum senioribus,\"},{\"verse\":2,\"text\":\"et aiunt dicentes ad illum : Dic nobis in qua potestate hæc facis ? aut quis est qui dedit tibi hanc potestatem ?\"},{\"verse\":3,\"text\":\"Respondens autem Jesus, dixit ad illos : Interrogabo vos et ego unum verbum. Respondete mihi :\"},{\"verse\":4,\"text\":\"baptismus Joannis de cælo erat, an ex hominibus ?\"},{\"verse\":5,\"text\":\"At illi cogitabant intra se, dicentes : Quia si dixerimus : De cælo, dicet : Quare ergo non credidistis illi ?\"},{\"verse\":6,\"text\":\"Si autem dixerimus : Ex hominibus, plebs universa lapidabit nos : certi sunt enim Joannem prophetam esse.\"},{\"verse\":7,\"text\":\"Et responderunt se nescire unde esset.\"},{\"verse\":8,\"text\":\"Et Jesus ait illis : Neque ego dico vobis in qua potestate hæc facio.\"},{\"verse\":9,\"text\":\"Cœpit autem dicere ad plebem parabolam hanc : Homo plantavit vineam, et locavit eam colonis : et ipse peregre fuit multis temporibus.\"},{\"verse\":10,\"text\":\"Et in tempore misit ad cultores servum, ut de fructu vineæ darent illi. Qui cæsum dimiserunt eum inanem.\"},{\"verse\":11,\"text\":\"Et addidit alterum servum mittere. Illi autem hunc quoque cædentes, et afficientes contumelia, dimiserunt inanem.\"},{\"verse\":12,\"text\":\"Et addidit tertium mittere : qui et illum vulnerantes ejecerunt.\"},{\"verse\":13,\"text\":\"Dixit autem dominus vineæ : Quid faciam ? Mittam filium meum dilectum : forsitan, cum hunc viderint, verebuntur.\"},{\"verse\":14,\"text\":\"Quem cum vidissent coloni, cogitaverunt intra se, dicentes : Hic est hæres, occidamus illum, ut nostra fiat hæreditas.\"},{\"verse\":15,\"text\":\"Et ejectum illum extra vineam, occiderunt. Quid ergo faciet illis dominus vineæ ?\"},{\"verse\":16,\"text\":\"veniet, et perdet colonos istos, et dabit vineam aliis. Quo audito, dixerunt illi : Absit.\"},{\"verse\":17,\"text\":\"Ille autem aspiciens eos, ait : Quid est ergo hoc quod scriptum est : Lapidem quem reprobaverunt ædificantes, hic factus est in caput anguli ?\"},{\"verse\":18,\"text\":\"Omnis qui ceciderit super illum lapidem, conquassabitur : super quem autem ceciderit, comminuet illum.\"},{\"verse\":19,\"text\":\"Et quærebant principes sacerdotum et scribæ mittere in illum manus illa hora, et timuerunt populum : cognoverunt enim quod ad ipsos dixerit similitudinem hanc.\"},{\"verse\":20,\"text\":\"Et observantes miserunt insidiatores, qui se justos simularent, ut caperent eum in sermone, ut traderent illum principatui, et potestati præsidis.\"},{\"verse\":21,\"text\":\"Et interrogaverunt eum, dicentes : Magister, scimus quia recte dicis et doces : et non accipis personam, sed viam Dei in veritate doces.\"},{\"verse\":22,\"text\":\"Licet nobis tributum dare Cæsari, an non ?\"},{\"verse\":23,\"text\":\"Considerans autem dolum illorum, dixit ad eos : Quid me tentatis ?\"},{\"verse\":24,\"text\":\"ostendite mihi denarium. Cujus habet imaginem et inscriptionem ? Respondentes dixerunt ei : Cæsaris.\"},{\"verse\":25,\"text\":\"Et ait illis : Reddite ergo quæ sunt Cæsaris, Cæsari : et quæ sunt Dei, Deo.\"},{\"verse\":26,\"text\":\"Et non potuerunt verbum ejus reprehendere coram plebe : et mirati in responso ejus, tacuerunt.\"},{\"verse\":27,\"text\":\"Accesserunt autem quidam sadducæorum, qui negant esse resurrectionem, et interrogaverunt eum,\"},{\"verse\":28,\"text\":\"dicentes : Magister, Moyses scripsit nobis : Si frater alicujus mortuus fuerit habens uxorem, et hic sine liberis fuerit, ut accipiat eam frater ejus uxorem, et suscitet semen fratri suo.\"},{\"verse\":29,\"text\":\"Septem ergo fratres erant : et primus accepit uxorem, et mortuus est sine filiis.\"},{\"verse\":30,\"text\":\"Et sequens accepit illam, et ipse mortuus est sine filio.\"},{\"verse\":31,\"text\":\"Et tertius accepit illam. Similiter et omnes septem, et non reliquerunt semen, et mortui sunt.\"},{\"verse\":32,\"text\":\"Novissime omnium mortua est et mulier.\"},{\"verse\":33,\"text\":\"In resurrectione ergo, cujus eorum erit uxor ? siquidem septem habuerunt eam uxorem.\"},{\"verse\":34,\"text\":\"Et ait illis Jesus : Filii hujus sæculi nubunt, et traduntur ad nuptias :\"},{\"verse\":35,\"text\":\"illi vero qui digni habebuntur sæculo illo, et resurrectione ex mortuis, neque nubent, neque ducent uxores :\"},{\"verse\":36,\"text\":\"neque enim ultra mori potuerunt : æquales enim angelis sunt, et filii sunt Dei, cum sint filii resurrectionis.\"},{\"verse\":37,\"text\":\"Quia vero resurgant mortui, et Moyses ostendit secus rubum, sicut dicit Dominum, Deum Abraham, et Deum Isaac, et Deum Jacob.\"},{\"verse\":38,\"text\":\"Deus autem non est mortuorum, sed vivorum : omnes enim vivunt ei.\"},{\"verse\":39,\"text\":\"Respondentes autem quidam scribarum, dixerunt ei : Magister, bene dixisti.\"},{\"verse\":40,\"text\":\"Et amplius non audebant eum quidquam interrogare.\"},{\"verse\":41,\"text\":\"Dixit autem ad illos : Quomodo dicunt Christum filium esse David ?\"},{\"verse\":42,\"text\":\"et ipse David dicit in libro Psalmorum : Dixit Dominus Domino meo : sede a dextris meis,\"},{\"verse\":43,\"text\":\"donec ponam inimicos tuos scabellum pedum tuorum.\"},{\"verse\":44,\"text\":\"David ergo Dominum illum vocat : et quomodo filius ejus est ?\"},{\"verse\":45,\"text\":\"Audiente autem omni populo, dixit discipulis suis :\"},{\"verse\":46,\"text\":\"Attendite a scribis, qui volunt ambulare in stolis, et amant salutationes in foro, et primas cathedras in synagogis, et primos discubitus in conviviis,\"},{\"verse\":47,\"text\":\"qui devorant domos viduarum, simulantes longam orationem : hi accipient damnationem majorem.\"}],\"summary\":\"The parable of the husbandmen. Of paying tribute to Caesar and of the resurrection of the dead.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":19,\"label\":\"Luke 19\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":21,\"label\":\"Luke 21\"}}]]\n"])</script></body></html>
