20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">5</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The miraculous draught of fishes. The cure of the leper and of the paralytic. The call of Matthew.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And it came to pass, that when the multitudes pressed upon him to hear the word of God, he stood by the lake of Genesareth,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And saw two ships standing by the lake: but the fishermen were gone out of them and were washing their nets.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And going into one of the ships that was Simon’s, he desired him to draw back a little from the land. And sitting, he taught the multitudes out of the ship.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Now when he had ceased to speak, he said to Simon: Launch out into the deep and let down your nets for a draught.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Simon answering said to him: Master, we have laboured all the night and have taken nothing: but at thy word I will let down the net.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And when they had done this, they enclosed a very great multitude of fishes: and their net broke.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And they beckoned to their partners that were in the other ship, that they should come and help them. And they came and filled both the ships, so that they were almost sinking.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Which when Simon Peter saw, he fell down at Jesus’ knees, saying: Depart from me, for I am a sinful man, O Lord.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For he was wholly astonished, and all that were with him, at the draught of the fishes which they had taken.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And so were also James and John, the sons of Zebedee, who were Simon’s partners. And Jesus saith to Simon: Fear not: from henceforth thou shalt catch men.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And having brought their ships to land, leaving all things, they followed him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And it came to pass, when he was in a certain city, behold a man full of leprosy who, seeing Jesus and falling on his face, besought him saying: Lord, if thou wilt, thou canst make me clean.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And stretching forth his hand, he touched him, saying: I will. Be thou cleansed. And immediately the leprosy departed from him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he charged him that he should tell no man, but: Go, shew thyself to the priest and offer for thy cleansing according as Moses commanded, for a testimony to them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But the fame of him went abroad the more: and great multitudes came together to hear and to be healed by him of their infirmities.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And he retired into the desert; and prayed.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And it came to pass on a certain day, as he sat teaching, that there were also Pharisees and doctors of the law sitting by, that were come out of every town of Galilee and Judea and Jerusalem: and the power of the Lord was to heal them.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And behold, men brought in a bed a man who had the palsy: and they sought means to bring him in and to lay him before him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And when they could not find by what way they might bring him in, because of the multitude, they went up upon the roof and let him down through the tiles with his bed into the midst before Jesus.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Whose faith when he saw, he said: Man, thy sins are forgiven thee.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the scribes and Pharisees began to think, saying: Who is this who speaketh blasphemies? Who can forgive sins, but God alone?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And when Jesus knew their thoughts, answering he said to them: What is it you think in your hearts?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Which is easier to say: Thy sins are forgiven thee; or to say: Arise and walk?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But that you may know that the Son of man hath the power on earth to forgive sins (he saith to the sick of the palsy), I say to thee, Arise, take up thy bed and go into thy house.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And immediately rising up before them, he took up the bed on which he lay: and he went away to his own house, glorifying God.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And all were astonished: and they glorified God. And they were filled with fear, saying: We have seen wonderful things to-day.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And after these things, he went forth and saw a publican named Levi, sitting at the receipt of custom: and he said to him: Follow me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And leaving all things, he rose up and followed him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And Levi made him a great feast in his own house: And there was a great company of publicans and of others that were at table with them.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But the Pharisees and scribes murmured, saying to his disciples: Why do you eat and drink with publicans and sinners?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And Jesus answering, said to them: They that are whole need not the physician: but they that are sick.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>I came not to call the just, but sinners to penance.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they said to him: Why do the disciples of John fast often and make prayers, and the disciples of the Pharisees in like manner; but thine eat and drink?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>To whom he said: Can you make the children of the bridegroom fast whilst the bridegroom is with them?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>But the days will come when the bridegroom shall be taken away from them: then shall they fast in those days.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he spoke also a similitude to them: That no man putteth a piece from a new garment upon an old garment: otherwise he both rendeth the new, and the piece taken from the new agreeth not with the old.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And no man putteth new wine into old bottles: otherwise the new wine will break the bottles; and it will be spilled and the bottles will be lost.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But new wine must be put into new bottles: and both are preserved.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And no man drinking old hath presently a mind to new: for he saith: The old is better.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Factum est autem, cum turbæ irruerunt in eum ut audirent verbum Dei, et ipse stabat secus stagnum Genesareth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et vidit duas naves stantes secus stagnum : piscatores autem descenderant, et lavabant retia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ascendens autem in unam navim, quæ erat Simonis, rogavit eum a terra reducere pusillum. Et sedens docebat de navicula turbas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ut cessavit autem loqui, dixit ad Simonem : Duc in altum, et laxate retia vestra in capturam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et respondens Simon, dixit illi : Præceptor, per totam noctem laborantes nihil cepimus : in verbo autem tuo laxabo rete.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et cum hoc fecissent, concluserunt piscium multitudinem copiosam : rumpebatur autem rete eorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et annuerunt sociis, qui erant in alia navi, ut venirent, et adjuvarent eos. Et venerunt, et impleverunt ambas naviculas, ita ut pene mergerentur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quod cum videret Simon Petrus, procidit ad genua Jesu, dicens : Exi a me, quia homo peccator sum, Domine.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Stupor enim circumdederat eum, et omnes qui cum illo erant, in captura piscium, quam ceperant :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>similiter autem Jacobum et Joannem, filios Zebedæi, qui erant socii Simonis. Et ait ad Simonem Jesus : Noli timere : ex hoc jam homines eris capiens.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et subductis ad terram navibus, relictis omnibus, secuti sunt eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et factum est, cum esset in una civitatum, et ecce vir plenus lepra, et videns Jesum, et procidens in faciem, rogavit eum, dicens : Domine, si vis, potes me mundare.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et extendens manum, tetigit eum dicens : Volo : mundare. Et confestim lepra discessit ab illo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et ipse præcepit illi ut nemini diceret : sed, Vade, ostende te sacerdoti, et offer pro emundatione tua, sicut præcepit Moyses, in testimonium illis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Perambulabat autem magis sermo de illo : et conveniebant turbæ multæ ut audirent, et curarentur ab infirmitatibus suis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Ipse autem secedebat in desertum, et orabat.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et factum est in una dierum, et ipse sedebat docens. Et erant pharisæi sedentes, et legis doctores, qui venerant ex omni castello Galilææ, et Judææ, et Jerusalem : et virtus Domini erat ad sanandum eos.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et ecce viri portantes in lecto hominem, qui erat paralyticus : et quærebant eum inferre, et ponere ante eum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et non invenientes qua parte illum inferrent præ turba, ascenderunt supra tectum, et per tegulas summiserunt eum cum lecto in medium ante Jesum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quorum fidem ut vidit, dixit : Homo, remittuntur tibi peccata tua.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et cœperunt cogitare scribæ et pharisæi, dicentes : Quis est hic, qui loquitur blasphemias ? quis potest dimittere peccata, nisi solus Deus ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ut cognovit autem Jesus cogitationes eorum, respondens, dixit ad illos : Quid cogitatis in cordibus vestris ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quid est facilius dicere : Dimittuntur tibi peccata : an dicere : Surge, et ambula ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ut autem sciatis quia Filius hominis habet potestatem in terra dimittendi peccata, (ait paralytico) tibi dico, surge, tolle lectum tuum, et vade in domum tuam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et confestim consurgens coram illis, tulit lectum in quo jacebat : et abiit in domum suam, magnificans Deum.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et stupor apprehendit omnes, et magnificabant Deum. Et repleti sunt timore, dicentes : Quia vidimus mirabilia hodie.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et post hæc exiit, et vidit publicanum nomine Levi, sedentem ad telonium, et ait illi : Sequere me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et relictis omnibus, surgens secutus est eum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et fecit ei convivium magnum Levi in domo sua : et erat turba multa publicanorum, et aliorum qui cum illis erant discumbentes.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et murmurabant pharisæi et scribæ eorum, dicentes ad discipulos ejus : Quare cum publicanis et peccatoribus manducatis et bibitis ?</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et respondens Jesus, dixit ad illos : Non egent qui sani sunt medico, sed qui male habent.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Non veni vocare justos, sed peccatores ad pœnitentiam.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>At illi dixerunt ad eum : Quare discipuli Joannis jejunant frequenter, et obsecrationes faciunt, similiter et pharisæorum : tui autem edunt et bibunt ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quibus ipse ait : Numquid potestis filios sponsi, dum cum illis est sponsus, facere jejunare ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Venient autem dies, cum ablatus fuerit ab illis sponsus : tunc jejunabunt in illis diebus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Dicebat autem et similitudinem ad illos : Quia nemo commissuram a novo vestimento immittit in vestimentum vetus : alioquin et novum rumpit, et veteri non convenit commissura a novo.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et nemo mittit vinum novum in utres veteres : alioquin rumpet vinum novum utres, et ipsum effundetur, et utres peribunt :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>sed vinum novum in utres novos mittendum est, et utraque conservantur.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et nemo bibens vetus, statim vult novum : dicit enim : Vetus melius est.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Luke 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Luke 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->24<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Luke 4" e/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LUK.5\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":5,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"And it came to pass, that when the multitudes pressed upon him to hear the word of God, he stood by the lake of Genesareth,\"},{\"verse\":2,\"text\":\"And saw two ships standing by the lake: but the fishermen were gone out of them and were washing their nets.\"},{\"verse\":3,\"text\":\"And going into one of the ships that was Simon’s, he desired him to draw back a little from the land. And sitting, he taught the multitudes out of the ship.\"},{\"verse\":4,\"text\":\"Now when he had ceased to speak, he said to Simon: Launch out into the deep and let down your nets for a draught.\"},{\"verse\":5,\"text\":\"And Simon answering said to him: Master, we have laboured all the night and have taken nothing: but at thy word I will let down the net.\"},{\"verse\":6,\"text\":\"And when they had done this, they enclosed a very great multitude of fishes: and their net broke.\"},{\"verse\":7,\"text\":\"And they beckoned to their partners that were in the other ship, that they should come and help them. And they came and filled both the ships, so that they were almost sinking.\"},{\"verse\":8,\"text\":\"Which when Simon Peter saw, he fell down at Jesus’ knees, saying: Depart from me, for I am a sinful man, O Lord.\"},{\"verse\":9,\"text\":\"For he was wholly astonished, and all that were with him, at the draught of the fishes which they had taken.\"},{\"verse\":10,\"text\":\"And so were also James and John, the sons of Zebedee, who were Simon’s partners. And Jesus saith to Simon: Fear not: from henceforth thou shalt catch men.\"},{\"verse\":11,\"text\":\"And having brought their ships to land, leaving all things, they followed him.\"},{\"verse\":12,\"text\":\"And it came to pass, when he was in a certain city, behold a man full of leprosy who, seeing Jesus and falling on his face, besought him saying: Lord, if thou wilt, thou canst make me clean.\"},{\"verse\":13,\"text\":\"And stretching forth his hand, he touched him, saying: I will. Be thou cleansed. And immediately the leprosy departed from him.\"},{\"verse\":14,\"text\":\"And he charged him that he should tell no man, but: Go, shew thyself to the priest and offer for thy cleansing according as Moses commanded, for a testimony to them.\"},{\"verse\":15,\"text\":\"But the fame of him went abroad the more: and great multitudes came together to hear and to be healed by him of their infirmities.\"},{\"verse\":16,\"text\":\"And he retired into the desert; and prayed.\"},{\"verse\":17,\"text\":\"And it came to pass on a certain day, as he sat teaching, that there were also Pharisees and doctors of the law sitting by, that were come out of every town of Galilee and Judea and Jerusalem: and the power of the Lord was to heal them.\"},{\"verse\":18,\"text\":\"And behold, men brought in a bed a man who had the palsy: and they sought means to bring him in and to lay him before him.\"},{\"verse\":19,\"text\":\"And when they could not find by what way they might bring him in, because of the multitude, they went up upon the roof and let him down through the tiles with his bed into the midst before Jesus.\"},{\"verse\":20,\"text\":\"Whose faith when he saw, he said: Man, thy sins are forgiven thee.\"},{\"verse\":21,\"text\":\"And the scribes and Pharisees began to think, saying: Who is this who speaketh blasphemies? Who can forgive sins, but God alone?\"},{\"verse\":22,\"text\":\"And when Jesus knew their thoughts, answering he said to them: What is it you think in your hearts?\"},{\"verse\":23,\"text\":\"Which is easier to say: Thy sins are forgiven thee; or to say: Arise and walk?\"},{\"verse\":24,\"text\":\"But that you may know that the Son of man hath the power on earth to forgive sins (he saith to the sick of the palsy), I say to thee, Arise, take up thy bed and go into thy house.\"},{\"verse\":25,\"text\":\"And immediately rising up before them, he took up the bed on which he lay: and he went away to his own house, glorifying God.\"},{\"verse\":26,\"text\":\"And all were astonished: and they glorified God. And they were filled with fear, saying: We have seen wonderful things to-day.\"},{\"verse\":27,\"text\":\"And after these things, he went forth and saw a publican named Levi, sitting at the receipt of custom: and he said to him: Follow me.\"},{\"verse\":28,\"text\":\"And leaving all things, he rose up and followed him.\"},{\"verse\":29,\"text\":\"And Levi made him a great feast in his own house: And there was a great company of publicans and of others that were at table with them.\"},{\"verse\":30,\"text\":\"But the Pharisees and scribes murmured, saying to his disciples: Why do you eat and drink with publicans and sinners?\"},{\"verse\":31,\"text\":\"And Jesus answering, said to them: They that are whole need not the physician: but they that are sick.\"},{\"verse\":32,\"text\":\"I came not to call the just, but sinners to penance.\"},{\"verse\":33,\"text\":\"And they said to him: Why do the disciples of John fast often and make prayers, and the disciples of the Pharisees in like manner; but thine eat and drink?\"},{\"verse\":34,\"text\":\"To whom he said: Can you make the children of the bridegroom fast whilst the bridegroom is with them?\"},{\"verse\":35,\"text\":\"But the days will come when the bridegroom shall be taken away from them: then shall they fast in those days.\"},{\"verse\":36,\"text\":\"And he spoke also a similitude to them: That no man putteth a piece from a new garment upon an old garment: otherwise he both rendeth the new, and the piece taken from the new agreeth not with the old.\"},{\"verse\":37,\"text\":\"And no man putteth new wine into old bottles: otherwise the new wine will break the bottles; and it will be spilled and the bottles will be lost.\"},{\"verse\":38,\"text\":\"But new wine must be put into new bottles: and both are preserved.\"},{\"verse\":39,\"text\":\"And no man drinking old hath presently a mind to new: for he saith: The old is better.\"}],\"vul\":[{\"verse\":1,\"text\":\"Factum est autem, cum turbæ irruerunt in eum ut audirent verbum Dei, et ipse stabat secus stagnum Genesareth.\"},{\"verse\":2,\"text\":\"Et vidit duas naves stantes secus stagnum : piscatores autem descenderant, et lavabant retia.\"},{\"verse\":3,\"text\":\"Ascendens autem in unam navim, quæ erat Simonis, rogavit eum a terra reducere pusillum. Et sedens docebat de navicula turbas.\"},{\"verse\":4,\"text\":\"Ut cessavit autem loqui, dixit ad Simonem : Duc in altum, et laxate retia vestra in capturam.\"},{\"verse\":5,\"text\":\"Et respondens Simon, dixit illi : Præceptor, per totam noctem laborantes nihil cepimus : in verbo autem tuo laxabo rete.\"},{\"verse\":6,\"text\":\"Et cum hoc fecissent, concluserunt piscium multitudinem copiosam : rumpebatur autem rete eorum.\"},{\"verse\":7,\"text\":\"Et annuerunt sociis, qui erant in alia navi, ut venirent, et adjuvarent eos. Et venerunt, et impleverunt ambas naviculas, ita ut pene mergerentur.\"},{\"verse\":8,\"text\":\"Quod cum videret Simon Petrus, procidit ad genua Jesu, dicens : Exi a me, quia homo peccator sum, Domine.\"},{\"verse\":9,\"text\":\"Stupor enim circumdederat eum, et omnes qui cum illo erant, in captura piscium, quam ceperant :\"},{\"verse\":10,\"text\":\"similiter autem Jacobum et Joannem, filios Zebedæi, qui erant socii Simonis. Et ait ad Simonem Jesus : Noli timere : ex hoc jam homines eris capiens.\"},{\"verse\":11,\"text\":\"Et subductis ad terram navibus, relictis omnibus, secuti sunt eum.\"},{\"verse\":12,\"text\":\"Et factum est, cum esset in una civitatum, et ecce vir plenus lepra, et videns Jesum, et procidens in faciem, rogavit eum, dicens : Domine, si vis, potes me mundare.\"},{\"verse\":13,\"text\":\"Et extendens manum, tetigit eum dicens : Volo : mundare. Et confestim lepra discessit ab illo.\"},{\"verse\":14,\"text\":\"Et ipse præcepit illi ut nemini diceret : sed, Vade, ostende te sacerdoti, et offer pro emundatione tua, sicut præcepit Moyses, in testimonium illis.\"},{\"verse\":15,\"text\":\"Perambulabat autem magis sermo de illo : et conveniebant turbæ multæ ut audirent, et curarentur ab infirmitatibus suis.\"},{\"verse\":16,\"text\":\"Ipse autem secedebat in desertum, et orabat.\"},{\"verse\":17,\"text\":\"Et factum est in una dierum, et ipse sedebat docens. Et erant pharisæi sedentes, et legis doctores, qui venerant ex omni castello Galilææ, et Judææ, et Jerusalem : et virtus Domini erat ad sanandum eos.\"},{\"verse\":18,\"text\":\"Et ecce viri portantes in lecto hominem, qui erat paralyticus : et quærebant eum inferre, et ponere ante eum.\"},{\"verse\":19,\"text\":\"Et non invenientes qua parte illum inferrent præ turba, ascenderunt supra tectum, et per tegulas summiserunt eum cum lecto in medium ante Jesum.\"},{\"verse\":20,\"text\":\"Quorum fidem ut vidit, dixit : Homo, remittuntur tibi peccata tua.\"},{\"verse\":21,\"text\":\"Et cœperunt cogitare scribæ et pharisæi, dicentes : Quis est hic, qui loquitur blasphemias ? quis potest dimittere peccata, nisi solus Deus ?\"},{\"verse\":22,\"text\":\"Ut cognovit autem Jesus cogitationes eorum, respondens, dixit ad illos : Quid cogitatis in cordibus vestris ?\"},{\"verse\":23,\"text\":\"Quid est facilius dicere : Dimittuntur tibi peccata : an dicere : Surge, et ambula ?\"},{\"verse\":24,\"text\":\"Ut autem sciatis quia Filius hominis habet potestatem in terra dimittendi peccata, (ait paralytico) tibi dico, surge, tolle lectum tuum, et vade in domum tuam.\"},{\"verse\":25,\"text\":\"Et confestim consurgens coram illis, tulit lectum in quo jacebat : et abiit in domum suam, magnificans Deum.\"},{\"verse\":26,\"text\":\"Et stupor apprehendit omnes, et magnificabant Deum. Et repleti sunt timore, dicentes : Quia vidimus mirabilia hodie.\"},{\"verse\":27,\"text\":\"Et post hæc exiit, et vidit publicanum nomine Levi, sedentem ad telonium, et ait illi : Sequere me.\"},{\"verse\":28,\"text\":\"Et relictis omnibus, surgens secutus est eum.\"},{\"verse\":29,\"text\":\"Et fecit ei convivium magnum Levi in domo sua : et erat turba multa publicanorum, et aliorum qui cum illis erant discumbentes.\"},{\"verse\":30,\"text\":\"Et murmurabant pharisæi et scribæ eorum, dicentes ad discipulos ejus : Quare cum publicanis et peccatoribus manducatis et bibitis ?\"},{\"verse\":31,\"text\":\"Et respondens Jesus, dixit ad illos : Non egent qui sani sunt medico, sed qui male habent.\"},{\"verse\":32,\"text\":\"Non veni vocare justos, sed peccatores ad pœnitentiam.\"},{\"verse\":33,\"text\":\"At illi dixerunt ad eum : Quare discipuli Joannis jejunant frequenter, et obsecrationes faciunt, similiter et pharisæorum : tui autem edunt et bibunt ?\"},{\"verse\":34,\"text\":\"Quibus ipse ait : Numquid potestis filios sponsi, dum cum illis est sponsus, facere jejunare ?\"},{\"verse\":35,\"text\":\"Venient autem dies, cum ablatus fuerit ab illis sponsus : tunc jejunabunt in illis diebus.\"},{\"verse\":36,\"text\":\"Dicebat autem et similitudinem ad illos : Quia nemo commissuram a novo vestimento immittit in vestimentum vetus : alioquin et novum rumpit, et veteri non convenit commissura a novo.\"},{\"verse\":37,\"text\":\"Et nemo mittit vinum novum in utres veteres : alioquin rumpet vinum novum utres, et ipsum effundetur, et utres peribunt :\"},{\"verse\":38,\"text\":\"sed vinum novum in utres novos mittendum est, et utraque conservantur.\"},{\"verse\":39,\"text\":\"Et nemo bibens vetus, statim vult novum : dicit enim : Vetus melius est.\"}],\"summary\":\"The miraculous draught of fishes. The cure of the leper and of the paralytic. The call of Matthew.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":4,\"label\":\"Luke 4\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":6,\"label\":\"Luke 6\"}}]]\n"])</script></body></html>
