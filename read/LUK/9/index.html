20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">9</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ sends forth his apostles, feeds five thousand with five loaves, is transfigured and casts out a devil.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then calling together the twelve apostles, he gave them power and authority over all devils and to cure diseases.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he sent them to preach the kingdom of God and to heal the sick.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And he said to them: Take nothing for your journey, neither staff, nor scrip, nor bread, nor money; neither have two coats.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And whatsoever house you shall enter into, abide there and depart not from thence.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And whosoever will not receive you, when ye go out of that city, shake off even the dust of your feet, for a testimony against them.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And going out, they went about through the towns, preaching the gospel and healing every where.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now Herod, the tetrarch, heard of all things that were done by him. And he was in a doubt, because it was said</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>By some that John was risen from the dead: but by other some, that Elias had appeared: and by others, that one of the old prophets was risen again.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And Herod said: John I have beheaded. But who is this of whom I hear such things? And he sought to see him.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the apostles, when they were returned, told him all they had done. And taking them, he went aside into a desert place, apart, which belongeth to Bethsaida.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Which when the people knew, they followed him: and he received them and spoke to them of the kingdom of God and healed them who had need of healing.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Now the day began to decline. And the twelve came and said to him: Send away the multitude, that, going into the towns and villages round about, they may lodge and get victuals; for we are here in a desert place.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But he said to them: Give you them to eat. And they said: We have no more than five loaves and two fishes; unless perhaps, we should go and buy food for all this multitude.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now there were about five thousand men. And he said to his disciples: Make them sit down by fifties in a company.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they did so and made them all sit down.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And taking the five loaves and the two fishes, he looked up to heaven and blessed them: and he broke and distributed to his disciples, to set before the multitude.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they did all eat and were filled. And there were taken up of fragments that remained to them, twelve baskets.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And it came to pass, as he was alone praying, his disciples also were with him: and he asked them, saying: Whom do the people say that I am?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But they answered and said: John the Baptist; but some say Elias: and others say that one of the former prophets is risen again.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And he said to them: But whom do you say that I am? Simon Peter answering, said: The Christ of God.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But he strictly charging them, commanded they should tell this to no man.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Saying: The Son of man must suffer many things and be rejected by the ancients and chief priests and scribes and be killed and the third day rise again.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And he said to all: If any man will come after me, let him deny himself and take up his cross daily and follow me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For whosoever will save his life shall lose it: for he that shall lose his life for my sake shall save it.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For what is a man advantaged, if he gain the whole world and lose himself and cast away himself?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For he that shall be ashamed of me and of my words, of him the Son of man shall be ashamed, when he shall come in his majesty and that of his Father and of the holy angels.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But I tell you of a truth: There are some standing here that shall not taste death till they see the kingdom of God.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And it came to pass, about eight days after these words, that he took Peter and James and John and went up into a mountain to pray.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And whilst he prayed, the shape of his countenance was altered and his raiment became white and glittering.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And behold two men were talking with him. And they were Moses and Elias,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Appearing in majesty. And they spoke of his decease that he should accomplish in Jerusalem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But Peter and they that were with him were heavy with sleep. And waking, they saw his glory and the two men that stood with him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And it came to pass that, as they were departing from him, Peter saith to Jesus: Master, it is good for us to be here: and let us make three tabernacles, one for thee, and one for Moses; and one for Elias: not knowing what he said.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And as he spoke these things, there came a cloud and overshadowed them. And they were afraid when they entered into the cloud.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And a voice came out of the cloud; saying: This is my beloved son. Hear him.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And whilst the voice was uttered Jesus was found alone. And they held their peace and told no man in those days any of these things which they had seen.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And it came to pass the day following, when they came down from the mountain, there met him a great multitude.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And behold a man among the crowd cried out, saying: Master, I beseech thee, look upon my son, because he is my only one.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And lo, a spirit seizeth him, and he suddenly crieth out, and he throweth him down and teareth him, so that he foameth; and bruising him, he hardly departeth from him.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And I desired thy disciples to cast him out: and they could not.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And Jesus, answering, said: O faithless and perverse generation, how long shall I be with you and suffer you? Bring hither thy son.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And as he was coming to him, the devil threw him down and tore him.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And Jesus rebuked the unclean spirit and cured the boy and restored him to his father.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And all were astonished at the mighty power of God. But while all wondered at all the things he did, he said to his disciples: Lay you up in your hearts these words, for it shall come to pass that the Son of man shall be delivered into the hands of men.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>But they understood not this word: and it was hid from them, so that they perceived it not. And they were afraid to ask him concerning this word.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>And there entered a thought into them, which of them should be greater.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>But Jesus seeing the thoughts of their hearts, took a child and set him by him,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>And said to them: Whosoever shall receive this child in my name receiveth me; and whosoever shall receive me receiveth him that sent me. For he that is the lesser among you all, he is the greater.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>And John, answering, said: Master, we saw a certain man casting out devils in thy name: and we forbade him, because he followeth not with us.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And Jesus said to him: Forbid him not: for he that is not against you is for you.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And it came to pass, when the days of his assumption were accomplishing, that he steadfastly set his face to go to Jerusalem.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And he sent messengers before his face: and going, they entered into a city of the Samaritans, to prepare for him.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And they received him not, because his face was of one going to Jerusalem.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>And when his disciples, James and John, had seen this, they said: Lord, wilt thou that we command fire to come down from heaven and consume them?</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And turning, he rebuked them, saying: you know not of what spirit you are.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>The Son of man came not to destroy souls, but to save. And they went into another town.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>And it came to pass, as they walked in the way, that a certain man said to him: I will follow thee whithersoever thou goest.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Jesus said to him: The foxes have holes, and the birds of the air nests: but the Son of man hath not where to lay his head.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>But he said to another: Follow me. And he said: Lord, suffer me first to go and to bury my father.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>And Jesus said to him: Let the dead bury their dead: but go thou and preach the kingdom of God.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And another said: I will follow thee, Lord; but let me first take my leave of them that are at my house.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Jesus said to him: No man putting his hand to the plough and looking back is fit for the kingdom of God.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Convocatis autem duodecim Apostolis, dedit illis virtutem et potestatem super omnia dæmonia, et ut languores curarent.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et misit illos prædicare regnum Dei, et sanare infirmos.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ait ad illos : Nihil tuleritis in via, neque virgam, neque peram, neque panem, neque pecuniam, neque duas tunicas habeatis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et in quamcumque domum intraveritis, ibi manete, et inde ne exeatis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et quicumque non receperint vos : exeuntes de civitate illa, etiam pulverem pedum vestrorum excutite in testimonium supra illos.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Egressi autem circuibant per castella evangelizantes, et curantes ubique.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Audivit autem Herodes tetrarcha omnia quæ fiebant ab eo, et hæsitabat eo quod diceretur</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>a quibusdam : Quia Joannes surrexit a mortuis : a quibusdam vero : Quia Elias apparuit : ab aliis autem : Quia propheta unus de antiquis surrexit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ait Herodes : Joannem ego decollavi : quis est autem iste, de quo ego talia audio ? Et quærebat videre eum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et reversi Apostoli, narraverunt illi quæcumque fecerunt : et assumptis illis secessit seorsum in locum desertum, qui est Bethsaidæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Quod cum cognovissent turbæ, secutæ sunt illum : et excepit eos, et loquebatur illis de regno Dei, et eos, qui cura indigebant, sanabat.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dies autem cœperat declinare, et accedentes duodecim dixerunt illi : Dimitte turbas, ut euntes in castella villasque quæ circa sunt, divertant, et inveniant escas : quia hic in loco deserto sumus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Ait autem ad illos : Vos date illis manducare. At illi dixerunt : Non sunt nobis plus quam quinque panes et duo pisces : nisi forte nos eamus, et emamus in omnem hanc turbam escas.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Erant autem fere viri quinque millia. Ait autem ad discipulos suos : Facite illos discumbere per convivia quinquagenos.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et ita fecerunt : et discumbere fecerunt omnes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Acceptis autem quinque panibus et duobus piscibus, respexit in cælum, et benedixit illis : et fregit, et distribuit discipulis suis, ut ponerent ante turbas.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et manducaverunt omnes, et saturati sunt. Et sublatum est quod superfuit illis, fragmentorum cophini duodecim.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et factum est cum solus esset orans, erant cum illo et discipuli : et interrogavit illos, dicens : Quem me dicunt esse turbæ ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>At illi responderunt, et dixerunt : Joannem Baptistam, alii autem Eliam, alii vero quia unus propheta de prioribus surrexit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dixit autem illis : Vos autem quem me esse dicitis ? Respondens Simon Petrus, dixit : Christum Dei.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>At ille increpans illos, præcepit ne cui dicerent hoc,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>dicens : Quia oportet Filium hominis multa pati, et reprobari a senioribus, et principibus sacerdotum, et scribis, et occidi, et tertia die resurgere.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dicebat autem ad omnes : Si quis vult post me venire, abneget semetipsum, et tollat crucem suam quotidie, et sequatur me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Qui enim voluerit animam suam salvam facere, perdet illam : nam qui perdiderit animam suam propter me, salvam faciet illam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Quid enim proficit homo, si lucretur universum mundum, se autem ipsum perdat, et detrimentum sui faciat ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Nam qui me erubuerit, et meos sermones : hunc Filius hominis erubescet cum venerit in majestate sua, et Patris, et sanctorum angelorum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Dico autem vobis vere : sunt aliqui hic stantes, qui non gustabunt mortem donec videant regnum Dei.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Factum est autem post hæc verba fere dies octo, et assumpsit Petrum, et Jacobum, et Joannem, et ascendit in montem ut oraret.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et facta est, dum oraret, species vultus ejus altera : et vestitus ejus albus et refulgens.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et ecce duo viri loquebantur cum illo. Erant autem Moyses et Elias,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>visi in majestate : et dicebant excessum ejus, quem completurus erat in Jerusalem.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Petrus vero, et qui cum illo erant, gravati erant somno. Et evigilantes viderunt majestatem ejus, et duos viros qui stabant cum illo.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et factum est cum discederent ab illo, ait Petrus ad Jesum : Præceptor, bonum est nos hic esse : et faciamus tria tabernacula, unum tibi, et unum Moysi, et unum Eliæ : nesciens quid diceret.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Hæc autem illo loquente, facta est nubes, et obumbravit eos : et timuerunt, intrantibus illis in nubem.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et vox facta est de nube, dicens : Hic est Filius meus dilectus, ipsum audite.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et dum fieret vox, inventus est Jesus solus. Et ipsi tacuerunt, et nemini dixerunt in illis diebus quidquam ex his quæ viderant.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Factum est autem in sequenti die, descendentibus illis de monte, occurrit illis turba multa.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Et ecce vir de turba exclamavit, dicens : Magister, obsecro te, respice in filium meum quia unicus est mihi :</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>et ecce spiritus apprehendit eum, et subito clamat, et elidit, et dissipat eum cum spuma, et vix discedit dilanians eum :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et rogavi discipulos tuos ut ejicerent illum, et non potuerunt.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Respondens autem Jesus, dixit : O generatio infidelis, et perversa, usquequo ero apud vos, et patiar vos ? adduc huc filium tuum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et cum accederet, elisit illum dæmonium, et dissipavit.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Et increpavit Jesus spiritum immundum, et sanavit puerum, et reddidit illum patri ejus.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Stupebant autem omnes in magnitudine Dei : omnibusque mirantibus in omnibus quæ faciebat, dixit ad discipulos suos : Ponite vos in cordibus vestris sermones istos : Filius enim hominis futurum est ut tradatur in manus hominum.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>At illi ignorabant verbum istud, et erat velatum ante eos ut non sentirent illud : et timebant eum interrogare de hoc verbo.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Intravit autem cogitatio in eos quis eorum major esset.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>At Jesus videns cogitationes cordis illorum, apprehendit puerum, et statuit illum secus se,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>et ait illis : Quicumque susceperit puerum istum in nomine meo, me recipit : et quicumque me receperit, recipit eum qui me misit. Nam qui minor est inter vos omnes, hic major est.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Respondens autem Joannes dixit : Præceptor, vidimus quemdam in nomine tuo ejicientem dæmonia, et prohibuimus eum : quia non sequitur nobiscum.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Et ait ad illum Jesus : Nolite prohibere : qui enim non est adversum vos, pro vobis est.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Factum est autem dum complerentur dies assumptionis ejus, et ipse faciem suam firmavit ut iret in Jerusalem.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Et misit nuntios ante conspectum suum : et euntes intraverunt in civitatem Samaritanorum ut parerent illi.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et non receperunt eum, quia facies ejus erat euntis in Jerusalem.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Cum vidissent autem discipuli ejus Jacobus et Joannes, dixerunt : Domine, vis dicimus ut ignis descendat de cælo, et consumat illos ?</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Et conversus increpavit illos, dicens : Nescitis cujus spiritus estis.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Filius hominis non venit animas perdere, sed salvare. Et abierunt in aliud castellum.</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Factum est autem : ambulantibus illis in via, dixit quidam ad illum : Sequar te quocumque ieris.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Dixit illi Jesus : Vulpes foveas habent, et volucres cæli nidos : Filius autem hominis non habet ubi caput reclinet.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Ait autem ad alterum : Sequere me : ille autem dixit : Domine, permitte mihi primum ire, et sepelire patrem meum.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>Dixitque ei Jesus : Sine ut mortui sepeliant mortuos suos : tu autem vade, et annuntia regnum Dei.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>Et ait alter : Sequar te Domine, sed permitte mihi primum renuntiare his quæ domi sunt.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>Ait ad illum Jesus : Nemo mittens manum suam ad aratrum, et respiciens retro, aptus est regno Dei.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone \"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#15130f\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n16:I[27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n11:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"Luke 9 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"LUK.9\",{\"bookId\":49,\"usfm\":\"LUK\",\"bookName\":\"Luke\",\"drName\":\"Luke\",\"chapter\":9,\"totalChapters\":24,\"dra\":[{\"verse\":1,\"text\":\"Then calling together the twelve apostles, he gave them power and authority over all devils and to cure diseases.\"},{\"verse\":2,\"text\":\"And he sent them to preach the kingdom of God and to heal the sick.\"},{\"verse\":3,\"text\":\"And he said to them: Take nothing for your journey, neither staff, nor scrip, nor bread, nor money; neither have two coats.\"},{\"verse\":4,\"text\":\"And whatsoever house you shall enter into, abide there and depart not from thence.\"},{\"verse\":5,\"text\":\"And whosoever will not receive you, when ye go out of that city, shake off even the dust of your feet, for a testimony against them.\"},{\"verse\":6,\"text\":\"And going out, they went about through the towns, preaching the gospel and healing every where.\"},{\"verse\":7,\"text\":\"Now Herod, the tetrarch, heard of all things that were done by him. And he was in a doubt, because it was said\"},{\"verse\":8,\"text\":\"By some that John was risen from the dead: but by other some, that Elias had appeared: and by others, that one of the old prophets was risen again.\"},{\"verse\":9,\"text\":\"And Herod said: John I have beheaded. But who is this of whom I hear such things? And he sought to see him.\"},{\"verse\":10,\"text\":\"And the apostles, when they were returned, told him all they had done. And taking them, he went aside into a desert place, apart, which belongeth to Bethsaida.\"},{\"verse\":11,\"text\":\"Which when the people knew, they followed him: and he received them and spoke to them of the kingdom of God and healed them who had need of healing.\"},{\"verse\":12,\"text\":\"Now the day began to decline. And the twelve came and said to him: Send away the multitude, that, going into the towns and villages round about, they may lodge and get victuals; for we are here in a desert place.\"},{\"verse\":13,\"text\":\"But he said to them: Give you them to eat. And they said: We have no more than five loaves and two fishes; unless perhaps, we should go and buy food for all this multitude.\"},{\"verse\":14,\"text\":\"Now there were about five thousand men. And he said to his disciples: Make them sit down by fifties in a company.\"},{\"verse\":15,\"text\":\"And they did so and made them all sit down.\"},{\"verse\":16,\"text\":\"And taking the five loaves and the two fishes, he looked up to heaven and blessed them: and he broke and distributed to his disciples, to set before the multitude.\"},{\"verse\":17,\"text\":\"And they did all eat and were filled. And there were taken up of fragments that remained to them, twelve baskets.\"},{\"verse\":18,\"text\":\"And it came to pass, as he was alone praying, his disciples also were with him: and he asked them, saying: Whom do the people say that I am?\"},{\"verse\":19,\"text\":\"But they answered and said: John the Baptist; but some say Elias: and others say that one of the former prophets is risen again.\"},{\"verse\":20,\"text\":\"And he said to them: But whom do you say that I am? Simon Peter answering, said: The Christ of God.\"},{\"verse\":21,\"text\":\"But he strictly charging them, commanded they should tell this to no man.\"},{\"verse\":22,\"text\":\"Saying: The Son of man must suffer many things and be rejected by the ancients and chief priests and scribes and be killed and the third day rise again.\"},{\"verse\":23,\"text\":\"And he said to all: If any man will come after me, let him deny himself and take up his cross daily and follow me.\"},{\"verse\":24,\"text\":\"For whosoever will save his life shall lose it: for he that shall lose his life for my sake shall save it.\"},{\"verse\":25,\"text\":\"For what is a man advantaged, if he gain the whole world and lose himself and cast away himself?\"},{\"verse\":26,\"text\":\"For he that shall be ashamed of me and of my words, of him the Son of man shall be ashamed, when he shall come in his majesty and that of his Father and of the holy angels.\"},{\"verse\":27,\"text\":\"But I tell you of a truth: There are some standing here that shall not taste death till they see the kingdom of God.\"},{\"verse\":28,\"text\":\"And it came to pass, about eight days after these words, that he took Peter and James and John and went up into a mountain to pray.\"},{\"verse\":29,\"text\":\"And whilst he prayed, the shape of his countenance was altered and his raiment became white and glittering.\"},{\"verse\":30,\"text\":\"And behold two men were talking with him. And they were Moses and Elias,\"},{\"verse\":31,\"text\":\"Appearing in majesty. And they spoke of his decease that he should accomplish in Jerusalem.\"},{\"verse\":32,\"text\":\"But Peter and they that were with him were heavy with sleep. And waking, they saw his glory and the two men that stood with him.\"},{\"verse\":33,\"text\":\"And it came to pass that, as they were departing from him, Peter saith to Jesus: Master, it is good for us to be here: and let us make three tabernacles, one for thee, and one for Moses; and one for Elias: not knowing what he said.\"},{\"verse\":34,\"text\":\"And as he spoke these things, there came a cloud and overshadowed them. And they were afraid when they entered into the cloud.\"},{\"verse\":35,\"text\":\"And a voice came out of the cloud; saying: This is my beloved son. Hear him.\"},{\"verse\":36,\"text\":\"And whilst the voice was uttered Jesus was found alone. And they held their peace and told no man in those days any of these things which they had seen.\"},{\"verse\":37,\"text\":\"And it came to pass the day following, when they came down from the mountain, there met him a great multitude.\"},{\"verse\":38,\"text\":\"And behold a man among the crowd cried out, saying: Master, I beseech thee, look upon my son, because he is my only one.\"},{\"verse\":39,\"text\":\"And lo, a spirit seizeth him, and he suddenly crieth out, and he throweth him down and teareth him, so that he foameth; and bruising him, he hardly departeth from him.\"},{\"verse\":40,\"text\":\"And I desired thy disciples to cast him out: and they could not.\"},{\"verse\":41,\"text\":\"And Jesus, answering, said: O faithless and perverse generation, how long shall I be with you and suffer you? Bring hither thy son.\"},{\"verse\":42,\"text\":\"And as he was coming to him, the devil threw him down and tore him.\"},{\"verse\":43,\"text\":\"And Jesus rebuked the unclean spirit and cured the boy and restored him to his father.\"},{\"verse\":44,\"text\":\"And all were astonished at the mighty power of God. But while all wondered at all the things he did, he said to his disciples: Lay you up in your hearts these words, for it shall come to pass that the Son of man shall be delivered into the hands of men.\"},{\"verse\":45,\"text\":\"But they understood not this word: and it was hid from them, so that they perceived it not. And they were afraid to ask him concerning this word.\"},{\"verse\":46,\"text\":\"And there entered a thought into them, which of them should be greater.\"},{\"verse\":47,\"text\":\"But Jesus seeing the thoughts of their hearts, took a child and set him by him,\"},{\"verse\":48,\"text\":\"And said to them: Whosoever shall receive this child in my name receiveth me; and whosoever shall receive me receiveth him that sent me. For he that is the lesser among you all, he is the greater.\"},{\"verse\":49,\"text\":\"And John, answering, said: Master, we saw a certain man casting out devils in thy name: and we forbade him, because he followeth not with us.\"},{\"verse\":50,\"text\":\"And Jesus said to him: Forbid him not: for he that is not against you is for you.\"},{\"verse\":51,\"text\":\"And it came to pass, when the days of his assumption were accomplishing, that he steadfastly set his face to go to Jerusalem.\"},{\"verse\":52,\"text\":\"And he sent messengers before his face: and going, they entered into a city of the Samaritans, to prepare for him.\"},{\"verse\":53,\"text\":\"And they received him not, because his face was of one going to Jerusalem.\"},{\"verse\":54,\"text\":\"And when his disciples, James and John, had seen this, they said: Lord, wilt thou that we command fire to come down from heaven and consume them?\"},{\"verse\":55,\"text\":\"And turning, he rebuked them, saying: you know not of what spirit you are.\"},{\"verse\":56,\"text\":\"The Son of man came not to destroy souls, but to save. And they went into another town.\"},{\"verse\":57,\"text\":\"And it came to pass, as they walked in the way, that a certain man said to him: I will follow thee whithersoever thou goest.\"},{\"verse\":58,\"text\":\"Jesus said to him: The foxes have holes, and the birds of the air nests: but the Son of man hath not where to lay his head.\"},{\"verse\":59,\"text\":\"But he said to another: Follow me. And he said: Lord, suffer me first to go and to bury my father.\"},{\"verse\":60,\"text\":\"And Jesus said to him: Let the dead bury their dead: but go thou and preach the kingdom of God.\"},{\"verse\":61,\"text\":\"And another said: I will follow thee, Lord; but let me first take my leave of them that are at my house.\"},{\"verse\":62,\"text\":\"Jesus said to him: No man putting his hand to the plough and looking back is fit for the kingdom of God.\"}],\"vul\":[{\"verse\":1,\"text\":\"Convocatis autem duodecim Apostolis, dedit illis virtutem et potestatem super omnia dæmonia, et ut languores curarent.\"},{\"verse\":2,\"text\":\"Et misit illos prædicare regnum Dei, et sanare infirmos.\"},{\"verse\":3,\"text\":\"Et ait ad illos : Nihil tuleritis in via, neque virgam, neque peram, neque panem, neque pecuniam, neque duas tunicas habeatis.\"},{\"verse\":4,\"text\":\"Et in quamcumque domum intraveritis, ibi manete, et inde ne exeatis.\"},{\"verse\":5,\"text\":\"Et quicumque non receperint vos : exeuntes de civitate illa, etiam pulverem pedum vestrorum excutite in testimonium supra illos.\"},{\"verse\":6,\"text\":\"Egressi autem circuibant per castella evangelizantes, et curantes ubique.\"},{\"verse\":7,\"text\":\"Audivit autem Herodes tetrarcha omnia quæ fiebant ab eo, et hæsitabat eo quod diceretur\"},{\"verse\":8,\"text\":\"a quibusdam : Quia Joannes surrexit a mortuis : a quibusdam vero : Quia Elias apparuit : ab aliis autem : Quia propheta unus de antiquis surrexit.\"},{\"verse\":9,\"text\":\"Et ait Herodes : Joannem ego decollavi : quis est autem iste, de quo ego talia audio ? Et quærebat videre eum.\"},{\"verse\":10,\"text\":\"Et reversi Apostoli, narraverunt illi quæcumque fecerunt : et assumptis illis secessit seorsum in locum desertum, qui est Bethsaidæ.\"},{\"verse\":11,\"text\":\"Quod cum cognovissent turbæ, secutæ sunt illum : et excepit eos, et loquebatur illis de regno Dei, et eos, qui cura indigebant, sanabat.\"},{\"verse\":12,\"text\":\"Dies autem cœperat declinare, et accedentes duodecim dixerunt illi : Dimitte turbas, ut euntes in castella villasque quæ circa sunt, divertant, et inveniant escas : quia hic in loco deserto sumus.\"},{\"verse\":13,\"text\":\"Ait autem ad illos : Vos date illis manducare. At illi dixerunt : Non sunt nobis plus quam quinque panes et duo pisces : nisi forte nos eamus, et emamus in omnem hanc turbam escas.\"},{\"verse\":14,\"text\":\"Erant autem fere viri quinque millia. Ait autem ad discipulos suos : Facite illos discumbere per convivia quinquagenos.\"},{\"verse\":15,\"text\":\"Et ita fecerunt : et discumbere fecerunt omnes.\"},{\"verse\":16,\"text\":\"Acceptis autem quinque panibus et duobus piscibus, respexit in cælum, et benedixit illis : et fregit, et distribuit discipulis suis, ut ponerent ante turbas.\"},{\"verse\":17,\"text\":\"Et manducaverunt omnes, et saturati sunt. Et sublatum est quod superfuit illis, fragmentorum cophini duodecim.\"},{\"verse\":18,\"text\":\"Et factum est cum solus esset orans, erant cum illo et discipuli : et interrogavit illos, dicens : Quem me dicunt esse turbæ ?\"},{\"verse\":19,\"text\":\"At illi responderunt, et dixerunt : Joannem Baptistam, alii autem Eliam, alii vero quia unus propheta de prioribus surrexit.\"},{\"verse\":20,\"text\":\"Dixit autem illis : Vos autem quem me esse dicitis ? Respondens Simon Petrus, dixit : Christum Dei.\"},{\"verse\":21,\"text\":\"At ille increpans illos, præcepit ne cui dicerent hoc,\"},{\"verse\":22,\"text\":\"dicens : Quia oportet Filium hominis multa pati, et reprobari a senioribus, et principibus sacerdotum, et scribis, et occidi, et tertia die resurgere.\"},{\"verse\":23,\"text\":\"Dicebat autem ad omnes : Si quis vult post me venire, abneget semetipsum, et tollat crucem suam quotidie, et sequatur me.\"},{\"verse\":24,\"text\":\"Qui enim voluerit animam suam salvam facere, perdet illam : nam qui perdiderit animam suam propter me, salvam faciet illam.\"},{\"verse\":25,\"text\":\"Quid enim proficit homo, si lucretur universum mundum, se autem ipsum perdat, et detrimentum sui faciat ?\"},{\"verse\":26,\"text\":\"Nam qui me erubuerit, et meos sermones : hunc Filius hominis erubescet cum venerit in majestate sua, et Patris, et sanctorum angelorum.\"},{\"verse\":27,\"text\":\"Dico autem vobis vere : sunt aliqui hic stantes, qui non gustabunt mortem donec videant regnum Dei.\"},{\"verse\":28,\"text\":\"Factum est autem post hæc verba fere dies octo, et assumpsit Petrum, et Jacobum, et Joannem, et ascendit in montem ut oraret.\"},{\"verse\":29,\"text\":\"Et facta est, dum oraret, species vultus ejus altera : et vestitus ejus albus et refulgens.\"},{\"verse\":30,\"text\":\"Et ecce duo viri loquebantur cum illo. Erant autem Moyses et Elias,\"},{\"verse\":31,\"text\":\"visi in majestate : et dicebant excessum ejus, quem completurus erat in Jerusalem.\"},{\"verse\":32,\"text\":\"Petrus vero, et qui cum illo erant, gravati erant somno. Et evigilantes viderunt majestatem ejus, et duos viros qui stabant cum illo.\"},{\"verse\":33,\"text\":\"Et factum est cum discederent ab illo, ait Petrus ad Jesum : Præceptor, bonum est nos hic esse : et faciamus tria tabernacula, unum tibi, et unum Moysi, et unum Eliæ : nesciens quid diceret.\"},{\"verse\":34,\"text\":\"Hæc autem illo loquente, facta est nubes, et obumbravit eos : et timuerunt, intrantibus illis in nubem.\"},{\"verse\":35,\"text\":\"Et vox facta est de nube, dicens : Hic est Filius meus dilectus, ipsum audite.\"},{\"verse\":36,\"text\":\"Et dum fieret vox, inventus est Jesus solus. Et ipsi tacuerunt, et nemini dixerunt in illis diebus quidquam ex his quæ viderant.\"},{\"verse\":37,\"text\":\"Factum est autem in sequenti die, descendentibus illis de monte, occurrit illis turba multa.\"},{\"verse\":38,\"text\":\"Et ecce vir de turba exclamavit, dicens : Magister, obsecro te, respice in filium meum quia unicus est mihi :\"},{\"verse\":39,\"text\":\"et ecce spiritus apprehendit eum, et subito clamat, et elidit, et dissipat eum cum spuma, et vix discedit dilanians eum :\"},{\"verse\":40,\"text\":\"et rogavi discipulos tuos ut ejicerent illum, et non potuerunt.\"},{\"verse\":41,\"text\":\"Respondens autem Jesus, dixit : O generatio infidelis, et perversa, usquequo ero apud vos, et patiar vos ? adduc huc filium tuum.\"},{\"verse\":42,\"text\":\"Et cum accederet, elisit illum dæmonium, et dissipavit.\"},{\"verse\":43,\"text\":\"Et increpavit Jesus spiritum immundum, et sanavit puerum, et reddidit illum patri ejus.\"},{\"verse\":44,\"text\":\"Stupebant autem omnes in magnitudine Dei : omnibusque mirantibus in omnibus quæ faciebat, dixit ad discipulos suos : Ponite vos in cordibus vestris sermones istos : Filius enim hominis futurum est ut tradatur in manus hominum.\"},{\"verse\":45,\"text\":\"At illi ignorabant verbum istud, et erat velatum ante eos ut non sentirent illud : et timebant eum interrogare de hoc verbo.\"},{\"verse\":46,\"text\":\"Intravit autem cogitatio in eos quis eorum major esset.\"},{\"verse\":47,\"text\":\"At Jesus videns cogitationes cordis illorum, apprehendit puerum, et statuit illum secus se,\"},{\"verse\":48,\"text\":\"et ait illis : Quicumque susceperit puerum istum in nomine meo, me recipit : et quicumque me receperit, recipit eum qui me misit. Nam qui minor est inter vos omnes, hic major est.\"},{\"verse\":49,\"text\":\"Respondens autem Joannes dixit : Præceptor, vidimus quemdam in nomine tuo ejicientem dæmonia, et prohibuimus eum : quia non sequitur nobiscum.\"},{\"verse\":50,\"text\":\"Et ait ad illum Jesus : Nolite prohibere : qui enim non est adversum vos, pro vobis est.\"},{\"verse\":51,\"text\":\"Factum est autem dum complerentur dies assumptionis ejus, et ipse faciem suam firmavit ut iret in Jerusalem.\"},{\"verse\":52,\"text\":\"Et misit nuntios ante conspectum suum : et euntes intraverunt in civitatem Samaritanorum ut parerent illi.\"},{\"verse\":53,\"text\":\"Et non receperunt eum, quia facies ejus erat euntis in Jerusalem.\"},{\"verse\":54,\"text\":\"Cum vidissent autem discipuli ejus Jacobus et Joannes, dixerunt : Domine, vis dicimus ut ignis descendat de cælo, et consumat illos ?\"},{\"verse\":55,\"text\":\"Et conversus increpavit illos, dicens : Nescitis cujus spiritus estis.\"},{\"verse\":56,\"text\":\"Filius hominis non venit animas perdere, sed salvare. Et abierunt in aliud castellum.\"},{\"verse\":57,\"text\":\"Factum est autem : ambulantibus illis in via, dixit quidam ad illum : Sequar te quocumque ieris.\"},{\"verse\":58,\"text\":\"Dixit illi Jesus : Vulpes foveas habent, et volucres cæli nidos : Filius autem hominis non habet ubi caput reclinet.\"},{\"verse\":59,\"text\":\"Ait autem ad alterum : Sequere me : ille autem dixit : Domine, permitte mihi primum ire, et sepelire patrem meum.\"},{\"verse\":60,\"text\":\"Dixitque ei Jesus : Sine ut mortui sepeliant mortuos suos : tu autem vade, et annuntia regnum Dei.\"},{\"verse\":61,\"text\":\"Et ait alter : Sequar te Domine, sed permitte mihi primum renuntiare his quæ domi sunt.\"},{\"verse\":62,\"text\":\"Ait ad illum Jesus : Nemo mittens manum suam ad aratrum, et respiciens retro, aptus est regno Dei.\"}],\"summary\":\"Christ sends forth his apostles, feeds five thousand with five loaves, is transfigured and casts out a devil.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":8,\"label\":\"Luke 8\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":10,\"label\":\"Luke 10\"}}]]\n"])</script></body></html>
