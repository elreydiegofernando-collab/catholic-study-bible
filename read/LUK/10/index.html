<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Luke 10 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Luke<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/LUK/">About <!-- -->Luke</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ sends forth and instructs his seventy-two disciples. The good Samaritan.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And after these things, the Lord appointed also other seventy-two. And he sent them two and two before his face into every city and place whither he himself was to come.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And he said to them: The harvest indeed is great, but the labourers are few. Pray ye therefore the Lord of the harvest that he send labourers into his harvest.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Go: Behold I send you as lambs among wolves.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Carry neither purse, nor scrip, nor shoes: and salute no man by the way.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Into whatever house you enter, first say: Peace be to this house.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And if the son of peace be there, your peace shall rest upon him: but if not, it shall return to you.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And in the same house, remain, eating and drinking such things as they have: for the labourer is worthy of his hire. Remove not from house to house.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And into what city soever you enter, and they receive you, eat such things as are set before you.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And heal the sick that are therein and say to them: The kingdom of God is come nigh unto you.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But into whatsoever city you enter, and they receive you not, going forth into the streets thereof, say:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Even the very dust of your city that cleaveth to us, we wipe off against you. Yet know this, that the kingdom of God is at hand.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I say to you, it shall be more tolerable at that day for Sodom than for that city.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Woe to thee, Corozain! Woe to thee, Bethsaida! For if in Tyre and Sidon had been wrought the mighty works that have been wrought in you, they would have done penance long ago, sitting in sackcloth and ashes.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But it shall be more tolerable for Tyre and Sidon at the judgment than for you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And thou, Capharnaum, which art exalted unto heaven, thou shalt be thrust down to hell.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He that heareth you heareth me: and he that despiseth you despiseth me: and he that despiseth me despiseth him that sent me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the seventy-two returned with joy, saying: Lord, the devils also are subject to us in thy name.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And he said to them: I saw Satan like lightning falling from heaven.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Behold, I have given you power to tread upon serpents and scorpions and upon all the power of the enemy: and nothing shall hurt you.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But yet rejoice not in this, that spirits are subject unto you: but rejoice in this, that your names are written in heaven.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In that same hour, he rejoiced in the Holy Ghost and said: I confess to thee, O Father, Lord of heaven and earth, because thou hast hidden these things from the wise and prudent and hast revealed them to little ones. Yea, Father, for so it hath seemed good in thy sight.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>All things are delivered to me by my Father. And no one knoweth who the Son is, but the Father: and who the Father is, but the Son and to whom the Son will reveal him.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And turning to his disciples, he said: Blessed are the eyes that see the things which you see.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For I say to you that many prophets and kings have desired to see the things that you see and have not seen them; and to hear the things that you hear and have not heard them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And behold a certain lawyer stood up, tempting him and saying, Master, what must I do to possess eternal life?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But he said to him: What is written in the law? How readest thou?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He answering, said: Thou shalt love the Lord thy God with thy whole heart and with thy whole soul and with all thy strength and with all thy mind: and thy neighbour as thyself.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And he said to him: Thou hast answered right. This do: and thou shalt live.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>But he willing to justify himself, said to Jesus: And who is my neighbour?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And Jesus answering, said: A certain man went down from Jerusalem to Jericho and fell among robbers, who also stripped him and having wounded him went away, leaving him half dead.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And it chanced, that a certain priest went down the same way: and seeing him, passed by.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>In like manner also a Levite, when he was near the place and saw him, passed by.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But a certain Samaritan, being on his journey, came near him: and seeing him, was moved with compassion:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And going up to him, bound up his wounds, pouring in oil and wine: and setting him upon his own beast, brought him to an inn and took care of him.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And the next day he took out two pence and gave to the host and said: Take care of him; and whatsoever thou shalt spend over and above, I, at my return, will repay thee.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Which of these three, in thy opinion, was neighbour to him that fell among the robbers?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But he said: He that shewed mercy to him. And Jesus said to him: Go, and do thou in like manner.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Now it came to pass, as they went, that he entered into a certain town: and a certain woman named Martha received him into her house.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And she had a sister called Mary, who, sitting also at the Lord’s feet, heard his word.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>But Martha was busy about much serving. Who stood and said: Lord, hast thou no care that my sister hath left me alone to serve? Speak to her therefore, that she help me.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And the Lord answering, said to her: Martha, Martha, thou art careful and art troubled about many things:</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>But one thing is necessary. Mary hath chosen the best part, which shall not be taken away from her.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post hæc autem designavit Dominus et alios septuaginta duos : et misit illos binos ante faciem suam in omnem civitatem et locum, quo erat ipse venturus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et dicebat illis : Messis quidem multa, operarii autem pauci. Rogate ergo dominum messis ut mittat operarios in messem suam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ite : ecce ego mitto vos sicut agnos inter lupos.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nolite portare sacculum, neque peram, neque calceamenta, et neminem per viam salutaveritis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In quamcumque domum intraveritis, primum dicite : Pax huic domui :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et si ibi fuerit filius pacis, requiescet super illum pax vestra : sin autem, ad vos revertetur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>In eadem autem domo manete, edentes et bibentes quæ apud illos sunt : dignus est enim operarius mercede sua. Nolite transire de domo in domum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et in quamcumque civitatem intraveritis, et susceperint vos, manducate quæ apponuntur vobis :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et curate infirmos, qui in illa sunt, et dicite illis : Appropinquavit in vos regnum Dei.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>In quamcumque autem civitatem intraveritis, et non susceperint vos, exeuntes in plateas ejus, dicite :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Etiam pulverem, qui adhæsit nobis de civitate vestra, extergimus in vos : tamen hoc scitote, quia appropinquavit regnum Dei.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dico vobis, quia Sodomis in die illa remissius erit, quam illi civitati.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Væ tibi Corozain ! væ tibi Bethsaida ! quia si in Tyro et Sidone factæ fuissent virtutes quæ factæ sunt in vobis, olim in cilicio et cinere sedentes pœniterent.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Verumtamen Tyro et Sidoni remissius erit in judicio, quam vobis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et tu Capharnaum, usque ad cælum exaltata, usque ad infernum demergeris.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Qui vos audit, me audit : et qui vos spernit, me spernit. Qui autem me spernit, spernit eum qui misit me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Reversi sunt autem septuaginta duo cum gaudio, dicentes : Domine, etiam dæmonia subjiciuntur nobis in nomine tuo.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et ait illis : Videbam Satanam sicut fulgor de cælo cadentem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ecce dedi vobis potestatem calcandi supra serpentes, et scorpiones, et super omnem virtutem inimici : et nihil vobis nocebit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Verumtamen in hoc nolite gaudere quia spiritus vobis subjiciuntur : gaudete autem, quod nomina vestra scripta sunt in cælis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In ipsa hora exsultavit Spiritu Sancto, et dixit : Confiteor tibi Pater, Domine cæli et terræ, quod abscondisti hæc a sapientibus et prudentibus, et revelasti ea parvulis. Etiam Pater : quoniam sic placuit ante te.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Omnia mihi tradita sunt a Patre meo. Et nemo scit quis sit Filius, nisi Pater : et quis sit Pater, nisi Filius, et cui voluerit Filius revelare.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et conversus ad discipulos suos, dixit : Beati oculi qui vident quæ vos videtis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dico enim vobis quod multi prophetæ et reges voluerunt videre quæ vos videtis, et non viderunt : et audire quæ auditis, et non audierunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ecce quidam legisperitus surrexit tentans illum, et dicens : Magister, quid faciendo vitam æternam possidebo ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>At ille dixit ad eum : In lege quid scriptum est ? quomodo legis ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ille respondens dixit : Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex omnibus virtutibus tuis, et ex omni mente tua : et proximum tuum sicut teipsum.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Dixitque illi : Recte respondisti : hoc fac, et vives.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ille autem volens justificare seipsum, dixit ad Jesum : Et quis est meus proximus ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Suscipiens autem Jesus, dixit : Homo quidam descendebat ab Jerusalem in Jericho, et incidit in latrones, qui etiam despoliaverunt eum : et plagis impositis abierunt semivivo relicto.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Accidit autem ut sacerdos quidam descenderet eadem via : et viso illo præterivit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Similiter et Levita, cum esset secus locum, et videret eum, pertransiit.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Samaritanus autem quidam iter faciens, venit secus eum : et videns eum, misericordia motus est.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et appropians alligavit vulnera ejus, infundens oleum et vinum : et imponens illum in jumentum suum, duxit in stabulum, et curam ejus egit.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et altera die protulit duos denarios, et dedit stabulario, et ait : Curam illius habe : et quodcumque supererogaveris, ego cum rediero reddam tibi.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Quis horum trium videtur tibi proximus fuisse illi, qui incidit in latrones ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>At ille dixit : Qui fecit misericordiam in illum. Et ait illi Jesus : Vade, et tu fac similiter.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Factum est autem, dum irent, et ipse intravit in quoddam castellum : et mulier quædam, Martha nomine, excepit illum in domum suam,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>et huic erat soror nomine Maria, quæ etiam sedens secus pedes Domini, audiebat verbum illius.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Martha autem satagebat circa frequens ministerium : quæ stetit, et ait : Domine, non est tibi curæ quod soror mea reliquit me solam ministrare ? dic ergo illi ut me adjuvet.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et respondens dixit illi Dominus : Martha, Martha, sollicita es, et turbaris erga plurima,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>porro unum est necessarium. Maria optimam partem elegit, quæ non auferetur ab ea.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/LUK/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6 "},{\"verse\":2,\"text\":\"And he said to them: The harvest indeed is great, but the labourers are few. Pray ye therefore the Lord of the harvest that he send labourers into his harvest.\"},{\"verse\":3,\"text\":\"Go: Behold I send you as lambs among wolves.\"},{\"verse\":4,\"text\":\"Carry neither purse, nor scrip, nor shoes: and salute no man by the way.\"},{\"verse\":5,\"text\":\"Into whatever house you enter, first say: Peace be to this house.\"},{\"verse\":6,\"text\":\"And if the son of peace be there, your peace shall rest upon him: but if not, it shall return to you.\"},{\"verse\":7,\"text\":\"And in the same house, remain, eating and drinking such things as they have: for the labourer is worthy of his hire. Remove not from house to house.\"},{\"verse\":8,\"text\":\"And into what city soever you enter, and they receive you, eat such things as are set before you.\"},{\"verse\":9,\"text\":\"And heal the sick that are therein and say to them: The kingdom of God is come nigh unto you.\"},{\"verse\":10,\"text\":\"But into whatsoever city you enter, and they receive you not, going forth into the streets thereof, say:\"},{\"verse\":11,\"text\":\"Even the very dust of your city that cleaveth to us, we wipe off against you. Yet know this, that the kingdom of God is at hand.\"},{\"verse\":12,\"text\":\"I say to you, it shall be more tolerable at that day for Sodom than for that city.\"},{\"verse\":13,\"text\":\"Woe to thee, Corozain! Woe to thee, Bethsaida! For if in Tyre and Sidon had been wrought the mighty works that have been wrought in you, they would have done penance long ago, sitting in sackcloth and ashes.\"},{\"verse\":14,\"text\":\"But it shall be more tolerable for Tyre and Sidon at the judgment than for you.\"},{\"verse\":15,\"text\":\"And thou, Capharnaum, which art exalted unto heaven, thou shalt be thrust down to hell.\"},{\"verse\":16,\"text\":\"He that heareth you heareth me: and he that despiseth you despiseth me: and he that despiseth me despiseth him that sent me.\"},{\"verse\":17,\"text\":\"And the seventy-two returned with joy, saying: Lord, the devils also are subject to us in thy name.\"},{\"verse\":18,\"text\":\"And he said to them: I saw Satan like lightning falling from heaven.\"},{\"verse\":19,\"text\":\"Behold, I have given you power to tread upon serpents and scorpions and upon all the power of the enemy: and nothing shall hurt you.\"},{\"verse\":20,\"text\":\"But yet rejoice not in this, that spirits are subject unto you: but rejoice in this, that your names are written in heaven.\"},{\"verse\":21,\"text\":\"In that same hour, he rejoiced in the Holy Ghost and said: I confess to thee, O Father, Lord of heaven and earth, because thou hast hidden these things from the wise and prudent and hast revealed them to little ones. Yea, Father, for so it hath seemed good in thy sight.\"},{\"verse\":22,\"text\":\"All things are delivered to me by my Father. And no one knoweth who the Son is, but the Father: and who the Father is, but the Son and to whom the Son will reveal him.\"},{\"verse\":23,\"text\":\"And turning to his disciples, he said: Blessed are the eyes that see the things which you see.\"},{\"verse\":24,\"text\":\"For I say to you that many prophets and kings have desired to see the things that you see and have not seen them; and to hear the things that you hear and have not heard them.\"},{\"verse\":25,\"text\":\"And behold a certain lawyer stood up, tempting him and saying, Master, what must I do to possess eternal life?\"},{\"verse\":26,\"text\":\"But he said to him: What is written in the law? How readest thou?\"},{\"verse\":27,\"text\":\"He answering, said: Thou shalt love the Lord thy God with thy whole heart and with thy whole soul and with all thy strength and with all thy mind: and thy neighbour as thyself.\"},{\"verse\":28,\"text\":\"And he said to him: Thou hast answered right. This do: and thou shalt live.\"},{\"verse\":29,\"text\":\"But he willing to justify himself, said to Jesus: And who is my neighbour?\"},{\"verse\":30,\"text\":\"And Jesus answering, said: A certain man went down from Jerusalem to Jericho and fell among robbers, who also stripped him and having wounded him went away, leaving him half dead.\"},{\"verse\":31,\"text\":\"And it chanced, that a certain priest went down the same way: and seeing him, passed by.\"},{\"verse\":32,\"text\":\"In like manner also a Levite, when he was near the place and saw him, passed by.\"},{\"verse\":33,\"text\":\"But a certain Samaritan, being on his journey, came near him: and seeing him, was moved with compassion:\"},{\"verse\":34,\"text\":\"And going up to him, bound up his wounds, pouring in oil and wine: and setting him upon his own beast, brought him to an inn and took care of him.\"},{\"verse\":35,\"text\":\"And the next day he took out two pence and gave to the host and said: Take care of him; and whatsoever thou shalt spend over and above, I, at my return, will repay thee.\"},{\"verse\":36,\"text\":\"Which of these three, in thy opinion, was neighbour to him that fell among the robbers?\"},{\"verse\":37,\"text\":\"But he said: He that shewed mercy to him. And Jesus said to him: Go, and do thou in like manner.\"},{\"verse\":38,\"text\":\"Now it came to pass, as they went, that he entered into a certain town: and a certain woman named Martha received him into her house.\"},{\"verse\":39,\"text\":\"And she had a sister called Mary, who, sitting also at the Lord’s feet, heard his word.\"},{\"verse\":40,\"text\":\"But Martha was busy about much serving. Who stood and said: Lord, hast thou no care that my sister hath left me alone to serve? Speak to her therefore, that she help me.\"},{\"verse\":41,\"text\":\"And the Lord answering, said to her: Martha, Martha, thou art careful and art troubled about many things:\"},{\"verse\":42,\"text\":\"But one thing is necessary. Mary hath chosen the best part, which shall not be taken away from her.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post hæc autem designavit Dominus et alios septuaginta duos : et misit illos binos ante faciem suam in omnem civitatem et locum, quo erat ipse venturus.\"},{\"verse\":2,\"text\":\"Et dicebat illis : Messis quidem multa, operarii autem pauci. Rogate ergo dominum messis ut mittat operarios in messem suam.\"},{\"verse\":3,\"text\":\"Ite : ecce ego mitto vos sicut agnos inter lupos.\"},{\"verse\":4,\"text\":\"Nolite portare sacculum, neque peram, neque calceamenta, et neminem per viam salutaveritis.\"},{\"verse\":5,\"text\":\"In quamcumque domum intraveritis, primum dicite : Pax huic domui :\"},{\"verse\":6,\"text\":\"et si ibi fuerit filius pacis, requiescet super illum pax vestra : sin autem, ad vos revertetur.\"},{\"verse\":7,\"text\":\"In eadem autem domo manete, edentes et bibentes quæ apud illos sunt : dignus est enim operarius mercede sua. Nolite transire de domo in domum.\"},{\"verse\":8,\"text\":\"Et in quamcumque civitatem intraveritis, et susceperint vos, manducate quæ apponuntur vobis :\"},{\"verse\":9,\"text\":\"et curate infirmos, qui in illa sunt, et dicite illis : Appropinquavit in vos regnum Dei.\"},{\"verse\":10,\"text\":\"In quamcumque autem civitatem intraveritis, et non susceperint vos, exeuntes in plateas ejus, dicite :\"},{\"verse\":11,\"text\":\"Etiam pulverem, qui adhæsit nobis de civitate vestra, extergimus in vos : tamen hoc scitote, quia appropinquavit regnum Dei.\"},{\"verse\":12,\"text\":\"Dico vobis, quia Sodomis in die illa remissius erit, quam illi civitati.\"},{\"verse\":13,\"text\":\"Væ tibi Corozain ! væ tibi Bethsaida ! quia si in Tyro et Sidone factæ fuissent virtutes quæ factæ sunt in vobis, olim in cilicio et cinere sedentes pœniterent.\"},{\"verse\":14,\"text\":\"Verumtamen Tyro et Sidoni remissius erit in judicio, quam vobis.\"},{\"verse\":15,\"text\":\"Et tu Capharnaum, usque ad cælum exaltata, usque ad infernum demergeris.\"},{\"verse\":16,\"text\":\"Qui vos audit, me audit : et qui vos spernit, me spernit. Qui autem me spernit, spernit eum qui misit me.\"},{\"verse\":17,\"text\":\"Reversi sunt autem septuaginta duo cum gaudio, dicentes : Domine, etiam dæmonia subjiciuntur nobis in nomine tuo.\"},{\"verse\":18,\"text\":\"Et ait illis : Videbam Satanam sicut fulgor de cælo cadentem.\"},{\"verse\":19,\"text\":\"Ecce dedi vobis potestatem calcandi supra serpentes, et scorpiones, et super omnem virtutem inimici : et nihil vobis nocebit.\"},{\"verse\":20,\"text\":\"Verumtamen in hoc nolite gaudere quia spiritus vobis subjiciuntur : gaudete autem, quod nomina vestra scripta sunt in cælis.\"},{\"verse\":21,\"text\":\"In ipsa hora exsultavit Spiritu Sancto, et dixit : Confiteor tibi Pater, Domine cæli et terræ, quod abscondisti hæc a sapientibus et prudentibus, et revelasti ea parvulis. Etiam Pater : quoniam sic placuit ante te.\"},{\"verse\":22,\"text\":\"Omnia mihi tradita sunt a Patre meo. Et nemo scit quis sit Filius, nisi Pater : et quis sit Pater, nisi Filius, et cui voluerit Filius revelare.\"},{\"verse\":23,\"text\":\"Et conversus ad discipulos suos, dixit : Beati oculi qui vident quæ vos videtis.\"},{\"verse\":24,\"text\":\"Dico enim vobis quod multi prophetæ et reges voluerunt videre quæ vos videtis, et non viderunt : et audire quæ auditis, et non audierunt.\"},{\"verse\":25,\"text\":\"Et ecce quidam legisperitus surrexit tentans illum, et dicens : Magister, quid faciendo vitam æternam possidebo ?\"},{\"verse\":26,\"text\":\"At ille dixit ad eum : In lege quid scriptum est ? quomodo legis ?\"},{\"verse\":27,\"text\":\"Ille respondens dixit : Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex omnibus virtutibus tuis, et ex omni mente tua : et proximum tuum sicut teipsum.\"},{\"verse\":28,\"text\":\"Dixitque illi : Recte respondisti : hoc fac, et vives.\"},{\"verse\":29,\"text\":\"Ille autem volens justificare seipsum, dixit ad Jesum : Et quis est meus proximus ?\"},{\"verse\":30,\"text\":\"Suscipiens autem Jesus, dixit : Homo quidam descendebat ab Jerusalem in Jericho, et incidit in latrones, qui etiam despoliaverunt eum : et plagis impositis abierunt semivivo relicto.\"},{\"verse\":31,\"text\":\"Accidit autem ut sacerdos quidam descenderet eadem via : et viso illo præterivit.\"},{\"verse\":32,\"text\":\"Similiter et Levita, cum esset secus locum, et videret eum, pertransiit.\"},{\"verse\":33,\"text\":\"Samaritanus autem quidam iter faciens, venit secus eum : et videns eum, misericordia motus est.\"},{\"verse\":34,\"text\":\"Et appropians alligavit vulnera ejus, infundens oleum et vinum : et imponens illum in jumentum suum, duxit in stabulum, et curam ejus egit.\"},{\"verse\":35,\"text\":\"Et altera die protulit duos denarios, et dedit stabulario, et ait : Curam illius habe : et quodcumque supererogaveris, ego cum rediero reddam tibi.\"},{\"verse\":36,\"text\":\"Quis horum trium videtur tibi proximus fuisse illi, qui incidit in latrones ?\"},{\"verse\":37,\"text\":\"At ille dixit : Qui fecit misericordiam in illum. Et ait illi Jesus : Vade, et tu fac similiter.\"},{\"verse\":38,\"text\":\"Factum est autem, dum irent, et ipse intravit in quoddam castellum : et mulier quædam, Martha nomine, excepit illum in domum suam,\"},{\"verse\":39,\"text\":\"et huic erat soror nomine Maria, quæ etiam sedens secus pedes Domini, audiebat verbum illius.\"},{\"verse\":40,\"text\":\"Martha autem satagebat circa frequens ministerium : quæ stetit, et ait : Domine, non est tibi curæ quod soror mea reliquit me solam ministrare ? dic ergo illi ut me adjuvet.\"},{\"verse\":41,\"text\":\"Et respondens dixit illi Dominus : Martha, Martha, sollicita es, et turbaris erga plurima,\"},{\"verse\":42,\"text\":\"porro unum est necessarium. Maria optimam partem elegit, quæ non auferetur ab ea.\"}],\"summary\":\"Christ sends forth and instructs his seventy-two disciples. The good Samaritan.\",\"intro\":null,\"prev\":{\"usfm\":\"LUK\",\"chapter\":9,\"label\":\"Luke 9\"},\"next\":{\"usfm\":\"LUK\",\"chapter\":11,\"label\":\"Luke 11\"}}]]\n"])</script></body></html>
