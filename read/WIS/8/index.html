5]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>She reacheth, therefore, from end to end mightily, and ordereth all things sweetly.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Her have I loved, and have sought her out from my youth, and have desired to take for my spouse, and I became a lover of her beauty.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>She glorifieth her nobility by being conversant with God: yea, and the Lord of all things hath loved her.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For it is she that teacheth the knowledge of God and is the chooser of his works.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And if riches be desired in life, what is richer than wisdom, which maketh all things?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And if sense do work: who is a more artful worker than she of those things that are?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And if a man love justice: her labours have great virtues: for she teacheth temperance, and prudence, and justice, and fortitude, which are such things as men can have nothing more profitable in life.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And if a man desire much knowledge: she knoweth things past, and judgeth of things to come: she knoweth the subtilties of speeches, and the solutions of arguments: she knoweth signs and wonders before they be done, and the events of times and ages.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I purposed, therefore, to take her to me to live with me: knowing that she will communicate to me of her good things, and will be a comfort in my cares and grief.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For her sake I shall have glory among the multitude, and honour with the ancients, though I be young:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I shall be found of a quick conceit in judgment, and shall be admired in the sight of the mighty, and the faces of princes shall wonder at me.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They shall wait for me when I hold my peace, and they shall look upon me when I speak; and if I talk much, they shall lay their hands on their mouth.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Moreover, by the means of her I shall have immortality: and shall leave behind me an everlasting memory to them that come after me.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I shall set the people in order: and nations shall be subject to me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Terrible kings hearing, shall be afraid of me: among the multitude I shall be found good, and valiant in war.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>When I go into my house, I shall repose myself with her: for her conversation hath no bitterness, nor her company any tediousness, but joy and gladness.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Thinking these things with myself, and pondering them in my heart, that to be allied to wisdom is immortality,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And that there is great delight in her friendship, and inexhaustible riches in the works of her hands, and in the exercise of conference with her, wisdom, and glory in the communication of her words: I went about seeking, that I might take her to myself.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I was a witty child, and had received a good soul.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And whereas I was more good, I came to a body undefiled.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And as I knew that I could not otherwise be continent, except God gave it, and this also was a point of wisdom, to know whose gift it was, I went to the Lord, and besought him, and said with my whole heart:</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Attingit ergo a fine usque ad finem fortiter, et disponit omnia suaviter.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hanc amavi, et exquisivi a juventute mea, et quæsivi sponsam mihi eam assumere, et amator factus sum formæ illius.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Generositatem illius glorificat, contubernium habens Dei ; sed et omnium Dominus dilexit illam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Doctrix enim est disciplinæ Dei, et electrix operum illius.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et si divitiæ appetuntur in vita, quid sapientia locupletius quæ operatur omnia ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Si autem sensus operatur, quis horum quæ sunt magis quam illa est artifex ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et si justitiam quis diligit, labores hujus magnas habent virtutes : sobrietatem enim et prudentiam docet, et justitiam, et virtutem, quibus utilius nihil est in vita hominibus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et si multitudinem scientiæ desiderat quis, scit præterita, et de futuris æstimat ; scit versutias sermonum, et dissolutiones argumentorum ; signa et monstra scit antequam fiant, et eventus temporum et sæculorum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Proposui ergo hanc adducere mihi ad convivendum, sciens quoniam mecum communicabit de bonis, et erit allocutio cogitationis et tædii mei.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Habebo propter hanc claritatem ad turbas, et honorem apud seniores juvenis ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>et acutus inveniar in judicio, et in conspectu potentium admirabilis ero, et facies principum mirabuntur me :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>tacentem me sustinebunt, et loquentem me respicient, et sermocinante me plura, manus ori suo imponent.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Præterea habebo per hanc immortalitatem, et memoriam æternam his qui post me futuri sunt relinquam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Disponam populos, et nationes mihi erunt subditæ :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>timebunt me audientes reges horrendi. In multitudine videbor bonus, et in bello fortis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Intrans in domum meam, conquiescam cum illa : non enim habet amaritudinem conversatio illius, nec tædium convictus illius, sed lætitiam et gaudium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hæc cogitans apud me et commemorans in corde meo, quoniam immortalitas est in cognatione sapientiæ,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et in amicitia illius delectatio bona, et in operibus manuum illius honestas sine defectione, et in certamine loquelæ illius sapientia, et præclaritas in communicatione sermonum ipsius : circuibam quærens, ut mihi illam assumerem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Puer autem eram ingeniosus, et sortitus sum animam bonam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et cum essem magis bonus, veni ad corpus incoinquinatum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et ut scivi quoniam aliter non possem esse continens, nisi Deus det ; et hoc ipsum erat sapientiæ, scire cujus esset hoc donum : adii Dominum, et deprecatus sum illum, et dixi ex totis præcordiis meis :</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/7/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 7</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/9/"><span class="min-w-0"><span class="block text-x ink\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.8\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":8,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"She reacheth, therefore, from end to end mightily, and ordereth all things sweetly.\"},{\"verse\":2,\"text\":\"Her have I loved, and have sought her out from my youth, and have desired to take for my spouse, and I became a lover of her beauty.\"},{\"verse\":3,\"text\":\"She glorifieth her nobility by being conversant with God: yea, and the Lord of all things hath loved her.\"},{\"verse\":4,\"text\":\"For it is she that teacheth the knowledge of God and is the chooser of his works.\"},{\"verse\":5,\"text\":\"And if riches be desired in life, what is richer than wisdom, which maketh all things?\"},{\"verse\":6,\"text\":\"And if sense do work: who is a more artful worker than she of those things that are?\"},{\"verse\":7,\"text\":\"And if a man love justice: her labours have great virtues: for she teacheth temperance, and prudence, and justice, and fortitude, which are such things as men can have nothing more profitable in life.\"},{\"verse\":8,\"text\":\"And if a man desire much knowledge: she knoweth things past, and judgeth of things to come: she knoweth the subtilties of speeches, and the solutions of arguments: she knoweth signs and wonders before they be done, and the events of times and ages.\"},{\"verse\":9,\"text\":\"I purposed, therefore, to take her to me to live with me: knowing that she will communicate to me of her good things, and will be a comfort in my cares and grief.\"},{\"verse\":10,\"text\":\"For her sake I shall have glory among the multitude, and honour with the ancients, though I be young:\"},{\"verse\":11,\"text\":\"And I shall be found of a quick conceit in judgment, and shall be admired in the sight of the mighty, and the faces of princes shall wonder at me.\"},{\"verse\":12,\"text\":\"They shall wait for me when I hold my peace, and they shall look upon me when I speak; and if I talk much, they shall lay their hands on their mouth.\"},{\"verse\":13,\"text\":\"Moreover, by the means of her I shall have immortality: and shall leave behind me an everlasting memory to them that come after me.\"},{\"verse\":14,\"text\":\"I shall set the people in order: and nations shall be subject to me.\"},{\"verse\":15,\"text\":\"Terrible kings hearing, shall be afraid of me: among the multitude I shall be found good, and valiant in war.\"},{\"verse\":16,\"text\":\"When I go into my house, I shall repose myself with her: for her conversation hath no bitterness, nor her company any tediousness, but joy and gladness.\"},{\"verse\":17,\"text\":\"Thinking these things with myself, and pondering them in my heart, that to be allied to wisdom is immortality,\"},{\"verse\":18,\"text\":\"And that there is great delight in her friendship, and inexhaustible riches in the works of her hands, and in the exercise of conference with her, wisdom, and glory in the communication of her words: I went about seeking, that I might take her to myself.\"},{\"verse\":19,\"text\":\"And I was a witty child, and had received a good soul.\"},{\"verse\":20,\"text\":\"And whereas I was more good, I came to a body undefiled.\"},{\"verse\":21,\"text\":\"And as I knew that I could not otherwise be continent, except God gave it, and this also was a point of wisdom, to know whose gift it was, I went to the Lord, and besought him, and said with my whole heart:\"}],\"vul\":[{\"verse\":1,\"text\":\"Attingit ergo a fine usque ad finem fortiter, et disponit omnia suaviter.\"},{\"verse\":2,\"text\":\"Hanc amavi, et exquisivi a juventute mea, et quæsivi sponsam mihi eam assumere, et amator factus sum formæ illius.\"},{\"verse\":3,\"text\":\"Generositatem illius glorificat, contubernium habens Dei ; sed et omnium Dominus dilexit illam.\"},{\"verse\":4,\"text\":\"Doctrix enim est disciplinæ Dei, et electrix operum illius.\"},{\"verse\":5,\"text\":\"Et si divitiæ appetuntur in vita, quid sapientia locupletius quæ operatur omnia ?\"},{\"verse\":6,\"text\":\"Si autem sensus operatur, quis horum quæ sunt magis quam illa est artifex ?\"},{\"verse\":7,\"text\":\"Et si justitiam quis diligit, labores hujus magnas habent virtutes : sobrietatem enim et prudentiam docet, et justitiam, et virtutem, quibus utilius nihil est in vita hominibus.\"},{\"verse\":8,\"text\":\"Et si multitudinem scientiæ desiderat quis, scit præterita, et de futuris æstimat ; scit versutias sermonum, et dissolutiones argumentorum ; signa et monstra scit antequam fiant, et eventus temporum et sæculorum.\"},{\"verse\":9,\"text\":\"Proposui ergo hanc adducere mihi ad convivendum, sciens quoniam mecum communicabit de bonis, et erit allocutio cogitationis et tædii mei.\"},{\"verse\":10,\"text\":\"Habebo propter hanc claritatem ad turbas, et honorem apud seniores juvenis ;\"},{\"verse\":11,\"text\":\"et acutus inveniar in judicio, et in conspectu potentium admirabilis ero, et facies principum mirabuntur me :\"},{\"verse\":12,\"text\":\"tacentem me sustinebunt, et loquentem me respicient, et sermocinante me plura, manus ori suo imponent.\"},{\"verse\":13,\"text\":\"Præterea habebo per hanc immortalitatem, et memoriam æternam his qui post me futuri sunt relinquam.\"},{\"verse\":14,\"text\":\"Disponam populos, et nationes mihi erunt subditæ :\"},{\"verse\":15,\"text\":\"timebunt me audientes reges horrendi. In multitudine videbor bonus, et in bello fortis.\"},{\"verse\":16,\"text\":\"Intrans in domum meam, conquiescam cum illa : non enim habet amaritudinem conversatio illius, nec tædium convictus illius, sed lætitiam et gaudium.\"},{\"verse\":17,\"text\":\"Hæc cogitans apud me et commemorans in corde meo, quoniam immortalitas est in cognatione sapientiæ,\"},{\"verse\":18,\"text\":\"et in amicitia illius delectatio bona, et in operibus manuum illius honestas sine defectione, et in certamine loquelæ illius sapientia, et præclaritas in communicatione sermonum ipsius : circuibam quærens, ut mihi illam assumerem.\"},{\"verse\":19,\"text\":\"Puer autem eram ingeniosus, et sortitus sum animam bonam.\"},{\"verse\":20,\"text\":\"Et cum essem magis bonus, veni ad corpus incoinquinatum.\"},{\"verse\":21,\"text\":\"Et ut scivi quoniam aliter non possem esse continens, nisi Deus det ; et hoc ipsum erat sapientiæ, scire cujus esset hoc donum : adii Dominum, et deprecatus sum illum, et dixi ex totis præcordiis meis :\"}],\"summary\":\"Further praises of wisdom: and her fruits.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":7,\"label\":\"Wisdom 7\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":9,\"label\":\"Wisdom 9\"}}]]\n"])</script></body></html>
