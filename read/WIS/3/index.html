75rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But the souls of the just are in the hand of God, and the torment of death shall not touch them.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In the sight of the unwise they seemed to die: and their departure was taken for misery:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And their going away from us, for utter destruction: but they are in peace.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And though in the sight of men they suffered torments, their hope is full of immortality.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Afflicted in few things, in many they shall be well rewarded: because God hath tried them, and found them worthy of himself.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>As gold in the furnace, he hath proved them, and as a victim of a holocaust, he hath received them, and in time there shall be respect had to them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The just shall shine, and shall run to and fro like sparks among the reeds.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>They shall judge nations, and rule over people, and their Lord shall reign for ever.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>They that trust in him shall understand the truth: and they that are faithful in love, shall rest in him: for grace and peace are to his elect.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But the wicked shall be punished according to their own devices: who have neglected the just, and have revolted from the Lord.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For he that rejecteth wisdom, and discipline, is unhappy: and their hope is vain, and their labours without fruit, and their works unprofitable.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Their wives are foolish, and their children wicked.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Their offspring is cursed, for happy is the barren: and the undefiled, that hath not known bed in sin, she shall have fruit in the visitation of holy souls.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the eunuch, that hath not wrought iniquity with his hands, nor thought wicked things against God for the precious gift of faith shall be given to him, and a most acceptable lot in the temple of God.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For the fruit of good labours is glorious, and the root of wisdom never faileth.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But the children of adulterers shall not come to perfection, and the seed of the unlawful bed shall be rooted out.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And if they live long, they shall be nothing regarded, and their last old age shall be without honour.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And if they die quickly, they shall have no hope, nor speech of comfort in the day of trial.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For dreadful are the ends of a wicked race.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Justorum autem animæ in manu Dei sunt, et non tanget illos tormentum mortis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Visi sunt oculis insipientium mori, et æstimata est afflictio exitus illorum,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et quod a nobis est iter exterminium ; illi autem sunt in pace :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>etsi coram hominibus tormenta passi sunt, spes illorum immortalitate plena est.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>In paucis vexati sunt, in multis bene disponentur, quoniam Deus tentavit eos, et invenit illos dignos se.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tamquam aurum in fornace probavit illos, et quasi holocausti hostiam accepit illos, et in tempore erit respectus illorum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Fulgebunt justi et tamquam scintillæ in arundineto discurrent.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Judicabunt nationes, et dominabuntur populis, et regnabit Dominus illorum in perpetuum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui confidunt in illo intelligent veritatem, et fideles in dilectione acquiescent illi, quoniam donum et pax est electis ejus.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Impii autem secundum quæ cogitaverunt correptionem habebunt : qui neglexerunt justum, et a Domino recesserunt.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sapientiam enim et disciplinam qui abjicit infelix est : et vacua est spes illorum, et labores sine fructu, et inutilia opera eorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Mulieres eorum insensatæ sunt, et nequissimi filii eorum.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Maledicta creatura eorum, quoniam felix est sterilis ; et incoinquinata, quæ nescivit thorum in delicto, habebit fructum in respectione animarum sanctarum ;</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et spado qui non operatus est per manus suas iniquitatem, nec cogitavit adversus Deum nequissima : dabitur enim illi fidei donum electum, et sors in templo Dei acceptissima.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Bonorum enim laborum gloriosus est fructus, et quæ non concidat radix sapientiæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Filii autem adulterorum in inconsummatione erunt, et ab iniquo thoro semen exterminabitur.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et si quidem longæ vitæ erunt, in nihilum computabuntur, et sine honore erit novissima senectus illorum :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>et si celerius defuncti fuerint, non habebunt spem, nec in die agnitionis allocutionem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Nationis enim iniquæ diræ sunt consummationes.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 ed to die: and their departure was taken for misery:\"},{\"verse\":3,\"text\":\"And their going away from us, for utter destruction: but they are in peace.\"},{\"verse\":4,\"text\":\"And though in the sight of men they suffered torments, their hope is full of immortality.\"},{\"verse\":5,\"text\":\"Afflicted in few things, in many they shall be well rewarded: because God hath tried them, and found them worthy of himself.\"},{\"verse\":6,\"text\":\"As gold in the furnace, he hath proved them, and as a victim of a holocaust, he hath received them, and in time there shall be respect had to them.\"},{\"verse\":7,\"text\":\"The just shall shine, and shall run to and fro like sparks among the reeds.\"},{\"verse\":8,\"text\":\"They shall judge nations, and rule over people, and their Lord shall reign for ever.\"},{\"verse\":9,\"text\":\"They that trust in him shall understand the truth: and they that are faithful in love, shall rest in him: for grace and peace are to his elect.\"},{\"verse\":10,\"text\":\"But the wicked shall be punished according to their own devices: who have neglected the just, and have revolted from the Lord.\"},{\"verse\":11,\"text\":\"For he that rejecteth wisdom, and discipline, is unhappy: and their hope is vain, and their labours without fruit, and their works unprofitable.\"},{\"verse\":12,\"text\":\"Their wives are foolish, and their children wicked.\"},{\"verse\":13,\"text\":\"Their offspring is cursed, for happy is the barren: and the undefiled, that hath not known bed in sin, she shall have fruit in the visitation of holy souls.\"},{\"verse\":14,\"text\":\"And the eunuch, that hath not wrought iniquity with his hands, nor thought wicked things against God for the precious gift of faith shall be given to him, and a most acceptable lot in the temple of God.\"},{\"verse\":15,\"text\":\"For the fruit of good labours is glorious, and the root of wisdom never faileth.\"},{\"verse\":16,\"text\":\"But the children of adulterers shall not come to perfection, and the seed of the unlawful bed shall be rooted out.\"},{\"verse\":17,\"text\":\"And if they live long, they shall be nothing regarded, and their last old age shall be without honour.\"},{\"verse\":18,\"text\":\"And if they die quickly, they shall have no hope, nor speech of comfort in the day of trial.\"},{\"verse\":19,\"text\":\"For dreadful are the ends of a wicked race.\"}],\"vul\":[{\"verse\":1,\"text\":\"Justorum autem animæ in manu Dei sunt, et non tanget illos tormentum mortis.\"},{\"verse\":2,\"text\":\"Visi sunt oculis insipientium mori, et æstimata est afflictio exitus illorum,\"},{\"verse\":3,\"text\":\"et quod a nobis est iter exterminium ; illi autem sunt in pace :\"},{\"verse\":4,\"text\":\"etsi coram hominibus tormenta passi sunt, spes illorum immortalitate plena est.\"},{\"verse\":5,\"text\":\"In paucis vexati sunt, in multis bene disponentur, quoniam Deus tentavit eos, et invenit illos dignos se.\"},{\"verse\":6,\"text\":\"Tamquam aurum in fornace probavit illos, et quasi holocausti hostiam accepit illos, et in tempore erit respectus illorum.\"},{\"verse\":7,\"text\":\"Fulgebunt justi et tamquam scintillæ in arundineto discurrent.\"},{\"verse\":8,\"text\":\"Judicabunt nationes, et dominabuntur populis, et regnabit Dominus illorum in perpetuum.\"},{\"verse\":9,\"text\":\"Qui confidunt in illo intelligent veritatem, et fideles in dilectione acquiescent illi, quoniam donum et pax est electis ejus.\"},{\"verse\":10,\"text\":\"Impii autem secundum quæ cogitaverunt correptionem habebunt : qui neglexerunt justum, et a Domino recesserunt.\"},{\"verse\":11,\"text\":\"Sapientiam enim et disciplinam qui abjicit infelix est : et vacua est spes illorum, et labores sine fructu, et inutilia opera eorum.\"},{\"verse\":12,\"text\":\"Mulieres eorum insensatæ sunt, et nequissimi filii eorum.\"},{\"verse\":13,\"text\":\"Maledicta creatura eorum, quoniam felix est sterilis ; et incoinquinata, quæ nescivit thorum in delicto, habebit fructum in respectione animarum sanctarum ;\"},{\"verse\":14,\"text\":\"et spado qui non operatus est per manus suas iniquitatem, nec cogitavit adversus Deum nequissima : dabitur enim illi fidei donum electum, et sors in templo Dei acceptissima.\"},{\"verse\":15,\"text\":\"Bonorum enim laborum gloriosus est fructus, et quæ non concidat radix sapientiæ.\"},{\"verse\":16,\"text\":\"Filii autem adulterorum in inconsummatione erunt, et ab iniquo thoro semen exterminabitur.\"},{\"verse\":17,\"text\":\"Et si quidem longæ vitæ erunt, in nihilum computabuntur, et sine honore erit novissima senectus illorum :\"},{\"verse\":18,\"text\":\"et si celerius defuncti fuerint, non habebunt spem, nec in die agnitionis allocutionem.\"},{\"verse\":19,\"text\":\"Nationis enim iniquæ diræ sunt consummationes.\"}],\"summary\":\"The happiness of the just: and the unhappiness of the wicked.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":2,\"label\":\"Wisdom 2\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":4,\"label\":\"Wisdom 4\"}}]]\n"])</script></body></html>
