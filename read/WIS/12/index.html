[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">12</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/WIS/">About <!-- -->Wisdom</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God’s wisdom and mercy in his proceedings with the Chanaanites.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>O how good and sweet is thy Spirit, O Lord, in all things!</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And therefore thou chastisest them that err, by little and little: and admonishest them, and speakest to them, concerning the things wherein they offend: that leaving their wickedness, they may believe in thee, O Lord.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For those ancient inhabitants of thy holy land, whom thou didst abhor,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Because they did works hateful to thee by their sorceries, and wicked sacrifices,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And those merciless murderers of their own children, and eaters of men’s bowels, and devourers of blood from the midst of thy consecration,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And those parents sacrificing with their own hands helpless souls, it was thy will to destroy by the hands of our parents,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That the land which of all is most dear to thee, might receive a worthy colony of the children of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Yet even those thou sparedst as men, and didst send wasps forerunners of thy host, to destroy them by little and little.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Not that thou wast unable to bring the wicked under the just by war, or by cruel beasts, or with one rough word to destroy them at once:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But executing thy judgments by degrees, thou gavest them place of repentance, not being ignorant that they were a wicked generation, and their malice natural, and that their thought could never be changed.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For it was a cursed seed from the beginning: neither didst thou for fear of any one give pardon to their sins.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For who shall say to thee: What hast thou done? or who shall withstand thy judgment? or who shall come before thee to be a revenger of wicked men? or who shall accuse thee, if the nations perish, which thou hast made?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For there is no other God but thou, who hast care of all, that thou shouldst shew that thou dost not give judgment unjustly.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Neither shall king, nor tyrant, in thy sight inquire about them whom thou hast destroyed.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For so much then, as thou art just, thou orderest all things justly: thinking it not agreeable to the power, to condemn him who deserveth not to be punished.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For thy power is the beginning of justice: and because thou art Lord of all, thou makest thyself gracious to all.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For thou shewest thy power, when men will not believe thee to be absolute in power, and thou convincest the boldness of them that know thee not.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But thou being master of power, judgest with tranquillity, and with great favour disposest of us: for thy power is at hand when thou wilt.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But thou hast taught thy people by such works, that they must be just and humane, and hast made thy children to be of a good hope: because in judging, thou givest place for repentance for sins.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For if thou didst punish the enemies of thy servants, and that deserved to die, with so great deliberation, giving them time and place whereby they might be changed from their wickedness:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>With what circumspection hast thou judged thy own children, to whose parents thou hast sworn, and made covenants of good promises?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Therefore whereas thou chastisest us, thou scourgest our enemies very many ways, to the end that when we judge we may think on thy goodness: and when we are judged, we may hope for thy mercy.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Wherefore thou hast also greatly tormented them, who, in their life, have lived foolishly and unjustly, by the same things which they worshipped.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For they went astray for a long time in the ways of error, holding those things for gods which are the most worthless among beasts, living after the manner of children without understanding.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Therefore thou hast sent a judgment upon them, as senseless children, to mock them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But they that were not amended by mockeries and reprehensions, experienced the worthy judgment of God.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For seeing, with indignation, that they suffered by those very things which they took for gods, when they were destroyed by the same, they acknowledged him the true God, whom in time past they denied that they knew: for which cause the end also of their condemnation came upon them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>O quam bonus et suavis est, Domine, spiritus tuus in omnibus !</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ideoque eos qui exerrant partibus corripis, et de quibus peccant admones et alloqueris, ut relicta malitia credant in te, Domine.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Illos enim antiquos inhabitatores terræ sanctæ tuæ, quos exhorruisti,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>quoniam odibilia opera tibi faciebant per medicamina et sacrificia injusta,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et filiorum suorum necatores sine misericordia, et comestores viscerum hominum, et devoratores sanguinis a medio sacramento tuo,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et auctores parentes animarum inauxiliatarum, perdere voluisti per manus parentum nostrorum :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ut dignam perciperent peregrinationem puerorum Dei, quæ tibi omnium carior est terra.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sed et his tamquam hominibus pepercisti, et misisti antecessores exercitus tui vespas, ut illos paulatim exterminarent.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Non quia impotens eras in bello subjicere impios justis, aut bestiis sævis, aut verbo duro simul exterminare :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>sed partibus judicans, dabas locum pœnitentiæ, non ignorans quoniam nequam est natio eorum, et naturalis malitia ipsorum, et quoniam non poterat mutari cogitatio illorum in perpetuum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Semen enim erat maledictum ab initio ; nec timens aliquem, veniam dabas peccatis illorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quis enim dicet tibi : Quid fecisti ? aut quis stabit contra judicium tuum ? aut quis in conspectu tuo veniet vindex iniquorum hominum ? aut quis tibi imputabit, si perierint nationes quas tu fecisti ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Non enim est alius deus quam tu, cui cura est de omnibus, ut ostendas quoniam non injuste judicas judicium.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Neque rex, neque tyrannus in conspectu tuo inquirent de his quos perdidisti.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cum ergo sis justus, juste omnia disponis ; ipsum quoque qui non debet puniri, condemnare, exterum æstimas a tua virtute.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Virtus enim tua justitiæ initium est, et ob hoc quod Dominus es, omnibus te parcere facis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Virtutem enim ostendis tu, qui non crederis esse in virtute consummatus, et horum qui te nesciunt audaciam traducis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Tu autem dominator virtutis, cum tranquillitate judicas, et cum magna reverentia disponis nos : subest enim tibi, cum volueris posse.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Docuisti autem populum tuum per talia opera, quoniam oportet justum esse et humanum ; et bonæ spei fecisti filios tuos, quoniam judicans das locum in peccatis pœnitentiæ.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si enim inimicos servorum tuorum, et debitos morti, cum tanta cruciasti attentione, dans tempus et locum per quæ possent mutari a malitia :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>cum quanta diligentia judicasti filios tuos, quorum parentibus juramenta et conventiones dedisti bonarum promissionum !</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cum ergo das nobis disciplinam, inimicos nostros multipliciter flagellas, ut bonitatem tuam cogitemus judicantes, et cum de nobis judicatur, speremus misericordiam tuam.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Unde et illis qui in vita sua insensate et injuste vixerunt, per hæc quæ coluerunt dedisti summa tormenta.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Etenim in erroris via diutius erraverunt, deos æstimantes hæc quæ in animalibus sunt supervacua, infantium insensatorum more viventes.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Propter hoc tamquam pueris insensatis judicium in derisum dedisti.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Qui autem ludibriis et increpationibus non sunt correcti, dignum Dei judicium experti sunt.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>In quibus enim patientes indignabantur per hæc quos putabant deos, in ipsis cum exterminarentur videntes, illum quem olim negabant se nosse, verum Deum agnoverunt ; propter quod et finis condemnationis eorum venit super illos.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 11</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/13/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 13</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->12<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Wisdom 11" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border bo ble/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.12\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":12,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"O how good and sweet is thy Spirit, O Lord, in all things!\"},{\"verse\":2,\"text\":\"And therefore thou chastisest them that err, by little and little: and admonishest them, and speakest to them, concerning the things wherein they offend: that leaving their wickedness, they may believe in thee, O Lord.\"},{\"verse\":3,\"text\":\"For those ancient inhabitants of thy holy land, whom thou didst abhor,\"},{\"verse\":4,\"text\":\"Because they did works hateful to thee by their sorceries, and wicked sacrifices,\"},{\"verse\":5,\"text\":\"And those merciless murderers of their own children, and eaters of men’s bowels, and devourers of blood from the midst of thy consecration,\"},{\"verse\":6,\"text\":\"And those parents sacrificing with their own hands helpless souls, it was thy will to destroy by the hands of our parents,\"},{\"verse\":7,\"text\":\"That the land which of all is most dear to thee, might receive a worthy colony of the children of God.\"},{\"verse\":8,\"text\":\"Yet even those thou sparedst as men, and didst send wasps forerunners of thy host, to destroy them by little and little.\"},{\"verse\":9,\"text\":\"Not that thou wast unable to bring the wicked under the just by war, or by cruel beasts, or with one rough word to destroy them at once:\"},{\"verse\":10,\"text\":\"But executing thy judgments by degrees, thou gavest them place of repentance, not being ignorant that they were a wicked generation, and their malice natural, and that their thought could never be changed.\"},{\"verse\":11,\"text\":\"For it was a cursed seed from the beginning: neither didst thou for fear of any one give pardon to their sins.\"},{\"verse\":12,\"text\":\"For who shall say to thee: What hast thou done? or who shall withstand thy judgment? or who shall come before thee to be a revenger of wicked men? or who shall accuse thee, if the nations perish, which thou hast made?\"},{\"verse\":13,\"text\":\"For there is no other God but thou, who hast care of all, that thou shouldst shew that thou dost not give judgment unjustly.\"},{\"verse\":14,\"text\":\"Neither shall king, nor tyrant, in thy sight inquire about them whom thou hast destroyed.\"},{\"verse\":15,\"text\":\"For so much then, as thou art just, thou orderest all things justly: thinking it not agreeable to the power, to condemn him who deserveth not to be punished.\"},{\"verse\":16,\"text\":\"For thy power is the beginning of justice: and because thou art Lord of all, thou makest thyself gracious to all.\"},{\"verse\":17,\"text\":\"For thou shewest thy power, when men will not believe thee to be absolute in power, and thou convincest the boldness of them that know thee not.\"},{\"verse\":18,\"text\":\"But thou being master of power, judgest with tranquillity, and with great favour disposest of us: for thy power is at hand when thou wilt.\"},{\"verse\":19,\"text\":\"But thou hast taught thy people by such works, that they must be just and humane, and hast made thy children to be of a good hope: because in judging, thou givest place for repentance for sins.\"},{\"verse\":20,\"text\":\"For if thou didst punish the enemies of thy servants, and that deserved to die, with so great deliberation, giving them time and place whereby they might be changed from their wickedness:\"},{\"verse\":21,\"text\":\"With what circumspection hast thou judged thy own children, to whose parents thou hast sworn, and made covenants of good promises?\"},{\"verse\":22,\"text\":\"Therefore whereas thou chastisest us, thou scourgest our enemies very many ways, to the end that when we judge we may think on thy goodness: and when we are judged, we may hope for thy mercy.\"},{\"verse\":23,\"text\":\"Wherefore thou hast also greatly tormented them, who, in their life, have lived foolishly and unjustly, by the same things which they worshipped.\"},{\"verse\":24,\"text\":\"For they went astray for a long time in the ways of error, holding those things for gods which are the most worthless among beasts, living after the manner of children without understanding.\"},{\"verse\":25,\"text\":\"Therefore thou hast sent a judgment upon them, as senseless children, to mock them.\"},{\"verse\":26,\"text\":\"But they that were not amended by mockeries and reprehensions, experienced the worthy judgment of God.\"},{\"verse\":27,\"text\":\"For seeing, with indignation, that they suffered by those very things which they took for gods, when they were destroyed by the same, they acknowledged him the true God, whom in time past they denied that they knew: for which cause the end also of their condemnation came upon them.\"}],\"vul\":[{\"verse\":1,\"text\":\"O quam bonus et suavis est, Domine, spiritus tuus in omnibus !\"},{\"verse\":2,\"text\":\"Ideoque eos qui exerrant partibus corripis, et de quibus peccant admones et alloqueris, ut relicta malitia credant in te, Domine.\"},{\"verse\":3,\"text\":\"Illos enim antiquos inhabitatores terræ sanctæ tuæ, quos exhorruisti,\"},{\"verse\":4,\"text\":\"quoniam odibilia opera tibi faciebant per medicamina et sacrificia injusta,\"},{\"verse\":5,\"text\":\"et filiorum suorum necatores sine misericordia, et comestores viscerum hominum, et devoratores sanguinis a medio sacramento tuo,\"},{\"verse\":6,\"text\":\"et auctores parentes animarum inauxiliatarum, perdere voluisti per manus parentum nostrorum :\"},{\"verse\":7,\"text\":\"ut dignam perciperent peregrinationem puerorum Dei, quæ tibi omnium carior est terra.\"},{\"verse\":8,\"text\":\"Sed et his tamquam hominibus pepercisti, et misisti antecessores exercitus tui vespas, ut illos paulatim exterminarent.\"},{\"verse\":9,\"text\":\"Non quia impotens eras in bello subjicere impios justis, aut bestiis sævis, aut verbo duro simul exterminare :\"},{\"verse\":10,\"text\":\"sed partibus judicans, dabas locum pœnitentiæ, non ignorans quoniam nequam est natio eorum, et naturalis malitia ipsorum, et quoniam non poterat mutari cogitatio illorum in perpetuum.\"},{\"verse\":11,\"text\":\"Semen enim erat maledictum ab initio ; nec timens aliquem, veniam dabas peccatis illorum.\"},{\"verse\":12,\"text\":\"Quis enim dicet tibi : Quid fecisti ? aut quis stabit contra judicium tuum ? aut quis in conspectu tuo veniet vindex iniquorum hominum ? aut quis tibi imputabit, si perierint nationes quas tu fecisti ?\"},{\"verse\":13,\"text\":\"Non enim est alius deus quam tu, cui cura est de omnibus, ut ostendas quoniam non injuste judicas judicium.\"},{\"verse\":14,\"text\":\"Neque rex, neque tyrannus in conspectu tuo inquirent de his quos perdidisti.\"},{\"verse\":15,\"text\":\"Cum ergo sis justus, juste omnia disponis ; ipsum quoque qui non debet puniri, condemnare, exterum æstimas a tua virtute.\"},{\"verse\":16,\"text\":\"Virtus enim tua justitiæ initium est, et ob hoc quod Dominus es, omnibus te parcere facis.\"},{\"verse\":17,\"text\":\"Virtutem enim ostendis tu, qui non crederis esse in virtute consummatus, et horum qui te nesciunt audaciam traducis.\"},{\"verse\":18,\"text\":\"Tu autem dominator virtutis, cum tranquillitate judicas, et cum magna reverentia disponis nos : subest enim tibi, cum volueris posse.\"},{\"verse\":19,\"text\":\"Docuisti autem populum tuum per talia opera, quoniam oportet justum esse et humanum ; et bonæ spei fecisti filios tuos, quoniam judicans das locum in peccatis pœnitentiæ.\"},{\"verse\":20,\"text\":\"Si enim inimicos servorum tuorum, et debitos morti, cum tanta cruciasti attentione, dans tempus et locum per quæ possent mutari a malitia :\"},{\"verse\":21,\"text\":\"cum quanta diligentia judicasti filios tuos, quorum parentibus juramenta et conventiones dedisti bonarum promissionum !\"},{\"verse\":22,\"text\":\"Cum ergo das nobis disciplinam, inimicos nostros multipliciter flagellas, ut bonitatem tuam cogitemus judicantes, et cum de nobis judicatur, speremus misericordiam tuam.\"},{\"verse\":23,\"text\":\"Unde et illis qui in vita sua insensate et injuste vixerunt, per hæc quæ coluerunt dedisti summa tormenta.\"},{\"verse\":24,\"text\":\"Etenim in erroris via diutius erraverunt, deos æstimantes hæc quæ in animalibus sunt supervacua, infantium insensatorum more viventes.\"},{\"verse\":25,\"text\":\"Propter hoc tamquam pueris insensatis judicium in derisum dedisti.\"},{\"verse\":26,\"text\":\"Qui autem ludibriis et increpationibus non sunt correcti, dignum Dei judicium experti sunt.\"},{\"verse\":27,\"text\":\"In quibus enim patientes indignabantur per hæc quos putabant deos, in ipsis cum exterminarentur videntes, illum quem olim negabant se nosse, verum Deum agnoverunt ; propter quod et finis condemnationis eorum venit super illos.\"}],\"summary\":\"God’s wisdom and mercy in his proceedings with the Chanaanites.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":11,\"label\":\"Wisdom 11\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":13,\"label\":\"Wisdom 13\"}}]]\n"])</script></body></html>
