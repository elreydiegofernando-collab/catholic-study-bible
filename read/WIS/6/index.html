-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Wisdom is better than strength: and a wise man is better than a strong man.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hear, therefore, ye kings, and understand, learn ye that are judges of the ends of the earth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Give ear, you that rule the people, and that please yourselves in multitudes of nations:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For power is given you by the Lord, and strength by the most High, who will examine your works: and search out your thoughts:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Because being ministers of his kingdom, you have not judged rightly, nor kept the law of justice, nor walked according to the will of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Horribly and speedily will he appear to you: for a most severe judgment shall be for them that bear rule.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For to him that is little, mercy is granted: but the mighty shall be mightily tormented.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For God will not except any man’s person, neither will he stand in awe of any man’s greatness: for he made the little and the great, and he hath equally care of all.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But a greater punishment is ready for the more mighty.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>To you, therefore, O kings, are these my words, that you may learn wisdom, and not fall from it.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For they that have kept just things justly, shall be justified: and they that have learned these things, shall find what to answer.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Covet ye, therefore, my words, and love them, and you shall have instruction.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Wisdom is glorious, and never fadeth away, and is easily seen by them that love her, and is found by them that seek her.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>She preventeth them that covet her, so that she first sheweth herself unto them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He that awaketh early to seek her, shall not labour: for he shall find her sitting at his door.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>To think, therefore, upon her, is perfect understanding: and he that watcheth for her, shall quickly be secure.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For she goeth about seeking such as are worthy of her, and she sheweth herself to them cheerfully in the ways, and meeteth them with all providence.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For the beginning of her is the most true desire of discipline.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the care of discipline is love: and love is the keeping of her laws: and the keeping of her laws is the firm foundation of incorruption:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And incorruption bringeth near to God.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Therefore the desire of wisdom bringeth to the everlasting kingdom.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>If then your delight be in thrones, and sceptres, O ye kings of the people, love wisdom, that you may reign for ever.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Love the light of wisdom, all ye that bear rule over peoples.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Now what wisdom is, and what was her origin, I will declare: and I will not hide from you the mysteries of God, but will seek her out from the beginning of her birth, and bring the knowledge of her to light, and will not pass over the truth:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Neither will I go with consuming envy: for such a man shall not be partaker of wisdom.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Now the multitude of the wise is the welfare of the whole world: and a wise king is the upholding of the people.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Receive, therefore, instruction by my words, and it shall be profitable to you.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Melior est sapientia quam vires, et vir prudens quam fortis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Audite ergo, reges, et intelligite ; discite, judices finium terræ.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Præbete aures, vos qui continetis multitudines, et placetis vobis in turbis nationum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Quoniam data est a Domino potestas vobis, et virtus ab Altissimo : qui interrogabit opera vestra, et cogitationes scrutabitur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quoniam cum essetis ministri regni illius, non recte judicastis, nec custodistis legem justitiæ, neque secundum voluntatem Dei ambulastis.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Horrende et cito apparebit vobis, quoniam judicium durissimum his qui præsunt fiet.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Exiguo enim conceditur misericordia ; potentes autem potenter tormenta patientur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Non enim subtrahet personam cujusquam Deus, nec verebitur magnitudinem ejus cujusquam, quoniam pusillum et magnum ipse fecit, et æqualiter cura est illi de omnibus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Fortioribus autem fortior instat cruciatio.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ad vos ergo, reges, sunt hi sermones mei : ut discatis sapientiam, et non excidatis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Qui enim custodierint justa juste, justificabuntur ; et qui didicerint ista, invenient quid respondeant.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Concupiscite ergo sermones meos ; diligite illos, et habebitis disciplinam.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Clara est, et quæ numquam marcescit, sapientia : et facile videtur ab his qui diligunt eam, et invenitur ab his qui quærunt illam.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Præoccupat qui se concupiscunt, ut illis se prior ostendat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Qui de luce vigilaverit ad illam non laborabit ; assidentem enim illam foribus suis inveniet.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cogitare ergo de illa sensus est consummatus, et qui vigilaverit propter illam cito securus erit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quoniam dignos se ipsa circuit quærens, et in viis ostendit se hilariter, et in omni providentia occurrit illis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Initium enim illius verissima est disciplinæ concupiscentia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cura ergo disciplinæ dilectio est, et dilectio custodia legum illius est ; custoditio autem legum consummatio incorruptionis est ;</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>incorruptio autem facit esse proximum Deo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Concupiscentia itaque sapientiæ deducit ad regnum perpetuum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Si ergo delectamini sedibus et sceptris, o reges populi, diligite sapientiam, ut in perpetuum regnetis :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>diligite lumen sapientiæ, omnes qui præestis populis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Quid est autem sapientia, et quemadmodum facta sit, referam, et non abscondam a vobis sacramenta Dei : sed ab initio nativitatis investigabo, et ponam in lucem scientiam illius, et non præteribo veritatem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Neque cum invidia tabescente iter habebo, quoniam talis homo non erit particeps sapientiæ.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Multitudo autem sapientium sanitas est orbis terrarum, et rex sapiens stabilimentum populi est.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ergo accipite disciplinam per sermones meos, et proderit vobis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/7/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 7</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border \"To you, therefore, O kings, are these my words, that you may learn wisdom, and not fall from it.\"},{\"verse\":11,\"text\":\"For they that have kept just things justly, shall be justified: and they that have learned these things, shall find what to answer.\"},{\"verse\":12,\"text\":\"Covet ye, therefore, my words, and love them, and you shall have instruction.\"},{\"verse\":13,\"text\":\"Wisdom is glorious, and never fadeth away, and is easily seen by them that love her, and is found by them that seek her.\"},{\"verse\":14,\"text\":\"She preventeth them that covet her, so that she first sheweth herself unto them.\"},{\"verse\":15,\"text\":\"He that awaketh early to seek her, shall not labour: for he shall find her sitting at his door.\"},{\"verse\":16,\"text\":\"To think, therefore, upon her, is perfect understanding: and he that watcheth for her, shall quickly be secure.\"},{\"verse\":17,\"text\":\"For she goeth about seeking such as are worthy of her, and she sheweth herself to them cheerfully in the ways, and meeteth them with all providence.\"},{\"verse\":18,\"text\":\"For the beginning of her is the most true desire of discipline.\"},{\"verse\":19,\"text\":\"And the care of discipline is love: and love is the keeping of her laws: and the keeping of her laws is the firm foundation of incorruption:\"},{\"verse\":20,\"text\":\"And incorruption bringeth near to God.\"},{\"verse\":21,\"text\":\"Therefore the desire of wisdom bringeth to the everlasting kingdom.\"},{\"verse\":22,\"text\":\"If then your delight be in thrones, and sceptres, O ye kings of the people, love wisdom, that you may reign for ever.\"},{\"verse\":23,\"text\":\"Love the light of wisdom, all ye that bear rule over peoples.\"},{\"verse\":24,\"text\":\"Now what wisdom is, and what was her origin, I will declare: and I will not hide from you the mysteries of God, but will seek her out from the beginning of her birth, and bring the knowledge of her to light, and will not pass over the truth:\"},{\"verse\":25,\"text\":\"Neither will I go with consuming envy: for such a man shall not be partaker of wisdom.\"},{\"verse\":26,\"text\":\"Now the multitude of the wise is the welfare of the whole world: and a wise king is the upholding of the people.\"},{\"verse\":27,\"text\":\"Receive, therefore, instruction by my words, and it shall be profitable to you.\"}],\"vul\":[{\"verse\":1,\"text\":\"Melior est sapientia quam vires, et vir prudens quam fortis.\"},{\"verse\":2,\"text\":\"Audite ergo, reges, et intelligite ; discite, judices finium terræ.\"},{\"verse\":3,\"text\":\"Præbete aures, vos qui continetis multitudines, et placetis vobis in turbis nationum.\"},{\"verse\":4,\"text\":\"Quoniam data est a Domino potestas vobis, et virtus ab Altissimo : qui interrogabit opera vestra, et cogitationes scrutabitur.\"},{\"verse\":5,\"text\":\"Quoniam cum essetis ministri regni illius, non recte judicastis, nec custodistis legem justitiæ, neque secundum voluntatem Dei ambulastis.\"},{\"verse\":6,\"text\":\"Horrende et cito apparebit vobis, quoniam judicium durissimum his qui præsunt fiet.\"},{\"verse\":7,\"text\":\"Exiguo enim conceditur misericordia ; potentes autem potenter tormenta patientur.\"},{\"verse\":8,\"text\":\"Non enim subtrahet personam cujusquam Deus, nec verebitur magnitudinem ejus cujusquam, quoniam pusillum et magnum ipse fecit, et æqualiter cura est illi de omnibus.\"},{\"verse\":9,\"text\":\"Fortioribus autem fortior instat cruciatio.\"},{\"verse\":10,\"text\":\"Ad vos ergo, reges, sunt hi sermones mei : ut discatis sapientiam, et non excidatis.\"},{\"verse\":11,\"text\":\"Qui enim custodierint justa juste, justificabuntur ; et qui didicerint ista, invenient quid respondeant.\"},{\"verse\":12,\"text\":\"Concupiscite ergo sermones meos ; diligite illos, et habebitis disciplinam.\"},{\"verse\":13,\"text\":\"Clara est, et quæ numquam marcescit, sapientia : et facile videtur ab his qui diligunt eam, et invenitur ab his qui quærunt illam.\"},{\"verse\":14,\"text\":\"Præoccupat qui se concupiscunt, ut illis se prior ostendat.\"},{\"verse\":15,\"text\":\"Qui de luce vigilaverit ad illam non laborabit ; assidentem enim illam foribus suis inveniet.\"},{\"verse\":16,\"text\":\"Cogitare ergo de illa sensus est consummatus, et qui vigilaverit propter illam cito securus erit.\"},{\"verse\":17,\"text\":\"Quoniam dignos se ipsa circuit quærens, et in viis ostendit se hilariter, et in omni providentia occurrit illis.\"},{\"verse\":18,\"text\":\"Initium enim illius verissima est disciplinæ concupiscentia.\"},{\"verse\":19,\"text\":\"Cura ergo disciplinæ dilectio est, et dilectio custodia legum illius est ; custoditio autem legum consummatio incorruptionis est ;\"},{\"verse\":20,\"text\":\"incorruptio autem facit esse proximum Deo.\"},{\"verse\":21,\"text\":\"Concupiscentia itaque sapientiæ deducit ad regnum perpetuum.\"},{\"verse\":22,\"text\":\"Si ergo delectamini sedibus et sceptris, o reges populi, diligite sapientiam, ut in perpetuum regnetis :\"},{\"verse\":23,\"text\":\"diligite lumen sapientiæ, omnes qui præestis populis.\"},{\"verse\":24,\"text\":\"Quid est autem sapientia, et quemadmodum facta sit, referam, et non abscondam a vobis sacramenta Dei : sed ab initio nativitatis investigabo, et ponam in lucem scientiam illius, et non præteribo veritatem.\"},{\"verse\":25,\"text\":\"Neque cum invidia tabescente iter habebo, quoniam talis homo non erit particeps sapientiæ.\"},{\"verse\":26,\"text\":\"Multitudo autem sapientium sanitas est orbis terrarum, et rex sapiens stabilimentum populi est.\"},{\"verse\":27,\"text\":\"Ergo accipite disciplinam per sermones meos, et proderit vobis.\"}],\"summary\":\"An address to princes to seek after wisdom: she is easily found by those that seek her.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":5,\"label\":\"Wisdom 5\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":7,\"label\":\"Wisdom 7\"}}]]\n"])</script></body></html>
