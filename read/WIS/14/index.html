><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">14</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The beginning of worshipping idols: and the effects thereof.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Again, another designing to sail, and beginning to make his voyage through the raging waves, calleth upon a piece of wood more frail than the wood that carrieth him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For this the desire of gain devised, and the workman built it by his skill.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But thy providence, O Father, governeth it: for thou hast made a way even in the sea, and a most sure path among the waves,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Shewing that thou art able to save out of all things, yea, though a man went to sea without art.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But that the works of thy wisdom might not be idle: therefore men also trust their lives even to a little wood, and passing over the sea by ship, are saved.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And from the beginning also, when the proud giants perished, the hope of the world fleeing to a vessel, which was governed by thy hand, left to the world seed of generation.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For blessed is the wood, by which justice cometh</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the idol that is made by hands, is cursed, as well it, as he that made it: he because he made it; and it because being frail it is called a god.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But to God the wicked and his wickedness are hateful alike.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For that which is made, together with him that made it, shall suffer torments.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Therefore there shall be no respect had even to the idols of the Gentiles: because the creatures of God are turned to an abomination, and a temptation to the souls of men, and a snare to the feet of the unwise.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For the beginning of fornication is the devising of idols: and the invention of them is the corruption of life.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For neither were they from the beginning, neither shall they be for ever.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For by the vanity of men they came into the world: and therefore they shall be found to come shortly to an end.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For a father being afflicted with bitter grief, made to himself the image of his son, who was quickly taken away: and him who then had died as a man, he began now to worship as a god, and appointed him rites and sacrifices among his servants.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then, in process of time, wicked custom prevailing, this error was kept as a law, and statues were worshipped by the commandment of tyrants.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And those whom men could not honour in presence, because they dwelt far off, they brought their resemblance from afar, and made an express image of the king, whom they had a mind to honour: that by this their diligence, they might honour as present, him that was absent.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And to the worshipping of these, the singular diligence also of the artificer helped to set forward the ignorant.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For he being willing to please him that employed him, laboured with all his art to make the resemblance in the best manner.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And the multitude of men, carried away by the beauty of the work, took him now for a god, that little before was but honoured as a man.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And this was the occasion of deceiving human life: for men serving either their affection, or their kings, gave the incommunicable name to stones and wood.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And it was not enough for them to err about the knowledge of God, but whereas they lived in a great war of ignorance, they call so many and so great evils peace.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For either they sacrifice their own children, or use hidden sacrifices, or keep watches full of madness,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>So that now they neither keep life, nor marriage undefiled, but one killeth another through envy, or grieveth him by adultery:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And all things are mingled together, blood, murder, theft, and dissimulation, corruption and unfaithfulness, tumults and perjury, disquieting of the good,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Forgetfulness of God, defiling of souls, changing of nature, disorder in marriage, and the irregularity of adultery and uncleanness.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For the worship of abominable idols is the cause, and the beginning and end of all evil.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For either they are mad when they are merry: or they prophesy lies, or they live unjustly, or easily forswear themselves.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For whilst they trust in idols, which are without life, though they swear amiss, they look not to be hurt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>But for both these things they shall be justly punished, because they have thought not well of God, giving heed to idols, and have sworn unjustly, in guile despising justice.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>For it is not the power of them, by whom they swear, but the just vengeance of sinners always punisheth the transgression of the unjust.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Iterum alius navigare cogitans, et per feros fluctus iter facere incipiens, ligno portante se, fragilius lignum invocat.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Illud enim cupiditas acquirendi excogitavit, et artifex sapientia fabricavit sua.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Tua autem, Pater, providentia gubernat : quoniam dedisti et in mari viam, et inter fluctus semitam firmissimam,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ostendens quoniam potens es ex omnibus salvare, etiam si sine arte aliquis adeat mare.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sed ut non essent vacua sapientiæ tuæ opera, propter hoc etiam et exiguo ligno credunt homines animas suas, et transeuntes mare per ratem liberati sunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sed et ab initio cum perirent superbi gigantes, spes orbis terrarum ad ratem confugiens, remisit sæculo semen nativitatis quæ manu tua erat gubernata.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Benedictum est enim lignum per quod fit justitia ;</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>per manus autem quod fit idolum, maledictum est et ipsum, et qui fecit illud : quia ille quidem operatus est, illud autem cum esset fragile, deus cognominatus est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Similiter autem odio sunt Deo impius et impietas ejus ;</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>etenim quod factum est, cum illo qui fecit tormenta patietur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Propter hoc et in idolis nationum non erit respectus, quoniam creaturæ Dei in odium factæ sunt, et in tentationem animabus hominum, et in muscipulam pedibus insipientium.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Initium enim fornicationis est exquisitio idolorum, et adinventio illorum corruptio vitæ est :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>neque enim erant ab initio, neque erunt in perpetuum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Supervacuitas enim hominum hæc advenit in orbem terrarum, et ideo brevis illorum finis est inventus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Acerbo enim luctu dolens pater, cito sibi rapti filii fecit imaginem ; et illum qui tunc quasi homo mortuus fuerat, nunc tamquam deum colere cœpit, et constituit inter servos suos sacra et sacrificia.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Deinde interveniente tempore, convalescente iniqua consuetudine, hic error tamquam lex custoditus est, et tyrannorum imperio colebantur figmenta.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et hos quos in palam homines honorare non poterant propter hoc quod longe essent, e longinquo figura eorum allata, evidentem imaginem regis quem honorare volebant fecerunt, ut illum qui aberat, tamquam præsentem colerent sua sollicitudine.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Provexit autem ad horum culturam et hos qui ignorabant artificis eximia diligentia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ille enim, volens placere illi qui se assumpsit, elaboravit arte sua ut similitudinem in melius figuraret.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Multitudo autem hominum, abducta per speciem operis, eum qui ante tempus tamquam homo honoratus fuerat, nunc deum æstimaverunt.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et hæc fuit vitæ humanæ deceptio, quoniam aut affectui aut regibus deservientes homines, incommunicabile nomen lapidibus et lignis imposuerunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et non suffecerat errasse eos circa Dei scientiam, sed et in magno viventes inscientiæ bello, tot et tam magna mala pacem appellant.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Aut enim filios suos sacrificantes, aut obscura sacrificia facientes, aut insaniæ plenas vigilias habentes,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>neque vitam, neque nuptias mundas jam custodiunt : sed alius alium per invidiam occidit, aut adulterans contristat,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et omnia commista sunt : sanguis, homicidium, furtum et fictio, corruptio et infidelitas, turbatio et perjurium, tumultus bonorum,</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dei immemoratio, animarum inquinatio, nativitatis immutatio, nuptiarum inconstantia, inordinatio mœchiæ et impudicitiæ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Infandorum enim idolorum cultura omnis mali causa est, et initium et finis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Aut enim dum lætantur insaniunt, aut certe vaticinantur falsa, aut vivunt injuste, aut pejerant cito.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dum enim confidunt in idolis quæ sine anima sunt, male jurantes noceri se non sperant.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Utraque ergo illis evenient digne, quoniam male senserunt de Deo, attendentes idolis, et juraverunt injuste, in dolo contemnentes justitiam.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Non enim juratorum virtus, sed peccantium pœna, perambulat semper injustorum prævaricationem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 13</span></span>< ,[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"WIS.14\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":14,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"Again, another designing to sail, and beginning to make his voyage through the raging waves, calleth upon a piece of wood more frail than the wood that carrieth him.\"},{\"verse\":2,\"text\":\"For this the desire of gain devised, and the workman built it by his skill.\"},{\"verse\":3,\"text\":\"But thy providence, O Father, governeth it: for thou hast made a way even in the sea, and a most sure path among the waves,\"},{\"verse\":4,\"text\":\"Shewing that thou art able to save out of all things, yea, though a man went to sea without art.\"},{\"verse\":5,\"text\":\"But that the works of thy wisdom might not be idle: therefore men also trust their lives even to a little wood, and passing over the sea by ship, are saved.\"},{\"verse\":6,\"text\":\"And from the beginning also, when the proud giants perished, the hope of the world fleeing to a vessel, which was governed by thy hand, left to the world seed of generation.\"},{\"verse\":7,\"text\":\"For blessed is the wood, by which justice cometh\"},{\"verse\":8,\"text\":\"But the idol that is made by hands, is cursed, as well it, as he that made it: he because he made it; and it because being frail it is called a god.\"},{\"verse\":9,\"text\":\"But to God the wicked and his wickedness are hateful alike.\"},{\"verse\":10,\"text\":\"For that which is made, together with him that made it, shall suffer torments.\"},{\"verse\":11,\"text\":\"Therefore there shall be no respect had even to the idols of the Gentiles: because the creatures of God are turned to an abomination, and a temptation to the souls of men, and a snare to the feet of the unwise.\"},{\"verse\":12,\"text\":\"For the beginning of fornication is the devising of idols: and the invention of them is the corruption of life.\"},{\"verse\":13,\"text\":\"For neither were they from the beginning, neither shall they be for ever.\"},{\"verse\":14,\"text\":\"For by the vanity of men they came into the world: and therefore they shall be found to come shortly to an end.\"},{\"verse\":15,\"text\":\"For a father being afflicted with bitter grief, made to himself the image of his son, who was quickly taken away: and him who then had died as a man, he began now to worship as a god, and appointed him rites and sacrifices among his servants.\"},{\"verse\":16,\"text\":\"Then, in process of time, wicked custom prevailing, this error was kept as a law, and statues were worshipped by the commandment of tyrants.\"},{\"verse\":17,\"text\":\"And those whom men could not honour in presence, because they dwelt far off, they brought their resemblance from afar, and made an express image of the king, whom they had a mind to honour: that by this their diligence, they might honour as present, him that was absent.\"},{\"verse\":18,\"text\":\"And to the worshipping of these, the singular diligence also of the artificer helped to set forward the ignorant.\"},{\"verse\":19,\"text\":\"For he being willing to please him that employed him, laboured with all his art to make the resemblance in the best manner.\"},{\"verse\":20,\"text\":\"And the multitude of men, carried away by the beauty of the work, took him now for a god, that little before was but honoured as a man.\"},{\"verse\":21,\"text\":\"And this was the occasion of deceiving human life: for men serving either their affection, or their kings, gave the incommunicable name to stones and wood.\"},{\"verse\":22,\"text\":\"And it was not enough for them to err about the knowledge of God, but whereas they lived in a great war of ignorance, they call so many and so great evils peace.\"},{\"verse\":23,\"text\":\"For either they sacrifice their own children, or use hidden sacrifices, or keep watches full of madness,\"},{\"verse\":24,\"text\":\"So that now they neither keep life, nor marriage undefiled, but one killeth another through envy, or grieveth him by adultery:\"},{\"verse\":25,\"text\":\"And all things are mingled together, blood, murder, theft, and dissimulation, corruption and unfaithfulness, tumults and perjury, disquieting of the good,\"},{\"verse\":26,\"text\":\"Forgetfulness of God, defiling of souls, changing of nature, disorder in marriage, and the irregularity of adultery and uncleanness.\"},{\"verse\":27,\"text\":\"For the worship of abominable idols is the cause, and the beginning and end of all evil.\"},{\"verse\":28,\"text\":\"For either they are mad when they are merry: or they prophesy lies, or they live unjustly, or easily forswear themselves.\"},{\"verse\":29,\"text\":\"For whilst they trust in idols, which are without life, though they swear amiss, they look not to be hurt.\"},{\"verse\":30,\"text\":\"But for both these things they shall be justly punished, because they have thought not well of God, giving heed to idols, and have sworn unjustly, in guile despising justice.\"},{\"verse\":31,\"text\":\"For it is not the power of them, by whom they swear, but the just vengeance of sinners always punisheth the transgression of the unjust.\"}],\"vul\":[{\"verse\":1,\"text\":\"Iterum alius navigare cogitans, et per feros fluctus iter facere incipiens, ligno portante se, fragilius lignum invocat.\"},{\"verse\":2,\"text\":\"Illud enim cupiditas acquirendi excogitavit, et artifex sapientia fabricavit sua.\"},{\"verse\":3,\"text\":\"Tua autem, Pater, providentia gubernat : quoniam dedisti et in mari viam, et inter fluctus semitam firmissimam,\"},{\"verse\":4,\"text\":\"ostendens quoniam potens es ex omnibus salvare, etiam si sine arte aliquis adeat mare.\"},{\"verse\":5,\"text\":\"Sed ut non essent vacua sapientiæ tuæ opera, propter hoc etiam et exiguo ligno credunt homines animas suas, et transeuntes mare per ratem liberati sunt.\"},{\"verse\":6,\"text\":\"Sed et ab initio cum perirent superbi gigantes, spes orbis terrarum ad ratem confugiens, remisit sæculo semen nativitatis quæ manu tua erat gubernata.\"},{\"verse\":7,\"text\":\"Benedictum est enim lignum per quod fit justitia ;\"},{\"verse\":8,\"text\":\"per manus autem quod fit idolum, maledictum est et ipsum, et qui fecit illud : quia ille quidem operatus est, illud autem cum esset fragile, deus cognominatus est.\"},{\"verse\":9,\"text\":\"Similiter autem odio sunt Deo impius et impietas ejus ;\"},{\"verse\":10,\"text\":\"etenim quod factum est, cum illo qui fecit tormenta patietur.\"},{\"verse\":11,\"text\":\"Propter hoc et in idolis nationum non erit respectus, quoniam creaturæ Dei in odium factæ sunt, et in tentationem animabus hominum, et in muscipulam pedibus insipientium.\"},{\"verse\":12,\"text\":\"Initium enim fornicationis est exquisitio idolorum, et adinventio illorum corruptio vitæ est :\"},{\"verse\":13,\"text\":\"neque enim erant ab initio, neque erunt in perpetuum.\"},{\"verse\":14,\"text\":\"Supervacuitas enim hominum hæc advenit in orbem terrarum, et ideo brevis illorum finis est inventus.\"},{\"verse\":15,\"text\":\"Acerbo enim luctu dolens pater, cito sibi rapti filii fecit imaginem ; et illum qui tunc quasi homo mortuus fuerat, nunc tamquam deum colere cœpit, et constituit inter servos suos sacra et sacrificia.\"},{\"verse\":16,\"text\":\"Deinde interveniente tempore, convalescente iniqua consuetudine, hic error tamquam lex custoditus est, et tyrannorum imperio colebantur figmenta.\"},{\"verse\":17,\"text\":\"Et hos quos in palam homines honorare non poterant propter hoc quod longe essent, e longinquo figura eorum allata, evidentem imaginem regis quem honorare volebant fecerunt, ut illum qui aberat, tamquam præsentem colerent sua sollicitudine.\"},{\"verse\":18,\"text\":\"Provexit autem ad horum culturam et hos qui ignorabant artificis eximia diligentia.\"},{\"verse\":19,\"text\":\"Ille enim, volens placere illi qui se assumpsit, elaboravit arte sua ut similitudinem in melius figuraret.\"},{\"verse\":20,\"text\":\"Multitudo autem hominum, abducta per speciem operis, eum qui ante tempus tamquam homo honoratus fuerat, nunc deum æstimaverunt.\"},{\"verse\":21,\"text\":\"Et hæc fuit vitæ humanæ deceptio, quoniam aut affectui aut regibus deservientes homines, incommunicabile nomen lapidibus et lignis imposuerunt.\"},{\"verse\":22,\"text\":\"Et non suffecerat errasse eos circa Dei scientiam, sed et in magno viventes inscientiæ bello, tot et tam magna mala pacem appellant.\"},{\"verse\":23,\"text\":\"Aut enim filios suos sacrificantes, aut obscura sacrificia facientes, aut insaniæ plenas vigilias habentes,\"},{\"verse\":24,\"text\":\"neque vitam, neque nuptias mundas jam custodiunt : sed alius alium per invidiam occidit, aut adulterans contristat,\"},{\"verse\":25,\"text\":\"et omnia commista sunt : sanguis, homicidium, furtum et fictio, corruptio et infidelitas, turbatio et perjurium, tumultus bonorum,\"},{\"verse\":26,\"text\":\"Dei immemoratio, animarum inquinatio, nativitatis immutatio, nuptiarum inconstantia, inordinatio mœchiæ et impudicitiæ.\"},{\"verse\":27,\"text\":\"Infandorum enim idolorum cultura omnis mali causa est, et initium et finis.\"},{\"verse\":28,\"text\":\"Aut enim dum lætantur insaniunt, aut certe vaticinantur falsa, aut vivunt injuste, aut pejerant cito.\"},{\"verse\":29,\"text\":\"Dum enim confidunt in idolis quæ sine anima sunt, male jurantes noceri se non sperant.\"},{\"verse\":30,\"text\":\"Utraque ergo illis evenient digne, quoniam male senserunt de Deo, attendentes idolis, et juraverunt injuste, in dolo contemnentes justitiam.\"},{\"verse\":31,\"text\":\"Non enim juratorum virtus, sed peccantium pœna, perambulat semper injustorum prævaricationem.\"}],\"summary\":\"The beginning of worshipping idols: and the effects thereof.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":13,\"label\":\"Wisdom 13\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":15,\"label\":\"Wisdom 15\"}}]]\n"])</script></body></html>
