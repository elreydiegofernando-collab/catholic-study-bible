0 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">2</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The vain reasonings of the wicked: their persecuting the just, especially the Son of God.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For they have said, reasoning with themselves, but not right: The time of our life is short and tedious, and in the end of a man there is no remedy, and no man hath been known to have returned from hell:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For we are born of nothing, and after this we shall be as if we had not been: for the breath in our nostrils is smoke: and speech a spark to move our heart,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Which being put out, our body shall be ashes, and our spirit shall be poured abroad as soft air, and our life shall pass away as the trace of a cloud, and shall be dispersed as a mist, which is driven away by the beams of the sun, and overpowered with the heat thereof:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And our name in time shall be forgotten, and no man shall have any remembrance of our works.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For our time is as the passing of a shadow, and there is no going back of our end: for it is fast sealed, and no man returneth:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Come, therefore, and let us enjoy the good things that are present, and let us speedily use the creatures as in youth.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Let us fill ourselves with costly wine, and ointments: and let not the flower of the time pass by us.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Let us crown ourselves with roses, before they be withered: let no meadow escape our riot.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Let none of us go without his part in luxury: let us every where leave tokens of joy: for this is our portion, and this our lot.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Let us oppress the poor just man, and not spare the widow, nor honour the ancient grey hairs of the aged.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But let our strength be the law of justice: for that which is feeble is found to be nothing worth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Let us, therefore, lie in wait for the just, because he is not for our turn, and he is contrary to our doings, and upbraideth us with transgressions of the law, and divulgeth against us the sins of our way of life.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>He boasteth that he hath the knowledge of God, and calleth himself the son of God.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He is become a censurer of our thoughts.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>He is grievous unto us, even to behold: for his life is not like other men’s, and his ways are very different.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>We are esteemed by him as triflers, and he abstaineth from our ways as from filthiness, and he preferreth the latter end of the just, and glorieth that he hath God for his father.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Let us see then if his words be true, and let us prove what shall happen to him, and we shall know what his end shall be.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For if he be the true son of God, he will defend him, and will deliver him from the hands of his enemies.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Let us examine him by outrages and tortures, that we may know his meekness, and try his patience.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Let us condemn him to a most shameful death: for there shall be respect had unto him by his words.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>These things they thought, and were deceived: for their own malice blinded them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they knew not the secrets of God, nor hoped for the wages of justice, nor esteemed the honour of holy souls.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For God created man incorruptible, and to the image of his own likeness he made him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But by the envy of the devil, death came into the world:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And they follow him that are of his side.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dixerunt enim cogitantes apud se non recte : Exiguum et cum tædio est tempus vitæ nostræ, et non est refrigerium in fine hominis, et non est qui agnitus sit reversus ab inferis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Quia ex nihilo nati sumus, et post hoc erimus tamquam non fuerimus. Quoniam fumus flatus est in naribus nostris, et sermo scintilla ad commovendum cor nostrum :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>qua extincta, cinis erit corpus nostrum, et spiritus diffundetur tamquam mollis aër ; et transibit vita nostra tamquam vestigium nubis, et sicut nebula dissolvetur quæ fugata est a radiis solis, et a calore illius aggravata.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et nomen nostrum oblivionem accipiet per tempus, et nemo memoriam habebit operum nostrorum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Umbræ enim transitus est tempus nostrum, et non est reversio finis nostri : quoniam consignata est, et nemo revertitur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Venite ergo, et fruamur bonis quæ sunt, et utamur creatura tamquam in juventute celeriter.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Vino pretioso et unguentis nos impleamus, et non prætereat nos flos temporis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Coronemus nos rosis antequam marcescant ; nullum pratum sit quod non pertranseat luxuria nostra :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>nemo nostrum exsors sit luxuriæ nostræ. Ubique relinquamus signa lætitiæ, quoniam hæc est pars nostra, et hæc est sors.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Opprimamus pauperem justum, et non parcamus viduæ, nec veterani revereamur canos multi temporis :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>sit autem fortitudo nostra lex justitiæ ; quod enim infirmum est, inutile invenitur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Circumveniamus ergo justum, quoniam inutilis est nobis, et contrarius est operibus nostris, et improperat nobis peccata legis, et diffamat in nos peccata disciplinæ nostræ.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Promittit se scientiam Dei habere, et filium Dei se nominat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Factus est nobis in traductionem cogitationum nostrarum.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Gravis est nobis etiam ad videndum, quoniam dissimilis est aliis vita illius, et immutatæ sunt viæ ejus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tamquam nugaces æstimati sumus ab illo, et abstinet se a viis nostris tamquam ab immunditiis, et præfert novissima justorum, et gloriatur patrem se habere Deum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Videamus ergo si sermones illius veri sint, et tentemus quæ ventura sunt illi, et sciemus quæ erunt novissima illius.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Si enim est verus filius Dei, suscipiet illum, et liberabit eum de manibus contrariorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Contumelia et tormento interrogemus eum, ut sciamus reverentiam ejus, et probemus patientiam illius.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Morte turpissima condemnemus eum ; erit enim ei respectus ex sermonibus illius.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hæc cogitaverunt, et erraverunt : excæcavit enim illos malitia eorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et nescierunt sacramenta Dei : neque mercedem speraverunt justitiæ, nec judicaverunt honorem animarum sanctarum.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quoniam Deus creavit hominem inexterminabilem, et ad imaginem similitudinis suæ fecit illum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Invidia autem diaboli mors introivit in orbem terrarum :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>imitantur autem illum qui sunt ex parte illius.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Wisdom 1" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/1/"><svg viewBox="0 0 24 24" fill="none" stroke="cu "$L17\",\"WIS.2\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":2,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"For they have said, reasoning with themselves, but not right: The time of our life is short and tedious, and in the end of a man there is no remedy, and no man hath been known to have returned from hell:\"},{\"verse\":2,\"text\":\"For we are born of nothing, and after this we shall be as if we had not been: for the breath in our nostrils is smoke: and speech a spark to move our heart,\"},{\"verse\":3,\"text\":\"Which being put out, our body shall be ashes, and our spirit shall be poured abroad as soft air, and our life shall pass away as the trace of a cloud, and shall be dispersed as a mist, which is driven away by the beams of the sun, and overpowered with the heat thereof:\"},{\"verse\":4,\"text\":\"And our name in time shall be forgotten, and no man shall have any remembrance of our works.\"},{\"verse\":5,\"text\":\"For our time is as the passing of a shadow, and there is no going back of our end: for it is fast sealed, and no man returneth:\"},{\"verse\":6,\"text\":\"Come, therefore, and let us enjoy the good things that are present, and let us speedily use the creatures as in youth.\"},{\"verse\":7,\"text\":\"Let us fill ourselves with costly wine, and ointments: and let not the flower of the time pass by us.\"},{\"verse\":8,\"text\":\"Let us crown ourselves with roses, before they be withered: let no meadow escape our riot.\"},{\"verse\":9,\"text\":\"Let none of us go without his part in luxury: let us every where leave tokens of joy: for this is our portion, and this our lot.\"},{\"verse\":10,\"text\":\"Let us oppress the poor just man, and not spare the widow, nor honour the ancient grey hairs of the aged.\"},{\"verse\":11,\"text\":\"But let our strength be the law of justice: for that which is feeble is found to be nothing worth.\"},{\"verse\":12,\"text\":\"Let us, therefore, lie in wait for the just, because he is not for our turn, and he is contrary to our doings, and upbraideth us with transgressions of the law, and divulgeth against us the sins of our way of life.\"},{\"verse\":13,\"text\":\"He boasteth that he hath the knowledge of God, and calleth himself the son of God.\"},{\"verse\":14,\"text\":\"He is become a censurer of our thoughts.\"},{\"verse\":15,\"text\":\"He is grievous unto us, even to behold: for his life is not like other men’s, and his ways are very different.\"},{\"verse\":16,\"text\":\"We are esteemed by him as triflers, and he abstaineth from our ways as from filthiness, and he preferreth the latter end of the just, and glorieth that he hath God for his father.\"},{\"verse\":17,\"text\":\"Let us see then if his words be true, and let us prove what shall happen to him, and we shall know what his end shall be.\"},{\"verse\":18,\"text\":\"For if he be the true son of God, he will defend him, and will deliver him from the hands of his enemies.\"},{\"verse\":19,\"text\":\"Let us examine him by outrages and tortures, that we may know his meekness, and try his patience.\"},{\"verse\":20,\"text\":\"Let us condemn him to a most shameful death: for there shall be respect had unto him by his words.\"},{\"verse\":21,\"text\":\"These things they thought, and were deceived: for their own malice blinded them.\"},{\"verse\":22,\"text\":\"And they knew not the secrets of God, nor hoped for the wages of justice, nor esteemed the honour of holy souls.\"},{\"verse\":23,\"text\":\"For God created man incorruptible, and to the image of his own likeness he made him.\"},{\"verse\":24,\"text\":\"But by the envy of the devil, death came into the world:\"},{\"verse\":25,\"text\":\"And they follow him that are of his side.\"}],\"vul\":[{\"verse\":1,\"text\":\"Dixerunt enim cogitantes apud se non recte : Exiguum et cum tædio est tempus vitæ nostræ, et non est refrigerium in fine hominis, et non est qui agnitus sit reversus ab inferis.\"},{\"verse\":2,\"text\":\"Quia ex nihilo nati sumus, et post hoc erimus tamquam non fuerimus. Quoniam fumus flatus est in naribus nostris, et sermo scintilla ad commovendum cor nostrum :\"},{\"verse\":3,\"text\":\"qua extincta, cinis erit corpus nostrum, et spiritus diffundetur tamquam mollis aër ; et transibit vita nostra tamquam vestigium nubis, et sicut nebula dissolvetur quæ fugata est a radiis solis, et a calore illius aggravata.\"},{\"verse\":4,\"text\":\"Et nomen nostrum oblivionem accipiet per tempus, et nemo memoriam habebit operum nostrorum.\"},{\"verse\":5,\"text\":\"Umbræ enim transitus est tempus nostrum, et non est reversio finis nostri : quoniam consignata est, et nemo revertitur.\"},{\"verse\":6,\"text\":\"Venite ergo, et fruamur bonis quæ sunt, et utamur creatura tamquam in juventute celeriter.\"},{\"verse\":7,\"text\":\"Vino pretioso et unguentis nos impleamus, et non prætereat nos flos temporis.\"},{\"verse\":8,\"text\":\"Coronemus nos rosis antequam marcescant ; nullum pratum sit quod non pertranseat luxuria nostra :\"},{\"verse\":9,\"text\":\"nemo nostrum exsors sit luxuriæ nostræ. Ubique relinquamus signa lætitiæ, quoniam hæc est pars nostra, et hæc est sors.\"},{\"verse\":10,\"text\":\"Opprimamus pauperem justum, et non parcamus viduæ, nec veterani revereamur canos multi temporis :\"},{\"verse\":11,\"text\":\"sit autem fortitudo nostra lex justitiæ ; quod enim infirmum est, inutile invenitur.\"},{\"verse\":12,\"text\":\"Circumveniamus ergo justum, quoniam inutilis est nobis, et contrarius est operibus nostris, et improperat nobis peccata legis, et diffamat in nos peccata disciplinæ nostræ.\"},{\"verse\":13,\"text\":\"Promittit se scientiam Dei habere, et filium Dei se nominat.\"},{\"verse\":14,\"text\":\"Factus est nobis in traductionem cogitationum nostrarum.\"},{\"verse\":15,\"text\":\"Gravis est nobis etiam ad videndum, quoniam dissimilis est aliis vita illius, et immutatæ sunt viæ ejus.\"},{\"verse\":16,\"text\":\"Tamquam nugaces æstimati sumus ab illo, et abstinet se a viis nostris tamquam ab immunditiis, et præfert novissima justorum, et gloriatur patrem se habere Deum.\"},{\"verse\":17,\"text\":\"Videamus ergo si sermones illius veri sint, et tentemus quæ ventura sunt illi, et sciemus quæ erunt novissima illius.\"},{\"verse\":18,\"text\":\"Si enim est verus filius Dei, suscipiet illum, et liberabit eum de manibus contrariorum.\"},{\"verse\":19,\"text\":\"Contumelia et tormento interrogemus eum, ut sciamus reverentiam ejus, et probemus patientiam illius.\"},{\"verse\":20,\"text\":\"Morte turpissima condemnemus eum ; erit enim ei respectus ex sermonibus illius.\"},{\"verse\":21,\"text\":\"Hæc cogitaverunt, et erraverunt : excæcavit enim illos malitia eorum.\"},{\"verse\":22,\"text\":\"Et nescierunt sacramenta Dei : neque mercedem speraverunt justitiæ, nec judicaverunt honorem animarum sanctarum.\"},{\"verse\":23,\"text\":\"Quoniam Deus creavit hominem inexterminabilem, et ad imaginem similitudinis suæ fecit illum.\"},{\"verse\":24,\"text\":\"Invidia autem diaboli mors introivit in orbem terrarum :\"},{\"verse\":25,\"text\":\"imitantur autem illum qui sunt ex parte illius.\"}],\"summary\":\"The vain reasonings of the wicked: their persecuting the just, especially the Son of God.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":1,\"label\":\"Wisdom 1\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":3,\"label\":\"Wisdom 3\"}}]]\n"])</script></body></html>
