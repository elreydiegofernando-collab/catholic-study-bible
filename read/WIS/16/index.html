[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">16</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/WIS/">About <!-- -->Wisdom</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">God’s different dealings with the Egyptians and with his own people.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For these things, and by the like things to these, they were worthily punished, and were destroyed by a multitude of beasts.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Instead of which punishment, dealing well with thy people, thou gavest them their desire of delicious food, of a new taste, preparing for them quails for their meat:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To the end, that they indeed desiring food, by means of those things that were shewn and sent among them, might loath even that which was necessary to satisfy their desire. But these, after suffering want for a short time, tasted a new meat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For it was requisite that inevitable destruction should come upon them that exercised tyranny: but to these it should only be shewn how their enemies were destroyed.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For when the fierce rage of beasts came upon these, they were destroyed by the bitings of crooked serpents.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But thy wrath endured not for ever, but they were troubled for a short time for their correction, having a sign of salvation, to put them in remembrance of the commandment of thy law.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For he that turned to it, was not healed by that which he saw, but by thee, the Saviour of all.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And in this thou didst shew to our enemies, that thou art he who deliverest from all evil.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For the bitings of locusts, and of flies, killed them, and there was found no remedy for their life: because they were worthy to be destroyed by such things.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But not even the teeth of venomous serpents overcame thy children: for thy mercy came and healed them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For they were examined for the remembrance of thy words, and were quickly healed, lest falling into deep forgetfulness, they might not be able to use thy help.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For it was neither herb, nor mollifying plaster, that healed them, but thy word, O Lord, which healeth all things.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For it is thou, O Lord, that hast power of life and death, and leadest down to the gates of death, and bringest back again:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>A man indeed killeth through malice, and when the spirit is gone forth, it shall not return, neither shall he call back the soul that is received:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But it is impossible to escape thy hand:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For the wicked that denied to know thee, were scourged by the strength of thy arm, being persecuted by strange waters, and hail, and rain, and consumed by fire.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And which was wonderful, in water, which extinguisheth all things, the fire had more force: for the world fighteth for the just.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For at one time the fire was mitigated, that the beasts which were sent against the wicked might not be burnt, but that they might see, and perceive that they were persecuted by the judgment of God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And at another time the fire, above its own power, burnt in the midst of water, to destroy the fruits of a wicked land.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Instead of which things, thou didst feed thy people with the food of angels, and gavest them bread from heaven, prepared without labour; having in it all that is delicious, and the sweetness of every taste.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For thy sustenance shewed thy sweetness to thy children, and serving every man’s will, it was turned to what every man liked.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But snow and ice endured the force of fire, and melted not: that they might know that the fire, burning in the hail, and flashing in the rain, destroyed the fruits of the enemies.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But this same again, that the just might be nourished, did even forget its own strength.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For the creature serving thee, the Creator, is made fierce against the unjust for their punishment: and abateth its strength for the benefit of them that trust in thee.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Therefore even then it was transformed into all things, and was obedient to thy grace, that nourisheth all, according to the will of them that desired it of thee:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>That thy children, O Lord, whom thou lovedst, might know that it is not the growing of fruits that nourisheth men, but thy word preserveth them that believe in thee.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For that which could not be destroyed by fire, being warmed with a little sunbeam, presently melted away:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>That it might be known to all, that we ought to prevent the sun to bless thee, and adore thee at the dawning of the light.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For the hope of the unthankful shall melt away as the winter’s ice, and shall run off as unprofitable water.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Propter hæc et per his similia passi sunt digne tormenta, et per multitudinem bestiarum exterminati sunt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Pro quibus tormentis bene disposuisti populum tuum, quibus dedisti concupiscentiam delectamenti sui novum saporem, escam parans eis ortygometram :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>ut illi quidem, concupiscentes escam propter ea quæ illis ostensa et missa sunt, etiam a necessaria concupiscentia averterentur. Hi autem in brevi inopes facti, novam gustaverunt escam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Oportebat enim illis sine excusatione quidem supervenire interitum exercentibus tyrannidem ; his autem tantum ostendere quemadmodum inimici eorum exterminabantur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Etenim cum illis supervenit sæva bestiarum ira, morsibus perversorum colubrorum exterminabantur.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sed non in perpetuum ira tua permansit, sed ad correptionem in brevi turbati sunt, signum habentes salutis ad commemorationem mandati legis tuæ.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Qui enim conversus est, non per hoc quod videbat sanabatur, sed per te, omnium salvatorem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>In hoc autem ostendisti inimicis nostris quia tu es qui liberas ab omni malo.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Illos enim locustarum et muscarum occiderunt morsus, et non est inventa sanitas animæ illorum, quia digni erant ab hujuscemodi exterminari.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Filios autem tuos nec draconum venenatorum vicerunt dentes : misericordia enim tua adveniens sanabat illos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In memoria enim sermonum tuorum examinabantur, et velociter salvabantur : ne in altam incidentes oblivionem non possent tuo uti adjutorio.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Etenim neque herba, neque malagma sanavit eos : sed tuus, Domine, sermo, qui sanat omnia.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Tu es enim, Domine, qui vitæ et mortis habes potestatem, et deducis ad portas mortis, et reducis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Homo autem occidit quidem per malitiam ; et cum exierit spiritus, non revertetur, nec revocabit animam quæ recepta est.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sed tuam manum effugere impossibile est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Negantes enim te nosse impii, per fortitudinem brachii tui flagellati sunt : novis aquis, et grandinibus, et pluviis persecutionem passi, et per ignem consumpti.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Quod enim mirabile erat, in aqua, quæ omnia extinguit, plus ignis valebat : vindex est enim orbis justorum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quodam enim tempore mansuetabatur ignis, ne comburerentur quæ ad impios missa erant animalia, sed ut ipsi videntes scirent quoniam Dei judicio patiuntur persecutionem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et quodam tempore in aqua supra virtutem ignis exardescebat undique, ut iniquæ terræ nationem exterminaret.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Pro quibus angelorum esca nutrivisti populum tuum, et paratum panem de cælo præstitisti illis sine labore, omne delectamentum in se habentem, et omnis saporis suavitatem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Substantia enim tua dulcedinem tuam, quam in filios habes, ostendebat ; et deserviens uniuscujusque voluntati, ad quod quisque volebat convertebatur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Nix autem et glacies sustinebant vim ignis, et non tabescebant : ut scirent quoniam fructus inimicorum exterminabat ignis ardens in grandine et pluvia coruscans ;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>hic autem iterum ut nutrirentur justi, etiam suæ virtutis oblitus est.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Creatura enim tibi factori deserviens, exardescit in tormentum adversus injustos, et lenior fit ad benefaciendum pro his qui in te confidunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Propter hoc et tunc in omnia transfigurata, omnium nutrici gratiæ tuæ deserviebat, ad voluntatem eorum qui a te desiderabant :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>ut scirent filii tui quos dilexisti, Domine, quoniam non nativitatis fructus pascunt homines, sed sermo tuus hos qui in te crediderint conservat.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Quod enim ab igne non poterat exterminari, statim ab exiguo radio solis calefactum tabescebat :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>ut notum omnibus esset quoniam oportet prævenire solem ad benedictionem tuam, et ad ortum lucis te adorare.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ingrati enim spes tamquam hibernalis glacies tabescet, et disperiet tamquam aqua supervacua.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic these, after suffering want for a short time, tasted a new meat.\"},{\"verse\":4,\"text\":\"For it was requisite that inevitable destruction should come upon them that exercised tyranny: but to these it should only be shewn how their enemies were destroyed.\"},{\"verse\":5,\"text\":\"For when the fierce rage of beasts came upon these, they were destroyed by the bitings of crooked serpents.\"},{\"verse\":6,\"text\":\"But thy wrath endured not for ever, but they were troubled for a short time for their correction, having a sign of salvation, to put them in remembrance of the commandment of thy law.\"},{\"verse\":7,\"text\":\"For he that turned to it, was not healed by that which he saw, but by thee, the Saviour of all.\"},{\"verse\":8,\"text\":\"And in this thou didst shew to our enemies, that thou art he who deliverest from all evil.\"},{\"verse\":9,\"text\":\"For the bitings of locusts, and of flies, killed them, and there was found no remedy for their life: because they were worthy to be destroyed by such things.\"},{\"verse\":10,\"text\":\"But not even the teeth of venomous serpents overcame thy children: for thy mercy came and healed them.\"},{\"verse\":11,\"text\":\"For they were examined for the remembrance of thy words, and were quickly healed, lest falling into deep forgetfulness, they might not be able to use thy help.\"},{\"verse\":12,\"text\":\"For it was neither herb, nor mollifying plaster, that healed them, but thy word, O Lord, which healeth all things.\"},{\"verse\":13,\"text\":\"For it is thou, O Lord, that hast power of life and death, and leadest down to the gates of death, and bringest back again:\"},{\"verse\":14,\"text\":\"A man indeed killeth through malice, and when the spirit is gone forth, it shall not return, neither shall he call back the soul that is received:\"},{\"verse\":15,\"text\":\"But it is impossible to escape thy hand:\"},{\"verse\":16,\"text\":\"For the wicked that denied to know thee, were scourged by the strength of thy arm, being persecuted by strange waters, and hail, and rain, and consumed by fire.\"},{\"verse\":17,\"text\":\"And which was wonderful, in water, which extinguisheth all things, the fire had more force: for the world fighteth for the just.\"},{\"verse\":18,\"text\":\"For at one time the fire was mitigated, that the beasts which were sent against the wicked might not be burnt, but that they might see, and perceive that they were persecuted by the judgment of God.\"},{\"verse\":19,\"text\":\"And at another time the fire, above its own power, burnt in the midst of water, to destroy the fruits of a wicked land.\"},{\"verse\":20,\"text\":\"Instead of which things, thou didst feed thy people with the food of angels, and gavest them bread from heaven, prepared without labour; having in it all that is delicious, and the sweetness of every taste.\"},{\"verse\":21,\"text\":\"For thy sustenance shewed thy sweetness to thy children, and serving every man’s will, it was turned to what every man liked.\"},{\"verse\":22,\"text\":\"But snow and ice endured the force of fire, and melted not: that they might know that the fire, burning in the hail, and flashing in the rain, destroyed the fruits of the enemies.\"},{\"verse\":23,\"text\":\"But this same again, that the just might be nourished, did even forget its own strength.\"},{\"verse\":24,\"text\":\"For the creature serving thee, the Creator, is made fierce against the unjust for their punishment: and abateth its strength for the benefit of them that trust in thee.\"},{\"verse\":25,\"text\":\"Therefore even then it was transformed into all things, and was obedient to thy grace, that nourisheth all, according to the will of them that desired it of thee:\"},{\"verse\":26,\"text\":\"That thy children, O Lord, whom thou lovedst, might know that it is not the growing of fruits that nourisheth men, but thy word preserveth them that believe in thee.\"},{\"verse\":27,\"text\":\"For that which could not be destroyed by fire, being warmed with a little sunbeam, presently melted away:\"},{\"verse\":28,\"text\":\"That it might be known to all, that we ought to prevent the sun to bless thee, and adore thee at the dawning of the light.\"},{\"verse\":29,\"text\":\"For the hope of the unthankful shall melt away as the winter’s ice, and shall run off as unprofitable water.\"}],\"vul\":[{\"verse\":1,\"text\":\"Propter hæc et per his similia passi sunt digne tormenta, et per multitudinem bestiarum exterminati sunt.\"},{\"verse\":2,\"text\":\"Pro quibus tormentis bene disposuisti populum tuum, quibus dedisti concupiscentiam delectamenti sui novum saporem, escam parans eis ortygometram :\"},{\"verse\":3,\"text\":\"ut illi quidem, concupiscentes escam propter ea quæ illis ostensa et missa sunt, etiam a necessaria concupiscentia averterentur. Hi autem in brevi inopes facti, novam gustaverunt escam.\"},{\"verse\":4,\"text\":\"Oportebat enim illis sine excusatione quidem supervenire interitum exercentibus tyrannidem ; his autem tantum ostendere quemadmodum inimici eorum exterminabantur.\"},{\"verse\":5,\"text\":\"Etenim cum illis supervenit sæva bestiarum ira, morsibus perversorum colubrorum exterminabantur.\"},{\"verse\":6,\"text\":\"Sed non in perpetuum ira tua permansit, sed ad correptionem in brevi turbati sunt, signum habentes salutis ad commemorationem mandati legis tuæ.\"},{\"verse\":7,\"text\":\"Qui enim conversus est, non per hoc quod videbat sanabatur, sed per te, omnium salvatorem.\"},{\"verse\":8,\"text\":\"In hoc autem ostendisti inimicis nostris quia tu es qui liberas ab omni malo.\"},{\"verse\":9,\"text\":\"Illos enim locustarum et muscarum occiderunt morsus, et non est inventa sanitas animæ illorum, quia digni erant ab hujuscemodi exterminari.\"},{\"verse\":10,\"text\":\"Filios autem tuos nec draconum venenatorum vicerunt dentes : misericordia enim tua adveniens sanabat illos.\"},{\"verse\":11,\"text\":\"In memoria enim sermonum tuorum examinabantur, et velociter salvabantur : ne in altam incidentes oblivionem non possent tuo uti adjutorio.\"},{\"verse\":12,\"text\":\"Etenim neque herba, neque malagma sanavit eos : sed tuus, Domine, sermo, qui sanat omnia.\"},{\"verse\":13,\"text\":\"Tu es enim, Domine, qui vitæ et mortis habes potestatem, et deducis ad portas mortis, et reducis.\"},{\"verse\":14,\"text\":\"Homo autem occidit quidem per malitiam ; et cum exierit spiritus, non revertetur, nec revocabit animam quæ recepta est.\"},{\"verse\":15,\"text\":\"Sed tuam manum effugere impossibile est.\"},{\"verse\":16,\"text\":\"Negantes enim te nosse impii, per fortitudinem brachii tui flagellati sunt : novis aquis, et grandinibus, et pluviis persecutionem passi, et per ignem consumpti.\"},{\"verse\":17,\"text\":\"Quod enim mirabile erat, in aqua, quæ omnia extinguit, plus ignis valebat : vindex est enim orbis justorum.\"},{\"verse\":18,\"text\":\"Quodam enim tempore mansuetabatur ignis, ne comburerentur quæ ad impios missa erant animalia, sed ut ipsi videntes scirent quoniam Dei judicio patiuntur persecutionem.\"},{\"verse\":19,\"text\":\"Et quodam tempore in aqua supra virtutem ignis exardescebat undique, ut iniquæ terræ nationem exterminaret.\"},{\"verse\":20,\"text\":\"Pro quibus angelorum esca nutrivisti populum tuum, et paratum panem de cælo præstitisti illis sine labore, omne delectamentum in se habentem, et omnis saporis suavitatem.\"},{\"verse\":21,\"text\":\"Substantia enim tua dulcedinem tuam, quam in filios habes, ostendebat ; et deserviens uniuscujusque voluntati, ad quod quisque volebat convertebatur.\"},{\"verse\":22,\"text\":\"Nix autem et glacies sustinebant vim ignis, et non tabescebant : ut scirent quoniam fructus inimicorum exterminabat ignis ardens in grandine et pluvia coruscans ;\"},{\"verse\":23,\"text\":\"hic autem iterum ut nutrirentur justi, etiam suæ virtutis oblitus est.\"},{\"verse\":24,\"text\":\"Creatura enim tibi factori deserviens, exardescit in tormentum adversus injustos, et lenior fit ad benefaciendum pro his qui in te confidunt.\"},{\"verse\":25,\"text\":\"Propter hoc et tunc in omnia transfigurata, omnium nutrici gratiæ tuæ deserviebat, ad voluntatem eorum qui a te desiderabant :\"},{\"verse\":26,\"text\":\"ut scirent filii tui quos dilexisti, Domine, quoniam non nativitatis fructus pascunt homines, sed sermo tuus hos qui in te crediderint conservat.\"},{\"verse\":27,\"text\":\"Quod enim ab igne non poterat exterminari, statim ab exiguo radio solis calefactum tabescebat :\"},{\"verse\":28,\"text\":\"ut notum omnibus esset quoniam oportet prævenire solem ad benedictionem tuam, et ad ortum lucis te adorare.\"},{\"verse\":29,\"text\":\"Ingrati enim spes tamquam hibernalis glacies tabescet, et disperiet tamquam aqua supervacua.\"}],\"summary\":\"God’s different dealings with the Egyptians and with his own people.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":15,\"label\":\"Wisdom 15\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":17,\"label\":\"Wisdom 17\"}}]]\n"])</script></body></html>
