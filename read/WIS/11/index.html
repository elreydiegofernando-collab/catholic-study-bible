g-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>She prospered their works in the hands of the holy prophet.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>They went through wildernesses that were not inhabited, and in desert places they pitched their tents.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>They stood against their enemies, and revenged themselves of their adversaries.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>They were thirsty, and they called upon thee, and water was given them out of the high rock, and a refreshment of their thirst out of the hard stone.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For by what things their enemies were punished, when their drink failed them, while the children of Israel abounded therewith, and rejoiced:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>By the same things they in their need were benefited.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For instead of a fountain of an ever running river, thou gavest human blood to the unjust.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And whilst they were diminished for a manifest reproof of their murdering the infants, thou gavest to thine abundant water unlooked for:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Shewing by the thirst that was then, how thou didst exalt thine, and didst kill their adversaries.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For when they were tried, and chastised with mercy, they knew how the wicked were judged with wrath, and tormented.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For thou didst admonish and try them as a father: but the others, as a severe king, thou didst examine and condemn.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For whether absent or present, they were tormented alike.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For a double affliction came upon them, and a groaning for the remembrance of things past.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For when they heard that by their punishments the others were benefited, they remembered the Lord, wondering at the end of what was come to pass.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For whom they scorned before, when he was thrown out at the time of his being wickedly exposed to perish, him they admired in the end, when they saw the event: their thirsting being unlike to that of the just.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But for the foolish devices of their iniquity, because some being deceived worshipped dumb serpents and worthless beasts, thou didst send upon them a multitude of dumb beasts for vengeance:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>That they might know that by what things a man sinneth, by the same also he is tormented.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For thy almighty hand, which made the world of matter without form, was not unable to send upon them a multitude of bears, or fierce lions,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Or unknown beasts of a new kind, full of rage; either breathing out a fiery vapour, or sending forth a stinking smoke, or shooting horrible sparks out of their eyes:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Whereof not only the hurt might be able to destroy them, but also the very sight might kill them through fear.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Yea, and without these, they might have been slain with one blast, persecuted by their own deeds, and scattered by the breath of thy power: but thou hast ordered all things in measure, and number, and weight.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For great power always belonged to thee alone: and who shall resist the strength of thy arm?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For the whole world before thee is as the least grain of the balance, and as a drop of the morning dew, that falleth down upon the earth.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But thou hast mercy upon all, because thou canst do all things, and overlookest the sins of men for the sake of repentance.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For thou lovest all things that are, and hatest none of the things which thou hast made: for thou didst not appoint, or make any thing hating it.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And how could any thing endure, if thou wouldst not? or be preserved, if not called by thee?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But thou sparest all: because they are thine, O Lord, who lovest souls.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Direxit opera eorum in manibus prophetæ sancti.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Iter fecerunt per deserta quæ non habitabantur, et in locis desertis fixerunt casas.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Steterunt contra hostes, et de inimicis se vindicaverunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sitierunt, et invocaverunt te, et data est illis aqua de petra altissima, et requies sitis de lapide duro.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Per quæ enim pœnas passi sunt inimici illorum a defectione potus sui, et in eis cum abundarent filii Israël lætati sunt :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>per hæc, cum illis deessent, bene cum illis actum est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nam pro fonte quidem sempiterni fluminis, humanum sanguinem dedisti injustis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui cum minuerentur in traductione infantium occisorum, dedisti illis abundantem aquam insperate,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>ostendens per sitim quæ tunc fuit, quemadmodum tuos exaltares, et adversarios illorum necares.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cum enim tentati sunt, et quidem cum misericordia disciplinam accipientes, scierunt quemadmodum cum ira judicati impii tormenta paterentur.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hos quidem tamquam pater monens probasti ; illos autem tamquam durus rex interrogans condemnasti.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Absentes enim, et præsentes, similiter torquebantur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Duplex enim illos acceperat tædium et gemitus, cum memoria præteritorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Cum enim audirent per sua tormenta bene secum agi, commemorati sunt Dominum, admirantes in finem exitus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Quem enim in expositione prava projectum deriserunt, in finem eventus mirati sunt, non similiter justis sitientes.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Pro cogitationibus autem insensatis iniquitatis illorum, quod quidam errantes colebant mutos serpentes et bestias supervacuas, immisisti illis multitudinem mutorum animalium in vindictam ;</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>ut scirent quia per quæ peccat quis, per hæc et torquetur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non enim impossibilis erat omnipotens manus tua, quæ creavit orbem terrarum ex materia invisa, immittere illis multitudinem ursorum, aut audaces leones,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>aut novi generis ira plenas ignotas bestias, aut vaporem ignium spirantes, aut fumi odorem proferentes, aut horrendas ab oculis scintillas emittentes ;</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>quarum non solum læsura poterat illos exterminare, sed et aspectus per timorem occidere.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sed et sine his uno spiritu poterant occidi, persecutionem passi ab ipsis factis suis, et dispersi per spiritum virtutis tuæ : sed omnia in mensura, et numero et pondere disposuisti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Multum enim valere, tibi soli supererat semper : et virtuti brachii tui quis resistet ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Quoniam tamquam momentum stateræ, sic est ante te orbis terrarum, et tamquam gutta roris antelucani quæ descendit in terram.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Sed misereris omnium, quia omnia potes ; et dissimulas peccata hominum, propter pœnitentiam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Diligis enim omnia quæ sunt, et nihil odisti eorum quæ fecisti ; nec enim odiens aliquid constituisti aut fecisti.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Quomodo autem posset aliquid permanere, nisi tu voluisses ? aut quod a te vocatum non esset conservaretur ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Parcis autem omnibus, quoniam tua sunt, Domine, qui amas animas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 10</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/12/"><span class="min-w-0"><span class tudy Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.11\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":11,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"She prospered their works in the hands of the holy prophet.\"},{\"verse\":2,\"text\":\"They went through wildernesses that were not inhabited, and in desert places they pitched their tents.\"},{\"verse\":3,\"text\":\"They stood against their enemies, and revenged themselves of their adversaries.\"},{\"verse\":4,\"text\":\"They were thirsty, and they called upon thee, and water was given them out of the high rock, and a refreshment of their thirst out of the hard stone.\"},{\"verse\":5,\"text\":\"For by what things their enemies were punished, when their drink failed them, while the children of Israel abounded therewith, and rejoiced:\"},{\"verse\":6,\"text\":\"By the same things they in their need were benefited.\"},{\"verse\":7,\"text\":\"For instead of a fountain of an ever running river, thou gavest human blood to the unjust.\"},{\"verse\":8,\"text\":\"And whilst they were diminished for a manifest reproof of their murdering the infants, thou gavest to thine abundant water unlooked for:\"},{\"verse\":9,\"text\":\"Shewing by the thirst that was then, how thou didst exalt thine, and didst kill their adversaries.\"},{\"verse\":10,\"text\":\"For when they were tried, and chastised with mercy, they knew how the wicked were judged with wrath, and tormented.\"},{\"verse\":11,\"text\":\"For thou didst admonish and try them as a father: but the others, as a severe king, thou didst examine and condemn.\"},{\"verse\":12,\"text\":\"For whether absent or present, they were tormented alike.\"},{\"verse\":13,\"text\":\"For a double affliction came upon them, and a groaning for the remembrance of things past.\"},{\"verse\":14,\"text\":\"For when they heard that by their punishments the others were benefited, they remembered the Lord, wondering at the end of what was come to pass.\"},{\"verse\":15,\"text\":\"For whom they scorned before, when he was thrown out at the time of his being wickedly exposed to perish, him they admired in the end, when they saw the event: their thirsting being unlike to that of the just.\"},{\"verse\":16,\"text\":\"But for the foolish devices of their iniquity, because some being deceived worshipped dumb serpents and worthless beasts, thou didst send upon them a multitude of dumb beasts for vengeance:\"},{\"verse\":17,\"text\":\"That they might know that by what things a man sinneth, by the same also he is tormented.\"},{\"verse\":18,\"text\":\"For thy almighty hand, which made the world of matter without form, was not unable to send upon them a multitude of bears, or fierce lions,\"},{\"verse\":19,\"text\":\"Or unknown beasts of a new kind, full of rage; either breathing out a fiery vapour, or sending forth a stinking smoke, or shooting horrible sparks out of their eyes:\"},{\"verse\":20,\"text\":\"Whereof not only the hurt might be able to destroy them, but also the very sight might kill them through fear.\"},{\"verse\":21,\"text\":\"Yea, and without these, they might have been slain with one blast, persecuted by their own deeds, and scattered by the breath of thy power: but thou hast ordered all things in measure, and number, and weight.\"},{\"verse\":22,\"text\":\"For great power always belonged to thee alone: and who shall resist the strength of thy arm?\"},{\"verse\":23,\"text\":\"For the whole world before thee is as the least grain of the balance, and as a drop of the morning dew, that falleth down upon the earth.\"},{\"verse\":24,\"text\":\"But thou hast mercy upon all, because thou canst do all things, and overlookest the sins of men for the sake of repentance.\"},{\"verse\":25,\"text\":\"For thou lovest all things that are, and hatest none of the things which thou hast made: for thou didst not appoint, or make any thing hating it.\"},{\"verse\":26,\"text\":\"And how could any thing endure, if thou wouldst not? or be preserved, if not called by thee?\"},{\"verse\":27,\"text\":\"But thou sparest all: because they are thine, O Lord, who lovest souls.\"}],\"vul\":[{\"verse\":1,\"text\":\"Direxit opera eorum in manibus prophetæ sancti.\"},{\"verse\":2,\"text\":\"Iter fecerunt per deserta quæ non habitabantur, et in locis desertis fixerunt casas.\"},{\"verse\":3,\"text\":\"Steterunt contra hostes, et de inimicis se vindicaverunt.\"},{\"verse\":4,\"text\":\"Sitierunt, et invocaverunt te, et data est illis aqua de petra altissima, et requies sitis de lapide duro.\"},{\"verse\":5,\"text\":\"Per quæ enim pœnas passi sunt inimici illorum a defectione potus sui, et in eis cum abundarent filii Israël lætati sunt :\"},{\"verse\":6,\"text\":\"per hæc, cum illis deessent, bene cum illis actum est.\"},{\"verse\":7,\"text\":\"Nam pro fonte quidem sempiterni fluminis, humanum sanguinem dedisti injustis.\"},{\"verse\":8,\"text\":\"Qui cum minuerentur in traductione infantium occisorum, dedisti illis abundantem aquam insperate,\"},{\"verse\":9,\"text\":\"ostendens per sitim quæ tunc fuit, quemadmodum tuos exaltares, et adversarios illorum necares.\"},{\"verse\":10,\"text\":\"Cum enim tentati sunt, et quidem cum misericordia disciplinam accipientes, scierunt quemadmodum cum ira judicati impii tormenta paterentur.\"},{\"verse\":11,\"text\":\"Hos quidem tamquam pater monens probasti ; illos autem tamquam durus rex interrogans condemnasti.\"},{\"verse\":12,\"text\":\"Absentes enim, et præsentes, similiter torquebantur.\"},{\"verse\":13,\"text\":\"Duplex enim illos acceperat tædium et gemitus, cum memoria præteritorum.\"},{\"verse\":14,\"text\":\"Cum enim audirent per sua tormenta bene secum agi, commemorati sunt Dominum, admirantes in finem exitus.\"},{\"verse\":15,\"text\":\"Quem enim in expositione prava projectum deriserunt, in finem eventus mirati sunt, non similiter justis sitientes.\"},{\"verse\":16,\"text\":\"Pro cogitationibus autem insensatis iniquitatis illorum, quod quidam errantes colebant mutos serpentes et bestias supervacuas, immisisti illis multitudinem mutorum animalium in vindictam ;\"},{\"verse\":17,\"text\":\"ut scirent quia per quæ peccat quis, per hæc et torquetur.\"},{\"verse\":18,\"text\":\"Non enim impossibilis erat omnipotens manus tua, quæ creavit orbem terrarum ex materia invisa, immittere illis multitudinem ursorum, aut audaces leones,\"},{\"verse\":19,\"text\":\"aut novi generis ira plenas ignotas bestias, aut vaporem ignium spirantes, aut fumi odorem proferentes, aut horrendas ab oculis scintillas emittentes ;\"},{\"verse\":20,\"text\":\"quarum non solum læsura poterat illos exterminare, sed et aspectus per timorem occidere.\"},{\"verse\":21,\"text\":\"Sed et sine his uno spiritu poterant occidi, persecutionem passi ab ipsis factis suis, et dispersi per spiritum virtutis tuæ : sed omnia in mensura, et numero et pondere disposuisti.\"},{\"verse\":22,\"text\":\"Multum enim valere, tibi soli supererat semper : et virtuti brachii tui quis resistet ?\"},{\"verse\":23,\"text\":\"Quoniam tamquam momentum stateræ, sic est ante te orbis terrarum, et tamquam gutta roris antelucani quæ descendit in terram.\"},{\"verse\":24,\"text\":\"Sed misereris omnium, quia omnia potes ; et dissimulas peccata hominum, propter pœnitentiam.\"},{\"verse\":25,\"text\":\"Diligis enim omnia quæ sunt, et nihil odisti eorum quæ fecisti ; nec enim odiens aliquid constituisti aut fecisti.\"},{\"verse\":26,\"text\":\"Quomodo autem posset aliquid permanere, nisi tu voluisses ? aut quod a te vocatum non esset conservaretur ?\"},{\"verse\":27,\"text\":\"Parcis autem omnibus, quoniam tua sunt, Domine, qui amas animas.\"}],\"summary\":\"Other benefits of wisdom to the people of God.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":10,\"label\":\"Wisdom 10\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":12,\"label\":\"Wisdom 12\"}}]]\n"])</script></body></html>
