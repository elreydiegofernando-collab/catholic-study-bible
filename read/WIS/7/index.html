ng-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I myself also am a mortal man, like all others, and of the race of him, that was first made of the earth, and in the womb of my mother I was fashioned to be flesh.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In the time of ten months I was compacted in blood, of the seed of man, and the pleasure of sleep concurring.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And being born, I drew in the common air, and fell upon the earth, that is made alike, and the first voice which I uttered was crying, as all others do.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I was nursed in swaddling clothes, and with great cares.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For none of the kings had any other beginning of birth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For all men have one entrance into life, and the like going out.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Wherefore I wished, and understanding was given me: and I called upon God, and the spirit of wisdom came upon me:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And I preferred her before kingdoms and thrones, and esteemed riches nothing in comparison of her.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Neither did I compare unto her any precious stone: for all gold, in comparison of her, is as a little sand; and silver, in respect to her, shall be counted as clay.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>I loved her above health and beauty, and chose to have her instead of light: for her light cannot be put out.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Now all good things came to me together with her, and innumerable riches through her hands,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And I rejoiced in all these: for this wisdom went before me, and I knew not that she was the mother of them all.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Which I have learned without guile, and communicate without envy, and her riches I hide not.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For she is an infinite treasure to men: which they that use, become the friends of God, being commended for the gifts of discipline.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And God hath given to me to speak as I would, and to conceive thoughts worthy of those things that are given me: because he is the guide of wisdom, and the director of the wise:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For in his hand are both we, and our words, and all wisdom, and the knowledge and skill of works.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For he hath given me the true knowledge of the things that are: to know the disposition of the whole world, and the virtues of the elements,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The beginning, and ending, and midst of the times, the alterations of their courses, and the changes of seasons,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The revolutions of the year, and the dispositions of the stars,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The natures of living creatures, and rage of wild beasts, the force of winds, and reasonings of men, the diversities of plants, and the virtues of roots,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And all such things as are hid, and not foreseen, I have learned: for wisdom, which is the worker of all things, taught me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For in her is the spirit of understanding; holy, one, manifold, subtile, eloquent, active, undefiled, sure, sweet, loving that which is good, quick, which nothing hindereth, beneficent,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Gentle, kind, steadfast, assured, secure, having all power, overseeing all things, and containing all spirits: intelligible, pure, subtile:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For wisdom is more active than all active things; and reacheth everywhere, by reason of her purity.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>For she is a vapour of the power of God, and a certain pure emmanation of the glory of the Almighty God: and therefore no defiled thing cometh into her.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For she is the brightness of eternal light, and the unspotted mirror of God’s majesty, and the image of his goodness.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And being but one, she can do all things: and remaining in herself the same, she reneweth all things, and through nations conveyeth herself into holy souls, she maketh the friends of God and prophets.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>For God loveth none but him that dwelleth with wisdom.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For she is more beautiful than the sun, and above all the order of the stars: being compared with the light, she is found before it.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>For after this cometh night, but no evil can overcome wisdom.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sum quidem et ego mortalis homo, similis omnibus, et ex genere terreni illius qui prior factus est : et in ventre matris figuratus sum caro ;</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>decem mensium tempore coagulatus sum in sanguine : ex semine hominis, et delectamento somni conveniente.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et ego natus accepi communem aërem, et in similiter factam decidi terram, et primam vocem similem omnibus emisi plorans.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>In involumentis nutritus sum, et curis magnis :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>nemo enim ex regibus aliud habuit nativitatis initium.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Unus ergo introitus est omnibus ad vitam, et similis exitus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Propter hoc optavi, et datus est mihi sensus ; et invocavi, et venit in me spiritus sapientiæ :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et præposui illam regnis et sedibus, et divitias nihil esse duxi in comparatione illius.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nec comparavi illi lapidem pretiosum, quoniam omne aurum in comparatione illius arena est exigua, et tamquam lutum æstimabitur argentum in conspectu illius.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Super salutem et speciem dilexi illam, et proposui pro luce habere illam, quoniam inextinguibile est lumen illius.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Venerunt autem mihi omnia bona pariter cum illa, et innumerabilis honestas per manus illius ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et lætatus sum in omnibus, quoniam antecedebat me ista sapientia, et ignorabam quoniam horum omnium mater est.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quam sine fictione didici, et sine invidia communico, et honestatem illius non abscondo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Infinitus enim thesaurus est hominibus ; quo qui usi sunt, participes facti sunt amicitiæ Dei, propter disciplinæ dona commendati.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Mihi autem dedit Deus dicere ex sententia, et præsumere digna horum quæ mihi dantur : quoniam ipse sapientiæ dux est, et sapientium emendator.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>In manu enim illius et nos et sermones nostri, et omnis sapientia, et operum scientia, et disciplina.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ipse enim dedit mihi horum quæ sunt scientiam veram, ut sciam dispositionem orbis terrarum, et virtutes elementorum,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>initium, et consummationem, et medietatem temporum, vicissitudinum permutationes, et commutationes temporum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>anni cursus, et stellarum dispositiones,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>naturas animalium, et iras bestiarum, vim ventorum, et cogitationes hominum, differentias virgultorum, et virtutes radicum.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et quæcumque sunt absconsa et improvisa didici : omnium enim artifex docuit me sapientia.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Est enim in illa spiritus intelligentiæ, sanctus, unicus, multiplex, subtilis, disertus, mobilis, incoinquinatus, certus, suavis, amans bonum, acutus, quem nihil vetat, benefaciens,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>humanus, benignus, stabilis, certus, securus, omnem habens virtutem, omnia prospiciens, et qui capiat omnes spiritus, intelligibilis, mundus, subtilis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Omnibus enim mobilibus mobilior est sapientia : attingit autem ubique propter suam munditiam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Vapor est enim virtutis Dei, et emanatio quædam est claritatis omnipotentis Dei sincera, et ideo nihil inquinatum in eam incurrit :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>candor est enim lucis æternæ, et speculum sine macula Dei majestatis, et imago bonitatis illius.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et cum sit una, omnia potest ; et in se permanens omnia innovat : et per nationes in animas sanctas se transfert ; amicos Dei et prophetas constituit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Neminem enim diligit Deus, nisi eum qui cum sapientia inhabitat.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Est enim hæc speciosior sole, et super omnem dispositionem stellarum : luci comparata, invenitur prior.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Illi enim succedit nox ; sapientiam autem non vincit malitia.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h- .0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.7\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":7,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"I myself also am a mortal man, like all others, and of the race of him, that was first made of the earth, and in the womb of my mother I was fashioned to be flesh.\"},{\"verse\":2,\"text\":\"In the time of ten months I was compacted in blood, of the seed of man, and the pleasure of sleep concurring.\"},{\"verse\":3,\"text\":\"And being born, I drew in the common air, and fell upon the earth, that is made alike, and the first voice which I uttered was crying, as all others do.\"},{\"verse\":4,\"text\":\"I was nursed in swaddling clothes, and with great cares.\"},{\"verse\":5,\"text\":\"For none of the kings had any other beginning of birth.\"},{\"verse\":6,\"text\":\"For all men have one entrance into life, and the like going out.\"},{\"verse\":7,\"text\":\"Wherefore I wished, and understanding was given me: and I called upon God, and the spirit of wisdom came upon me:\"},{\"verse\":8,\"text\":\"And I preferred her before kingdoms and thrones, and esteemed riches nothing in comparison of her.\"},{\"verse\":9,\"text\":\"Neither did I compare unto her any precious stone: for all gold, in comparison of her, is as a little sand; and silver, in respect to her, shall be counted as clay.\"},{\"verse\":10,\"text\":\"I loved her above health and beauty, and chose to have her instead of light: for her light cannot be put out.\"},{\"verse\":11,\"text\":\"Now all good things came to me together with her, and innumerable riches through her hands,\"},{\"verse\":12,\"text\":\"And I rejoiced in all these: for this wisdom went before me, and I knew not that she was the mother of them all.\"},{\"verse\":13,\"text\":\"Which I have learned without guile, and communicate without envy, and her riches I hide not.\"},{\"verse\":14,\"text\":\"For she is an infinite treasure to men: which they that use, become the friends of God, being commended for the gifts of discipline.\"},{\"verse\":15,\"text\":\"And God hath given to me to speak as I would, and to conceive thoughts worthy of those things that are given me: because he is the guide of wisdom, and the director of the wise:\"},{\"verse\":16,\"text\":\"For in his hand are both we, and our words, and all wisdom, and the knowledge and skill of works.\"},{\"verse\":17,\"text\":\"For he hath given me the true knowledge of the things that are: to know the disposition of the whole world, and the virtues of the elements,\"},{\"verse\":18,\"text\":\"The beginning, and ending, and midst of the times, the alterations of their courses, and the changes of seasons,\"},{\"verse\":19,\"text\":\"The revolutions of the year, and the dispositions of the stars,\"},{\"verse\":20,\"text\":\"The natures of living creatures, and rage of wild beasts, the force of winds, and reasonings of men, the diversities of plants, and the virtues of roots,\"},{\"verse\":21,\"text\":\"And all such things as are hid, and not foreseen, I have learned: for wisdom, which is the worker of all things, taught me.\"},{\"verse\":22,\"text\":\"For in her is the spirit of understanding; holy, one, manifold, subtile, eloquent, active, undefiled, sure, sweet, loving that which is good, quick, which nothing hindereth, beneficent,\"},{\"verse\":23,\"text\":\"Gentle, kind, steadfast, assured, secure, having all power, overseeing all things, and containing all spirits: intelligible, pure, subtile:\"},{\"verse\":24,\"text\":\"For wisdom is more active than all active things; and reacheth everywhere, by reason of her purity.\"},{\"verse\":25,\"text\":\"For she is a vapour of the power of God, and a certain pure emmanation of the glory of the Almighty God: and therefore no defiled thing cometh into her.\"},{\"verse\":26,\"text\":\"For she is the brightness of eternal light, and the unspotted mirror of God’s majesty, and the image of his goodness.\"},{\"verse\":27,\"text\":\"And being but one, she can do all things: and remaining in herself the same, she reneweth all things, and through nations conveyeth herself into holy souls, she maketh the friends of God and prophets.\"},{\"verse\":28,\"text\":\"For God loveth none but him that dwelleth with wisdom.\"},{\"verse\":29,\"text\":\"For she is more beautiful than the sun, and above all the order of the stars: being compared with the light, she is found before it.\"},{\"verse\":30,\"text\":\"For after this cometh night, but no evil can overcome wisdom.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sum quidem et ego mortalis homo, similis omnibus, et ex genere terreni illius qui prior factus est : et in ventre matris figuratus sum caro ;\"},{\"verse\":2,\"text\":\"decem mensium tempore coagulatus sum in sanguine : ex semine hominis, et delectamento somni conveniente.\"},{\"verse\":3,\"text\":\"Et ego natus accepi communem aërem, et in similiter factam decidi terram, et primam vocem similem omnibus emisi plorans.\"},{\"verse\":4,\"text\":\"In involumentis nutritus sum, et curis magnis :\"},{\"verse\":5,\"text\":\"nemo enim ex regibus aliud habuit nativitatis initium.\"},{\"verse\":6,\"text\":\"Unus ergo introitus est omnibus ad vitam, et similis exitus.\"},{\"verse\":7,\"text\":\"Propter hoc optavi, et datus est mihi sensus ; et invocavi, et venit in me spiritus sapientiæ :\"},{\"verse\":8,\"text\":\"et præposui illam regnis et sedibus, et divitias nihil esse duxi in comparatione illius.\"},{\"verse\":9,\"text\":\"Nec comparavi illi lapidem pretiosum, quoniam omne aurum in comparatione illius arena est exigua, et tamquam lutum æstimabitur argentum in conspectu illius.\"},{\"verse\":10,\"text\":\"Super salutem et speciem dilexi illam, et proposui pro luce habere illam, quoniam inextinguibile est lumen illius.\"},{\"verse\":11,\"text\":\"Venerunt autem mihi omnia bona pariter cum illa, et innumerabilis honestas per manus illius ;\"},{\"verse\":12,\"text\":\"et lætatus sum in omnibus, quoniam antecedebat me ista sapientia, et ignorabam quoniam horum omnium mater est.\"},{\"verse\":13,\"text\":\"Quam sine fictione didici, et sine invidia communico, et honestatem illius non abscondo.\"},{\"verse\":14,\"text\":\"Infinitus enim thesaurus est hominibus ; quo qui usi sunt, participes facti sunt amicitiæ Dei, propter disciplinæ dona commendati.\"},{\"verse\":15,\"text\":\"Mihi autem dedit Deus dicere ex sententia, et præsumere digna horum quæ mihi dantur : quoniam ipse sapientiæ dux est, et sapientium emendator.\"},{\"verse\":16,\"text\":\"In manu enim illius et nos et sermones nostri, et omnis sapientia, et operum scientia, et disciplina.\"},{\"verse\":17,\"text\":\"Ipse enim dedit mihi horum quæ sunt scientiam veram, ut sciam dispositionem orbis terrarum, et virtutes elementorum,\"},{\"verse\":18,\"text\":\"initium, et consummationem, et medietatem temporum, vicissitudinum permutationes, et commutationes temporum,\"},{\"verse\":19,\"text\":\"anni cursus, et stellarum dispositiones,\"},{\"verse\":20,\"text\":\"naturas animalium, et iras bestiarum, vim ventorum, et cogitationes hominum, differentias virgultorum, et virtutes radicum.\"},{\"verse\":21,\"text\":\"Et quæcumque sunt absconsa et improvisa didici : omnium enim artifex docuit me sapientia.\"},{\"verse\":22,\"text\":\"Est enim in illa spiritus intelligentiæ, sanctus, unicus, multiplex, subtilis, disertus, mobilis, incoinquinatus, certus, suavis, amans bonum, acutus, quem nihil vetat, benefaciens,\"},{\"verse\":23,\"text\":\"humanus, benignus, stabilis, certus, securus, omnem habens virtutem, omnia prospiciens, et qui capiat omnes spiritus, intelligibilis, mundus, subtilis.\"},{\"verse\":24,\"text\":\"Omnibus enim mobilibus mobilior est sapientia : attingit autem ubique propter suam munditiam.\"},{\"verse\":25,\"text\":\"Vapor est enim virtutis Dei, et emanatio quædam est claritatis omnipotentis Dei sincera, et ideo nihil inquinatum in eam incurrit :\"},{\"verse\":26,\"text\":\"candor est enim lucis æternæ, et speculum sine macula Dei majestatis, et imago bonitatis illius.\"},{\"verse\":27,\"text\":\"Et cum sit una, omnia potest ; et in se permanens omnia innovat : et per nationes in animas sanctas se transfert ; amicos Dei et prophetas constituit.\"},{\"verse\":28,\"text\":\"Neminem enim diligit Deus, nisi eum qui cum sapientia inhabitat.\"},{\"verse\":29,\"text\":\"Est enim hæc speciosior sole, et super omnem dispositionem stellarum : luci comparata, invenitur prior.\"},{\"verse\":30,\"text\":\"Illi enim succedit nox ; sapientiam autem non vincit malitia.\"}],\"summary\":\"The excellence of wisdom: how she is to be found.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":6,\"label\":\"Wisdom 6\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":8,\"label\":\"Wisdom 8\"}}]]\n"])</script></body></html>
