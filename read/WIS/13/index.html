20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">13</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Idolaters are inexcusable: and those most of all that worship for gods the works of the hands of men.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But all men are vain, in whom there is not the knowledge of God: and who by these good things that are seen, could not understand him that is, neither by attending to the works have acknowledged who was the workman:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But have imagined either the fire, or the wind, or the swift air, or the circle of the stars, or the great water, or the sun and moon, to be the gods that rule the world.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>With whose beauty, if they, being delighted, took them to be gods: let them know how much the Lord of them is more beautiful than they: for the first author of beauty made all those things.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Or if they admired their power, and their effects, let them understand by them, that he that made them, is mightier than they:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For by the greatness of the beauty, and of the creature, the creator of them may be seen, so as to be known thereby.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But yet as to these they are less to be blamed. For they perhaps err, seeking God, and desirous to find him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For being conversant among his works, they search: and they are persuaded that the things are good which are seen.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But then again they are not to be pardoned.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For if they were able to know so much as to make a judgment of the world: how did they not more easily find out the Lord thereof?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But unhappy are they, and their hope is among the dead, who have called gods the works of the hand of men, gold and silver, the inventions of art, and the resemblances of beasts, or an unprofitable stone the work of an ancient hand.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Or if an artist, a carpenter, hath cut down a tree proper for his use in the wood, and skilfully taken off all the bark thereof, and with his art, diligently formeth a vessel profitable for the common uses of life,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And useth the chips of his work to dress his meat:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And taking what was left thereof, which is good for nothing, being a crooked piece of wood, and full of knots, carveth it diligently when he hath nothing else to do, and by the skill of his art fashioneth it, and maketh it like the image of a man:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Or the resemblance of some beast, laying it over with vermilion, and painting it red, and covering every spot that is in it:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And maketh a convenient dwelling place for it, and setting it in a wall, and fastening it with iron,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Providing for it, lest it should fall, knowing that it is unable to help itself: for it is an image, and hath need of help.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And then maketh prayer to it, enquiring concerning his substance, and his children, or his marriage. And he is not ashamed to speak to that which hath no life:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And for health he maketh supplication to the weak, and for life prayeth to that which is dead, and for help calleth upon that which is unprofitable:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And for a good journey he petitioneth him that cannot walk: and for getting, and for working, and for the event of all things he asketh him that is unable to do any thing.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Vani autem sunt omnes homines in quibus non subest scientia Dei ; et de his quæ videntur bona, non potuerunt intelligere eum qui est, neque operibus attendentes agnoverunt quis esset artifex :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sed aut ignem, aut spiritum, aut citatum aërem, aut gyrum stellarum, aut nimiam aquam, aut solem et lunam, rectores orbis terrarum deos putaverunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Quorum si specie delectati, deos putaverunt, sciant quanto his dominator eorum speciosior est : speciei enim generator hæc omnia constituit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Aut si virtutem et opera eorum mirati sunt, intelligant ab illis quoniam qui hæc fecit fortior est illis :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>a magnitudine enim speciei et creaturæ cognoscibiliter poterit creator horum videri.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Sed tamen adhuc in his minor est querela ; et hi enim fortasse errant, Deum quærentes, et volentes invenire.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Etenim cum in operibus illius conversentur inquirunt, et persuasum habent quoniam bona sunt quæ videntur.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Iterum autem nec his debet ignosci.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Si enim tantum potuerunt scire ut possent æstimare sæculum, quomodo hujus Dominum non facilius invenerunt ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Infelices autem sunt, et inter mortuos spes illorum est, qui appellaverunt deos opera manuum hominum : aurum et argentum, artis inventionem, et similitudines animalium, aut lapidem inutilem, opus manus antiquæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Aut si quis artifex faber de silva lignum rectum secuerit, et hujus docte eradat omnem corticem, et arte sua usus diligenter fabricet vas utile in conversationem vitæ ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>reliquiis autem ejus operis ad præparationem escæ abutatur,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>et reliquum horum quod ad nullos usus facit, lignum curvum et vorticibus plenum sculpat diligenter per vacuitatem suam, et per scientiam suæ artis figuret illud, et assimilet illud imagini hominis,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>aut alicui ex animalibus illud comparet : perliniens rubrica, et rubicundum faciens fuco colorem illius, et omnem maculam quæ in illo est perliniens ;</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et faciat ei dignam habitationem, et in pariete ponens illud, et confirmans ferro</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>ne forte cadat, prospiciens illi : sciens quoniam non potest adjuvare se : imago enim est, et opus est illi adjutorium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et de substantia sua, et de filiis suis, et de nuptiis votum faciens inquirit : non erubescit loqui cum illo qui sine anima est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et pro sanitate quidem infirmum deprecatur, et pro vita rogat mortuum, et in adjutorium inutilem invocat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et pro itinere petit ab eo qui ambulare non potest ; et de acquirendo, et de operando, et de omnium rerum eventu, petit ab eo qui in omnibus est inutilis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/14/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 14</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->13<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-lab avicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"WIS.13\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":13,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"But all men are vain, in whom there is not the knowledge of God: and who by these good things that are seen, could not understand him that is, neither by attending to the works have acknowledged who was the workman:\"},{\"verse\":2,\"text\":\"But have imagined either the fire, or the wind, or the swift air, or the circle of the stars, or the great water, or the sun and moon, to be the gods that rule the world.\"},{\"verse\":3,\"text\":\"With whose beauty, if they, being delighted, took them to be gods: let them know how much the Lord of them is more beautiful than they: for the first author of beauty made all those things.\"},{\"verse\":4,\"text\":\"Or if they admired their power, and their effects, let them understand by them, that he that made them, is mightier than they:\"},{\"verse\":5,\"text\":\"For by the greatness of the beauty, and of the creature, the creator of them may be seen, so as to be known thereby.\"},{\"verse\":6,\"text\":\"But yet as to these they are less to be blamed. For they perhaps err, seeking God, and desirous to find him.\"},{\"verse\":7,\"text\":\"For being conversant among his works, they search: and they are persuaded that the things are good which are seen.\"},{\"verse\":8,\"text\":\"But then again they are not to be pardoned.\"},{\"verse\":9,\"text\":\"For if they were able to know so much as to make a judgment of the world: how did they not more easily find out the Lord thereof?\"},{\"verse\":10,\"text\":\"But unhappy are they, and their hope is among the dead, who have called gods the works of the hand of men, gold and silver, the inventions of art, and the resemblances of beasts, or an unprofitable stone the work of an ancient hand.\"},{\"verse\":11,\"text\":\"Or if an artist, a carpenter, hath cut down a tree proper for his use in the wood, and skilfully taken off all the bark thereof, and with his art, diligently formeth a vessel profitable for the common uses of life,\"},{\"verse\":12,\"text\":\"And useth the chips of his work to dress his meat:\"},{\"verse\":13,\"text\":\"And taking what was left thereof, which is good for nothing, being a crooked piece of wood, and full of knots, carveth it diligently when he hath nothing else to do, and by the skill of his art fashioneth it, and maketh it like the image of a man:\"},{\"verse\":14,\"text\":\"Or the resemblance of some beast, laying it over with vermilion, and painting it red, and covering every spot that is in it:\"},{\"verse\":15,\"text\":\"And maketh a convenient dwelling place for it, and setting it in a wall, and fastening it with iron,\"},{\"verse\":16,\"text\":\"Providing for it, lest it should fall, knowing that it is unable to help itself: for it is an image, and hath need of help.\"},{\"verse\":17,\"text\":\"And then maketh prayer to it, enquiring concerning his substance, and his children, or his marriage. And he is not ashamed to speak to that which hath no life:\"},{\"verse\":18,\"text\":\"And for health he maketh supplication to the weak, and for life prayeth to that which is dead, and for help calleth upon that which is unprofitable:\"},{\"verse\":19,\"text\":\"And for a good journey he petitioneth him that cannot walk: and for getting, and for working, and for the event of all things he asketh him that is unable to do any thing.\"}],\"vul\":[{\"verse\":1,\"text\":\"Vani autem sunt omnes homines in quibus non subest scientia Dei ; et de his quæ videntur bona, non potuerunt intelligere eum qui est, neque operibus attendentes agnoverunt quis esset artifex :\"},{\"verse\":2,\"text\":\"sed aut ignem, aut spiritum, aut citatum aërem, aut gyrum stellarum, aut nimiam aquam, aut solem et lunam, rectores orbis terrarum deos putaverunt.\"},{\"verse\":3,\"text\":\"Quorum si specie delectati, deos putaverunt, sciant quanto his dominator eorum speciosior est : speciei enim generator hæc omnia constituit.\"},{\"verse\":4,\"text\":\"Aut si virtutem et opera eorum mirati sunt, intelligant ab illis quoniam qui hæc fecit fortior est illis :\"},{\"verse\":5,\"text\":\"a magnitudine enim speciei et creaturæ cognoscibiliter poterit creator horum videri.\"},{\"verse\":6,\"text\":\"Sed tamen adhuc in his minor est querela ; et hi enim fortasse errant, Deum quærentes, et volentes invenire.\"},{\"verse\":7,\"text\":\"Etenim cum in operibus illius conversentur inquirunt, et persuasum habent quoniam bona sunt quæ videntur.\"},{\"verse\":8,\"text\":\"Iterum autem nec his debet ignosci.\"},{\"verse\":9,\"text\":\"Si enim tantum potuerunt scire ut possent æstimare sæculum, quomodo hujus Dominum non facilius invenerunt ?\"},{\"verse\":10,\"text\":\"Infelices autem sunt, et inter mortuos spes illorum est, qui appellaverunt deos opera manuum hominum : aurum et argentum, artis inventionem, et similitudines animalium, aut lapidem inutilem, opus manus antiquæ.\"},{\"verse\":11,\"text\":\"Aut si quis artifex faber de silva lignum rectum secuerit, et hujus docte eradat omnem corticem, et arte sua usus diligenter fabricet vas utile in conversationem vitæ ;\"},{\"verse\":12,\"text\":\"reliquiis autem ejus operis ad præparationem escæ abutatur,\"},{\"verse\":13,\"text\":\"et reliquum horum quod ad nullos usus facit, lignum curvum et vorticibus plenum sculpat diligenter per vacuitatem suam, et per scientiam suæ artis figuret illud, et assimilet illud imagini hominis,\"},{\"verse\":14,\"text\":\"aut alicui ex animalibus illud comparet : perliniens rubrica, et rubicundum faciens fuco colorem illius, et omnem maculam quæ in illo est perliniens ;\"},{\"verse\":15,\"text\":\"et faciat ei dignam habitationem, et in pariete ponens illud, et confirmans ferro\"},{\"verse\":16,\"text\":\"ne forte cadat, prospiciens illi : sciens quoniam non potest adjuvare se : imago enim est, et opus est illi adjutorium.\"},{\"verse\":17,\"text\":\"Et de substantia sua, et de filiis suis, et de nuptiis votum faciens inquirit : non erubescit loqui cum illo qui sine anima est.\"},{\"verse\":18,\"text\":\"Et pro sanitate quidem infirmum deprecatur, et pro vita rogat mortuum, et in adjutorium inutilem invocat.\"},{\"verse\":19,\"text\":\"Et pro itinere petit ab eo qui ambulare non potest ; et de acquirendo, et de operando, et de omnium rerum eventu, petit ab eo qui in omnibus est inutilis.\"}],\"summary\":\"Idolaters are inexcusable: and those most of all that worship for gods the works of the hands of men.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":12,\"label\":\"Wisdom 12\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":14,\"label\":\"Wisdom 14\"}}]]\n"])</script></body></html>
