0 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Wisdom<!-- --> <span class="text-stone-500">5</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The fruitless repentance of the wicked in another world: the reward of the just.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>These seeing it, shall be troubled with terrible fear, and shall be amazed at the suddenness of their unexpected salvation,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Saying within themselves, repenting, and groaning for anguish of spirit: These are they, whom we had sometime in derision, and for a parable of reproach.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>We fools esteemed their life madness, and their end without honour.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Behold, how they are numbered among the children of God, and their lot is among the saints.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Therefore we have erred from the way of truth, and the light of justice hath not shined unto us, and the sun of understanding hath not risen upon us.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>We wearied ourselves in the way of iniquity and destruction, and have walked through hard ways, but the way of the Lord we have not known.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>What hath pride profited us? or what advantage hath the boasting of riches brought us?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>All those things are passed away like a shadow, and like a post that runneth on,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And as a ship that passeth through the waves: whereof when it is gone by, the trace cannot be found, nor the path of its keel in the waters:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Or as when a bird flieth through the air, of the passage of which no mark can be found, but only the sound of the wings beating the light air, and parting it by the force of her flight: she moved her wings, and hath flown through, and there is no mark found afterwards of her way:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Or as when an arrow is shot at a mark, the divided air quickly cometh together again, so that the passage thereof is not known:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>So we also being born, forthwith ceased to be: and have been able to shew no mark of virtue: but are consumed in our wickedness.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Such things as these the sinners said in hell:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For the hope of the wicked is as dust, which is blown away with the wind, and as a thin froth which is dispersed by the storm: and a smoke that is scattered abroad by the wind: and as the remembrance of a guest of one day that passeth by.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But the just shall live for evermore: and their reward is with the Lord, and the care of them with the most High.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Therefore shall they receive a kingdom of glory, and a crown of beauty at the hand of the Lord: for with his right hand he will cover them, and with his holy arm he will defend them.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And his zeal will take armour, and he will arm the creature for the revenge of his enemies.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>He will put on justice as a breastplate, and will take true judgment instead of a helmet:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>He will take equity for an invincible shield:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And he will sharpen his severe wrath for a spear, and the whole world shall fight with him against the unwise.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Then shafts of lightning shall go directly from the clouds, as from a bow well bent, they shall be shot out, and shall fly to the mark.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And thick hail shall be cast upon them from the stone casting wrath: the water of the sea shall rage against them, and the rivers shall run together in a terrible manner.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>A mighty wind shall stand up against them, and as a whirlwind shall divide them: and their iniquity shall bring all the earth to a desert, and wickedness shall overthrow the thrones of the mighty.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc stabunt justi in magna constantia adversus eos qui se angustiaverunt, et qui abstulerunt labores eorum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Videntes turbabuntur timore horribili, et mirabuntur in subitatione insperatæ salutis ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>dicentes intra se, pœnitentiam agentes, et præ angustia spiritus gementes : Hi sunt quos habuimus aliquando in derisum, et in similitudinem improperii.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nos insensati, vitam illorum æstimabamus insaniam, et finem illorum sine honore ;</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>ecce quomodo computati sunt inter filios Dei, et inter sanctos sors illorum est.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ergo erravimus a via veritatis, et justitiæ lumen non luxit nobis, et sol intelligentiæ non est ortus nobis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Lassati sumus in via iniquitatis et perditionis, et ambulavimus vias difficiles : viam autem Domini ignoravimus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Quid nobis profuit superbia ? aut divitiarum jactantia quid contulit nobis ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Transierunt omnia illa tamquam umbra, et tamquam nuntius percurrens,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et tamquam navis quæ pertransit fluctuantem aquam, cujus cum præterierit non est vestigium invenire, neque semitam carinæ illius in fluctibus ;</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>aut tamquam avis quæ transvolat in aëre, cujus nullum invenitur argumentum itineris, sed tantum sonitus alarum verberans levem ventum, et scindens per vim itineris aërem : commotis alis transvolavit, et post hoc nullum signum invenitur itineris illius ;</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>aut tamquam sagitta emissa in locum destinatum, divisus aër continuo in se reclusus est, ut ignoretur transitus illius :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>sic et nos nati continuo desivimus esse ; et virtutis quidem nullum signum valuimus ostendere, in malignitate autem nostra consumpti sumus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Talia dixerunt in inferno hi qui peccaverunt :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>quoniam spes impii tamquam lanugo est quæ a vento tollitur, et tamquam spuma gracilis quæ a procella dispergitur, et tamquam fumus qui a vento diffusus est, et tamquam memoria hospitis unius diei prætereuntis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Justi autem in perpetuum vivent, et apud Dominum est merces eorum, et cogitatio illorum apud Altissimum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ideo accipient regnum decoris, et diadema speciei de manu Domini : quoniam dextera sua teget eos, et brachio sancto suo defendet illos.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Accipiet armaturam zelus illius, et armabit creaturam ad ultionem inimicorum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Induet pro thorace justitiam, et accipiet pro galea judicium certum ;</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sumet scutum inexpugnabile æquitatem.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Acuet autem duram iram in lanceam, et pugnabit cum illo orbis terrarum contra insensatos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Ibunt directe emissiones fulgurum, et tamquam a bene curvato arcu nubium exterminabuntur, et ad certum locum insilient.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et a petrosa ira plenæ mittentur grandines ; excandescet in illos aqua maris, et flumina concurrent duriter.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Contra illos stabit spiritus virtutis, et tamquam turbo venti dividet illos ; et ad eremum perducet omnem terram iniquitas illorum, et malignitas evertet sedes potentium.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Wisdom 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->19<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Wisdom 4" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/4/"><svg viewBox="0 0 "ChapterReader\"]\na:[[\"$\",\"$L17\",\"WIS.5\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":5,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.\"},{\"verse\":2,\"text\":\"These seeing it, shall be troubled with terrible fear, and shall be amazed at the suddenness of their unexpected salvation,\"},{\"verse\":3,\"text\":\"Saying within themselves, repenting, and groaning for anguish of spirit: These are they, whom we had sometime in derision, and for a parable of reproach.\"},{\"verse\":4,\"text\":\"We fools esteemed their life madness, and their end without honour.\"},{\"verse\":5,\"text\":\"Behold, how they are numbered among the children of God, and their lot is among the saints.\"},{\"verse\":6,\"text\":\"Therefore we have erred from the way of truth, and the light of justice hath not shined unto us, and the sun of understanding hath not risen upon us.\"},{\"verse\":7,\"text\":\"We wearied ourselves in the way of iniquity and destruction, and have walked through hard ways, but the way of the Lord we have not known.\"},{\"verse\":8,\"text\":\"What hath pride profited us? or what advantage hath the boasting of riches brought us?\"},{\"verse\":9,\"text\":\"All those things are passed away like a shadow, and like a post that runneth on,\"},{\"verse\":10,\"text\":\"And as a ship that passeth through the waves: whereof when it is gone by, the trace cannot be found, nor the path of its keel in the waters:\"},{\"verse\":11,\"text\":\"Or as when a bird flieth through the air, of the passage of which no mark can be found, but only the sound of the wings beating the light air, and parting it by the force of her flight: she moved her wings, and hath flown through, and there is no mark found afterwards of her way:\"},{\"verse\":12,\"text\":\"Or as when an arrow is shot at a mark, the divided air quickly cometh together again, so that the passage thereof is not known:\"},{\"verse\":13,\"text\":\"So we also being born, forthwith ceased to be: and have been able to shew no mark of virtue: but are consumed in our wickedness.\"},{\"verse\":14,\"text\":\"Such things as these the sinners said in hell:\"},{\"verse\":15,\"text\":\"For the hope of the wicked is as dust, which is blown away with the wind, and as a thin froth which is dispersed by the storm: and a smoke that is scattered abroad by the wind: and as the remembrance of a guest of one day that passeth by.\"},{\"verse\":16,\"text\":\"But the just shall live for evermore: and their reward is with the Lord, and the care of them with the most High.\"},{\"verse\":17,\"text\":\"Therefore shall they receive a kingdom of glory, and a crown of beauty at the hand of the Lord: for with his right hand he will cover them, and with his holy arm he will defend them.\"},{\"verse\":18,\"text\":\"And his zeal will take armour, and he will arm the creature for the revenge of his enemies.\"},{\"verse\":19,\"text\":\"He will put on justice as a breastplate, and will take true judgment instead of a helmet:\"},{\"verse\":20,\"text\":\"He will take equity for an invincible shield:\"},{\"verse\":21,\"text\":\"And he will sharpen his severe wrath for a spear, and the whole world shall fight with him against the unwise.\"},{\"verse\":22,\"text\":\"Then shafts of lightning shall go directly from the clouds, as from a bow well bent, they shall be shot out, and shall fly to the mark.\"},{\"verse\":23,\"text\":\"And thick hail shall be cast upon them from the stone casting wrath: the water of the sea shall rage against them, and the rivers shall run together in a terrible manner.\"},{\"verse\":24,\"text\":\"A mighty wind shall stand up against them, and as a whirlwind shall divide them: and their iniquity shall bring all the earth to a desert, and wickedness shall overthrow the thrones of the mighty.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc stabunt justi in magna constantia adversus eos qui se angustiaverunt, et qui abstulerunt labores eorum.\"},{\"verse\":2,\"text\":\"Videntes turbabuntur timore horribili, et mirabuntur in subitatione insperatæ salutis ;\"},{\"verse\":3,\"text\":\"dicentes intra se, pœnitentiam agentes, et præ angustia spiritus gementes : Hi sunt quos habuimus aliquando in derisum, et in similitudinem improperii.\"},{\"verse\":4,\"text\":\"Nos insensati, vitam illorum æstimabamus insaniam, et finem illorum sine honore ;\"},{\"verse\":5,\"text\":\"ecce quomodo computati sunt inter filios Dei, et inter sanctos sors illorum est.\"},{\"verse\":6,\"text\":\"Ergo erravimus a via veritatis, et justitiæ lumen non luxit nobis, et sol intelligentiæ non est ortus nobis.\"},{\"verse\":7,\"text\":\"Lassati sumus in via iniquitatis et perditionis, et ambulavimus vias difficiles : viam autem Domini ignoravimus.\"},{\"verse\":8,\"text\":\"Quid nobis profuit superbia ? aut divitiarum jactantia quid contulit nobis ?\"},{\"verse\":9,\"text\":\"Transierunt omnia illa tamquam umbra, et tamquam nuntius percurrens,\"},{\"verse\":10,\"text\":\"et tamquam navis quæ pertransit fluctuantem aquam, cujus cum præterierit non est vestigium invenire, neque semitam carinæ illius in fluctibus ;\"},{\"verse\":11,\"text\":\"aut tamquam avis quæ transvolat in aëre, cujus nullum invenitur argumentum itineris, sed tantum sonitus alarum verberans levem ventum, et scindens per vim itineris aërem : commotis alis transvolavit, et post hoc nullum signum invenitur itineris illius ;\"},{\"verse\":12,\"text\":\"aut tamquam sagitta emissa in locum destinatum, divisus aër continuo in se reclusus est, ut ignoretur transitus illius :\"},{\"verse\":13,\"text\":\"sic et nos nati continuo desivimus esse ; et virtutis quidem nullum signum valuimus ostendere, in malignitate autem nostra consumpti sumus.\"},{\"verse\":14,\"text\":\"Talia dixerunt in inferno hi qui peccaverunt :\"},{\"verse\":15,\"text\":\"quoniam spes impii tamquam lanugo est quæ a vento tollitur, et tamquam spuma gracilis quæ a procella dispergitur, et tamquam fumus qui a vento diffusus est, et tamquam memoria hospitis unius diei prætereuntis.\"},{\"verse\":16,\"text\":\"Justi autem in perpetuum vivent, et apud Dominum est merces eorum, et cogitatio illorum apud Altissimum.\"},{\"verse\":17,\"text\":\"Ideo accipient regnum decoris, et diadema speciei de manu Domini : quoniam dextera sua teget eos, et brachio sancto suo defendet illos.\"},{\"verse\":18,\"text\":\"Accipiet armaturam zelus illius, et armabit creaturam ad ultionem inimicorum.\"},{\"verse\":19,\"text\":\"Induet pro thorace justitiam, et accipiet pro galea judicium certum ;\"},{\"verse\":20,\"text\":\"sumet scutum inexpugnabile æquitatem.\"},{\"verse\":21,\"text\":\"Acuet autem duram iram in lanceam, et pugnabit cum illo orbis terrarum contra insensatos.\"},{\"verse\":22,\"text\":\"Ibunt directe emissiones fulgurum, et tamquam a bene curvato arcu nubium exterminabuntur, et ad certum locum insilient.\"},{\"verse\":23,\"text\":\"Et a petrosa ira plenæ mittentur grandines ; excandescet in illos aqua maris, et flumina concurrent duriter.\"},{\"verse\":24,\"text\":\"Contra illos stabit spiritus virtutis, et tamquam turbo venti dividet illos ; et ad eremum perducet omnem terram iniquitas illorum, et malignitas evertet sedes potentium.\"}],\"summary\":\"The fruitless repentance of the wicked in another world: the reward of the just.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":4,\"label\":\"Wisdom 4\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":6,\"label\":\"Wisdom 6\"}}]]\n"])</script></body></html>
