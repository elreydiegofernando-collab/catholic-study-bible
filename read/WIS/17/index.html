button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For thy judgments, O Lord, are great, and thy words cannot be expressed: therefore undisciplined souls have erred.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>For while the wicked thought to be able to have dominion over the holy nation, they themselves being fettered with the bonds of darkness, and a long night, shut up in their houses, lay there exiled from the eternal providence.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And while they thought to lie hid in their obscure sins, they were scattered under a dark veil of forgetfullness, being horribly afraid, and troubled with exceeding great astonishment.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For neither did the den that held them, keep them from fear: for noises coming down troubled them, and sad visions appearing to them, affrighted them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And no power of fire could give them light, neither could the bright flames of the stars enlighten that horrible night.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But there appeared to them a sudden fire, very dreadful: and being struck with the fear of that face, which was not seen, they thought the things which they saw to be worse:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the delusions of their magic art were put down, and their boasting of wisdom was reproachfully rebuked.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For they who promised to drive away fears and troubles from a sick soul, were sick themselves of a fear worthy to be laughed at.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For though no terrible thing disturbed them: yet being scared with the passing by of beasts, and hissing of serpents, they died for fear and denying that they saw the air, which could by no means be avoided.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For whereas wickedness is fearful, it beareth witness of its condemnation: for a troubled conscience always forecasteth grievous things.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For fear is nothing else but a yielding up of the succours from thought.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And while there is less expectation from within, the greater doth it count the ignorance of that cause which bringeth the torment.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But they that during that night, in which nothing could be done, and which came upon them from the lowest and deepest hell, slept the same sleep,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Were sometimes molested with the fear of monsters, sometimes fainted away, their soul failing them: for a sudden and unlooked for fear was come upon them.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Moreover, if any of them had fallen down, he was kept shut up in prison without irons.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For if any one were a husbandman, or a shepherd, or a labourer in the field, and was suddenly overtaken, he endured a necessity from which he could not fly.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For they were all bound together with one chain of darkness. Whether it were a whistling wind, or the melodious voice of birds, among the spreading branches of trees, or a fall of water running down with violence,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Or the mighty noise of stones tumbling down, or the running that could not be seen of beasts playing together, or the roaring voice of wild beasts, or a rebounding echo from the highest mountains: these things made them to swoon for fear.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For the whole world was enlightened, with a clear light, and none were hindered in their labours.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But over them only was spread a heavy night, an image of that darkness which was to come upon them. But they were to themselves more grievous than the darkness.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Magna sunt enim judicia tua, Domine, et inenarrabilia verba tua : propter hoc indisciplinatæ animæ erraverunt.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dum enim persuasum habent iniqui posse dominari nationi sanctæ, vinculis tenebrarum et longæ noctis compediti, inclusi sub tectis, fugitivi perpetuæ providentiæ jacuerunt.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dum putant se latere in obscuris peccatis, tenebroso oblivionis velamento dispersi sunt, paventes horrende, et cum admiratione nimia perturbati.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Neque enim quæ continebat illos spelunca sine timore custodiebat, quoniam sonitus descendens perturbabat illos, et personæ tristes illis apparentes pavorem illis præstabant.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et ignis quidem nulla vis poterat illis lumen præbere, nec siderum limpidæ flammæ illuminare poterant illam noctem horrendam.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Apparebat autem illis subitaneus ignis, timore plenus ; et timore perculsi illius quæ non videbatur faciei, æstimabant deteriora esse quæ videbantur.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et magicæ artis appositi erant derisus, et sapientiæ gloriæ correptio cum contumelia.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Illi enim qui promittebant timores et perturbationes expellere se ab anima languente, hi cum derisu pleni timore languebant.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nam etsi nihil illos ex monstris perturbabat, transitu animalium et serpentium sibilatione commoti, tremebundi peribant, et aërem quem nulla ratione quis effugere posset, negantes se videre.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cum sit enim timida nequitia, dat testimonium condemnationis : semper enim præsumit sæva, perturbata conscientia :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>nihil enim est timor nisi proditio cogitationis auxiliorum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et dum ab intus minor est exspectatio, majorem computat inscientiam ejus causæ, de qua tormentum præstat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Illi autem qui impotentem vere noctem, et ab infimis et ab altissimis inferis supervenientem, eumdem somnum dormientes,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>aliquando monstrorum exagitabantur timore, aliquando animæ deficiebant traductione : subitaneus enim illis et insperatus timor supervenerat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Deinde si quisquam ex illis decidisset, custodiebatur in carcere sine ferro reclusus.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Si enim rusticus quis erat, aut pastor, aut agri laborum operarius præoccupatus esset, ineffugibilem sustinebat necessitatem ;</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>una enim catena tenebrarum omnes erant colligati. Sive spiritus sibilans, aut inter spissos arborum ramos avium sonus suavis, aut vis aquæ decurrentis nimium,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>aut sonus validus præcipitatarum petrarum, aut ludentium animalium cursus invisus, aut mugientium valida bestiarum vox, aut resonans de altissimis montibus echo : deficientes faciebant illos præ timore.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Omnis enim orbis terrarum limpido illuminabatur lumine, et non impeditis operibus continebatur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Solis autem illis superposita erat gravis nox, imago tenebrarum quæ superventura illis erat : ipsi ergo sibi erant graviores tenebris.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-s 12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Wisdom 17 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.17\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":17,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"For thy judgments, O Lord, are great, and thy words cannot be expressed: therefore undisciplined souls have erred.\"},{\"verse\":2,\"text\":\"For while the wicked thought to be able to have dominion over the holy nation, they themselves being fettered with the bonds of darkness, and a long night, shut up in their houses, lay there exiled from the eternal providence.\"},{\"verse\":3,\"text\":\"And while they thought to lie hid in their obscure sins, they were scattered under a dark veil of forgetfullness, being horribly afraid, and troubled with exceeding great astonishment.\"},{\"verse\":4,\"text\":\"For neither did the den that held them, keep them from fear: for noises coming down troubled them, and sad visions appearing to them, affrighted them.\"},{\"verse\":5,\"text\":\"And no power of fire could give them light, neither could the bright flames of the stars enlighten that horrible night.\"},{\"verse\":6,\"text\":\"But there appeared to them a sudden fire, very dreadful: and being struck with the fear of that face, which was not seen, they thought the things which they saw to be worse:\"},{\"verse\":7,\"text\":\"And the delusions of their magic art were put down, and their boasting of wisdom was reproachfully rebuked.\"},{\"verse\":8,\"text\":\"For they who promised to drive away fears and troubles from a sick soul, were sick themselves of a fear worthy to be laughed at.\"},{\"verse\":9,\"text\":\"For though no terrible thing disturbed them: yet being scared with the passing by of beasts, and hissing of serpents, they died for fear and denying that they saw the air, which could by no means be avoided.\"},{\"verse\":10,\"text\":\"For whereas wickedness is fearful, it beareth witness of its condemnation: for a troubled conscience always forecasteth grievous things.\"},{\"verse\":11,\"text\":\"For fear is nothing else but a yielding up of the succours from thought.\"},{\"verse\":12,\"text\":\"And while there is less expectation from within, the greater doth it count the ignorance of that cause which bringeth the torment.\"},{\"verse\":13,\"text\":\"But they that during that night, in which nothing could be done, and which came upon them from the lowest and deepest hell, slept the same sleep,\"},{\"verse\":14,\"text\":\"Were sometimes molested with the fear of monsters, sometimes fainted away, their soul failing them: for a sudden and unlooked for fear was come upon them.\"},{\"verse\":15,\"text\":\"Moreover, if any of them had fallen down, he was kept shut up in prison without irons.\"},{\"verse\":16,\"text\":\"For if any one were a husbandman, or a shepherd, or a labourer in the field, and was suddenly overtaken, he endured a necessity from which he could not fly.\"},{\"verse\":17,\"text\":\"For they were all bound together with one chain of darkness. Whether it were a whistling wind, or the melodious voice of birds, among the spreading branches of trees, or a fall of water running down with violence,\"},{\"verse\":18,\"text\":\"Or the mighty noise of stones tumbling down, or the running that could not be seen of beasts playing together, or the roaring voice of wild beasts, or a rebounding echo from the highest mountains: these things made them to swoon for fear.\"},{\"verse\":19,\"text\":\"For the whole world was enlightened, with a clear light, and none were hindered in their labours.\"},{\"verse\":20,\"text\":\"But over them only was spread a heavy night, an image of that darkness which was to come upon them. But they were to themselves more grievous than the darkness.\"}],\"vul\":[{\"verse\":1,\"text\":\"Magna sunt enim judicia tua, Domine, et inenarrabilia verba tua : propter hoc indisciplinatæ animæ erraverunt.\"},{\"verse\":2,\"text\":\"Dum enim persuasum habent iniqui posse dominari nationi sanctæ, vinculis tenebrarum et longæ noctis compediti, inclusi sub tectis, fugitivi perpetuæ providentiæ jacuerunt.\"},{\"verse\":3,\"text\":\"Et dum putant se latere in obscuris peccatis, tenebroso oblivionis velamento dispersi sunt, paventes horrende, et cum admiratione nimia perturbati.\"},{\"verse\":4,\"text\":\"Neque enim quæ continebat illos spelunca sine timore custodiebat, quoniam sonitus descendens perturbabat illos, et personæ tristes illis apparentes pavorem illis præstabant.\"},{\"verse\":5,\"text\":\"Et ignis quidem nulla vis poterat illis lumen præbere, nec siderum limpidæ flammæ illuminare poterant illam noctem horrendam.\"},{\"verse\":6,\"text\":\"Apparebat autem illis subitaneus ignis, timore plenus ; et timore perculsi illius quæ non videbatur faciei, æstimabant deteriora esse quæ videbantur.\"},{\"verse\":7,\"text\":\"Et magicæ artis appositi erant derisus, et sapientiæ gloriæ correptio cum contumelia.\"},{\"verse\":8,\"text\":\"Illi enim qui promittebant timores et perturbationes expellere se ab anima languente, hi cum derisu pleni timore languebant.\"},{\"verse\":9,\"text\":\"Nam etsi nihil illos ex monstris perturbabat, transitu animalium et serpentium sibilatione commoti, tremebundi peribant, et aërem quem nulla ratione quis effugere posset, negantes se videre.\"},{\"verse\":10,\"text\":\"Cum sit enim timida nequitia, dat testimonium condemnationis : semper enim præsumit sæva, perturbata conscientia :\"},{\"verse\":11,\"text\":\"nihil enim est timor nisi proditio cogitationis auxiliorum.\"},{\"verse\":12,\"text\":\"Et dum ab intus minor est exspectatio, majorem computat inscientiam ejus causæ, de qua tormentum præstat.\"},{\"verse\":13,\"text\":\"Illi autem qui impotentem vere noctem, et ab infimis et ab altissimis inferis supervenientem, eumdem somnum dormientes,\"},{\"verse\":14,\"text\":\"aliquando monstrorum exagitabantur timore, aliquando animæ deficiebant traductione : subitaneus enim illis et insperatus timor supervenerat.\"},{\"verse\":15,\"text\":\"Deinde si quisquam ex illis decidisset, custodiebatur in carcere sine ferro reclusus.\"},{\"verse\":16,\"text\":\"Si enim rusticus quis erat, aut pastor, aut agri laborum operarius præoccupatus esset, ineffugibilem sustinebat necessitatem ;\"},{\"verse\":17,\"text\":\"una enim catena tenebrarum omnes erant colligati. Sive spiritus sibilans, aut inter spissos arborum ramos avium sonus suavis, aut vis aquæ decurrentis nimium,\"},{\"verse\":18,\"text\":\"aut sonus validus præcipitatarum petrarum, aut ludentium animalium cursus invisus, aut mugientium valida bestiarum vox, aut resonans de altissimis montibus echo : deficientes faciebant illos præ timore.\"},{\"verse\":19,\"text\":\"Omnis enim orbis terrarum limpido illuminabatur lumine, et non impeditis operibus continebatur.\"},{\"verse\":20,\"text\":\"Solis autem illis superposita erat gravis nox, imago tenebrarum quæ superventura illis erat : ipsi ergo sibi erant graviores tenebris.\"}],\"summary\":\"The Egyptian darkness.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":16,\"label\":\"Wisdom 16\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":18,\"label\":\"Wisdom 18\"}}]]\n"])</script></body></html>
