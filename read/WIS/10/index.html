-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>She preserved him, that was first formed by God, the father of the world, when he was created alone,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And she brought him out of his sin, and gave him power to govern all things.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But when the unjust went away from her in his anger, he perished by the fury wherewith he murdered his brother.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For whose cause, when water destroyed the earth, wisdom healed it again, directing the course of the just by contemptible wood.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Moreover, when the nations had conspired together to consent to wickedness, she knew the just, and preserved him without blame to God, and kept him strong against the compassion for his son.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>She delivered the just man, who fled from the wicked that were perishing, when the fire came down upon Pentapolis:</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Whose land, for a testimony of their wickedness, is desolate, and smoketh to this day, and the trees bear fruits that ripen not, and a standing pillar of salt is a monument of an incredulous soul.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For regarding not wisdom, they did not only slip in this, that they were ignorant of good things; but they left also unto men a memorial of their folly, so that in the things in which they sinned, they could not so much as lie hid.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But wisdom hath delivered from sorrow them that attend upon her.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>She conducted the just, when he fled from his brother’s wrath, through the right ways, and shewed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In the deceit of them that overreached him, she stood by him, and made him honourable.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>She kept him safe from his enemies, and she defended him from seducers, and gave him a strong conflict, that he might overcome, and know that wisdom is mightier than all.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>She forsook not the just when he was sold, but delivered him from sinners: she went down with him into the pit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And in bands she left him not, till she brought him the sceptre of the kingdom, and power against those that oppressed him: and shewed them to be liars that had accused him, and gave him everlasting glory.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>She delivered the just people, and blameless seed, from the nations that oppressed them.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>She entered into the soul of the servant of God and stood against dreadful kings in wonders and signs.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And she rendered to the just the wages of their labours, and conducted them in a wonderful way: and she was to them for a covert by day, and for the light of stars by night:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And she brought them through the Red Sea, and carried them over through a great water.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>But their enemies she drowned in the sea, and from the depth of hell she brought them out. Therefore the just took the spoils of the wicked.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And they sung to thy holy name, O Lord, and they praised with one accord thy victorious hand.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For wisdom opened the mouth of the dumb, and made the tongues of infants eloquent.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc illum qui primus formatus est a Deo patre orbis terrarum, cum solus esset creatus, custodivit,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et eduxit illum a delicto suo, et dedit illi virtutem continendi omnia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Ab hac ut recessit injustus in ira sua, per iram homicidii fraterni deperiit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Propter quem cum aqua deleret terram, sanavit iterum sapientia, per contemptibile lignum justum gubernans.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hæc et in consensu nequitiæ, cum se nationes contulissent, scivit justum, et conservavit sine querela Deo, et in filii misericordia fortem custodivit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hæc justum a pereuntibus impiis liberavit fugientem, descendente igne in Pentapolim :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quibus in testimonium nequitiæ fumigabunda constat deserta terra, et incerto tempore fructus habentes arbores : et incredibilis animæ memoria stans figmentum salis.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sapientiam enim prætereuntes, non tantum in hoc lapsi sunt ut ignorarent bona, sed et insipientiæ suæ reliquerunt hominibus memoriam, ut in his quæ peccaverunt nec latere potuissent.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Sapientia autem hos qui se observant a doloribus liberavit.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Hæc profugum iræ fratris justum deduxit per vias rectas, et ostendit illi regnum Dei, et dedit illi scientiam sanctorum ; honestavit illum in laboribus, et complevit labores illius.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>In fraude circumvenientium illum affuit illi, et honestum fecit illum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Custodivit illum ab inimicis, et a seductoribus tutavit illum : et certamen forte dedit illi ut vinceret, et sciret quoniam omnium potentior est sapientia.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Hæc venditum justum non dereliquit, sed a peccatoribus liberavit eum ; descenditque cum illo in foveam,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et in vinculis non dereliquit illum, donec afferret illi sceptrum regni, et potentiam adversus eos qui eum deprimebant : et mendaces ostendit qui maculaverunt illum, et dedit illi claritatem æternam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Hæc populum justum et semen sine querela liberavit a nationibus quæ illum deprimebant.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Intravit in animam servi Dei, et stetit contra reges horrendos in portentis et signis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et reddidit justis mercedem laborum suorum, et deduxit illos in via mirabili : et fuit illis in velamento diei, et in luce stellarum per noctem ;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>transtulit illos per mare Rubrum, et transvexit illos per aquam nimiam.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Inimicos autem illorum demersit in mare, et ab altitudine inferorum eduxit illos. Ideo justi tulerunt spolia impiorum,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>et decantaverunt, Domine, nomen sanctum tuum, et victricem manum tuam laudaverunt pariter :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quoniam sapientia aperuit os mutorum, et linguas infantium fecit disertas.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/WIS/9/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Wisdom 9</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 te te, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"WIS.10\",{\"bookId\":25,\"usfm\":\"WIS\",\"bookName\":\"Wisdom\",\"drName\":\"Wisdom\",\"chapter\":10,\"totalChapters\":19,\"dra\":[{\"verse\":1,\"text\":\"She preserved him, that was first formed by God, the father of the world, when he was created alone,\"},{\"verse\":2,\"text\":\"And she brought him out of his sin, and gave him power to govern all things.\"},{\"verse\":3,\"text\":\"But when the unjust went away from her in his anger, he perished by the fury wherewith he murdered his brother.\"},{\"verse\":4,\"text\":\"For whose cause, when water destroyed the earth, wisdom healed it again, directing the course of the just by contemptible wood.\"},{\"verse\":5,\"text\":\"Moreover, when the nations had conspired together to consent to wickedness, she knew the just, and preserved him without blame to God, and kept him strong against the compassion for his son.\"},{\"verse\":6,\"text\":\"She delivered the just man, who fled from the wicked that were perishing, when the fire came down upon Pentapolis:\"},{\"verse\":7,\"text\":\"Whose land, for a testimony of their wickedness, is desolate, and smoketh to this day, and the trees bear fruits that ripen not, and a standing pillar of salt is a monument of an incredulous soul.\"},{\"verse\":8,\"text\":\"For regarding not wisdom, they did not only slip in this, that they were ignorant of good things; but they left also unto men a memorial of their folly, so that in the things in which they sinned, they could not so much as lie hid.\"},{\"verse\":9,\"text\":\"But wisdom hath delivered from sorrow them that attend upon her.\"},{\"verse\":10,\"text\":\"She conducted the just, when he fled from his brother’s wrath, through the right ways, and shewed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours.\"},{\"verse\":11,\"text\":\"In the deceit of them that overreached him, she stood by him, and made him honourable.\"},{\"verse\":12,\"text\":\"She kept him safe from his enemies, and she defended him from seducers, and gave him a strong conflict, that he might overcome, and know that wisdom is mightier than all.\"},{\"verse\":13,\"text\":\"She forsook not the just when he was sold, but delivered him from sinners: she went down with him into the pit.\"},{\"verse\":14,\"text\":\"And in bands she left him not, till she brought him the sceptre of the kingdom, and power against those that oppressed him: and shewed them to be liars that had accused him, and gave him everlasting glory.\"},{\"verse\":15,\"text\":\"She delivered the just people, and blameless seed, from the nations that oppressed them.\"},{\"verse\":16,\"text\":\"She entered into the soul of the servant of God and stood against dreadful kings in wonders and signs.\"},{\"verse\":17,\"text\":\"And she rendered to the just the wages of their labours, and conducted them in a wonderful way: and she was to them for a covert by day, and for the light of stars by night:\"},{\"verse\":18,\"text\":\"And she brought them through the Red Sea, and carried them over through a great water.\"},{\"verse\":19,\"text\":\"But their enemies she drowned in the sea, and from the depth of hell she brought them out. Therefore the just took the spoils of the wicked.\"},{\"verse\":20,\"text\":\"And they sung to thy holy name, O Lord, and they praised with one accord thy victorious hand.\"},{\"verse\":21,\"text\":\"For wisdom opened the mouth of the dumb, and made the tongues of infants eloquent.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc illum qui primus formatus est a Deo patre orbis terrarum, cum solus esset creatus, custodivit,\"},{\"verse\":2,\"text\":\"et eduxit illum a delicto suo, et dedit illi virtutem continendi omnia.\"},{\"verse\":3,\"text\":\"Ab hac ut recessit injustus in ira sua, per iram homicidii fraterni deperiit.\"},{\"verse\":4,\"text\":\"Propter quem cum aqua deleret terram, sanavit iterum sapientia, per contemptibile lignum justum gubernans.\"},{\"verse\":5,\"text\":\"Hæc et in consensu nequitiæ, cum se nationes contulissent, scivit justum, et conservavit sine querela Deo, et in filii misericordia fortem custodivit.\"},{\"verse\":6,\"text\":\"Hæc justum a pereuntibus impiis liberavit fugientem, descendente igne in Pentapolim :\"},{\"verse\":7,\"text\":\"quibus in testimonium nequitiæ fumigabunda constat deserta terra, et incerto tempore fructus habentes arbores : et incredibilis animæ memoria stans figmentum salis.\"},{\"verse\":8,\"text\":\"Sapientiam enim prætereuntes, non tantum in hoc lapsi sunt ut ignorarent bona, sed et insipientiæ suæ reliquerunt hominibus memoriam, ut in his quæ peccaverunt nec latere potuissent.\"},{\"verse\":9,\"text\":\"Sapientia autem hos qui se observant a doloribus liberavit.\"},{\"verse\":10,\"text\":\"Hæc profugum iræ fratris justum deduxit per vias rectas, et ostendit illi regnum Dei, et dedit illi scientiam sanctorum ; honestavit illum in laboribus, et complevit labores illius.\"},{\"verse\":11,\"text\":\"In fraude circumvenientium illum affuit illi, et honestum fecit illum.\"},{\"verse\":12,\"text\":\"Custodivit illum ab inimicis, et a seductoribus tutavit illum : et certamen forte dedit illi ut vinceret, et sciret quoniam omnium potentior est sapientia.\"},{\"verse\":13,\"text\":\"Hæc venditum justum non dereliquit, sed a peccatoribus liberavit eum ; descenditque cum illo in foveam,\"},{\"verse\":14,\"text\":\"et in vinculis non dereliquit illum, donec afferret illi sceptrum regni, et potentiam adversus eos qui eum deprimebant : et mendaces ostendit qui maculaverunt illum, et dedit illi claritatem æternam.\"},{\"verse\":15,\"text\":\"Hæc populum justum et semen sine querela liberavit a nationibus quæ illum deprimebant.\"},{\"verse\":16,\"text\":\"Intravit in animam servi Dei, et stetit contra reges horrendos in portentis et signis.\"},{\"verse\":17,\"text\":\"Et reddidit justis mercedem laborum suorum, et deduxit illos in via mirabili : et fuit illis in velamento diei, et in luce stellarum per noctem ;\"},{\"verse\":18,\"text\":\"transtulit illos per mare Rubrum, et transvexit illos per aquam nimiam.\"},{\"verse\":19,\"text\":\"Inimicos autem illorum demersit in mare, et ab altitudine inferorum eduxit illos. Ideo justi tulerunt spolia impiorum,\"},{\"verse\":20,\"text\":\"et decantaverunt, Domine, nomen sanctum tuum, et victricem manum tuam laudaverunt pariter :\"},{\"verse\":21,\"text\":\"quoniam sapientia aperuit os mutorum, et linguas infantium fecit disertas.\"}],\"summary\":\"What wisdom did for Adam, Noe, Abraham, Lot, Jacob, Joseph, and the people of Israel.\",\"intro\":null,\"prev\":{\"usfm\":\"WIS\",\"chapter\":9,\"label\":\"Wisdom 9\"},\"next\":{\"usfm\":\"WIS\",\"chapter\":11,\"label\":\"Wisdom 11\"}}]]\n"])</script></body></html>
