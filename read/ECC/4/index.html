s="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ecclesiastes<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/ECC/">About <!-- -->Ecclesiastes</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Other instances of human miseries.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I turned myself to other things, and I saw the oppressions that are done under the sun, and the tears of the innocent, and they had no comforter; and they were not able to resist their violence, being destitute of help from any.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And I praised the dead rather than the living:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And I judged him happier than them both, that is not yet born, nor hath seen the evils that are done under the sun.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Again I considered all the labours of men, and I remarked that their industries are exposed to the envy of their neighbour: so in this also there is vanity, and fruitless care.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The fool foldeth his hands together, and eateth his own flesh, saying:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Better is a handful with rest, than both hands full with labour, and vexation of mind.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Considering I found also another vanity under the sun:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>There is but one, and he hath not a second, no child, no brother, and yet he ceaseth not to labour, neither are his eyes satisfied with riches, neither doth he reflect, saying: For whom do I labour, and defraud my soul of good things? in this also is vanity, and a grievous vexation.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>It is better therefore that two should be together, than one: for they have the advantage of their society:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If one fall he shall be supported by the other: woe to him that is alone, for when he falleth, he hath none to lift him up.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And if two lie together, they shall warm one another: how shall one alone be warmed?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And if a man prevail against one, two shall withstand him: a threefold cord is not easily broken.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Better is a child that is poor and wise, than a king that is old and foolish, who knoweth not to foresee for hereafter.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Because out of prison and chains sometimes a man cometh forth to a kingdom: and another born king is consumed with poverty.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I saw all men living, that walk under the sun with the second young man, who shall rise up in his place.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The number of the people, of all that were before him is infinite: and they that shall come afterwards, shall not rejoice in him: but this also is vanity, and vexation of spirit.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Keep thy foot, when thou goest into the house of God, and draw nigh to hear. For much better is obedience, than the victims of fools, who know not what evil they do.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Verti me ad alia, et vidi calumnias quæ sub sole geruntur, et lacrimas innocentium, et neminem consolatorem, nec posse resistere eorum violentiæ, cunctorum auxilio destitutos,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et laudavi magis mortuos quam viventes ;</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et feliciorem utroque judicavi qui necdum natus est, nec vidit mala quæ sub sole fiunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Rursum contemplatus sum omnes labores hominum, et industrias animadverti patere invidiæ proximi ; et in hoc ergo vanitas et cura superflua est.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Stultus complicat manus suas, et comedit carnes suas, dicens :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Melior est pugillus cum requie, quam plena utraque manus cum labore et afflictione animi.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Considerans, reperi et aliam vanitatem sub sole.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Unus est, et secundum non habet, non filium, non fratrem, et tamen laborare non cessat, nec satiantur oculi ejus divitiis ; nec recogitat, dicens : Cui laboro, et fraudo animam meam bonis ? In hoc quoque vanitas est et afflictio pessima.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Melius est ergo duos esse simul quam unum ; habent enim emolumentum societatis suæ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si unus ceciderit, ab altero fulcietur. Væ soli, quia cum ceciderit, non habet sublevantem se.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et si dormierint duo, fovebuntur mutuo ; unus quomodo calefiet ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et si quispiam prævaluerit contra unum, duo resistunt ei ; funiculus triplex difficile rumpitur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Melior est puer pauper et sapiens, rege sene et stulto, qui nescit prævidere in posterum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Quod de carcere catenisque interdum quis egrediatur ad regnum ; et alius, natus in regno, inopia consumatur.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Vidi cunctos viventes qui ambulant sub sole cum adolescente secundo, qui consurget pro eo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Infinitus numerus est populi omnium qui fuerunt ante eum, et qui postea futuri sunt non lætabuntur in eo ; sed et hoc vanitas et afflictio spiritus.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Custodi pedem tuum ingrediens domum Dei, et appropinqua ut audias. Multo enim melior est obedientia quam stultorum victimæ, qui nesciunt quid faciunt mali.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ECC/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ecclesiastes 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border borde nor hath seen the evils that are done under the sun.\"},{\"verse\":4,\"text\":\"Again I considered all the labours of men, and I remarked that their industries are exposed to the envy of their neighbour: so in this also there is vanity, and fruitless care.\"},{\"verse\":5,\"text\":\"The fool foldeth his hands together, and eateth his own flesh, saying:\"},{\"verse\":6,\"text\":\"Better is a handful with rest, than both hands full with labour, and vexation of mind.\"},{\"verse\":7,\"text\":\"Considering I found also another vanity under the sun:\"},{\"verse\":8,\"text\":\"There is but one, and he hath not a second, no child, no brother, and yet he ceaseth not to labour, neither are his eyes satisfied with riches, neither doth he reflect, saying: For whom do I labour, and defraud my soul of good things? in this also is vanity, and a grievous vexation.\"},{\"verse\":9,\"text\":\"It is better therefore that two should be together, than one: for they have the advantage of their society:\"},{\"verse\":10,\"text\":\"If one fall he shall be supported by the other: woe to him that is alone, for when he falleth, he hath none to lift him up.\"},{\"verse\":11,\"text\":\"And if two lie together, they shall warm one another: how shall one alone be warmed?\"},{\"verse\":12,\"text\":\"And if a man prevail against one, two shall withstand him: a threefold cord is not easily broken.\"},{\"verse\":13,\"text\":\"Better is a child that is poor and wise, than a king that is old and foolish, who knoweth not to foresee for hereafter.\"},{\"verse\":14,\"text\":\"Because out of prison and chains sometimes a man cometh forth to a kingdom: and another born king is consumed with poverty.\"},{\"verse\":15,\"text\":\"I saw all men living, that walk under the sun with the second young man, who shall rise up in his place.\"},{\"verse\":16,\"text\":\"The number of the people, of all that were before him is infinite: and they that shall come afterwards, shall not rejoice in him: but this also is vanity, and vexation of spirit.\"},{\"verse\":17,\"text\":\"Keep thy foot, when thou goest into the house of God, and draw nigh to hear. For much better is obedience, than the victims of fools, who know not what evil they do.\"}],\"vul\":[{\"verse\":1,\"text\":\"Verti me ad alia, et vidi calumnias quæ sub sole geruntur, et lacrimas innocentium, et neminem consolatorem, nec posse resistere eorum violentiæ, cunctorum auxilio destitutos,\"},{\"verse\":2,\"text\":\"et laudavi magis mortuos quam viventes ;\"},{\"verse\":3,\"text\":\"et feliciorem utroque judicavi qui necdum natus est, nec vidit mala quæ sub sole fiunt.\"},{\"verse\":4,\"text\":\"Rursum contemplatus sum omnes labores hominum, et industrias animadverti patere invidiæ proximi ; et in hoc ergo vanitas et cura superflua est.\"},{\"verse\":5,\"text\":\"Stultus complicat manus suas, et comedit carnes suas, dicens :\"},{\"verse\":6,\"text\":\"Melior est pugillus cum requie, quam plena utraque manus cum labore et afflictione animi.\"},{\"verse\":7,\"text\":\"Considerans, reperi et aliam vanitatem sub sole.\"},{\"verse\":8,\"text\":\"Unus est, et secundum non habet, non filium, non fratrem, et tamen laborare non cessat, nec satiantur oculi ejus divitiis ; nec recogitat, dicens : Cui laboro, et fraudo animam meam bonis ? In hoc quoque vanitas est et afflictio pessima.\"},{\"verse\":9,\"text\":\"Melius est ergo duos esse simul quam unum ; habent enim emolumentum societatis suæ.\"},{\"verse\":10,\"text\":\"Si unus ceciderit, ab altero fulcietur. Væ soli, quia cum ceciderit, non habet sublevantem se.\"},{\"verse\":11,\"text\":\"Et si dormierint duo, fovebuntur mutuo ; unus quomodo calefiet ?\"},{\"verse\":12,\"text\":\"Et si quispiam prævaluerit contra unum, duo resistunt ei ; funiculus triplex difficile rumpitur.\"},{\"verse\":13,\"text\":\"Melior est puer pauper et sapiens, rege sene et stulto, qui nescit prævidere in posterum.\"},{\"verse\":14,\"text\":\"Quod de carcere catenisque interdum quis egrediatur ad regnum ; et alius, natus in regno, inopia consumatur.\"},{\"verse\":15,\"text\":\"Vidi cunctos viventes qui ambulant sub sole cum adolescente secundo, qui consurget pro eo.\"},{\"verse\":16,\"text\":\"Infinitus numerus est populi omnium qui fuerunt ante eum, et qui postea futuri sunt non lætabuntur in eo ; sed et hoc vanitas et afflictio spiritus.\"},{\"verse\":17,\"text\":\"Custodi pedem tuum ingrediens domum Dei, et appropinqua ut audias. Multo enim melior est obedientia quam stultorum victimæ, qui nesciunt quid faciunt mali.\"}],\"summary\":\"Other instances of human miseries.\",\"intro\":null,\"prev\":{\"usfm\":\"ECC\",\"chapter\":3,\"label\":\"Ecclesiastes 3\"},\"next\":{\"usfm\":\"ECC\",\"chapter\":5,\"label\":\"Ecclesiastes 5\"}}]]\n"])</script></body></html>
