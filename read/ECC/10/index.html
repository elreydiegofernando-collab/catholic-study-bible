-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Dying flies spoil the sweetness of the ointment. Wisdom and glory is more precious than a small and shortlived folly.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>The heart of a wise man is in his right hand, and the heart of a fool is in his left hand.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Yea, and the fool when he walketh in the way, whereas he himself is a fool, esteemeth all men fools.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>If the spirit of him that hath power, ascend upon thee, leave not thy place: because care will make the greatest sins to cease.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>There is an evil that I have seen under the sun, as it were by an error proceeding from the face of the prince:</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>A fool set in high dignity, and the rich sitting beneath.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I have seen servants upon horses: and princes walking on the ground as servants.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>He that diggeth a pit, shall fall into it: and he that breaketh a hedge, a serpent shall bite him.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>He that removeth stones, shall be hurt by them: and he that cutteth trees, shall be wounded by them.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>If the iron be blunt, and be not as before, but be made blunt, with much labour it shall be sharpened: and after industry shall follow wisdom.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>If a serpent bite in silence, he is nothing better that backbiteth secretly.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The words of the mouth of a wise man are grace: but the lips of a fool shall throw him down headlong.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The beginning of his words is folly, and the end of his talk is a mischievous error.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>A fool multiplieth words. A man cannot tell what hath been before him: and what shall be after him, who can tell him?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The labour of fools shall afflict them that know not how to go to the city.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Woe to thee, O land, when thy king is a child, and when the princes eat in the morning.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Blessed is the land, whose king is noble, and whose princes eat in due season for refreshment, and not for riotousness.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>By slothfulness a building shall be brought down, and through the weakness of hands, the house shall drop through.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For laughter they make bread, and wine that the living may feast: and all things obey money.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Detract not the king, no not in thy thought; and speak not evil of the rich man in thy private chamber: because even the birds of the air will carry thy voice, and he that hath wings will tell what thou hast said.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Muscæ morientes perdunt suavitatem unguenti. Pretiosior est sapientia et gloria, parva et ad tempus stultitia.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cor sapientis in dextera ejus, et cor stulti in sinistra illius.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Sed et in via stultus ambulans, cum ipse insipiens sit, omnes stultos æstimat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si spiritus potestatem habentis ascenderit super te, locum tuum ne demiseris, quia curatio faciet cessare peccata maxima.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Est malum quod vidi sub sole, quasi per errorem egrediens a facie principis :</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>positum stultum in dignitate sublimi, et divites sedere deorsum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Vidi servos in equis, et principes ambulantes super terram quasi servos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Qui fodit foveam incidet in eam, et qui dissipat sepem mordebit eum coluber.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Qui transfert lapides affligetur in eis, et qui scindit ligna vulnerabitur ab eis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Si retusum fuerit ferrum, et hoc non ut prius, sed hebetatum fuerit, multo labore exacuetur, et post industriam sequetur sapientia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Si mordeat serpens in silentio, nihil eo minus habet qui occulte detrahit.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Verba oris sapientis gratia, et labia insipientis præcipitabunt eum ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>initium verborum ejus stultitia, et novissimum oris illius error pessimus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Stultus verba multiplicat. Ignorat homo quid ante se fuerit ; et quid post se futurum sit, quis ei poterit indicare ?</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Labor stultorum affliget eos, qui nesciunt in urbem pergere.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Væ tibi, terra, cujus rex puer est, et cujus principes mane comedunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Beata terra cujus rex nobilis est, et cujus principes vescuntur in tempore suo, ad reficiendum, et non ad luxuriam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>In pigritiis humiliabitur contignatio, et in infirmitate manuum perstillabit domus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>In risum faciunt panem et vinum ut epulentur viventes ; et pecuniæ obediunt omnia.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In cogitatione tua regi ne detrahas, et in secreto cubiculi tui ne maledixeris diviti : quia et aves cæli portabunt vocem tuam, et qui habet pennas annuntiabit sententiam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg- \":\"ECC\",\"bookName\":\"Ecclesiastes\",\"drName\":\"Ecclesiastes\",\"chapter\":10,\"totalChapters\":12,\"dra\":[{\"verse\":1,\"text\":\"Dying flies spoil the sweetness of the ointment. Wisdom and glory is more precious than a small and shortlived folly.\"},{\"verse\":2,\"text\":\"The heart of a wise man is in his right hand, and the heart of a fool is in his left hand.\"},{\"verse\":3,\"text\":\"Yea, and the fool when he walketh in the way, whereas he himself is a fool, esteemeth all men fools.\"},{\"verse\":4,\"text\":\"If the spirit of him that hath power, ascend upon thee, leave not thy place: because care will make the greatest sins to cease.\"},{\"verse\":5,\"text\":\"There is an evil that I have seen under the sun, as it were by an error proceeding from the face of the prince:\"},{\"verse\":6,\"text\":\"A fool set in high dignity, and the rich sitting beneath.\"},{\"verse\":7,\"text\":\"I have seen servants upon horses: and princes walking on the ground as servants.\"},{\"verse\":8,\"text\":\"He that diggeth a pit, shall fall into it: and he that breaketh a hedge, a serpent shall bite him.\"},{\"verse\":9,\"text\":\"He that removeth stones, shall be hurt by them: and he that cutteth trees, shall be wounded by them.\"},{\"verse\":10,\"text\":\"If the iron be blunt, and be not as before, but be made blunt, with much labour it shall be sharpened: and after industry shall follow wisdom.\"},{\"verse\":11,\"text\":\"If a serpent bite in silence, he is nothing better that backbiteth secretly.\"},{\"verse\":12,\"text\":\"The words of the mouth of a wise man are grace: but the lips of a fool shall throw him down headlong.\"},{\"verse\":13,\"text\":\"The beginning of his words is folly, and the end of his talk is a mischievous error.\"},{\"verse\":14,\"text\":\"A fool multiplieth words. A man cannot tell what hath been before him: and what shall be after him, who can tell him?\"},{\"verse\":15,\"text\":\"The labour of fools shall afflict them that know not how to go to the city.\"},{\"verse\":16,\"text\":\"Woe to thee, O land, when thy king is a child, and when the princes eat in the morning.\"},{\"verse\":17,\"text\":\"Blessed is the land, whose king is noble, and whose princes eat in due season for refreshment, and not for riotousness.\"},{\"verse\":18,\"text\":\"By slothfulness a building shall be brought down, and through the weakness of hands, the house shall drop through.\"},{\"verse\":19,\"text\":\"For laughter they make bread, and wine that the living may feast: and all things obey money.\"},{\"verse\":20,\"text\":\"Detract not the king, no not in thy thought; and speak not evil of the rich man in thy private chamber: because even the birds of the air will carry thy voice, and he that hath wings will tell what thou hast said.\"}],\"vul\":[{\"verse\":1,\"text\":\"Muscæ morientes perdunt suavitatem unguenti. Pretiosior est sapientia et gloria, parva et ad tempus stultitia.\"},{\"verse\":2,\"text\":\"Cor sapientis in dextera ejus, et cor stulti in sinistra illius.\"},{\"verse\":3,\"text\":\"Sed et in via stultus ambulans, cum ipse insipiens sit, omnes stultos æstimat.\"},{\"verse\":4,\"text\":\"Si spiritus potestatem habentis ascenderit super te, locum tuum ne demiseris, quia curatio faciet cessare peccata maxima.\"},{\"verse\":5,\"text\":\"Est malum quod vidi sub sole, quasi per errorem egrediens a facie principis :\"},{\"verse\":6,\"text\":\"positum stultum in dignitate sublimi, et divites sedere deorsum.\"},{\"verse\":7,\"text\":\"Vidi servos in equis, et principes ambulantes super terram quasi servos.\"},{\"verse\":8,\"text\":\"Qui fodit foveam incidet in eam, et qui dissipat sepem mordebit eum coluber.\"},{\"verse\":9,\"text\":\"Qui transfert lapides affligetur in eis, et qui scindit ligna vulnerabitur ab eis.\"},{\"verse\":10,\"text\":\"Si retusum fuerit ferrum, et hoc non ut prius, sed hebetatum fuerit, multo labore exacuetur, et post industriam sequetur sapientia.\"},{\"verse\":11,\"text\":\"Si mordeat serpens in silentio, nihil eo minus habet qui occulte detrahit.\"},{\"verse\":12,\"text\":\"Verba oris sapientis gratia, et labia insipientis præcipitabunt eum ;\"},{\"verse\":13,\"text\":\"initium verborum ejus stultitia, et novissimum oris illius error pessimus.\"},{\"verse\":14,\"text\":\"Stultus verba multiplicat. Ignorat homo quid ante se fuerit ; et quid post se futurum sit, quis ei poterit indicare ?\"},{\"verse\":15,\"text\":\"Labor stultorum affliget eos, qui nesciunt in urbem pergere.\"},{\"verse\":16,\"text\":\"Væ tibi, terra, cujus rex puer est, et cujus principes mane comedunt.\"},{\"verse\":17,\"text\":\"Beata terra cujus rex nobilis est, et cujus principes vescuntur in tempore suo, ad reficiendum, et non ad luxuriam.\"},{\"verse\":18,\"text\":\"In pigritiis humiliabitur contignatio, et in infirmitate manuum perstillabit domus.\"},{\"verse\":19,\"text\":\"In risum faciunt panem et vinum ut epulentur viventes ; et pecuniæ obediunt omnia.\"},{\"verse\":20,\"text\":\"In cogitatione tua regi ne detrahas, et in secreto cubiculi tui ne maledixeris diviti : quia et aves cæli portabunt vocem tuam, et qui habet pennas annuntiabit sententiam.\"}],\"summary\":\"Observations on wisdom and folly, ambition and detraction.\",\"intro\":null,\"prev\":{\"usfm\":\"ECC\",\"chapter\":9,\"label\":\"Ecclesiastes 9\"},\"next\":{\"usfm\":\"ECC\",\"chapter\":11,\"label\":\"Ecclesiastes 11\"}}]]\n"])</script></body></html>
