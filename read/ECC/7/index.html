 d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ecclesiastes<!-- --> <span class="text-stone-500">7</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Prescriptions against worldly vanities: mortification, patience, and seeking wisdom.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>What needeth a man to seek things that are above him, whereas he knoweth not what is profitable for him in his life, in all the days of his pilgrimage, and the time that passeth like a shadow? Or who can tell him what shall be after him under the sun?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>A good name is better than precious ointments: and the day of death than the day of one’s birth.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>It is better to go to the house of mourning, than to the house of feasting: for in that we are put in mind of the end of all, and the living thinketh what is to come.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Anger is better than laughter: because by the sadness of the countenance the mind of the offender is corrected.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The heart of the wise is where there is mourning, and the heart of fools where there is mirth.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>It is better to be rebuked by a wise man, than to be deceived by the flattery of fools.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For as the crackling of thorns burning under a pot, so is the laughter of a fool: now this also is vanity.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Oppression troubleth the wise, and shall destroy the strength of his heart.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Better is the end of a speech than the beginning. Better is the patient man than the presumptuous.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Be not quickly angry: for anger resteth in the bosom of a fool.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Say not: What thinkest thou is the cause that former times were better than they are now? for this manner of question is foolish.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Wisdom with riches is more profitable, and bringeth more advantage to them that see the sun.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>For as wisdom is a defence, so money is a defence: but learning and wisdom excel in this, that they give life to him that possesseth them.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Consider the works of God, that no man can correct whom he hath despised.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In the good day enjoy good things, and beware beforehand of the evil day: for God hath made both the one and the other, that man may not find against him any just complaint.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>These things also I saw in the days of my vanity: A just man perisheth in his justice, and a wicked man liveth a long time in his wickedness.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Be not over just: and be not more wise than is necessary, lest thou become stupid.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Be not overmuch wicked: and be not foolish, lest thou die before thy time.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>It is good that thou shouldst hold up the just, yea and from him withdraw not thy hand: for he that feareth God, neglecteth nothing.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Wisdom hath strengthened the wise more than ten princes of the city.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For there is no just man upon earth, that doth good, and sinneth not.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But do not apply thy heart to all words that are spoken: lest perhaps thou hear thy servant reviling thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>For thy conscience knoweth that thou also hast often spoken evil of others.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>I have tried all things in wisdom. I have said: I will be wise: and it departed farther from me,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Much more than it was: it is a great depth, who shall find it out?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>I have surveyed all things with my mind, to know, and consider, and seek out wisdom and reason: and to know the wickedness of the fool, and the error of the imprudent:</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And I have found a woman more bitter than death, who is the hunter’s snare, and her heart is a net, and her hands are bands. He that pleaseth God shall escape from her: but he that is a sinner, shall be caught by her.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Lo this have I found, said Ecclesiastes, weighing one thing after another, that I might find out the account,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Which yet my soul seeketh, and I have not found it. One man among a thousand I have found, a woman among them all I have not found.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Only this I have found, that God made man right, and he hath entangled himself with an infinity of questions. Who is as the wise man? and who hath known the resolution of the word?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Quid necesse est homini majora se quærere, cum ignoret quid conducat sibi in vita sua, numero dierum peregrinationis suæ, et tempore quod velut umbra præterit ? aut quis ei poterit indicare quod post eum futurum sub sole sit ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Melius est nomen bonum quam unguenta pretiosa, et dies mortis die nativitatis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Melius est ire ad domum luctus quam ad domum convivii ; in illa enim finis cunctorum admonetur hominum, et vivens cogitat quid futurum sit.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Melior est ira risu, quia per tristitiam vultus corrigitur animus delinquentis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Cor sapientium ubi tristitia est, et cor stultorum ubi lætitia.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Melius est a sapiente corripi, quam stultorum adulatione decipi ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quia sicut sonitus spinarum ardentium sub olla, sic risus stulti. Sed et hoc vanitas.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Calumnia conturbat sapientem, et perdet robur cordis illius.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Melior est finis orationis quam principium. Melior est patiens arrogante.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ne sis velox ad irascendum, quia ira in sinu stulti requiescit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ne dicas : Quid putas causæ est quod priora tempora meliora fuere quam nunc sunt ? stulta enim est hujuscemodi interrogatio.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Utilior est sapientia cum divitiis, et magis prodest videntibus solem.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sicut enim protegit sapientia, sic protegit pecunia ; hoc autem plus habet eruditio et sapientia, quod vitam tribuunt possessori suo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Considera opera Dei, quod nemo possit corrigere quem ille despexerit.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>In die bona fruere bonis, et malam diem præcave ; sicut enim hanc, sic et illam fecit Deus, ut non inveniat homo contra eum justas querimonias.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hæc quoque vidi in diebus vanitatis meæ : justus perit in justitia sua, et impius multo vivit tempore in malitia sua.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Noli esse justus multum, neque plus sapias quam necesse est, ne obstupescas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ne impie agas multum, et noli esse stultus, ne moriaris in tempore non tuo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Bonum est te sustentare justum : sed et ab illo ne subtrahas manum tuam ; quia qui timet Deum nihil negligit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Sapientia confortavit sapientem super decem principes civitatis ;</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>non est enim homo justus in terra qui faciat bonum et non peccet.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Sed et cunctis sermonibus qui dicuntur ne accomodes cor tuum, ne forte audias servum tuum maledicentem tibi ;</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>scit enim conscientia tua quia et tu crebro maledixisti aliis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Cuncta tentavi in sapientia. Dixi : Sapiens efficiar : et ipsa longius recessit a me,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>multo magis quam erat. Et alta profunditas, quis inveniet eam ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Lustravi universa animo meo, ut scirem et considerarem, et quærerem sapientiam, et rationem, et ut cognoscerem impietatem stulti, et errorem imprudentium :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et inveni amariorem morte mulierem, quæ laqueus venatorum est, et sagena cor ejus ; vincula sunt manus illius. Qui placet Deo effugiet illam ; qui autem peccator est capietur ab illa.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ecce hoc inveni, dixit Ecclesiastes, unum et alterum ut invenirem rationem,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>quam adhuc quærit anima mea, et non inveni. Virum de mille unum reperi ; mulierem ex omnibus non inveni.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Solummodo hoc inveni, quod fecerit Deus hominem rectum, et ipse se infinitis miscuerit quæstionibus. Quis talis ut sapiens est ? et quis cognovit solutionem verbi ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria apter\":7,\"totalChapters\":12,\"dra\":[{\"verse\":1,\"text\":\"What needeth a man to seek things that are above him, whereas he knoweth not what is profitable for him in his life, in all the days of his pilgrimage, and the time that passeth like a shadow? Or who can tell him what shall be after him under the sun?\"},{\"verse\":2,\"text\":\"A good name is better than precious ointments: and the day of death than the day of one’s birth.\"},{\"verse\":3,\"text\":\"It is better to go to the house of mourning, than to the house of feasting: for in that we are put in mind of the end of all, and the living thinketh what is to come.\"},{\"verse\":4,\"text\":\"Anger is better than laughter: because by the sadness of the countenance the mind of the offender is corrected.\"},{\"verse\":5,\"text\":\"The heart of the wise is where there is mourning, and the heart of fools where there is mirth.\"},{\"verse\":6,\"text\":\"It is better to be rebuked by a wise man, than to be deceived by the flattery of fools.\"},{\"verse\":7,\"text\":\"For as the crackling of thorns burning under a pot, so is the laughter of a fool: now this also is vanity.\"},{\"verse\":8,\"text\":\"Oppression troubleth the wise, and shall destroy the strength of his heart.\"},{\"verse\":9,\"text\":\"Better is the end of a speech than the beginning. Better is the patient man than the presumptuous.\"},{\"verse\":10,\"text\":\"Be not quickly angry: for anger resteth in the bosom of a fool.\"},{\"verse\":11,\"text\":\"Say not: What thinkest thou is the cause that former times were better than they are now? for this manner of question is foolish.\"},{\"verse\":12,\"text\":\"Wisdom with riches is more profitable, and bringeth more advantage to them that see the sun.\"},{\"verse\":13,\"text\":\"For as wisdom is a defence, so money is a defence: but learning and wisdom excel in this, that they give life to him that possesseth them.\"},{\"verse\":14,\"text\":\"Consider the works of God, that no man can correct whom he hath despised.\"},{\"verse\":15,\"text\":\"In the good day enjoy good things, and beware beforehand of the evil day: for God hath made both the one and the other, that man may not find against him any just complaint.\"},{\"verse\":16,\"text\":\"These things also I saw in the days of my vanity: A just man perisheth in his justice, and a wicked man liveth a long time in his wickedness.\"},{\"verse\":17,\"text\":\"Be not over just: and be not more wise than is necessary, lest thou become stupid.\"},{\"verse\":18,\"text\":\"Be not overmuch wicked: and be not foolish, lest thou die before thy time.\"},{\"verse\":19,\"text\":\"It is good that thou shouldst hold up the just, yea and from him withdraw not thy hand: for he that feareth God, neglecteth nothing.\"},{\"verse\":20,\"text\":\"Wisdom hath strengthened the wise more than ten princes of the city.\"},{\"verse\":21,\"text\":\"For there is no just man upon earth, that doth good, and sinneth not.\"},{\"verse\":22,\"text\":\"But do not apply thy heart to all words that are spoken: lest perhaps thou hear thy servant reviling thee.\"},{\"verse\":23,\"text\":\"For thy conscience knoweth that thou also hast often spoken evil of others.\"},{\"verse\":24,\"text\":\"I have tried all things in wisdom. I have said: I will be wise: and it departed farther from me,\"},{\"verse\":25,\"text\":\"Much more than it was: it is a great depth, who shall find it out?\"},{\"verse\":26,\"text\":\"I have surveyed all things with my mind, to know, and consider, and seek out wisdom and reason: and to know the wickedness of the fool, and the error of the imprudent:\"},{\"verse\":27,\"text\":\"And I have found a woman more bitter than death, who is the hunter’s snare, and her heart is a net, and her hands are bands. He that pleaseth God shall escape from her: but he that is a sinner, shall be caught by her.\"},{\"verse\":28,\"text\":\"Lo this have I found, said Ecclesiastes, weighing one thing after another, that I might find out the account,\"},{\"verse\":29,\"text\":\"Which yet my soul seeketh, and I have not found it. One man among a thousand I have found, a woman among them all I have not found.\"},{\"verse\":30,\"text\":\"Only this I have found, that God made man right, and he hath entangled himself with an infinity of questions. Who is as the wise man? and who hath known the resolution of the word?\"}],\"vul\":[{\"verse\":1,\"text\":\"Quid necesse est homini majora se quærere, cum ignoret quid conducat sibi in vita sua, numero dierum peregrinationis suæ, et tempore quod velut umbra præterit ? aut quis ei poterit indicare quod post eum futurum sub sole sit ?\"},{\"verse\":2,\"text\":\"Melius est nomen bonum quam unguenta pretiosa, et dies mortis die nativitatis.\"},{\"verse\":3,\"text\":\"Melius est ire ad domum luctus quam ad domum convivii ; in illa enim finis cunctorum admonetur hominum, et vivens cogitat quid futurum sit.\"},{\"verse\":4,\"text\":\"Melior est ira risu, quia per tristitiam vultus corrigitur animus delinquentis.\"},{\"verse\":5,\"text\":\"Cor sapientium ubi tristitia est, et cor stultorum ubi lætitia.\"},{\"verse\":6,\"text\":\"Melius est a sapiente corripi, quam stultorum adulatione decipi ;\"},{\"verse\":7,\"text\":\"quia sicut sonitus spinarum ardentium sub olla, sic risus stulti. Sed et hoc vanitas.\"},{\"verse\":8,\"text\":\"Calumnia conturbat sapientem, et perdet robur cordis illius.\"},{\"verse\":9,\"text\":\"Melior est finis orationis quam principium. Melior est patiens arrogante.\"},{\"verse\":10,\"text\":\"Ne sis velox ad irascendum, quia ira in sinu stulti requiescit.\"},{\"verse\":11,\"text\":\"Ne dicas : Quid putas causæ est quod priora tempora meliora fuere quam nunc sunt ? stulta enim est hujuscemodi interrogatio.\"},{\"verse\":12,\"text\":\"Utilior est sapientia cum divitiis, et magis prodest videntibus solem.\"},{\"verse\":13,\"text\":\"Sicut enim protegit sapientia, sic protegit pecunia ; hoc autem plus habet eruditio et sapientia, quod vitam tribuunt possessori suo.\"},{\"verse\":14,\"text\":\"Considera opera Dei, quod nemo possit corrigere quem ille despexerit.\"},{\"verse\":15,\"text\":\"In die bona fruere bonis, et malam diem præcave ; sicut enim hanc, sic et illam fecit Deus, ut non inveniat homo contra eum justas querimonias.\"},{\"verse\":16,\"text\":\"Hæc quoque vidi in diebus vanitatis meæ : justus perit in justitia sua, et impius multo vivit tempore in malitia sua.\"},{\"verse\":17,\"text\":\"Noli esse justus multum, neque plus sapias quam necesse est, ne obstupescas.\"},{\"verse\":18,\"text\":\"Ne impie agas multum, et noli esse stultus, ne moriaris in tempore non tuo.\"},{\"verse\":19,\"text\":\"Bonum est te sustentare justum : sed et ab illo ne subtrahas manum tuam ; quia qui timet Deum nihil negligit.\"},{\"verse\":20,\"text\":\"Sapientia confortavit sapientem super decem principes civitatis ;\"},{\"verse\":21,\"text\":\"non est enim homo justus in terra qui faciat bonum et non peccet.\"},{\"verse\":22,\"text\":\"Sed et cunctis sermonibus qui dicuntur ne accomodes cor tuum, ne forte audias servum tuum maledicentem tibi ;\"},{\"verse\":23,\"text\":\"scit enim conscientia tua quia et tu crebro maledixisti aliis.\"},{\"verse\":24,\"text\":\"Cuncta tentavi in sapientia. Dixi : Sapiens efficiar : et ipsa longius recessit a me,\"},{\"verse\":25,\"text\":\"multo magis quam erat. Et alta profunditas, quis inveniet eam ?\"},{\"verse\":26,\"text\":\"Lustravi universa animo meo, ut scirem et considerarem, et quærerem sapientiam, et rationem, et ut cognoscerem impietatem stulti, et errorem imprudentium :\"},{\"verse\":27,\"text\":\"et inveni amariorem morte mulierem, quæ laqueus venatorum est, et sagena cor ejus ; vincula sunt manus illius. Qui placet Deo effugiet illam ; qui autem peccator est capietur ab illa.\"},{\"verse\":28,\"text\":\"Ecce hoc inveni, dixit Ecclesiastes, unum et alterum ut invenirem rationem,\"},{\"verse\":29,\"text\":\"quam adhuc quærit anima mea, et non inveni. Virum de mille unum reperi ; mulierem ex omnibus non inveni.\"},{\"verse\":30,\"text\":\"Solummodo hoc inveni, quod fecerit Deus hominem rectum, et ipse se infinitis miscuerit quæstionibus. Quis talis ut sapiens est ? et quis cognovit solutionem verbi ?\"}],\"summary\":\"Prescriptions against worldly vanities: mortification, patience, and seeking wisdom.\",\"intro\":null,\"prev\":{\"usfm\":\"ECC\",\"chapter\":6,\"label\":\"Ecclesiastes 6\"},\"next\":{\"usfm\":\"ECC\",\"chapter\":8,\"label\":\"Ecclesiastes 8\"}}]]\n"])</script></body></html>
