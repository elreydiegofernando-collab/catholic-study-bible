text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>But there were also false prophets among the people, even as there shall be among you lying teachers who shall bring in sects of perdition and deny the Lord who bought them: bringing upon themselves swift destruction.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And many shall follow their riotousnesses, through whom the way of truth shall be evil spoken of.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And through covetousness shall they with feigned words make merchandise of you. Whose judgment now of a long time lingereth not: and their perdition slumbereth not.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For if God spared not the angels that sinned, but delivered them, drawn down by infernal ropes to the lower hell, unto torments, to be reserved unto judgment:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And spared not the original world, but preserved Noe, the eighth person, the preacher of justice, bringing in the flood upon the world of the ungodly.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And reducing the cities of the Sodomites and of the Gomorrhites into ashes, condemned them to be overthrown, making them an example to those that should after act wickedly,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And delivered just Lot, oppressed by the injustice and lewd conversation of the wicked:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For in sight and hearing he was just, dwelling among them who from day to day vexed the just soul with unjust works.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The Lord knoweth how to deliver the godly from temptation, but to reserve the unjust unto the day of judgment to be tormented:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And especially them who walk after the flesh in the lust of uncleanness and despise government: audacious, self willed, they fear not to bring in sects, blaspheming.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Whereas angels, who are greater in strength and power, bring not against themselves a railing judgment.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But these men, as irrational beasts, naturally tending to the snare and to destruction, blaspheming those things which they know not, shall perish in their corruption:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Receiving the reward of their injustice, counting for a pleasure the delights of a day: stains and spots, sporting themselves to excess, rioting in their feasts with you:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Having eyes full of adultery and of sin that ceaseth not: alluring unstable souls: having their heart exercised with covetousness: children of malediction.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Leaving the right way, they have gone astray, having followed the way of Balaam of Bosor who loved the wages of iniquity,</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>But had a check of his madness, the dumb beast used to the yoke, which, speaking with man’s voice, forbade the folly of the prophet.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>These are fountains without water and clouds tossed with whirlwinds, to whom the mist of darkness is reserved.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For, speaking proud words of vanity, they allure by the desires of fleshly riotousness those who for a little while escape, such as converse in error:</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Promising them liberty, whereas they themselves are the slaves of corruption. For by whom a man is overcome, of the same also he is the slave.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For if, flying from the pollutions of the world, through the knowledge of our Lord and Saviour Jesus Christ, they be again entangled in them and overcome: their latter state is become unto them worse than the former.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For it had been better for them not to have known the way of justice than, after they have known it, to turn back from that holy commandment which was delivered to them.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For, that of the true proverb has happened to them: The dog is returned to his vomit; and: The sow that was washed to her wallowing in the mire.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Fuerunt vero et pseudoprophetæ in populo, sicut et in vobis erunt magistri mendaces, qui introducent sectas perditionis : et eum qui emit eos, Dominum negant, superducentes sibi celerem perditionem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et multi sequentur eorum luxurias, per quos via veritatis blasphemabitur :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et in avaritia fictis verbis de vobis negotiabuntur : quibus judicium jam olim non cessat : et perditio eorum non dormitat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Si enim Deus angelis peccantibus non pepercit, sed rudentibus inferni detractos in tartarum tradidit cruciandos, in judicium reservari.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et originali mundo non pepercit, sed octavum Noë justitiæ præconem custodivit, diluvium mundo impiorum inducens.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et civitates Sodomorum et Gomorrhæorum in cinerem redigens, eversione damnavit : exemplum eorum, qui impie acturi sunt, ponens :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et justum Lot oppressum a nefandorum injuria, ac luxuriosa conversatione eripuit :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>aspectu enim, et auditu justus erat : habitans apud eos, qui de die in diem animam justam iniquis operibus cruciabant.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Novit Dominus pios de tentatione eripere : iniquos vero in diem judicii reservare cruciandos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Magis autem eos, qui post carnem in concupiscentia immunditiæ ambulant, dominationemque contemnunt, audaces, sibi placentes, sectas non metuunt introducere blasphemantes :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>ubi angeli fortitudine, et virtute cum sint majores, non portant adversum se execrabile judicium.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Hi vero velut irrationabilia pecora, naturaliter in captionem, et in perniciem in his quæ ignorant blasphemantes in corruptione sua peribunt,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>percipientes mercedem injustitiæ, voluptatem existimantes diei delicias : coinquinationes, et maculæ deliciis affluentes, in conviviis suis luxuriantes vobiscum,</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>oculos habentes plenos adulterii, et incessabilis delicti. Pellicientes animas instabiles, cor exercitatum avaritia habentes, maledictionis filii :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>derelinquentes rectam viam erraverunt, secuti viam Balaam ex Bosor, qui mercedem iniquitatis amavit :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>correptionem vero habuit suæ vesaniæ : subjugale mutum animal, hominis voce loquens, prohibuit prophetæ insipientiam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hi sunt fontes sine aqua, et nebulæ turbinibus exagitatæ, quibus caligo tenebrarum reservatur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Superba enim vanitatis loquentes, pelliciunt in desideriis carnis luxuriæ eos, qui paululum effugiunt, qui in errore conversantur :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>libertatem illis promittentes, cum ipsi servi sint corruptionem : a quo enim quis superatus est, hujus et servus est.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Si enim refugientes coinquinationes mundi in cognitione Domini nostri, et Salvatoris Jesu Christi, his rursus implicati superantur : facta sunt eis posteriora deteriora prioribus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Melius enim erat illis non cognoscere viam justitiæ, quam post agnitionem, retrorsum converti ab eo, quod illis traditum est, sancto mandato.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Contigit enim eis illud veri proverbii : Canis reversus ad suum vomitum : et, Sus lota in volutabro luti.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2PE/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">2 Peter 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/2PE/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">2 Peter 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->3<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: 2 Peter 1" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border e-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"2PE.2\",{\"bookId\":68,\"usfm\":\"2PE\",\"bookName\":\"2 Peter\",\"drName\":\"2 Peter\",\"chapter\":2,\"totalChapters\":3,\"dra\":[{\"verse\":1,\"text\":\"But there were also false prophets among the people, even as there shall be among you lying teachers who shall bring in sects of perdition and deny the Lord who bought them: bringing upon themselves swift destruction.\"},{\"verse\":2,\"text\":\"And many shall follow their riotousnesses, through whom the way of truth shall be evil spoken of.\"},{\"verse\":3,\"text\":\"And through covetousness shall they with feigned words make merchandise of you. Whose judgment now of a long time lingereth not: and their perdition slumbereth not.\"},{\"verse\":4,\"text\":\"For if God spared not the angels that sinned, but delivered them, drawn down by infernal ropes to the lower hell, unto torments, to be reserved unto judgment:\"},{\"verse\":5,\"text\":\"And spared not the original world, but preserved Noe, the eighth person, the preacher of justice, bringing in the flood upon the world of the ungodly.\"},{\"verse\":6,\"text\":\"And reducing the cities of the Sodomites and of the Gomorrhites into ashes, condemned them to be overthrown, making them an example to those that should after act wickedly,\"},{\"verse\":7,\"text\":\"And delivered just Lot, oppressed by the injustice and lewd conversation of the wicked:\"},{\"verse\":8,\"text\":\"For in sight and hearing he was just, dwelling among them who from day to day vexed the just soul with unjust works.\"},{\"verse\":9,\"text\":\"The Lord knoweth how to deliver the godly from temptation, but to reserve the unjust unto the day of judgment to be tormented:\"},{\"verse\":10,\"text\":\"And especially them who walk after the flesh in the lust of uncleanness and despise government: audacious, self willed, they fear not to bring in sects, blaspheming.\"},{\"verse\":11,\"text\":\"Whereas angels, who are greater in strength and power, bring not against themselves a railing judgment.\"},{\"verse\":12,\"text\":\"But these men, as irrational beasts, naturally tending to the snare and to destruction, blaspheming those things which they know not, shall perish in their corruption:\"},{\"verse\":13,\"text\":\"Receiving the reward of their injustice, counting for a pleasure the delights of a day: stains and spots, sporting themselves to excess, rioting in their feasts with you:\"},{\"verse\":14,\"text\":\"Having eyes full of adultery and of sin that ceaseth not: alluring unstable souls: having their heart exercised with covetousness: children of malediction.\"},{\"verse\":15,\"text\":\"Leaving the right way, they have gone astray, having followed the way of Balaam of Bosor who loved the wages of iniquity,\"},{\"verse\":16,\"text\":\"But had a check of his madness, the dumb beast used to the yoke, which, speaking with man’s voice, forbade the folly of the prophet.\"},{\"verse\":17,\"text\":\"These are fountains without water and clouds tossed with whirlwinds, to whom the mist of darkness is reserved.\"},{\"verse\":18,\"text\":\"For, speaking proud words of vanity, they allure by the desires of fleshly riotousness those who for a little while escape, such as converse in error:\"},{\"verse\":19,\"text\":\"Promising them liberty, whereas they themselves are the slaves of corruption. For by whom a man is overcome, of the same also he is the slave.\"},{\"verse\":20,\"text\":\"For if, flying from the pollutions of the world, through the knowledge of our Lord and Saviour Jesus Christ, they be again entangled in them and overcome: their latter state is become unto them worse than the former.\"},{\"verse\":21,\"text\":\"For it had been better for them not to have known the way of justice than, after they have known it, to turn back from that holy commandment which was delivered to them.\"},{\"verse\":22,\"text\":\"For, that of the true proverb has happened to them: The dog is returned to his vomit; and: The sow that was washed to her wallowing in the mire.\"}],\"vul\":[{\"verse\":1,\"text\":\"Fuerunt vero et pseudoprophetæ in populo, sicut et in vobis erunt magistri mendaces, qui introducent sectas perditionis : et eum qui emit eos, Dominum negant, superducentes sibi celerem perditionem.\"},{\"verse\":2,\"text\":\"Et multi sequentur eorum luxurias, per quos via veritatis blasphemabitur :\"},{\"verse\":3,\"text\":\"et in avaritia fictis verbis de vobis negotiabuntur : quibus judicium jam olim non cessat : et perditio eorum non dormitat.\"},{\"verse\":4,\"text\":\"Si enim Deus angelis peccantibus non pepercit, sed rudentibus inferni detractos in tartarum tradidit cruciandos, in judicium reservari.\"},{\"verse\":5,\"text\":\"Et originali mundo non pepercit, sed octavum Noë justitiæ præconem custodivit, diluvium mundo impiorum inducens.\"},{\"verse\":6,\"text\":\"Et civitates Sodomorum et Gomorrhæorum in cinerem redigens, eversione damnavit : exemplum eorum, qui impie acturi sunt, ponens :\"},{\"verse\":7,\"text\":\"et justum Lot oppressum a nefandorum injuria, ac luxuriosa conversatione eripuit :\"},{\"verse\":8,\"text\":\"aspectu enim, et auditu justus erat : habitans apud eos, qui de die in diem animam justam iniquis operibus cruciabant.\"},{\"verse\":9,\"text\":\"Novit Dominus pios de tentatione eripere : iniquos vero in diem judicii reservare cruciandos.\"},{\"verse\":10,\"text\":\"Magis autem eos, qui post carnem in concupiscentia immunditiæ ambulant, dominationemque contemnunt, audaces, sibi placentes, sectas non metuunt introducere blasphemantes :\"},{\"verse\":11,\"text\":\"ubi angeli fortitudine, et virtute cum sint majores, non portant adversum se execrabile judicium.\"},{\"verse\":12,\"text\":\"Hi vero velut irrationabilia pecora, naturaliter in captionem, et in perniciem in his quæ ignorant blasphemantes in corruptione sua peribunt,\"},{\"verse\":13,\"text\":\"percipientes mercedem injustitiæ, voluptatem existimantes diei delicias : coinquinationes, et maculæ deliciis affluentes, in conviviis suis luxuriantes vobiscum,\"},{\"verse\":14,\"text\":\"oculos habentes plenos adulterii, et incessabilis delicti. Pellicientes animas instabiles, cor exercitatum avaritia habentes, maledictionis filii :\"},{\"verse\":15,\"text\":\"derelinquentes rectam viam erraverunt, secuti viam Balaam ex Bosor, qui mercedem iniquitatis amavit :\"},{\"verse\":16,\"text\":\"correptionem vero habuit suæ vesaniæ : subjugale mutum animal, hominis voce loquens, prohibuit prophetæ insipientiam.\"},{\"verse\":17,\"text\":\"Hi sunt fontes sine aqua, et nebulæ turbinibus exagitatæ, quibus caligo tenebrarum reservatur.\"},{\"verse\":18,\"text\":\"Superba enim vanitatis loquentes, pelliciunt in desideriis carnis luxuriæ eos, qui paululum effugiunt, qui in errore conversantur :\"},{\"verse\":19,\"text\":\"libertatem illis promittentes, cum ipsi servi sint corruptionem : a quo enim quis superatus est, hujus et servus est.\"},{\"verse\":20,\"text\":\"Si enim refugientes coinquinationes mundi in cognitione Domini nostri, et Salvatoris Jesu Christi, his rursus implicati superantur : facta sunt eis posteriora deteriora prioribus.\"},{\"verse\":21,\"text\":\"Melius enim erat illis non cognoscere viam justitiæ, quam post agnitionem, retrorsum converti ab eo, quod illis traditum est, sancto mandato.\"},{\"verse\":22,\"text\":\"Contigit enim eis illud veri proverbii : Canis reversus ad suum vomitum : et, Sus lota in volutabro luti.\"}],\"summary\":\"He warns them against false teachers and foretells their punishment.\",\"intro\":null,\"prev\":{\"usfm\":\"2PE\",\"chapter\":1,\"label\":\"2 Peter 1\"},\"next\":{\"usfm\":\"2PE\",\"chapter\":3,\"label\":\"2 Peter 3\"}}]]\n"])</script></body></html>
