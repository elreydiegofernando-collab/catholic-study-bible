35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">3</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s discourse with Nicodemus. John’s testimony.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And there was a man of the Pharisees, named Nicodemus, a ruler of the Jews.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>This man came to Jesus by night and said to him: Rabbi, we know that thou art come a teacher from God; for no man can do these signs which thou dost, unless God be with him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Jesus answered and said to him: Amen, amen, I say to thee, unless a man be born again, he cannot see the kingdom of God.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nicodemus saith to him: How can a man be born when he is old? Can he enter a second time into his mother’s womb and be born again?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Jesus answered: Amen, amen, I say to thee, unless a man be born again of water and the Holy Ghost, he cannot enter into the kingdom of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>That which is born of the flesh is flesh: and that which is born of the Spirit is spirit.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Wonder not that I said to thee: You must be born again.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The Spirit breatheth where he will and thou hearest his voice: but thou knowest not whence he cometh and whither he goeth. So is every one that is born of the Spirit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Nicodemus answered and said to him: How can these things be done?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jesus answered and said to him: Art thou a master in Israel, and knowest not these things?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Amen, amen, I say to thee that we speak what we know and we testify what we have seen: and you receive not our testimony.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>If I have spoken to you earthly things, and you believe not: how will you believe, if I shall speak to you heavenly things?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And no man hath ascended into heaven, but he that descended from heaven, the Son of man who is in heaven.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And as Moses lifted up the serpent in the desert, so must the Son of man be lifted up:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>That whosoever believeth in him may not perish, but may have life everlasting.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>For God so loved the world, as to give his only begotten Son: that whosoever believeth in him may not perish, but may have life everlasting.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For God sent not his Son into the world, to judge the world: but that the world may be saved by him.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He that believeth in him is not judged. But he that doth not believe is already judged: because he believeth not in the name of the only begotten Son of God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And this is the judgment: Because the light is come into the world and men loved darkness rather than the light: for their works were evil.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For every one that doth evil hateth the light and cometh not to the light, that his works may not be reproved.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But he that doth truth cometh to the light, that his works may be made manifest: because they are done in God.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>After these things, Jesus and his disciples came into the land of Judea: and there he abode with them and baptized.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And John also was baptizing in Ennon near Salim: because there was much water there. And they came and were baptized.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>For John was not yet cast into prison.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And there arose a question between some of John’s disciples and the Jews, concerning purification.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And they came to John and said to him: Rabbi, he that was with thee beyond the Jordan, to whom thou gavest testimony: behold, he baptizeth and all men come to him.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>John answered and said: A man cannot receive any thing, unless it be given him from heaven.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>You yourselves do bear me witness that I said, I am not Christ, but that I am sent before him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>He that hath the bride is the bridegroom: but the friend of the bridegroom, who standeth and heareth Him, rejoiceth with joy because of the bridegroom’s voice. This my joy therefore is fulfilled.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>He must increase: but I must decrease.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>He that cometh from above is above all. He that is of the earth, of the earth he is, and of the earth he speaketh. He that cometh from heaven is above all.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And what he hath seen and heard, that he testifieth: and no man receiveth his testimony.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>He that hath received his testimony hath set to his seal that God is true.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>For he whom God hath sent speaketh the words of God: for God doth not give the Spirit by measure.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The Father loveth the Son: and he hath given all things into his hand.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>He that believeth in the Son hath life everlasting: but he that believeth not the Son shall not see life: but the wrath of God abideth on him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem homo ex pharisæis, Nicodemus nomine, princeps Judæorum.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Hic venit ad Jesum nocte, et dixit ei : Rabbi, scimus quia a Deo venisti magister, nemo enim potest hæc signa facere, quæ tu facis, nisi fuerit Deus cum eo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Respondit Jesus, et dixit ei : Amen, amen dico tibi, nisi quis renatus fuerit denuo, non potest videre regnum Dei.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dicit ad eum Nicodemus : Quomodo potest homo nasci, cum sit senex ? numquid potest in ventrem matris suæ iterato introire et renasci ?</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Respondit Jesus : Amen, amen dico tibi, nisi quis renatus fuerit ex aqua, et Spiritu Sancto, non potest introire in regnum Dei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Quod natum est ex carne, caro est : et quod natum est ex spiritu, spiritus est.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non mireris quia dixi tibi : oportet vos nasci denuo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Spiritus ubi vult spirat, et vocem ejus audis, sed nescis unde veniat, aut quo vadat : sic est omnis qui natus est ex spiritu.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Respondit Nicodemus, et dixit ei : Quomodo possunt hæc fieri ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Respondit Jesus, et dixit ei : Tu es magister in Israël, et hæc ignoras ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Amen, amen dico tibi, quia quod scimus loquimur, et quod vidimus testamur, et testimonium nostrum non accipitis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Si terrena dixi vobis, et non creditis : quomodo, si dixero vobis cælestia, credetis ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et nemo ascendit in cælum, nisi qui descendit de cælo, Filius hominis, qui est in cælo.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et sicut Moyses exaltavit serpentem in deserto, ita exaltari oportet Filium hominis :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ut omnis qui credit in ipsum, non pereat, sed habeat vitam æternam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Sic enim Deus dilexit mundum, ut Filium suum unigenitum daret : ut omnis qui credit in eum, non pereat, sed habeat vitam æternam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Non enim misit Deus Filium suum in mundum, ut judicet mundum, sed ut salvetur mundus per ipsum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui credit in eum, non judicatur ; qui autem non credit, jam judicatus est : quia non credit in nomine unigeniti Filii Dei.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hoc est autem judicium : quia lux venit in mundum, et dilexerunt homines magis tenebras quam lucem : erant enim eorum mala opera.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Omnis enim qui male agit, odit lucem, et non venit ad lucem, ut non arguantur opera ejus :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>qui autem facit veritatem, venit ad lucem, ut manifestentur opera ejus, quia in Deo sunt facta.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Post hæc venit Jesus et discipuli ejus in terram Judæam : et illic demorabatur cum eis, et baptizabat.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Erat autem et Joannes baptizans, in Ænnon, juxta Salim : quia aquæ multæ erant illic, et veniebant et baptizabantur.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nondum enim missus fuerat Joannes in carcerem.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Facta est autem quæstio ex discipulis Joannis cum Judæis de purificatione.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et venerunt ad Joannem, et dixerunt ei : Rabbi, qui erat tecum trans Jordanem, cui tu testimonium perhibuisti, ecce hic baptizat, et omnes veniunt ad eum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Respondit Joannes, et dixit : Non potest homo accipere quidquam, nisi fuerit ei datum de cælo.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Ipsi vos mihi testimonium perhibetis, quod dixerim : Non sum ego Christus : sed quia missus sum ante illum.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Qui habet sponsam, sponsus est : amicus autem sponsi, qui stat, et audit eum, gaudio gaudet propter vocem sponsi. Hoc ergo gaudium meum impletum est.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Illum oportet crescere, me autem minui.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Qui desursum venit, super omnes est. Qui est de terra, de terra est, et de terra loquitur. Qui de cælo venit, super omnes est.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et quod vidit, et audivit, hoc testatur : et testimonium ejus nemo accipit.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Qui accepit ejus testimonium signavit, quia Deus verax est.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quem enim misit Deus, verba Dei loquitur : non enim ad mensuram dat Deus spiritum.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Pater diligit Filium et omnia dedit in manu ejus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Qui credit in Filium, habet vitam æternam ; qui autem incredulus est Filio, non videbit vitam, sed ira Dei manet super eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/4/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 4</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: John 2" class="inline-flex h-12 w-14 s say to thee that we speak what we know and we testify what we have seen: and you receive not our testimony.\"},{\"verse\":12,\"text\":\"If I have spoken to you earthly things, and you believe not: how will you believe, if I shall speak to you heavenly things?\"},{\"verse\":13,\"text\":\"And no man hath ascended into heaven, but he that descended from heaven, the Son of man who is in heaven.\"},{\"verse\":14,\"text\":\"And as Moses lifted up the serpent in the desert, so must the Son of man be lifted up:\"},{\"verse\":15,\"text\":\"That whosoever believeth in him may not perish, but may have life everlasting.\"},{\"verse\":16,\"text\":\"For God so loved the world, as to give his only begotten Son: that whosoever believeth in him may not perish, but may have life everlasting.\"},{\"verse\":17,\"text\":\"For God sent not his Son into the world, to judge the world: but that the world may be saved by him.\"},{\"verse\":18,\"text\":\"He that believeth in him is not judged. But he that doth not believe is already judged: because he believeth not in the name of the only begotten Son of God.\"},{\"verse\":19,\"text\":\"And this is the judgment: Because the light is come into the world and men loved darkness rather than the light: for their works were evil.\"},{\"verse\":20,\"text\":\"For every one that doth evil hateth the light and cometh not to the light, that his works may not be reproved.\"},{\"verse\":21,\"text\":\"But he that doth truth cometh to the light, that his works may be made manifest: because they are done in God.\"},{\"verse\":22,\"text\":\"After these things, Jesus and his disciples came into the land of Judea: and there he abode with them and baptized.\"},{\"verse\":23,\"text\":\"And John also was baptizing in Ennon near Salim: because there was much water there. And they came and were baptized.\"},{\"verse\":24,\"text\":\"For John was not yet cast into prison.\"},{\"verse\":25,\"text\":\"And there arose a question between some of John’s disciples and the Jews, concerning purification.\"},{\"verse\":26,\"text\":\"And they came to John and said to him: Rabbi, he that was with thee beyond the Jordan, to whom thou gavest testimony: behold, he baptizeth and all men come to him.\"},{\"verse\":27,\"text\":\"John answered and said: A man cannot receive any thing, unless it be given him from heaven.\"},{\"verse\":28,\"text\":\"You yourselves do bear me witness that I said, I am not Christ, but that I am sent before him.\"},{\"verse\":29,\"text\":\"He that hath the bride is the bridegroom: but the friend of the bridegroom, who standeth and heareth Him, rejoiceth with joy because of the bridegroom’s voice. This my joy therefore is fulfilled.\"},{\"verse\":30,\"text\":\"He must increase: but I must decrease.\"},{\"verse\":31,\"text\":\"He that cometh from above is above all. He that is of the earth, of the earth he is, and of the earth he speaketh. He that cometh from heaven is above all.\"},{\"verse\":32,\"text\":\"And what he hath seen and heard, that he testifieth: and no man receiveth his testimony.\"},{\"verse\":33,\"text\":\"He that hath received his testimony hath set to his seal that God is true.\"},{\"verse\":34,\"text\":\"For he whom God hath sent speaketh the words of God: for God doth not give the Spirit by measure.\"},{\"verse\":35,\"text\":\"The Father loveth the Son: and he hath given all things into his hand.\"},{\"verse\":36,\"text\":\"He that believeth in the Son hath life everlasting: but he that believeth not the Son shall not see life: but the wrath of God abideth on him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem homo ex pharisæis, Nicodemus nomine, princeps Judæorum.\"},{\"verse\":2,\"text\":\"Hic venit ad Jesum nocte, et dixit ei : Rabbi, scimus quia a Deo venisti magister, nemo enim potest hæc signa facere, quæ tu facis, nisi fuerit Deus cum eo.\"},{\"verse\":3,\"text\":\"Respondit Jesus, et dixit ei : Amen, amen dico tibi, nisi quis renatus fuerit denuo, non potest videre regnum Dei.\"},{\"verse\":4,\"text\":\"Dicit ad eum Nicodemus : Quomodo potest homo nasci, cum sit senex ? numquid potest in ventrem matris suæ iterato introire et renasci ?\"},{\"verse\":5,\"text\":\"Respondit Jesus : Amen, amen dico tibi, nisi quis renatus fuerit ex aqua, et Spiritu Sancto, non potest introire in regnum Dei.\"},{\"verse\":6,\"text\":\"Quod natum est ex carne, caro est : et quod natum est ex spiritu, spiritus est.\"},{\"verse\":7,\"text\":\"Non mireris quia dixi tibi : oportet vos nasci denuo.\"},{\"verse\":8,\"text\":\"Spiritus ubi vult spirat, et vocem ejus audis, sed nescis unde veniat, aut quo vadat : sic est omnis qui natus est ex spiritu.\"},{\"verse\":9,\"text\":\"Respondit Nicodemus, et dixit ei : Quomodo possunt hæc fieri ?\"},{\"verse\":10,\"text\":\"Respondit Jesus, et dixit ei : Tu es magister in Israël, et hæc ignoras ?\"},{\"verse\":11,\"text\":\"Amen, amen dico tibi, quia quod scimus loquimur, et quod vidimus testamur, et testimonium nostrum non accipitis.\"},{\"verse\":12,\"text\":\"Si terrena dixi vobis, et non creditis : quomodo, si dixero vobis cælestia, credetis ?\"},{\"verse\":13,\"text\":\"Et nemo ascendit in cælum, nisi qui descendit de cælo, Filius hominis, qui est in cælo.\"},{\"verse\":14,\"text\":\"Et sicut Moyses exaltavit serpentem in deserto, ita exaltari oportet Filium hominis :\"},{\"verse\":15,\"text\":\"ut omnis qui credit in ipsum, non pereat, sed habeat vitam æternam.\"},{\"verse\":16,\"text\":\"Sic enim Deus dilexit mundum, ut Filium suum unigenitum daret : ut omnis qui credit in eum, non pereat, sed habeat vitam æternam.\"},{\"verse\":17,\"text\":\"Non enim misit Deus Filium suum in mundum, ut judicet mundum, sed ut salvetur mundus per ipsum.\"},{\"verse\":18,\"text\":\"Qui credit in eum, non judicatur ; qui autem non credit, jam judicatus est : quia non credit in nomine unigeniti Filii Dei.\"},{\"verse\":19,\"text\":\"Hoc est autem judicium : quia lux venit in mundum, et dilexerunt homines magis tenebras quam lucem : erant enim eorum mala opera.\"},{\"verse\":20,\"text\":\"Omnis enim qui male agit, odit lucem, et non venit ad lucem, ut non arguantur opera ejus :\"},{\"verse\":21,\"text\":\"qui autem facit veritatem, venit ad lucem, ut manifestentur opera ejus, quia in Deo sunt facta.\"},{\"verse\":22,\"text\":\"Post hæc venit Jesus et discipuli ejus in terram Judæam : et illic demorabatur cum eis, et baptizabat.\"},{\"verse\":23,\"text\":\"Erat autem et Joannes baptizans, in Ænnon, juxta Salim : quia aquæ multæ erant illic, et veniebant et baptizabantur.\"},{\"verse\":24,\"text\":\"Nondum enim missus fuerat Joannes in carcerem.\"},{\"verse\":25,\"text\":\"Facta est autem quæstio ex discipulis Joannis cum Judæis de purificatione.\"},{\"verse\":26,\"text\":\"Et venerunt ad Joannem, et dixerunt ei : Rabbi, qui erat tecum trans Jordanem, cui tu testimonium perhibuisti, ecce hic baptizat, et omnes veniunt ad eum.\"},{\"verse\":27,\"text\":\"Respondit Joannes, et dixit : Non potest homo accipere quidquam, nisi fuerit ei datum de cælo.\"},{\"verse\":28,\"text\":\"Ipsi vos mihi testimonium perhibetis, quod dixerim : Non sum ego Christus : sed quia missus sum ante illum.\"},{\"verse\":29,\"text\":\"Qui habet sponsam, sponsus est : amicus autem sponsi, qui stat, et audit eum, gaudio gaudet propter vocem sponsi. Hoc ergo gaudium meum impletum est.\"},{\"verse\":30,\"text\":\"Illum oportet crescere, me autem minui.\"},{\"verse\":31,\"text\":\"Qui desursum venit, super omnes est. Qui est de terra, de terra est, et de terra loquitur. Qui de cælo venit, super omnes est.\"},{\"verse\":32,\"text\":\"Et quod vidit, et audivit, hoc testatur : et testimonium ejus nemo accipit.\"},{\"verse\":33,\"text\":\"Qui accepit ejus testimonium signavit, quia Deus verax est.\"},{\"verse\":34,\"text\":\"Quem enim misit Deus, verba Dei loquitur : non enim ad mensuram dat Deus spiritum.\"},{\"verse\":35,\"text\":\"Pater diligit Filium et omnia dedit in manu ejus.\"},{\"verse\":36,\"text\":\"Qui credit in Filium, habet vitam æternam ; qui autem incredulus est Filio, non videbit vitam, sed ira Dei manet super eum.\"}],\"summary\":\"Christ’s discourse with Nicodemus. John’s testimony.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":2,\"label\":\"John 2\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":4,\"label\":\"John 4\"}}]]\n"])</script></body></html>
