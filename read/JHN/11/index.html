<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/1yzuijehvoiav.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>John 11 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">11</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ raises Lazarus to life. The rulers resolve to put him to death.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now there was a certain man sick, named Lazarus, of Bethania, of the town of Mary and of Martha her sister.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>(And Mary was she that anointed the Lord with ointment and wiped his feet with her hair: whose brother Lazarus was sick.)</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>His sisters therefore sent to him, saying: Lord, behold, he whom thou lovest is sick.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Jesus hearing it, said to them: This sickness is not unto death, but for the glory of God: that the Son of God may be glorified by it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Now Jesus loved Martha and her sister Mary and Lazarus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>When he had heard therefore that he was sick, he still remained in the same place two days.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Then after that, he said to his disciples: Let us go into Judea again.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The disciples say to him: Rabbi, the Jews but now sought to stone thee. And goest thou thither again?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Jesus answered: Are there not twelve hours of the day? If a man walk in the day he stumbleth not, because he seeth the light of this world:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But if he walk in the night, he stumbleth, because the light is not in him.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>These things he said; and after that he said to them: Lazarus our friend sleepeth: but I go that I may awake him out of sleep.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>His disciples therefore said: Lord, if he sleep, he shall do well.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But Jesus spoke of his death: and they thought that he spoke of the repose of sleep.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Then therefore Jesus said to them plainly: Lazarus is dead.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And I am glad, for your sakes; that I was not there, that you may believe. But, let us go to him.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Thomas therefore, who is called Didymus, said to his fellow disciples: Let us also go, that we may die with him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Jesus therefore came: and found that he had been four days already in the grave.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>(Now Bethania was near Jerusalem, about fifteen furlongs off.)</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And many of the Jews were come to Martha and Mary, to comfort them concerning their brother.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Martha therefore, as soon as she heard that Jesus was come, went to meet him: but Mary sat at home.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Martha therefore said to Jesus: Lord, if thou hadst been here, my brother had not died.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But now also I know that whatsoever thou wilt ask of God, God will give it thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jesus saith to her: Thy brother shall rise again.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Martha saith to him: I know that he shall rise again, in the resurrection at the last day.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And every one that liveth and believeth in me shall not die for ever. Believest thou this?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>She saith to him: Yea, Lord, I have believed that thou art Christ, the Son of the living God, who art come into this world.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And when she had said these things, she went and called her sister Mary secretly, saying: The master is come and calleth for thee.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>She, as soon as she heard this, riseth quickly and cometh to him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>For Jesus was not yet come into the town: but he was still in that place where Martha had met him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The Jews therefore, who were with her in the house and comforted her, when they saw Mary, that she rose up speedily and went out, followed her, saying: She goeth to the grave to weep there.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>When Mary therefore was come where Jesus was, seeing him, she fell down at his feet and saith to him. Lord, if thou hadst been here, my brother had not died.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Jesus, therefore, when he saw her weeping, and the Jews that were come with her weeping, groaned in the spirit and troubled himself,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And said: Where have you laid him? They say to him: Lord, come and see.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And Jesus wept.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The Jews therefore said: Behold how he loved him.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>But some of them said: Could not he that opened the eyes of the man born blind have caused that this man should not die?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesus therefore again groaning in himself, cometh to the sepulchre. Now it was a cave; and a stone was laid over it.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Jesus saith: Take away the stone. Martha, the sister of him that was dead, saith to him: Lord, by this time he stinketh, for he is now of four days.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Jesus saith to her: Did not I say to thee that if thou believe, thou shalt see the glory of God?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>They took therefore the stone away. And Jesus lifting up his eyes, said: Father, I give thee thanks that thou hast heard me.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And I knew that thou hearest me always: but because of the people who stand about have I said it, that they may believe that thou hast sent me.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>When he had said these things, he cried with a loud voice: Lazarus, come forth.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And presently he that had been dead came forth, bound feet and hands with winding bands. And his face was bound about with a napkin. Jesus said to them: Loose him and let him go.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Many therefore of the Jews, who were come to Mary and Martha and had seen the things that Jesus did, believed in him.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>But some of them went to the Pharisees and told them the things that Jesus had done.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>The chief priests, therefore, and the Pharisees gathered a council and said: What do we, for this man doth many miracles?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>If we let him alone so, all will believe in him; and the Romans will come, and take away our place and nation.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>But one of them, named Caiphas, being the high priest that year, said to them: You know nothing.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Neither do you consider that it is expedient for you that one man should die for the people and that the whole nation perish not.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And this he spoke not of himself: but being the high priest of that year, he prophesied that Jesus should die for the nation.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>And not only for the nation, but to gather together in one the children of God that were dispersed.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>From that day therefore they devised to put him to death.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Wherefore Jesus walked no more openly among the Jews: but he went into a country near the desert, unto a city that is called Ephrem. And there he abode with his disciples.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And the pasch of the Jews was at hand: and many from the country went up to Jerusalem, before the pasch, to purify themselves.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>They sought therefore for Jesus; and they discoursed one with another, standing in the temple: What think you that he is not come to the festival day? And the chief priests and Pharisees had given a commandment that, if any man knew where he was, he should tell, that they might apprehend him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem quidam languens Lazarus a Bethania, de castello Mariæ et Marthæ sororis ejus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>(Maria autem erat quæ unxit Dominum unguento, et extersit pedes ejus capillis suis : cujus frater Lazarus infirmabatur.)</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Miserunt ergo sorores ejus ad eum dicentes : Domine, ecce quem amas infirmatur.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Audiens autem Jesus dixit eis : Infirmitas hæc non est ad mortem, sed pro gloria Dei, ut glorificetur Filius Dei per eam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Diligebat autem Jesus Martham, et sororem ejus Mariam, et Lazarum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Ut ergo audivit quia infirmabatur, tunc quidem mansit in eodem loco duobus diebus ;</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>deinde post hæc dixit discipulis suis : Eamus in Judæam iterum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dicunt ei discipuli : Rabbi, nunc quærebant te Judæi lapidare, et iterum vadis illuc ?</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Respondit Jesus : Nonne duodecim sunt horæ diei ? Si quis ambulaverit in die, non offendit, quia lucem hujus mundi videt :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>si autem ambulaverit in nocte, offendit, quia lux non est in eo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hæc ait, et post hæc dixit eis : Lazarus amicus noster dormit : sed vado ut a somno excitem eum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dixerunt ergo discipuli ejus : Domine, si dormit, salvus erit.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dixerat autem Jesus de morte ejus : illi autem putaverunt quia de dormitione somni diceret.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Tunc ergo Jesus dixit eis manifeste : Lazarus mortuus est :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et gaudeo propter vos, ut credatis, quoniam non eram ibi, sed eamus ad eum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dixit ergo Thomas, qui dicitur Didymus, ad condiscipulos : Eamus et nos, ut moriamur cum eo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Venit itaque Jesus : et invenit eum quatuor dies jam in monumento habentem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>(Erat autem Bethania juxta Jerosolymam quasi stadiis quindecim.)</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Multi autem ex Judæis venerant ad Martham et Mariam, ut consolarentur eas de fratre suo.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Martha ergo ut audivit quia Jesus venit, occurrit illi : Maria autem domi sedebat.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dixit ergo Martha ad Jesum : Domine, si fuisses hic, frater meus non fuisset mortuus :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>sed et nunc scio quia quæcumque poposceris a Deo, dabit tibi Deus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Dicit illi Jesus : Resurget frater tuus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dicit ei Martha : Scio quia resurget in resurrectione in novissimo die.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixit ei Jesus : Ego sum resurrectio et vita : qui credit in me, etiam si mortuus fuerit, vivet :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et omnis qui vivit et credit in me, non morietur in æternum. Credis hoc ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Ait illi : Utique Domine, ego credidi quia tu es Christus, Filius Dei vivi, qui in hunc mundum venisti.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et cum hæc dixisset, abiit, et vocavit Mariam sororem suam silentio, dicens : Magister adest, et vocat te.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Illa ut audivit, surgit cito, et venit ad eum ;</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>nondum enim venerat Jesus in castellum : sed erat adhuc in illo loco, ubi occurrerat ei Martha.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Judæi ergo, qui erant cum ea in domo, et consolabantur eam, cum vidissent Mariam quia cito surrexit, et exiit, secuti sunt eam dicentes : Quia vadit ad monumentum, ut ploret ibi.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Maria ergo, cum venisset ubi erat Jesus, videns eum, cecidit ad pedes ejus, et dicit ei : Domine, si fuisses hic, non esset mortuus frater meus.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Jesus ergo, ut vidit eam plorantem, et Judæos, qui venerant cum ea, plorantes, infremuit spiritu, et turbavit seipsum,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>et dixit : Ubi posuistis eum ? Dicunt ei : Domine, veni, et vide.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et lacrimatus est Jesus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Dixerunt ergo Judæi : Ecce quomodo amabat eum.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Quidam autem ex ipsis dixerunt : Non poterat hic, qui aperuit oculos cæci nati, facere ut hic non moreretur ?</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesus ergo rursum fremens in semetipso, venit ad monumentum. Erat autem spelunca, et lapis superpositus erat ei.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Ait Jesus : Tollite lapidem. Dicit ei Martha, soror ejus qui mortuus fuerat : Domine, jam fœtet, quatriduanus est enim.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Dicit ei Jesus : Nonne dixi tibi quoniam si credideris, videbis gloriam Dei ?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Tulerunt ergo lapidem : Jesus autem, elevatis sursum oculis, dixit : Pater, gratias ago tibi quoniam audisti me.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Ego autem sciebam quia semper me audis, sed propter populum qui circumstat, dixi : ut credant quia tu me misisti.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Hæc cum dixisset, voce magna clamavit : Lazare, veni foras.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Et statim prodiit qui fuerat mortuus, ligatus pedes, et manus institis, et facies illius sudario erat ligata. Dixit eis Jesus : Solvite eum et sinite abire.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Multi ergo ex Judæis, qui venerant ad Mariam, et Martham, et viderant quæ fecit Jesus, crediderunt in eum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Quidam autem ex ipsis abierunt ad pharisæos, et dixerunt eis quæ fecit Jesus.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Collegerunt ergo pontifices et pharisæi concilium, et dicebant : Quid facimus, quia hic homo multa signa facit ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Si dimittimus eum sic, omnes credent in eum, et venient Romani, et tollent nostrum locum, et gentem.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Unus autem ex ipsis, Caiphas nomine, cum esset pontifex anni illius, dixit eis : Vos nescitis quidquam,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>nec cogitatis quia expedit vobis ut unus moriatur homo pro populo, et non tota gens pereat.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Hoc autem a semetipso non dixit : sed cum esset pontifex anni illius, prophetavit, quod Jesus moriturus erat pro gente,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>et non tantum pro gente, sed ut filios Dei, qui erant dispersi, congregaret in unum.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Ab illo ergo die cogitaverunt ut interficerent eum.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Jesus ergo jam non in palam ambulabat apud Judæos, sed abiit in regionem juxta desertum, in civitatem quæ dicitur Ephrem, et ibi morabatur cum discipulis suis.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Proximum autem erat Pascha Judæorum, et ascenderunt multi Jerosolymam de regione ante Pascha, ut sanctificarent seipsos.</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Quærebant ergo Jesum, et colloquebantur ad invicem, in templo stantes : Quid putatis, quia non venit ad diem festum ? Dederant autem pontifices et pharisæi mandatum ut si quis cognoverit ubi sit, indicet, ut apprehendant eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/10/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" ari ovest is sick.\"},{\"verse\":4,\"text\":\"And Jesus hearing it, said to them: This sickness is not unto death, but for the glory of God: that the Son of God may be glorified by it.\"},{\"verse\":5,\"text\":\"Now Jesus loved Martha and her sister Mary and Lazarus.\"},{\"verse\":6,\"text\":\"When he had heard therefore that he was sick, he still remained in the same place two days.\"},{\"verse\":7,\"text\":\"Then after that, he said to his disciples: Let us go into Judea again.\"},{\"verse\":8,\"text\":\"The disciples say to him: Rabbi, the Jews but now sought to stone thee. And goest thou thither again?\"},{\"verse\":9,\"text\":\"Jesus answered: Are there not twelve hours of the day? If a man walk in the day he stumbleth not, because he seeth the light of this world:\"},{\"verse\":10,\"text\":\"But if he walk in the night, he stumbleth, because the light is not in him.\"},{\"verse\":11,\"text\":\"These things he said; and after that he said to them: Lazarus our friend sleepeth: but I go that I may awake him out of sleep.\"},{\"verse\":12,\"text\":\"His disciples therefore said: Lord, if he sleep, he shall do well.\"},{\"verse\":13,\"text\":\"But Jesus spoke of his death: and they thought that he spoke of the repose of sleep.\"},{\"verse\":14,\"text\":\"Then therefore Jesus said to them plainly: Lazarus is dead.\"},{\"verse\":15,\"text\":\"And I am glad, for your sakes; that I was not there, that you may believe. But, let us go to him.\"},{\"verse\":16,\"text\":\"Thomas therefore, who is called Didymus, said to his fellow disciples: Let us also go, that we may die with him.\"},{\"verse\":17,\"text\":\"Jesus therefore came: and found that he had been four days already in the grave.\"},{\"verse\":18,\"text\":\"(Now Bethania was near Jerusalem, about fifteen furlongs off.)\"},{\"verse\":19,\"text\":\"And many of the Jews were come to Martha and Mary, to comfort them concerning their brother.\"},{\"verse\":20,\"text\":\"Martha therefore, as soon as she heard that Jesus was come, went to meet him: but Mary sat at home.\"},{\"verse\":21,\"text\":\"Martha therefore said to Jesus: Lord, if thou hadst been here, my brother had not died.\"},{\"verse\":22,\"text\":\"But now also I know that whatsoever thou wilt ask of God, God will give it thee.\"},{\"verse\":23,\"text\":\"Jesus saith to her: Thy brother shall rise again.\"},{\"verse\":24,\"text\":\"Martha saith to him: I know that he shall rise again, in the resurrection at the last day.\"},{\"verse\":25,\"text\":\"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:\"},{\"verse\":26,\"text\":\"And every one that liveth and believeth in me shall not die for ever. Believest thou this?\"},{\"verse\":27,\"text\":\"She saith to him: Yea, Lord, I have believed that thou art Christ, the Son of the living God, who art come into this world.\"},{\"verse\":28,\"text\":\"And when she had said these things, she went and called her sister Mary secretly, saying: The master is come and calleth for thee.\"},{\"verse\":29,\"text\":\"She, as soon as she heard this, riseth quickly and cometh to him.\"},{\"verse\":30,\"text\":\"For Jesus was not yet come into the town: but he was still in that place where Martha had met him.\"},{\"verse\":31,\"text\":\"The Jews therefore, who were with her in the house and comforted her, when they saw Mary, that she rose up speedily and went out, followed her, saying: She goeth to the grave to weep there.\"},{\"verse\":32,\"text\":\"When Mary therefore was come where Jesus was, seeing him, she fell down at his feet and saith to him. Lord, if thou hadst been here, my brother had not died.\"},{\"verse\":33,\"text\":\"Jesus, therefore, when he saw her weeping, and the Jews that were come with her weeping, groaned in the spirit and troubled himself,\"},{\"verse\":34,\"text\":\"And said: Where have you laid him? They say to him: Lord, come and see.\"},{\"verse\":35,\"text\":\"And Jesus wept.\"},{\"verse\":36,\"text\":\"The Jews therefore said: Behold how he loved him.\"},{\"verse\":37,\"text\":\"But some of them said: Could not he that opened the eyes of the man born blind have caused that this man should not die?\"},{\"verse\":38,\"text\":\"Jesus therefore again groaning in himself, cometh to the sepulchre. Now it was a cave; and a stone was laid over it.\"},{\"verse\":39,\"text\":\"Jesus saith: Take away the stone. Martha, the sister of him that was dead, saith to him: Lord, by this time he stinketh, for he is now of four days.\"},{\"verse\":40,\"text\":\"Jesus saith to her: Did not I say to thee that if thou believe, thou shalt see the glory of God?\"},{\"verse\":41,\"text\":\"They took therefore the stone away. And Jesus lifting up his eyes, said: Father, I give thee thanks that thou hast heard me.\"},{\"verse\":42,\"text\":\"And I knew that thou hearest me always: but because of the people who stand about have I said it, that they may believe that thou hast sent me.\"},{\"verse\":43,\"text\":\"When he had said these things, he cried with a loud voice: Lazarus, come forth.\"},{\"verse\":44,\"text\":\"And presently he that had been dead came forth, bound feet and hands with winding bands. And his face was bound about with a napkin. Jesus said to them: Loose him and let him go.\"},{\"verse\":45,\"text\":\"Many therefore of the Jews, who were come to Mary and Martha and had seen the things that Jesus did, believed in him.\"},{\"verse\":46,\"text\":\"But some of them went to the Pharisees and told them the things that Jesus had done.\"},{\"verse\":47,\"text\":\"The chief priests, therefore, and the Pharisees gathered a council and said: What do we, for this man doth many miracles?\"},{\"verse\":48,\"text\":\"If we let him alone so, all will believe in him; and the Romans will come, and take away our place and nation.\"},{\"verse\":49,\"text\":\"But one of them, named Caiphas, being the high priest that year, said to them: You know nothing.\"},{\"verse\":50,\"text\":\"Neither do you consider that it is expedient for you that one man should die for the people and that the whole nation perish not.\"},{\"verse\":51,\"text\":\"And this he spoke not of himself: but being the high priest of that year, he prophesied that Jesus should die for the nation.\"},{\"verse\":52,\"text\":\"And not only for the nation, but to gather together in one the children of God that were dispersed.\"},{\"verse\":53,\"text\":\"From that day therefore they devised to put him to death.\"},{\"verse\":54,\"text\":\"Wherefore Jesus walked no more openly among the Jews: but he went into a country near the desert, unto a city that is called Ephrem. And there he abode with his disciples.\"},{\"verse\":55,\"text\":\"And the pasch of the Jews was at hand: and many from the country went up to Jerusalem, before the pasch, to purify themselves.\"},{\"verse\":56,\"text\":\"They sought therefore for Jesus; and they discoursed one with another, standing in the temple: What think you that he is not come to the festival day? And the chief priests and Pharisees had given a commandment that, if any man knew where he was, he should tell, that they might apprehend him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem quidam languens Lazarus a Bethania, de castello Mariæ et Marthæ sororis ejus.\"},{\"verse\":2,\"text\":\"(Maria autem erat quæ unxit Dominum unguento, et extersit pedes ejus capillis suis : cujus frater Lazarus infirmabatur.)\"},{\"verse\":3,\"text\":\"Miserunt ergo sorores ejus ad eum dicentes : Domine, ecce quem amas infirmatur.\"},{\"verse\":4,\"text\":\"Audiens autem Jesus dixit eis : Infirmitas hæc non est ad mortem, sed pro gloria Dei, ut glorificetur Filius Dei per eam.\"},{\"verse\":5,\"text\":\"Diligebat autem Jesus Martham, et sororem ejus Mariam, et Lazarum.\"},{\"verse\":6,\"text\":\"Ut ergo audivit quia infirmabatur, tunc quidem mansit in eodem loco duobus diebus ;\"},{\"verse\":7,\"text\":\"deinde post hæc dixit discipulis suis : Eamus in Judæam iterum.\"},{\"verse\":8,\"text\":\"Dicunt ei discipuli : Rabbi, nunc quærebant te Judæi lapidare, et iterum vadis illuc ?\"},{\"verse\":9,\"text\":\"Respondit Jesus : Nonne duodecim sunt horæ diei ? Si quis ambulaverit in die, non offendit, quia lucem hujus mundi videt :\"},{\"verse\":10,\"text\":\"si autem ambulaverit in nocte, offendit, quia lux non est in eo.\"},{\"verse\":11,\"text\":\"Hæc ait, et post hæc dixit eis : Lazarus amicus noster dormit : sed vado ut a somno excitem eum.\"},{\"verse\":12,\"text\":\"Dixerunt ergo discipuli ejus : Domine, si dormit, salvus erit.\"},{\"verse\":13,\"text\":\"Dixerat autem Jesus de morte ejus : illi autem putaverunt quia de dormitione somni diceret.\"},{\"verse\":14,\"text\":\"Tunc ergo Jesus dixit eis manifeste : Lazarus mortuus est :\"},{\"verse\":15,\"text\":\"et gaudeo propter vos, ut credatis, quoniam non eram ibi, sed eamus ad eum.\"},{\"verse\":16,\"text\":\"Dixit ergo Thomas, qui dicitur Didymus, ad condiscipulos : Eamus et nos, ut moriamur cum eo.\"},{\"verse\":17,\"text\":\"Venit itaque Jesus : et invenit eum quatuor dies jam in monumento habentem.\"},{\"verse\":18,\"text\":\"(Erat autem Bethania juxta Jerosolymam quasi stadiis quindecim.)\"},{\"verse\":19,\"text\":\"Multi autem ex Judæis venerant ad Martham et Mariam, ut consolarentur eas de fratre suo.\"},{\"verse\":20,\"text\":\"Martha ergo ut audivit quia Jesus venit, occurrit illi : Maria autem domi sedebat.\"},{\"verse\":21,\"text\":\"Dixit ergo Martha ad Jesum : Domine, si fuisses hic, frater meus non fuisset mortuus :\"},{\"verse\":22,\"text\":\"sed et nunc scio quia quæcumque poposceris a Deo, dabit tibi Deus.\"},{\"verse\":23,\"text\":\"Dicit illi Jesus : Resurget frater tuus.\"},{\"verse\":24,\"text\":\"Dicit ei Martha : Scio quia resurget in resurrectione in novissimo die.\"},{\"verse\":25,\"text\":\"Dixit ei Jesus : Ego sum resurrectio et vita : qui credit in me, etiam si mortuus fuerit, vivet :\"},{\"verse\":26,\"text\":\"et omnis qui vivit et credit in me, non morietur in æternum. Credis hoc ?\"},{\"verse\":27,\"text\":\"Ait illi : Utique Domine, ego credidi quia tu es Christus, Filius Dei vivi, qui in hunc mundum venisti.\"},{\"verse\":28,\"text\":\"Et cum hæc dixisset, abiit, et vocavit Mariam sororem suam silentio, dicens : Magister adest, et vocat te.\"},{\"verse\":29,\"text\":\"Illa ut audivit, surgit cito, et venit ad eum ;\"},{\"verse\":30,\"text\":\"nondum enim venerat Jesus in castellum : sed erat adhuc in illo loco, ubi occurrerat ei Martha.\"},{\"verse\":31,\"text\":\"Judæi ergo, qui erant cum ea in domo, et consolabantur eam, cum vidissent Mariam quia cito surrexit, et exiit, secuti sunt eam dicentes : Quia vadit ad monumentum, ut ploret ibi.\"},{\"verse\":32,\"text\":\"Maria ergo, cum venisset ubi erat Jesus, videns eum, cecidit ad pedes ejus, et dicit ei : Domine, si fuisses hic, non esset mortuus frater meus.\"},{\"verse\":33,\"text\":\"Jesus ergo, ut vidit eam plorantem, et Judæos, qui venerant cum ea, plorantes, infremuit spiritu, et turbavit seipsum,\"},{\"verse\":34,\"text\":\"et dixit : Ubi posuistis eum ? Dicunt ei : Domine, veni, et vide.\"},{\"verse\":35,\"text\":\"Et lacrimatus est Jesus.\"},{\"verse\":36,\"text\":\"Dixerunt ergo Judæi : Ecce quomodo amabat eum.\"},{\"verse\":37,\"text\":\"Quidam autem ex ipsis dixerunt : Non poterat hic, qui aperuit oculos cæci nati, facere ut hic non moreretur ?\"},{\"verse\":38,\"text\":\"Jesus ergo rursum fremens in semetipso, venit ad monumentum. Erat autem spelunca, et lapis superpositus erat ei.\"},{\"verse\":39,\"text\":\"Ait Jesus : Tollite lapidem. Dicit ei Martha, soror ejus qui mortuus fuerat : Domine, jam fœtet, quatriduanus est enim.\"},{\"verse\":40,\"text\":\"Dicit ei Jesus : Nonne dixi tibi quoniam si credideris, videbis gloriam Dei ?\"},{\"verse\":41,\"text\":\"Tulerunt ergo lapidem : Jesus autem, elevatis sursum oculis, dixit : Pater, gratias ago tibi quoniam audisti me.\"},{\"verse\":42,\"text\":\"Ego autem sciebam quia semper me audis, sed propter populum qui circumstat, dixi : ut credant quia tu me misisti.\"},{\"verse\":43,\"text\":\"Hæc cum dixisset, voce magna clamavit : Lazare, veni foras.\"},{\"verse\":44,\"text\":\"Et statim prodiit qui fuerat mortuus, ligatus pedes, et manus institis, et facies illius sudario erat ligata. Dixit eis Jesus : Solvite eum et sinite abire.\"},{\"verse\":45,\"text\":\"Multi ergo ex Judæis, qui venerant ad Mariam, et Martham, et viderant quæ fecit Jesus, crediderunt in eum.\"},{\"verse\":46,\"text\":\"Quidam autem ex ipsis abierunt ad pharisæos, et dixerunt eis quæ fecit Jesus.\"},{\"verse\":47,\"text\":\"Collegerunt ergo pontifices et pharisæi concilium, et dicebant : Quid facimus, quia hic homo multa signa facit ?\"},{\"verse\":48,\"text\":\"Si dimittimus eum sic, omnes credent in eum, et venient Romani, et tollent nostrum locum, et gentem.\"},{\"verse\":49,\"text\":\"Unus autem ex ipsis, Caiphas nomine, cum esset pontifex anni illius, dixit eis : Vos nescitis quidquam,\"},{\"verse\":50,\"text\":\"nec cogitatis quia expedit vobis ut unus moriatur homo pro populo, et non tota gens pereat.\"},{\"verse\":51,\"text\":\"Hoc autem a semetipso non dixit : sed cum esset pontifex anni illius, prophetavit, quod Jesus moriturus erat pro gente,\"},{\"verse\":52,\"text\":\"et non tantum pro gente, sed ut filios Dei, qui erant dispersi, congregaret in unum.\"},{\"verse\":53,\"text\":\"Ab illo ergo die cogitaverunt ut interficerent eum.\"},{\"verse\":54,\"text\":\"Jesus ergo jam non in palam ambulabat apud Judæos, sed abiit in regionem juxta desertum, in civitatem quæ dicitur Ephrem, et ibi morabatur cum discipulis suis.\"},{\"verse\":55,\"text\":\"Proximum autem erat Pascha Judæorum, et ascenderunt multi Jerosolymam de regione ante Pascha, ut sanctificarent seipsos.\"},{\"verse\":56,\"text\":\"Quærebant ergo Jesum, et colloquebantur ad invicem, in templo stantes : Quid putatis, quia non venit ad diem festum ? Dederant autem pontifices et pharisæi mandatum ut si quis cognoverit ubi sit, indicet, ut apprehendant eum.\"}],\"summary\":\"Christ raises Lazarus to life. The rulers resolve to put him to death.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":10,\"label\":\"John 10\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":12,\"label\":\"John 12\"}}]]\n"])</script></body></html>
