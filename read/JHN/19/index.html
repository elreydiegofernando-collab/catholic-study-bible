<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>John 19 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">19</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The continuation of the history of the Passion of Christ.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then therefore Pilate took Jesus and scourged him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And the soldiers platting a crown of thorns, put it upon his head: and they put on him a purple garment.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And they came to him and said: Hail, king of the Jews. And they gave him blows.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Pilate therefore went forth again and saith to them: Behold, I bring him forth unto you, that you may know that I find no cause in him.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>(Jesus therefore came forth, bearing the crown of thorns and the purple garment.) And he saith to them: Behold the Man.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>When the chief priests, therefore, and the servants had seen him, they cried out, saying: Crucify him, Crucify him. Pilate saith to them: Take him you, and crucify him: for I find no cause in him.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The Jews answered him: We have a law; and according to the law he ought to die, because he made himself the Son of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>When Pilate therefore had heard this saying, he feared the more.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And he entered into the hall again; and he said to Jesus: Whence art thou? But Jesus gave him no answer.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Pilate therefore saith to him: Speakest thou not to me? Knowest thou not that I have power to crucify thee, and I have power to release thee?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Jesus answered: Thou shouldst not have any power against me, unless it were given thee from above. Therefore, he that hath delivered me to thee hath the greater sin.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And from henceforth Pilate sought to release him. But the Jews cried out, saying: If thou release this man, thou art not Caesar’s friend. For whosoever maketh himself a king speaketh against Caesar.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Now when Pilate had heard these words, he brought Jesus forth and sat down in the judgment seat, in the place that is called Lithostrotos, and in Hebrew Gabbatha.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And it was the parasceve of the pasch, about the sixth hour: and he saith to the Jews: Behold your king.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But they cried out: Away with him: Away with him: Crucify him. Pilate saith to them: shall I crucify your king? The chief priests answered: We have no king but Caesar.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Then therefore he delivered him to them to be crucified. And they took Jesus and led him forth.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And bearing his own cross, he went forth to the place which is called Calvary, but in Hebrew Golgotha.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Where they crucified him, and with him two others, one on each side, and Jesus in the midst.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Pilate wrote a title also: and he put it upon the cross. And the writing was: JESUS OF NAZARETH, THE KING OF THE JEWS.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>This title therefore many of the Jews did read: because the place where Jesus was crucified was nigh to the city. And it was written in Hebrew, in Greek, and in Latin.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Then the chief priests of the Jews said to Pilate: Write not: The King of the Jews. But that he said: I am the King of the Jews.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Pilate answered: What I have written, I have written.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The soldiers therefore, when they had crucified him, took his garments, (and they made four parts, to every soldier a part) and also his coat. Now the coat was without seam, woven from the top throughout.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>They said then one to another: Let us not cut it but let us cast lots for it, whose it shall be; that the scripture might be fulfilled, saying: They have parted my garments among them, and upon my vesture they have cast lots. And the soldiers indeed did these things.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Now there stood by the cross of Jesus, his mother and his mother’s sister, Mary of Cleophas, and Mary Magdalen.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>When Jesus therefore had seen his mother and the disciple standing whom he loved, he saith to his mother: Woman, behold thy son.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>After that, he saith to the disciple: Behold thy mother. And from that hour, the disciple took her to his own.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Afterwards, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Now there was a vessel set there, full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Then the Jews (because it was the parasceve), that the bodies might not remain upon the cross on the sabbath day (for that was a great sabbath day), besought Pilate that their legs might be broken: and that they might be taken away.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The soldiers therefore came: and they broke the legs of the first, and of the other that was crucified with him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>But after they were come to Jesus, when they saw that he was already dead, they did not break his legs.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But one of the soldiers with a spear opened his side: and immediately there came out blood and water.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And he that saw it hath given testimony: and his testimony is true. And he knoweth that he saith true: that you also may believe.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>For these things were done that the scripture might be fulfilled: You shall not break a bone of him.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And again another scripture saith: They shall look on him whom they pierced.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And after these things, Joseph of Arimathea (because he was a disciple of Jesus, but secretly for fear of the Jews), besought Pilate that he might take away the body of Jesus. And Pilate gave leave. He came therefore and took away the body of Jesus.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And Nicodemus also came (he who at the first came to Jesus by night), bringing a mixture of myrrh and aloes, about an hundred pound weight.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>They took therefore the body of Jesus and bound it in linen cloths, with the spices, as the manner of the Jews is to bury.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Now there was in the place where he was crucified a garden: and in the garden a new sepulchre, wherein no man yet had been laid.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>There, therefore, because of the parasceve of the Jews, they laid Jesus: because the sepulchre was nigh at hand.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc ergo apprehendit Pilatus Jesum, et flagellavit.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et milites plectentes coronam de spinis, imposuerunt capiti ejus : et veste purpurea circumdederunt eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et veniebant ad eum, et dicebant : Ave, rex Judæorum : et dabant ei alapas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Exivit ergo iterum Pilatus foras, et dicit eis : Ecce adduco vobis eum foras, ut cognoscatis quia nullam invenio in eo causam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>(Exivit ergo Jesus portans coronam spineam, et purpureum vestimentum.) Et dicit eis : Ecce homo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cum ergo vidissent eum pontifices et ministri, clamabant, dicentes : Crucifige, crucifige eum. Dicit eis Pilatus : Accipite eum vos, et crucifigite : ego enim non invenio in eo causam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Responderunt ei Judæi : Nos legem habemus, et secundum legem debet mori, quia Filium Dei se fecit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Cum ergo audisset Pilatus hunc sermonem, magis timuit.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et ingressus est prætorium iterum : et dixit ad Jesum : Unde es tu ? Jesus autem responsum non dedit ei.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dicit ergo ei Pilatus : Mihi non loqueris ? nescis quia potestatem habeo crucifigere te, et potestatem habeo dimittere te ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Respondit Jesus : Non haberes potestatem adversum me ullam, nisi tibi datum esset desuper. Propterea qui me tradidit tibi, majus peccatum habet.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et exinde quærebat Pilatus dimittere eum. Judæi autem clamabant dicentes : Si hunc dimittis, non es amicus Cæsaris. Omnis enim qui se regem facit, contradicit Cæsari.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Pilatus autem cum audisset hos sermones, adduxit foras Jesum : et sedit pro tribunali, in loco qui dicitur Lithostrotos, hebraice autem Gabbatha.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Erat autem parasceve Paschæ, hora quasi sexta, et dicit Judæis : Ecce rex vester.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Illi autem clamabant : Tolle, tolle, crucifige eum. Dicit eis Pilatus : Regem vestrum crucifigam ? Responderunt pontifices : Non habemus regem, nisi Cæsarem.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Tunc ergo tradidit eis illum ut crucifigeretur. Susceperunt autem Jesum, et eduxerunt.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et bajulans sibi crucem exivit in eum, qui dicitur Calvariæ locum, hebraice autem Golgotha :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>ubi crucifixerunt eum, et cum eo alios duos hinc et hinc, medium autem Jesum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Scripsit autem et titulum Pilatus, et posuit super crucem. Erat autem scriptum : Jesus Nazarenus, Rex Judæorum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Hunc ergo titulum multi Judæorum legerunt : quia prope civitatem erat locus, ubi crucifixus est Jesus, et erat scriptum hebraice, græce, et latine.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dicebant ergo Pilato pontifices Judæorum : Noli scribere : Rex Judæorum : sed quia ipse dixit : Rex sum Judæorum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Respondit Pilatus : Quod scripsi, scripsi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Milites ergo cum crucifixissent eum, acceperunt vestimenta ejus (et fecerunt quatuor partes, unicuique militi partem) et tunicam. Erat autem tunica inconsutilis, desuper contexta per totum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Dixerunt ergo ad invicem : Non scindamus eam, sed sortiamur de illa cujus sit. Ut Scriptura impleretur, dicens : Partiti sunt vestimenta mea sibi : et in vestem meam miserunt sortem. Et milites quidem hæc fecerunt.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Stabant autem juxta crucem Jesu mater ejus, et soror matris ejus, Maria Cleophæ, et Maria Magdalene.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suæ : Mulier, ecce filius tuus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Deinde dicit discipulo : Ecce mater tua. Et ex illa hora accepit eam discipulus in sua.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Postea sciens Jesus quia omnia consummata sunt, ut consummaretur Scriptura, dixit : Sitio.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Vas ergo erat positum aceto plenum. Illi autem spongiam plenam aceto, hyssopo circumponentes, obtulerunt ori ejus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Cum ergo accepisset Jesus acetum, dixit : Consummatum est. Et inclinato capite tradidit spiritum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Judæi ergo (quoniam parasceve erat) ut non remanerent in cruce corpora sabbato (erat enim magnus dies ille sabbati), rogaverunt Pilatum ut frangerentur eorum crura, et tollerentur.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Venerunt ergo milites : et primi quidem fregerunt crura, et alterius, qui crucifixus est cum eo.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Ad Jesum autem cum venissent, ut viderunt eum jam mortuum, non fregerunt ejus crura,</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>sed unus militum lancea latus ejus aperuit, et continuo exivit sanguis et aqua.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Et qui vidit, testimonium perhibuit : et verum est testimonium ejus. Et ille scit quia vera dicit : ut et vos credatis.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Facta sunt enim hæc ut Scriptura impleretur : Os non comminuetis ex eo.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et iterum alia Scriptura dicit : Videbunt in quem transfixerunt.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Post hæc autem rogavit Pilatum Joseph ab Arimathæa (eo quod esset discipulus Jesu, occultus autem propter metum Judæorum), ut tolleret corpus Jesu. Et permisit Pilatus. Venit ergo, et tulit corpus Jesu.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Venit autem et Nicodemus, qui venerat ad Jesum nocte primum, ferens mixturam myrrhæ et aloës, quasi libras centum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Acceperunt ergo corpus Jesu, et ligaverunt illud linteis cum aromatibus, sicut mos est Judæis sepelire.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Erat autem in loco, ubi crucifixus est, hortus : et in horto monumentum novum, in quo nondum quisquam positus erat.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Ibi ergo propter parasceven Judæorum, quia juxta erat monumentum, posuerunt Jesum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/18/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 18</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/20/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 20</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->19<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: John 18" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-ston ge/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.19\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":19,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"Then therefore Pilate took Jesus and scourged him.\"},{\"verse\":2,\"text\":\"And the soldiers platting a crown of thorns, put it upon his head: and they put on him a purple garment.\"},{\"verse\":3,\"text\":\"And they came to him and said: Hail, king of the Jews. And they gave him blows.\"},{\"verse\":4,\"text\":\"Pilate therefore went forth again and saith to them: Behold, I bring him forth unto you, that you may know that I find no cause in him.\"},{\"verse\":5,\"text\":\"(Jesus therefore came forth, bearing the crown of thorns and the purple garment.) And he saith to them: Behold the Man.\"},{\"verse\":6,\"text\":\"When the chief priests, therefore, and the servants had seen him, they cried out, saying: Crucify him, Crucify him. Pilate saith to them: Take him you, and crucify him: for I find no cause in him.\"},{\"verse\":7,\"text\":\"The Jews answered him: We have a law; and according to the law he ought to die, because he made himself the Son of God.\"},{\"verse\":8,\"text\":\"When Pilate therefore had heard this saying, he feared the more.\"},{\"verse\":9,\"text\":\"And he entered into the hall again; and he said to Jesus: Whence art thou? But Jesus gave him no answer.\"},{\"verse\":10,\"text\":\"Pilate therefore saith to him: Speakest thou not to me? Knowest thou not that I have power to crucify thee, and I have power to release thee?\"},{\"verse\":11,\"text\":\"Jesus answered: Thou shouldst not have any power against me, unless it were given thee from above. Therefore, he that hath delivered me to thee hath the greater sin.\"},{\"verse\":12,\"text\":\"And from henceforth Pilate sought to release him. But the Jews cried out, saying: If thou release this man, thou art not Caesar’s friend. For whosoever maketh himself a king speaketh against Caesar.\"},{\"verse\":13,\"text\":\"Now when Pilate had heard these words, he brought Jesus forth and sat down in the judgment seat, in the place that is called Lithostrotos, and in Hebrew Gabbatha.\"},{\"verse\":14,\"text\":\"And it was the parasceve of the pasch, about the sixth hour: and he saith to the Jews: Behold your king.\"},{\"verse\":15,\"text\":\"But they cried out: Away with him: Away with him: Crucify him. Pilate saith to them: shall I crucify your king? The chief priests answered: We have no king but Caesar.\"},{\"verse\":16,\"text\":\"Then therefore he delivered him to them to be crucified. And they took Jesus and led him forth.\"},{\"verse\":17,\"text\":\"And bearing his own cross, he went forth to the place which is called Calvary, but in Hebrew Golgotha.\"},{\"verse\":18,\"text\":\"Where they crucified him, and with him two others, one on each side, and Jesus in the midst.\"},{\"verse\":19,\"text\":\"And Pilate wrote a title also: and he put it upon the cross. And the writing was: JESUS OF NAZARETH, THE KING OF THE JEWS.\"},{\"verse\":20,\"text\":\"This title therefore many of the Jews did read: because the place where Jesus was crucified was nigh to the city. And it was written in Hebrew, in Greek, and in Latin.\"},{\"verse\":21,\"text\":\"Then the chief priests of the Jews said to Pilate: Write not: The King of the Jews. But that he said: I am the King of the Jews.\"},{\"verse\":22,\"text\":\"Pilate answered: What I have written, I have written.\"},{\"verse\":23,\"text\":\"The soldiers therefore, when they had crucified him, took his garments, (and they made four parts, to every soldier a part) and also his coat. Now the coat was without seam, woven from the top throughout.\"},{\"verse\":24,\"text\":\"They said then one to another: Let us not cut it but let us cast lots for it, whose it shall be; that the scripture might be fulfilled, saying: They have parted my garments among them, and upon my vesture they have cast lots. And the soldiers indeed did these things.\"},{\"verse\":25,\"text\":\"Now there stood by the cross of Jesus, his mother and his mother’s sister, Mary of Cleophas, and Mary Magdalen.\"},{\"verse\":26,\"text\":\"When Jesus therefore had seen his mother and the disciple standing whom he loved, he saith to his mother: Woman, behold thy son.\"},{\"verse\":27,\"text\":\"After that, he saith to the disciple: Behold thy mother. And from that hour, the disciple took her to his own.\"},{\"verse\":28,\"text\":\"Afterwards, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst.\"},{\"verse\":29,\"text\":\"Now there was a vessel set there, full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth.\"},{\"verse\":30,\"text\":\"Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost.\"},{\"verse\":31,\"text\":\"Then the Jews (because it was the parasceve), that the bodies might not remain upon the cross on the sabbath day (for that was a great sabbath day), besought Pilate that their legs might be broken: and that they might be taken away.\"},{\"verse\":32,\"text\":\"The soldiers therefore came: and they broke the legs of the first, and of the other that was crucified with him.\"},{\"verse\":33,\"text\":\"But after they were come to Jesus, when they saw that he was already dead, they did not break his legs.\"},{\"verse\":34,\"text\":\"But one of the soldiers with a spear opened his side: and immediately there came out blood and water.\"},{\"verse\":35,\"text\":\"And he that saw it hath given testimony: and his testimony is true. And he knoweth that he saith true: that you also may believe.\"},{\"verse\":36,\"text\":\"For these things were done that the scripture might be fulfilled: You shall not break a bone of him.\"},{\"verse\":37,\"text\":\"And again another scripture saith: They shall look on him whom they pierced.\"},{\"verse\":38,\"text\":\"And after these things, Joseph of Arimathea (because he was a disciple of Jesus, but secretly for fear of the Jews), besought Pilate that he might take away the body of Jesus. And Pilate gave leave. He came therefore and took away the body of Jesus.\"},{\"verse\":39,\"text\":\"And Nicodemus also came (he who at the first came to Jesus by night), bringing a mixture of myrrh and aloes, about an hundred pound weight.\"},{\"verse\":40,\"text\":\"They took therefore the body of Jesus and bound it in linen cloths, with the spices, as the manner of the Jews is to bury.\"},{\"verse\":41,\"text\":\"Now there was in the place where he was crucified a garden: and in the garden a new sepulchre, wherein no man yet had been laid.\"},{\"verse\":42,\"text\":\"There, therefore, because of the parasceve of the Jews, they laid Jesus: because the sepulchre was nigh at hand.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc ergo apprehendit Pilatus Jesum, et flagellavit.\"},{\"verse\":2,\"text\":\"Et milites plectentes coronam de spinis, imposuerunt capiti ejus : et veste purpurea circumdederunt eum.\"},{\"verse\":3,\"text\":\"Et veniebant ad eum, et dicebant : Ave, rex Judæorum : et dabant ei alapas.\"},{\"verse\":4,\"text\":\"Exivit ergo iterum Pilatus foras, et dicit eis : Ecce adduco vobis eum foras, ut cognoscatis quia nullam invenio in eo causam.\"},{\"verse\":5,\"text\":\"(Exivit ergo Jesus portans coronam spineam, et purpureum vestimentum.) Et dicit eis : Ecce homo.\"},{\"verse\":6,\"text\":\"Cum ergo vidissent eum pontifices et ministri, clamabant, dicentes : Crucifige, crucifige eum. Dicit eis Pilatus : Accipite eum vos, et crucifigite : ego enim non invenio in eo causam.\"},{\"verse\":7,\"text\":\"Responderunt ei Judæi : Nos legem habemus, et secundum legem debet mori, quia Filium Dei se fecit.\"},{\"verse\":8,\"text\":\"Cum ergo audisset Pilatus hunc sermonem, magis timuit.\"},{\"verse\":9,\"text\":\"Et ingressus est prætorium iterum : et dixit ad Jesum : Unde es tu ? Jesus autem responsum non dedit ei.\"},{\"verse\":10,\"text\":\"Dicit ergo ei Pilatus : Mihi non loqueris ? nescis quia potestatem habeo crucifigere te, et potestatem habeo dimittere te ?\"},{\"verse\":11,\"text\":\"Respondit Jesus : Non haberes potestatem adversum me ullam, nisi tibi datum esset desuper. Propterea qui me tradidit tibi, majus peccatum habet.\"},{\"verse\":12,\"text\":\"Et exinde quærebat Pilatus dimittere eum. Judæi autem clamabant dicentes : Si hunc dimittis, non es amicus Cæsaris. Omnis enim qui se regem facit, contradicit Cæsari.\"},{\"verse\":13,\"text\":\"Pilatus autem cum audisset hos sermones, adduxit foras Jesum : et sedit pro tribunali, in loco qui dicitur Lithostrotos, hebraice autem Gabbatha.\"},{\"verse\":14,\"text\":\"Erat autem parasceve Paschæ, hora quasi sexta, et dicit Judæis : Ecce rex vester.\"},{\"verse\":15,\"text\":\"Illi autem clamabant : Tolle, tolle, crucifige eum. Dicit eis Pilatus : Regem vestrum crucifigam ? Responderunt pontifices : Non habemus regem, nisi Cæsarem.\"},{\"verse\":16,\"text\":\"Tunc ergo tradidit eis illum ut crucifigeretur. Susceperunt autem Jesum, et eduxerunt.\"},{\"verse\":17,\"text\":\"Et bajulans sibi crucem exivit in eum, qui dicitur Calvariæ locum, hebraice autem Golgotha :\"},{\"verse\":18,\"text\":\"ubi crucifixerunt eum, et cum eo alios duos hinc et hinc, medium autem Jesum.\"},{\"verse\":19,\"text\":\"Scripsit autem et titulum Pilatus, et posuit super crucem. Erat autem scriptum : Jesus Nazarenus, Rex Judæorum.\"},{\"verse\":20,\"text\":\"Hunc ergo titulum multi Judæorum legerunt : quia prope civitatem erat locus, ubi crucifixus est Jesus, et erat scriptum hebraice, græce, et latine.\"},{\"verse\":21,\"text\":\"Dicebant ergo Pilato pontifices Judæorum : Noli scribere : Rex Judæorum : sed quia ipse dixit : Rex sum Judæorum.\"},{\"verse\":22,\"text\":\"Respondit Pilatus : Quod scripsi, scripsi.\"},{\"verse\":23,\"text\":\"Milites ergo cum crucifixissent eum, acceperunt vestimenta ejus (et fecerunt quatuor partes, unicuique militi partem) et tunicam. Erat autem tunica inconsutilis, desuper contexta per totum.\"},{\"verse\":24,\"text\":\"Dixerunt ergo ad invicem : Non scindamus eam, sed sortiamur de illa cujus sit. Ut Scriptura impleretur, dicens : Partiti sunt vestimenta mea sibi : et in vestem meam miserunt sortem. Et milites quidem hæc fecerunt.\"},{\"verse\":25,\"text\":\"Stabant autem juxta crucem Jesu mater ejus, et soror matris ejus, Maria Cleophæ, et Maria Magdalene.\"},{\"verse\":26,\"text\":\"Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suæ : Mulier, ecce filius tuus.\"},{\"verse\":27,\"text\":\"Deinde dicit discipulo : Ecce mater tua. Et ex illa hora accepit eam discipulus in sua.\"},{\"verse\":28,\"text\":\"Postea sciens Jesus quia omnia consummata sunt, ut consummaretur Scriptura, dixit : Sitio.\"},{\"verse\":29,\"text\":\"Vas ergo erat positum aceto plenum. Illi autem spongiam plenam aceto, hyssopo circumponentes, obtulerunt ori ejus.\"},{\"verse\":30,\"text\":\"Cum ergo accepisset Jesus acetum, dixit : Consummatum est. Et inclinato capite tradidit spiritum.\"},{\"verse\":31,\"text\":\"Judæi ergo (quoniam parasceve erat) ut non remanerent in cruce corpora sabbato (erat enim magnus dies ille sabbati), rogaverunt Pilatum ut frangerentur eorum crura, et tollerentur.\"},{\"verse\":32,\"text\":\"Venerunt ergo milites : et primi quidem fregerunt crura, et alterius, qui crucifixus est cum eo.\"},{\"verse\":33,\"text\":\"Ad Jesum autem cum venissent, ut viderunt eum jam mortuum, non fregerunt ejus crura,\"},{\"verse\":34,\"text\":\"sed unus militum lancea latus ejus aperuit, et continuo exivit sanguis et aqua.\"},{\"verse\":35,\"text\":\"Et qui vidit, testimonium perhibuit : et verum est testimonium ejus. Et ille scit quia vera dicit : ut et vos credatis.\"},{\"verse\":36,\"text\":\"Facta sunt enim hæc ut Scriptura impleretur : Os non comminuetis ex eo.\"},{\"verse\":37,\"text\":\"Et iterum alia Scriptura dicit : Videbunt in quem transfixerunt.\"},{\"verse\":38,\"text\":\"Post hæc autem rogavit Pilatum Joseph ab Arimathæa (eo quod esset discipulus Jesu, occultus autem propter metum Judæorum), ut tolleret corpus Jesu. Et permisit Pilatus. Venit ergo, et tulit corpus Jesu.\"},{\"verse\":39,\"text\":\"Venit autem et Nicodemus, qui venerat ad Jesum nocte primum, ferens mixturam myrrhæ et aloës, quasi libras centum.\"},{\"verse\":40,\"text\":\"Acceperunt ergo corpus Jesu, et ligaverunt illud linteis cum aromatibus, sicut mos est Judæis sepelire.\"},{\"verse\":41,\"text\":\"Erat autem in loco, ubi crucifixus est, hortus : et in horto monumentum novum, in quo nondum quisquam positus erat.\"},{\"verse\":42,\"text\":\"Ibi ergo propter parasceven Judæorum, quia juxta erat monumentum, posuerunt Jesum.\"}],\"summary\":\"The continuation of the history of the Passion of Christ.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":18,\"label\":\"John 18\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":20,\"label\":\"John 20\"}}]]\n"])</script></body></html>
