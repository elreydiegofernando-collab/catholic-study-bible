lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">13</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ washes his disciples’ feet. The treason of Judas. The new commandment of love.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Before the festival day of the pasch, Jesus knowing that his hour was come, that he should pass out of this world to the Father: having loved his own who were in the world, he loved them unto the end.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when supper was done (the devil having now put into the heart of Judas Iscariot, the son of Simon, to betray him),</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Knowing that the Father had given him all things into his hands and that he came from God and goeth to God,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>He riseth from supper and layeth aside his garments and, having taken a towel, girded himself.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>After that, he putteth water into a basin and began to wash the feet of the disciples and to wipe them with the towel wherewith he was girded.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He cometh therefore to Simon Peter. And Peter saith to him: Lord, dost thou wash my feet?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Jesus answered and said to him: What I do, thou knowest not now; but thou shalt know hereafter.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Peter saith to him: Thou shalt never wash my feet, Jesus answered him: If I wash thee not, thou shalt have no part with me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Simon Peter saith to him: Lord, not only my feet, but also my hands and my head.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jesus saith to him: He that is washed needeth not but to wash his feet, but is clean wholly. And you are clean, but not all.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For he knew who he was that would betray him; therefore he said: You are not all clean.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Then after he had washed their feet and taken his garments, being set down again, he said to them: Know you what I have done to you?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>You call me Master and Lord. And you say well: for so I am.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If then I being your Lord and Master, have washed your feet; you also ought to wash one another’s feet.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For I have given you an example, that as I have done to you, so you do also.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Amen, amen, I say to you: The servant is not greater than his lord: neither is the apostle greater than he that sent him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If you know these things, you shall be blessed if you do them.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I speak not of you all: I know whom I have chosen. But that the scripture may be fulfilled: He that eateth bread with me shall lift up his heel against me,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>At present I tell you, before it come to pass: that when it shall come to pass, you may believe that I am he.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Amen, amen, I say to you, he that receiveth whomsoever I send receiveth me: and he that receiveth me receiveth him that sent me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>When Jesus had said these things, he was troubled in spirit; and he testified, and said: Amen, amen, I say to you, one of you shall betray me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The disciples therefore looked one upon another, doubting of whom he spoke.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Now there was leaning on Jesus’ bosom one of his disciples, whom Jesus loved.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Simon Peter therefore beckoned to him and said to him: Who is it of whom he speaketh?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He therefore, leaning on the breast of Jesus, saith to him: Lord, who is it?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Jesus answered: He it is to whom I shall reach bread dipped. And when he had dipped the bread, he gave it to Judas Iscariot, the son of Simon.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And after the morsel, Satan entered into him. And Jesus said to him: That which thou dost, do quickly.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Now no man at the table knew to what purpose he said this unto him.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For some thought, because Judas had the purse, that Jesus had said to him: Buy those things which we have need of for the festival day: or that he should give something to the poor.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>He therefore, having received the morsel, went out immediately. And it was night.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>When he therefore was gone out, Jesus said: Now is the Son of man glorified; and God is glorified in him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>If God be glorified in him, God also will glorify him in himself: and immediately will he glorify him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Little children, yet a little while I am with you. You shall seek me. And as I said to the Jews: Whither I go you cannot come; so I say to you now.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>A new commandment I give unto you: That you love one another, as I have loved you, that you also love one another.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>By this shall all men know that you are my disciples, if you have love one for another.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Simon Peter saith to him: Lord, whither goest thou? Jesus answered: Whither I go, thou canst not follow me now: but thou shalt follow hereafter.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Peter saith to him: Why cannot I follow thee now? I will lay down my life for thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Jesus answered him: Wilt thou lay down thy life for me? Amen, amen, I say to thee, the cock shall not crow, till thou deny me thrice.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ante diem festum Paschæ, sciens Jesus quia venit hora ejus ut transeat ex hoc mundo ad Patrem : cum dilexisset suos, qui erant in mundo, in finem dilexit eos.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et cœna facta, cum diabolus jam misisset in cor ut traderet eum Judas Simonis Iscariotæ :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>sciens quia omnia dedit ei Pater in manus, et quia a Deo exivit, et ad Deum vadit :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>surgit a cœna, et ponit vestimenta sua, et cum accepisset linteum, præcinxit se.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Deinde mittit aquam in pelvim, et cœpit lavare pedes discipulorum, et extergere linteo, quo erat præcinctus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Venit ergo ad Simonem Petrum. Et dicit ei Petrus : Domine, tu mihi lavas pedes ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Respondit Jesus, et dixit ei : Quod ego facio, tu nescis modo : scies autem postea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dicit ei Petrus : Non lavabis mihi pedes in æternum. Respondit ei Jesus : Si non lavero te, non habebis partem mecum.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dicit ei Simon Petrus : Domine, non tantum pedes meos, sed et manus, et caput.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dicit ei Jesus : Qui lotus est, non indiget nisi ut pedes lavet, sed est mundus totus. Et vos mundi estis, sed non omnes.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sciebat enim quisnam esset qui traderet eum ; propterea dixit : Non estis mundi omnes.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Postquam ergo lavit pedes eorum, et accepit vestimenta sua, cum recubuisset iterum, dixit eis : Scitis quid fecerim vobis ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Vos vocatis me Magister et Domine, et bene dicitis : sum etenim.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si ergo ego lavi pedes vestros, Dominus et Magister, et vos debetis alter alterius lavare pedes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Exemplum enim dedi vobis, ut quemadmodum ego feci vobis, ita et vos faciatis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Amen, amen dico vobis : non est servus major domino suo : neque apostolus major est eo qui misit illum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si hæc scitis, beati eritis si feceritis ea.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non de omnibus vobis dico : ego scio quos elegerim ; sed ut adimpleatur Scriptura : Qui manducat mecum panem, levabit contra me calcaneum suum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Amodo dico vobis, priusquam fiat : ut cum factum fuerit, credatis quia ego sum.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Amen, amen dico vobis : qui accipit si quem misero, me accipit ; qui autem me accipit, accipit eum qui me misit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Cum hæc dixisset Jesus, turbatus est spiritu : et protestatus est, et dixit : Amen, amen dico vobis, quia unus ex vobis tradet me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Aspiciebant ergo ad invicem discipuli, hæsitantes de quo diceret.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Erat ergo recumbens unus ex discipulis ejus in sinu Jesu, quem diligebat Jesus.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Innuit ergo huic Simon Petrus, et dixit ei : Quis est, de quo dicit ?</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Itaque cum recubuisset ille supra pectus Jesu, dicit ei : Domine, quis est ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Respondit Jesus : Ille est cui ego intinctum panem porrexero. Et cum intinxisset panem, dedit Judæ Simonis Iscariotæ.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et post buccellam, introivit in eum Satanas. Et dixit ei Jesus : Quod facis, fac citius.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Hoc autem nemo scivit discumbentium ad quid dixerit ei.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Quidam enim putabant, quia loculos habebat Judas, quod dixisset ei Jesus : Eme ea quæ opus sunt nobis ad diem festum : aut egenis ut aliquid daret.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Cum ergo accepisset ille buccellam, exivit continuo. Erat autem nox.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Cum ergo exisset, dixit Jesus : Nunc clarificatus est Filius hominis, et Deus clarificatus est in eo.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Si Deus clarificatus est in eo, et Deus clarificabit eum in semetipso : et continuo clarificabit eum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Filioli, adhuc modicum vobiscum sum. Quæretis me ; et sicut dixi Judæis, quo ego vado, vos non potestis venire : et vobis dico modo.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Mandatum novum do vobis : ut diligatis invicem : sicut dilexi vos, ut et vos diligatis invicem.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>In hoc cognoscent omnes quia discipuli mei estis, si dilectionem habueritis ad invicem.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Dicit ei Simon Petrus : Domine, quo vadis ? Respondit Jesus : Quo ego vado non potes me modo sequi : sequeris autem postea.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Dicit ei Petrus : Quare non possum te sequi modo ? animam meam pro te ponam.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Respondit ei Jesus : Animam tuam pro me pones ? amen, amen dico tibi : non cantabit gallus, donec ter me neges.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/12/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 12</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/14/"><span class="min-w-0"><span class="block },{\"verse\":5,\"text\":\"After that, he putteth water into a basin and began to wash the feet of the disciples and to wipe them with the towel wherewith he was girded.\"},{\"verse\":6,\"text\":\"He cometh therefore to Simon Peter. And Peter saith to him: Lord, dost thou wash my feet?\"},{\"verse\":7,\"text\":\"Jesus answered and said to him: What I do, thou knowest not now; but thou shalt know hereafter.\"},{\"verse\":8,\"text\":\"Peter saith to him: Thou shalt never wash my feet, Jesus answered him: If I wash thee not, thou shalt have no part with me.\"},{\"verse\":9,\"text\":\"Simon Peter saith to him: Lord, not only my feet, but also my hands and my head.\"},{\"verse\":10,\"text\":\"Jesus saith to him: He that is washed needeth not but to wash his feet, but is clean wholly. And you are clean, but not all.\"},{\"verse\":11,\"text\":\"For he knew who he was that would betray him; therefore he said: You are not all clean.\"},{\"verse\":12,\"text\":\"Then after he had washed their feet and taken his garments, being set down again, he said to them: Know you what I have done to you?\"},{\"verse\":13,\"text\":\"You call me Master and Lord. And you say well: for so I am.\"},{\"verse\":14,\"text\":\"If then I being your Lord and Master, have washed your feet; you also ought to wash one another’s feet.\"},{\"verse\":15,\"text\":\"For I have given you an example, that as I have done to you, so you do also.\"},{\"verse\":16,\"text\":\"Amen, amen, I say to you: The servant is not greater than his lord: neither is the apostle greater than he that sent him.\"},{\"verse\":17,\"text\":\"If you know these things, you shall be blessed if you do them.\"},{\"verse\":18,\"text\":\"I speak not of you all: I know whom I have chosen. But that the scripture may be fulfilled: He that eateth bread with me shall lift up his heel against me,\"},{\"verse\":19,\"text\":\"At present I tell you, before it come to pass: that when it shall come to pass, you may believe that I am he.\"},{\"verse\":20,\"text\":\"Amen, amen, I say to you, he that receiveth whomsoever I send receiveth me: and he that receiveth me receiveth him that sent me.\"},{\"verse\":21,\"text\":\"When Jesus had said these things, he was troubled in spirit; and he testified, and said: Amen, amen, I say to you, one of you shall betray me.\"},{\"verse\":22,\"text\":\"The disciples therefore looked one upon another, doubting of whom he spoke.\"},{\"verse\":23,\"text\":\"Now there was leaning on Jesus’ bosom one of his disciples, whom Jesus loved.\"},{\"verse\":24,\"text\":\"Simon Peter therefore beckoned to him and said to him: Who is it of whom he speaketh?\"},{\"verse\":25,\"text\":\"He therefore, leaning on the breast of Jesus, saith to him: Lord, who is it?\"},{\"verse\":26,\"text\":\"Jesus answered: He it is to whom I shall reach bread dipped. And when he had dipped the bread, he gave it to Judas Iscariot, the son of Simon.\"},{\"verse\":27,\"text\":\"And after the morsel, Satan entered into him. And Jesus said to him: That which thou dost, do quickly.\"},{\"verse\":28,\"text\":\"Now no man at the table knew to what purpose he said this unto him.\"},{\"verse\":29,\"text\":\"For some thought, because Judas had the purse, that Jesus had said to him: Buy those things which we have need of for the festival day: or that he should give something to the poor.\"},{\"verse\":30,\"text\":\"He therefore, having received the morsel, went out immediately. And it was night.\"},{\"verse\":31,\"text\":\"When he therefore was gone out, Jesus said: Now is the Son of man glorified; and God is glorified in him.\"},{\"verse\":32,\"text\":\"If God be glorified in him, God also will glorify him in himself: and immediately will he glorify him.\"},{\"verse\":33,\"text\":\"Little children, yet a little while I am with you. You shall seek me. And as I said to the Jews: Whither I go you cannot come; so I say to you now.\"},{\"verse\":34,\"text\":\"A new commandment I give unto you: That you love one another, as I have loved you, that you also love one another.\"},{\"verse\":35,\"text\":\"By this shall all men know that you are my disciples, if you have love one for another.\"},{\"verse\":36,\"text\":\"Simon Peter saith to him: Lord, whither goest thou? Jesus answered: Whither I go, thou canst not follow me now: but thou shalt follow hereafter.\"},{\"verse\":37,\"text\":\"Peter saith to him: Why cannot I follow thee now? I will lay down my life for thee.\"},{\"verse\":38,\"text\":\"Jesus answered him: Wilt thou lay down thy life for me? Amen, amen, I say to thee, the cock shall not crow, till thou deny me thrice.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ante diem festum Paschæ, sciens Jesus quia venit hora ejus ut transeat ex hoc mundo ad Patrem : cum dilexisset suos, qui erant in mundo, in finem dilexit eos.\"},{\"verse\":2,\"text\":\"Et cœna facta, cum diabolus jam misisset in cor ut traderet eum Judas Simonis Iscariotæ :\"},{\"verse\":3,\"text\":\"sciens quia omnia dedit ei Pater in manus, et quia a Deo exivit, et ad Deum vadit :\"},{\"verse\":4,\"text\":\"surgit a cœna, et ponit vestimenta sua, et cum accepisset linteum, præcinxit se.\"},{\"verse\":5,\"text\":\"Deinde mittit aquam in pelvim, et cœpit lavare pedes discipulorum, et extergere linteo, quo erat præcinctus.\"},{\"verse\":6,\"text\":\"Venit ergo ad Simonem Petrum. Et dicit ei Petrus : Domine, tu mihi lavas pedes ?\"},{\"verse\":7,\"text\":\"Respondit Jesus, et dixit ei : Quod ego facio, tu nescis modo : scies autem postea.\"},{\"verse\":8,\"text\":\"Dicit ei Petrus : Non lavabis mihi pedes in æternum. Respondit ei Jesus : Si non lavero te, non habebis partem mecum.\"},{\"verse\":9,\"text\":\"Dicit ei Simon Petrus : Domine, non tantum pedes meos, sed et manus, et caput.\"},{\"verse\":10,\"text\":\"Dicit ei Jesus : Qui lotus est, non indiget nisi ut pedes lavet, sed est mundus totus. Et vos mundi estis, sed non omnes.\"},{\"verse\":11,\"text\":\"Sciebat enim quisnam esset qui traderet eum ; propterea dixit : Non estis mundi omnes.\"},{\"verse\":12,\"text\":\"Postquam ergo lavit pedes eorum, et accepit vestimenta sua, cum recubuisset iterum, dixit eis : Scitis quid fecerim vobis ?\"},{\"verse\":13,\"text\":\"Vos vocatis me Magister et Domine, et bene dicitis : sum etenim.\"},{\"verse\":14,\"text\":\"Si ergo ego lavi pedes vestros, Dominus et Magister, et vos debetis alter alterius lavare pedes.\"},{\"verse\":15,\"text\":\"Exemplum enim dedi vobis, ut quemadmodum ego feci vobis, ita et vos faciatis.\"},{\"verse\":16,\"text\":\"Amen, amen dico vobis : non est servus major domino suo : neque apostolus major est eo qui misit illum.\"},{\"verse\":17,\"text\":\"Si hæc scitis, beati eritis si feceritis ea.\"},{\"verse\":18,\"text\":\"Non de omnibus vobis dico : ego scio quos elegerim ; sed ut adimpleatur Scriptura : Qui manducat mecum panem, levabit contra me calcaneum suum.\"},{\"verse\":19,\"text\":\"Amodo dico vobis, priusquam fiat : ut cum factum fuerit, credatis quia ego sum.\"},{\"verse\":20,\"text\":\"Amen, amen dico vobis : qui accipit si quem misero, me accipit ; qui autem me accipit, accipit eum qui me misit.\"},{\"verse\":21,\"text\":\"Cum hæc dixisset Jesus, turbatus est spiritu : et protestatus est, et dixit : Amen, amen dico vobis, quia unus ex vobis tradet me.\"},{\"verse\":22,\"text\":\"Aspiciebant ergo ad invicem discipuli, hæsitantes de quo diceret.\"},{\"verse\":23,\"text\":\"Erat ergo recumbens unus ex discipulis ejus in sinu Jesu, quem diligebat Jesus.\"},{\"verse\":24,\"text\":\"Innuit ergo huic Simon Petrus, et dixit ei : Quis est, de quo dicit ?\"},{\"verse\":25,\"text\":\"Itaque cum recubuisset ille supra pectus Jesu, dicit ei : Domine, quis est ?\"},{\"verse\":26,\"text\":\"Respondit Jesus : Ille est cui ego intinctum panem porrexero. Et cum intinxisset panem, dedit Judæ Simonis Iscariotæ.\"},{\"verse\":27,\"text\":\"Et post buccellam, introivit in eum Satanas. Et dixit ei Jesus : Quod facis, fac citius.\"},{\"verse\":28,\"text\":\"Hoc autem nemo scivit discumbentium ad quid dixerit ei.\"},{\"verse\":29,\"text\":\"Quidam enim putabant, quia loculos habebat Judas, quod dixisset ei Jesus : Eme ea quæ opus sunt nobis ad diem festum : aut egenis ut aliquid daret.\"},{\"verse\":30,\"text\":\"Cum ergo accepisset ille buccellam, exivit continuo. Erat autem nox.\"},{\"verse\":31,\"text\":\"Cum ergo exisset, dixit Jesus : Nunc clarificatus est Filius hominis, et Deus clarificatus est in eo.\"},{\"verse\":32,\"text\":\"Si Deus clarificatus est in eo, et Deus clarificabit eum in semetipso : et continuo clarificabit eum.\"},{\"verse\":33,\"text\":\"Filioli, adhuc modicum vobiscum sum. Quæretis me ; et sicut dixi Judæis, quo ego vado, vos non potestis venire : et vobis dico modo.\"},{\"verse\":34,\"text\":\"Mandatum novum do vobis : ut diligatis invicem : sicut dilexi vos, ut et vos diligatis invicem.\"},{\"verse\":35,\"text\":\"In hoc cognoscent omnes quia discipuli mei estis, si dilectionem habueritis ad invicem.\"},{\"verse\":36,\"text\":\"Dicit ei Simon Petrus : Domine, quo vadis ? Respondit Jesus : Quo ego vado non potes me modo sequi : sequeris autem postea.\"},{\"verse\":37,\"text\":\"Dicit ei Petrus : Quare non possum te sequi modo ? animam meam pro te ponam.\"},{\"verse\":38,\"text\":\"Respondit ei Jesus : Animam tuam pro me pones ? amen, amen dico tibi : non cantabit gallus, donec ter me neges.\"}],\"summary\":\"Christ washes his disciples’ feet. The treason of Judas. The new commandment of love.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":12,\"label\":\"John 12\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":14,\"label\":\"John 14\"}}]]\n"])</script></body></html>
