.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">14</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s discourse after his last supper.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Let not your heart be troubled. You believe in God: believe also in me.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In my Father’s house there are many mansions. If not, I would have told you: because I go to prepare a place for you.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And if I shall go and prepare a place for you, I will come again and will take you to myself: that where I am, you also may be.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And whither I go you know: and the way you know.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Thomas saith to him: Lord, we know not whither thou goest. And how can we know the way?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Jesus saith to him: I am the way, and the truth, and the life. No man cometh to the Father, but by me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>If you had known me, you would without doubt have known my Father also: and from henceforth you shall know him. And you have seen him.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Philip saith to him: Lord, shew us the Father; and it is enough for us.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Jesus saith to him: Have I been so long a time with you and have you not known me? Philip, he that seeth me seeth the Father also. How sayest thou: Shew us the Father?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Do you not believe that I am in the Father and the Father in me? The words that I speak to you, I speak not of myself. But the Father who abideth in me, he doth the works.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Believe you not that I am in the Father and the Father in me?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Otherwise believe for the very works’ sake. Amen, amen, I say to you, he that believeth in me, the works that I do, he also shall do: and greater than these shall he do.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Because I go to the Father: and whatsoever you shall ask the Father in my name, that will I do: that the Father may be glorified in the Son.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>If you shall ask me any thing in my name, that I will do.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>If you love me, keep my commandments.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And I will ask the Father: and he shall give you another Paraclete, that he may abide with you for ever:</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The spirit of truth, whom the world cannot receive, because it seeth him not, nor knoweth him. But you shall know him; because he shall abide with you and shall be in you.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>I will not leave you orphans: I will come to you.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Yet a little while and the world seeth me no more. But you see me: because I live, and you shall live.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In that day you shall know that I am in my Father: and you in me, and I in you.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He that hath my commandments and keepeth them; he it is that loveth me. And he that loveth me shall be loved of my Father: and I will love him and will manifest myself to him.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Judas saith to him, not the Iscariot: Lord, how is it that thou wilt manifest thyself to us, and not to the world?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jesus answered and said to him: If any one love me, he will keep my word. And my Father will love him and we will come to him and will make our abode with him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>He that loveth me not keepeth not my words. And the word which you have heard is not mine; but the Father’s who sent me.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>These things have I spoken to you, abiding with you.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But the Paraclete, the Holy Ghost, whom the Father will send in my name, he will teach you all things and bring all things to your mind, whatsoever I shall have said to you.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Peace I leave with you: my peace I give unto you: not as the world giveth, do I give unto you. Let not your heart be troubled: nor let it be afraid.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>You have heard that I said to you: I go away, and I come unto you. If you loved me you would indeed be glad, because I go to the Father: for the Father is greater than I.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And now I have told you before it come to pass: that when it shall come to pass, you may believe.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I will not now speak many things with you. For the prince of this world: cometh: and in me he hath not any thing.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But that the world may know that I love the Father: and as the Father hath given me commandment, so do I. Arise, let us go hence.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Non turbetur cor vestrum. Creditis in Deum, et in me credite.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>In domo Patris mei mansiones multæ sunt ; si quominus dixissem vobis : quia vado parare vobis locum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et si abiero, et præparavero vobis locum, iterum venio, et accipiam vos ad meipsum : ut ubi sum ego, et vos sitis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et quo ego vado scitis, et viam scitis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dicit ei Thomas : Domine, nescimus quo vadis : et quomodo possumus viam scire ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dicit ei Jesus : Ego sum via, et veritas, et vita. Nemo venit ad Patrem, nisi per me.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Si cognovissetis me, et Patrem meum utique cognovissetis : et amodo cognoscetis eum, et vidistis eum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dicit ei Philippus : Domine, ostende nobis Patrem, et sufficit nobis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dicit ei Jesus : Tanto tempore vobiscum sum, et non cognovistis me ? Philippe, qui videt me, videt et Patrem. Quomodo tu dicis : Ostende nobis Patrem ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Non creditis quia ego in Patre, et Pater in me est ? Verba quæ ego loquor vobis, a meipso non loquor. Pater autem in me manens, ipse fecit opera.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Non creditis quia ego in Patre, et Pater in me est ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>alioquin propter opera ipsa credite. Amen, amen dico vobis, qui credit in me, opera quæ ego facio, et ipse faciet, et majora horum faciet : quia ego ad Patrem vado.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et quodcumque petieritis Patrem in nomine meo, hoc faciam : ut glorificetur Pater in Filio.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Si quid petieritis me in nomine meo, hoc faciam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Si diligitis me, mandata mea servate :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et ego rogabo Patrem, et alium Paraclitum dabit vobis, ut maneat vobiscum in æternum,</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Spiritum veritatis, quem mundus non potest accipere, quia non videt eum, nec scit eum : vos autem cognoscetis eum, quia apud vos manebit, et in vobis erit.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non relinquam vos orphanos : veniam ad vos.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Adhuc modicum, et mundus me jam non videt. Vos autem videtis me : quia ego vivo, et vos vivetis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>In illo die vos cognoscetis quia ego sum in Patre meo, et vos in me, et ego in vobis.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Qui habet mandata mea, et servat ea : ille est qui diligit me. Qui autem diligit me, diligetur a Patre meo : et ego diligam eum, et manifestabo ei meipsum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dicit ei Judas, non ille Iscariotes : Domine, quid factum est, quia manifestaturus es nobis teipsum, et non mundo ?</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Respondit Jesus, et dixit ei : Si quis diligit me, sermonem meum servabit, et Pater meus diliget eum, et ad eum veniemus, et mansionem apud eum faciemus ;</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>qui non diligit me, sermones meos non servat. Et sermonem, quem audistis, non est meus : sed ejus qui misit me, Patris.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hæc locutus sum vobis apud vos manens.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Paraclitus autem Spiritus Sanctus, quem mittet Pater in nomine meo, ille vos docebit omnia, et suggeret vobis omnia quæcumque dixero vobis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Pacem relinquo vobis, pacem meam do vobis : non quomodo mundus dat, ego do vobis. Non turbetur cor vestrum, neque formidet.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Audistis quia ego dixi vobis : Vado, et venio ad vos. Si diligeretis me, gauderetis utique, quia vado ad Patrem : quia Pater major me est.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et nunc dixi vobis priusquam fiat : ut cum factum fuerit, credatis.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Jam non multa loquar vobiscum : venit enim princeps mundi hujus, et in me non habet quidquam.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sed ut cognoscat mundus quia diligo Patrem, et sicut mandatum dedit mihi Pater, sic facio. Surgite, eamus hinc.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/13/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 13</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/15/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 15</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->14<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-p ink\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.14\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":14,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"Let not your heart be troubled. You believe in God: believe also in me.\"},{\"verse\":2,\"text\":\"In my Father’s house there are many mansions. If not, I would have told you: because I go to prepare a place for you.\"},{\"verse\":3,\"text\":\"And if I shall go and prepare a place for you, I will come again and will take you to myself: that where I am, you also may be.\"},{\"verse\":4,\"text\":\"And whither I go you know: and the way you know.\"},{\"verse\":5,\"text\":\"Thomas saith to him: Lord, we know not whither thou goest. And how can we know the way?\"},{\"verse\":6,\"text\":\"Jesus saith to him: I am the way, and the truth, and the life. No man cometh to the Father, but by me.\"},{\"verse\":7,\"text\":\"If you had known me, you would without doubt have known my Father also: and from henceforth you shall know him. And you have seen him.\"},{\"verse\":8,\"text\":\"Philip saith to him: Lord, shew us the Father; and it is enough for us.\"},{\"verse\":9,\"text\":\"Jesus saith to him: Have I been so long a time with you and have you not known me? Philip, he that seeth me seeth the Father also. How sayest thou: Shew us the Father?\"},{\"verse\":10,\"text\":\"Do you not believe that I am in the Father and the Father in me? The words that I speak to you, I speak not of myself. But the Father who abideth in me, he doth the works.\"},{\"verse\":11,\"text\":\"Believe you not that I am in the Father and the Father in me?\"},{\"verse\":12,\"text\":\"Otherwise believe for the very works’ sake. Amen, amen, I say to you, he that believeth in me, the works that I do, he also shall do: and greater than these shall he do.\"},{\"verse\":13,\"text\":\"Because I go to the Father: and whatsoever you shall ask the Father in my name, that will I do: that the Father may be glorified in the Son.\"},{\"verse\":14,\"text\":\"If you shall ask me any thing in my name, that I will do.\"},{\"verse\":15,\"text\":\"If you love me, keep my commandments.\"},{\"verse\":16,\"text\":\"And I will ask the Father: and he shall give you another Paraclete, that he may abide with you for ever:\"},{\"verse\":17,\"text\":\"The spirit of truth, whom the world cannot receive, because it seeth him not, nor knoweth him. But you shall know him; because he shall abide with you and shall be in you.\"},{\"verse\":18,\"text\":\"I will not leave you orphans: I will come to you.\"},{\"verse\":19,\"text\":\"Yet a little while and the world seeth me no more. But you see me: because I live, and you shall live.\"},{\"verse\":20,\"text\":\"In that day you shall know that I am in my Father: and you in me, and I in you.\"},{\"verse\":21,\"text\":\"He that hath my commandments and keepeth them; he it is that loveth me. And he that loveth me shall be loved of my Father: and I will love him and will manifest myself to him.\"},{\"verse\":22,\"text\":\"Judas saith to him, not the Iscariot: Lord, how is it that thou wilt manifest thyself to us, and not to the world?\"},{\"verse\":23,\"text\":\"Jesus answered and said to him: If any one love me, he will keep my word. And my Father will love him and we will come to him and will make our abode with him.\"},{\"verse\":24,\"text\":\"He that loveth me not keepeth not my words. And the word which you have heard is not mine; but the Father’s who sent me.\"},{\"verse\":25,\"text\":\"These things have I spoken to you, abiding with you.\"},{\"verse\":26,\"text\":\"But the Paraclete, the Holy Ghost, whom the Father will send in my name, he will teach you all things and bring all things to your mind, whatsoever I shall have said to you.\"},{\"verse\":27,\"text\":\"Peace I leave with you: my peace I give unto you: not as the world giveth, do I give unto you. Let not your heart be troubled: nor let it be afraid.\"},{\"verse\":28,\"text\":\"You have heard that I said to you: I go away, and I come unto you. If you loved me you would indeed be glad, because I go to the Father: for the Father is greater than I.\"},{\"verse\":29,\"text\":\"And now I have told you before it come to pass: that when it shall come to pass, you may believe.\"},{\"verse\":30,\"text\":\"I will not now speak many things with you. For the prince of this world: cometh: and in me he hath not any thing.\"},{\"verse\":31,\"text\":\"But that the world may know that I love the Father: and as the Father hath given me commandment, so do I. Arise, let us go hence.\"}],\"vul\":[{\"verse\":1,\"text\":\"Non turbetur cor vestrum. Creditis in Deum, et in me credite.\"},{\"verse\":2,\"text\":\"In domo Patris mei mansiones multæ sunt ; si quominus dixissem vobis : quia vado parare vobis locum.\"},{\"verse\":3,\"text\":\"Et si abiero, et præparavero vobis locum, iterum venio, et accipiam vos ad meipsum : ut ubi sum ego, et vos sitis.\"},{\"verse\":4,\"text\":\"Et quo ego vado scitis, et viam scitis.\"},{\"verse\":5,\"text\":\"Dicit ei Thomas : Domine, nescimus quo vadis : et quomodo possumus viam scire ?\"},{\"verse\":6,\"text\":\"Dicit ei Jesus : Ego sum via, et veritas, et vita. Nemo venit ad Patrem, nisi per me.\"},{\"verse\":7,\"text\":\"Si cognovissetis me, et Patrem meum utique cognovissetis : et amodo cognoscetis eum, et vidistis eum.\"},{\"verse\":8,\"text\":\"Dicit ei Philippus : Domine, ostende nobis Patrem, et sufficit nobis.\"},{\"verse\":9,\"text\":\"Dicit ei Jesus : Tanto tempore vobiscum sum, et non cognovistis me ? Philippe, qui videt me, videt et Patrem. Quomodo tu dicis : Ostende nobis Patrem ?\"},{\"verse\":10,\"text\":\"Non creditis quia ego in Patre, et Pater in me est ? Verba quæ ego loquor vobis, a meipso non loquor. Pater autem in me manens, ipse fecit opera.\"},{\"verse\":11,\"text\":\"Non creditis quia ego in Patre, et Pater in me est ?\"},{\"verse\":12,\"text\":\"alioquin propter opera ipsa credite. Amen, amen dico vobis, qui credit in me, opera quæ ego facio, et ipse faciet, et majora horum faciet : quia ego ad Patrem vado.\"},{\"verse\":13,\"text\":\"Et quodcumque petieritis Patrem in nomine meo, hoc faciam : ut glorificetur Pater in Filio.\"},{\"verse\":14,\"text\":\"Si quid petieritis me in nomine meo, hoc faciam.\"},{\"verse\":15,\"text\":\"Si diligitis me, mandata mea servate :\"},{\"verse\":16,\"text\":\"et ego rogabo Patrem, et alium Paraclitum dabit vobis, ut maneat vobiscum in æternum,\"},{\"verse\":17,\"text\":\"Spiritum veritatis, quem mundus non potest accipere, quia non videt eum, nec scit eum : vos autem cognoscetis eum, quia apud vos manebit, et in vobis erit.\"},{\"verse\":18,\"text\":\"Non relinquam vos orphanos : veniam ad vos.\"},{\"verse\":19,\"text\":\"Adhuc modicum, et mundus me jam non videt. Vos autem videtis me : quia ego vivo, et vos vivetis.\"},{\"verse\":20,\"text\":\"In illo die vos cognoscetis quia ego sum in Patre meo, et vos in me, et ego in vobis.\"},{\"verse\":21,\"text\":\"Qui habet mandata mea, et servat ea : ille est qui diligit me. Qui autem diligit me, diligetur a Patre meo : et ego diligam eum, et manifestabo ei meipsum.\"},{\"verse\":22,\"text\":\"Dicit ei Judas, non ille Iscariotes : Domine, quid factum est, quia manifestaturus es nobis teipsum, et non mundo ?\"},{\"verse\":23,\"text\":\"Respondit Jesus, et dixit ei : Si quis diligit me, sermonem meum servabit, et Pater meus diliget eum, et ad eum veniemus, et mansionem apud eum faciemus ;\"},{\"verse\":24,\"text\":\"qui non diligit me, sermones meos non servat. Et sermonem, quem audistis, non est meus : sed ejus qui misit me, Patris.\"},{\"verse\":25,\"text\":\"Hæc locutus sum vobis apud vos manens.\"},{\"verse\":26,\"text\":\"Paraclitus autem Spiritus Sanctus, quem mittet Pater in nomine meo, ille vos docebit omnia, et suggeret vobis omnia quæcumque dixero vobis.\"},{\"verse\":27,\"text\":\"Pacem relinquo vobis, pacem meam do vobis : non quomodo mundus dat, ego do vobis. Non turbetur cor vestrum, neque formidet.\"},{\"verse\":28,\"text\":\"Audistis quia ego dixi vobis : Vado, et venio ad vos. Si diligeretis me, gauderetis utique, quia vado ad Patrem : quia Pater major me est.\"},{\"verse\":29,\"text\":\"Et nunc dixi vobis priusquam fiat : ut cum factum fuerit, credatis.\"},{\"verse\":30,\"text\":\"Jam non multa loquar vobiscum : venit enim princeps mundi hujus, et in me non habet quidquam.\"},{\"verse\":31,\"text\":\"Sed ut cognoscat mundus quia diligo Patrem, et sicut mandatum dedit mihi Pater, sic facio. Surgite, eamus hinc.\"}],\"summary\":\"Christ’s discourse after his last supper.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":13,\"label\":\"John 13\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":15,\"label\":\"John 15\"}}]]\n"])</script></body></html>
