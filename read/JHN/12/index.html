lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">12</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The anointing of Christ’s feet. His riding into Jerusalem upon an ass. A voice from heaven.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Jesus therefore, six days before the pasch, came to Bethania, where Lazarus had been dead, whom Jesus raised to life.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they made him a supper there: and Martha served. But Lazarus was one of them that were at table with him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Mary therefore took a pound of ointment of right spikenard, of great price, and anointed the feet of Jesus and wiped his feet with her hair. And the house was filled with the odour of the ointment.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then one of his disciples, Judas Iscariot, he that was about to betray him, said:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Why was not this ointment sold for three hundred pence and given to the poor?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now he said this not because he cared for the poor; but because he was a thief and, having the purse, carried the things that were put therein.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Jesus therefore said: Let her alone, that she may keep it against the day of my burial.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For the poor you have always with you: but me you have not always.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>A great multitude therefore of the Jews knew that he was there; and they came, not for Jesus’ sake only, but that they might see Lazarus, whom he had raised from the dead.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But the chief priests thought to kill Lazarus also:</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Because many of the Jews, by reason of him, went away and believed in Jesus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And on the next day, a great multitude that was come to the festival day, when they had heard that Jesus was coming to Jerusalem,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Took branches of palm trees and went forth to meet him and cried Hosanna. Blessed is he that cometh in the name of the Lord, the king of Israel.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Jesus found a young ass and sat upon it, as it is written:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Fear not, daughter of Sion: behold thy king cometh, sitting on an ass’s colt.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>These things his disciples did not know at the first: but when Jesus was glorified, then they remembered that these things were written of him and that they had done these things to him.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The multitude therefore gave testimony, which was with him, when he called Lazarus out of the grave and raised him from the dead.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For which reason also the people came to meet him, because they heard that he had done this miracle.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Pharisees therefore said among themselves: Do you see that we prevail nothing? Behold, the whole world is gone after him.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Now there were certain Gentiles among them, who came up to adore on the festival day.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>These therefore came to Philip, who was of Bethsaida of Galilee, and desired him, saying: Sir, we would see Jesus.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Philip cometh and telleth Andrew. Again Andrew and Philip told Jesus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But Jesus answered them, saying: The hour is come that the Son of man should be glorified.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Amen, amen, I say to you, unless the grain of wheat falling into the ground die,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Itself remaineth alone. But if it die it bringeth forth much fruit. He that loveth his life shall lose it and he that hateth his life in this world keepeth it unto life eternal.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>If any man minister to me, let him follow me: and where I am, there also shall my minister be. If any man minister to me, him will my Father honour.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Now is my soul troubled. And what shall I say? Father, save me from this hour. But for this cause I came unto this hour.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Father, glorify thy name. A voice therefore came from heaven: I have both glorified it and will glorify it again.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The multitude therefore that stood and heard said that it thundered. Others said: An angel spoke to him.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Jesus answered and said: This voice came not because of me, but for your sakes.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Now is the judgment of the world: now shall the prince of this world be cast out.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And I, if I be lifted up from the earth, will draw all things to myself.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>(Now this he said, signifying what death he should die.)</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The multitude answered him: We have heard out of the law that Christ abideth for ever. And how sayest thou: The Son of man must be lifted up? Who is this Son of man?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Jesus therefore said to them: Yet a little while, the light is among you. Walk whilst you have the light, that the darkness overtake you not. And he that walketh in darkness knoweth not whither he goeth.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Whilst you have the light, believe in the light, that you may be the children of light. These things Jesus spoke: and he went away and hid himself from them.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And whereas he had done so many miracles before them, they believed not in him:</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>That the saying of Isaias the prophet might be fulfilled, which he said: Lord, who hath believed our hearing? And to whom hath the arm of the Lord been revealed?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Therefore they could not believe, because Isaias said again:</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>He hath blinded their eyes and hardened their heart, that they should not see with their eyes, nor understand with their heart and be converted: and I should heal them.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>These things said Isaias, when he saw his glory, and spoke of him.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>However, many of the chief men also believed in him: but because of the Pharisees they did not confess him, that they might not be cast out of the synagogue.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>For they loved the glory of men more than the glory of God.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>But Jesus cried and said: He that believeth in me doth not believe in me, but in him that sent me.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And he that seeth me, seeth him that sent me.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>I am come, a light into the world, that whosoever believeth in me may not remain in darkness.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>And if any man hear my words and keep them not, I do not judge him for I came not to judge the world, but to save the world.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>He that despiseth me and receiveth not my words hath one that judgeth him. The word that I have spoken, the same shall judge him in the last day.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>For I have not spoken of myself: but the Father who sent me, he gave me commandment what I should say and what I should speak.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>And I know that his commandment is life everlasting. The things therefore that I speak, even as the Father said unto me, so do I speak.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Jesus ergo ante sex dies Paschæ venit Bethaniam, ubi Lazarus fuerat mortuus, quem suscitavit Jesus.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Fecerunt autem ei cœnam ibi, et Martha ministrabat, Lazarus vero unus erat ex discumbentibus cum eo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Maria ergo accepit libram unguenti nardi pistici pretiosi, et unxit pedes Jesu, et extersit pedes ejus capillis suis : et domus impleta est ex odore unguenti.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Dixit ergo unus ex discipulis ejus, Judas Iscariotes, qui erat eum traditurus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Quare hoc unguentum non veniit trecentis denariis, et datum est egenis ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dixit autem hoc, non quia de egenis pertinebat ad eum, sed quia fur erat, et loculos habens, ea quæ mittebantur, portabat.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixit ergo Jesus : Sinite illam ut in diem sepulturæ meæ servet illud.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Pauperes enim semper habetis vobiscum : me autem non semper habetis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Cognovit ergo turba multa ex Judæis quia illic est, et venerunt, non propter Jesum tantum, sed ut Lazarum viderent, quem suscitavit a mortuis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Cogitaverunt autem principes sacerdotum ut et Lazarum interficerent :</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>quia multi propter illum abibant ex Judæis, et credebant in Jesum.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In crastinum autem, turba multa quæ venerat ad diem festum, cum audissent quia venit Jesus Jerosolymam,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>acceperunt ramos palmarum, et processerunt obviam ei, et clamabant : Hosanna, benedictus qui venit in nomine Domini, rex Israël.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et invenit Jesus asellum, et sedit super eum, sicut scriptum est :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Noli timere, filia Sion : ecce rex tuus venit sedens super pullum asinæ.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Hæc non cognoverunt discipuli ejus primum : sed quando glorificatus est Jesus, tunc recordati sunt quia hæc erant scripta de eo, et hæc fecerunt ei.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Testimonium ergo perhibebat turba, quæ erat cum eo quando Lazarum vocavit de monumento, et suscitavit eum a mortuis.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Propterea et obviam venit ei turba : quia audierunt fecisse hoc signum.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Pharisæi ergo dixerunt ad semetipsos : Videtis quia nihil proficimus ? ecce mundus totus post eum abiit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Erant autem quidam gentiles, ex his qui ascenderant ut adorarent in die festo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hi ergo accesserunt ad Philippum, qui erat a Bethsaida Galilææ, et rogabant eum, dicentes : Domine, volumus Jesum videre.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Venit Philippus, et dicit Andreæ ; Andreas rursum et Philippus dixerunt Jesu.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Jesus autem respondit eis, dicens : Venit hora, ut clarificetur Filius hominis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Amen, amen dico vobis, nisi granum frumenti cadens in terram, mortuum fuerit,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>ipsum solum manet : si autem mortuum fuerit, multum fructum affert. Qui amat animam suam, perdet eam ; et qui odit animam suam in hoc mundo, in vitam æternam custodit eam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Si quis mihi ministrat, me sequatur, et ubi sum ego, illic et minister meus erit. Si quis mihi ministraverit, honorificabit eum Pater meus.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nunc anima mea turbata est. Et quid dicam ? Pater, salvifica me ex hac hora. Sed propterea veni in horam hanc :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Pater, clarifica nomen tuum. Venit ergo vox de cælo : Et clarificavi, et iterum clarificabo.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Turba ergo, quæ stabat, et audierat, dicebat tonitruum esse factum. Alii dicebant : Angelus ei locutus est.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Respondit Jesus, et dixit : Non propter me hæc vox venit, sed propter vos.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Nunc judicium est mundi : nunc princeps hujus mundi ejicietur foras.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Et ego, si exaltatus fuero a terra, omnia traham ad meipsum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>(Hoc autem dicebat, significans qua morte esset moriturus.)</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Respondit ei turba : Nos audivimus ex lege, quia Christus manet in æternum : et quomodo tu dicis : Oportet exaltari Filium hominis ? quis est iste Filius hominis ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Dixit ergo eis Jesus : Adhuc modicum, lumen in vobis est. Ambulate dum lucem habetis, ut non vos tenebræ comprehendant ; et qui ambulat in tenebris, nescit quo vadat.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Dum lucem habetis, credite in lucem, ut filii lucis sitis. Hæc locutus est Jesus, et abiit et abscondit se ab eis.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Cum autem tanta signa fecisset coram eis, non credebant in eum ;</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>ut sermo Isaiæ prophetæ impleretur, quem dixit : Domine, quis credidit auditui nostro ? et brachium Domini cui revelatum est ?</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Propterea non poterant credere, quia iterum dixit Isaias :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Excæcavit oculos eorum, et induravit cor eorum ut non videant oculis, et non intelligant corde, et convertantur, et sanem eos.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Hæc dixit Isaias, quando vidit gloriam ejus, et locutus est de eo.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Verumtamen et ex principibus multi crediderunt in eum : sed propter pharisæos non confitebantur, ut e synagoga non ejicerentur.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Dilexerunt enim gloriam hominum magis quam gloriam Dei.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Jesus autem clamavit, et dixit : Qui credit in me, non credit in me, sed in eum qui misit me.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Et qui videt me, videt eum qui misit me.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Ego lux in mundum veni, ut omnis qui credit in me, in tenebris non maneat.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Et si quis audierit verba mea, et non custodierit, ego non judico eum ; non enim veni ut judicem mundum, sed ut salvificem mundum.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Qui spernit me et non accipit verba mea, habet qui judicet eum. Sermo quem locutus sum, ille judicabit eum in novissimo die.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Quia ego ex meipso non sum locutus, sed qui misit me, Pater, ipse mihi mandatum dedit quid dicam et quid loquar.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Et scio quia mandatum ejus vita æterna atic/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.12\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":12,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"Jesus therefore, six days before the pasch, came to Bethania, where Lazarus had been dead, whom Jesus raised to life.\"},{\"verse\":2,\"text\":\"And they made him a supper there: and Martha served. But Lazarus was one of them that were at table with him.\"},{\"verse\":3,\"text\":\"Mary therefore took a pound of ointment of right spikenard, of great price, and anointed the feet of Jesus and wiped his feet with her hair. And the house was filled with the odour of the ointment.\"},{\"verse\":4,\"text\":\"Then one of his disciples, Judas Iscariot, he that was about to betray him, said:\"},{\"verse\":5,\"text\":\"Why was not this ointment sold for three hundred pence and given to the poor?\"},{\"verse\":6,\"text\":\"Now he said this not because he cared for the poor; but because he was a thief and, having the purse, carried the things that were put therein.\"},{\"verse\":7,\"text\":\"Jesus therefore said: Let her alone, that she may keep it against the day of my burial.\"},{\"verse\":8,\"text\":\"For the poor you have always with you: but me you have not always.\"},{\"verse\":9,\"text\":\"A great multitude therefore of the Jews knew that he was there; and they came, not for Jesus’ sake only, but that they might see Lazarus, whom he had raised from the dead.\"},{\"verse\":10,\"text\":\"But the chief priests thought to kill Lazarus also:\"},{\"verse\":11,\"text\":\"Because many of the Jews, by reason of him, went away and believed in Jesus.\"},{\"verse\":12,\"text\":\"And on the next day, a great multitude that was come to the festival day, when they had heard that Jesus was coming to Jerusalem,\"},{\"verse\":13,\"text\":\"Took branches of palm trees and went forth to meet him and cried Hosanna. Blessed is he that cometh in the name of the Lord, the king of Israel.\"},{\"verse\":14,\"text\":\"And Jesus found a young ass and sat upon it, as it is written:\"},{\"verse\":15,\"text\":\"Fear not, daughter of Sion: behold thy king cometh, sitting on an ass’s colt.\"},{\"verse\":16,\"text\":\"These things his disciples did not know at the first: but when Jesus was glorified, then they remembered that these things were written of him and that they had done these things to him.\"},{\"verse\":17,\"text\":\"The multitude therefore gave testimony, which was with him, when he called Lazarus out of the grave and raised him from the dead.\"},{\"verse\":18,\"text\":\"For which reason also the people came to meet him, because they heard that he had done this miracle.\"},{\"verse\":19,\"text\":\"The Pharisees therefore said among themselves: Do you see that we prevail nothing? Behold, the whole world is gone after him.\"},{\"verse\":20,\"text\":\"Now there were certain Gentiles among them, who came up to adore on the festival day.\"},{\"verse\":21,\"text\":\"These therefore came to Philip, who was of Bethsaida of Galilee, and desired him, saying: Sir, we would see Jesus.\"},{\"verse\":22,\"text\":\"Philip cometh and telleth Andrew. Again Andrew and Philip told Jesus.\"},{\"verse\":23,\"text\":\"But Jesus answered them, saying: The hour is come that the Son of man should be glorified.\"},{\"verse\":24,\"text\":\"Amen, amen, I say to you, unless the grain of wheat falling into the ground die,\"},{\"verse\":25,\"text\":\"Itself remaineth alone. But if it die it bringeth forth much fruit. He that loveth his life shall lose it and he that hateth his life in this world keepeth it unto life eternal.\"},{\"verse\":26,\"text\":\"If any man minister to me, let him follow me: and where I am, there also shall my minister be. If any man minister to me, him will my Father honour.\"},{\"verse\":27,\"text\":\"Now is my soul troubled. And what shall I say? Father, save me from this hour. But for this cause I came unto this hour.\"},{\"verse\":28,\"text\":\"Father, glorify thy name. A voice therefore came from heaven: I have both glorified it and will glorify it again.\"},{\"verse\":29,\"text\":\"The multitude therefore that stood and heard said that it thundered. Others said: An angel spoke to him.\"},{\"verse\":30,\"text\":\"Jesus answered and said: This voice came not because of me, but for your sakes.\"},{\"verse\":31,\"text\":\"Now is the judgment of the world: now shall the prince of this world be cast out.\"},{\"verse\":32,\"text\":\"And I, if I be lifted up from the earth, will draw all things to myself.\"},{\"verse\":33,\"text\":\"(Now this he said, signifying what death he should die.)\"},{\"verse\":34,\"text\":\"The multitude answered him: We have heard out of the law that Christ abideth for ever. And how sayest thou: The Son of man must be lifted up? Who is this Son of man?\"},{\"verse\":35,\"text\":\"Jesus therefore said to them: Yet a little while, the light is among you. Walk whilst you have the light, that the darkness overtake you not. And he that walketh in darkness knoweth not whither he goeth.\"},{\"verse\":36,\"text\":\"Whilst you have the light, believe in the light, that you may be the children of light. These things Jesus spoke: and he went away and hid himself from them.\"},{\"verse\":37,\"text\":\"And whereas he had done so many miracles before them, they believed not in him:\"},{\"verse\":38,\"text\":\"That the saying of Isaias the prophet might be fulfilled, which he said: Lord, who hath believed our hearing? And to whom hath the arm of the Lord been revealed?\"},{\"verse\":39,\"text\":\"Therefore they could not believe, because Isaias said again:\"},{\"verse\":40,\"text\":\"He hath blinded their eyes and hardened their heart, that they should not see with their eyes, nor understand with their heart and be converted: and I should heal them.\"},{\"verse\":41,\"text\":\"These things said Isaias, when he saw his glory, and spoke of him.\"},{\"verse\":42,\"text\":\"However, many of the chief men also believed in him: but because of the Pharisees they did not confess him, that they might not be cast out of the synagogue.\"},{\"verse\":43,\"text\":\"For they loved the glory of men more than the glory of God.\"},{\"verse\":44,\"text\":\"But Jesus cried and said: He that believeth in me doth not believe in me, but in him that sent me.\"},{\"verse\":45,\"text\":\"And he that seeth me, seeth him that sent me.\"},{\"verse\":46,\"text\":\"I am come, a light into the world, that whosoever believeth in me may not remain in darkness.\"},{\"verse\":47,\"text\":\"And if any man hear my words and keep them not, I do not judge him for I came not to judge the world, but to save the world.\"},{\"verse\":48,\"text\":\"He that despiseth me and receiveth not my words hath one that judgeth him. The word that I have spoken, the same shall judge him in the last day.\"},{\"verse\":49,\"text\":\"For I have not spoken of myself: but the Father who sent me, he gave me commandment what I should say and what I should speak.\"},{\"verse\":50,\"text\":\"And I know that his commandment is life everlasting. The things therefore that I speak, even as the Father said unto me, so do I speak.\"}],\"vul\":[{\"verse\":1,\"text\":\"Jesus ergo ante sex dies Paschæ venit Bethaniam, ubi Lazarus fuerat mortuus, quem suscitavit Jesus.\"},{\"verse\":2,\"text\":\"Fecerunt autem ei cœnam ibi, et Martha ministrabat, Lazarus vero unus erat ex discumbentibus cum eo.\"},{\"verse\":3,\"text\":\"Maria ergo accepit libram unguenti nardi pistici pretiosi, et unxit pedes Jesu, et extersit pedes ejus capillis suis : et domus impleta est ex odore unguenti.\"},{\"verse\":4,\"text\":\"Dixit ergo unus ex discipulis ejus, Judas Iscariotes, qui erat eum traditurus :\"},{\"verse\":5,\"text\":\"Quare hoc unguentum non veniit trecentis denariis, et datum est egenis ?\"},{\"verse\":6,\"text\":\"Dixit autem hoc, non quia de egenis pertinebat ad eum, sed quia fur erat, et loculos habens, ea quæ mittebantur, portabat.\"},{\"verse\":7,\"text\":\"Dixit ergo Jesus : Sinite illam ut in diem sepulturæ meæ servet illud.\"},{\"verse\":8,\"text\":\"Pauperes enim semper habetis vobiscum : me autem non semper habetis.\"},{\"verse\":9,\"text\":\"Cognovit ergo turba multa ex Judæis quia illic est, et venerunt, non propter Jesum tantum, sed ut Lazarum viderent, quem suscitavit a mortuis.\"},{\"verse\":10,\"text\":\"Cogitaverunt autem principes sacerdotum ut et Lazarum interficerent :\"},{\"verse\":11,\"text\":\"quia multi propter illum abibant ex Judæis, et credebant in Jesum.\"},{\"verse\":12,\"text\":\"In crastinum autem, turba multa quæ venerat ad diem festum, cum audissent quia venit Jesus Jerosolymam,\"},{\"verse\":13,\"text\":\"acceperunt ramos palmarum, et processerunt obviam ei, et clamabant : Hosanna, benedictus qui venit in nomine Domini, rex Israël.\"},{\"verse\":14,\"text\":\"Et invenit Jesus asellum, et sedit super eum, sicut scriptum est :\"},{\"verse\":15,\"text\":\"Noli timere, filia Sion : ecce rex tuus venit sedens super pullum asinæ.\"},{\"verse\":16,\"text\":\"Hæc non cognoverunt discipuli ejus primum : sed quando glorificatus est Jesus, tunc recordati sunt quia hæc erant scripta de eo, et hæc fecerunt ei.\"},{\"verse\":17,\"text\":\"Testimonium ergo perhibebat turba, quæ erat cum eo quando Lazarum vocavit de monumento, et suscitavit eum a mortuis.\"},{\"verse\":18,\"text\":\"Propterea et obviam venit ei turba : quia audierunt fecisse hoc signum.\"},{\"verse\":19,\"text\":\"Pharisæi ergo dixerunt ad semetipsos : Videtis quia nihil proficimus ? ecce mundus totus post eum abiit.\"},{\"verse\":20,\"text\":\"Erant autem quidam gentiles, ex his qui ascenderant ut adorarent in die festo.\"},{\"verse\":21,\"text\":\"Hi ergo accesserunt ad Philippum, qui erat a Bethsaida Galilææ, et rogabant eum, dicentes : Domine, volumus Jesum videre.\"},{\"verse\":22,\"text\":\"Venit Philippus, et dicit Andreæ ; Andreas rursum et Philippus dixerunt Jesu.\"},{\"verse\":23,\"text\":\"Jesus autem respondit eis, dicens : Venit hora, ut clarificetur Filius hominis.\"},{\"verse\":24,\"text\":\"Amen, amen dico vobis, nisi granum frumenti cadens in terram, mortuum fuerit,\"},{\"verse\":25,\"text\":\"ipsum solum manet : si autem mortuum fuerit, multum fructum affert. Qui amat animam suam, perdet eam ; et qui odit animam suam in hoc mundo, in vitam æternam custodit eam.\"},{\"verse\":26,\"text\":\"Si quis mihi ministrat, me sequatur, et ubi sum ego, illic et minister meus erit. Si quis mihi ministraverit, honorificabit eum Pater meus.\"},{\"verse\":27,\"text\":\"Nunc anima mea turbata est. Et quid dicam ? Pater, salvifica me ex hac hora. Sed propterea veni in horam hanc :\"},{\"verse\":28,\"text\":\"Pater, clarifica nomen tuum. Venit ergo vox de cælo : Et clarificavi, et iterum clarificabo.\"},{\"verse\":29,\"text\":\"Turba ergo, quæ stabat, et audierat, dicebat tonitruum esse factum. Alii dicebant : Angelus ei locutus est.\"},{\"verse\":30,\"text\":\"Respondit Jesus, et dixit : Non propter me hæc vox venit, sed propter vos.\"},{\"verse\":31,\"text\":\"Nunc judicium est mundi : nunc princeps hujus mundi ejicietur foras.\"},{\"verse\":32,\"text\":\"Et ego, si exaltatus fuero a terra, omnia traham ad meipsum.\"},{\"verse\":33,\"text\":\"(Hoc autem dicebat, significans qua morte esset moriturus.)\"},{\"verse\":34,\"text\":\"Respondit ei turba : Nos audivimus ex lege, quia Christus manet in æternum : et quomodo tu dicis : Oportet exaltari Filium hominis ? quis est iste Filius hominis ?\"},{\"verse\":35,\"text\":\"Dixit ergo eis Jesus : Adhuc modicum, lumen in vobis est. Ambulate dum lucem habetis, ut non vos tenebræ comprehendant ; et qui ambulat in tenebris, nescit quo vadat.\"},{\"verse\":36,\"text\":\"Dum lucem habetis, credite in lucem, ut filii lucis sitis. Hæc locutus est Jesus, et abiit et abscondit se ab eis.\"},{\"verse\":37,\"text\":\"Cum autem tanta signa fecisset coram eis, non credebant in eum ;\"},{\"verse\":38,\"text\":\"ut sermo Isaiæ prophetæ impleretur, quem dixit : Domine, quis credidit auditui nostro ? et brachium Domini cui revelatum est ?\"},{\"verse\":39,\"text\":\"Propterea non poterant credere, quia iterum dixit Isaias :\"},{\"verse\":40,\"text\":\"Excæcavit oculos eorum, et induravit cor eorum ut non videant oculis, et non intelligant corde, et convertantur, et sanem eos.\"},{\"verse\":41,\"text\":\"Hæc dixit Isaias, quando vidit gloriam ejus, et locutus est de eo.\"},{\"verse\":42,\"text\":\"Verumtamen et ex principibus multi crediderunt in eum : sed propter pharisæos non confitebantur, ut e synagoga non ejicerentur.\"},{\"verse\":43,\"text\":\"Dilexerunt enim gloriam hominum magis quam gloriam Dei.\"},{\"verse\":44,\"text\":\"Jesus autem clamavit, et dixit : Qui credit in me, non credit in me, sed in eum qui misit me.\"},{\"verse\":45,\"text\":\"Et qui videt me, videt eum qui misit me.\"},{\"verse\":46,\"text\":\"Ego lux in mundum veni, ut omnis qui credit in me, in tenebris non maneat.\"},{\"verse\":47,\"text\":\"Et si quis audierit verba mea, et non custodierit, ego non judico eum ; non enim veni ut judicem mundum, sed ut salvificem mundum.\"},{\"verse\":48,\"text\":\"Qui spernit me et non accipit verba mea, habet qui judicet eum. Sermo quem locutus sum, ille judicabit eum in novissimo die.\"},{\"verse\":49,\"text\":\"Quia ego ex meipso non sum locutus, sed qui misit me, Pater, ipse mihi mandatum dedit quid dicam et quid loquar.\"},{\"verse\":50,\"text\":\"Et scio quia mandatum ejus vita æterna est : quæ ergo ego loquor, sicut dixit mihi Pater, sic loquor.\"}],\"summary\":\"The anointing of Christ’s feet. His riding into Jerusalem upon an ass. A voice from heaven.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":11,\"label\":\"John 11\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":13,\"label\":\"John 13\"}}]]\n"])</script></body></html>
