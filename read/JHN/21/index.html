 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">21</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ manifests himself to his disciples by the sea side and gives Peter the charge of his sheep.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After this, Jesus shewed himself again to the disciples at the sea of Tiberias. And he shewed himself after this manner.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>There were together: Simon Peter and Thomas, who is called Didymus, and Nathanael, who was of Cana of Galilee, and the sons of Zebedee and two others of his disciples.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Simon Peter saith to them: I go a fishing. They say to him: We also come with thee. And they went forth and entered into the ship: and that night they caught nothing.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But when the morning was come, Jesus stood on the shore: yet the disciples knew not that it was Jesus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Jesus therefore said to them: Children, have you any meat? They answered him: No.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He saith to them: Cast the net on the right side of the ship; and you shall find. They cast therefore: and now they were not able to draw it, for the multitude of fishes.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That disciple therefore whom Jesus loved said to Peter: It is the Lord. Simon Peter, when he heard that it was the Lord, girt his coat about him (for he was naked) and cast himself into the sea.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>But the other disciples came in the ship (for they were not far from the land, but as it were two hundred cubits) dragging the net with fishes.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>As soon then as they came to land they saw hot coals lying, and a fish laid thereon, and bread.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jesus saith to them: Bring hither of the fishes which you have now caught.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Simon Peter went up and drew the net to land, full of great fishes, one hundred and fifty-three. And although there were so many, the net was not broken.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Jesus saith to them: Come and dine. And none of them who were at meat, durst ask him: Who art thou? Knowing that it was the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And Jesus cometh and taketh bread and giveth them: and fish in like manner.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>This is now the third time that Jesus was manifested to his disciples, after he was risen from the dead.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>When therefore they had dined, Jesus saith to Simon Peter: Simon, son of John, lovest thou me more than these? He saith to him: Yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>He saith to him again: Simon, son of John, lovest thou me? He saith to him: yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>He said to him the third time: Simon, son of John, lovest thou me? Peter was grieved because he had said to him the third time: Lovest thou me? And he said to him: Lord, thou knowest all things: thou knowest that I love thee. He said to him: Feed my sheep.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Amen, amen, I say to thee, When thou wast younger, thou didst gird thyself and didst walk where thou wouldst. But when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee and lead thee whither thou wouldst not.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And this he said, signifying by what death he should glorify God. And when he had said this, he saith to him: Follow me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Peter turning about, saw that disciple whom Jesus loved following, who also leaned on his breast at supper and said: Lord, who is he that shall betray thee?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Him therefore when Peter had seen, he saith to Jesus: Lord, and what shall this man do?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Jesus saith to him: So I will have him to remain till I come, what is it to thee? Follow thou me.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>This saying therefore went abroad among the brethren, that that disciple should not die. And Jesus did not say to him: He should not die; but: So I will have him to remain till I come, what is it to thee?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>This is that disciple who giveth testimony of these things and hath written these things: and we know that his testimony is true.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>But there are also many other things which Jesus did which, if they were written every one, the world itself. I think, would not be able to contain the books that should be written.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Postea manifestavit se iterum Jesus discipulis ad mare Tiberiadis. Manifestavit autem sic :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>erant simul Simon Petrus, et Thomas, qui dicitur Didymus, et Nathanaël, qui erat a Cana Galilææ, et filii Zebedæi, et alii ex discipulis ejus duo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dicit eis Simon Petrus : Vado piscari. Dicunt ei : Venimus et nos tecum. Et exierunt, et ascenderunt in navim : et illa nocte nihil prendiderunt.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Mane autem facto stetit Jesus in littore : non tamen cognoverunt discipuli quia Jesus est.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixit ergo eis Jesus : Pueri, numquid pulmentarium habetis ? Responderunt ei : Non.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dicit eis : Mittite in dexteram navigii rete, et invenietis. Miserunt ergo : et jam non valebant illud trahere præ multitudine piscium.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixit ergo discipulus ille, quem diligebat Jesus, Petro : Dominus est. Simon Petrus cum audisset quia Dominus est, tunica succinxit se (erat enim nudus) et misit se in mare.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Alii autem discipuli navigio venerunt (non enim longe erant a terra, sed quasi cubitis ducentis), trahentes rete piscium.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ut ergo descenderunt in terram, viderunt prunas positas, et piscem superpositum, et panem.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dicit eis Jesus : Afferte de piscibus, quos prendidistis nunc.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ascendit Simon Petrus et traxit rete in terram, plenum magnis piscibus centum quinquaginta tribus. Et cum tanti essent, non est scissum rete.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Dicit eis Jesus : Venite, prandete. Et nemo audebat discumbentium interrogare eum : Tu quis es ? scientes, quia Dominus est.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et venit Jesus, et accipit panem, et dat eis, et piscem similiter.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hoc jam tertio manifestatus est Jesus discipulis suis cum resurrexisset a mortuis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Cum ergo prandissent, dicit Simoni Petro Jesus : Simon Joannis, diligis me plus his ? Dicit ei : Etiam Domine, tu scis quia amo te. Dicit ei : Pasce agnos meos.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dicit ei iterum : Simon Joannis, diligis me ? Ait illi : Etiam Domine, tu scis quia amo te. Dicit ei : Pasce agnos meos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dicit ei tertio : Simon Joannis, amas me ? Contristatus est Petrus, quia dixit ei tertio : Amas me ? et dixit ei : Domine, tu omnia nosti, tu scis quia amo te. Dixit ei : Pasce oves meas.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Amen, amen dico tibi : cum esses junior, cingebas te, et ambulabas ubi volebas : cum autem senueris, extendes manus tuas, et alius te cinget, et ducet quo tu non vis.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Hoc autem dixit significans qua morte clarificaturus esset Deum. Et cum hoc dixisset, dicit ei : Sequere me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Conversus Petrus vidit illum discipulum, quem diligebat Jesus, sequentem, qui et recubuit in cœna super pectus ejus, et dixit : Domine, quis est qui tradet te ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Hunc ergo cum vidisset Petrus, dixit Jesu : Domine, hic autem quid ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Dicit ei Jesus : Sic eum volo manere donec veniam, quid ad te ? tu me sequere.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Exiit ergo sermo iste inter fratres quia discipulus ille non moritur. Et non dixit ei Jesus : Non moritur, sed : Sic eum volo manere donec veniam, quid ad te ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Hic est discipulus ille qui testimonium perhibet de his, et scripsit hæc : et scimus quia verum est testimonium ejus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Sunt autem et alia multa quæ fecit Jesus : quæ si scribantur per singula, nec ipsum arbitror mundum capere posse eos, qui scribendi sunt, libros.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/20/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 20</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/r \":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JHN.21\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":21,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"After this, Jesus shewed himself again to the disciples at the sea of Tiberias. And he shewed himself after this manner.\"},{\"verse\":2,\"text\":\"There were together: Simon Peter and Thomas, who is called Didymus, and Nathanael, who was of Cana of Galilee, and the sons of Zebedee and two others of his disciples.\"},{\"verse\":3,\"text\":\"Simon Peter saith to them: I go a fishing. They say to him: We also come with thee. And they went forth and entered into the ship: and that night they caught nothing.\"},{\"verse\":4,\"text\":\"But when the morning was come, Jesus stood on the shore: yet the disciples knew not that it was Jesus.\"},{\"verse\":5,\"text\":\"Jesus therefore said to them: Children, have you any meat? They answered him: No.\"},{\"verse\":6,\"text\":\"He saith to them: Cast the net on the right side of the ship; and you shall find. They cast therefore: and now they were not able to draw it, for the multitude of fishes.\"},{\"verse\":7,\"text\":\"That disciple therefore whom Jesus loved said to Peter: It is the Lord. Simon Peter, when he heard that it was the Lord, girt his coat about him (for he was naked) and cast himself into the sea.\"},{\"verse\":8,\"text\":\"But the other disciples came in the ship (for they were not far from the land, but as it were two hundred cubits) dragging the net with fishes.\"},{\"verse\":9,\"text\":\"As soon then as they came to land they saw hot coals lying, and a fish laid thereon, and bread.\"},{\"verse\":10,\"text\":\"Jesus saith to them: Bring hither of the fishes which you have now caught.\"},{\"verse\":11,\"text\":\"Simon Peter went up and drew the net to land, full of great fishes, one hundred and fifty-three. And although there were so many, the net was not broken.\"},{\"verse\":12,\"text\":\"Jesus saith to them: Come and dine. And none of them who were at meat, durst ask him: Who art thou? Knowing that it was the Lord.\"},{\"verse\":13,\"text\":\"And Jesus cometh and taketh bread and giveth them: and fish in like manner.\"},{\"verse\":14,\"text\":\"This is now the third time that Jesus was manifested to his disciples, after he was risen from the dead.\"},{\"verse\":15,\"text\":\"When therefore they had dined, Jesus saith to Simon Peter: Simon, son of John, lovest thou me more than these? He saith to him: Yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs.\"},{\"verse\":16,\"text\":\"He saith to him again: Simon, son of John, lovest thou me? He saith to him: yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs.\"},{\"verse\":17,\"text\":\"He said to him the third time: Simon, son of John, lovest thou me? Peter was grieved because he had said to him the third time: Lovest thou me? And he said to him: Lord, thou knowest all things: thou knowest that I love thee. He said to him: Feed my sheep.\"},{\"verse\":18,\"text\":\"Amen, amen, I say to thee, When thou wast younger, thou didst gird thyself and didst walk where thou wouldst. But when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee and lead thee whither thou wouldst not.\"},{\"verse\":19,\"text\":\"And this he said, signifying by what death he should glorify God. And when he had said this, he saith to him: Follow me.\"},{\"verse\":20,\"text\":\"Peter turning about, saw that disciple whom Jesus loved following, who also leaned on his breast at supper and said: Lord, who is he that shall betray thee?\"},{\"verse\":21,\"text\":\"Him therefore when Peter had seen, he saith to Jesus: Lord, and what shall this man do?\"},{\"verse\":22,\"text\":\"Jesus saith to him: So I will have him to remain till I come, what is it to thee? Follow thou me.\"},{\"verse\":23,\"text\":\"This saying therefore went abroad among the brethren, that that disciple should not die. And Jesus did not say to him: He should not die; but: So I will have him to remain till I come, what is it to thee?\"},{\"verse\":24,\"text\":\"This is that disciple who giveth testimony of these things and hath written these things: and we know that his testimony is true.\"},{\"verse\":25,\"text\":\"But there are also many other things which Jesus did which, if they were written every one, the world itself. I think, would not be able to contain the books that should be written.\"}],\"vul\":[{\"verse\":1,\"text\":\"Postea manifestavit se iterum Jesus discipulis ad mare Tiberiadis. Manifestavit autem sic :\"},{\"verse\":2,\"text\":\"erant simul Simon Petrus, et Thomas, qui dicitur Didymus, et Nathanaël, qui erat a Cana Galilææ, et filii Zebedæi, et alii ex discipulis ejus duo.\"},{\"verse\":3,\"text\":\"Dicit eis Simon Petrus : Vado piscari. Dicunt ei : Venimus et nos tecum. Et exierunt, et ascenderunt in navim : et illa nocte nihil prendiderunt.\"},{\"verse\":4,\"text\":\"Mane autem facto stetit Jesus in littore : non tamen cognoverunt discipuli quia Jesus est.\"},{\"verse\":5,\"text\":\"Dixit ergo eis Jesus : Pueri, numquid pulmentarium habetis ? Responderunt ei : Non.\"},{\"verse\":6,\"text\":\"Dicit eis : Mittite in dexteram navigii rete, et invenietis. Miserunt ergo : et jam non valebant illud trahere præ multitudine piscium.\"},{\"verse\":7,\"text\":\"Dixit ergo discipulus ille, quem diligebat Jesus, Petro : Dominus est. Simon Petrus cum audisset quia Dominus est, tunica succinxit se (erat enim nudus) et misit se in mare.\"},{\"verse\":8,\"text\":\"Alii autem discipuli navigio venerunt (non enim longe erant a terra, sed quasi cubitis ducentis), trahentes rete piscium.\"},{\"verse\":9,\"text\":\"Ut ergo descenderunt in terram, viderunt prunas positas, et piscem superpositum, et panem.\"},{\"verse\":10,\"text\":\"Dicit eis Jesus : Afferte de piscibus, quos prendidistis nunc.\"},{\"verse\":11,\"text\":\"Ascendit Simon Petrus et traxit rete in terram, plenum magnis piscibus centum quinquaginta tribus. Et cum tanti essent, non est scissum rete.\"},{\"verse\":12,\"text\":\"Dicit eis Jesus : Venite, prandete. Et nemo audebat discumbentium interrogare eum : Tu quis es ? scientes, quia Dominus est.\"},{\"verse\":13,\"text\":\"Et venit Jesus, et accipit panem, et dat eis, et piscem similiter.\"},{\"verse\":14,\"text\":\"Hoc jam tertio manifestatus est Jesus discipulis suis cum resurrexisset a mortuis.\"},{\"verse\":15,\"text\":\"Cum ergo prandissent, dicit Simoni Petro Jesus : Simon Joannis, diligis me plus his ? Dicit ei : Etiam Domine, tu scis quia amo te. Dicit ei : Pasce agnos meos.\"},{\"verse\":16,\"text\":\"Dicit ei iterum : Simon Joannis, diligis me ? Ait illi : Etiam Domine, tu scis quia amo te. Dicit ei : Pasce agnos meos.\"},{\"verse\":17,\"text\":\"Dicit ei tertio : Simon Joannis, amas me ? Contristatus est Petrus, quia dixit ei tertio : Amas me ? et dixit ei : Domine, tu omnia nosti, tu scis quia amo te. Dixit ei : Pasce oves meas.\"},{\"verse\":18,\"text\":\"Amen, amen dico tibi : cum esses junior, cingebas te, et ambulabas ubi volebas : cum autem senueris, extendes manus tuas, et alius te cinget, et ducet quo tu non vis.\"},{\"verse\":19,\"text\":\"Hoc autem dixit significans qua morte clarificaturus esset Deum. Et cum hoc dixisset, dicit ei : Sequere me.\"},{\"verse\":20,\"text\":\"Conversus Petrus vidit illum discipulum, quem diligebat Jesus, sequentem, qui et recubuit in cœna super pectus ejus, et dixit : Domine, quis est qui tradet te ?\"},{\"verse\":21,\"text\":\"Hunc ergo cum vidisset Petrus, dixit Jesu : Domine, hic autem quid ?\"},{\"verse\":22,\"text\":\"Dicit ei Jesus : Sic eum volo manere donec veniam, quid ad te ? tu me sequere.\"},{\"verse\":23,\"text\":\"Exiit ergo sermo iste inter fratres quia discipulus ille non moritur. Et non dixit ei Jesus : Non moritur, sed : Sic eum volo manere donec veniam, quid ad te ?\"},{\"verse\":24,\"text\":\"Hic est discipulus ille qui testimonium perhibet de his, et scripsit hæc : et scimus quia verum est testimonium ejus.\"},{\"verse\":25,\"text\":\"Sunt autem et alia multa quæ fecit Jesus : quæ si scribantur per singula, nec ipsum arbitror mundum capere posse eos, qui scribendi sunt, libros.\"}],\"summary\":\"Christ manifests himself to his disciples by the sea side and gives Peter the charge of his sheep.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":20,\"label\":\"John 20\"},\"next\":{\"usfm\":\"ACT\",\"chapter\":1,\"label\":\"Acts 1\"}}]]\n"])</script></body></html>
