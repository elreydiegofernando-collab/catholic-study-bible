<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>John 7 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">7</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ goes up to the feast of the tabernacles. He teaches in the temple.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After these things, Jesus walked in Galilee: for he would not walk in Judea, because the Jews sought to kill him.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Now the Jews feast of tabernacles was at hand.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And his brethren said to, him: Pass from hence and go into Judea, that thy disciples also may see thy works which thou dost.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For there is no man that doth any thing in secret, and he himself seeketh to be known openly. If thou do these things, manifest thyself to the world.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>For neither did his brethren believe in him.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then Jesus said to them: My time is not yet come; but your time is always ready.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The world cannot hate you: but me it hateth, because I give testimony of it, that the works thereof are evil,</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Go you up to this festival day: but I go not up to this festival day, because my time is not accomplished.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>When he had said these things, he himself stayed in Galilee.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But after his brethren were gone up, then he also went up to the feast, not openly, but, as it were, in secret.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The Jews therefore sought him on the festival day and said: Where is he?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And there was much murmuring among the multitude concerning him. For some said: He is a good man. And others said: No, but he seduceth the people.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Yet no man spoke openly of him, for fear of the Jews.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now, about the midst of the feast, Jesus went up into the temple and taught.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And the Jews wondered, saying: How doth this man know letters, having never learned?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Jesus answered them and said: My doctrine is not mine, but his that sent me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>If any man will do the will of him, he shall know of the doctrine, whether it be of God, or whether I speak of myself.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>He that speaketh of himself seeketh his own glory: but he that seeketh the glory of him that sent him, he is true and there is no injustice in him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Did not Moses give you the law, and yet none of you keepeth the law?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Why seek you to kill me? The multitude answered and said: Thou hast a devil. Who seeketh to kill thee?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Jesus answered and said to them: One work I have done: and you all wonder.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Therefore, Moses gave you circumcision (not because it is of Moses, but of the fathers): and on the sabbath day you circumcise a man.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>If a man receive circumcision on the sabbath day, that the law of Moses may not be broken: are you angry at me, because I have healed the whole man on the sabbath day?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Judge not according to the appearance: but judge just judgment.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Some therefore of Jerusalem said: Is not this he whom they seek to kill?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And behold, he speaketh openly: and they say nothing to him. Have the rulers known for a truth that this is the Christ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>But we know this man, whence he is: but when the Christ cometh, no man knoweth, whence he is.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Jesus therefore cried out in the temple, teaching and saying: You both know me, and you know whence I am. And I am not come of myself: but he that sent me is true, whom you know not.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>I know him, because I am from him: and he hath sent me.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>They sought therefore to apprehend him: and no man laid hands on him, because his hour was not yet come.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But of the people many believed in him and said: When the Christ cometh, shall he do more miracles than this man doth?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The Pharisees heard the people murmuring these things concerning him: and the rulers and Pharisees sent ministers to apprehend him.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Jesus therefore said to them: Yet a little while I am with you: and then I go to him that sent me.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>You shall seek me and shall not find me: and where I am, thither you cannot come.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The Jews therefore said among themselves: Whither will he go, that we shall not find him? Will he go unto the dispersed among the Gentiles and teach the Gentiles?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>What is this saying that he hath said: You shall seek me and shall not find me? And: Where I am, you cannot come?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And on the last, and great day of the festivity, Jesus stood and cried, saying: If any man thirst, let him come to me and drink.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>He that believeth in me, as the scripture saith: Out of his belly shall flow rivers of living water.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Now this he said of the Spirit which they should receive who believed in him: for as yet the Spirit was not given, because Jesus was not yet glorified.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Of that multitude therefore, when they had heard these words of his, some said: This is the prophet indeed.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Others said: This is the Christ. But some said: Doth the Christ come out of Galilee?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Doth not the scripture say: That Christ cometh of the seed of David and from Bethlehem the town where David was?</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>So there arose a dissension among the people because of him.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>And some of them would have apprehended him: but no man laid hands upon him.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>The ministers therefore came to the chief priests and the Pharisees. And they said to them: Why have you not brought him?</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>The ministers answered: Never did man speak like this man.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>The Pharisees therefore answered them: Are you also seduced?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Hath any one of the rulers believed in him, or of the Pharisees?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>But this multitude, that knoweth not the law, are accursed.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Nicodemus said to them (he that came to him by night, who was one of them):</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Doth our law judge any man, unless it first hear him and know what he doth?</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>They answered and said to him: Art thou also a Galilean? Search the scriptures, and see that out of Galilee a prophet riseth not.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>And every man returned to his own house.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post hæc autem ambulabat Jesus in Galilæam : non enim volebat in Judæam ambulare, quia quærebant eum Judæi interficere.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Erat autem in proximo dies festus Judæorum, Scenopegia.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Dixerunt autem ad eum fratres ejus : Transi hinc, et vade in Judæam, ut et discipuli tui videant opera tua, quæ facis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nemo quippe in occulto quid facit, et quærit ipse in palam esse : si hæc facis, manifesta teipsum mundo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Neque enim fratres ejus credebant in eum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Dicit ergo eis Jesus : Tempus meum nondum advenit : tempus autem vestrum semper est paratum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Non potest mundus odisse vos : me autem odit, quia ego testimonium perhibeo de illo quod opera ejus mala sunt.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Vos ascendite ad diem festum hunc, ego autem non ascendo ad diem festum istum : quia meum tempus nondum impletum est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Hæc cum dixisset, ipse mansit in Galilæa.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ut autem ascenderunt fratres ejus, tunc et ipse ascendit ad diem festum non manifeste, sed quasi in occulto.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Judæi ergo quærebant eum in die festo, et dicebant : Ubi est ille ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et murmur multum erat in turba de eo. Quidam enim dicebant : Quia bonus est. Alii autem dicebant : Non, sed seducit turbas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nemo tamen palam loquebatur de illo propter metum Judæorum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Jam autem die festo mediante, ascendit Jesus in templum, et docebat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et mirabantur Judæi, dicentes : Quomodo hic litteras scit, cum non didicerit ?</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Respondit eis Jesus, et dixit : Mea doctrina non est mea, sed ejus qui misit me.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Si quis voluerit voluntatem ejus facere, cognoscet de doctrina, utrum ex Deo sit, an ego a meipso loquar.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Qui a semetipso loquitur, gloriam propriam quærit ; qui autem quærit gloriam ejus qui misit eum, hic verax est, et injustitia in illo non est.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Nonne Moyses dedit vobis legem : et nemo ex vobis facit legem ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Quid me quæritis interficere ? Respondit turba, et dixit : Dæmonium habes : quis te quærit interficere ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Respondit Jesus et dixit eis : Unum opus feci, et omnes miramini :</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>propterea Moyses dedit vobis circumcisionem (non quia ex Moyse est, sed ex patribus), et in sabbato circumciditis hominem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Si circumcisionem accipit homo in sabbato, ut non solvatur lex Moysi : mihi indignamini quia totum hominem sanum feci in sabbato ?</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Nolite judicare secundum faciem, sed justum judicium judicate.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dicebant ergo quidam ex Jerosolymis : Nonne hic est, quem quærunt interficere ?</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>et ecce palam loquitur, et nihil ei dicunt. Numquid vere cognoverunt principes quia hic est Christus ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Sed hunc scimus unde sit : Christus autem cum venerit, nemo scit unde sit.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Clamabat ergo Jesus in templo docens, et dicens : Et me scitis, et unde sim scitis : et a meipso non veni, sed est verus qui misit me, quem vos nescitis.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Ego scio eum : quia ab ipso sum, et ipse me misit.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Quærebant ergo eum apprehendere : et nemo misit in illum manus, quia nondum venerat hora ejus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>De turba autem multi crediderunt in eum, et dicebant : Christus cum venerit, numquid plura signa faciet quam quæ hic facit ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Audierunt pharisæi turbam murmurantem de illo hæc : et miserunt principes et pharisæi ministros ut apprehenderent eum.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dixit ergo eis Jesus : Adhuc modicum tempus vobiscum sum : et vado ad eum qui me misit.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Quæretis me, et non invenietis : et ubi ego sum, vos non potestis venire.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Dixerunt ergo Judæi ad semetipsos : Quo hic iturus est, quia non inveniemus eum ? numquid in dispersionem gentium iturus est, et docturus gentes ?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>quis est hic sermo, quem dixit : Quæretis me, et non invenietis : et ubi sum ego, vos non potestis venire ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>In novissimo autem die magno festivitatis stabat Jesus, et clamabat dicens : Si quis sitit, veniat ad me et bibat.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Qui credit in me, sicut dicit Scriptura, flumina de ventre ejus fluent aquæ vivæ.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Hoc autem dixit de Spiritu, quem accepturi erant credentes in eum : nondum enim erat Spiritus datus, quia Jesus nondum erat glorificatus.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Ex illa ergo turba cum audissent hos sermones ejus, dicebant : Hic est vere propheta.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Alii dicebant : Hic est Christus. Quidam autem dicebant : Numquid a Galilæa venit Christus ?</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>nonne Scriptura dicit : Quia ex semine David, et de Bethlehem castello, ubi erat David, venit Christus ?</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Dissensio itaque facta est in turba propter eum.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Quidam autem ex ipsis volebant apprehendere eum : sed nemo misit super eum manus.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Venerunt ergo ministri ad pontifices et pharisæos. Et dixerunt eis illi : Quare non adduxistis illum ?</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Responderunt ministri : Numquam sic locutus est homo, sicut hic homo.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Responderunt ergo eis pharisæi : Numquid et vos seducti estis ?</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>numquid ex principibus aliquis credidit in eum, aut ex pharisæis ?</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>sed turba hæc, quæ non novit legem, maledicti sunt.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Dixit Nicodemus ad eos, ille qui venit ad eum nocte, qui unus erat ex ipsis :</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Numquid lex nostra judicat hominem, nisi prius audierit ab ipso, et cognoverit quid faciat ?</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Responderunt, et dixerunt ei : Numquid et tu Galilæus es ? scrutare Scripturas, et vide quia a Galilæa propheta non surgit.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Et reversi sunt unusquisque in domum suam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/6/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 6</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/8/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 8</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->7<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: John 6" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/6/"><svg viewBox="0 0 24 24" fill="none" str "/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.7\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":7,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"After these things, Jesus walked in Galilee: for he would not walk in Judea, because the Jews sought to kill him.\"},{\"verse\":2,\"text\":\"Now the Jews feast of tabernacles was at hand.\"},{\"verse\":3,\"text\":\"And his brethren said to, him: Pass from hence and go into Judea, that thy disciples also may see thy works which thou dost.\"},{\"verse\":4,\"text\":\"For there is no man that doth any thing in secret, and he himself seeketh to be known openly. If thou do these things, manifest thyself to the world.\"},{\"verse\":5,\"text\":\"For neither did his brethren believe in him.\"},{\"verse\":6,\"text\":\"Then Jesus said to them: My time is not yet come; but your time is always ready.\"},{\"verse\":7,\"text\":\"The world cannot hate you: but me it hateth, because I give testimony of it, that the works thereof are evil,\"},{\"verse\":8,\"text\":\"Go you up to this festival day: but I go not up to this festival day, because my time is not accomplished.\"},{\"verse\":9,\"text\":\"When he had said these things, he himself stayed in Galilee.\"},{\"verse\":10,\"text\":\"But after his brethren were gone up, then he also went up to the feast, not openly, but, as it were, in secret.\"},{\"verse\":11,\"text\":\"The Jews therefore sought him on the festival day and said: Where is he?\"},{\"verse\":12,\"text\":\"And there was much murmuring among the multitude concerning him. For some said: He is a good man. And others said: No, but he seduceth the people.\"},{\"verse\":13,\"text\":\"Yet no man spoke openly of him, for fear of the Jews.\"},{\"verse\":14,\"text\":\"Now, about the midst of the feast, Jesus went up into the temple and taught.\"},{\"verse\":15,\"text\":\"And the Jews wondered, saying: How doth this man know letters, having never learned?\"},{\"verse\":16,\"text\":\"Jesus answered them and said: My doctrine is not mine, but his that sent me.\"},{\"verse\":17,\"text\":\"If any man will do the will of him, he shall know of the doctrine, whether it be of God, or whether I speak of myself.\"},{\"verse\":18,\"text\":\"He that speaketh of himself seeketh his own glory: but he that seeketh the glory of him that sent him, he is true and there is no injustice in him.\"},{\"verse\":19,\"text\":\"Did not Moses give you the law, and yet none of you keepeth the law?\"},{\"verse\":20,\"text\":\"Why seek you to kill me? The multitude answered and said: Thou hast a devil. Who seeketh to kill thee?\"},{\"verse\":21,\"text\":\"Jesus answered and said to them: One work I have done: and you all wonder.\"},{\"verse\":22,\"text\":\"Therefore, Moses gave you circumcision (not because it is of Moses, but of the fathers): and on the sabbath day you circumcise a man.\"},{\"verse\":23,\"text\":\"If a man receive circumcision on the sabbath day, that the law of Moses may not be broken: are you angry at me, because I have healed the whole man on the sabbath day?\"},{\"verse\":24,\"text\":\"Judge not according to the appearance: but judge just judgment.\"},{\"verse\":25,\"text\":\"Some therefore of Jerusalem said: Is not this he whom they seek to kill?\"},{\"verse\":26,\"text\":\"And behold, he speaketh openly: and they say nothing to him. Have the rulers known for a truth that this is the Christ?\"},{\"verse\":27,\"text\":\"But we know this man, whence he is: but when the Christ cometh, no man knoweth, whence he is.\"},{\"verse\":28,\"text\":\"Jesus therefore cried out in the temple, teaching and saying: You both know me, and you know whence I am. And I am not come of myself: but he that sent me is true, whom you know not.\"},{\"verse\":29,\"text\":\"I know him, because I am from him: and he hath sent me.\"},{\"verse\":30,\"text\":\"They sought therefore to apprehend him: and no man laid hands on him, because his hour was not yet come.\"},{\"verse\":31,\"text\":\"But of the people many believed in him and said: When the Christ cometh, shall he do more miracles than this man doth?\"},{\"verse\":32,\"text\":\"The Pharisees heard the people murmuring these things concerning him: and the rulers and Pharisees sent ministers to apprehend him.\"},{\"verse\":33,\"text\":\"Jesus therefore said to them: Yet a little while I am with you: and then I go to him that sent me.\"},{\"verse\":34,\"text\":\"You shall seek me and shall not find me: and where I am, thither you cannot come.\"},{\"verse\":35,\"text\":\"The Jews therefore said among themselves: Whither will he go, that we shall not find him? Will he go unto the dispersed among the Gentiles and teach the Gentiles?\"},{\"verse\":36,\"text\":\"What is this saying that he hath said: You shall seek me and shall not find me? And: Where I am, you cannot come?\"},{\"verse\":37,\"text\":\"And on the last, and great day of the festivity, Jesus stood and cried, saying: If any man thirst, let him come to me and drink.\"},{\"verse\":38,\"text\":\"He that believeth in me, as the scripture saith: Out of his belly shall flow rivers of living water.\"},{\"verse\":39,\"text\":\"Now this he said of the Spirit which they should receive who believed in him: for as yet the Spirit was not given, because Jesus was not yet glorified.\"},{\"verse\":40,\"text\":\"Of that multitude therefore, when they had heard these words of his, some said: This is the prophet indeed.\"},{\"verse\":41,\"text\":\"Others said: This is the Christ. But some said: Doth the Christ come out of Galilee?\"},{\"verse\":42,\"text\":\"Doth not the scripture say: That Christ cometh of the seed of David and from Bethlehem the town where David was?\"},{\"verse\":43,\"text\":\"So there arose a dissension among the people because of him.\"},{\"verse\":44,\"text\":\"And some of them would have apprehended him: but no man laid hands upon him.\"},{\"verse\":45,\"text\":\"The ministers therefore came to the chief priests and the Pharisees. And they said to them: Why have you not brought him?\"},{\"verse\":46,\"text\":\"The ministers answered: Never did man speak like this man.\"},{\"verse\":47,\"text\":\"The Pharisees therefore answered them: Are you also seduced?\"},{\"verse\":48,\"text\":\"Hath any one of the rulers believed in him, or of the Pharisees?\"},{\"verse\":49,\"text\":\"But this multitude, that knoweth not the law, are accursed.\"},{\"verse\":50,\"text\":\"Nicodemus said to them (he that came to him by night, who was one of them):\"},{\"verse\":51,\"text\":\"Doth our law judge any man, unless it first hear him and know what he doth?\"},{\"verse\":52,\"text\":\"They answered and said to him: Art thou also a Galilean? Search the scriptures, and see that out of Galilee a prophet riseth not.\"},{\"verse\":53,\"text\":\"And every man returned to his own house.\"}],\"vul\":[{\"verse\":1,\"text\":\"Post hæc autem ambulabat Jesus in Galilæam : non enim volebat in Judæam ambulare, quia quærebant eum Judæi interficere.\"},{\"verse\":2,\"text\":\"Erat autem in proximo dies festus Judæorum, Scenopegia.\"},{\"verse\":3,\"text\":\"Dixerunt autem ad eum fratres ejus : Transi hinc, et vade in Judæam, ut et discipuli tui videant opera tua, quæ facis.\"},{\"verse\":4,\"text\":\"Nemo quippe in occulto quid facit, et quærit ipse in palam esse : si hæc facis, manifesta teipsum mundo.\"},{\"verse\":5,\"text\":\"Neque enim fratres ejus credebant in eum.\"},{\"verse\":6,\"text\":\"Dicit ergo eis Jesus : Tempus meum nondum advenit : tempus autem vestrum semper est paratum.\"},{\"verse\":7,\"text\":\"Non potest mundus odisse vos : me autem odit, quia ego testimonium perhibeo de illo quod opera ejus mala sunt.\"},{\"verse\":8,\"text\":\"Vos ascendite ad diem festum hunc, ego autem non ascendo ad diem festum istum : quia meum tempus nondum impletum est.\"},{\"verse\":9,\"text\":\"Hæc cum dixisset, ipse mansit in Galilæa.\"},{\"verse\":10,\"text\":\"Ut autem ascenderunt fratres ejus, tunc et ipse ascendit ad diem festum non manifeste, sed quasi in occulto.\"},{\"verse\":11,\"text\":\"Judæi ergo quærebant eum in die festo, et dicebant : Ubi est ille ?\"},{\"verse\":12,\"text\":\"Et murmur multum erat in turba de eo. Quidam enim dicebant : Quia bonus est. Alii autem dicebant : Non, sed seducit turbas.\"},{\"verse\":13,\"text\":\"Nemo tamen palam loquebatur de illo propter metum Judæorum.\"},{\"verse\":14,\"text\":\"Jam autem die festo mediante, ascendit Jesus in templum, et docebat.\"},{\"verse\":15,\"text\":\"Et mirabantur Judæi, dicentes : Quomodo hic litteras scit, cum non didicerit ?\"},{\"verse\":16,\"text\":\"Respondit eis Jesus, et dixit : Mea doctrina non est mea, sed ejus qui misit me.\"},{\"verse\":17,\"text\":\"Si quis voluerit voluntatem ejus facere, cognoscet de doctrina, utrum ex Deo sit, an ego a meipso loquar.\"},{\"verse\":18,\"text\":\"Qui a semetipso loquitur, gloriam propriam quærit ; qui autem quærit gloriam ejus qui misit eum, hic verax est, et injustitia in illo non est.\"},{\"verse\":19,\"text\":\"Nonne Moyses dedit vobis legem : et nemo ex vobis facit legem ?\"},{\"verse\":20,\"text\":\"Quid me quæritis interficere ? Respondit turba, et dixit : Dæmonium habes : quis te quærit interficere ?\"},{\"verse\":21,\"text\":\"Respondit Jesus et dixit eis : Unum opus feci, et omnes miramini :\"},{\"verse\":22,\"text\":\"propterea Moyses dedit vobis circumcisionem (non quia ex Moyse est, sed ex patribus), et in sabbato circumciditis hominem.\"},{\"verse\":23,\"text\":\"Si circumcisionem accipit homo in sabbato, ut non solvatur lex Moysi : mihi indignamini quia totum hominem sanum feci in sabbato ?\"},{\"verse\":24,\"text\":\"Nolite judicare secundum faciem, sed justum judicium judicate.\"},{\"verse\":25,\"text\":\"Dicebant ergo quidam ex Jerosolymis : Nonne hic est, quem quærunt interficere ?\"},{\"verse\":26,\"text\":\"et ecce palam loquitur, et nihil ei dicunt. Numquid vere cognoverunt principes quia hic est Christus ?\"},{\"verse\":27,\"text\":\"Sed hunc scimus unde sit : Christus autem cum venerit, nemo scit unde sit.\"},{\"verse\":28,\"text\":\"Clamabat ergo Jesus in templo docens, et dicens : Et me scitis, et unde sim scitis : et a meipso non veni, sed est verus qui misit me, quem vos nescitis.\"},{\"verse\":29,\"text\":\"Ego scio eum : quia ab ipso sum, et ipse me misit.\"},{\"verse\":30,\"text\":\"Quærebant ergo eum apprehendere : et nemo misit in illum manus, quia nondum venerat hora ejus.\"},{\"verse\":31,\"text\":\"De turba autem multi crediderunt in eum, et dicebant : Christus cum venerit, numquid plura signa faciet quam quæ hic facit ?\"},{\"verse\":32,\"text\":\"Audierunt pharisæi turbam murmurantem de illo hæc : et miserunt principes et pharisæi ministros ut apprehenderent eum.\"},{\"verse\":33,\"text\":\"Dixit ergo eis Jesus : Adhuc modicum tempus vobiscum sum : et vado ad eum qui me misit.\"},{\"verse\":34,\"text\":\"Quæretis me, et non invenietis : et ubi ego sum, vos non potestis venire.\"},{\"verse\":35,\"text\":\"Dixerunt ergo Judæi ad semetipsos : Quo hic iturus est, quia non inveniemus eum ? numquid in dispersionem gentium iturus est, et docturus gentes ?\"},{\"verse\":36,\"text\":\"quis est hic sermo, quem dixit : Quæretis me, et non invenietis : et ubi sum ego, vos non potestis venire ?\"},{\"verse\":37,\"text\":\"In novissimo autem die magno festivitatis stabat Jesus, et clamabat dicens : Si quis sitit, veniat ad me et bibat.\"},{\"verse\":38,\"text\":\"Qui credit in me, sicut dicit Scriptura, flumina de ventre ejus fluent aquæ vivæ.\"},{\"verse\":39,\"text\":\"Hoc autem dixit de Spiritu, quem accepturi erant credentes in eum : nondum enim erat Spiritus datus, quia Jesus nondum erat glorificatus.\"},{\"verse\":40,\"text\":\"Ex illa ergo turba cum audissent hos sermones ejus, dicebant : Hic est vere propheta.\"},{\"verse\":41,\"text\":\"Alii dicebant : Hic est Christus. Quidam autem dicebant : Numquid a Galilæa venit Christus ?\"},{\"verse\":42,\"text\":\"nonne Scriptura dicit : Quia ex semine David, et de Bethlehem castello, ubi erat David, venit Christus ?\"},{\"verse\":43,\"text\":\"Dissensio itaque facta est in turba propter eum.\"},{\"verse\":44,\"text\":\"Quidam autem ex ipsis volebant apprehendere eum : sed nemo misit super eum manus.\"},{\"verse\":45,\"text\":\"Venerunt ergo ministri ad pontifices et pharisæos. Et dixerunt eis illi : Quare non adduxistis illum ?\"},{\"verse\":46,\"text\":\"Responderunt ministri : Numquam sic locutus est homo, sicut hic homo.\"},{\"verse\":47,\"text\":\"Responderunt ergo eis pharisæi : Numquid et vos seducti estis ?\"},{\"verse\":48,\"text\":\"numquid ex principibus aliquis credidit in eum, aut ex pharisæis ?\"},{\"verse\":49,\"text\":\"sed turba hæc, quæ non novit legem, maledicti sunt.\"},{\"verse\":50,\"text\":\"Dixit Nicodemus ad eos, ille qui venit ad eum nocte, qui unus erat ex ipsis :\"},{\"verse\":51,\"text\":\"Numquid lex nostra judicat hominem, nisi prius audierit ab ipso, et cognoverit quid faciat ?\"},{\"verse\":52,\"text\":\"Responderunt, et dixerunt ei : Numquid et tu Galilæus es ? scrutare Scripturas, et vide quia a Galilæa propheta non surgit.\"},{\"verse\":53,\"text\":\"Et reversi sunt unusquisque in domum suam.\"}],\"summary\":\"Christ goes up to the feast of the tabernacles. He teaches in the temple.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":6,\"label\":\"John 6\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":8,\"label\":\"John 8\"}}]]\n"])</script></body></html>
