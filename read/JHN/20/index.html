.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">20</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s resurrection and manifestation to his disciples.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And on the first day of the week, Mary Magdalen cometh early, when it was yet dark, unto the sepulchre: and she saw the stone taken away from the sepulchre.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>She ran therefore and cometh to Simon Peter and to the other disciple whom Jesus loved and saith to them: They have taken away the Lord out of the sepulchre: and we know not where they have laid him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Peter therefore went out, and that other disciple: and they came to the sepulchre.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And they both ran together: and that other disciple did outrun Peter and came first to the sepulchre.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And when he stooped down, he saw the linen cloths lying: but yet he went not in.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then cometh Simon Peter, following him, and went into the sepulchre: and saw the linen cloths lying,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And the napkin that had been about his head, not lying with the linen cloths, but apart, wrapped up into one place.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Then that other disciple also went in, who came first to the sepulchre: and he saw and believed.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For as yet they knew not the scripture, that he must rise again from the dead.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The disciples therefore departed again to their home.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>But Mary stood at the sepulchre without, weeping. Now as she was weeping, she stooped down and looked into the sepulchre,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And she saw two angels in white, sitting, one at the head, and one at the feet, where the body of Jesus had been laid.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They say to her: Woman, why weepest thou? She saith to them: Because they have taken away my Lord: and I know not where they have laid him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>When she had thus said, she turned herself back and saw Jesus standing: and she knew not that it was Jesus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Jesus saith to her: Woman, why weepest thou? Whom seekest thou? She, thinking that it was the gardener, saith to him: Sir, if thou hast taken him hence, tell me where thou hast laid him: and I will take him away.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Jesus saith to her: Mary. She turning, saith to him: Rabboni (which is to say, Master).</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Jesus saith to her: Do not touch me: for I am not yet ascended to my Father. But go to my brethren and say to them: I ascend to my Father and to your Father, to my God and to your God.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Mary Magdalen cometh and telleth the disciples: I have seen the Lord; and these things he said to me.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Now when it was late the same day, the first of the week, and the doors were shut, where the disciples were gathered together, for fear of the Jews, Jesus came and stood in the midst and said to them: Peace be to you.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And when he had said this, he shewed them his hands and his side. The disciples therefore were glad, when they saw the Lord.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>He said therefore to them again: Peace be to you. As the Father hath sent me, I also send you.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>When he had said this, he breathed on them; and he said to them: Receive ye the Holy Ghost.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Whose sins you shall forgive, they are forgiven them: and whose sins you shall retain, they are retained.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Now Thomas, one of the twelve, who is called Didymus, was not with them when Jesus came.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The other disciples therefore said to him: We have seen the Lord. But he said to them: Except I shall see in his hands the print of the nails and put my finger into the place of the nails and put my hand into his side, I will not believe.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And after eight days, again his disciples were within, and Thomas with them. Jesus cometh, the doors being shut, and stood in the midst and said: Peace be to you.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Then he said to Thomas: Put in thy finger hither and see my hands. And bring hither thy hand and put it into my side. And be not faithless, but believing.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Thomas answered and said to him: My Lord and my God.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Jesus saith to him: Because thou hast seen me, Thomas, thou hast believed: blessed are they that have not seen and have believed.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Many other signs also did Jesus in the sight of his disciples, which are not written in this book.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>But these are written, that you may believe that Jesus is the Christ, the Son of God: and that believing, you may have life in his name.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Una autem sabbati, Maria Magdalene venit mane, cum adhuc tenebræ essent, ad monumentum : et vidit lapidem sublatum a monumento.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Cucurrit ergo, et venit ad Simonem Petrum, et ad alium discipulum, quem amabat Jesus, et dicit illis : Tulerunt Dominum de monumento, et nescimus ubi posuerunt eum.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Exiit ergo Petrus, et ille alius discipulus, et venerunt ad monumentum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Currebant autem duo simul, et ille alius discipulus præcucurrit citius Petro, et venit primus ad monumentum.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et cum se inclinasset, vidit posita linteamina : non tamen introivit.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Venit ergo Simon Petrus sequens eum, et introivit in monumentum, et vidit linteamina posita,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et sudarium, quod fuerat super caput ejus, non cum linteaminibus positum, sed separatim involutum in unum locum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Tunc ergo introivit et ille discipulus qui venerat primus ad monumentum : et vidit, et credidit :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>nondum enim sciebant Scripturam, quia oportebat eum a mortuis resurgere.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Abierunt ergo iterum discipuli ad semetipsos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Maria autem stabat ad monumentum foris, plorans. Dum ergo fleret, inclinavit se, et prospexit in monumentum :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>et vidit duos angelos in albis sedentes, unum ad caput, et unum ad pedes, ubi positum fuerat corpus Jesu.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Dicunt ei illi : Mulier, quid ploras ? Dicit eis : Quia tulerunt Dominum meum : et nescio ubi posuerunt eum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hæc cum dixisset, conversa est retrorsum, et vidit Jesum stantem : et non sciebat quia Jesus est.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dicit ei Jesus : Mulier, quid ploras ? quem quæris ? Illa existimans quia hortulanus esset, dicit ei : Domine, si tu sustulisti eum, dicito mihi ubi posuisti eum, et ego eum tollam.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dicit ei Jesus : Maria. Conversa illa, dicit ei : Rabboni (quod dicitur Magister).</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dicit ei Jesus : Noli me tangere, nondum enim ascendi ad Patrem meum : vade autem ad fratres meos, et dic eis : Ascendo ad Patrem meum, et Patrem vestrum, Deum meum, et Deum vestrum.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Venit Maria Magdalene annuntians discipulis : Quia vidi Dominum, et hæc dixit mihi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cum ergo sero esset die illo, una sabbatorum, et fores essent clausæ, ubi erant discipuli congregati propter metum Judæorum : venit Jesus, et stetit in medio, et dixit eis : Pax vobis.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et cum hoc dixisset, ostendit eis manus et latus. Gavisi sunt ergo discipuli, viso Domino.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dixit ergo eis iterum : Pax vobis. Sicut misit me Pater, et ego mitto vos.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hæc cum dixisset, insufflavit, et dixit eis : Accipite Spiritum Sanctum :</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>quorum remiseritis peccata, remittuntur eis : et quorum retinueritis, retenta sunt.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Thomas autem unus ex duodecim, qui dicitur Didymus, non erat cum eis quando venit Jesus.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixerunt ergo ei alii discipuli : Vidimus Dominum. Ille autem dixit eis : Nisi videro in manibus ejus fixuram clavorum, et mittam digitum meum in locum clavorum, et mittam manum meam in latus ejus, non credam.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et post dies octo, iterum erant discipuli ejus intus, et Thomas cum eis. Venit Jesus januis clausis, et stetit in medio, et dixit : Pax vobis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Deinde dicit Thomæ : Infer digitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum : et noli esse incredulus, sed fidelis.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Respondit Thomas, et dixit ei : Dominus meus et Deus meus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dixit ei Jesus : Quia vidisti me, Thoma, credidisti : beati qui non viderunt, et crediderunt.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Multa quidem et alia signa fecit Jesus in conspectu discipulorum suorum, quæ non sunt scripta in libro hoc.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Hæc autem scripta sunt ut credatis, quia Jesus est Christus Filius Dei : et ut credentes, vitam habeatis in nomine ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/19/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 19</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/21/" disciple did outrun Peter and came first to the sepulchre.\"},{\"verse\":5,\"text\":\"And when he stooped down, he saw the linen cloths lying: but yet he went not in.\"},{\"verse\":6,\"text\":\"Then cometh Simon Peter, following him, and went into the sepulchre: and saw the linen cloths lying,\"},{\"verse\":7,\"text\":\"And the napkin that had been about his head, not lying with the linen cloths, but apart, wrapped up into one place.\"},{\"verse\":8,\"text\":\"Then that other disciple also went in, who came first to the sepulchre: and he saw and believed.\"},{\"verse\":9,\"text\":\"For as yet they knew not the scripture, that he must rise again from the dead.\"},{\"verse\":10,\"text\":\"The disciples therefore departed again to their home.\"},{\"verse\":11,\"text\":\"But Mary stood at the sepulchre without, weeping. Now as she was weeping, she stooped down and looked into the sepulchre,\"},{\"verse\":12,\"text\":\"And she saw two angels in white, sitting, one at the head, and one at the feet, where the body of Jesus had been laid.\"},{\"verse\":13,\"text\":\"They say to her: Woman, why weepest thou? She saith to them: Because they have taken away my Lord: and I know not where they have laid him.\"},{\"verse\":14,\"text\":\"When she had thus said, she turned herself back and saw Jesus standing: and she knew not that it was Jesus.\"},{\"verse\":15,\"text\":\"Jesus saith to her: Woman, why weepest thou? Whom seekest thou? She, thinking that it was the gardener, saith to him: Sir, if thou hast taken him hence, tell me where thou hast laid him: and I will take him away.\"},{\"verse\":16,\"text\":\"Jesus saith to her: Mary. She turning, saith to him: Rabboni (which is to say, Master).\"},{\"verse\":17,\"text\":\"Jesus saith to her: Do not touch me: for I am not yet ascended to my Father. But go to my brethren and say to them: I ascend to my Father and to your Father, to my God and to your God.\"},{\"verse\":18,\"text\":\"Mary Magdalen cometh and telleth the disciples: I have seen the Lord; and these things he said to me.\"},{\"verse\":19,\"text\":\"Now when it was late the same day, the first of the week, and the doors were shut, where the disciples were gathered together, for fear of the Jews, Jesus came and stood in the midst and said to them: Peace be to you.\"},{\"verse\":20,\"text\":\"And when he had said this, he shewed them his hands and his side. The disciples therefore were glad, when they saw the Lord.\"},{\"verse\":21,\"text\":\"He said therefore to them again: Peace be to you. As the Father hath sent me, I also send you.\"},{\"verse\":22,\"text\":\"When he had said this, he breathed on them; and he said to them: Receive ye the Holy Ghost.\"},{\"verse\":23,\"text\":\"Whose sins you shall forgive, they are forgiven them: and whose sins you shall retain, they are retained.\"},{\"verse\":24,\"text\":\"Now Thomas, one of the twelve, who is called Didymus, was not with them when Jesus came.\"},{\"verse\":25,\"text\":\"The other disciples therefore said to him: We have seen the Lord. But he said to them: Except I shall see in his hands the print of the nails and put my finger into the place of the nails and put my hand into his side, I will not believe.\"},{\"verse\":26,\"text\":\"And after eight days, again his disciples were within, and Thomas with them. Jesus cometh, the doors being shut, and stood in the midst and said: Peace be to you.\"},{\"verse\":27,\"text\":\"Then he said to Thomas: Put in thy finger hither and see my hands. And bring hither thy hand and put it into my side. And be not faithless, but believing.\"},{\"verse\":28,\"text\":\"Thomas answered and said to him: My Lord and my God.\"},{\"verse\":29,\"text\":\"Jesus saith to him: Because thou hast seen me, Thomas, thou hast believed: blessed are they that have not seen and have believed.\"},{\"verse\":30,\"text\":\"Many other signs also did Jesus in the sight of his disciples, which are not written in this book.\"},{\"verse\":31,\"text\":\"But these are written, that you may believe that Jesus is the Christ, the Son of God: and that believing, you may have life in his name.\"}],\"vul\":[{\"verse\":1,\"text\":\"Una autem sabbati, Maria Magdalene venit mane, cum adhuc tenebræ essent, ad monumentum : et vidit lapidem sublatum a monumento.\"},{\"verse\":2,\"text\":\"Cucurrit ergo, et venit ad Simonem Petrum, et ad alium discipulum, quem amabat Jesus, et dicit illis : Tulerunt Dominum de monumento, et nescimus ubi posuerunt eum.\"},{\"verse\":3,\"text\":\"Exiit ergo Petrus, et ille alius discipulus, et venerunt ad monumentum.\"},{\"verse\":4,\"text\":\"Currebant autem duo simul, et ille alius discipulus præcucurrit citius Petro, et venit primus ad monumentum.\"},{\"verse\":5,\"text\":\"Et cum se inclinasset, vidit posita linteamina : non tamen introivit.\"},{\"verse\":6,\"text\":\"Venit ergo Simon Petrus sequens eum, et introivit in monumentum, et vidit linteamina posita,\"},{\"verse\":7,\"text\":\"et sudarium, quod fuerat super caput ejus, non cum linteaminibus positum, sed separatim involutum in unum locum.\"},{\"verse\":8,\"text\":\"Tunc ergo introivit et ille discipulus qui venerat primus ad monumentum : et vidit, et credidit :\"},{\"verse\":9,\"text\":\"nondum enim sciebant Scripturam, quia oportebat eum a mortuis resurgere.\"},{\"verse\":10,\"text\":\"Abierunt ergo iterum discipuli ad semetipsos.\"},{\"verse\":11,\"text\":\"Maria autem stabat ad monumentum foris, plorans. Dum ergo fleret, inclinavit se, et prospexit in monumentum :\"},{\"verse\":12,\"text\":\"et vidit duos angelos in albis sedentes, unum ad caput, et unum ad pedes, ubi positum fuerat corpus Jesu.\"},{\"verse\":13,\"text\":\"Dicunt ei illi : Mulier, quid ploras ? Dicit eis : Quia tulerunt Dominum meum : et nescio ubi posuerunt eum.\"},{\"verse\":14,\"text\":\"Hæc cum dixisset, conversa est retrorsum, et vidit Jesum stantem : et non sciebat quia Jesus est.\"},{\"verse\":15,\"text\":\"Dicit ei Jesus : Mulier, quid ploras ? quem quæris ? Illa existimans quia hortulanus esset, dicit ei : Domine, si tu sustulisti eum, dicito mihi ubi posuisti eum, et ego eum tollam.\"},{\"verse\":16,\"text\":\"Dicit ei Jesus : Maria. Conversa illa, dicit ei : Rabboni (quod dicitur Magister).\"},{\"verse\":17,\"text\":\"Dicit ei Jesus : Noli me tangere, nondum enim ascendi ad Patrem meum : vade autem ad fratres meos, et dic eis : Ascendo ad Patrem meum, et Patrem vestrum, Deum meum, et Deum vestrum.\"},{\"verse\":18,\"text\":\"Venit Maria Magdalene annuntians discipulis : Quia vidi Dominum, et hæc dixit mihi.\"},{\"verse\":19,\"text\":\"Cum ergo sero esset die illo, una sabbatorum, et fores essent clausæ, ubi erant discipuli congregati propter metum Judæorum : venit Jesus, et stetit in medio, et dixit eis : Pax vobis.\"},{\"verse\":20,\"text\":\"Et cum hoc dixisset, ostendit eis manus et latus. Gavisi sunt ergo discipuli, viso Domino.\"},{\"verse\":21,\"text\":\"Dixit ergo eis iterum : Pax vobis. Sicut misit me Pater, et ego mitto vos.\"},{\"verse\":22,\"text\":\"Hæc cum dixisset, insufflavit, et dixit eis : Accipite Spiritum Sanctum :\"},{\"verse\":23,\"text\":\"quorum remiseritis peccata, remittuntur eis : et quorum retinueritis, retenta sunt.\"},{\"verse\":24,\"text\":\"Thomas autem unus ex duodecim, qui dicitur Didymus, non erat cum eis quando venit Jesus.\"},{\"verse\":25,\"text\":\"Dixerunt ergo ei alii discipuli : Vidimus Dominum. Ille autem dixit eis : Nisi videro in manibus ejus fixuram clavorum, et mittam digitum meum in locum clavorum, et mittam manum meam in latus ejus, non credam.\"},{\"verse\":26,\"text\":\"Et post dies octo, iterum erant discipuli ejus intus, et Thomas cum eis. Venit Jesus januis clausis, et stetit in medio, et dixit : Pax vobis.\"},{\"verse\":27,\"text\":\"Deinde dicit Thomæ : Infer digitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum : et noli esse incredulus, sed fidelis.\"},{\"verse\":28,\"text\":\"Respondit Thomas, et dixit ei : Dominus meus et Deus meus.\"},{\"verse\":29,\"text\":\"Dixit ei Jesus : Quia vidisti me, Thoma, credidisti : beati qui non viderunt, et crediderunt.\"},{\"verse\":30,\"text\":\"Multa quidem et alia signa fecit Jesus in conspectu discipulorum suorum, quæ non sunt scripta in libro hoc.\"},{\"verse\":31,\"text\":\"Hæc autem scripta sunt ut credatis, quia Jesus est Christus Filius Dei : et ut credentes, vitam habeatis in nomine ejus.\"}],\"summary\":\"Christ’s resurrection and manifestation to his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":19,\"label\":\"John 19\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":21,\"label\":\"John 21\"}}]]\n"])</script></body></html>
