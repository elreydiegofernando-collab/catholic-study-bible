 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">17</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ’s prayer for his disciples.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>These things Jesus spoke: and lifting up his eyes to heaven, he said: Father, the hour is come. Glorify thy Son, that thy Son may glorify thee.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>As thou hast given him power over all flesh, that he may give eternal life to all whom thou hast given him.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Now this is eternal life: That they may know thee, the only true God, and Jesus Christ, whom thou hast sent.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I have glorified thee on the earth; I have finished the work which thou gavest me to do.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And now glorify thou me, O Father, with thyself, with the glory which I had, before the world was, with thee.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>I have manifested thy name to the men whom thou hast given me out of the world. Thine they were: and to me thou gavest them. And they have kept thy word.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Now they have known that all things which thou hast given me are from thee:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Because the words which thou gavest me, I have given to them. And they have received them and have known in very deed that I came out from thee: and they have believed that thou didst send me.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I pray for them. I pray not for the world, but for them whom thou hast given me: because they are thine.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And all my things are thine, and thine are mine: and I am glorified in them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And now I am not in the world, and these are in the world, and I come to thee. Holy Father, keep them in thy name whom thou hast given me: that they may be one, as we also are.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>While I was with them, I kept them in thy name. Those whom thou gavest me have I kept: and none of them is lost, but the son of perdition: that the scripture may be fulfilled.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And now I come to thee: and these things I speak in the world, that they may have my joy filled in themselves.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I have given them thy word, and the world hath hated them: because they are not of the world, as I also am not of the world.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>I pray not that thou shouldst take them out of the world, but that thou shouldst keep them from evil.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>They are not of the world, as I also am not of the world.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sanctify them in truth. Thy word is truth.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>As thou hast sent me into the world, I also have sent them into the world.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And for them do I sanctify myself, that they also may be sanctified in truth.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And not for them only do I pray, but for them also who through their word shall believe in me.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>That they all may be one, as thou, Father, in me, and I in thee; that they also may be one in us: that the world may believe that thou hast sent me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And the glory which thou hast given me, I have given to them: that, they may be one, as we also are one.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>I in them, and thou in me: that they may be made perfect in one: and the world may know that thou hast sent me and hast loved them, as thou hast also loved me.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Father, I will that where I am, they also whom thou hast given me may be with me: that they may see my glory which thou hast given me, because thou hast loved me before the creation of the world.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Just Father, the world hath not known thee: but I have known thee. And these have known that thou hast sent me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And I have made known thy name to them and will make it known: that the love wherewith thou hast loved me may be in them, and I in them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc locutus est Jesus : et sublevatis oculis in cælum, dixit : Pater, venit hora : clarifica Filium tuum, ut Filius tuus clarificet te :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>sicut dedisti ei potestatem omnis carnis, ut omne, quod dedisti ei, det eis vitam æternam.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Hæc est autem vita æterna : ut cognoscant te, solum Deum verum, et quem misisti Jesum Christum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Ego te clarificavi super terram : opus consummavi, quod dedisti mihi ut faciam :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et nunc clarifica me tu, Pater, apud temetipsum, claritate quam habui, priusquam mundus esset, apud te.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Manifestavi nomen tuum hominibus, quos dedisti mihi de mundo : tui erant, et mihi eos dedisti : et sermonem tuum servaverunt.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nunc cognoverunt quia omnia quæ dedisti mihi, abs te sunt :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>quia verba quæ dedisti mihi, dedi eis : et ipsi acceperunt, et cognoverunt vere quia a te exivi, et crediderunt quia tu me misisti.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ego pro eis rogo ; non pro mundo rogo, sed pro his quos dedisti mihi : quia tui sunt :</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et mea omnia tua sunt, et tua mea sunt : et clarificatus sum in eis.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et jam non sum in mundo, et hi in mundo sunt, et ego ad te venio. Pater sancte, serva eos in nomine tuo, quos dedisti mihi : ut sint unum, sicut et nos.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Cum essem cum eis, ego servabam eos in nomine tuo. Quos dedisti mihi, custodivi : et nemo ex eis periit, nisi filius perditionis, ut Scriptura impleatur.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc autem ad te venio : et hæc loquor in mundo, ut habeant gaudium meum impletum in semetipsis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego dedi eis sermonem tuum, et mundus eos odio habuit, quia non sunt de mundo, sicut et ego non sum de mundo.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Non rogo ut tollas eos de mundo, sed ut serves eos a malo.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>De mundo non sunt, sicut et ego non sum de mundo.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Sanctifica eos in veritate. Sermo tuus veritas est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Sicut tu me misisti in mundum, et ego misi eos in mundum :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et pro eis ego sanctifico meipsum : ut sint et ipsi sanctificati in veritate.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Non pro eis autem rogo tantum, sed et pro eis qui credituri sunt per verbum eorum in me :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>ut omnes unum sint, sicut tu Pater in me, et ego in te, ut et ipsi in nobis unum sint : ut credat mundus, quia tu me misisti.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et ego claritatem, quam dedisti mihi, dedi eis : ut sint unum, sicut et nos unum sumus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Ego in eis, et tu in me : ut sint consummati in unum : et cognoscat mundus quia tu me misisti, et dilexisti eos, sicut et me dilexisti.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Pater, quos dedisti mihi, volo ut ubi sum ego, et illi sint mecum : ut videant claritatem meam, quam dedisti mihi : quia dilexisti me ante constitutionem mundi.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Pater juste, mundus te non cognovit, ego autem te cognovi : et hi cognoverunt, quia tu me misisti.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et notum feci eis nomen tuum, et notum faciam : ut dilectio, qua dilexisti me, in ipsis sit, et ego in ipsis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/16/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 16</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/18/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 18</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->17<!-- --> of <!-- -->21<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: John 16" class="inline-flex h-12 w-14 shrink-0 items-center justify-cen ipt>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JHN.17\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":17,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"These things Jesus spoke: and lifting up his eyes to heaven, he said: Father, the hour is come. Glorify thy Son, that thy Son may glorify thee.\"},{\"verse\":2,\"text\":\"As thou hast given him power over all flesh, that he may give eternal life to all whom thou hast given him.\"},{\"verse\":3,\"text\":\"Now this is eternal life: That they may know thee, the only true God, and Jesus Christ, whom thou hast sent.\"},{\"verse\":4,\"text\":\"I have glorified thee on the earth; I have finished the work which thou gavest me to do.\"},{\"verse\":5,\"text\":\"And now glorify thou me, O Father, with thyself, with the glory which I had, before the world was, with thee.\"},{\"verse\":6,\"text\":\"I have manifested thy name to the men whom thou hast given me out of the world. Thine they were: and to me thou gavest them. And they have kept thy word.\"},{\"verse\":7,\"text\":\"Now they have known that all things which thou hast given me are from thee:\"},{\"verse\":8,\"text\":\"Because the words which thou gavest me, I have given to them. And they have received them and have known in very deed that I came out from thee: and they have believed that thou didst send me.\"},{\"verse\":9,\"text\":\"I pray for them. I pray not for the world, but for them whom thou hast given me: because they are thine.\"},{\"verse\":10,\"text\":\"And all my things are thine, and thine are mine: and I am glorified in them.\"},{\"verse\":11,\"text\":\"And now I am not in the world, and these are in the world, and I come to thee. Holy Father, keep them in thy name whom thou hast given me: that they may be one, as we also are.\"},{\"verse\":12,\"text\":\"While I was with them, I kept them in thy name. Those whom thou gavest me have I kept: and none of them is lost, but the son of perdition: that the scripture may be fulfilled.\"},{\"verse\":13,\"text\":\"And now I come to thee: and these things I speak in the world, that they may have my joy filled in themselves.\"},{\"verse\":14,\"text\":\"I have given them thy word, and the world hath hated them: because they are not of the world, as I also am not of the world.\"},{\"verse\":15,\"text\":\"I pray not that thou shouldst take them out of the world, but that thou shouldst keep them from evil.\"},{\"verse\":16,\"text\":\"They are not of the world, as I also am not of the world.\"},{\"verse\":17,\"text\":\"Sanctify them in truth. Thy word is truth.\"},{\"verse\":18,\"text\":\"As thou hast sent me into the world, I also have sent them into the world.\"},{\"verse\":19,\"text\":\"And for them do I sanctify myself, that they also may be sanctified in truth.\"},{\"verse\":20,\"text\":\"And not for them only do I pray, but for them also who through their word shall believe in me.\"},{\"verse\":21,\"text\":\"That they all may be one, as thou, Father, in me, and I in thee; that they also may be one in us: that the world may believe that thou hast sent me.\"},{\"verse\":22,\"text\":\"And the glory which thou hast given me, I have given to them: that, they may be one, as we also are one.\"},{\"verse\":23,\"text\":\"I in them, and thou in me: that they may be made perfect in one: and the world may know that thou hast sent me and hast loved them, as thou hast also loved me.\"},{\"verse\":24,\"text\":\"Father, I will that where I am, they also whom thou hast given me may be with me: that they may see my glory which thou hast given me, because thou hast loved me before the creation of the world.\"},{\"verse\":25,\"text\":\"Just Father, the world hath not known thee: but I have known thee. And these have known that thou hast sent me.\"},{\"verse\":26,\"text\":\"And I have made known thy name to them and will make it known: that the love wherewith thou hast loved me may be in them, and I in them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc locutus est Jesus : et sublevatis oculis in cælum, dixit : Pater, venit hora : clarifica Filium tuum, ut Filius tuus clarificet te :\"},{\"verse\":2,\"text\":\"sicut dedisti ei potestatem omnis carnis, ut omne, quod dedisti ei, det eis vitam æternam.\"},{\"verse\":3,\"text\":\"Hæc est autem vita æterna : ut cognoscant te, solum Deum verum, et quem misisti Jesum Christum.\"},{\"verse\":4,\"text\":\"Ego te clarificavi super terram : opus consummavi, quod dedisti mihi ut faciam :\"},{\"verse\":5,\"text\":\"et nunc clarifica me tu, Pater, apud temetipsum, claritate quam habui, priusquam mundus esset, apud te.\"},{\"verse\":6,\"text\":\"Manifestavi nomen tuum hominibus, quos dedisti mihi de mundo : tui erant, et mihi eos dedisti : et sermonem tuum servaverunt.\"},{\"verse\":7,\"text\":\"Nunc cognoverunt quia omnia quæ dedisti mihi, abs te sunt :\"},{\"verse\":8,\"text\":\"quia verba quæ dedisti mihi, dedi eis : et ipsi acceperunt, et cognoverunt vere quia a te exivi, et crediderunt quia tu me misisti.\"},{\"verse\":9,\"text\":\"Ego pro eis rogo ; non pro mundo rogo, sed pro his quos dedisti mihi : quia tui sunt :\"},{\"verse\":10,\"text\":\"et mea omnia tua sunt, et tua mea sunt : et clarificatus sum in eis.\"},{\"verse\":11,\"text\":\"Et jam non sum in mundo, et hi in mundo sunt, et ego ad te venio. Pater sancte, serva eos in nomine tuo, quos dedisti mihi : ut sint unum, sicut et nos.\"},{\"verse\":12,\"text\":\"Cum essem cum eis, ego servabam eos in nomine tuo. Quos dedisti mihi, custodivi : et nemo ex eis periit, nisi filius perditionis, ut Scriptura impleatur.\"},{\"verse\":13,\"text\":\"Nunc autem ad te venio : et hæc loquor in mundo, ut habeant gaudium meum impletum in semetipsis.\"},{\"verse\":14,\"text\":\"Ego dedi eis sermonem tuum, et mundus eos odio habuit, quia non sunt de mundo, sicut et ego non sum de mundo.\"},{\"verse\":15,\"text\":\"Non rogo ut tollas eos de mundo, sed ut serves eos a malo.\"},{\"verse\":16,\"text\":\"De mundo non sunt, sicut et ego non sum de mundo.\"},{\"verse\":17,\"text\":\"Sanctifica eos in veritate. Sermo tuus veritas est.\"},{\"verse\":18,\"text\":\"Sicut tu me misisti in mundum, et ego misi eos in mundum :\"},{\"verse\":19,\"text\":\"et pro eis ego sanctifico meipsum : ut sint et ipsi sanctificati in veritate.\"},{\"verse\":20,\"text\":\"Non pro eis autem rogo tantum, sed et pro eis qui credituri sunt per verbum eorum in me :\"},{\"verse\":21,\"text\":\"ut omnes unum sint, sicut tu Pater in me, et ego in te, ut et ipsi in nobis unum sint : ut credat mundus, quia tu me misisti.\"},{\"verse\":22,\"text\":\"Et ego claritatem, quam dedisti mihi, dedi eis : ut sint unum, sicut et nos unum sumus.\"},{\"verse\":23,\"text\":\"Ego in eis, et tu in me : ut sint consummati in unum : et cognoscat mundus quia tu me misisti, et dilexisti eos, sicut et me dilexisti.\"},{\"verse\":24,\"text\":\"Pater, quos dedisti mihi, volo ut ubi sum ego, et illi sint mecum : ut videant claritatem meam, quam dedisti mihi : quia dilexisti me ante constitutionem mundi.\"},{\"verse\":25,\"text\":\"Pater juste, mundus te non cognovit, ego autem te cognovi : et hi cognoverunt, quia tu me misisti.\"},{\"verse\":26,\"text\":\"Et notum feci eis nomen tuum, et notum faciam : ut dilectio, qua dilexisti me, in ipsis sit, et ego in ipsis.\"}],\"summary\":\"Christ’s prayer for his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":16,\"label\":\"John 16\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":18,\"label\":\"John 18\"}}]]\n"])</script></body></html>
