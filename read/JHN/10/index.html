lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ is the door and the good shepherd. He and his Father are one.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Amen, amen, I say to you: He that entereth not by the door into the sheepfold but climbeth up another way, the same is a thief and a robber.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>But he that entereth in by the door is the shepherd of the sheep.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>To him the porter openeth: and the sheep hear his voice. And he calleth his own sheep by name and leadeth them out.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And when he hath let out his own sheep, he goeth before them: and the sheep follow him, because they know his voice.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But a stranger they follow not, but fly from him, because they know not the voice of strangers.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>This proverb Jesus spoke to them. But they understood not what he spoke to them.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Jesus therefore said to them again: Amen, amen, I say to you, I am the door of the sheep.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>All others, as many as have come, are thieves and robbers: and the sheep heard them not.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>I am the door. By me, if any man enter in, he shall be saved: and he shall go in and go out, and shall find pastures.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The thief cometh not, but for to steal and to kill and to destroy. I am come that they may have life and may have it more abundantly.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I am the good shepherd. The good shepherd giveth his life for his sheep.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But the hireling and he that is not the shepherd, whose own the sheep are not, seeth the wolf coming and leaveth the sheep and flieth: and the wolf catcheth and scattereth the sheep,</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the hireling flieth, because he is a hireling: and he hath no care for the sheep.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>I am the good shepherd: and I know mine, and mine know me.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>As the Father knoweth me, and I know the Father: and I lay down my life for my sheep.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And other sheep I have that are not of this fold: them also I must bring. And they shall hear my voice: And there shall be one fold and one shepherd.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Therefore doth the Father love me: because I lay down my life, that I may take it again.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>No man taketh it away from me: but I lay it down of myself. And I have power to lay it down: and I have power to take it up again. This commandment have I received of my Father.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>A dissension rose again among the Jews for these words.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And many of them said: He hath a devil and is mad. Why hear you him?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Others said: These are not the words of one that hath a devil. Can a devil open the eyes of the blind?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And it was the feast of the dedication at Jerusalem: and it was winter.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And Jesus walked in the temple, in Solomon’s porch.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The Jews therefore came round about him and said to him: How long dost thou hold our souls in suspense? If thou be the Christ, tell us plainly.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Jesus answered them: I speak to you, and you believe not: the works that I do in the name of my Father, they give testimony of me.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>But you do not believe, because you are not of my sheep.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>My sheep hear my voice. And I know them: and they follow me.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And I give them life everlasting: and they shall not perish for ever. And no man shall pluck them out of my hand.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>That which my Father hath given me is greater than all: and no one can snatch them out of the hand of my Father.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I and the Father are one.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The Jews then took up stones to stone him.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Jesus answered them: Many good works I have shewed you from my Father. For which of those works do you stone me?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The Jews answered him: For a good work we stone thee not, but for blasphemy: and because that thou, being a man, makest thyself God.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jesus answered them: Is it not written in your law: I said, you are gods?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>If he called them gods to whom the word of God was spoken; and the scripture cannot be broken:</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Do you say of him whom the Father hath sanctified and sent into the world: Thou blasphemest; because I said: I am the Son of God?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>If I do not the works of my Father, believe me not.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>But if I do, though you will not believe me, believe the works: that you may know and believe that the Father is in me and I in the Father.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>They sought therefore to take him: and he escaped out of their hands.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And he went again beyond the Jordan, into that place where John was baptizing first. And there he abode.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And many resorted to him: and they said: John indeed did no sign.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>But all things whatsoever John said of this man were true. And many believed in him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Amen, amen dico vobis : qui non intrat per ostium in ovile ovium, sed ascendit aliunde, ille fur est et latro.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui autem intrat per ostium, pastor est ovium.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Huic ostiarius aperit, et oves vocem ejus audiunt, et proprias oves vocat nominatim, et educit eas.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et cum proprias oves emiserit, ante eas vadit : et oves illum sequuntur, quia sciunt vocem ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Alienum autem non sequuntur, sed fugiunt ab eo : quia non noverunt vocem alienorum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hoc proverbium dixit eis Jesus : illi autem non cognoverunt quid loqueretur eis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dixit ergo eis iterum Jesus : Amen, amen dico vobis, quia ego sum ostium ovium.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Omnes quotquot venerunt, fures sunt, et latrones, et non audierunt eos oves.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ego sum ostium. Per me si quis introierit, salvabitur : et ingredietur, et egredietur, et pascua inveniet.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Fur non venit nisi ut furetur, et mactet, et perdat. Ego veni ut vitam habeant, et abundantius habeant.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Mercenarius autem, et qui non est pastor, cujus non sunt oves propriæ, videt lupum venientem, et dimittit oves, et fugit : et lupus rapit, et dispergit oves ;</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>mercenarius autem fugit, quia mercenarius est, et non pertinet ad eum de ovibus.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ego sum pastor bonus : et cognosco meas, et cognoscunt me meæ.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Sicut novit me Pater, et ego agnosco Patrem : et animam meam pono pro ovibus meis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et alias oves habeo, quæ non sunt ex hoc ovili : et illas oportet me adducere, et vocem meam audient, et fiet unum ovile et unus pastor.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Propterea me diligit Pater : quia ego pono animam meam, ut iterum sumam eam.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Nemo tollit eam a me : sed ego pono eam a meipso, et potestatem habeo ponendi eam, et potestatem habeo iterum sumendi eam. Hoc mandatum accepi a Patre meo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dissensio iterum facta est inter Judæos propter sermones hos.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dicebant autem multi ex ipsis : Dæmonium habet, et insanit : quid eum auditis ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Alii dicebant : Hæc verba non sunt dæmonium habentis : numquid dæmonium potest cæcorum oculos aperire ?</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Facta sunt autem Encænia in Jerosolymis, et hiems erat.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et ambulabat Jesus in templo, in porticu Salomonis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Circumdederunt ergo eum Judæi, et dicebant ei : Quousque animam nostram tollis ? si tu es Christus, dic nobis palam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Respondit eis Jesus : Loquor vobis, et non creditis : opera quæ ego facio in nomine Patris mei, hæc testimonium perhibent de me :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>sed vos non creditis, quia non estis ex ovibus meis.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Oves meæ vocem meam audiunt, et ego cognosco eas, et sequuntur me :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>et ego vitam æternam do eis, et non peribunt in æternum, et non rapiet eas quisquam de manu mea.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Pater meus quod dedit mihi, majus omnibus est : et nemo potest rapere de manu Patris mei.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Ego et Pater unum sumus.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Sustulerunt ergo lapides Judæi, ut lapidarent eum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Respondit eis Jesus : Multa bona opera ostendi vobis ex Patre meo : propter quod eorum opus me lapidatis ?</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Responderunt ei Judæi : De bono opere non lapidamus te, sed de blasphemia ; et quia tu homo cum sis, facis teipsum Deum.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Respondit eis Jesus : Nonne scriptum est in lege vestra, Quia ego dixi : Dii estis ?</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Si illos dixit deos, ad quos sermo Dei factus est, et non potest solvi Scriptura :</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>quem Pater sanctificavit, et misit in mundum vos dicitis : Quia blasphemas, quia dixi : Filius Dei sum ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Si non facio opera Patris mei, nolite credere mihi.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Si autem facio : etsi mihi non vultis credere, operibus credite, ut cognoscatis, et credatis quia Pater in me est, et ego in Patre.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Quærebant ergo eum apprehendere : et exivit de manibus eorum.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et abiit iterum trans Jordanem, in eum locum ubi erat Joannes baptizans primum, et mansit illic ;</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>et multi venerunt ad eum, et dicebant : Quia Joannes quidem signum fecit nullum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Omnia autem quæcumque dixit Joannes de hoc, vera erant. Et multi crediderunt in eum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read \"verse\":1,\"text\":\"Amen, amen, I say to you: He that entereth not by the door into the sheepfold but climbeth up another way, the same is a thief and a robber.\"},{\"verse\":2,\"text\":\"But he that entereth in by the door is the shepherd of the sheep.\"},{\"verse\":3,\"text\":\"To him the porter openeth: and the sheep hear his voice. And he calleth his own sheep by name and leadeth them out.\"},{\"verse\":4,\"text\":\"And when he hath let out his own sheep, he goeth before them: and the sheep follow him, because they know his voice.\"},{\"verse\":5,\"text\":\"But a stranger they follow not, but fly from him, because they know not the voice of strangers.\"},{\"verse\":6,\"text\":\"This proverb Jesus spoke to them. But they understood not what he spoke to them.\"},{\"verse\":7,\"text\":\"Jesus therefore said to them again: Amen, amen, I say to you, I am the door of the sheep.\"},{\"verse\":8,\"text\":\"All others, as many as have come, are thieves and robbers: and the sheep heard them not.\"},{\"verse\":9,\"text\":\"I am the door. By me, if any man enter in, he shall be saved: and he shall go in and go out, and shall find pastures.\"},{\"verse\":10,\"text\":\"The thief cometh not, but for to steal and to kill and to destroy. I am come that they may have life and may have it more abundantly.\"},{\"verse\":11,\"text\":\"I am the good shepherd. The good shepherd giveth his life for his sheep.\"},{\"verse\":12,\"text\":\"But the hireling and he that is not the shepherd, whose own the sheep are not, seeth the wolf coming and leaveth the sheep and flieth: and the wolf catcheth and scattereth the sheep,\"},{\"verse\":13,\"text\":\"And the hireling flieth, because he is a hireling: and he hath no care for the sheep.\"},{\"verse\":14,\"text\":\"I am the good shepherd: and I know mine, and mine know me.\"},{\"verse\":15,\"text\":\"As the Father knoweth me, and I know the Father: and I lay down my life for my sheep.\"},{\"verse\":16,\"text\":\"And other sheep I have that are not of this fold: them also I must bring. And they shall hear my voice: And there shall be one fold and one shepherd.\"},{\"verse\":17,\"text\":\"Therefore doth the Father love me: because I lay down my life, that I may take it again.\"},{\"verse\":18,\"text\":\"No man taketh it away from me: but I lay it down of myself. And I have power to lay it down: and I have power to take it up again. This commandment have I received of my Father.\"},{\"verse\":19,\"text\":\"A dissension rose again among the Jews for these words.\"},{\"verse\":20,\"text\":\"And many of them said: He hath a devil and is mad. Why hear you him?\"},{\"verse\":21,\"text\":\"Others said: These are not the words of one that hath a devil. Can a devil open the eyes of the blind?\"},{\"verse\":22,\"text\":\"And it was the feast of the dedication at Jerusalem: and it was winter.\"},{\"verse\":23,\"text\":\"And Jesus walked in the temple, in Solomon’s porch.\"},{\"verse\":24,\"text\":\"The Jews therefore came round about him and said to him: How long dost thou hold our souls in suspense? If thou be the Christ, tell us plainly.\"},{\"verse\":25,\"text\":\"Jesus answered them: I speak to you, and you believe not: the works that I do in the name of my Father, they give testimony of me.\"},{\"verse\":26,\"text\":\"But you do not believe, because you are not of my sheep.\"},{\"verse\":27,\"text\":\"My sheep hear my voice. And I know them: and they follow me.\"},{\"verse\":28,\"text\":\"And I give them life everlasting: and they shall not perish for ever. And no man shall pluck them out of my hand.\"},{\"verse\":29,\"text\":\"That which my Father hath given me is greater than all: and no one can snatch them out of the hand of my Father.\"},{\"verse\":30,\"text\":\"I and the Father are one.\"},{\"verse\":31,\"text\":\"The Jews then took up stones to stone him.\"},{\"verse\":32,\"text\":\"Jesus answered them: Many good works I have shewed you from my Father. For which of those works do you stone me?\"},{\"verse\":33,\"text\":\"The Jews answered him: For a good work we stone thee not, but for blasphemy: and because that thou, being a man, makest thyself God.\"},{\"verse\":34,\"text\":\"Jesus answered them: Is it not written in your law: I said, you are gods?\"},{\"verse\":35,\"text\":\"If he called them gods to whom the word of God was spoken; and the scripture cannot be broken:\"},{\"verse\":36,\"text\":\"Do you say of him whom the Father hath sanctified and sent into the world: Thou blasphemest; because I said: I am the Son of God?\"},{\"verse\":37,\"text\":\"If I do not the works of my Father, believe me not.\"},{\"verse\":38,\"text\":\"But if I do, though you will not believe me, believe the works: that you may know and believe that the Father is in me and I in the Father.\"},{\"verse\":39,\"text\":\"They sought therefore to take him: and he escaped out of their hands.\"},{\"verse\":40,\"text\":\"And he went again beyond the Jordan, into that place where John was baptizing first. And there he abode.\"},{\"verse\":41,\"text\":\"And many resorted to him: and they said: John indeed did no sign.\"},{\"verse\":42,\"text\":\"But all things whatsoever John said of this man were true. And many believed in him.\"}],\"vul\":[{\"verse\":1,\"text\":\"Amen, amen dico vobis : qui non intrat per ostium in ovile ovium, sed ascendit aliunde, ille fur est et latro.\"},{\"verse\":2,\"text\":\"Qui autem intrat per ostium, pastor est ovium.\"},{\"verse\":3,\"text\":\"Huic ostiarius aperit, et oves vocem ejus audiunt, et proprias oves vocat nominatim, et educit eas.\"},{\"verse\":4,\"text\":\"Et cum proprias oves emiserit, ante eas vadit : et oves illum sequuntur, quia sciunt vocem ejus.\"},{\"verse\":5,\"text\":\"Alienum autem non sequuntur, sed fugiunt ab eo : quia non noverunt vocem alienorum.\"},{\"verse\":6,\"text\":\"Hoc proverbium dixit eis Jesus : illi autem non cognoverunt quid loqueretur eis.\"},{\"verse\":7,\"text\":\"Dixit ergo eis iterum Jesus : Amen, amen dico vobis, quia ego sum ostium ovium.\"},{\"verse\":8,\"text\":\"Omnes quotquot venerunt, fures sunt, et latrones, et non audierunt eos oves.\"},{\"verse\":9,\"text\":\"Ego sum ostium. Per me si quis introierit, salvabitur : et ingredietur, et egredietur, et pascua inveniet.\"},{\"verse\":10,\"text\":\"Fur non venit nisi ut furetur, et mactet, et perdat. Ego veni ut vitam habeant, et abundantius habeant.\"},{\"verse\":11,\"text\":\"Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis.\"},{\"verse\":12,\"text\":\"Mercenarius autem, et qui non est pastor, cujus non sunt oves propriæ, videt lupum venientem, et dimittit oves, et fugit : et lupus rapit, et dispergit oves ;\"},{\"verse\":13,\"text\":\"mercenarius autem fugit, quia mercenarius est, et non pertinet ad eum de ovibus.\"},{\"verse\":14,\"text\":\"Ego sum pastor bonus : et cognosco meas, et cognoscunt me meæ.\"},{\"verse\":15,\"text\":\"Sicut novit me Pater, et ego agnosco Patrem : et animam meam pono pro ovibus meis.\"},{\"verse\":16,\"text\":\"Et alias oves habeo, quæ non sunt ex hoc ovili : et illas oportet me adducere, et vocem meam audient, et fiet unum ovile et unus pastor.\"},{\"verse\":17,\"text\":\"Propterea me diligit Pater : quia ego pono animam meam, ut iterum sumam eam.\"},{\"verse\":18,\"text\":\"Nemo tollit eam a me : sed ego pono eam a meipso, et potestatem habeo ponendi eam, et potestatem habeo iterum sumendi eam. Hoc mandatum accepi a Patre meo.\"},{\"verse\":19,\"text\":\"Dissensio iterum facta est inter Judæos propter sermones hos.\"},{\"verse\":20,\"text\":\"Dicebant autem multi ex ipsis : Dæmonium habet, et insanit : quid eum auditis ?\"},{\"verse\":21,\"text\":\"Alii dicebant : Hæc verba non sunt dæmonium habentis : numquid dæmonium potest cæcorum oculos aperire ?\"},{\"verse\":22,\"text\":\"Facta sunt autem Encænia in Jerosolymis, et hiems erat.\"},{\"verse\":23,\"text\":\"Et ambulabat Jesus in templo, in porticu Salomonis.\"},{\"verse\":24,\"text\":\"Circumdederunt ergo eum Judæi, et dicebant ei : Quousque animam nostram tollis ? si tu es Christus, dic nobis palam.\"},{\"verse\":25,\"text\":\"Respondit eis Jesus : Loquor vobis, et non creditis : opera quæ ego facio in nomine Patris mei, hæc testimonium perhibent de me :\"},{\"verse\":26,\"text\":\"sed vos non creditis, quia non estis ex ovibus meis.\"},{\"verse\":27,\"text\":\"Oves meæ vocem meam audiunt, et ego cognosco eas, et sequuntur me :\"},{\"verse\":28,\"text\":\"et ego vitam æternam do eis, et non peribunt in æternum, et non rapiet eas quisquam de manu mea.\"},{\"verse\":29,\"text\":\"Pater meus quod dedit mihi, majus omnibus est : et nemo potest rapere de manu Patris mei.\"},{\"verse\":30,\"text\":\"Ego et Pater unum sumus.\"},{\"verse\":31,\"text\":\"Sustulerunt ergo lapides Judæi, ut lapidarent eum.\"},{\"verse\":32,\"text\":\"Respondit eis Jesus : Multa bona opera ostendi vobis ex Patre meo : propter quod eorum opus me lapidatis ?\"},{\"verse\":33,\"text\":\"Responderunt ei Judæi : De bono opere non lapidamus te, sed de blasphemia ; et quia tu homo cum sis, facis teipsum Deum.\"},{\"verse\":34,\"text\":\"Respondit eis Jesus : Nonne scriptum est in lege vestra, Quia ego dixi : Dii estis ?\"},{\"verse\":35,\"text\":\"Si illos dixit deos, ad quos sermo Dei factus est, et non potest solvi Scriptura :\"},{\"verse\":36,\"text\":\"quem Pater sanctificavit, et misit in mundum vos dicitis : Quia blasphemas, quia dixi : Filius Dei sum ?\"},{\"verse\":37,\"text\":\"Si non facio opera Patris mei, nolite credere mihi.\"},{\"verse\":38,\"text\":\"Si autem facio : etsi mihi non vultis credere, operibus credite, ut cognoscatis, et credatis quia Pater in me est, et ego in Patre.\"},{\"verse\":39,\"text\":\"Quærebant ergo eum apprehendere : et exivit de manibus eorum.\"},{\"verse\":40,\"text\":\"Et abiit iterum trans Jordanem, in eum locum ubi erat Joannes baptizans primum, et mansit illic ;\"},{\"verse\":41,\"text\":\"et multi venerunt ad eum, et dicebant : Quia Joannes quidem signum fecit nullum.\"},{\"verse\":42,\"text\":\"Omnia autem quæcumque dixit Joannes de hoc, vera erant. Et multi crediderunt in eum.\"}],\"summary\":\"Christ is the door and the good shepherd. He and his Father are one.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":9,\"label\":\"John 9\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":11,\"label\":\"John 11\"}}]]\n"])</script></body></html>
