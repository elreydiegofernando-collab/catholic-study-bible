1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And the third day, there was a marriage in Cana of Galilee: and the mother of Jesus was there.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Jesus also was invited, and his disciples, to the marriage.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And the wine failing, the mother of Jesus saith to him: They have no wine.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And Jesus saith to her: Woman, what is that to me and to thee? My hour is not yet come.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>His mother saith to the waiters: Whatsoever he shall say to you, do ye.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now there were set there six waterpots of stone, according to the manner of the purifying of the Jews, containing two or three measures apiece.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Jesus saith to them: Fill the waterpots with water. And they filled them up to the brim.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Jesus saith to them: Draw out now and carry to the chief steward of the feast. And they carried it.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And when the chief steward had tasted the water made wine and knew not whence it was, but the waiters knew who had drawn the water: the chief steward calleth the bridegroom,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And saith to him: Every man at first setteth forth good wine, and when men have well drunk, then that which is worse. But thou hast kept the good wine until now.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>This beginning of miracles did Jesus in Cana of Galilee and manifested his glory. And his disciples believed in him.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>After this, he went down to Capharnaum, he and his mother and his brethren and his disciples: and they remained there not many days.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And the pasch of the Jews was at hand: and Jesus went up to Jerusalem.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And he found in the temple them that sold oxen and sheep and doves, and the changers of money sitting.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And when he had made, as it were, a scourge of little cords, he drove them all out of the temple, the sheep also and the oxen: and the money of the changers he poured out, and the tables he overthrew.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And to them that sold doves he said: Take these things hence, and make not the house of my Father a house of traffic.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And his disciples remembered, that it was written: The zeal of thy house hath eaten me up.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Jews, therefore, answered, and said to him: What sign dost thou shew unto us, seeing thou dost these things?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Jesus answered and said to them: Destroy this temple; and in three days I will raise it up.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The Jews then said: Six and forty years was this temple in building; and wilt thou raise it up in three days?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But he spoke of the temple of his body.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>When therefore he was risen again from the dead, his disciples remembered that he had said this: and they believed the scripture and the word that Jesus had said.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Now when he was at Jerusalem, at the pasch, upon the festival day, many believed in his name, seeing his signs which he did.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>But Jesus did not trust himself unto them: for that he knew all men,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And because he needed not that any should give testimony of man: for he knew what was in man.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et die tertia nuptiæ factæ sunt in Cana Galilææ, et erat mater Jesu ibi.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Vocatus est autem et Jesus, et discipuli ejus, ad nuptias.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et deficiente vino, dicit mater Jesu ad eum : Vinum non habent.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dicit ei Jesus : Quid mihi et tibi est, mulier ? nondum venit hora mea.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dicit mater ejus ministris : Quodcumque dixerit vobis, facite.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Erant autem ibi lapideæ hydriæ sex positæ secundum purificationem Judæorum, capientes singulæ metretas binas vel ternas.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Dicit eis Jesus : Implete hydrias aqua. Et impleverunt eas usque ad summum.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et dicit eis Jesus : Haurite nunc, et ferte architriclino. Et tulerunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Ut autem gustavit architriclinus aquam vinum factam, et non sciebat unde esset, ministri autem sciebant, qui hauserant aquam : vocat sponsum architriclinus,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et dicit ei : Omnis homo primum bonum vinum ponit et cum inebriati fuerint, tunc id, quod deterius est. Tu autem servasti bonum vinum usque adhuc.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hoc fecit initium signorum Jesus in Cana Galilææ ; et manifestavit gloriam suam, et crediderunt in eum discipuli ejus.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Post hoc descendit Capharnaum ipse, et mater ejus, et fratres ejus, et discipuli ejus : et ibi manserunt non multis diebus.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et prope erat Pascha Judæorum, et ascendit Jesus Jerosolymam :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>et invenit in templo vendentes boves, et oves, et columbas, et numularios sedentes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Et cum fecisset quasi flagellum de funiculis, omnes ejecit de templo, oves quoque, et boves, et numulariorum effudit æs, et mensas subvertit.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Et his qui columbas vendebant, dixit : Auferte ista hinc, et nolite facere domum patris mei, domum negotiationis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Recordati sunt vero discipuli ejus quia scriptum est : Zelus domus tuæ comedit me.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Responderunt ergo Judæi, et dixerunt ei : Quod signum ostendis nobis, quia hæc facis ?</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Respondit Jesus, et dixit eis : Solvite templum hoc, et in tribus diebus excitabo illud.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Dixerunt ergo Judæi : Quadraginta et sex annis ædificatum est templum hoc, et tu in tribus diebus excitabis illud ?</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Ille autem dicebat de templo corporis sui.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cum ergo resurrexisset a mortuis, recordati sunt discipuli ejus, quia hoc dicebat, et crediderunt scripturæ et sermoni quem dixit Jesus.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Cum autem esset Jerosolymis in Pascha in die festo, multi crediderunt in nomine ejus, videntes signa ejus, quæ faciebat.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ipse autem Jesus non credebat semetipsum eis, eo quod ipse nosset omnes,</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et quia opus ei non erat ut quis testimonium perhiberet de homine : ipse enim sciebat quid esset in homine.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class= [[\"$\",\"$L18\",\"JHN.2\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":2,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"And the third day, there was a marriage in Cana of Galilee: and the mother of Jesus was there.\"},{\"verse\":2,\"text\":\"And Jesus also was invited, and his disciples, to the marriage.\"},{\"verse\":3,\"text\":\"And the wine failing, the mother of Jesus saith to him: They have no wine.\"},{\"verse\":4,\"text\":\"And Jesus saith to her: Woman, what is that to me and to thee? My hour is not yet come.\"},{\"verse\":5,\"text\":\"His mother saith to the waiters: Whatsoever he shall say to you, do ye.\"},{\"verse\":6,\"text\":\"Now there were set there six waterpots of stone, according to the manner of the purifying of the Jews, containing two or three measures apiece.\"},{\"verse\":7,\"text\":\"Jesus saith to them: Fill the waterpots with water. And they filled them up to the brim.\"},{\"verse\":8,\"text\":\"And Jesus saith to them: Draw out now and carry to the chief steward of the feast. And they carried it.\"},{\"verse\":9,\"text\":\"And when the chief steward had tasted the water made wine and knew not whence it was, but the waiters knew who had drawn the water: the chief steward calleth the bridegroom,\"},{\"verse\":10,\"text\":\"And saith to him: Every man at first setteth forth good wine, and when men have well drunk, then that which is worse. But thou hast kept the good wine until now.\"},{\"verse\":11,\"text\":\"This beginning of miracles did Jesus in Cana of Galilee and manifested his glory. And his disciples believed in him.\"},{\"verse\":12,\"text\":\"After this, he went down to Capharnaum, he and his mother and his brethren and his disciples: and they remained there not many days.\"},{\"verse\":13,\"text\":\"And the pasch of the Jews was at hand: and Jesus went up to Jerusalem.\"},{\"verse\":14,\"text\":\"And he found in the temple them that sold oxen and sheep and doves, and the changers of money sitting.\"},{\"verse\":15,\"text\":\"And when he had made, as it were, a scourge of little cords, he drove them all out of the temple, the sheep also and the oxen: and the money of the changers he poured out, and the tables he overthrew.\"},{\"verse\":16,\"text\":\"And to them that sold doves he said: Take these things hence, and make not the house of my Father a house of traffic.\"},{\"verse\":17,\"text\":\"And his disciples remembered, that it was written: The zeal of thy house hath eaten me up.\"},{\"verse\":18,\"text\":\"The Jews, therefore, answered, and said to him: What sign dost thou shew unto us, seeing thou dost these things?\"},{\"verse\":19,\"text\":\"Jesus answered and said to them: Destroy this temple; and in three days I will raise it up.\"},{\"verse\":20,\"text\":\"The Jews then said: Six and forty years was this temple in building; and wilt thou raise it up in three days?\"},{\"verse\":21,\"text\":\"But he spoke of the temple of his body.\"},{\"verse\":22,\"text\":\"When therefore he was risen again from the dead, his disciples remembered that he had said this: and they believed the scripture and the word that Jesus had said.\"},{\"verse\":23,\"text\":\"Now when he was at Jerusalem, at the pasch, upon the festival day, many believed in his name, seeing his signs which he did.\"},{\"verse\":24,\"text\":\"But Jesus did not trust himself unto them: for that he knew all men,\"},{\"verse\":25,\"text\":\"And because he needed not that any should give testimony of man: for he knew what was in man.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et die tertia nuptiæ factæ sunt in Cana Galilææ, et erat mater Jesu ibi.\"},{\"verse\":2,\"text\":\"Vocatus est autem et Jesus, et discipuli ejus, ad nuptias.\"},{\"verse\":3,\"text\":\"Et deficiente vino, dicit mater Jesu ad eum : Vinum non habent.\"},{\"verse\":4,\"text\":\"Et dicit ei Jesus : Quid mihi et tibi est, mulier ? nondum venit hora mea.\"},{\"verse\":5,\"text\":\"Dicit mater ejus ministris : Quodcumque dixerit vobis, facite.\"},{\"verse\":6,\"text\":\"Erant autem ibi lapideæ hydriæ sex positæ secundum purificationem Judæorum, capientes singulæ metretas binas vel ternas.\"},{\"verse\":7,\"text\":\"Dicit eis Jesus : Implete hydrias aqua. Et impleverunt eas usque ad summum.\"},{\"verse\":8,\"text\":\"Et dicit eis Jesus : Haurite nunc, et ferte architriclino. Et tulerunt.\"},{\"verse\":9,\"text\":\"Ut autem gustavit architriclinus aquam vinum factam, et non sciebat unde esset, ministri autem sciebant, qui hauserant aquam : vocat sponsum architriclinus,\"},{\"verse\":10,\"text\":\"et dicit ei : Omnis homo primum bonum vinum ponit et cum inebriati fuerint, tunc id, quod deterius est. Tu autem servasti bonum vinum usque adhuc.\"},{\"verse\":11,\"text\":\"Hoc fecit initium signorum Jesus in Cana Galilææ ; et manifestavit gloriam suam, et crediderunt in eum discipuli ejus.\"},{\"verse\":12,\"text\":\"Post hoc descendit Capharnaum ipse, et mater ejus, et fratres ejus, et discipuli ejus : et ibi manserunt non multis diebus.\"},{\"verse\":13,\"text\":\"Et prope erat Pascha Judæorum, et ascendit Jesus Jerosolymam :\"},{\"verse\":14,\"text\":\"et invenit in templo vendentes boves, et oves, et columbas, et numularios sedentes.\"},{\"verse\":15,\"text\":\"Et cum fecisset quasi flagellum de funiculis, omnes ejecit de templo, oves quoque, et boves, et numulariorum effudit æs, et mensas subvertit.\"},{\"verse\":16,\"text\":\"Et his qui columbas vendebant, dixit : Auferte ista hinc, et nolite facere domum patris mei, domum negotiationis.\"},{\"verse\":17,\"text\":\"Recordati sunt vero discipuli ejus quia scriptum est : Zelus domus tuæ comedit me.\"},{\"verse\":18,\"text\":\"Responderunt ergo Judæi, et dixerunt ei : Quod signum ostendis nobis, quia hæc facis ?\"},{\"verse\":19,\"text\":\"Respondit Jesus, et dixit eis : Solvite templum hoc, et in tribus diebus excitabo illud.\"},{\"verse\":20,\"text\":\"Dixerunt ergo Judæi : Quadraginta et sex annis ædificatum est templum hoc, et tu in tribus diebus excitabis illud ?\"},{\"verse\":21,\"text\":\"Ille autem dicebat de templo corporis sui.\"},{\"verse\":22,\"text\":\"Cum ergo resurrexisset a mortuis, recordati sunt discipuli ejus, quia hoc dicebat, et crediderunt scripturæ et sermoni quem dixit Jesus.\"},{\"verse\":23,\"text\":\"Cum autem esset Jerosolymis in Pascha in die festo, multi crediderunt in nomine ejus, videntes signa ejus, quæ faciebat.\"},{\"verse\":24,\"text\":\"Ipse autem Jesus non credebat semetipsum eis, eo quod ipse nosset omnes,\"},{\"verse\":25,\"text\":\"et quia opus ei non erat ut quis testimonium perhiberet de homine : ipse enim sciebat quid esset in homine.\"}],\"summary\":\"Christ changes water into wine. He casts the sellers out of the temple.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":1,\"label\":\"John 1\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":3,\"label\":\"John 3\"}}]]\n"])</script></body></html>
