<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/34y_gq7h9nrir.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>John 4 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ talks with the Samaritan woman. He heals the ruler’s son.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>When Jesus therefore understood that the Pharisees had heard that Jesus maketh more disciples and baptizeth more than John,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>(Though Jesus himself did not baptize, but his disciples),</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He left Judea and went again into Galilee.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he was of necessity to pass through Samaria.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>He cometh therefore to a city of Samaria, which is called Sichar, near the land which Jacob gave to his son Joseph.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now Jacob’s well was there. Jesus therefore, being wearied with his journey, sat thus on the well. It was about the sixth hour.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>There cometh a woman of Samaria, to draw water. Jesus saith to her: Give me to drink.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For his disciples were gone into the city to buy meats.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then that Samaritan woman saith to him: How dost thou, being a Jew; ask of me to drink, who am a Samaritan woman? For the Jews do not communicate with the Samaritans.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Jesus answered and said to her: If thou didst know the gift of God and who he is that saith to thee: Give me to drink; thou perhaps wouldst have asked of him, and he would have given thee living water.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The woman saith to him: Sir, thou hast nothing wherein to draw, and the well is deep. From whence then hast thou living water?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Art thou greater than our father Jacob, who gave us the well and drank thereof, himself and his children and his cattle?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Jesus answered and said to her: Whosoever drinketh of this water shall thirst again: but he that shall drink of the water that I will give him shall not thirst for ever.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But the water that I will give him shall become in him a fountain of water, springing up into life everlasting.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The woman said to him: Sir, give me this water, that I may not thirst, nor come hither to draw.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Jesus saith to her: Go, call thy husband, and come hither.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The woman answered and said: I have no husband. Jesus said to her: Thou hast said well: I have no husband.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For thou hast had five husbands: and he whom thou now hast is not thy husband. This, thou hast said truly.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The woman saith to him: Sir, I perceive that thou art a prophet.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Our fathers adored on this mountain: and you say that at Jerusalem is the place where men must adore.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Jesus saith to her: Woman, believe me that the hour cometh, when you shall neither on this mountain, nor in Jerusalem, adore the Father.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>You adore that which you know not: we adore that which we know. For salvation is of the Jews.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>But the hour cometh and now is, when the true adorers shall adore the Father in spirit and in truth. For the Father also seeketh such to adore him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>God is a spirit: and they that adore him must adore him in spirit and in truth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The woman saith to him: I know that the Messias cometh (who is called Christ): therefore, when he is come, he will tell us all things.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Jesus saith to her: I am he, who am speaking with thee.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And immediately his disciples came. And they wondered that he talked with the woman. Yet no man said: What seekest thou? Or: Why talkest thou with her?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The woman therefore left her waterpot and went her way into the city and saith to the men there:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Come, and see a man who has told me all things whatsoever I have done. Is not he the Christ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>They went therefore out of the city and came unto him.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>In the mean time, the disciples prayed him, saying: Rabbi, eat.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>But he said to them: I have meat to eat which you know not.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The disciples therefore said one to another: Hath any man brought him to eat?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Jesus saith to them: My meat is to do the will of him that sent me, that I may perfect his work.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Do not you say: There are yet four months, and then the harvest cometh? Behold, I say to you, lift up your eyes, and see the countries. For they are white already to harvest.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>And he that reapeth receiveth wages and gathereth fruit unto life everlasting: that both he that soweth and he that reapeth may rejoice together.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>For in this is the saying true: That it is one man that soweth, and it is another that reapeth.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>I have sent you to reap that in which you did not labour. Others have laboured: and you have entered into their labours.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Now of that city many of the Samaritans believed in him, for the word of the woman giving testimony: He told me all things whatsoever I have done.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>So when the Samaritans were come to him, they desired that he would tarry there. And he abode there two days.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>And many more believed in him, because of his own word.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>And they said to the woman: We now believe, not for thy saying: for we ourselves have heard him and know that this is indeed the Saviour of the world.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Now after two days, he departed thence and went into Galilee.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>For Jesus himself gave testimony that a prophet hath no honour in his own country.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And when he was come into Galilee, the Galileans received him, having seen all the things he had done at Jerusalem on the festival day: for they also went to the festival day.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>He came again therefore into Cana of Galilee, where he made the water wine. And there was a certain ruler, whose son was sick at Capharnaum.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>He having heard that Jesus was come from Judea into Galilee, went to him and prayed him to come down and heal his son: for he was at the point of death.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Jesus therefore said to him: Unless you see signs and wonders, you believe not.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>The ruler saith to him: Lord, come down before that my son die.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Jesus saith to him: Go thy way. Thy son liveth. The man believed the word which Jesus said to him and went his way.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>And as he was going down, his servants met him: and they brought word, saying, that his son lived.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>He asked therefore of them the hour wherein he grew better. And they said to him: Yesterday at the seventh hour, the fever left him.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>The father therefore knew that it was at the same hour that Jesus said to him: Thy son liveth. And himself believed, and his whole house.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>This is again the second miracle that Jesus did, when he was come out of Judea into Galilee.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Ut ergo cognovit Jesus quia audierunt pharisæi quod Jesus plures discipulos facit, et baptizat, quam Joannes</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>(quamquam Jesus non baptizaret, sed discipuli ejus),</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>reliquit Judæam, et abiit iterum in Galilæam.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Oportebat autem eum transire per Samariam.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Venit ergo in civitatem Samariæ, quæ dicitur Sichar, juxta prædium quod dedit Jacob Joseph filio suo.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Erat autem ibi fons Jacob. Jesus ergo fatigatus ex itinere, sedebat sic supra fontem. Hora erat quasi sexta.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Venit mulier de Samaria haurire aquam. Dicit ei Jesus : Da mihi bibere.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>(Discipuli enim ejus abierant in civitatem ut cibos emerent.)</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Dicit ergo ei mulier illa Samaritana : Quomodo tu, Judæus cum sis, bibere a me poscis, quæ sum mulier Samaritana ? non enim coutuntur Judæi Samaritanis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Respondit Jesus, et dixit ei : Si scires donum Dei, et quis est qui dicit tibi : Da mihi bibere, tu forsitan petisses ab eo, et dedisset tibi aquam vivam.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Dicit ei mulier : Domine, neque in quo haurias habes, et puteus altus est : unde ergo habes aquam vivam ?</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Numquid tu major es patre nostro Jacob, qui dedit nobis puteum, et ipse ex eo bibit, et filii ejus, et pecora ejus ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Respondit Jesus, et dixit ei : Omnis qui bibit ex aqua hac, sitiet iterum ; qui autem biberit ex aqua quam ego dabo ei, non sitiet in æternum :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>sed aqua quam ego dabo ei, fiet in eo fons aquæ salientis in vitam æternam.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Dicit ad eum mulier : Domine, da mihi hanc aquam, ut non sitiam, neque veniam huc haurire.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dicit ei Jesus : Vade, voca virum tuum, et veni huc.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Respondit mulier, et dixit : Non habeo virum. Dicit ei Jesus : Bene dixisti, quia non habeo virum ;</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>quinque enim viros habuisti, et nunc, quem habes, non est tuus vir : hoc vere dixisti.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dicit ei mulier : Domine, video quia propheta es tu.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Patres nostri in monte hoc adoraverunt, et vos dicitis, quia Jerosolymis est locus ubi adorare oportet.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Dicit ei Jesus : Mulier, crede mihi, quia venit hora, quando neque in monte hoc, neque in Jerosolymis adorabitis Patrem.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Vos adoratis quod nescitis : nos adoramus quod scimus, quia salus ex Judæis est.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Sed venit hora, et nunc est, quando veri adoratores adorabunt Patrem in spiritu et veritate. Nam et Pater tales quærit, qui adorent eum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Spiritus est Deus : et eos qui adorant eum, in spiritu et veritate oportet adorare.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dicit ei mulier : Scio quia Messias venit (qui dicitur Christus) : cum ergo venerit ille, nobis annuntiabit omnia.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dicit ei Jesus : Ego sum, qui loquor tecum.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et continuo venerunt discipuli ejus, et mirabantur quia cum muliere loquebatur. Nemo tamen dixit : Quid quæris ? aut, Quid loqueris cum ea ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Reliquit ergo hydriam suam mulier, et abiit in civitatem, et dicit illis hominibus :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Venite, et videte hominem qui dixit mihi omnia quæcumque feci : numquid ipse est Christus ?</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Exierunt ergo de civitate et veniebant ad eum.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Interea rogabant eum discipuli, dicentes : Rabbi, manduca.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Ille autem dicit eis : Ego cibum habeo manducare, quem vos nescitis.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Dicebant ergo discipuli ad invicem : Numquid aliquis attulit ei manducare ?</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Dicit eis Jesus : Meus cibus est ut faciam voluntatem ejus qui misit me, ut perficiam opus ejus.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Nonne vos dicitis quod adhuc quatuor menses sunt, et messis venit ? Ecce dico vobis : levate oculos vestros, et videte regiones, quia albæ sunt jam ad messem.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Et qui metit, mercedem accipit, et congregat fructum in vitam æternam : ut et qui seminat, simul gaudeat, et qui metit.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>In hoc enim est verbum verum : quia alius est qui seminat, et alius est qui metit.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Ego misi vos metere quod vos non laborastis : alii laboraverunt, et vos in labores eorum introistis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Ex civitate autem illa multi crediderunt in eum Samaritanorum, propter verbum mulieris testimonium perhibentis : Quia dixit mihi omnia quæcumque feci.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Cum venissent ergo ad illum Samaritani, rogaverunt eum ut ibi maneret. Et mansit ibi duos dies.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Et multo plures crediderunt in eum propter sermonem ejus.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Et mulieri dicebant : Quia jam non propter tuam loquelam credimus : ipsi enim audivimus, et scimus quia hic est vere Salvator mundi.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Post duos autem dies exiit inde, et abiit in Galilæam.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Ipse enim Jesus testimonium perhibuit, quia propheta in sua patria honorem non habet.</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Cum ergo venisset in Galilæam, exceperunt eum Galilæi, cum omnia vidissent quæ fecerat Jerosolymis in die festo : et ipsi enim venerant ad diem festum.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Venit ergo iterum in Cana Galilææ, ubi fecit aquam vinum. Et erat quidam regulus, cujus filius infirmabatur Capharnaum.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Hic cum audisset quia Jesus adveniret a Judæa in Galilæam, abiit ad eum, et rogabat eum ut descenderet, et sanaret filium ejus : incipiebat enim mori.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Dixit ergo Jesus ad eum : Nisi signa et prodigia videritis, non creditis.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Dicit ad eum regulus : Domine, descende priusquam moriatur filius meus.</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Dicit ei Jesus : Vade, filius tuus vivit. Credidit homo sermoni quem dixit ei Jesus, et ibat.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Jam autem eo descendente, servi occurrerunt ei, et nuntiaverunt dicentes, quia filius ejus viveret.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Interrogabat ergo horam ab eis in qua melius habuerit. Et dixerunt ei : Quia heri hora septima reliquit eum febris.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Cognovit ergo pater, quia illa hora erat in qua dixit ei Jesus : Filius tuus vivit ; et credidit ipse et domus ejus tota.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Hoc iterum secundum signum fecit Jesus, cum venisset a Judæa in Galilæam.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 activ eta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.4\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":4,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"When Jesus therefore understood that the Pharisees had heard that Jesus maketh more disciples and baptizeth more than John,\"},{\"verse\":2,\"text\":\"(Though Jesus himself did not baptize, but his disciples),\"},{\"verse\":3,\"text\":\"He left Judea and went again into Galilee.\"},{\"verse\":4,\"text\":\"And he was of necessity to pass through Samaria.\"},{\"verse\":5,\"text\":\"He cometh therefore to a city of Samaria, which is called Sichar, near the land which Jacob gave to his son Joseph.\"},{\"verse\":6,\"text\":\"Now Jacob’s well was there. Jesus therefore, being wearied with his journey, sat thus on the well. It was about the sixth hour.\"},{\"verse\":7,\"text\":\"There cometh a woman of Samaria, to draw water. Jesus saith to her: Give me to drink.\"},{\"verse\":8,\"text\":\"For his disciples were gone into the city to buy meats.\"},{\"verse\":9,\"text\":\"Then that Samaritan woman saith to him: How dost thou, being a Jew; ask of me to drink, who am a Samaritan woman? For the Jews do not communicate with the Samaritans.\"},{\"verse\":10,\"text\":\"Jesus answered and said to her: If thou didst know the gift of God and who he is that saith to thee: Give me to drink; thou perhaps wouldst have asked of him, and he would have given thee living water.\"},{\"verse\":11,\"text\":\"The woman saith to him: Sir, thou hast nothing wherein to draw, and the well is deep. From whence then hast thou living water?\"},{\"verse\":12,\"text\":\"Art thou greater than our father Jacob, who gave us the well and drank thereof, himself and his children and his cattle?\"},{\"verse\":13,\"text\":\"Jesus answered and said to her: Whosoever drinketh of this water shall thirst again: but he that shall drink of the water that I will give him shall not thirst for ever.\"},{\"verse\":14,\"text\":\"But the water that I will give him shall become in him a fountain of water, springing up into life everlasting.\"},{\"verse\":15,\"text\":\"The woman said to him: Sir, give me this water, that I may not thirst, nor come hither to draw.\"},{\"verse\":16,\"text\":\"Jesus saith to her: Go, call thy husband, and come hither.\"},{\"verse\":17,\"text\":\"The woman answered and said: I have no husband. Jesus said to her: Thou hast said well: I have no husband.\"},{\"verse\":18,\"text\":\"For thou hast had five husbands: and he whom thou now hast is not thy husband. This, thou hast said truly.\"},{\"verse\":19,\"text\":\"The woman saith to him: Sir, I perceive that thou art a prophet.\"},{\"verse\":20,\"text\":\"Our fathers adored on this mountain: and you say that at Jerusalem is the place where men must adore.\"},{\"verse\":21,\"text\":\"Jesus saith to her: Woman, believe me that the hour cometh, when you shall neither on this mountain, nor in Jerusalem, adore the Father.\"},{\"verse\":22,\"text\":\"You adore that which you know not: we adore that which we know. For salvation is of the Jews.\"},{\"verse\":23,\"text\":\"But the hour cometh and now is, when the true adorers shall adore the Father in spirit and in truth. For the Father also seeketh such to adore him.\"},{\"verse\":24,\"text\":\"God is a spirit: and they that adore him must adore him in spirit and in truth.\"},{\"verse\":25,\"text\":\"The woman saith to him: I know that the Messias cometh (who is called Christ): therefore, when he is come, he will tell us all things.\"},{\"verse\":26,\"text\":\"Jesus saith to her: I am he, who am speaking with thee.\"},{\"verse\":27,\"text\":\"And immediately his disciples came. And they wondered that he talked with the woman. Yet no man said: What seekest thou? Or: Why talkest thou with her?\"},{\"verse\":28,\"text\":\"The woman therefore left her waterpot and went her way into the city and saith to the men there:\"},{\"verse\":29,\"text\":\"Come, and see a man who has told me all things whatsoever I have done. Is not he the Christ?\"},{\"verse\":30,\"text\":\"They went therefore out of the city and came unto him.\"},{\"verse\":31,\"text\":\"In the mean time, the disciples prayed him, saying: Rabbi, eat.\"},{\"verse\":32,\"text\":\"But he said to them: I have meat to eat which you know not.\"},{\"verse\":33,\"text\":\"The disciples therefore said one to another: Hath any man brought him to eat?\"},{\"verse\":34,\"text\":\"Jesus saith to them: My meat is to do the will of him that sent me, that I may perfect his work.\"},{\"verse\":35,\"text\":\"Do not you say: There are yet four months, and then the harvest cometh? Behold, I say to you, lift up your eyes, and see the countries. For they are white already to harvest.\"},{\"verse\":36,\"text\":\"And he that reapeth receiveth wages and gathereth fruit unto life everlasting: that both he that soweth and he that reapeth may rejoice together.\"},{\"verse\":37,\"text\":\"For in this is the saying true: That it is one man that soweth, and it is another that reapeth.\"},{\"verse\":38,\"text\":\"I have sent you to reap that in which you did not labour. Others have laboured: and you have entered into their labours.\"},{\"verse\":39,\"text\":\"Now of that city many of the Samaritans believed in him, for the word of the woman giving testimony: He told me all things whatsoever I have done.\"},{\"verse\":40,\"text\":\"So when the Samaritans were come to him, they desired that he would tarry there. And he abode there two days.\"},{\"verse\":41,\"text\":\"And many more believed in him, because of his own word.\"},{\"verse\":42,\"text\":\"And they said to the woman: We now believe, not for thy saying: for we ourselves have heard him and know that this is indeed the Saviour of the world.\"},{\"verse\":43,\"text\":\"Now after two days, he departed thence and went into Galilee.\"},{\"verse\":44,\"text\":\"For Jesus himself gave testimony that a prophet hath no honour in his own country.\"},{\"verse\":45,\"text\":\"And when he was come into Galilee, the Galileans received him, having seen all the things he had done at Jerusalem on the festival day: for they also went to the festival day.\"},{\"verse\":46,\"text\":\"He came again therefore into Cana of Galilee, where he made the water wine. And there was a certain ruler, whose son was sick at Capharnaum.\"},{\"verse\":47,\"text\":\"He having heard that Jesus was come from Judea into Galilee, went to him and prayed him to come down and heal his son: for he was at the point of death.\"},{\"verse\":48,\"text\":\"Jesus therefore said to him: Unless you see signs and wonders, you believe not.\"},{\"verse\":49,\"text\":\"The ruler saith to him: Lord, come down before that my son die.\"},{\"verse\":50,\"text\":\"Jesus saith to him: Go thy way. Thy son liveth. The man believed the word which Jesus said to him and went his way.\"},{\"verse\":51,\"text\":\"And as he was going down, his servants met him: and they brought word, saying, that his son lived.\"},{\"verse\":52,\"text\":\"He asked therefore of them the hour wherein he grew better. And they said to him: Yesterday at the seventh hour, the fever left him.\"},{\"verse\":53,\"text\":\"The father therefore knew that it was at the same hour that Jesus said to him: Thy son liveth. And himself believed, and his whole house.\"},{\"verse\":54,\"text\":\"This is again the second miracle that Jesus did, when he was come out of Judea into Galilee.\"}],\"vul\":[{\"verse\":1,\"text\":\"Ut ergo cognovit Jesus quia audierunt pharisæi quod Jesus plures discipulos facit, et baptizat, quam Joannes\"},{\"verse\":2,\"text\":\"(quamquam Jesus non baptizaret, sed discipuli ejus),\"},{\"verse\":3,\"text\":\"reliquit Judæam, et abiit iterum in Galilæam.\"},{\"verse\":4,\"text\":\"Oportebat autem eum transire per Samariam.\"},{\"verse\":5,\"text\":\"Venit ergo in civitatem Samariæ, quæ dicitur Sichar, juxta prædium quod dedit Jacob Joseph filio suo.\"},{\"verse\":6,\"text\":\"Erat autem ibi fons Jacob. Jesus ergo fatigatus ex itinere, sedebat sic supra fontem. Hora erat quasi sexta.\"},{\"verse\":7,\"text\":\"Venit mulier de Samaria haurire aquam. Dicit ei Jesus : Da mihi bibere.\"},{\"verse\":8,\"text\":\"(Discipuli enim ejus abierant in civitatem ut cibos emerent.)\"},{\"verse\":9,\"text\":\"Dicit ergo ei mulier illa Samaritana : Quomodo tu, Judæus cum sis, bibere a me poscis, quæ sum mulier Samaritana ? non enim coutuntur Judæi Samaritanis.\"},{\"verse\":10,\"text\":\"Respondit Jesus, et dixit ei : Si scires donum Dei, et quis est qui dicit tibi : Da mihi bibere, tu forsitan petisses ab eo, et dedisset tibi aquam vivam.\"},{\"verse\":11,\"text\":\"Dicit ei mulier : Domine, neque in quo haurias habes, et puteus altus est : unde ergo habes aquam vivam ?\"},{\"verse\":12,\"text\":\"Numquid tu major es patre nostro Jacob, qui dedit nobis puteum, et ipse ex eo bibit, et filii ejus, et pecora ejus ?\"},{\"verse\":13,\"text\":\"Respondit Jesus, et dixit ei : Omnis qui bibit ex aqua hac, sitiet iterum ; qui autem biberit ex aqua quam ego dabo ei, non sitiet in æternum :\"},{\"verse\":14,\"text\":\"sed aqua quam ego dabo ei, fiet in eo fons aquæ salientis in vitam æternam.\"},{\"verse\":15,\"text\":\"Dicit ad eum mulier : Domine, da mihi hanc aquam, ut non sitiam, neque veniam huc haurire.\"},{\"verse\":16,\"text\":\"Dicit ei Jesus : Vade, voca virum tuum, et veni huc.\"},{\"verse\":17,\"text\":\"Respondit mulier, et dixit : Non habeo virum. Dicit ei Jesus : Bene dixisti, quia non habeo virum ;\"},{\"verse\":18,\"text\":\"quinque enim viros habuisti, et nunc, quem habes, non est tuus vir : hoc vere dixisti.\"},{\"verse\":19,\"text\":\"Dicit ei mulier : Domine, video quia propheta es tu.\"},{\"verse\":20,\"text\":\"Patres nostri in monte hoc adoraverunt, et vos dicitis, quia Jerosolymis est locus ubi adorare oportet.\"},{\"verse\":21,\"text\":\"Dicit ei Jesus : Mulier, crede mihi, quia venit hora, quando neque in monte hoc, neque in Jerosolymis adorabitis Patrem.\"},{\"verse\":22,\"text\":\"Vos adoratis quod nescitis : nos adoramus quod scimus, quia salus ex Judæis est.\"},{\"verse\":23,\"text\":\"Sed venit hora, et nunc est, quando veri adoratores adorabunt Patrem in spiritu et veritate. Nam et Pater tales quærit, qui adorent eum.\"},{\"verse\":24,\"text\":\"Spiritus est Deus : et eos qui adorant eum, in spiritu et veritate oportet adorare.\"},{\"verse\":25,\"text\":\"Dicit ei mulier : Scio quia Messias venit (qui dicitur Christus) : cum ergo venerit ille, nobis annuntiabit omnia.\"},{\"verse\":26,\"text\":\"Dicit ei Jesus : Ego sum, qui loquor tecum.\"},{\"verse\":27,\"text\":\"Et continuo venerunt discipuli ejus, et mirabantur quia cum muliere loquebatur. Nemo tamen dixit : Quid quæris ? aut, Quid loqueris cum ea ?\"},{\"verse\":28,\"text\":\"Reliquit ergo hydriam suam mulier, et abiit in civitatem, et dicit illis hominibus :\"},{\"verse\":29,\"text\":\"Venite, et videte hominem qui dixit mihi omnia quæcumque feci : numquid ipse est Christus ?\"},{\"verse\":30,\"text\":\"Exierunt ergo de civitate et veniebant ad eum.\"},{\"verse\":31,\"text\":\"Interea rogabant eum discipuli, dicentes : Rabbi, manduca.\"},{\"verse\":32,\"text\":\"Ille autem dicit eis : Ego cibum habeo manducare, quem vos nescitis.\"},{\"verse\":33,\"text\":\"Dicebant ergo discipuli ad invicem : Numquid aliquis attulit ei manducare ?\"},{\"verse\":34,\"text\":\"Dicit eis Jesus : Meus cibus est ut faciam voluntatem ejus qui misit me, ut perficiam opus ejus.\"},{\"verse\":35,\"text\":\"Nonne vos dicitis quod adhuc quatuor menses sunt, et messis venit ? Ecce dico vobis : levate oculos vestros, et videte regiones, quia albæ sunt jam ad messem.\"},{\"verse\":36,\"text\":\"Et qui metit, mercedem accipit, et congregat fructum in vitam æternam : ut et qui seminat, simul gaudeat, et qui metit.\"},{\"verse\":37,\"text\":\"In hoc enim est verbum verum : quia alius est qui seminat, et alius est qui metit.\"},{\"verse\":38,\"text\":\"Ego misi vos metere quod vos non laborastis : alii laboraverunt, et vos in labores eorum introistis.\"},{\"verse\":39,\"text\":\"Ex civitate autem illa multi crediderunt in eum Samaritanorum, propter verbum mulieris testimonium perhibentis : Quia dixit mihi omnia quæcumque feci.\"},{\"verse\":40,\"text\":\"Cum venissent ergo ad illum Samaritani, rogaverunt eum ut ibi maneret. Et mansit ibi duos dies.\"},{\"verse\":41,\"text\":\"Et multo plures crediderunt in eum propter sermonem ejus.\"},{\"verse\":42,\"text\":\"Et mulieri dicebant : Quia jam non propter tuam loquelam credimus : ipsi enim audivimus, et scimus quia hic est vere Salvator mundi.\"},{\"verse\":43,\"text\":\"Post duos autem dies exiit inde, et abiit in Galilæam.\"},{\"verse\":44,\"text\":\"Ipse enim Jesus testimonium perhibuit, quia propheta in sua patria honorem non habet.\"},{\"verse\":45,\"text\":\"Cum ergo venisset in Galilæam, exceperunt eum Galilæi, cum omnia vidissent quæ fecerat Jerosolymis in die festo : et ipsi enim venerant ad diem festum.\"},{\"verse\":46,\"text\":\"Venit ergo iterum in Cana Galilææ, ubi fecit aquam vinum. Et erat quidam regulus, cujus filius infirmabatur Capharnaum.\"},{\"verse\":47,\"text\":\"Hic cum audisset quia Jesus adveniret a Judæa in Galilæam, abiit ad eum, et rogabat eum ut descenderet, et sanaret filium ejus : incipiebat enim mori.\"},{\"verse\":48,\"text\":\"Dixit ergo Jesus ad eum : Nisi signa et prodigia videritis, non creditis.\"},{\"verse\":49,\"text\":\"Dicit ad eum regulus : Domine, descende priusquam moriatur filius meus.\"},{\"verse\":50,\"text\":\"Dicit ei Jesus : Vade, filius tuus vivit. Credidit homo sermoni quem dixit ei Jesus, et ibat.\"},{\"verse\":51,\"text\":\"Jam autem eo descendente, servi occurrerunt ei, et nuntiaverunt dicentes, quia filius ejus viveret.\"},{\"verse\":52,\"text\":\"Interrogabat ergo horam ab eis in qua melius habuerit. Et dixerunt ei : Quia heri hora septima reliquit eum febris.\"},{\"verse\":53,\"text\":\"Cognovit ergo pater, quia illa hora erat in qua dixit ei Jesus : Filius tuus vivit ; et credidit ipse et domus ejus tota.\"},{\"verse\":54,\"text\":\"Hoc iterum secundum signum fecit Jesus, cum venisset a Judæa in Galilæam.\"}],\"summary\":\"Christ talks with the Samaritan woman. He heals the ruler’s son.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":3,\"label\":\"John 3\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":5,\"label\":\"John 5\"}}]]\n"])</script></body></html>
