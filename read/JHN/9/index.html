20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">9</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">He gives sight to the man born blind.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And Jesus passing by, saw a man who was blind from his birth.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And his disciples asked him: Rabbi, who hath sinned, this man or his parents, that he should be born blind?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Jesus answered: Neither hath this man sinned, nor his parents; but that the works of God should be made manifest in him.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>I must work the works of him that sent me, whilst it is day: the night cometh, when no man can work.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>As long as I am in the world, I am the light of the world.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>When he had said these things, he spat on the ground and made clay of the spittle and spread the clay upon his eyes,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And said to him: Go, wash in the pool of Siloe, which is interpreted, Sent. He went therefore and washed: and he came seeing.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The neighbours, therefore, and they who had seen him before that he was a beggar, said: Is not this he that sat and begged? Some said: This is he.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>But others said: No, but he is like him. But he said: I am he.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>They said therefore to him: How were thy eyes opened?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He answered: That man that is called Jesus made clay and anointed my eyes and said to me: Go to the pool of Siloe and wash. And I went: I washed: and I see.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And they said to him: Where is he? He saith: I know not.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>They bring him that had been blind to the Pharisees.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Now it was the sabbath, when Jesus made the clay and opened his eyes.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Again therefore the Pharisees asked him how he had received his sight. But he said to them: He put clay upon my eyes: and I washed: and I see.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Some therefore of the Pharisees said: This man is not of God, who keepeth not the sabbath. But others said: How can a man that is a sinner do such miracles? And there was a division among them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>They say therefore to the blind man again: What sayest thou of him that hath opened thy eyes? And he said: He is a prophet.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The Jews then did not believe concerning him, that he had been blind and had received his sight, until they called the parents of him that had received his sight,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And asked them, saying: Is this your son, who you say was born blind? How then doth he now see?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>His parents answered them and said: We know that this is our son and that he was born blind:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>But how he now seeth, we know not: or who hath opened his eyes, we know not. Ask himself: he is of age: Let him speak for himself.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>These things his parents said, because they feared the Jews: for the Jews had already agreed among themselves that if any man should confess him to be Christ, he should be put out of the synagogue.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Therefore did his parents say: He is of age. Ask himself.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>They therefore called the man again that had been blind and said to him: Give glory to God. We know that this man is a sinner.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>He said therefore to them: If he be a sinner, I know not. One thing I know, that whereas I was blind. now I see.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>They said then to him: What did he to thee? How did he open thy eyes?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>He answered them: I have told you already, and you have heard. Why would you hear it again? Will you also become his disciples?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>They reviled him therefore and said: Be thou his disciple; but we are the disciples of Moses.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>We know that God spoke to Moses: but as to this man, we know not from whence he is.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The man answered and said to them: why, herein is a wonderful thing, that you know not from whence he is, and he hath opened my eyes.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Now we know that God doth not hear sinners: but if a man be a server of God and doth his, will, him he heareth.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>From the beginning of the world it hath not been heard, that any man hath opened the eyes of one born blind.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Unless this man were of God, he could not do anything.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>They answered and said to him: Thou wast wholly born in sins; and dost thou teach us? And they cast him out.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Jesus heard that they had cast him out. And when he had found him, he said to him: Dost thou believe in the Son of God?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>He answered, and said: Who is he, Lord, that I may believe in him?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And Jesus said to him: Thou hast both seen him; and it is he that talketh with thee.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And he said: I believe, Lord. And falling down, he adored him.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And Jesus said: For judgment I am come into this world: that they who see not may see; and they who see may become blind.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And some of the Pharisees, who were with him, heard: and they said unto him: Are we also blind?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Jesus said to them: If you were blind, you should not have sin: but now you say: We see. Your sin remaineth.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et præteriens Jesus vidit hominem cæcum a nativitate :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et interrogaverunt eum discipuli ejus : Rabbi, quis peccavit, hic, aut parentes ejus, ut cæcus nasceretur ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Respondit Jesus : Neque hic peccavit, neque parentes ejus : sed ut manifestentur opera Dei in illo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Me oportet operari opera ejus qui misit me, donec dies est : venit nox, quando nemo potest operari :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>quamdiu sum in mundo, lux sum mundi.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hæc cum dixisset, exspuit in terram, et fecit lutum ex sputo, et linivit lutum super oculos ejus,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et dixit ei : Vade, lava in natatoria Siloë (quod interpretatur Missus). Abiit ergo, et lavit, et venit videns.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Itaque vicini, et qui viderant eum prius quia mendicus erat, dicebant : Nonne hic est qui sedebat, et mendicabat ? Alii dicebant : Quia hic est.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Alii autem : Nequaquam, sed similis est ei. Ille vero dicebat : Quia ego sum.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dicebant ergo ei : Quomodo aperti sunt tibi oculi ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Respondit : Ille homo qui dicitur Jesus, lutum fecit : et unxit oculos meos, et dixit mihi : Vade ad natatoria Siloë, et lava. Et abii, et lavi, et video.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et dixerunt ei : Ubi est ille ? Ait : Nescio.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Adducunt eum ad pharisæos, qui cæcus fuerat.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Erat autem sabbatum quando lutum fecit Jesus, et aperuit oculos ejus.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Iterum ergo interrogabant eum pharisæi quomodo vidisset. Ille autem dixit eis : Lutum mihi posuit super oculos, et lavi, et video.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Dicebant ergo ex pharisæis quidam : Non est hic homo a Deo, qui sabbatum non custodit. Alii autem dicebant : Quomodo potest homo peccator hæc signa facere ? Et schisma erat inter eos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dicunt ergo cæco iterum : Tu quid dicis de illo qui aperuit oculos tuos ? Ille autem dixit : Quia propheta est.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Non crediderunt ergo Judæi de illo, quia cæcus fuisset et vidisset, donec vocaverunt parentes ejus, qui viderat :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et interrogaverunt eos, dicentes : Hic est filius vester, quem vos dicitis quia cæcus natus est ? quomodo ergo nunc videt ?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Responderunt eis parentes ejus, et dixerunt : Scimus quia hic est filius noster, et quia cæcus natus est :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>quomodo autem nunc videat, nescimus : aut quis ejus aperuit oculos, nos nescimus ; ipsum interrogate : ætatem habet, ipse de se loquatur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Hæc dixerunt parentes ejus, quoniam timebant Judæos : jam enim conspiraverunt Judæi, ut si quis eum confiteretur esse Christum, extra synagogam fieret.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Propterea parentes ejus dixerunt : Quia ætatem habet, ipsum interrogate.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Vocaverunt ergo rursum hominem qui fuerat cæcus, et dixerunt ei : Da gloriam Deo : nos scimus quia hic homo peccator est.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Dixit ergo eis ille : Si peccator est, nescio ; unum scio, quia cæcus cum essem, modo video.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Dixerunt ergo illi : Quid fecit tibi ? quomodo aperuit tibi oculos ?</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Respondit eis : Dixi vobis jam, et audistis : quod iterum vultis audire ? numquid et vos vultis discipuli ejus fieri ?</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Maledixerunt ergo ei, et dixerunt : Tu discipulus illius sis : nos autem Moysi discipuli sumus.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Nos scimus quia Moysi locutus est Deus ; hunc autem nescimus unde sit.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Respondit ille homo, et dixit eis : In hoc enim mirabile est quia vos nescitis unde sit, et aperuit meos oculos :</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>scimus autem quia peccatores Deus non audit : sed si quis Dei cultor est, et voluntatem ejus facit, hunc exaudit.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>A sæculo non est auditum quia quis aperuit oculos cæci nati.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Nisi esset hic a Deo, non poterat facere quidquam.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Responderunt, et dixerunt ei : In peccatis natus es totus, et tu doces nos ? Et ejecerunt eum foras.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Audivit Jesus quia ejecerunt eum foras : et cum invenisset eum, dixit ei : Tu credis in Filium Dei ?</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Respondit ille, et dixit : Quis est, Domine, ut credam in eum ?</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Et dixit ei Jesus : Et vidisti eum, et qui loquitur tecum, ipse est.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>At ille ait : Credo, Domine. Et procidens adoravit eum.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Et dixit Jesus : In judicium ego in hunc mundum veni : ut qui non vident videant, et qui vident cæci fiant.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Et audierunt quidam ex pharisæis qui cum ipso erant, et dixerunt ei : Numquid et nos cæci sumus ?</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Dixit eis Jesus : Si cæci essetis, non haberetis peccatum. Nunc vero dicitis, Quia videmus : peccatum vestrum manet.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/8/"><svg viewBox="0 0 24 24" fill="no hath this man sinned, nor his parents; but that the works of God should be made manifest in him.\"},{\"verse\":4,\"text\":\"I must work the works of him that sent me, whilst it is day: the night cometh, when no man can work.\"},{\"verse\":5,\"text\":\"As long as I am in the world, I am the light of the world.\"},{\"verse\":6,\"text\":\"When he had said these things, he spat on the ground and made clay of the spittle and spread the clay upon his eyes,\"},{\"verse\":7,\"text\":\"And said to him: Go, wash in the pool of Siloe, which is interpreted, Sent. He went therefore and washed: and he came seeing.\"},{\"verse\":8,\"text\":\"The neighbours, therefore, and they who had seen him before that he was a beggar, said: Is not this he that sat and begged? Some said: This is he.\"},{\"verse\":9,\"text\":\"But others said: No, but he is like him. But he said: I am he.\"},{\"verse\":10,\"text\":\"They said therefore to him: How were thy eyes opened?\"},{\"verse\":11,\"text\":\"He answered: That man that is called Jesus made clay and anointed my eyes and said to me: Go to the pool of Siloe and wash. And I went: I washed: and I see.\"},{\"verse\":12,\"text\":\"And they said to him: Where is he? He saith: I know not.\"},{\"verse\":13,\"text\":\"They bring him that had been blind to the Pharisees.\"},{\"verse\":14,\"text\":\"Now it was the sabbath, when Jesus made the clay and opened his eyes.\"},{\"verse\":15,\"text\":\"Again therefore the Pharisees asked him how he had received his sight. But he said to them: He put clay upon my eyes: and I washed: and I see.\"},{\"verse\":16,\"text\":\"Some therefore of the Pharisees said: This man is not of God, who keepeth not the sabbath. But others said: How can a man that is a sinner do such miracles? And there was a division among them.\"},{\"verse\":17,\"text\":\"They say therefore to the blind man again: What sayest thou of him that hath opened thy eyes? And he said: He is a prophet.\"},{\"verse\":18,\"text\":\"The Jews then did not believe concerning him, that he had been blind and had received his sight, until they called the parents of him that had received his sight,\"},{\"verse\":19,\"text\":\"And asked them, saying: Is this your son, who you say was born blind? How then doth he now see?\"},{\"verse\":20,\"text\":\"His parents answered them and said: We know that this is our son and that he was born blind:\"},{\"verse\":21,\"text\":\"But how he now seeth, we know not: or who hath opened his eyes, we know not. Ask himself: he is of age: Let him speak for himself.\"},{\"verse\":22,\"text\":\"These things his parents said, because they feared the Jews: for the Jews had already agreed among themselves that if any man should confess him to be Christ, he should be put out of the synagogue.\"},{\"verse\":23,\"text\":\"Therefore did his parents say: He is of age. Ask himself.\"},{\"verse\":24,\"text\":\"They therefore called the man again that had been blind and said to him: Give glory to God. We know that this man is a sinner.\"},{\"verse\":25,\"text\":\"He said therefore to them: If he be a sinner, I know not. One thing I know, that whereas I was blind. now I see.\"},{\"verse\":26,\"text\":\"They said then to him: What did he to thee? How did he open thy eyes?\"},{\"verse\":27,\"text\":\"He answered them: I have told you already, and you have heard. Why would you hear it again? Will you also become his disciples?\"},{\"verse\":28,\"text\":\"They reviled him therefore and said: Be thou his disciple; but we are the disciples of Moses.\"},{\"verse\":29,\"text\":\"We know that God spoke to Moses: but as to this man, we know not from whence he is.\"},{\"verse\":30,\"text\":\"The man answered and said to them: why, herein is a wonderful thing, that you know not from whence he is, and he hath opened my eyes.\"},{\"verse\":31,\"text\":\"Now we know that God doth not hear sinners: but if a man be a server of God and doth his, will, him he heareth.\"},{\"verse\":32,\"text\":\"From the beginning of the world it hath not been heard, that any man hath opened the eyes of one born blind.\"},{\"verse\":33,\"text\":\"Unless this man were of God, he could not do anything.\"},{\"verse\":34,\"text\":\"They answered and said to him: Thou wast wholly born in sins; and dost thou teach us? And they cast him out.\"},{\"verse\":35,\"text\":\"Jesus heard that they had cast him out. And when he had found him, he said to him: Dost thou believe in the Son of God?\"},{\"verse\":36,\"text\":\"He answered, and said: Who is he, Lord, that I may believe in him?\"},{\"verse\":37,\"text\":\"And Jesus said to him: Thou hast both seen him; and it is he that talketh with thee.\"},{\"verse\":38,\"text\":\"And he said: I believe, Lord. And falling down, he adored him.\"},{\"verse\":39,\"text\":\"And Jesus said: For judgment I am come into this world: that they who see not may see; and they who see may become blind.\"},{\"verse\":40,\"text\":\"And some of the Pharisees, who were with him, heard: and they said unto him: Are we also blind?\"},{\"verse\":41,\"text\":\"Jesus said to them: If you were blind, you should not have sin: but now you say: We see. Your sin remaineth.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et præteriens Jesus vidit hominem cæcum a nativitate :\"},{\"verse\":2,\"text\":\"et interrogaverunt eum discipuli ejus : Rabbi, quis peccavit, hic, aut parentes ejus, ut cæcus nasceretur ?\"},{\"verse\":3,\"text\":\"Respondit Jesus : Neque hic peccavit, neque parentes ejus : sed ut manifestentur opera Dei in illo.\"},{\"verse\":4,\"text\":\"Me oportet operari opera ejus qui misit me, donec dies est : venit nox, quando nemo potest operari :\"},{\"verse\":5,\"text\":\"quamdiu sum in mundo, lux sum mundi.\"},{\"verse\":6,\"text\":\"Hæc cum dixisset, exspuit in terram, et fecit lutum ex sputo, et linivit lutum super oculos ejus,\"},{\"verse\":7,\"text\":\"et dixit ei : Vade, lava in natatoria Siloë (quod interpretatur Missus). Abiit ergo, et lavit, et venit videns.\"},{\"verse\":8,\"text\":\"Itaque vicini, et qui viderant eum prius quia mendicus erat, dicebant : Nonne hic est qui sedebat, et mendicabat ? Alii dicebant : Quia hic est.\"},{\"verse\":9,\"text\":\"Alii autem : Nequaquam, sed similis est ei. Ille vero dicebat : Quia ego sum.\"},{\"verse\":10,\"text\":\"Dicebant ergo ei : Quomodo aperti sunt tibi oculi ?\"},{\"verse\":11,\"text\":\"Respondit : Ille homo qui dicitur Jesus, lutum fecit : et unxit oculos meos, et dixit mihi : Vade ad natatoria Siloë, et lava. Et abii, et lavi, et video.\"},{\"verse\":12,\"text\":\"Et dixerunt ei : Ubi est ille ? Ait : Nescio.\"},{\"verse\":13,\"text\":\"Adducunt eum ad pharisæos, qui cæcus fuerat.\"},{\"verse\":14,\"text\":\"Erat autem sabbatum quando lutum fecit Jesus, et aperuit oculos ejus.\"},{\"verse\":15,\"text\":\"Iterum ergo interrogabant eum pharisæi quomodo vidisset. Ille autem dixit eis : Lutum mihi posuit super oculos, et lavi, et video.\"},{\"verse\":16,\"text\":\"Dicebant ergo ex pharisæis quidam : Non est hic homo a Deo, qui sabbatum non custodit. Alii autem dicebant : Quomodo potest homo peccator hæc signa facere ? Et schisma erat inter eos.\"},{\"verse\":17,\"text\":\"Dicunt ergo cæco iterum : Tu quid dicis de illo qui aperuit oculos tuos ? Ille autem dixit : Quia propheta est.\"},{\"verse\":18,\"text\":\"Non crediderunt ergo Judæi de illo, quia cæcus fuisset et vidisset, donec vocaverunt parentes ejus, qui viderat :\"},{\"verse\":19,\"text\":\"et interrogaverunt eos, dicentes : Hic est filius vester, quem vos dicitis quia cæcus natus est ? quomodo ergo nunc videt ?\"},{\"verse\":20,\"text\":\"Responderunt eis parentes ejus, et dixerunt : Scimus quia hic est filius noster, et quia cæcus natus est :\"},{\"verse\":21,\"text\":\"quomodo autem nunc videat, nescimus : aut quis ejus aperuit oculos, nos nescimus ; ipsum interrogate : ætatem habet, ipse de se loquatur.\"},{\"verse\":22,\"text\":\"Hæc dixerunt parentes ejus, quoniam timebant Judæos : jam enim conspiraverunt Judæi, ut si quis eum confiteretur esse Christum, extra synagogam fieret.\"},{\"verse\":23,\"text\":\"Propterea parentes ejus dixerunt : Quia ætatem habet, ipsum interrogate.\"},{\"verse\":24,\"text\":\"Vocaverunt ergo rursum hominem qui fuerat cæcus, et dixerunt ei : Da gloriam Deo : nos scimus quia hic homo peccator est.\"},{\"verse\":25,\"text\":\"Dixit ergo eis ille : Si peccator est, nescio ; unum scio, quia cæcus cum essem, modo video.\"},{\"verse\":26,\"text\":\"Dixerunt ergo illi : Quid fecit tibi ? quomodo aperuit tibi oculos ?\"},{\"verse\":27,\"text\":\"Respondit eis : Dixi vobis jam, et audistis : quod iterum vultis audire ? numquid et vos vultis discipuli ejus fieri ?\"},{\"verse\":28,\"text\":\"Maledixerunt ergo ei, et dixerunt : Tu discipulus illius sis : nos autem Moysi discipuli sumus.\"},{\"verse\":29,\"text\":\"Nos scimus quia Moysi locutus est Deus ; hunc autem nescimus unde sit.\"},{\"verse\":30,\"text\":\"Respondit ille homo, et dixit eis : In hoc enim mirabile est quia vos nescitis unde sit, et aperuit meos oculos :\"},{\"verse\":31,\"text\":\"scimus autem quia peccatores Deus non audit : sed si quis Dei cultor est, et voluntatem ejus facit, hunc exaudit.\"},{\"verse\":32,\"text\":\"A sæculo non est auditum quia quis aperuit oculos cæci nati.\"},{\"verse\":33,\"text\":\"Nisi esset hic a Deo, non poterat facere quidquam.\"},{\"verse\":34,\"text\":\"Responderunt, et dixerunt ei : In peccatis natus es totus, et tu doces nos ? Et ejecerunt eum foras.\"},{\"verse\":35,\"text\":\"Audivit Jesus quia ejecerunt eum foras : et cum invenisset eum, dixit ei : Tu credis in Filium Dei ?\"},{\"verse\":36,\"text\":\"Respondit ille, et dixit : Quis est, Domine, ut credam in eum ?\"},{\"verse\":37,\"text\":\"Et dixit ei Jesus : Et vidisti eum, et qui loquitur tecum, ipse est.\"},{\"verse\":38,\"text\":\"At ille ait : Credo, Domine. Et procidens adoravit eum.\"},{\"verse\":39,\"text\":\"Et dixit Jesus : In judicium ego in hunc mundum veni : ut qui non vident videant, et qui vident cæci fiant.\"},{\"verse\":40,\"text\":\"Et audierunt quidam ex pharisæis qui cum ipso erant, et dixerunt ei : Numquid et nos cæci sumus ?\"},{\"verse\":41,\"text\":\"Dixit eis Jesus : Si cæci essetis, non haberetis peccatum. Nunc vero dicitis, Quia videmus : peccatum vestrum manet.\"}],\"summary\":\"He gives sight to the man born blind.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":8,\"label\":\"John 8\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":10,\"label\":\"John 10\"}}]]\n"])</script></body></html>
