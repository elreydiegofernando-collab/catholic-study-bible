<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>John 5 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">5</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/JHN/">About <!-- -->John</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Christ heals on the sabbath the man languishing thirty-eight years. His discourse upon this occasion.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>After these things was a festival day of the Jews: and Jesus went up to Jerusalem.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Now there is at Jerusalem a pond, called Probatica, which in Hebrew is named Bethsaida, having five porches.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In these lay a great multitude of sick, of blind, of lame, of withered: waiting for the moving of the water.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And an angel of the Lord descended at certain times into the pond and the water was moved. And he that went down first into the pond after the motion of the water was made whole of whatsoever infirmity he lay under.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And there was a certain man there that had been eight and thirty years under his infirmity.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Him when Jesus had seen lying, and knew that he had been now a long time, he saith to him: Wilt thou be made whole?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The infirm man answered him: Sir, I have no man, when the water is troubled, to put me into the pond. For whilst I am coming, another goeth down before me.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Jesus saith to him: Arise, take up thy bed and walk.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And immediately the man was made whole: and he took up his bed and walked. And it was the sabbath that day.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The Jews therefore said to him that was healed: It is the sabbath. It is not lawful for thee to take up thy bed.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>He answered them: He that made me whole, he said to me: Take up thy bed and walk.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>They asked him therefore: Who is that man who said to thee: Take up thy bed and walk?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But he who was healed knew not who it was: for Jesus went aside from the multitude standing in the place.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Afterwards, Jesus findeth him in the temple and saith to him: Behold thou art made whole: sin no more, lest some worse thing happen to thee.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The man went his way and told the Jews that it was Jesus who had made him whole.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Therefore did the Jews persecute Jesus, because he did these things on the sabbath.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>But Jesus answered them: My Father worketh until now; and I work.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Hereupon therefore the Jews sought the more to kill him, because he did not only break the sabbath but also said God was his Father, making himself equal to God.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Then Jesus answered and said to them: Amen, amen, I say unto you, the Son cannot do any thing of himself, but what he seeth the Father doing: for what things soever he doth, these the Son also doth in like manner.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For the Father loveth the Son and sheweth him all things which himself doth: and greater works than these will he shew him, that you may wonder.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>For as the Father raiseth up the dead and giveth life: so the Son also giveth life to whom he will.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>For neither does the Father judge any man: but hath given all judgment to the Son.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>That all men may honour the Son, as they honour the Father. He who honoureth not the Son honoureth not the Father who hath sent him.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Amen, amen, I say unto you that he who heareth my word and believeth him that sent me hath life everlasting: and cometh not into judgment, but is passed from death to life.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Amen, amen, I say unto you, that the hour cometh, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>For as the Father hath life in himself, so he hath given to the Son also to have life in himself.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And he hath given him power to do judgment, because he is the Son of man.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Wonder not at this: for the hour cometh wherein all that are in the graves shall hear the voice of the Son of God.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And they that have done good things shall come forth unto the resurrection of life: but they that have done evil, unto the resurrection of judgment.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>I cannot of myself do any thing. As I hear, so I judge. And my judgment is just: because I seek not my own will, but the will of him that sent me.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>If I bear witness of myself, my witness is not true.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>There is another that beareth witness of me: and I know that the witness which he witnesseth of me is true.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>You sent to John: and he gave testimony to the truth.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>But I receive not testimony from man: but I say these things, that you may be saved.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>He was a burning and a shining light: and you were willing for a time to rejoice in his light.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>But I have a greater testimony than that of John: for the works which the Father hath given me to perfect, the works themselves which I do, give testimony of me, that the Father hath sent me.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>And the Father himself who hath sent me hath given testimony of me: neither have you heard his voice at any time, nor seen his shape.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And you have not his word abiding in you: for whom he hath sent, him you believe not.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Search the scriptures: for you think in them to have life everlasting. And the same are they that give testimony of me.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And you will not come to me that you may have life.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>I receive not glory from men.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>But I know you, that you have not the love of God in you.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>I am come in the name of my Father, and you receive me not: if another shall come in his own name, him you will receive.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>How can you believe, who receive glory one from another: and the glory which is from God alone, you do not seek?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Think not that I will accuse you to the Father. There is one that accuseth you, Moses, in whom you trust.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>For if you did believe Moses, you would perhaps believe me also: for he wrote of me.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>But if you do not believe his writings, how will you believe my words?</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Post hæc erat dies festus Judæorum, et ascendit Jesus Jerosolymam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Est autem Jerosolymis probatica piscina, quæ cognominatur hebraice Bethsaida, quinque porticus habens.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In his jacebat multitudo magna languentium, cæcorum, claudorum, aridorum, exspectantium aquæ motum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Angelus autem Domini descendebat secundum tempus in piscinam, et movebatur aqua. Et qui prior descendisset in piscinam post motionem aquæ, sanus fiebat a quacumque detinebatur infirmitate.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Erat autem quidam homo ibi triginta et octo annos habens in infirmitate sua.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Hunc autem cum vidisset Jesus jacentem, et cognovisset quia jam multum tempus haberet, dicit ei : Vis sanus fieri ?</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Respondit ei languidus : Domine, hominem non habeo, ut, cum turbata fuerit aqua, mittat me in piscinam : dum venio enim ego, alius ante me descendit.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Dicit ei Jesus : Surge, tolle grabatum tuum et ambula.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et statim sanus factus est homo ille : et sustulit grabatum suum, et ambulabat. Erat autem sabbatum in die illo.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dicebant ergo Judæi illi qui sanatus fuerat : Sabbatum est, non licet tibi tollere grabatum tuum.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Respondit eis : Qui me sanum fecit, ille mihi dixit : Tolle grabatum tuum et ambula.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Interrogaverunt ergo eum : Quis est ille homo qui dixit tibi : Tolle grabatum tuum et ambula ?</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Is autem qui sanus fuerat effectus, nesciebat quis esset. Jesus enim declinavit a turba constituta in loco.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Postea invenit eum Jesus in templo, et dixit illi : Ecce sanus factus es ; jam noli peccare, ne deterius tibi aliquid contingat.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Abiit ille homo, et nuntiavit Judæis quia Jesus esset, qui fecit eum sanum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Propterea persequebantur Judæi Jesum, quia hæc faciebat in sabbato.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Jesus autem respondit eis : Pater meus usque modo operatur, et ego operor.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Propterea ergo magis quærebant eum Judæi interficere : quia non solum solvebat sabbatum, sed et patrem suum dicebat Deum, æqualem se faciens Deo. Respondit itaque Jesus, et dixit eis :</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Amen, amen dico vobis : non potest Filius a se facere quidquam, nisi quod viderit Patrem facientem : quæcumque enim ille fecerit, hæc et Filius similiter facit.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Pater enim diligit Filium, et omnia demonstrat ei quæ ipse facit : et majora his demonstrabit ei opera, ut vos miremini.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sicut enim Pater suscitat mortuos, et vivificat, sic et Filius, quos vult, vivificat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Neque enim Pater judicat quemquam : sed omne judicium dedit Filio,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>ut omnes honorificent Filium, sicut honorificant Patrem ; qui non honorificat Filium, non honorificat Patrem, qui misit illum.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Amen, amen dico vobis, quia qui verbum meum audit, et credit ei qui misit me, habet vitam æternam, et in judicium non venit, sed transiit a morte in vitam.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Amen, amen dico vobis, quia venit hora, et nunc est, quando mortui audient vocem Filii Dei : et qui audierint, vivent.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Sicut enim Pater habet vitam in semetipso, sic dedit et Filio habere vitam in semetipso :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>et potestatem dedit ei judicium facere, quia Filius hominis est.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Nolite mirari hoc, quia venit hora in qua omnes qui in monumentis sunt audient vocem Filii Dei :</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>et procedent qui bona fecerunt, in resurrectionem vitæ ; qui vero mala egerunt, in resurrectionem judicii.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Non possum ego a meipso facere quidquam. Sicut audio, judico : et judicium meum justum est, quia non quæro voluntatem meam, sed voluntatem ejus qui misit me.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Si ego testimonium perhibeo de meipso, testimonium meum non est verum.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Alius est qui testimonium perhibet de me : et scio quia verum est testimonium, quod perhibet de me.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Vos misistis ad Joannem, et testimonium perhibuit veritati.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Ego autem non ab homine testimonium accipio : sed hæc dico ut vos salvi sitis.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Ille erat lucerna ardens et lucens : vos autem voluistis ad horam exsultare in luce ejus.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Ego autem habeo testimonium majus Joanne. Opera enim quæ dedit mihi Pater ut perficiam ea : ipsa opera, quæ ego facio, testimonium perhibent de me, quia Pater misit me :</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>et qui misit me Pater, ipse testimonium perhibuit de me : neque vocem ejus umquam audistis, neque speciem ejus vidistis :</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et verbum ejus non habetis in vobis manens : quia quem misit ille, huic vos non creditis.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Scrutamini Scripturas, quia vos putatis in ipsis vitam æternam habere : et illæ sunt quæ testimonium perhibent de me :</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et non vultis venire ad me ut vitam habeatis.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Claritatem ab hominibus non accipio.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Sed cognovi vos, quia dilectionem Dei non habetis in vobis.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Ego veni in nomine Patris mei, et non accipitis me ; si alius venerit in nomine suo, illum accipietis.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Quomodo vos potestis credere, qui gloriam ab invicem accipitis, et gloriam quæ a solo Deo est, non quæritis ?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>Nolite putare quia ego accusaturus sim vos apud Patrem : est qui accusat vos Moyses, in quo vos speratis.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Si enim crederetis Moysi, crederetis forsitan et mihi : de me enim ille scripsit.</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Si autem illius litteris non creditis, quomodo verbis meis credetis ?</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">John 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d ,[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"JHN.5\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":5,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"After these things was a festival day of the Jews: and Jesus went up to Jerusalem.\"},{\"verse\":2,\"text\":\"Now there is at Jerusalem a pond, called Probatica, which in Hebrew is named Bethsaida, having five porches.\"},{\"verse\":3,\"text\":\"In these lay a great multitude of sick, of blind, of lame, of withered: waiting for the moving of the water.\"},{\"verse\":4,\"text\":\"And an angel of the Lord descended at certain times into the pond and the water was moved. And he that went down first into the pond after the motion of the water was made whole of whatsoever infirmity he lay under.\"},{\"verse\":5,\"text\":\"And there was a certain man there that had been eight and thirty years under his infirmity.\"},{\"verse\":6,\"text\":\"Him when Jesus had seen lying, and knew that he had been now a long time, he saith to him: Wilt thou be made whole?\"},{\"verse\":7,\"text\":\"The infirm man answered him: Sir, I have no man, when the water is troubled, to put me into the pond. For whilst I am coming, another goeth down before me.\"},{\"verse\":8,\"text\":\"Jesus saith to him: Arise, take up thy bed and walk.\"},{\"verse\":9,\"text\":\"And immediately the man was made whole: and he took up his bed and walked. And it was the sabbath that day.\"},{\"verse\":10,\"text\":\"The Jews therefore said to him that was healed: It is the sabbath. It is not lawful for thee to take up thy bed.\"},{\"verse\":11,\"text\":\"He answered them: He that made me whole, he said to me: Take up thy bed and walk.\"},{\"verse\":12,\"text\":\"They asked him therefore: Who is that man who said to thee: Take up thy bed and walk?\"},{\"verse\":13,\"text\":\"But he who was healed knew not who it was: for Jesus went aside from the multitude standing in the place.\"},{\"verse\":14,\"text\":\"Afterwards, Jesus findeth him in the temple and saith to him: Behold thou art made whole: sin no more, lest some worse thing happen to thee.\"},{\"verse\":15,\"text\":\"The man went his way and told the Jews that it was Jesus who had made him whole.\"},{\"verse\":16,\"text\":\"Therefore did the Jews persecute Jesus, because he did these things on the sabbath.\"},{\"verse\":17,\"text\":\"But Jesus answered them: My Father worketh until now; and I work.\"},{\"verse\":18,\"text\":\"Hereupon therefore the Jews sought the more to kill him, because he did not only break the sabbath but also said God was his Father, making himself equal to God.\"},{\"verse\":19,\"text\":\"Then Jesus answered and said to them: Amen, amen, I say unto you, the Son cannot do any thing of himself, but what he seeth the Father doing: for what things soever he doth, these the Son also doth in like manner.\"},{\"verse\":20,\"text\":\"For the Father loveth the Son and sheweth him all things which himself doth: and greater works than these will he shew him, that you may wonder.\"},{\"verse\":21,\"text\":\"For as the Father raiseth up the dead and giveth life: so the Son also giveth life to whom he will.\"},{\"verse\":22,\"text\":\"For neither does the Father judge any man: but hath given all judgment to the Son.\"},{\"verse\":23,\"text\":\"That all men may honour the Son, as they honour the Father. He who honoureth not the Son honoureth not the Father who hath sent him.\"},{\"verse\":24,\"text\":\"Amen, amen, I say unto you that he who heareth my word and believeth him that sent me hath life everlasting: and cometh not into judgment, but is passed from death to life.\"},{\"verse\":25,\"text\":\"Amen, amen, I say unto you, that the hour cometh, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live.\"},{\"verse\":26,\"text\":\"For as the Father hath life in himself, so he hath given to the Son also to have life in himself.\"},{\"verse\":27,\"text\":\"And he hath given him power to do judgment, because he is the Son of man.\"},{\"verse\":28,\"text\":\"Wonder not at this: for the hour cometh wherein all that are in the graves shall hear the voice of the Son of God.\"},{\"verse\":29,\"text\":\"And they that have done good things shall come forth unto the resurrection of life: but they that have done evil, unto the resurrection of judgment.\"},{\"verse\":30,\"text\":\"I cannot of myself do any thing. As I hear, so I judge. And my judgment is just: because I seek not my own will, but the will of him that sent me.\"},{\"verse\":31,\"text\":\"If I bear witness of myself, my witness is not true.\"},{\"verse\":32,\"text\":\"There is another that beareth witness of me: and I know that the witness which he witnesseth of me is true.\"},{\"verse\":33,\"text\":\"You sent to John: and he gave testimony to the truth.\"},{\"verse\":34,\"text\":\"But I receive not testimony from man: but I say these things, that you may be saved.\"},{\"verse\":35,\"text\":\"He was a burning and a shining light: and you were willing for a time to rejoice in his light.\"},{\"verse\":36,\"text\":\"But I have a greater testimony than that of John: for the works which the Father hath given me to perfect, the works themselves which I do, give testimony of me, that the Father hath sent me.\"},{\"verse\":37,\"text\":\"And the Father himself who hath sent me hath given testimony of me: neither have you heard his voice at any time, nor seen his shape.\"},{\"verse\":38,\"text\":\"And you have not his word abiding in you: for whom he hath sent, him you believe not.\"},{\"verse\":39,\"text\":\"Search the scriptures: for you think in them to have life everlasting. And the same are they that give testimony of me.\"},{\"verse\":40,\"text\":\"And you will not come to me that you may have life.\"},{\"verse\":41,\"text\":\"I receive not glory from men.\"},{\"verse\":42,\"text\":\"But I know you, that you have not the love of God in you.\"},{\"verse\":43,\"text\":\"I am come in the name of my Father, and you receive me not: if another shall come in his own name, him you will receive.\"},{\"verse\":44,\"text\":\"How can you believe, who receive glory one from another: and the glory which is from God alone, you do not seek?\"},{\"verse\":45,\"text\":\"Think not that I will accuse you to the Father. There is one that accuseth you, Moses, in whom you trust.\"},{\"verse\":46,\"text\":\"For if you did believe Moses, you would perhaps believe me also: for he wrote of me.\"},{\"verse\":47,\"text\":\"But if you do not believe his writings, how will you believe my words?\"}],\"vul\":[{\"verse\":1,\"text\":\"Post hæc erat dies festus Judæorum, et ascendit Jesus Jerosolymam.\"},{\"verse\":2,\"text\":\"Est autem Jerosolymis probatica piscina, quæ cognominatur hebraice Bethsaida, quinque porticus habens.\"},{\"verse\":3,\"text\":\"In his jacebat multitudo magna languentium, cæcorum, claudorum, aridorum, exspectantium aquæ motum.\"},{\"verse\":4,\"text\":\"Angelus autem Domini descendebat secundum tempus in piscinam, et movebatur aqua. Et qui prior descendisset in piscinam post motionem aquæ, sanus fiebat a quacumque detinebatur infirmitate.\"},{\"verse\":5,\"text\":\"Erat autem quidam homo ibi triginta et octo annos habens in infirmitate sua.\"},{\"verse\":6,\"text\":\"Hunc autem cum vidisset Jesus jacentem, et cognovisset quia jam multum tempus haberet, dicit ei : Vis sanus fieri ?\"},{\"verse\":7,\"text\":\"Respondit ei languidus : Domine, hominem non habeo, ut, cum turbata fuerit aqua, mittat me in piscinam : dum venio enim ego, alius ante me descendit.\"},{\"verse\":8,\"text\":\"Dicit ei Jesus : Surge, tolle grabatum tuum et ambula.\"},{\"verse\":9,\"text\":\"Et statim sanus factus est homo ille : et sustulit grabatum suum, et ambulabat. Erat autem sabbatum in die illo.\"},{\"verse\":10,\"text\":\"Dicebant ergo Judæi illi qui sanatus fuerat : Sabbatum est, non licet tibi tollere grabatum tuum.\"},{\"verse\":11,\"text\":\"Respondit eis : Qui me sanum fecit, ille mihi dixit : Tolle grabatum tuum et ambula.\"},{\"verse\":12,\"text\":\"Interrogaverunt ergo eum : Quis est ille homo qui dixit tibi : Tolle grabatum tuum et ambula ?\"},{\"verse\":13,\"text\":\"Is autem qui sanus fuerat effectus, nesciebat quis esset. Jesus enim declinavit a turba constituta in loco.\"},{\"verse\":14,\"text\":\"Postea invenit eum Jesus in templo, et dixit illi : Ecce sanus factus es ; jam noli peccare, ne deterius tibi aliquid contingat.\"},{\"verse\":15,\"text\":\"Abiit ille homo, et nuntiavit Judæis quia Jesus esset, qui fecit eum sanum.\"},{\"verse\":16,\"text\":\"Propterea persequebantur Judæi Jesum, quia hæc faciebat in sabbato.\"},{\"verse\":17,\"text\":\"Jesus autem respondit eis : Pater meus usque modo operatur, et ego operor.\"},{\"verse\":18,\"text\":\"Propterea ergo magis quærebant eum Judæi interficere : quia non solum solvebat sabbatum, sed et patrem suum dicebat Deum, æqualem se faciens Deo. Respondit itaque Jesus, et dixit eis :\"},{\"verse\":19,\"text\":\"Amen, amen dico vobis : non potest Filius a se facere quidquam, nisi quod viderit Patrem facientem : quæcumque enim ille fecerit, hæc et Filius similiter facit.\"},{\"verse\":20,\"text\":\"Pater enim diligit Filium, et omnia demonstrat ei quæ ipse facit : et majora his demonstrabit ei opera, ut vos miremini.\"},{\"verse\":21,\"text\":\"Sicut enim Pater suscitat mortuos, et vivificat, sic et Filius, quos vult, vivificat.\"},{\"verse\":22,\"text\":\"Neque enim Pater judicat quemquam : sed omne judicium dedit Filio,\"},{\"verse\":23,\"text\":\"ut omnes honorificent Filium, sicut honorificant Patrem ; qui non honorificat Filium, non honorificat Patrem, qui misit illum.\"},{\"verse\":24,\"text\":\"Amen, amen dico vobis, quia qui verbum meum audit, et credit ei qui misit me, habet vitam æternam, et in judicium non venit, sed transiit a morte in vitam.\"},{\"verse\":25,\"text\":\"Amen, amen dico vobis, quia venit hora, et nunc est, quando mortui audient vocem Filii Dei : et qui audierint, vivent.\"},{\"verse\":26,\"text\":\"Sicut enim Pater habet vitam in semetipso, sic dedit et Filio habere vitam in semetipso :\"},{\"verse\":27,\"text\":\"et potestatem dedit ei judicium facere, quia Filius hominis est.\"},{\"verse\":28,\"text\":\"Nolite mirari hoc, quia venit hora in qua omnes qui in monumentis sunt audient vocem Filii Dei :\"},{\"verse\":29,\"text\":\"et procedent qui bona fecerunt, in resurrectionem vitæ ; qui vero mala egerunt, in resurrectionem judicii.\"},{\"verse\":30,\"text\":\"Non possum ego a meipso facere quidquam. Sicut audio, judico : et judicium meum justum est, quia non quæro voluntatem meam, sed voluntatem ejus qui misit me.\"},{\"verse\":31,\"text\":\"Si ego testimonium perhibeo de meipso, testimonium meum non est verum.\"},{\"verse\":32,\"text\":\"Alius est qui testimonium perhibet de me : et scio quia verum est testimonium, quod perhibet de me.\"},{\"verse\":33,\"text\":\"Vos misistis ad Joannem, et testimonium perhibuit veritati.\"},{\"verse\":34,\"text\":\"Ego autem non ab homine testimonium accipio : sed hæc dico ut vos salvi sitis.\"},{\"verse\":35,\"text\":\"Ille erat lucerna ardens et lucens : vos autem voluistis ad horam exsultare in luce ejus.\"},{\"verse\":36,\"text\":\"Ego autem habeo testimonium majus Joanne. Opera enim quæ dedit mihi Pater ut perficiam ea : ipsa opera, quæ ego facio, testimonium perhibent de me, quia Pater misit me :\"},{\"verse\":37,\"text\":\"et qui misit me Pater, ipse testimonium perhibuit de me : neque vocem ejus umquam audistis, neque speciem ejus vidistis :\"},{\"verse\":38,\"text\":\"et verbum ejus non habetis in vobis manens : quia quem misit ille, huic vos non creditis.\"},{\"verse\":39,\"text\":\"Scrutamini Scripturas, quia vos putatis in ipsis vitam æternam habere : et illæ sunt quæ testimonium perhibent de me :\"},{\"verse\":40,\"text\":\"et non vultis venire ad me ut vitam habeatis.\"},{\"verse\":41,\"text\":\"Claritatem ab hominibus non accipio.\"},{\"verse\":42,\"text\":\"Sed cognovi vos, quia dilectionem Dei non habetis in vobis.\"},{\"verse\":43,\"text\":\"Ego veni in nomine Patris mei, et non accipitis me ; si alius venerit in nomine suo, illum accipietis.\"},{\"verse\":44,\"text\":\"Quomodo vos potestis credere, qui gloriam ab invicem accipitis, et gloriam quæ a solo Deo est, non quæritis ?\"},{\"verse\":45,\"text\":\"Nolite putare quia ego accusaturus sim vos apud Patrem : est qui accusat vos Moyses, in quo vos speratis.\"},{\"verse\":46,\"text\":\"Si enim crederetis Moysi, crederetis forsitan et mihi : de me enim ille scripsit.\"},{\"verse\":47,\"text\":\"Si autem illius litteris non creditis, quomodo verbis meis credetis ?\"}],\"summary\":\"Christ heals on the sabbath the man languishing thirty-eight years. His discourse upon this occasion.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":4,\"label\":\"John 4\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":6,\"label\":\"John 6\"}}]]\n"])</script></body></html>
