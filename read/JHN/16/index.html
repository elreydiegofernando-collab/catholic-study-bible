 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">John<!-- --> <span class="text-stone-500">16</span></h1><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The conclusion of Christ’s last discourse to his disciples.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>These things have I spoken to you, that you may not be scandalized.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>They will put you out of the synagogues: yea, the hour cometh, that whosoever killeth you will think that he doth a service to God.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>And these things will they do to you; because they have not known the Father nor me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But these things I have told you, that when the hour shall come, you may remember that I told you of them.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But I told you not these things from the beginning, because I was with you. And now I go to him that sent me, and none of you asketh me: Whither goest thou?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>But because I have spoken these things to you, sorrow hath filled your heart.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But I tell you the truth: it is expedient to you that I go. For if I go not, the Paraclete will not come to you: but if I go, I will send him to you.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And when he is come, he will convince the world of sin and of justice and of judgment.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Of sin: because they believed not in me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And of justice: because I go to the Father: and you shall see me no longer.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And of judgment: because the prince of this world is already judged.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>I have yet many things to say to you: but you cannot bear them now.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But when he, the Spirit of truth, is come, he will teach you all truth. For he shall not speak of himself: but what things soever he shall hear, he shall speak. And the things that are to come, he shall shew you.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>He shall glorify me: because he shall receive of mine and shall shew it to you.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>All things whatsoever the Father hath are mine. Therefore I said that he shall receive of me and shew it to you.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>A little while, and now you shall not see me: and again a little while, and you shall see me: because I go to the Father.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Then some of his disciples said one to another: What is this that he saith to us: A little while, and you shall not see me: and again a little while, and you shall see me, and, Because I go to the Father?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They said therefore: What is this that he saith, A little while? We know not what he speaketh.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And Jesus knew that they had a mind to ask him. And he said to them: Of this do you inquire among yourselves, because I said: A little while, and you shall not see me; and again a little while, and you shall see me?</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Amen, amen, I say to you, that you shall lament and weep, but the world shall rejoice: and you shall be made sorrowful, but your sorrow shall be turned into joy.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>A woman, when she is in labour, hath sorrow, because her hour is come; but when she hath brought forth the child, she remembereth no more the anguish, for joy that a man is born into the world.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>So also you now indeed have sorrow: but I will see you again and your heart shall rejoice. And your joy no man shall take from you.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And in that day you shall not ask me any thing. Amen, amen, I say to you: if you ask the Father any thing in my name, he will give it you.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Hitherto, you have not asked any thing in my name. Ask, and you shall receive; that your joy may be full.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>These things I have spoken to you in proverbs. The hour cometh when I will no longer speak to you in proverbs, but will shew you plainly of the Father.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>In that day, you shall ask in my name: and I say not to you that I will ask the Father for you.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>For the Father himself loveth you, because you have loved me and have believed that I came out from God.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>I came forth from the Father and am come into the world: again I leave the world and I go to the Father.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>His disciples say to him: Behold, now thou speakest plainly and speakest no proverb.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Now we know that thou knowest all things and thou needest not that any man should ask thee. By this we believe that thou camest forth from God.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Jesus answered them: Do you now believe?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Behold, the hour cometh, and it is now come, that you shall be scattered every man to his own and shall leave me alone. And yet I am not alone, because the Father is with me.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>These things I have spoken to you, that in me you may have peace. In the world you shall have distress. But have confidence. I have overcome the world.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hæc locutus sum vobis, ut non scandalizemini.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Absque synagogis facient vos : sed venit hora, ut omnis qui interficit vos arbitretur obsequium se præstare Deo.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et hæc facient vobis, quia non noverunt Patrem, neque me.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sed hæc locutus sum vobis, ut cum venerit hora eorum, reminiscamini quia ego dixi vobis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Hæc autem vobis ab initio non dixi, quia vobiscum eram. Et nunc vado ad eum qui misit me ; et nemo ex vobis interrogat me : Quo vadis ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>sed quia hæc locutus sum vobis, tristitia implevit cor vestrum.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Sed ego veritatem dico vobis : expedit vobis ut ego vadam : si enim non abiero, Paraclitus non veniet ad vos ; si autem abiero, mittam eum ad vos.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et cum venerit ille, arguet mundum de peccato, et de justitia, et de judicio.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>De peccato quidem, quia non crediderunt in me.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>De justitia vero, quia ad Patrem vado, et jam non videbitis me.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>De judicio autem, quia princeps hujus mundi jam judicatus est.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Adhuc multa habeo vobis dicere, sed non potestis portare modo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Cum autem venerit ille Spiritus veritatis, docebit vos omnem veritatem : non enim loquetur a semetipso, sed quæcumque audiet loquetur, et quæ ventura sunt annuntiabit vobis.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ille me clarificabit, quia de meo accipiet, et annuntiabit vobis.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Omnia quæcumque habet Pater, mea sunt. Propterea dixi : quia de meo accipiet, et annuntiabit vobis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Modicum, et jam non videbitis me ; et iterum modicum, et videbitis me : quia vado ad Patrem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixerunt ergo ex discipulis ejus ad invicem : Quid est hoc quod dicit nobis : Modicum, et non videbitis me ; et iterum modicum, et videbitis me, et quia vado ad Patrem ?</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Dicebant ergo : Quid est hoc quod dicit : Modicum ? nescimus quid loquitur.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Cognovit autem Jesus, quia volebant eum interrogare, et dixit eis : De hoc quæritis inter vos quia dixi : Modicum, et non videbitis me ; et iterum modicum, et videbitis me.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Amen, amen dico vobis : quia plorabitis, et flebitis vos, mundus autem gaudebit ; vos autem contristabimini, sed tristitia vestra vertetur in gaudium.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Mulier cum parit, tristitiam habet, quia venit hora ejus ; cum autem pepererit puerum, jam non meminit pressuræ propter gaudium, quia natus est homo in mundum.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et vos igitur nunc quidem tristitiam habetis, iterum autem videbo vos, et gaudebit cor vestrum : et gaudium vestrum nemo tollet a vobis.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et in illo die me non rogabitis quidquam. Amen, amen dico vobis : si quid petieritis Patrem in nomine meo, dabit vobis.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Usque modo non petistis quidquam in nomine meo : petite, et accipietis, ut gaudium vestrum sit plenum.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Hæc in proverbiis locutus sum vobis. Venit hora cum jam non in proverbiis loquar vobis, sed palam de Patre annuntiabo vobis :</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>in illo die in nomine meo petetis : et non dico vobis quia ego rogabo Patrem de vobis :</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>ipse enim Pater amat vos, quia vos me amastis, et credidistis, quia ego a Deo exivi.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Exivi a Patre, et veni in mundum : iterum relinquo mundum, et vado ad Patrem.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Dicunt ei discipuli ejus : Ecce nunc palam loqueris, et proverbium nullum dicis :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>nunc scimus quia scis omnia, et non opus est tibi ut quis te interroget : in hoc credimus quia a Deo existi.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Respondit eis Jesus : Modo creditis ?</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>ecce venit hora, et jam venit, ut dispergamini unusquisque in propria, et me solum relinquatis : et non sum solus, quia Pater mecum est.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Hæc locutus sum vobis, ut in me pacem habeatis. In mundo pressuram habebitis : sed confidite, ego vici mundum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/JHN/15/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">John 15</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-30 ink\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L16\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"17:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/0__pfdgtkk80m.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L17\",\"JHN.16\",{\"bookId\":50,\"usfm\":\"JHN\",\"bookName\":\"John\",\"drName\":\"John\",\"chapter\":16,\"totalChapters\":21,\"dra\":[{\"verse\":1,\"text\":\"These things have I spoken to you, that you may not be scandalized.\"},{\"verse\":2,\"text\":\"They will put you out of the synagogues: yea, the hour cometh, that whosoever killeth you will think that he doth a service to God.\"},{\"verse\":3,\"text\":\"And these things will they do to you; because they have not known the Father nor me.\"},{\"verse\":4,\"text\":\"But these things I have told you, that when the hour shall come, you may remember that I told you of them.\"},{\"verse\":5,\"text\":\"But I told you not these things from the beginning, because I was with you. And now I go to him that sent me, and none of you asketh me: Whither goest thou?\"},{\"verse\":6,\"text\":\"But because I have spoken these things to you, sorrow hath filled your heart.\"},{\"verse\":7,\"text\":\"But I tell you the truth: it is expedient to you that I go. For if I go not, the Paraclete will not come to you: but if I go, I will send him to you.\"},{\"verse\":8,\"text\":\"And when he is come, he will convince the world of sin and of justice and of judgment.\"},{\"verse\":9,\"text\":\"Of sin: because they believed not in me.\"},{\"verse\":10,\"text\":\"And of justice: because I go to the Father: and you shall see me no longer.\"},{\"verse\":11,\"text\":\"And of judgment: because the prince of this world is already judged.\"},{\"verse\":12,\"text\":\"I have yet many things to say to you: but you cannot bear them now.\"},{\"verse\":13,\"text\":\"But when he, the Spirit of truth, is come, he will teach you all truth. For he shall not speak of himself: but what things soever he shall hear, he shall speak. And the things that are to come, he shall shew you.\"},{\"verse\":14,\"text\":\"He shall glorify me: because he shall receive of mine and shall shew it to you.\"},{\"verse\":15,\"text\":\"All things whatsoever the Father hath are mine. Therefore I said that he shall receive of me and shew it to you.\"},{\"verse\":16,\"text\":\"A little while, and now you shall not see me: and again a little while, and you shall see me: because I go to the Father.\"},{\"verse\":17,\"text\":\"Then some of his disciples said one to another: What is this that he saith to us: A little while, and you shall not see me: and again a little while, and you shall see me, and, Because I go to the Father?\"},{\"verse\":18,\"text\":\"They said therefore: What is this that he saith, A little while? We know not what he speaketh.\"},{\"verse\":19,\"text\":\"And Jesus knew that they had a mind to ask him. And he said to them: Of this do you inquire among yourselves, because I said: A little while, and you shall not see me; and again a little while, and you shall see me?\"},{\"verse\":20,\"text\":\"Amen, amen, I say to you, that you shall lament and weep, but the world shall rejoice: and you shall be made sorrowful, but your sorrow shall be turned into joy.\"},{\"verse\":21,\"text\":\"A woman, when she is in labour, hath sorrow, because her hour is come; but when she hath brought forth the child, she remembereth no more the anguish, for joy that a man is born into the world.\"},{\"verse\":22,\"text\":\"So also you now indeed have sorrow: but I will see you again and your heart shall rejoice. And your joy no man shall take from you.\"},{\"verse\":23,\"text\":\"And in that day you shall not ask me any thing. Amen, amen, I say to you: if you ask the Father any thing in my name, he will give it you.\"},{\"verse\":24,\"text\":\"Hitherto, you have not asked any thing in my name. Ask, and you shall receive; that your joy may be full.\"},{\"verse\":25,\"text\":\"These things I have spoken to you in proverbs. The hour cometh when I will no longer speak to you in proverbs, but will shew you plainly of the Father.\"},{\"verse\":26,\"text\":\"In that day, you shall ask in my name: and I say not to you that I will ask the Father for you.\"},{\"verse\":27,\"text\":\"For the Father himself loveth you, because you have loved me and have believed that I came out from God.\"},{\"verse\":28,\"text\":\"I came forth from the Father and am come into the world: again I leave the world and I go to the Father.\"},{\"verse\":29,\"text\":\"His disciples say to him: Behold, now thou speakest plainly and speakest no proverb.\"},{\"verse\":30,\"text\":\"Now we know that thou knowest all things and thou needest not that any man should ask thee. By this we believe that thou camest forth from God.\"},{\"verse\":31,\"text\":\"Jesus answered them: Do you now believe?\"},{\"verse\":32,\"text\":\"Behold, the hour cometh, and it is now come, that you shall be scattered every man to his own and shall leave me alone. And yet I am not alone, because the Father is with me.\"},{\"verse\":33,\"text\":\"These things I have spoken to you, that in me you may have peace. In the world you shall have distress. But have confidence. I have overcome the world.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hæc locutus sum vobis, ut non scandalizemini.\"},{\"verse\":2,\"text\":\"Absque synagogis facient vos : sed venit hora, ut omnis qui interficit vos arbitretur obsequium se præstare Deo.\"},{\"verse\":3,\"text\":\"Et hæc facient vobis, quia non noverunt Patrem, neque me.\"},{\"verse\":4,\"text\":\"Sed hæc locutus sum vobis, ut cum venerit hora eorum, reminiscamini quia ego dixi vobis.\"},{\"verse\":5,\"text\":\"Hæc autem vobis ab initio non dixi, quia vobiscum eram. Et nunc vado ad eum qui misit me ; et nemo ex vobis interrogat me : Quo vadis ?\"},{\"verse\":6,\"text\":\"sed quia hæc locutus sum vobis, tristitia implevit cor vestrum.\"},{\"verse\":7,\"text\":\"Sed ego veritatem dico vobis : expedit vobis ut ego vadam : si enim non abiero, Paraclitus non veniet ad vos ; si autem abiero, mittam eum ad vos.\"},{\"verse\":8,\"text\":\"Et cum venerit ille, arguet mundum de peccato, et de justitia, et de judicio.\"},{\"verse\":9,\"text\":\"De peccato quidem, quia non crediderunt in me.\"},{\"verse\":10,\"text\":\"De justitia vero, quia ad Patrem vado, et jam non videbitis me.\"},{\"verse\":11,\"text\":\"De judicio autem, quia princeps hujus mundi jam judicatus est.\"},{\"verse\":12,\"text\":\"Adhuc multa habeo vobis dicere, sed non potestis portare modo.\"},{\"verse\":13,\"text\":\"Cum autem venerit ille Spiritus veritatis, docebit vos omnem veritatem : non enim loquetur a semetipso, sed quæcumque audiet loquetur, et quæ ventura sunt annuntiabit vobis.\"},{\"verse\":14,\"text\":\"Ille me clarificabit, quia de meo accipiet, et annuntiabit vobis.\"},{\"verse\":15,\"text\":\"Omnia quæcumque habet Pater, mea sunt. Propterea dixi : quia de meo accipiet, et annuntiabit vobis.\"},{\"verse\":16,\"text\":\"Modicum, et jam non videbitis me ; et iterum modicum, et videbitis me : quia vado ad Patrem.\"},{\"verse\":17,\"text\":\"Dixerunt ergo ex discipulis ejus ad invicem : Quid est hoc quod dicit nobis : Modicum, et non videbitis me ; et iterum modicum, et videbitis me, et quia vado ad Patrem ?\"},{\"verse\":18,\"text\":\"Dicebant ergo : Quid est hoc quod dicit : Modicum ? nescimus quid loquitur.\"},{\"verse\":19,\"text\":\"Cognovit autem Jesus, quia volebant eum interrogare, et dixit eis : De hoc quæritis inter vos quia dixi : Modicum, et non videbitis me ; et iterum modicum, et videbitis me.\"},{\"verse\":20,\"text\":\"Amen, amen dico vobis : quia plorabitis, et flebitis vos, mundus autem gaudebit ; vos autem contristabimini, sed tristitia vestra vertetur in gaudium.\"},{\"verse\":21,\"text\":\"Mulier cum parit, tristitiam habet, quia venit hora ejus ; cum autem pepererit puerum, jam non meminit pressuræ propter gaudium, quia natus est homo in mundum.\"},{\"verse\":22,\"text\":\"Et vos igitur nunc quidem tristitiam habetis, iterum autem videbo vos, et gaudebit cor vestrum : et gaudium vestrum nemo tollet a vobis.\"},{\"verse\":23,\"text\":\"Et in illo die me non rogabitis quidquam. Amen, amen dico vobis : si quid petieritis Patrem in nomine meo, dabit vobis.\"},{\"verse\":24,\"text\":\"Usque modo non petistis quidquam in nomine meo : petite, et accipietis, ut gaudium vestrum sit plenum.\"},{\"verse\":25,\"text\":\"Hæc in proverbiis locutus sum vobis. Venit hora cum jam non in proverbiis loquar vobis, sed palam de Patre annuntiabo vobis :\"},{\"verse\":26,\"text\":\"in illo die in nomine meo petetis : et non dico vobis quia ego rogabo Patrem de vobis :\"},{\"verse\":27,\"text\":\"ipse enim Pater amat vos, quia vos me amastis, et credidistis, quia ego a Deo exivi.\"},{\"verse\":28,\"text\":\"Exivi a Patre, et veni in mundum : iterum relinquo mundum, et vado ad Patrem.\"},{\"verse\":29,\"text\":\"Dicunt ei discipuli ejus : Ecce nunc palam loqueris, et proverbium nullum dicis :\"},{\"verse\":30,\"text\":\"nunc scimus quia scis omnia, et non opus est tibi ut quis te interroget : in hoc credimus quia a Deo existi.\"},{\"verse\":31,\"text\":\"Respondit eis Jesus : Modo creditis ?\"},{\"verse\":32,\"text\":\"ecce venit hora, et jam venit, ut dispergamini unusquisque in propria, et me solum relinquatis : et non sum solus, quia Pater mecum est.\"},{\"verse\":33,\"text\":\"Hæc locutus sum vobis, ut in me pacem habeatis. In mundo pressuram habebitis : sed confidite, ego vici mundum.\"}],\"summary\":\"The conclusion of Christ’s last discourse to his disciples.\",\"intro\":null,\"prev\":{\"usfm\":\"JHN\",\"chapter\":15,\"label\":\"John 15\"},\"next\":{\"usfm\":\"JHN\",\"chapter\":17,\"label\":\"John 17\"}}]]\n"])</script></body></html>
