875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then Tobias called to him his son and said to him: What can we give to this holy man, that is come with thee?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Tobias answering, said to his father: Father, what wages shall we give him? or what can be worthy of his benefits?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>He conducted me and brought me safe again, he received the money of Gabelus, he caused me to have my wife, and he chased from her the evil spirit, he gave joy to her parents, myself he delivered from being devoured by the fish, thee also he hath made to see the light of heaven, and we are filled with all good things through him. What can we give him sufficient for these things?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But I beseech thee, my father, to desire him, that he would vouchsafe to accept of one half of all things that have been brought.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>So the father and the son calling him, took him aside: and began to desire him that he would vouchsafe to accept of half of all things that they had brought,</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Then he said to them secretly, Bless ye the God of heaven, give glory to him in the sight of all that live, because he hath shewn his mercy to you.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For it is good to hide the secret of a king: but honourable to reveal and confess the works of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Prayer is good with fasting and alms more than to lay up treasures of gold.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For alms delivereth from death, and the same is that which purgeth away sins, and maketh to find mercy and life everlasting.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>But they that commit sin and iniquity, are enemies to their own soul.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>I discover then the truth unto you, and I will not hide the secret from you.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>When thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and hide the dead by day in thy house, and bury them by night, I offered thy prayer to the Lord.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And because thou wast acceptable to God, it was necessary that temptation should prove thee.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And now the Lord hath sent me to heal thee, and to deliver Sara thy son’s wife from the devil.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>For I am the angel Raphael, one of the seven, who stand before the Lord.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And when they had heard these things, they were troubled, and being seized with fear they fell upon the ground on their face.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And the angel said to them: Peace be to you, fear not.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For when I was with you, I was there by the will of God: bless ye him, and sing praises to him.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>I seemed indeed to eat and to drink with you but I use an invisible meat and drink, which cannot be seen by men.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>It is time therefore that I return to him that sent me: but bless ye God, and publish all his wonderful works.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And when he had said these things, he was taken from their sight, and they could see him no more.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Then they lying prostrate for three hours upon their face, blessed God, and rising up, they told all his wonderful works.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc vocavit ad se Tobias filium suum, dixitque ei : Quid possumus dare viro isti sancto, qui venit tecum ?</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Respondens Tobias, dixit patri suo : Pater, quam mercedem dabimus ei ? aut quid dignum poterit esse beneficiis ejus ?</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Me duxit et reduxit sanum, pecuniam a Gabelo ipse recepit, uxorem ipse me habere fecit, et dæmonium ab ea ipse compescuit : gaudium parentibus ejus fecit, meipsum a devoratione piscis eripuit, te quoque videre fecit lumen cæli, et bonis omnibus per eum repleti sumus. Quid illi ad hæc poterimus dignum dare ?</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Sed peto te, pater mi, ut roges eum, si forte dignabitur medietatem de omnibus quæ allata sunt, sibi assumere.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Et vocantes eum, pater scilicet et filius, tulerunt eum in partem : et rogare cœperunt ut dignaretur dimidiam partem omnium quæ attulerant acceptam habere.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Tunc dixit eis occulte : Benedicite Deum cæli, et coram omnibus viventibus confitemini ei, quia fecit vobiscum misericordiam suam.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Etenim sacramentum regis abscondere bonum est : opera autem Dei revelare et confiteri honorificum est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Bona est oratio cum jejunio, et eleemosyna magis quam thesauros auri recondere :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>quoniam eleemosyna a morte liberat, et ipsa est quæ purgat peccata, et facit invenire misericordiam et viam æternam.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui autem faciunt peccatum et iniquitatem, hostes sunt animæ suæ.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Manifesto ergo vobis veritatem, et non abscondam a vobis occultum sermonem.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Quando orabas cum lacrimis, et sepeliebas mortuos, et derelinquebas prandium tuum, et mortuos abscondebas per diem in domo tua, et nocte sepeliebas eos, ego obtuli orationem tuam Domino.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Et quia acceptus eras Deo, necesse fuit ut tentatio probaret te.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Et nunc misit me Dominus ut curarem te, et Saram uxorem filii tui a dæmonio liberarem.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Ego enim sum Raphaël angelus, unus ex septem qui adstamus ante Dominum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Cumque hæc audissent, turbati sunt, et trementes ceciderunt super terram in faciem suam.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Dixitque eis angelus : Pax vobis : nolite timere.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Etenim cum essem vobiscum, per voluntatem Dei eram : ipsum benedicite, et cantate illi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Videbar quidem vobiscum manducare et bibere : sed ego cibo invisibili, et potu qui ab hominibus videri non potest, utor.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Tempus est ergo ut revertar ad eum qui me misit : vos autem benedicite Deum, et narrate omnia mirabilia ejus.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et cum hæc dixisset, ab aspectu eorum ablatus est, et ultra eum videre non potuerunt.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Tunc prostrati per horas tres in faciem, benedixerunt Deum : et exsurgentes narraverunt omnia mirabilia ejus.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/TOB/11/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Tobit 11</span></span></a><a class="flex min-h-14 items-center chased from her the evil spirit, he gave joy to her parents, myself he delivered from being devoured by the fish, thee also he hath made to see the light of heaven, and we are filled with all good things through him. What can we give him sufficient for these things?\"},{\"verse\":4,\"text\":\"But I beseech thee, my father, to desire him, that he would vouchsafe to accept of one half of all things that have been brought.\"},{\"verse\":5,\"text\":\"So the father and the son calling him, took him aside: and began to desire him that he would vouchsafe to accept of half of all things that they had brought,\"},{\"verse\":6,\"text\":\"Then he said to them secretly, Bless ye the God of heaven, give glory to him in the sight of all that live, because he hath shewn his mercy to you.\"},{\"verse\":7,\"text\":\"For it is good to hide the secret of a king: but honourable to reveal and confess the works of God.\"},{\"verse\":8,\"text\":\"Prayer is good with fasting and alms more than to lay up treasures of gold.\"},{\"verse\":9,\"text\":\"For alms delivereth from death, and the same is that which purgeth away sins, and maketh to find mercy and life everlasting.\"},{\"verse\":10,\"text\":\"But they that commit sin and iniquity, are enemies to their own soul.\"},{\"verse\":11,\"text\":\"I discover then the truth unto you, and I will not hide the secret from you.\"},{\"verse\":12,\"text\":\"When thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and hide the dead by day in thy house, and bury them by night, I offered thy prayer to the Lord.\"},{\"verse\":13,\"text\":\"And because thou wast acceptable to God, it was necessary that temptation should prove thee.\"},{\"verse\":14,\"text\":\"And now the Lord hath sent me to heal thee, and to deliver Sara thy son’s wife from the devil.\"},{\"verse\":15,\"text\":\"For I am the angel Raphael, one of the seven, who stand before the Lord.\"},{\"verse\":16,\"text\":\"And when they had heard these things, they were troubled, and being seized with fear they fell upon the ground on their face.\"},{\"verse\":17,\"text\":\"And the angel said to them: Peace be to you, fear not.\"},{\"verse\":18,\"text\":\"For when I was with you, I was there by the will of God: bless ye him, and sing praises to him.\"},{\"verse\":19,\"text\":\"I seemed indeed to eat and to drink with you but I use an invisible meat and drink, which cannot be seen by men.\"},{\"verse\":20,\"text\":\"It is time therefore that I return to him that sent me: but bless ye God, and publish all his wonderful works.\"},{\"verse\":21,\"text\":\"And when he had said these things, he was taken from their sight, and they could see him no more.\"},{\"verse\":22,\"text\":\"Then they lying prostrate for three hours upon their face, blessed God, and rising up, they told all his wonderful works.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc vocavit ad se Tobias filium suum, dixitque ei : Quid possumus dare viro isti sancto, qui venit tecum ?\"},{\"verse\":2,\"text\":\"Respondens Tobias, dixit patri suo : Pater, quam mercedem dabimus ei ? aut quid dignum poterit esse beneficiis ejus ?\"},{\"verse\":3,\"text\":\"Me duxit et reduxit sanum, pecuniam a Gabelo ipse recepit, uxorem ipse me habere fecit, et dæmonium ab ea ipse compescuit : gaudium parentibus ejus fecit, meipsum a devoratione piscis eripuit, te quoque videre fecit lumen cæli, et bonis omnibus per eum repleti sumus. Quid illi ad hæc poterimus dignum dare ?\"},{\"verse\":4,\"text\":\"Sed peto te, pater mi, ut roges eum, si forte dignabitur medietatem de omnibus quæ allata sunt, sibi assumere.\"},{\"verse\":5,\"text\":\"Et vocantes eum, pater scilicet et filius, tulerunt eum in partem : et rogare cœperunt ut dignaretur dimidiam partem omnium quæ attulerant acceptam habere.\"},{\"verse\":6,\"text\":\"Tunc dixit eis occulte : Benedicite Deum cæli, et coram omnibus viventibus confitemini ei, quia fecit vobiscum misericordiam suam.\"},{\"verse\":7,\"text\":\"Etenim sacramentum regis abscondere bonum est : opera autem Dei revelare et confiteri honorificum est.\"},{\"verse\":8,\"text\":\"Bona est oratio cum jejunio, et eleemosyna magis quam thesauros auri recondere :\"},{\"verse\":9,\"text\":\"quoniam eleemosyna a morte liberat, et ipsa est quæ purgat peccata, et facit invenire misericordiam et viam æternam.\"},{\"verse\":10,\"text\":\"Qui autem faciunt peccatum et iniquitatem, hostes sunt animæ suæ.\"},{\"verse\":11,\"text\":\"Manifesto ergo vobis veritatem, et non abscondam a vobis occultum sermonem.\"},{\"verse\":12,\"text\":\"Quando orabas cum lacrimis, et sepeliebas mortuos, et derelinquebas prandium tuum, et mortuos abscondebas per diem in domo tua, et nocte sepeliebas eos, ego obtuli orationem tuam Domino.\"},{\"verse\":13,\"text\":\"Et quia acceptus eras Deo, necesse fuit ut tentatio probaret te.\"},{\"verse\":14,\"text\":\"Et nunc misit me Dominus ut curarem te, et Saram uxorem filii tui a dæmonio liberarem.\"},{\"verse\":15,\"text\":\"Ego enim sum Raphaël angelus, unus ex septem qui adstamus ante Dominum.\"},{\"verse\":16,\"text\":\"Cumque hæc audissent, turbati sunt, et trementes ceciderunt super terram in faciem suam.\"},{\"verse\":17,\"text\":\"Dixitque eis angelus : Pax vobis : nolite timere.\"},{\"verse\":18,\"text\":\"Etenim cum essem vobiscum, per voluntatem Dei eram : ipsum benedicite, et cantate illi.\"},{\"verse\":19,\"text\":\"Videbar quidem vobiscum manducare et bibere : sed ego cibo invisibili, et potu qui ab hominibus videri non potest, utor.\"},{\"verse\":20,\"text\":\"Tempus est ergo ut revertar ad eum qui me misit : vos autem benedicite Deum, et narrate omnia mirabilia ejus.\"},{\"verse\":21,\"text\":\"Et cum hæc dixisset, ab aspectu eorum ablatus est, et ultra eum videre non potuerunt.\"},{\"verse\":22,\"text\":\"Tunc prostrati per horas tres in faciem, benedixerunt Deum : et exsurgentes narraverunt omnia mirabilia ejus.\"}],\"summary\":\"Raphael maketh himself known.\",\"intro\":null,\"prev\":{\"usfm\":\"TOB\",\"chapter\":11,\"label\":\"Tobit 11\"},\"next\":{\"usfm\":\"TOB\",\"chapter\":13,\"label\":\"Tobit 13\"}}]]\n"])</script></body></html>
